<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal da Empresa | Retorno Seguros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --brand:#0088aa; --brand-dark:#006b87; --brand-light:#00b8d4; --brand-50:#e6f6fa;
  --ok:#16a34a; --ok-bg:#dcfce7; --warn:#d97706; --warn-bg:#fef3c7;
  --danger:#dc2626; --danger-bg:#fee2e2; --info:#2563eb; --info-bg:#dbeafe;
  --purple:#7c3aed; --purple-bg:#ede9fe; --orange:#ea580c; --orange-bg:#ffedd5;
  --bg:#f4f7fb; --surface:#fff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --text:#0f1e2e; --text-2:#5b6b7c; --text-3:#93a1b0;
  --border:#e4eaf1; --border-2:#d7dfe8;
  --shadow-sm:0 1px 2px rgba(16,32,48,.06);
  --shadow:0 4px 16px rgba(16,32,48,.08);
  --shadow-lg:0 12px 32px rgba(16,32,48,.14);
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
/* ---------- LOGIN ---------- */
.login-wrap{position:fixed;inset:0;background:linear-gradient(150deg,#f4f7fb 0%,#e6f6fa 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999;overflow:auto}
.login-wrap.hidden{display:none}
.login-box{background:var(--surface);border-radius:22px;padding:38px 34px;width:100%;max-width:430px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem;margin:0 auto 18px}
.login-box h1{font-size:1.35rem;font-weight:800;text-align:center;letter-spacing:-.02em}
.login-box .sub{text-align:center;color:var(--text-2);font-size:.9rem;margin:6px 0 26px}
.login-box label{display:block;font-size:.78rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.login-box input{width:100%;padding:13px 15px;border:1.5px solid var(--border-2);border-radius:12px;background:var(--surface-2);font-family:inherit;font-size:.98rem;color:var(--text);margin-bottom:14px;transition:.15s}
.login-box input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-50)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,136,170,.32)}
.login-btn:disabled{opacity:.6;cursor:wait;transform:none}
.login-err{background:var(--danger-bg);color:var(--danger);padding:11px 14px;border-radius:10px;margin-top:14px;font-size:.85rem;display:none;font-weight:500}
.login-hint{margin-top:20px;font-size:.78rem;color:var(--text-3);text-align:center;line-height:1.6}
/* ---------- APP ---------- */
.app{display:none}
.app.on{display:block}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:64px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em}
.brand .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:flex;align-items:center;justify-content:center;color:#fff}
.brand small{display:block;font-size:.7rem;font-weight:500;color:var(--text-3);letter-spacing:0}
.topbar .spacer{flex:1}
.emp-chip{text-align:right;line-height:1.25}
.emp-chip b{font-size:.9rem;display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp-chip span{font-size:.74rem;color:var(--text-3)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;transition:.15s}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.tabsbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:64px;z-index:55}
.tabsbar::-webkit-scrollbar{height:0}
.tb{padding:13px 16px;background:none;border:none;border-bottom:3px solid transparent;color:var(--text-2);font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.15s}
.tb:hover{color:var(--text)}
.tb.on{color:var(--brand);border-bottom-color:var(--brand)}
.tb .pill{background:var(--danger);color:#fff;font-size:.68rem;padding:1px 7px;border-radius:20px;font-weight:700}
.wrap{max-width:1320px;margin:0 auto;padding:24px}
.pane{display:none}
.pane.on{display:block}
h2.page{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
p.page-sub{color:var(--text-2);font-size:.88rem;margin-bottom:20px}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:9px}
.card-head h3 i{color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;margin-bottom:12px}
.kpi .val{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .lbl{font-size:.8rem;color:var(--text-2);margin-top:5px;font-weight:500}
.kpi .foot{font-size:.72rem;color:var(--text-3);margin-top:8px}
/* buttons */
.btn{padding:9px 16px;border-radius:10px;border:1px solid transparent;font-family:inherit;font-weight:600;font-size:.87rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-success{background:var(--ok);color:#fff}
.btn-success:hover{filter:brightness(.93)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.93)}
.btn-ghost{background:var(--surface);border-color:var(--border-2);color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-sm{padding:7px 12px;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
/* filtros */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:.72rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.fg select,.fg input{padding:9px 12px;border:1px solid var(--border-2);border-radius:9px;background:var(--surface);font-family:inherit;font-size:.87rem;color:var(--text);min-width:150px}
.fg select:focus,.fg input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.fg.grow{flex:1;min-width:200px}
.fg.grow input{width:100%}
/* tabela */
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{text-align:left;padding:10px 12px;font-size:.72rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* badges */
.bdg{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.bdg.saude{background:var(--danger-bg);color:var(--danger)}
.bdg.dental{background:var(--info-bg);color:var(--info)}
.bdg.vida{background:var(--ok-bg);color:var(--ok)}
.bdg.previdencia{background:var(--orange-bg);color:var(--orange)}
.bdg.titular{background:var(--purple-bg);color:var(--purple)}
.bdg.dependente{background:var(--warn-bg);color:var(--warn)}
.bdg.pendente{background:var(--warn-bg);color:var(--warn)}
.bdg.aprovado{background:var(--ok-bg);color:var(--ok)}
.bdg.rejeitado{background:var(--danger-bg);color:var(--danger)}
.bdg.inclusao{background:var(--ok-bg);color:var(--ok)}
.bdg.exclusao{background:var(--danger-bg);color:var(--danger)}
.bdg.neutro{background:var(--surface-3);color:var(--text-2)}
.prods{display:flex;gap:4px;flex-wrap:wrap}
/* modal */
.mroot{position:fixed;inset:0;background:rgba(9,20,32,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:1000;overflow-y:auto}
.mroot.open{display:flex}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:620px;box-shadow:var(--shadow-lg);margin:auto}
.modal.wide{max-width:900px}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h3{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:10px}
.modal-close{background:none;border:none;font-size:1.6rem;line-height:1;color:var(--text-3);cursor:pointer}
.modal-close:hover{color:var(--text)}
.modal-body{padding:22px 24px;max-height:calc(100vh - 230px);overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
/* form */
.frow{margin-bottom:15px}
.frow label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px 13px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface-2);font-family:inherit;font-size:.92rem;color:var(--text)}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-50)}
.frow .hint{font-size:.75rem;color:var(--text-3);margin-top:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.f2{grid-template-columns:1fr}}
/* seletor de produtos */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.prod-opt input{display:none}
.prod-opt label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:2px solid var(--border-2);border-radius:13px;cursor:pointer;transition:.15s;font-size:.85rem;font-weight:600;background:var(--surface-2);text-align:center}
.prod-opt label i{font-size:1.35rem}
.prod-opt label small{font-weight:500;color:var(--text-3);font-size:.72rem}
.prod-opt input:checked+label{border-color:var(--brand);background:var(--brand-50)}
.prod-opt input:disabled+label{opacity:.4;cursor:not-allowed}
.prod-opt.saude label i{color:var(--danger)}
.prod-opt.dental label i{color:var(--info)}
.prod-opt.vida label i{color:var(--ok)}
.prod-opt.previdencia label i{color:var(--orange)}
/* boxes */
.note{border-radius:12px;padding:13px 16px;margin-bottom:16px;display:flex;gap:11px;align-items:flex-start;font-size:.86rem;line-height:1.55}
.note i{margin-top:2px}
.note.info{background:var(--info-bg);color:#1e40af}
.note.warn{background:var(--warn-bg);color:#92400e}
.note.dang{background:var(--danger-bg);color:#991b1b}
.note.ok{background:var(--ok-bg);color:#14532d}
.empty{text-align:center;padding:44px 20px;color:var(--text-2)}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--text-3);margin:0 auto 14px}
.empty h4{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:5px}
.empty p{font-size:.86rem}
/* toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:2000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;padding:13px 17px;box-shadow:var(--shadow-lg);min-width:270px;max-width:380px;animation:tin .25s ease}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--warn)}
.toast b{display:block;font-size:.87rem;margin-bottom:2px}
.toast span{font-size:.82rem;color:var(--text-2)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
/* titular group (dependentes) */
.tit-group{border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
.tit-head{background:var(--surface-2);padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tit-head .nm{font-weight:700;font-size:.92rem}
.tit-head .cp{font-size:.78rem;color:var(--text-3)}
.tit-head .tot{margin-left:auto;text-align:right}
.tit-head .tot b{display:block;font-size:1.05rem;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.tit-head .tot span{font-size:.72rem;color:var(--text-3)}
.tit-group table{font-size:.84rem}
.tit-group td,.tit-group th{padding:9px 16px}
/* fatura */
.fat-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.ft{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface-2)}
.ft .k{font-size:.75rem;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ft .v{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.ft.brand{background:var(--brand-50);border-color:#b8e4ee}
.ft.brand .v{color:var(--brand-dark)}
.prorata{font-size:.74rem;color:var(--warn);font-weight:600}
/* plano / coberturas */
.cob-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}
.cob{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1px solid var(--border);border-radius:10px;font-size:.86rem;background:var(--surface-2)}
.cob{align-items:flex-start}
.cob i{color:var(--ok);margin-top:3px}
.cob.nao i{color:var(--danger)}
.cob.nao{background:#fff7f7;border-color:#f6dada}
.cob-d{font-size:.78rem;color:var(--text-2);margin-top:3px;line-height:1.45;font-weight:400}
.passo{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--border)}
.passo:last-child{border-bottom:none}
.passo .n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--brand-50);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.passo .tx{font-size:.89rem;line-height:1.6;color:var(--text-2);padding-top:4px}
.plan-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.plan-tab{padding:9px 15px;border-radius:10px;border:1.5px solid var(--border-2);background:var(--surface);font-family:inherit;font-size:.86rem;font-weight:600;color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:7px}
.plan-tab.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand-dark)}
@media(max-width:768px){
  .wrap{padding:16px} .topbar{padding:0 14px} .tbl-wrap{margin:0 -20px;padding:0 20px}
  .emp-chip b{max-width:130px} .kpis{grid-template-columns:repeat(2,1fr)}
}
@media print{ .topbar,.tabsbar,.btn,.filters{display:none!important} }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo"><i class="fas fa-building-shield"></i></div>
    <h1>Portal da Empresa</h1>
    <p class="sub">Gestão de beneficiários · Retorno Seguros</p>
    <label for="inCnpj">CNPJ da empresa</label>
    <input type="text" id="inCnpj" placeholder="00.000.000/0000-00" autocomplete="username">
    <label for="inSenha">Senha</label>
    <input type="password" id="inSenha" placeholder="Sua senha de acesso" autocomplete="current-password">
    <button class="login-btn" id="btnLogin" onclick="fazerLogin()"><i class="fas fa-right-to-bracket"></i> Entrar</button>
    <div class="login-err" id="loginErr"></div>
    <p class="login-hint">Primeiro acesso? A senha inicial são os últimos 6 dígitos do CNPJ.<br>Dúvidas? Fale com a Retorno Seguros.</p>
  </div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="ic"><i class="fas fa-building-shield"></i></div>
      <div>Portal da Empresa<small>Retorno Seguros</small></div></div>
    <div class="spacer"></div>
    <div class="emp-chip"><b id="empNome">Empresa</b><span id="empCnpj">—</span></div>
    <button class="icon-btn" onclick="sair()" title="Sair"><i class="fas fa-right-from-bracket"></i></button>
  </header>
  <nav class="tabsbar" id="tabsbar"></nav>
  <main class="wrap" id="panes"></main>
</div>

<div class="mroot" id="mroot"></div>
<div id="toasts"></div>

<script>
/* =========================================================================
   PORTAL DA EMPRESA — Retorno Seguros
   Gestão de beneficiários, movimentações multi-benefício, fatura com pró-rata
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.firebasestorage.app",
  messagingSenderId: "495712392972",
  appId: "1:495712392972:web:e1e78aedc48bdeea48db29"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;

/* ---------- constantes ---------- */
const PRODUTOS=[
  {k:'saude',      nome:'Saúde',       ic:'fa-heart-pulse', cor:'#dc2626'},
  {k:'dental',     nome:'Dental',      ic:'fa-tooth',       cor:'#2563eb'},
  {k:'vida',       nome:'Vida',        ic:'fa-heart',       cor:'#16a34a'},
  {k:'previdencia',nome:'Previdência', ic:'fa-piggy-bank',  cor:'#ea580c'}
];
const PROD=Object.fromEntries(PRODUTOS.map(p=>[p.k,p]));
const PARENTESCOS={conjuge:'Cônjuge',companheiro:'Companheiro(a)',filho:'Filho(a)',enteado:'Enteado(a)',pai:'Pai',mae:'Mãe',tutelado:'Tutelado(a)',outro:'Outro'};
const MOTIVOS={demissao:'Demissão',pedido_demissao:'Pedido de demissão',aposentadoria:'Aposentadoria',falecimento:'Falecimento',transferencia:'Transferência',opcao_beneficiario:'Opção do beneficiário',fim_dependencia:'Fim da dependência',outro:'Outro'};
const CORRETORA={ nome:'Retorno Seguros', whats:'5554997015000', label:'(54) 99701-5000' };
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ---------- estado ---------- */
let EMP=null, EMP_ID=null;
let BENEF=[], MOVS=[], UNSUB=[];
let TAB='resumo';
let F={ // filtros
  ben:{prod:'',tit:'',busca:'',modo:'',data:'',mes:'',ano:''},
  mov:{tipo:'',status:'',prod:'',busca:'',modo:'',data:'',mes:'',ano:''},
  fat:{mes:(new Date()).getMonth()+1, ano:(new Date()).getFullYear()},
  plano:'saude'
};

/* =========================================================================
   HELPERS
   ========================================================================= */
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soN=s=>(s||'').toString().replace(/\D/g,'');
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const money2=n=>(Number(n)||0).toFixed(2).replace('.',',');
function fmtCNPJ(v){v=soN(v);return v.length===14?v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):(v||'');}
function fmtCPF(v){v=soN(v);return v.length===11?v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4'):(v||'');}
function maskCNPJ(i){let v=soN(i.value).slice(0,14);i.value=v.replace(/^(\d{2})(\d{3})?(\d{3})?(\d{4})?(\d{2})?$/,(m,a,b,c,d,e)=>[a,b&&'.'+b,c&&'.'+c,d&&'/'+d,e&&'-'+e].filter(Boolean).join(''));}
function maskCPF(i){let v=soN(i.value).slice(0,11);i.value=v.replace(/^(\d{3})(\d{3})?(\d{3})?(\d{2})?$/,(m,a,b,c,d)=>[a,b&&'.'+b,c&&'.'+c,d&&'-'+d].filter(Boolean).join(''));}

/* datas — sempre em horário local, sem pulo de fuso */
function d2s(d){ if(!d) return ''; const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function s2d(s){ if(!s) return null; if(s.toDate) s=d2s(s.toDate()); const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function fmtData(v){ const d=s2d(v)|| (v&&v.toDate?v.toDate():null); if(!d) return '—'; return d.toLocaleDateString('pt-BR'); }
function fmtDataHora(v){ const d=v&&v.toDate?v.toDate():s2d(v); if(!d) return '—'; return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
const hoje=()=>d2s(new Date());
function diasNoMes(ano,mes){ return new Date(ano,mes,0).getDate(); }
function idade(nasc){ const d=s2d(nasc); if(!d) return null; const h=new Date(); let a=h.getFullYear()-d.getFullYear(); const m=h.getMonth()-d.getMonth(); if(m<0||(m===0&&h.getDate()<d.getDate())) a--; return a; }

/* vigência de um beneficiário (compatível com registros antigos) */
function vigIni(b){ return b.vigenciaInicio || (b.dataInicio&&b.dataInicio.toDate?d2s(b.dataInicio.toDate()):b.dataInicio) || (b.criadoEm&&b.criadoEm.toDate?d2s(b.criadoEm.toDate()):null) || null; }
function vigFim(b){ if(b.status!=='inativo') return null; return b.vigenciaFim || b.dataFim || (b.atualizadoEm&&b.atualizadoEm.toDate?d2s(b.atualizadoEm.toDate()):null); }

/* =========================================================================
   CONTRATO — valores, rateio, coberturas (definidos pela corretora no CRM)
   ========================================================================= */
function contrato(){ return (EMP&&EMP.contrato)||{}; }
function valorBase(produto,titularidade){
  const v=(contrato().valores||{})[produto]||{};
  return Number(titularidade==='dependente'?v.dependente:v.titular)||0;
}
/* % do valor do dependente pago pela EMPRESA (o resto vira desconto em folha) */
function pctEmpresaDep(produto){ const r=contrato().rateioDepEmpresaPct||{}; const v=r[produto]; return v==null?0:Number(v)||0; }
function pctEmpresaTit(produto){ const r=contrato().rateioTitEmpresaPct||{}; const v=r[produto]; return v==null?100:Number(v)||0; }
function temValores(){ return PRODUTOS.some(p=>valorBase(p.k,'titular')>0||valorBase(p.k,'dependente')>0); }
function planosContratados(){
  const p=(EMP&&EMP.planos)||[];
  return p.length?PRODUTOS.filter(x=>p.includes(x.k)):PRODUTOS;
}

/* =========================================================================
   PRÓ-RATA — dias reais do mês, entrada e saída contam
   ========================================================================= */
function diasCobrados(ano,mes,inicio,fim){
  const dm=diasNoMes(ano,mes);
  const pIni=new Date(ano,mes-1,1), pFim=new Date(ano,mes-1,dm);
  const a=s2d(inicio), b=s2d(fim);
  if(a&&a>pFim) return 0;              // entrou depois da competência
  if(b&&b<pIni) return 0;              // saiu antes da competência
  const de =(a&&a>pIni)?a:pIni;
  const ate=(b&&b<pFim)?b:pFim;
  if(ate<de) return 0;
  const dias=Math.round((ate-de)/86400000)+1;   // inclusivo nas duas pontas
  return Math.max(0,Math.min(dm,dias));
}
const r2=n=>Math.round((Number(n)||0)*100)/100;

/* Monta a fatura da competência */
function calcularFatura(ano,mes){
  const dm=diasNoMes(ano,mes);
  const itens=[];
  BENEF.forEach(b=>{
    const prod=b.plano; if(!prod||!PROD[prod]) return;
    const ini=vigIni(b), fim=vigFim(b);
    const dias=diasCobrados(ano,mes,ini,fim);
    if(dias<=0) return;
    const base=valorBase(prod,b.titularidade);
    const valor=r2(base*dias/dm);
    const pctEmp=b.titularidade==='dependente'?pctEmpresaDep(prod):pctEmpresaTit(prod);
    const vEmpresa=r2(valor*pctEmp/100);
    const vFunc=r2(valor-vEmpresa);
    itens.push({b,prod,dias,dm,base,valor,vEmpresa,vFunc,integral:dias>=dm,
      entrouNoMes:!!(s2d(ini)&&s2d(ini)>=new Date(ano,mes-1,1)),
      saiuNoMes:!!(s2d(fim)&&s2d(fim)<=new Date(ano,mes-1,dm)&&s2d(fim)>=new Date(ano,mes-1,1))});
  });
  const total=r2(itens.reduce((s,i)=>s+i.valor,0));
  const totEmpresa=r2(itens.reduce((s,i)=>s+i.vEmpresa,0));
  const totFunc=r2(itens.reduce((s,i)=>s+i.vFunc,0));
  const porProduto={};
  PRODUTOS.forEach(p=>{
    const l=itens.filter(i=>i.prod===p.k);
    if(l.length) porProduto[p.k]={qtd:l.length,total:r2(l.reduce((s,i)=>s+i.valor,0)),
      titulares:l.filter(i=>i.b.titularidade!=='dependente').length,
      dependentes:l.filter(i=>i.b.titularidade==='dependente').length};
  });
  return {ano,mes,dm,itens,total,totEmpresa,totFunc,porProduto,
    prorata:itens.filter(i=>!i.integral).length};
}

/* =========================================================================
   DEPENDENTES agrupados por titular (para desconto em folha)
   ========================================================================= */
function grupoDependentes(ano,mes){
  const fat=calcularFatura(ano,mes);
  const porCpf={};
  fat.itens.forEach(i=>{ if(i.b.titularidade!=='dependente') return;
    const cpf=soN(i.b.cpf)||i.b.nome;
    (porCpf[cpf]=porCpf[cpf]||{cpf:i.b.cpf,nome:i.b.nome,nasc:i.b.dataNascimento,parentesco:i.b.parentesco,
      cpfTitular:soN(i.b.cpfTitular),itens:[]}).itens.push(i);
  });
  const titulares={};
  BENEF.filter(b=>b.titularidade!=='dependente').forEach(b=>{ const c=soN(b.cpf); if(c&&!titulares[c]) titulares[c]={cpf:b.cpf,nome:b.nome,status:b.status}; });
  const grupos={};
  Object.values(porCpf).forEach(d=>{
    const tk=d.cpfTitular||'__sem__';
    (grupos[tk]=grupos[tk]||{cpf:titulares[tk]?titulares[tk].cpf:(d.cpfTitular||''),
      nome:titulares[tk]?titulares[tk].nome:'Titular não vinculado',deps:[],total:0,totalEmpresa:0}).deps.push(d);
  });
  Object.values(grupos).forEach(g=>{
    g.deps.forEach(d=>{ d.total=r2(d.itens.reduce((s,i)=>s+i.vFunc,0)); d.totalGeral=r2(d.itens.reduce((s,i)=>s+i.valor,0)); });
    g.deps.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    g.total=r2(g.deps.reduce((s,d)=>s+d.total,0));
    g.totalGeral=r2(g.deps.reduce((s,d)=>s+d.totalGeral,0));
  });
  return Object.values(grupos).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
}

/* =========================================================================
   PDF (jsPDF + autoTable, com fallback para impressão do navegador)
   ========================================================================= */
function pdfDisponivel(){ return !!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable); }
function gerarPDF(cfg){
  // cfg: {titulo, subtitulo, colunas:[], linhas:[[]], rodape:[], arquivo, paisagem, alinhaDir:[idx]}
  if(!pdfDisponivel()){ imprimirFallback(cfg); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:cfg.paisagem?'landscape':'portrait',unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  doc.setFillColor(0,136,170); doc.rect(0,0,W,64,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(cfg.titulo||'Relatório',40,30);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text((EMP.nomeEmpresa||'')+'  ·  CNPJ '+fmtCNPJ(EMP.cnpj),40,47);
  doc.setTextColor(90,105,120);
  const sub=(cfg.subtitulo?cfg.subtitulo+'   ·   ':'')+'Emitido em '+new Date().toLocaleDateString('pt-BR')+' às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  doc.setFontSize(9); doc.text(sub,40,82);
  const dirs={}; (cfg.alinhaDir||[]).forEach(i=>dirs[i]={halign:'right'});
  doc.autoTable({
    head:[cfg.colunas], body:cfg.linhas, startY:95, theme:'grid',
    styles:{font:'helvetica',fontSize:8.4,cellPadding:5,textColor:[35,48,62],lineColor:[228,234,241],lineWidth:.5},
    headStyles:{fillColor:[238,242,247],textColor:[70,85,100],fontStyle:'bold',fontSize:8},
    alternateRowStyles:{fillColor:[250,251,253]},
    columnStyles:dirs,
    margin:{left:40,right:40,bottom:56},
    didDrawPage:()=>{
      const H=doc.internal.pageSize.getHeight();
      doc.setFontSize(7.5); doc.setTextColor(150,160,172);
      doc.text('Retorno Seguros · Portal da Empresa',40,H-24);
      doc.text('Página '+doc.internal.getNumberOfPages(),W-40,H-24,{align:'right'});
    }
  });
  let y=doc.lastAutoTable.finalY+18;
  (cfg.rodape||[]).forEach(l=>{
    if(y>doc.internal.pageSize.getHeight()-70){ doc.addPage(); y=60; }
    doc.setFont('helvetica',l.forte?'bold':'normal'); doc.setFontSize(l.forte?10.5:9);
    doc.setTextColor(l.forte?0:90,l.forte?107:105,l.forte?134:120);
    doc.text(l.k,40,y); doc.text(String(l.v),W-40,y,{align:'right'}); y+=16;
  });
  doc.save((cfg.arquivo||'relatorio')+'.pdf');
  toast('PDF gerado com '+cfg.linhas.length+' linha(s).','ok','Relatório pronto');
}

/* Sessão anônima: as regras do Firestore exigem uma sessão para liberar leitura.
   Não pede nada ao usuário — é transparente e gratuito. */
let AUTH_OK=null;
async function garantirSessao(){
  if(AUTH_OK!==null) return AUTH_OK;
  try{
    if(firebase.auth){
      if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      AUTH_OK=true;
    } else AUTH_OK=false;
  }catch(e){ console.warn('Sessão anônima indisponível:',e&&e.code); AUTH_OK=false; }
  return AUTH_OK;
}

document.addEventListener('DOMContentLoaded',()=>{
  const c=localStorage.getItem('portal_cnpj'), s=localStorage.getItem('portal_sess');
  if(c&&s==='1') entrar(c,null,true);
});
function erroLogin(m){ const e=document.getElementById('loginErr'); e.style.display='block'; e.textContent=m; }

async function fazerLogin(){
  const cnpj=soN(document.getElementById('inCnpj').value);
  const senha=document.getElementById('inSenha').value.trim();
  if(cnpj.length!==14) return erroLogin('Digite o CNPJ completo da empresa.');
  if(!senha) return erroLogin('Digite sua senha.');
  entrar(cnpj,senha,false);
}
async function entrar(cnpj,senha,auto){
  const btn=document.getElementById('btnLogin'); if(btn) btn.disabled=true;
  try{
    document.getElementById('loginErr').style.display='none';
    await garantirSessao();
    // consulta SÓ o documento desta empresa (não baixa a base inteira)
    const snap=await db.collection('empresas_clientes').where('cnpj','==',cnpj).limit(1).get();
    if(snap.empty){ if(auto) return sair(); return erroLogin('Empresa não encontrada. Fale com a Retorno Seguros.'); }
    const doc=snap.docs[0], dados=doc.data();
    if(dados.status==='inativo'){ if(auto) return sair(); return erroLogin('Cadastro inativo. Fale com a Retorno Seguros.'); }
    if(!auto){
      const senhaOk=dados.senhaPortal||dados.senha||cnpj.slice(-6);
      if(senha!==senhaOk) return erroLogin('Senha incorreta.');
    }
    EMP_ID=doc.id; EMP={id:doc.id,...dados};
    localStorage.setItem('portal_cnpj',cnpj); localStorage.setItem('portal_sess','1');
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('app').classList.add('on');
    document.getElementById('empNome').textContent=EMP.nomeEmpresa||'Empresa';
    document.getElementById('empCnpj').textContent=fmtCNPJ(EMP.cnpj);
    escutarDados();
  }catch(e){
    console.error(e);
    if(auto) sair(); else erroLogin('Não foi possível conectar. Tente novamente.');
  }finally{ if(btn) btn.disabled=false; }
}
function sair(){
  UNSUB.forEach(u=>{try{u()}catch(e){}}); UNSUB=[];
  localStorage.removeItem('portal_cnpj'); localStorage.removeItem('portal_sess');
  EMP=null; EMP_ID=null; BENEF=[]; MOVS=[];
  document.getElementById('app').classList.remove('on');
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('inSenha').value='';
}

/* =========================================================================
   DADOS EM TEMPO REAL (só desta empresa)
   ========================================================================= */
function escutarDados(){
  UNSUB.forEach(u=>{try{u()}catch(e){}}); UNSUB=[];
  UNSUB.push(db.collection('beneficiarios').where('empresaId','==',EMP_ID).onSnapshot(s=>{
    BENEF=s.docs.map(d=>({id:d.id,...d.data()}));
    BENEF.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    render();
  },e=>console.error('beneficiarios',e)));
  UNSUB.push(db.collection('movimentacoes_beneficiarios').where('empresaId','==',EMP_ID).onSnapshot(s=>{
    MOVS=s.docs.map(d=>({id:d.id,...d.data()}));
    MOVS.sort((a,b)=>{const x=a.criadoEm&&a.criadoEm.toDate?a.criadoEm.toDate():new Date(0);
                      const y=b.criadoEm&&b.criadoEm.toDate?b.criadoEm.toDate():new Date(0); return y-x;});
    render();
  },e=>console.error('movimentacoes',e)));
  // acompanha mudanças de contrato/valores feitas pela corretora
  UNSUB.push(db.collection('empresas_clientes').doc(EMP_ID).onSnapshot(d=>{
    if(d.exists){ EMP={id:d.id,...d.data()};
      document.getElementById('empNome').textContent=EMP.nomeEmpresa||'Empresa'; render(); }
  },e=>console.error('empresa',e)));
  render();
}

const pendentes=()=>MOVS.filter(m=>m.status==='pendente');

/* =========================================================================
   AGRUPAMENTO POR PESSOA (um CPF pode ter vários produtos)
   ========================================================================= */
function pessoas(lista){
  const src=lista||ativos(), map={};
  src.forEach(b=>{
    const k=soN(b.cpf)||('n:'+(b.nome||'').toLowerCase());
    const p=map[k]||(map[k]={cpf:b.cpf,cpfN:soN(b.cpf),nome:b.nome,dataNascimento:b.dataNascimento,
      titularidade:b.titularidade||'titular',parentesco:b.parentesco,cpfTitular:soN(b.cpfTitular),
      dataAdmissao:b.dataAdmissao,nomeMae:b.nomeMae,docs:[],produtos:[]});
    p.docs.push(b);
    if(b.plano&&!p.produtos.includes(b.plano)) p.produtos.push(b.plano);
    if(!p.dataNascimento&&b.dataNascimento) p.dataNascimento=b.dataNascimento;
    if(!p.parentesco&&b.parentesco) p.parentesco=b.parentesco;
    if(!p.cpfTitular&&b.cpfTitular) p.cpfTitular=soN(b.cpfTitular);
  });
  const l=Object.values(map);
  l.forEach(p=>{ p.produtos.sort((a,b)=>PRODUTOS.findIndex(x=>x.k===a)-PRODUTOS.findIndex(x=>x.k===b));
    p.inicio=p.docs.map(vigIni).filter(Boolean).sort()[0]||null;
    p.cartao=(p.docs.find(d=>d.cartao)||{}).cartao||''; });
  return l.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
}
function nomeTitularDe(cpfTit){
  const t=ativos().find(b=>soN(b.cpf)===soN(cpfTit)&&b.titularidade!=='dependente')
       || BENEF.find(b=>soN(b.cpf)===soN(cpfTit)&&b.titularidade!=='dependente');
  return t?t.nome:null;
}
function cobParse(x){ if(x&&typeof x==='object') return {nome:x.nome||'',desc:x.desc||''};
  const t=String(x||''), i=t.indexOf('|');
  return i<0?{nome:t.trim(),desc:''}:{nome:t.slice(0,i).trim(),desc:t.slice(i+1).trim()}; }
const chipsProd=ps=>`<div class="prods">${(ps||[]).map(k=>`<span class="bdg ${k}"><i class="fas ${PROD[k]?PROD[k].ic:'fa-circle'}"></i> ${PROD[k]?PROD[k].nome:k}</span>`).join('')||'<span class="bdg neutro">—</span>'}</div>`;

/* =========================================================================
   FILTRO DE DATA reutilizável
   ========================================================================= */
function filtroDataHTML(ns){
  const f=F[ns], anoAtual=new Date().getFullYear();
  let extra='';
  if(f.modo==='dia') extra=`<div class="fg"><label>Data</label><input type="date" value="${f.data||''}" onchange="setF('${ns}','data',this.value)"></div>`;
  else if(f.modo==='mes') extra=`<div class="fg"><label>Mês</label><select onchange="setF('${ns}','mes',this.value)">
      ${MESES.map((m,i)=>`<option value="${i+1}" ${String(f.mes)===String(i+1)?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="fg"><label>Ano</label><input type="number" min="2000" max="2100" value="${f.ano||anoAtual}" onchange="setF('${ns}','ano',this.value)" style="min-width:110px"></div>`;
  else if(f.modo==='ano') extra=`<div class="fg"><label>Ano</label><input type="number" min="2000" max="2100" value="${f.ano||anoAtual}" onchange="setF('${ns}','ano',this.value)" style="min-width:110px"></div>`;
  return `<div class="fg"><label>Período</label><select onchange="setModo('${ns}',this.value)">
      <option value="" ${!f.modo?'selected':''}>Todo o histórico</option>
      <option value="dia" ${f.modo==='dia'?'selected':''}>Data específica</option>
      <option value="mes" ${f.modo==='mes'?'selected':''}>Mês</option>
      <option value="ano" ${f.modo==='ano'?'selected':''}>Ano</option>
    </select></div>${extra}`;
}
function setF(ns,k,v){ F[ns][k]=v; render(); }
function setModo(ns,v){ const f=F[ns]; f.modo=v; const d=new Date();
  if(v==='dia'&&!f.data) f.data=hoje();
  if((v==='mes'||v==='ano')){ if(!f.mes) f.mes=d.getMonth()+1; if(!f.ano) f.ano=d.getFullYear(); }
  render(); }
function passaData(ns,dataStr){
  const f=F[ns]; if(!f.modo) return true;
  const d=s2d(dataStr); if(!d) return false;
  if(f.modo==='dia') return d2s(d)===f.data;
  if(f.modo==='mes') return d.getFullYear()===Number(f.ano)&&(d.getMonth()+1)===Number(f.mes);
  if(f.modo==='ano') return d.getFullYear()===Number(f.ano);
  return true;
}
function rotuloPeriodo(ns){
  const f=F[ns]; if(!f.modo) return 'Todo o histórico';
  if(f.modo==='dia') return 'Data '+fmtData(f.data);
  if(f.modo==='mes') return MESES[Number(f.mes)-1]+'/'+f.ano;
  return 'Ano de '+f.ano;
}

/* =========================================================================
   2) BENEFICIÁRIOS
   ========================================================================= */
function viewBeneficiarios(){
  const f=F.ben; f.abertos=f.abertos||{};
  let ps=pessoas();
  if(f.prod) ps=ps.filter(p=>p.produtos.includes(f.prod));
  if(f.busca){ const q=f.busca.toLowerCase(), qn=soN(f.busca);
    const casa=p=>(p.nome||'').toLowerCase().includes(q)||(qn&&p.cpfN.includes(qn));
    /* funcionário encontrado traz os dependentes dele;
       dependente encontrado traz só o titular dele (não os irmãos) */
    const achou=new Set(), titComDeps=new Set(), titContexto=new Set();
    ps.forEach(p=>{ if(!casa(p)) return;
      achou.add(p.cpfN||p.nome);
      if(p.titularidade==='dependente'){ if(p.cpfTitular) titContexto.add(p.cpfTitular); }
      else if(p.cpfN) titComDeps.add(p.cpfN);
    });
    ps=ps.filter(p=> achou.has(p.cpfN||p.nome)
      || (p.titularidade!=='dependente' && titContexto.has(p.cpfN))
      || (p.titularidade==='dependente' && titComDeps.has(p.cpfTitular)));
  }
  ps=ps.filter(p=>passaData('ben',p.inicio));
  if(f.tit) ps=ps.filter(p=>(p.titularidade==='dependente'?'dependente':'titular')===f.tit);

  /* agrupa: dependente aparece embaixo do seu titular */
  const titulares=ps.filter(p=>p.titularidade!=='dependente');
  const porCpf={}; titulares.forEach(t=>{ if(t.cpfN) porCpf[t.cpfN]=t; t.deps=[]; });
  const soltos=[];
  ps.filter(p=>p.titularidade==='dependente').forEach(d=>{
    const t=porCpf[d.cpfTitular]; if(t) t.deps.push(d); else soltos.push(d);
  });
  titulares.forEach(t=>t.deps.sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')));
  const agrupado=!f.tit;                        // filtrando por tipo, mostra lista simples
  const totDeps=ps.filter(p=>p.titularidade==='dependente').length;
  const algumComDep=titulares.some(t=>t.deps.length);
  window.__expBen=ps;

  const acoes=p=>`<td style="text-align:right;white-space:nowrap" onclick="event.stopPropagation()">
      <button class="btn btn-ghost btn-sm" title="Detalhes" onclick="modalDetalhe('${esc(p.cpfN||p.nome)}')"><i class="fas fa-eye"></i></button>
      ${p.titularidade!=='dependente'?`<button class="btn btn-ghost btn-sm" title="Incluir dependente" onclick="modalInclusao('dep','${esc(p.cpfN)}')"><i class="fas fa-user-plus"></i></button>`:''}
      <button class="btn btn-ghost btn-sm" style="color:var(--danger)" title="Solicitar exclusão" onclick="modalExclusao('${esc(p.cpfN||p.nome)}')"><i class="fas fa-user-minus"></i></button></td>`;

  const linhaDeps=t=>`<tr class="dep-row"><td colspan="7" style="padding:0;background:var(--surface-2)">
    <div style="padding:10px 16px 14px 40px">
      <div style="font-size:.7rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">
        <i class="fas fa-people-roof"></i> Dependentes de ${esc((t.nome||'').split(' ')[0])}</div>
      <table style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <thead><tr><th>Dependente</th><th>Parentesco</th><th>CPF</th><th>Nasc. / idade</th><th>Produtos</th><th>Início</th><th></th></tr></thead>
        <tbody>${t.deps.map(d=>{const id=idade(d.dataNascimento);return `<tr>
          <td><b>${esc(d.nome)}</b>${d.cartao?`<div style="font-size:.72rem;color:var(--text-3)">Carteirinha ${esc(d.cartao)}</div>`:''}</td>
          <td><span class="bdg dependente">${esc(PARENTESCOS[d.parentesco]||d.parentesco||'—')}</span></td>
          <td style="font-variant-numeric:tabular-nums">${fmtCPF(d.cpf)||'—'}</td>
          <td>${fmtData(d.dataNascimento)}${id!=null?` <span style="color:var(--text-3)">· ${id}a</span>`:''}</td>
          <td>${chipsProd(d.produtos)}</td>
          <td style="color:var(--text-3)">${fmtData(d.inicio)}</td>
          ${acoes(d)}</tr>`;}).join('')}</tbody></table></div></td></tr>`;

  const linhaPessoa=(p,comToggle)=>{
    const dep=p.titularidade==='dependente', n=(p.deps||[]).length;
    const aberto=!!f.abertos[p.cpfN||p.nome] || !!f.busca;   // buscando, já abre o grupo
    const id=idade(p.dataNascimento), tn=dep?nomeTitularDe(p.cpfTitular):null;
    return `<tr${comToggle&&n?` style="cursor:pointer" onclick="toggleDep2('${esc(p.cpfN||p.nome)}')"`:''}>
      <td><div style="display:flex;align-items:center;gap:9px">
        ${comToggle?(n?`<i class="fas fa-chevron-${aberto?'down':'right'}" style="color:var(--brand);width:11px;font-size:.78rem"></i>`:'<span style="width:11px;display:inline-block"></span>'):''}

      <td style="font-variant-numeric:tabular-nums">${fmtCPF(p.cpf)||'—'}</td>
      <td>${fmtData(p.dataNascimento)}${id!=null?` <span style="color:var(--text-3)">· ${id}a</span>`:''}</td>
      <td>${chipsProd(p.produtos)}</td>
      <td>${dep?`<span class="bdg dependente">${esc(PARENTESCOS[p.parentesco]||'Dependente')}</span><div style="font-size:.72rem;color:var(--text-3);margin-top:2px">de ${esc(tn||'—')}</div>`
             :(n?`<span class="bdg dependente"><i class="fas fa-people-roof"></i> ${n} dependente${n>1?'s':''}</span>`
                :'<span style="color:var(--text-3)">—</span>')}</td>

      ${acoes(p)}</tr>
      ${comToggle&&n&&aberto?linhaDeps(p):''}`;
  };

  const corpo = agrupado
    ? titulares.map(t=>linhaPessoa(t,true)).join('')+
      (soltos.length?`<tr><td colspan="7" style="background:var(--warn-bg);color:#92400e;font-size:.82rem;font-weight:600;padding:10px 12px">
        <i class="fas fa-triangle-exclamation"></i> ${soltos.length} dependente(s) sem titular ativo — fale com a Retorno Seguros para corrigir o vínculo</td></tr>`+
        soltos.map(d=>linhaPessoa(d,false)).join(''):'')
    : ps.map(p=>linhaPessoa(p,false)).join('');

  return `<h2 class="page">Beneficiários ativos</h2>
  <p class="page-sub">Cada funcionário aparece uma vez, com todos os produtos. Clique na linha para ver os dependentes dele.</p>
  <div class="card">
    <div class="card-head"><h3><i class="fas fa-users"></i> ${titulares.length} funcionário(s) · ${totDeps} dependente(s)</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${agrupado&&algumComDep?`<button class="btn btn-ghost btn-sm" onclick="abrirTodosDep(true)"><i class="fas fa-angles-down"></i> Abrir todos</button>
        <button class="btn btn-ghost btn-sm" onclick="abrirTodosDep(false)"><i class="fas fa-angles-up"></i> Fechar</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="pdfBeneficiarios()"><i class="fas fa-file-pdf"></i> Gerar PDF</button>
        <button class="btn btn-ghost btn-sm" onclick="csvBeneficiarios()"><i class="fas fa-file-csv"></i> CSV</button>
        <button class="btn btn-success btn-sm" onclick="modalInclusao()"><i class="fas fa-user-plus"></i> Incluir</button>
      </div></div>
    <div class="filters">
      <div class="fg"><label>Produto</label><select onchange="setF('ben','prod',this.value)">
        <option value="">Todos</option>${PRODUTOS.map(p=>`<option value="${p.k}" ${f.prod===p.k?'selected':''}>${p.nome}</option>`).join('')}</select></div>
      <div class="fg"><label>Tipo</label><select onchange="setF('ben','tit',this.value)">
        <option value="">Agrupado por funcionário</option><option value="titular" ${f.tit==='titular'?'selected':''}>Só funcionários</option>
        <option value="dependente" ${f.tit==='dependente'?'selected':''}>Só dependentes</option></select></div>
      ${filtroDataHTML('ben')}
      <div class="fg grow"><label>Buscar</label><input type="text" id="fBusBen" placeholder="Nome ou CPF..." value="${esc(f.busca)}" oninput="F.ben.busca=this.value;clearTimeout(window.__tb);window.__tb=setTimeout(render,200)"></div>
    </div>
    ${ps.length?`<div class="tbl-wrap"><table><thead><tr>
      <th>Nome</th><th>CPF</th><th>Nasc. / idade</th><th>Produtos</th><th>${agrupado?'Dependentes':'Vínculo'}</th><th>Início</th><th style="text-align:right">Ações</th>
    </tr></thead><tbody>${corpo}</tbody></table></div>`
    :`<div class="empty"><div class="ic"><i class="fas fa-users"></i></div><h4>Nenhum beneficiário encontrado</h4>
      <p>Ajuste os filtros ou inclua o primeiro colaborador.</p></div>`}
  </div>`;
}
function toggleDep2(k){ F.ben.abertos=F.ben.abertos||{}; F.ben.abertos[k]=!F.ben.abertos[k]; render(); }

  pessoas().filter(p=>p.titularidade!=='dependente').forEach(t=>{ F.ben.abertos[t.cpfN||t.nome]=v; }); render(); }
function linhasBenef(ps){
  return ps.map(p=>{ const dep=p.titularidade==='dependente';

function pdfBeneficiarios(){

function csvBeneficiarios(){
  const ps=window.__expBen||[]; if(!ps.length) return toast('Nada para exportar.','warn');
  baixarCSV(['Nome','CPF','Nascimento','Produtos','Tipo','Vinculo','Carteirinha','Inicio'],linhasBenef(ps),'beneficiarios-'+slug(EMP.nomeEmpresa));
}
const slug=s=>(s||'empresa').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function baixarCSV(head,linhas,nome){
  const cel=v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const txt='﻿'+[head.join(';')].concat(linhas.map(l=>l.map(cel).join(';'))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=nome+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV gerado com '+linhas.length+' linha(s).','ok');
}

/* =========================================================================
   PERFIL DA EQUIPE (visão da empresa)
   ========================================================================= */
const FAIXAS_ET=[[0,18,'0 a 18'],[19,23,'19 a 23'],[24,28,'24 a 28'],[29,33,'29 a 33'],[34,38,'34 a 38'],
  [39,43,'39 a 43'],[44,48,'44 a 48'],[49,53,'49 a 53'],[54,58,'54 a 58'],[59,200,'59 ou mais']];
const BLOCOS_TEMPO=[[0,11,'Menos de 1 ano'],[12,35,'1 a 3 anos'],[36,59,'3 a 5 anos'],[60,119,'5 a 10 anos'],[120,99999,'Mais de 10 anos']];
function mesesDeCasa(adm){ const d=s2d(adm); if(!d) return null;
  const h=new Date(); let m=(h.getFullYear()-d.getFullYear())*12+(h.getMonth()-d.getMonth());
  if(h.getDate()<d.getDate()) m--; return m>=0?m:null; }
function fmtTempoM(m){ if(m==null) return '—'; const a=Math.floor(m/12), r=m%12;
  return a?(a+' ano'+(a>1?'s':'')+(r?' e '+r+' m':'')):(r+' mês'+(r!==1?'es':'')); }
function barraP(rot,val,tot,cor,extra){
  const pct=tot?Math.round(val/tot*100):0;
  return `<div style="margin-bottom:9px">
    <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px">
      <span>${rot}${extra?` <span style="color:var(--text-3);font-size:.76rem">${extra}</span>`:''}</span>
      <span style="font-variant-numeric:tabular-nums"><b>${val}</b> <span style="color:var(--text-3)">· ${pct}%</span></span></div>
    <div style="background:var(--surface-3);border-radius:6px;height:10px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:${cor||'var(--brand)'};border-radius:6px"></div></div></div>`;
}
function viewPerfil(){
  const ps=pessoas();
  const tit=ps.filter(p=>p.titularidade!=='dependente'), dep=ps.filter(p=>p.titularidade==='dependente');
  const comIdade=ps.map(p=>({p,i:idade(p.dataNascimento)})).filter(x=>x.i!=null);
  const semIdade=ps.length-comIdade.length;
  const faixas={}; FAIXAS_ET.forEach(([,,r])=>faixas[r]={t:0,f:0,d:0});
  comIdade.forEach(({p,i})=>{ const b=FAIXAS_ET.find(([a,z])=>i>=a&&i<=z); if(!b) return;
    faixas[b[2]].t++; if(p.titularidade==='dependente') faixas[b[2]].d++; else faixas[b[2]].f++; });
  const idades=comIdade.map(x=>x.i).sort((a,b)=>a-b);
  const media=idades.length?Math.round(idades.reduce((s,i)=>s+i,0)/idades.length):null;
  const tempos=tit.map(t=>mesesDeCasa(t.dataAdmissao)).filter(m=>m!=null);
  const tMed=tempos.length?Math.round(tempos.reduce((s,m)=>s+m,0)/tempos.length):null;
  const tDist={}; BLOCOS_TEMPO.forEach(([,,r])=>tDist[r]=0);
  tempos.forEach(m=>{ const b=BLOCOS_TEMPO.find(([a,z])=>m>=a&&m<=z); if(b) tDist[b[2]]++; });
  const menores=comIdade.filter(x=>x.i<18).length;
  window.__expPerf={ps,comIdade,faixas,media,tMed,tDist,tempos};
  return `<h2 class="page">Perfil da equipe</h2>

/* =========================================================================
   VALIDAÇÃO
   ========================================================================= */
function cpfValido(v){
  const c=soN(v); if(c.length!==11||/^(\d)\1{10}$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=+c[i]*(10-i);
  let d=(s*10)%11; if(d===10) d=0; if(d!==+c[9]) return false;
  s=0; for(let i=0;i<10;i++) s+=+c[i]*(11-i);
  d=(s*10)%11; if(d===10) d=0; return d===+c[10];
}
function pessoaPorCpf(cpfN){ return pessoas().find(p=>(p.cpfN||p.nome)===cpfN)||pessoas().find(p=>p.cpfN===soN(cpfN)); }

function checarDuplicado(){

async function enviarInclusao(){
  const planos=[...document.querySelectorAll('.incProd:checked')].map(c=>c.value);
  const titularidade=document.getElementById('incTitularidade').value;
  const nome=document.getElementById('incNome').value.trim();
  const cpf=document.getElementById('incCpf').value.trim();
  const nasc=document.getElementById('incNasc').value;
  const vig=document.getElementById('incVigencia').value;
  const adm=document.getElementById('incAdmissao').value;
  const mae=document.getElementById('incMae').value.trim();
  const obs=document.getElementById('incObs').value.trim();
  const cpfTit=document.getElementById('incTitular').value;
  const parent=document.getElementById('incParentesco').value;
  if(!planos.length) return toast('Marque pelo menos um benefício.','err');
  if(!nome||nome.split(' ').length<2) return toast('Informe o nome completo.','err');
  if(!cpfValido(cpf)) return toast('CPF inválido — confira os números.','err');
  if(!nasc) return toast('Informe a data de nascimento.','err');
  if(!vig) return toast('Informe o início da vigência.','err');
  if(titularidade==='dependente'){
    if(!cpfTit) return toast('Selecione o funcionário titular.','err');
    if(!parent) return toast('Informe o grau de parentesco.','err');
  }
  const jaP=pessoas().find(x=>x.cpfN===soN(cpf));
  const dup=jaP?planos.filter(k=>jaP.produtos.includes(k)):[];
  if(dup.length) return toast('Já está ativo em '+dup.map(k=>PROD[k].nome).join(', ')+'. Desmarque para continuar.','err');
  const btn=document.getElementById('btnInc'); btn.disabled=true;
  try{
    const tit=cpfTit?pessoas().find(p=>p.cpfN===cpfTit):null;
    await db.collection('movimentacoes_beneficiarios').add({
      empresaId:EMP_ID, empresaNome:EMP.nomeEmpresa||null, empresaCnpj:EMP.cnpj||null,
      tipo:'inclusao', planos, plano:planos[0],
      titularidade, nome:nome.toUpperCase(), cpf:fmtCPF(cpf), cpfLimpo:soN(cpf),
      dataNascimento:nasc, dataVigencia:vig, dataAdmissao:(titularidade==='titular'?adm:null)||null,
      parentesco:titularidade==='dependente'?parent:null,
      cpfTitular:titularidade==='dependente'?fmtCPF(cpfTit):null,
      titularNome:tit?tit.nome:null,
      nomeMae:mae||null, observacoes:obs||null,
      status:'pendente', origem:'portal_empresa',
      solicitadoPor:EMP.responsavel||null,
      criadoEm:FV.serverTimestamp()
    });
    closeModal();
    toast(nome.split(' ')[0]+' foi enviado(a) para análise em '+planos.length+' benefício(s).','ok','Solicitação enviada');
    TAB='movimentacoes'; render();
  }catch(e){ console.error(e); toast('Não conseguimos enviar. Tente de novo em instantes.','err'); btn.disabled=false; }
}

      </div>
      <input type="hidden" id="excCpf" value="${esc(cpfN)}">
      <div class="frow"><label>De quais benefícios excluir? *</label>
        <div class="prod-grid">${p.produtos.map(k=>`<div class="prod-opt ${k}">
          <input type="checkbox" class="excProd" id="ep_${k}" value="${k}" checked>
          <label for="ep_${k}"><i class="fas ${PROD[k].ic}"></i> ${PROD[k].nome}<small>ativo hoje</small></label></div>`).join('')}</div>
        <div class="hint">Desmarque o que deve continuar ativo. Por padrão sai de todos.</div></div>
      ${deps.length?`<div class="note warn"><i class="fas fa-people-roof"></i>
        <div><b>${esc(p.nome.split(' ')[0])} tem ${deps.length} dependente(s):</b> ${deps.map(d=>esc(d.nome)).join(', ')}.<br>
        <label style="display:flex;align-items:center;gap:8px;margin-top:9px;cursor:pointer;font-weight:600">
          <input type="checkbox" id="excDeps" checked style="width:auto"> Excluir os dependentes junto (recomendado)</label></div></div>`:''}
      <div class="f2">
        <div class="frow"><label>Data da exclusão *</label><input type="date" id="excData" value="${hoje()}">
          <div class="hint">O dia da saída é cobrado no pró-rata.</div></div>
        <div class="frow"><label>Motivo *</label><select id="excMotivo"><option value="">Selecione...</option>
          ${Object.entries(MOTIVOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      </div>
      <div class="frow"><label>Observações</label><textarea id="excObs" rows="2" placeholder="Informações adicionais para a corretora..."></textarea></div>
      <div class="note dang" style="margin-bottom:0"><i class="fas fa-triangle-exclamation"></i>
        <div>A exclusão é efetivada pela seguradora após a aprovação da corretora. Cobranças proporcionais até a data informada ainda entram na fatura.</div></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="btnExc" onclick="enviarExclusao()"><i class="fas fa-user-minus"></i> Enviar solicitação</button>
    </div>`,'wide');
}
async function enviarExclusao(){
  const cpfN=document.getElementById('excCpf').value;
  const p=pessoaPorCpf(cpfN); if(!p) return toast('Beneficiário não encontrado.','err');
  const planos=[...document.querySelectorAll('.excProd:checked')].map(c=>c.value);
  const data=document.getElementById('excData').value;
  const motivo=document.getElementById('excMotivo').value;
  const obs=document.getElementById('excObs').value.trim();
  const levaDeps=!!(document.getElementById('excDeps')&&document.getElementById('excDeps').checked);
  if(!planos.length) return toast('Marque ao menos um benefício para excluir.','err');
  if(!data) return toast('Informe a data da exclusão.','err');
  if(!motivo) return toast('Informe o motivo.','err');
  const btn=document.getElementById('btnExc'); btn.disabled=true;
  try{
    const alvos=[p];
    if(levaDeps) pessoas().filter(x=>x.titularidade==='dependente'&&x.cpfTitular===p.cpfN).forEach(d=>alvos.push(d));
    const lote=db.batch();
    alvos.forEach(a=>{
      const ps=a===p?planos:a.produtos.filter(k=>planos.includes(k));
      if(!ps.length) return;
      const docs=a.docs.filter(d=>ps.includes(d.plano));
      const ref=db.collection('movimentacoes_beneficiarios').doc();
      lote.set(ref,{
        empresaId:EMP_ID, empresaNome:EMP.nomeEmpresa||null, empresaCnpj:EMP.cnpj||null,
        tipo:'exclusao', planos:ps, plano:ps[0],
        beneficiarioIds:docs.map(d=>d.id), beneficiarioId:docs[0]?docs[0].id:null,
        titularidade:a.titularidade||'titular', nome:a.nome, cpf:a.cpf, cpfLimpo:soN(a.cpf),
        dataNascimento:a.dataNascimento||null,
        parentesco:a.titularidade==='dependente'?(a.parentesco||null):null,
        cpfTitular:a.titularidade==='dependente'?fmtCPF(a.cpfTitular):null,
        titularNome:a.titularidade==='dependente'?(nomeTitularDe(a.cpfTitular)||null):null,
        dataExclusao:data, motivo, observacoes:(a===p?obs:'Exclusão junto com o titular '+p.nome)||null,
        vinculadaAoTitular:a===p?null:soN(p.cpf),
        status:'pendente', origem:'portal_empresa',
        solicitadoPor:EMP.responsavel||null, criadoEm:FV.serverTimestamp()
      });
    });
    await lote.commit();
    closeModal();
    toast('Exclusão enviada para análise'+(alvos.length>1?' ('+alvos.length+' pessoas)':'')+'.','ok','Solicitação enviada');
    TAB='movimentacoes'; render();
  }catch(e){ console.error(e); toast('Não conseguimos enviar. Tente de novo em instantes.','err'); btn.disabled=false; }
}

/* =========================================================================
   MODAL — DETALHE
   ========================================================================= */
function modalDetalhe(cpfN){
  const p=pessoaPorCpf(cpfN); if(!p) return;
  const dep=p.titularidade==='dependente';
  const deps=!dep?pessoas().filter(x=>x.titularidade==='dependente'&&x.cpfTitular===p.cpfN):[];
  const linha=(k,v)=>v?`<div style="padding:9px 0;border-bottom:1px dashed var(--border);display:flex;justify-content:space-between;gap:14px;font-size:.87rem">
    <span style="color:var(--text-2)">${k}</span><b style="text-align:right">${v}</b></div>`:'';
  openModal(`
    <div class="modal-head"><h3><i class="fas fa-id-card" style="color:var(--brand)"></i> ${esc(p.nome)}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div style="margin-bottom:14px">${chipsProd(p.produtos)}</div>
      ${linha('CPF',fmtCPF(p.cpf))}
      ${linha('Nascimento',fmtData(p.dataNascimento)+(idade(p.dataNascimento)!=null?' · '+idade(p.dataNascimento)+' anos':''))}
      ${linha('Tipo',dep?'Dependente':'Funcionário (titular)')}
      ${dep?linha('Titular',esc(nomeTitularDe(p.cpfTitular)||'—')):''}
      ${dep?linha('Parentesco',esc(PARENTESCOS[p.parentesco]||p.parentesco||'—')):''}
      ${linha('Nome da mãe',esc(p.nomeMae||''))}
      ${linha('Admissão',p.dataAdmissao?fmtData(p.dataAdmissao):'')}
      ${linha('Início no benefício',fmtData(p.inicio))}
      <div style="margin-top:16px"><div style="font-size:.78rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px">Carteirinhas e certificados</div>
        <div class="tbl-wrap" style="margin:0;padding:0"><table><thead><tr><th>Produto</th><th>Carteirinha</th><th>Certificado</th><th>Início</th></tr></thead><tbody>
        ${p.docs.map(d=>`<tr><td><span class="bdg ${d.plano}">${PROD[d.plano]?PROD[d.plano].nome:d.plano}</span></td>
          <td>${esc(d.cartao||'')||'<span style="color:var(--text-3)">a informar</span>'}</td>
          <td>${esc(d.certificado||'')||'<span style="color:var(--text-3)">—</span>'}</td>
          <td style="color:var(--text-3)">${fmtData(vigIni(d))}</td></tr>`).join('')}
        </tbody></table></div></div>
      ${deps.length?`<div style="margin-top:18px"><div style="font-size:.78rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px">Dependentes vinculados</div>
        ${deps.map(d=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)">
          <i class="fas fa-user" style="color:var(--warn)"></i><div style="flex:1"><b style="font-size:.88rem">${esc(d.nome)}</b>
          <div style="font-size:.75rem;color:var(--text-3)">${esc(PARENTESCOS[d.parentesco]||d.parentesco||'')} · ${fmtCPF(d.cpf)}</div></div>
          ${chipsProd(d.produtos)}</div>`).join('')}</div>`:''}
    </div>
    <div class="modal-foot">
      ${!dep?`<button class="btn btn-ghost" onclick="closeModal();modalInclusao('dep','${esc(p.cpfN)}')"><i class="fas fa-user-plus"></i> Incluir dependente</button>`:''}
      <button class="btn btn-danger" onclick="closeModal();modalExclusao('${esc(cpfN)}')"><i class="fas fa-user-minus"></i> Solicitar exclusão</button>
      <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
    </div>`,'wide');
}

</script>
