/* ---------- FIPE (tenta v1, cai pra v2 se falhar) ---------- */
function fetchComTempo(url,ms){
  const c=('AbortController' in window)?new AbortController():null;
  if(c) setTimeout(()=>c.abort(),ms||15000);
  return fetch(url,c?{signal:c.signal}:undefined);
}
let __fipeDiag='', __fipe429=false;
function __regErro(rot,e){ __fipeDiag+=(__fipeDiag?' · ':'')+rot+': '+
  (e&&e.name==='AbortError'?'demorou demais (15s)':(e&&e.message)||String(e)); }
async function fipeTenta(urlV1,urlV2,normalizaV2){
  __fipeDiag=''; __fipe429=false;
  try{ const r=await fetchComTempo(urlV1);
    if(r.ok){ const d=await r.json(); if(d&&!d.erro) return d; __regErro('API 1','resposta com erro'); }
    else { if(r.status===429) __fipe429=true; __regErro('API 1','HTTP '+r.status); }
  }catch(e){ __regErro('API 1',e); }
  try{ const r=await fetchComTempo(urlV2);
    if(r.ok){ const d=await r.json(); if(d) return normalizaV2(d); }
    else { if(r.status===429) __fipe429=true; __regErro('API 2','HTTP '+r.status); }
  }catch(e){ __regErro('API 2',e); }
  console.warn('FIPE indisponível — '+__fipeDiag);
  return null;
}
/* cache no navegador: cada visitante consulta a tabela uma vez só (evita o limite HTTP 429) */
function fipeCacheLe(k,horas){ try{ const o=JSON.parse(localStorage.getItem(k));
  if(o&&o.t&&(Date.now()-o.t)<horas*3600000) return o.d; }catch(e){} return null; }
function fipeCacheGrava(k,d){ try{ localStorage.setItem(k,JSON.stringify({t:Date.now(),d:d})); }catch(e){} }
async function fipeComCache(chave,horas,busca){
  const c=fipeCacheLe(chave,horas); if(c) return c;
  const d=await busca(); if(d) fipeCacheGrava(chave,d);
  return d;
}
const v2Lista=d=>(Array.isArray(d)?d:[]).map(x=>({codigo:String(x.code),nome:x.name}));
/* 1º) catálogo mensal que o nosso CRM grava no Firestore (coleção `site`) — carrega
   na hora e não conta no limite da FIPE; 2º) API ao vivo como reserva */
async function catalogoDoc(id){
  try{ const s=await db.collection('site').doc(id).get();
    if(s.exists){ const d=s.data(); if(d&&d.lista&&d.lista.length) return d.lista; }
  }catch(e){}
  return null;
}

/* marcas carregam já na abertura da página (como na versão anterior), com re-tentativa */
let __marcasPromessa=null, __fipePausaAte=0;
function carregarMarcas(){
  if(marcasFipe.length) return Promise.resolve(true);
  if(Date.now()<__fipePausaAte){ __fipe429=true; return Promise.resolve(false); }
  if(__marcasPromessa) return __marcasPromessa;
  __marcasPromessa=(async()=>{
    for(let t=0;t<3;t++){
      const d=await fipeMarcas();
      if(d&&d.length){ marcasFipe=d; return true; }
      if(__fipe429){ __fipePausaAte=Date.now()+60000; break; } /* limite de consultas: insistir só piora */
      await new Promise(ok=>setTimeout(ok,1200*(t+1)));
    }
    __marcasPromessa=null; return false;
  })();
  return __marcasPromessa;
}
async function tentarMarcasDeNovo(){
  const inp=document.getElementById('inMarca'), erro=document.getElementById('fipeErro');
  if(erro) erro.classList.remove('show');
  if(inp&&!marcasFipe.length) inp.placeholder='Carregando marcas...';
  const ok=await carregarMarcas();
  const inp2=document.getElementById('inMarca'), erro2=document.getElementById('fipeErro');
  if(ok){ if(inp2){ inp2.placeholder='Ex: Fiat, Volkswagen, Toyota...';
      if(inp2.value.trim()) inp2.dispatchEvent(new Event('input')); }
    if(erro2) erro2.classList.remove('show'); }
  else if(erro2){
    erro2.innerHTML=(__fipe429
      ?'A tabela FIPE recebeu muitas consultas seguidas e pediu uma pausa. <b>Espere 1&ndash;2 minutos</b> e toque em Tentar de novo &mdash; suas respostas continuam salvas.'
      :'Não consegui falar com a tabela FIPE agora'+
       (__fipeDiag?'<br><small style="opacity:.8">Motivo técnico: '+esc(__fipeDiag)+'</small>':'.'))+
      '<br><b style="cursor:pointer;text-decoration:underline" onclick="tentarMarcasDeNovo()">Tentar de novo</b>';
    erro2.classList.add('show');
    if(inp2) inp2.placeholder='Toque em "Tentar de novo" acima';
  }
}

function montaAutocomplete(inputId,ddId,getData,aoEscolher){
  const input=document.getElementById(inputId),dd=document.getElementById(ddId);let hi=-1;
  input.addEventListener('input',()=>{const val=input.value.trim().toLowerCase(),data=getData();
    if(val.length<1||!data.length){dd.classList.remove('show');return}
    const f=data.filter(i=>i.nome.toLowerCase().includes(val)).slice(0,30);
    if(!f.length){dd.innerHTML='<div class="ae">Nenhum resultado</div>';dd.classList.add('show');return}
    dd.innerHTML=f.map(item=>'<div class="ai" data-codigo="'+item.codigo+'" data-nome="'+item.nome.replace(/"/g,'&quot;')+'">'+realca(item.nome,val)+'</div>').join('');
    dd.classList.add('show');hi=-1;
    dd.querySelectorAll('.ai').forEach(el=>el.addEventListener('click',()=>{
      input.value=el.dataset.nome;dd.classList.remove('show');aoEscolher(el.dataset.codigo,el.dataset.nome)}));
  });
  input.addEventListener('keydown',e=>{const items=dd.querySelectorAll('.ai');
    if(!dd.classList.contains('show')||!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hi+1,items.length-1)}
    else if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(hi-1,0)}
    else if(e.key==='Enter'&&hi>=0){e.preventDefault();items[hi].click();return}
    else if(e.key==='Escape'){dd.classList.remove('show');return}
    items.forEach((el,i)=>el.classList.toggle('hl2',i===hi));
    if(items[hi])items[hi].scrollIntoView({block:'nearest'});
  });
  document.addEventListener('click',e=>{if(!input.contains(e.target)&&!dd.contains(e.target))dd.classList.remove('show')});
}
function realca(t,q){const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return t;
  return t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)}

}
