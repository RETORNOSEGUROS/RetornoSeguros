.cwb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:#25d366;color:#fff;border:none;border-radius:24px;font-size:.95rem;font-weight:800;font-family:inherit;cursor:pointer;transition:.25s;text-decoration:none;box-shadow:0 4px 16px rgba(37,211,102,.3)}

</style>

<script>
const firebaseConfig={apiKey:"AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",authDomain:"retorno-seguros.firebaseapp.com",projectId:"retorno-seguros",storageBucket:"retorno-seguros.appspot.com",messagingSenderId:"495712392972",appId:"1:495712392972:web:e1e78aedc48bdeea48db29",measurementId:"G-C6E44WXLPW"};

   - o cadastro nasce quando ela deixa o WhatsApp (vira lead no funil)
   - cada resposta seguinte atualiza o mesmo documento, com a etapa

function dadosLead(extra){
  return Object.assign({
    nome:formData.nome, whatsapp:(formData.whatsapp||'').replace(/\D/g,''),
    ramo:'Auto', tipo:'individual', origem:'site',
    temSeguro:formData.temSeguro, mesVencimento:formData.mesVencimento||'',

    bonus:formData.bonus, sinistro:formData.sinistro, reboque:formData.reboque,

    indicadoPorCodigo:indicadorCodigo, empresaParceiraCodigo:empresaParceiraCodigo,
    atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
  },extra||{});
}
async function salvarProgresso(etapa,acao){
  if(!formData._leadId) return;                 /* antes do WhatsApp fica só aqui */
  try{ await db.collection('leads_crm').doc(formData._leadId).update(dadosLead({etapaSite:etapa,acao:acao||'em_preenchimento'})); }

}

    }));
    formData._leadId=ref.id;

}

/* =========================================================================
   MOTOR DA CONVERSA
   ========================================================================= */
const feed=document.getElementById('feed');
function scrollFim(){ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }
function bolhaPamela(html){
  const d=document.createElement('div'); d.className='mi';

}

}

  d.innerHTML='<span class="fi">&#128161;</span><span>'+html+'</span>';

}
function digitando(ms){
  return new Promise(ok=>{
    const d=document.createElement('div'); d.className='typing';
    d.innerHTML='<img src="'+AVATAR+'" alt="" class="ma"><div class="tb"><i></i><i></i><i></i></div>';

    setTimeout(()=>{ d.remove(); ok(); },ms||900);
  });
}
let areaAtual=null;
function areaResposta(html){
  if(areaAtual) areaAtual.remove();
  areaAtual=document.createElement('div'); areaAtual.className='mr'; areaAtual.innerHTML=html;
  feed.appendChild(areaAtual); scrollFim();
  return areaAtual;
}
function fecharArea(){ if(areaAtual){ areaAtual.remove(); areaAtual=null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const primeiroNome=()=>esc((formData.nome||'').split(' ')[0]);

/* capítulos + radar */
const CAP_DE={nome:'voce',temSeguro:'voce',carro:'carro',whatsapp:'carro',utilizacao:'rotina',condutor:'rotina',idade:'rotina',garagem:'rotina',bonus:'rotina',sinistro:'rotina',reboque:'protecao',terceiros:'protecao',carroReserva:'protecao',extras:'protecao',franquia:'protecao',fim:'fim'};
function marcaCapitulo(passo){
  const alvo=CAP_DE[passo]||'voce';
  const ordem=['voce','carro','rotina','protecao','fim']; const i=ordem.indexOf(alvo);
  document.querySelectorAll('.cap').forEach(el=>{
    const j=ordem.indexOf(el.dataset.cap);
    el.classList.toggle('on',j===i);
    el.classList.toggle('done',j<i);
  });
}
let radarPts=0; const RADAR_TOTAL=14;
function radarMais(n){
  radarPts=Math.min(RADAR_TOTAL,radarPts+(n||1));
  const p=Math.round(radarPts/RADAR_TOTAL*100);
  document.getElementById('radar').classList.add('show');
  document.getElementById('radarFill').style.width=p+'%';
  document.getElementById('radarPct').textContent=p+'%';
}

}
const PASSOS={

/* ---------- 1. NOME ---------- */

  inp.addEventListener('input',()=>bt.disabled=inp.value.trim().length<2);
  const ir=()=>{ if(inp.value.trim().length<2) return;
    formData.nome=inp.value.trim(); fecharArea(); bolhaEco(esc(formData.nome)); radarMais(1); passo('temSeguro'); };

/* ---------- FIPE ---------- */
function montaAutocomplete(inputId,ddId,getData,aoEscolher){
  const input=document.getElementById(inputId),dd=document.getElementById(ddId);let hi=-1;
  input.addEventListener('input',()=>{const val=input.value.trim().toLowerCase(),data=getData();
    if(val.length<1||!data.length){dd.classList.remove('show');return}
    const f=data.filter(i=>i.nome.toLowerCase().includes(val)).slice(0,30);
    if(!f.length){dd.innerHTML='<div class="ae">Nenhum resultado</div>';dd.classList.add('show');return}
    dd.innerHTML=f.map(item=>'<div class="ai" data-codigo="'+item.codigo+'" data-nome="'+item.nome.replace(/"/g,'&quot;')+'">'+realca(item.nome,val)+'</div>').join('');
    dd.classList.add('show');hi=-1;
    dd.querySelectorAll('.ai').forEach(el=>el.addEventListener('click',()=>{
      input.value=el.dataset.nome;dd.classList.remove('show');aoEscolher(el.dataset.codigo,el.dataset.nome)}));
  });
  input.addEventListener('keydown',e=>{const items=dd.querySelectorAll('.ai');
    if(!dd.classList.contains('show')||!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hi+1,items.length-1)}
    else if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(hi-1,0)}
    else if(e.key==='Enter'&&hi>=0){e.preventDefault();items[hi].click();return}
    else if(e.key==='Escape'){dd.classList.remove('show');return}
    items.forEach((el,i)=>el.classList.toggle('hl2',i===hi));
    if(items[hi])items[hi].scrollIntoView({block:'nearest'});
  });
  document.addEventListener('click',e=>{if(!input.contains(e.target)&&!dd.contains(e.target))dd.classList.remove('show')});
}
function realca(t,q){const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return t;
  return t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)}
async function aoEscolherMarca(cod,nome){
  formData.marcaCodigo=cod;formData.marcaNome=nome;
  formData.modeloCodigo='';formData.modeloNome='';formData.anoCodigo='';formData.anoNome='';formData.valorFipe='';
  const im=document.getElementById('inModelo'),sa=document.getElementById('selAno');
  im.value='';im.disabled=true;im.placeholder='Carregando modelos...';
  sa.innerHTML='<option value="">Escolha o modelo primeiro</option>';sa.disabled=true;
  document.getElementById('fipeBox').classList.remove('show');
  document.getElementById('btCarro').disabled=true;
  try{const r=await fetch(FIPE_API+'/marcas/'+cod+'/modelos');const d=await r.json();
    modelosFipe=d.modelos||[];im.disabled=false;im.placeholder='Digite o modelo...';im.focus();
  }catch(e){im.placeholder='Erro ao carregar'}
}
async function aoEscolherModelo(cod,nome){
  formData.modeloCodigo=cod;formData.modeloNome=nome;
  formData.anoCodigo='';formData.anoNome='';formData.valorFipe='';
  const sa=document.getElementById('selAno');
  sa.innerHTML='<option value="">Carregando...</option>';sa.disabled=true;
  document.getElementById('fipeBox').classList.remove('show');
  document.getElementById('btCarro').disabled=true;
  try{const r=await fetch(FIPE_API+'/marcas/'+formData.marcaCodigo+'/modelos/'+cod+'/anos');
    anosFipe=await r.json();
    sa.innerHTML='<option value="">Escolha o ano</option>'+anosFipe.map(a=>'<option value="'+a.codigo+'">'+a.nome+'</option>').join('');
    sa.disabled=false;

async function aoEscolherAno(){
  const sa=document.getElementById('selAno');if(!sa.value)return;
  formData.anoCodigo=sa.value;formData.anoNome=sa.options[sa.selectedIndex].text;
  const fb=document.getElementById('fipeBox'),fv=document.getElementById('fipeVal');
  fv.textContent='Buscando...';fb.classList.add('show');
  try{const r=await fetch(FIPE_API+'/marcas/'+formData.marcaCodigo+'/modelos/'+formData.modeloCodigo+'/anos/'+sa.value);
    const d=await r.json();formData.valorFipe=d.Valor||'';
    fv.textContent=formData.valorFipe;
    document.getElementById('btCarro').disabled=false;
  }catch(e){fv.textContent='Não encontrado'}
}

function mascaraFone(input){
  let v=input.value.replace(/\D/g,'');if(v.length>11)v=v.substring(0,11);
  if(v.length>6)input.value='('+v.substring(0,2)+') '+v.substring(2,7)+'-'+v.substring(7);
  else if(v.length>2)input.value='('+v.substring(0,2)+') '+v.substring(2);
  else if(v.length>0)input.value='('+v;
}
