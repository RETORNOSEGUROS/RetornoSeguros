<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha área | Retorno Seguros</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
:root{--navy:#1b2c5c;--navy2:#16254e;--navy3:#1e3a8a;--blue:#3b82f6;--sky:#0284c7;--amber:#f59e0b;--amber2:#fbbf24;--ink:#0f172a;--txt:#1f2a3d;--mut:#64748b;--mut2:#94a3b8;--bg:#f6f9ff;--line:#e2e8f0;--blue50:#eff6ff;--blue100:#dbeafe;--ok:#16a34a;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(120deg,var(--navy2),var(--navy) 60%,var(--navy3));color:#fff;padding:22px 18px 28px}
.top .in{max-width:680px;margin:0 auto}
.top img{height:30px;filter:brightness(0) invert(1);opacity:.85;margin-bottom:14px}
.top h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.9rem;line-height:1.15}
.top p{color:rgba(255,255,255,.78);font-size:.92rem;margin-top:6px;max-width:48ch}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:.76rem;font-weight:700;margin-top:12px}
.pill b{color:var(--amber2)}
.wrap{max-width:680px;margin:0 auto;padding:18px 14px 60px}
h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.35rem;color:var(--navy);margin:22px 0 4px}
.sub{font-size:.86rem;color:var(--mut);margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.ap{display:grid;grid-template-columns:44px 1fr;gap:12px}
.ap .ic{width:44px;height:44px;border-radius:12px;background:var(--blue50);display:flex;align-items:center;justify-content:center;font-size:1.35rem}
.ap .t{font-weight:800;color:var(--ink);font-size:1rem}
.ap .s{font-size:.82rem;color:var(--mut)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 9px;border-radius:6px;margin-left:6px;vertical-align:middle}
.tag.ok{background:#ecfdf5;color:var(--ok)}.tag.warn{background:#fffbeb;color:#b45309}.tag.off{background:#f1f5f9;color:var(--mut)}.tag.info{background:var(--blue50);color:var(--sky)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 0;font-size:.82rem}
.kv div span{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bt{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;font-size:.82rem;font-weight:700;text-decoration:none;border:1.5px solid var(--line);color:var(--navy);background:#fff;cursor:pointer;font-family:inherit}
.bt.p{background:linear-gradient(120deg,var(--blue),var(--navy3));color:#fff;border-color:transparent}
.bt.d{border-color:#fecaca;color:#b91c1c;background:#fff5f5}
.bt.g{background:#25d366;color:#fff;border-color:transparent}
.docs a{display:inline-block;font-size:.78rem;color:var(--sky);margin:6px 10px 0 0;font-weight:600}
details summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:.9rem;padding:8px 0;list-style:none}
details summary::before{content:'▸ ';color:var(--mut2)}details[open] summary::before{content:'▾ '}
.enc .ap .ic{background:#f1f5f9;filter:grayscale(1);opacity:.7}
/* indicação */
.ind{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a}
.ind h2{margin-top:0}
.pontos{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.pontos .n{font-family:'DM Serif Display',Georgia,serif;font-size:2.4rem;color:var(--navy);line-height:1}
.pontos .l{font-size:.8rem;color:#78350f}
.pontos .l b{display:block;color:var(--navy);font-size:.95rem}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s}
.pr:hover{border-color:var(--blue);transform:translateY(-1px)}
a.pr{text-decoration:none;color:inherit;display:block}
.pr .e{font-size:1.3rem}.pr .n2{font-weight:700;font-size:.84rem;color:var(--ink);margin-top:2px}.pr .f{font-size:.72rem;color:var(--mut)}
.share{display:none;background:#fff;border:1.5px solid var(--blue100);border-radius:12px;padding:12px;margin-top:10px}
.share.on{display:block}
.share input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.8rem;font-family:inherit;color:var(--mut);margin:8px 0}
.lista .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:.86rem}
.lista .it:first-child{border-top:none}
.lista .it b{color:var(--ink)}.lista .it .m{color:var(--mut);font-size:.78rem}
.sug .pr .n2{color:var(--navy)}
.foot{text-align:center;font-size:.76rem;color:var(--mut);margin-top:30px;line-height:1.7}
.foot a{color:var(--sky);text-decoration:none;font-weight:600}
.erro{max-width:520px;margin:60px auto;padding:24px;text-align:center}
.erro h2{margin-top:0}
.pld{position:fixed;inset:0;background:linear-gradient(150deg,var(--navy2),var(--navy));display:flex;align-items:center;justify-content:center;z-index:99;color:rgba(255,255,255,.7);font-size:.9rem;transition:.4s}
.pld.h{opacity:0;visibility:hidden}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:.84rem;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.toast.on{opacity:1}
@media(max-width:480px){.prods{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="pld" id="pld">Abrindo a sua área...</div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",authDomain:"retorno-seguros.firebaseapp.com",projectId:"retorno-seguros"});
const db=firebase.firestore();
const SITE='https://retornoseguros.com/';
const WA_RET='5554996454300';
const RAMO_ICO={Auto:'🚗',Residencial:'🏠',Vida:'❤️',Empresarial:'🏢',Frota:'🚚','Saúde':'🩺',Dental:'🦷','Vida em Grupo':'👥',Moto:'🏍️',Viagem:'✈️'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{ if(!d) return '-'; const p=String(d).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; };
const dias=d=>{ if(!d) return null; const x=new Date(String(d).slice(0,10)+'T12:00:00'); return Math.round((x-new Date())/86400000); };
const BRL=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
let P=null, TOKEN=null;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }
function copiar(txt){ try{ navigator.clipboard.writeText(txt); toast('Link copiado 👍'); }catch(e){ prompt('Copie o link:',txt); } }

function render(){
  const p=P; const vig=p.apolices.filter(a=>a.vigente), enc=p.apolices.filter(a=>!a.vigente);
  const fechados=p.indicados.filter(i=>i.status==='fechado').length;
  const nivel=fechados>=3?'Embaixador Retorno':fechados>=1?'Indicador Retorno':'Cliente Retorno';
  const ind=p.indicados||[];
  document.getElementById('app').innerHTML=`
  <div class="top"><div class="in">
    <img src="logo-retorno-completa.png" alt="Retorno Seguros" class="logo-site">
    <h1>Olá, ${esc(p.primeiroNome)}!</h1>
    <p>Esta é a sua área na Retorno: suas proteções, ajuda rápida quando precisar e o seu jeito de indicar quem você gosta.</p>
    <span class="pill">⭐ <b>${nivel}</b>${p.pontos?` · ${p.pontos.toLocaleString('pt-BR')} pontos`:''}</span>
  </div></div>
  <div class="wrap">
    <h2>Suas proteções</h2>
    <div class="sub">${vig.length?vig.length+' apólice'+(vig.length>1?'s':'')+' em vigor. Precisou? A ajuda está a um toque.':'Nenhuma apólice em vigor no momento — a Pamela pode montar uma cotação pra você em minutos.'}</div>
    ${vig.map(cardApolice).join('')}
    ${enc.length?`<details class="enc"><summary>Apólices encerradas (${enc.length}) — seu histórico com a Retorno</summary>${enc.map(cardApolice).join('')}</details>`:''}

    <div class="card ind">
      <h2>Indique quem você gosta</h2>
      <div class="sub" style="color:#78350f">É simples: escolha o que a pessoa precisa proteger, mande o link, e a Pamela cuida do resto. Cada proteção fechada por quem você indicou vira pontos aqui — e a pessoa fica <b>pra sempre</b> como indicação sua.</div>
      <div class="pontos"><div class="n">${p.pontos.toLocaleString('pt-BR')}</div><div class="l"><b>${nivel}</b>${ind.length?ind.length+' pessoa'+(ind.length>1?'s':'')+' indicada'+(ind.length>1?'s':'')+' · '+fechados+' proteção'+(fechados!==1?'ões':'')+' fechada'+(fechados!==1?'s':''):'Sua primeira indicação pode ser hoje'}</div></div>
      <div class="prods">
        <div class="pr" onclick="compartilhar('')"><div class="e">🛡️</div><div class="n2">Indicar a Retorno</div><div class="f">Pra quem quer olhar tudo</div></div>
        ${p.produtos.map(pr=>`<div class="pr" onclick="compartilhar('${esc(pr.pagina)}','${esc(pr.nome)}','${esc(pr.frase)}')"><div class="e">${pr.icone}</div><div class="n2">${esc(pr.nome)}</div><div class="f">Pra quem quer ${esc(pr.frase)}</div></div>`).join('')}
      </div>
      <div class="share" id="share">
        <div style="font-size:.84rem;font-weight:700;color:var(--navy)" id="shareT"></div>
        <input type="text" id="shareL" readonly onclick="this.select()">
        <div class="acts" style="margin-top:4px"><a class="bt g" id="shareW" target="_blank">Mandar no WhatsApp</a><button class="bt" onclick="copiar(document.getElementById('shareL').value)">Copiar link</button></div>
      </div>
      ${ind.length?`<h2 style="font-size:1.1rem;margin-top:18px">Suas indicações</h2><div class="card lista" style="margin:0">${ind.map(i=>`<div class="it"><span>${i.status==='fechado'?'🎉':i.status==='perdido'?'⏸️':'💬'}</span><div style="flex:1"><b>${esc(i.nome)}</b><div class="m">${esc(i.produto)}${i.quando?' · '+fmt(i.quando):''}</div></div>${i.status==='fechado'?`<span class="tag ok">Protegido${i.pontos?' · +'+i.pontos.toLocaleString('pt-BR')+' pts':''}</span>`:i.status==='perdido'?'<span class="tag off">Não avançou</span>':'<span class="tag info">Cotando</span>'}</div>`).join('')}</div>`:''}
    </div>

    ${p.sugeridos.length?`<h2>O que você ainda não protege</h2><div class="sub">Você já é da casa — a cotação sai com seus dados preenchidos, sem repetir nada.</div>
      <div class="prods sug">${p.sugeridos.map(s=>`<a class="pr" href="${esc(s.pagina)}?t=${encodeURIComponent(TOKEN)}"><div class="e">${s.icone}</div><div class="n2">${esc(s.nome)}</div><div class="f">Cotar em 2 minutos</div></a>`).join('')}</div>`:''}

    <div class="foot">Retorno Seguros e Benefícios · Passo Fundo - RS e Balneário Camboriú - SC<br>
      <a href="https://wa.me/${WA_RET}" target="_blank">WhatsApp (54) 99645-4300</a> · <a href="${SITE}">retornoseguros.com</a><br>
      <span style="color:var(--mut2)">Este link é seu. Se compartilhar o celular com alguém, peça um link novo para a Retorno.</span></div>
  </div>`;
}
function cardApolice(a){
  const d=dias(a.fim); const tag=a.vigente?(d!=null&&d<=30?`<span class="tag warn">renova em ${d} dia${d!==1?'s':''}</span>`:'<span class="tag ok">em vigor</span>'):`<span class="tag off">${a.status==='renovada'?'renovada':'encerrada'}</span>`;
  const auto=a.ramo==='Auto'||a.ramo==='Frota'||a.ramo==='Moto';
  const q=new URLSearchParams({t:TOKEN,ap:a.id,nome:P.nome,celular:P.whatsapp,cpf:'',placa:a.placa||'',veiculo:[a.veiculo,a.ano].filter(Boolean).join(' ')}).toString();
  const msg=encodeURIComponent('Oi Pamela! Sou '+P.nome+' e quero falar sobre a minha apólice de '+a.ramo+(a.seguradora?' ('+a.seguradora+')':'')+(a.numero?' nº '+a.numero:'')+'.');
  return `<div class="card"><div class="ap"><div class="ic">${RAMO_ICO[a.ramo]||'🛡️'}</div><div>
    <div class="t">${esc(a.ramoOriginal||a.ramo)}${tag}</div>
    <div class="s">${esc(a.seguradora||'')}${a.numero?' · apólice '+esc(a.numero):''}</div>
    <div class="kv">
      <div><span>Vigência</span>${fmt(a.inicio)} a ${fmt(a.fim)}</div>
      ${a.veiculo||a.placa?`<div><span>Veículo</span>${esc(a.veiculo||'')}${a.placa?' · '+esc(a.placa):''}</div>`:''}
      ${a.fipe?`<div><span>Valor FIPE</span>${esc(a.fipe)}</div>`:''}
    </div>
    ${a.docs&&a.docs.length?`<div class="docs">${a.docs.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">📄 ${esc(x.nome)}</a>`).join('')}</div>`:''}
    <div class="acts">
      ${a.vigente&&auto?`<a class="bt d" href="abrir-assistencia.html?${q}">🚨 Assistência 24h</a><a class="bt" href="aviso-sinistro.html?${q}">Avisar sinistro</a>`:''}
      ${a.vigente&&!auto?`<a class="bt d" href="https://wa.me/${WA_RET}?text=${encodeURIComponent('Oi Pamela! Sou '+P.nome+' e preciso acionar a assistência/sinistro da minha apólice de '+a.ramo+(a.numero?' nº '+a.numero:'')+'.')}" target="_blank">🚨 Preciso de ajuda agora</a>`:''}
      <a class="bt" href="https://wa.me/${WA_RET}?text=${msg}" target="_blank">💬 Falar sobre esta apólice</a>
      ${!a.vigente?`<a class="bt p" href="${SITE}${(P.produtos.find(x=>x.ramo===a.ramo)||{}).pagina||'cotacao-auto.html'}?t=${encodeURIComponent(TOKEN)}">Cotar de novo</a>`:''}
    </div></div></div></div>`;
}
function compartilhar(pagina,nome,frase){
  const link=SITE+(pagina||'')+'?ref='+encodeURIComponent(P.codigoIndicacao);
  const p=P.primeiroNome;
  const txt=pagina?('Oi! Sou cliente da Retorno Seguros e lembrei de você pra '+frase+'. A Pamela, consultora deles, monta a proteção certa em uma conversa de 2 minutos — sem enrolação. Esse é o meu link de indicação: '+link)
                  :('Oi! Sou cliente da Retorno Seguros e queria te apresentar. Eles cuidam das minhas proteções com um atendimento que faz diferença. Dá uma olhada pelo meu link: '+link);
  document.getElementById('shareT').textContent=pagina?('Indicar '+nome):'Indicar a Retorno';
  document.getElementById('shareL').value=link;
  document.getElementById('shareW').href='https://wa.me/?text='+encodeURIComponent(txt);
  document.getElementById('share').classList.add('on');
  document.getElementById('share').scrollIntoView({behavior:'smooth',block:'center'});
}
function erro(msg){
  document.getElementById('app').innerHTML=`<div class="erro"><h2>Este link não está mais ativo</h2><p style="color:var(--mut);margin:10px 0 18px">${esc(msg)}</p><a class="bt p" href="https://wa.me/${WA_RET}?text=${encodeURIComponent('Oi! Meu link da área do cliente não abre, pode me mandar um novo?')}">Pedir um link novo no WhatsApp</a></div>`;
  document.getElementById('pld').classList.add('h');
}
(async()=>{
  TOKEN=new URLSearchParams(location.search).get('t');
  if(!TOKEN) return erro('Abra a sua área pelo link que a Retorno te enviou no WhatsApp.');
  try{
    await firebase.auth().signInAnonymously();
    const s=await db.collection('portal_clientes').doc(TOKEN).get();
    if(!s.exists||!s.data().ativo) return erro('Esse link foi substituído ou revogado. Peça um novo para a Retorno — leva um minuto.');
    P=s.data(); P.apolices=P.apolices||[]; P.indicados=P.indicados||[]; P.sugeridos=P.sugeridos||[]; P.produtos=P.produtos||[]; P.pontos=P.pontos||0;
    render(); document.getElementById('pld').classList.add('h');
    try{ sessionStorage.setItem('indicacao_codigo',''); }catch(e){}
  }catch(e){ console.warn(e); erro('Não consegui abrir agora. Tente de novo em instantes.'); }
})();
</script>

<script>
/* Imagens do site controladas pelo CRM (menu "Imagens do site").
   Lê o documento público site/imagens pela API REST do Firestore — sem carregar o SDK. */
(function(){
  var URL='https://firestore.googleapis.com/v1/projects/retorno-seguros/databases/(default)/documents/site/imagens';
  function val(f){ if(!f) return null; if('stringValue' in f) return f.stringValue; if('integerValue' in f) return +f.integerValue; if('doubleValue' in f) return f.doubleValue; if('booleanValue' in f) return f.booleanValue;
    if(f.mapValue){ var o={}; var ff=f.mapValue.fields||{}; for(var k in ff) o[k]=val(ff[k]); return o; } return null; }
  function aplicar(cfg){
    var q=function(s){ return document.querySelector(s); };
    /* logo do menu / cabeçalho */
    var lg=cfg.logo_menu||{};
    document.querySelectorAll('img.logo, .wh-lg, .top img.logo-site').forEach(function(img){
      if(lg.url) img.src=lg.url;
      if(lg.altura) img.style.height=lg.altura+'px';
      if(lg.url||lg.altura) img.style.maxWidth='none';
    });
    /* fundo do topo da home */
    var h=q('.hero'); if(h&&h.dataset.slot==='hero_home'&&cfg.hero_home&&cfg.hero_home.url){
      h.style.backgroundImage='linear-gradient(90deg,rgba(15,23,42,.94) 0%,rgba(15,23,42,.82) 38%,rgba(15,23,42,.35) 70%,rgba(15,23,42,.15) 100%),url("'+cfg.hero_home.url+'")';
      h.style.backgroundSize='cover'; h.style.backgroundPosition=(cfg.hero_home.posicao||'right center'); h.classList.add('com-imagem'); }
    /* fundo do topo das páginas de produto */
    if(h&&h.dataset.slot==='hero_produtos'&&cfg.hero_produtos&&cfg.hero_produtos.url){
      h.style.backgroundImage='linear-gradient(90deg,rgba(15,23,42,.94) 0%,rgba(15,23,42,.8) 45%,rgba(15,23,42,.3) 100%),url("'+cfg.hero_produtos.url+'")';
      h.style.backgroundSize='cover'; h.style.backgroundPosition=(cfg.hero_produtos.posicao||'right center'); }
    /* topo da área do cliente */
    var t=q('.top'); if(t&&cfg.hero_cliente&&cfg.hero_cliente.url){
      t.style.backgroundImage='linear-gradient(90deg,rgba(22,37,78,.95) 0%,rgba(27,44,92,.85) 50%,rgba(30,58,138,.55) 100%),url("'+cfg.hero_cliente.url+'")'; t.style.backgroundSize='cover'; t.style.backgroundPosition='right center'; }
    /* foto da Pamela (cotações) */
    if(cfg.pamela_avatar&&cfg.pamela_avatar.url){ window.AVATAR_URL=cfg.pamela_avatar.url;
      document.querySelectorAll('img.ma, img.wh-av').forEach(function(i){ i.src=cfg.pamela_avatar.url; });
      if(typeof window.__setAvatar==='function') window.__setAvatar(cfg.pamela_avatar.url); }
    /* foto da equipe (Quem somos) */
    if(cfg.pamela_patrick&&cfg.pamela_patrick.url){ document.querySelectorAll('img[src*="pamelapatrick"]').forEach(function(i){ i.src=cfg.pamela_patrick.url; }); }
    window.SITE_IMAGENS=cfg;
  }
  try{ fetch(URL).then(function(r){ return r.ok?r.json():null; }).then(function(d){ if(!d||!d.fields) return; var cfg={}; for(var k in d.fields) cfg[k]=val(d.fields[k]); aplicar(cfg); }).catch(function(){}); }catch(e){}
})();

</script>
</body></html>
