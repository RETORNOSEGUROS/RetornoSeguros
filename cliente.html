<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minha área | Retorno Seguros</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16254e">
<link rel="icon" href="/img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
:root{--navy:#1b2c5c;--navy2:#16254e;--navy3:#1e3a8a;--blue:#3b82f6;--sky:#0284c7;--amber:#f59e0b;--amber2:#fbbf24;--ink:#0f172a;--txt:#1f2a3d;--mut:#64748b;--mut2:#94a3b8;--bg:#f4f7fc;--line:#e2e8f0;--blue50:#eff6ff;--blue100:#dbeafe;--ok:#16a34a;--r:16px;--nav:64px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
a{color:inherit}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--navy)}
h2{font-size:1.4rem;margin:26px 0 4px}
h3{font-size:1.1rem}
.sub{font-size:.88rem;color:var(--mut);margin-bottom:12px}
/* ===== header ===== */
.hd{position:sticky;top:0;z-index:50;background:rgba(22,37,78,.96);backdrop-filter:blur(10px);color:#fff}
.hd .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:60px}
.hd img.logo-site{height:30px;filter:brightness(0) invert(1);opacity:.9}
.hd nav{display:none;gap:4px;margin-left:auto}
.hd nav a{padding:8px 13px;border-radius:20px;font-size:.84rem;font-weight:700;text-decoration:none;color:rgba(255,255,255,.72);transition:.15s}
.hd nav a.on,.hd nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.hd .who{margin-left:auto;text-align:right;font-size:.74rem;color:rgba(255,255,255,.7);line-height:1.25}
.hd .who b{display:block;color:#fff;font-size:.86rem}
@media(min-width:760px){.hd nav{display:flex}.hd .who{margin-left:14px}}
/* bottom nav (mobile) */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,23,42,.06)}
.bn a{flex:1;text-align:center;text-decoration:none;font-size:.64rem;font-weight:700;color:var(--mut);padding:4px 2px;border-radius:12px}
.bn a span{display:block;font-size:1.25rem;line-height:1.2;filter:grayscale(1);opacity:.75}
.bn a.on{color:var(--navy3)}.bn a.on span{filter:none;opacity:1}
@media(min-width:760px){.bn{display:none}body{padding-bottom:40px}}
/* ===== hero ===== */
.hero{background:linear-gradient(120deg,var(--navy2),var(--navy) 60%,var(--navy3));color:#fff;padding:30px 18px 34px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.28),transparent 65%)}
.hero .in{max-width:860px;margin:0 auto;position:relative}
.hero h1{color:#fff;font-size:2rem;line-height:1.12}
.hero p{color:rgba(255,255,255,.8);font-size:.95rem;margin-top:8px;max-width:52ch}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:20px;font-size:.76rem;font-weight:700;margin-top:14px}
.pill b{color:var(--amber2)}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero .st{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 14px;min-width:110px;cursor:pointer}
.hero .st .n{font-family:'DM Serif Display',Georgia,serif;font-size:1.6rem;line-height:1;color:#fff}
.hero .st .l{font-size:.7rem;color:rgba(255,255,255,.75);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
/* ===== layout ===== */
.wrap{max-width:860px;margin:0 auto;padding:6px 14px 40px}
.view{display:none;animation:fade .25s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
/* clima */
.clima{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;border-left:4px solid var(--sky)}
.clima .ic{font-size:2.2rem;line-height:1}
.clima .t{font-weight:800;color:var(--ink);font-size:.95rem}
.clima .d{font-size:.84rem;color:var(--txt);margin-top:3px}
.clima .dias{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.clima .dia{background:var(--bg);border-radius:10px;padding:6px 9px;font-size:.7rem;text-align:center;min-width:52px;color:var(--mut)}
.clima .dia b{display:block;color:var(--ink);font-size:.8rem}
.clima .dia .e{font-size:1rem}
.clima.alerta{border-left-color:var(--amber)}
/* apólice */
.ap{display:grid;grid-template-columns:46px 1fr;gap:12px}
.ap .ic{width:46px;height:46px;border-radius:13px;background:var(--blue50);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.ap .t{font-weight:800;color:var(--ink);font-size:1rem}
.ap .s{font-size:.82rem;color:var(--mut)}
.tag{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 9px;border-radius:6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.ok{background:#ecfdf5;color:var(--ok)}.tag.warn{background:#fffbeb;color:#b45309}.tag.off{background:#f1f5f9;color:var(--mut)}.tag.info{background:var(--blue50);color:var(--sky)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 0;font-size:.82rem}
.kv .fmes{font-size:.7rem;color:var(--mut2);font-weight:400;margin-top:1px}
.kv .fvar{font-size:.72rem;font-weight:700;margin-top:1px}
.kv .fvar.alta{color:var(--ok)}.kv .fvar.baixa{color:#b45309}
.dicafipe{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 11px;font-size:.78rem;color:#78350f;margin-top:8px}
.kv div span{display:block;font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bt{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;font-size:.82rem;font-weight:700;text-decoration:none;border:1.5px solid var(--line);color:var(--navy);background:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.bt:hover{border-color:var(--blue)}
.bt.p{background:linear-gradient(120deg,var(--blue),var(--navy3));color:#fff;border-color:transparent}
.bt.d{border-color:#fecaca;color:#b91c1c;background:#fff5f5}
.bt.g{background:#25d366;color:#fff;border-color:transparent}
.bt.a{background:linear-gradient(120deg,var(--amber),#f97316);color:#fff;border-color:transparent}
.bt.sm{padding:6px 11px;font-size:.76rem}
.bt:disabled{opacity:.55;cursor:default}
.cob{margin-top:8px;background:var(--bg);border-radius:12px;padding:12px 14px}
.cl{display:flex;justify-content:space-between;gap:12px;font-size:.83rem;padding:5px 0;border-bottom:1px dashed var(--line)}
.cl:last-child{border-bottom:none}.cl span{color:var(--mut)}.cl b{color:var(--ink);white-space:nowrap}
.ass{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ai{background:#ecfdf5;color:#065f46;border-radius:20px;padding:4px 11px;font-size:.76rem;font-weight:600}
.cobfoot{font-size:.76rem;color:var(--mut2);margin-top:8px}.cobfoot a{color:var(--sky);font-weight:600}
.docs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.docs a{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--sky);font-weight:700;background:var(--blue50);padding:6px 11px;border-radius:10px;text-decoration:none}
.docs .none{font-size:.78rem;color:var(--mut2)}
.enc .ap .ic{background:#f1f5f9;filter:grayscale(1);opacity:.7}
.enc .card{opacity:.85}
.mini{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mini:first-child{border-top:none;padding-top:0}
.mini .ic{width:40px;height:40px;border-radius:12px;background:var(--blue50);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.mini .t{font-weight:800;color:var(--ink);font-size:.9rem}.mini .s{font-size:.76rem;color:var(--mut)}
/* ofertas (o que ainda não protege) */
.of{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.of{grid-template-columns:1fr}}
.oc{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:.15s}
.oc:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,58,138,.08)}
.oc .e{font-size:1.7rem}
.oc .n{font-weight:800;color:var(--ink);font-size:1rem}
.oc .m{font-size:.84rem;color:var(--txt);flex:1}
.oc .bt{align-self:flex-start;margin-top:6px}
.oc .why{font-size:.7rem;color:var(--sky);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.oc.pj{border-style:dashed}
/* indicação */
.ind{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a}
.pontos{display:flex;align-items:center;gap:16px;margin:8px 0 14px}
.pontos .n{font-family:'DM Serif Display',Georgia,serif;font-size:2.6rem;color:var(--navy);line-height:1}
.pontos .l{font-size:.8rem;color:#78350f}
.pontos .l b{display:block;color:var(--navy);font-size:.95rem}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.prods{grid-template-columns:1fr 1fr 1fr}}
.pr{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;display:block}
.pr:hover{border-color:var(--blue);transform:translateY(-1px)}
.pr .e{font-size:1.3rem}.pr .n2{font-weight:700;font-size:.84rem;color:var(--ink);margin-top:2px}.pr .f{font-size:.72rem;color:var(--mut)}
.share{display:none;background:#fff;border:1.5px solid var(--blue100);border-radius:12px;padding:12px;margin-top:10px}
.share.on{display:block}
.share input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.8rem;font-family:inherit;color:var(--mut);margin:8px 0}
.niveis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.nv{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:.72rem;color:var(--mut)}
.nv b{display:block;color:var(--navy);font-size:.82rem}
.nv.on{border-color:var(--amber);background:#fffdf5}
.nv .e{font-size:1.3rem}
.indi{border-top:1px dashed var(--line);padding:10px 0}
.indi:first-child{border-top:none}
.indi .h{display:flex;align-items:center;gap:10px;cursor:pointer}
.indi .h b{color:var(--ink);flex:1}
.indi .body{display:none;font-size:.82rem;color:var(--txt);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px}
.indi.open .body{display:block}
/* forms */
.f{margin-bottom:12px}
.f label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:.9rem;font-family:inherit;color:var(--ink);background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--blue)}
.f input[readonly]{background:var(--bg);color:var(--mut)}
.f .hint{font-size:.72rem;color:var(--mut2);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:.82rem;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.red.on{background:#b91c1c;border-color:#b91c1c}
.sec{display:none;background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.sec.on{display:block}
.filho{display:grid;grid-template-columns:1fr 150px 36px;gap:8px;margin-bottom:8px;align-items:end}
@media(max-width:480px){.filho{grid-template-columns:1fr 120px 36px}}
.filho button{height:42px;border:1.5px solid #fecaca;background:#fff5f5;color:#b91c1c;border-radius:10px;cursor:pointer;font-weight:800}
/* modal */
.mo{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:90;display:none;align-items:flex-end;justify-content:center;padding:0}
.mo.on{display:flex}
.mo .bx{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 28px;animation:up .25s}
@media(min-width:640px){.mo{align-items:center;padding:20px}.mo .bx{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mo .x{float:right;border:none;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;color:var(--mut)}
.foot{text-align:center;font-size:.76rem;color:var(--mut);margin-top:30px;line-height:1.7}
.foot a{color:var(--sky);text-decoration:none;font-weight:600}
.erro{max-width:520px;margin:60px auto;padding:24px;text-align:center}
.pld{position:fixed;inset:0;background:linear-gradient(150deg,var(--navy2),var(--navy));display:flex;align-items:center;justify-content:center;z-index:99;color:rgba(255,255,255,.7);font-size:.9rem;transition:.4s}
.pld.h{opacity:0;visibility:hidden}
.toast{position:fixed;bottom:calc(var(--nav) + 14px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:.84rem;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:100;white-space:nowrap}
.toast.on{opacity:1}
.ok-box{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:14px;font-size:.88rem;color:#065f46}
.ajuda-sel .mini{cursor:pointer;border-radius:12px;padding:12px;border:1.5px solid var(--line);margin-bottom:8px}
.ajuda-sel .mini.on{border-color:var(--blue);background:var(--blue50)}
.dica{display:flex;gap:10px;font-size:.84rem;padding:8px 0;border-top:1px dashed var(--line)}
.dica:first-child{border-top:none}
</style>
</head>
<body>
<div class="pld" id="pld">Abrindo a sua área...</div>
<div id="app"></div>
<div class="mo" id="mo" onclick="if(event.target===this)fecharModal()"><div class="bx" id="moBx"></div></div>
<div class="toast" id="toast"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",authDomain:"retorno-seguros.firebaseapp.com",projectId:"retorno-seguros"});
const db=firebase.firestore();
const SITE='https://retornoseguros.com/';
const WA_RET='5554996454300';
const RAMO_ICO={Auto:'🚗',Residencial:'🏠',Vida:'❤️',Empresarial:'🏢',Frota:'🚚','Saúde':'🩺',Dental:'🦷','Vida em Grupo':'👥',Moto:'🏍️',Viagem:'✈️'};
const PJ=new Set(['Empresarial','Frota','Saúde','Dental','Vida em Grupo']);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{ if(!d) return '-'; const p=String(d).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; };
const dias=d=>{ if(!d) return null; const x=new Date(String(d).slice(0,10)+'T12:00:00'); return Math.round((x-new Date())/86400000); };
const BRL=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const idadeDe=d=>{ if(!d) return null; const n=new Date(String(d).slice(0,10)+'T12:00:00'); if(isNaN(n)) return null; const h=new Date(); let i=h.getFullYear()-n.getFullYear(); if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate())) i--; return i; };
let P=null, TOKEN=null, PERFIL=null, VIEW='inicio', AJUDA_AP=null;
const NAVS=[['inicio','🏠','Início'],['protecoes','🛡️','Proteções'],['indicar','💛','Indicar'],['perfil','👤','Perfil'],['ajuda','🆘','Ajuda']];
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2400); }
function copiar(txt){ try{ navigator.clipboard.writeText(txt); toast('Link copiado 👍'); }catch(e){ prompt('Copie o link:',txt); } }
function abrirModal(html){ document.getElementById('moBx').innerHTML='<button class="x" onclick="fecharModal()">✕</button>'+html; document.getElementById('mo').classList.add('on'); document.body.style.overflow='hidden'; }
function fecharModal(){ document.getElementById('mo').classList.remove('on'); document.body.style.overflow=''; }
function ir(v){ VIEW=v; location.hash=v; document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v)); document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===v)); window.scrollTo({top:v==='inicio'?0:Math.min(window.scrollY,260),behavior:'smooth'}); }
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(P&&NAVS.some(n=>n[0]===h)&&h!==VIEW) ir(h); });

/* ---------- textos inteligentes ---------- */
const nivelDe=f=>f>=3?'Embaixador Retorno':f>=1?'Indicador Retorno':'Cliente Retorno';
function porqueProteger(s){
  const id=P.idade, tem=new Set(P.apolices.filter(a=>a.vigente).map(a=>a.ramo)); const nome=P.primeiroNome;
  const cid=P.cidade||'';
  switch(s.ramo){
    case 'Vida':
      if(id!=null&&id<30) return {why:'Aos '+id+' anos, o melhor momento',m:'Quanto mais cedo você contrata, menor o preço — e ele fica travado pra vida toda. Aos '+id+' anos, um seguro de vida custa menos do que um lanche por semana.'};
      if(id!=null&&id<46) return {why:'Fase de conquistas',m:nome+', é nessa fase que a família mais depende da sua renda. O seguro de vida garante que quem você ama mantém a vida que vocês construíram — aconteça o que acontecer.'};
      if(id!=null&&id<61) return {why:'Cada ano adiado pesa no preço',m:'Depois dos 45, a idade e a saúde passam a pesar mais na tarifa. Fechar agora garante condições que daqui a alguns anos podem não existir mais.'};
      if(id!=null) return {why:'Feito pra sua fase',m:'Há produtos pensados pra quem já passou dos 60: funeral, assistência e um capital que não deixa a família com contas na hora mais difícil.'};
      return {why:'Quem fica, fica bem',m:'Seguro de vida não é sobre morrer — é sobre quem fica e como fica. Uma conversa de 2 minutos mostra quanto custa dormir tranquilo.'};
    case 'Residencial':
      if(tem.has('Auto')) return {why:'Seu carro está protegido. E a casa?',m:'A casa onde o seu carro dorme costuma valer 10 vezes mais que ele — e o seguro residencial custa uma fração do seguro auto. Vendaval, incêndio, danos elétricos e chaveiro 24h.'};
      return {why:'O seguro mais barato que existe',m:'Casa é onde está tudo o que você mais cuida. Por poucos reais por mês: incêndio, vendaval, roubo, danos elétricos e assistência 24h (chaveiro, encanador, eletricista).'};
    case 'Auto':
      return {why:'Sem surpresa no fim do mês',m:'Uma batida simples custa o que você levaria meses pra juntar. Roubo, colisão, terceiros e guincho 24h — com a franquia que faz sentido pra você.'};
    case 'Empresarial':
      return {why:'Pra quem tem empresa',m:'Se você tem um negócio, o patrimônio dele também merece proteção: incêndio, roubo, equipamentos e responsabilidade civil.'};
    case 'Frota':
      return {why:'Pra quem tem mais de um veículo na empresa',m:'A partir de 2 veículos já vale cotar como frota — costuma sair mais barato do que apólices separadas.'};
    case 'Saúde':
      return {why:'Pra sua empresa',m:'Plano de saúde empresarial a partir de 2 vidas costuma custar menos que o plano individual — e retém a equipe.'};
    case 'Dental':
      return {why:'Pra sua empresa',m:'Plano dental empresarial é o benefício mais barato que existe — e o que o time mais usa.'};

  if(!tem.has('Residencial')) out.push('🏠 <b>'+esc(n)+', sua casa ainda não está protegida com a Retorno.</b> Vendaval e dano elétrico são os sinistros mais comuns no Sul — e o seguro residencial custa poucos reais por mês.');

}

/* ---------- clima (Open-Meteo, gratuito, sem chave) ---------- */
const WMO={0:['☀️','céu limpo'],1:['🌤️','poucas nuvens'],2:['⛅','parcialmente nublado'],3:['☁️','nublado'],45:['🌫️','neblina'],48:['🌫️','neblina'],51:['🌦️','garoa'],53:['🌦️','garoa'],55:['🌧️','garoa forte'],61:['🌧️','chuva fraca'],63:['🌧️','chuva'],65:['🌧️','chuva forte'],66:['🌧️','chuva gelada'],67:['🌧️','chuva gelada'],71:['🌨️','neve'],73:['🌨️','neve'],75:['🌨️','neve'],80:['🌦️','pancadas'],81:['🌧️','pancadas fortes'],82:['⛈️','pancadas violentas'],95:['⛈️','tempestade'],96:['🌩️','tempestade com granizo'],99:['🌩️','tempestade com granizo']};
async function carregarClima(){
  const box=document.getElementById('clima'); if(!box) return;
  const cidade=(P.cidade||'').trim(); if(!cidade){ box.innerHTML=''; return; }
  try{
    let geo=null; try{ geo=JSON.parse(sessionStorage.getItem('geo_'+cidade)||'null'); }catch(e){}
    if(!geo){ const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(cidade)+'&count=5&language=pt&format=json')).json();
      const r=(g.results||[]).find(x=>x.country_code==='BR'&&(!P.estado||(x.admin1||'').toLowerCase().includes(ufNome(P.estado).toLowerCase())))||(g.results||[]).find(x=>x.country_code==='BR'); if(!r) return; geo={lat:r.latitude,lon:r.longitude}; try{ sessionStorage.setItem('geo_'+cidade,JSON.stringify(geo)); }catch(e){} }
    const f=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude='+geo.lat+'&longitude='+geo.lon+'&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max&timezone=America%2FSao_Paulo&forecast_days=5')).json();
    const d=f.daily; if(!d||!d.time) return;
    const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
    let alerta=null;
    d.time.forEach((t,i)=>{ if(alerta) return; const code=d.weathercode[i], chuva=d.precipitation_sum[i]||0, raj=d.wind_gusts_10m_max[i]||0; const dia=i===0?'hoje':i===1?'amanhã':'na '+DIAS[new Date(t+'T12:00:00').getDay()];
      if(code===96||code===99) alerta={ic:'🌩️',t:'Tempestade com risco de granizo '+dia+' em '+cidade,d:'Granizo é o sinistro que mais amassa carro no Sul. Carro coberto, janelas fechadas — e se pegar, avise pela área de Ajuda: a franquia costuma ser reduzida.'};
      else if(raj>=60) alerta={ic:'💨',t:'Rajadas de até '+Math.round(raj)+' km/h '+dia+' em '+cidade,d:'Vento forte derruba telhas, árvores e portões. Recolha o que está solto no pátio e evite estacionar embaixo de árvores.'};
      else if(chuva>=25||code===65||code===82||code===95) alerta={ic:'🌧️',t:'Chuva forte '+dia+' em '+cidade+(chuva?' ('+Math.round(chuva)+' mm)':''),d:'Cuidado com alagamentos: não atravesse água acima do meio da roda. Em casa, tire eletrônicos da tomada se tiver raios.'};
    });
    const tem=new Set(P.apolices.filter(a=>a.vigente).map(a=>a.ramo));
    let cta='';
    if(alerta){ if(!tem.has('Auto')&&!tem.has('Residencial')) cta='<div class="acts"><a class="bt p sm" href="cotacao-residencial.html?t='+encodeURIComponent(TOKEN)+'">Proteger a casa em 2 minutos</a><a class="bt sm" href="cotacao-auto.html?t='+encodeURIComponent(TOKEN)+'">Proteger o carro</a></div>';
      else if(!tem.has('Residencial')) cta='<div class="acts"><a class="bt p sm" href="cotacao-residencial.html?t='+encodeURIComponent(TOKEN)+'">Sua casa está preparada? Cotar residencial</a></div>';
      else cta='<div class="acts"><button class="bt sm" onclick="ir(\'ajuda\')">Se precisar, a ajuda está aqui</button></div>'; }
    const hoje=WMO[d.weathercode[0]]||['🌤️','tempo estável'];
    box.innerHTML=`<div class="card clima ${alerta?'alerta':''}"><div class="ic">${alerta?alerta.ic:hoje[0]}</div><div>
      <div class="t">${alerta?esc(alerta.t):'Tempo tranquilo nos próximos dias em '+esc(cidade)}</div>
      <div class="d">${alerta?esc(alerta.d):esc(P.primeiroNome)+', a gente nunca sabe como o clima vai se comportar — mas dá pra estar preparado. Bom momento pra conferir se suas proteções estão em dia.'}</div>
      <div class="dias">${d.time.map((t,i)=>{ const w=WMO[d.weathercode[i]]||['🌤️','']; return `<div class="dia" title="${w[1]}"><b>${i===0?'hoje':DIAS[new Date(t+'T12:00:00').getDay()]}</b><span class="e">${w[0]}</span>${Math.round(d.temperature_2m_min[i])}°/${Math.round(d.temperature_2m_max[i])}°</div>`; }).join('')}</div>
      ${cta}</div></div>`;
  }catch(e){ console.warn('clima',e); }
}

/* ---------- boot ---------- */
function erro(msg){
  document.getElementById('app').innerHTML=`<div class="erro"><h2>Este link não está mais ativo</h2><p style="color:var(--mut);margin:10px 0 18px">${esc(msg)}</p><a class="bt p" href="https://wa.me/${WA_RET}?text=${encodeURIComponent('Oi! Meu link da área do cliente não abre, pode me mandar um novo?')}">Pedir um link novo no WhatsApp</a></div>`;
  document.getElementById('pld').classList.add('h');
}
(async()=>{
  TOKEN=new URLSearchParams(location.search).get('t');
  if(!TOKEN) return erro('Abra a sua área pelo link que a Retorno te enviou no WhatsApp.');
  try{
    await firebase.auth().signInAnonymously();
    const s=await db.collection('portal_clientes').doc(TOKEN).get();
    if(!s.exists||!s.data().ativo) return erro('Esse link foi substituído ou revogado. Peça um novo para a Retorno — leva um minuto.');
    P=s.data(); P.apolices=P.apolices||[]; P.indicados=P.indicados||[]; P.sugeridos=P.sugeridos||[]; P.produtos=P.produtos||[]; P.pontos=P.pontos||0;
    /* confere a vigência aqui também: uma apólice que venceu ontem não é mais proteção,
       mesmo que o retrato tenha sido gravado quando ela ainda valia */
    P.apolices.forEach(a=>{ const d=dias(a.fim);
      if(a.vigente&&d!=null&&d<0){ a.vigente=false; a.status=a.status==='renovada'?'renovada':'vencida'; } });
    /* e o que ele não tem mais em vigor volta para a lista de sugestões */
    const ativos=new Set(P.apolices.filter(a=>a.vigente).map(a=>a.ramo));
    if(P.produtos.length) P.sugeridos=P.produtos.filter(p=>!ativos.has(p.ramo))
      .map(p=>({ramo:p.ramo,nome:p.nome,pagina:p.pagina,icone:p.icone,frase:p.frase}));
    if(P.idade==null) P.idade=idadeDe(P.nascimento);
    try{ if(P.leadId){ const l=await db.collection('leads_crm').doc(P.leadId).get(); if(l.exists&&l.data().perfilPortal){ PERFIL=l.data().perfilPortal; const t=PERFIL.atualizadoEm; PERFIL.atualizadoEmTxt=t&&t.toDate?t.toDate().toLocaleString('pt-BR'):''; } } }catch(e){}
    const h=location.hash.slice(1); if(NAVS.some(n=>n[0]===h)) VIEW=h;
    render(); document.getElementById('pld').classList.add('h');
    try{ sessionStorage.setItem('indicacao_codigo',''); }catch(e){}
  }catch(e){ console.warn(e); erro('Não consegui abrir agora. Tente de novo em instantes.'); }
})();
</script>

<script>
/* Imagens do site controladas pelo CRM (menu "Imagens do site").
   Lê o documento público site/imagens pela API REST do Firestore — sem carregar o SDK. */
(function(){
  var URL='https://firestore.googleapis.com/v1/projects/retorno-seguros/databases/(default)/documents/site/imagens';
  function val(f){ if(!f) return null; if('stringValue' in f) return f.stringValue; if('integerValue' in f) return +f.integerValue; if('doubleValue' in f) return f.doubleValue; if('booleanValue' in f) return f.booleanValue;
    if(f.mapValue){ var o={}; var ff=f.mapValue.fields||{}; for(var k in ff) o[k]=val(ff[k]); return o; } return null; }
  function aplicar(cfg){
    var q=function(s){ return document.querySelector(s); };
    var lg=cfg.logo_menu||{};
    document.querySelectorAll('img.logo, .wh-lg, img.logo-site').forEach(function(img){
      if(lg.url) img.src=lg.url;
      if(lg.altura) img.style.height=Math.min(lg.altura,40)+'px';
      if(lg.url||lg.altura) img.style.maxWidth='none';
    });
    var t=q('.hero'); if(t&&cfg.hero_cliente&&cfg.hero_cliente.url){
      t.style.backgroundImage='linear-gradient(90deg,rgba(22,37,78,.95) 0%,rgba(27,44,92,.85) 50%,rgba(30,58,138,.55) 100%),url("'+cfg.hero_cliente.url+'")'; t.style.backgroundSize='cover'; t.style.backgroundPosition='right center'; }
    window.SITE_IMAGENS=cfg;
  }
  function tentar(n){ try{ fetch(URL).then(function(r){ return r.ok?r.json():null; }).then(function(d){ if(!d||!d.fields) return; var cfg={}; for(var k in d.fields) cfg[k]=val(d.fields[k]); window.__cfgImgs=cfg; aplicar(cfg); }).catch(function(){}); }catch(e){} }
  tentar();
  /* a página renderiza depois: reaplica quando o app monta */
  var obs=new MutationObserver(function(){ if(window.__cfgImgs&&document.querySelector('.hero')) { aplicar(window.__cfgImgs); } });
  obs.observe(document.getElementById('app'),{childList:true});
})();
</script>
