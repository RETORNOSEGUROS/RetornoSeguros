<body>

<script>
/* =========================================================================
   MOTOR DE COTAÇÃO EM CONVERSA — Retorno Seguros
   Compartilhado por todas as cotações; o roteiro de cada ramo entra em ROTEIRO.
   ========================================================================= */
const firebaseConfig={apiKey:"AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",authDomain:"retorno-seguros.firebaseapp.com",projectId:"retorno-seguros",storageBucket:"retorno-seguros.appspot.com",messagingSenderId:"495712392972",appId:"1:495712392972:web:e1e78aedc48bdeea48db29",measurementId:"G-C6E44WXLPW"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
/* sessão anônima: sem ela o Firestore recusa as ATUALIZAÇÕES do lead (criar é público, atualizar não) */
const authPronta=firebase.auth().signInAnonymously().catch(function(e){ console.warn('auth anon',e); });
const AVATAR='/img/pamelacotacoes.png';
const urlParams=new URLSearchParams(window.location.search);
const indicadorCodigo=urlParams.get('ref')||sessionStorage.getItem('indicacao_codigo')||null;
const empresaParceiraCodigo=urlParams.get('emp')||urlParams.get('codigo')||sessionStorage.getItem('parceiro_codigo')||null;

const formData={nome:'',whatsapp:'',_leadId:null};   /* o roteiro acrescenta os campos dele */

/* ---------- gravação progressiva ---------- */
function dadosLead(extra){
  return Object.assign({
    nome:formData.nome, whatsapp:(formData.whatsapp||'').replace(/\D/g,''),
    ramo:ROTEIRO.ramo, tipo:ROTEIRO.tipo||'individual', origem:'site',
    indicadoPorCodigo:indicadorCodigo?String(indicadorCodigo).toUpperCase():null,
    empresaParceiraCodigo:empresaParceiraCodigo?String(empresaParceiraCodigo).toUpperCase():null,
    atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
  },ROTEIRO.campos(),extra||{});
}
async function salvarProgresso(etapa,acao){
  if(!formData._leadId) return;
  try{ await authPronta;
    await db.collection('leads_crm').doc(formData._leadId).update(dadosLead({etapaSite:etapa,acao:acao||'em_preenchimento'})); }
  catch(e){ console.warn('progresso',e); }
}
async function criarLead(){
  try{ await authPronta;
    const ref=await db.collection('leads_crm').add(dadosLead({
      status:'pre_cadastro', acao:'salvou_whatsapp', etapaSite:'whatsapp',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp() }));
    formData._leadId=ref.id; return true;
  }catch(e){ console.warn('criarLead',e); return false; }
}
async function clicouWhats(){
  try{ if(formData._leadId){ await authPronta; await db.collection('leads_crm').doc(formData._leadId).update({acao:'whatsapp_direto',clicouWhatsapp:true,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()}); } }catch(e){}
  try{ if(window.gtag) gtag('event','clique_whatsapp',{ramo:ROTEIRO.ramo}); }catch(e){}
}

/* ---------- conversa ---------- */
const feed=document.getElementById('feed');
function scrollFim(){ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }
function bolhaPamela(html){ const d=document.createElement('div'); d.className='mi';
  d.innerHTML='<img src="'+AVATAR+'" alt="" class="ma"><div class="mb"><div class="mt">'+html+'</div></div>'; feed.appendChild(d); scrollFim(); }
function bolhaEco(txt){ const d=document.createElement('div'); d.className='me'; d.innerHTML='<div class="meb">'+txt+'</div>'; feed.appendChild(d); scrollFim(); }
function bolhaFato(html){ const d=document.createElement('div'); d.className='fato'; d.innerHTML='<span class="fi">&#128161;</span><span>'+html+'</span>'; feed.appendChild(d); scrollFim(); }
function digitando(ms){ return new Promise(ok=>{ const d=document.createElement('div'); d.className='typing';
  d.innerHTML='<img src="'+AVATAR+'" alt="" class="ma"><div class="tb"><i></i><i></i><i></i></div>'; feed.appendChild(d); scrollFim();
  setTimeout(()=>{ d.remove(); ok(); },ms||900); }); }
let areaAtual=null;
function areaResposta(html){ if(areaAtual) areaAtual.remove(); areaAtual=document.createElement('div'); areaAtual.className='mr'; areaAtual.innerHTML=html; feed.appendChild(areaAtual); scrollFim(); return areaAtual; }
function fecharArea(){ if(areaAtual){ areaAtual.remove(); areaAtual=null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const primeiroNome=()=>esc((formData.nome||'').split(' ')[0]);
function mascaraFone(input){ let v=input.value.replace(/\D/g,''); if(v.length>11)v=v.substring(0,11);
  if(v.length>6)input.value='('+v.substring(0,2)+') '+v.substring(2,7)+'-'+v.substring(7);
  else if(v.length>2)input.value='('+v.substring(0,2)+') '+v.substring(2); else if(v.length>0)input.value='('+v; }
const BRL=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');

/* capítulos + radar */
function marcaCapitulo(passo){
  const alvo=ROTEIRO.capituloDe[passo]||ROTEIRO.capitulos[0].key;
  const ordem=ROTEIRO.capitulos.map(c=>c.key); const i=ordem.indexOf(alvo);
  document.querySelectorAll('.cap').forEach(el=>{ const j=ordem.indexOf(el.dataset.cap); el.classList.toggle('on',j===i); el.classList.toggle('done',j<i); });
}
let radarPts=0;
function radarMais(n){ radarPts=Math.min(ROTEIRO.radarTotal,radarPts+(n==null?1:n));
  const p=Math.round(radarPts/ROTEIRO.radarTotal*100);
  document.getElementById('radar').classList.add('show');
  document.getElementById('radarFill').style.width=p+'%'; document.getElementById('radarPct').textContent=p+'%'; }
let etapaAtual='nome';
async function passo(nome){ etapaAtual=nome; marcaCapitulo(nome); await PASSOS[nome](); }

/* ---------- respostas padrão ---------- */
/* botão-cartão: opcoes=[{v,t,s,rec,pts}] */
function opcoes(campo,proximo,lista,cols){
  return '<div class="og'+(cols===2?' c2':cols===3?' c3':'')+'">'+lista.map(o=>
    '<div class="oc'+(o.rec?' rec':'')+'" onclick="respOpcao(\''+campo+'\',\''+o.v+'\',\''+String(o.t).replace(/'/g,'')+'\',\''+proximo+'\','+(o.pts==null?1:o.pts)+')">'+
    (o.i?'<div class="oi">'+o.i+'</div>':'')+'<div class="ott">'+o.t+'</div>'+(o.s?'<div class="os">'+o.s+'</div>':'')+'</div>').join('')+'</div>';
}
function respOpcao(campo,valor,eco,proximo,pts){
  formData[campo]=valor; fecharArea(); bolhaEco(eco); radarMais(pts); salvarProgresso(campo);

    bolhaPamela('<strong>Cenário 4:</strong> um cliente <strong>escorrega no piso molhado</strong> da sua loja e quebra o braço. Ou um funcionário derruba um equipamento na casa do cliente. O prejuízo dele é <em>sua</em> responsabilidade.');
    bolhaFato('A <b>responsabilidade civil empresarial</b> paga danos a clientes, visitantes e terceiros causados pela operação — inclusive defesa judicial. É a cobertura que protege o caixa da empresa de um processo.');
    areaCobertura('rcEmpresarial','lucrosCessantes','Responsabilidade civil');
  },
  async lucrosCessantes(){
    await digitando(1000);
    bolhaPamela('<strong>Cenário 5:</strong> depois do incêndio, o seguro reconstrói tudo — mas a empresa fica <strong>3 meses fechada</strong>. Aluguel, folha, parcelas e impostos não param.');
    bolhaFato('<b>Despesas fixas / lucros cessantes</b> paga as contas do período parado e o lucro que deixou de entrar. É a diferença entre reabrir e fechar de vez — e quase ninguém contrata porque ninguém explica.');
    areaCobertura('lucrosCessantes','cnpj','Despesas fixas / lucros cessantes');
  },
  async cnpj(){
    await digitando(900);
    bolhaPamela('Última coisa: o <strong>CNPJ</strong>. A seguradora cota pela atividade registrada — sem ele não sai preço.');
    areaTexto('inCnpj','00.000.000/0000-00','Enviar &rarr;',v=>{ formData.cnpj=v; fecharArea(); bolhaEco('CNPJ '+esc(v)); radarMais(1); salvarProgresso('cnpj'); passo('fim'); },
      {inputmode:'numeric',mascara:mascaraCnpj,valida:v=>v.replace(/\D/g,'').length===14});
  }
});
function respPredio(){ formData.objetos.predio=formData.predioProprio==='sim'; passo(formData.predioProprio==='sim'?'predioValor':'equipamentos'); }
function respTemApolice(){ passo(formData.temApolice==='sim'?'vencimento':'sinistro'); }
function mascaraCnpj(i){ let v=i.value.replace(/\D/g,'').slice(0,14);
  if(v.length>12) v=v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  else if(v.length>8) v=v.replace(/(\d{2})(\d{3})(\d{3})(\d{0,4})/,'$1.$2.$3/$4');
  else if(v.length>5) v=v.replace(/(\d{2})(\d{3})(\d{0,3})/,'$1.$2.$3');
  else if(v.length>2) v=v.replace(/(\d{2})(\d{0,3})/,'$1.$2');
  i.value=v; }

</script>
