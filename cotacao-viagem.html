<script>
/* =========================================================================
   MOTOR DE COTAÇÃO EM CONVERSA — Retorno Seguros
   Compartilhado por todas as cotações; o roteiro de cada ramo entra em ROTEIRO.
   ========================================================================= */
const firebaseConfig={apiKey:"AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",authDomain:"retorno-seguros.firebaseapp.com",projectId:"retorno-seguros",storageBucket:"retorno-seguros.appspot.com",messagingSenderId:"495712392972",appId:"1:495712392972:web:e1e78aedc48bdeea48db29",measurementId:"G-C6E44WXLPW"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
/* sessão anônima: sem ela o Firestore recusa as ATUALIZAÇÕES do lead (criar é público, atualizar não) */
const authPronta=firebase.auth().signInAnonymously().catch(function(e){ console.warn('auth anon',e); });
let AVATAR='/img/pamelacotacoes.png'; window.__setAvatar=function(u){ AVATAR=u; };
const urlParams=new URLSearchParams(window.location.search);
const indicadorCodigo=urlParams.get('ref')||sessionStorage.getItem('indicacao_codigo')||null;
const empresaParceiraCodigo=urlParams.get('emp')||urlParams.get('codigo')||sessionStorage.getItem('parceiro_codigo')||null;

const formData={nome:'',whatsapp:'',_leadId:null};   /* o roteiro acrescenta os campos dele */

/* ---------- gravação progressiva ---------- */
function dadosLead(extra){
  return Object.assign({
    nome:formData.nome, whatsapp:(formData.whatsapp||'').replace(/\D/g,''),
    ramo:ROTEIRO.ramo, tipo:ROTEIRO.tipo||'individual', origem:'site',
    indicadoPorCodigo:indicadorCodigo?String(indicadorCodigo).toUpperCase():null,
    clienteLeadId:formData._clienteLeadId||null, viaPortal:!!formData._clienteLeadId,
    indicadoPorEmpresaCodigo:(EMPRESA_IND&&EMPRESA_IND.codigo)||null,
    indicadoPorEmpresaNome:(EMPRESA_IND&&EMPRESA_IND.nome)||null,
    indicadoPorEmpresaId:(EMPRESA_IND&&EMPRESA_IND.empresaId)||null,
    empresaParceiraCodigo:empresaParceiraCodigo?String(empresaParceiraCodigo).toUpperCase():null,
    atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
  },ROTEIRO.campos(),extra||{});
}
async function salvarProgresso(etapa,acao){
  if(!formData._leadId) return;
  try{ await authPronta;
    await db.collection('leads_crm').doc(formData._leadId).update(dadosLead({etapaSite:etapa,acao:acao||'em_preenchimento'})); }
  catch(e){ console.warn('progresso',e); }
}
async function criarLead(){
  try{ await authPronta;
    const ref=await db.collection('leads_crm').add(dadosLead({
      status:'pre_cadastro', acao:'salvou_whatsapp', etapaSite:'whatsapp',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp() }));
    formData._leadId=ref.id; return true;
  }catch(e){ console.warn('criarLead',e); return false; }
}
async function clicouWhats(){
  try{ if(formData._leadId){ await authPronta; await db.collection('leads_crm').doc(formData._leadId).update({acao:'whatsapp_direto',clicouWhatsapp:true,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()}); } }catch(e){}
  try{ if(window.gtag) gtag('event','clique_whatsapp',{ramo:ROTEIRO.ramo}); }catch(e){}
}

/* ---------- conversa ---------- */
const feed=document.getElementById('feed');
function scrollFim(){ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }
function bolhaPamela(html){ const d=document.createElement('div'); d.className='mi';
  d.innerHTML='<img src="'+AVATAR+'" alt="" class="ma"><div class="mb"><div class="mt">'+html+'</div></div>'; feed.appendChild(d); scrollFim(); }
function bolhaEco(txt){ const d=document.createElement('div'); d.className='me'; d.innerHTML='<div class="meb">'+txt+'</div>'; feed.appendChild(d); scrollFim(); }
function bolhaFato(html){ const d=document.createElement('div'); d.className='fato'; d.innerHTML='<span class="fi">&#128161;</span><span>'+html+'</span>'; feed.appendChild(d); scrollFim(); }
function digitando(ms){ return new Promise(ok=>{ const d=document.createElement('div'); d.className='typing';
  d.innerHTML='<img src="'+AVATAR+'" alt="" class="ma"><div class="tb"><i></i><i></i><i></i></div>'; feed.appendChild(d); scrollFim();
  setTimeout(()=>{ d.remove(); ok(); },ms||900); }); }
let areaAtual=null;
function areaResposta(html){ if(areaAtual) areaAtual.remove(); areaAtual=document.createElement('div'); areaAtual.className='mr'; areaAtual.innerHTML=html; feed.appendChild(areaAtual); scrollFim(); return areaAtual; }
function fecharArea(){ if(areaAtual){ areaAtual.remove(); areaAtual=null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const primeiroNome=()=>esc((formData.nome||'').split(' ')[0]);
function mascaraFone(input){ let v=input.value.replace(/\D/g,''); if(v.length>11)v=v.substring(0,11);
  if(v.length>6)input.value='('+v.substring(0,2)+') '+v.substring(2,7)+'-'+v.substring(7);
  else if(v.length>2)input.value='('+v.substring(0,2)+') '+v.substring(2); else if(v.length>0)input.value='('+v; }
const BRL=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');

/* capítulos + radar */
function marcaCapitulo(passo){
  const alvo=ROTEIRO.capituloDe[passo]||ROTEIRO.capitulos[0].key;
  const ordem=ROTEIRO.capitulos.map(c=>c.key); const i=ordem.indexOf(alvo);
  document.querySelectorAll('.cap').forEach(el=>{ const j=ordem.indexOf(el.dataset.cap); el.classList.toggle('on',j===i); el.classList.toggle('done',j<i); });
}
let radarPts=0;
function radarMais(n){ radarPts=Math.min(ROTEIRO.radarTotal,radarPts+(n==null?1:n));
  const p=Math.round(radarPts/ROTEIRO.radarTotal*100);
  document.getElementById('radar').classList.add('show');
  document.getElementById('radarFill').style.width=p+'%'; document.getElementById('radarPct').textContent=p+'%'; }
let etapaAtual='nome';
async function passo(nome){ etapaAtual=nome; marcaCapitulo(nome); await PASSOS[nome](); }

/* ---------- respostas padrão ---------- */
/* botão-cartão: opcoes=[{v,t,s,rec,pts}] */
function opcoes(campo,proximo,lista,cols){

  mensagemWhats(){ const c=formData.coberturas; const ativas=['dmh'].concat(Object.keys(c).filter(k=>c[k].ativo)).map(k=>COB_ROT[k]).filter(Boolean);
    const linhas=['Olá Pamela! Sou *'+formData.nome+'* — acabei de montar minha cotação de seguro viagem no site.','',

const TIPO_ROT={lazer:'Lazer / turismo',trabalho:'Trabalho / negócios',estudo:'Intercâmbio / estudo',mochilao:'Mochilão / longa duração',visita:'Visitar família'};
const DMH_ROT={'30':'US$ 30 mil','60':'US$ 60 mil','100':'US$ 100 mil','250':'US$ 250 mil+','nao_sei':'A definir com a Pamela'};
function fmtBr(d){ if(!d) return ''; const p=String(d).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; }
function diasEntre(ida,volta){ const a=new Date(ida+'T12:00:00'), b=new Date(volta+'T12:00:00'); if(isNaN(a)||isNaN(b)) return 0; return Math.max(0,Math.round((b-a)/86400000)+1); }
function parseData(v){ const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!m) return null; const a=+m[3],mm=+m[2],d=+m[1]; if(mm<1||mm>12||d<1||d>31) return null; return a+'-'+String(mm).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function maskData(i){ let v=i.value.replace(/\D/g,'').slice(0,8); if(v.length>4) v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4); else if(v.length>2) v=v.slice(0,2)+'/'+v.slice(2); i.value=v; }

/* ---------- BUSCA DE PAÍSES (digita e escolhe, quantos quiser) ---------- */
function vgDestinosArea(){
  vgInjectCSS();
  areaResposta(
    '<div class="ig"><div class="vgac">'+
      '<input type="text" class="if" id="inPais" placeholder="Digite o país... ex.: Alemanha" autocomplete="off">'+
      '<div class="vgac-list" id="paisList"></div>'+
    '</div></div>'+
    '<div class="vgchips" id="paisChips"></div>'+
    '<div class="br"><button class="bn bp" id="btDest" disabled onclick="vgConfirmDestinos()">Continuar &rarr;</button></div>'+
    '<div class="selo" id="destSelo">&#128161; Comece a digitar e escolha o país. Pode adicionar quantos quiser.</div>');
  const inp=document.getElementById('inPais');
  inp.addEventListener('input',()=>vgFiltraPais(inp.value));
  inp.addEventListener('focus',()=>vgFiltraPais(inp.value));
  inp.addEventListener('keydown',e=>{
    const lst=document.getElementById('paisList'); const its=[...lst.querySelectorAll('.vgac-item')];
    let hi=its.findIndex(x=>x.classList.contains('hl'));
    if(e.key==='ArrowDown'){ e.preventDefault(); if(its.length){ if(hi>=0)its[hi].classList.remove('hl'); hi=(hi+1)%its.length; its[hi].classList.add('hl'); its[hi].scrollIntoView({block:'nearest'}); } }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(its.length){ if(hi>=0)its[hi].classList.remove('hl'); hi=(hi<=0?its.length-1:hi-1); its[hi].classList.add('hl'); its[hi].scrollIntoView({block:'nearest'}); } }
    else if(e.key==='Enter'){ e.preventDefault(); const alvo=hi>=0?its[hi]:its[0]; if(alvo) vgAddPais(alvo.dataset.n); }
  });
  document.addEventListener('click',vgFechaLista);
  vgRenderChips();
  inp.focus();
}
function vgFechaLista(e){ const ac=document.querySelector('.vgac'); if(ac&&!ac.contains(e.target)){ const l=document.getElementById('paisList'); if(l)l.classList.remove('on'); } }
function vgFiltraPais(q){
  const lst=document.getElementById('paisList'); if(!lst) return;
  const nq=norm(q); const sel=formData.destinosLista||[];
  let matches=PAISES.filter(p=>!sel.includes(p.n)).filter(p=>!nq||norm(p.n).indexOf(nq)>=0);
  matches=matches.slice(0,8);
  if(!matches.length){ lst.innerHTML='<div class="vgac-empty">'+(nq?'Não achei esse país — pode escrever assim mesmo e a Pamela confirma.':'Digite o nome do país')+'</div>'; lst.classList.add('on'); return; }
  const tag={europa:'Europa',norte:'Am. do Norte',sul:'Am. do Sul',asia:'Ásia',africa:'África',oceania:'Oceania',brasil:'Brasil',mundo:'Mundo'};
  lst.innerHTML=matches.map(p=>'<div class="vgac-item" data-n="'+esc(p.n)+'" onclick="vgAddPais(\''+esc(p.n).replace(/'/g,'&#39;')+'\')">&#128205; '+esc(p.n)+'<span class="vgac-tag">'+(p.eu?'Schengen':(tag[p.r]||''))+'</span></div>').join('');
  lst.classList.add('on');
}
function vgAddPais(nome){
  formData.destinosLista=formData.destinosLista||[];
  if(!formData.destinosLista.includes(nome)) formData.destinosLista.push(nome);
  const inp=document.getElementById('inPais'); if(inp){ inp.value=''; inp.focus(); }
  vgFiltraPais(''); vgRenderChips();
}
function vgRemovePais(nome){
  formData.destinosLista=(formData.destinosLista||[]).filter(n=>n!==nome);
  vgRenderChips(); vgFiltraPais((document.getElementById('inPais')||{}).value||'');
}
function vgRenderChips(){
  const box=document.getElementById('paisChips'); if(!box) return;
  const sel=formData.destinosLista||[];
  box.innerHTML=sel.map(n=>'<span class="vgchip">&#127758; '+esc(n)+' <button type="button" onclick="vgRemovePais(\''+esc(n).replace(/'/g,'&#39;')+'\')" aria-label="remover">&times;</button></span>').join('');
  const bt=document.getElementById('btDest'); if(bt) bt.disabled=!sel.length;
  // Schengen / EUA no radar
  const objs=PAISES.filter(p=>sel.includes(p.n));
  const temEuropa=objs.some(p=>p.eu); const temEua=objs.some(p=>p.na);
  const selo=document.getElementById('destSelo');
  if(selo){
    if(temEuropa) selo.innerHTML='&#127466;&#127482; Tem destino na <b>Europa (Schengen)</b> — exige cobertura médica mínima de <b>US$ 30 mil (€30 mil)</b>. Já deixo isso no radar.';
    else if(temEua) selo.innerHTML='&#127482;&#127480; Destino nos <b>EUA/Caribe</b> — atendimento médico caríssimo lá. Vou sugerir uma cobertura mais robusta.';
    else if(sel.length) selo.innerHTML='&#9989; '+sel.length+' destino(s) selecionado(s). Pode adicionar mais ou seguir.';
    else selo.innerHTML='&#128161; Comece a digitar e escolha o país. Pode adicionar quantos quiser.';
  }
}
function vgConfirmDestinos(){
  const sel=formData.destinosLista||[]; if(!sel.length) return;
  const objs=PAISES.filter(p=>sel.includes(p.n));
  formData.temEuropa=objs.some(p=>p.eu); formData.temEua=objs.some(p=>p.na);
  formData.destinos=sel.join(', ');
  document.removeEventListener('click',vgFechaLista);
  fecharArea(); bolhaEco('&#127757; '+esc(formData.destinos)); radarMais(1); salvarProgresso('destinos'); passo('cruzeiro');
}

const FAIXAS=[{k:'f0a49',t:'De 0 a 49 anos'},{k:'f50a69',t:'De 50 a 69 anos'},{k:'f70a85',t:'De 70 a 85 anos'}];
function vgTotalPax(){ const p=formData.paxFaixas; return (p.f0a49||0)+(p.f50a69||0)+(p.f70a85||0); }
function vgFaixasTxt(){ const p=formData.paxFaixas; const r=[]; if(p.f0a49)r.push(p.f0a49+'× 0–49'); if(p.f50a69)r.push(p.f50a69+'× 50–69'); if(p.f70a85)r.push(p.f70a85+'× 70–85'); return r.join(' · '); }
function vgViajantesArea(){
  vgInjectCSS();
  areaResposta(
    '<div class="vgnote">&#128100; Conte todos que vão viajar, pela <b>idade no desembarque no Brasil</b> (fim da viagem)</div>'+
    FAIXAS.map(f=>'<div class="vgcnt"><div class="vgcnt-l">'+f.t+'</div><div class="vgcnt-c">'+
      '<button class="vgcnt-b" id="m_'+f.k+'" onclick="vgPax(\''+f.k+'\',-1)" disabled>&minus;</button>'+
      '<span class="vgcnt-n" id="n_'+f.k+'">0</span>'+
      '<button class="vgcnt-b" onclick="vgPax(\''+f.k+'\',1)">+</button></div></div>').join('')+
    '<div class="br"><button class="bn bp" id="btPax" disabled onclick="vgConfirmPax()">Continuar &rarr;</button></div>'+
    '<div class="selo" id="paxSelo">&#128161; A partir dos 70 anos a tarifa muda — por isso separo as faixas.</div>');
  FAIXAS.forEach(f=>document.getElementById('n_'+f.k).textContent=formData.paxFaixas[f.k]||0);
  vgPaxSync();

function vgPax(k,d){
  formData.paxFaixas[k]=Math.max(0,Math.min(30,(formData.paxFaixas[k]||0)+d));
  document.getElementById('n_'+k).textContent=formData.paxFaixas[k];
  vgPaxSync();
}
function vgPaxSync(){
  FAIXAS.forEach(f=>{ const m=document.getElementById('m_'+f.k); if(m) m.disabled=!(formData.paxFaixas[f.k]>0); });
  const tot=vgTotalPax();
  const bt=document.getElementById('btPax'); if(bt) bt.disabled=tot<1;
  const selo=document.getElementById('paxSelo');
  if(selo){
    if(tot>0) selo.innerHTML='&#9989; '+tot+' viajante'+(tot>1?'s':'')+(formData.paxFaixas.f70a85>0?' · com 70+ a bordo, já filtro as seguradoras certas':'');
    else selo.innerHTML='&#128161; A partir dos 70 anos a tarifa muda — por isso separo as faixas.';
  }
}
function vgConfirmPax(){
  const tot=vgTotalPax(); if(tot<1) return;
  formData.qtdViajantes=tot; formData.viajantesFaixas=vgFaixasTxt();
  formData.temIdoso=(formData.paxFaixas.f50a69>0||formData.paxFaixas.f70a85>0);
  fecharArea();
  bolhaEco('&#128101; '+tot+' viajante'+(tot>1?'s':'')+(formData.viajantesFaixas?' ('+formData.viajantesFaixas+')':''));
  if(formData.paxFaixas.f70a85>0) bolhaFato('Anotado. Para <b>70+</b> algumas seguradoras pedem um adicional, mas há ótimas opções — eu já filtro as que melhor atendem essa idade pra você.');
  radarMais(1); salvarProgresso('viajantes'); passo('whatsapp');
}

<script>
/* Imagens do site controladas pelo CRM (menu "Imagens do site").
   Lê o documento público site/imagens pela API REST do Firestore — sem carregar o SDK. */
(function(){
  var URL='https://firestore.googleapis.com/v1/projects/retorno-seguros/databases/(default)/documents/site/imagens';
  function val(f){ if(!f) return null; if('stringValue' in f) return f.stringValue; if('integerValue' in f) return +f.integerValue; if('doubleValue' in f) return f.doubleValue; if('booleanValue' in f) return f.booleanValue;
    if(f.mapValue){ var o={}; var ff=f.mapValue.fields||{}; for(var k in ff) o[k]=val(ff[k]); return o; } return null; }
  function aplicar(cfg){
    var q=function(s){ return document.querySelector(s); };
    /* logo do menu / cabeçalho */
    var lg=cfg.logo_menu||{};
    document.querySelectorAll('img.logo, .wh-lg, .top img.logo-site').forEach(function(img){
      if(lg.url) img.src=lg.url;
      if(lg.altura) img.style.height=lg.altura+'px';
      if(lg.url||lg.altura) img.style.maxWidth='none';
    });
    /* fundo do topo da home */
    var h=q('.hero'); if(h&&h.dataset.slot==='hero_home'&&cfg.hero_home&&cfg.hero_home.url){
      h.style.backgroundImage='linear-gradient(90deg,rgba(15,23,42,.94) 0%,rgba(15,23,42,.82) 38%,rgba(15,23,42,.35) 70%,rgba(15,23,42,.15) 100%),url("'+cfg.hero_home.url+'")';
      h.style.backgroundSize='cover'; h.style.backgroundPosition=(cfg.hero_home.posicao||'right center'); h.classList.add('com-imagem'); }
    /* fundo do topo das páginas de produto */
    if(h&&h.dataset.slot==='hero_produtos'&&cfg.hero_produtos&&cfg.hero_produtos.url){
      h.style.backgroundImage='linear-gradient(90deg,rgba(15,23,42,.94) 0%,rgba(15,23,42,.8) 45%,rgba(15,23,42,.3) 100%),url("'+cfg.hero_produtos.url+'")';
      h.style.backgroundSize='cover'; h.style.backgroundPosition=(cfg.hero_produtos.posicao||'right center'); }
    /* topo da área do cliente */
    var t=q('.top'); if(t&&cfg.hero_cliente&&cfg.hero_cliente.url){
      t.style.backgroundImage='linear-gradient(90deg,rgba(22,37,78,.95) 0%,rgba(27,44,92,.85) 50%,rgba(30,58,138,.55) 100%),url("'+cfg.hero_cliente.url+'")'; t.style.backgroundSize='cover'; t.style.backgroundPosition='right center'; }
    /* foto da Pamela (cotações) */
    if(cfg.pamela_avatar&&cfg.pamela_avatar.url){ window.AVATAR_URL=cfg.pamela_avatar.url;
      document.querySelectorAll('img.ma, img.wh-av').forEach(function(i){ i.src=cfg.pamela_avatar.url; });
      if(typeof window.__setAvatar==='function') window.__setAvatar(cfg.pamela_avatar.url); }
    /* foto da equipe (Quem somos) */
    if(cfg.pamela_patrick&&cfg.pamela_patrick.url){ document.querySelectorAll('img[src*="pamelapatrick"]').forEach(function(i){ i.src=cfg.pamela_patrick.url; }); }
    window.SITE_IMAGENS=cfg;
  }
  try{ fetch(URL).then(function(r){ return r.ok?r.json():null; }).then(function(d){ if(!d||!d.fields) return; var cfg={}; for(var k in d.fields) cfg[k]=val(d.fields[k]); aplicar(cfg); }).catch(function(){}); }catch(e){}
})();

</script>
