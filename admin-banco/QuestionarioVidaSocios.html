<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cotação | Vida Sócios · Retorno Seguros</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --azul-fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --texto:#e8eeff; --suave:#93a4c8; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--azul-fundo); color:var(--texto); min-height:100vh; min-height:100dvh; overflow-x:hidden; }
  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .fumaca span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.45; animation:flutuar 22s ease-in-out infinite; }
  .f1 { width:56vw; height:56vw; background:radial-gradient(circle,#1e40af,transparent 70%); top:-14%; left:-12%; }
  .f2 { width:46vw; height:46vw; background:radial-gradient(circle,#0ea5e9,transparent 70%); bottom:-16%; right:-10%; animation-delay:-7s; }
  @keyframes flutuar { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(4vw,-3vh) scale(1.1);} 66%{transform:translate(-3vw,4vh) scale(.95);} }
  .grao { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035; background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:3px 3px; }
  .palco { position:relative; z-index:2; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; justify-content:safe center; padding:70px 22px calc(96px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; }
  .marca { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.22em; color:#4b5f8a; font-weight:700; z-index:3; text-transform:uppercase; }
  .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--ciano),var(--dourado)); z-index:5; transition:width .5s cubic-bezier(.4,0,.2,1); width:0; box-shadow:0 0 12px rgba(56,189,248,.6); }
  .cena { width:100%; animation:entra .55s cubic-bezier(.16,1,.3,1); }
  @keyframes entra { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:none;} }
  .rotulo { font-size:11px; letter-spacing:.18em; color:var(--ciano); font-weight:700; text-transform:uppercase; margin-bottom:14px; }
  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--ciano); vertical-align:text-bottom; margin-left:2px; animation:pisca .85s step-end infinite; }
  @keyframes pisca { 50%{opacity:0;} }
  .qbolha { background:rgba(13,32,68,.72); border:1px solid rgba(99,132,190,.3); border-left:3px solid rgba(56,189,248,.55); border-radius:4px 16px 16px 4px; padding:15px 18px; margin-bottom:10px; font-size:15px; line-height:1.6; color:#d7e1f7; max-width:88%; }
  .qbolha strong { color:#fff; font-weight:600; }
  .qresp { background:linear-gradient(135deg,rgba(56,189,248,.24),rgba(37,99,235,.2)); border:1px solid rgba(56,189,248,.45); border-left:1px solid rgba(56,189,248,.45); border-right:3px solid rgba(56,189,248,.75); border-radius:16px 4px 4px 16px; margin-left:auto; margin-bottom:18px; color:#fff; font-weight:500; }
  .qbolha.qresp::before { content:'você'; display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(191,219,254,.75); font-weight:700; margin-bottom:3px; }
  .zona { margin-top:22px; opacity:0; transform:translateY(10px); transition:all .5s; }
  .zona.on { opacity:1; transform:none; }
  .opcoes { display:flex; gap:11px; flex-wrap:wrap; }
  .op { flex:1; min-width:150px; padding:15px 17px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.05); border:1.5px solid rgba(147,164,200,.28); color:var(--texto); font-size:14.5px; font-weight:600; font-family:inherit; transition:all .22s; text-align:center; animation:pulsar 2.6s ease-in-out infinite; }
  .op:hover,.op:focus { background:rgba(56,189,248,.14); border-color:var(--ciano); transform:translateY(-2px); outline:none; }
  @keyframes pulsar { 0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.28);} 50%{box-shadow:0 0 0 7px rgba(56,189,248,0);} }
  .op:nth-child(2){animation-delay:.2s;} .op:nth-child(3){animation-delay:.4s;} .op:nth-child(4){animation-delay:.6s;}
  .opcoes.muitas { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:9px; }
  .opcoes.muitas .op { animation:none; padding:12px 13px; font-size:13.5px; min-width:0; }
  .opcoes.lista { flex-direction:column; }
  .opcoes.lista .op { animation:none; text-align:left; min-width:0; }
  .op.sel { background:rgba(56,189,248,.2); border-color:var(--ciano); animation:none; }
  .op.sel::after { content:' ✓'; color:var(--ciano); }
  .selo-sug { font-size:9px; background:rgba(52,211,153,.2); color:#6ee7b7; border:1px solid rgba(52,211,153,.4); padding:1px 6px; border-radius:100px; font-weight:700; margin-left:6px; vertical-align:middle; text-transform:uppercase; letter-spacing:.06em; }
  .alt { display:block; margin-top:7px; margin-left:auto; background:none; border:none; font-family:inherit; font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; color:rgba(255,255,255,.6); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px; }
  .alt:hover { color:#fff; }
  .campo { width:100%; padding:15px 17px; border-radius:14px; font-size:16px; font-family:inherit; background:rgba(255,255,255,.05); border:1.5px solid rgba(147,164,200,.28); color:#fff; transition:all .22s; }
  .campo:focus { outline:none; border-color:var(--ciano); background:rgba(56,189,248,.1); }
  .campo::placeholder { color:#5d6f95; }
  .aviso { font-size:11.5px; color:#fca5a5; margin-top:5px; display:none; }
  .aviso.on { display:block; }
  .btn { padding:15px 28px; border-radius:14px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--ciano),#2563eb); color:#031127; font-size:15px; font-weight:800; font-family:inherit; transition:all .22s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(56,189,248,.32); }
  .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ouro { background:linear-gradient(135deg,var(--dourado),#f59e0b); color:#2a1a00; }
  .lbl { font-size:12.5px; color:var(--suave); font-weight:600; margin-bottom:7px; display:block; }
  .nota { font-size:11.5px; color:#7b8db3; line-height:1.55; margin-top:10px; }
  .socio-card { background:rgba(255,255,255,.035); border:1px solid rgba(147,164,200,.2); border-radius:14px; padding:16px; margin-top:14px; }
  .socio-t { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dourado); font-weight:700; margin-bottom:12px; }
  .fim { text-align:center; padding:20px 0; }
  .fim .ico { font-size:56px; margin-bottom:14px; }
  .prox { text-align:left; background:rgba(255,255,255,.04); border:1px solid rgba(147,164,200,.16); border-radius:12px; padding:16px 18px; margin-top:18px; }
  .prox b { color:#fff; font-weight:650; display:block; margin-bottom:8px; font-size:14px; }
  .prox ul { list-style:none; }
  .prox li { font-size:13px; color:#c3d0ec; line-height:1.6; padding-left:20px; position:relative; margin-bottom:5px; }
  .prox li::before { content:'→'; position:absolute; left:0; color:var(--ciano); }
  @media (max-width:520px) { .palco{padding:22px 18px calc(88px + env(safe-area-inset-bottom));} .op{min-width:100%;} .qbolha{max-width:100%;} }
</style>
</head>
<body>
<div class="fumaca"><span class="f1"></span><span class="f2"></span></div>
<div class="grao"></div>
<div class="progresso" id="prog"></div>
<div class="marca">Retorno Seguros</div>
<div class="palco"><div id="palco"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   COTAÇÃO — VIDA SÓCIOS (Pessoa Chave / Resgatável)
   Colhe o que a seguradora precisa para cotar: qual instrumento, a
   lista de segurados (idade, capital e sexo — tudo em faixas
   clicáveis; ninguém digita número), forma de pagamento e coberturas
   em vida. A DPS é etapa da seguradora, não desta página. Herda o
   diagnóstico da apresentação (mesmo token/registro) e sugere o
   produto pelo lado que mais incomodou.
   ══════════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PRODUTO = { id: 'vida_socios', nome: 'Vida Sócios — Pessoa Chave e Resgatável' };
const ARQ_VERSAO = '3';
window.ARQ_VERSAO = ARQ_VERSAO;

let SESSAO = null, LINK = null, iQ = 0, PRE = null;
let QRESP = { socios: [], _dados: {} };
const historico = [];
const MIL = 1e3, MI = 1e6;

/* ─── DICIONÁRIO ANALÍTICO ─── */
const DIC = {
  produtoEscolha: [['pe_pessoa_chave'], ['pe_resgatavel'], ['pe_ambos'], ['pe_recomendacao']],
  idade: [
    ['id_ate30', 18, 30, 25], ['id_31_40', 31, 40, 35], ['id_41_50', 41, 50, 45],
    ['id_51_60', 51, 60, 55], ['id_61_70', 61, 70, 65], ['id_71_80', 71, 80, 75]
  ],
  capital: [
    ['cap_ate200k', 25 * MIL, 200 * MIL, 100 * MIL], ['cap_200_500k', 200 * MIL, 500 * MIL, 350 * MIL],
    ['cap_500k_1mi', 500 * MIL, 1 * MI, 750 * MIL], ['cap_1_2mi', 1 * MI, 2 * MI, 1.5 * MI],
    ['cap_2_5mi', 2 * MI, 5 * MI, 3.5 * MI], ['cap_5mi_mais', 5 * MI, null, 5 * MI],
    ['cap_recomendacao', null, null, null]
  ],
  pagamento: [['pg_mensal'], ['pg_anual'], ['pg_unico'], ['pg_comparar']],
  cobVida: [['cv_sim'], ['cv_nao'], ['cv_recomendacao']],
  clausula: [['cl_sim'], ['cl_ja_temos'], ['cl_nao']]
};
const IDADES_TXT = ['Até 30', '31 a 40', '41 a 50', '51 a 60', '61 a 70', '71 a 80'];
const CAPITAIS_TXT = ['Até R$ 200 mil', 'R$ 200 a 500 mil', 'R$ 500 mil a 1 mi', 'R$ 1 a 2 milhões', 'R$ 2 a 5 milhões', 'Acima de R$ 5 mi', 'Recomendação do corretor'];

function registrarDado(campo, iOpcao, texto) {
  QRESP._dados = QRESP._dados || {};
  const linha = (DIC[campo] || [])[iOpcao];
  const d = { texto, i: iOpcao };
  if (linha) { d.cod = linha[0]; }
  QRESP._dados[campo] = d;
}

function montarAnalitico(finalizou) {
  const D = QRESP._dados || {};
  const g = (c, p) => (D[c] && D[c][p] !== undefined) ? D[c][p] : null;
  const socios = (QRESP.socios || []).map(s => ({
    nome: s.nome || null,
    idadeCod: s.idadeCod || null, idadeMid: s.idadeMid === undefined ? null : s.idadeMid,
    idade: s.idade || (s.idadeMid === undefined ? null : s.idadeMid),
    capitalCod: s.capitalCod || null, capitalMid: s.capitalMid === undefined ? null : s.capitalMid,
    sexo: s.sexo || null
  }));
  const capTotal = socios.reduce((t, s) => t + (s.capitalMid || 0), 0);
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'cotacao',
    completo: !!finalizou, passo: iQ,
    produtoEscolhaCod: g('produtoEscolha', 'cod'),
    nSegurados: socios.length || null,
    nInformado: QRESP.nInformado || null,
    socios,
    capitalTotalMid: capTotal || null,
    pagamentoCod: g('pagamento', 'cod'),
    cobVidaCod: g('cobVida', 'cod'),
    contatoNome: (QRESP.contato && QRESP.contato.nome) || null
  };
}

/* ─── ROTEIRO ─── */
const PERGUNTAS = [
  { fala: 'Boa decisão. Vou levantar o mínimo para o corretor <strong>cotar a proteção dos sócios</strong> — tudo em faixas, ninguém digita número, e sem compromisso. Os valores dependem só de idade e capital.', campo: null },
  { fala: 'Primeiro, o nome da <strong>empresa</strong>:', campo: 'empresa', tipo: 'texto', ph: 'Razão social ou nome fantasia' },
  { fala: 'Qual instrumento você quer cotar?<br><span style="font-size:12.5px;color:#93a4c8;">Podem ser contratados juntos — muitos clientes fecham os dois.</span>', campo: 'produtoEscolha', tipo: 'produto' },
  { fala: 'Agora, <strong>quem vamos proteger</strong>. Para cada sócio ou dirigente: a faixa de idade e o capital desejado.<br><span style="font-size:12.5px;color:#93a4c8;">Na dúvida do capital, um bom ponto de partida é o valor aproximado da participação de cada um na empresa.</span>', campo: 'socios', tipo: 'socios' },
  { fala: 'Como prefere <strong>pagar</strong>?<br><span style="font-size:12.5px;color:#93a4c8;">No pagamento anual o valor costuma ser bem menor que 12 mensais; o pagamento único existe só no Resgatável e é vitalício.</span>', campo: 'pagamento', tipo: 'opcoes', lista: true,
    opcoes: ['Mensal', 'Anual', 'Único (só Resgatável — paga uma vez, protegido para sempre)', 'Quero comparar as opções'] },
  { fala: 'Quer incluir as <strong>coberturas em vida</strong> — doenças graves e invalidez por acidente, pagas ao próprio sócio?<br><span style="font-size:12.5px;color:#93a4c8;">Doenças graves tem carência de 6 meses, capital limitado e idade máxima de contratação de 65 anos.</span>', campo: 'cobVida', tipo: 'opcoes', lista: true,
    opcoes: ['Sim, quero incluir', 'Não, só a proteção principal', 'Quero a recomendação do corretor'] },
  { fala: 'Fechamos. Qual o <strong>melhor contato</strong> para o corretor retornar com os valores?', campo: 'contato', tipo: 'contato' }
];

/* ─── MOTOR ─── */
const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));
function irAoFim(s) { const alvo = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight); if (alvo - (window.scrollY + window.innerHeight) < 4) return; window.scrollTo({ top: alvo, behavior: s ? 'smooth' : 'auto' }); }
let _anc = [];
function fixarFim(s) { _anc.forEach(clearTimeout); _anc = []; requestAnimationFrame(() => { irAoFim(s); requestAnimationFrame(() => irAoFim(s)); }); [140, 360, 640, 980].forEach(ms => _anc.push(setTimeout(() => irAoFim(false), ms))); }
async function digitar(el, html, vel) {
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean); let buf = '', n = 0;
  for (const p of partes) { if (p.startsWith('<')) { buf += p; el.innerHTML = buf + '<span class="cursor"></span>'; continue; }
    for (const ch of p) { buf += ch; el.innerHTML = buf + '<span class="cursor"></span>'; if ((++n % 6) === 0) irAoFim(false); await espera('.!?'.includes(ch) ? (vel || 13) * 9 : ',;:'.includes(ch) ? (vel || 13) * 4 : (vel || 13)); } }
  el.innerHTML = buf; irAoFim(false);
}
function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11); let v = '';
  if (d.length > 7) v = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; else if (d.length > 2) v = `(${d.slice(0,2)}) ${d.slice(2)}`; else if (d.length > 0) v = `(${d}`;
  el.value = v; const av = $('avisoTel'); if (av) { const curto = d.length > 0 && d.length < 10; av.classList.toggle('on', curto); el.classList.toggle('erro', curto); }
}
window.mascaraTel = mascaraTel;

/* Sugestão de produto a partir do lado que incomodou na apresentação */
function sugestaoProduto() {
  const lado = PRE && PRE.ladoCod;
  if (lado === 'ld_empresa') return { k: 0, motivo: 'a empresa virar sócia dos herdeiros' };
  if (lado === 'ld_familia') return { k: 1, motivo: 'a família esperar inventário' };
  if (lado === 'ld_ambos') return { k: 2, motivo: 'os dois lados' };
  return null;
}

async function render() {
  const q = PERGUNTAS[iQ];
  $('prog').style.width = (iQ / PERGUNTAS.length * 100) + '%';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">Cotação Vida Sócios · ${iQ} de ${PERGUNTAS.length - 1}</div>
      <div id="hist">${historico.map((h, hi) => `<div class="qbolha">${h.p}</div>${h.r ? `<div class="qbolha qresp">${h.r}<button class="alt" onclick="voltarPara(${hi})">✏️ alterar</button></div>` : ''}`).join('')}</div>
      <div class="qbolha" id="fala"></div>
      <div class="zona" id="zona"></div>
    </div>`;
  irAoFim(false);
  await digitar($('fala'), q.fala, 12);
  await espera(160); const z = $('zona'); z.classList.add('on'); await espera(140); fixarFim(true);

  if (!q.campo) {
    z.innerHTML = `<button class="btn" id="ok">Vamos lá →</button>`;
    $('ok').onclick = () => { historico.push({ p: q.fala, r: null, i: iQ }); iQ++; render(); };
  }
  else if (q.tipo === 'produto') {
    const sug = sugestaoProduto();
    const ops = [
      { t: '🏢 Pessoa Chave — a empresa recebe e compra as cotas', v: 'pessoa_chave' },
      { t: '👨‍👩‍👧 Vida Resgatável — a família recebe, fora do inventário', v: 'resgatavel' },
      { t: '🤝 Os dois — cada um no seu papel', v: 'ambos' },
      { t: '💬 Quero a recomendação do corretor', v: 'recomendacao' }
    ];
    z.innerHTML = `<div class="opcoes lista">${ops.map((o, k) =>
      `<button class="op" data-k="${k}">${o.t}${sug && sug.k === k ? '<span class="selo-sug">pelo seu diagnóstico</span>' : ''}</button>`).join('')}</div>${
      sug ? `<div class="nota">No seu diagnóstico, o que mais incomodou foi <strong>${sug.motivo}</strong> — por isso a sugestão marcada. A escolha é sua.</div>` : ''}`;
    z.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k);
      QRESP.produtoEscolha = ops[k].v; registrarDado('produtoEscolha', k, ops[k].t);
      historico.push({ p: q.fala, r: ops[k].t, i: iQ });
      salvar(); iQ++; render();
    });
  }
  else if (q.tipo === 'opcoes') {
    const cls = q.muitas ? 'opcoes muitas' : q.lista ? 'opcoes lista' : 'opcoes';
    z.innerHTML = `<div class="${cls}">${q.opcoes.map((o, k) => `<button class="op" data-k="${k}">${o}</button>`).join('')}</div>`;
    z.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const v = q.opcoes[Number(b.dataset.k)];
      QRESP[q.campo] = v; registrarDado(q.campo, Number(b.dataset.k), v);
      historico.push({ p: q.fala, r: v, i: iQ }); salvar(); iQ++; render();
    });
  }
  else if (q.tipo === 'texto') {
    z.innerHTML = `<input class="campo" id="tx" placeholder="${q.ph || ''}" autocomplete="off" style="margin-bottom:12px;">
      <button class="btn" id="ok">Continuar →</button>`;
    const enviar = () => { const v = $('tx').value.trim(); if (!v) return $('tx').focus(); QRESP[q.campo] = v; historico.push({ p: q.fala, r: v, i: iQ }); salvar(); iQ++; render(); };
    $('ok').onclick = enviar;
    $('tx').onkeydown = e => { if (e.key === 'Enter') enviar(); };
    if (q.campo === 'empresa' && LINK && LINK.empresaNome) $('tx').value = LINK.empresaNome;
    $('tx').focus();
  }
  else if (q.tipo === 'socios') { renderSocios(q, z); }
  else if (q.tipo === 'contato') {
    z.innerHTML = `
      <label class="lbl">Seu nome</label><input class="campo" id="cNome" style="margin-bottom:12px;" placeholder="Nome completo">
      <label class="lbl">Cargo</label><input class="campo" id="cCargo" style="margin-bottom:12px;" placeholder="Ex: Sócio, Diretor">
      <label class="lbl">E-mail</label><input class="campo" id="cMail" type="email" style="margin-bottom:12px;" placeholder="voce@empresa.com.br">
      <label class="lbl">Telefone / WhatsApp</label>
      <input class="campo" id="cTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
      <div class="aviso" id="avisoTel">Parece faltar algum número — confira, mas pode continuar assim mesmo.</div>
      <button class="btn btn-ouro" id="ok" style="width:100%; margin-top:16px;">Enviar para o corretor →</button>`;
    $('ok').onclick = async () => {
      const nome = $('cNome').value.trim(); if (!nome) return $('cNome').focus();
      QRESP.contato = { nome, cargo: $('cCargo').value.trim(), email: $('cMail').value.trim(), telefone: $('cTel').value.trim() };
      $('ok').disabled = true; $('ok').textContent = 'Enviando…';
      await salvar(true); renderFim();
    };
  }
  fixarFim(true);
}

/* ─── TELA: SÓCIOS (loop de segurados, tudo clicável) ─── */
function renderSocios(q, z) {
  QRESP.socios = [];   // recomeçar esta tela substitui, nunca soma
  z.innerHTML = `
    <div class="lbl" style="margin-bottom:10px;">Quantas pessoas vamos proteger?</div>
    <div class="opcoes muitas" id="sn">${['1', '2', '3', '4', '5', '6 ou mais'].map((t, k) => `<button class="op" data-k="${k}">${t}</button>`).join('')}</div>
    <div id="sForm"></div>`;
  z.querySelectorAll('#sn .op').forEach(b => b.onclick = () => {
    const k = Number(b.dataset.k);
    const n = k === 5 ? 6 : k + 1;
    QRESP.nInformado = k === 5 ? '6+' : String(n);
    $('sn').style.display = 'none';
    z.querySelector('.lbl').style.display = 'none';
    coletarSocio(1, n, k === 5, q, z);
  });
}

function coletarSocio(i, n, maisDepois, q, z) {
  const f = $('sForm');
  const sel = { idade: null, capital: null, sexo: null };
  f.innerHTML = `
    <div class="socio-card">
      <div class="socio-t">Sócio / dirigente ${i} de ${n}</div>
      <label class="lbl">Primeiro nome <span style="font-weight:400;">(opcional — ajuda o corretor a montar a proposta)</span></label>
      <input class="campo" id="sNome" style="margin-bottom:14px;" placeholder="Ex: João">
      <label class="lbl">Idade</label>
      <input class="campo" id="sIdadeNum" inputmode="numeric" maxlength="3" placeholder="Ex: 42" style="margin-bottom:6px;">
      <div class="aviso" id="sIdadeAv" style="margin-bottom:12px;">Informe a idade entre 18 e 90.</div>
      <label class="lbl">Capital de proteção desejado</label>
      <div class="opcoes muitas" id="sCap" style="margin-bottom:14px;">${CAPITAIS_TXT.map((t, k) => `<button class="op" data-k="${k}">${t}</button>`).join('')}</div>
      <label class="lbl">Sexo <span style="font-weight:400;">(a seguradora usa no cálculo)</span></label>
      <div class="opcoes muitas" id="sSexo" style="margin-bottom:14px;">
        <button class="op" data-v="M">Masculino</button>
        <button class="op" data-v="F">Feminino</button>
        <button class="op" data-v="depois">Informo depois</button>
      </div>
      <button class="btn" id="sOk" disabled>${i < n ? 'Próximo sócio →' : 'Concluir a lista →'}</button>
    </div>`;
  const habilitar = () => { $('sOk').disabled = !(sel.idade !== null && sel.capital !== null); };
  const grupo = (cid, chave) => $(cid).querySelectorAll('.op').forEach(b => b.onclick = () => {
    $(cid).querySelectorAll('.op').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    sel[chave] = chave === 'sexo' ? b.dataset.v : Number(b.dataset.k);
    habilitar();
  });
  grupo('sCap', 'capital'); grupo('sSexo', 'sexo');
  // idade agora é digitada (exata), não faixa
  const _faixaIdade = a => { const i = DIC.idade.findIndex(f => a >= f[1] && a <= f[2]); return i < 0 ? (a < 18 ? 0 : DIC.idade.length - 1) : i; };
  $('sIdadeNum').oninput = () => {
    const a = parseInt(($('sIdadeNum').value || '').replace(/\D/g, ''), 10);
    const ok = a && a >= 18 && a <= 90;
    sel.idade = ok ? a : null;
    $('sIdadeAv').classList.toggle('on', !!$('sIdadeNum').value && !ok);
    $('sIdadeNum').classList.toggle('erro', !!$('sIdadeNum').value && !ok);
    habilitar();
  };
  // veio do simulador da apresentação? pré-preenche o primeiro sócio
  if (i === 1 && PRE && PRE.simulador) {
    const sim = PRE.simulador;
    if (sim.idade) { $('sIdadeNum').value = sim.idade; sel.idade = sim.idade; }
    if (sim.capital) {
      const ci = DIC.capital.findIndex(f => f[1] != null && sim.capital >= f[1] && (f[2] == null || sim.capital <= f[2]));
      if (ci >= 0) { const b = $('sCap').querySelector('.op[data-k="' + ci + '"]'); if (b) { b.classList.add('sel'); sel.capital = ci; } }
    }
    habilitar();
  }
  fixarFim(true);
  $('sOk').onclick = () => {
    const idx = _faixaIdade(sel.idade), lc = DIC.capital[sel.capital];
    QRESP.socios.push({
      nome: $('sNome').value.trim() || null,
      idade: sel.idade, idadeCod: DIC.idade[idx][0], idadeMid: sel.idade,
      capitalCod: lc[0], capitalMid: lc[3],
      sexo: sel.sexo === 'depois' ? null : sel.sexo
    });
    salvar();
    if (i < n) coletarSocio(i + 1, n, maisDepois, q, z);
    else {
      const capTotal = QRESP.socios.reduce((t, s) => t + (s.capitalMid || 0), 0);
      const fmtC = v => v >= 1e6 ? 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : 'R$ ' + Math.round(v / 1e3) + ' mil';
      const resp = `${QRESP.socios.length} segurado${QRESP.socios.length > 1 ? 's' : ''}` +
        (capTotal ? ` · proteção somada estimada em torno de ${fmtC(capTotal)}` : '') +
        (maisDepois ? ' · demais sócios com o corretor' : '');
      historico.push({ p: q.fala, r: resp, i: iQ });
      salvar(); iQ++; render();
    }
  };
}

function renderFim() {
  $('prog').style.width = '100%';
  palco.innerHTML = `
    <div class="cena fim">
      <div class="ico">✅</div>
      <div class="titulo" style="font-size:26px; font-weight:800;">Recebemos tudo!</div>
      <div style="font-size:15px; line-height:1.65; color:#c3d0ec; margin-top:12px;">
        Suas respostas já estão com a corretora, que monta a cotação por segurado — sem compromisso.
      </div>
      <div class="prox">
        <b>Como funciona daqui pra frente:</b>
        <ul>
          <li>O corretor volta com os valores por sócio, nas formas de pagamento escolhidas</li>
          <li>Na contratação há declaração pessoal de saúde de cada segurado — simples e sem exame na maioria dos casos</li>
          <li>Carências e condições ficam destacadas na proposta, antes de qualquer assinatura</li>
        </ul>
      </div>
      <div style="font-size:14px; line-height:1.65; color:#c3d0ec; margin-top:18px;">
        Obrigado pelo tempo — decidir essas regras em vida é o maior gesto de respeito entre sócios, e com as próprias famílias.
      </div>
    </div>`;
}

/* ─── ALTERAR / RETOMAR ─── */
function voltarPara(hi) {
  const alvo = historico[hi];
  if (!alvo || typeof alvo.i !== 'number') return;
  historico.length = hi; iQ = alvo.i;
  window.scrollTo({ top: 0, behavior: 'auto' }); render();
}
window.voltarPara = voltarPara;

function renderRetomar(d) {
  const qs = d.questionario || {};
  const feitas = (d.historicoQ || []).filter(h => h.r).length;
  const pct = Math.min(99, Math.round((d.passo || 0) / (PERGUNTAS.length - 1) * 100));
  $('prog').style.width = pct + '%';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">Cotação Vida Sócios · retomando</div>
      <div class="qbolha">Você já tinha começado${qs.empresa ? ' a cotação da <strong>' + qs.empresa + '</strong>' : ''} e parou no meio. ${feitas ? `Já tenho <strong>${feitas} ${feitas === 1 ? 'resposta' : 'respostas'}</strong> suas` : 'Guardei o seu ponto'} — dá para continuar de onde parou.</div>
      <div class="zona on"><div class="opcoes"><button class="op" id="btSeguir">Continuar de onde parei →</button><button class="op" id="btZero">Começar do zero</button></div></div>
    </div>`;
  $('btSeguir').onclick = () => { QRESP = Object.assign({ socios: [], _dados: {} }, qs); (d.historicoQ || []).forEach(h => historico.push(h)); iQ = Math.max(0, Math.min(Number(d.passo) || 0, PERGUNTAS.length - 1)); render(); };
  $('btZero').onclick = () => { QRESP = { socios: [], _dados: {} }; if (LINK && LINK.empresaNome) QRESP.empresa = LINK.empresaNome; historico.length = 0; iQ = 0; salvar(); render(); };
}

/* ─── PERSISTÊNCIA ─── */
async function salvar(finalizou) {
  try { if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP,
      analitico: Object.assign({}, PRE, montarAnalitico(finalizou)),
      questionarioCompleto: !!finalizou, passo: iQ, questTotal: PERGUNTAS.length, historicoQ: historico,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

/* ─── INÍCIO ─── */
console.log('%cCotação Vida Sócios v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  /* usa a sessão já existente se houver (ex.: corretor logado no painel) — não a substitui; só entra anônimo se ninguém estiver logado */
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  const respId = params.get('r');   // vem da apresentação: anexa ao MESMO respondente
  const nomeParam = params.get('n') ? decodeURIComponent(params.get('n')) : null;
  let GRUPO = token || params.get('g');
  if (!GRUPO) { try { GRUPO = sessionStorage.getItem('grupo_q_vidasocios'); } catch (e) {} if (!GRUPO) GRUPO = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  try { sessionStorage.setItem('grupo_q_vidasocios', GRUPO); } catch (e) {}
  SESSAO = 'vidasocios_' + GRUPO + (respId ? '_' + respId : '');
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, origem: 'questionario', token: token || null,
    grupo: GRUPO, respId: respId || null, perfilPapelTexto: nomeParam || null,
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) {
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) { LINK = snap.docs[0].data(); base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null; base.destinatario = LINK.destinatario || null; base.agenciaId = LINK.agenciaId || null; base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null; }
    } catch (e) { console.warn('link', e); }
  }
  if (LINK && LINK.empresaNome) {
    QRESP.empresa = LINK.empresaNome;
    const iEmp = PERGUNTAS.findIndex(q => q.campo === 'empresa'); if (iEmp >= 0) PERGUNTAS.splice(iEmp, 1);
    PERGUNTAS[0].fala = 'Boa decisão. Vou levantar o mínimo para o corretor <strong>cotar a proteção dos sócios</strong> da <strong>' + LINK.empresaNome + '</strong> — tudo em faixas, ninguém digita número, e sem compromisso.';
  }
  let anterior = null;
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    else {
      const d = doc.data() || {};
      PRE = d.analitico || null;   // herda o diagnóstico (ladoCod, vulnerabilidade)
      if (!d.questionarioCompleto && (Number(d.passo) || 0) > 0 && d.questionario) anterior = d;
    }
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }
  if (anterior) renderRetomar(anterior); else render();
});
</script>
