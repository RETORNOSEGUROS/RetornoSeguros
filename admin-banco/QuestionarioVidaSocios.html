<script>
/* ══════════════════════════════════════════════════════════════════
   COTAÇÃO — VIDA SÓCIOS v3 (Pessoa Chave · Resgatável Único)
   Arquivo separado da apresentação, mas grava no MESMO registro
   (mb_apresentacoes/<SESSAO>): lê as respostas da apresentação e não
   repete nada. Anexos vão para o Storage no mesmo padrão dos outros
   questionários (mb_apolices/<empresa>/vida-socios/<SESSAO>/...).
   Nada grava no raio-x nem no mapa de vencimentos.
   ══════════════════════════════════════════════════════════════════ */

const CONFIG = { marca: 'Retorno Seguros' };
const CORRETORA = { whats: '5554997015000', whatsLabel: '(54) 99701-5000' };
const PRODUTO = { id: 'vida_socios', nome: 'Vida Sócios — Pessoa Chave e Resgatável Único' };
const ARQ_VERSAO = '3';

let R = { visto: {} };        // respostas da apresentação (só leitura)
let Q = { produtos: null, empresa: null, cnpj: null, tipo: null, acordo: null, valorFaixa: null, valorExato: null,
          socios: [], versao: 'dps', dg: null, pagPc: 'anual', pagRg: 'unico', docs: null, anexos: [] };
let atual = null; const pilha = [];
let db = null, st = null, SESSAO = null, GRUPO = null, RESPID = null, LINK = null, TOKEN = null;

const VALORES = [[0, 5], [5, 20], [20, 50], [50, 100], [100, 300], [300, null]];
const VALORES_TXT = ['Até R$ 5 mi', 'R$ 5 a 20 mi', 'R$ 20 a 50 mi', 'R$ 50 a 100 mi', 'R$ 100 a 300 mi', 'Acima de R$ 300 mi'];

const INFO = {
  capital: ['Como sugerimos o capital', 'Na Pessoa Chave, o capital sugerido é a parte do sócio: participação × valor da empresa, arredondado para baixo.', 'Mínimo de R$ 200 mil e máximo de R$ 12 milhões por sócio. Os capitais podem ser diferentes entre os sócios, e nem todos precisam entrar.'],
  versoes: ['As duas versões do Resgatável', 'Com questionário de saúde: sem carência, com doenças graves. Nas cotações, sai cerca de 6% mais barata.', 'Sem questionário: só morte, até 70 anos. A carência de 24 meses vale só para morte natural (por doença). Morte por acidente é coberta desde o primeiro dia, nas duas versões.'],
  pagamento: ['Anual ou mensal', 'Nas cotações reais da Pessoa Chave, 12 parcelas mensais saíram cerca de 20% mais caras que o pagamento anual.', 'O prêmio da Pessoa Chave é recalculado a cada aniversário pela idade, além da inflação.'],
  docs: ['Por que pedimos esses documentos', 'O contrato social mostra o que acontece com a cota de quem falta e em quanto tempo a empresa paga.', 'O balanço e a DRE mostram quanto vale cada parte e se o caixa aguenta. Com eles, o desenho do seguro fica sob medida.', 'Arquivos em PDF, imagem, Word ou Excel, até 15 MB cada.']
};

/* ─── utilidades ─── */
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const espera = ms => new Promise(r => setTimeout(r, ms));
const temPc = () => Q.produtos === 'pc' || Q.produtos === 'ambas' || Q.produtos === 'rec';
const temRg = () => Q.produtos === 'rg' || Q.produtos === 'ambas' || Q.produtos === 'rec';
const reais = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
function fmtCap(v) { if (v == null) return '—'; return v >= 1e6 ? 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi' : 'R$ ' + Math.round(v / 1e3) + ' mil'; }
function mascaraData(v) { const d = v.replace(/\D/g, '').slice(0, 8); return d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; }
function idadeDe(txt) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt || ''); if (!m) return null;
  const dia = +m[1], mes = +m[2], ano = +m[3]; const dt = new Date(ano, mes - 1, dia);
  if (dt.getFullYear() !== ano || dt.getMonth() !== mes - 1 || dt.getDate() !== dia) return null;
  const h = new Date(); let a = h.getFullYear() - ano; if (h.getMonth() < mes - 1 || (h.getMonth() === mes - 1 && h.getDate() < dia)) a--;
  return a;
}
const mascaraReais = v => { const d = String(v).replace(/\D/g, '').slice(0, 12); return d ? 'R$ ' + Number(d).toLocaleString('pt-BR') : ''; };
const numReais = v => Number(String(v || '').replace(/\D/g, '')) || null;
const numPct = v => { const n = parseFloat(String(v || '').replace(',', '.')); return isNaN(n) ? null : n; };

/* valor-base da empresa: número digitado ou meio da faixa */
function valorBase() {
  if (Q.valorExato) return Q.valorExato;
  if (Q.valorFaixa == null) return null;
  const [a, b] = VALORES[Q.valorFaixa]; return (b == null ? a : (a + b) / 2) * 1e6;
}
function capitalSugerido(s) {
  const base = valorBase(), p = numPct(s.pct);
  if (!base || !p) return null;
  let v = Math.floor(base * p / 100 / 1e5) * 1e5;
  return Math.max(2e5, Math.min(12e6, v));
}

/* CNPJ: três fontes públicas com fallback (mesmo motor dos outros questionários) */
async function _fetchJson(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); return { status: r.status, json: r.ok ? await r.json() : null }; }
  catch (e) { return { status: 0, json: null }; } finally { clearTimeout(t); }
}
async function _cnpjConsulta(d) {
  const fontes = [
    ['brasilapi', 'https://brasilapi.com.br/api/cnpj/v1/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['minhareceita', 'https://minhareceita.org/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['cnpjws', 'https://publica.cnpj.ws/cnpj/' + d, j => ({ razao: j.razao_social, fantasia: j.estabelecimento && j.estabelecimento.nome_fantasia, cidade: j.estabelecimento && j.estabelecimento.cidade && j.estabelecimento.cidade.nome, uf: j.estabelecimento && j.estabelecimento.estado && j.estabelecimento.estado.sigla })]
  ];
  // As três fontes são consultadas AO MESMO TEMPO: a primeira resposta válida vence.
  // (Em série, com 9s de espera cada, duas fontes fora do ar travavam a tela por ~20s.)
  let motivo = 'offline', inexistente = false;
  const tentativa = ([nome, url, norm]) => _fetchJson(url).then(async r => {
    if (r.status === 429) { motivo = 'limite'; await espera(1200); r = await _fetchJson(url); }
    if (r.status === 404 || r.status === 400) { inexistente = true; throw new Error('inexistente'); }
    if (r.json && r.json.razao_social) return Object.assign({ ok: true, fonte: nome }, norm(r.json));
    throw new Error('vazio');
  });
  try {
    const corrida = fontes.map(tentativa);
    // Promise.any não existe em navegadores antigos — o mesmo efeito, à mão.
    const vencedor = await new Promise((resolve, reject) => {
      let faltam = corrida.length;
      corrida.forEach(pr => pr.then(resolve, () => { if (--faltam === 0) reject(new Error('todas falharam')); }));
    });
    if (vencedor) return vencedor;
  } catch (e) { if (inexistente) return { ok: false, motivo: 'inexistente' }; }
  return { ok: false, motivo };
}

        <div id="lista" style="margin-top:10px"></div>
        <div class="ops" id="gDocs" style="margin-top:14px">
          <button class="op ${Q.docs === 'depois' ? 'sel' : ''}" data-v="depois">Envio depois pelo WhatsApp</button>
          <button class="op ${Q.docs === 'nao' ? 'sel' : ''}" data-v="nao">Prefiro não enviar</button></div>` + btnContinuar() });
    const desenharLista = () => { el('lista').innerHTML = Q.anexos.map(a => `<div class="linha" style="font-size:13.5px">📄 ${esc(a.nome)} <span style="color:var(--verde)">· enviado</span></div>`).join(''); };
    desenharLista();
    ligarGrupo('gDocs', v => { Q.docs = v; });
    el('arq').onchange = async () => {
      for (const f of el('arq').files) {
        const linha = document.createElement('div'); linha.className = 'nota'; linha.textContent = 'Enviando ' + f.name + '…'; el('lista').appendChild(linha);
        const r = await enviarArquivo(f, p => { linha.textContent = `Enviando ${f.name}… ${p}%`; });
        if (r.ok) { Q.anexos.push(r.anexo); Q.docs = 'enviou'; salvar(JA_CONCLUIU); desenharLista(); }
        else linha.textContent = `${f.name}: ${r.msg}`;
      }
      el('arq').value = '';
    };
    el('btCont').onclick = () => { if (Q.docs === 'depois') window.open(`https://wa.me/${CORRETORA.whats}?text=` + encodeURIComponent(`Olá! Segue o contrato social e o balanço da ${Q.empresa || (LINK && LINK.empresaNome) || 'empresa'} para a cotação Vida Sócios (protocolo ${protocolo()}).`), '_blank'); go(proxima('Q7')); };
  },

  Q8() {
    const c = Q.contato || R.contato || {};
    montar({ rotulo: rotuloEtapa('Q8'), titulo: 'Confirme o contato.',
      corpo: `<label class="lbl">Nome</label><input class="campo" id="cNome" value="${esc(c.nome)}">
        <label class="lbl">E-mail</label><input class="campo" id="cMail" type="email" value="${esc(c.email)}">
        <label class="lbl">WhatsApp</label><input class="campo" id="cTel" type="tel" inputmode="numeric" value="${esc(c.tel)}">
        <button class="btn ouro" id="btCont">Enviar para o corretor →</button>` });
    const valida = () => { el('btCont').disabled = !(el('cNome').value.trim() && (el('cMail').value.includes('@') || el('cTel').value.replace(/\D/g, '').length >= 10)); };
    ['cNome', 'cMail', 'cTel'].forEach(k => el(k).oninput = valida); valida();
    el('btCont').onclick = () => { Q.contato = { nome: el('cNome').value.trim(), email: el('cMail').value.trim(), tel: el('cTel').value.trim() }; go('FIM'); };
  },

  FIM() {
    montar({ corpo: `<div class="fim"><div class="ico">✅</div><h1 class="titulo">Recebemos tudo.</h1>
      <p class="texto">A cotação vem por sócio, num documento só. Na contratação, cada sócio responde o próprio questionário de saúde, e as carências ficam destacadas antes de qualquer assinatura.</p>
      <div class="painel"><div class="linha">Protocolo: <b>${protocolo()}</b></div>${resumoHtml()}</div></div>` });
  }
};

/* ─── resumo e analítico ─── */
function capitalPc(s) { if (!temPc() || !s.incluir || s.porSocio) return null; if (s.pc === 'sug') return capitalSugerido(s); if (s.pc === 'outro') return s.pcOutro; return null; }
function capitalRg(s) { if (!temRg() || !s.incluir || s.porSocio) return null; return s.rg === '500k' ? 5e5 : s.rg === '1mi' ? 1e6 : s.rg === 'outro' ? s.rgOutro : null; }
function resumoHtml() {
  const inc = Q.socios.filter(s => s.incluir);
  const tPc = inc.reduce((t, s) => t + (capitalPc(s) || 0), 0), tRg = inc.reduce((t, s) => t + (capitalRg(s) || 0), 0);
  return `<div class="linha">${inc.length} sócio${inc.length > 1 ? 's' : ''} na lista</div>` + (tPc ? `<div class="linha">Pessoa Chave: <b>${fmtCap(tPc)}</b></div>` : '') + (tRg ? `<div class="linha">Resgatável: <b>${fmtCap(tRg)}</b></div>` : '');
}
function analitico(final) {
  const inc = Q.socios.filter(s => s.incluir);
  return { esquema: 3, produto: PRODUTO.id, etapa: 'cotacao', completo: !!final, produtosCod: Q.produtos, tipoSocietario: Q.tipo, acordoSocios: Q.acordo,
    valorEmpresaBase: valorBase(), nSegurados: inc.length,
    capitalPcTotal: inc.reduce((t, s) => t + (capitalPc(s) || 0), 0) || null, capitalRgTotal: inc.reduce((t, s) => t + (capitalRg(s) || 0), 0) || null,
    socios: inc.map(s => ({ nome: s.nome || null, pct: numPct(s.pct), idade: s.idade, nasc: s.nasc || null, sexo: s.sexo, atua: s.atua, porSocio: !!s.porSocio,
      capitalPc: capitalPc(s), pcEscolha: s.pc, capitalRg: capitalRg(s), rgEscolha: s.rg, elegivelVida: s.idade != null && s.idade <= 65 })),
    versaoRg: temRg() ? Q.versao : null, coberturasVida: Q.dg, pagPc: temPc() ? Q.pagPc : null, pagRg: temRg() ? Q.pagRg : null, documentos: Q.docs, nAnexos: Q.anexos.length };
}
/* Espelho do analítico no formato que o card do painel já sabe desenhar
   (_apVidaSocios lê `analitico` com os códigos pe_/pg_/cv_). Sem isto, o bloco
   Vida Sócios some do card. O analiticoQ completo continua sendo gravado. */
const _VS_PROD = { pc: 'pe_pessoa_chave', rg: 'pe_resgatavel', ambas: 'pe_ambos', rec: 'pe_recomendacao' };
const _VS_COB  = { sim: 'cv_sim', nao: 'cv_nao', rec: 'cv_recomendacao' };
const _VS_PAG  = { anual: 'pg_anual', mensal: 'pg_mensal', unico: 'pg_unico', comparar: 'pg_comparar' };
function analiticoPainel() {
  const a = analitico(false);
  const pag = temPc() ? Q.pagPc : Q.pagRg;
  return {
    produto: 'vida_socios',
    produtoEscolhaCod: _VS_PROD[Q.produtos] || null,
    cobVidaCod: _VS_COB[Q.dg] || null,
    pagamentoCod: _VS_PAG[pag] || null,
    nSegurados: a.nSegurados || null,
    capitalTotalMid: ((a.capitalPcTotal || 0) + (a.capitalRgTotal || 0)) || null,
    socios: (a.socios || []).map(s => ({
      nome: s.nome, idade: s.idade, sexo: s.sexo,
      capitalMid: ((s.capitalPc || 0) + (s.capitalRg || 0)) || null
    }))
  };
}

const protocolo = () => String(TOKEN || GRUPO || '').replace(/^g_/, '').slice(0, 6).toUpperCase();

/* ─── anexos (Storage, mesmo padrão dos outros questionários) ─── */
async function enviarArquivo(f, onProg) {
  if (!st) return { ok: false, msg: 'modo demonstração — arquivo não enviado. Use o WhatsApp.' };
  if (f.size > 15 * 1024 * 1024) return { ok: false, msg: 'acima de 15 MB — envie pelo WhatsApp.' };
  const tipo = /\.csv$/i.test(f.name) ? 'application/vnd.ms-excel' : (f.type || 'application/octet-stream');
  const nome = f.name.replace(/[^\w.\- ]+/g, '_');
  const path = `mb_apolices/${(LINK && LINK.empresaId) || 'sem_empresa'}/vida-socios/${SESSAO}/${Date.now()}_${nome}`;
  try {
    if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    const task = st.ref(path).put(f, { contentType: tipo });
    let ultimo = Date.now(), pct = 0;
    const vigia = setInterval(() => { if (Date.now() - ultimo > 40000) { task.cancel(); } }, 5000);
    await new Promise((res, rej) => task.on('state_changed', snap => { const p = Math.round(snap.bytesTransferred / snap.totalBytes * 100); if (p !== pct) { pct = p; ultimo = Date.now(); if (onProg) onProg(p); } }, rej, res));
    clearInterval(vigia);
    const url = await task.snapshot.ref.getDownloadURL();
    const anexo = { nome: f.name, url, path, tipo, tamanho: f.size, origem: 'questionario', enviadoEm: new Date().toISOString() };
    await db.collection('mb_apresentacoes').doc(SESSAO).set({ apoliceAnexos: firebase.firestore.FieldValue.arrayUnion(anexo) }, { merge: true });
    return { ok: true, anexo };
  } catch (e) { console.warn('upload', e); return { ok: false, msg: 'sem resposta do servidor — envie pelo WhatsApp ' + CORRETORA.whatsLabel + '.' }; }
}

function compartilharPreencher() {
  const qp = new URLSearchParams(); if (TOKEN) qp.set('t', TOKEN); else qp.set('g', GRUPO);
  const url = location.origin + location.pathname + '?' + qp;
  const txt = 'Estamos cotando a proteção dos sócios da empresa. Preencha os seus dados aqui (leva 1 minuto):';
  if (navigator.share) navigator.share({ text: txt, url }).catch(() => {}); else window.open('https://wa.me/?text=' + encodeURIComponent(txt + ' ' + url), '_blank');
}

/* ─── persistência (mesmo registro da apresentação) ─── */
let JA_CONCLUIU = false;   // uma vez concluído, nenhum salvamento posterior desmarca
async function salvar(final) {
  if (final) JA_CONCLUIU = true;
  const feito = !!final || JA_CONCLUIU || atual === 'FIM';
  if (!db || !SESSAO) return;
  // Numeração honesta: FIM conta como a última etapa; Q0 (o CNPJ) é a etapa 1 do
  // ponto de vista de quem responde, mesmo não estando na lista dinâmica.
  const _et = etapas(), _i = _et.indexOf(atual);
  const _passo = atual === 'FIM' ? _et.length : (_i >= 0 ? _i + 1 : 0);
  try {
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: JSON.parse(JSON.stringify(Q)), analiticoQ: analitico(feito),
      questionarioCompleto: feito, passoQ: atual, arqVersaoQ: ARQ_VERSAO,
      // Campos que o PAINEL lê no card (bloco Vida Sócios + 📋 perguntas). Não renomear.
      analitico: analiticoPainel(),
      questionarioAberto: true,
      passo: _passo,
      questTotal: _et.length,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

/* ─── início ─── */
document.addEventListener('DOMContentLoaded', async () => {
  el('marca').textContent = CONFIG.marca;
  el('btVoltar').onclick = voltar; el('veu').onclick = fecharInfo; el('gavFechar').onclick = fecharInfo;
  const params = new URLSearchParams(location.search);
  TOKEN = params.get('t'); GRUPO = TOKEN || params.get('g'); RESPID = params.get('r');
  try { if (!GRUPO) GRUPO = sessionStorage.getItem('grupo_vs3'); } catch (e) {}
  if (!GRUPO) GRUPO = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  if (!RESPID) { try { RESPID = sessionStorage.getItem('resp_vs3_' + GRUPO); } catch (e) {} }
  if (!RESPID) RESPID = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try { sessionStorage.setItem('grupo_vs3', GRUPO); sessionStorage.setItem('resp_vs3_' + GRUPO, RESPID); } catch (e) {}
  SESSAO = 'vidasocios_' + GRUPO + '_' + RESPID;

  const m = /#ctx=([^&]+)/.exec(location.hash);          // modo demonstração: respostas vindas pela URL
  if (m) { try { R = Object.assign(R, JSON.parse(decodeURIComponent(escape(atob(m[1]))))); } catch (e) {} }

  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (fbOk) {
    try {
      await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      try { st = firebase.storage(); st.setMaxUploadRetryTime(45000); st.setMaxOperationRetryTime(20000); } catch (e) { st = null; }
      if (TOKEN) {
        let snap = await db.collection('mb_links_apresentacao').where('token', '==', TOKEN).limit(1).get();
        if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', TOKEN).limit(1).get();
        if (!snap.empty) LINK = snap.docs[0].data();
      }
      const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
      if (doc.exists) { const d = doc.data() || {}; if (d.respostas) R = Object.assign(R, d.respostas); if (d.questionario && !d.questionarioCompleto) Q = Object.assign(Q, d.questionario); }
      await db.collection('mb_apresentacoes').doc(SESSAO).set(Object.assign({ produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, grupo: GRUPO, respId: RESPID, token: TOKEN || null,
        atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, doc.exists ? {} : { criadoEm: firebase.firestore.FieldValue.serverTimestamp(), origem: 'questionario' },
        LINK ? { empresaId: LINK.empresaId || null, empresaNome: LINK.empresaNome || null, agenciaId: LINK.agenciaId || null } : {}), { merge: true });
    } catch (e) { console.warn('firebase', e); db = null; st = null; }
  }
  if (LINK && LINK.empresaNome) Q.empresa = LINK.empresaNome;
  if (!db) { const d = document.createElement('div'); d.className = 'demo'; d.textContent = 'modo demonstração · respostas não são salvas'; document.body.appendChild(d); }
  go('Q0');
});
</script>
