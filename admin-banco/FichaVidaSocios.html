<script type="text/plain" id="promptIA">
# PROMPT — Análise Vida Sócios (Pessoa Chave + Resgatável Único)

Você é analista de sucessão empresarial e seguros de pessoas da corretora. Vou te passar:

1. **O JSON no fim desta mensagem**: as respostas da apresentação e do questionário de cotação Vida Sócios de uma empresa (quem respondeu, sócios, idades, participações, capitais escolhidos, o que ele disse sobre mortes anteriores na sociedade, o que "não sabe").
2. **Anexos que eu vou adicionar nesta conversa**: contrato social (última alteração consolidada), balanço patrimonial e DRE (dois últimos exercícios) e, quando houver, cotações da Pessoa Chave e do Resgatável.

Seu trabalho: analisar tudo e me devolver um **desenho de coberturas** fundamentado, os **gaps do contrato social**, os **insights financeiros** e **por que o seguro é importante para ESTA empresa** — com números dela, não genéricos.

## Regras (não quebre nenhuma)

- **Nunca invente.** Marque a origem de cada afirmação: **[CLIENTE]** (respondeu no questionário), **[CONTRATO]** (cláusula tal), **[BALANÇO]**/**[DRE]** (conta tal, exercício tal), **[COTAÇÃO]** (nº da cotação), **[REGRA DO PRODUTO]** (condição geral) ou **[INFERÊNCIA]** (sua dedução, explicando de onde veio).
- Onde o cliente respondeu "não sei", isso vira **pendência**, não suposição.
- **Sem promessa de preço.** Só use valores de prêmio que estejam nas cotações anexadas. Sem cotação, fale em ordem de grandeza e diga que falta cotar.
- **Não é parecer jurídico nem contábil.** Toda sugestão de cláusula termina com "o advogado da empresa redige"; todo ponto fiscal, com "o contador confirma".
- Se um sócio aparece como **espólio**, ele não é segurável: trate como sinal de que a sociedade já viveu uma sucessão.
- Idades: calcule na data de hoje a partir da data de nascimento do contrato social ou do questionário.

## Regras dos produtos (use para elegibilidade e custo)

**Pessoa Chave** — a empresa contrata e recebe.
- Capital de R$ 200 mil a R$ 12 milhões por sócio; capitais podem ser diferentes; nem todos precisam entrar.
- Contratação de 18 a 80 anos, "em plena atividade profissional", com questionário de saúde obrigatório. Sem carência para morte.
- Invalidez permanente por acidente (100% da básica, pela tabela) e doenças graves (50% da básica, até R$ 500 mil, uma vez, carência de 6 meses): contratação até 65 anos, pagas **ao próprio sócio**; encerram aos 75.
- Vigência vitalícia, pagamento mensal ou anual. **O prêmio é recalculado a cada aniversário pela idade, além do IPCA.** Percentuais de reajuste por idade (morte): 41–49 ≈ 6,3% a 6,8% ao ano; 50 = 3,3%; 51–60 ≈ 8,3% a 9,2%; 61–80 ≈ 8,2% a 8,9%. O capital é corrigido pelo IPCA, mas não pode ser aumentado depois. **Não tem resgate**: se ninguém faltar, o valor pago é custo de proteção. Se o sócio sair da sociedade, a cobertura dele termina.
- Não é preciso alterar o contrato social para contratar. No sinistro, a empresa prova o vínculo com o contrato social, atas ou procurações.

**Resgatável Único (Empresarial Flexível Resgatável)** — a empresa contrata; a família (beneficiários livres) recebe.
- Capital de R$ 200 mil (piso comercial da corretora) a R$ 12 milhões. Pagamento único (ou mensal/anual, vitalício ou por 10 a 30 anos).
- Versão com questionário de saúde: sem carência, até 80 anos, com doenças graves (até 65 anos, vigência de 10 anos). Versão sem questionário: 24 meses de carência para morte por doença, até 70 anos, cerca de 6% mais cara.
- **Sem reajuste pela idade**; capital corrigido pelo IPCA todo ano. Resgate a partir do 7º mês: saldo da reserva (não o valor pago). Exemplo real, 45 anos, só morte de R$ 1 mi, sem carência, pagamento de R$ 524.741,39: resgate de R$ 475 mil no 1º ano (91%), R$ 533 mil no 6º (passa o pago), R$ 580 mil no 10º (111%), R$ 698 mil no 20º (133%), R$ 802 mil no 30º (153%) — valores antes do IPCA.
- Referência de preço, morte R$ 1 mi, com questionário, pagamento único: 30 anos ≈ R$ 362 mil; 45 ≈ R$ 525 mil; 50 ≈ R$ 589 mil; 55 ≈ R$ 655 mil; 62 ≈ R$ 749 mil.
- Indenização por morte isenta de IR e fora do inventário (art. 794 do Código Civil). Resgate de produto pago pela empresa: IR na fonte pela tabela progressiva sobre o valor total (regra de hoje). O sócio que sai da sociedade tem direito ao resgate.
- Sócio que participa por holding não entra; a holding pode contratar o dela.

## Entregue nesta ordem

**PARTE A — para o corretor**

1. **Retrato da sociedade.** Tabela: sócio · % · idade · papel (administra / trabalha / não atua / aposentado / espólio) · parte em R$. Aponte blocos familiares, cotas que parecem herdadas, viúvos, espólios e quem assinou por procuração.
2. **O que o contrato social diz — e o que falta.** Cite as cláusulas de morte, retirada, herdeiros, apuração e pagamento de haveres, administração e quórum. Depois, os **gaps**, conferindo pelo menos: existe fonte de recursos para pagar os haveres? O critério de avaliação é claro? O prazo de pagamento cabe no caixa para a maior cota? Há quórum e prazo para aceitar ou recusar herdeiros? Há regra para incapacidade/interdição? Há substituto se o administrador faltar (procurações acabam com a morte de quem as deu — art. 682 do CC)? Como vota um espólio? Existe acordo de sócios? Para cada gap: o risco em uma frase e a sugestão (o advogado redige).
3. **Leitura financeira.** PL, caixa e aplicações, dívida, geração de caixa operacional, lucro, distribuição, créditos a receber e reservas. **Valor das partes**: use o PL como piso e diga se há sinal de que o balanço especial daria mais. Monte **a conta da cláusula de haveres**: parte de cada sócio ÷ número de parcelas do contrato = parcela mensal, e compare com o caixa e a geração de caixa.
4. **Desenho de coberturas, sócio a sócio.** Tabela: sócio · idade · Pessoa Chave (capital e por quê) · doenças graves/invalidez (sim/não, por idade) · Resgatável (capital para a família e por quê) · elegibilidade a confirmar. Depois, **três cenários**: essencial, recomendado e completo — com capital total e % das cotas cobertas.
5. **O que o custo representa (seja honesto).** Pessoa Chave: prêmio anual total e por sócio (se houver cotação), em % do lucro, da receita, do caixa e da distribuição do último exercício. Projete 5 e 10 anos com o reajuste por idade + IPCA de 5% (exemplo) e mostre o custo acumulado. Diga com todas as letras: não há resgate. Compare com formar um fundo próprio. Resgatável: quanto a empresa paga uma vez, quanto a família recebe por R$ 100, e o custo real se resgatar em 1, 5, 10 e 20 anos.
6. **Pendências.** Tudo o que falta para fechar a cotação, em lista, na ordem em que eu devo resolver.

**PARTE B — mensagem curta para o cliente**, em português de dono de empresa, sem jargão, sem promessa de prazo, sem citar seguradora.

**PARTE C — JSON da proposta**, no formato que o editor de propostas espera (empresa, socios, pessoaChave, resgatavel, analise, casos, validade).

---

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const so = s => String(s || '').replace(/\D/g, '');
const cap0 = v => v == null || v === '' || isNaN(v) ? null : Number(v);

  const n = cap0(v); if (n == null) return '—';
  if (n >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';

}
function mCNPJ(v) { const d = so(v); return d.length === 14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : (v || ''); }
function mTel(v) { const d = so(v); if (d.length === 11) return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3'); if (d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3'); return v || ''; }

  if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) i--;

}

const Q_PAGRG = { unico: 'Pagamento único', comparar: 'Quer ver também anual e mensal' };

function txtApres(item, v) {
  if (v == null || v === '') return null;
  if (Array.isArray(v)) { const l = v.map(x => (item.ops && item.ops[x]) || x).filter(Boolean); return l.length ? l.join(' · ') : null; }
  if (item.idx) { const i = Number(v); return item.idx[i] != null ? item.idx[i] : String(v); }
  if (item.ops && item.ops[v]) return item.ops[v];
  if (typeof v === 'object') return null;
  return String(v);
}

/* ═══ leitura dos dados ═══ */
const Q = () => (D && D.questionario) || {};
const AQ = () => (D && D.analiticoQ) || {};
const R = () => (D && D.respostas) || {};
const SOCIOS = () => {
  const a = AQ().socios;
  if (Array.isArray(a) && a.length) return a;
  return (Q().socios || []).filter(s => s.incluir).map(s => ({ nome: s.nome, pct: s.pct, idade: s.idade, nasc: s.nasc, sexo: s.sexo, atua: s.atua, porSocio: s.porSocio, capitalPc: null, capitalRg: null }));
};
const ANEXOS = () => (D && D.apoliceAnexos) || [];
const CONTATO = () => R().contato || {};
const temPC = () => ['pc', 'ambas', 'rec'].includes(Q().produtos);
const temRG = () => ['rg', 'ambas', 'rec'].includes(Q().produtos);

/* ═══ o que falta para cotar ═══ */
function pendencias() {
  const out = [], q = Q(), c = CONTATO(), ss = SOCIOS();
  const add = (grave, t) => out.push({ grave, t });

  if (!D.questionarioCompleto) {
    const p = D.passo || 0, t = D.questTotal || 0;
    add(true, 'Questionário não foi concluído' + (t ? ` — parou na etapa ${p} de ${t}` : '') + '. Os capitais podem mudar.');
  }
  if (!so(q.cnpj)) add(true, 'CNPJ não informado.');
  if (!ss.length) add(true, 'Nenhum sócio marcado para entrar no seguro.');

  const semNasc = ss.filter(s => !s.nasc && s.idade == null).map(s => s.nome || 'sócio sem nome');
  if (semNasc.length) add(true, 'Sem data de nascimento: ' + semNasc.join(', ') + '. A seguradora não cota sem isso.');

  const semCap = ss.filter(s => !cap0(s.capitalPc) && !cap0(s.capitalRg)).map(s => s.nome || 'sócio sem nome');
  if (semCap.length) add(true, 'Sem capital definido: ' + semCap.join(', ') + '.');

  ss.forEach(s => {
    const id = s.idade != null ? s.idade : idadeDe(s.nasc);
    const nome = s.nome || 'Um sócio';
    if (id == null) return;
    if (id > 80) add(true, `${nome} tem ${id} anos — acima do limite de contratação (80).`);
    else if (id > 65 && q.dg === 'sim') add(false, `${nome} tem ${id} anos — não entra em doenças graves nem invalidez (limite 65). Só a cobertura de morte.`);
    if (id > 70 && q.versao === 'carencia' && cap0(s.capitalRg)) add(true, `${nome} tem ${id} anos — a versão sem questionário de saúde vai até 70. Tem que ser a versão com questionário.`);
    if (s.porSocio) add(false, `${nome} pediu capital diferente do sugerido — confira o valor antes de cotar.`);
  });

  const holding = (R().perfil || []).includes && (R().perfil || []).includes('holding');
  if (holding) add(false, 'Ele marcou que um sócio participa por holding — esse sócio não entra; a holding contrata no CNPJ dela.');

  const comp = (R().compartilhadoEm || []).length || (R().compartilhou || []).length;
  if (comp && GRUPO_DOCS.filter(d => d.id !== SESSAO).length === 0)
    add(false, 'Ele passou o link para outra pessoa, mas ninguém mais respondeu.');
  if (!c.email && !c.tel) add(true, 'Sem e-mail nem telefone de contato.');
  if (!ANEXOS().length) add(false, 'Nenhum documento anexado — sem contrato social e balanço, a análise fica limitada.');
  if (q.valorFaixa == null && !cap0(q.valorExato)) add(false, 'Valor da empresa não informado.');
  if (q.acordo === 'naosei' || q.acordo === 'nao') add(false, 'Sem acordo de sócios nem valuation — vale checar a cláusula de haveres no contrato.');

  return out;
}

      participacaoPct: s.pct === '' ? null : cap0(s.pct),
      papel: s.atua || null, papelTexto: Q_ATUA[s.atua] || null,
      capitalPessoaChave: cap0(s.capitalPc), capitalResgatavel: cap0(s.capitalRg),
      capitalEscolhidoPorEle: !!s.porSocio
    })),
    respostasDaApresentacao: APRES.reduce((o, it) => { const t = txtApres(it, R()[it.k]); if (t) o[it.p] = t; return o; }, {}),
    preDiagnosticoQueEleViu: (D.diagnostico || []).map(t => String(t).replace(/<[^>]+>/g, '')),
    documentos: ANEXOS().map(x => ({ nome: x.nome, enviadoEm: x.enviadoEm })),
    pendenciasDetectadas: pendencias().map(p => (p.grave ? 'IMPEDE: ' : 'atenção: ') + p.t)
  };
}

function copiarIA() {
  const prompt = document.getElementById('promptIA').textContent.trim();
  copiar(prompt + '\n\n```json\n' + JSON.stringify(dadosParaIA(), null, 2) + '\n```\n',
    'Prompt + dados copiados. Cole no Claude e anexe contrato social, balanço e cotações.');
}

function copiarResumo() {
  const q = Q(), c = CONTATO(), ss = SOCIOS();
  const totPc = ss.reduce((t, s) => t + (cap0(s.capitalPc) || 0), 0);
  const totRg = ss.reduce((t, s) => t + (cap0(s.capitalRg) || 0), 0);
  const L = [];
  L.push('VIDA SÓCIOS · ' + (q.empresa || D.empresaNome || 'empresa'));
  if (q.cnpj) L.push('CNPJ ' + mCNPJ(q.cnpj));
  L.push('Contato: ' + (c.nome || '—') + (c.tel ? ' · ' + mTel(c.tel) : '') + (c.email ? ' · ' + c.email : ''));
  L.push('');
  L.push('Quer cotar: ' + (Q_PRODUTOS[q.produtos] || '—'));
  if (temPC()) L.push('Pessoa Chave — pagamento ' + (Q_PAGPC[q.pagPc] || '—') + (totPc ? ' · capital ' + brlCurto(totPc) : ''));
  if (temRG()) L.push('Resgatável — ' + (Q_PAGRG[q.pagRg] || '—') + (totRg ? ' · capital ' + brlCurto(totRg) : '') + ' · ' + (Q_VERSAO[q.versao] || '—'));
  L.push('Coberturas em vida: ' + (Q_DG[q.dg] || '—'));
  L.push('');
  L.push('Sócios:');
  ss.forEach(s => {
    const id = s.idade != null ? s.idade : idadeDe(s.nasc);
    L.push('· ' + (s.nome || '—') + (id != null ? ' · ' + id + ' anos' : ' · idade não informada') +
      (s.pct !== '' && s.pct != null ? ' · ' + s.pct + '%' : '') +
      (cap0(s.capitalPc) ? ' · PC ' + brlCurto(s.capitalPc) : '') +
      (cap0(s.capitalRg) ? ' · RG ' + brlCurto(s.capitalRg) : ''));
  });
  const p = pendencias();
  if (p.length) { L.push(''); L.push('Falta:'); p.forEach(x => L.push((x.grave ? '! ' : '- ') + x.t)); }
  L.push(''); L.push('Documentos: ' + (ANEXOS().length ? ANEXOS().map(a => a.nome).join(', ') : 'nenhum'));
  copiar(L.join('\n'), 'Resumo copiado');
}

/* ═══ render ═══ */
function render() {
  document.getElementById('app').innerHTML = `
    <div class="acoes">
      <button class="bt primario" onclick="copiarIA()">🧠 Copiar para a IA</button>
      <button class="bt" onclick="window.print()">📄 Gerar PDF</button>
      <button class="bt" onclick="copiarResumo()">📋 Copiar resumo</button>
      <span class="espaco"></span>
      <button class="bt" onclick="location.reload()">↻ Atualizar</button>
    </div>
    ${blocoCabecalho()}
    ${blocoSemaforo()}
    ${blocoPedido()}
    ${blocoSocios()}
    ${blocoAnexos()}
    ${blocoGrupo()}
    ${blocoRespostas()}
    ${blocoDiagnostico()}
    <p style="text-align:center; font-size:11.5px; color:#94a3b8; margin-top:16px;">
      Ficha gerada em ${new Date().toLocaleDateString('pt-BR')} · uso interno da corretora · não enviar ao cliente
    </p>`;
}

function erro(t) {
  document.getElementById('app').innerHTML = `<div class="bloco" style="text-align:center; padding:50px 24px;">
    <h2 style="margin-bottom:6px">${esc(t)}</h2>
    <p class="sub">Abra a ficha pelo botão do painel, no card do registro.</p></div>`;
}

(async function iniciar() {
  if (!SESSAO) { erro('Faltou dizer qual registro abrir.'); return; }
  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (!fbOk) { erro('Não consegui conectar ao banco de dados.'); return; }
  try {
    await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
    if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    db = firebase.firestore();
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) { erro('Não encontrei este registro.'); return; }
    D = doc.data();
    // Quem mais respondeu pelo mesmo link (cada pessoa vira um registro no mesmo grupo).
    if (D.grupo) {
      try {
        const q = await db.collection('mb_apresentacoes').where('grupo', '==', D.grupo).limit(20).get();
        GRUPO_DOCS = q.docs.map(x => Object.assign({ id: x.id }, x.data()));
      } catch (e) { console.warn('grupo', e); }
    }
  } catch (e) { console.warn('ficha', e); erro('Não consegui abrir a ficha agora.'); return; }
  render();
})();
</script>
