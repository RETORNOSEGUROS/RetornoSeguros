/* Preço real por FAIXA de vidas — Bradesco Dental SPG, plano Padrão Doc

  { de: 3,    ate: 29,   vida: 27.42 },

];

function faixaPreco(vidas) { return FAIXAS_PRECO.find(f => vidas >= f.de && (f.ate === null || vidas <= f.ate)) || null; }

/* Máquina de escrever só na PRIMEIRA tela (vende a mágica uma vez). Depois,
   texto aparece na hora com um fade — leitor apressado não espera. E durante a
   digitação, um toque em qualquer lugar completa o texto na hora. */
let _jaDigitou = false, _pularDigitar = false;
function _skipDigitar() { _pularDigitar = true; }
async function digitar(el, html, vel) {
  const full = String(html).replace(/\n/g, '<br><br>');
  if (_jaDigitou) { el.innerHTML = full; el.style.animation = 'entra .3s'; return; }
  _jaDigitou = true; _pularDigitar = false;
  window.addEventListener('pointerdown', _skipDigitar);
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buffer = '';
  outer:
  for (const p of partes) {
    if (p.startsWith('<')) { buffer += p; el.innerHTML = buffer + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      if (_pularDigitar) break outer;
      buffer += (ch === '\n') ? '<br><br>' : ch;
      el.innerHTML = buffer + '<span class="cursor"></span>';
      await espera('.!?'.includes(ch) ? (vel || 14) * 8 : ',;:'.includes(ch) ? (vel || 14) * 4 : (vel || 14));
    }
  }
  window.removeEventListener('pointerdown', _skipDigitar);
  el.innerHTML = full;
}
function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }

/* Cria/atualiza o documento deste respondente (um por papel) quando o perfil
   e' escolhido. Nao apaga registros de outros papeis do mesmo grupo. */
async function criarDocRespondente() {
  try {
    if (!SESSAO) return;
    const ref = db.collection('mb_apresentacoes').doc(SESSAO);
    const snap = await ref.get();
    const payload = Object.assign({}, BASEDOC, {
      grupo: GRUPO, perfilPapel: PERFIL_PAPEL, perfilPapelTexto: PAPEL_TXT[PERFIL_PAPEL],
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    if (!snap.exists) payload.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await ref.set(payload, { merge: true });
  } catch (e) { console.warn('doc respondente', e); }
  salvarParcial();
}

async function renderCena(i) {
  const visiveis = cenasVisiveis();
  const c = visiveis[i];
  if (!c) return renderResultado();
  progresso(6 + (i / (visiveis.length + 1)) * 90);
  if (c.calc === 'salario') return renderCalcSalario(c, i);
  if (c.tipo === 'numero') return renderNumero(c, i);

  const classeOp = c.muitas ? 'opcoes muitas' : c.lista ? 'opcoes lista' : 'opcoes';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">${c.rotulo}</div>
      <div class="titulo">${c.titulo}</div>
      <div class="corpo" id="corpo"></div>
      ${c.passos ? `<div id="passos" style="display:none;"><div class="passos">${c.passos.map(pp => `<div class="passo"><div class="num">${pp[0]}</div><div class="tx"><b>${pp[1]}</b><span>${pp[2]}</span></div></div>`).join('')}</div></div>` : ''}
      ${c.grade ? `<div id="grade" style="display:none;">
        <div class="grade-cob">${c.grade.map(g => `<div class="cob"><div class="t">${g[0]} ${g[1]}</div><div class="e">${g[2]}</div></div>`).join('')}</div>
        ${c.naoCobre ? `<div class="lbl" style="margin-top:16px;">No plano padrão NÃO entram:</div>
        <div class="nao-cob">${c.naoCobre.map(t => `<div>✕ ${t}</div>`).join('')}</div>` : ''}
      </div>` : ''}
      ${c.destaque ? `<div class="destaque" id="dest" style="display:none;">💭 ${c.destaque}</div>` : ''}
      <div class="zona-resposta" id="zona">
        <div class="pergunta">${c.pergunta}</div>
        <div class="${classeOp}" id="ops">${c.opcoes.map((o, k) => `<button class="op" data-k="${k}">${o.txt}</button>`).join('')}</div>
        <div id="eco" style="display:none;"></div>
        ${c.tipo === 'multi' ? '<button class="btn btn-ouro" id="btMultiOk" style="margin-top:16px;">Continuar →</button>' : ''}
      </div>
      <div class="pular"><a id="lkPular">pular apresentação →</a></div>
    </div>`;
  window.scrollTo(0, 0);
  await digitar($('corpo'), c.corpo, 15);
  if (c.passos) { await espera(160); const pz = $('passos'); pz.style.display = 'block'; pz.style.animation = 'entra .5s'; }
  if (c.grade) { await espera(200); const g = $('grade'); g.style.display = 'block'; g.style.animation = 'entra .5s'; }
  if (c.destaque) { await espera(240); const d = $('dest'); d.style.display = 'block'; d.style.animation = 'entra .5s'; d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  await espera(260);
  const zn = $('zona'); zn.classList.add('on');
  await espera(160); zn.scrollIntoView({ behavior: 'smooth', block: 'end' });

  /* O eco verde e' a nossa resposta a' escolha do cliente. Antes ele sumia
     sozinho em 1,1s e ninguem terminava de ler. Agora fica na tela ate' a
     pessoa clicar em Continuar — quem le' rapido nao espera, quem le' devagar
     nao perde. Quando a cena e' multi (varias escolhas), mostramos UM eco
     verde por escolha, empilhados, antes de seguir. */
  const ecoBloco = txt => `<div class="destaque eco-verde">${txt}</div>`;
  const mostrarEcoRaw = (html, entao) => {
    const e = $('eco');
    if (!html) return entao && entao();
    e.style.display = 'block';
    e.innerHTML = html + `<button class="btn btn-ouro" id="btEcoOk" style="margin-top:14px;width:100%;">Continuar →</button>`;
    e.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    $('btEcoOk').onclick = () => { $('btEcoOk').disabled = true; entao && entao(); };
  };
  const mostrarEco = (txt, entao) => mostrarEcoRaw(txt ? ecoBloco(txt) : '', entao);
  const avancar = () => { salvarParcial(); const nv = cenasVisiveis(); const pos = nv.findIndex(x => x.campo === c.campo); iCena = (pos >= 0 ? pos : i) + 1; iCena < nv.length ? renderCena(iCena) : renderResultado(); };

  if (c.tipo === 'multi') {
    const iTudo = c.opcoes.findIndex(o => ['tudo', 'nenhuma'].includes(o.v));
    $('ops').querySelectorAll('.op').forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k); b.style.animation = 'none';
      if (k === iTudo) { $('ops').querySelectorAll('.op').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); }
      else { b.classList.toggle('sel'); if (iTudo >= 0) $('ops').querySelector(`.op[data-k="${iTudo}"]`).classList.remove('sel'); }
    });
    $('btMultiOk').onclick = () => {
      const sel = [...$('ops').querySelectorAll('.op.sel')].map(b => c.opcoes[Number(b.dataset.k)]);
      if (!sel.length) { $('btMultiOk').textContent = 'Marque ao menos uma opção →'; return; }
      RESP[c.campo] = { valores: sel.map(o => o.v), textos: sel.map(o => o.txt) };
      $('btMultiOk').style.display = 'none';
      const combinado = c.mostrarEcos
        ? sel.filter(o => o.eco).map(o => ecoBloco(o.eco)).join('')
        : (c.eco ? ecoBloco(c.eco) : '');
      mostrarEcoRaw(combinado, avancar);
    };
  } else {
    $('ops').querySelectorAll('.op').forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k), o = c.opcoes[k];
      $('ops').querySelectorAll('.op').forEach(x => { x.classList.remove('sel'); x.style.animation = 'none'; });
      b.classList.add('sel');
      RESP[c.campo] = { valor: o.v, texto: o.txt, i: k };
      mostrarEco(o.eco || c.eco, avancar);
    });
  }
  $('lkPular').onclick = () => renderResultado();
}

/* ─── CÁLCULOS DO RESULTADO ─── */
const fmt = v => 'R$ ' + Number(Math.round(v)).toLocaleString('pt-BR');                 // totais, em reais
const fmtC = v => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); // por pessoa, com centavos
function headcountFaixa() { const r = RESP.headcount; if (!r || typeof r.i !== 'number') return null; return DIC.headcount[r.i] || null; }
/* O valor por pessoa e' o da FAIXA (nao um chute): fechado da 100-199 => R$18,15.
   O total da empresa e' uma faixa honesta: do piso (de x vida) ao teto (ate x
   vida). Faixa aberta (mais de 1.000) vira "a partir de", porque a conta cai
   por pessoa conforme cresce e prometer um teto seria mentira. */
// nº exato de colaboradores (novo input numérico); cai na âncora da faixa p/ docs antigos
function headcountNum() { const r = RESP.headcount; if (r && typeof r.n === 'number' && r.n > 0) return r.n; const f = headcountFaixa(); return f ? f[3] : null; }
function custoMensal() {
  const n = headcountNum(); const fx = headcountFaixa();
  if (!n && !fx) return null;
  if (n) {
    const fp = faixaPreco(n); if (!fp) return null;
    return { vida: fp.vida, de: n, ate: n, aberta: false, vidas: n, exato: true, min: n * fp.vida, max: n * fp.vida };
  }
  const aberta = (fx[2] === null || fx[2] === undefined);
  const ancora = aberta ? fx[1] : fx[3];
  const fp = faixaPreco(ancora); if (!fp) return null;
  const de = fx[1], ate = aberta ? null : fx[2];
  return { vida: fp.vida, de: de, ate: ate, aberta: aberta, vidas: ancora,
           min: de * fp.vida, max: aberta ? null : ate * fp.vida };
}
/* A regra real da operadora (contrato Bradesco Dental SPG): urgencia e
   emergencia valem em 24h SEMPRE; a isencao total de carencia so' existe em
   contrato acima de 30 vidas para quem adere nos 30 primeiros dias da
   vigencia. Prometer "sem carencia" para uma empresa de 12 pessoas seria
   vender uma coisa e entregar outra. */
function isencaoCarencia() { const n = headcountNum(); if (n) return n >= 31; const f = headcountFaixa(); if (!f) return null; return f[1] >= 31; }
function textoCarencia() {
  const iz = isencaoCarencia();
  if (iz === true)  return 'Urgência e emergência em 24h. E como o contrato passa de 30 vidas, <b>quem aderir nos 30 primeiros dias da vigência entra isento de carência</b> — o time usa no primeiro mês.';
  if (iz === false) return 'Urgência e emergência em <b>24h</b>. Demais procedimentos em 180 dias; novos admitidos entram em até 30 dias da admissão.';
  return 'Urgência e emergência em <b>24h</b>. Em contratos acima de 30 vidas, quem adere nos 30 primeiros dias da vigência fica isento de carência.';
}
function limpezaFaixa() { const r = RESP.limpeza; if (!r || typeof r.i !== 'number') return null; const l = DIC.limpeza[r.i]; if (!l || l[0] === 'lp_naosei') return null; return { min: l[1], max: l[2] }; }

/* Cena "salário invisível": cruza o nº EXATO de colaboradores com a média de uso
   por procedimento no Brasil e o custo de referência de mercado. Mostra, um a um,
   quantos colaboradores fariam cada procedimento no ano e quanto gastariam — e o
   total que a empresa poupa pro time. Limpeza e restauração alinham com o Censo
   ABIMO/CFO 2024; os demais são referência de mercado. Tudo marcado como estimativa. */
const PROCS_SI = [
  { ic: '🦷', nome: 'limpeza', pct: 0.51, de: 150, ate: 350, estim: true },
  { ic: '🛠️', nome: 'restauração', pct: 0.31, de: 200, ate: 500 },
  { ic: '🚑', nome: 'urgência / dor', pct: 0.20, de: 150, ate: 300 },
  { ic: '😬', nome: 'extração', pct: 0.10, de: 250, ate: 600 },
  { ic: '🩺', nome: 'canal', pct: 0.07, de: 1200, ate: 2500 }
];

  const N = headcountNum();

    if (p.estim && lz) { de = lz.min; ate = lz.max || lz.min + 200; }   // limpeza: usa a estimativa do cliente
    const mid = Math.round((de + ate) / 2);
    const n = Math.max(1, Math.round(N * p.pct));
    return { ...p, n, mid, total: n * mid };
  });
  const totalEquipe = rows.reduce((t, r) => t + r.total, 0);
  const custoUmTodos = rows.reduce((t, r) => t + r.mid, 0);   // um colaborador que faz TODOS no ano

    sp.delete('p');
    const linkCompartilhar = location.origin + location.pathname + (sp.toString() ? '?' + sp.toString() : '');
    const msg = (nome ? 'Oi ' + nome + '! ' : 'Oi! ')
      + 'Recebi esta apresentação sobre plano odontológico para o time d' + (empresa === 'nossa empresa' ? 'a ' : 'a ') + empresa
      + '. São poucos minutos e no fim mostra o custo por pessoa. Dá uma olhada e me diz o que acha: '
      + linkCompartilhar;
    try {
      if (SESSAO) await db.collection('mb_apresentacoes').doc(SESSAO).set({
        encaminhamentos: firebase.firestore.FieldValue.arrayUnion({ nome: nome || null, telefone: dig, em: new Date().toISOString() }),

/* ─── PDF ─── */
function gerarPDF(cm, lz) {
  try {

    const W = 210, M = 18; let y = 0;
    const sa = s => String(s || '').replace(/<[^>]+>/g, '').replace(/[""]/g, '"').replace(/[–—]/g, '-').normalize('NFD').replace(/[̀-ͯ]/g, '');
    const quebra = (lim) => { if (y > lim) { doc.addPage(); y = M + 6; } };

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 46, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(20); doc.setFont(undefined, 'bold');
    doc.text('Plano Dental para o seu time', M, 24);
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(147, 164, 200);
    doc.text(sa('O beneficio de menor custo por pessoa  ·  Retorno Seguros'), M, 33);
    y = 58;

    if (cm) {
      doc.setFillColor(236, 253, 245); doc.roundedRect(M, y - 7, W - M * 2, 42, 2, 2, 'F');
      doc.setFontSize(8.5); doc.setFont(undefined, 'bold'); doc.setTextColor(6, 95, 70);
      doc.text('CUSTO ESTIMADO DO BENEFICIO', M + 5, y);
      doc.setFontSize(16); doc.text(sa(fmtC(cm.vida) + ' por pessoa / mes'), M + 5, y + 10);
      doc.setFontSize(8); doc.setFont(undefined, 'normal'); doc.setTextColor(6, 78, 59);
      doc.text(sa(cm.aberta ? 'Faixa de mais de 1.000 vidas (tabela Bradesco Dental SPG):' : 'Faixa de ' + cm.de + ' a ' + cm.ate + ' vidas (tabela Bradesco Dental SPG):'), M + 5, y + 17);
      doc.text(sa('Por pessoa / mes: ' + fmtC(cm.vida) + '   |   Por pessoa / ano: ' + fmt(cm.vida * 12)), M + 5, y + 23);
      doc.text(sa('A empresa / mes: ' + (cm.aberta ? 'a partir de ' + fmt(cm.min) : fmt(cm.min) + ' a ' + fmt(cm.max))), M + 5, y + 29);
      doc.text(sa('A empresa / ano: ' + (cm.aberta ? 'a partir de ' + fmt(cm.min * 12) : fmt(cm.min * 12) + ' a ' + fmt(cm.max * 12))), M + 5, y + 35);
      y += 46;
    }
    if (lz) {
      doc.setFontSize(11); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
      doc.text(sa('O ano inteiro de plano por pessoa: ' + (cm ? fmt(cm.vida * 12) : 'a partir de ' + fmt(PRECO_VIDA_MENOR * 12))), M, y); y += 6;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const l = doc.splitTextToSize(sa('Voce estimou ' + fmt(lz.min) + (lz.max ? ' a ' + fmt(lz.max) : '+') + ' para UMA limpeza particular. O ano inteiro de plano custa quase o mesmo - e cobre consulta, limpeza, urgencia, canal, extracao e mais, para a pessoa e a familia.'), W - M * 2);
      doc.text(l, M, y); y += l.length * 4.6 + 8;
    }

    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Por que vale a pena', M, y); y += 8;
    [['Menor custo por vida', (cm ? fmtC(cm.vida) + ' por pessoa/mes na sua faixa (' + fmt(cm.vida * 12) + ' por pessoa no ano inteiro)' : 'de ' + fmtC(PRECO_VIDA_MENOR) + ' a ' + fmtC(PRECO_VIDA_MAIOR) + ' por pessoa/mes conforme o numero de vidas') + ' - o beneficio de menor custo do mercado.'],
     ['Carencia curta', String(textoCarencia()).replace(/<[^>]+>/g, '')],
     ['Cobertura nacional', 'Mais de 27 mil dentistas credenciados em cerca de 2.550 municipios. O funcionario se atende em qualquer cidade do Brasil - viajando, transferido ou morando fora.'],
     ['Movimentacao facil', 'A empresa ganha um login da corretora com a lista do time: quem sai, um clique em "retirar"; quem entra, voce manda os dados e a corretora faz a inclusao. Sem papel e sem formulario.'],
     ['Familia inclusa', 'Conjuge, companheiro(a), filhos ate 21 anos (ou 29 estudando), filhos invalidos e agregados - sem nova implantacao.'],
     ['Gestao facil', 'Cartao digital no app, busca de dentista pelo celular, equipe de implantacao dedicada e acoes de prevencao (SIPAT, palestras).']
    ].forEach(([t, d]) => {
      quebra(252);
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + sa(t), M, y); y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const ld = doc.splitTextToSize(sa(d), W - M * 2 - 5); doc.text(ld, M + 4, y); y += ld.length * 4.4 + 4;
    });

    y += 4; quebra(230);
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('O que o plano cobre, na pratica', M, y); y += 7;
    [['Diagnostico', 'Consulta odontologica inicial'],
     ['Urgencia e emergencia', 'Alivio de dor e hemorragia'],
     ['Prevencao', 'Limpeza, aplicacao de fluor e orientacao'],
     ['Dentistica', 'Restauracoes e obturacoes'],
     ['Radiologia', 'Raio-X periapical e panoramico'],
     ['Periodontia', 'Tratamento de gengiva e raspagem'],
     ['Endodontia', 'Tratamento de canal'],
     ['Cirurgia oral', 'Extracoes, dente do siso e biopsias'],
     ['Odontopediatria', 'Selante e verniz fluoretado para os filhos'],
     ['Protese', 'Coroas e nucleos previstos no Rol da ANS']
    ].forEach(([t, d]) => {
      quebra(258);
      doc.setFontSize(9.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + sa(t) + ':', M, y);
      doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      doc.text(sa(d), M + 42, y); y += 5.2;
    });
    y += 3; quebra(250);
    doc.setFontSize(9.5); doc.setFont(undefined, 'bold'); doc.setTextColor(159, 18, 57);
    doc.text('Nao entram no plano padrao:', M, y); y += 5;
    doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
    const ln = doc.splitTextToSize(sa('Implante e protese sobre implante, clareamento a laser e facetas, consulta domiciliar, medicamentos de uso domiciliar e tratamento fora do Brasil.'), W - M * 2);
    doc.text(ln, M, y); y += ln.length * 4.4 + 8;

    quebra(250);
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Planos disponiveis', M, y); y += 8;
    [['Plano essencial', '217 eventos cobertos. Reembolso de 1x a tabela. Ideal para comecar com custo enxuto.'],
     ['Plano completo', '308 eventos. Inclui ortodontia completa e protese em porcelana/ceramica. Reembolso de 1 a 8x a tabela.']
    ].forEach(([t, d]) => {
      quebra(252);
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + sa(t), M, y); y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const ld = doc.splitTextToSize(sa(d), W - M * 2 - 5); doc.text(ld, M + 4, y); y += ld.length * 4.4 + 4;
    });

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'normal');
      doc.text('Material informativo. Valores estimados; a proposta final depende do plano, porte e analise da operadora.', M, 288);
      doc.text(`${i}/${n}`, W - M, 288, { align: 'right' });
    }
    doc.save('plano-dental-retorno-seguros.pdf');
  } catch (e) { alert('Não consegui gerar o PDF: ' + e.message); }

/* ─── CAMADA ANALÍTICA ─── */
/* Na cena da regua o cliente marca o que o plano atual JA' faz. A pauta da
   conversa e' o complemento — o que ficou DESmarcado. E se a cena nem apareceu
   (empresa sem plano de outra seguradora), nada foi desmarcado: e' null, nao
   uma lista de quatro falhas que ninguem declarou. */
const REGUA_ITENS = ['fora', 'orto', 'app', 'reembolso'];
function reguaMarcadas() { const r = RESP.regua; return (r && r.valores) ? r.valores : null; }
function reguaTem() { const m = reguaMarcadas(); if (!m) return null; return m.includes('tudo') ? REGUA_ITENS.slice() : m.filter(v => v !== 'tudo'); }
function reguaFalhas() { const m = reguaMarcadas(); if (!m) return null; if (m.includes('tudo')) return []; return REGUA_ITENS.filter(v => !m.includes(v)); }

function montarAnalitico(finalizou) {
  const cod = (campo) => { const r = RESP[campo]; if (!r || typeof r.i !== 'number') return null; const l = (DIC[campo] || [])[r.i]; return l ? l[0] : null; };
  const multi = (campo) => (RESP[campo] && RESP[campo].valores) || [];
  const cm = custoMensal(); const lz = limpezaFaixa();
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao',
    completo: !!finalizou, passo: iCena,
    perfil: PERFIL, perfilCod: cod('perfil'),
    situacaoCod: cod('situacao'), headcountCod: cod('headcount'),
    vidasEstimadas: cm ? cm.vidas : null, vidasFaixaAberta: cm ? !!cm.aberta : null,
    valorVida: cm ? cm.vida : null,
    custoMensalMin: cm ? Math.round(cm.min) : null,
    custoMensalMax: (cm && !cm.aberta) ? Math.round(cm.max) : null,
    dorDenteCod: cod('dorDente'), familiaCod: cod('familia'), medoRH: multi('medoRH'), comoUsaCod: cod('comoUsa'),
    limpezaMin: lz ? lz.min : null, limpezaMax: lz ? lz.max : null,
    reguaTem: reguaTem(), reguaFalhas: reguaFalhas(),
    coberturasUsa: multi('coberturasUsa'),
    isencaoCarencia: isencaoCarencia(),
    oQueMudaria: multi('oQueMudaria'),
    alinhamento: RESP.alinhamento || null
  };
}

/* ─── PERSISTÊNCIA ─── */
function montarRoteiroAp() {
  try {
    var arr = Array.isArray(CENAS) ? CENAS : Object.keys(CENAS).map(function (k) { return CENAS[k]; });
    return arr.filter(function (c) { return c && c.pergunta && c.campo; }).map(function (c) {
      var v = RESP[c.campo], r = null;
      if (v) r = v.texto || (v.textos && v.textos.join(' · ')) || (v.valor != null ? String(v.valor) : (typeof v === 'string' || typeof v === 'number' ? String(v) : null));
      return { k: c.campo, p: (c.pergunta || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(), r: r };
    });
  } catch (e) { return []; }
}

async function salvarParcial(finalizou) {
  try { if (!SESSAO) return;
    const _upd = {
      respostas: RESP, roteiroApres: montarRoteiroAp(), analitico: montarAnalitico(finalizou),
      cenasVistas: Math.min(iCena + 1, cenasVisiveis().length), totalCenas: cenasVisiveis().length,
      grupo: GRUPO, perfilPapel: PERFIL_PAPEL, perfilPapelTexto: PAPEL_TXT[PERFIL_PAPEL] || null,

    await db.collection('mb_apresentacoes').doc(SESSAO).set(_upd, { merge: true });
  } catch (e) { console.warn('salvar parcial', e); }
}

  const params = new URLSearchParams(location.search);

  // GRUPO: token (link da empresa) > ?g repassado num encaminhamento > gerado e guardado

  else {

    if (!GRUPO) { try { GRUPO = sessionStorage.getItem('grupo_ap_dental'); } catch (e) {} }
    if (!GRUPO) { GRUPO = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  }
  BASEDOC = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, grupo: GRUPO, origem: 'apresentacao',
    userAgent: navigator.userAgent.slice(0, 180) };
  // Veio da página de planos (PlanosDental.html): registra a vitrine vista
  if (params.get('de') === 'planos') BASEDOC.vitrineVista = true;
  if (token) {
    try {

      if (!snap.empty) {
        LINK = snap.docs[0].data();
        BASEDOC.linkId = snap.docs[0].id; BASEDOC.empresaId = LINK.empresaId || null; BASEDOC.empresaNome = LINK.empresaNome || null;

        try { await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({ aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e2) {}
      }
    } catch (e) { console.warn('link', e); }
  }
  // o documento por perfil so' e' criado quando a pessoa escolhe quem esta' lendo
  renderVitrine();
});
