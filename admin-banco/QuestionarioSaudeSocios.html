<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --azul-fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --texto:#e8eeff; --suave:#93a4c8; }

  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }

  .grao { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035;
    background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:3px 3px; }
  .palco { position:relative; z-index:2; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;

  .marca { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.22em; color:#4b5f8a; font-weight:700; z-index:3; text-transform:uppercase; }
  .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--ciano),var(--dourado));
    z-index:5; transition:width .5s cubic-bezier(.4,0,.2,1); width:0; box-shadow:0 0 12px rgba(56,189,248,.6); }
  .cena { width:100%; animation:entra .55s cubic-bezier(.16,1,.3,1); }
  @keyframes entra { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:none;} }
  .rotulo { font-size:11px; letter-spacing:.18em; color:var(--ciano); font-weight:700; text-transform:uppercase; margin-bottom:14px; }
  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--ciano); vertical-align:text-bottom; margin-left:2px; animation:pisca .85s step-end infinite; }
  @keyframes pisca { 50%{opacity:0;} }
  .qbolha { background:rgba(13,32,68,.72); border:1px solid rgba(99,132,190,.3); border-left:3px solid rgba(56,189,248,.55);

  .qresp { background:linear-gradient(135deg,rgba(56,189,248,.24),rgba(37,99,235,.2)); border:1px solid rgba(56,189,248,.45);
    border-left:1px solid rgba(56,189,248,.45); border-right:3px solid rgba(56,189,248,.75);
    border-radius:16px 4px 4px 16px; margin-left:auto; margin-bottom:18px; color:#fff; font-weight:500; }
  .qbolha.qresp::before { content:'você'; display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(191,219,254,.75); font-weight:700; margin-bottom:3px; }
  .zona { margin-top:22px; opacity:0; transform:translateY(10px); transition:all .5s; }
  .zona.on { opacity:1; transform:none; }
  .opcoes { display:flex; gap:11px; flex-wrap:wrap; }
  .op { flex:1; min-width:150px; padding:15px 17px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.05);

  .mini-op:hover { border-color:var(--ciano); }
  .mini-op.sel { background:rgba(56,189,248,.22); border-color:var(--ciano); color:#fff; }
  .chips { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  .chip { display:inline-flex; gap:7px; align-items:center; background:rgba(56,189,248,.16); border:1px solid rgba(56,189,248,.4);
    color:#dbeafe; border-radius:100px; padding:7px 13px; font-size:13px; font-weight:600; }
  .chip button { background:none; border:none; color:#93c5fd; cursor:pointer; font-size:14px; line-height:1; padding:0; }
  .resumo-grupo { background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.32); border-radius:12px;
    padding:11px 14px; font-size:13px; color:#bff0dc; margin:10px 0 2px; }
  @media (max-width:520px) { .palco{padding:22px 18px calc(88px + env(safe-area-inset-bottom));} .op{min-width:100%;} .qbolha{max-width:100%;} }

<script>
/* ══════════════════════════════════════════════════════════════════
   QUESTIONÁRIO DE COTAÇÃO — SAÚDE DOS SÓCIOS (segmento premium)
   O que a seguradora precisa para cotar um SPG sócios e diretores:
   quem entra (vínculo + faixa etária de cada vida — é o que define o
   preço), onde moram, o desenho desejado e o plano atual (para a
   comparação). Sem dado de saúde aqui: declaração de saúde é etapa
   da seguradora, avisada com clareza no fim.
   ══════════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PRODUTO = { id: 'saude_socios', nome: 'Saúde dos Sócios — Segmento Premium' };
const ARQ_VERSAO = '1';
window.ARQ_VERSAO = ARQ_VERSAO;

let SESSAO = null, LINK = null, GRUPO = null, PAPEL = null, iQ = 0;
let QRESP = { pessoas: [], cidades: [], _dados: {} };
const historico = [];

/* ─── DICIONÁRIO ANALÍTICO ───
   As faixas etárias batem 1:1 com as faixas de precificação da operadora —
   é o que permite ao corretor cotar direto do painel, sem retrabalho. */
const FAIXAS_IDADE = ['Até 18', '19 a 23', '24 a 28', '29 a 33', '34 a 38', '39 a 43', '44 a 48', '49 a 53', '54 a 58', '59 ou mais'];
const DIC = {
  faixaIdade: [
    ['fx_0_18', 0, 18, 12], ['fx_19_23', 19, 23, 21], ['fx_24_28', 24, 28, 26], ['fx_29_33', 29, 33, 31],
    ['fx_34_38', 34, 38, 36], ['fx_39_43', 39, 43, 41], ['fx_44_48', 44, 48, 46], ['fx_49_53', 49, 53, 51],
    ['fx_54_58', 54, 58, 56], ['fx_59_mais', 59, null, 63]
  ],
  vinculo: [['vn_socio'], ['vn_conjuge'], ['vn_filho'], ['vn_diretor'], ['vn_outro']],
  planoAtual: [['pa_unimed'], ['pa_amil'], ['pa_sulamerica'], ['pa_bradesco'], ['pa_hapvida'], ['pa_outra'], ['pa_nenhum']],
  valorAtual: [
    ['va_ate500', 0, 500, 350], ['va_500_1000', 500, 1000, 750], ['va_1000_1500', 1000, 1500, 1250],
    ['va_1500_2500', 1500, 2500, 2000], ['va_2500_4000', 2500, 4000, 3250], ['va_4000_mais', 4000, null, 5000],
    ['va_naosei', null, null, null], ['va_semplano', null, null, null]
  ],
  desenho: [['ds_premium'], ['ds_intermediario'], ['ds_comparar'], ['ds_recomendacao']],
  coparticipacao: [['cp_sem'], ['cp_com'], ['cp_recomendacao']],
  reembolsoUso: [['ru_muito'], ['ru_asvezes'], ['ru_raramente']],
  dental: [['dt_sim'], ['dt_nao'], ['dt_saber']],
  prazo: [['pz_ja'], ['pz_60d'], ['pz_comparando']]
};
const VINCULOS = ['Sócio(a)', 'Cônjuge', 'Filho(a)', 'Diretor(a)', 'Outro'];

function registrarDado(campo, iOpcao, texto) {
  QRESP._dados = QRESP._dados || {};
  const linha = (DIC[campo] || [])[iOpcao];
  const d = { texto, i: iOpcao };
  if (linha) {
    d.cod = linha[0];
    if (linha.length > 1) {
      d.min = linha[1] === undefined ? null : linha[1];
      d.max = linha[2] === undefined ? null : linha[2];
      d.mid = linha[3] !== undefined ? linha[3] : ((d.min !== null && d.max !== null) ? (d.min + d.max) / 2 : d.min);
    }
  }
  QRESP._dados[campo] = d;
}

function montarAnalitico(finalizou) {
  const D = QRESP._dados || {};
  const g = (c, p) => (D[c] && D[c][p] !== undefined) ? D[c][p] : null;
  const pessoas = (QRESP.pessoas || []).map(p => ({
    vinculoCod: (DIC.vinculo[p.vi] || [null])[0],
    vinculoTexto: VINCULOS[p.vi] || null,
    faixaCod: (DIC.faixaIdade[p.fi] || [null])[0],
    faixaTexto: FAIXAS_IDADE[p.fi] || null,
    idadeMid: DIC.faixaIdade[p.fi] ? DIC.faixaIdade[p.fi][3] : null
  }));
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'questionario',
    completo: !!finalizou, passo: iQ,
    nVidas: pessoas.length || null,
    atingeMinimo: pessoas.length >= 3 ? true : (pessoas.length ? false : null),
    pessoas,
    nSocios: pessoas.filter(p => p.vinculoCod === 'vn_socio').length,
    nDependentes: pessoas.filter(p => ['vn_conjuge', 'vn_filho'].includes(p.vinculoCod)).length,
    idadeMediaMid: pessoas.length ? Math.round(pessoas.reduce((s, p) => s + (p.idadeMid || 0), 0) / pessoas.length) : null,
    planoAtualCod: g('planoAtual', 'cod'), planoAtualTexto: QRESP.planoAtualOutra || null,
    valorAtualCod: g('valorAtual', 'cod'), valorAtualMid: g('valorAtual', 'mid'),
    gastoAtualMensalMid: (g('valorAtual', 'mid') && pessoas.length) ? g('valorAtual', 'mid') * pessoas.length : null,
    desenhoCod: g('desenho', 'cod'), coparticipacaoCod: g('coparticipacao', 'cod'),
    reembolsoUsoCod: g('reembolsoUso', 'cod'), dentalCod: g('dental', 'cod'), prazoCod: g('prazo', 'cod'),
    cidades: (QRESP.cidades && QRESP.cidades.length) ? QRESP.cidades : null,
    cidadeSede: QRESP.cidadeSede || null
  };
}

/* ─── ROTEIRO ─── */
const PERGUNTAS = [
  { fala: 'Boa decisão! Vou levantar o que o corretor precisa para <strong>cotar o plano do seu grupo</strong>. O mais importante é uma coisa só: quem entra e a idade de cada pessoa — é isso que define o valor. Sem documento, sem dado de saúde, sem compromisso.', campo: null },
  { fala: 'Primeiro, o nome da <strong>empresa</strong>:', campo: 'empresa', tipo: 'texto', ph: 'Razão social ou nome fantasia' },
  { fala: 'Em qual <strong>cidade e estado</strong> fica a sede?<br><span style="font-size:12.5px;color:#93a4c8;">A região entra no cálculo do prêmio.</span>', campo: 'cidadeSede', tipo: 'texto', ph: 'Ex.: Passo Fundo, RS' },
  { fala: 'Agora o coração da cotação: <strong>quem entra no plano</strong>. Para cada pessoa, só o vínculo e a faixa de idade — sem nomes, sem CPF.<br><span style="font-size:12.5px;color:#93a4c8;">O contrato pede no mínimo 3 vidas, e dependentes contam: um sócio + cônjuge + filho já fecham.</span>', campo: 'pessoas', tipo: 'pessoas' },
  { fala: 'O grupo tem <strong>plano de saúde hoje</strong>? De qual operadora?', campo: 'planoAtual', tipo: 'opcoes', muitas: true,
    opcoes: ['Unimed', 'Amil', 'SulAmérica', 'Bradesco Saúde', 'Hapvida / NDI', 'Outra', 'Nenhum plano'] },
  { fala: 'Quanto sai <strong>por pessoa, por mês</strong>, no plano de hoje — mais ou menos?<br><span style="font-size:12.5px;color:#93a4c8;">Serve para a comparação ser honesta: o que muda de valor e o que muda de entrega.</span>', campo: 'valorAtual', tipo: 'opcoes', muitas: true,
    opcoes: ['Até R$ 500', 'R$ 500 a 1.000', 'R$ 1.000 a 1.500', 'R$ 1.500 a 2.500', 'R$ 2.500 a 4.000', 'Acima de R$ 4.000', 'Não sei de cabeça', 'Não temos plano'] },
  { fala: 'Qual <strong>desenho</strong> você quer ver na cotação?', campo: 'desenho', tipo: 'opcoes', lista: true,
    opcoes: ['⭐ O topo da linha — rede Einstein/Sírio e reembolso máximo', '🥈 Um nível abaixo — nacional, com bom reembolso', '⚖️ Quero comparar os dois lado a lado', '🧭 Recomendação do corretor'] },
  { fala: '<strong>Com ou sem coparticipação?</strong><br><span style="font-size:12.5px;color:#93a4c8;">Sem: mensalidade cheia e uso sem custo nenhum. Com: mensalidade menor, e cada consulta/exame gera uma participação. Para grupos que usam pouco, a diferença pode valer.</span>', campo: 'coparticipacao', tipo: 'opcoes',
    opcoes: ['Sem coparticipação', 'Com coparticipação', 'Recomendação do corretor'] },
  { fala: 'As pessoas do grupo costumam usar <strong>médicos particulares</strong> (fora de rede)?<br><span style="font-size:12.5px;color:#93a4c8;">Se sim, o múltiplo de reembolso vira o critério mais importante da escolha.</span>', campo: 'reembolsoUso', tipo: 'opcoes',
    opcoes: ['Sim, com frequência', 'De vez em quando', 'Raramente'] },
  { fala: 'Em quais <strong>cidades</strong> moram as pessoas do grupo?<br><span style="font-size:12.5px;color:#93a4c8;">Uso para conferir a rede de cada um — hospital e laboratório perto de casa, além das referências nacionais.</span>', campo: 'cidades', tipo: 'cidades' },
  { fala: 'Quer aproveitar e ver também o <strong>plano dental premium</strong> no mesmo pacote?<br><span style="font-size:12.5px;color:#93a4c8;">Ortodontia completa e prótese em cerâmica — na mesma fatura, custo pequeno perto do saúde.</span>', campo: 'dental', tipo: 'opcoes',
    opcoes: ['Sim, inclui na cotação', 'Não, só o saúde', 'Quero saber mais antes'] },
  { fala: 'Para <strong>quando</strong> vocês pensam nisso?', campo: 'prazo', tipo: 'opcoes',
    opcoes: ['O quanto antes', 'Nos próximos 60 dias', 'Só estou comparando'] },
  { fala: 'Transparência antes de fechar: na proposta, a seguradora pede uma <strong>declaração de saúde</strong> de cada pessoa. É etapa padrão do mercado — condições preexistentes podem ter cobertura parcial nos primeiros 24 meses, e o corretor te explica tudo <strong>antes</strong> de assinar qualquer coisa. Aqui, nada disso é necessário.', campo: null },
  { fala: 'Por último: qual o <strong>melhor contato</strong> para o corretor retornar com os números?', campo: 'contato', tipo: 'contato' }
];

/* ─── MOTOR ─── */
const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));

function irAoFim(suave) {
  const alvo = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  const atual = window.scrollY + window.innerHeight;
  if (alvo - atual < 4) return;
  window.scrollTo({ top: alvo, behavior: suave ? 'smooth' : 'auto' });
}
let _ancoras = [];
function fixarFim(suave) {
  _ancoras.forEach(clearTimeout); _ancoras = [];
  requestAnimationFrame(() => { irAoFim(suave); requestAnimationFrame(() => irAoFim(suave)); });
  [140, 360, 640, 980].forEach(ms => _ancoras.push(setTimeout(() => irAoFim(false), ms)));
}
async function digitar(el, html, vel) {
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buf = '', n = 0;
  for (const p of partes) {
    if (p.startsWith('<')) { buf += p; el.innerHTML = buf + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      buf += ch; el.innerHTML = buf + '<span class="cursor"></span>';
      if ((++n % 6) === 0) irAoFim(false);
      await espera('.!?'.includes(ch) ? (vel || 13) * 9 : ',;:'.includes(ch) ? (vel || 13) * 4 : (vel || 13));
    }
  }
  el.innerHTML = buf;
  irAoFim(false);
}
function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  let v = '';
  if (d.length > 7)      v = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  else if (d.length > 2) v = `(${d.slice(0,2)}) ${d.slice(2)}`;
  else if (d.length > 0) v = `(${d}`;
  el.value = v;
  const av = $('avisoTel');
  if (av) {
    const curto = d.length > 0 && d.length < 10;
    av.classList.toggle('on', curto);
    el.classList.toggle('erro', curto);
  }
}
window.mascaraTel = mascaraTel;

async function render() {
  const q = PERGUNTAS[iQ];
  $('prog').style.width = (iQ / PERGUNTAS.length * 100) + '%';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">Cotação Saúde dos Sócios · ${iQ} de ${PERGUNTAS.length - 1}</div>
      <div id="hist">${historico.map((h, hi) => `
        <div class="qbolha">${h.p}</div>${h.r ? `<div class="qbolha qresp">${h.r}
          <button class="alt" onclick="voltarPara(${hi})">✏️ alterar</button></div>` : ''}`).join('')}</div>
      <div class="qbolha" id="fala"></div>
      <div class="zona" id="zona"></div>
    </div>`;
  irAoFim(false);
  await digitar($('fala'), q.fala, 12);
  await espera(160);
  const z = $('zona'); z.classList.add('on');
  await espera(140);
  fixarFim(true);

  if (!q.campo) {
    z.innerHTML = `<button class="btn" id="ok">Vamos lá →</button>`;
    $('ok').onclick = () => { historico.push({ p: q.fala, r: null, i: iQ }); iQ++; render(); };
  }
  else if (q.tipo === 'opcoes') {
    const classe = q.muitas ? 'opcoes muitas' : q.lista ? 'opcoes lista' : 'opcoes';
    z.innerHTML = `<div class="${classe}">${q.opcoes.map((o, k) => `<button class="op" data-k="${k}">${o}</button>`).join('')}</div>
      ${q.campo === 'valorAtual' ? '<div class="nota">Na dúvida entre duas faixas, escolha a maior — o corretor confirma depois.</div>' : ''}
      <div id="extra"></div>`;
    z.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k), v = q.opcoes[k];
      /* "Outra" operadora pede o nome antes de seguir */
      if (q.campo === 'planoAtual' && v === 'Outra') {
        z.querySelectorAll('.op').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        $('extra').innerHTML = `<input class="campo" id="txOutra" placeholder="Qual operadora?" style="margin-top:12px;">
          <button class="btn" id="okOutra" style="margin-top:10px;">Continuar →</button>`;
        fixarFim(true);
        const seguir = () => {
          const nome = $('txOutra').value.trim();
          QRESP[q.campo] = v; QRESP.planoAtualOutra = nome || null;
          registrarDado(q.campo, k, v + (nome ? ' (' + nome + ')' : ''));
          historico.push({ p: q.fala, r: 'Outra' + (nome ? ': ' + nome : ''), i: iQ });
          salvar(); iQ++; render();
        };
        $('okOutra').onclick = seguir;
        $('txOutra').onkeydown = e => { if (e.key === 'Enter') seguir(); };
        $('txOutra').focus();
        return;
      }
      QRESP[q.campo] = v; registrarDado(q.campo, k, v);
      historico.push({ p: q.fala, r: v, i: iQ });
      salvar(); iQ++; render();
    });
  }
  else if (q.tipo === 'texto') {
    z.innerHTML = `<input class="campo" id="tx" placeholder="${q.ph || ''}" autocomplete="off" style="margin-bottom:12px;">
      <button class="btn" id="ok">Continuar →</button>`;
    const enviar = () => {
      const v = $('tx').value.trim(); if (!v) return $('tx').focus();
      QRESP[q.campo] = v; historico.push({ p: q.fala, r: v, i: iQ });
      salvar(); iQ++; render();
    };
    $('ok').onclick = enviar;
    $('tx').onkeydown = e => { if (e.key === 'Enter') enviar(); };
    if (q.campo === 'empresa' && LINK && LINK.empresaNome) { $('tx').value = LINK.empresaNome; $('tx').readOnly = true; $('tx').style.opacity = '.75'; }
    $('tx').focus();
  }
  else if (q.tipo === 'pessoas') {
    renderPessoas(z, q);
  }
  else if (q.tipo === 'cidades') {
    let sel = Array.isArray(QRESP.cidades) ? QRESP.cidades.slice() : [];
    z.innerHTML = `
      <div style="display:flex; gap:9px;">
        <input class="campo" id="cid" placeholder="Digite uma cidade e adicione" style="animation:none;">
        <button class="btn btn-2" id="addCid" style="white-space:nowrap;">+ Adicionar</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="nota">Adicione quantas quiser — sede, casa de cada sócio, casa de praia, onde os filhos estudam.</div>
      <button class="btn" id="ok" style="margin-top:14px;">Continuar →</button>`;
    const desenha = () => {
      $('chips').innerHTML = sel.map((c, i) => `<span class="chip">${c}<button data-i="${i}">✕</button></span>`).join('');
      $('chips').querySelectorAll('button').forEach(b => b.onclick = () => { sel.splice(Number(b.dataset.i), 1); desenha(); });
    };
    const add = () => {
      const v = $('cid').value.trim();
      if (!v) return;
      if (!sel.some(c => c.toLowerCase() === v.toLowerCase())) sel.push(v);
      $('cid').value = ''; $('cid').focus(); desenha(); fixarFim(false);
    };
    $('addCid').onclick = add;
    $('cid').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
    desenha();
    $('ok').onclick = () => {
      if ($('cid').value.trim()) add();
      QRESP.cidades = sel; QRESP.cidadesTexto = sel.join(', ');
      historico.push({ p: q.fala, r: sel.length ? sel.join(', ') : '(nenhuma informada)', i: iQ });
      salvar(); iQ++; render();
    };
  }
  else if (q.tipo === 'contato') {
    z.innerHTML = `
      <label class="lbl">Seu nome</label>
      <input class="campo" id="cNome" style="margin-bottom:12px;" placeholder="Nome completo">
      <label class="lbl">Cargo / relação com a empresa</label>
      <input class="campo" id="cCargo" style="margin-bottom:12px;" placeholder="Ex.: Sócio, Diretora Financeira">
      <label class="lbl">E-mail</label>
      <input class="campo" id="cMail" type="email" style="margin-bottom:12px;" placeholder="voce@empresa.com.br">
      <label class="lbl">Telefone / WhatsApp</label>
      <input class="campo" id="cTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
      <div class="aviso" id="avisoTel">Parece faltar algum número — confira, mas você pode continuar assim mesmo.</div>
      <button class="btn btn-ouro" id="ok" style="width:100%; margin-top:16px;">Enviar para o corretor →</button>`;
    $('ok').onclick = async () => {
      const nome = $('cNome').value.trim();
      if (!nome) return $('cNome').focus();
      QRESP.contato = { nome, cargo: $('cCargo').value.trim(), email: $('cMail').value.trim(), telefone: $('cTel').value.trim() };
      $('ok').disabled = true; $('ok').textContent = 'Enviando…';
      await salvar(true);
      renderFim();
    };
  }
  fixarFim(true);
}

/* ─── CONSTRUTOR DO GRUPO (vidas) ───
   Cada pessoa = vínculo + faixa etária, em dois toques. O total aparece ao
   vivo com o aviso do mínimo de 3 — e com o lembrete de que dependente conta. */
function renderPessoas(z, q) {
  let pessoas = Array.isArray(QRESP.pessoas) ? QRESP.pessoas.slice() : [];
  z.innerHTML = `<div id="lista"></div>
    <button class="btn btn-2" id="addP" style="width:100%; margin-top:4px;">+ Adicionar pessoa</button>
    <div class="resumo-grupo" id="resumo"></div>
    <button class="btn btn-ouro" id="ok" style="width:100%; margin-top:12px;">Grupo completo →</button>`;

  const desenhaResumo = () => {
    const n = pessoas.filter(p => p.vi !== null && p.fi !== null).length;
    const r = $('resumo');
    if (!pessoas.length) { r.innerHTML = '👥 Adicione as pessoas do grupo — começando por você.'; return; }
    if (n < 3) r.innerHTML = `👥 <b>${n} de 3 vidas</b> — o contrato pede no mínimo 3, e cônjuge e filhos contam. Complete o grupo com a família, se precisar.`;
    else r.innerHTML = `✅ <b>${n} vidas no grupo</b> — mínimo atingido. Pode adicionar mais gente ou seguir.`;
  };

  const desenha = () => {
    $('lista').innerHTML = pessoas.map((p, i) => `
      <div class="pessoa-card" data-i="${i}">
        <div class="cab"><span class="num">Pessoa ${i + 1}${i === 0 ? ' (você?)' : ''}</span>
          <button class="rm" data-i="${i}">remover</button></div>
        <div class="lbl">Vínculo</div>
        <div class="mini-ops">${VINCULOS.map((v, vi) => `<button class="mini-op vin${p.vi === vi ? ' sel' : ''}" data-vi="${vi}">${v}</button>`).join('')}</div>
        <div class="lbl">Idade</div>
        <div class="mini-ops">${FAIXAS_IDADE.map((f, fi) => `<button class="mini-op fai${p.fi === fi ? ' sel' : ''}" data-fi="${fi}">${f}</button>`).join('')}</div>
      </div>`).join('');
    $('lista').querySelectorAll('.pessoa-card').forEach(card => {
      const i = Number(card.dataset.i);
      card.querySelectorAll('.vin').forEach(b => b.onclick = () => { pessoas[i].vi = Number(b.dataset.vi); desenha(); });
      card.querySelectorAll('.fai').forEach(b => b.onclick = () => { pessoas[i].fi = Number(b.dataset.fi); desenha(); });
    });
    $('lista').querySelectorAll('.rm').forEach(b => b.onclick = () => { pessoas.splice(Number(b.dataset.i), 1); desenha(); });
    desenhaResumo();
  };

  $('addP').onclick = () => {
    if (pessoas.length >= 30) return;
    pessoas.push({ vi: pessoas.length === 0 ? 0 : null, fi: null });
    desenha(); fixarFim(false);
  };
  if (!pessoas.length) { pessoas.push({ vi: 0, fi: null }); }
  desenha();

  $('ok').onclick = () => {
    const completas = pessoas.filter(p => p.vi !== null && p.fi !== null);
    if (!completas.length) { $('resumo').innerHTML = '⚠️ Marque o vínculo e a idade de pelo menos uma pessoa.'; return; }
    const incompletas = pessoas.length - completas.length;
    if (incompletas) { $('resumo').innerHTML = `⚠️ ${incompletas === 1 ? 'Há uma pessoa sem' : 'Há ' + incompletas + ' pessoas sem'} vínculo ou idade marcados — complete ou remova para seguir.`; return; }
    QRESP.pessoas = completas;
    const resumoTxt = completas.map(p => VINCULOS[p.vi] + ' · ' + FAIXAS_IDADE[p.fi]).join('  |  ');
    historico.push({ p: q.fala, r: completas.length + (completas.length === 1 ? ' vida: ' : ' vidas: ') + resumoTxt, i: iQ });
    salvar(); iQ++; render();
  };
}

function renderFim() {
  $('prog').style.width = '100%';
  palco.innerHTML = `
    <div class="cena fim">
      <div class="ico">✅</div>
      <div class="titulo" style="font-size:26px; font-weight:800;">Recebemos tudo!</div>
      <div style="font-size:15px; line-height:1.65; color:#c3d0ec; margin-top:12px;">
        O corretor já recebeu o desenho do grupo e começa a montar a cotação por faixa etária — a comparação vem por escrito, sem compromisso.
        <br><br>Obrigado pelo tempo. Saúde é o benefício em que "bom o bastante" só se descobre tarde — bom resolver antes.
      </div>
    </div>`;
}

/* ─── ALTERAR / RETOMAR ─── */
function voltarPara(hi) {
  const alvo = historico[hi];
  if (!alvo || typeof alvo.i !== 'number') return;
  historico.length = hi;
  iQ = alvo.i;
  window.scrollTo({ top: 0, behavior: 'auto' });
  render();
}
window.voltarPara = voltarPara;

function renderRetomar(d) {
  const qs = d.questionario || {};
  const feitas = (d.historicoQ || []).filter(h => h.r).length;
  const totalT = PERGUNTAS.length - 1;
  const pct = Math.min(99, Math.round((d.passo || 0) / totalT * 100));
  $('prog').style.width = pct + '%';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">Cotação Saúde dos Sócios · retomando</div>
      <div class="qbolha">Você já tinha começado${qs.empresa ? ' a cotação da <strong>' + qs.empresa + '</strong>' : ''} e parou no meio.
        ${feitas ? `Já tenho <strong>${feitas} ${feitas === 1 ? 'resposta' : 'respostas'}</strong> suas guardadas` : 'Guardei o seu ponto de parada'} —
        dá para continuar exatamente de onde parou.</div>
      <div class="zona on">
        <div class="opcoes">
          <button class="op" id="btSeguir">Continuar de onde parei →</button>
          <button class="op" id="btZero">Começar do zero</button>
        </div>
        <div class="nota">Continuando, nada do que você já respondeu se perde — e dá para alterar qualquer resposta pelo botão "alterar" ao lado dela.</div>
      </div>
    </div>`;
  $('btSeguir').onclick = () => {
    QRESP = Object.assign({ pessoas: [], cidades: [], _dados: {} }, qs);
    (d.historicoQ || []).forEach(h => historico.push(h));
    iQ = Math.max(0, Math.min(Number(d.passo) || 0, PERGUNTAS.length - 1));
    render();
  };
  $('btZero').onclick = () => {
    QRESP = { pessoas: [], cidades: [], _dados: {} };
    if (LINK && LINK.empresaNome) QRESP.empresa = LINK.empresaNome;
    historico.length = 0; iQ = 0;
    salvar(); render();
  };
}

/* ─── PERSISTÊNCIA ─── */
function montarRoteiroQ() {
  return PERGUNTAS.map(function (q, idx) {
    if (!q.campo || q.tipo === 'contato') return null;
    var h = historico.find(function (x) { return x.i === idx; });
    var p = (q.fala || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return { k: q.campo, p: p, r: (h && h.r != null && h.r !== '') ? String(h.r) : null };
  }).filter(Boolean);
}
async function salvar(finalizou) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP,
      analitico: montarAnalitico(finalizou),
      questionarioCompleto: !!finalizou,
      passo: iQ, questTotal: PERGUNTAS.length,
      historicoQ: historico, roteiro: montarRoteiroQ(),
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

/* ─── INÍCIO ─── */
console.log('%cQuestionário Saúde dos Sócios v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  PAPEL = params.get('p') || 'socio';

  // mesmo GRUPO e mesmo documento por papel que a apresentação —
  // as respostas do questionário caem no registro que o corretor já vê
  if (token) GRUPO = token;
  else {
    GRUPO = params.get('g');
    if (!GRUPO) { try { GRUPO = sessionStorage.getItem('grupo_ap_saudesocios'); } catch (e) {} }
    if (!GRUPO) { GRUPO = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    try { sessionStorage.setItem('grupo_ap_saudesocios', GRUPO); } catch (e) {}
  }
  SESSAO = 'saudesocios_' + GRUPO + '_' + PAPEL;

  const base = {
    produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, origem: 'questionario',
    token: token || null, grupo: GRUPO, perfilPapel: PAPEL,
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    userAgent: navigator.userAgent.slice(0, 180)
  };
  if (token) {
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.empresaId = LINK.empresaId || null;
        base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || null;
        base.geradoPorNome = LINK.geradoPorNome || null;
      }
    } catch (e) { console.warn('link', e); }
  }

  if (LINK && LINK.empresaNome) {
    QRESP.empresa = LINK.empresaNome;
    const iEmp = PERGUNTAS.findIndex(q => q.campo === 'empresa');
    if (iEmp >= 0) PERGUNTAS.splice(iEmp, 1);
    PERGUNTAS[0].fala = 'Boa decisão! Aproveitei o que você já viu na apresentação sobre a <strong>' + LINK.empresaNome + '</strong> — vamos direto ao que falta para <strong>cotar o plano do grupo</strong>. O mais importante: quem entra e a idade de cada pessoa. Sem documento, sem dado de saúde, sem compromisso.';
  }
  let anterior = null;
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    else {
      const d = doc.data() || {};
      if (!d.questionarioCompleto && (Number(d.passo) || 0) > 0 && d.questionario) anterior = d;
    }
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }

  if (anterior) renderRetomar(anterior);
  else render();
});
</script>
</body>
