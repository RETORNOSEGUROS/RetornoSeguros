const FAMILIAS = [{"id":"fogo","ico":"🔥","nome":"Fogo e explosão","itens":[{"id":"incendio_raio_explosao","n":"Incêndio, raio e explosão","o":"A cobertura básica: prédio, máquinas, móveis e estoque contra fogo, queda de raio e explosão. É sobre o valor dela que o resto da apólice se apoia — se este valor estiver baixo, a indenização de tudo pode sair proporcional (rateio, conforme a forma de contratação).","ex":"Incêndio em uma máquina se propaga ao galpão, atingindo prédio, instalações e estoque."},{"id":"fumaca","n":"Fumaça","o":"Danos causados por fumaça mesmo sem chamas no seu imóvel — fuligem que contamina estoque, equipamentos e acabamentos.","ex":"Incêndio no vizinho: nenhuma chama entra na sua empresa, mas a fumaça inutiliza todo o estoque."},{"id":"queimadas_rurais","n":"Incêndio por queimadas em zona rural","o":"Para empresas próximas a lavouras, pastos ou mata: fogo de queimada que se propaga até as instalações.","ex":"Queimada em propriedade vizinha avança com o vento e atinge o galpão."},{"id":"queda_aeronave","n":"Queda de aeronaves e engenhos aéreos","o":"Impacto de aeronaves, partes delas ou outros objetos aéreos sobre o imóvel. Relevante perto de aeroportos e rotas.","ex":"Parte de uma aeronave cai sobre o telhado da empresa."},{"id":"despesas_salvamento","n":"Despesas de salvamento","o":"O que se gasta DURANTE o sinistro para reduzir o prejuízo: mão de obra emergencial, remoção de bens, contenção.","ex":"Contratação às pressas de caminhões e equipe para retirar o estoque não atingido de uma área em chamas."}]},{"id":"clima","ico":"⛈️","nome":"Clima e impactos externos","itens":[{"id":"vendaval_granizo","n":"Vendaval, furacão, ciclone, tornado e granizo","o":"Danos ao prédio e ao conteúdo por vento forte e granizo. Atenção à franquia: costuma ser um percentual COM valor mínimo em reais.","ex":"Vendaval arranca parte da cobertura do galpão e a chuva subsequente danifica estoque e máquinas."},{"id":"alagamento","n":"Alagamento e inundação","o":"Água que entra por enchente, transbordamento ou chuva intensa. Não está incluída em vendaval — é contratada à parte.","ex":"Chuva intensa alaga o pátio e a água atinge todo o estoque armazenado no piso."},{"id":"desmoronamento","n":"Desmoronamento","o":"Colapso total ou parcial de paredes, lajes e estruturas.","ex":"Parede lateral cede após semanas de chuva e atinge máquinas e estoque."},{"id":"impacto_veiculos","n":"Impacto de veículos","o":"Danos causados por veículos terrestres que colidem com o imóvel — inclusive caminhões em manobra no seu pátio.","ex":"Caminhão de entrega em manobra derruba o portão, parte da parede e a estrutura da doca."},{"id":"tumultos","n":"Tumultos, greves e lockout","o":"Depredação do imóvel em manifestações, greves e atos de vandalismo coletivo.","ex":"Manifestação na avenida termina em depredação de fachada, portas e equipamentos."}]},{"id":"eletrico","ico":"⚡","nome":"Elétrico e máquinas","itens":[{"id":"danos_eletricos","n":"Danos elétricos","o":"Queima de motores, painéis, inversores e instalações por curto-circuito, sobrecarga, oscilação ou raio.","ex":"Sobretensão queima o painel principal, inversores e motores da linha."},{"id":"quebra_maquinas","n":"Quebra de máquinas","o":"Quebra súbita e acidental por causa INTERNA — mecânica, não elétrica. Não é desgaste: é o evento inesperado.","ex":"Falha mecânica interna quebra o componente principal de um equipamento industrial; reparo de alto custo."},{"id":"equip_eletronicos","n":"Equipamentos eletrônicos","o":"Servidores, automação, computadores e aparelhos eletrônicos, de forma mais ampla que danos elétricos isolados.","ex":"Servidor e equipamentos de automação sofrem dano acidental e a operação fica sem sistema."},{"id":"equip_portateis","n":"Equipamentos portáteis (inclui home office)","o":"Notebooks e equipamentos que saem da empresa — em viagem, em cliente ou na casa do funcionário.","ex":"Notebook corporativo é danificado fora da sede, em home office."},{"id":"movimentacao_interna","n":"Movimentação interna","o":"Danos a máquinas e bens durante a movimentação dentro da empresa — mudança de layout, içamento, instalação.","ex":"Máquina tomba durante a relocalização dentro da fábrica."}]},{"id":"roubo","ico":"🔐","nome":"Roubo, valores e fraude","itens":[{"id":"roubo_bens","n":"Roubo e furto qualificado de bens","o":"Mercadorias, máquinas, móveis e equipamentos subtraídos com arrombamento ou ameaça. Furto simples (sem vestígio) normalmente não entra.","ex":"Arrombamento noturno com subtração de notebooks, ferramentas e mercadorias."},{"id":"valores_interior","n":"Valores no interior do estabelecimento","o":"Dinheiro e cheques em caixa ou cofre.","ex":"Assalto leva o numerário do caixa e do cofre."},{"id":"valores_portadores","n":"Valores em mãos de portadores","o":"Dinheiro sendo levado ao banco ou trazido dele por funcionário.","ex":"Funcionário é assaltado a caminho do banco com o malote."},{"id":"fidelidade","n":"Fidelidade de empregados","o":"Prejuízo causado por ato desonesto de funcionário — desvio de valores ou de mercadoria.","ex":"Auditoria descobre desvio sistemático de mercadoria por um empregado de confiança."},{"id":"vidros_luminosos","n":"Vidros, fachadas e anúncios luminosos","o":"Quebra de vidros, vitrines, portas de vidro e letreiros.","ex":"Porta de vidro temperado e vitrine quebram após impacto acidental."}]},{"id":"terceiros","ico":"🤝","nome":"Responsabilidade com terceiros","itens":[{"id":"rc_estabelecimento","n":"RC do estabelecimento","o":"Danos corporais e materiais a clientes, visitantes e vizinhos, dentro ou por causa da sua operação — inclusive o incêndio que passa para o imóvel ao lado.","ex":"Visitante sofre lesão por queda dentro da empresa; ou a operação causa dano ao imóvel vizinho."},{"id":"rc_empregador","n":"RC do empregador","o":"Indenização por acidente grave com funcionário, além do que a previdência cobre. Não substitui obrigações trabalhistas.","ex":"Acidente grave de trabalho gera ação de responsabilidade civil contra a empresa."},{"id":"rc_guarda_veiculos","n":"RC guarda de veículos de terceiros","o":"Para quem tem pátio, estacionamento ou recebe veículos: danos, incêndio e roubo de veículos sob sua guarda.","ex":"Incêndio no estacionamento atinge veículos de clientes e funcionários."},{"id":"danos_morais","n":"Danos morais","o":"A parte da condenação que hoje costuma superar o dano material. É contratada como extensão das RCs.","ex":"Acidente com terceiro resulta em indenização material e, somada a ela, dano moral."}]},{"id":"parada","ico":"🚪","nome":"Parada do negócio","itens":[{"id":"lucros_cessantes","n":"Lucros cessantes / despesas fixas","o":"Mantém folha, aluguel e contas fixas — ou o próprio lucro — enquanto a operação está parada por um sinistro coberto. O ponto crítico é o período indenitário: por quantos meses ela paga.","ex":"Incêndio paralisa a fábrica por seis meses, reduzindo vendas enquanto as despesas continuam vencendo."},{"id":"instalacao_novo_local","n":"Despesas de instalação em novo local","o":"Custos para montar a operação provisoriamente em outro endereço: rede elétrica, TI, layout, mudança.","ex":"Após o incêndio, a empresa aluga um galpão e instala rede elétrica, TI e layout provisório."},{"id":"perda_aluguel","n":"Perda ou pagamento de aluguel","o":"O aluguel que você deixa de receber (se é proprietário) ou o aluguel adicional que passa a pagar enquanto o imóvel está inutilizável.","ex":"A empresa precisa alugar outro imóvel por oito meses até concluir a reconstrução."},{"id":"despesas_extraordinarias","n":"Despesas extraordinárias","o":"Gastos extras para ENCURTAR a parada: horas extras, frete aéreo, terceirização temporária.","ex":"Frete aéreo emergencial para trazer a peça crítica e reduzir o tempo de parada."}]},{"id":"especificos","ico":"💧","nome":"Água interna e mercadorias sensíveis","itens":[{"id":"ruptura_tubulacoes","n":"Ruptura de tubulações","o":"Danos causados pelo rompimento de tubulações internas do imóvel.","ex":"Tubulação interna rompe no fim de semana e a água danifica todo o estoque."},{"id":"derrame_sprinklers","n":"Derrame de sprinklers","o":"Descarga acidental do sistema de chuveiros automáticos sobre estoque e equipamentos.","ex":"Rompimento acidental de um ramal do sprinkler molha estoque e máquinas."},{"id":"deterioracao_frigorificados","n":"Deterioração de mercadorias refrigeradas","o":"Perda de produtos refrigerados ou congelados por falha coberta do sistema de refrigeração.","ex":"Falha no sistema de refrigeração causa a perda dos alimentos armazenados na câmara."},{"id":"equip_moveis_estacionarios","n":"Equipamentos móveis, estacionários e arrendados","o":"Empilhadeiras, geradores, compressores e equipamentos de terceiros sob sua responsabilidade (leasing, comodato).","ex":"Equipamento arrendado sofre dano acidental enquanto está sob responsabilidade da empresa."}]},{"id":"apoio","ico":"🧰","nome":"Despesas e assistência","itens":[{"id":"assistencia_24h","n":"Assistência 24h","o":"Chaveiro, eletricista, encanador, desentupimento, vidraceiro, limpeza pós-sinistro e cobertura provisória de telhado, com limites por acionamento.","ex":"Chave quebrada na fechadura às 7h da manhã: uma ligação, sem custo."},{"id":"recomposicao_documentos","n":"Recomposição de registros e documentos","o":"Custo de refazer documentos, arquivos e registros destruídos em sinistro coberto.","ex":"Incêndio destrói arquivos físicos e exige meses de reconstituição documental."},{"id":"honorarios_peritos","n":"Honorários de peritos","o":"Contador ou perito para apurar e comprovar a perda financeira num sinistro de lucros cessantes.","ex":"Perito contábil contratado para quantificar a perda de lucro após o incêndio."}]}];       // mesma base de conteúdo da apresentação

/* ─── PERFIL (motor adaptativo do JSON): deriva das rubricas + uso do local ─── */
function perfil(L) {
  const t = norm(S.atividades.map(a => a.descricao + ' ' + (a.rubricaSugerida || '')).join(' | ') + ' ' + S.atividadeLivre + ' ' + ((PRES && PRES.atividade && PRES.atividade.texto) || ''));
  const uso = (L && L.uso) || [];
  const p = {
    fabricacao: /fabric|producao|industria|beneficiamento|confeccao|montagem|fiacao|tecelagem|abate|usina|retifica|caldeiraria|reciclagem|engarrafamento|fabrica/.test(t) || uso.includes('fabricacao'),
    deposito: /deposito|armaz|distribuidora|atacadista|logistic|silos/.test(t) || uso.includes('deposito'),
    frio: /frigorif|congelad|acougue|peixaria|laticinio|gelo|sorvete|supermercado|minimercado|restaurante|bar,|padaria|alimentos|carnes/.test(t),
    inflamavel: /inflamav|quimic|tinta|solvente|combustiv|alcool|aerosol|lubrificante|posto de/.test(t),
    quente: /a quente|aquecimento|caldeir|siderurg|fundic|solda|secador|forno|padaria|restaurante/.test(t),
    madeira: /madeira|moveis|mobiliario|madeireira|estofad|colchao|papel|celulose|textil|tecid|confeccao|espuma/.test(t),
    veiculos: /veicul|oficina|estacionamento|concessionaria|lava rapido|borracharia|garagem|locacao de veic/.test(t),
    publico: /loja|comercio|restaurante|bar,|academia|clinica|hospital|hotel|escola|educacao|supermercado|shopping|cinema|clube|igreja|casas de festas/.test(t) || uso.includes('loja'),
    alimentacao: /restaurante|bar,|padaria|buffet|lanchonete|alimentos/.test(t)
  };
  p.cargaAlta = p.madeira || p.inflamavel;
  return p;
}
function ecoAtividade() {
  const p = perfil(); const m = [];
  if (p.madeira && p.fabricacao) m.push('Pó, aparas, cola e verniz fazem desta uma das atividades com <strong>maior carga de incêndio</strong> — vou abrir perguntas específicas sobre processo, estoque e separação entre produção e depósito.');
  else if (p.inflamavel) m.push('Atividade com <strong>inflamáveis</strong>: a seguradora olha com lupa para armazenagem, ventilação e processos a quente. Vou perguntar sobre isso em cada local.');
  else if (p.fabricacao) m.push('Em indústria, o risco mora nas <strong>máquinas críticas</strong> e no tempo para repô-las. Vou perguntar sobre isso — é o que define danos elétricos, quebra de máquinas e lucros cessantes.');
  if (p.deposito) m.push('Em depósito, o que decide o tamanho de um incêndio é <strong>o que se armazena e a que altura</strong>. Entra no levantamento.');
  if (p.frio) m.push('Produto perecível: há cobertura específica para <strong>deterioração por falha de refrigeração</strong> — vou deixá-la visível para você.');
  if (p.veiculos) m.push('Veículos de terceiros sob sua guarda pedem uma <strong>RC própria</strong> — entra nas coberturas.');
  if (!m.length && p.publico) m.push('Com circulação de público, a <strong>responsabilidade civil</strong> pesa tanto quanto o patrimônio. Vou tratar disso em cada local.');

/* ══════════ MOTOR DE PÁGINAS ══════════
   campo: { id, tipo, label, sub, info, opcoes, ph, visivel(a), insight(a) }
   tipos: texto | numero | moeda | cep | cnpj | escolha | multi | tri | mes | matriz */
const TRI = [{ v: 'sim', t: 'Sim' }, { v: 'nao', t: 'Não' }, { v: 'naosei', t: 'Não sei' }];
const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
function opsDe(c) { return c.tipo === 'tri' ? TRI : c.tipo === 'mes' ? MESES.map((m, i) => ({ v: String(i + 1), t: m })).concat([{ v: 'naosei', t: 'Não sei' }]) : (c.opcoes || []); }
function textoDe(c, a) {
  const v = a[c.id]; if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
  if (c.tipo === 'moeda') return v === 'naosei' ? 'Não sei' : brl(v);
  if (c.tipo === 'numero') return Number(v).toLocaleString('pt-BR') + (c.sufixo ? ' ' + c.sufixo : '');
  if (c.tipo === 'multi') return v.map(x => (opsDe(c).find(o => o.v === x) || {}).t || x).join(' · ');
  if (c.tipo === 'matriz') { const e = Object.entries(v).filter(([k]) => c.itens.find(i => i.id === k)); if (!e.length) return null;
    return e.map(([k, s]) => c.itens.find(i => i.id === k).n + ': ' + ((c.estados.find(x => x.v === s) || {}).t || s)).join(' · '); }
  if (['escolha', 'tri', 'mes'].includes(c.tipo)) return ((opsDe(c).find(o => o.v === v) || {}).t || String(v)).replace(/<[^>]+>/g, '');

}
function htmlInfo(c) { return c.info ? `<div class="inf-tx" data-inf="${c.id}">${c.info}</div>` : ''; }
function htmlCampo(c, a) {
  const lb = `<div class="campo-lb"><span class="tx">${c.label}</span>${c.info ? `<button class="inf" data-abre="${c.id}" type="button">i</button>` : ''}</div>${htmlInfo(c)}${c.sub ? `<div class="campo-sub">${c.sub}</div>` : ''}`;
  let corpo = ''; const v = a[c.id];

  } else if (c.tipo === 'matriz') {

      ${i.info ? `<div class="inf-tx" data-inf="${c.id}_${i.id}">${i.info}</div>` : ''}
      <div class="ops">${c.estados.map(s => `<button class="op ${(v || {})[i.id] === s.v ? 'sel' : ''}" data-mz="${c.id}" data-it="${i.id}" data-v="${s.v}" type="button">${s.t}</button>`).join('')}</div>

  }

function pagina(cfg) {
  const a = cfg.alvo, campos = cfg.campos;
  palco.innerHTML = `<div class="cena">${cfg.trilha ? trilha(cfg.trilha) : ''}${cfg.voltar ? `<button class="voltar" id="pgVoltar">← ${cfg.voltarTxt || 'voltar'}</button>` : ''}

      if (c.tipo === 'matriz') c.itens.forEach(i => { const e = palco.querySelector(`[data-mzins="${c.id}_${i.id}"]`); if (e) e.innerHTML = (i.insight && i.insight(a, (a[c.id] || {})[i.id])) || ''; });

      if (o && o.excl) arr = arr.includes(val) ? [] : [val]; else { arr = arr.filter(x => !(opsDe(c).find(y => y.v === x) || {}).excl); arr = arr.includes(val) ? arr.filter(x => x !== val) : arr.concat(val); }
      a[c.id] = arr; palco.querySelectorAll(`[data-op="${c.id}"]`).forEach(x => x.classList.toggle('sel', arr.includes(x.dataset.v)));
    } else { a[c.id] = val; palco.querySelectorAll(`[data-op="${c.id}"]`).forEach(x => x.classList.toggle('sel', x === b)); }

  palco.querySelectorAll('[data-mz]').forEach(b => b.onclick = () => { const c = campos.find(x => x.id === b.dataset.mz); a[c.id] = a[c.id] || {}; a[c.id][b.dataset.it] = b.dataset.v;
    palco.querySelectorAll(`[data-mz="${c.id}"][data-it="${b.dataset.it}"]`).forEach(x => x.classList.toggle('sel', x === b)); mudou(c); });
  palco.querySelectorAll('[data-ns]').forEach(b => b.onclick = () => { const c = campos.find(x => x.id === b.dataset.ns); const on = a[c.id] !== 'naosei'; a[c.id] = on ? 'naosei' : null;
    b.classList.toggle('sel', on); palco.querySelector(`[data-in="${c.id}"]`).value = ''; mudou(c); });
  palco.querySelectorAll('[data-in]').forEach(el => { const c = campos.find(x => x.id === el.dataset.in);
    el.oninput = () => {
      if (c.tipo === 'moeda') { const n = soNum(el.value); a[c.id] = n; el.value = n == null ? '' : brl(n); const ns = palco.querySelector(`[data-ns="${c.id}"]`); if (ns) ns.classList.remove('sel'); }
      else if (c.tipo === 'numero') { const n = soNum(el.value); a[c.id] = n; el.value = n == null ? '' : n.toLocaleString('pt-BR'); }
      else if (c.tipo === 'cep') { const d = el.value.replace(/\D/g, '').slice(0, 8); el.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; a[c.id] = el.value; if (d.length === 8) buscarCEP(d, a, atualizar); }
      else if (c.tipo === 'cnpj') { const d = el.value.replace(/\D/g, '').slice(0, 14); el.value = d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2'); a[c.id] = el.value; if (d.length === 14) buscarCNPJ(d, a, atualizar); }
      else a[c.id] = el.value;

async function buscarCEP(d, a, cb) { try { const r = await fetch('https://viacep.com.br/ws/' + d + '/json/'); const j = await r.json();
  if (j && !j.erro) { a.logradouro = j.logradouro || ''; a.bairro = j.bairro || ''; a.cidade = j.localidade || ''; a.uf = j.uf || ''; a.cepOk = true; } else { a.cepOk = false; a.cidade = ''; } } catch (e) { a.cepOk = null; } cb(); salvar(); }
async function buscarCNPJ(d, a, cb) { try { const r = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + d); if (!r.ok) throw 0; const j = await r.json();
  a.razao = j.razao_social || ''; a.fantasia = j.nome_fantasia || ''; a.cnae = j.cnae_fiscal_descricao || ''; a.cnpjCidade = (j.municipio || '') + (j.uf ? '/' + j.uf : ''); a.cnpjCep = j.cep || ''; a.cnpjOk = true;
  /* CNAEs da Receita: principal + secundários. É a rede de segurança — toda empresa tem CNPJ,
     então mesmo a atividade que falta na tabela da seguradora aparece aqui com o nome oficial. */
  a.cnaes = [j.cnae_fiscal_descricao ? { codigo: String(j.cnae_fiscal || ''), descricao: j.cnae_fiscal_descricao, principal: true } : null]
    .concat((j.cnaes_secundarios || []).map(c => ({ codigo: String(c.codigo || ''), descricao: c.descricao || '', principal: false }))).filter(x => x && x.descricao);
  if (!a.nome) { a.nome = a.fantasia || a.razao; const el = palco.querySelector('[data-in="nome"]'); if (el) el.value = a.nome; } } catch (e) { a.cnpjOk = false; } cb(); salvar(); }

/* ══════════ 2 · ATIVIDADE ══════════
   Três camadas, nesta ordem de confiança:
   1. RUBRICAS  — tabela da seguradora: código oficial, é o que vale.
   2. SINON     — a mesma rubrica achada pela palavra do cliente ("pizzaria").
   3. EXTRAS    — atividade que a tabela atual não contempla: o cliente encontra
                  o nome do próprio negócio e o corretor enquadra depois.
   Fora disso: os CNAEs da Receita (do CNPJ) e o texto livre. O cliente nunca
   fica sem resposta — e cada escolha carrega a origem, para o corretor saber
   o que já vem com código e o que precisa de enquadramento. */
function addAtividade(o) { if (!S.atividades.find(x => x.descricao === o.descricao)) S.atividades.push(o); }
const STOP = { de: 1, da: 1, do: 1, das: 1, dos: 1, em: 1, no: 1, na: 1, nos: 1, nas: 1, com: 1, sem: 1, para: 1, por: 1, que: 1, uma: 1, um: 1, ao: 1, aos: 1, ou: 1, meu: 1, minha: 1, nosso: 1, nossa: 1, empresa: 1, loja: 0.4, comercio: 0.4, servico: 0.4, servicos: 0.4, industria: 0.4, fabrica: 0.4 };
function buscarAtividades(txt) {
  const todos = norm(txt).split(/\s+/).filter(x => x.length > 1);
  /* "corretora DE seguros": a preposição casaria com meio catálogo. Palavras vazias saem;
     palavras genéricas ("loja", "indústria") valem menos que o núcleo do nome. */
  const q = todos.filter(x => STOP[x] !== 1); if (!q.length) return [];
  const forte = q.filter(t => STOP[t] === undefined);
  const casa = (d, bonus) => { let s = 0, ini = 0, fortesOk = 0;
    q.forEach(t => { const peso = STOP[t] || 1;
      if (new RegExp('(^|[^a-z0-9])' + t.replace(/[^a-z0-9]/g, '')).test(d)) { s += (d.startsWith(t) ? 3 : 2) * peso; ini++; if (peso === 1) fortesOk++; }
      else if (d.includes(t)) s += 0.5 * peso; });
    if (!ini) return 0;
    if (forte.length && !fortesOk) return 0;              // casou só no genérico: não serve
    return s + (bonus || 0) * (fortesOk / (forte.length || 1)); };
  const out = [];
  RUBRICAS.forEach(r => { const s = casa(norm(r.descricao), 1); if (s) out.push({ s, o: { codigo: r.codigo, descricao: r.descricao, fonte: 'seguradora' } }); });
  SINON.forEach(sn => { const s = casa(norm(sn.t), 1.5); if (!s) return;
    sn.c.forEach((cod, i) => { const r = RUBRICAS.find(x => x.codigo === cod); if (r && !out.find(x => x.o.codigo === cod)) out.push({ s: s - i * 0.1, o: { codigo: r.codigo, descricao: r.descricao, fonte: 'seguradora' } }); }); });
  EXTRAS.forEach(e => { const s = casa(norm(e.d), 0.8); if (s && e.s !== undefined) { const r = e.s ? RUBRICAS.find(x => x.codigo === e.s) : null;
    out.push({ s, o: { codigo: null, descricao: e.d, fonte: 'lista', rubricaSugerida: r ? r.codigo + ' ' + r.descricao : null } }); } });
  out.sort((a, b) => b.s - a.s || a.o.descricao.length - b.o.descricao.length);
  const teto = out.length ? out[0].s : 0;                 // corta o que ficou muito abaixo do melhor
  return out.filter(x => x.s >= teto * 0.6).slice(0, 8).map(x => x.o);
}
function renderAtividade() {
  progresso(12); S.pos = { etapa: 'atividade' };
  const cnaes = (S.emp.cnaes || []).filter(c => !S.atividades.find(a => a.descricao === c.descricao));
  const dica = S.emp.cnpjOk ? 'Puxei as atividades registradas na Receita. Confirme as que <strong>acontecem de fato</strong> — é comum o cadastro não refletir a operação — e acrescente o que faltar.'

      <input class="ent" id="bq" placeholder="Ex.: corretora de seguros, móveis, padaria, depósito…" autocomplete="off">

    <div id="ecoAtv"></div></div>`;

    $('tags').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { S.atividades.splice(Number(b.dataset.x), 1); pintar(); salvar(); });

    b.classList.add('sel'); b.disabled = true; pintar(); salvar(); });

/* ══════════ 3 · LOCAIS E ESTRUTURA ══════════ */

function ajustarLocais() { let n = S.emp.nLocais || 1; if (n > 8 && S.emp.planilha === 'principais') n = Math.max(1, S.emp.nAqui || 3); n = Math.min(n, 30);
  while (S.locais.length < n) S.locais.push(novoLocal()); if (S.locais.length > n) S.locais.length = n; }

/* ══════════ 4 · SEGURO ATUAL ══════════ */

/* ══════════ 5 · HUB DE LOCAIS ══════════ */
const PAGS_LOCAL = ['endereco', 'construcao', 'predio', 'conteudo', 'protecao', 'exposicao', 'coberturas', 'historico'];
const nomeLocal = (L, i) => L.apelido || ('Local ' + (i + 1));
const vrPredio = L => (L.m2 && cubDe(L)) ? L.m2 * cubDe(L) + (typeof L.valorInstalacoes === 'number' ? L.valorInstalacoes : 0) : null;
const cubDe = L => L.cub === 'outro' ? (L.cubOutro || null) : (L.cub ? Number(L.cub) : null);
const vrDM = L => (vrPredio(L) || 0) + (typeof L.mmu === 'number' ? L.mmu : 0) + (typeof L.estoquePico === 'number' ? L.estoquePico : typeof L.estoqueMedio === 'number' ? L.estoqueMedio : 0);
const pctLocal = L => Math.round(PAGS_LOCAL.filter(p => L.feitas && L.feitas[p]).length / PAGS_LOCAL.length * 100);
function renderHub() {
  ajustarLocais(); S.pos = { etapa: 'hub' };
  const feitos = S.locais.filter(L => pctLocal(L) === 100).length; progresso(28 + (S.locais.reduce((s, L) => s + pctLocal(L), 0) / (S.locais.length * 100)) * 47);
  if (S.locais.length === 1 && pctLocal(S.locais[0]) === 0) return renderLocal(0, 0);
  palco.innerHTML = `<div class="cena">${trilha('hub')}<button class="voltar" id="bk">← seguro atual</button>
    <div class="rotulo">Etapa 5 · Local por local · ${feitos} de ${S.locais.length} concluídos</div>
    <div class="titulo">${S.locais.length > 1 ? 'Escolha um local para levantar.' : 'O seu local.'}</div>
    <div class="intro">Em cada um: endereço, construção, <strong>valor do prédio calculado na hora</strong>, conteúdo, proteções, coberturas e histórico. Pode fazer em qualquer ordem e voltar quando quiser.</div>
    <div class="hub">${S.locais.map((L, i) => { const p = pctLocal(L), v = vrDM(L);
      return `<button class="lc ${p === 100 ? 'ok' : ''}" data-i="${i}"><div class="l1"><span class="n">${esc(nomeLocal(L, i))}</span><span class="st">${p === 100 ? '✓ concluído' : p ? p + '%' : 'começar'}</span></div>
        <div class="e">${L.cidade ? esc((L.logradouro ? L.logradouro + (L.numero ? ', ' + L.numero : '') + ' · ' : '') + L.cidade + '/' + L.uf) : 'Endereço ainda não informado'}</div>
        ${v ? `<div class="vr">Valor em risco apurado: ${brlC(v)}</div>` : ''}<div class="bar"><i style="width:${p}%"></i></div></button>`; }).join('')}</div></div>`;
  window.scrollTo(0, 0);
  palco.querySelectorAll('.lc').forEach(b => b.onclick = () => { const i = Number(b.dataset.i), L = S.locais[i]; const k = PAGS_LOCAL.findIndex(p => !(L.feitas || {})[p]); renderLocal(i, k < 0 ? 0 : k); });
  $('bk').onclick = renderSeguro;
  barra([{ t: feitos === S.locais.length ? 'Continuidade do negócio →' : 'Seguir mesmo assim →', cls: feitos === S.locais.length ? '' : 'btn-2', f: renderParada }]);
}

/* ══════════ PÁGINAS DO LOCAL ══════════ */
function renderLocal(i, k) {
  const L = S.locais[i]; L.feitas = L.feitas || {}; L.prot = L.prot || {}; L.expo = L.expo || {}; L.cobs = L.cobs || {};
  S.pos = { etapa: 'local', i, k }; progresso(28 + ((i + k / PAGS_LOCAL.length) / S.locais.length) * 47);
  const P = perfil(L), nome = nomeLocal(L, i), tem = S.emp.temSeguro === 'sim';
  const rot = `${esc(nome)} · passo ${k + 1} de ${PAGS_LOCAL.length}`;
  const ir = d => () => { L.feitas[PAGS_LOCAL[k]] = true; salvar(); const n = k + d; if (n < 0 || n >= PAGS_LOCAL.length) return renderHubOuProximo(i); renderLocal(i, n); };
  const bts = [{ t: '←', cls: 'btn-2', f: k === 0 ? () => (S.locais.length > 1 ? renderHub() : renderSeguro()) : () => renderLocal(i, k - 1) }, { t: k === PAGS_LOCAL.length - 1 ? 'Concluir este local ✓' : 'Continuar →', f: ir(1) }];
  const base = { trilha: 'hub', rotulo: rot, alvo: L, botoes: bts, voltar: S.locais.length > 1 ? renderHub : null, voltarTxt: 'todos os locais' };
  const pg = PAGS_LOCAL[k];

  if (pg === 'endereco') {
    const ant = i > 0 ? S.locais.slice(0, i).filter(x => x.feitas && x.feitas.construcao) : [];
    pagina(Object.assign(base, { titulo: 'Onde fica e o que acontece neste local?',
      topo: ant.length && !L._copiado ? `<div class="insight" style="margin-top:16px;">Este local é parecido com <b>${esc(nomeLocal(ant[ant.length - 1], S.locais.indexOf(ant[ant.length - 1])))}</b>? <button class="op" id="btCopia" style="margin-top:9px; width:100%;">Copiar construção, proteções e coberturas — eu só ajusto o que muda</button></div>` : '',
      campos: [
        { id: 'cep', tipo: 'cep', label: 'CEP', ph: '00000-000',
          insight: a => a.cepOk ? `<div class="insight"><b>${esc(a.logradouro || 'Endereço localizado')}</b>${a.bairro ? ' · ' + esc(a.bairro) : ''}<br>${esc(a.cidade)}/${esc(a.uf)}</div>` : a.cepOk === false ? `<div class="insight alerta">CEP não encontrado — confira os números ou siga e informe a cidade ao corretor.</div>` : null },
        { id: 'numero', tipo: 'texto', label: 'Número e complemento', ph: 'Ex.: 1500, galpão B' },

        { id: 'ocupacao', tipo: 'escolha', label: 'O imóvel é…', opcoes: [{ v: 'proprio', t: 'Próprio' }, { v: 'alugado', t: 'Alugado' }, { v: 'misto', t: 'Parte próprio, parte alugado' }] },
        { id: 'contratoExige', tipo: 'tri', label: 'O contrato de locação obriga a empresa a segurar o prédio?', visivel: a => a.ocupacao === 'alugado' || a.ocupacao === 'misto',
          info: 'É muito comum: a cláusula de seguro do contrato de locação transfere ao inquilino a obrigação de segurar o prédio contra incêndio. Se existir e não for cumprida, o inquilino responde pelo prédio do próprio bolso.',
          insight: a => a.contratoExige === 'naosei' ? `<div class="insight alerta">Vale abrir o contrato: se a cláusula existir e o prédio não estiver segurado, a empresa responde por ele.</div>` : a.contratoExige === 'sim' ? `<div class="insight">Então o prédio entra no levantamento, mesmo sendo de terceiro.</div>` : null },
        { id: 'areaTerceiros', tipo: 'tri', label: 'Há outra empresa ocupando parte deste endereço?', info: 'Áreas alugadas ou cedidas a terceiros mudam o risco: a atividade do vizinho de parede conta como se fosse sua.' }
      ] }));
    const bc = $('btCopia'); if (bc) bc.onclick = () => { const o = ant[ant.length - 1];
      ['estrutura', 'telhado', 'isopainel', 'nucleo', 'ano', 'eletrica', 'combustiveis', 'vizinhos', 'cub', 'cubOutro', 'ocupacao', 'uso'].forEach(f => { if (o[f] != null && L[f] == null) L[f] = JSON.parse(JSON.stringify(o[f])); });
      L.prot = JSON.parse(JSON.stringify(o.prot || {})); L.cobs = JSON.parse(JSON.stringify(o.cobs || {})); Object.values(L.cobs).forEach(c => { c.valor = null; }); L._copiado = true;
      eco('Copiado. Nas próximas telas as respostas já vêm marcadas — ajuste só o que for diferente neste local. Valores e metragem ficam em branco de propósito.'); renderLocal(i, 0); };
    return;
  }

  if (pg === 'construcao') return pagina(Object.assign(base, { titulo: 'Como este prédio <em>se comporta diante do fogo</em>?',
    intro: 'É o que a seguradora chama de classe construtiva — e pesa direto no custo. Você descreve o que vê; o enquadramento técnico é por nossa conta.',
    campos: [
      { id: 'estrutura', tipo: 'escolha', label: 'Estrutura e paredes', opcoes: [{ v: 'alvenaria', t: 'Alvenaria / concreto' }, { v: 'metalica', t: 'Estrutura metálica', d: 'com fechamento em alvenaria ou telha' }, { v: 'mista', t: 'Mista', d: 'parte alvenaria, parte madeira/painel' }, { v: 'madeira', t: 'Madeira' }, { v: 'naosei', t: 'Não sei' }] },
      { id: 'telhado', tipo: 'escolha', label: 'Cobertura / telhado', opcoes: [{ v: 'laje', t: 'Laje' }, { v: 'metalica', t: 'Telha metálica' }, { v: 'fibrocimento', t: 'Fibrocimento' }, { v: 'ceramica', t: 'Cerâmica' }, { v: 'sanduiche', t: 'Telha sanduíche / termoacústica' }, { v: 'naosei', t: 'Não sei' }],
        insight: a => a.telhado === 'fibrocimento' ? `<div class="insight alerta">Fibrocimento é o telhado mais sensível a <b>granizo</b>${lembreteMem('clima') ? ' — e ' + lembreteMem('clima') : ''}. Vou destacar essa cobertura adiante.</div>` : null },
      { id: 'isopainel', tipo: 'tri', label: 'Há paredes, forros ou câmaras em painel isotérmico (isopainel / sanduíche)?',
        info: 'Painéis com miolo de espuma (poliuretano, isopor) propagam fogo por dentro, fora da vista, e são avaliados à parte pela seguradora. Painéis com lã de rocha ou PIR se comportam muito melhor.' },

/* ─── ANEXO DA APÓLICE ───
   Mesmo padrão do raio-x do painel: Storage em mb_apolices/<empresa>/<produto>/…,
   máximo 6 arquivos de 15 MB, metadados gravados no próprio registro do cliente.
   Se o Storage falhar (regra, rede, arquivo grande), nada trava: o cliente vê o
   aviso e o caminho do WhatsApp continua ali. */

const ARQ_TIPOS = { pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', heic: 'image/heic' };

async function subirApolice(f, aoProgresso) {
  const emp = (LINK && LINK.empresaId) || 'sem_empresa';
  const caminho = 'mb_apolices/' + emp + '/empresarial/' + SESSAO + '/' + Date.now() + '_' + String(f.name).replace(/[^a-zA-Z0-9_.\-]/g, '_');
  const tarefa = firebase.storage().ref(caminho).put(f, { contentType: _mimeArq(f) });
  tarefa.on('state_changed', sn => { if (aoProgresso && sn.totalBytes) aoProgresso(Math.round(sn.bytesTransferred / sn.totalBytes * 100)); });
  const snap = await _comTimeout(tarefa, 180000);
  const url = await _comTimeout(snap.ref.getDownloadURL(), 20000);

    if (['pu', 'eps'].includes(L.nucleo)) out.push(n + ': isopainel com núcleo combustível (' + L.nucleo.toUpperCase() + ') — checar restrição da seguradora.');
    if ((L.expo || {}).carregadorVE === 'sim') out.push(n + ': carregamento de veículos/baterias elétricas — levantar quantidade, potência e adequação.');
    if ((L.expo || {}).outraApolice === 'sim') out.push(n + ': concorrência de seguros — solicitar a outra apólice; não somar VRs.');
    if ((L.expo || {}).obras === 'sim') out.push(n + ': obra em andamento — avaliar risco de engenharia / alteração de risco.');
    if ((L.expo || {}).arLivre === 'sim') out.push(n + ': bens ao ar livre — declarar e conferir cobertura.');
    if ((L.expo || {}).bensTerceiros === 'sim' || L.estoqueTerceiros === 'sim') out.push(n + ': bens/mercadorias de terceiros — solicitar valor e responsabilidade contratual.');
    if (L.contratoExige === 'naosei') out.push(n + ': imóvel alugado — verificar cláusula de seguro no contrato de locação.');
    Object.entries(L.prot || {}).forEach(([k, v]) => { if (v === 'tem') out.push(n + ': protecional "' + k + '" existe mas sem confirmação de estar em dia — não declarar sem evidência.'); });
    if ((L.uso || []).length > 1) out.push(n + ': mais de uma atividade no endereço — confirmar rubrica predominante.'); });
  if (S.atividades.length > 1) out.push('Mais de uma atividade marcada — confirmar qual prevalece na tarifação.');
  const sr = S.atividades.filter(a => !a.codigo); if (sr.length) out.push('SEM RUBRICA na tabela atual: ' + sr.map(a => a.descricao + (a.rubricaSugerida ? ' (mais próxima: ' + a.rubricaSugerida + ')' : '')).join(' · ') + ' — enquadrar com a seguradora.');
  if (!S.atividades.length && S.atividadeLivre) out.push('Atividade só em texto livre — enquadrar rubrica.');
  if ((S.emp.nLocais || 0) > S.locais.length) out.push('Cliente tem ' + S.emp.nLocais + ' locais; levantou ' + S.locais.length + ' aqui — solicitar planilha dos demais.'); return out; }
function unidades() { const tot = 5 + S.locais.length * PAGS_LOCAL.length + 2; let ok = ['empresa', 'atividade', 'locais', 'seguro'].indexOf(S.pos.etapa); ok = ok < 0 ? 4 : ok;
  ok += S.locais.reduce((s, L) => s + PAGS_LOCAL.filter(p => (L.feitas || {})[p]).length, 0); if (['revisao', 'fim'].includes(S.pos.etapa)) ok += 1; if (S.enviado) ok = tot; return { ok: Math.max(1, ok), tot }; }
let _salvT = null;
function salvar(fim) { if (fim) { clearTimeout(_salvT); return _gravar(true); } clearTimeout(_salvT); _salvT = setTimeout(() => _gravar(false), 700); }
async function _gravar(fim) { try { if (!SESSAO) return; const u = unidades();
    await db.collection('mb_apresentacoes').doc(SESSAO).set({ questionario: JSON.parse(JSON.stringify(montarQuestionario())), analiticoQ: JSON.parse(JSON.stringify(montarAnalitico(fim || S.enviado))), roteiro: JSON.parse(JSON.stringify(montarRoteiro())),
      questionarioCompleto: !!(fim || S.enviado), passo: u.ok, questTotal: u.tot, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  } catch (e) { console.warn('salvar', e); } }

/* ══════════ RETOMADA ══════════ */
function retomar() { const p = S.pos || {}; if (S.enviado || p.etapa === 'fim') return renderFim();
  ({ empresa: renderEmpresa, atividade: renderAtividade, locais: renderLocais, seguro: renderSeguro, hub: renderHub, parada: renderParada, revisao: renderRevisao }[p.etapa] || (p.etapa === 'local' && S.locais[p.i] ? () => renderLocal(p.i, p.k || 0) : renderAbertura))(); }
function renderRetomar() { const u = unidades(); progresso(u.ok / u.tot * 100); barra(null);
  palco.innerHTML = `<div class="cena"><div class="rotulo">Levantamento em andamento</div><div class="titulo">Bem-vindo de volta${S.emp.nome ? ', ' + esc(S.emp.nome) : ''}.</div>
    <div class="intro">Está tudo guardado: <strong>${Math.round(u.ok / u.tot * 100)}% concluído</strong>${S.locais.length ? ' · ' + S.locais.filter(L => pctLocal(L) === 100).length + ' de ' + S.locais.length + ' locais prontos' : ''}. Você continua exatamente de onde parou — e pode rever qualquer resposta.</div>
    <div class="ops col" style="margin-top:22px;"><button class="op" id="r1">Continuar de onde parei →</button><button class="op leve" id="r2" style="flex:1;">Começar do zero</button></div></div>`;
  $('r1').onclick = retomar; $('r2').onclick = () => { S = novoEstado(); salvar(); renderAbertura(); }; }

/* ══════════ INÍCIO ══════════ */
console.log('%cQuestionário Empresarial v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (token) SESSAO = 'empresarial_' + token;
  else { try { SESSAO = sessionStorage.getItem('sessao_q_empresarial') || sessionStorage.getItem('sessao_ap_empresarial'); } catch (e) {}
    if (!SESSAO) { SESSAO = 'q_' + PRODUTO.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); } try { sessionStorage.setItem('sessao_q_empresarial', SESSAO); } catch (e) {} }
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) { try { let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get(); if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) { LINK = snap.docs[0].data(); base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null; base.destinatario = LINK.destinatario || null; base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        if (LINK.geradoPorWhats) CONTATO_DESTINO.whats = String(LINK.geradoPorWhats).replace(/\D/g, '');
        if (LINK.geradoPorEmail) CONTATO_DESTINO.email = LINK.geradoPorEmail; } } catch (e) { console.warn('link', e); } }
  let anterior = null;
  try { const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) { base.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); base.origem = 'questionario'; }
    else { const d = doc.data() || {}; if (d.respostas && (d.respostas._mapa || d.respostas.atividade)) PRES = d.respostas; const sd = d.questionario && d.questionario._dados; if (sd && sd.pos && sd.pos.etapa && sd.pos.etapa !== 'abertura') anterior = sd; }
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true }); } catch (e) { console.warn('sessao', e); }
  if (anterior) { S = Object.assign(novoEstado(), anterior); renderRetomar(); } else renderAbertura();
});
