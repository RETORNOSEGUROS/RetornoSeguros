  .qcheck-txt b { display:block; color:#fff; font-weight:600; margin-bottom:2px; font-size:14px; }

  .caixa-cob { max-height:340px; overflow-y:auto; padding-right:6px; margin-bottom:12px; }
  .caixa-cob::-webkit-scrollbar { width:5px; }
  .caixa-cob::-webkit-scrollbar-thumb { background:rgba(147,164,200,.3); border-radius:10px; }
  .nota { font-size:11.5px; color:#7b8db3; line-height:1.55; margin-top:10px; }
  .fim { text-align:center; padding:20px 0; }

  @media (max-width:520px) { .palco{padding:22px 18px calc(88px + env(safe-area-inset-bottom));} .op{min-width:100%;} .qbolha{max-width:100%;} }

<script>
/* ══════════════════════════════════════════════════════════════════
   QUESTIONÁRIO DE COTAÇÃO — SEGURO EMPRESARIAL (Trilha A)
   Coleta os dados que a seguradora pede para cotar/revisar uma apólice
   empresarial compreensiva. Coberturas e faixas: BASE de mercado
   (Empresarial Compreensivo) — a serem confirmadas com o formulário
   da seguradora. Regras da casa: nenhuma seguradora citada.
   ══════════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",

const db = firebase.firestore();

const PRODUTO = { id: 'empresarial', nome: 'Seguro Empresarial' };
let SESSAO = null, LINK = null, QRESP = { coberturas: [], coberturasRemovidas: [], sondas: {}, sondasCod: {}, cobPorBloco: {}, _dados: {} }, iQ = 0;
const historico = [];

/* ─── COBERTURAS DO EMPRESARIAL (base de mercado — Compreensivo) ─── */
const COBERTURAS = [

        { v: 'nenhum', t: '😌 Nunca tivemos problema', r: 'Ótimo — mas o seguro existe justamente para o evento que ainda não aconteceu. Mantê-las marcadas não muda o custo agora: é pedido de cotação, não compra.' }
      ]
    },
    itens: [
      { id: 'incendio_raio_explosao', t: 'Incêndio, raio e explosão', d: 'A cobertura básica e obrigatória de toda apólice empresarial — o alicerce sobre o qual as demais se somam.' },
      { id: 'vendaval_granizo', t: 'Vendaval, furacão, ciclone e granizo', d: 'Danos causados por tempestades e ventos fortes. Atenção à franquia própria dessa cobertura.' },

    sonda: {

      multi: true,
      opcoes: [
        { v: 'estoque', t: '📦 Estoque / mercadoria' },

      ],
      r: 'Cada item marcado tem uma cobertura própria — roubo de bens, de valores, equipamentos e vidros são coberturas separadas dentro da mesma apólice. Deixei todas marcadas para a cotação sair completa.'
    },
    itens: [
      { id: 'roubo_furto_bens', t: 'Roubo e furto qualificado de bens', d: 'Mercadorias, estoque, móveis e máquinas subtraídos com arrombamento ou mediante ameaça.' },
      { id: 'roubo_valores', t: 'Roubo de valores (no local e em trânsito)', d: 'Dinheiro em caixa, cofre ou sendo transportado para o banco.' },
      { id: 'equipamentos_eletronicos', t: 'Equipamentos eletrônicos', d: 'Computadores, servidores, PDVs e eletrônicos contra danos e subtração.' },
      { id: 'quebra_vidros', t: 'Quebra de vidros, vitrines e letreiros', d: 'Vidraças, fachadas de vidro e anúncios luminosos.' }
    ] },
  { id: 'responsabilidade', g: 'Responsabilidade com quem te cerca',
    sonda: {
      p: 'Quem circula ou é afetado pela sua operação? Marque tudo — <strong>inclusive o que é da conta de um sócio ou de outra área</strong>:',
      multi: true,
      opcoes: [
        { v: 'clientes', t: '🧍 Clientes dentro do local' },
        { v: 'funcionarios', t: '👷 Funcionários' },
        { v: 'vizinhos', t: '🏘️ Vizinhos colados' },
        { v: 'patio', t: '🚗 Veículos de terceiros no pátio' }
      ],
      r: 'A responsabilidade civil é a cobertura mais esquecida — e a que mais quebra empresa sem apólice: o incêndio que passa para o vizinho, o cliente que cai na loja, o carro riscado no seu pátio. Deixei as RCs correspondentes marcadas.'
    },
    itens: [
      { id: 'rc_estabelecimento', t: 'RC do estabelecimento', d: 'Danos a clientes e terceiros dentro ou por causa da sua operação — inclusive o fogo que atinge o vizinho.' },

    ] },

    sonda: {

      opcoes: [
        { v: 'apolice', t: '📋 A apólice deveria pagar isso', r: 'É o correto — mas é a cobertura mais ausente das PMEs. Na revisão confira o período indenitário (por quantos meses paga): é onde ela costuma ficar curta.' },
        { v: 'caixa', t: '💰 O caixa da empresa', r: 'O caixa aguenta 60 dias sem faturar E ainda pagando a reconstrução? Lucros cessantes existe exatamente para essa conta não recair sobre você.' },
        { v: 'nao_sei', t: '🤔 Não sei', r: 'Anotado — o dano físico tem conserto; a parada longa é o que fecha empresa. Deixei as coberturas de continuidade marcadas.' }
      ]
    },
    itens: [
      { id: 'lucros_cessantes', t: 'Lucros cessantes / despesas fixas', d: 'Mantém o pagamento de folha, aluguel e contas fixas enquanto a operação está parada por sinistro coberto.' },
      { id: 'pagamento_aluguel', t: 'Perda ou pagamento de aluguel', d: 'Cobre o aluguel do imóvel sinistrado (ou de um provisório) durante a reconstrução.' },
      { id: 'recomposicao_registros', t: 'Recomposição de registros e documentos', d: 'Custo de refazer documentos, arquivos e registros perdidos no sinistro.' },
      { id: 'assistencia_24h', t: 'Assistência 24h', d: 'Chaveiro, eletricista, encanador, desentupimento, vidraceiro e cobertura provisória de telhado — serviços que você já usa no dia a dia.' }
    ] }
];

/* ─── DICIONÁRIO ANALÍTICO ─── */
const K = 1e3, MI = 1e6;
const DIC = {
  atividade: [['at_comercio'], ['at_servicos'], ['at_industria'], ['at_deposito'], ['at_alimentacao'], ['at_oficina'], ['at_outra']],
  locais: [['lc_1', 1, 1], ['lc_2_5', 2, 5], ['lc_6_15', 6, 15], ['lc_15_mais', 16, null]],
  construcao: [['con_alvenaria'], ['con_mista'], ['con_madeira'], ['con_naosei']],
  ocupacao: [['oc_proprio'], ['oc_alugado'], ['oc_misto']],
  valorPredio: [
    ['vp_ate250', 0, 250 * K], ['vp_250_500', 250 * K, 500 * K], ['vp_500_1mi', 500 * K, 1 * MI],
    ['vp_1_3mi', 1 * MI, 3 * MI], ['vp_3_10mi', 3 * MI, 10 * MI], ['vp_10mi_mais', 10 * MI, null], ['vp_nao_proprio', null, null]
  ],
  valorConteudo: [
    ['vcont_ate100', 0, 100 * K], ['vcont_100_300', 100 * K, 300 * K], ['vcont_300_1mi', 300 * K, 1 * MI],
    ['vcont_1_3mi', 1 * MI, 3 * MI], ['vcont_3_10mi', 3 * MI, 10 * MI], ['vcont_10mi_mais', 10 * MI, null]
  ],
  valorEstoque: [
    ['vest_sem', null, null], ['vest_ate100', 0, 100 * K], ['vest_100_500', 100 * K, 500 * K],
    ['vest_500_2mi', 500 * K, 2 * MI], ['vest_2_10mi', 2 * MI, 10 * MI], ['vest_10mi_mais', 10 * MI, null]
  ],
  vencimento: [['venc_vencido'], ['venc_este_mes'], ['venc_1_3'], ['venc_3_6'], ['venc_6_mais'], ['venc_sem']],
  premio: [
    ['pm_ate3k', 0, 3 * K], ['pm_3_10k', 3 * K, 10 * K], ['pm_10_30k', 10 * K, 30 * K],
    ['pm_30_100k', 30 * K, 100 * K], ['pm_100k_mais', 100 * K, null], ['pm_nao_sei', null, null], ['pm_sem', null, null]
  ]
};

function registrarDado(campo, iOpcao, texto) {
  QRESP._dados = QRESP._dados || {};
  const linha = (DIC[campo] || [])[iOpcao];
  const d = { texto, i: iOpcao };
  if (linha) {
    d.cod = linha[0];
    if (linha.length > 1) {
      d.min = linha[1] === undefined ? null : linha[1];
      d.max = linha[2] === undefined ? null : linha[2];
      d.mid = (d.min !== null && d.max !== null) ? (d.min + d.max) / 2 : (d.min !== null ? d.min : d.max);
    }
  }
  QRESP._dados[campo] = d;
}

function montarAnalitico(finalizou) {
  const D = QRESP._dados || {};
  const g = (c, p) => (D[c] && D[c][p] !== undefined) ? D[c][p] : null;
  const remov = [], mant = [];
  COBERTURAS.forEach(gr => {
    const b = (QRESP.cobPorBloco || {})[gr.id] || {};
    (b.removidasCod || []).forEach(x => remov.push(x));
    (b.mantidasCod || []).forEach(x => mant.push(x));
  });
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'cotacao', completo: !!finalizou, passo: iQ,
    atividadeCod: g('atividade', 'cod'), atividadeTexto: (D.atividade && D.atividade.texto) || null,
    locaisCod: g('locais', 'cod'), locaisMin: g('locais', 'min'),
    construcaoCod: g('construcao', 'cod'), ocupacaoCod: g('ocupacao', 'cod'),
    valorPredioCod: g('valorPredio', 'cod'), valorPredioMid: g('valorPredio', 'mid'),
    valorConteudoCod: g('valorConteudo', 'cod'), valorConteudoMid: g('valorConteudo', 'mid'),
    valorEstoqueCod: g('valorEstoque', 'cod'), valorEstoqueMid: g('valorEstoque', 'mid'),
    vencimentoCod: g('vencimento', 'cod'), premioCod: g('premio', 'cod'), premioMid: g('premio', 'mid'),
    protecoesFlags: (QRESP.protecoes && QRESP.protecoes.valores) || [],
    sondasCod: Object.assign({}, QRESP.sondasCod || {}),
    coberturasCod: mant, coberturasRemovidasCod: remov,
    nCoberturas: mant.length, nRemovidas: remov.length
  };
}

/* ─── ROTEIRO ─── */
const PERGUNTAS = [
  { fala: 'Olá! Sou o assistente da <strong>Retorno Seguros</strong>. Vou levantar os dados que as seguradoras pedem para cotar (ou revisar) o <strong>seguro empresarial</strong>. São poucas perguntas, todas de clicar, e você responde no seu ritmo.', campo: null },

const $ = id => document.getElementById(id);

const espera = ms => new Promise(r => setTimeout(r, ms));

function irAoFim(suave) {
  const alvo = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  const atual = window.scrollY + window.innerHeight;
  if (alvo - atual < 4) return;
  window.scrollTo({ top: alvo, behavior: suave ? 'smooth' : 'auto' });
}
let _ancoras = [];
function fixarFim(suave) {
  _ancoras.forEach(clearTimeout); _ancoras = [];
  requestAnimationFrame(() => { irAoFim(suave); requestAnimationFrame(() => irAoFim(suave)); });
  [140, 360, 640, 980].forEach(ms => _ancoras.push(setTimeout(() => irAoFim(false), ms)));
}

async function digitar(el, html, vel) {
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buf = '', n = 0;
  for (const p of partes) {
    if (p.startsWith('<')) { buf += p; el.innerHTML = buf + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      buf += ch; el.innerHTML = buf + '<span class="cursor"></span>';
      if ((++n % 6) === 0) irAoFim(false);
      await espera('.!?'.includes(ch) ? (vel || 13) * 9 : ',;:'.includes(ch) ? (vel || 13) * 4 : (vel || 13));
    }
  }
  el.innerHTML = buf;
  irAoFim(false);
}

function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  let v = '';
  if (d.length > 7)      v = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  else if (d.length > 2) v = `(${d.slice(0,2)}) ${d.slice(2)}`;
  else if (d.length > 0) v = `(${d}`;
  el.value = v;
  const av = $('avisoTel');
  if (av) { const curto = d.length > 0 && d.length < 10; av.classList.toggle('on', curto); el.classList.toggle('erro', curto); }
}
window.mascaraTel = mascaraTel;

function recomporCoberturas() {
  const man = [], rem = [];
  COBERTURAS.forEach(gr => {
    const b = (QRESP.cobPorBloco || {})[gr.id];
    if (!b) return;
    man.push(...(b.mantidas || [])); rem.push(...(b.removidas || []));
  });
  QRESP.coberturas = man; QRESP.coberturasRemovidas = rem;
}

function voltarPara(hi) {
  const alvo = historico[hi];
  if (!alvo || typeof alvo.i !== 'number') return;
  historico.length = hi; iQ = alvo.i;
  PERGUNTAS.slice(iQ).filter(x => x.tipo === 'bloco').map(x => COBERTURAS[x.gi]).forEach(gr => {
    if (QRESP.cobPorBloco) delete QRESP.cobPorBloco[gr.id];
    if (QRESP.sondas) delete QRESP.sondas[gr.g];
    if (QRESP.sondasCod) delete QRESP.sondasCod[gr.id];
  });
  recomporCoberturas();
  window.scrollTo({ top: 0, behavior: 'auto' });
  render();
}
window.voltarPara = voltarPara;

    (d.historicoQ || []).forEach(h => historico.push(h));

    historico.length = 0; iQ = 0;
    salvar(); render();
  };
}

function montarRoteiroQ() {
  return PERGUNTAS.map(function (q, idx) {
    if (!q.campo || q.tipo === 'contato') return null;
    var h = historico.find(function (x) { return x.i === idx; });
    var p = (q.fala || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return { k: q.campo, p: p, r: (h && h.r != null && h.r !== '') ? String(h.r) : null };
  }).filter(Boolean);
}

async function salvar(finalizou) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP,
      analitico: montarAnalitico(finalizou),
      questionarioCompleto: !!finalizou,
      passo: iQ, questTotal: PERGUNTAS.length,
      historicoQ: historico, roteiro: montarRoteiroQ(),
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null; base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
      }
    } catch (e) { console.warn('link', e); }
  }

  if (LINK && LINK.empresaNome) {
    QRESP.empresa = LINK.empresaNome;
    const iEmp = PERGUNTAS.findIndex(q => q.campo === 'empresa');
    if (iEmp >= 0) PERGUNTAS.splice(iEmp, 1);
    PERGUNTAS[0].fala = 'Olá! Sou o assistente da <strong>Retorno Seguros</strong>. Aproveitei o que você já viu no check-up da <strong>' + LINK.empresaNome + '</strong> — vamos direto aos dados que faltam para cotar o <strong>seguro empresarial</strong>. Poucas perguntas, todas de clicar.';
  }

  let anterior = null;
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    else {
      const d = doc.data() || {};
      if (!d.questionarioCompleto && (Number(d.passo) || 0) > 0 && d.questionario) anterior = d;
    }
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }

  if (anterior) renderRetomar(anterior);
  else render();
});
</script>
</body>
</html>
