<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sua proposta de seguro | Retorno Seguros</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --escuro:#050e24; --azul:#1e3a6d; --ciano:#38bdf8; --dourado:#fbbf24;
          --tinta:#0f172a; --suave:#64748b; --linha:#e6ebf5; --fundo:#f6f8fc; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--fundo); color:var(--tinta); }

  /* ---- topo escuro ---- */
  .hero { background:linear-gradient(160deg,#050e24,#0f2a5c 60%,#1e3a6d);
    color:#fff; padding:calc(26px + env(safe-area-inset-top)) 22px 70px; position:relative; overflow:hidden; }
  .hero::after { content:''; position:absolute; width:60vw; height:60vw; border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,.22),transparent 70%); top:-25%; right:-18%; filter:blur(40px); }
  .hero-in { max-width:760px; margin:0 auto; position:relative; z-index:1; }
  .marca { font-size:10.5px; letter-spacing:.22em; color:#7f9ac9; font-weight:700; text-transform:uppercase; }
  .h-prod { font-size:clamp(22px,5vw,32px); font-weight:800; margin-top:12px; line-height:1.2; letter-spacing:-.02em; }
  .h-emp { font-size:14px; color:#b9cbe8; margin-top:6px; font-weight:400; }
  .h-seg { display:inline-flex; align-items:center; gap:7px; margin-top:16px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16); border-radius:100px; padding:6px 14px; font-size:12.5px; font-weight:600; }
  .validade { margin-top:14px; font-size:12.5px; color:#fcd34d; font-weight:600; }
  .validade.vencida { color:#fca5a5; }

  /* ---- corpo ---- */
  .corpo { max-width:760px; margin:-48px auto 0; padding:0 18px calc(40px + env(safe-area-inset-bottom)); position:relative; z-index:2; }
  .card { background:#fff; border-radius:16px; padding:22px; margin-bottom:14px;
    box-shadow:0 4px 22px rgba(15,23,42,.07); border:1px solid var(--linha); }
  .rot { font-size:10.5px; letter-spacing:.16em; color:var(--suave); font-weight:700; text-transform:uppercase; margin-bottom:12px; }
  .valorao { font-size:clamp(30px,8vw,42px); font-weight:800; letter-spacing:-.03em; color:var(--tinta); line-height:1; }
  .valorao small { font-size:15px; font-weight:600; color:var(--suave); }
  .sub { font-size:12.5px; color:var(--suave); margin-top:7px; line-height:1.5; }

  .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:16px; }
  .mini { background:var(--fundo); border-radius:11px; padding:12px 14px; }
  .mini b { display:block; font-size:10px; color:var(--suave); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .mini span { font-size:15px; font-weight:700; color:var(--tinta); display:block; margin-top:3px; }

  /* parcelamento */
  .parc { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .p-linha { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 15px;
    border:1px solid var(--linha); border-radius:11px; font-size:13.5px; transition:all .18s; }
  .p-linha.destaque { border-color:#86efac; background:#f0fdf4; }
  .p-cond { font-weight:700; color:var(--tinta); }
  .p-val { text-align:right; white-space:nowrap; }
  .p-val b { display:block; font-size:15px; font-weight:800; }
  .p-val i { font-style:normal; font-size:11px; color:var(--suave); }
  .selo-juros { font-size:9.5px; background:#fef3c7; color:#92400e; padding:2px 7px; border-radius:100px; font-weight:700; }
  .selo-sem { font-size:9.5px; background:#dcfce7; color:#166534; padding:2px 7px; border-radius:100px; font-weight:700; }

  /* coberturas */
  .cob { border:1px solid var(--linha); border-radius:12px; margin-bottom:9px; overflow:hidden; }
  .cob-topo { display:flex; justify-content:space-between; gap:12px; padding:14px 16px; cursor:pointer; align-items:flex-start; }
  .cob-topo:hover { background:#fafbfe; }
  .cob-nome { font-size:14px; font-weight:700; color:var(--tinta); line-height:1.35; }
  .cob-lmi { text-align:right; white-space:nowrap; }
  .cob-lmi b { display:block; font-size:14px; font-weight:800; color:var(--azul); }
  .cob-lmi i { font-style:normal; font-size:10.5px; color:var(--suave); }
  .cob-desc { padding:0 16px 15px; font-size:13px; color:#475569; line-height:1.6; display:none; border-top:1px solid var(--linha); padding-top:13px; }
  .cob.on .cob-desc { display:block; }
  .cob.basica { border-color:#bfdbfe; background:#f8fbff; }
  .tag-b { font-size:9.5px; background:#dbeafe; color:#1d4ed8; padding:2px 7px; border-radius:100px; font-weight:700; margin-left:6px; vertical-align:middle; }

  .grupo-t { font-size:11px; letter-spacing:.14em; color:var(--azul); font-weight:800; text-transform:uppercase; margin:20px 0 10px; }
  .grupo-t:first-child { margin-top:0; }

  .info-linha { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--linha); font-size:13.5px; }
  .info-linha:last-child { border-bottom:none; }
  .info-linha b { min-width:150px; color:var(--tinta); font-weight:700; }
  .info-linha span { color:#475569; line-height:1.55; }

  .excl { font-size:13px; color:#475569; line-height:1.7; padding-left:18px; }
  .excl li { margin-bottom:5px; }

  .aviso { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:14px 16px;
    font-size:12.5px; color:#92400e; line-height:1.6; }

  .acoes { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .btn { padding:16px 26px; border-radius:14px; border:none; cursor:pointer; font-size:15px; font-weight:800;
    font-family:inherit; transition:all .2s; width:100%; }
  .btn-ok { background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; }
  .btn-ok:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(22,163,74,.28); }
  .btn-2 { background:#fff; color:var(--tinta); border:1.5px solid var(--linha); }
  .btn-2:hover { border-color:var(--ciano); }

  .rodape { text-align:center; font-size:11px; color:#94a3b8; margin-top:22px; line-height:1.7; }

  .carregando, .erro { max-width:520px; margin:22vh auto; text-align:center; padding:0 24px; }
  .erro h2 { font-size:20px; margin-bottom:8px; }
  .erro p { font-size:14px; color:var(--suave); line-height:1.6; }

  .modal { position:fixed; inset:0; background:rgba(5,14,36,.6); display:none; align-items:flex-end;
    justify-content:center; z-index:50; padding:0; }
  .modal.on { display:flex; }
  .modal-cx { background:#fff; border-radius:20px 20px 0 0; padding:24px 22px calc(24px + env(safe-area-inset-bottom));
    width:100%; max-width:520px; animation:sobe .3s cubic-bezier(.16,1,.3,1); }
  @keyframes sobe { from{transform:translateY(100%);} to{transform:none;} }
  .campo { width:100%; padding:14px 16px; border:1.5px solid var(--linha); border-radius:12px; font-size:15px;
    font-family:inherit; margin-bottom:11px; }
  .campo:focus { outline:none; border-color:var(--ciano); }
  .lbl { font-size:12px; color:var(--suave); font-weight:600; display:block; margin-bottom:6px; }

  @media (min-width:640px) { .modal { align-items:center; } .modal-cx { border-radius:20px; } }
</style>
</head>
<body>
<div id="app"><div class="carregando"><div style="font-size:34px;">📄</div><p style="color:#64748b; margin-top:10px;">Carregando sua proposta…</p></div></div>

<div class="modal" id="modal">
  <div class="modal-cx">
    <div class="rot" id="mTit">Confirmar interesse</div>
    <div id="mOpcoes" style="display:none; margin-bottom:14px;">
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('valor')">💰 O valor ficou acima do esperado</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('socio')">🤝 Preciso alinhar com meu sócio / diretoria</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('comparar')">⚖️ Quero comparar com outra proposta</button>
      <button class="btn btn-2" style="width:100%; text-align:left;" onclick="escolherDuvida('outra')">💬 É outra coisa</button>
    </div>
    <div style="font-size:14px; color:#475569; line-height:1.6; margin-bottom:16px;" id="mTxt"></div>
    <div id="mForm" style="display:none;">
    <label class="lbl">Seu nome</label>
    <input class="campo" id="mNome" placeholder="Nome completo">
    <label class="lbl">Telefone / WhatsApp</label>
    <input class="campo" id="mTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
    <label class="lbl">Mensagem <span style="font-weight:400;">(opcional)</span></label>
    <textarea class="campo" id="mMsg" rows="3" placeholder="Alguma dúvida ou observação?"></textarea>
    <button class="btn btn-ok" id="mOk">Enviar</button>
    </div>
    <button class="btn btn-2" style="margin-top:9px;" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   PROPOSTA ONLINE — visão do cliente
   Lê uma proposta cadastrada pelo corretor e apresenta coberturas,
   limites, prêmio e parcelamento de forma legível. Produto-agnóstico:
   serve para D&O, frota, empresarial e o que vier.
   ══════════════════════════════════════════════════════════════════ */
const ARQ_VERSAO = '3';
window.ARQ_VERSAO = ARQ_VERSAO;
console.log('%cProposta Online v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let P = null, DOC_ID = null;
const $ = id => document.getElementById(id);
const fmt = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtC = v => {
  const n = Number(v || 0);
  if (n >= 1000000) return 'R$ ' + (n / 1000000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (n >= 1000) return 'R$ ' + (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
  return fmt(n);
};

function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  el.value = d.length > 7 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`
           : d.length > 2 ? `(${d.slice(0,2)}) ${d.slice(2)}`
           : d.length > 0 ? `(${d}` : '';
}
window.mascaraTel = mascaraTel;

/* Descrições amigáveis — casadas pelo nome da cobertura.
   O corretor não escreve nada: o sistema reconhece e explica.
   Para incluir um produto novo, acrescente um bloco em DICIONARIOS
   (ex.: frota: [...]) — o resto do arquivo continua igual. */
const DICIONARIOS = {};
DICIONARIOS.do = [
  [/b[áa]sica.*"?A"?|pagamento direto/i, 'A seguradora paga diretamente ao administrador a indenização e os custos de defesa, quando a empresa não puder ou não dever arcar.'],
  [/b[áa]sica.*"?B"?|reembolso à sociedade/i, 'Quando a empresa adianta a defesa ou a indenização do administrador, ela é reembolsada pela seguradora.'],
  [/custos de defesa em uma investiga|defesa em investiga/i, 'Cobre a defesa já na fase de inquérito ou investigação — antes mesmo de virar processo. Advogado, perícia e custas.'],
  [/custos de defesa emergenc/i, 'Libera recursos para a defesa imediata sem precisar aguardar a aprovação prévia da seguradora. Vale quando o prazo é curto.'],
  [/multas e\/?ou penalidades/i, 'Cobre multas civis aplicadas ao administrador, nos limites em que a lei brasileira permite o seguro.'],
  [/penhora online|bloqueio de bens/i, 'Se o juiz bloquear as contas do administrador, a seguradora adianta a última remuneração líquida mensal enquanto durar o bloqueio — para que a vida da família não pare.'],
  [/c[ôo]njuges?|companheir/i, 'Estende a proteção ao cônjuge ou companheiro, que responde junto pelo patrimônio do casal.'],
  [/esp[óo]lio|herdeir/i, 'Se o administrador falecer, a família não herda o processo desprotegida: a apólice continua respondendo.'],
  [/aposentad/i, 'Continua protegendo quem já deixou a empresa, por atos praticados enquanto estava na gestão.'],
  [/pr[áa]ticas trabalhistas/i, 'Quando o administrador é incluído pessoalmente em reclamação trabalhista — situação comum na desconsideração da personalidade jurídica.'],
  [/responsabilidade tribut/i, 'Defesa em autuações fiscais que atingem o administrador pessoalmente, não só a empresa.'],
  [/danos morais/i, 'Indenização por dano moral decorrente de um ato de gestão.'],
  [/danos corporais/i, 'Cobre danos físicos a terceiros ligados a decisões de gestão.'],
  [/danos materiais/i, 'Cobre prejuízo patrimonial causado a terceiros por decisão de gestão.'],
  [/danos ambientais/i, 'Responsabilização pessoal do administrador em questões ambientais — área em que a lei alcança a pessoa física com facilidade.'],
  [/erros e omiss/i, 'Falha técnica na prestação de serviço profissional que gere prejuízo a terceiro.'],
  [/inabilita/i, 'Defesa quando há pedido de afastamento do administrador do cargo.'],
  [/extradi/i, 'Custos de defesa em procedimentos de extradição decorrentes de atos de gestão.'],
  [/gerenciamento de crises|publicidade/i, 'Despesas de comunicação e assessoria de imprensa para proteger a reputação durante uma crise.'],
  [/advogados, ?contadores|risk managers|auditores internos/i, 'Estende a cobertura a profissionais-chave que também respondem pelas decisões técnicas.'],
  [/entidade externa/i, 'Protege quem representa a empresa no conselho ou na diretoria de outra entidade.'],
  [/novas controladas/i, 'Empresas adquiridas durante a vigência entram automaticamente na cobertura.'],
  [/controladas|subsidi[áa]rias/i, 'Estende a proteção aos administradores das empresas do grupo.'],
  [/coligadas/i, 'Alcança os administradores de empresas coligadas.'],
  [/segurado contra um segurado/i, 'Cobre disputas entre os próprios segurados — entre sócios, entre diretores, ou da empresa contra o administrador.'],
  [/tomador e\/?ou controladas.*contra o segurado/i, 'Cobre a reclamação feita pela própria empresa (ou por controlada) contra o administrador.'],
  [/ressarcimento à empresa/i, 'Devolve à empresa valores que ela adiantou em nome do administrador.'],
  [/excesso de perdas/i, 'Camada adicional exclusiva para os segurados nomeados, quando o limite principal se esgota.'],
  [/eventos extraordin[áa]rios|reguladores/i, 'Cobre procedimentos abertos por órgãos reguladores e agências fiscalizadoras.']
];

/* Descrições que valem para qualquer ramo */
DICIONARIOS.geral = [
  [/franquia|participa[çc][ãa]o obrigat/i, 'Valor que fica por conta do segurado em cada sinistro.'],
  [/assist[êe]ncia 24|assist[êe]ncia emergencial/i, 'Atendimento emergencial 24 horas, acionado por telefone ou aplicativo.'],
  [/responsabilidade civil/i, 'Cobre danos causados a terceiros pelos quais o segurado seja responsabilizado.']
];
/* Nome amigável: "Cobertura Básica - "A"" viraria só «"A"», que não diz nada. */
function _nomeCob(n) {
  if (/b[áa]sica.*"?A"?\s*$/i.test(n)) return 'Cobertura Básica A — pagamento direto ao administrador';
  if (/b[áa]sica.*"?B"?\s*$/i.test(n)) return 'Cobertura Básica B — reembolso à empresa';
  return n.replace(/^Cobertura (Adicional|B[áa]sica)\s*-\s*/i, '')
          .replace(/^Extens[ãa]o de Cobertura (para|de|-)\s*/i, '')
          .replace(/\s*-?\s*Processo Susep:?\s*[\d./-]+/i, '')
          .trim();
}

function descrever(nome) {
  // usa o dicionário do produto desta proposta; se não houver, tenta o de D&O e o geral
  const chave = (P && P.produtoId) || _detectarProduto();
  const listas = [DICIONARIOS[chave], DICIONARIOS.do, DICIONARIOS.geral].filter(Boolean);
  for (const lista of listas) for (const [re, txt] of lista) if (re.test(nome)) return txt;
  return '';
}
/* Sem produtoId gravado, deduz pelo nome do produto */
function _detectarProduto() {
  const n = ((P && P.produto) || '').toLowerCase();
  if (/d&o|administradores|diretores/.test(n)) return 'do';
  if (/frota|autom[óo]vel|ve[íi]culo/.test(n)) return 'frota';
  if (/empresarial|patrimonial/.test(n)) return 'empresarial';
  return 'geral';
}

/* Agrupamento visual das coberturas */
const GRUPOS = [
  { t: 'Coberturas básicas', re: /b[áa]sica/i },
  { t: 'Defesa e investigação', re: /defesa|investiga|multas|inabilita|extradi|emergenc/i },
  { t: 'Proteção pessoal e da família', re: /penhora|bloqueio|c[ôo]njuge|esp[óo]lio|herdeir|aposentad/i },
  { t: 'Riscos do dia a dia', re: /trabalhista|tribut|danos|erros|ambient|reguladores/i },
  { t: 'Alcance da apólice', re: /controlad|subsidi|coligad|entidade externa|advogados|segurado|tomador|ressarc|excesso|crises|publicidade/i },
  { t: 'Outras coberturas', re: /.*/ }
];

function render() {
  const venc = P.validade ? new Date(P.validade.split('/').reverse().join('-') + 'T23:59:59') : null;
  const vencida = venc && venc < new Date();
  const parcelas = (P.parcelamento || []).slice().sort((a, b) => (a.total || 0) - (b.total || 0));
  const semJuros = parcelas.filter(p => !p.juros || Number(p.juros) === 0);
  const melhor = semJuros.length ? semJuros[semJuros.length - 1] : null;

  // agrupa coberturas
  const usadas = new Set();
  const grupos = GRUPOS.map(g => {
    const itens = (P.coberturas || []).filter(c => !usadas.has(c.nome) && g.re.test(c.nome));
    itens.forEach(c => usadas.add(c.nome));
    return { t: g.t, itens };
  }).filter(g => g.itens.length);

  $('app').innerHTML = `
    <div class="hero"><div class="hero-in">
      <div class="marca">Retorno Seguros · Proposta</div>
      <div class="h-prod">${P.produto || 'Proposta de seguro'}</div>
      ${P.empresaNome ? `<div class="h-emp">${P.empresaNome}</div>` : ''}
      ${P.seguradora ? `<div class="h-seg">🏢 ${P.seguradora}${P.numero ? ` · nº ${P.numero}` : ''}</div>` : ''}
      ${P.validade ? `<div class="validade${vencida ? ' vencida' : ''}">${vencida ? '⚠ Proposta vencida em' : '⏳ Válida até'} ${P.validade}${vencida ? ' — fale com o corretor para revalidar' : ''}</div>` : ''}
    </div></div>

    <div class="corpo">
      ${P.lmiTotal ? `<div class="card" style="border:1.5px solid #86efac; background:linear-gradient(160deg,#f0fdf4,#ecfdf5);">
        <div class="rot" style="color:#166534;">Proteção contratada para quem decide</div>
        <div class="valorao" style="color:#065f46;">${fmtC(P.lmiTotal)}</div>
        <div class="sub" style="color:#166534;">É o limite que esta apólice coloca entre um processo e o patrimônio pessoal dos administradores${P.empresaNome ? ' da ' + P.empresaNome : ''}.</div>
      </div>` : ''}

      <div class="card">
        <div class="rot">Investimento no seguro</div>
        <div class="valorao">${fmt(P.premioTotal)}</div>
        <div class="sub">
          ${P.premioLiquido ? `Prêmio líquido ${fmt(P.premioLiquido)}` : ''}
          ${P.iof ? ` · IOF ${fmt(P.iof)}` : ''}
          ${P.custoApolice ? ` · custo de apólice ${fmt(P.custoApolice)}` : ''}
        </div>
        ${(P.premioTotal && P.premioTotal > 0) ? `<div class="sub" style="margin-top:8px; color:#0f766e; font-weight:700;">Equivale a ${fmt(P.premioTotal / 365)} por dia${P.lmiTotal ? ` — protegendo ${fmtC(P.lmiTotal)}` : ''}.</div>` : ''}
        <div class="grade">
          ${P.vigenciaInicio ? `<div class="mini"><b>Vigência</b><span style="font-size:13px;">${P.vigenciaInicio} a ${P.vigenciaFim || ''}</span></div>` : ''}
          ${P.ambito ? `<div class="mini"><b>Âmbito</b><span style="font-size:13px;">${P.ambito}</span></div>` : ''}
        </div>
      </div>

      ${parcelas.length ? `<div class="card">
        <div class="rot">Formas de pagamento</div>
        <div class="parc">
          ${parcelas.map(p => {
            const temJuros = p.juros && Number(p.juros) > 0;
            const destaque = melhor && p.condicao === melhor.condicao;
            return `<div class="p-linha${destaque ? ' destaque' : ''}">
              <div>
                <div class="p-cond">${p.condicao}</div>
                <div style="margin-top:3px;">${temJuros ? `<span class="selo-juros">juros ${String(p.juros).replace('.', ',')}% a.m.</span>` : '<span class="selo-sem">sem juros</span>'}${destaque ? ' <span class="selo-sem">melhor opção</span>' : ''}</div>
              </div>
              <div class="p-val">
                <b>${fmt(p.primeira)}</b>
                <i>${(p.demais && Number(p.demais) > 0) ? `+ demais de ${fmt(p.demais)}` : 'parcela única'}</i>
                <i>total ${fmt(p.total)}</i>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      ${grupos.length ? `<div class="card">
        <div class="rot">Coberturas contratadas</div>
        <div class="sub" style="margin-top:-6px; margin-bottom:14px;">Toque em cada uma para entender o que ela protege.</div>
        ${grupos.map(g => `
          <div class="grupo-t">${g.t}</div>
          ${g.itens.map((c, i) => {
            const d = c.descricao || descrever(c.nome);
            const basica = /b[áa]sica/i.test(c.nome);
            return `<div class="cob${basica ? ' basica' : ''}" onclick="this.classList.toggle('on')">
              <div class="cob-topo">
                <div class="cob-nome">${_nomeCob(c.nome)}${basica ? '<span class="tag-b">básica</span>' : ''}</div>
                <div class="cob-lmi">
                  ${c.lmi ? `<b>${fmtC(c.lmi)}</b><i>limite</i>` : ''}
                  ${c.premio ? `<i style="display:block; margin-top:2px;">prêmio ${fmt(c.premio)}</i>` : ''}
                </div>
              </div>
              ${d ? `<div class="cob-desc">${d}${c.franquia ? `<div style="margin-top:8px; font-size:12px; color:#92400e; background:#fffbeb; padding:8px 11px; border-radius:8px;">Franquia: ${fmt(c.franquia)}</div>` : ''}</div>` : ''}
            </div>`;
          }).join('')}`).join('')}
      </div>` : ''}

      ${(P.baseCobertura || P.prazoComplementar || P.prazoSuplementar || P.dataContinuidade || P.receitaLiquida) ? `<div class="card">
        <div class="rot">Como esta apólice funciona</div>
        ${P.baseCobertura ? `<div class="info-linha"><b>Base de cobertura</b><span>${P.baseCobertura}${/reclama/i.test(P.baseCobertura) ? ' — cobre reclamações feitas <strong>pela primeira vez</strong> durante a vigência.' : ''}</span></div>` : ''}
        ${P.prazoComplementar ? `<div class="info-linha"><b>Prazo complementar</b><span>${P.prazoComplementar}</span></div>` : ''}
        ${P.prazoSuplementar ? `<div class="info-linha"><b>Prazo suplementar</b><span>${P.prazoSuplementar}</span></div>` : ''}
        ${P.dataContinuidade ? `<div class="info-linha"><b>Data de continuidade</b><span>${P.dataContinuidade}</span></div>` : ''}
        ${P.receitaLiquida ? `<div class="info-linha"><b>Receita líquida</b><span>${fmt(P.receitaLiquida)}</span></div>` : ''}
      </div>` : ''}

      ${(P.exclusoes && P.exclusoes.length) ? `<div class="card">
        <div class="rot">Principais exclusões</div>
        <div class="sub" style="margin-top:-6px; margin-bottom:12px;">O que esta apólice <strong>não</strong> cobre. Transparência aqui evita surpresa depois.</div>
        <ul class="excl">${P.exclusoes.map(e => `<li>${e}</li>`).join('')}</ul>
      </div>` : ''}

      <div class="card">
        <div class="aviso">
          Este documento é um <strong>resumo da cotação</strong> para facilitar sua leitura. As coberturas, limites e condições
          valem conforme as condições gerais da apólice e a análise de risco da seguradora. A aceitação está sujeita
          à aprovação e ao recebimento de todas as informações solicitadas.
        </div>
        <div class="acoes">
          <button class="btn btn-ok" onclick="abrirModal('contratar')">✓ Quero contratar</button>
          <button class="btn btn-2" onclick="baixarPDF()">📄 Baixar esta proposta em PDF</button>
          <button class="btn btn-2" onclick="abrirModal('duvida')">Tenho uma dúvida</button>
        </div>
      </div>

      <div class="rodape">
        ${P.corretorNome ? `Seu corretor: <strong>${P.corretorNome}</strong><br>` : ''}
        Retorno Administradora e Corretora de Seguros
      </div>
    </div>`;
  registrar('abriu');
}

/* ---- PDF da proposta ---- */
function baixarPDF() {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) return alert('Biblioteca de PDF não carregou. Recarregue a página.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 16; let y = 0;
    const sa = s => String(s || '').replace(/[""]/g, '"').replace(/[–—]/g, '-');

    // ---- capa ----
    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 52, 'F');
    doc.setFillColor(30, 58, 109); doc.circle(W - 18, 8, 26, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(9); doc.setFont(undefined, 'normal');
    doc.text('RETORNO SEGUROS  ·  PROPOSTA', M, 15);
    doc.setFontSize(17); doc.setFont(undefined, 'bold');
    doc.text(doc.splitTextToSize(sa(P.produto || 'Proposta de seguro'), W - M * 2 - 30), M, 26);
    doc.setFontSize(10); doc.setFont(undefined, 'normal'); doc.setTextColor(185, 203, 232);
    let sub = [];
    if (P.empresaNome) sub.push(sa(P.empresaNome));
    if (P.seguradora) sub.push(sa(P.seguradora));
    if (P.numero) sub.push('cotacao ' + P.numero);
    doc.text(sub.join('  ·  '), M, 42);
    y = 64;

    // ---- prêmio ----
    doc.setFillColor(240, 245, 252); doc.roundedRect(M, y - 8, W - M * 2, 30, 2, 2, 'F');
    doc.setTextColor(100, 116, 139); doc.setFontSize(8.5); doc.setFont(undefined, 'bold');
    doc.text('PREMIO TOTAL DO SEGURO', M + 5, y);
    doc.setTextColor(15, 23, 42); doc.setFontSize(20); doc.setFont(undefined, 'bold');
    doc.text(fmt(P.premioTotal).replace('R$', 'R$'), M + 5, y + 10);
    doc.setFontSize(8.5); doc.setFont(undefined, 'normal'); doc.setTextColor(100, 116, 139);
    const det = [];
    if (P.premioLiquido) det.push('liquido ' + fmt(P.premioLiquido));
    if (P.iof) det.push('IOF ' + fmt(P.iof));
    if (P.lmiTotal) det.push('limite maximo ' + fmt(P.lmiTotal));
    doc.text(det.join('  ·  '), M + 5, y + 16);
    y += 32;

    const linha = (rot, val) => {
      if (!val) return;
      if (y > 272) { doc.addPage(); y = M + 6; }
      doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
      doc.text(rot, M, y);
      doc.setTextColor(15, 23, 42); doc.setFont(undefined, 'bold');
      doc.text(sa(val), M + 46, y);
      y += 5.6;
    };
    linha('Vigencia', P.vigenciaInicio ? `${P.vigenciaInicio} a ${P.vigenciaFim || ''}` : '');
    linha('Validade da proposta', P.validade);
    linha('Ambito geografico', P.ambito);
    linha('Base de cobertura', P.baseCobertura);
    y += 5;

    // ---- pagamento ----
    if ((P.parcelamento || []).length) {
      if (y > 235) { doc.addPage(); y = M + 6; }
      doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
      doc.text('Formas de pagamento', M, y); y += 7;
      doc.setFontSize(8.5); doc.setFont(undefined, 'bold'); doc.setTextColor(100, 116, 139);
      doc.text('CONDICAO', M, y); doc.text('1a PARCELA', M + 60, y);
      doc.text('DEMAIS', M + 105, y); doc.text('TOTAL', M + 148, y); y += 4.5;
      doc.setDrawColor(226, 232, 240); doc.line(M, y - 2, W - M, y - 2);
      doc.setFont(undefined, 'normal'); doc.setTextColor(51, 65, 85); doc.setFontSize(9);
      P.parcelamento.slice().sort((a, b) => (a.total || 0) - (b.total || 0)).forEach(p => {
        if (y > 275) { doc.addPage(); y = M + 6; }
        doc.text(sa(p.condicao), M, y);
        doc.text(fmt(p.primeira), M + 60, y);
        doc.text(p.demais > 0 ? fmt(p.demais) : '-', M + 105, y);
        doc.text(fmt(p.total) + (p.juros > 0 ? '' : '  (sem juros)'), M + 148, y);
        y += 5.2;
      });
      y += 6;
    }

    // ---- coberturas ----
    if ((P.coberturas || []).length) {
      if (y > 240) { doc.addPage(); y = M + 6; }
      doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
      doc.text(`Coberturas contratadas (${P.coberturas.length})`, M, y); y += 8;
      P.coberturas.forEach(c => {
        if (y > 262) { doc.addPage(); y = M + 6; }
        const nome = sa(_nomeCob(c.nome));
        doc.setFontSize(9.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
        const ln = doc.splitTextToSize(nome, W - M * 2 - 40);
        doc.text(ln, M, y);
        if (c.lmi) {
          doc.setTextColor(15, 23, 42); doc.setFontSize(9);
          doc.text(fmt(c.lmi), W - M, y, { align: 'right' });
        }
        y += ln.length * 4.4;
        const d = c.descricao || descrever(c.nome);
        if (d) {
          doc.setFontSize(8); doc.setFont(undefined, 'normal'); doc.setTextColor(100, 116, 139);
          const ld = doc.splitTextToSize(sa(d), W - M * 2);
          if (y + ld.length * 3.7 > 275) { doc.addPage(); y = M + 6; }
          doc.text(ld, M, y); y += ld.length * 3.7;
        }
        y += 3.5;
      });
    }

    // ---- exclusões ----
    if ((P.exclusoes || []).length) {
      if (y > 232) { doc.addPage(); y = M + 6; }
      y += 4;
      doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
      doc.text('Principais exclusoes', M, y); y += 6;
      doc.setFontSize(8.5); doc.setFont(undefined, 'normal'); doc.setTextColor(100, 116, 139);
      doc.text('O que esta apolice nao cobre:', M, y); y += 6;
      doc.setFontSize(9); doc.setTextColor(71, 85, 105);
      P.exclusoes.forEach(e => {
        if (y > 274) { doc.addPage(); y = M + 6; }
        const l = doc.splitTextToSize('- ' + sa(e), W - M * 2);
        doc.text(l, M, y); y += l.length * 4.4 + 1;
      });
    }

    // ---- rodapé em todas as páginas ----
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'normal');
      doc.text('Resumo da cotacao. Coberturas, limites e condicoes conforme a apolice e a analise de risco da seguradora.', M, 288);
      doc.text(`${i}/${n}`, W - M, 288, { align: 'right' });
    }

    const nomeArq = 'proposta-' + (P.empresaNome || 'seguro').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '.pdf';
    doc.save(nomeArq);
    registrar('pdf');
  } catch (e) { alert('Nao consegui gerar o PDF: ' + e.message); }
}
window.baixarPDF = baixarPDF;

/* ---- interesse ---- */
let acaoAtual = null;
let duvidaTipo = null;
function abrirModal(tipo) {
  acaoAtual = tipo;
  duvidaTipo = null;
  if (tipo === 'contratar') {
    $('mTit').textContent = 'Quero contratar';
    $('mTxt').textContent = 'Perfeito! Deixe seu contato que o corretor dá sequência na emissão.';
    $('mOpcoes').style.display = 'none';
    $('mForm').style.display = 'block';
    $('modal').classList.add('on');
    setTimeout(() => $('mNome').focus(), 120);
    return;
  }
  // Dúvida: primeiro entender QUAL é a dúvida — cada objeção tem um caminho
  $('mTit').textContent = 'O que ficou em aberto?';
  $('mTxt').textContent = '';
  $('mOpcoes').style.display = 'block';
  $('mForm').style.display = 'none';
  $('modal').classList.add('on');
}
window.abrirModal = abrirModal;

// Resposta sob medida para cada objeção — e o corretor recebe qual foi a trava
const RESPOSTAS_DUVIDA = {
  valor: 'Entendido — e é mais comum do que parece. Muitas vezes dá para ajustar o limite, a franquia ou o parcelamento e chegar num valor que faça sentido. Deixe seu contato que o corretor te mostra as alternativas.',
  socio: 'Faz todo sentido decidir junto. Use o botão "Baixar em PDF" para levar a proposta à conversa — e, se quiser, o corretor participa para responder as perguntas técnicas. Deixe seu contato:',
  comparar: 'Ótimo sinal — comparar é o certo. Uma dica do ofício: compare limites, franquias e coberturas, não só o preço final. Se quiser, o corretor monta um comparativo lado a lado para você. Deixe seu contato:',
  outra: 'Conte o que ficou em aberto — o corretor responde em seguida.'
};
function escolherDuvida(tp) {
  duvidaTipo = tp;
  $('mTxt').textContent = RESPOSTAS_DUVIDA[tp] || RESPOSTAS_DUVIDA.outra;
  $('mOpcoes').style.display = 'none';
  $('mForm').style.display = 'block';
  setTimeout(() => $('mNome').focus(), 120);
}
window.escolherDuvida = escolherDuvida;
function fecharModal() { $('modal').classList.remove('on'); }
window.fecharModal = fecharModal;

$('mOk').onclick = async () => {
  const nome = $('mNome').value.trim();
  if (!nome) return $('mNome').focus();
  $('mOk').disabled = true; $('mOk').textContent = 'Enviando…';
  await registrar(acaoAtual, { nome, telefone: $('mTel').value.trim(), mensagem: $('mMsg').value.trim(), tipoDuvida: duvidaTipo || null });
  $('modal').innerHTML = `<div class="modal-cx" style="text-align:center;">
      <div style="font-size:48px;">✅</div>
      <div style="font-size:19px; font-weight:800; margin:10px 0 6px;">Recebemos!</div>
      <div style="font-size:14px; color:#475569; line-height:1.6;">O corretor foi avisado e entra em contato em breve.</div>
      <button class="btn btn-2" style="margin-top:18px;" onclick="fecharModal()">Fechar</button>
    </div>`;
};

async function registrar(tipo, dados) {
  try {
    if (!DOC_ID) return;
    const upd = {
      ultimaVisita: firebase.firestore.FieldValue.serverTimestamp(),
      eventos: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString(), ...(dados || {}) })
    };
    if (tipo !== 'abriu') { upd.interesse = tipo; upd.contatoCliente = dados || null; }
    else upd.aberta = true;
    await db.collection('mb_propostas').doc(DOC_ID).set(upd, { merge: true });
  } catch (e) { console.warn('registrar', e); }
}

function erro(t, m) {
  $('app').innerHTML = `<div class="erro"><div style="font-size:42px;">🔒</div><h2>${t}</h2><p>${m}</p></div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  /* usa a sessão já existente se houver (ex.: corretor logado no painel) — não a substitui; só entra anônimo se ninguém estiver logado */
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (!token) return erro('Link inválido', 'Peça ao seu corretor o link correto da proposta.');
  try {
    const snap = await db.collection('mb_propostas').where('token', '==', token).limit(1).get();
    if (snap.empty) return erro('Proposta não encontrada', 'O link pode ter expirado. Fale com o seu corretor.');
    DOC_ID = snap.docs[0].id;
    P = snap.docs[0].data();
    render();
  } catch (e) {
    console.error(e);
    erro('Não consegui carregar', 'Tente novamente em instantes ou fale com o seu corretor.');
  }
});
</script>
</body>
