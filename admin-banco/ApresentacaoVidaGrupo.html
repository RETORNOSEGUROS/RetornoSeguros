const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }
function tela(html, longa) { TELAS++; cta(null); document.body.classList.toggle('longa', !!longa); palco.innerHTML = `<div class="cena">${html}</div>`; window.scrollTo(0, 0); }
function cta(btn) { const c = $('cta'); document.body.classList.toggle('cta-on', !!btn); if (!btn) { c.innerHTML = ''; return; }
  c.innerHTML = `<div class="ctafixa"><div style="width:100%; max-width:440px;"><button class="btn btn-ouro" id="ctaBt">${btn.t}</button>${btn.sub ? `<div class="cont" id="ctaSub">${btn.sub}</div>` : ''}</div></div>`; $('ctaBt').onclick = btn.f; }
function passos(k) { return `<div class="passo-n">${[0, 1, 2, 3, 4, 5].map(i => `<i class="${i < k ? 'ok' : i === k ? 'at' : ''}"></i>`).join('')}</div>`; }
let _ecoT = null;
function eco(txt) { const e = $('eco'); if (!txt) return; clearTimeout(_ecoT);
  const ms = Math.min(9000, Math.max(3800, txt.replace(/<[^>]+>/g, '').length * 55));
  e.innerHTML = txt + `<i style="animation:ecoBar ${ms}ms linear forwards;"></i>`; e.classList.add('on'); e.onclick = () => e.classList.remove('on');
  _ecoT = setTimeout(() => e.classList.remove('on'), ms); }
let _jaDigitou = false;
async function digitar(el, html) {
  if (_jaDigitou) { el.innerHTML = html; return; }
  _jaDigitou = true; let pular = false; const sk = () => { pular = true; }; window.addEventListener('pointerdown', sk);
  let buf = ''; outer: for (const p of html.split(/(<[^>]+>)/g).filter(Boolean)) {
    if (p.startsWith('<')) { buf += p; continue; }
    for (const ch of p) { if (pular) break outer; buf += ch; el.innerHTML = buf + '<span class="cursor"></span>'; await espera('.!?'.includes(ch) ? 110 : ',;:'.includes(ch) ? 45 : 13); }
  }
  window.removeEventListener('pointerdown', sk); el.innerHTML = html;
}
function umClique(campo, opcoes, cls) {
  return `<div class="opcoes ${cls || 'lista'}" data-campo="${campo}">${opcoes.map((o, k) => `<button class="op ${(RESP[campo] || {}).valor === o.v ? 'sel' : ''}" data-k="${k}">${o.t}${o.d ? `<small>${o.d}</small>` : ''}</button>`).join('')}</div>`;
}
function ligarClique(campo, opcoes, prox, ecoFn) {
  palco.querySelectorAll(`[data-campo="${campo}"] .op`).forEach(b => b.onclick = async () => {
    const o = opcoes[Number(b.dataset.k)]; palco.querySelectorAll(`[data-campo="${campo}"] .op`).forEach(x => x.classList.toggle('sel', x === b));
    RESP[campo] = { valor: o.v, texto: o.t }; salvar();
    await espera(260); const t = ecoFn ? ecoFn(o) : null; if (t) eco(t); prox();
  });
}

function calcular() {
  const v = c => (RESP[c] || {}).valor;
  let pts = { nao: 45, naosei: 32, sim: 10 }[v('vgSituacao')] || 20;
  const cct = v('vgCCT'); if (cct === 'sim' && v('vgSituacao') !== 'sim') pts += 40; else if (cct === 'naosei') pts += 18; else if (cct === 'sim') pts += 8;
  pts += { ate10: 3, '11_30': 6, '31_100': 9, '101_300': 12, '300_mais': 15 }[v('vgPorte')] || 0;
  const pct = Math.min(100, pts), nivel = pct >= 65 ? 'ALTA' : pct >= 40 ? 'MODERADA' : 'CONTROLADA';
  const modSug = v('vgModalidade') === 'global' ? 'global' : v('vgModalidade') === 'especifica' ? 'especifica'
    : COBS_VIDA.some(c => !c.g && RESP._interesse[c.id]) ? 'especifica' : 'global';
  return { pct, nivel, modSug };
}

  else if (v('vgCCT') === 'naosei') cards.push(['at', '📄', '<b>Vale conferir a convenção coletiva.</b> Se ela exigir o seguro, o risco de descumprimento é da empresa.']);

  if (!ints.length && !ass.length) cards.push(['ok', '⭐', '<b>Você não marcou nenhuma cobertura</b> — tudo bem. O estudo parte do essencial (morte, morte acidental e invalidez por acidente) e mostra o que mais cabe.']);

/* ─── PDF KIT (jsPDF) — mesmo desenho em apresentação, questionário e painel ───
   A4, faixa azul no topo, seções numeradas, pares rótulo/valor em 2 colunas,
   tabelas, caixas de destaque e rodapé com contato e página. Fontes padrão do
   jsPDF (Latin-1): acentos saem certos; emoji e símbolos fora do Latin-1 são trocados. */
function pdfKit(titulo, subtitulo, opt) {
  if (!window.jspdf || !window.jspdf.jsPDF) { alert('O gerador de PDF não carregou. Recarregue a página e tente de novo.'); return null; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 16, CW = W - M * 2; let y = 0;
  const cor = (opt && opt.cor) || [56, 189, 248];
  const t = s => String(s == null ? '' : s).replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/×/g, 'x').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/…/g, '...')
    .replace(/[→←]/g, '->').replace(/•/g, '-').replace(/[^\x00-\xFF\n]/g, '').replace(/[ \t]+/g, ' ').trim();
  const cab = (primeira) => {
    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, primeira ? 38 : 14, 'F'); doc.setFillColor(cor[0], cor[1], cor[2]); doc.rect(0, primeira ? 38 : 14, W, 1.2, 'F');
    doc.setTextColor(255, 255, 255);
    if (primeira) { doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(t(titulo), M, 18); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(170, 186, 214); doc.text(doc.splitTextToSize(t(subtitulo), CW - 40), M, 26);
      doc.setFontSize(8); doc.setTextColor(120, 140, 180); doc.text('RETORNO SEGUROS', W - M, 12, { align: 'right' }); y = 48; }
    else { doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text(t(titulo), M, 9); doc.setFont('helvetica', 'normal'); doc.setTextColor(120, 140, 180); doc.text('RETORNO SEGUROS', W - M, 9, { align: 'right' }); y = 24; }
  };
  const espaco = (h) => { if (y + h > H - 18) { doc.addPage(); cab(false); } };
  cab(true);
  const K = {
    doc, t,
    secao(txt) { espaco(16); y += 2; doc.setFillColor(cor[0], cor[1], cor[2]); doc.rect(M, y - 4, 1.4, 6, 'F'); doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(15, 23, 42); doc.text(t(txt), M + 4, y + 0.6); y += 7; },
    par(txt, o) { const fs = (o && o.fs) || 9.5; doc.setFont('helvetica', (o && o.b) ? 'bold' : 'normal'); doc.setFontSize(fs); doc.setTextColor.apply(doc, (o && o.cor) || [51, 65, 85]);
      const ls = doc.splitTextToSize(t(txt), (o && o.w) || CW); ls.forEach(l => { espaco(fs * 0.5); doc.text(l, (o && o.x) || M, y); y += fs * 0.45; }); y += (o && o.after != null) ? o.after : 2; },
    kv(pares) { const cols = 2, cw = CW / cols; const lin = pares.filter(p => p && p[1] != null && p[1] !== ''); for (let i = 0; i < lin.length; i += cols) {
        const grupo = lin.slice(i, i + cols); const alturas = grupo.map(([, v]) => doc.splitTextToSize(t(v), cw - 6).length); const h = 5 + Math.max(...alturas) * 4.3; espaco(h + 2);
        grupo.forEach(([k, v], j) => { const x = M + j * cw; doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120, 132, 156); doc.text(t(k).toUpperCase(), x, y);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9.8); doc.setTextColor(15, 23, 42); doc.text(doc.splitTextToSize(t(v), cw - 6), x, y + 4.6); });
        y += h + 1.5; } },
    tabela(cab2, linhas, o) { const n = cab2.length, ws = (o && o.ws) || cab2.map(() => CW / n); const al = (o && o.al) || [];
      const linha = (cells, head, zebra) => { const alt = Math.max(...cells.map((c, i) => doc.splitTextToSize(t(c), ws[i] - 4).length)) * 4 + 3.2; espaco(alt);
        if (head) { doc.setFillColor(235, 241, 250); doc.rect(M, y - 3.6, CW, alt, 'F'); } else if (zebra) { doc.setFillColor(248, 250, 253); doc.rect(M, y - 3.6, CW, alt, 'F'); }
        let x = M; cells.forEach((c, i) => { doc.setFont('helvetica', head ? 'bold' : (i === 0 ? 'normal' : 'bold')); doc.setFontSize(head ? 8 : 9); doc.setTextColor(head ? 71 : 30, head ? 85 : 41, head ? 105 : 59);
          const ls = doc.splitTextToSize(t(c), ws[i] - 4); if (al[i] === 'r') doc.text(ls, x + ws[i] - 2, y, { align: 'right' }); else doc.text(ls, x + 1.5, y); x += ws[i]; });
        y += alt; };
      linha(cab2, true); linhas.forEach((l, i) => linha(l, false, i % 2)); y += 3; },
    caixa(titulo2, itens, tipo) { const pal = { alerta: [[255, 247, 237], [194, 65, 12]], ok: [[236, 253, 245], [4, 120, 87]], info: [[239, 246, 255], [29, 78, 216]] }[tipo || 'info'];
      const ls = []; itens.forEach(s => doc.splitTextToSize('- ' + t(s), CW - 10).forEach(l => ls.push(l)));
      const h = 9 + ls.length * 4.3; espaco(Math.min(h, 60)); const y0 = y; doc.setFillColor.apply(doc, pal[0]); doc.roundedRect(M, y - 4, CW, Math.min(h, H - 22 - y + 4), 2, 2, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, pal[1]); doc.text(t(titulo2).toUpperCase(), M + 4, y + 1); y += 6.5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); ls.forEach(l => { if (y > H - 22) { doc.addPage(); cab(false); } doc.setTextColor.apply(doc, pal[1]); doc.text(l, M + 5, y); y += 4.3; }); y += 4; void y0; },
    destaque(rot, valor, sub) { espaco(24); doc.setFillColor(5, 14, 36); doc.roundedRect(M, y - 4, CW, 20, 2, 2, 'F'); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(150, 170, 205); doc.text(t(rot).toUpperCase(), M + 5, y + 1);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(255, 255, 255); doc.text(t(valor), M + 5, y + 9); if (sub) { doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150, 170, 205); doc.text(doc.splitTextToSize(t(sub), CW - 10)[0], M + 5, y + 14); } y += 22; },
    pular(h) { y += h || 3; },
    salvar(nome) { const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(140, 150, 170);
        doc.text('Retorno Seguros  ·  (54) 99701-5000  ·  retorno@retornoseguros.com.br  ·  gerado em ' + new Date().toLocaleDateString('pt-BR'), M, H - 8); doc.text(i + ' / ' + n, W - M, H - 8, { align: 'right' }); }
      doc.save(nome); return doc; }
  };
  return K;
}

/* ─── PDF DA APRESENTAÇÃO (guia para o cliente guardar ou repassar) ─── */
function baixarGuia() {
  const emp = (LINK && LINK.empresaNome) || '';
  const K = pdfKit('Seguro de Vida em Grupo', 'Guia' + (emp ? ' para ' + emp : '') + ': as duas formas de contratar, as coberturas, as assistências e as regras.', { cor: [251, 113, 133] }); if (!K) return;
  const tx = c => (RESP[c] || {}).texto || null;
  if (RESP.vgPorte || RESP.vgSituacao || RESP.vgModalidade) {
    K.secao('O retrato do seu time');
    K.kv([['Colaboradores com carteira', tx('vgPorte')], ['Seguro de vida hoje', tx('vgSituacao')], ['Convenção coletiva exige', tx('vgCCT')], ['Modalidade que combina', tx('vgModalidade')]]);
    if (RESP._vuln) K.destaque('Vulnerabilidade das famílias do time', RESP._vuln.nivel, 'Calculada a partir das suas respostas');
  }
  K.secao('As duas formas de contratar');
  K.tabela(['', 'Global (pela GFIP)', 'Específica (lista de nomes)'], [
    ['Quem entra', 'Todos os empregados da GFIP (e os sócios, se quiser)', 'As pessoas da lista, com nome e data de nascimento'],
    ['O que a empresa informa', 'Só o número de pessoas', 'A lista e, todo mês, quem entrou e quem saiu'],
    ['Valor por pessoa', 'Total do grupo dividido pelas pessoas da GFIP no mês do evento', 'Fixo por pessoa ou múltiplo do salário'],
    ['Idade de entrada', '14 a 70 anos', '14 a 75 anos'], ['Quem paga', 'A empresa, 100%', 'Empresa, colaborador ou dividido'],
    ['Coberturas', COBS_VIDA.filter(c => c.g).length + ' disponíveis', COBS_VIDA.length + ' disponíveis (cardápio completo)']], { ws: [40, 71, 67] });
  FAMILIAS_VIDA.forEach(f => { K.secao(f.nome); K.par(f.expl, { fs: 8.8, cor: [100, 116, 139] });
    K.tabela(['Cobertura', 'O que é', 'Onde existe'], COBS_VIDA.filter(c => c.fam === f.id).map(c => [(RESP._interesse && RESP._interesse[c.id] ? '* ' : '') + c.n, c.res, c.base ? 'Básica (sempre)' : c.g ? 'Global e Específica' : 'Só Específica']), { ws: [52, 96, 30] }); });
  K.secao('Assistências');
  K.tabela(['Assistência', 'Como funciona'], ASSIST_VIDA.map(a => [(RESP._assist && RESP._assist[a.id] ? '* ' : '') + a.n, a.res + ' ' + a.det]), { ws: [44, 134] });
  K.secao('Regras, sem letra miúda'); REGRAS_VIDA.forEach(([, tt, x]) => { K.par(tt, { b: true, fs: 9.5, after: 0.5, cor: [15, 23, 42] }); K.par(x, { fs: 9 }); });
  K.pular(2); K.par('* marcado por você como de interesse. Material informativo: coberturas, limites e carências seguem as condições gerais e a proposta da seguradora. Não é proposta nem cotação.', { fs: 7.8, cor: [120, 132, 156] });
  K.salvar('Guia_Vida_em_Grupo' + (emp ? '_' + emp.replace(/[^a-zA-Z0-9]+/g, '_') : '') + '.pdf');
  registrarInteresse('pdf');
}

/* ══════════ PERSISTÊNCIA ══════════
   respostas[k] = { valor, texto } (o painel lista direto); _vuln acende a barra de
   VULNERABILIDADE; _interesse / _assist = mapas {id: true} lidos pelo questionário. */
const ROTEIRO = [['vgPorte', 'Colaboradores com carteira'], ['vgSituacao', 'Tem seguro de vida hoje'], ['vgCCT', 'Convenção coletiva exige'],
  ['vgModalidade', 'Modalidade que combina'], ['vgClareza', 'Entendeu as regras']];
function montarAnalitico(fim) { const R = calcular(), v = c => (RESP[c] || {}).valor || null;
  return { esquema: 1, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao', completo: !!fim,
    porteCod: v('vgPorte'), situacaoCod: v('vgSituacao'), cctCod: v('vgCCT'), modalidadeCod: v('vgModalidade'), modalidadeSugerida: R.modSug, clarezaCod: v('vgClareza'),
    vulnPct: R.pct, vulnNivel: R.nivel, coberturasInteresse: Object.keys(RESP._interesse).filter(k => RESP._interesse[k]), assistInteresse: Object.keys(RESP._assist).filter(k => RESP._assist[k]) }; }
let _salvT = null;
function salvar(fim) { clearTimeout(_salvT); if (fim) return _gravar(true); _salvT = setTimeout(() => _gravar(false), 450); }
async function _gravar(fim) { try { if (!SESSAO) return;
  const ints = COBS_VIDA.filter(c => RESP._interesse[c.id]).map(c => c.n), ass = ASSIST_VIDA.filter(a => RESP._assist[a.id]).map(a => a.n);
  if (ints.length) RESP.vgInteresses = { textos: ints }; else delete RESP.vgInteresses;
  if (ass.length) RESP.vgAssist = { textos: ass }; else delete RESP.vgAssist;
  const upd = { respostas: JSON.parse(JSON.stringify(RESP)), analitico: montarAnalitico(fim),
    roteiroApres: ROTEIRO.map(([k, p]) => ({ k, p, r: (RESP[k] || {}).texto || null })).concat([{ k: 'vgInteresses', p: 'Coberturas que marcou ⭐', r: ints.join(' · ') || null }, { k: 'vgAssist', p: 'Assistências que marcou ⭐', r: ass.join(' · ') || null }]),
    cenasVistas: TELAS, totalCenas: 9, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };
  if (fim) upd.concluiu = true;
  await db.collection('mb_apresentacoes').doc(SESSAO).set(upd, { merge: true }); } catch (e) { console.warn('salvar', e); } }
async function registrarInteresse(tipo) { try { if (!SESSAO) return;
  await db.collection('mb_apresentacoes').doc(SESSAO).set({ interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }), ultimoInteresse: tipo, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e) {} }

/* ══════════ INÍCIO ══════════ */
console.log('%cApresentação Vida em Grupo v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (token) SESSAO = 'vida_grupo_' + token;
  else { try { SESSAO = sessionStorage.getItem('sessao_ap_vida_grupo'); } catch (e) {}
    if (!SESSAO) { SESSAO = 'ap_vida_grupo_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); try { sessionStorage.setItem('sessao_ap_vida_grupo', SESSAO); } catch (e) {} } }
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, origem: 'apresentacao', atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) { try { let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get(); if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) { LINK = snap.docs[0].data(); base.linkId = snap.docs[0].id; base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null; base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null; base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        try { await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({ aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e2) {} } } catch (e) { console.warn('link', e); } }
  try { const d = await db.collection('mb_apresentacoes').doc(SESSAO).get(); if (!d.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    else { const r = (d.data() || {}).respostas; if (r && typeof r === 'object') { RESP = Object.assign({ _interesse: {}, _assist: {} }, r); RESP._interesse = RESP._interesse || {}; RESP._assist = RESP._assist || {}; } }
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true }); } catch (e) { console.warn('sessao', e); }
  renderAbertura();
});
