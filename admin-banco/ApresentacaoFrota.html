const $ = id => document.getElementById(id);

function cta(btn) { const c = $('cta'); document.body.classList.toggle('cta-on', !!btn); if (!btn) { c.innerHTML = ''; return; }
  c.innerHTML = `<div class="ctafixa"><div style="width:100%; max-width:440px;"><button class="btn btn-ouro" id="ctaBt">${btn.t}</button>${btn.sub ? `<div class="cont" id="ctaSub">${btn.sub}</div>` : ''}</div></div>`; $('ctaBt').onclick = btn.f; }

let _ecoT = null;
function eco(txt) { const e = $('eco'); if (!txt) return; clearTimeout(_ecoT);
  const ms = Math.min(9000, Math.max(3800, txt.replace(/<[^>]+>/g, '').length * 55));
  e.innerHTML = txt + `<i style="animation:ecoBar ${ms}ms linear forwards;"></i>`; e.classList.add('on'); e.onclick = () => e.classList.remove('on');
  _ecoT = setTimeout(() => e.classList.remove('on'), ms); }
let _jaDigitou = false;
async function digitar(el, html) {
  if (_jaDigitou) { el.innerHTML = html; return; }
  _jaDigitou = true; let pular = false; const sk = () => { pular = true; }; window.addEventListener('pointerdown', sk);
  let buf = ''; outer: for (const p of html.split(/(<[^>]+>)/g).filter(Boolean)) {
    if (p.startsWith('<')) { buf += p; continue; }
    for (const ch of p) { if (pular) break outer; buf += ch; el.innerHTML = buf + '<span class="cursor"></span>'; await espera('.!?'.includes(ch) ? 110 : ',;:'.includes(ch) ? 45 : 13); }
  }

}

}

    RESP[campo] = { valor: o.v, texto: o.t }; salvar();

}

/* ─── PDF KIT (jsPDF) — mesmo desenho em apresentação, questionário e painel ───
   A4, faixa azul no topo, seções numeradas, pares rótulo/valor em 2 colunas,
   tabelas, caixas de destaque e rodapé com contato e página. Fontes padrão do
   jsPDF (Latin-1): acentos saem certos; emoji e símbolos fora do Latin-1 são trocados. */
function pdfKit(titulo, subtitulo, opt) {
  if (!window.jspdf || !window.jspdf.jsPDF) { alert('O gerador de PDF não carregou. Recarregue a página e tente de novo.'); return null; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 16, CW = W - M * 2; let y = 0;
  const cor = (opt && opt.cor) || [56, 189, 248];
  const t = s => String(s == null ? '' : s).replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/×/g, 'x').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/…/g, '...')

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, primeira ? 38 : 14, 'F'); doc.setFillColor(cor[0], cor[1], cor[2]); doc.rect(0, primeira ? 38 : 14, W, 1.2, 'F');
    doc.setTextColor(255, 255, 255);
    if (primeira) { doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(t(titulo), M, 18); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(170, 186, 214); doc.text(doc.splitTextToSize(t(subtitulo), CW - 40), M, 26);
      doc.setFontSize(8); doc.setTextColor(120, 140, 180); doc.text('RETORNO SEGUROS', W - M, 12, { align: 'right' }); y = 48; }
    else { doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text(t(titulo), M, 9); doc.setFont('helvetica', 'normal'); doc.setTextColor(120, 140, 180); doc.text('RETORNO SEGUROS', W - M, 9, { align: 'right' }); y = 24; }
  };
  const espaco = (h) => { if (y + h > H - 18) { doc.addPage(); cab(false); } };
  cab(true);
  const K = {
    doc, t,
    secao(txt) { espaco(16); y += 2; doc.setFillColor(cor[0], cor[1], cor[2]); doc.rect(M, y - 4, 1.4, 6, 'F'); doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(15, 23, 42); doc.text(t(txt), M + 4, y + 0.6); y += 7; },
    par(txt, o) { const fs = (o && o.fs) || 9.5; doc.setFont('helvetica', (o && o.b) ? 'bold' : 'normal'); doc.setFontSize(fs); doc.setTextColor.apply(doc, (o && o.cor) || [51, 65, 85]);
      const ls = doc.splitTextToSize(t(txt), (o && o.w) || CW); ls.forEach(l => { espaco(fs * 0.5); doc.text(l, (o && o.x) || M, y); y += fs * 0.45; }); y += (o && o.after != null) ? o.after : 2; },
    kv(pares) { const cols = 2, cw = CW / cols; const lin = pares.filter(p => p && p[1] != null && p[1] !== ''); for (let i = 0; i < lin.length; i += cols) {
        const grupo = lin.slice(i, i + cols); const alturas = grupo.map(([, v]) => doc.splitTextToSize(t(v), cw - 6).length); const h = 5 + Math.max(...alturas) * 4.3; espaco(h + 2);
        grupo.forEach(([k, v], j) => { const x = M + j * cw; doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120, 132, 156); doc.text(t(k).toUpperCase(), x, y);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9.8); doc.setTextColor(15, 23, 42); doc.text(doc.splitTextToSize(t(v), cw - 6), x, y + 4.6); });
        y += h + 1.5; } },
    tabela(cab2, linhas, o) { const n = cab2.length, ws = (o && o.ws) || cab2.map(() => CW / n); const al = (o && o.al) || [];
      const linha = (cells, head, zebra) => { const alt = Math.max(...cells.map((c, i) => doc.splitTextToSize(t(c), ws[i] - 4).length)) * 4.2 + 3.4; espaco(alt);
        if (head) { doc.setFillColor(235, 241, 250); doc.rect(M, y - 3.6, CW, alt, 'F'); } else if (zebra) { doc.setFillColor(248, 250, 253); doc.rect(M, y - 3.6, CW, alt, 'F'); }
        let x = M; cells.forEach((c, i) => { doc.setFont('helvetica', head ? 'bold' : (i === 0 ? 'normal' : 'bold')); doc.setFontSize(head ? 8 : 9); doc.setTextColor(head ? 71 : 30, head ? 85 : 41, head ? 105 : 59);
          const ls = doc.splitTextToSize(t(c), ws[i] - 4); if (al[i] === 'r') doc.text(ls, x + ws[i] - 2, y, { align: 'right' }); else doc.text(ls, x + 1.5, y); x += ws[i]; });
        y += alt; };
      linha(cab2, true); linhas.forEach((l, i) => linha(l, false, i % 2)); y += 3; },
    caixa(titulo2, itens, tipo) { const pal = { alerta: [[255, 247, 237], [194, 65, 12]], ok: [[236, 253, 245], [4, 120, 87]], info: [[239, 246, 255], [29, 78, 216]] }[tipo || 'info'];
      const ls = []; itens.forEach(s => doc.splitTextToSize('- ' + t(s), CW - 10).forEach(l => ls.push(l)));
      const h = 9 + ls.length * 4.3; espaco(Math.min(h, 60)); const y0 = y; doc.setFillColor.apply(doc, pal[0]); doc.roundedRect(M, y - 4, CW, Math.min(h, H - 22 - y + 4), 2, 2, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, pal[1]); doc.text(t(titulo2).toUpperCase(), M + 4, y + 1); y += 6.5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); ls.forEach(l => { if (y > H - 22) { doc.addPage(); cab(false); } doc.setTextColor.apply(doc, pal[1]); doc.text(l, M + 5, y); y += 4.3; }); y += 4; void y0; },
    destaque(rot, valor, sub) { espaco(24); doc.setFillColor(5, 14, 36); doc.roundedRect(M, y - 4, CW, 20, 2, 2, 'F'); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(150, 170, 205); doc.text(t(rot).toUpperCase(), M + 5, y + 1);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(255, 255, 255); doc.text(t(valor), M + 5, y + 9); if (sub) { doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150, 170, 205); doc.text(doc.splitTextToSize(t(sub), CW - 10)[0], M + 5, y + 14); } y += 22; },
    pular(h) { y += h || 3; },
    salvar(nome) { const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(140, 150, 170);
        doc.text('Retorno Seguros  ·  (54) 99701-5000  ·  retorno@retornoseguros.com.br  ·  gerado em ' + new Date().toLocaleDateString('pt-BR'), M, H - 8); doc.text(i + ' / ' + n, W - M, H - 8, { align: 'right' }); }
      doc.save(nome); return doc; }
  };
  return K;
}

    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true }); } catch (e) { console.warn('sessao', e); }
  renderAbertura();
});
