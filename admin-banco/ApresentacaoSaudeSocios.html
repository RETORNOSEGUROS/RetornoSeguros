let _jaDigitou = false, _pularDigitar = false;
function _skipDigitar() { _pularDigitar = true; }
async function digitar(el, html, vel) {
  const full = String(html).replace(/\n/g, '<br><br>');
  if (_jaDigitou) { el.innerHTML = full; el.style.animation = 'entra .3s'; return; }
  _jaDigitou = true; _pularDigitar = false;
  window.addEventListener('pointerdown', _skipDigitar);
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buffer = '';
  outer:
  for (const p of partes) {
    if (p.startsWith('<')) { buffer += p; el.innerHTML = buffer + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      if (_pularDigitar) break outer;
      buffer += (ch === '\n') ? '<br><br>' : ch;
      el.innerHTML = buffer + '<span class="cursor"></span>';
      await espera('.!?'.includes(ch) ? (vel || 14) * 8 : ',;:'.includes(ch) ? (vel || 14) * 4 : (vel || 14));
    }
  }
  window.removeEventListener('pointerdown', _skipDigitar);
  el.innerHTML = full;
}
function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }

async function criarDocRespondente() {
  try {
    if (!SESSAO) return;
    const ref = db.collection('mb_apresentacoes').doc(SESSAO);
    const snap = await ref.get();
    const payload = Object.assign({}, BASEDOC, {
      grupo: GRUPO, perfilPapel: PERFIL_PAPEL, perfilPapelTexto: PAPEL_TXT[PERFIL_PAPEL],
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()

    if (!snap.exists) payload.criadoEm = firebase.firestore.FieldValue.serverTimestamp();

  salvarParcial();

const REGUA_ITENS = ['topo', 'quarto', 'reembolso', 'nacional', 'checkup'];
function reguaMarcadas() { const r = RESP.regua; return (r && r.valores) ? r.valores : null; }
function reguaTem() { const m = reguaMarcadas(); if (!m) return null; return m.includes('tudo') ? REGUA_ITENS.slice() : m.filter(v => v !== 'tudo'); }
function reguaFalhas() { const m = reguaMarcadas(); if (!m) return null; if (m.includes('tudo')) return []; return REGUA_ITENS.filter(v => !m.includes(v)); }

function calcularRetrato() {
  let pts = 0, max = 0;
  ['situacao', 'interna', 'reembolsoHoje'].forEach(campo => {
    const cena = Object.values(CENAS).find(c => c.campo === campo);
    if (!cena) return;
    max += Math.max(...cena.opcoes.map(o => o.risco || 0));
    if (RESP[campo]) pts += RESP[campo].risco || 0;
  });
  const falhas = reguaFalhas();
  if (falhas !== null) { max += 5; pts += Math.min(5, falhas.length); }
  else { max += 5; pts += 2; }  // régua não respondida: meio-termo, sem inventar falha
  const pct = max ? Math.round(pts / max * 100) : 0;
  let nivel, cor, frase;
  if (pct >= 65) {
    nivel = 'GRANDE'; cor = '#f87171';
    frase = 'Pelas suas respostas, a distância entre o acesso que vocês têm e o que poderiam ter é <strong>grande</strong>. Quem mais arrisca pela empresa é hoje quem está menos coberto no dia que importa — e esse é exatamente o problema que um contrato premium de 3 vidas resolve, sem mexer no plano do time.';
  } else if (pct >= 35) {
    nivel = 'MÉDIA'; cor = '#fbbf24';
    frase = 'A distância é <strong>média</strong>: parte do caminho está coberta, mas os pontos descobertos são justamente os caros — hospital de referência, reembolso, o dia do diagnóstico. Vale colocar os dois desenhos lado a lado e decidir com número na mesa.';
  } else {
    nivel = 'PEQUENA'; cor = '#34d399';
    frase = 'Seu acesso já está <strong>próximo do padrão premium</strong>. Ainda assim, vale comparar contrato contra contrato: reembolso, serviços e custo por faixa etária — às vezes o mesmo padrão sai melhor desenhado.';
  }
  return { pct, nivel, cor, frase };
}

  $('btCotar').onclick = async () => {

    if (t) qp.set('t', t); else if (GRUPO) qp.set('g', GRUPO);

}

/* ─── PDF ─── */
function gerarPDF(r) {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) return alert('Biblioteca de PDF não carregou. Recarregue a página.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 18; let y = 0;
    const sa = s => String(s || '').replace(/<[^>]+>/g, '').replace(/[""]/g, '"').replace(/[–—]/g, '-').normalize('NFD').replace(/[̀-ͯ]/g, '');
    const quebra = lim => { if (y > lim) { doc.addPage(); y = M + 6; } };

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 46, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(19); doc.setFont(undefined, 'bold');
    doc.text(sa('Saude dos Socios - segmento premium'), M, 24);
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(147, 164, 200);
    doc.text(sa('Plano empresarial a partir de 3 vidas, categoria socios e diretores  ·  Retorno Seguros'), M, 33);
    y = 58;

    doc.setTextColor(15, 23, 42); doc.setFontSize(12); doc.setFont(undefined, 'bold');
    doc.text('A tese', M, y); y += 7;
    doc.setFontSize(10); doc.setFont(undefined, 'normal'); doc.setTextColor(51, 65, 85);
    const intro = doc.splitTextToSize(sa('Em empresas que cresceram, o plano de saude dos socios costuma ser o mesmo escolhido anos atras. A diferenca entre um plano comum e um plano premium nao aparece na rotina - aparece num unico dia: o dia de um diagnostico serio, quando a pergunta e "onde esta o melhor especialista do pais?". O desenho premium garante que a resposta seja acessivel: rede topo nacional, quarto privativo e reembolso que paga o medico que voce escolher.'), W - M * 2);
    doc.text(intro, M, y); y += intro.length * 4.8 + 7;

    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('O que o desenho entrega', M, y); y += 8;
    [
      ['Rede topo nacional', 'Albert Einstein, Sirio-Libanes, Oswaldo Cruz, Vila Nova Star e HCor (SP); Copa Star, Pro-Cardiaco e Samaritano (RJ); Moinhos de Vento e Mae de Deus (POA); DF Star e Orion (DF/GO) - alem de cerca de 1.700 hospitais, 10 mil laboratorios e 24 mil clinicas em todo o pais.'],
      ['Quarto privativo sempre', 'Internacao em acomodacao individual, com acompanhante sem limite de idade do paciente.'],
      ['Reembolso completo', 'Multiplos de 8x a tabela de referencia em consultas e servicos, e 14x nos honorarios medicos de paciente internado (1,4x nas despesas hospitalares). O app simula o valor antes e o pedido e 100% digital, com biometria - pagamento em ate 30 dias.'],
      ['A partir de 3 vidas', 'Contrato empresarial proprio no CNPJ, categoria socios e diretores. Nao mexe no plano dos funcionarios. As 3 vidas podem ser socios ou socio + dependentes.'],
      ['Familia ate 39 anos', 'Conjuge e filhos solteiros entram como dependentes ate 39 anos, 11 meses e 29 dias.'],
      ['Servicos exclusivos', 'Check-up anual completo (a partir dos 29 anos), segunda opiniao medica internacional, central de vagas e internacao, seguro viagem (ate EUR 50 mil / USD 20 mil), salas VIP em hospitais selecionados, telemedicina 24h, psicologia online, coleta de exames em casa nas grandes capitais e importacao de medicamentos.']
    ].forEach(([t, d]) => {
      quebra(250);
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + sa(t), M, y); y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const ld = doc.splitTextToSize(sa(d), W - M * 2 - 5); doc.text(ld, M + 4, y); y += ld.length * 4.4 + 4;
    });

    if (RESP._retrato) {
      quebra(235); y += 3;
      doc.setFillColor(238, 242, 255); doc.roundedRect(M, y, W - M * 2, 26, 2, 2, 'F');
      doc.setFontSize(11); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 27, 75);
      doc.text(sa('Distancia entre o que voces tem e o que poderiam ter: ' + (r.nivel || '-')), M + 5, y + 10);
      doc.setFontSize(8.5); doc.setFont(undefined, 'normal'); doc.setTextColor(55, 48, 163);
      const fr = doc.splitTextToSize(sa(r.frase || ''), W - M * 2 - 10);
      doc.text(fr.slice(0, 3), M + 5, y + 16);
      y += 32;
    }

    quebra(238); y += 3;
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text(sa('Transparencia - o que e bom saber antes'), M, y); y += 7;
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
    [
      'Carencias de contrato novo: urgencia e emergencia em 24h; consultas e exames simples em ~15 dias; exames complexos, terapias, internacoes e cirurgias em ate 180 dias; parto a termo em 300 dias.',
      'Doencas e lesoes preexistentes declaradas na entrada podem ter cobertura parcial temporaria de ate 24 meses para procedimentos de alta complexidade ligados a elas.',
      'O valor e calculado por faixa etaria de cada pessoa do grupo - por isso a cotacao e individual.',
      'Servicos presenciais do concierge concentrados nas grandes capitais; os digitais valem em todo o pais.',
      'Confirme com o seu contador o tratamento fiscal do beneficio no regime tributario da empresa.'
    ].forEach(t => {
      quebra(262);
      const ld = doc.splitTextToSize('- ' + sa(t), W - M * 2);
      doc.text(ld, M, y); y += ld.length * 4.4 + 2;
    });

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'normal');
      doc.text(sa('Material informativo. Coberturas, rede, carencias e valores conforme o contrato e as Condicoes Gerais da operadora.'), M, 288);
      doc.text(i + '/' + n, W - M, 288, { align: 'right' });
    }
    doc.save('saude-dos-socios-retorno-seguros.pdf');
  } catch (e) { alert('Não consegui gerar o PDF: ' + e.message); }
}

/* ─── CAMADA ANALÍTICA ─── */
function montarAnalitico(finalizou) {
  const cod = campo => { const r = RESP[campo]; if (!r || typeof r.i !== 'number') return null; const l = (DIC[campo] || [])[r.i]; return l ? l[0] : null; };
  const multi = campo => (RESP[campo] && RESP[campo].valores) || [];
  const vf = (() => { const r = RESP.vidasFaixa; if (!r || !r.valores || !r.valores.length) return null; const i = ['3a5','6a10','11a20','20mais','naosei'].indexOf(r.valores[0]); return i >= 0 ? DIC.vidasFaixa[i] : null; })();
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao',
    completo: !!finalizou, passo: iCena,
    papelCod: cod('papel'),
    situacaoCod: cod('situacao'), internaCod: cod('interna'),
    cidadeCasoCod: cod('cidadeCaso'), reembolsoHojeCod: cod('reembolsoHoje'),
    vidasFaixaCod: vf ? vf[0] : null, vidasMid: vf ? vf[3] : null,
    servicosUsa: multi('servicosUsa'), quemEntra: multi('quemEntra'),
    reguaTem: reguaTem(), reguaFalhas: reguaFalhas(),
    oQueMudaria: multi('oQueMudaria'),
    retratoPct: RESP._retrato ? RESP._retrato.pct : null,
    retratoNivel: RESP._retrato ? RESP._retrato.nivel : null,
    alinhamento: RESP.alinhamento || null
  };
}

/* ─── PERSISTÊNCIA ─── */
function montarRoteiroAp() {
  try {
    var arr = Object.keys(CENAS).map(function (k) { return CENAS[k]; });
    return arr.filter(function (c) { return c && c.pergunta && c.campo; }).map(function (c) {
      var v = RESP[c.campo], r = null;
      if (v) r = v.texto || (v.textos && v.textos.join(' · ')) || (v.valor != null ? String(v.valor) : null);
      return { k: c.campo, p: (c.pergunta || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(), r: r };
    });
  } catch (e) { return []; }
}

async function salvarParcial(finalizou) {
  try { if (!SESSAO) return;

      respostas: RESP, roteiroApres: montarRoteiroAp(), analitico: montarAnalitico(finalizou),

    };

}
