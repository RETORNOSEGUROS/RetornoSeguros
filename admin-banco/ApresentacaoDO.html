  .grao { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035;

  .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--ciano),var(--dourado));

/* ─────────── MOTOR ─────────── */
const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));

/* Efeito de digitação — respeita <strong>/<em> e quebra de parágrafo */
async function digitar(el, html, vel) {
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buffer = '';
  for (const p of partes) {
    if (p.startsWith('<')) { buffer += p; el.innerHTML = buffer + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      buffer += (ch === '\n') ? '<br><br>' : ch;
      el.innerHTML = buffer + '<span class="cursor"></span>';
      // ritmo de leitura: pausa maior na pontuação
      await espera('.!?'.includes(ch) ? (vel || 16) * 9 : ',;:'.includes(ch) ? (vel || 16) * 4 : (vel || 16));
    }
  }
  el.innerHTML = buffer;
}

function progresso(p) { $('prog').style.width = Math.min(100, p) + '%'; }

async function renderCena(i) {
  const c = CENAS[i];
  progresso((i / (CENAS.length + 1)) * 100);
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">${c.rotulo}</div>
      <div class="titulo">${c.titulo}</div>
      <div class="corpo" id="corpo"></div>
      ${c.destaque ? `<div class="destaque" id="dest" style="display:none;">💭 ${c.destaque}</div>` : ''}
      <div class="zona-resposta" id="zona">
        <div class="pergunta">${c.pergunta}</div>
        <div class="opcoes" id="ops">
          ${c.opcoes.map((o, k) => `<button class="op" data-k="${k}">${o.txt}</button>`).join('')}
        </div>
      </div>
      <div class="pular"><a id="lkPular">pular apresentação →</a></div>
    </div>`;
  window.scrollTo(0, 0);

  await digitar($('corpo'), c.corpo, 15);
  if (c.destaque) {
    await espera(260);
    const d = $('dest'); d.style.display = 'block'; d.style.animation = 'entra .5s';
    d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  await espera(280);
  const zn = $('zona');
  zn.classList.add('on');
  // em tela longa (celular), traz as opções para o campo de visão
  await espera(160);
  zn.scrollIntoView({ behavior: 'smooth', block: 'end' });

  $('ops').querySelectorAll('.op').forEach(b => {
    b.onclick = async () => {
      const o = c.opcoes[Number(b.dataset.k)];
      $('ops').querySelectorAll('.op').forEach(x => { x.classList.remove('sel'); x.style.animation = 'none'; });
      b.classList.add('sel');
      RESP[c.campo] = { valor: o.v, texto: o.txt, risco: o.risco };
      salvarParcial();
      await espera(360);
      iCena++;
      if (iCena < CENAS.length) renderCena(iCena); else renderResultado();
    };
  });
  $('lkPular').onclick = () => { renderResultado(); };
}

/* ─────────── RESULTADO: grau de exposição ─────────── */
function calcularRisco() {
  const max = CENAS.reduce((s, c) => s + Math.max(...c.opcoes.map(o => o.risco)), 0);
  const obtido = Object.values(RESP).reduce((s, r) => s + (r.risco || 0), 0);
  const pct = max ? Math.round(obtido / max * 100) : 0;
  let nivel, cor, frase;
  if (pct >= 70) {
    nivel = 'ALTA'; cor = '#ef4444';
    frase = 'Pelas suas respostas, a exposição pessoal dos administradores é <strong>alta</strong>. Há decisões de peso, gente sob gestão e patrimônio familiar envolvido — exatamente o cenário que o D&O foi criado para proteger.';
  } else if (pct >= 40) {
    nivel = 'MODERADA'; cor = '#f59e0b';
    frase = 'A exposição é <strong>moderada</strong>, mas nada desprezível. Basta um processo para que o custo de defesa, sozinho, já supere anos de prêmio do seguro.';
  } else {
    nivel = 'CONTROLADA'; cor = '#22c55e';
    frase = 'Sua exposição aparente é <strong>mais controlada</strong> que a média. Ainda assim, vale conhecer os valores — proteção patrimonial costuma custar menos do que se imagina.';
  }
  return { pct, nivel, cor, frase, obtido, max };
}

async function renderResultado() {
  progresso(100);
  const r = calcularRisco();
  RESP._risco = { pct: r.pct, nivel: r.nivel };
  salvarParcial(true);

  const itens = [];
  if (RESP.decisoesDia && RESP.decisoesDia.valor === 'mais10') itens.push(['⚡', '<b>Volume alto de decisões.</b> Mais de 10 por dia significa mais superfície de exposição.']);
  if (RESP.equipe && RESP.equipe.valor === 'mais100') itens.push(['👥', '<b>Gestão de muitas pessoas.</b> Equipes grandes ampliam o risco trabalhista pessoal.']);
  if (RESP.dependentes && RESP.dependentes.valor === '3mais') itens.push(['🏠', '<b>Família dependente.</b> Um bloqueio judicial atingiria mais gente que só você.']);
  if (RESP.regulado && RESP.regulado.valor === 'sim') itens.push(['🏛️', '<b>Setor fiscalizado.</b> Órgãos reguladores podem abrir procedimento contra o administrador.']);
  if (RESP.jaProcessado && RESP.jaProcessado.valor === 'sim') itens.push(['⚖️', '<b>Histórico de citação pessoal.</b> Já aconteceu uma vez — o precedente existe.']);
  if (RESP.percepcao && RESP.percepcao.valor === 'nunca') itens.push(['💡', '<b>Tema novo.</b> A maioria dos executivos descobre o D&O quando já precisa dele.']);
  if (!itens.length) itens.push(['✅', '<b>Cenário mais tranquilo.</b> Ainda assim, conhecer os valores não custa nada.']);

  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">Seu resultado</div>
      <div class="titulo">Grau de exposição dos administradores</div>
      <div class="term">
        <div class="term-nota" style="color:${r.cor};">${r.nivel}</div>
        <div class="term-barra"><div class="term-fill" id="fill" style="background:linear-gradient(90deg,#22c55e,#f59e0b,${r.cor});"></div></div>
        <div class="term-legenda"><span>Controlada</span><span>Moderada</span><span>Alta</span></div>
      </div>
      <div class="corpo" id="corpo"></div>
      <div class="cards-risco" id="cards"></div>
      <div style="font-size:13px;color:#93a4c8;line-height:1.6;border-top:1px solid rgba(147,164,200,.16);padding-top:18px;margin-top:6px;">
        Obrigado por chegar até aqui. Tentamos trazer o máximo de informação para mostrar
        um pouco mais sobre os riscos que existem no dia a dia de quem decide — e o que o seguro cobre.
      </div>
      <div class="acoes-finais">
        <button class="btn btn-ouro" id="btCotar">Quero saber valores e cotar →</button>
        <button class="btn btn-2" id="btPdf">📄 Baixar esta apresentação em PDF</button>
        <button class="btn btn-2" id="btContato">Prefiro que entrem em contato comigo</button>
      </div>
    </div>`;
  window.scrollTo(0, 0);
  setTimeout(() => { $('fill').style.width = Math.max(8, r.pct) + '%'; }, 220);
  await digitar($('corpo'), r.frase, 14);

  const cx = $('cards');
  for (const [ico, txt] of itens) {
    await espera(160);
    const d = document.createElement('div');
    d.className = 'card-risco';
    d.style.animation = 'entra .45s';
    d.innerHTML = `<span style="font-size:18px;">${ico}</span><span>${txt}</span>`;
    cx.appendChild(d);
  }

  $('btCotar').onclick = async () => {
    await registrarInteresse('cotar');
    // leva ao questionário (arquivo próprio), carregando o mesmo token —
    // assim as respostas caem no MESMO registro que o corretor já está vendo
    const t = new URLSearchParams(location.search).get('t');
    location.href = 'QuestionarioDO.html' + (t ? '?t=' + encodeURIComponent(t) : '');
  };
  $('btPdf').onclick = () => { registrarInteresse('pdf'); gerarPDF(r); };
  $('btContato').onclick = () => { registrarInteresse('contato'); renderContato(); };
}

function renderContato() {
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">Contato</div>
      <div class="titulo">Perfeito. Como falamos com você?</div>
      <div class="corpo" style="margin-bottom:22px;">Deixe seus dados que o corretor entra em contato para explicar melhor e apresentar valores, sem compromisso.</div>
      <label class="lbl">Seu nome</label>
      <input class="campo" id="cNome" style="width:100%;margin-bottom:12px;" placeholder="Nome completo">
      <label class="lbl">Empresa</label>
      <input class="campo" id="cEmp" style="width:100%;margin-bottom:12px;" placeholder="Nome da empresa">
      <label class="lbl">E-mail</label>
      <input class="campo" id="cMail" type="email" style="width:100%;margin-bottom:12px;" placeholder="voce@empresa.com.br">
      <label class="lbl">Telefone / WhatsApp</label>
      <input class="campo" id="cTel" style="width:100%;margin-bottom:16px;" placeholder="(00) 00000-0000">

    </div>`;

}

function renderFim(soContato) {
  progresso(100);
  palco.innerHTML = `
    <div class="cena fim-ok">
      <div class="ico">✅</div>
      <div class="titulo" style="font-size:26px;">Recebemos tudo!</div>
      <div class="corpo" style="margin-top:12px;">

          ? 'O corretor já foi avisado e vai entrar em contato em breve.'

/* ─────────── PDF ─────────── */
function gerarPDF(r) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 18; let y = 0;

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 46, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(21); doc.setFont(undefined, 'bold');
    doc.text('D&O — Protecao para quem decide', M, 24);
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(147, 164, 200);
    doc.text('Responsabilidade civil de administradores  ·  Retorno Seguros', M, 33);
    y = 60;

    doc.setTextColor(15, 23, 42); doc.setFontSize(13); doc.setFont(undefined, 'bold');
    doc.text('O que este seguro protege', M, y); y += 8;
    doc.setFontSize(10); doc.setFont(undefined, 'normal'); doc.setTextColor(51, 65, 85);
    const intro = doc.splitTextToSize(
      'O D&O protege o patrimonio PESSOAL de diretores, conselheiros, socios administradores e gerentes com poder de decisao. Quando uma decisao de gestao gera prejuizo a terceiros, quem responde e a pessoa fisica — com o que e seu.', W - M * 2);
    doc.text(intro, M, y); y += intro.length * 5 + 6;

    // Coberturas conforme apolice de mercado (base: Swiss Re Corporate Solutions)
    const cobs = [
      ['Cobertura Basica "A" — pagamento direto', 'A seguradora paga diretamente ao administrador a indenizacao e os custos.'],
      ['Cobertura Basica "B" — reembolso a empresa', 'Reembolsa a empresa quando ela adianta a defesa ou a indenizacao do administrador.'],
      ['Custos de defesa em investigacao', 'Cobre a defesa ja na fase de inquerito, antes mesmo de virar processo.'],
      ['Custos de defesa emergenciais', 'Libera recursos para defesa imediata sem aguardar aprovacao previa.'],
      ['Multas e penalidades', 'Multas civis aplicadas ao administrador, nos limites que a lei permite segurar.'],
      ['Penhora online e bloqueio de bens', 'Adianta a ultima remuneracao liquida mensal enquanto durar o bloqueio judicial.'],
      ['Conjuges ou companheiros', 'Estende a protecao a quem responde junto pelo patrimonio do casal.'],
      ['Espolio, herdeiros e representantes legais', 'A familia nao herda o processo desprotegida.'],
      ['Segurados aposentados', 'Continua protegendo quem ja saiu, por atos praticados enquanto estava na gestao.'],
      ['Praticas trabalhistas indevidas', 'Quando o administrador e incluido pessoalmente em reclamacao trabalhista.'],
      ['Responsabilidade tributaria', 'Defesa em autuacoes fiscais que atingem o administrador pessoalmente.'],
      ['Danos morais, corporais e materiais', 'Indenizacao por danos decorrentes de atos de gestao.'],
      ['Danos ambientais', 'Responsabilizacao pessoal do administrador em questoes ambientais.'],
      ['Erros e omissoes em servicos profissionais', 'Falha tecnica na prestacao de servico que gere prejuizo a terceiro.'],
      ['Eventos extraordinarios com reguladores', 'Procedimentos de orgaos reguladores e agencias fiscalizadoras.'],
      ['Controladas, subsidiarias e coligadas', 'Estende a protecao aos administradores das empresas do grupo.'],
      ['Gerenciamento de crises', 'Despesas de comunicacao e assessoria para proteger a reputacao.'],
      ['Reclamacoes entre segurados', 'Disputas entre socios, diretores ou entre a empresa e o administrador.']
    ];
    doc.setFontSize(13); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Principais coberturas', M, y); y += 8;
    cobs.forEach(([t, d]) => {
      if (y > 250) { doc.addPage(); y = M + 6; }
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + t, M, y); y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const ld = doc.splitTextToSize(d, W - M * 2 - 5);
      doc.text(ld, M + 4, y); y += ld.length * 4.4 + 4;
    });

    if (Object.keys(RESP).length > 1) {
      if (y > 215) { doc.addPage(); y = M + 6; }
      y += 4;
      doc.setFillColor(238, 242, 255); doc.roundedRect(M, y, W - M * 2, 30, 2, 2, 'F');
      doc.setFontSize(11); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 27, 75);
      doc.text('Seu grau de exposicao: ' + (r.nivel || '—'), M + 5, y + 10);
      doc.setFontSize(9); doc.setFont(undefined, 'normal'); doc.setTextColor(55, 48, 163);
      const fr = doc.splitTextToSize((r.frase || '').replace(/<[^>]+>/g, ''), W - M * 2 - 10);
      doc.text(fr, M + 5, y + 17);
      y += 38;
    }

    // ---- Como a apolice funciona + exclusoes (transparencia) ----
    doc.addPage(); y = M + 6;
    doc.setFontSize(13); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Como a apolice funciona', M, y); y += 8;
    const funciona = [
      ['Base de cobertura', 'Apolice "a base de reclamacao com notificacao" (claims made): cobre reclamacoes feitas PELA PRIMEIRA VEZ durante a vigencia.'],
      ['Prazo complementar', 'Ate 36 meses apos o fim da vigencia para notificar reclamacoes, SEM premio adicional.'],
      ['Prazo suplementar', 'Ate 36 meses adicionais, mediante premio: 12 meses = 75% do premio; 24 meses = 100%; 36 meses = 120%.'],
      ['Ambito geografico', 'Mundial.'],
      ['Data de continuidade', 'Igual ao inicio da primeira apolice de D&O contratada — preserva a protecao de atos anteriores.']
    ];
    funciona.forEach(([t, d]) => {
      if (y > 250) { doc.addPage(); y = M + 6; }
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + t, M, y); y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const ld = doc.splitTextToSize(d, W - M * 2 - 5);
      doc.text(ld, M + 4, y); y += ld.length * 4.4 + 4;
    });

    y += 4;
    doc.setFontSize(13); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Principais exclusoes', M, y); y += 7;
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
    const excl = ['Atos dolosos do segurado',
      'Ato ou fato que ja tenha sido objeto de reclamacao anterior',
      'Ofertas publicas de valores mobiliarios',
      'Reclamacoes relacionadas a fundos de pensao',
      'Violacao de normas de combate a corrupcao (com direito a reembolso)',
      'Riscos ciberneticos'];
    excl.forEach(e => {
      if (y > 268) { doc.addPage(); y = M + 6; }
      doc.text('— ' + e, M + 2, y); y += 5;
    });

    doc.setFontSize(8); doc.setTextColor(148, 163, 184);
    doc.text('Material informativo. Coberturas, limites e condicoes conforme a apolice contratada.', M, 285);
    doc.save('DO-apresentacao-retorno-seguros.pdf');
  } catch (e) { alert('Não consegui gerar o PDF: ' + e.message); }
}

/* ─────────── PERSISTÊNCIA ─────────── */
async function salvarParcial(finalizou) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      respostas: RESP,
      cenasVistas: iCena + 1,
      concluiu: !!finalizou,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar parcial', e); }
}

async function registrarInteresse(tipo) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }),
      ultimoInteresse: tipo,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('interesse', e); }
}

async function salvarQuestionario(finalizou) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP,
      questionarioCompleto: !!finalizou,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar questionario', e); }
}

/* ─────────── INÍCIO ─────────── */
const ARQ_VERSAO = '3';
window.ARQ_VERSAO = ARQ_VERSAO;
console.log('%cApresentação D&Ov3', 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');

document.addEventListener('DOMContentLoaded', async () => {
  try { await firebase.auth().signInAnonymously(); } catch (e) { console.warn('auth anônima', e); }

  const params = new URLSearchParams(location.search);
  const token = params.get('t');

  // Sessão ESTÁVEL: com token, a mesma pessoa sempre atualiza o MESMO registro
  // (recarregar a página não cria um novo). Sem token, guarda na aba.
  if (token) SESSAO = 'do_' + token;
  else {
    try { SESSAO = sessionStorage.getItem('sessao_ap_do'); } catch (e) {}
    if (!SESSAO) {
      SESSAO = 'ap_' + PRODUTO.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      try { sessionStorage.setItem('sessao_ap_do', SESSAO); } catch (e) {}
    }
  }
  const base = {
    produtoId: PRODUTO.id, produtoNome: PRODUTO.nome,
    token: token || null, origem: 'apresentacao',
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    userAgent: navigator.userAgent.slice(0, 180)
  };

  if (token) {
    // procura primeiro nos links de apresentação; se não achar, aceita um link
    // de mapeamento (assim um link antigo também funciona)
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.linkId = snap.docs[0].id;
        base.empresaId = LINK.empresaId || null;
        base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null;
        base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        // marca no link que foi aberto (o corretor vê quem já visitou)
        try {
          await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({
            aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch (e2) {}
      }
    } catch (e) { console.warn('link', e); }
  }
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }

  renderCena(0);
});
</script>
