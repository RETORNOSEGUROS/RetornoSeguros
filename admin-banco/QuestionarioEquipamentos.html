/* ─── BUSCA NO ENQUADRAMENTO ─── */
const STOP = { de: 1, da: 1, do: 1, das: 1, dos: 1, em: 1, com: 1, para: 1, p: 1, c: 1, s: 1, e: 1, a: 1, o: 1, maquina: 0.4, equipamento: 0.4, industrial: 0.5 };
function buscarEnq(txt) { const q = norm(txt).split(/[\s/]+/).filter(x => x.length > 1 && STOP[x] !== 1); if (!q.length) return [];
  const forte = q.filter(t => STOP[t] === undefined), sc = new Map();
  const casa = (d, bonus) => { let s = 0, fok = 0; q.forEach(t => { const p = STOP[t] || 1; if (new RegExp('(^|[^a-z0-9])' + t.replace(/[^a-z0-9]/g, '')).test(d)) { s += (d.startsWith(t) ? 3 : 2) * p; if (p === 1) fok++; } else if (d.includes(t)) s += .5 * p; });
    if (forte.length && !fok) return 0; return s ? s + bonus : 0; };
  ENQ.forEach(x => { const s = casa(norm(x), 1); if (s) sc.set(x, Math.max(sc.get(x) || 0, s)); });
  SINON_EQ.forEach(sn => { const s = casa(norm(sn.t), 1.5); if (s) sn.c.forEach((x, i) => sc.set(x, Math.max(sc.get(x) || 0, s - i * .1))); });
  const arr = [...sc.entries()].sort((a, b) => b[1] - a[1] || a[0].length - b[0].length); const teto = arr.length ? arr[0][1] : 0;
  return arr.filter(x => x[1] >= teto * .6).slice(0, 8).map(x => x[0]); }
function ecoEnq(e) { const n = norm(e.enq);
  if (/empilhadeira|transpallet|plataforma|lanca/.test(n)) eco('Máquinas de movimentação: tombamento e colisão são os sinistros mais comuns — e são exatamente o que a cobertura básica protege.');
  else if (/solar|inversor|gerador|transformador|no break/.test(n)) eco('Equipamento de energia: danos elétricos costuma ser a cobertura mais importante aqui.');
  else if (/escavadeira|retro|carregadeira|trator|motoniveladora|rolo|guindaste/.test(n)) eco('Máquina de obra costuma circular: vale considerar cobertura em todo o território nacional e roubo.'); }

const ARQ_MAX = 10, ARQ_MB = 15;
const ARQ_TIPOS = { pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xls: 'application/vnd.ms-excel',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', heic: 'image/heic' };
const _mime = f => f.type || ARQ_TIPOS[((f.name || '').split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
const _tipoOk = f => !!ARQ_TIPOS[((f.name || '').split('.').pop() || '').toLowerCase()];
const _tam = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const _tempo = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('tempo esgotado no envio')), ms))]);
const storageOk = () => { try { return !!(firebase && firebase.storage); } catch (e) { return false; } };

async function subir(f, prog) { const emp = (LINK && LINK.empresaId) || 'sem_empresa';
  const caminho = 'mb_apolices/' + emp + '/equipamentos/' + SESSAO + '/' + Date.now() + '_' + String(f.name).replace(/[^a-zA-Z0-9_.\-]/g, '_');
  const t = firebase.storage().ref(caminho).put(f, { contentType: _mime(f) }); t.on('state_changed', s => { if (prog && s.totalBytes) prog(Math.round(s.bytesTransferred / s.totalBytes * 100)); });
  const snap = await _tempo(t, 180000); const url = await _tempo(snap.ref.getDownloadURL(), 20000);
  return { nome: f.name, url, caminho, tamanho: f.size, em: new Date().toISOString(), via: 'questionario', porNome: S.contato.nome || null, protocolo: protocolo() }; }

      const box = document.createElement('div'); box.className = 'anx'; box.innerHTML = `<span class="nm">⏳ ${esc(f.name)}</span><span class="sz" data-pc>0%</span><i class="bar" style="width:0"></i>`; $('lista').appendChild(box);
      try { const m = await subir(f, pc => { const a = box.querySelector('[data-pc]'), b = box.querySelector('.bar'); if (a) a.textContent = pc + '%'; if (b) b.style.width = pc + '%'; });
        box.remove(); S.anexos.push(m); pintar(); await gravarAnexos(); salvar(true); eco('<b>' + esc(f.name) + '</b> recebido.');
      } catch (err) { box.className = 'anx erro'; box.innerHTML = `<span class="nm">⚠️ ${esc(f.name)}</span><span class="sz">não enviou</span>`; setTimeout(() => box.remove(), 5000);
        eco('Não consegui enviar <b>' + esc(f.name) + '</b>. Sem problema: use o WhatsApp abaixo, com o protocolo ' + protocolo() + '.'); } } };
}

/* ══════════ PERSISTÊNCIA ══════════ */
function montarQuestionario() { const q = { empresa: S.emp.nome || (LINK && LINK.empresaNome) || null, documento: S.emp.doc || null, atividadeEquip: S.emp.atividade || null,

    valorTotalEquip: brl(S.equips.reduce((s, e) => s + valorEq(e), 0)) };
  if (S.contato && S.contato.nome) q.contato = S.contato; q._dados = S; return q; }
function montarRoteiro() { const r = [], add = (k, p, v) => r.push({ k, p, r: v == null || v === '' ? null : String(v) });

    a('grupo', 'Grupo', (GRUPOS.find(g => g.v === e.grupo) || {}).cot); a('enq', 'Enquadramento', e.enq || (e.descricao ? '[descrição] ' + e.descricao : null));
    a('ident', 'Marca / modelo / ano / série', [e.marca, e.modelo, e.ano, e.serie && 'série ' + e.serie, e.chassi && 'chassi ' + e.chassi].filter(Boolean).join(' · '));

    a('nf', 'Nota fiscal', e.nf === 'sim' ? [e.nfNumero, e.nfEmissor, e.nfData].filter(Boolean).join(' · ') || 'sim' : e.nf); a('financiado', 'Financiado', e.financiado === 'sim' ? (e.banco || 'sim') : e.financiado);
    a('abrangencia', 'Abrangência', e.abrangencia === 'nacional' ? 'Todo Território Nacional' : e.abrangencia === 'local' ? 'Local Determinado' : null); a('local', 'Local', localTxt(e));
    a('emplacado', 'Emplacado', e.aceit.emplacado === 'sim' ? 'Sim · ' + (e.aceit.placa || '?') : e.aceit.emplacado); a('veiculo', 'Instalado em veículo', e.aceit.veiculo);
    a('terceiros', 'Operado por terceiros', e.aceit.terceiros === 'sim' ? 'Sim · ' + (e.aceit.terceirosQuem || '') : e.aceit.terceiros); a('leilao', 'Leilão/litígio/massa falida', e.aceit.leilao);
    a('especiais', 'Situações especiais', (e.especiais || []).join(', ')); a('coberturas', 'Coberturas', coberturasTxt(e)); });
  add('apoliceAnexos', 'Arquivos anexados', (S.anexos || []).map(a => a.nome).join(' · ')); add('protocolo', 'Protocolo', protocolo()); return r; }
function montarAnalitico(fim) { const fl = []; S.equips.forEach((e, i) => flagsEq(e).forEach(f => fl.push({ eq: i + 1, nome: nomeEq(e), c: f.c, t: f.t })));
  return { esquema: 1, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'cotacao', completo: !!fim, posEtapa: S.pos.etapa, veioDaApresentacao: !!PRES,
    nEquipamentos: S.equips.reduce((s, e) => s + (e.qtd || 1), 0), nItens: S.equips.length, valorTotal: S.equips.reduce((s, e) => s + valorEq(e), 0) || null,

    seguroHoje: S.emp.seguroHoje || null, renovacaoMes: S.emp.renovacao && S.emp.renovacao !== 'naosei' ? Number(S.emp.renovacao) : null, protocolo: protocolo(), nAnexos: (S.anexos || []).length }; }
let _salvT = null;
function salvar(fim) { if (fim) { clearTimeout(_salvT); return _gravar(true); } clearTimeout(_salvT); _salvT = setTimeout(() => _gravar(false), 600); }
async function _gravar(fim) { try { if (!SESSAO) return;

  await db.collection('mb_apresentacoes').doc(SESSAO).set({ questionario: JSON.parse(JSON.stringify(montarQuestionario())), analiticoQ: JSON.parse(JSON.stringify(montarAnalitico(fim || S.enviado))),

  } catch (e) { console.warn('salvar', e); } }

  ({ empresa: renderEmpresa, locais: renderLocais, hub: renderHub, revisao: renderRevisao }[p.etapa] || (p.etapa === 'equip' && S.equips[p.i] ? () => renderEquip(p.i, p.k || 0) : renderAbertura))(); }
function renderRetomar() { barra(null); const n = S.equips.length;

console.log('%cQuestionário Equipamentos v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}

    if (!SESSAO) SESSAO = 'q_equipamentos_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); try { sessionStorage.setItem('sessao_q_equipamentos', SESSAO); } catch (e) {} }
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) { try { let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get(); if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) { LINK = snap.docs[0].data(); base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null; base.destinatario = LINK.destinatario || null; base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        if (LINK.geradoPorWhats) CONTATO_DESTINO.whats = String(LINK.geradoPorWhats).replace(/\D/g, ''); if (LINK.geradoPorEmail) CONTATO_DESTINO.email = LINK.geradoPorEmail; } } catch (e) { console.warn('link', e); } }
  let anterior = null;
  try { const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) { base.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); base.origem = 'questionario'; }
    else { const d = doc.data() || {}; if (d.respostas && (d.respostas.eqTipo || d.respostas._cob)) PRES = d.respostas; const sd = d.questionario && d.questionario._dados; if (sd && sd.pos && sd.pos.etapa && sd.pos.etapa !== 'abertura') anterior = sd; }
