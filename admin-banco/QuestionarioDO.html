<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --azul-fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --texto:#e8eeff; --suave:#93a4c8; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--azul-fundo); color:var(--texto);
    min-height:100vh; min-height:100dvh; overflow-x:hidden; }
  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .fumaca span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.45; animation:flutuar 22s ease-in-out infinite; }
  .f1 { width:56vw; height:56vw; background:radial-gradient(circle,#1e40af,transparent 70%); top:-14%; left:-12%; }
  .f2 { width:46vw; height:46vw; background:radial-gradient(circle,#0ea5e9,transparent 70%); bottom:-16%; right:-10%; animation-delay:-7s; }
  @keyframes flutuar { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(4vw,-3vh) scale(1.1);} 66%{transform:translate(-3vw,4vh) scale(.95);} }
  .grao { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035;
    background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:3px 3px; }
  .palco { position:relative; z-index:2; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    justify-content:center; padding:28px 22px calc(28px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; }
  .marca { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.22em; color:#4b5f8a; font-weight:700; z-index:3; text-transform:uppercase; }
  .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--ciano),var(--dourado));
    z-index:5; transition:width .5s cubic-bezier(.4,0,.2,1); width:0; box-shadow:0 0 12px rgba(56,189,248,.6); }
  .cena { width:100%; animation:entra .55s cubic-bezier(.16,1,.3,1); }
  @keyframes entra { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:none;} }
  .rotulo { font-size:11px; letter-spacing:.18em; color:var(--ciano); font-weight:700; text-transform:uppercase; margin-bottom:14px; }
  .titulo { font-size:clamp(22px,5vw,32px); font-weight:800; line-height:1.24; margin-bottom:14px; letter-spacing:-.02em; }
  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--ciano); vertical-align:text-bottom; margin-left:2px; animation:pisca .85s step-end infinite; }
  @keyframes pisca { 50%{opacity:0;} }
  .qbolha { background:rgba(255,255,255,.055); border:1px solid rgba(147,164,200,.18); border-radius:16px 16px 16px 4px;
    padding:15px 18px; margin-bottom:14px; font-size:15px; line-height:1.6; color:#d7e1f7; max-width:88%; }
  .qbolha strong { color:#fff; font-weight:600; }
  .qresp { background:linear-gradient(135deg,rgba(56,189,248,.16),rgba(37,99,235,.14)); border-color:rgba(56,189,248,.32);
    border-radius:16px 16px 4px 16px; margin-left:auto; color:#fff; }
  .zona { margin-top:22px; opacity:0; transform:translateY(10px); transition:all .5s; }
  .zona.on { opacity:1; transform:none; }
  .opcoes { display:flex; gap:11px; flex-wrap:wrap; }
  .op { flex:1; min-width:150px; padding:15px 17px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.05);
    border:1.5px solid rgba(147,164,200,.28); color:var(--texto); font-size:14.5px; font-weight:600; font-family:inherit;
    transition:all .22s; text-align:center; animation:pulsar 2.6s ease-in-out infinite; }
  .op:hover,.op:focus { background:rgba(56,189,248,.14); border-color:var(--ciano); transform:translateY(-2px); outline:none; }
  @keyframes pulsar { 0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.28);} 50%{box-shadow:0 0 0 7px rgba(56,189,248,0);} }
  .op:nth-child(2){animation-delay:.2s;} .op:nth-child(3){animation-delay:.4s;} .op:nth-child(4){animation-delay:.6s;}
  .campo { width:100%; padding:15px 17px; border-radius:14px; font-size:16px; font-family:inherit; background:rgba(255,255,255,.05);
    border:1.5px solid rgba(147,164,200,.28); color:#fff; animation:pulsar 2.6s ease-in-out infinite; transition:all .22s; }
  .campo:focus { outline:none; border-color:var(--ciano); background:rgba(56,189,248,.1); animation:none; }
  .campo::placeholder { color:#5d6f95; }
  .campo.erro { border-color:#f87171; }
  .aviso { font-size:11.5px; color:#fca5a5; margin-top:5px; display:none; }
  .aviso.on { display:block; }
  .btn { padding:15px 28px; border-radius:14px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--ciano),#2563eb);
    color:#031127; font-size:15px; font-weight:800; font-family:inherit; transition:all .22s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(56,189,248,.32); }
  .btn-ouro { background:linear-gradient(135deg,var(--dourado),#f59e0b); color:#2a1a00; }
  .btn-2 { background:rgba(255,255,255,.07); color:var(--texto); border:1.5px solid rgba(147,164,200,.3); }
  .lbl { font-size:12.5px; color:var(--suave); font-weight:600; margin-bottom:7px; display:block; }
  .qcheck { display:flex; gap:11px; align-items:flex-start; padding:13px 15px; border-radius:13px; cursor:pointer;
    background:rgba(255,255,255,.045); border:1.5px solid rgba(147,164,200,.2); margin-bottom:8px; transition:all .2s; }
  .qcheck:hover { border-color:var(--ciano); background:rgba(56,189,248,.09); }
  .qcheck.on { border-color:var(--ciano); background:rgba(56,189,248,.15); }
  .qcheck input { margin-top:3px; width:17px; height:17px; accent-color:var(--ciano); flex-shrink:0; }
  .qcheck-txt b { display:block; color:#fff; font-weight:600; margin-bottom:2px; font-size:14px; }
  .qcheck-txt span { color:#93a4c8; font-size:12.5px; line-height:1.45; }
  .grupo-cob { font-size:11px; letter-spacing:.14em; color:var(--dourado); font-weight:700; text-transform:uppercase;
    margin:16px 0 9px; }
  .grupo-cob:first-child { margin-top:0; }
  .caixa-cob { max-height:340px; overflow-y:auto; padding-right:6px; margin-bottom:12px; }
  .caixa-cob::-webkit-scrollbar { width:5px; }
  .caixa-cob::-webkit-scrollbar-thumb { background:rgba(147,164,200,.3); border-radius:10px; }
  .nota { font-size:11.5px; color:#7b8db3; line-height:1.55; margin-top:10px; }
  .fim { text-align:center; padding:20px 0; }
  .fim .ico { font-size:56px; margin-bottom:14px; }
  @media (max-width:520px) { .palco{padding:22px 18px calc(22px + env(safe-area-inset-bottom));} .op{min-width:100%;} .qbolha{max-width:100%;} }
</style>

<script>

  ]},

    { t: 'Gerenciamento de crises', d: 'Despesas de comunicação e assessoria de imprensa para proteger a reputação.' },

  ]}

const LIMITES = ['R$ 1 milhão','R$ 2 a 5 milhões','R$ 5 a 10 milhões','R$ 10 a 20 milhões',
  'R$ 20 a 30 milhões','Acima de R$ 30 milhões','Quero a recomendação do corretor'];

/* ─── ROTEIRO ─── */
const PERGUNTAS = [
  { fala: 'Olá! Sou o assistente da <strong>Retorno Seguros</strong>. Vou levantar os dados que as seguradoras pedem para cotar o <strong>D&O</strong>. São poucas perguntas e você responde no seu ritmo.', campo: null },
  { fala: 'Primeiro, o nome da <strong>empresa</strong>:', campo: 'empresa', tipo: 'texto', ph: 'Razão social ou nome fantasia' },
  { fala: 'Qual foi a <strong>receita líquida</strong> do último exercício?<br><span style="font-size:12.5px;color:#93a4c8;">É o principal dado que define o prêmio. Se não tiver o número exato, uma faixa já ajuda.</span>', campo: 'receitaLiquida', tipo: 'opcoes',
    opcoes: ['Até R$ 10 milhões','R$ 10 a 50 milhões','R$ 50 a 200 milhões','R$ 200 a 500 milhões','R$ 500 milhões a 1 bilhão','Acima de R$ 1 bilhão'] },
  { fala: 'E o <strong>patrimônio líquido</strong> mais recente?', campo: 'patrimonio', tipo: 'opcoes',
    opcoes: ['Até R$ 5 milhões','R$ 5 a 20 milhões','R$ 20 a 100 milhões','Acima de R$ 100 milhões','Não sei informar agora'] },
  { fala: 'Quantas pessoas ocupam <strong>cargos de gestão</strong>? Considere diretores, conselheiros, sócios administradores e gerentes com poder de decisão.', campo: 'nAdmins', tipo: 'texto', ph: 'Ex: 6' },
  { fala: 'Qual o <strong>setor de atuação</strong> da empresa?', campo: 'setor', tipo: 'texto', ph: 'Ex: indústria metalúrgica, transporte, saúde…' },
  { fala: 'A empresa tem <strong>capital aberto</strong> ou pretende abrir nos próximos 12 meses?', campo: 'capitalAberto', tipo: 'opcoes',
    opcoes: ['Não, capital fechado','Sim, capital aberto','Pretendemos abrir'] },
  { fala: 'Tem <strong>operações, filiais ou faturamento no exterior</strong>?<br><span style="font-size:12.5px;color:#93a4c8;">Se houver nos EUA, a seguradora precisa saber — muda bastante a análise.</span>', campo: 'exterior', tipo: 'opcoes',
    opcoes: ['Não, só Brasil','Sim, exceto EUA','Sim, incluindo EUA'] },
  { fala: 'Agora as três perguntas que <strong>toda seguradora faz</strong>. Elas definem a aceitação do risco — por isso é importante responder com precisão.', campo: null },
  { fala: 'Nos <strong>últimos 5 anos</strong>, houve investigação, demanda judicial ou extrajudicial, ou inquérito administrativo contra os administradores atuais ou de gestões anteriores?', campo: 'q1_investigacoes', tipo: 'opcoes',
    opcoes: ['Não','Sim'] },
  { fala: 'Existe algum <strong>fato ou circunstância</strong> que a empresa, seus diretores ou administradores conheçam e que possa vir a gerar uma reclamação por atos de gestão?<br><span style="font-size:12.5px;color:#93a4c8;">Omitir isso pode invalidar a apólice depois. Na dúvida, marque "Sim" e converse com o corretor.</span>', campo: 'q2_fatoConhecido', tipo: 'opcoes',
    opcoes: ['Não','Sim'] },
  { fala: 'Nos <strong>últimos 3 anos</strong>, houve mais de um exercício com prejuízo?', campo: 'q3_prejuizo', tipo: 'opcoes',
    opcoes: ['Não','Sim','Não sei informar'] },
  { fala: 'A empresa passa por <strong>auditoria externa independente</strong> nas demonstrações financeiras?', campo: 'auditoria', tipo: 'opcoes',
    opcoes: ['Sim, auditoria independente','Não','Apenas contabilidade interna'] },
  { fala: 'Qual <strong>limite de indenização</strong> você gostaria de avaliar?<br><span style="font-size:12.5px;color:#93a4c8;">É o valor máximo que a apólice paga no total.</span>', campo: 'limite', tipo: 'opcoes', opcoes: LIMITES },
  { fala: 'Marque as <strong>coberturas</strong> que fazem sentido para vocês. Não precisa decidir tudo agora — o corretor ajusta na conversa.', campo: 'coberturas', tipo: 'coberturas' },
  { fala: 'Por último: qual o <strong>melhor contato</strong> para o corretor retornar com a proposta?', campo: 'contato', tipo: 'contato' }
];

/* ─── MOTOR ─── */
const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));

async function digitar(el, html, vel) {
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buf = '';
  for (const p of partes) {
    if (p.startsWith('<')) { buf += p; el.innerHTML = buf + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      buf += ch; el.innerHTML = buf + '<span class="cursor"></span>';
      await espera('.!?'.includes(ch) ? (vel || 13) * 9 : ',;:'.includes(ch) ? (vel || 13) * 4 : (vel || 13));
    }
  }
  el.innerHTML = buf;
}

/* Máscara de telefone brasileiro: (xx) xxxxx-xxxx, no máximo 11 dígitos */
function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  let v = '';
  if (d.length > 7)      v = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  else if (d.length > 2) v = `(${d.slice(0,2)}) ${d.slice(2)}`;
  else if (d.length > 0) v = `(${d}`;
  el.value = v;
  const av = $('avisoTel');
  if (av) {
    const curto = d.length > 0 && d.length < 10;
    av.classList.toggle('on', curto);
    el.classList.toggle('erro', curto);
  }
}
window.mascaraTel = mascaraTel;

async function render() {
  const q = PERGUNTAS[iQ];
  $('prog').style.width = (iQ / PERGUNTAS.length * 100) + '%';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">Cotação de D&O · ${iQ} de ${PERGUNTAS.length - 1}</div>
      <div id="hist">${historico.map(h => `
        <div class="qbolha">${h.p}</div>${h.r ? `<div class="qbolha qresp">${h.r}</div>` : ''}`).join('')}</div>
      <div class="qbolha" id="fala"></div>
      <div class="zona" id="zona"></div>
    </div>`;
  await digitar($('fala'), q.fala, 12);
  await espera(180);
  const z = $('zona'); z.classList.add('on');

  if (!q.campo) {
    z.innerHTML = `<button class="btn" id="ok">Vamos lá →</button>`;
    $('ok').onclick = () => { historico.push({ p: q.fala, r: null }); iQ++; render(); };
  }
  else if (q.tipo === 'opcoes') {
    z.innerHTML = `<div class="opcoes">${q.opcoes.map((o, k) => `<button class="op" data-k="${k}">${o}</button>`).join('')}</div>`;
    z.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const v = q.opcoes[Number(b.dataset.k)];
      QRESP[q.campo] = v; historico.push({ p: q.fala, r: v });
      salvar(); iQ++; render();
    });
  }
  else if (q.tipo === 'texto') {
    z.innerHTML = `<input class="campo" id="tx" placeholder="${q.ph || ''}" autocomplete="off" style="margin-bottom:12px;">
      <button class="btn" id="ok">Continuar →</button>`;
    const enviar = () => {
      const v = $('tx').value.trim(); if (!v) return $('tx').focus();
      QRESP[q.campo] = v; historico.push({ p: q.fala, r: v });
      salvar(); iQ++; render();
    };
    $('ok').onclick = enviar;
    $('tx').onkeydown = e => { if (e.key === 'Enter') enviar(); };
    if (q.campo === 'empresa' && LINK && LINK.empresaNome) $('tx').value = LINK.empresaNome;
    $('tx').focus();
  }
  else if (q.tipo === 'coberturas') {
    z.innerHTML = `<div class="caixa-cob" id="cx">
        ${COBERTURAS.map((gr, gi) => `
          <div class="grupo-cob">${gr.g}</div>
          ${gr.itens.map((c, ci) => `
            <label class="qcheck" data-g="${gi}" data-c="${ci}">
              <input type="checkbox" ${gi === 0 ? 'checked' : ''}>
              <span class="qcheck-txt"><b>${c.t}</b><span>${c.d}</span></span>
            </label>`).join('')}`).join('')}
      </div>
      <button class="btn" id="ok">Continuar →</button>
      <div class="nota">As duas coberturas básicas vêm marcadas porque formam a estrutura da apólice. As demais são extensões que o corretor ajusta conforme o perfil da empresa.</div>`;
    z.querySelectorAll('.qcheck').forEach(l => {
      if (l.querySelector('input').checked) l.classList.add('on');
      l.onclick = e => {
        if (e.target.tagName !== 'INPUT') { const i = l.querySelector('input'); i.checked = !i.checked; }
        l.classList.toggle('on', l.querySelector('input').checked);
      };
    });
    $('ok').onclick = () => {
      const sel = [...z.querySelectorAll('.qcheck')].filter(l => l.querySelector('input').checked)
        .map(l => COBERTURAS[Number(l.dataset.g)].itens[Number(l.dataset.c)].t);
      QRESP.coberturas = sel;
      historico.push({ p: q.fala, r: `${sel.length} coberturas escolhidas` });
      salvar(); iQ++; render();
    };
  }
  else if (q.tipo === 'contato') {
    z.innerHTML = `
      <label class="lbl">Seu nome</label>
      <input class="campo" id="cNome" style="margin-bottom:12px;" placeholder="Nome completo">
      <label class="lbl">Cargo</label>
      <input class="campo" id="cCargo" style="margin-bottom:12px;" placeholder="Ex: Diretor Financeiro">
      <label class="lbl">E-mail</label>
      <input class="campo" id="cMail" type="email" style="margin-bottom:12px;" placeholder="voce@empresa.com.br">
      <label class="lbl">Telefone / WhatsApp</label>
      <input class="campo" id="cTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
      <div class="aviso" id="avisoTel">Parece faltar algum número — confira, mas você pode continuar assim mesmo.</div>
      <button class="btn btn-ouro" id="ok" style="width:100%; margin-top:16px;">Enviar para o corretor →</button>`;
    $('ok').onclick = async () => {
      const nome = $('cNome').value.trim();
      if (!nome) return $('cNome').focus();
      QRESP.contato = { nome, cargo: $('cCargo').value.trim(), email: $('cMail').value.trim(), telefone: $('cTel').value.trim() };
      $('ok').disabled = true; $('ok').textContent = 'Enviando…';
      await salvar(true);
      renderFim();
    };
  }
  window.scrollTo(0, document.body.scrollHeight);
}

function renderFim() {
  $('prog').style.width = '100%';
  palco.innerHTML = `
    <div class="cena fim">
      <div class="ico">✅</div>
      <div class="titulo" style="font-size:26px;">Recebemos tudo!</div>
      <div style="font-size:15px; line-height:1.65; color:#c3d0ec; margin-top:12px;">
        Suas respostas chegaram ao corretor. Ele vai levar às seguradoras e retornar com a proposta.
        <br><br>Obrigado pelo tempo — proteger quem decide é proteger a empresa inteira.
      </div>
    </div>`;
}

/* ─── PERSISTÊNCIA ─── */
async function salvar(finalizou) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP,
      questionarioCompleto: !!finalizou,
      passo: iQ,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

/* ─── INÍCIO ─── */
document.addEventListener('DOMContentLoaded', async () => {
  try { await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');

  // Sessão ESTÁVEL: com token, a mesma pessoa sempre atualiza o mesmo registro.
  // Sem token, guarda na aba para não criar um novo a cada recarga.
  if (token) SESSAO = 'do_' + token;   // mesmo id da apresentação: um registro só por cliente
  else {
    try { SESSAO = sessionStorage.getItem('sessao_q_do'); } catch (e) {}
    if (!SESSAO) {
      SESSAO = 'q_' + PRODUTO.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      try { sessionStorage.setItem('sessao_q_do', SESSAO); } catch (e) {}
    }
  }

  const base = {
    produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, origem: 'questionario',
    token: token || null, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    userAgent: navigator.userAgent.slice(0, 180)
  };
  if (token) {
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.empresaId = LINK.empresaId || null;
        base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || null;
        base.geradoPorNome = LINK.geradoPorNome || null;
      }
    } catch (e) { console.warn('link', e); }
  }
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }

  render();
});
</script>
</body>
