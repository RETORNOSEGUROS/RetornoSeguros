  .palco { position:relative; z-index:2; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;

  .grupo-cob:first-child { margin-top:0; }

  .nota { font-size:11.5px; color:#7b8db3; line-height:1.55; margin-top:10px; }

};

/* Guarda a resposta em duas camadas: o texto (para você ler) e o código +
   números (para a máquina contar). Serve para qualquer produto futuro. */
function registrarDado(campo, iOpcao, texto) {
  QRESP._dados = QRESP._dados || {};
  const linha = (DIC[campo] || [])[iOpcao];
  const d = { texto, i: iOpcao };
  if (linha) {
    d.cod = linha[0];
    if (linha.length > 1) {
      d.min = linha[1] === undefined ? null : linha[1];
      d.max = linha[2] === undefined ? null : linha[2];
      d.mid = (d.min !== null && d.max !== null) ? (d.min + d.max) / 2 : (d.min !== null ? d.min : d.max);
    }
  }
  QRESP._dados[campo] = d;
}

/* Bloco achatado, pronto para consulta. Fica na raiz do registro (fora de
   'questionario') porque o Firestore filtra melhor campos rasos. */
function montarAnalitico(finalizou) {
  const D = QRESP._dados || {};
  const g = (c, p) => (D[c] && D[c][p] !== undefined) ? D[c][p] : null;
  const sondasCod = {};
  Object.entries(QRESP.sondasCod || {}).forEach(([k, v]) => { sondasCod[k] = v; });
  const remov = [], mant = [];
  COBERTURAS.forEach(gr => {
    const b = (QRESP.cobPorBloco || {})[gr.id] || {};
    (b.removidasCod || []).forEach(x => remov.push(x));
    (b.mantidasCod || []).forEach(x => mant.push(x));
  });
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, completo: !!finalizou, passo: iQ,
    receitaCod: g('receitaLiquida', 'cod'), receitaMid: g('receitaLiquida', 'mid'), receitaMin: g('receitaLiquida', 'min'),
    patrimonioCod: g('patrimonio', 'cod'), patrimonioMid: g('patrimonio', 'mid'),
    ativosCod: g('totalAtivos', 'cod'), ativosMid: g('totalAtivos', 'mid'),
    nAdminsCod: g('nAdmins', 'cod'), nAdminsMid: g('nAdmins', 'mid'),
    limiteCod: g('limite', 'cod'), limiteValor: g('limite', 'min'),
    capitalCod: g('capitalAberto', 'cod'), exteriorCod: g('exterior', 'cod'),
    investigacoesCod: g('q1_investigacoes', 'cod'), fatoConhecidoCod: g('q2_fatoConhecido', 'cod'),
    prejuizoCod: g('q3_prejuizo', 'cod'), auditoriaCod: g('auditoria', 'cod'),
    setorTexto: QRESP.setor || null,
    sondasCod,
    coberturasCod: mant, coberturasRemovidasCod: remov,
    nCoberturas: mant.length, nRemovidas: remov.length
  };
}

/* Mantém a conversa colada no fim, como num chat.
   Durante a digitação usamos rolagem instantânea (acompanha sem tranco);
   nas transições, suave. */
function irAoFim(suave) {
  const alvo = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  const atual = window.scrollY + window.innerHeight;
  if (alvo - atual < 4) return;            // já está no fim: não briga com o usuário
  window.scrollTo({ top: alvo, behavior: suave ? 'smooth' : 'auto' });
}

/* As opções e os botões entram com animação (.55s da cena + .5s da zona), então a
   altura da página só é final depois disso. Reancoramos algumas vezes até estabilizar. */
let _ancoras = [];
function fixarFim(suave) {
  _ancoras.forEach(clearTimeout); _ancoras = [];
  requestAnimationFrame(() => { irAoFim(suave); requestAnimationFrame(() => irAoFim(suave)); });
  [140, 360, 640, 980].forEach(ms => _ancoras.push(setTimeout(() => irAoFim(false), ms)));
}

async function digitar(el, html, vel) {
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buf = '', n = 0;
  for (const p of partes) {
    if (p.startsWith('<')) { buf += p; el.innerHTML = buf + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      buf += ch; el.innerHTML = buf + '<span class="cursor"></span>';
      // a cada poucos caracteres, reancora no fim — o texto cresce e a tela segue
      if ((++n % 6) === 0) irAoFim(false);
      await espera('.!?'.includes(ch) ? (vel || 13) * 9 : ',;:'.includes(ch) ? (vel || 13) * 4 : (vel || 13));
    }
  }
  el.innerHTML = buf;
  irAoFim(false);
}

/* Máscara de telefone brasileiro: (xx) xxxxx-xxxx, no máximo 11 dígitos */
function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  let v = '';
  if (d.length > 7)      v = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  else if (d.length > 2) v = `(${d.slice(0,2)}) ${d.slice(2)}`;
  else if (d.length > 0) v = `(${d}`;
  el.value = v;
  const av = $('avisoTel');
  if (av) {
    const curto = d.length > 0 && d.length < 10;
    av.classList.toggle('on', curto);
    el.classList.toggle('erro', curto);
  }
}

/* Remonta as listas planas a partir dos blocos, na ordem das coberturas.
   Assim reeditar um bloco substitui, em vez de somar de novo. */
function recomporCoberturas() {
  const man = [], rem = [];
  COBERTURAS.forEach(gr => {
    const b = (QRESP.cobPorBloco || {})[gr.id];
    if (!b) return;
    man.push(...(b.mantidas || []));
    rem.push(...(b.removidas || []));
  });
  QRESP.coberturas = man;
  QRESP.coberturasRemovidas = rem;
}

/* ALTERAR RESPOSTA: volta a conversa até aquele ponto. O que vier depois é
   respondido de novo — e, no caso das coberturas, substituído (não somado). */
function voltarPara(hi) {
  const alvo = historico[hi];
  if (!alvo || typeof alvo.i !== 'number') return;
  historico.length = hi;
  iQ = alvo.i;
  // limpa o que dependia das telas seguintes
  PERGUNTAS.slice(iQ).filter(x => x.tipo === 'bloco').map(x => COBERTURAS[x.gi]).forEach(gr => {
    if (QRESP.cobPorBloco) delete QRESP.cobPorBloco[gr.id];
    if (QRESP.sondas) delete QRESP.sondas[gr.g];
    if (QRESP.sondasCod) delete QRESP.sondasCod[gr.id];
  });
  recomporCoberturas();
  window.scrollTo({ top: 0, behavior: 'auto' });
  render();
}
window.voltarPara = voltarPara;

          <button class="op" id="btZero">Começar do zero</button>
        </div>
        <div class="nota">Continuando, nada do que você já respondeu se perde — e você pode alterar qualquer resposta pelo botão “alterar” ao lado dela.</div>
      </div>
    </div>`;
  $('btSeguir').onclick = () => {
    QRESP = Object.assign({ coberturas: [], coberturasRemovidas: [], sondas: {}, sondasCod: {}, cobPorBloco: {}, _dados: {} }, qs);
    (d.historicoQ || []).forEach(h => historico.push(h));
    recomporCoberturas();
    iQ = Math.max(0, Math.min(Number(d.passo) || 0, PERGUNTAS.length - 1));
    render();
  };
  $('btZero').onclick = () => {
    QRESP = { coberturas: [], coberturasRemovidas: [], sondas: {}, sondasCod: {}, cobPorBloco: {}, _dados: {} };
    if (LINK && LINK.empresaNome) QRESP.empresa = LINK.empresaNome;
    historico.length = 0; iQ = 0;
    salvar(); render();
  };
}

/* ─── PERSISTÊNCIA ─── */
function montarRoteiroQ() {
  return PERGUNTAS.map(function (q, idx) {
    if (!q.campo || q.tipo === 'contato') return null;
    var h = historico.find(function (x) { return x.i === idx; });
    var p = (q.fala || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return { k: q.campo, p: p, r: (h && h.r != null && h.r !== '') ? String(h.r) : null };
  }).filter(Boolean);
}

async function salvar(finalizou) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP,
      analitico: montarAnalitico(finalizou),
      questionarioCompleto: !!finalizou,
      passo: iQ, questTotal: PERGUNTAS.length,
      historicoQ: historico, roteiro: montarRoteiroQ(),
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

/* ─── INÍCIO ─── */
const ARQ_VERSAO = '8';
window.ARQ_VERSAO = ARQ_VERSAO;
console.log('%cQuestionário D&O v' + ARQ_VERSAO + '', 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');

document.addEventListener('DOMContentLoaded', async () => {
  /* usa a sessão já existente se houver (ex.: corretor logado no painel) — não a substitui; só entra anônimo se ninguém estiver logado */
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');

  // Sessão ESTÁVEL: com token, a mesma pessoa sempre atualiza o mesmo registro.
  // Sem token, guarda na aba para não criar um novo a cada recarga.
  if (token) SESSAO = 'do_' + token;   // mesmo id da apresentação: um registro só por cliente
  else {
    try { SESSAO = sessionStorage.getItem('sessao_q_do'); } catch (e) {}
    if (!SESSAO) {
      SESSAO = 'q_' + PRODUTO.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      try { sessionStorage.setItem('sessao_q_do', SESSAO); } catch (e) {}
    }
  }

  const base = {
    produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, origem: 'questionario',
    token: token || null, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    userAgent: navigator.userAgent.slice(0, 180)
  };
  if (token) {
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.empresaId = LINK.empresaId || null;
        base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || null;
        base.geradoPorNome = LINK.geradoPorNome || null;
      }
    } catch (e) { console.warn('link', e); }
  }

  // CONTINUIDADE: quem chega da apresentação não recomeça do zero.
  // Se a empresa já é conhecida, a pergunta dela nem aparece — e a abertura
  // reconhece o caminho já percorrido (progresso visível puxa a conclusão).
  if (LINK && LINK.empresaNome) {
    QRESP.empresa = LINK.empresaNome;
    const iEmp = PERGUNTAS.findIndex(q => q.campo === 'empresa');
    if (iEmp >= 0) PERGUNTAS.splice(iEmp, 1);
    PERGUNTAS[0].fala = 'Olá! Sou o assistente da <strong>Retorno Seguros</strong>. Aproveitei o que você já viu na apresentação sobre a <strong>' + LINK.empresaNome + '</strong> — vamos direto ao que falta para cotar o <strong>D&O</strong>. São poucas perguntas e você responde no seu ritmo.';
  }
  let anterior = null;
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    else {
      const d = doc.data() || {};
      // só oferece retomada se houve progresso real e o questionário não foi concluído
      if (!d.questionarioCompleto && (Number(d.passo) || 0) > 0 && d.questionario) anterior = d;
    }
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }

  if (anterior) renderRetomar(anterior);
  else render();
});
</script>
