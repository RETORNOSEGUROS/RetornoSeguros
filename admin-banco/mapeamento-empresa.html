<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Mapeamento de Seguros · Retorno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    [hidden]{ display:none !important; }
    :root{
      /* tema C1 · Marinho & aço */
      --azul1:#0a1628; --azul2:#0d1b33; --azul3:#122448; --brand:#2563eb;
      --ouro1:#2563eb; --ouro2:#0ea5e9;        /* gradiente de ação (antes: dourado) */
      --n1:#93c5fd; --n2:#e0f2fe;               /* nome da empresa */
      --eye:#93c5fd;                            /* rótulos pequenos */
      --branco:#ffffff; --b70:rgba(255,255,255,.72); --b50:rgba(255,255,255,.5); --b40:rgba(255,255,255,.4);
      --vidro:rgba(255,255,255,.08); --vidro-bd:rgba(255,255,255,.16);
      --verde:#38bdf8; --verde-esc:#0c2340;
      --tx-esc:#1e293b;
    }
    body{ font-family:'Plus Jakarta Sans', system-ui, sans-serif; background:#161335; color:var(--branco);
      min-height:100vh; display:flex; align-items:center; justify-content:center; }

    /* moldura de "celular" no desktop; tela cheia no mobile */
    .fone{ width:100%; max-width:460px; height:100vh; max-height:940px; position:relative; overflow:hidden;
      display:flex; flex-direction:column;
      background:#0a1628; }
    @media(min-width:500px){ .fone{ border-radius:30px; height:90vh; box-shadow:0 30px 90px -20px rgba(10,5,40,.7); } }

    .topo{ flex:0 0 auto; padding:16px 20px 8px; display:flex; align-items:center; gap:12px; }
    .voltar{ width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff;
      font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; transition:.15s; }
    .voltar:active{ transform:scale(.9); }
    .barra-wrap{ flex:1; height:6px; background:rgba(255,255,255,.15); border-radius:100px; overflow:hidden; }
    .barra{ height:100%; width:0%; background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); border-radius:100px; transition:width .45s cubic-bezier(.4,0,.2,1); }
    .passo{ font-size:12px; font-weight:800; color:var(--b50); flex:0 0 auto; min-width:34px; text-align:right; }

    .salvo-tag{ position:absolute; top:50px; left:50%; transform:translate(-50%,-6px); z-index:20;
      background:var(--verde); color:var(--verde-esc); font-size:11.5px; font-weight:800; padding:5px 13px; border-radius:100px;
      opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; box-shadow:0 6px 16px -4px rgba(0,0,0,.4); }
    .salvo-tag.on{ opacity:1; transform:translate(-50%,0); }

    .palco{ flex:1; position:relative; overflow:hidden; }
    .cena{ position:absolute; inset:0; padding:8px 26px 26px; display:flex; flex-direction:column; overflow-y:auto;
      transition:transform .38s cubic-bezier(.33,1,.68,1), opacity .3s; }
    .cena > *{ flex-shrink:0; }
    .cena.entra-dir{ transform:translateX(60px); opacity:0; }
    .cena.entra-esq{ transform:translateX(-60px); opacity:0; }
    .cena.sai-esq{ transform:translateX(-60px); opacity:0; }
    .cena.sai-dir{ transform:translateX(60px); opacity:0; }

    /* boas-vindas */
    .bv{ justify-content:center; text-align:center; align-items:center; }
    .bv .selo-topo{ font-size:13px; font-weight:800; color:var(--b70); letter-spacing:.3px; margin-bottom:14px; }
    .bv .empresa{ font-size:30px; font-weight:800; line-height:1.15; margin-bottom:14px;
      background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .bv p{ font-size:15.5px; color:var(--b70); line-height:1.55; max-width:320px; margin:0 auto; }
    .bv .pills{ display:flex; flex-direction:column; gap:8px; margin-top:22px; width:100%; max-width:330px; }
    .pill{ background:rgba(255,255,255,.1); border:1px solid var(--vidro-bd); border-radius:100px; padding:9px 15px;
      font-size:12.5px; font-weight:600; color:var(--b70); }

    /* card de produto */
    .prod-topo{ text-align:center; padding-top:14px; }
    .prod-icone{ width:88px; height:88px; border-radius:26px; display:flex; align-items:center; justify-content:center;
      font-size:44px; margin:0 auto 20px; background:rgba(255,255,255,.1); }
    .prod-nome{ font-size:25px; font-weight:800; letter-spacing:-.4px; margin-bottom:9px; }
    .prod-sub{ font-size:15px; color:var(--b70); line-height:1.5; max-width:320px; margin:0 auto; }
    .hint-pre{ display:inline-block; margin-top:12px; font-size:12px; font-weight:700; color:var(--eye);
      background:rgba(14,165,233,.14); border:1px solid rgba(14,165,233,.3); padding:5px 12px; border-radius:100px; }

    .escolha{ margin-top:auto; padding-top:24px; display:flex; flex-direction:column; gap:11px; }
    .btn-g{ border:none; border-radius:16px; padding:18px; font-size:16.5px; font-weight:800; cursor:pointer; font-family:inherit;
      transition:transform .12s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-g:active{ transform:scale(.97); }
    .btn-sim{ background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); color:#ffffff; box-shadow:0 10px 26px -8px rgba(14,165,233,.5); }
    .btn-nao{ background:rgba(255,255,255,.1); color:#fff; border:1.5px solid var(--vidro-bd); }

    /* campos do "temos" */
    .campos{ margin-top:20px; }
    .campos h3{ font-size:15px; color:var(--branco); font-weight:800; margin-bottom:14px; text-align:center; }
    .rotulo{ font-size:12px; font-weight:700; color:var(--b70); margin:0 0 7px 3px; display:block; text-transform:uppercase; letter-spacing:.3px; }
    .meses{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:14px; }
    .mes{ border:1.5px solid var(--vidro-bd); background:rgba(255,255,255,.06); border-radius:12px; padding:11px 0; font-size:13px; font-weight:700;
      color:var(--b70); cursor:pointer; text-align:center; transition:.12s; font-family:inherit; }
    .mes.on{ border-color:var(--ouro2); background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); color:#ffffff; }
    .mes:active{ transform:scale(.94); }
    .linha-input{ display:flex; gap:9px; margin-bottom:12px; }
    .inp{ width:100%; border:1.5px solid transparent; border-radius:13px; padding:14px 15px; font-size:15px;
      font-family:inherit; color:var(--tx-esc); background:#fff; transition:.15s; }
    .inp::placeholder{ color:#94a3b8; }
    .inp:focus{ outline:none; box-shadow:0 0 0 4px rgba(14,165,233,.35); }
    .anexo-l{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; color:#fff;
      font-size:13.5px; font-weight:700; cursor:pointer; padding:12px; border:1.5px dashed var(--vidro-bd); border-radius:12px; background:rgba(255,255,255,.06); }
    .anexo-chip{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.1); border:1px solid var(--vidro-bd);
      border-radius:8px; padding:6px 11px; font-size:12px; color:#fff; margin:8px 6px 0 0; max-width:100%; }
    .anexo-chip .rm{ cursor:pointer; color:var(--b50); font-weight:800; }
    .continuar{ margin-top:16px; }

    /* resumo */
    .res h2{ font-size:23px; font-weight:800; letter-spacing:-.4px; margin:12px 0 4px; }
    .res .sub{ font-size:14.5px; color:var(--b70); margin-bottom:22px; }
    .grupo-tit{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--b50); margin:18px 0 10px; }
    .item{ display:flex; align-items:center; gap:12px; background:var(--vidro); border:1px solid var(--vidro-bd); border-radius:15px; padding:13px 15px; margin-bottom:9px; }
    .item .ic{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex:0 0 auto; background:rgba(255,255,255,.08); }
    .item .nm{ font-weight:700; font-size:15px; }
    .item .dt{ font-size:12.5px; color:var(--b70); margin-top:1px; }
    .item .ck{ margin-left:auto; color:var(--verde); font-size:20px; }
    .cotar-item{ display:flex; align-items:center; gap:12px; padding:12px 15px; border:1px solid var(--vidro-bd); background:var(--vidro); border-radius:15px; margin-bottom:9px; }
    .tg-btn{ margin-left:auto; border:1.5px solid var(--ouro2); background:transparent; color:var(--ouro2); font-size:12.5px; font-weight:800;
      padding:9px 15px; border-radius:100px; cursor:pointer; font-family:inherit; transition:.15s; white-space:nowrap; flex:0 0 auto; }
    .tg-btn.on{ background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); color:#ffffff; border-color:transparent; }
    .enviar{ margin-top:24px; }

    /* hub pós-envio */
    .hub-top{ text-align:center; padding-top:8px; margin-bottom:6px; }
    .hub-check{ width:64px; height:64px; border-radius:50%; background:rgba(56,189,248,.16); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
    .hub-check svg{ width:36px; height:36px; }
    .hub-check circle{ stroke:var(--verde); stroke-width:3; fill:none; stroke-dasharray:170; stroke-dashoffset:170; animation:traco .6s .1s forwards; }
    .hub-check path{ stroke:var(--verde); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:48; stroke-dashoffset:48; animation:traco .35s .5s forwards; }
    .hub-top h1{ font-size:23px; letter-spacing:-.4px; margin-bottom:8px; }
    .hub-top p{ font-size:14.5px; color:var(--b70); line-height:1.5; max-width:340px; margin:0 auto; }
    .hub-card{ border:1px solid var(--vidro-bd); border-radius:16px; padding:15px 16px; margin-bottom:12px; background:var(--vidro); }
    .hub-head{ display:flex; align-items:center; gap:13px; }
    .hub-head .ic{ width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:27px; flex:0 0 auto; background:rgba(255,255,255,.1); }
    .hub-nomewrap{ min-width:0; }
    .hub-head .nm{ font-weight:800; font-size:18.5px; letter-spacing:-.3px; line-height:1.15; color:#fff; }
    .hub-head .dt{ font-size:12px; color:var(--b70); margin-top:3px; }
    .hub-div{ height:1px; background:var(--vidro-bd); margin:14px 0 0; }
    .hub-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--b50); margin:12px 0 2px; }
    .tag{ display:inline-block; font-size:11px; font-weight:800; padding:2px 9px; border-radius:100px; margin-top:5px; }
    .tag-tem{ background:rgba(56,189,248,.18); color:var(--verde); }
    .tag-cotar{ background:rgba(14,165,233,.18); color:var(--ouro2); }
    .tag-nao{ background:rgba(255,255,255,.1); color:var(--b70); }
    .hub-linha{ display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px; cursor:pointer; background:rgba(255,255,255,.05); border:1px solid var(--vidro-bd); margin-top:8px; transition:transform .12s; }
    .hub-linha:active{ transform:scale(.98); }
    .hub-linha.destaque{ background:rgba(14,165,233,.12); border-color:rgba(14,165,233,.35); }
    .hub-linha .hl-ic{ font-size:19px; flex:0 0 auto; }
    .hl-txt{ flex:1; min-width:0; }
    .hl-t{ font-size:13.5px; font-weight:700; color:#e9e7f7; }
    .hub-linha.destaque .hl-t{ color:var(--ouro2); }
    .hl-s{ font-size:11.5px; color:var(--b70); margin-top:1px; line-height:1.35; }
    .hl-seta{ font-size:22px; color:var(--b50); font-weight:700; flex:0 0 auto; }

    /* sucesso */
    .ok{ justify-content:center; align-items:center; text-align:center; }
    .check{ width:96px; height:96px; border-radius:50%; background:rgba(56,189,248,.16); display:flex; align-items:center; justify-content:center;
      margin-bottom:24px; animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
    .check svg{ width:52px; height:52px; }
    .check circle{ stroke:var(--verde); stroke-width:3; fill:none; stroke-dasharray:170; stroke-dashoffset:170; animation:traco .6s .1s forwards; }
    .check path{ stroke:var(--verde); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:48; stroke-dashoffset:48; animation:traco .35s .5s forwards; }
    @keyframes traco{ to{ stroke-dashoffset:0; } }
    @keyframes pop{ 0%{ transform:scale(.5); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
    .ok h1{ font-size:25px; margin-bottom:10px; letter-spacing:-.4px; }
    .ok p{ font-size:15px; color:var(--b70); line-height:1.55; max-width:300px; }

    .rodape{ flex:0 0 auto; text-align:center; padding:10px; font-size:11px; color:var(--b40); }

    /* loading + erro */
    .loading-overlay{ position:fixed; inset:0; background:#1e1b4b; display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:18px; z-index:100; color:var(--b70); font-size:14px; }
    .spinner{ width:44px; height:44px; border:4px solid rgba(255,255,255,.15); border-top-color:var(--ouro2); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .erro-container{ max-width:420px; margin:auto; text-align:center; background:rgba(255,255,255,.06);
      border:1px solid var(--vidro-bd); border-radius:20px; padding:38px 30px; }
    .erro-container h2{ margin-bottom:10px; font-size:20px; }
    .erro-container p{ color:var(--b70); font-size:14px; line-height:1.55; }

    /* ===== TELA ÚNICA (v3) ===== */
    .cena.t1{ padding-top:14px; }
    .t1-top{ text-align:center; margin-bottom:6px; }
    .t1-h1{ font-size:24px; font-weight:800; letter-spacing:-.4px; margin:2px 0 8px; }
    .ouro{ background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .t1-sub{ font-size:13.5px; color:var(--b70); line-height:1.5; margin:0 auto 6px; max-width:340px; }
    .t1-sub b{ color:#fff; }
    .bloco{ margin-top:16px; }
    .bloco-h{ display:flex; align-items:baseline; gap:8px; margin:0 0 8px 2px; }
    .bloco-n{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--ouro1); }
    .bloco-s{ font-size:11.5px; color:var(--b50); }
    .prod{ background:var(--vidro); border:1px solid var(--vidro-bd); border-radius:16px; padding:12px 13px 11px; margin-bottom:9px; transition:.15s; }
    .prod.tem{ border-color:rgba(56,189,248,.5); background:rgba(56,189,248,.09); }
    .prod.naotem{ opacity:.72; }
    .prod.bloq{ opacity:.6; }
    .prod-cab{ display:flex; align-items:center; gap:10px; }
    .prod-ico{ width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; }
    .prod-txt{ min-width:0; }
    .pn{ font-weight:800; font-size:17px; line-height:1.15; letter-spacing:-.2px; color:#fff; }
    .pd{ font-size:12px; color:var(--b70); line-height:1.35; margin-top:3px; }
    .prod-ico{ width:42px; height:42px; font-size:23px; }
    .ci-ano{ float:right; font-weight:800; color:var(--ouro1); }
    .grupo-band{ display:flex; align-items:center; gap:12px; margin:22px 0 12px; padding:12px 14px; border-radius:14px; border:1px solid var(--vidro-bd); }
    .grupo-band.tem{ background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.4); }
    .grupo-band.conhecer{ background:rgba(14,165,233,.12); border-color:rgba(14,165,233,.4); }
    .gb-ic{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; flex:0 0 auto; }
    .grupo-band.tem .gb-ic{ background:var(--verde); color:var(--verde-esc); }
    .grupo-band.conhecer .gb-ic{ background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); color:#ffffff; }
    .gb-t{ font-size:16px; font-weight:800; letter-spacing:-.2px; }
    .grupo-band.tem .gb-t{ color:var(--verde); }
    .grupo-band.conhecer .gb-t{ color:var(--ouro1); }
    .gb-s{ font-size:11.5px; color:var(--b70); line-height:1.35; margin-top:1px; }
    .hub-desc{ font-size:12px; color:var(--b70); line-height:1.35; margin-top:5px; }
    .bloq-tag{ font-size:11.5px; font-weight:800; color:var(--verde); margin-top:8px; }
    .hint-pre{ font-size:11.5px; color:var(--ouro1); margin:8px 0 -2px; }
    .pills{ display:flex; gap:7px; margin-top:10px; }
    .pill{ flex:1; border:1.5px solid var(--vidro-bd); background:rgba(255,255,255,.06); color:#fff; border-radius:11px; padding:10px 6px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; transition:.12s; }
    .pill:active{ transform:scale(.97); }
    .pill.sim.on{ background:var(--verde); color:var(--verde-esc); border-color:var(--verde); }
    .pill.nao.on{ background:#fff; color:var(--tx-esc); border-color:#fff; }
    .campos-inl{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--vidro-bd); }
    .ci-l{ font-size:12.5px; font-weight:700; color:var(--b70); margin-bottom:8px; }
    .campos-inl .meses{ grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:10px; }
    .campos-inl .mes{ padding:9px 0; font-size:12px; border-radius:9px; }
    .ci-grid{ display:grid; grid-template-columns:110px 1fr; gap:8px; margin-bottom:8px; }
    .campos-inl .inp{ padding:11px 12px; font-size:14px; border-radius:11px; }
    .colab-box{ background:var(--vidro); border:1px solid var(--vidro-bd); border-radius:16px; padding:14px 13px; }
    .colab-box .rotulo{ margin-bottom:8px; }
    .t1-envio{ position:sticky; bottom:-26px; margin:16px -26px -26px; padding:12px 26px 22px; text-align:center;
      background:linear-gradient(180deg, rgba(49,46,129,0), rgba(49,46,129,.97) 35%); }
    .t1-falta{ font-size:12.5px; font-weight:700; color:var(--b70); margin-bottom:8px; }
    .t1-nota{ font-size:11.5px; color:var(--b50); margin-top:8px; }
    .btn-g:disabled{ opacity:.45; cursor:default; transform:none; }
    .hub-cotar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid var(--vidro-bd); font-size:12.5px; color:var(--b70); }
    .tg-btn:disabled{ opacity:.7; cursor:default; }
    .anexo-lista{ margin-top:6px; }

    /* ===== LINK PADRÃO (sem token) — identificação da empresa ===== */
    .ident-box{ background:rgba(37,99,235,.10); border:1px solid rgba(147,197,253,.35); border-radius:16px; padding:14px 13px; margin-top:14px; }
    .ident-box .rotulo{ margin-bottom:8px; }
    .ident-box .inp{ margin-bottom:8px; }
    .ident-box .inp.inv{ box-shadow:0 0 0 3px rgba(248,113,113,.55); }
    .ident-err{ font-size:12px; color:#fca5a5; font-weight:700; margin:-2px 0 8px 3px; min-height:14px; }
    .ident-ok{ font-size:12px; color:var(--verde); font-weight:700; margin:-2px 0 8px 3px; }
    .ident-nota{ font-size:11.5px; color:var(--b50); line-height:1.4; margin-top:2px; }
    .fim-lista{ width:100%; max-width:340px; margin-top:18px; text-align:left; }
    .fim-lista .cotar-item{ padding:10px 13px; }
    .fim-lista .cotar-item .nm{ font-weight:700; font-size:14px; }
    .fim-lista .cotar-item .ic{ font-size:20px; }
    /* tela final do link padrão: um card por seguro, com "conhecer mais" e "quero cotar" */
    .fimp-top{ text-align:center; padding-top:14px; margin-bottom:16px; }
    .fimp-top .check{ margin:0 auto 16px; }
    .fimp-top h1{ font-size:24px; letter-spacing:-.5px; margin-bottom:9px; }
    .fimp-top p{ font-size:14.5px; color:var(--b70); line-height:1.5; max-width:330px; margin:0 auto; }
    .fp-card{ background:var(--vidro); border:1px solid var(--vidro-bd); border-radius:16px; padding:13px 14px; margin-bottom:10px; }
    .fp-cab{ display:flex; gap:11px; align-items:center; }

<script>
  /* ============ FIREBASE ============ */

  let PONTOS_CFG = { mapear_produto: 2, mapear_extra_link: 1 };
  const getPonto = ch => (PONTOS_CFG && PONTOS_CFG[ch] != null) ? Number(PONTOS_CFG[ch]) : 0;

  let PRODUTOS = [
    { id: 'frota',        nome: 'Frota / Auto',         icon: '🚗' },
    { id: 'empresarial',  nome: 'Empresarial',          icon: '🏢' },
    { id: 'saude-socios', nome: 'Saúde — Sócios',       icon: '👥' },
    { id: 'saude-colab',  nome: 'Saúde — Colaboradores', icon: '👨‍👩‍👧' },
    { id: 'vida-grupo',   nome: 'Vida em Grupo',        icon: '🛡️' },
    { id: 'vida-socios',  nome: 'Vida — Sócios',        icon: '💼' },
    { id: 'dental',       nome: 'Dental',               icon: '🦷' }
  ];
  // frases em linguagem simples por produto (fallback quando o ramo não traz descrição p/ cliente)
  const SUBS = {
    'frota':'Os carros e caminhões que rodam no nome da empresa.',
    'empresarial':'O prédio, o estoque e os equipamentos — contra incêndio, roubo e danos.',
    'transporte':'As mercadorias que a empresa envia ou transporta pelas estradas.',
    'saude-colab':'Convênio médico para os funcionários.',
    'saude-socios':'Convênio médico para os sócios.',
    'vida-grupo':'Proteção para a equipe em caso de acidente ou falecimento.',
    'vida-socios':'Seguro de vida para os donos do negócio.',
    'dental':'Convênio odontológico para o time.'
  };

  // frase-resumo p/ qualquer produto (quando o ramo não traz descCliente nem está em SUBS)
  function descDe(p){
    if (p.desc && p.desc.length) return p.desc;
    if (SUBS[p.id]) return SUBS[p.id];
    var s = (p.id + ' ' + (p.nome || '')).toLowerCase();
    if (/s[óo]cio/.test(s) && /previd/.test(s)) return 'Aposentadoria dos donos com vantagem no imposto de renda.';
    if (/s[óo]cio/.test(s) && /vida/.test(s)) return 'Seguro de vida para os donos do negócio.';
    if (/s[óo]cio/.test(s) && /sa[úu]de/.test(s)) return 'Convênio médico para os sócios.';
    if (/previd/.test(s)) return 'Plano de aposentadoria para a equipe — benefício que retém talentos.';
    if (/maquin|máquin|equipament/.test(s)) return 'Máquinas da produção protegidas contra quebra, acidente e roubo.';
    if (/d\s*&\s*o|diretor|^do\b/.test(s) || p.id === 'do') return 'Protege o patrimônio pessoal dos sócios e gestores por decisões da empresa.';
    if (/resp.*civil|responsabilidade|\brc\b/.test(s)) return 'Cobre danos que a empresa cause a terceiros — clientes, vizinhos, fornecedores.';
    if (/garantia|fian/.test(s)) return 'Garante contratos e licitações sem travar o caixa da empresa.';
    if (/frota|auto/.test(s)) return 'Os carros e caminhões que rodam no nome da empresa.';
    if (/empresarial|patrim/.test(s)) return 'O prédio, o estoque e os equipamentos — contra incêndio, roubo e danos.';
    if (/transporte|carga/.test(s)) return 'As mercadorias que a empresa envia ou transporta pelas estradas.';
    if (/dental|odonto/.test(s)) return 'Convênio odontológico para o time.';
    if (/vida/.test(s)) return 'Proteção para a equipe em caso de acidente ou falecimento.';
    if (/sa[úu]de/.test(s)) return 'Convênio médico para os funcionários.';
    return 'Proteção sob medida para a sua empresa — veja a apresentação.';
  }

  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MESES_AB = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // Catálogo de apresentações/questionários por produto (mesmo do painel).
  // O real vem de mb_config/apresentacoes; este é o fallback.
  let APRESENTACOES = [
    { id:'do', nome:'D&O', arq:'ApresentacaoDO.html', arqQ:'QuestionarioDO.html' },
    { id:'garantia', nome:'Seguro Garantia', arq:'ApresentacaoGarantia.html', arqQ:null },
    { id:'dental', nome:'Dental', arq:'ApresentacaoDental.html', arqQ:'QuestionarioDental.html' },
    { id:'vida_socios', nome:'Vida Sócios', arq:'ApresentacaoVidaSocios.html', arqQ:'QuestionarioVidaSocios.html' },
    { id:'empresarial', nome:'Empresarial', arq:'CheckupEmpresarial.html', arqQ:'QuestionarioEmpresarial.html' },
    { id:'saude_socios', nome:'Saúde Sócios', arq:'ApresentacaoSaudeSocios.html', arqQ:'QuestionarioSaudeSocios.html' },
    { id:'transporte', nome:'Transporte de Cargas', arq:'ApresentacaoTransporte.html', arqQ:'QuestionarioTransporte.html' }
  ];
  // normaliza id/nome para casar ramo × catálogo (trata - _ e acentos)
  function _norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
  function catDoProduto(p){
    if (!p) return null;
    var rid = _norm(p.id), rnome = _norm((p.nome||'').split('—')[0].split('-')[0]);
    // 1) por id  2) por primeiro termo do nome
    return APRESENTACOES.find(a => _norm(a.id) === rid)
        || APRESENTACOES.find(a => _norm(a.id) === rnome || _norm((a.nome||'').split('—')[0]) === rnome)
        || null;
  }

  let LINK = null, LINK_ID = null, EMPRESA = null;
  let respostas = {};                 // { [prodId]: { tem, vencimentoMes, vencimentoAno, seguradora, valorAnual, observacoes, interesse, preMarcadoNao } }
  let dadosEmpresa = { funcionarios: '' };

  /* ============ LINK PADRÃO (sem token) ============
     mapeamento-empresa.html?padrao=1  →  qualquer empresa responde; pede CNPJ (obrigatório),
     nome e celular do contato (opcionais). Grava em mb_questionario_padrao e NÃO toca em
     empresas/mb_produtos nem pontua ninguém — o corretor identifica e vincula no painel. */
  let MODO_PADRAO = false;
  let PADRAO_DOC_ID = null;           // id do doc gravado (para marcar "quero cotar" depois)
  let ident = { cnpj: '', nome: '', celular: '' };
  const PADRAO_LS = 'map_padrao_v1';
  const PADRAO_LS_ENV = 'map_padrao_enviado_v1';

  function soDigitos(s){ return String(s || '').replace(/\D/g, ''); }
  function fmtCNPJ(d){
    d = soDigitos(d).slice(0, 14);
    return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
            .replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
  }
  function fmtCel(d){
    d = soDigitos(d).slice(0, 11);
    if (d.length <= 10) return d.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d)/, '$1-$2');
    return d.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
  }
  // validação oficial (dígitos verificadores) — rejeita 00000000000000 etc.
  function cnpjValido(v){
    const d = soDigitos(v);
    if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
    const calc = (base, pesos) => { let s = 0; for (let i = 0; i < pesos.length; i++) s += Number(base[i]) * pesos[i]; const r = s % 11; return r < 2 ? 0 : 11 - r; };
    const p1 = [5,4,3,2,9,8,7,6,5,4,3,2], p2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];
    return calc(d, p1) === Number(d[12]) && calc(d, p2) === Number(d[13]);
  }
  function mascCNPJ(el){ el.value = fmtCNPJ(el.value); ident.cnpj = el.value; validarIdent(false); salvarRascunho(); }
  function mascCel(el){ el.value = fmtCel(el.value); ident.celular = el.value; salvarRascunho(); }
  window.mascCNPJ = mascCNPJ; window.mascCel = mascCel;
  // devolve true se ok; com `forte` mostra o erro mesmo com campo vazio (usado no envio)
  function validarIdent(forte){
    const el = document.getElementById('idCnpj'), err = document.getElementById('idCnpjErr'), ok = document.getElementById('idCnpjOk');
    if (!el) return false;
    const d = soDigitos(el.value);
    let msg = '';
    if (!d.length) msg = forte ? 'Informe o CNPJ da empresa para enviar.' : '';
    else if (d.length < 14) msg = forte ? 'CNPJ incompleto — são 14 números.' : '';
    else if (!cnpjValido(d)) msg = 'Esse CNPJ não confere — revise os números.';
    const valido = d.length === 14 && cnpjValido(d);
    el.classList.toggle('inv', !!msg);
    if (err) err.textContent = msg;
    if (ok) ok.style.display = valido ? '' : 'none';
    return valido;
  }
  function blocoIdent(){
    return '<div class="bloco ident-box">'+
      '<label class="rotulo">🏢 Sobre a empresa</label>'+
      '<input class="inp" id="idCnpj" inputmode="numeric" placeholder="CNPJ da empresa (obrigatório)" maxlength="18" value="'+_esc(ident.cnpj || '')+'" oninput="mascCNPJ(this)" onblur="validarIdent(false)">'+
      '<div class="ident-err" id="idCnpjErr"></div>'+
      '<div class="ident-ok" id="idCnpjOk" style="display:none;">✓ CNPJ confere</div>'+
      '<input class="inp" id="idNome" placeholder="Seu nome (opcional)" maxlength="80" value="'+_esc(ident.nome || '')+'" oninput="ident.nome=this.value; salvarRascunho();">'+
      '<input class="inp" id="idCel" inputmode="tel" placeholder="Seu celular / WhatsApp (opcional)" maxlength="16" value="'+_esc(ident.celular || '')+'" oninput="mascCel(this)">'+
      '<div class="ident-nota">Usamos o CNPJ só para identificar a empresa no nosso estudo. Nada é publicado.</div>'+
    '</div>';
  }
  async function bootPadrao(){
    MODO_PADRAO = true;
    document.title = 'Mapeamento de Seguros · Retorno';
    try { await firebase.auth().signInAnonymously(); } catch (e) { console.warn('auth anônima falhou:', e); }
    try {
      const ramosSnap = await db.collection('mb_ramos').get();
      if (!ramosSnap.empty) {
        const arr = [];
        ramosSnap.forEach(d => { const r = d.data(); if (r.ativo !== false && !r.somenteOp) arr.push({ id: d.id, nome: r.nome, icon: r.icon || '📦', ordem: r.ordem || 0, desc: (r.descCliente || '').trim() }); });
        if (arr.length) { arr.sort((a, b) => (a.ordem || 0) - (b.ordem || 0)); PRODUTOS = arr; }
      }
    } catch (e) { console.warn('ramos dinâmicos falhou, usando padrão', e); }
    // um envio recente neste aparelho → mostra o "obrigado" de novo em vez de um formulário em branco
    try {
      const env = JSON.parse(localStorage.getItem(PADRAO_LS_ENV) || 'null');
      if (env && env.id && env.em && (Date.now() - env.em) < 30 * 86400000) {
        PADRAO_DOC_ID = env.id; respostas = env.respostas || {}; ident = env.ident || ident;
        return telaFimPadrao(false, env.interesse || []);
      }
    } catch (e) {}
    restaurarRascunho();
    tela1();

  function novoPadrao(){

      LINK = snap.docs[0].data();

      const expData = LINK.expiraEm && LINK.expiraEm.toDate ? LINK.expiraEm.toDate() : (LINK.expiraEm ? new Date(LINK.expiraEm) : null);
      if (LINK.expirado === true || (expData && expData < new Date())) {

      PROD_BLOQUEADOS = new Set(LINK.produtosBloqueados || []);
      PROD_PRE_NAO   = new Set(LINK.produtosNaoTem || []);
      PROD_PERMITIDOS = new Set(LINK.produtosPermitidos || []);

      const empSnap = await db.collection('empresas').doc(LINK.empresaId).get();
      if (!empSnap.exists) return mostrarErro();

      // Ramos ativos do sistema (os "só por OP" não entram no questionário do cliente)
      try {

        if (!ramosSnap.empty) {

        }
      } catch (e) { console.warn('ramos dinâmicos falhou, usando padrão', e); }

      // Empresa SEM sócios confirmado: seguros de sócios não aparecem (v237)
      if (EMPRESA.semSociosConfirmado === true && !((EMPRESA.socios || []).length)) {
        PRODUTOS = PRODUTOS.filter(p => !(p.id === 'vida-socios' || p.id === 'saude-socios' || /s[óo]cios?/i.test(p.nome || '')));
      }

      try {
        const cfgSnap = await db.collection('mb_config').doc('pontos').get();
        if (cfgSnap.exists) PONTOS_CFG = { ...PONTOS_CFG, ...cfgSnap.data() };
      } catch (e) { console.warn('pontos dinâmicos falhou, usando padrão', e); }

      // Catálogo de apresentações/questionários por produto (mesmo do painel)
      try {

      } catch (e) { console.warn('catálogo apresentações falhou, usando padrão', e); }

      // Já mapeados aparecem BLOQUEADOS (só anexo). Pré-marcados "não" entram como "Não temos" (podem mudar).
      FLUXO = PRODUTOS.filter(p => !PROD_BLOQUEADOS.has(p.id));

      if (JA_RESPONDIDO) {
        if (LINK.respostas && typeof LINK.respostas === 'object') respostas = LINK.respostas;

        return tela2(false);

  function _rascunhoKey(){ return MODO_PADRAO ? PADRAO_LS : ('map_v2_' + LINK_ID); }
  function salvarRascunho(){ try { localStorage.setItem(_rascunhoKey(), JSON.stringify({ respostas, dadosEmpresa, ident: MODO_PADRAO ? ident : undefined })); } catch (e) {} }
  function restaurarRascunho(){
    try {
      const raw = localStorage.getItem(_rascunhoKey());
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d && d.respostas) { Object.keys(d.respostas).forEach(k => { respostas[k] = Object.assign({}, respostas[k], d.respostas[k]); }); }
      if (d && d.dadosEmpresa && d.dadosEmpresa.funcionarios) dadosEmpresa.funcionarios = d.dadosEmpresa.funcionarios;
      if (MODO_PADRAO && d && d.ident) ident = Object.assign({}, ident, d.ident);
    } catch (e) {}
  }

  /* ============ ANEXOS (PDF/foto/Word/Excel) — preservado ============ */
  const ANEXOS = {};
  const FALHAS_ANEXO = [];
  function tipoAnexoOk(f) {
    const t = f.type || '';
    if (t === 'application/pdf' || t.startsWith('image/')) return true;
    if (t === 'application/msword' || t === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') return true;
    if (t === 'application/vnd.ms-excel' || t === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') return true;
    return /\.(pdf|doc|docx|xls|xlsx|png|jpe?g|heic|webp)$/i.test(f.name || '');
  }
  function _mimeArquivo(f) {
    if (f.type) return f.type;
    const ext = ((f.name || '').split('.').pop() || '').toLowerCase();
    return ({ pdf:'application/pdf', doc:'application/msword',
      docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      xls:'application/vnd.ms-excel', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', heic:'image/heic' })[ext] || 'application/octet-stream';
  }
  function anexoSel(prodId, input) {
    const files = [...(input.files || [])];
    ANEXOS[prodId] = ANEXOS[prodId] || [];
    for (const f of files) {
      if (ANEXOS[prodId].length >= 3) { alert('Máximo de 3 anexos por seguro.'); break; }
      if (f.size > 15 * 1024 * 1024) { alert('"' + f.name + '" passa de 15 MB — envie um arquivo menor.'); continue; }
      if (!tipoAnexoOk(f)) { alert('"' + f.name + '" não é um tipo aceito — envie PDF, foto, Word ou Excel.'); continue; }
      if (ANEXOS[prodId].some(x => x.name === f.name && x.size === f.size)) continue; // já anexado nesta sessão
      ANEXOS[prodId].push(f);
    }
    input.value = '';
    renderAnexos(prodId);
    flashSalvo();
  }
  window.anexoSel = anexoSel;
  function renderAnexos(prodId) {
    const box = document.getElementById('anexoLista-' + prodId);
    if (!box) return;
    box.innerHTML = (ANEXOS[prodId] || []).map((f, i) => '<span class="anexo-chip">📄 <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">' + String(f.name).replace(/</g,'&lt;') + '</span> <span class="rm" onclick="anexoRm(\'' + prodId + '\',' + i + ')">✕</span></span>').join('');
  }
  function anexoRm(prodId, i) { (ANEXOS[prodId] || []).splice(i, 1); renderAnexos(prodId); }
  window.anexoRm = anexoRm;
  const _comTimeout = (promessa, ms) => Promise.race([ promessa, new Promise((_, rej) => setTimeout(() => rej(new Error('tempo esgotado no envio do arquivo')), ms)) ]);
  async function uploadAnexos(prodId) {
    const files = ANEXOS[prodId] || [];
    const out = [];
    for (const f of files) {
      try {
        const path = 'mb_apolices/' + LINK.empresaId + '/' + prodId + '/' + Date.now() + '_' + f.name.replace(/[^a-zA-Z0-9_.\-]/g, '_');
        const snap = await _comTimeout(firebase.storage().ref(path).put(f, { contentType: _mimeArquivo(f) }), 120000);
        const url = await _comTimeout(snap.ref.getDownloadURL(), 20000);
        out.push({ nome: f.name, url, tamanho: f.size, em: new Date().toISOString(), via: 'link_mapeamento' });
      } catch (e) { console.warn('anexo falhou', f.name, e); FALHAS_ANEXO.push(f.name); }
    }
    return out;
  }
  // Junta os anexos novos aos já existentes SEM duplicar por nome (idempotente:
  // reenviar "apolice.pdf" substitui, não acumula). Devolve o array final p/ gravar.
  async function anexosMesclados(empresaId, prodId, novos) {
    let existentes = [];
    try {
      const cur = await db.collection('empresas').doc(empresaId).collection('mb_produtos').doc(prodId).get();
      if (cur.exists && Array.isArray(cur.data().apoliceAnexos)) existentes = cur.data().apoliceAnexos;
    } catch (e) {}
    const nomesNovos = new Set(novos.map(a => (a.nome || '').toLowerCase()));
    const mantidos = existentes.filter(a => a && a.url && !nomesNovos.has((a.nome || '').toLowerCase()));
    return mantidos.concat(novos);
  }

  function mascaraMoeda(input) {
    let v = input.value.replace(/\D/g, '');
    if (!v) { input.value = ''; return; }
    v = (parseInt(v) / 100).toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+,)/g, '$1.');
    input.value = 'R$ ' + v;

  /* ============ TRANSIÇÃO ENTRE TELAS (preservado) ============ */
  function trocar(html, dir, extra){
    var atual = palco.querySelector('.cena');
    // re-render da MESMA tela (ex.: tela 2 após enviar): troca na hora, sem deixar a antiga no DOM (evita ids duplicados)
    if (atual && extra && atual.classList.contains(extra)) { atual.remove(); atual = null; }
    var nova = document.createElement('div');
    nova.className = 'cena ' + (extra ? extra + ' ' : '') + (dir === 'tras' ? 'entra-esq' : 'entra-dir');
    nova.innerHTML = html;
    palco.appendChild(nova);
    requestAnimationFrame(function(){
      if (atual){ atual.classList.add(dir === 'tras' ? 'sai-dir' : 'sai-esq'); }
      requestAnimationFrame(function(){ nova.classList.remove('entra-dir','entra-esq'); });

    trocar(html, 'frente', 't1');
    setTimeout(function(){
      PRODUTOS.forEach(function(p){ if (!PROD_BLOQUEADOS.has(p.id) && respostas[p.id] && respostas[p.id].tem === 'sim') abrirCampos(p.id); });
      if (MODO_PADRAO && ident.cnpj) validarIdent(false);
      atualizarFalta();
    }, 30);
  }

  /* ============ ENVIO — LINK PADRÃO (grava só em mb_questionario_padrao) ============ */
  async function submeterPadrao(){
    const btn = document.getElementById('btnEnviar');
    if (!validarIdent(true)) {
      const el = document.getElementById('idCnpj'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus(); }
      return;
    }
    if (btn){ btn.disabled = true; btn.textContent = '⏳ Enviando…'; }
    try {
      const numFunc = parseInt(dadosEmpresa.funcionarios) || null;
      const resp = {};
      const nomes = {};
      PRODUTOS.forEach(function(p){
        const r = respostas[p.id];
        if (!r || !r.tem) return;
        nomes[p.id] = { nome: p.nome, icon: p.icon || '📦' };
        resp[p.id] = r.tem === 'sim'
          ? { tem: true, vencimentoMes: r.vencimentoMes || null, vencimentoAno: r.vencimentoAno || null,
              seguradora: r.seguradora || null, valorAnual: r.valorAnual || null }
          : { tem: false };
      });
      const cnpjDig = soDigitos(ident.cnpj);
      const doc = {
        cnpj: cnpjDig, cnpjFmt: fmtCNPJ(cnpjDig),
        nomeContato: (ident.nome || '').trim() || null,
        celular: soDigitos(ident.celular) || null, celularFmt: (ident.celular || '').trim() || null,
        numFuncionarios: numFunc,
        respostas: resp, produtos: nomes,
        interesseCotar: [],
        status: 'novo',                 // novo | vinculado | nao_cliente | descartado
        vinculadoEmpresaId: null, vinculadoEmpresaNome: null,
        origem: 'link_padrao', versaoForm: 15,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      };
      const ref = await db.collection('mb_questionario_padrao').add(doc);
      PADRAO_DOC_ID = ref.id;
      try { localStorage.removeItem(PADRAO_LS); localStorage.setItem(PADRAO_LS_ENV, JSON.stringify({ id: ref.id, em: Date.now(), respostas: JSON.parse(JSON.stringify(respostas)), ident: ident, interesse: [] })); } catch (e) {}
      telaFimPadrao(true, []);
    } catch (e) {
      console.error(e);
      alert('Erro ao enviar: ' + e.message);
      if (btn){ btn.disabled = false; btn.textContent = 'Enviar'; }
    }
  }
  window.submeterPadrao = submeterPadrao;

  // Tela final do link padrão: agradece e, para cada seguro que a empresa NÃO tem,
  // oferece "Conhecer mais" (apresentação) e "Quero cotar" (questionário do produto).
  let PADRAO_INTERESSE = new Set();
  function telaFimPadrao(recem, interesseSalvo){
    document.getElementById('topo').hidden = true;
    var _s = document.getElementById('salvoTag'); if (_s) _s.classList.remove('on');
    PADRAO_INTERESSE = new Set(interesseSalvo || []);
    var naoTem = PRODUTOS.filter(function(p){ return respostas[p.id] && respostas[p.id].tem === 'nao'; });
    var html = '<div class="fimp-top">'+
      '<div class="check"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="27"/><path d="M18 31 l8 8 l16-18"/></svg></div>'+
      '<h1>'+(recem ? 'Recebemos, obrigado!' : 'Já recebemos o seu mapeamento')+'</h1>'+
      '<p>Nossa equipe vai analisar e entrar em contato'+(ident.nome ? ', '+_esc(String(ident.nome).split(' ')[0]) : '')+'. '+
      (ident.celular ? 'Falamos pelo WhatsApp <b>'+_esc(ident.celular)+'</b>.' : 'Se quiser, deixe um telefone com quem te enviou o link.')+'</p></div>';
    if (naoTem.length){
      html += '<div class="grupo-band conhecer"><div class="gb-ic">✨</div><div>'+
        '<div class="gb-t">Seguros para conhecer</div>'+
        '<div class="gb-s">veja o que cada um faz pela empresa — ou já peça a cotação</div></div></div>'+
        naoTem.map(_cardFimPadrao).join('')+
        '<div class="t1-nota" id="padraoMsg" style="text-align:center;">'+
        (PADRAO_INTERESSE.size ? '✓ Anotado — vamos cotar '+PADRAO_INTERESSE.size+(PADRAO_INTERESSE.size === 1 ? ' seguro' : ' seguros') : '')+'</div>';
    }
    html += '<div class="t1-nota" style="margin-top:20px; text-align:center;">Pode fechar a página — seu mapeamento já foi entregue.</div>';
    trocar(html, 'frente', 'fimp');
  }
  function _cardFimPadrao(p){
    var cat = catDoProduto(p);
    var pedido = PADRAO_INTERESSE.has(p.id);
    var bts = '';
    if (cat && cat.arq){
      bts += '<button class="fp-btn" onclick="abrirDestino(\''+p.id+'\',\'apresentacao\')">📖 Conhecer mais</button>';
    }
    bts += '<button class="fp-btn'+(pedido ? ' feito' : ' destaque')+'" id="tg-'+p.id+'" onclick="quereCotarPadrao(\''+p.id+'\')">'+
           (pedido ? '✓ Cotação pedida' : '✍️ Quero cotar')+'</button>';
    return '<div class="fp-card" id="fp-'+p.id+'">'+
      '<div class="fp-cab"><div class="fp-ic prod-ico">'+iconeDe(p)+'</div>'+
        '<div><div class="fp-nm">'+_esc(p.nome)+'</div><div class="fp-ds">'+_esc(descDe(p))+'</div></div></div>'+
      '<div class="fp-bts">'+bts+'</div></div>';
  }
  // "Quero cotar": abre o questionário do produto (quando existe) e anota o interesse.
  // O window.open acontece ANTES de qualquer await — senão o navegador bloqueia o pop-up.
  async function quereCotarPadrao(id){
    var p = PRODUTOS.find(function(x){ return x.id === id; });
    var cat = catDoProduto(p);
    if (cat && cat.arqQ) abrirDestino(id, 'questionario');
    PADRAO_INTERESSE.add(id);
    var b = document.getElementById('tg-'+id);
    if (b){ b.classList.remove('destaque'); b.classList.add('feito'); b.textContent = '✓ Cotação pedida'; }
    var msg = document.getElementById('padraoMsg');
    if (msg && !(cat && cat.arqQ)) msg.textContent = 'Anotado! Vamos preparar a cotação e te procurar.';
    if (!PADRAO_DOC_ID) return;
    try {
      await db.collection('mb_questionario_padrao').doc(PADRAO_DOC_ID).update({
        interesseCotar: Array.from(PADRAO_INTERESSE),
        interesseEm: firebase.firestore.FieldValue.serverTimestamp()
      });
      try { const env = JSON.parse(localStorage.getItem(PADRAO_LS_ENV) || '{}'); env.interesse = Array.from(PADRAO_INTERESSE); localStorage.setItem(PADRAO_LS_ENV, JSON.stringify(env)); } catch (e) {}
      if (msg && cat && cat.arqQ) msg.textContent = '✓ Anotado — vamos cotar '+PADRAO_INTERESSE.size+(PADRAO_INTERESSE.size === 1 ? ' seguro' : ' seguros');
    } catch (e) {
      console.warn(e);
      if (msg) msg.textContent = 'Não consegui salvar agora — tente de novo em instantes.';
    }
  }
  window.quereCotarPadrao = quereCotarPadrao;

  function linhaProduto(p){
    var sub = descDe(p);
    var cab = '<div class="prod-cab"><div class="prod-ico">'+iconeDe(p)+'</div><div class="prod-txt"><div class="pn">'+_esc(p.nome)+'</div>'+
              (sub ? '<div class="pd">'+_esc(sub)+'</div>' : '')+'</div></div>';
    if (PROD_BLOQUEADOS.has(p.id)){
      return '<div class="prod bloq" id="p-'+p.id+'">'+cab+'<div class="bloq-tag">✓ já mapeado com seu gerente</div></div>';
    }
    // pré-marcado "não" (respondeu antes): já vem como "Não temos", mas pode mudar
    if (PROD_PRE_NAO.has(p.id) && respostas[p.id] && !respostas[p.id].tem) respostas[p.id].tem = 'nao';
    var r = respostas[p.id] || {};
    return '<div class="prod'+(r.tem === 'sim' ? ' tem' : r.tem === 'nao' ? ' naotem' : '')+'" id="p-'+p.id+'">'+cab+
      (PROD_PRE_NAO.has(p.id) ? '<div class="hint-pre">antes você informou que não tinha — mudou?</div>' : '')+
      '<div class="pills">'+
        '<button class="pill sim'+(r.tem === 'sim' ? ' on' : '')+'" onclick="marcar(\''+p.id+'\',\'sim\')">✓ Temos</button>'+
        '<button class="pill nao'+(r.tem === 'nao' ? ' on' : '')+'" onclick="marcar(\''+p.id+'\',\'nao\')">Não temos</button>'+
      '</div>'+
      '<div class="campos-inl" id="ci-'+p.id+'" hidden></div>'+
    '</div>';
  }

  function marcar(id, v){
    respostas[id] = respostas[id] || {};
    respostas[id].tem = v;
    if (v === 'nao'){ if (respostas[id].interesse === undefined) delete respostas[id].interesse; }
    var card = document.getElementById('p-'+id);
    if (card){
      card.classList.toggle('tem', v === 'sim'); card.classList.toggle('naotem', v === 'nao');
      card.querySelectorAll('.pill').forEach(function(b){ b.classList.toggle('on', b.classList.contains(v)); });
    }
    if (v === 'sim') abrirCampos(id); else { var ci = document.getElementById('ci-'+id); if (ci){ ci.hidden = true; ci.innerHTML = ''; } }
    atualizarFalta(); flashSalvo();
  }
  window.marcar = marcar;

  function abrirCampos(id){
    var ci = document.getElementById('ci-'+id); if (!ci) return;
    var r = respostas[id] || (respostas[id] = {});
    ci.innerHTML =
      '<div class="ci-l">Em que mês vence a apólice? <span class="ci-ano" id="ano-'+id+'">'+(r.vencimentoMes && r.vencimentoAno ? 'vence '+MESES_AB[r.vencimentoMes-1]+'/'+r.vencimentoAno : '')+'</span></div>'+
      '<div class="meses">'+MESES_AB.map(function(m,i){ return '<button class="mes'+(r.vencimentoMes === (i+1) ? ' on' : '')+'" onclick="selMes(\''+id+'\','+(i+1)+',this)">'+m+'</button>'; }).join('')+'</div>'+
      '<div class="ci-l" style="margin-top:2px">Valor <b>aproximado</b> por ano <span style="opacity:.6;font-weight:600">(não precisa ser exato)</span></div>'+
      '<input class="inp" id="valor-'+id+'" inputmode="numeric" placeholder="R$ 0,00 por ano, mais ou menos" value="'+(r.valorAnual ? 'R$ '+r.valorAnual.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '')+'" oninput="mascaraMoeda(this); respostas[\''+id+'\'].valorAnual=lerMoedaStr(this.value); flashSalvo();">'+
      '<input class="inp" style="margin-top:8px" list="listaSeguradoras" placeholder="Seguradora atual (opcional)" value="'+_esc(r.seguradora || '')+'" oninput="respostas[\''+id+'\'].seguradora=this.value.trim()||null; flashSalvo();">';
    ci.hidden = false;
  }
  function selMes(id, m, el){
    var r = respostas[id]; r.vencimentoMes = m;
    el.parentElement.querySelectorAll('.mes').forEach(function(b){ b.classList.remove('on'); }); el.classList.add('on');
    // ano automático: mês atual e próximos → este ano; mês que já passou → o próximo ano
    var hj = new Date(); r.vencimentoAno = (m - 1 >= hj.getMonth()) ? hj.getFullYear() : hj.getFullYear() + 1;
    var lab = document.getElementById('ano-'+id); if (lab) lab.textContent = 'vence '+MESES_AB[m-1]+'/'+r.vencimentoAno;
    flashSalvo();
  }
  window.selMes = selMes;

  function atualizarFalta(){
    // tema-tech: envio liberado com QUALQUER resposta. Não obriga responder todos os seguros.
    var disponiveis = PRODUTOS.filter(function(p){ return !PROD_BLOQUEADOS.has(p.id); });
    var respondidos = disponiveis.filter(function(p){ var r = respostas[p.id]; return r && (r.tem === 'sim' || r.tem === 'nao'); });
    var pend = disponiveis.length - respondidos.length;
    var el = document.getElementById('falta'), btn = document.getElementById('btnEnviar');
    var cnt = document.getElementById('t1Cnt'), prog = document.getElementById('t1Prog');
    if (cnt) cnt.textContent = respondidos.length + ' de ' + disponiveis.length;
    if (prog) prog.style.width = (disponiveis.length ? Math.round(respondidos.length / disponiveis.length * 100) : 0) + '%';
    if (!el || !btn) return;
    if (respondidos.length === 0){
      el.textContent = 'Marque ao menos um seguro para enviar';
      btn.disabled = true;
    } else {
      btn.disabled = false;
      el.textContent = pend > 0
        ? '✓ Pode enviar agora — ainda dá para responder '+pend+(pend === 1 ? ' seguro' : ' seguros')+' se quiser'
        : '✓ Tudo respondido';
    }
  }

  /* ============ ENVIO 1 — MAPEAMENTO (cômputo IDÊNTICO ao sistema; sem cotações/anexos aqui) ============ */
  async function submeter(){
    const btn = document.getElementById('btnEnviar');
    if (btn){ btn.disabled = true; btn.textContent = '⏳ Enviando…'; }
    try {
      try {
        const linkCheck = await db.collection('mb_links_empresa').doc(LINK_ID).get();
        const lc = linkCheck.exists ? linkCheck.data() : null;
        const expData = lc && lc.expiraEm && lc.expiraEm.toDate ? lc.expiraEm.toDate() : null;
        if (!lc || lc.preenchido === true) return mostrarErro('✅ Este link já foi respondido', 'O mapeamento deste link já foi recebido. Peça um novo ao seu gerente se precisar atualizar algo.');
        if (lc.expirado === true || (expData && expData < new Date())) {
          try { await db.collection('mb_links_empresa').doc(LINK_ID).update({ expirado: true, expirouEm: firebase.firestore.FieldValue.serverTimestamp() }); } catch (e) {}
          return mostrarErro('⏰ Este link expirou', 'Links de mapeamento valem por 7 dias. Peça um novo ao gerente que enviou.');
        }
      } catch (e) { /* segue */ }

      const numFunc = parseInt(dadosEmpresa.funcionarios) || null;

      for (const p of PRODUTOS) {
        const r = respostas[p.id];
        if (r && r.tem === 'sim' && (!r.vencimentoMes || !r.vencimentoAno)) r.vencimentoNaoInformado = true;
      }

      const produtosSalvos = [];
      const produtosPontuar = [];
      for (const p of PRODUTOS) {
        if (PROD_BLOQUEADOS.has(p.id)) continue;
        const r = respostas[p.id];
        if (!r || !r.tem) continue;
        if (r.preMarcadoNao === true && r.tem === 'nao' && !r.interesse) continue;
        const dados = {
          ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp(),
          ultimoAutorUid: LINK.geradoPorUid || 'cliente',
          ultimoAutorNome: LINK.geradoPorNome || 'Cliente (autopreenchimento)',
          preenchidoViaLink: true, linkId: LINK_ID, jaPontuouMapeamento: true
        };
        const isLinkNovo = Array.isArray(LINK.produtosPermitidos) || Array.isArray(LINK.produtosBloqueados) || Array.isArray(LINK.produtosNaoTem);
        if (isLinkNovo && PROD_PERMITIDOS.has(p.id)) {
          dados.primeiroMapeamento = { uid: LINK.geradoPorUid || 'cliente', nome: LINK.geradoPorNome || 'Cliente (link)', via: 'link', linkId: LINK_ID, em: new Date().toISOString() };
          produtosPontuar.push(p);
        } else if (!isLinkNovo) {
          produtosPontuar.push(p);
        } else if (PROD_PRE_NAO.has(p.id) && r.tem === 'sim') {
          produtosPontuar.push(p);
        }
        if (r.tem === 'sim') {
          dados.tem = true; dados.statusVisual = 'mapeada';
          dados.vencimentoMes = r.vencimentoMes || null;
          dados.vencimentoAno = r.vencimentoAno || null;
          if (r.vencimentoNaoInformado) dados.vencimentoNaoInformado = true;
          dados.seguradoraAtual = r.seguradora || null;
          dados.valorAnualPago = r.valorAnual || null;
          dados.observacoes = r.observacoes || null;
        } else {
          dados.tem = false; dados.naoTemProduto = true;
          dados.statusVisual = 'nao_tem'; dados.interesseCotar = false; // cotação vem na 2ª tela
        }
        await db.collection('empresas').doc(LINK.empresaId).collection('mb_produtos').doc(p.id).set(dados, { merge: true });
        produtosSalvos.push(p.id);
      }

      const empresaUpdate = { ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp(), ultimoAutorViaLink: true };
      if (numFunc !== null && numFunc > 0) {
        empresaUpdate.numFuncionarios = numFunc;
        if (numFunc !== (EMPRESA.numFuncionarios || 0)) {
          empresaUpdate.funcionariosHistorico = firebase.firestore.FieldValue.arrayUnion({ valor: numFunc, em: new Date().toISOString(), via: 'link', linkId: LINK_ID });
        }
      }
      if (EMPRESA.ultimoLinkMapeamento && EMPRESA.ultimoLinkMapeamento.linkId === LINK_ID) {
        empresaUpdate.ultimoLinkMapeamento = Object.assign({}, EMPRESA.ultimoLinkMapeamento, { status: 'respondido', respondidoEm: new Date().toISOString() });
      }
      await db.collection('empresas').doc(LINK.empresaId).set(empresaUpdate, { merge: true });

      const respostasLimpo = JSON.parse(JSON.stringify(respostas));
      await db.collection('mb_links_empresa').doc(LINK_ID).update({
        preenchido: true, preenchidoEm: firebase.firestore.FieldValue.serverTimestamp(),
        respostas: respostasLimpo, produtosRespondidos: produtosSalvos, numFuncionariosInformado: numFunc
      });

      if (LINK.geradoPorUid) {
        for (const p of produtosPontuar) {
          await db.collection('mb_acoes').add({
            tipo: 'mapeamento_via_link', empresaId: LINK.empresaId, empresaNome: LINK.empresaNome,
            produto: p.id, produtoNome: p.nome, agenciaId: LINK.agenciaId,
            usuarioId: LINK.geradoPorUid, usuarioNome: LINK.geradoPorNome,
            pontos: getPonto('mapear_produto') + getPonto('mapear_extra_link'),
            motivo: 'Cliente preencheu via link de autopreenchimento',
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        try {
          const agora = new Date(); const fim = new Date(agora.getTime() + 60 * 60 * 1000);
          const pad = n => String(n).padStart(2, '0');
          const dataStr = agora.getFullYear() + '-' + pad(agora.getMonth() + 1) + '-' + pad(agora.getDate());
          await db.collection('mb_agendamentos').add({
            tipo: 'visita', modalidade: 'video', empresaId: LINK.empresaId, empresaNome: LINK.empresaNome,
            agenciaId: LINK.agenciaId, gerenteUid: LINK.geradoPorUid, gerenteNome: LINK.geradoPorNome,
            data: dataStr, horaInicio: pad(agora.getHours()) + ':' + pad(agora.getMinutes()),
            horaFim: pad(fim.getHours()) + ':' + pad(fim.getMinutes()), status: 'realizada',
            origem: 'mapeamento_link', autoRegistrada: true,
            observacoes: 'Visita registrada automaticamente: cliente respondeu o questionário de mapeamento pelo link.',
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (evis) { console.warn('visita auto', evis); }
      }

      try { localStorage.removeItem('map_v2_' + LINK_ID); } catch (e) {}
      LINK.preenchido = true;
      tela2(true);
    } catch (e) {
      console.error(e);
      alert('Erro ao enviar: ' + e.message);
      if (btn){ btn.disabled = false; btn.textContent = 'Enviar para meu gerente'; }
    }
  }
  window.submeter = submeter;

  /* ============ APRESENTAÇÕES (preservado) ============ */
  function _token(n){ n=n||24; var c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', s=''; for (var i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
  const _baseUrl = function(){ return window.location.href.split('?')[0].replace(/[^/]*$/, ''); };
  function abrirDestino(prodId, formato){
    var p = PRODUTOS.find(function(x){ return x.id === prodId; });
    var cat = catDoProduto(p);
    if (!cat){ alert('Seu gerente vai preparar esse material e te enviar.'); return; }
    var arq = formato === 'questionario' ? (cat.arqQ || cat.arq) : cat.arq;
    if (!arq){ alert('Seu gerente vai preparar esse material e te enviar.'); return; }
    var win = window.open('', '_blank');
    var token = _token(24);
    var doc = {
      token: token, produtoId: cat.id, produtoNome: cat.nome, formato: formato,
      destinatario: null,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (MODO_PADRAO) {
      // Link AVULSO: apresentação/questionário padrão, sem vínculo com empresa da carteira.
      // Guarda só o que o cliente informou, para o corretor ligar a resposta depois.
      doc.empresaId = null; doc.empresaNome = null; doc.agenciaId = null;
      doc.geradoPorUid = null; doc.geradoPorNome = 'Link padrão (empresa não identificada)';
      doc.origem = 'link_padrao';
      doc.cnpj = soDigitos(ident.cnpj) || null;
      doc.contatoNome = (ident.nome || '').trim() || null;
      doc.contatoCelular = soDigitos(ident.celular) || null;
      doc.questionarioPadraoId = PADRAO_DOC_ID || null;
    } else {
      // Cliente da carteira: o link já nasce VINCULADO à empresa (o questionário do
      // produto abre com os dados dela e a resposta cai no card daquela negociação).
      doc.empresaId = LINK.empresaId;
      doc.empresaNome = LINK.empresaNome || (EMPRESA && EMPRESA.nome) || null;
      doc.agenciaId = LINK.agenciaId || (EMPRESA && EMPRESA.agenciaId) || null;
      doc.geradoPorUid = LINK.geradoPorUid || null;
      doc.geradoPorNome = LINK.geradoPorNome || 'Cliente (via mapeamento)';
      doc.origem = 'hub_mapeamento';
    }
    db.collection('mb_links_apresentacao').add(doc).then(function(){
      var url = _baseUrl() + arq + '?t=' + token;
      if (win) win.location = url; else window.location.href = url;
    }).catch(function(e){
      if (win) win.close();
      alert('Não consegui abrir agora: ' + e.message + '. Seu gerente vai te enviar esse material.');
    });
  }
  window.abrirDestino = abrirDestino;

  /* ============ TELA 2 — APÓLICES · APRESENTAÇÕES · QUERO COTAR ============ */
  let COTACOES_ENVIADAS = new Set();
  function _cardHub(p){
    var r = respostas[p.id] || {};
    var bloq = PROD_BLOQUEADOS.has(p.id);
    var tem = bloq || r.tem === 'sim';
    var tag = bloq ? '<span class="tag tag-tem">✓ já mapeado</span>' : tem ? '<span class="tag tag-tem">✓ você tem</span>' : '<span class="tag tag-nao">não tem hoje</span>';
    var det = '';
    if (!bloq && tem){
      var venc = r.vencimentoMes ? ('vence '+MESES_AB[r.vencimentoMes-1]+(r.vencimentoAno?'/'+r.vencimentoAno:'')) : '';
      var val = r.valorAnual ? (venc?' · ':'')+'R$ '+r.valorAnual.toLocaleString('pt-BR',{minimumFractionDigits:2})+'/ano' : '';
      if (venc || val) det = '<div class="dt">'+venc+val+'</div>';
    }
    var linhas = '';
    if (tem){
      linhas += '<div class="hub-linha" onclick="document.getElementById(\'ax-'+p.id+'\').click()">'+
        '<div class="hl-ic">📎</div><div class="hl-txt"><div class="hl-t">Anexar a apólice</div><div class="hl-s">PDF, foto, Word ou Excel — a gente lê seguradora e coberturas</div></div><div class="hl-seta">›</div></div>'+
        '<input type="file" id="ax-'+p.id+'" accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx" multiple style="display:none;" onchange="anexoSel(\''+p.id+'\', this)">'+
        '<div id="anexoLista-'+p.id+'" class="anexo-lista"></div>';
    }
    var cat = catDoProduto(p);
    if (cat){
      var beneficio = /dental|saude|sa[úu]de|vida|previd/i.test(p.id + ' ' + (p.nome||''));
      var estudoSub = beneficio ? 'conte sua necessidade e receba uma proposta sob medida' : 'queremos entender sua operação e fazer um estudo sob medida';
      if (cat.arq){
        linhas += '<div class="hub-linha" onclick="abrirDestino(\''+p.id+'\',\'apresentacao\')">'+
          '<div class="hl-ic">📖</div><div class="hl-txt"><div class="hl-t">Ver a apresentação</div><div class="hl-s">as coberturas de um jeito simples — abre em outra aba</div></div><div class="hl-seta">›</div></div>';
      }
      // estudo/questionário (leva a cotação) só nos que NÃO tem — nos que tem fica só a apresentação
      if (cat.arqQ && !tem){
        linhas += '<div class="hub-linha destaque" onclick="abrirDestino(\''+p.id+'\',\'questionario\')">'+
          '<div class="hl-ic">✍️</div><div class="hl-txt"><div class="hl-t">Quero um estudo personalizado</div><div class="hl-s">'+estudoSub+'</div></div><div class="hl-seta">›</div></div>';
      }
    }
    // "quero cotar" só nos que o cliente NÃO tem
    var cotar = '';
    if (!bloq && r.tem === 'nao'){
      var ja = COTACOES_ENVIADAS.has(p.id);
      var on = ja || r.interesse === 'sim';
      var perg = ja ? 'Cotação já pedida ao seu gerente' : 'Quer que seu gerente cote este seguro?';
      cotar = '<div class="hub-cotar"><span>'+perg+'</span>'+
        '<button class="tg-btn'+(on?' on':'')+'" id="tg-'+p.id+'" '+(ja?'disabled':'')+' onclick="toggleCotar(\''+p.id+'\')">'+(on ? '✓ quero cotar' : 'quero cotar')+'</button></div>';
    }
    return '<div class="hub-card"><div class="hub-head"><div class="ic">'+iconeDe(p)+'</div>'+
      '<div class="hub-nomewrap"><div class="nm">'+_esc(p.nome)+'</div>'+tag+'<div class="hub-desc">'+_esc(descDe(p))+'</div>'+det+'</div></div>'+
      (linhas ? '<div class="hub-div"></div>'+linhas : '')+cotar+'</div>';
  }
  function toggleCotar(id){
    if (COTACOES_ENVIADAS.has(id)) return;
    respostas[id] = respostas[id] || {};
    respostas[id].interesse = respostas[id].interesse === 'sim' ? 'nao' : 'sim';
    var b = document.getElementById('tg-'+id);
    if (b){ b.classList.toggle('on', respostas[id].interesse === 'sim'); b.textContent = respostas[id].interesse === 'sim' ? '✓ quero cotar' : 'quero cotar'; }
    atualizarEnvio2();
  }
  window.toggleCotar = toggleCotar;

  function tela2(recemEnviado){
    document.getElementById('topo').hidden = true;
    var _s = document.getElementById('salvoTag'); if (_s) _s.classList.remove('on');
    var temos = PRODUTOS.filter(function(p){ return PROD_BLOQUEADOS.has(p.id) || (respostas[p.id] && respostas[p.id].tem === 'sim'); });
    var naoTem = PRODUTOS.filter(function(p){ return !PROD_BLOQUEADOS.has(p.id) && respostas[p.id] && respostas[p.id].tem === 'nao'; });
    var html = '<div class="hub-top">'+
      '<div class="hub-check"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="27"/><path d="M18 31 l8 8 l16-18"/></svg></div>'+
      '<h1>'+(recemEnviado ? 'Dados enviados! 🎉' : 'Bem-vindo de volta')+'</h1>'+
      '<p>Seu gerente já recebeu o mapeamento. Se quiser, <b>anexe as apólices</b> dos seguros que você tem, <b>veja a apresentação</b> de qualquer um, e marque os que <b>não tem</b> e quer <b>cotar</b>.</p></div>';
    if (temos.length){ html += '<div class="grupo-band tem"><div class="gb-ic">✓</div><div><div class="gb-t">Seguros que você tem</div><div class="gb-s">anexe a apólice ou veja a apresentação de cada um</div></div></div>'; temos.forEach(function(p){ html += _cardHub(p); }); }
    if (naoTem.length){ html += '<div class="grupo-band conhecer"><div class="gb-ic">✨</div><div><div class="gb-t">Seguros para conhecer</div><div class="gb-s">veja o que cada um faz pela empresa — e marque os que quer cotar</div></div></div>'; naoTem.forEach(function(p){ html += _cardHub(p); }); }
    html += '<div class="t1-envio"><div class="t1-falta" id="falta2"></div>'+
      '<button class="btn-g btn-sim" id="btnEnviar2" onclick="enviarSegundo()">Enviar ao meu gerente</button>'+
      '<div class="t1-nota">Pode fechar a página a qualquer momento — o mapeamento já foi entregue.</div></div>';
    trocar(html, 'frente', 'res');
    setTimeout(function(){ PRODUTOS.forEach(function(p){ renderAnexos(p.id); }); atualizarEnvio2(); }, 30);
  }
  function atualizarEnvio2(){
    var el = document.getElementById('falta2'), btn = document.getElementById('btnEnviar2'); if (!el || !btn) return;
    var nAx = Object.keys(ANEXOS).reduce(function(n,k){ return n + (ANEXOS[k]||[]).length; }, 0);
    var nCot = PRODUTOS.filter(function(p){ return !PROD_BLOQUEADOS.has(p.id) && respostas[p.id] && respostas[p.id].tem === 'nao' && respostas[p.id].interesse === 'sim' && !COTACOES_ENVIADAS.has(p.id); }).length;
    var partes = []; if (nAx) partes.push(nAx + (nAx===1?' apólice':' apólices')); if (nCot) partes.push(nCot + (nCot===1?' cotação':' cotações'));
    el.textContent = partes.length ? 'Pronto para enviar: ' + partes.join(' + ') : 'Nada novo para enviar por enquanto';
    btn.disabled = !partes.length;
  }
  // anexos e cotações atualizam o rodapé da tela 2
  const _anexoSelOrig = anexoSel;
  window.anexoSel = function(prodId, input){ _anexoSelOrig(prodId, input); atualizarEnvio2(); };
  const _anexoRmOrig = anexoRm;
  window.anexoRm = function(prodId, i){ _anexoRmOrig(prodId, i); atualizarEnvio2(); };

  /* ============ ENVIO 2 — APÓLICES + COTAÇÕES (mesmo payload do sistema) ============ */
  async function enviarSegundo(){
    const btn = document.getElementById('btnEnviar2');
    if (btn){ btn.disabled = true; btn.textContent = '⏳ Enviando…'; }
    try {
      // apólices (inclusive dos já mapeados/bloqueados)
      for (const p of PRODUTOS) {
        if (!(ANEXOS[p.id] || []).length) continue;
        const meta = await uploadAnexos(p.id);
        if (meta.length) {
          await db.collection('empresas').doc(LINK.empresaId).collection('mb_produtos').doc(p.id).set({
            apoliceAnexos: await anexosMesclados(LINK.empresaId, p.id, meta),
            apoliceAnexadaEm: firebase.firestore.FieldValue.serverTimestamp(),
            apoliceAnexadaViaLink: LINK_ID
          }, { merge: true });
        }
        ANEXOS[p.id] = [];
      }
      // cotações dos "quero cotar" — só nos que o cliente NÃO tem (regra do sistema)
      const novas = [];
      for (const p of PRODUTOS) {
        const r = respostas[p.id];
        if (PROD_BLOQUEADOS.has(p.id) || !r || r.tem !== 'nao' || r.interesse !== 'sim' || COTACOES_ENVIADAS.has(p.id)) continue;
        await db.collection('empresas').doc(LINK.empresaId).collection('mb_produtos').doc(p.id).set({
          statusVisual: 'cotando', interesseCotar: true, ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        await db.collection('mb_cotacoes').add({
          empresaId: LINK.empresaId, empresaNome: LINK.empresaNome || EMPRESA.nome || '',
          produtoId: p.id, produtoNome: p.nome, produtoIcon: p.icon || '📦',
          agenciaId: LINK.agenciaId || EMPRESA.agenciaId || null,
          status: 'solicitada', etapa: 'solicitada', origem: 'oportunidade', chanceFechamento: 'media',
          solicitadoPorUid: LINK.geradoPorUid || null, solicitadoPorNome: LINK.geradoPorNome || 'Cliente (link)',
          observacoes: 'Cliente informou que NÃO tem, mas tem INTERESSE em cotar (via link).', interesseViaLink: true,
          historico: [{ status: 'solicitada', label: 'Iniciada', obs: 'Interesse em cotar via link do cliente', por: 'Cliente', em: new Date().toISOString() }],
          dataSolicitacao: firebase.firestore.FieldValue.serverTimestamp(),
          atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });
        novas.push(p.id); COTACOES_ENVIADAS.add(p.id);
      }
      const respostasLimpo = JSON.parse(JSON.stringify(respostas));
      const upd = { respostas: respostasLimpo, segundaEtapaEm: firebase.firestore.FieldValue.serverTimestamp() };
      if (novas.length) upd.cotacoesEnviadas = firebase.firestore.FieldValue.arrayUnion.apply(null, novas);
      await db.collection('mb_links_empresa').doc(LINK_ID).update(upd);
      var aviso = FALHAS_ANEXO.length ? ' ⚠ Não recebemos: '+FALHAS_ANEXO.join(', ')+'.' : '';
      FALHAS_ANEXO.length = 0;
      tela2(false);
      setTimeout(function(){ var f = document.getElementById('falta2'); if (f) f.textContent = '✓ Enviado ao seu gerente!'+aviso; }, 60);
    } catch (e) {
      console.error(e);
      alert('Erro ao enviar: ' + e.message);
      if (btn){ btn.disabled = false; btn.textContent = 'Enviar ao meu gerente'; }
    }
  }
  window.enviarSegundo = enviarSegundo;
</script>
