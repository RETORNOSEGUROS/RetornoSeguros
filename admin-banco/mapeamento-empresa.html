<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Mapeamento de Seguros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    [hidden]{ display:none !important; }
    :root{
      --azul1:#1e1b4b; --azul2:#312e81; --azul3:#4338ca; --brand:#4f46e5;
      --ouro1:#fde68a; --ouro2:#fbbf24;
      --branco:#ffffff; --b70:rgba(255,255,255,.72); --b50:rgba(255,255,255,.5); --b40:rgba(255,255,255,.4);
      --vidro:rgba(255,255,255,.08); --vidro-bd:rgba(255,255,255,.16);
      --verde:#34d399; --verde-esc:#064e3b;
      --tx-esc:#1e293b;
    }
    body{ font-family:'Plus Jakarta Sans', system-ui, sans-serif; background:#161335; color:var(--branco);
      min-height:100vh; display:flex; align-items:center; justify-content:center; }

    /* moldura de "celular" no desktop; tela cheia no mobile */
    .fone{ width:100%; max-width:460px; height:100vh; max-height:940px; position:relative; overflow:hidden;
      display:flex; flex-direction:column;
      background:linear-gradient(165deg, #1e1b4b 0%, #312e81 52%, #4338ca 100%); }
    @media(min-width:500px){ .fone{ border-radius:30px; height:90vh; box-shadow:0 30px 90px -20px rgba(10,5,40,.7); } }

    .topo{ flex:0 0 auto; padding:16px 20px 8px; display:flex; align-items:center; gap:12px; }
    .voltar{ width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff;
      font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; transition:.15s; }
    .voltar:active{ transform:scale(.9); }
    .barra-wrap{ flex:1; height:6px; background:rgba(255,255,255,.15); border-radius:100px; overflow:hidden; }
    .barra{ height:100%; width:0%; background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); border-radius:100px; transition:width .45s cubic-bezier(.4,0,.2,1); }
    .passo{ font-size:12px; font-weight:800; color:var(--b50); flex:0 0 auto; min-width:34px; text-align:right; }

    .salvo-tag{ position:absolute; top:50px; left:50%; transform:translate(-50%,-6px); z-index:20;
      background:var(--verde); color:var(--verde-esc); font-size:11.5px; font-weight:800; padding:5px 13px; border-radius:100px;
      opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; box-shadow:0 6px 16px -4px rgba(0,0,0,.4); }
    .salvo-tag.on{ opacity:1; transform:translate(-50%,0); }

    .palco{ flex:1; position:relative; overflow:hidden; }
    .cena{ position:absolute; inset:0; padding:8px 26px 26px; display:flex; flex-direction:column; overflow-y:auto;
      transition:transform .38s cubic-bezier(.33,1,.68,1), opacity .3s; }
    .cena > *{ flex-shrink:0; }
    .cena.entra-dir{ transform:translateX(60px); opacity:0; }
    .cena.entra-esq{ transform:translateX(-60px); opacity:0; }
    .cena.sai-esq{ transform:translateX(-60px); opacity:0; }
    .cena.sai-dir{ transform:translateX(60px); opacity:0; }

    /* boas-vindas */
    .bv{ justify-content:center; text-align:center; align-items:center; }
    .bv .selo-topo{ font-size:13px; font-weight:800; color:var(--b70); letter-spacing:.3px; margin-bottom:14px; }
    .bv .empresa{ font-size:30px; font-weight:800; line-height:1.15; margin-bottom:14px;
      background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .bv p{ font-size:15.5px; color:var(--b70); line-height:1.55; max-width:320px; margin:0 auto; }
    .bv .pills{ display:flex; flex-direction:column; gap:8px; margin-top:22px; width:100%; max-width:330px; }
    .pill{ background:rgba(255,255,255,.1); border:1px solid var(--vidro-bd); border-radius:100px; padding:9px 15px;
      font-size:12.5px; font-weight:600; color:var(--b70); }

    /* card de produto */
    .prod-topo{ text-align:center; padding-top:14px; }
    .prod-icone{ width:88px; height:88px; border-radius:26px; display:flex; align-items:center; justify-content:center;
      font-size:44px; margin:0 auto 20px; background:rgba(255,255,255,.1); }
    .prod-nome{ font-size:25px; font-weight:800; letter-spacing:-.4px; margin-bottom:9px; }
    .prod-sub{ font-size:15px; color:var(--b70); line-height:1.5; max-width:320px; margin:0 auto; }
    .hint-pre{ display:inline-block; margin-top:12px; font-size:12px; font-weight:700; color:#fcd34d;
      background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.3); padding:5px 12px; border-radius:100px; }

    .escolha{ margin-top:auto; padding-top:24px; display:flex; flex-direction:column; gap:11px; }
    .btn-g{ border:none; border-radius:16px; padding:18px; font-size:16.5px; font-weight:800; cursor:pointer; font-family:inherit;
      transition:transform .12s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-g:active{ transform:scale(.97); }
    .btn-sim{ background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); color:#3b2f00; box-shadow:0 10px 26px -8px rgba(251,191,36,.5); }
    .btn-nao{ background:rgba(255,255,255,.1); color:#fff; border:1.5px solid var(--vidro-bd); }

    /* campos do "temos" */
    .campos{ margin-top:20px; }
    .campos h3{ font-size:15px; color:var(--branco); font-weight:800; margin-bottom:14px; text-align:center; }
    .rotulo{ font-size:12px; font-weight:700; color:var(--b70); margin:0 0 7px 3px; display:block; text-transform:uppercase; letter-spacing:.3px; }
    .meses{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:14px; }
    .mes{ border:1.5px solid var(--vidro-bd); background:rgba(255,255,255,.06); border-radius:12px; padding:11px 0; font-size:13px; font-weight:700;
      color:var(--b70); cursor:pointer; text-align:center; transition:.12s; font-family:inherit; }
    .mes.on{ border-color:var(--ouro2); background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); color:#3b2f00; }
    .mes:active{ transform:scale(.94); }
    .linha-input{ display:flex; gap:9px; margin-bottom:12px; }
    .inp{ width:100%; border:1.5px solid transparent; border-radius:13px; padding:14px 15px; font-size:15px;
      font-family:inherit; color:var(--tx-esc); background:#fff; transition:.15s; }
    .inp::placeholder{ color:#94a3b8; }
    .inp:focus{ outline:none; box-shadow:0 0 0 4px rgba(251,191,36,.35); }
    .anexo-l{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; color:#fff;
      font-size:13.5px; font-weight:700; cursor:pointer; padding:12px; border:1.5px dashed var(--vidro-bd); border-radius:12px; background:rgba(255,255,255,.06); }
    .anexo-chip{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.1); border:1px solid var(--vidro-bd);
      border-radius:8px; padding:6px 11px; font-size:12px; color:#fff; margin:8px 6px 0 0; max-width:100%; }
    .anexo-chip .rm{ cursor:pointer; color:var(--b50); font-weight:800; }
    .continuar{ margin-top:16px; }

    /* resumo */
    .res h2{ font-size:23px; font-weight:800; letter-spacing:-.4px; margin:12px 0 4px; }
    .res .sub{ font-size:14.5px; color:var(--b70); margin-bottom:22px; }
    .grupo-tit{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--b50); margin:18px 0 10px; }
    .item{ display:flex; align-items:center; gap:12px; background:var(--vidro); border:1px solid var(--vidro-bd); border-radius:15px; padding:13px 15px; margin-bottom:9px; }
    .item .ic{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex:0 0 auto; background:rgba(255,255,255,.08); }
    .item .nm{ font-weight:700; font-size:15px; }
    .item .dt{ font-size:12.5px; color:var(--b70); margin-top:1px; }
    .item .ck{ margin-left:auto; color:var(--verde); font-size:20px; }
    .cotar-item{ display:flex; align-items:center; gap:12px; padding:12px 15px; border:1px solid var(--vidro-bd); background:var(--vidro); border-radius:15px; margin-bottom:9px; }
    .tg-btn{ margin-left:auto; border:1.5px solid var(--ouro2); background:transparent; color:var(--ouro2); font-size:12.5px; font-weight:800;
      padding:9px 15px; border-radius:100px; cursor:pointer; font-family:inherit; transition:.15s; white-space:nowrap; flex:0 0 auto; }
    .tg-btn.on{ background:linear-gradient(90deg,var(--ouro1),var(--ouro2)); color:#3b2f00; border-color:transparent; }
    .enviar{ margin-top:24px; }

    /* sucesso */
    .ok{ justify-content:center; align-items:center; text-align:center; }
    .check{ width:96px; height:96px; border-radius:50%; background:rgba(52,211,153,.16); display:flex; align-items:center; justify-content:center;
      margin-bottom:24px; animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
    .check svg{ width:52px; height:52px; }
    .check circle{ stroke:var(--verde); stroke-width:3; fill:none; stroke-dasharray:170; stroke-dashoffset:170; animation:traco .6s .1s forwards; }
    .check path{ stroke:var(--verde); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:48; stroke-dashoffset:48; animation:traco .35s .5s forwards; }
    @keyframes traco{ to{ stroke-dashoffset:0; } }
    @keyframes pop{ 0%{ transform:scale(.5); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
    .ok h1{ font-size:25px; margin-bottom:10px; letter-spacing:-.4px; }
    .ok p{ font-size:15px; color:var(--b70); line-height:1.55; max-width:300px; }

    .rodape{ flex:0 0 auto; text-align:center; padding:10px; font-size:11px; color:var(--b40); }

    /* loading + erro */
    .loading-overlay{ position:fixed; inset:0; background:#1e1b4b; display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:18px; z-index:100; color:var(--b70); font-size:14px; }
    .spinner{ width:44px; height:44px; border:4px solid rgba(255,255,255,.15); border-top-color:var(--ouro2); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .erro-container{ max-width:420px; margin:auto; text-align:center; background:rgba(255,255,255,.06);
      border:1px solid var(--vidro-bd); border-radius:20px; padding:38px 30px; }
    .erro-container h2{ margin-bottom:10px; font-size:20px; }
    .erro-container p{ color:var(--b70); font-size:14px; line-height:1.55; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div>Carregando…</div>
  </div>

  <div class="fone" id="app" style="display:none;">
    <div class="topo" id="topo" hidden>
      <button class="voltar" id="btnVoltar" onclick="voltar()">←</button>
      <div class="barra-wrap"><div class="barra" id="barra"></div></div>
      <div class="passo" id="passo"></div>
    </div>
    <div class="salvo-tag" id="salvoTag">✓ salvo automaticamente</div>
    <div class="palco" id="palco">
      <div class="cena" style="justify-content:center; align-items:center;">
        <div class="erro-container" id="erro" style="display:none;">
          <h2 id="erroTit">🔗 Link inválido ou expirado</h2>
          <p id="erroTxt">Este link de mapeamento não está mais ativo. Peça um novo ao gerente que enviou.</p>
        </div>
      </div>
    </div>
    <div class="rodape">Retorno Seguros · Mapeamento de seguros empresariais</div>
  </div>

<script>
  /* ============ FIREBASE ============ */
  const firebaseConfig = {
    apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
    authDomain: "retorno-seguros.firebaseapp.com",
    projectId: "retorno-seguros",
    storageBucket: "retorno-seguros.firebasestorage.app",
    messagingSenderId: "979966947706",
    appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  try { const _st = firebase.storage(); _st.setMaxUploadRetryTime(30000); _st.setMaxOperationRetryTime(30000); } catch (e) {}

  let PONTOS_CFG = { mapear_produto: 2, mapear_extra_link: 1 };
  const getPonto = ch => (PONTOS_CFG && PONTOS_CFG[ch] != null) ? Number(PONTOS_CFG[ch]) : 0;

  let PRODUTOS = [
    { id: 'frota',        nome: 'Frota / Auto',         icon: '🚗' },
    { id: 'empresarial',  nome: 'Empresarial',          icon: '🏢' },
    { id: 'saude-socios', nome: 'Saúde — Sócios',       icon: '👥' },
    { id: 'saude-colab',  nome: 'Saúde — Colaboradores', icon: '👨‍👩‍👧' },
    { id: 'vida-grupo',   nome: 'Vida em Grupo',        icon: '🛡️' },
    { id: 'vida-socios',  nome: 'Vida — Sócios',        icon: '💼' },
    { id: 'dental',       nome: 'Dental',               icon: '🦷' }
  ];
  // frases em linguagem simples por produto (fallback quando o ramo não traz descrição p/ cliente)
  const SUBS = {
    'frota':'Os carros e caminhões que rodam no nome da empresa.',
    'empresarial':'O prédio, o estoque e os equipamentos — contra incêndio, roubo e danos.',
    'transporte':'As mercadorias que a empresa envia ou transporta pelas estradas.',
    'saude-colab':'Convênio médico para os funcionários.',
    'saude-socios':'Convênio médico para os sócios.',
    'vida-grupo':'Proteção para a equipe em caso de acidente ou falecimento.',
    'vida-socios':'Seguro de vida para os donos do negócio.',
    'dental':'Convênio odontológico para o time.'
  };

  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MESES_AB = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  let LINK = null, LINK_ID = null, EMPRESA = null;
  let respostas = {};                 // { [prodId]: { tem, vencimentoMes, vencimentoAno, seguradora, valorAnual, observacoes, interesse, preMarcadoNao } }
  let dadosEmpresa = { funcionarios: '' };
  let FLUXO = [];                     // produtos que aparecem no fluxo (já mapeados NÃO entram)
  let PROD_BLOQUEADOS = new Set();    // já mapeados → NÃO aparecem
  let PROD_PRE_NAO = new Set();       // respondidos "não tem" antes
  let PROD_PERMITIDOS = new Set();    // sem resposta → únicos que pontuam
  let idx = -1;                      // -1 boas-vindas | 'colab' | 0..N | N=resumo | 'fim'

  const palco = document.getElementById('palco');

  /* ============ CARGA / VALIDAÇÃO DO LINK (preservado) ============ */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('t');
      document.getElementById('app').style.display = 'flex';
      document.getElementById('loading').style.display = 'none';
      if (!token) return mostrarErro();

      try { await firebase.auth().signInAnonymously(); } catch (e) { console.warn('auth anônima falhou:', e); }

      const snap = await db.collection('mb_links_empresa').where('token','==',token).limit(1).get();
      if (snap.empty) return mostrarErro();
      LINK = snap.docs[0].data();
      LINK_ID = snap.docs[0].id;

      if (LINK.preenchido === true) {
        return mostrarErro('✅ Este link já foi respondido', 'O mapeamento enviado por este link já foi recebido. Se precisar atualizar algo, peça um novo link ao seu gerente.');
      }
      const expData = LINK.expiraEm && LINK.expiraEm.toDate ? LINK.expiraEm.toDate() : (LINK.expiraEm ? new Date(LINK.expiraEm) : null);
      if (LINK.expirado === true || (expData && expData < new Date())) {
        if (!LINK.expirado) { try { await db.collection('mb_links_empresa').doc(LINK_ID).update({ expirado: true, expirouEm: firebase.firestore.FieldValue.serverTimestamp() }); } catch (e) {} }
        return mostrarErro('⏰ Este link expirou', 'Links de mapeamento valem por 7 dias. Peça um novo ao gerente que enviou.');
      }

      PROD_BLOQUEADOS = new Set(LINK.produtosBloqueados || []);
      PROD_PRE_NAO   = new Set(LINK.produtosNaoTem || []);
      PROD_PERMITIDOS = new Set(LINK.produtosPermitidos || []);

      const empSnap = await db.collection('empresas').doc(LINK.empresaId).get();
      if (!empSnap.exists) return mostrarErro();
      EMPRESA = empSnap.data();
      if (EMPRESA.numFuncionarios) dadosEmpresa.funcionarios = String(EMPRESA.numFuncionarios);

      // Ramos ativos do sistema (os "só por OP" não entram no questionário do cliente)
      try {
        const ramosSnap = await db.collection('mb_ramos').get();
        if (!ramosSnap.empty) {
          const arr = [];
          ramosSnap.forEach(d => { const r = d.data(); if (r.ativo !== false && !r.somenteOp) arr.push({ id: d.id, nome: r.nome, icon: r.icon || '📦', ordem: r.ordem || 0, desc: (r.descCliente || '').trim() }); });
          if (arr.length) { arr.sort((a, b) => (a.ordem || 0) - (b.ordem || 0)); PRODUTOS = arr; }
        }
      } catch (e) { console.warn('ramos dinâmicos falhou, usando padrão', e); }

      // Empresa SEM sócios confirmado: seguros de sócios não aparecem (v237)
      if (EMPRESA.semSociosConfirmado === true && !((EMPRESA.socios || []).length)) {
        PRODUTOS = PRODUTOS.filter(p => !(p.id === 'vida-socios' || p.id === 'saude-socios' || /s[óo]cios?/i.test(p.nome || '')));
      }

      try {
        const cfgSnap = await db.collection('mb_config').doc('pontos').get();
        if (cfgSnap.exists) PONTOS_CFG = { ...PONTOS_CFG, ...cfgSnap.data() };
      } catch (e) { console.warn('pontos dinâmicos falhou, usando padrão', e); }

      // Já mapeados NÃO aparecem no fluxo. Pré-marcados "não" entram (podem ter mudado).
      FLUXO = PRODUTOS.filter(p => !PROD_BLOQUEADOS.has(p.id));
      FLUXO.forEach(p => { if (PROD_PRE_NAO.has(p.id)) { respostas[p.id] = { preMarcadoNao: true }; } });

      restaurarRascunho();
      boasVindas();
    } catch (e) {
      console.error(e);
      mostrarErro();
    }
  });

  function mostrarErro(titulo, texto) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('topo').hidden = true;
    palco.innerHTML = '<div class="cena" style="justify-content:center; align-items:center;">'+
      '<div class="erro-container"><h2>'+(titulo || '🔗 Link inválido ou expirado')+'</h2>'+
      '<p>'+(texto || 'Este link de mapeamento não está mais ativo. Peça um novo ao gerente que enviou.')+'</p></div></div>';
  }

  /* ============ RASCUNHO (pausar e voltar, no aparelho do cliente) ============ */
  function salvarRascunho(){ try { localStorage.setItem('map_v2_' + LINK_ID, JSON.stringify({ respostas, dadosEmpresa })); } catch (e) {} }
  function restaurarRascunho(){
    try {
      const raw = localStorage.getItem('map_v2_' + LINK_ID);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d && d.respostas) { Object.keys(d.respostas).forEach(k => { respostas[k] = Object.assign({}, respostas[k], d.respostas[k]); }); }
      if (d && d.dadosEmpresa && d.dadosEmpresa.funcionarios) dadosEmpresa.funcionarios = d.dadosEmpresa.funcionarios;
    } catch (e) {}
  }

  /* ============ ANEXOS (PDF/foto/Word/Excel) — preservado ============ */
  const ANEXOS = {};
  const FALHAS_ANEXO = [];
  function tipoAnexoOk(f) {
    const t = f.type || '';
    if (t === 'application/pdf' || t.startsWith('image/')) return true;
    if (t === 'application/msword' || t === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') return true;
    if (t === 'application/vnd.ms-excel' || t === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') return true;
    return /\.(pdf|doc|docx|xls|xlsx|png|jpe?g|heic|webp)$/i.test(f.name || '');
  }
  function _mimeArquivo(f) {
    if (f.type) return f.type;
    const ext = ((f.name || '').split('.').pop() || '').toLowerCase();
    return ({ pdf:'application/pdf', doc:'application/msword',
      docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      xls:'application/vnd.ms-excel', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', heic:'image/heic' })[ext] || 'application/octet-stream';
  }
  function anexoSel(prodId, input) {
    const files = [...(input.files || [])];
    ANEXOS[prodId] = ANEXOS[prodId] || [];
    for (const f of files) {
      if (ANEXOS[prodId].length >= 3) { alert('Máximo de 3 anexos por seguro.'); break; }
      if (f.size > 15 * 1024 * 1024) { alert('"' + f.name + '" passa de 15 MB — envie um arquivo menor.'); continue; }
      if (!tipoAnexoOk(f)) { alert('"' + f.name + '" não é um tipo aceito — envie PDF, foto, Word ou Excel.'); continue; }
      ANEXOS[prodId].push(f);
    }
    input.value = '';
    renderAnexos(prodId);
    flashSalvo();
  }
  window.anexoSel = anexoSel;
  function renderAnexos(prodId) {
    const box = document.getElementById('anexoLista-' + prodId);
    if (!box) return;
    box.innerHTML = (ANEXOS[prodId] || []).map((f, i) => '<span class="anexo-chip">📄 <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">' + String(f.name).replace(/</g,'&lt;') + '</span> <span class="rm" onclick="anexoRm(\'' + prodId + '\',' + i + ')">✕</span></span>').join('');
  }
  function anexoRm(prodId, i) { (ANEXOS[prodId] || []).splice(i, 1); renderAnexos(prodId); }
  window.anexoRm = anexoRm;
  const _comTimeout = (promessa, ms) => Promise.race([ promessa, new Promise((_, rej) => setTimeout(() => rej(new Error('tempo esgotado no envio do arquivo')), ms)) ]);
  async function uploadAnexos(prodId) {
    const files = ANEXOS[prodId] || [];
    const out = [];
    for (const f of files) {
      try {
        const path = 'mb_apolices/' + LINK.empresaId + '/' + prodId + '/' + Date.now() + '_' + f.name.replace(/[^a-zA-Z0-9_.\-]/g, '_');
        const snap = await _comTimeout(firebase.storage().ref(path).put(f, { contentType: _mimeArquivo(f) }), 120000);
        const url = await _comTimeout(snap.ref.getDownloadURL(), 20000);
        out.push({ nome: f.name, url, tamanho: f.size, em: new Date().toISOString(), via: 'link_mapeamento' });
      } catch (e) { console.warn('anexo falhou', f.name, e); FALHAS_ANEXO.push(f.name); }
    }
    return out;
  }

  /* ============ dinheiro ============ */
  function mascaraMoeda(input) {
    let v = input.value.replace(/\D/g, '');
    if (!v) { input.value = ''; return; }
    v = (parseInt(v) / 100).toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+,)/g, '$1.');
    input.value = 'R$ ' + v;
  }
  window.mascaraMoeda = mascaraMoeda;
  function lerMoedaStr(s) { return parseFloat((s || '').replace(/[^\d,]/g, '').replace(',', '.')) || 0; }

  /* ============ MICRO-INDICADOR "salvo" ============ */
  function flashSalvo(){
    salvarRascunho();
    const s = document.getElementById('salvoTag'); if (!s) return;
    s.classList.add('on'); clearTimeout(window._st);
    window._st = setTimeout(() => s.classList.remove('on'), 1400);
  }

  /* ============ TRANSIÇÃO ENTRE CENAS ============ */
  function trocar(html, dir, extra){
    var atual = palco.querySelector('.cena');
    var nova = document.createElement('div');
    nova.className = 'cena ' + (extra ? extra + ' ' : '') + (dir === 'tras' ? 'entra-esq' : 'entra-dir');
    nova.innerHTML = html;
    palco.appendChild(nova);
    requestAnimationFrame(function(){
      if (atual){ atual.classList.add(dir === 'tras' ? 'sai-dir' : 'sai-esq'); }
      requestAnimationFrame(function(){ nova.classList.remove('entra-dir','entra-esq'); });
    });
    if (atual){ setTimeout(function(){ atual.remove(); }, 400); }
  }
  function atualizarTopo(){
    var topo = document.getElementById('topo');
    if (typeof idx !== 'number' || idx < 0){ topo.hidden = true; return; }
    topo.hidden = false;
    var total = FLUXO.length;
    var passo = Math.min(idx + 1, total);
    document.getElementById('barra').style.width = (idx >= total ? 100 : (idx / total) * 100) + '%';
    document.getElementById('passo').textContent = idx >= total ? '' : passo + '/' + total;
    document.getElementById('btnVoltar').hidden = false;
  }

  /* ============ BOAS-VINDAS ============ */
  function boasVindas(){
    idx = -1; atualizarTopo();
    var nome = EMPRESA && (EMPRESA.nome || EMPRESA.razaoSocial) || (LINK && LINK.empresaNome) || 'sua empresa';
    trocar(
      '<div class="selo-topo">📋 Mapeamento de Seguros</div>'+
      '<div class="empresa">'+nome+'</div>'+
      '<p>Um retrato rápido das proteções da sua empresa — leva menos de 3 minutos, tudo de clicar.</p>'+
      '<button class="btn-g btn-sim" style="margin-top:26px; width:100%; max-width:330px;" onclick="colaboradores()">Começar</button>'+
      '<div class="pills">'+
        '<div class="pill">🔒 Confidencial — vai direto ao seu gerente</div>'+
        '<div class="pill">💾 Suas respostas ficam salvas se você pausar</div>'+
      '</div>'
    , 'frente', 'bv');
  }

  /* ============ COLABORADORES ============ */
  function colaboradores(){
    idx = 'colab'; atualizarTopo();
    trocar(
      '<div class="prod-topo" style="margin-top:16px;">'+
        '<div class="prod-icone">👥</div>'+
        '<div class="prod-nome">Quantos colaboradores?</div>'+
        '<div class="prod-sub">Quantas pessoas trabalham na empresa hoje. Ajuda a pensar saúde, vida e odonto da equipe.</div>'+
      '</div>'+
      '<div class="campos" style="margin-top:24px;">'+
        '<input class="inp" id="numFunc" inputmode="numeric" placeholder="Ex: 25" style="text-align:center; font-size:22px; font-weight:800;" value="'+(dadosEmpresa.funcionarios||'')+'">'+
      '</div>'+
      '<div class="escolha">'+
        '<button class="btn-g btn-sim" onclick="salvarColab()">Continuar →</button>'+
      '</div>'
    , 'frente');
  }
  function salvarColab(){ dadosEmpresa.funcionarios = (document.getElementById('numFunc')||{}).value || ''; flashSalvo(); irPara(0); }
  window.colaboradores = colaboradores; window.salvarColab = salvarColab;

  /* ============ CARD DE PRODUTO ============ */
  function irPara(i, dir){
    idx = i; atualizarTopo();
    if (i >= FLUXO.length){ return resumo(dir); }
    var p = FLUXO[i];
    var sub = (p.desc && p.desc.length ? p.desc : (SUBS[p.id] || ''));
    var html = '<div class="prod-topo">'+
      '<div class="prod-icone">'+(p.icon||'📦')+'</div>'+
      '<div class="prod-nome">'+p.nome+'</div>'+
      (sub ? '<div class="prod-sub">'+sub+'</div>' : '')+
      (PROD_PRE_NAO.has(p.id) ? '<div class="hint-pre">antes você informou que não tinha — mudou?</div>' : '')+
    '</div>'+
    '<div class="escolha">'+
      '<button class="btn-g btn-sim" onclick="responder(\''+p.id+'\',\'sim\')">Temos esse seguro</button>'+
      '<button class="btn-g btn-nao" onclick="responder(\''+p.id+'\',\'nao\')">Não temos</button>'+
    '</div>';
    trocar(html, dir === 'tras' ? 'tras' : 'frente');
  }

  function responder(id, resp){
    respostas[id] = respostas[id] || {};
    respostas[id].tem = resp;
    if (resp === 'nao'){
      if (respostas[id].interesse === undefined) delete respostas[id].interesse; // nunca gravar undefined
      flashSalvo();
      setTimeout(function(){ irPara(idx + 1); }, 260);
    } else {
      revelarCampos(id);
    }
  }
  window.responder = responder;

  function revelarCampos(id){
    var cena = palco.querySelector('.cena');
    var esc = cena.querySelector('.escolha'); if (esc) esc.style.display = 'none';
    var r = respostas[id] || {};
    var box = document.createElement('div');
    box.className = 'campos';
    box.innerHTML =
      '<h3>Boa! Quando vence a apólice?</h3>'+
      '<div class="meses" id="meses">'+
        MESES_AB.map(function(m,i){ return '<button class="mes'+(r.vencimentoMes===(i+1)?' on':'')+'" onclick="selMes('+(i+1)+',this)">'+m+'</button>'; }).join('')+
      '</div>'+
      '<div class="linha-input"><input class="inp" id="ano" inputmode="numeric" placeholder="Ano (ex: '+(new Date().getFullYear()+1)+')" value="'+(r.vencimentoAno||'')+'"></div>'+
      '<label class="rotulo" style="margin-top:6px;">Seguradora atual <span style="opacity:.6; font-weight:500;">(opcional)</span></label>'+
      '<div class="linha-input"><input class="inp" id="seg" list="listaSeguradoras" placeholder="Ex: Porto, Tokio…" value="'+(r.seguradora||'')+'"></div>'+
      '<label class="rotulo">Valor que paga hoje, por ano <span style="opacity:.6; font-weight:500;">(opcional)</span></label>'+
      '<div class="linha-input"><input class="inp" id="valor" inputmode="numeric" placeholder="R$ 0,00" oninput="mascaraMoeda(this)"></div>'+
      '<div class="anexo-l" onclick="document.getElementById(\'ax-'+id+'\').click()">📎 Anexar apólice ou planilha (opcional)</div>'+
      '<input type="file" id="ax-'+id+'" accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx" multiple style="display:none;" onchange="anexoSel(\''+id+'\', this)">'+
      '<div id="anexoLista-'+id+'"></div>'+
      '<button class="btn-g btn-sim continuar" onclick="continuar(\''+id+'\')">Continuar →</button>';
    cena.appendChild(box);
    renderAnexos(id);
    box.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  function selMes(m, el){
    respostas[FLUXO[idx].id].vencimentoMes = m;
    document.querySelectorAll('#meses .mes').forEach(function(b){ b.classList.remove('on'); });
    el.classList.add('on');
  }
  window.selMes = selMes;
  function continuar(id){
    var r = respostas[id];
    r.vencimentoAno = parseInt((document.getElementById('ano')||{}).value) || null;
    r.seguradora = ((document.getElementById('seg')||{}).value || '').trim() || null;
    r.valorAnual = lerMoedaStr((document.getElementById('valor')||{}).value);
    r.observacoes = r.observacoes || null;
    flashSalvo();
    irPara(idx + 1);
  }
  window.continuar = continuar;

  /* ============ RESUMO / CONFERÊNCIA ============ */
  function resumo(dir){
    idx = FLUXO.length; atualizarTopo();
    var temos = FLUXO.filter(function(p){ return respostas[p.id] && respostas[p.id].tem === 'sim'; });
    var naoTem = FLUXO.filter(function(p){ return respostas[p.id] && respostas[p.id].tem === 'nao'; });
    var html = '<h2>Quase lá! 🎉</h2><div class="sub">Confira o que você marcou e é só enviar.</div>';
    if (temos.length){
      html += '<div class="grupo-tit">Seguros que vocês têm</div>';
      temos.forEach(function(p){
        var r = respostas[p.id];
        var venc = r.vencimentoMes ? 'vence '+MESES_AB[r.vencimentoMes-1]+'/'+(r.vencimentoAno||'') : (r.vencimentoAno ? 'vence em '+r.vencimentoAno : 'informado');
        var seg = r.seguradora ? ' · '+r.seguradora : '';
        var val = r.valorAnual ? ' · R$ '+r.valorAnual.toLocaleString('pt-BR',{minimumFractionDigits:2})+'/ano' : '';
        html += '<div class="item"><div class="ic">'+(p.icon||'📦')+'</div>'+
          '<div><div class="nm">'+p.nome+'</div><div class="dt">'+venc+seg+val+'</div></div><div class="ck">✓</div></div>';
      });
    }
    if (naoTem.length){
      html += '<div class="grupo-tit">Não têm hoje — querem cotação?</div>';
      naoTem.forEach(function(p){
        var on = respostas[p.id].interesse === 'sim' ? ' on' : '';
        html += '<div class="cotar-item"><div class="ic" style="width:38px; height:38px; border-radius:11px; font-size:19px;">'+(p.icon||'📦')+'</div>'+
          '<div class="nm" style="font-size:14px;">'+p.nome+'</div>'+
          '<button class="tg-btn'+on+'" id="tg-'+p.id+'" onclick="toggleCotar(\''+p.id+'\')">'+(respostas[p.id].interesse==='sim'?'✓ quero cotar':'quero cotar')+'</button></div>';
      });
    }
    html += '<button class="btn-g btn-sim enviar" id="btnEnviar" onclick="submeter()">Enviar para meu gerente</button>';
    trocar(html, dir === 'tras' ? 'tras' : 'frente', 'res');
  }
  function toggleCotar(id){
    respostas[id].interesse = respostas[id].interesse === 'sim' ? 'nao' : 'sim';
    var b = document.getElementById('tg-'+id);
    b.classList.toggle('on', respostas[id].interesse === 'sim');
    b.textContent = respostas[id].interesse === 'sim' ? '✓ quero cotar' : 'quero cotar';
    flashSalvo();
  }
  window.toggleCotar = toggleCotar;

  /* ============ VOLTAR ============ */
  function voltar(){
    if (typeof idx !== 'number'){ return; }
    if (idx >= FLUXO.length){ return irPara(FLUXO.length - 1, 'tras'); }
    if (idx > 0){ return irPara(idx - 1, 'tras'); }
    if (idx === 0){ return colaboradores(); }
  }
  window.voltar = voltar;

  /* ============ ENVIO (lógica de gravação preservada do sistema) ============ */
  async function submeter(){
    const btn = document.getElementById('btnEnviar');
    if (btn){ btn.disabled = true; btn.textContent = '⏳ Enviando…'; }
    try {
      // Revalida o link no envio
      try {
        const linkCheck = await db.collection('mb_links_empresa').doc(LINK_ID).get();
        const lc = linkCheck.exists ? linkCheck.data() : null;
        const expData = lc && lc.expiraEm && lc.expiraEm.toDate ? lc.expiraEm.toDate() : null;
        if (!lc || lc.preenchido === true) return mostrarErro('✅ Este link já foi respondido', 'O mapeamento deste link já foi recebido. Peça um novo ao seu gerente se precisar atualizar algo.');
        if (lc.expirado === true || (expData && expData < new Date())) {
          try { await db.collection('mb_links_empresa').doc(LINK_ID).update({ expirado: true, expirouEm: firebase.firestore.FieldValue.serverTimestamp() }); } catch (e) {}
          return mostrarErro('⏰ Este link expirou', 'Links de mapeamento valem por 7 dias. Peça um novo ao gerente que enviou.');
        }
      } catch (e) { /* segue */ }

      const numFunc = parseInt(dadosEmpresa.funcionarios) || null;

      // vencimento em branco vira "não informado" (nunca bloqueia)
      for (const p of FLUXO) {
        const r = respostas[p.id];
        if (r && r.tem === 'sim' && (!r.vencimentoMes || !r.vencimentoAno)) r.vencimentoNaoInformado = true;
      }

      // ===== Salvar cada produto (IDÊNTICO ao sistema) =====
      const cotacoesParaCriar = [];
      const produtosSalvos = [];
      const produtosPontuar = [];
      for (const p of PRODUTOS) {
        if (PROD_BLOQUEADOS.has(p.id)) {
          if ((ANEXOS[p.id] || []).length) {
            const _axCong = await uploadAnexos(p.id);
            if (_axCong.length) {
              await db.collection('empresas').doc(LINK.empresaId).collection('mb_produtos').doc(p.id).set({
                apoliceAnexos: firebase.firestore.FieldValue.arrayUnion.apply(firebase.firestore.FieldValue, _axCong),
                apoliceAnexadaEm: firebase.firestore.FieldValue.serverTimestamp(),
                apoliceAnexadaViaLink: LINK_ID
              }, { merge: true });
            }
          }
          continue;
        }
        const r = respostas[p.id];
        if (!r || !r.tem) continue;
        if (r.preMarcadoNao === true && r.tem === 'nao' && !r.interesse) continue;
        const dados = {
          ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp(),
          ultimoAutorUid: LINK.geradoPorUid || 'cliente',
          ultimoAutorNome: LINK.geradoPorNome || 'Cliente (autopreenchimento)',
          preenchidoViaLink: true, linkId: LINK_ID, jaPontuouMapeamento: true
        };
        const isLinkNovo = Array.isArray(LINK.produtosPermitidos) || Array.isArray(LINK.produtosBloqueados) || Array.isArray(LINK.produtosNaoTem);
        if (isLinkNovo && PROD_PERMITIDOS.has(p.id)) {
          dados.primeiroMapeamento = { uid: LINK.geradoPorUid || 'cliente', nome: LINK.geradoPorNome || 'Cliente (link)', via: 'link', linkId: LINK_ID, em: new Date().toISOString() };
          produtosPontuar.push(p);
        } else if (!isLinkNovo) {
          produtosPontuar.push(p);
        } else if (PROD_PRE_NAO.has(p.id) && r.tem === 'sim') {
          produtosPontuar.push(p);
        }
        if (r.tem === 'sim') {
          dados.tem = true; dados.statusVisual = 'mapeada';
          dados.vencimentoMes = r.vencimentoMes || null;
          dados.vencimentoAno = r.vencimentoAno || null;
          if (r.vencimentoNaoInformado) dados.vencimentoNaoInformado = true;
          dados.seguradoraAtual = r.seguradora || null;
          dados.valorAnualPago = r.valorAnual || null;
          dados.observacoes = r.observacoes || null;
          const _anexosMeta = await uploadAnexos(p.id);
          if (_anexosMeta.length) { dados.apoliceAnexos = firebase.firestore.FieldValue.arrayUnion.apply(firebase.firestore.FieldValue, _anexosMeta); }
        } else {
          dados.tem = false; dados.naoTemProduto = true;
          if (r.interesse === 'sim') { dados.statusVisual = 'cotando'; dados.interesseCotar = true; cotacoesParaCriar.push(p); }
          else { dados.statusVisual = 'nao_tem'; dados.interesseCotar = false; }
        }
        await db.collection('empresas').doc(LINK.empresaId).collection('mb_produtos').doc(p.id).set(dados, { merge: true });
        produtosSalvos.push(p.id);
      }

      // Cotações no funil (interesse em cotar)
      for (const p of cotacoesParaCriar) {
        await db.collection('mb_cotacoes').add({
          empresaId: LINK.empresaId, empresaNome: LINK.empresaNome || EMPRESA.nome || '',
          produtoId: p.id, produtoNome: p.nome, produtoIcon: p.icon || '📦',
          agenciaId: LINK.agenciaId || EMPRESA.agenciaId || null,
          status: 'solicitada', etapa: 'solicitada', origem: 'oportunidade', chanceFechamento: 'media',
          solicitadoPorUid: LINK.geradoPorUid || null, solicitadoPorNome: LINK.geradoPorNome || 'Cliente (link)',
          observacoes: 'Cliente informou que NÃO tem, mas tem INTERESSE em cotar (via link).', interesseViaLink: true,
          historico: [{ status: 'solicitada', label: 'Iniciada', obs: 'Interesse em cotar via link do cliente', por: 'Cliente', em: new Date().toISOString() }],
          dataSolicitacao: firebase.firestore.FieldValue.serverTimestamp(),
          atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      // Nº funcionários (com histórico)
      const empresaUpdate = { ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp(), ultimoAutorViaLink: true };
      if (numFunc !== null && numFunc > 0) {
        empresaUpdate.numFuncionarios = numFunc;
        if (numFunc !== (EMPRESA.numFuncionarios || 0)) {
          empresaUpdate.funcionariosHistorico = firebase.firestore.FieldValue.arrayUnion({ valor: numFunc, em: new Date().toISOString(), via: 'link', linkId: LINK_ID });
        }
      }
      if (EMPRESA.ultimoLinkMapeamento && EMPRESA.ultimoLinkMapeamento.linkId === LINK_ID) {
        empresaUpdate.ultimoLinkMapeamento = Object.assign({}, EMPRESA.ultimoLinkMapeamento, { status: 'respondido', respondidoEm: new Date().toISOString() });
      }
      await db.collection('empresas').doc(LINK.empresaId).set(empresaUpdate, { merge: true });

      // Marca o link como preenchido
      // Limpa qualquer valor undefined (o Firestore rejeita undefined em update/set)
      const respostasLimpo = JSON.parse(JSON.stringify(respostas));
      await db.collection('mb_links_empresa').doc(LINK_ID).update({
        preenchido: true, preenchidoEm: firebase.firestore.FieldValue.serverTimestamp(),
        respostas: respostasLimpo, produtosRespondidos: produtosSalvos, numFuncionariosInformado: numFunc
      });

      // Pontuação + visita automática (IDÊNTICO ao sistema)
      if (LINK.geradoPorUid) {
        for (const p of produtosPontuar) {
          await db.collection('mb_acoes').add({
            tipo: 'mapeamento_via_link', empresaId: LINK.empresaId, empresaNome: LINK.empresaNome,
            produto: p.id, produtoNome: p.nome, agenciaId: LINK.agenciaId,
            usuarioId: LINK.geradoPorUid, usuarioNome: LINK.geradoPorNome,
            pontos: getPonto('mapear_produto') + getPonto('mapear_extra_link'),
            motivo: 'Cliente preencheu via link de autopreenchimento',
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        try {
          const agora = new Date(); const fim = new Date(agora.getTime() + 60 * 60 * 1000);
          const pad = n => String(n).padStart(2, '0');
          const dataStr = agora.getFullYear() + '-' + pad(agora.getMonth() + 1) + '-' + pad(agora.getDate());
          await db.collection('mb_agendamentos').add({
            tipo: 'visita', modalidade: 'video', empresaId: LINK.empresaId, empresaNome: LINK.empresaNome,
            agenciaId: LINK.agenciaId, gerenteUid: LINK.geradoPorUid, gerenteNome: LINK.geradoPorNome,
            data: dataStr, horaInicio: pad(agora.getHours()) + ':' + pad(agora.getMinutes()),
            horaFim: pad(fim.getHours()) + ':' + pad(fim.getMinutes()), status: 'realizada',
            origem: 'mapeamento_link', autoRegistrada: true,
            observacoes: 'Visita registrada automaticamente: cliente respondeu o questionário de mapeamento pelo link.',
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (evis) { console.warn('visita auto', evis); }
      }

      try { localStorage.removeItem('map_v2_' + LINK_ID); } catch (e) {}
      sucesso();
    } catch (e) {
      console.error(e);
      alert('Erro ao enviar: ' + e.message);
      if (btn){ btn.disabled = false; btn.textContent = 'Enviar para meu gerente'; }
    }
  }
  window.submeter = submeter;

  /* ============ SUCESSO ============ */
  function sucesso(){
    idx = 'fim'; document.getElementById('topo').hidden = true;
    var _s = document.getElementById('salvoTag'); if (_s) _s.classList.remove('on');
    var aviso = FALHAS_ANEXO.length ? '<p style="margin-top:14px; color:#fcd34d; font-size:13px;">⚠ Não conseguimos receber '+(FALHAS_ANEXO.length===1?'o anexo':'os anexos')+': '+FALHAS_ANEXO.join(', ')+'. Suas respostas foram registradas normalmente — se quiser, envie a apólice ao gerente por e-mail/WhatsApp.</p>' : '';
    trocar(
      '<div class="check"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="27"/><path d="M18 31 l8 8 l16-18"/></svg></div>'+
      '<h1>Recebido, obrigado!</h1>'+
