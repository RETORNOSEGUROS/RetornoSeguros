const ehPrincipal = () => papel() === 'principal';

/* ═══════════════ RESPONSÁVEL PELA ASSINATURA ═══════════════
   O aceite digital da seguradora é feito por CPF + data de nascimento + sexo.
   Quem assina pela empresa pode ser um sócio segurado, outro sócio, ou um
   diretor/procurador que não é sócio — e nesse caso ninguém tinha coletado
   os dados dele em lugar nenhum. */
const RESP_TIPOS = [
  ['segurado', 'Um dos sócios que vão ser segurados'],
  ['socio', 'Outro sócio, que não entra no seguro'],
  ['terceiro', 'Um diretor ou procurador que não é sócio']
];
let respRascunho = null;

function secResponsavel() {
  if (!P.contratar) return '';
  const R = P.responsavel;
  if (R && !respRascunho) {
    return `<section class="secao" id="responsavel"><div class="rotulo">Assinatura</div>
      <h2 class="titulo">Quem assina pela empresa</h2>
      <div class="painel">
        <div class="status"><div><b>${esc(R.nome)}</b><small>${esc(R.cargo || '')}${R.cpf ? ' · CPF ' + esc(R.cpf) : ''}</small></div>
          <span class="pill ok">definido</span></div>
        <p class="nota">É esta pessoa que vai fazer o aceite digital da proposta da empresa no site da seguradora.
        ${R.tipo === 'segurado' ? ' Ela também assina o próprio aceite, como segurada.' : ''}</p>
        <button class="btn sec nao-imprime" onclick="editarResponsavel()">Trocar a pessoa</button>
      </div></section>`;
  }
  const d = respRascunho || { tipo: null };
  const segurados = Object.entries(P.aceites || {}).map(([t, a]) => ({ t, id: a.socioId, nome: socio(a.socioId).nome }));
  let campos = '';
  if (d.tipo === 'segurado') {
    campos = `<p class="pergunta">Qual deles?</p><div class="ops">${segurados.map(x =>
      `<button class="op ${d.socioId === x.id ? 'sel' : ''}" onclick="respSet('socioId','${x.id}')">${esc(x.nome)}</button>`).join('')}</div>
      ${d.socioId ? `<p class="nota">Os dados dele vêm do aceite que ele já preenche. Falta só confirmar o cargo e o contato.</p>
      <label class="lbl">Cargo na empresa</label><input class="campo" id="rCargo" value="${esc(d.cargo || '')}" placeholder="Ex.: sócio-administrador" oninput="respSet('cargo',this.value,1)">` : ''}`;
  } else if (d.tipo === 'socio' || d.tipo === 'terceiro') {
    /* Já sabemos o nome e o nascimento de todo sócio da proposta. Fazer o
       cliente digitar de novo o que está duas telas acima é o tipo de atrito
       que faz a pessoa fechar a página. */
    const idsSeg = Object.values(P.aceites || {}).map(a => a.socioId);
    const outros = (P.socios || []).filter(x => !idsSeg.includes(x.id));
    const atalho = (d.tipo === 'socio' && outros.length)
      ? `<p class="pergunta">É um destes?</p><div class="ops">${outros.map(x =>
          `<button class="op ${d.nome === x.nome ? 'sel' : ''}" onclick="respDoSocio('${x.id}')">${esc(x.nome)}</button>`).join('')}</div>
         <p class="nota">Toque no nome e eu preencho o que já sei. Falta o CPF e o contato, que a seguradora exige.</p>`
      : '';
    campos = atalho + `<p class="nota">O aceite digital pede CPF, data de nascimento e sexo de quem assina. Sem isso a seguradora não libera o acesso.</p>
      <label class="lbl">Nome completo</label><input class="campo" id="rNome" value="${esc(d.nome || '')}" oninput="respSet('nome',this.value,1)">
      <label class="lbl">CPF</label><input class="campo" id="rCpf" inputmode="numeric" value="${esc(d.cpf || '')}" oninput="respSet('cpf',mCPFr(this.value),1);this.value=mCPFr(this.value)">
      <label class="lbl">Data de nascimento</label><input class="campo" id="rNasc" type="date" value="${esc(d.nasc || '')}" oninput="respSet('nasc',this.value,1)">
      <p class="pergunta">Sexo</p><div class="ops"><button class="op ${d.sexo === 'M' ? 'sel' : ''}" onclick="respSet('sexo','M')">Masculino</button><button class="op ${d.sexo === 'F' ? 'sel' : ''}" onclick="respSet('sexo','F')">Feminino</button></div>
      <label class="lbl">Cargo na empresa</label><input class="campo" id="rCargo" value="${esc(d.cargo || '')}" placeholder="${d.tipo === 'terceiro' ? 'Ex.: diretor, procurador' : 'Ex.: sócio'}" oninput="respSet('cargo',this.value,1)">
      <label class="lbl">E-mail</label><input class="campo" id="rEmail" type="email" value="${esc(d.email || '')}" oninput="respSet('email',this.value,1)">
      <label class="lbl">Celular</label><input class="campo" id="rCel" inputmode="tel" value="${esc(d.cel || '')}" oninput="respSet('cel',mTelr(this.value),1);this.value=mTelr(this.value)">`;
  }
  const pronto = d.tipo === 'segurado' ? !!d.socioId
    : (d.tipo === 'socio' || d.tipo === 'terceiro') ? !!(d.nome && String(d.cpf || '').replace(/\D/g, '').length === 11 && d.nasc && d.sexo && d.cel) : false;
  return `<section class="secao nao-imprime" id="responsavel"><div class="rotulo">Assinatura</div>
    <h2 class="titulo">Quem vai assinar a proposta <em>pela empresa</em>?</h2>
    <p class="texto">Uma pessoa assina em nome da empresa. Pode ser um dos sócios segurados ou alguém com poderes para assinar.</p>
    <div class="painel">
      <div class="ops">${RESP_TIPOS.map(([v, t]) => `<button class="op largo ${d.tipo === v ? 'sel' : ''}" onclick="respSet('tipo','${v}')">${t}</button>`).join('')}</div>
      ${campos}
      ${d.tipo ? `<button class="btn ouro" ${pronto ? '' : 'disabled'} onclick="salvarResponsavel()">Confirmar quem assina</button>` : ''}
    </div></section>`;
}
/* preenche o rascunho com o que a proposta já sabe daquele sócio */
function respDoSocio(id) {
  const x = (P.socios || []).find(y => y.id === id); if (!x) return;
  respRascunho = Object.assign(respRascunho || { tipo: 'socio' }, { nome: x.nome || '', nasc: x.nascimento || '', cargo: x.papel || '' });
  atualizar();
}
const mCPFr = v => String(v || '').replace(/\D/g, '').slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
const mTelr = v => { const d = String(v || '').replace(/\D/g, '').slice(0, 11); return d.length > 10 ? d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3'); };
function respSet(k, v, semRender) {
  respRascunho = respRascunho || { tipo: null };
  respRascunho[k] = v;
  if (k === 'tipo') { respRascunho = { tipo: v }; }
  if (!semRender) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  else { const b = document.querySelector('#responsavel .btn.ouro'); if (b) b.disabled = !(respRascunho.nome && String(respRascunho.cpf || '').replace(/\D/g, '').length === 11 && respRascunho.nasc && respRascunho.sexo && respRascunho.cel) && respRascunho.tipo !== 'segurado'; }
}
function editarResponsavel() { respRascunho = Object.assign({}, P.responsavel); render(); const el = document.getElementById('responsavel'); if (el) el.scrollIntoView(); }
async function salvarResponsavel() {
  const d = respRascunho || {};
  const R = { tipo: d.tipo, cargo: (d.cargo || '').trim(), definidoPor: (EU && EU.nome) || '', em: new Date().toISOString() };
  if (d.tipo === 'segurado') { R.socioId = d.socioId; R.nome = socio(d.socioId).nome; R.dadosDoAceite = true; }
  else { Object.assign(R, { nome: (d.nome || '').trim(), cpf: d.cpf, nasc: d.nasc, sexo: d.sexo, email: (d.email || '').trim(), cel: d.cel }); }
  P.responsavel = R; respRascunho = null;
  try { await gravar({ responsavel: R }); toast('Anotado'); } catch (e) { toast('Não foi possível gravar agora'); console.warn(e); }
  render(); const el = document.getElementById('responsavel'); if (el) el.scrollIntoView();
}

/* ═══════════════ ACOMPANHAMENTO ═══════════════
   Da transmissão à apólice. Quem marca cada etapa é a corretora, pelo editor —
   a seguradora não conversa com este sistema. O cliente só lê. */
const ACEITE_LINK = 'https://www.bradescoseguros.com.br/clientes/produtos/seguro-de-vida/aceite-digital-de-propostas';
const PASSOS_ACEITE = [
  'Abrir o link do aceite digital',
  'Informar CPF, data de nascimento e sexo e clicar em acessar',
  'Receber por SMS o código de acesso, no celular de quem está assinando',
  'Informar o código e entrar — aparecem as propostas sob sua responsabilidade',
  'Clicar no 👁 para abrir o documento e escolher o aceite digital',
  'Clicar em aceitar e finalizar — e conferir se todas as propostas foram assinadas'
];

/* ═══════════════ ACOMPANHAMENTO, POR PRODUTO ═══════════════
   Pessoa Chave e Resgatável são dois produtos, dois processos SUSEP e, na
   prática, DUAS propostas na seguradora: dois aceites da empresa, dois aceites
   por segurado, dois boletos e duas análises, que podem terminar diferente
   (as regras de idade não são as mesmas). Por isso `etapas` é `etapas.pc` e
   `etapas.rg`. Proposta marcada antes disso, com as etapas soltas na raiz,
   continua aparecendo quando só existe um produto contratado. */
const PRODS = [['pc', 'Pessoa Chave'], ['rg', 'Resgatável Único']];
function produtosNaProposta() {
  const c = (P.contratar && P.contratar.itens) || null;
  const marcado = k => !c || Object.values(c).some(v => v && v[k]);
  return PRODS.filter(([k]) => (k === 'pc' ? itensPC().length : itensRG().length) && marcado(k));
}
function etapasDe(k) {
  const E = P.etapas || {};
  if (E[k]) return E[k];
  const legado = Object.keys(E).some(x => x !== 'pc' && x !== 'rg');
  return (legado && produtosNaProposta().length === 1) ? E : {};
}
function aceitesDe(k) { return Object.entries(P.aceites || {}).filter(([, a]) => a[k]); }
function algumaEtapa(campo) { return produtosNaProposta().some(([k]) => etapasDe(k)[campo]); }

function secAcompanhamento() {
  const prods = produtosNaProposta();
  if (!P.contratar && !algumaEtapa('transmitida')) return '';
  const varios = prods.length > 1;
  const faltaAceite = prods.some(([k]) => {
    const E = etapasDe(k), ac = aceitesDe(k);
    return !!E.transmitida && !(E.aceiteEmpresa && ac.length && ac.every(([, a]) => (E.aceiteSegurados || {})[a.socioId]));
  });
  return `<section class="secao" id="acompanhamento"><div class="rotulo">Acompanhamento</div>
    <h2 class="titulo">Em que pé está</h2>
    ${varios ? `<p class="texto">São <b>duas propostas na seguradora</b>, uma para cada produto. Cada uma tem o próprio aceite, o próprio boleto e a própria análise — e elas andam em ritmos diferentes.</p>` : ''}
    ${prods.map(([k, nome]) => blocoProduto(k, nome, varios)).join('')}
    ${faltaAceite ? `<h3 class="sub">Como fazer o aceite digital</h3><div class="painel">
      <p class="texto" style="font-size:14px">Cada pessoa faz o seu, pelo celular, e leva uns 2 minutos.${varios ? ' <b>É um aceite por proposta</b> — quem entra nos dois produtos faz duas vezes, no mesmo site.' : ''}</p>
      <ul class="passos">${PASSOS_ACEITE.map((t, i) => `<li><span class="n">${i + 1}</span><span>${t}</span></li>`).join('')}</ul>
      <div class="aviso-tempo">⏱ O código do SMS vale <b>5 minutos</b>. Só peça quando estiver com o celular na mão — se expirar, é só pedir outro.</div>
      <div class="linha-btns nao-imprime">
        <a class="btn" target="_blank" rel="noopener" href="${ACEITE_LINK}">Abrir o aceite digital</a>
        <button class="btn sec" onclick="copiarPassosAceite()">Copiar as instruções</button>
      </div></div>` : ''}
  </section>`;
}

function blocoProduto(k, nome, varios) {
  const E = etapasDe(k);
  const aceites = aceitesDe(k);
  const preenchidos = aceites.filter(([, a]) => a.status === 'preenchido').length;
  const fim = E.resultado && E.resultado.tipo;
  const li = (feito, titulo, quando, detalhe, atual, ajuda) => `<li class="etapa ${feito ? 'ok' : atual ? 'agora' : ''}">
      <span class="marca">${feito ? '✓' : atual ? '•' : ''}</span>
      <div><b>${titulo}${ajuda ? ` <button class="i-et" onclick="abrirFolha('comoaceite')" title="Como fazer o aceite digital">i</button>` : ''}</b>${quando ? `<small>${dataHoraBR(quando)}</small>` : ''}${detalhe ? `<small>${detalhe}</small>` : ''}</div>
    </li>`;
  const listaAceites = aceites.map(([t, a]) => {
    const n = primeiro(socio(a.socioId).nome) || a.nome;
    const ok = (E.aceiteSegurados || {})[a.socioId];
    return `<span class="mini ${ok ? 'ok' : ''}">${esc(n)} ${ok ? '✓' : '·'}</span>`;
  }).join(' ');

  let passos = '';
  passos += li(preenchidos === aceites.length && aceites.length, 'Dados e declaração de saúde', null,
    `${preenchidos} de ${aceites.length} ${aceites.length === 1 ? 'sócio preencheu' : 'sócios preencheram'}`, preenchidos < aceites.length);
  passos += li(!!E.transmitida, 'Proposta transmitida à seguradora', E.transmitida, null, preenchidos === aceites.length && !E.transmitida);
  /* Os dois aceites são INDEPENDENTES: a seguradora libera os dois assim que a
     proposta é transmitida, e nada obriga a empresa a assinar antes dos sócios.
     Mostrar um esperando o outro fazia a família esperar sem motivo. */
  const liberado = !!E.transmitida;
  passos += li(!!E.aceiteEmpresa, 'Aceite digital da empresa', E.aceiteEmpresa,
    P.responsavel ? 'por ' + esc(P.responsavel.nome) : 'falta definir quem assina', liberado && !E.aceiteEmpresa, true);
  const todosAceites = aceites.length && aceites.every(([, a]) => (E.aceiteSegurados || {})[a.socioId]);
  passos += li(!!todosAceites, 'Aceite digital de cada segurado', null, listaAceites, liberado && !todosAceites, true);
  passos += li(!!E.boletoEnviado, 'Boleto gerado e enviado', E.boletoEnviado,
    k === 'rg' ? 'pagamento único, um boleto para a empresa' : 'um boleto único para a empresa', !!todosAceites && !E.boletoEnviado);
  passos += li(!!E.boletoPago, 'Pagamento confirmado', E.boletoPago, null, !!E.boletoEnviado && !E.boletoPago);
  if (E.teleentrevista) passos += li(!!E.teleentrevista.feita, 'Tele-entrevista da seguradora', E.teleentrevista.feita,
    E.teleentrevista.quem ? 'com ' + esc(E.teleentrevista.quem) : 'a seguradora liga para confirmar dados de saúde', !E.teleentrevista.feita);
  /* Resultado por sócio: o cliente vê aceito / não aceito, NUNCA o motivo.
     O motivo é saúde, e os sócios não têm que saber a saúde uns dos outros. */
  const rs = E.resultadoSocios || {};
  if (Object.keys(rs).length) {
    const linha = aceites.map(([t, a]) => {
      const r = rs[a.socioId] || {}; const n = primeiro(socio(a.socioId).nome) || a.nome;
      const cl = r.tipo === 'aceito' ? 'ok' : r.tipo === 'agravo' ? 'ok' : r.tipo === 'declinado' ? 'nao' : '';
      const mk = r.tipo === 'aceito' ? '✓' : r.tipo === 'agravo' ? '✓' : r.tipo === 'declinado' ? '✕' : '·';
      return `<span class="mini ${cl}">${esc(n)} ${mk}</span>`;
    }).join(' ');
    passos += li(true, 'Resposta da seguradora, sócio a sócio', null, linha);
  }
  passos += li(!!fim, 'Apólice', E.resultado && E.resultado.em,
    fim === 'emitida' ? 'emitida' + (E.resultado.apolice ? ' · nº ' + esc(E.resultado.apolice) : '')
      : fim === 'agravo' ? 'emitida com condições especiais' : fim === 'declinada' ? 'não aceita pela seguradora' : null, !!E.boletoPago && !fim);
  /* Quando a apólice sai, o cliente quer os dois PDFs no mesmo lugar em que
     acompanhou tudo — e não procurando um e-mail de três meses atrás. */
  const docs = (E.documentos || []).filter(x => x && x.url);
  const docsHtml = (fim === 'emitida' || fim === 'agravo')
    ? (docs.length
      ? `<h3 class="sub">Documentos${varios ? ' · ' + esc(nome) : ''}</h3><div class="painel">
          ${docs.map(x => `<div class="status"><div><b>${esc(x.rotulo || x.nome || 'Documento')}</b><small>${esc(x.nome || '')}${x.em ? ' · ' + dataBR(x.em) : ''}</small></div>
            <a class="btn sec" target="_blank" rel="noopener" href="${esc(x.url)}">Abrir</a></div>`).join('')}</div>`
      : `<div class="painel"><p class="nota">A via da proposta e a apólice em PDF ficam aqui assim que a corretora anexar. Se precisar antes, é só pedir.</p></div>`)
    : '';

  const pend = (E.pendencias || []).filter(x => !x.resolvidoEm);
  const et = estadoProduto(k);
  return `<div class="prod-bloco">
    ${varios ? `<div class="prod-cab"><span class="prod-n ${k}">${esc(nome)}</span><span class="prod-e ${esc(et.c)}">${esc(et.t)}</span></div>` : ''}
    <div class="painel"><ul class="linha-tempo">${passos}</ul></div>
    ${pend.length ? `<h3 class="sub">Pendências da seguradora${varios ? ' · ' + esc(nome) : ''}</h3><div class="painel">
      ${pend.map(x => `<div class="status"><div><b>${esc(x.socioId ? socio(x.socioId).nome : 'Empresa')}</b><small>${esc(x.texto)}</small></div>
        <span class="pill al">pedido em ${dataBR(x.em)}</span></div>`).join('')}
      <p class="nota">Enquanto a pendência não é resolvida, a seguradora não conclui a análise desta proposta.</p></div>` : ''}
    ${docsHtml}
    ${secCaminhoRecusa(E, aceites)}
  </div>`;
}
function estadoProduto(k) {
  const E = etapasDe(k);
  if (E.resultado && E.resultado.tipo) return { t: { emitida: 'Apólice emitida', agravo: 'Emitida com condições', declinada: 'Não aceita' }[E.resultado.tipo] || 'Concluída', c: E.resultado.tipo === 'declinada' ? 'nao' : 'ok' };
  if ((E.pendencias || []).some(x => !x.resolvidoEm)) return { t: 'Com pendência', c: 'al' };
  if (E.boletoPago) return { t: 'Pago, aguardando apólice', c: '' };
  if (E.transmitida) return { t: 'Em análise na seguradora', c: '' };
  return { t: 'Aguardando transmissão', c: '' };
}

/* Quando a seguradora recusa alguém, o pior desfecho é a empresa ficar sem nada
   porque ninguém deu o próximo passo. O caminho escolhido pela corretora aparece
   aqui, em linguagem de dono — sem motivo de saúde de ninguém. */
const CAMINHO_TXT = {
  seguir: ['Vamos seguir com quem foi aceito',
    'A apólice sai para os sócios aceitos, e a inclusão de quem faltou é tratada à parte. Ninguém fica descoberto enquanto isso.'],
  recotar: ['Vamos tentar um valor menor',
    'Para quem não foi aceito, uma cobertura menor costuma passar. A corretora está refazendo essa parte e volta com o número.'],
  carencia: ['Vamos pela versão sem questionário de saúde',
    'Existe uma versão que dispensa o questionário. Em troca, a cobertura por doença começa a valer depois de 24 meses — acidente vale desde o primeiro dia. A corretora explica antes de qualquer decisão.']
};
function secCaminhoRecusa(E, aceites) {
  const sr = E.saidaRecusa; if (!sr || !CAMINHO_TXT[sr.tipo]) return '';
  const rs = E.resultadoSocios || {};
  const fora = aceites.filter(([, a]) => (rs[a.socioId] || {}).tipo === 'declinado').map(([, a]) => primeiro(socio(a.socioId).nome));
  const dentro = aceites.filter(([, a]) => ['aceito', 'agravo'].includes((rs[a.socioId] || {}).tipo)).map(([, a]) => primeiro(socio(a.socioId).nome));
  const t = CAMINHO_TXT[sr.tipo];
  return `<h3 class="sub">O caminho daqui</h3><div class="painel">
    ${fora.length ? `<p class="texto" style="font-size:14px">A seguradora não aceitou a inclusão de <b>${esc(listaNomes(fora))}</b>${dentro.length ? ` e aceitou <b>${esc(listaNomes(dentro))}</b>` : ''}.</p>` : ''}
    <div class="caminho"><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div>
    <p class="nota">A seguradora avalia caso a caso e não informa o motivo a terceiros. Quem quiser entender a própria análise fala direto com a corretora.</p>
  </div>`;
}
function copiarPassosAceite() {
  const L = ['Aceite digital da proposta — leva 2 minutos, pelo celular.', ''];
  PASSOS_ACEITE.forEach((t, i) => L.push((i + 1) + '. ' + t.replace(/<[^>]+>/g, '')));
  L.push('', 'O código do SMS vale 5 minutos. Se expirar, peça outro.', '', ACEITE_LINK);
  copiar(L.join('\n'), 'Instruções copiadas');
}

/* ═══════════════════ INÍCIO ═══════════════════ */
async function registrarAcesso() {
  if (DEMO || !db || !PID) return;
  const agora = new Date().toISOString();
  if (!VTOK) {   // aberta pelo link do painel (?t=): registra só a abertura
    try { await db.collection('mb_propostas').doc(PID).set({ aberta: true, ultimoAcesso: agora, ultimoAcessoPor: { nome: (EU && EU.nome) || '', papel: papel() } }, { merge: true }); } catch (e) { console.warn('acesso', e); }
    return;
  }
  try {
    await db.collection('mb_propostas').doc(PID).update({
      aberta: true,
      ['convidados.' + VTOK + '.ultimo']: agora,
      ['convidados.' + VTOK + '.aberturas']: FV().increment(1),
      ultimoAcesso: agora,
      ultimoAcessoPor: { nome: EU.nome || '', papel: papel() },
      acessos: FV().arrayUnion({ tok: VTOK, nome: EU.nome || '', papel: papel(), em: agora })
    });
  } catch (e) { console.warn('acesso', e); }
}
function pararErro(t) { document.getElementById('app').innerHTML = `<div class="carregando">${t}<br><br><button class="btn sec" style="max-width:280px;margin:0 auto" onclick="falarCorretora()">Falar com a corretora</button></div>`; }

(async function iniciar() {
  const hash = location.hash;
  if (hash.startsWith('#dados=')) {
    try { P = JSON.parse(decodeURIComponent(escape(atob(hash.slice(7))))); DEMO = true; } catch (e) { pararErro('Não foi possível ler os dados da pré-visualização.'); return; }
  } else {
    const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
    if (fbOk && (PID || TOKP)) {
      try {
        await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
        if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
        db = firebase.firestore();
        if (PID === 'demo') {
          pararErro('Este link saiu de uma <b>pré-visualização</b>, então não existe proposta salva por trás dele.<br><br>No editor, clique em <b>Salvar e gerar link</b> e use o link da proposta salva.');
          return;
        }
        if (!PID && TOKP) {   // link gerado pelo painel: acha a proposta pelo campo token
          const q = await db.collection('mb_propostas').where('token', '==', TOKP).limit(1).get();
          if (q.empty) { pararErro('Não encontramos esta proposta. Confira o link.'); return; }
          PID = q.docs[0].id;
        }
        const d = await db.collection('mb_propostas').doc(PID).get();
        if (!d.exists) { pararErro('Não encontramos esta proposta. Confira o link.'); return; }
        P = d.data();
      } catch (e) { console.warn(e); pararErro('Não foi possível abrir a proposta agora. Tente de novo em instantes.'); return; }
    } else { P = JSON.parse(JSON.stringify(DEMO_DADOS)); DEMO = true; }
  }
  P.convidados = P.convidados || {}; P.checklist = P.checklist || {}; P.aceites = P.aceites || {};
  /* Proposta publicada pelo leitor de PDF do painel não tem a estrutura desta página
     (socios / pessoaChave / resgatavel / analise). Avisa em vez de abrir quebrada. */
  if (!DEMO) {
    if (!P.empresa) P.empresa = { nome: P.empresaNome || '', cnpj: P.cnpj || '', cidade: '' };
    const temEstrutura = Array.isArray(P.socios) && P.socios.length &&
      ((P.pessoaChave && (P.pessoaChave.itens || []).length) || (P.resgatavel && (P.resgatavel.itens || []).length));
    if (!temEstrutura) { pararErro('Esta proposta ainda não foi montada no formato Vida Sócios. Peça à corretora para republicar pelo editor de propostas.'); return; }
    if (!P.destinatario) P.destinatario = { nome: (P.socios[0] || {}).nome || '', socioId: (P.socios[0] || {}).id };
  }
  if (DEMO) {
    const pp = params.get('papel') || 'principal';
    EU = pp === 'principal' ? { nome: P.destinatario && P.destinatario.nome, papel: 'principal', socioId: P.destinatario && P.destinatario.socioId } : { nome: pp === 'socio' ? 'Rafael Moraes' : pp === 'contador' ? 'Marcos (contador)' : 'Dra. Ana (advogada)', papel: pp, socioId: pp === 'socio' ? 's2' : null, convidadoPor: P.destinatario && P.destinatario.nome };
  } else {
    EU = VTOK ? P.convidados[VTOK] : { nome: (P.destinatario && P.destinatario.nome) || '', papel: 'principal', socioId: P.destinatario && P.destinatario.socioId };
    if (!EU) { pararErro('Este link não é mais válido. Peça um novo à corretora.'); return; }
  }
  render();
  registrarAcesso();
  carregarOrigem();                 // o bloco "por que vocês pediram isso" chega depois, sem travar a página
  if (location.hash && location.hash.length < 30) {
    const k = location.hash.slice(1);
    if (FOLHAS[k]) setTimeout(() => abrirFolha(k), 250);
    else { const el = document.querySelector(location.hash); if (el) setTimeout(() => el.scrollIntoView(), 200); }
  }
})();
</script>
