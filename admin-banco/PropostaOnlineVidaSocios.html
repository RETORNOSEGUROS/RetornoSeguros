<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --escuro:#050e24; --azul:#1d4ed8; --ciano:#38bdf8; --dourado:#fbbf24;
          --tinta:#0f172a; --suave:#64748b; --linha:#e6ebf5; --fundo:#f4f7fc; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--fundo); color:var(--tinta); }

  /* ---- topo ---- */
  .hero { background:linear-gradient(160deg,#050e24,#0f2555 58%,#1e40af);
    color:#fff; padding:calc(26px + env(safe-area-inset-top)) 22px 70px; position:relative; overflow:hidden; }
  .hero::after { content:''; position:absolute; width:60vw; height:60vw; border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,.24),transparent 70%); top:-25%; right:-18%; filter:blur(40px); }
  .hero-in { max-width:760px; margin:0 auto; position:relative; z-index:1; }
  .marca { font-size:10.5px; letter-spacing:.22em; color:#93c5fd; font-weight:700; text-transform:uppercase; }
  .h-prod { font-size:clamp(22px,5vw,32px); font-weight:800; margin-top:12px; line-height:1.2; letter-spacing:-.02em; }
  .h-emp { font-size:14px; color:#c7d7f5; margin-top:6px; font-weight:400; }
  .h-seg { display:inline-flex; align-items:center; gap:7px; margin-top:16px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16); border-radius:100px; padding:6px 14px; font-size:12.5px; font-weight:600; }
  .validade { margin-top:14px; font-size:12.5px; color:#fcd34d; font-weight:600; }
  .validade.vencida { color:#fca5a5; }

  /* ---- corpo ---- */
  .corpo { max-width:760px; margin:-48px auto 0; padding:0 18px calc(40px + env(safe-area-inset-bottom)); position:relative; z-index:2; }
  .card { background:#fff; border-radius:16px; padding:22px; margin-bottom:14px;
    box-shadow:0 4px 22px rgba(15,23,42,.07); border:1px solid var(--linha); }
  .rot { font-size:10.5px; letter-spacing:.16em; color:var(--suave); font-weight:700; text-transform:uppercase; margin-bottom:12px; }
  .valorao { font-size:clamp(28px,7.5vw,42px); font-weight:800; letter-spacing:-.03em; color:var(--tinta); line-height:1.05; }
  .valorao small { font-size:15px; font-weight:600; color:var(--suave); letter-spacing:0; }
  .sub { font-size:12.5px; color:var(--suave); margin-top:7px; line-height:1.5; }

  .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:16px; }
  .mini { background:var(--fundo); border-radius:11px; padding:12px 14px; }
  .mini b { display:block; font-size:10px; color:var(--suave); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .mini span { font-size:15px; font-weight:700; color:var(--tinta); display:block; margin-top:3px; }

  /* cartão de capital */
  .capital { border:1.5px solid #93c5fd; background:linear-gradient(160deg,#eff6ff,#eef2ff); }
  .capital .valorao { color:#1e3a8a; }
  .capital .selo { margin-top:10px; font-size:13px; color:#1d4ed8; font-weight:700; }
  .total-lin { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    margin-top:16px; padding-top:15px; border-top:1px dashed #bfdbfe; }
  .total-lin span { font-size:13px; color:#1d4ed8; font-weight:600; }
  .total-lin b { font-size:22px; font-weight:800; color:#1e3a8a; white-space:nowrap; }

  /* sócio */
  .socio { border:1px solid var(--linha); border-radius:14px; padding:0; margin-bottom:12px; background:#fff; overflow:hidden; }
  .socio:last-child { margin-bottom:0; }
  /* faixa azul com o nome — diferencia cada sócio de relance */
  .socio-cab { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;
    background:linear-gradient(135deg,#1d4ed8,#1e3a8a); padding:13px 16px; }
  .socio-nome { font-size:16px; font-weight:800; color:#fff; }
  .socio-meta { font-size:12px; color:#c7d7f5; margin-top:2px; }
  .socio-premio { text-align:right; }
  .socio-premio b { font-size:16px; font-weight:800; color:#fff; white-space:nowrap; }
  .socio-premio span { display:block; font-size:10.5px; color:#bfdbfe; font-weight:600; }
  .cob { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:10px 16px; border-top:1px solid #f1f5f9; }
  .cob:first-of-type { border-top:none; padding-top:12px; }
  .cob:last-child { padding-bottom:13px; }
  .cob-nome { font-size:13.5px; color:var(--tinta); font-weight:600; }
  .cob-car { font-size:11px; color:var(--suave); font-weight:500; margin-left:6px; }
  .cob-cap { font-size:14px; font-weight:800; color:#1e3a8a; white-space:nowrap; }

  /* coberturas explicadas */
  .proc { display:flex; gap:11px; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--linha); }
  .proc:last-child { border-bottom:none; }
  .proc-ic { width:22px; height:22px; border-radius:50%; background:#dbeafe; color:#1d4ed8; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-top:1px; }
  .proc-tx b { display:block; font-size:14px; font-weight:700; color:var(--tinta); line-height:1.35; }
  .proc-tx i { font-style:normal; display:block; font-size:12.5px; color:#475569; line-height:1.55; margin-top:3px; }

  .info-linha { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--linha); font-size:13.5px; }
  .info-linha:last-child { border-bottom:none; }
  .info-linha b { min-width:150px; color:var(--tinta); font-weight:700; }
  .info-linha span { color:#475569; line-height:1.55; }

  .aviso { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:14px 16px;
    font-size:12.5px; color:#92400e; line-height:1.6; }

  .acoes { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .btn { padding:16px 26px; border-radius:14px; border:none; cursor:pointer; font-size:15px; font-weight:800;
    font-family:inherit; transition:all .2s; width:100%; }
  .btn-ok { background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; }
  .btn-ok:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(29,78,216,.28); }
  .btn-2 { background:#fff; color:var(--tinta); border:1.5px solid var(--linha); }
  .btn-2:hover { border-color:var(--ciano); }

  .rodape { text-align:center; font-size:11px; color:#94a3b8; margin-top:22px; line-height:1.7; }

  .carregando, .erro { max-width:520px; margin:22vh auto; text-align:center; padding:0 24px; }
  .erro h2 { font-size:20px; margin-bottom:8px; }
  .erro p { font-size:14px; color:var(--suave); line-height:1.6; }

  .modal { position:fixed; inset:0; background:rgba(5,14,36,.62); display:none; align-items:flex-end;
    justify-content:center; z-index:50; padding:0; }
  .modal.on { display:flex; }
  .modal-cx { background:#fff; border-radius:20px 20px 0 0; padding:24px 22px calc(24px + env(safe-area-inset-bottom));
    width:100%; max-width:520px; animation:sobe .3s cubic-bezier(.16,1,.3,1); }
  @keyframes sobe { from{transform:translateY(100%);} to{transform:none;} }
  .campo { width:100%; padding:14px 16px; border:1.5px solid var(--linha); border-radius:12px; font-size:15px;
    font-family:inherit; margin-bottom:11px; }
  .campo:focus { outline:none; border-color:var(--ciano); }
  .lbl { font-size:12px; color:var(--suave); font-weight:600; display:block; margin-bottom:6px; }

  @media (min-width:640px) { .modal { align-items:center; } .modal-cx { border-radius:20px; } }
</style>

<body>
<div id="app"><div class="carregando"><div style="font-size:34px;">🛡️</div><p style="color:#64748b; margin-top:10px;">Carregando sua proposta…</p></div></div>

<div class="modal" id="modal">
  <div class="modal-cx">
    <div class="rot" id="mTit">Confirmar interesse</div>
    <div id="mOpcoes" style="display:none; margin-bottom:14px;">
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('valor')">💰 O valor ficou acima do esperado</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('capital')">🎯 Quero ajustar o capital de cada sócio</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('socios')">🤝 Preciso alinhar com os outros sócios</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('clausula')">📜 Quero entender a cláusula no contrato social</button>

    <label class="lbl">Seu nome</label>
    <input class="campo" id="mNome" placeholder="Nome completo">
    <label class="lbl">Telefone / WhatsApp</label>
    <input class="campo" id="mTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
    <label class="lbl">Mensagem <span style="font-weight:400;">(opcional)</span></label>
    <textarea class="campo" id="mMsg" rows="3" placeholder="Alguma dúvida ou observação?"></textarea>
    <button class="btn btn-ok" id="mOk">Enviar</button>
    </div>
    <button class="btn btn-2" style="margin-top:9px;" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   PROPOSTA ONLINE VIDA SÓCIOS — visão do cliente
   Lê uma proposta (mb_propostas) cadastrada pelo corretor a partir da
   cotação Bradesco Vida (Empresarial Flexível: Pessoa Chave ou
   Resgatável) e apresenta o CAPITAL PROTEGIDO da sociedade, cada sócio
   com suas coberturas e prêmio, e o total anual. Sem termômetro: aqui é
   a proposta fechada, não o diagnóstico.
   ══════════════════════════════════════════════════════════════════ */
const ARQ_VERSAO = '6';
window.ARQ_VERSAO = ARQ_VERSAO;
console.log('%cProposta Online Vida Sócios v' + ARQ_VERSAO, 'background:#1d4ed8;color:#fff;padding:2px 8px;border-radius:4px;font-weight:700');

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let P = null, DOC_ID = null;
const $ = id => document.getElementById(id);
const fmt = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const fmtCap = v => {
  v = Number(v || 0);
  if (v >= 1e6) { const m = v / 1e6; return 'R$ ' + m.toLocaleString('pt-BR', { maximumFractionDigits: (m % 1 ? 1 : 0) }) + (m >= 2 ? ' milhões' : ' milhão'); }
  if (v >= 1e3) return 'R$ ' + Math.round(v / 1e3) + ' mil';
  return fmt0(v);
};
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sexoTxt = s => s === 'M' ? 'Masculino' : s === 'F' ? 'Feminino' : '';

function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  el.value = d.length > 7 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`
           : d.length > 2 ? `(${d.slice(0,2)}) ${d.slice(2)}`
           : d.length > 0 ? `(${d}` : '';
}
window.mascaraTel = mascaraTel;

/* Coberturas: o corretor não escreve nada — o sistema reconhece o nome
   que veio da cotação e explica o que aquilo significa na prática. */
const DIC_VIDA = [
  [/morte/i, 'O capital é pago no falecimento do sócio — no Pessoa Chave à própria empresa, para recomprar as cotas; no Resgatável à família, fora do inventário. É o coração da proteção sucessória.'],
  [/invalidez|acidente/i, 'Indenização se um acidente causar invalidez permanente, total ou parcial — paga ao próprio sócio, em vida.'],
  [/doen[çc]as graves/i, 'Adiantamento do capital ao próprio sócio no diagnóstico de doença grave prevista em contrato (como câncer, infarto ou AVC). Carência de 6 meses.'],
  [/funeral/i, 'Assistência ou capital para as despesas de funeral, liberado com rapidez para a família — sem depender de inventário.']
];
function descrever(nome) {
  for (const [re, txt] of DIC_VIDA) if (re.test(nome)) return txt;
  return '';
}

/* ── Resgate ano-a-ano (Resgatável) — tabela REAL da seguradora.
   O % de resgate é estimativa IGUAL para qualquer idade, extraída de cotações
   reais (prints), escalada pelo prêmio real de cada modo. A inflação informada
   pelo cliente é SOMADA ao resgate do print: resgate = resgate_print × (1+i)^ano.
   Comportamento do prêmio pago: mensal acumula todo mês, anual todo ano,
   único é pago uma vez e nunca mais. ── */
const RESG_RATIO = {
  unico:  [0.85219, 0.86648, 0.88058, 0.89447, 0.90810, 0.92143, 0.93443, 0.94711, 0.95948, 0.97158],
  anual:  [0.54487, 0.53602, 0.53253, 0.53020, 0.52823, 0.52635, 0.52442, 0.52239, 0.52024, 0.51792],
  mensal: [0.54487, 0.53602, 0.53253, 0.53020, 0.52823, 0.52635, 0.52442, 0.52239, 0.52024, 0.51792]
};
const _capMorte = s => { const c = (s.cob || []).find(x => /morte/i.test(x.nome || '')); return c ? Number(c.capital || 0) : Number(s.capitalSeg || 0); };
// prêmio de UM modo para o contrato inteiro (soma dos sócios), vindo do PDF real
function _premioModo(segs, modo) { if (!segs.length) return null; if (!segs.every(s => s.premios && s.premios[modo] > 0)) return null; return segs.reduce((t, s) => t + s.premios[modo], 0); }
// montante pago acumulado até o fim do ano `ano`
function _pagoAcum(modo, premioModo, ano) { if (modo === 'unico') return premioModo; if (modo === 'mensal') return premioModo * 12 * ano; return premioModo * ano; }
function projetarResgate(segs, modo, inflPct, premioModo) {
  const g = inflPct / 100, anos = 10, L = [];
  const capBase = segs.reduce((t, s) => t + _capMorte(s), 0);
  const ratio = RESG_RATIO[modo] || RESG_RATIO.anual;
  // âncora manual opcional: se o corretor informou o resgate real do ano 10, escala a curva pra bater
  let escala = 1;
  if (P.resgateAno10 && P.resgateAno10[modo] > 0 && premioModo) {
    const base10 = ratio[9] * _pagoAcum(modo, premioModo, 10);
    if (base10 > 0) escala = P.resgateAno10[modo] / base10;
  }
  for (let i = 1; i <= anos; i++) {
    const pago = _pagoAcum(modo, premioModo, i);
    const resgBase = ratio[i - 1] * pago * escala;      // resgate do print (sem inflação)
    const resg = resgBase * Math.pow(1 + g, i);          // inflação somada ao resgate
    const cap = capBase * Math.pow(1 + g, i - 1);
    L.push({ ano: i, pago: pago, resgBase: resgBase, resg: resg, cap: cap });
  }
  return L;
}
const _kfmtSim = v => v >= 1e6 ? 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : v >= 1e3 ? 'R$ ' + Math.round(v / 1e3) + ' mil' : 'R$ ' + Math.round(v);
const _rfmtSim = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const _MESES_SIM = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function _periodoLabel(P, i) {
  // deriva mês/ano da data da cotação; ano 1 = ~12 meses depois. Sem data → "Ano i"
  const m = String(P.data || P.validade || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return 'Ano ' + i;
  const mes = Math.min(12, Math.max(1, parseInt(m[2], 10)));
  return _MESES_SIM[mes - 1] + '/' + (parseInt(m[3], 10) + i);
}
function _svgSimL(L) {
  const W = 340, H = 176, pl = 40, pr = 10, pt = 10, pb = 22, n = L.length;
  const xs = L.map((_, i) => pl + (W - pl - pr) * i / (n - 1));
  const maxV = Math.max.apply(null, L.map(r => Math.max(r.pago, r.resg))) || 1;
  const y = v => pt + (H - pt - pb) * (1 - v / maxV);
  const linha = (k, c) => `<polyline fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" points="${L.map((r, i) => xs[i].toFixed(1) + ',' + y(r[k]).toFixed(1)).join(' ')}"/>`;
  const pts = (k, c) => L.map((r, i) => `<circle cx="${xs[i].toFixed(1)}" cy="${y(r[k]).toFixed(1)}" r="2.1" fill="${c}"/>`).join('');
  let grid = ''; for (let k = 0; k <= 3; k++) { const gv = maxV * k / 3, gy = y(gv); grid += `<line x1="${pl}" y1="${gy.toFixed(1)}" x2="${W - pr}" y2="${gy.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/><text x="${pl - 4}" y="${(gy + 3).toFixed(1)}" text-anchor="end" font-size="8" fill="#94a3b8">${_kfmtSim(gv)}</text>`; }
  let xl = ''; [0, Math.floor(n / 2) - 1, n - 1].forEach(i => { if (i >= 0) xl += `<text x="${xs[i].toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="8" fill="#94a3b8">ano ${i + 1}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;">${grid}${xl}${linha('pago', '#d97706')}${linha('resg', '#2563eb')}${pts('pago', '#d97706')}${pts('resg', '#2563eb')}</svg>`;
}
function montarSimResgate(segs) {
  const _MT = { mensal: 'Mensal', anual: 'Anual', unico: 'Único' };
  const modosP = (P.pagamentoModos && P.pagamentoModos.length) ? P.pagamentoModos : ['mensal', 'anual', 'unico'];
  const ordem = ['unico', 'anual', 'mensal'].filter(m => modosP.indexOf(m) >= 0);
  const comPremio = ordem.filter(m => _premioModo(segs, m) != null);
  const usar = comPremio.length ? comPremio : ordem;
  const st = { modo: usar[0] || 'unico', inflacao: 5 };
  const box = document.getElementById('srModos');
  if (box) box.innerHTML = usar.map(m => `<button data-m="${m}" style="flex:1; padding:11px; border-radius:10px; border:1.5px solid #e2e8f0; background:#fff; color:#334155; font-weight:700; font-size:13px; cursor:pointer;">${_MT[m]}</button>`).join('');
  const selBtn = () => document.querySelectorAll('#srModos [data-m]').forEach(b => { const on = b.dataset.m === st.modo; b.style.borderColor = on ? '#1d4ed8' : '#e2e8f0'; b.style.background = on ? '#eff6ff' : '#fff'; b.style.color = on ? '#1e3a8a' : '#334155'; });
  const draw = () => {
    const pm = _premioModo(segs, st.modo);
    const tab = document.getElementById('srTab');
    if (pm == null) {
      if (tab) tab.innerHTML = `<tr><td colspan="3" style="padding:14px 2px;color:#94a3b8;font-size:12px;text-align:center;">O prêmio deste modo não veio na cotação — anexe o PDF do modo <strong>${_MT[st.modo]}</strong> para ver o resgate.</td></tr>`;
      document.getElementById('srChart').innerHTML = '';
      document.getElementById('srPunch').innerHTML = '';
      selBtn(); return;
    }
    const L = projetarResgate(segs, st.modo, st.inflacao, pm), y10 = L[L.length - 1];
    document.getElementById('srChart').innerHTML = _svgSimL(L);
    if (tab) tab.innerHTML = L.map(r => `<tr>
        <td style="text-align:left;color:#64748b;padding:6px 2px;">${_periodoLabel(P, r.ano)}</td>
        <td style="text-align:right;color:#b45309;padding:6px 2px;">${_rfmtSim(r.pago)}</td>
        <td style="text-align:right;color:#1d4ed8;font-weight:700;padding:6px 2px;">${_rfmtSim(r.resg)}</td>
      </tr>`).join('');
    const pct = Math.round(y10.resg / y10.pago * 100);
    document.getElementById('srPunch').innerHTML = (st.modo === 'unico'
      ? `No <strong>único</strong>: paga <strong>${_rfmtSim(L[0].pago)}</strong> uma vez e nunca mais precisa pagar seguro de vida. Em 10 anos o resgate estimado chega a <strong>${_rfmtSim(y10.resg)}</strong>.`
      : `Você paga por ${st.modo === 'mensal' ? 'mês' : 'ano'}; ao fim de 10 anos terá investido <strong>${_rfmtSim(y10.pago)}</strong> e o resgate estimado é de <strong>${_rfmtSim(y10.resg)}</strong> — no seguro tradicional seria zero.`);
    selBtn();
  };
  document.querySelectorAll('#srModos [data-m]').forEach(b => b.onclick = () => { st.modo = b.dataset.m; draw(); });
  const infl = document.getElementById('srInfl'); if (infl) infl.oninput = () => { st.inflacao = parseFloat(infl.value); document.getElementById('srInflVal').textContent = st.inflacao + '% a.a.'; draw(); };
  draw();
}

        ${segurados.map(s => {

          return `<div class="socio">

/* ---- PDF ---- */
function baixarPDF() {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) return alert('Biblioteca de PDF não carregou. Recarregue a página.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 16; let y = 0;
    const sa = s => String(s == null ? '' : s).replace(/[“”]/g, '"').replace(/[–—]/g, '-')
      .normalize('NFD').replace(/[̀-ͯ]/g, '');
    const quebra = (lim) => { if (y > lim) { doc.addPage(); y = M + 6; } };

    const segurados = (P.segurados || []);
    const resgatavel = /resgat/i.test(P.produto || '');
    let capMorte = 0;
    segurados.forEach(s => (s.cob || []).forEach(c => { if (/morte/i.test(c.nome || '')) capMorte += Number(c.capital || 0); }));
    const capDestaque = capMorte > 0 ? capMorte : Number(P.capitalTotal || 0);

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 46, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(19); doc.setFont(undefined, 'bold');
    doc.text(sa(P.produto || 'Protecao dos Socios'), M, 22);
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(147, 197, 253);
    doc.text(sa((P.seguradora || 'Bradesco Vida e Previdencia') + (P.empresaNome ? '  ·  ' + P.empresaNome : '') + '  ·  Retorno Seguros'), M, 32);
    y = 58;

    // custo por forma de pagamento (soma de todos os participantes)
    const _ptmP = Object.assign({}, P.premioTotalModo || {});
    const _somaModoP = m => segurados.length && segurados.every(s => s.premios && s.premios[m] > 0) ? segurados.reduce((t, s) => t + s.premios[m], 0) : 0;
    ['mensal', 'anual', 'unico'].forEach(m => { if (!(_ptmP[m] > 0)) { const v = _somaModoP(m); if (v > 0) _ptmP[m] = v; } });
    const _lblP = { mensal: 'Custo total por mes', anual: 'Investimento total no ano', unico: 'Custo unico (vitalicio)' };
    const _modosP = ['mensal', 'anual', 'unico'].filter(m => _ptmP[m] > 0);

    // capital protegido
    const boxH = 26 + (_modosP.length ? _modosP.length * 5 + 2 : 0);
    doc.setFillColor(239, 246, 255); doc.roundedRect(M, y - 7, W - M * 2, boxH, 2, 2, 'F');
    doc.setFontSize(8.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 138);
    doc.text('CAPITAL PROTEGIDO PARA A SOCIEDADE', M + 5, y);
    doc.setFontSize(17); doc.text(sa(fmtCap(capDestaque)), M + 5, y + 10);
    doc.setFontSize(8); doc.setFont(undefined, 'normal');
    doc.text(sa(segurados.length ? segurados.length + ' socios/dirigentes protegidos' : ''), M + 5, y + 16);
    if (_modosP.length) {
      let yy = y + 22;
      _modosP.forEach(m => {
        doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
        doc.text(sa(_lblP[m]), M + 5, yy);
        doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 138);
        doc.text(sa(fmt(_ptmP[m]) + (m === 'mensal' ? '/mes' : '')), W - M - 5, yy, { align: 'right' });
        yy += 5;
      });
    } else if (P.premioTotal) {
      doc.text(sa('Investimento total: ' + fmt(P.premioTotal) + (resgatavel && /[uú]nico/i.test(P.pagamento || '') ? ' (unico)' : ' (anual)')), M + 5, y + 22);
    }
    y += boxH + 6;

    // por sócio
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Cada socio, sua protecao', M, y); y += 7;
    segurados.forEach(s => {
      quebra(250);
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 138);
      doc.text(sa((s.nome || 'Socio') + (s.idade ? ' · ' + s.idade + ' anos' : '') + (s.sexo ? ' · ' + (s.sexo === 'M' ? 'M' : 'F') : '')), M, y);
      if (s.premioTotalSeg) { doc.setTextColor(71, 85, 105); doc.text(sa('premio ' + fmt(s.premioTotalSeg)), W - M, y, { align: 'right' }); }
      y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      (s.cob || []).forEach(c => {
        quebra(258);
        doc.text(sa('- ' + (c.nome || '') + (c.carencia ? ' (carencia ' + c.carencia + ')' : '')), M + 3, y);
        doc.text(sa(fmt0(c.capital)), W - M, y, { align: 'right' }); y += 4.6;
      });
      y += 3;
    });

    y += 2; quebra(250);
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Como esta protecao funciona', M, y); y += 7;
    [['Beneficiario do capital', resgatavel
        ? 'A familia de cada socio recebe direto, fora do inventario, em dias (art. 794 do CC).'
        : 'A empresa recebe e usa o capital para recomprar as cotas dos herdeiros pelo valor justo.'],
     resgatavel ? ['Resgate', 'Cumprida a carencia, o socio pode resgatar o saldo da provisao matematica se encerrar.'] : null,
     ['Vigencia', 'Inicia as 24h do pagamento da primeira parcela.'],
     ['Carencias', 'Conforme a apolice; morte por acidente e coberta desde o inicio.'],
     ['Aceitacao', 'Sujeita a declaracao pessoal de saude de cada socio e a analise da seguradora.']
    ].filter(Boolean).forEach(([t, d]) => {
      quebra(256);
      doc.setFontSize(10); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 138);
      doc.text('• ' + sa(t), M, y); y += 4.8;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const l = doc.splitTextToSize(sa(d), W - M * 2 - 5); doc.text(l, M + 4, y); y += l.length * 4.4 + 3;
    });

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'normal');
      doc.text(sa('Resumo da cotacao ' + (P.numero || '') + '. Nao constitui proposta. Condicoes conforme apolice, Susep e analise da seguradora.'), M, 288);
      doc.text(`${i}/${n}`, W - M, 288, { align: 'right' });
    }
    const nomeArq = 'proposta-vida-socios-' + (P.empresaNome || 'empresa').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.pdf';
    registrar('pdf');
    doc.save(nomeArq);
  } catch (e) { alert('Não consegui gerar o PDF: ' + e.message); }
}

async function registrar(tipo, dados) {
  try {
    if (!DOC_ID) return;
    const upd = {
      ultimaVisita: firebase.firestore.FieldValue.serverTimestamp(),
      eventos: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString(), ...(dados || {}) })
    };
    if (tipo !== 'abriu' && tipo !== 'pdf') { upd.interesse = tipo; upd.contatoCliente = dados || null; }
    else if (tipo === 'abriu') upd.aberta = true;
    await db.collection('mb_propostas').doc(DOC_ID).set(upd, { merge: true });
  } catch (e) { console.warn('registrar', e); }
}

function erro(t, m) {
  $('app').innerHTML = `<div class="erro"><div style="font-size:42px;">🔒</div><h2>${t}</h2><p>${m}</p></div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  /* usa a sessão já existente se houver (ex.: corretor logado no painel) — não a substitui; só entra anônimo se ninguém estiver logado */
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (!token) return erro('Link inválido', 'Peça ao seu corretor o link correto da proposta.');
  try {
    const snap = await db.collection('mb_propostas').where('token', '==', token).limit(1).get();
    if (snap.empty) return erro('Proposta não encontrada', 'O link pode ter expirado. Fale com o seu corretor.');
    DOC_ID = snap.docs[0].id;
    P = snap.docs[0].data();
    render();
  } catch (e) {
    console.error(e);
    erro('Não consegui carregar', 'Tente novamente em instantes ou fale com o seu corretor.');
  }
});
</script>
