<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --verm:#f87171; --ambar:#fcd34d; --texto:#e8eeff; --suave:#93a4c8; --apagado:#5d6f95; --card:rgba(255,255,255,.045); --borda:rgba(147,164,200,.22); --claro:#dbe6ff; --medio:#c3d0ec; }
  html, body { background:var(--fundo); }
  body { font-family:'Inter',system-ui,sans-serif; color:var(--texto); min-height:100vh; overflow-x:hidden; }
  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .fumaca span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.38; }
  .f1 { width:60vw; height:60vw; background:radial-gradient(circle,#1e40af,transparent 70%); top:-14%; left:-14%; }
  .f2 { width:50vw; height:50vw; background:radial-gradient(circle,#0ea5e9,transparent 70%); bottom:-18%; right:-12%; }

  .topo { position:sticky; top:0; z-index:10; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(5,14,36,.92); backdrop-filter:blur(8px); border-bottom:1px solid rgba(147,164,200,.1); }
  .marca { font-size:10.5px; letter-spacing:.22em; color:#6b7fa8; font-weight:700; text-transform:uppercase; }
  .topo-acoes { display:flex; gap:8px; }
  .chip-btn { background:rgba(255,255,255,.06); border:1px solid var(--borda); color:var(--texto); font:700 12.5px 'Inter',sans-serif; padding:8px 12px; border-radius:100px; cursor:pointer; white-space:nowrap; }
  .demo { text-align:center; font-size:11px; color:var(--ambar); background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.3); padding:5px 12px; border-radius:100px; margin:12px auto 0; width:fit-content; max-width:100%; }

  .palco { position:relative; z-index:2; max-width:680px; margin:0 auto; padding:14px 16px calc(40px + env(safe-area-inset-bottom)); }
  .secao { margin-top:34px; scroll-margin-top:70px; }
  .rotulo { font-size:11px; letter-spacing:.16em; color:var(--ciano); font-weight:700; text-transform:uppercase; margin-bottom:10px; }
  .titulo { font-size:clamp(22px,6vw,30px); font-weight:800; line-height:1.22; letter-spacing:-.02em; margin-bottom:10px; }
  .titulo em { font-style:normal; color:var(--dourado); }
  h3.sub { font-size:17px; font-weight:800; margin:20px 0 8px; line-height:1.35; }
  .texto { font-size:15.5px; line-height:1.6; color:var(--medio); margin-bottom:14px; }
  .nota { font-size:12.5px; line-height:1.55; color:#8193bb; margin-top:10px; }
  b, strong { color:#fff; }

  .capa { padding:22px 0 4px; }
  .capa h1 { font-size:clamp(26px,7.4vw,38px); font-weight:800; line-height:1.15; letter-spacing:-.02em; margin:6px 0 10px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .meta span { font-size:12.5px; font-weight:600; color:var(--claro); background:var(--card); border:1px solid var(--borda); padding:6px 10px; border-radius:100px; }
  .meta span.ouro { color:#2a1a00; background:var(--dourado); border-color:var(--dourado); }

  .indice { display:flex; gap:8px; overflow-x:auto; padding:14px 0 4px; scrollbar-width:none; }
  .indice::-webkit-scrollbar { display:none; }
  .indice a { flex-shrink:0; font-size:12.5px; font-weight:700; color:var(--suave); text-decoration:none; border:1px solid var(--borda); padding:7px 12px; border-radius:100px; }

  .cardp { position:relative; border-radius:18px; padding:18px; margin-top:14px; background:linear-gradient(160deg,rgba(30,64,175,.35),rgba(255,255,255,.03)); border:1.5px solid rgba(56,189,248,.35); }
  .cardp.rg { background:linear-gradient(160deg,rgba(180,120,10,.28),rgba(255,255,255,.03)); border-color:rgba(251,191,36,.4); }
  .cardp .selo2 { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--ciano); margin-bottom:6px; }
  .cardp.rg .selo2 { color:var(--dourado); }
  .cardp h2 { font-size:20px; line-height:1.25; font-weight:800; margin-bottom:6px; }
  .cardp p { font-size:14.5px; line-height:1.55; color:var(--medio); }
  .total { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid rgba(147,164,200,.2); }
  .total span { font-size:13px; color:var(--suave); font-weight:600; }
  .total strong { font-size:22px; font-weight:800; color:var(--dourado); white-space:nowrap; }
  .cardp:not(.rg) .total strong { color:var(--ciano); }
  .frase { margin-top:18px; font-size:17px; font-weight:800; line-height:1.4; text-align:center; }

  table.t { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  table.t th { text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); font-weight:700; padding:6px 4px; border-bottom:1px solid rgba(147,164,200,.25); }
  table.t td { padding:9px 4px; border-bottom:1px solid rgba(147,164,200,.13); vertical-align:top; color:var(--claro); }
  table.t .num { text-align:right; white-space:nowrap; font-weight:700; color:#fff; }
  table.t th.num { color:var(--suave); }
  table.t tr.cruza td { color:var(--verde); }
  .tag { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:1px 6px; border-radius:6px; margin:2px 3px 0 0; background:rgba(52,211,153,.14); color:#6ee7b7; border:1px solid rgba(52,211,153,.35); }

  .painel { background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:16px; margin-top:14px; }
  .aviso { margin-top:14px; font-size:14px; line-height:1.55; color:#bfe3ff; background:rgba(56,189,248,.08); border-left:3px solid var(--ciano); border-radius:10px; padding:12px 14px; }
  .aviso.ouro { color:#fde68a; background:rgba(251,191,36,.08); border-left-color:var(--dourado); }

  /* checklist */
  .perg { padding:14px 0; border-bottom:1px solid rgba(147,164,200,.13); }
  .perg:last-child { border-bottom:none; }
  .perg p { font-size:15px; line-height:1.5; font-weight:600; margin-bottom:10px; }
  .perg p small { display:block; font-weight:500; color:var(--suave); font-size:12.5px; margin-top:3px; }
  .tri { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .op { width:100%; padding:12px 8px; border-radius:12px; background:var(--card); border:1.5px solid var(--borda); color:var(--texto); font:700 14px 'Inter',sans-serif; cursor:pointer; text-align:center; transition:all .15s; }
  .op.sel.s { background:rgba(52,211,153,.18); border-color:var(--verde); }
  .op.sel.n { background:rgba(248,113,113,.16); border-color:var(--verm); }
  .op.sel.q { background:rgba(251,191,36,.16); border-color:var(--dourado); }
  .op.sel.g { background:rgba(56,189,248,.18); border-color:var(--ciano); }
  .matriz { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px; }
  .matriz th { font-size:11px; color:var(--suave); font-weight:700; padding:6px 4px; text-align:center; border-bottom:1px solid rgba(147,164,200,.25); }
  .matriz th:first-child { text-align:left; }
  .matriz td { padding:10px 4px; border-bottom:1px solid rgba(147,164,200,.13); text-align:center; }
  .matriz td:first-child { text-align:left; color:var(--claro); line-height:1.4; }
  .matriz tr.diverge td:first-child::after { content:'vocês divergem'; display:inline-block; margin-left:6px; font-size:9.5px; font-weight:800; text-transform:uppercase; color:var(--dourado); border:1px solid rgba(251,191,36,.5); padding:0 5px; border-radius:5px; vertical-align:middle; }
  .r { display:inline-flex; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
  .r.s { background:rgba(52,211,153,.18); color:var(--verde); }
  .r.n { background:rgba(248,113,113,.18); color:var(--verm); }
  .r.q { background:rgba(251,191,36,.18); color:var(--dourado); }
  .resposta-item { padding:10px 0; border-bottom:1px solid rgba(147,164,200,.12); font-size:14.5px; line-height:1.5; color:var(--claro); }
  .resposta-item:last-child { border-bottom:none; }
  .resposta-item b { display:block; margin-bottom:2px; }

  /* análise */
  .ponto { padding:14px 0; border-bottom:1px solid rgba(147,164,200,.13); }
  .ponto:last-child { border-bottom:none; }
  .ponto h4 { font-size:15.5px; font-weight:800; margin-bottom:5px; line-height:1.35; }
  .ponto p { font-size:14.5px; line-height:1.55; color:var(--medio); }
  .fonte { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ciano); border:1px solid rgba(56,189,248,.45); border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:middle; }

  /* resgate */
  .barras { margin-top:12px; }
  .barra-l { font-size:12.5px; color:var(--suave); font-weight:600; margin:9px 0 4px; display:flex; justify-content:space-between; }
  .barra { height:12px; border-radius:6px; background:rgba(255,255,255,.06); overflow:hidden; position:relative; }
  .barra span { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,#b45309,var(--dourado)); }
  .barra i { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; opacity:.7; }

  /* casos */
  .caso { padding:14px 0; border-bottom:1px solid rgba(147,164,200,.13); }
  .caso:last-child { border-bottom:none; }
  .caso .pr { font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ciano); }
  .caso.rg .pr { color:var(--dourado); }
  .caso h4 { font-size:16px; font-weight:800; margin:3px 0 6px; line-height:1.35; }
  .caso p { font-size:14.5px; line-height:1.55; color:var(--medio); margin-bottom:5px; }
  .caso p b { color:#fff; }

  /* fundamentos */
  details.acord { margin-top:12px; border:1px solid var(--borda); border-radius:14px; overflow:hidden; background:var(--card); }
  details.acord summary { padding:15px 16px; font-weight:800; font-size:15px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:10px; }
  details.acord summary::-webkit-details-marker { display:none; }
  details.acord summary::after { content:'+'; color:var(--ciano); font-weight:800; }
  details.acord[open] summary::after { content:'−'; }
  .acord-corpo { padding:0 16px 16px; }
  .fund { padding:12px 0; border-bottom:1px solid rgba(147,164,200,.12); }
  .fund:last-child { border-bottom:none; }
  .fund h5 { font-size:14.5px; font-weight:800; margin-bottom:6px; line-height:1.4; }
  .fund blockquote { font-size:13.5px; line-height:1.55; color:var(--claro); border-left:3px solid rgba(56,189,248,.5); padding:4px 0 4px 12px; margin:6px 0; font-style:italic; }
  .fund .ref { font-size:11.5px; color:var(--suave); font-weight:700; }
  .fund p { font-size:14px; line-height:1.55; color:var(--medio); }
  ol.conf { padding-left:20px; }
  ol.conf li { font-size:14px; line-height:1.55; color:var(--claro); margin-bottom:7px; }

  .lbl { display:block; font-size:12.5px; font-weight:700; color:var(--suave); margin:12px 0 6px; }
  .campo { width:100%; padding:13px 14px; border-radius:12px; background:rgba(255,255,255,.05); border:1.5px solid var(--borda); color:#fff; font:500 16px 'Inter',sans-serif; }
  .campo:focus { outline:none; border-color:var(--ciano); }
  textarea.campo { min-height:120px; resize:vertical; line-height:1.5; font-size:14px; }
  .btn { display:block; width:100%; margin-top:14px; padding:15px 18px; border:none; border-radius:13px; background:linear-gradient(135deg,var(--ciano),#2563eb); color:#031127; font:800 15px 'Inter',sans-serif; cursor:pointer; text-align:center; text-decoration:none; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.ouro { background:linear-gradient(135deg,var(--dourado),#f59e0b); color:#2a1a00; }
  .btn.sec { background:transparent; border:1.5px solid var(--borda); color:var(--texto); font-weight:700; }
  .btn.verde { background:linear-gradient(135deg,#34d399,#059669); color:#022c1c; }
  .linha-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .linha-btns .btn { margin-top:8px; font-size:14px; padding:13px 10px; }
  .gerado { margin-top:12px; padding:12px; border-radius:12px; background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.3); font-size:13px; color:var(--claro); word-break:break-all; }

  .status { display:flex; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid rgba(147,164,200,.12); font-size:14px; }
  .status:last-child { border-bottom:none; }
  .status small { display:block; color:var(--suave); font-size:12px; margin-top:2px; }
  .pill { flex-shrink:0; align-self:center; font-size:11px; font-weight:800; padding:4px 9px; border-radius:100px; white-space:nowrap; }
  .pill.ok { background:rgba(52,211,153,.16); color:var(--verde); }
  .pill.esp { background:rgba(147,164,200,.14); color:var(--suave); }
  .pill.al { background:rgba(251,191,36,.16); color:var(--dourado); }

  .check-linha { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid rgba(147,164,200,.13); }
  .check-linha:last-child { border-bottom:none; }
  .check-linha .nm { font-size:15px; font-weight:700; }
  .check-linha .nm small { display:block; font-weight:500; color:var(--suave); font-size:12.5px; }
  .toggles { display:flex; gap:6px; flex-shrink:0; }
  .tg { padding:9px 11px; border-radius:10px; border:1.5px solid var(--borda); background:var(--card); color:var(--suave); font:700 12.5px 'Inter',sans-serif; cursor:pointer; }
  .tg.on { color:#fff; border-color:var(--verde); background:rgba(52,211,153,.16); }
  .tg:disabled { opacity:.3; cursor:not-allowed; }

  .passos li { list-style:none; display:flex; gap:12px; padding:11px 0; border-bottom:1px solid rgba(147,164,200,.12); font-size:14.5px; line-height:1.5; color:var(--claro); }
  .passos li:last-child { border-bottom:none; }
  .passos .n { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:rgba(251,191,36,.15); color:var(--dourado); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }

  .banner { margin-top:14px; padding:16px; border-radius:16px; background:linear-gradient(160deg,rgba(56,189,248,.16),rgba(255,255,255,.03)); border:1.5px solid rgba(56,189,248,.4); }
  .banner h2 { font-size:19px; font-weight:800; margin-bottom:6px; }
  .banner p { font-size:14.5px; line-height:1.55; color:var(--claro); }

  .rodape { text-align:center; font-size:12px; color:var(--apagado); margin-top:40px; line-height:1.6; }
  .rodape a { color:var(--suave); }
  .toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); opacity:0; z-index:30; background:#0f2a1f; border:1px solid rgba(52,211,153,.5); color:#bbf7d0; font-size:13.5px; font-weight:600; padding:10px 16px; border-radius:100px; transition:all .25s; pointer-events:none; white-space:nowrap; }
  .toast.on { opacity:1; transform:translateX(-50%); }
  .carregando { text-align:center; padding:80px 20px; color:var(--suave); font-size:15px; }
  .so-impressao { display:none; }

  @media (min-width:600px) { .palco { padding-left:24px; padding-right:24px; } }

  /* ─────── PDF (imprimir) ─────── */
  @media print {
    @page { size:A4; margin:14mm 12mm; }
    :root { --texto:#0b1530; --suave:#4b5b7a; --apagado:#6b7a96; --claro:#1c2945; --medio:#2b3a5c; --card:#fff; --borda:#cfd8e6; --ciano:#0369a1; --dourado:#a16207; --verde:#047857; --verm:#b91c1c; }
    html, body { background:#fff !important; }
    body { color:#0b1530; font-size:12px; }
    b, strong, .cardp h2, .titulo, .capa h1 { color:#0b1530 !important; }
    .fumaca, .topo, .indice, .nao-imprime, .btn, .linha-btns, .tri, .toggles, .toast, .demo, textarea, input { display:none !important; }
    .so-impressao { display:block; }
    .palco { max-width:none; padding:0; }
    .secao { margin-top:18px; break-inside:auto; }
    .secao.quebra { break-before:page; }
    .cardp, .cardp.rg, .painel, .banner, details.acord { background:#fff !important; border:1px solid #cfd8e6 !important; }
    .cardp, .banner { break-inside:avoid; }
    .rotulo, .titulo, h3.sub, .capa h1 { break-after:avoid; page-break-after:avoid; }
    .matriz tr, table.t tr { break-inside:avoid; }
    .caso, .ponto, .fund, .perg, .status { break-inside:avoid; }
    details.acord .acord-corpo { display:block !important; }
    details.acord summary::after { content:''; }
    table.t td, table.t .num, .matriz td:first-child { color:#0b1530; }
    .barra { background:#e7edf6; }
    .fund blockquote { color:#1c2945; }
    .aviso, .aviso.ouro { background:#f3f7fc; color:#1c2945; }
  }
  /* linha do tempo do acompanhamento */
  .linha-tempo{list-style:none; margin:0; padding:0}
  .etapa{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.07); opacity:.45}
  .etapa:last-child{border-bottom:none}
  .etapa.ok,.etapa.agora{opacity:1}
  .etapa .marca{width:22px; height:22px; border-radius:50%; flex:0 0 22px; display:flex; align-items:center;
    justify-content:center; font-size:12px; font-weight:800; border:1.5px solid rgba(255,255,255,.22); margin-top:1px}
  .etapa.ok .marca{background:#16a34a; border-color:#16a34a; color:#fff}
  .etapa.agora .marca{border-color:var(--dourado); color:var(--dourado)}
  .etapa b{font-size:14.5px; display:block}
  .etapa small{display:block; font-size:12px; opacity:.65; margin-top:1px}
  .mini{display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:100px; margin:2px 3px 0 0;
    border:1px solid rgba(255,255,255,.16); opacity:.6}
  .mini.ok{border-color:#16a34a; color:#4ade80; opacity:1}
  .aviso-tempo{background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:#fbbf24;
    border-radius:10px; padding:10px 13px; font-size:13px; margin-top:10px}
  .pill.al{background:rgba(245,158,11,.15); color:#fbbf24; border:1px solid rgba(245,158,11,.4)}
  /* cenários de capital */
  .cen-grade{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:11px; margin-top:14px}
  .cen{position:relative; border:1px solid rgba(255,255,255,.13); border-radius:14px; padding:16px 15px 15px;
    background:rgba(255,255,255,.03); display:flex; flex-direction:column}
  .cen.top{border-color:var(--dourado); background:rgba(251,191,36,.07); box-shadow:0 0 0 1px rgba(251,191,36,.25)}
  .cen.escolhido{border-color:var(--verde); background:rgba(52,211,153,.08)}

   PROPOSTA VIDA SÓCIOS — página online (com PDF pela impressão do navegador)

const ACEITE_PAGINA = 'AceiteVidaSocios.html';

const VTOK = params.get('v');

const FV = () => firebase.firestore.FieldValue;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v, cent) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: cent ? 2 : 0, maximumFractionDigits: cent ? 2 : 0 });
const brlc = v => brl(v, Math.round(v) !== Number(v));

const dataHoraBR = d => { if (!d) return '—'; const x = d.toDate ? d.toDate() : new Date(d); return isNaN(x) ? '—' : x.toLocaleDateString('pt-BR') + ' ' + x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };

      { titulo: 'Já viveram uma sucessão', texto: 'Vocês contaram que a morte do fundador levou dois anos para ser resolvida.', fonte: 'CLIENTE' }
    ],
    gaps: [
      { titulo: 'Fonte de recursos para os haveres', risco: 'A empresa pode ter de vender ativo ou se endividar para pagar as parcelas.', sugestao: 'Cláusula destinando a indenização da Pessoa Chave ao pagamento dos haveres. O advogado redige.' },

    ]
  },
  casos: ['pc1', 'pc5', 'pc11', 'rg1', 'rg2', 'rg18'],
  convidados: {}, checklist: {}, aceites: {}

/* ═══════════════════ RENDER ═══════════════════ */
const papel = () => (EU && EU.papel) || 'principal';
const ehSocio = () => ['principal', 'socio'].includes(papel());
const ehConsultor = () => ['contador', 'advogado'].includes(papel());
const itensPC = () => (P.pessoaChave && P.pessoaChave.itens || []).filter(i => i.capital);
const itensRG = () => (P.resgatavel && P.resgatavel.itens || []).filter(i => i.capital);

/* ═══════════════ TELAS SOBREPOSTAS ═══════════════
   A proposta chega semanas depois da apresentação. Quem abre precisa de uma

const FOLHAS = {

    <div class="painel"><ul class="passos">${PASSOS_ACEITE.map((t, i) => `<li><span class="n">${i + 1}</span><span>${t}</span></li>`).join('')}</ul>
      <div class="aviso-tempo">⏱ O código do SMS vale <b>5 minutos</b>. Só peça quando estiver com o celular na mão — se expirar, é só pedir outro.</div></div>

    </div>` },
  porque:  { t: 'Por que este desenho',                f: () => secAnalise() },
  gaps:    { t: 'O que o contrato ainda não responde', f: () => secGaps() },
  casos:   { t: 'Situações reais',                     f: () => secCasos() },
  resgate: { t: 'Se um dia não quiserem mais',         f: () => secResgate() },
  fund:    { t: 'Para o contador e o advogado',        f: () => secFundamentos() },
  check:   { t: 'Ainda não estamos convencidos',       f: () => secChecklist() },
  socios:  { t: 'Apresentar aos sócios',               f: () => secConvidarSocio() },
  ajuste:  { t: 'Quero outro desenho',                 f: () => secAjuste() },
  passos:  { t: 'Daqui até a apólice',                 f: () => secProximos() }
};
let folhaAberta = null;
function abrirFolha(k) {
  const F = FOLHAS[k]; if (!F) return;
  folhaAberta = k;
  document.getElementById('folhaTit').textContent = F.t;
  document.getElementById('folhaCorpo').innerHTML = F.f();
  const c = document.getElementById('folha');
  c.hidden = false; document.body.classList.add('travado');
  document.getElementById('folhaCorpo').scrollTop = 0;
  try { history.pushState({ folha: k }, ''); } catch (e) {}
}
function fecharFolha(semVoltar) {
  const c = document.getElementById('folha');
  if (!c || c.hidden) return;
  c.hidden = true; document.body.classList.remove('travado');
  folhaAberta = null;
  if (!semVoltar) { try { history.back(); } catch (e) {} }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
window.addEventListener('popstate', () => { if (folhaAberta) fecharFolha(true); });
/* usado pelos botões de dentro das folhas: redesenha a página e a folha aberta */
function atualizar() {
  const y = window.scrollY;
  render();
  if (folhaAberta && FOLHAS[folhaAberta]) document.getElementById('folhaCorpo').innerHTML = FOLHAS[folhaAberta].f();
  window.scrollTo(0, y);
}

/* ═══════════════ A SUGESTÃO DA CORRETORA, POR PRODUTO ═══════════════
   Decisão de 28/09: acabaram os três cenários lado a lado. Em cada produto
   aparecem só duas colunas — o que o cliente pediu e o que a corretora sugere.
   Fonte: `pessoaChave.sugestao` / `resgatavel.sugestao`. Propostas antigas,
   que só têm `cenarios`, continuam funcionando: o cenário marcado como
   `destaque` é separado por produto pelo tipo de prêmio. */
function sugestaoDe(prod) {
  const bloco = P[prod === 'pc' ? 'pessoaChave' : 'resgatavel'] || {};
  if (bloco.sugestao && (bloco.sugestao.itens || []).length) return bloco.sugestao;
  const rec = (P.cenarios || []).find(c => c && c.destaque && (c.itens || []).length);
  if (!rec) return null;
  const itens = (rec.itens || []).filter(i => prod === 'rg' ? i.premioUnico != null : (i.premioAnual != null || i.premioMensal != null));
  if (!itens.length) return null;
  return { itens, porque: rec.porque || '' };
}
function somaCap(itens) { return (itens || []).reduce((t, i) => t + (Number(i.capital) || 0), 0); }
/* ═══ SOMA DE PRÊMIOS, COM O QUE FALTA DECLARADO ═══
   Item sem cotação vem com prêmio `null` — era somado como ZERO, e aí a
   sugestão (capitais MAIORES) aparecia mais barata que o pedido. Num documento
   de venda isso é pior que um erro de conta: é uma promessa falsa, e o cliente
   descobre na hora de assinar. Agora a soma devolve também quantos itens
   ficaram sem preço, e quem desenha a tela é obrigado a dizer. */
function precoDe(prod, itens) {
  const lista = itens || [];
  const mensal = prod !== 'rg' && P.pessoaChave && P.pessoaChave.pagamento === 'mensal';
  const valorDe = i => prod === 'rg'
    ? (i.premioUnico != null ? i.premioUnico : i.premio)
    : (mensal ? i.premioMensal : i.premioAnual);
  let v = 0, faltam = 0;
  lista.forEach(i => { const x = Number(valorDe(i)); if (x > 0) v += x; else faltam++; });
  return { v, faltam, total: lista.length, l: prod === 'rg' ? 'uma vez só' : (mensal ? 'por mês' : 'por ano') };
}
/* "R$ 131.500 por ano · 1 sócio ainda a cotar" — a ressalva anda junto do número */
function precoTxt(p) {
  if (!p.total) return null;
  if (p.faltam >= p.total) return '<b class="ac">a cotar</b>';
  const falta = p.faltam ? ` <small class="ac">· ${p.faltam} sócio${p.faltam > 1 ? 's' : ''} ainda a cotar</small>` : '';
  return `<b>${brlc(p.v)}</b> <small>${p.l}</small>${falta}`;
}
function mesmosCapitais(a, b) {
  const m = l => (l || []).map(i => i.socioId + ':' + Number(i.capital || 0)).sort().join('|');
  return m(a) === m(b);
}
const temSug = k => { const g = sugestaoDe(k); return !!(g && idsDoProduto(k).some(id => capSugerido(k, id) && capSugerido(k, id) !== capPedido(k, id))); };

/* O rodapé do card: total do que está marcado, com a ressalva do que falta cotar.
   Enquanto nada está marcado, mostra o total da proposta inteira — senão o card
   abre com um zero, que parece erro. */
function rodapeCard(k, unidade) {
  if (!ehSocio()) {
    const tot = precoDe(k, k === 'pc' ? itensPC() : itensRG());
    return `<div class="total"><span>Total ${unidade}</span><strong>${tot.faltam >= tot.total ? 'a cotar' : brlc(tot.v)}</strong></div>`;
  }
  const m = totalMarcado(k);
  if (!m.n) {
    const tot = precoDe(k, k === 'pc' ? itensPC() : itensRG());
    return `<div class="total vazio"><span>Nada marcado ainda<small>a cotação como foi pedida saiu por ${tot.faltam >= tot.total ? 'um valor a cotar' : brlc(tot.v) + ' ' + unidade}</small></span></div>`;
  }
  return `<div class="total"><span>${m.n} ${m.n === 1 ? 'sócio marcado' : 'sócios marcados'}</span>
    <strong>${m.faltam >= m.n ? 'a cotar' : brlc(m.v)}<small>${unidade}${m.faltam ? ` · ${m.faltam} ainda a cotar` : ''}</small></strong></div>`;
}
/* A frase do "por quê" da sugestão sobreviveu ao fim do bloco de duas colunas:
   é ela que explica de onde veio o número que aparece na linha de cada sócio. */
function porqueSugestao(k) {
  const g = sugestaoDe(k);
  if (!g || !g.porque) return '';
  return `<p class="sug-porque solo"><b>Por que sugerimos assim:</b> ${esc(g.porque)}</p>`;
}

/* ═══════════════ A MARCAÇÃO, DENTRO DO CARD ═══════════════
   Antes havia duas decisões em dois lugares: "qual caminho seguir" numa seção
   e "quem entra" em outra, lá embaixo. O cliente lia os números num lugar e
   decidia em outro — e as duas telas falavam de coisas diferentes com palavras
   parecidas ("ok, tenho a proposta" / "ok, quero contratar").
   Agora a decisão mora onde os números estão: na linha de cada sócio, dentro do
   card do produto. Nada vem marcado: marcar é um ato, não um padrão. */
let escolha = null;
function idsDoProduto(k) { return (k === 'pc' ? itensPC() : itensRG()).map(i => i.socioId); }
function capSugerido(k, id) {
  const s = sugestaoDe(k); if (!s) return null;
  const it = (s.itens || []).find(x => x.socioId === id);
  return it && Number(it.capital) > 0 ? Number(it.capital) : null;
}
function capPedido(k, id) {
  const it = (k === 'pc' ? itensPC() : itensRG()).find(x => x.socioId === id);
  return it ? Number(it.capital) || 0 : 0;
}
/* o que vale para este sócio, neste produto, depois da escolha dele */
function capEscolhido(k, id) {
  const e = (escolha && escolha[id]) || {};
  const sug = capSugerido(k, id);
  return (e['cap' + k] === 'sugestao' && sug) ? sug : capPedido(k, id);
}
function premioDoItem(k, id, qual) {
  const lista = qual === 'sugestao' ? ((sugestaoDe(k) || {}).itens || []) : (k === 'pc' ? itensPC() : itensRG());
  const it = lista.find(x => x.socioId === id); if (!it) return null;
  if (k === 'rg') return it.premioUnico != null ? it.premioUnico : it.premio;
  return (P.pessoaChave && P.pessoaChave.pagamento === 'mensal') ? it.premioMensal : it.premioAnual;
}
function iniciarEscolha() {
  if (escolha) return;
  escolha = {};
  const ids = [...new Set([...idsDoProduto('pc'), ...idsDoProduto('rg')])];
  /* Desmarcado por padrão, nos dois produtos. E o capital começa na sugestão da
     corretora quando ela existe — é o que recomendamos, e a linha mostra os dois. */
  ids.forEach(id => { escolha[id] = { pc: false, rg: false, cappc: capSugerido('pc', id) ? 'sugestao' : 'pedido', caprg: capSugerido('rg', id) ? 'sugestao' : 'pedido' }; });
  const g = P.contratar && P.contratar.itens;
  if (g) Object.keys(g).forEach(id => { if (escolha[id]) Object.assign(escolha[id], g[id]); });
}
const podeMarcar = () => papel() === 'principal' && !(P.etapas && P.etapas.transmitida);
function marcar(id, k) { iniciarEscolha(); escolha[id][k] = !escolha[id][k]; atualizar(); }
function escolherCap(id, k, qual) { iniciarEscolha(); escolha[id]['cap' + k] = qual; if (!escolha[id][k]) escolha[id][k] = true; atualizar(); }
const marcados = () => { iniciarEscolha(); return Object.entries(escolha).filter(([, v]) => v.pc || v.rg); };

/* a linha de um sócio dentro do card: capital, escolha de capital e interesse */
function linhaSocio(k, i, mensal) {
  iniciarEscolha();
  const id = i.socioId, s = socio(id), e = escolha[id] || {};
  const sug = capSugerido(k, id), ped = capPedido(k, id);
  const temDuas = sug && sug !== ped;
  const qual = e['cap' + k] === 'sugestao' && sug ? 'sugestao' : 'pedido';
  const pr = premioDoItem(k, id, qual);
  const marcado = !!e[k];
  const tags = [i.dg ? '<span class="tag">Doenças graves</span>' : '', (k === 'pc' && i.ipa) ? '<span class="tag">Invalidez por acidente</span>' : ''].join('');
  const ident = `<b>${esc(s.nome)}</b>${s.pct && k === 'pc' ? ` · ${pct(s.pct)}` : ''}${s.nascimento ? ` · ${idade(s.nascimento)} anos` : ''}${s.papel && k === 'pc' ? ` · ${esc(s.papel)}` : ''}`;
  const caps = temDuas
    ? `<div class="cap-op">
         <button class="cp ${qual === 'pedido' ? 'on' : ''}" ${podeMarcar() ? `onclick="escolherCap('${id}','${k}','pedido')"` : 'disabled'}>
           <small>Como vocês pediram</small>${brl(ped)}</button>
         <button class="cp ${qual === 'sugestao' ? 'on' : ''}" ${podeMarcar() ? `onclick="escolherCap('${id}','${k}','sugestao')"` : 'disabled'}>
           <small>Nossa sugestão</small>${brl(sug)}</button>
       </div>`
    : `<div class="cap-un">${brl(ped)}</div>`;
  return `<div class="ln-socio ${marcado ? 'mk' : ''}">
    <div class="ln-topo">
      <div class="ln-nome">${ident}${tags ? `<div class="ln-tags">${tags}</div>` : ''}</div>
      ${podeMarcar()
        ? `<button class="ln-mk ${marcado ? 'on' : ''}" onclick="marcar('${id}','${k}')" aria-pressed="${marcado}">${marcado ? '✓ Quero este' : 'Quero este'}</button>`
        : `<span class="ln-ro ${marcado ? 'on' : ''}">${marcado ? '✓ marcado' : ''}</span>`}
    </div>
    <div class="ln-base">${caps}<div class="ln-pr">${pr != null && Number(pr) > 0 ? brlc(pr) + `<small>${k === 'rg' ? 'uma vez só' : (mensal ? 'por mês' : 'por ano')}</small>` : '<span class="ac">a cotar</span>'}</div></div>
  </div>`;
}
/* o total do card acompanha o que está marcado — e diz quando nada está */
function totalMarcado(k) {
  iniciarEscolha();
  let v = 0, faltam = 0, n = 0;
  idsDoProduto(k).forEach(id => {
    if (!escolha[id] || !escolha[id][k]) return;
    n++;
    const pr = Number(premioDoItem(k, id, escolha[id]['cap' + k] === 'sugestao' && capSugerido(k, id) ? 'sugestao' : 'pedido'));
    if (pr > 0) v += pr; else faltam++;
  });
  return { v, faltam, n };
}

function blocoSugestao(prod, pedidos) {
  const s = sugestaoDe(prod);
  if (!s) return '';
  const igual = mesmosCapitais(pedidos, s.itens);
  if (igual) return `<div class="sug igual"><div class="sug-rot">Nossa sugestão</div>
    <p class="sug-linha"><b>O que vocês pediram já é o que recomendamos.</b> Não temos nada a acrescentar neste produto.</p>
    ${s.porque ? `<p class="sug-porque">${esc(s.porque)}</p>` : ''}</div>`;
  const pr = precoDe(prod, s.itens);
  const mapPed = {}; (pedidos || []).forEach(i => mapPed[i.socioId] = Number(i.capital) || 0);
  const linhas = (s.itens || []).map(i => {
    const de = mapPed[i.socioId];
    return `<div class="sug-l"><span>${esc(primeiro(socio(i.socioId).nome) || '—')}</span><b>${de && de !== Number(i.capital) ? `<i>${brlc(de)}</i> → ` : ''}${brlc(i.capital)}</b></div>`;
  }).join('');
  return `<div class="sug"><div class="sug-rot">Nossa sugestão</div>
    <div class="sug-topo">
      <div><span class="sug-n">${brlc(somaCap(s.itens))}</span><small>de cobertura somada</small></div>
      <div class="sug-preco">${pr.faltam >= pr.total ? '<b class="ac">a cotar</b>'
        : `<b>${brlc(pr.v)}</b><small>${pr.l}</small>${pr.faltam ? `<small class="ac">${pr.faltam} sócio${pr.faltam > 1 ? 's' : ''} ainda a cotar</small>` : ''}`}</div>
    </div>
    ${linhas ? `<div class="sug-lista">${linhas}</div>` : ''}
    ${s.porque ? `<p class="sug-porque">${esc(s.porque)}</p>` : ''}</div>`;
}

/* ═══════════════ POR QUE VOCÊS PEDIRAM ISSO ═══════════════
   Lido ao vivo de mb_apresentacoes/<sessaoOrigem>. É o bloco que devolve o
   contexto a quem abre a proposta semanas depois da conversa. */
let ORIG = null;
const VALORES_MI = [[0, 5], [5, 20], [20, 50], [50, 100], [100, 300], [300, null]];
const PARTS_PC = [[0, 10], [10, 25], [25, 50], [50, 75], [75, 100]];
function fmtMi(v) {
  if (v >= 1) { const n = Math.round(v); return 'R$ ' + n.toLocaleString('pt-BR') + (n === 1 ? ' milhão' : ' milhões'); }
  return 'R$ ' + (Math.max(1, Math.round(v * 10)) * 100) + ' mil';
}
function faixaMi(a, b) {
  if (b == null) return 'acima de ' + fmtMi(a);
  if (a <= 0) return 'até ' + fmtMi(b);
  return 'entre ' + fmtMi(a).replace(/ milh(ão|ões)$/, '') + ' e ' + fmtMi(b);
}
function linkDiagnostico() {
  const s = P.sessaoOrigem || '';
  if (!s.startsWith('vidasocios_')) return null;
  const resto = s.slice('vidasocios_'.length), i = resto.lastIndexOf('_');
  if (i < 1) return null;
  const grupo = resto.slice(0, i), resp = resto.slice(i + 1);
  const qp = new URLSearchParams();
  qp.set(grupo.startsWith('g_') ? 'g' : 't', grupo); qp.set('r', resp);
  return location.origin + location.pathname.replace(/[^/]+$/, 'ApresentacaoVidaSocios.html') + '?' + qp;
}
function secPorQue() {
  const R = (ORIG && ORIG.respostas) || null;
  if (!R) return '';
  const fr = [];
  const n = R.nSocios === '10+' ? 10 : Number(R.nSocios || 0);
  if (n > 1) fr.push(`Vocês são <b>${n} sócios</b>.`);
  else if (n === 1) fr.push('A empresa é <b>de um sócio só</b>.');
  if (R.b3faixa != null) {
    const V = VALORES_MI[R.b3faixa];
    if (n === 1) fr.push(`A empresa vale <b>${faixaMi(V[0], V[1])}</b>.`);
    else if (R.b4 != null) {
      const Pp = PARTS_PC[R.b4];
      fr.push(`A sua parte vale <b>${faixaMi(V[0] * Pp[0] / 100, V[1] == null ? null : V[1] * Pp[1] / 100)}</b>.`);
    }
  }
  const FONTE = { emprestimo: 'sairia de empréstimo ou da venda de algum ativo', parcelando: 'sairia de parcelas com a família, por anos',
    naosei: 'ainda não está definido de onde sairia', caixa: 'sairia do caixa, com tranquilidade' };
  if (R.b6 && FONTE[R.b6]) fr.push(`Vocês responderam que esse dinheiro <b>${FONTE[R.b6]}</b>.`);
  const MES = { nada: 'quase nada — está tudo na empresa e em imóveis', parte: 'só uma parte', naosei: 'não sabem quanto' };
  if (R.c3 && MES[R.c3]) fr.push(`E que a família conseguiria usar <b>${MES[R.c3]}</b> no mês seguinte.`);
  if (R.morte === 'dificil') fr.push('Vocês já passaram pela morte de um sócio, <b>e foi difícil</b>.');
  else if (R.morte === 'andamento') fr.push('Há uma sucessão <b>ainda em andamento</b> na sociedade.');
  if (fr.length < 2) return '';
  const lk = linkDiagnostico();
  return `<section class="secao porque" id="porque">
    <div class="rotulo">Por que vocês pediram isso</div>
    <p class="pq-texto">${fr.join(' ')}</p>
    <p class="pq-fecho">Foi por isso que vocês pediram esta cotação.</p>
    ${lk ? `<a class="btn sec nao-imprime" style="max-width:300px" href="${esc(lk)}" target="_blank">Rever o diagnóstico completo</a>` : ''}
  </section>`;
}
async function carregarOrigem() {
  if (!db || !P || !P.sessaoOrigem) return;
  try {
    const d = await db.collection('mb_apresentacoes').doc(P.sessaoOrigem).get();
    if (d.exists) { ORIG = d.data(); render(); }
  } catch (e) { console.warn('origem', e); }
}

/* A seção "qual caminho vocês querem seguir" foi retirada em 01/out: ela pedia
   uma decisão (pedido × sugestão) longe dos números que a sustentavam, e com
   palavras parecidas demais com as do "quero contratar" — o cliente lia duas
   perguntas e não sabia qual respondia o quê. A escolha do capital passou para
   a linha de cada sócio, dentro do card do produto. `P.escolhaPlano` continua
   sendo lido no estado da proposta, para as propostas antigas não perderem o
   histórico. */

const MOTIVOS = [
  ['maior', 'Quero capital maior'], ['menor', 'Quero capital menor'],
  ['incluir', 'Incluir outro sócio'], ['tirar', 'Tirar um sócio'],
  ['parcelar', 'Parcelado, em vez de pagamento único'], ['unico', 'Pagamento único, em vez de parcelado'],
  ['coberturas', 'Mudar as coberturas'], ['conversar', 'Quero conversar antes de decidir']
];
let motivosSel = [];
function marcarMotivo(k) {
  const i = motivosSel.indexOf(k); i >= 0 ? motivosSel.splice(i, 1) : motivosSel.push(k);
  document.querySelectorAll('#ajuste .op').forEach(b => b.classList.toggle('sel', motivosSel.includes(b.dataset.k)));
}
function secAjuste() {
  const ja = (P.pedidosAjuste || []).slice().reverse();
  return `<div id="ajuste">
    <p class="texto">Diga o que mudar e a corretora refaz a cotação. Pode marcar mais de um motivo.</p>
    <div class="ops chips">${MOTIVOS.map(([k, t]) => `<button class="op ${motivosSel.includes(k) ? 'sel' : ''}" data-k="${k}" onclick="marcarMotivo('${k}')">${t}</button>`).join('')}</div>
    <label class="lbl">Quer detalhar? (opcional)</label>
    <textarea class="campo" id="ajTexto" style="min-height:110px" placeholder="Ex.: o capital do Rafael pode ser menor, mas o da Helena precisa cobrir a cota inteira."></textarea>
    <button class="btn ouro" onclick="enviarAjuste()">Enviar para a corretora</button>
    <p class="nota">A proposta atual continua valendo — nada aqui apaga o que já está na tela.</p>
    <div id="ajOut"></div>
    ${ja.length ? `<h3 class="sub">Pedidos já enviados</h3><div class="painel">${ja.map(p => `<div class="resposta-item"><b>${dataBR(p.em)}${p.por ? ' · ' + esc(primeiro(p.por)) : ''}</b>${esc((p.motivos || []).map(k => (MOTIVOS.find(m => m[0] === k) || [, k])[1]).join(' · '))}${p.texto ? '<br>' + esc(p.texto) : ''}</div>`).join('')}</div>` : ''}
  </div>`;
}
async function enviarAjuste() {
  const txt = (document.getElementById('ajTexto').value || '').trim();
  if (!motivosSel.length && !txt) { toast('Marque um motivo ou escreva o que mudar'); return; }
  if (bloqueadoNoPreview('ajOut')) return;
  const reg = { motivos: motivosSel.slice(), texto: txt || null, por: (EU && EU.nome) || '', papel: papel(), em: new Date().toISOString() };
  P.pedidosAjuste = (P.pedidosAjuste || []).concat([reg]);
  try { await gravar({ pedidosAjuste: P.pedidosAjuste, interesse: 'ajuste', interesseEm: reg.em }); }
  catch (e) { toast('Não consegui enviar agora'); console.warn(e); return; }
  motivosSel = [];
  document.getElementById('ajOut').innerHTML = `<div class="gerado"><b>Enviado.</b><br>A corretora recebeu o pedido e volta com a cotação ajustada.</div>`;
  document.getElementById('ajTexto').value = '';
  toast('Pedido enviado');
}

function render() {
  const app = document.getElementById('app');
  const partes = [];
  if (DEMO) partes.push(`<div class="demo nao-imprime">Demonstração — dados fictícios, nada é gravado</div>`);
  if (!ehConsultor()) partes.push(secAbertura());
  partes.push(secCapa());
  if (ehConsultor()) {
    /* contador e advogado: a página deles é curta e vai direto ao ponto */
    partes.push(secBannerConsultor(), secProposta(), secFundamentos());
  } else {
    if (papel() === 'socio' && !jaRespondeu()) partes.push(secConviteChecklist());
    /* A ordem é a da decisão: por que → os números (onde se marca) → prosseguir
       → quem assina → os links → acompanhamento. O menu de aprofundamento fica
       por último entre eles, fechado: é consulta, não caminho. */
    partes.push(secPorQue(), secProposta(), secContratar(), secResponsavel(),
                secLinks(), secAcompanhamento(), secMenu());
  }
  partes.push(`<div class="rodape">${esc(CORRETORA.nome)} · corretora de seguros<br>Proposta sujeita à aceitação da seguradora. Valores da cotação de ${dataBR(P.dataCotacao)}.<br><a href="#" onclick="falarCorretora();return false">Falar com a corretora</a></div>`);

}

/* ═══════════════ ABERTURA ═══════════════
   A apresentação tinha uma ideia por tela; a proposta virava um relatório e
   perdia o momento de parar. Esta é a única tela da proposta: a frase que o
   dono levaria para o sócio, com os números dele. O documento começa abaixo. */
function meuSocioId() {
  if (EU && EU.socioId) return EU.socioId;
  if (papel() === 'principal' && P.destinatario && P.destinatario.socioId) return P.destinatario.socioId;
  return null;
}
function secAbertura() {
  if (ehConsultor()) return '';
  const pc = itensPC(), rg = itensRG();
  if (!pc.length && !rg.length) return '';
  const sid = meuSocioId();
  const meuPC = sid ? pc.find(i => i.socioId === sid) : null;
  const meuRG = sid ? rg.find(i => i.socioId === sid) : null;
  const pessoal = !!(meuPC || meuRG);
  /* Sem saber quem está lendo, a conta é a da empresa inteira ("até"), e não a
     de um sócio qualquer: capital de terceiro não é manchete de ninguém. */
  const somaPC = pc.reduce((a, i) => a + (Number(i.capital) || 0), 0);
  const somaRG = rg.reduce((a, i) => a + (Number(i.capital) || 0), 0);
  const capPC = meuPC ? meuPC.capital : somaPC;
  const capRG = meuRG ? meuRG.capital : somaRG;
  const linhas = [];
  /* O dinheiro da Pessoa Chave não é só "pagar a família": é o que mantém a
     empresa de pé no semestre seguinte. Dizer para que ele serve, item a item,
     é o que separa a proposta de um número solto na tela. */
  if (capPC) linhas.push(['', (meuPC ? '' : 'até ') + brlc(capPC), meuPC
    ? 'entram no caixa da <b>empresa</b> — para comprar as cotas da sua família, segurar o caixa nos meses de reorganização e pagar a papelada da alteração contratual, sem travar investimento nenhum'
    : 'entram no caixa da <b>empresa</b> — para comprar as cotas de quem faltar, segurar o caixa nos meses de reorganização e pagar a papelada da alteração contratual, sem travar investimento nenhum']);
  if (capRG) linhas.push(['ouro', (meuRG ? '' : 'até ') + brlc(capRG), meuRG
    ? 'vão direto para os <b>beneficiários que você escolher</b> — em dias, fora do inventário e sem imposto de renda'
    : 'vão direto para os <b>beneficiários que cada sócio escolher</b> — em dias, fora do inventário e sem imposto de renda']);
  /* "Você ou um sócio": a proposta costuma ser lida com os sócios juntos, e o
     risco que importa para a empresa é o de qualquer um deles. */
  const titulo = pessoal
    ? 'Se você ou um sócio faltar amanhã, <em>ninguém precisa improvisar.</em>'
    : 'Se um dos sócios faltar amanhã, <em>ninguém precisa improvisar.</em>';
  return `<section class="abertura">
    <div class="ab-rot">Proposta Vida Sócios · ${esc(P.empresa.nome)}</div>
    <h1 class="ab-t">${titulo}</h1>
    <div class="ab-linhas">
      ${linhas.map(([cl, n, t]) => `<div class="ab-l ${cl}"><span class="ab-n">${n}</span><span class="ab-d">${t}</span></div>`).join('')}
    </div>
    <p class="ab-pe">É isto que esta proposta contrata. Abaixo estão os números, sócio a sócio, e o que fazer para seguir.</p>

    <div class="ab-seta nao-imprime" onclick="document.getElementById('porque')?.scrollIntoView({behavior:'smooth'}) || document.querySelector('.capa').scrollIntoView({behavior:'smooth'})">↓</div>
  </section>`;
}
/* A frase que o dono manda no grupo dos sócios. Usa os totais da empresa, e não
   o capital de quem está lendo: capital é assunto de cada um. */
function resumoParaSocios() {
  const pc = itensPC(), rg = itensRG();
  const mensal = P.pessoaChave && P.pessoaChave.pagamento === 'mensal';
  const totPC = pc.reduce((a, i) => a + (Number(mensal ? i.premioMensal : i.premioAnual) || 0), 0);
  const totRG = rg.reduce((a, i) => a + (Number(i.premioUnico || i.premio) || 0), 0);
  const capPC = pc.reduce((a, i) => a + (Number(i.capital) || 0), 0);
  const L = [];
  const emp = String(P.empresa.nome || '').replace(/\.\s*$/, '');
  L.push(`Recebemos a proposta do seguro de vida dos sócios da ${emp}. Em resumo:`, '');
  if (pc.length) L.push(`• Se um sócio faltar, a empresa recebe até ${brlc(capPC)} para pagar a parte dele à família, sem tirar dinheiro da operação. Custa ${brlc(totPC)} ${mensal ? 'por mês' : 'por ano'}.`);
  if (rg.length) L.push(`• A família de cada sócio segurado recebe direto, em dias, fora do inventário e sem imposto de renda. A empresa paga ${brlc(totRG)} uma vez só.`);
  L.push('', 'A proposta inteira, com os números de cada um e o que o contrato social já obriga, está aqui:', linkProposta(VTOK || ''), '', 'Vale a gente olhar junto antes de decidir.');
  return L.join('\n');
}

  const ids = new Set([...itensPC(), ...itensRG()].map(i => i.socioId));
  ids.forEach(id => { const s = socio(id); const a = proxAniv(s.nascimento); if (a && val && a <= val) aniv.push(`${esc(primeiro(s.nome))} faz ${idade(s.nascimento) + 1} anos em ${a.toLocaleDateString('pt-BR')}`); });
  const nomeDest = P.destinatario && P.destinatario.nome;
  return `<section class="capa">
    <div class="rotulo">Proposta Vida Sócios</div>
    <h1>${esc(P.empresa.nome)}</h1>
    <p class="texto" style="margin-bottom:6px">${nomeDest ? 'Preparada para ' + esc(nomeDest) + '. ' : ''}Com base no que vocês responderam, no contrato social e nos números da empresa.</p>
    <div class="meta">
      <span class="est ${esc(estado().c)}">${esc(estado().t)}</span>
      ${P.validade ? `<span class="ouro">Válida até ${dataBR(P.validade)}</span>` : ''}
      <span>Cotação de ${dataBR(P.dataCotacao)}</span>
      ${P.empresa.cnpj ? `<span>CNPJ ${esc(P.empresa.cnpj)}</span>` : ''}
      ${P.empresa.cidade ? `<span>${esc(P.empresa.cidade)}</span>` : ''}
    </div>
    ${aniv.length ? `<div class="aviso ouro">Cada preço foi calculado com a idade de hoje. Se um aniversário passar antes da contratação, o valor pode mudar: ${listaNomes(aniv)}.</div>` : ''}
  </section>`;
}
/* Em que pé está a proposta — a primeira coisa que quem reabre quer saber. */
function estado() {
  const prods = produtosNaProposta();
  const todas = prods.map(([k]) => etapasDe(k));
  if (todas.length && todas.every(E => E.resultado && E.resultado.tipo)) return { t: 'Concluída', c: 'ok' };
  if (todas.some(E => (E.pendencias || []).some(x => !x.resolvidoEm))) return { t: 'Com pendência da seguradora', c: 'al' };
  if (todas.some(E => E.transmitida)) return { t: 'Em análise na seguradora', c: 'ok' };
  if (P.contratar) return { t: 'Em contratação', c: 'ok' };
  if (P.escolhaPlano) return { t: 'Caminho escolhido', c: 'ok' };
  if ((P.pedidosAjuste || []).length) return { t: 'Ajuste pedido à corretora', c: 'al' };
  return { t: 'Em análise de vocês', c: '' };
}

let parecerSel = null;
function marcarParecer(k) { parecerSel = k; document.querySelectorAll('#parecer .op').forEach(b => b.classList.toggle('sel', b.getAttribute('onclick').includes("'" + k + "'"))); document.querySelectorAll('#parecer .op').forEach(b => b.classList.toggle('g', b.classList.contains('sel'))); }
async function enviarParecer() {
  const atual = P.convidados && P.convidados[VTOK] && P.convidados[VTOK].parecer;
  const status = parecerSel || (atual && atual.status);
  if (!status) { toast('Escolha uma das opções'); return; }
  const par = { status, texto: document.getElementById('parecerTxt').value.trim(), em: new Date().toISOString() };
  P.convidados = P.convidados || {}; P.convidados[VTOK] = Object.assign(P.convidados[VTOK] || {}, { parecer: par });
  try { await gravar({ ['convidados.' + VTOK + '.parecer']: par }); toast('Parecer enviado. Obrigado!'); } catch (e) { toast('Não foi possível enviar agora'); console.warn(e); }
}

/* Preço sem referência é número solto: o dono não sabe se é caro ou barato.
   A âncora é factual — o custo anual sobre o capital que está protegido.
   (Se um dia incomodar, é só apagar esta linha.) */
function ancora(capital, custoAno, quando) {
  if (!capital || !custoAno) return '';
  const pct = custoAno / capital * 100;
  return `<p class="ancora">Em números redondos: <b>${brlc(custoAno)} ${quando}</b> mantêm <b>${brlc(capital)}</b> garantidos — cerca de <b>${pct.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}% ao ano</b> do que está protegido.</p>`;
}
function secProposta() {
  const pc = itensPC(), rg = itensRG();
  const totPC = pc.reduce((a, i) => a + (Number(i.premioAnual) || 0), 0);
  const totPCm = pc.reduce((a, i) => a + (Number(i.premioMensal) || 0), 0);
  const mensal = P.pessoaChave && P.pessoaChave.pagamento === 'mensal';
  const totRG = rg.reduce((a, i) => a + (Number(i.premioUnico) || 0), 0);
  const unico = !P.resgatavel || !P.resgatavel.pagamento || P.resgatavel.pagamento === 'unico';
  let h = `<section class="secao" id="proposta"><div class="rotulo">O que estamos propondo</div>
    <h2 class="titulo">${pc.length && rg.length ? 'Um paga a cota. <em>O outro paga o mês seguinte.</em>' : pc.length ? 'Dinheiro no caixa <em>no dia em que a cota precisa ser paga.</em>' : 'Dinheiro para a família, <em>fora do inventário.</em>'}</h2>`;
  if (pc.length && rg.length) h += `<div class="aviso">Os dois preços não são a mesma coisa, e é por isso que aparecem separados.
    <b>A Pessoa Chave é custo</b>, que se repete todo ano — como o seguro de incêndio do galpão.
    <b>O Resgatável é reserva</b>: sai do caixa uma vez e volta quase inteiro se um dia vocês não quiserem mais.</div>`;
  if (pc.length) h += `<div class="cardp">
    <div class="selo2">Pessoa Chave · a empresa recebe</div>
    <h2>Para pagar a parte do sócio que faltar</h2>
    <p>Se um sócio falecer, a empresa recebe o capital e paga os haveres aos herdeiros sem tirar dinheiro da operação.</p>
    ${ehSocio() ? `<p class="instr-mk">Marque quem você quer incluir. ${temSug('pc') ? 'Onde a nossa sugestão é diferente, escolha o capital que faz sentido. ' : ''}Marcar aqui não contrata nada.</p>` : ''}
    <div class="ln-lista">${pc.map(i => linhaSocio('pc', i, mensal)).join('')}</div>
    ${rodapeCard('pc', mensal ? 'por mês' : 'por ano')}
    ${ancora(pc.reduce((a, i) => a + (Number(i.capital) || 0), 0), (mensal ? totPCm * 12 : totPC), 'por ano')}
    ${porqueSugestao('pc')}
    <p class="nota">Capital corrigido pelo IPCA. O valor é recalculado a cada aniversário pela idade, além do IPCA. Não tem resgate: se ninguém faltar, é o custo de a cláusula de haveres ter dinheiro garantido. Doenças graves e invalidez, quando incluídas, pagam ao próprio sócio.${P.pessoaChave.nota ? ' ' + esc(P.pessoaChave.nota) : ''}</p>
  </div>`;
  if (rg.length) h += `<div class="cardp rg">
    <div class="selo2">Resgatável · a família recebe</div>
    <h2>Para a família de cada sócio</h2>
    <p>Se o sócio falecer, os beneficiários que ele escolher recebem o capital em dinheiro, sem inventário e sem imposto de renda.</p>
    ${ehSocio() ? `<p class="instr-mk">Marque quem você quer incluir. ${temSug('rg') ? 'Onde a nossa sugestão é diferente, escolha o capital que faz sentido. ' : ''}Marcar aqui não contrata nada.</p>` : ''}
    <div class="ln-lista">${rg.map(i => linhaSocio('rg', i, false)).join('')}</div>
    ${rodapeCard('rg', unico ? 'uma vez só' : 'no total')}
    ${porqueSugestao('rg')}
    <p class="nota">Sem reajuste pela idade; capital corrigido pelo IPCA todo ano. Pode ser resgatado a partir do 7º mês (veja a projeção abaixo). ${P.resgatavel.versao === 'sem_dps' ? 'Versão sem questionário de saúde: 24 meses de carência para morte por doença; acidente coberto desde o primeiro dia.' : 'Versão com questionário de saúde: sem carência.'}</p>
  </div>`;
  /* A projeção de custo ao longo do tempo saiu da tela do cliente (decisão de
     25/09): mostrar o custo acumulado convida o empresário a fazer a conta do
     "e se eu não morrer", que joga contra. O dado continua no JSON para uso
     interno. A regra do reajuste por idade fica dita em uma linha, acima. */
  if (false) {
    h += `<div class="painel"><h3 class="sub" style="margin-top:0">Quanto a Pessoa Chave deve custar ao longo do tempo</h3>
    <table class="t"><tr><th>Ano</th><th class="num">Estimativa por ano</th></tr>${P.pessoaChave.projecao.map(x => `<tr><td>${x.ano}º ano</td><td class="num">${brl(x.valor)}</td></tr>`).join('')}</table>
    <p class="nota">Estimativa com o reajuste por idade das condições do produto e IPCA de 5% ao ano (exemplo). O valor real depende do IPCA de cada ano.</p></div>`;
  }
  return h + `</section>`;
}

/* ---------- checklist ---------- */
function jaRespondeu() { const c = P.checklist && P.checklist[VTOK || 'demo']; return !!(c && (c.r || c.pulou)); }
function secChecklist() {
  const meu = VTOK || 'demo';
  const respondentes = Object.entries(P.checklist || {}).filter(([, v]) => v && v.r).sort((a, b) => (a[1].em || '').localeCompare(b[1].em || ''));
  let h = `<section class="secao" id="checklist"><div class="rotulo">Para a empresa pensar</div>`;
  if (ehSocio() && !jaRespondeu()) {
    h += `<h2 class="titulo">Dez perguntas. <em>Responda o que você acredita hoje.</em></h2>
    <p class="texto">${papel() === 'socio' ? 'Suas respostas vão para a corretora. ' : 'Depois, você pode pedir a visão de outro sócio — cada um responde a sua, em separado. '}Não existe resposta certa: é o retrato de hoje. Leva uns 2 minutos.</p>
    <div class="painel">${CHECK.map((c, i) => `<div class="perg"><p>${i + 1}. ${esc(c.t)}</p><div class="tri">${['s', 'n', 'q'].map(k => `<button class="op ${rascunhoCheck[c.id] === k ? 'sel ' + k : ''}" onclick="marcarCheck('${c.id}','${k}')">${RLAB[k]}</button>`).join('')}</div></div>`).join('')}</div>
    <button class="btn" id="btnCheck" onclick="salvarCheck()" ${Object.keys(rascunhoCheck).length < CHECK.length ? 'disabled' : ''}>Ver o resultado</button>
    <p class="nota">Pode pular: <a href="#" style="color:var(--suave)" onclick="pularCheck();return false">ver a proposta sem responder</a>.</p>`;
    return h + `</section>`;
  }
  if (!respondentes.length) {
    h += `<h2 class="titulo">Dez perguntas para a sociedade</h2><div class="painel">${CHECK.map((c, i) => `<div class="resposta-item">${i + 1}. ${esc(c.t)}</div>`).join('')}</div>`;
    return h + `</section>`;
  }
  const cols = respondentes.map(([k, v]) => ({ k, nome: primeiro(v.nome) || 'Sócio', r: v.r }));
  const alertas = CHECK.filter(c => cols.some(x => x.r[c.id] !== 's'));
  const souEu = cols.length === 1;

  /* Com mais de um respondente, o resultado é CONSOLIDADO e sem dono.
     Sociedade em que os sócios não se dão bem é a regra, não a exceção: expor
     "fulano respondeu não e você respondeu sim" pode estourar a relação e o
     negócio junto. A divergência continua visível para o corretor, na ficha. */
  if (souEu) {
    h += `<h2 class="titulo">O que você respondeu</h2>
      <p class="texto">${alertas.length ? `<b>${alertas.length} de ${CHECK.length}</b> pontos ainda não estão resolvidos.` : 'Todos os pontos marcados como resolvidos.'}</p>
      <div class="painel">${CHECK.map((c, i) => {
        const r = cols[0].r[c.id];
        return `<div class="perg" style="padding:9px 0"><p style="margin:0">${i + 1}. ${esc(c.t)} <span class="r ${r || 'q'}" style="margin-left:6px">${RICO[r] || '·'}</span></p></div>`;
      }).join('')}<p class="nota">✓ sim · ✕ não · ? não sei</p></div>`;
  } else {
    h += `<h2 class="titulo">O retrato da sociedade, <em>somando as respostas</em></h2>
      <p class="texto"><b>${cols.length} pessoas</b> responderam. ${alertas.length
        ? `Em <b>${alertas.length} de ${CHECK.length}</b> pontos, pelo menos uma resposta foi "não" ou "não sei" — são esses que valem uma conversa entre vocês.`
        : 'Todos os pontos aparecem como resolvidos nas respostas de todos.'}</p>
      <p class="nota">As respostas individuais não aparecem aqui: cada um respondeu em separado, e o que importa para a proposta é o retrato do conjunto.</p>
      <div class="painel">${CHECK.map((c, i) => {
        const aberto = cols.some(x => x.r[c.id] !== 's');
        return `<div class="perg" style="padding:9px 0"><p style="margin:0">${i + 1}. ${esc(c.t)}
          <span class="r ${aberto ? 'n' : 's'}" style="margin-left:6px">${aberto ? '!' : '✓'}</span></p></div>`;
      }).join('')}<p class="nota">✓ resolvido para todos · ! ponto aberto</p></div>`;
  }
  if (alertas.length) {
    h += `<h3 class="sub">Pontos que valem uma conversa entre vocês antes de assinar</h3><div class="painel">${alertas.map(c => `<div class="resposta-item"><b>${esc(c.t)}</b>${esc(c.r)}</div>`).join('')}</div>`;
    /* O checklist não pode terminar num placar: cada tipo de ponto aberto tem
       um lugar para onde ir. */
    const g = (P.analise || {}).gaps || [];
    h += `<h3 class="sub">O que fazer com isso agora</h3>
      ${g.length ? `<button class="btn sec" onclick="abrirFolha('gaps')">Ver o que o contrato ainda não responde</button>` : ''}
      <button class="btn sec" onclick="abrirFolha('fund')">Mandar para o contador e o advogado</button>
      ${ehSocio() ? `<button class="btn sec" onclick="abrirFolha('socios')">Pedir a visão dos outros sócios</button>` : ''}
      <button class="btn sec" onclick="falarCorretora()">Falar com a corretora</button>`;
  } else {
    h += `<p class="texto" style="margin-top:16px">Nenhum ponto em aberto. Se ainda faltar alguma coisa para decidir, é o momento de dizer o que é.</p>
      <button class="btn sec" onclick="abrirFolha('ajuste')">Quero outro desenho</button>
      <button class="btn sec" onclick="falarCorretora()">Falar com a corretora</button>`;
  }
  return h + `</section>`;
}

      <div class="barras">${i.resgate.map(x => `<div class="barra-l"><span>${x.ano}º ano</span><span>${brl(x.valor)}</span></div><div class="barra"><span style="width:${(x.valor / max * 100).toFixed(1)}%"></span><i style="left:${(pago / max * 100).toFixed(1)}%"></i></div>`).join('')}</div>
      <p class="nota">A linha branca marca o valor pago.${cruza ? ` O resgate passa o valor pago no ${cruza}º ano da tabela.` : ''}</p></div>`;

let convPapel = 'contador';
function escolherConv(k) { convPapel = k; document.querySelectorAll('#convite .tri .op').forEach(b => { const on = b.getAttribute('onclick').includes("'" + k + "'"); b.classList.toggle('sel', on); b.classList.toggle('g', on); }); }
function mensagemConsultor(nome, pap, link) {
  const pc = itensPC(), rg = itensRG();
  const mensal = P.pessoaChave && P.pessoaChave.pagamento === 'mensal';
  const totPC = pc.reduce((a, i) => a + (Number(mensal ? i.premioMensal : i.premioAnual) || 0), 0);
  const totRG = rg.reduce((a, i) => a + (Number(i.premioUnico || i.premio) || 0), 0);
  const L = [];
  L.push(`Olá, ${primeiro(nome)}.`, '');
  L.push(`Estamos avaliando contratar, pela ${P.empresa.nome}, ${pc.length && rg.length ? 'dois seguros de vida' : 'um seguro de vida'} para os sócios, pagos pela empresa:`, '');
  if (pc.length) L.push(`• Pessoa Chave: se um sócio falecer, a empresa recebe o capital para pagar a parte dele aos herdeiros. ${pc.map(i => socio(i.socioId).nome + ' — ' + brl(i.capital)).join('; ')}. Custo aproximado de ${brlc(totPC)} ${mensal ? 'por mês' : 'por ano'}, recalculado a cada ano pela idade e pelo IPCA. Não tem resgate.`);
  if (rg.length) L.push(`• Resgatável: a empresa paga uma vez ${brlc(totRG)}; se o sócio falecer, a família recebe o capital, fora do inventário (${rg.map(i => socio(i.socioId).nome + ' — ' + brl(i.capital)).join('; ')}). Pode ser resgatado a partir do 7º mês.`);
  L.push('', 'Antes de decidir, preciso que você verifique:');
  const qs = pap === 'advogado' ? FUND.juridico.confirmar : [...FUND.fiscal.confirmar, ...FUND.contabil.confirmar.slice(0, 1)];
  qs.forEach((q, i) => L.push(`${i + 1}. ${q}`));
  L.push('', 'A corretora reuniu os fundamentos (trechos de lei e das condições do seguro) neste link. Peço que confirme se procedem ou aponte o que precisa ajustar — dá para responder por lá mesmo:', link, '', 'Obrigado,', (EU && EU.nome) || (P.destinatario && P.destinatario.nome) || '');
  return L.join('\n');
}

  const corpo = mensagemConsultor(nome, convPapel, link);
  document.getElementById('cOut').innerHTML = `<label class="lbl">Mensagem (pode editar antes de enviar)</label><textarea class="campo" id="cMsg" style="min-height:260px">${esc(corpo)}</textarea>
    <div class="linha-btns"><button class="btn" onclick="abrirEmail(${JSON.stringify(email).replace(/"/g, '&quot;')}, ${JSON.stringify(assunto).replace(/"/g, '&quot;')})">Abrir no meu e-mail</button><button class="btn verde" onclick="abrirWhats()">WhatsApp</button></div>
    <button class="btn sec" onclick="copiar(document.getElementById('cMsg').value)">Copiar texto</button>`;
}
function abrirEmail(email, assunto) { location.href = 'mailto:' + encodeURIComponent(email || '') + '?subject=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(document.getElementById('cMsg').value); }
function abrirWhats() { window.open('https://wa.me/?text=' + encodeURIComponent(document.getElementById('cMsg').value), '_blank'); }

/* ═══════════════ PROSSEGUIR ═══════════════
   Uma seção só, depois dos cards: o que foi marcado, e o botão. Os cinco passos
   do "o que acontece quando vocês disserem sim" continuam aqui, mas fechados —
   quem quer ler, abre; quem já decidiu, segue. */
function secContratar() {
  if (!ehSocio()) return '';
  iniciarEscolha();
  const aceites = Object.entries(P.aceites || {});
  const mk = marcados();
  const jaGerou = aceites.length;
  const tPC = totalMarcado('pc'), tRG = totalMarcado('rg');
  const mensal = P.pessoaChave && P.pessoaChave.pagamento === 'mensal';

  let h = `<section class="secao nao-imprime" id="contratar"><div class="rotulo">Prosseguir</div>`;
  h += `<details class="sanfona"><summary><span>O que acontece quando vocês disserem sim</span><span class="sf-seta">›</span></summary>
    <ol class="passos-n">
      <li><b>Vocês marcam quem entra</b>, na linha de cada sócio, ali em cima.</li>
      <li><b>Cada sócio recebe um link</b> e preenche os próprios dados e a declaração de saúde — leva uns 10 minutos, e o que um responde não aparece para os outros.</li>
      <li><b>Uma pessoa assina pela empresa.</b> Pode ser um dos sócios ou alguém com poderes para assinar; a gente pede os dados dela no passo seguinte.</li>
      <li><b>A seguradora analisa.</b> Pode aceitar, pedir exames ou ajustar condições, conforme a idade e o capital.</li>
      <li><b>Sai a apólice</b> e o pagamento é feito na forma escolhida. Vocês acompanham cada etapa por esta mesma página.</li>
    </ol></details>`;

  if (!podeMarcar() && !jaGerou) {
    h += `<p class="texto">Quem recebeu esta proposta marca quem entra. Se quiser mudar alguma coisa, fale com ${esc(primeiro((P.destinatario || {}).nome) || 'quem a recebeu')} ou com a corretora.</p>`;
    return h + `</section>`;
  }

  if (!mk.length) {
    h += `<div class="resumo-mk vazio"><b>Nada marcado ainda.</b>
      <p>Volte aos cards acima e toque em <b>“Quero este”</b> na linha de cada sócio que deve entrar. Dá para marcar num produto só, ou nos dois.</p></div>`;
    return h + `</section>`;
  }

  const linhas = mk.map(([id, v]) => {
    const s = socio(id);
    const partes = [];
    if (v.pc) partes.push(`Pessoa Chave ${brl(capEscolhido('pc', id))}`);
    if (v.rg) partes.push(`Resgatável ${brl(capEscolhido('rg', id))}`);
    return `<div class="rm-l"><div><b>${esc(s.nome)}</b><small>${partes.join(' · ')}</small></div>
      <button class="rm-x" onclick="desmarcarTudo('${id}')" title="Tirar da lista">✕</button></div>`;
  }).join('');
  const tot = [];
  if (tPC.n) tot.push(`${tPC.faltam >= tPC.n ? 'a cotar' : brlc(tPC.v)} ${mensal ? 'por mês' : 'por ano'}`);
  if (tRG.n) tot.push(`${tRG.faltam >= tRG.n ? 'a cotar' : brlc(tRG.v)} uma vez só`);
  const faltando = tPC.faltam + tRG.faltam;

  h += `<h2 class="titulo">${mk.length === 1 ? 'Um sócio marcado' : mk.length + ' sócios marcados'}</h2>
    <div class="resumo-mk">${linhas}
      <div class="rm-tot"><span>Total do que está marcado</span><strong>${tot.join('  +  ')}</strong></div>
      ${faltando ? `<p class="nota">${faltando} ${faltando === 1 ? 'capital ainda sem cotação' : 'capitais ainda sem cotação'} — o valor final sobe quando a seguradora responder.</p>` : ''}
    </div>
    <button class="btn ouro" onclick="confirmarContratar()">${jaGerou ? 'Atualizar e gerar os links' : 'Prosseguir com estes'}</button>
    <p class="nota">Prosseguir não contrata nada: é o que libera o link de cada sócio e abre o passo da assinatura. ${P.validade ? 'Esta proposta vale até ' + dataBR(P.validade) + '; depois dessa data os valores são recalculados pela idade de cada sócio.' : 'Os valores são recalculados pela idade de cada sócio a cada aniversário.'}</p>`;
  return h + `</section>`;
}
function desmarcarTudo(id) { iniciarEscolha(); escolha[id].pc = false; escolha[id].rg = false; atualizar(); }

/* ═══════════════ OS LINKS DE CADA SÓCIO ═══════════════
   Vem depois da assinatura: o aceite digital da empresa e o de cada segurado
   são a mesma etapa, e separar os dois lugares era o que fazia a página parecer
   um labirinto. Cada linha tem o link, para copiar ali mesmo. */
function secLinks() {
  if (!ehSocio()) return '';

  return `<section class="secao nao-imprime" id="links"><div class="rotulo">Links</div>

        <span class="pill ${a.status === 'preenchido' ? 'ok' : a.status === 'iniciado' ? 'al' : 'esp'}">${{ preenchido: 'Preenchido', iniciado: 'Em andamento' }[a.status] || 'Aguardando'}</span>
        ${a.status !== 'preenchido' ? `<div class="linha-btns" style="width:100%">
          ${meu ? `<a class="btn" href="${esc(link)}">Preencher o meu agora</a>` : `<a class="btn verde" target="_blank" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar no WhatsApp</a>`}
          <button class="btn sec" onclick="copiar(${esc(JSON.stringify(link))})">Copiar link</button></div>` : ''}</div>`;

async function confirmarContratar() {
  if (DEMO) { alert('Esta é a pré-visualização — aqui nada é gravado e os links de aceite não funcionariam.\n\nNo editor, clique em "Salvar e gerar link", abra a proposta salva e a contratação funciona normalmente.'); return; }
  const mk = marcados();
  if (!mk.length) { toast('Marque pelo menos um sócio'); return; }
  P.aceites = P.aceites || {};
  const upd = { contratar: { itens: JSON.parse(JSON.stringify(escolha)), em: new Date().toISOString(), por: (EU && EU.nome) || '' }, interesse: 'contratar', interesseEm: new Date().toISOString() };
  mk.forEach(([sid, v]) => {
    let t = Object.keys(P.aceites).find(k => P.aceites[k].socioId === sid);
    if (!t) { t = token(); P.aceites[t] = { socioId: sid, nome: socio(sid).nome, status: 'enviado', criadoEm: new Date().toISOString() }; }
    P.aceites[t].pc = !!v.pc; P.aceites[t].rg = !!v.rg;
    /* o capital que ELE escolheu viaja junto: o aceite e a transmissão usam este */
    P.aceites[t].capitalPc = v.pc ? capEscolhido('pc', sid) : null;
    P.aceites[t].capitalRg = v.rg ? capEscolhido('rg', sid) : null;
    upd['aceites.' + t] = P.aceites[t];
  });
  /* sócio que foi desmarcado depois de ter link: o link morre junto */
  Object.keys(P.aceites).forEach(t => {
    const a = P.aceites[t];
    if (!mk.some(([sid]) => sid === a.socioId)) { delete P.aceites[t]; upd['aceites.' + t] = null; }
  });
  P.contratar = upd.contratar;
  try { await gravar(upd); toast('Pronto — os links estão abaixo'); } catch (e) { toast('Não foi possível salvar agora'); console.warn(e); return; }
  render();
  const alvo = document.getElementById('responsavel') || document.getElementById('links');
  if (alvo) alvo.scrollIntoView({ behavior: 'smooth' });
}
