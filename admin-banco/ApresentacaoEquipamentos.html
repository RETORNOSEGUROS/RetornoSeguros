const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const brlC = n => n == null ? '—' : n >= 1e6 ? 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : 'R$ ' + Math.round(n / 1e3).toLocaleString('pt-BR') + ' mil';
function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }
function tela(html) { TELAS++; palco.innerHTML = `<div class="cena">${html}</div>`; window.scrollTo(0, 0); }
let _ecoT = null;
function eco(txt) { const e = $('eco'); if (!txt) return; clearTimeout(_ecoT);
  const ms = Math.min(9000, Math.max(3800, txt.replace(/<[^>]+>/g, '').length * 55));
  e.innerHTML = txt + `<i style="animation:ecoBar ${ms}ms linear forwards;"></i>`; e.classList.add('on'); e.onclick = () => e.classList.remove('on');
  _ecoT = setTimeout(() => e.classList.remove('on'), ms); }
let _jaDigitou = false;
async function digitar(el, html) {
  if (_jaDigitou) { el.innerHTML = html; return; }
  _jaDigitou = true; let pular = false; const sk = () => { pular = true; }; window.addEventListener('pointerdown', sk);
  let buf = ''; outer: for (const p of html.split(/(<[^>]+>)/g).filter(Boolean)) {
    if (p.startsWith('<')) { buf += p; continue; }
    for (const ch of p) { if (pular) break outer; buf += ch; el.innerHTML = buf + '<span class="cursor"></span>'; await espera('.!?'.includes(ch) ? 110 : ',;:'.includes(ch) ? 45 : 13); }
  }
  window.removeEventListener('pointerdown', sk); el.innerHTML = html;
}
/* pergunta de um clique: grava {valor, texto}, dá a devolutiva e segue — nada espera o cliente */
function umClique(campo, opcoes, prox, ecoFn, cls) {
  return `<div class="opcoes ${cls || 'lista'}" data-campo="${campo}">${opcoes.map((o, k) => `<button class="op ${cls === 'grade tipos' ? 'tipo' : ''}" data-k="${k}">${o.ic ? `<span class="ic">${o.ic}</span>` : ''}${o.t}${o.d ? `<small>${o.d}</small>` : ''}</button>`).join('')}</div>`;
}
function ligarClique(campo, opcoes, prox, ecoFn) {

    RESP[campo] = { valor: o.v, texto: o.t }; salvar();

}

/* ══════════ 6 · RESULTADO ══════════ */
function calcular() {
  const v = c => (RESP[c] || {}).valor;
  const pV = { ate100: 1, '100_300': 2, '300_1mi': 3, '1_3mi': 4, '3mi_mais': 5 }[v('eqValor')] || 0;
  const pR = { semanas: 1, '1_3': 2, '3_6': 4, '6_mais': 5 }[v('eqReposicao')] || 0;
  const pP = { ate20: 1, '20_100': 2, '100_500': 4, '500_mais': 5, naosei: 2 }[v('eqParada')] || 0;
  const pO = { dentro: 1, ambos: 3, circula: 5 }[v('eqOnde')] || 0;
  const surpresas = QUIZ.filter(q => (RESP['quiz_' + q.id] || {}).surpresa).length;
  const pct = Math.round((pV + pR + pP + pO) / 20 * 100);
  const nivel = pct >= 65 ? 'ALTA' : pct >= 40 ? 'MODERADA' : 'CONTROLADA';
  const r = REPOSICAO.find(x => x.v === v('eqReposicao')), p = PARADA.find(x => x.v === v('eqParada'));
  const paradaTotal = r && p && p.mid ? p.mid * r.meses : null;
  return { pct, nivel, surpresas, paradaTotal };
}

  if (v('eqReposicao') === '6_mais') cards.push(['at', '🌎', '<b>Reposição longa, provável importação.</b> Preço atrelado ao dólar pede limite revisado todo ano — ou a cláusula que dá folga de até 30%.']);
  if (R.surpresas) cards.push(['at', '💡', `<b>Você se surpreendeu em ${R.surpresas} de ${QUIZ.length} cenários.</b> É a reação da maioria: quase ninguém sabe onde termina a proteção do empresarial.`]);
  if (v('eqFinanciada') && v('eqFinanciada') !== 'quitada') cards.push(['at', '🏦', '<b>Máquina financiada.</b> Numa perda total, a parcela continua chegando. O banco pode ser beneficiário da apólice.']);

  tela(`<div class="rotulo">Seu retrato</div><div class="titulo">A ${esc(nomeTipo())} que <em>não pode parar</em>.</div>
    <div class="term"><div style="font-size:12px; color:var(--suave); letter-spacing:.1em; text-transform:uppercase; font-weight:700;">Exposição da operação a essa máquina</div>
      <div class="num-grande" style="color:${R.nivel === 'ALTA' ? '#f87171' : R.nivel === 'MODERADA' ? '#fbbf24' : '#34d399'};">${R.nivel}</div>
      <div class="term-barra"><div class="term-fill" id="fill"></div></div><div class="term-leg"><span>Controlada</span><span>Moderada</span><span>Alta</span></div></div>
    <div style="margin-top:18px;">${cards.map(([c, i, x]) => `<div class="card-r ${c}"><span style="font-size:18px;">${i}</span><span>${x}</span></div>`).join('')}</div>
    ${quer.length ? `<div class="destaque">Você marcou como importantes: <strong>${quer.join(' · ')}</strong>. É por aí que a simulação começa.</div>` : ''}
    <div class="pergunta">Faz sentido simular um seguro só para as máquinas que não podem parar?</div>
    <div class="opcoes"><button class="op" id="alSim">Faz sentido</button><button class="op" id="alDuv">Ainda tenho dúvidas</button></div>
    <div id="alR" style="display:none; font-size:14px; color:#c3d0ec; line-height:1.6; margin-top:12px;"></div>
    <div class="acoes" id="acoes" style="display:none;">
      <button class="btn btn-ouro" id="btSim">Quero simular para os meus equipamentos →</button>
      <button class="btn btn-2" id="btCont">Prefiro que entrem em contato comigo</button></div>`);
  setTimeout(() => { const f = $('fill'); if (f) f.style.width = Math.max(8, R.pct) + '%'; }, 200);
  const alinhar = v => { RESP.alinhamento = v; salvar(true);
    $('alSim').classList.toggle('sel', v === 'sim'); $('alDuv').classList.toggle('sel', v === 'duvida');
    $('alR').style.display = 'block';
    $('alR').innerHTML = v === 'sim' ? 'O próximo passo é rápido: você lista os equipamentos — marca, modelo, ano e valor — e onde eles ficam. Pode ser um ou vários. <strong>Sem compromisso e sem mexer no seguro que você já tem.</strong>'
      : 'Justo. O mais comum é querer ver o número antes de decidir — a simulação serve exatamente para isso, e não obriga nada. Ou peça que alguém explique com calma.';
    $('acoes').style.display = 'flex'; $('eco').classList.remove('on'); setTimeout(() => $('acoes').scrollIntoView({ behavior: 'smooth', block: 'center' }), 60); };
  $('alSim').onclick = () => alinhar('sim'); $('alDuv').onclick = () => alinhar('duvida');
  $('btSim').onclick = async () => { await registrarInteresse('cotar'); const tk = new URLSearchParams(location.search).get('t'); location.href = 'QuestionarioEquipamentos.html' + (tk ? '?t=' + encodeURIComponent(tk) : ''); };
  $('btCont').onclick = () => { registrarInteresse('contato'); renderContato(); };
}

function mascaraTel(el) { const d = el.value.replace(/\D/g, '').slice(0, 11); el.value = d.length > 7 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d.length ? `(${d}` : ''; }
window.mascaraTel = mascaraTel;
function renderContato() {
  tela(`<div class="rotulo">Contato</div><div class="titulo">Como falamos com você?</div>
    <div class="corpo" style="margin-bottom:20px;">O corretor recebe o seu retrato e entra em contato para explicar e simular — sem compromisso.</div>
    <label class="lbl">Seu nome</label><input class="campo" id="cNome" placeholder="Nome completo">
    <label class="lbl">Empresa</label><input class="campo" id="cEmp" placeholder="Nome da empresa">
    <label class="lbl">Telefone / WhatsApp</label><input class="campo" id="cTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
    <label class="lbl">E-mail (opcional)</label><input class="campo" id="cMail" type="email" placeholder="voce@empresa.com.br">
    <div class="acoes" style="margin-top:6px;"><button class="btn btn-ouro" id="ok">Pode me chamar →</button><button class="btn btn-2" id="bk">← voltar ao retrato</button></div>`);
  if (LINK && LINK.empresaNome) { $('cEmp').value = LINK.empresaNome; $('cEmp').readOnly = true; $('cEmp').style.opacity = .75; }
  $('bk').onclick = renderResultado;
  $('ok').onclick = async () => { const nome = $('cNome').value.trim(); if (!nome) return $('cNome').focus();
    QRESP.contato = { nome, empresa: $('cEmp').value.trim(), telefone: $('cTel').value.trim(), email: $('cMail').value.trim() };
    $('ok').disabled = true; $('ok').textContent = 'Enviando…';
    try { await db.collection('mb_apresentacoes').doc(SESSAO).set({ questionario: { contato: QRESP.contato }, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e) {}
    tela(`<div style="text-align:center; padding:30px 0;"><div style="font-size:56px; margin-bottom:12px;">✅</div><div class="titulo">Recebido.</div>
      <div class="corpo">O corretor já tem o seu retrato e vai falar com você. Sem compromisso.</div></div>`); };
}

/* ══════════ PERSISTÊNCIA ══════════
   Formato que o painel já lê: respostas[k] = { valor, texto }; _risco acende a barra de EXPOSIÇÃO. */
const ROTEIRO = [['eqTipo', 'Tipo de equipamento mais importante'], ['eqValor', 'Valor de reposição (nova)'], ['eqReposicao', 'Tempo para repor'],
  ['eqParada', 'Faturamento que para por mês'], ['eqOnde', 'Onde a máquina trabalha']].concat(QUIZ.map(q => ['quiz_' + q.id, 'Cenário: ' + q.cena]))
  .concat([['eqQtd', 'Quantos equipamentos desse porte'], ['eqFinanciada', 'Financiadas']]);
function montarAnalitico(fim) { const R = calcular(), v = c => (RESP[c] || {}).valor || null;
  return { esquema: 1, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao', completo: !!fim,
    tipoCod: v('eqTipo'), valorCod: v('eqValor'), reposicaoCod: v('eqReposicao'), paradaCod: v('eqParada'), ondeCod: v('eqOnde'),
    qtdCod: v('eqQtd'), financiadaCod: v('eqFinanciada'), riscoPct: R.pct, riscoNivel: R.nivel, surpresasQuiz: R.surpresas,
    faturamentoEmRisco: R.paradaTotal, coberturasQuer: Object.keys(RESP._cob || {}).filter(k => RESP._cob[k] === 'sim'),
    coberturasNao: Object.keys(RESP._cob || {}).filter(k => RESP._cob[k] === 'nao'), alinhamento: RESP.alinhamento || null }; }
let _salvT = null;
function salvar(fim) { clearTimeout(_salvT); if (fim) return _gravar(true); _salvT = setTimeout(() => _gravar(false), 450); }
async function _gravar(fim) { try { if (!SESSAO) return;
  const cob = COBERTURAS.filter(c => !c.fixa && RESP._cob && RESP._cob[c.id]).map(c => c.n.split(' — ')[0] + ': ' + (RESP._cob[c.id] === 'sim' ? 'faz sentido' : 'não precisa'));
  if (cob.length) RESP.eqCoberturas = { textos: cob };
  const upd = { respostas: RESP, analitico: montarAnalitico(fim), roteiroApres: ROTEIRO.map(([k, p]) => ({ k, p, r: (RESP[k] || {}).texto || null })).concat([{ k: 'eqCoberturas', p: 'Coberturas que marcou', r: cob.join(' · ') || null }]),
    cenasVistas: TELAS, totalCenas: 15, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };
  if (fim) upd.concluiu = true;
  await db.collection('mb_apresentacoes').doc(SESSAO).set(upd, { merge: true }); } catch (e) { console.warn('salvar', e); } }
async function registrarInteresse(tipo) { try { if (!SESSAO) return;
  await db.collection('mb_apresentacoes').doc(SESSAO).set({ interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }), ultimoInteresse: tipo, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e) {} }

/* ══════════ INÍCIO ══════════ */
console.log('%cApresentação Equipamentos v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (token) SESSAO = 'equipamentos_' + token;
  else { try { SESSAO = sessionStorage.getItem('sessao_ap_equipamentos'); } catch (e) {}
    if (!SESSAO) { SESSAO = 'ap_equipamentos_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); try { sessionStorage.setItem('sessao_ap_equipamentos', SESSAO); } catch (e) {} } }
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, origem: 'apresentacao', atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) { try { let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get(); if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) { LINK = snap.docs[0].data(); base.linkId = snap.docs[0].id; base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null; base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null; base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        try { await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({ aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e2) {} } } catch (e) { console.warn('link', e); } }
  try { const d = await db.collection('mb_apresentacoes').doc(SESSAO).get(); if (!d.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true }); } catch (e) { console.warn('sessao', e); }
  renderAbertura();
});
</script>
