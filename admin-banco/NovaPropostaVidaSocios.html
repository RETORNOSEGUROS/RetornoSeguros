<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --verm:#f87171; --texto:#e8eeff; --suave:#93a4c8; --card:rgba(255,255,255,.045); --borda:rgba(147,164,200,.22); }
  body { background:var(--fundo); font-family:'Inter',system-ui,sans-serif; color:var(--texto); }
  .palco { max-width:860px; margin:0 auto; padding:24px 16px 60px; }

</style>

<body>
<main class="palco">
  <h1>Proposta Vida Sócios</h1>
  <p>Cole aqui o JSON da <b>Parte C</b> da análise (prompt Vida Sócios). Valide, pré-visualize e salve para gerar o link do sócio principal.</p>
  <div class="aviso" id="authAviso" hidden></div>
  <label style="display:block;margin:16px 0 6px;font-weight:700;font-size:13px;color:var(--suave)">ID da proposta (em branco = nova)</label>
  <div class="btns" style="margin-top:0"><input id="pid" style="flex:1;min-width:220px" placeholder="vs_..."><button class="sec" onclick="carregar()">Carregar</button><button class="sec" onclick="listarPropostas()">📂 Minhas propostas</button></div>
  <div id="lista"></div>
  <label style="display:block;margin:16px 0 6px;font-weight:700;font-size:13px;color:var(--suave)">JSON da proposta</label>
  <textarea id="json" spellcheck="false"></textarea>
  <!-- Um botão só manda na tela: salvar já valida por dentro, então "Validar"
       era um passo a mais para chegar no mesmo lugar. As outras ferramentas
       continuam aqui, menores, para quem precisar delas. -->
  <div class="btns">
    <button class="ouro" onclick="salvar()">Salvar e gerar link</button>
  </div>
  <div class="btns-mini">
    <button onclick="validar(true)">Só validar</button>
    <button onclick="previa()">Pré-visualizar</button>
    <button onclick="modelo()">Inserir modelo</button>
  </div>
  <div id="saida"></div>
  <div id="acomp"></div>
</main>
<script>
const CAMPOS = ['empresa', 'sessaoOrigem', 'empresaId', 'dataCotacao', 'validade', 'destinatario', 'socios', 'pessoaChave', 'resgatavel', 'analise', 'casos', 'cenarios'];
const CASOS_IDS = [...Array(20)].flatMap((_, i) => ['pc' + (i + 1), 'rg' + (i + 1)]);
let db = null, USER = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 2 });
const token = (n = 20) => { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; };
const base = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const dias = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null;
const dh = iso => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

const MODELO = {
  empresa: { nome: 'Empresa Exemplo Ltda.', cnpj: '00.000.000/0001-00', cidade: 'Cidade/UF' },
  sessaoOrigem: 'vidasocios_GRUPO_RESPID', empresaId: null,
  dataCotacao: new Date().toISOString().slice(0, 10), validade: '',
  destinatario: { nome: 'Nome do sócio principal', socioId: 's1' },
  socios: [{ id: 's1', nome: 'Sócio Um', nascimento: '1970-01-31', pct: 60, papel: 'Administra' }, { id: 's2', nome: 'Sócio Dois', nascimento: '1980-06-15', pct: 40, papel: 'Trabalha na empresa' }],
  pessoaChave: { pagamento: 'anual', itens: [{ socioId: 's1', capital: 3000000, dg: true, ipa: true, premioAnual: 0, premioMensal: null }], projecao: [{ ano: 1, valor: 0 }, { ano: 5, valor: 0 }, { ano: 10, valor: 0 }], nota: '',
    sugestao: { porque: '', itens: [{ socioId: 's1', capital: 3000000, premioAnual: 0, premioMensal: null }] } },
  resgatavel: { pagamento: 'unico', versao: 'dps', itens: [{ socioId: 's2', capital: 1000000, dg: false, premioUnico: 0, resgate: [{ ano: 1, valor: 0 }, { ano: 5, valor: 0 }, { ano: 10, valor: 0 }, { ano: 20, valor: 0 }] }],
    sugestao: { porque: '', itens: [{ socioId: 's2', capital: 1000000, premioUnico: 0 }] } },
  analise: { resumo: '', pontos: [{ titulo: '', texto: '', fonte: 'CONTRATO' }], gaps: [{ titulo: '', risco: '', sugestao: '' }] },
  casos: ['pc1', 'pc5', 'pc11', 'rg1', 'rg2', 'rg18'],
};
function modelo() { $('json').value = JSON.stringify(MODELO, null, 2); }
function ler() { try { return JSON.parse($('json').value); } catch (e) { $('saida').innerHTML = `<div class="caixa er">JSON inválido: ${esc(e.message)}</div>`; return null; } }

/* Confere o FORMATO antes de olhar o conteúdo. Se a IA devolver a Parte C em
   outro desenho (caso clássico: "casos" como objeto em vez de lista), a tela
   explica o que veio errado em vez de travar sem dizer nada. */
function conferirFormato(P) {
  const f = [];
  const tipo = v => Array.isArray(v) ? 'lista' : v === null ? 'vazio' : typeof v === 'object' ? 'bloco' : typeof v === 'string' ? 'texto' : typeof v;
  const exigeLista = (v, nome) => { if (v !== undefined && !Array.isArray(v)) f.push(`"${nome}" tem que ser uma lista — veio como ${tipo(v)}`); };
  const exigeBloco = (v, nome) => { if (v !== undefined && (typeof v !== 'object' || Array.isArray(v) || v === null)) f.push(`"${nome}" tem que ser um bloco — veio como ${tipo(v)}`); };
  const exigeData = (v, nome) => { if (v !== undefined && v !== null && v !== '' && !(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v))) f.push(`"${nome}" tem que ser uma data no formato AAAA-MM-DD — veio ${typeof v === 'string' ? '"' + v + '"' : 'como ' + tipo(v)}`); };
  if (!P || typeof P !== 'object' || Array.isArray(P)) { f.push('o conteúdo colado não é um bloco JSON'); return f; }
  exigeBloco(P.empresa, 'empresa');
  exigeLista(P.socios, 'socios');
  exigeBloco(P.destinatario, 'destinatario');
  exigeBloco(P.pessoaChave, 'pessoaChave');
  if (P.pessoaChave && typeof P.pessoaChave === 'object' && !Array.isArray(P.pessoaChave)) {
    exigeLista(P.pessoaChave.itens, 'pessoaChave.itens');
    exigeLista(P.pessoaChave.projecao, 'pessoaChave.projecao');
  }
  exigeBloco(P.resgatavel, 'resgatavel');
  if (P.resgatavel && typeof P.resgatavel === 'object' && !Array.isArray(P.resgatavel)) exigeLista(P.resgatavel.itens, 'resgatavel.itens');
  exigeBloco(P.analise, 'analise');
  if (P.analise && typeof P.analise === 'object' && !Array.isArray(P.analise)) {
    exigeLista(P.analise.pontos, 'analise.pontos');
    exigeLista(P.analise.gaps, 'analise.gaps');
  }
  exigeLista(P.casos, 'casos');
  exigeLista(P.cenarios, 'cenarios');
  ['pessoaChave', 'resgatavel'].forEach(k => {
    const b = P[k]; if (!b || typeof b !== 'object') return;
    exigeBloco(b.sugestao, `${k}.sugestao`);
    if (b.sugestao && typeof b.sugestao === 'object') exigeLista(b.sugestao.itens, `${k}.sugestao.itens`);
  });
  (Array.isArray(P.cenarios) ? P.cenarios : []).forEach((c, i) => { if (c) exigeLista(c.itens, `cenarios[${i}].itens`); });
  exigeData(P.validade, 'validade');
  exigeData(P.dataCotacao, 'dataCotacao');
  (Array.isArray(P.socios) ? P.socios : []).forEach((x, i) => { if (x && x.nascimento) exigeData(x.nascimento, `socios[${i}].nascimento`); });

  /* ═══ o que não é formato, é coerência ═══
     Um socioId que não existe deixa a proposta mostrando "—" no lugar do nome,
     e um item sem capital deixa a linha vazia. Os dois passavam no editor e só
     apareciam na tela do cliente. */
  const ids = new Set((Array.isArray(P.socios) ? P.socios : []).map(x => x && x.id).filter(Boolean));
  if (ids.size) {
    const confN = (lista, rot) => (Array.isArray(lista) ? lista : []).forEach((i, k) => {
      if (!i) return;
      if (!i.socioId) f.push(`${rot}[${k}] está sem "socioId"`);
      else if (!ids.has(i.socioId)) f.push(`${rot}[${k}] aponta para o sócio "${i.socioId}", que não está na lista de sócios`);
    });
    confN(P.pessoaChave && P.pessoaChave.itens, 'pessoaChave.itens');
    confN(P.resgatavel && P.resgatavel.itens, 'resgatavel.itens');
    confN(P.pessoaChave && P.pessoaChave.sugestao && P.pessoaChave.sugestao.itens, 'pessoaChave.sugestao.itens');
    confN(P.resgatavel && P.resgatavel.sugestao && P.resgatavel.sugestao.itens, 'resgatavel.sugestao.itens');
    const d = P.destinatario;
    if (d && d.socioId && !ids.has(d.socioId)) f.push(`"destinatario.socioId" aponta para "${d.socioId}", que não está na lista de sócios`);
  }
  const confCap = (lista, rot) => (Array.isArray(lista) ? lista : []).forEach((i, k) => {
    if (i && !(Number(i.capital) > 0)) f.push(`${rot}[${k}] está sem capital — a linha sairia vazia na proposta`);
  });
  confCap(P.pessoaChave && P.pessoaChave.itens, 'pessoaChave.itens');
  confCap(P.resgatavel && P.resgatavel.itens, 'resgatavel.itens');
  confCap(P.pessoaChave && P.pessoaChave.sugestao && P.pessoaChave.sugestao.itens, 'pessoaChave.sugestao.itens');
  confCap(P.resgatavel && P.resgatavel.sugestao && P.resgatavel.sugestao.itens, 'resgatavel.sugestao.itens');
  return f;
}

/* ═══ avisos de conteúdo ═══
   Não bloqueiam o envio: a proposta sabe lidar com os dois casos. São coisas
   que o corretor precisa saber ANTES de mandar, não depois de o cliente ler. */
function avisosDeConteudo(P) {
  const a = [];
  const semPreco = (lista, campo) => (Array.isArray(lista) ? lista : []).filter(i => i && !(Number(i[campo]) > 0)).length;
  const campoPC = (P.pessoaChave && P.pessoaChave.pagamento === 'mensal') ? 'premioMensal' : 'premioAnual';
  const avPC = semPreco(P.pessoaChave && P.pessoaChave.sugestao && P.pessoaChave.sugestao.itens, campoPC);
  const avRG = semPreco(P.resgatavel && P.resgatavel.sugestao && P.resgatavel.sugestao.itens, 'premioUnico');
  if (avPC) a.push(`${avPC} sócio(s) da sugestão da Pessoa Chave estão sem prêmio — o total sai parcial, com a ressalva "ainda a cotar". O cliente vê um número menor que o final.`);
  if (avRG) a.push(`${avRG} sócio(s) da sugestão do Resgatável estão sem prêmio — mesma ressalva.`);
  const foraFaixa = (lista, rot) => (Array.isArray(lista) ? lista : []).forEach(i => {
    const c = Number(i && i.capital);
    if (c > 0 && (c < 2e5 || c > 12e6)) a.push(`${rot}: capital de R$ ${c.toLocaleString('pt-BR')} está fora da faixa do produto (R$ 200 mil a R$ 12 milhões por sócio) — confirme com a seguradora.`);
  });
  foraFaixa(P.pessoaChave && P.pessoaChave.itens, 'Pessoa Chave');
  foraFaixa(P.resgatavel && P.resgatavel.itens, 'Resgatável');
  return a;
}

/* Data: aceita o jeito brasileiro (16/10/1988) e o jeito que o banco guarda
   (1988-10-16). Quem digita é gente; converter é trabalho do sistema. */
function _dataISO(v) {
  if (typeof v !== 'string') return v;
  const t = v.trim();
  let m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(t);
  if (m) return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
  m = /^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/.exec(t);
  if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
  return t;
}
function normalizarDatas(P) {
  const mudou = [];
  const fix = (obj, k, rot) => {
    if (!obj || typeof obj[k] !== 'string') return;
    const n = _dataISO(obj[k]);
    if (n !== obj[k]) { mudou.push(`${rot}: ${obj[k]} → ${n}`); obj[k] = n; }
  };
  fix(P, 'validade', 'validade da proposta');
  fix(P, 'dataCotacao', 'data da cotação');
  (Array.isArray(P.socios) ? P.socios : []).forEach((x, i) => fix(x, 'nascimento', (x && x.nome) || ('sócio ' + (i + 1))));
  return mudou;
}

function validar(mostrar) {
  try { return _validar(mostrar); }
  catch (e) {
    console.warn('validar', e);
    $('saida').innerHTML = `<div class="caixa"><b class="er">Não consegui ler este JSON.</b><br>${esc(e.message)}
      <br><br>Provavelmente ele veio em outro formato. Clique em <b>Inserir modelo</b> para ver o desenho que esta tela espera e peça à IA a <b>Parte C exatamente nesse formato</b>.</div>`;
    return null;
  }
}

function _validar(mostrar) {
  const P = ler(); if (!P) return null;
  const er = [], al = [];
  const datasConvertidas = normalizarDatas(P);
  if (datasConvertidas.length) al.push('data no formato brasileiro, convertida sozinha — ' + datasConvertidas.join('; '));
  avisosDeConteudo(P).forEach(x => al.push(x));
  const formato = conferirFormato(P);
  if (formato.length) {
    $('saida').innerHTML = `<div class="caixa"><b class="er">O JSON veio em outro formato (${formato.length} ${formato.length === 1 ? 'diferença' : 'diferenças'}):</b>
      <ul style="padding-left:18px">${formato.map(x => `<li class="er">${esc(x)}</li>`).join('')}</ul>
      <br><b>O que fazer:</b> clique em <b>Inserir modelo</b>, copie aquele desenho e peça à IA: <i>"refaça a Parte C exatamente neste formato, sem inventar campos novos"</i>.</div>`;
    return null;
  }
  if (!P.empresa || !P.empresa.nome) er.push('empresa.nome é obrigatório');
  if (!Array.isArray(P.socios) || !P.socios.length) er.push('socios precisa ter pelo menos um sócio');
  const ids = new Set((P.socios || []).map(s => s.id));
  (P.socios || []).forEach((s, i) => { if (!s.id || !s.nome) er.push(`socios[${i}] precisa de id e nome`); if (!s.nascimento) al.push(`${s.nome || 'sócio ' + i}: sem data de nascimento (aviso de aniversário não aparece)`); });
  if (!P.destinatario || !ids.has(P.destinatario.socioId)) er.push('destinatario.socioId precisa ser o id de um sócio');
  const pc = (P.pessoaChave && P.pessoaChave.itens) || [], rg = (P.resgatavel && P.resgatavel.itens) || [];
  if (!pc.length && !rg.length) er.push('nenhum item em pessoaChave.itens nem em resgatavel.itens');
  const mensal = P.pessoaChave && P.pessoaChave.pagamento === 'mensal';
  pc.forEach(i => { if (!ids.has(i.socioId)) er.push(`Pessoa Chave: socioId ${i.socioId} não existe`); if (!(i.capital >= 200000 && i.capital <= 12000000)) er.push(`Pessoa Chave ${i.socioId}: capital fora de R$ 200 mil a R$ 12 milhões`); if (!(mensal ? i.premioMensal : i.premioAnual)) er.push(`Pessoa Chave ${i.socioId}: sem prêmio ${mensal ? 'mensal' : 'anual'} (use o valor da cotação)`); });
  rg.forEach(i => { if (!ids.has(i.socioId)) er.push(`Resgatável: socioId ${i.socioId} não existe`); if (!(i.capital >= 200000 && i.capital <= 12000000)) er.push(`Resgatável ${i.socioId}: capital fora de R$ 200 mil a R$ 12 milhões`); if (!i.premioUnico && !i.premio) er.push(`Resgatável ${i.socioId}: sem prêmio`); if (!(i.resgate || []).length) al.push(`Resgatável ${i.socioId}: sem tabela de resgate (a seção não aparece)`); (i.resgate || []).forEach(x => { if (!x.valor) er.push(`Resgatável ${i.socioId}: resgate do ano ${x.ano} vazio`); }); });
  (P.pessoaChave && P.pessoaChave.projecao || []).forEach(x => { if (!x.valor) er.push(`Projeção da Pessoa Chave do ano ${x.ano} vazia (apague a projeção ou preencha)`); });
  if (!P.validade) al.push('sem validade: a capa não mostra "válida até"'); else if (new Date(P.validade) < new Date()) er.push('validade já passou');
  (P.casos || []).forEach(c => { if (!CASOS_IDS.includes(c)) er.push(`caso desconhecido: ${c}`); });
  /* A proposta mostra, por produto, o que o cliente pediu e a nossa sugestão.
     Cenários lado a lado saíram em 28/09; propostas antigas com `cenarios`
     continuam abrindo, então o campo ainda é aceito. */
  [['pessoaChave', 'Pessoa Chave', 'premioAnual'], ['resgatavel', 'Resgatável', 'premioUnico']].forEach(([k, nome, campo]) => {
    const bloco = P[k] || {}; const base = (bloco.itens || []).filter(i => i && i.capital);
    if (!base.length) return;
    const sg = bloco.sugestao;
    if (!sg || !(sg.itens || []).length) { al.push(`${nome}: sem sugestão da corretora — o cliente vê só o que ele pediu`); return; }
    if (!sg.porque) al.push(`${nome}: sugestão sem "porque" — o cliente não sabe de onde veio o número`);
    sg.itens.forEach((x, i) => {
      if (!ids.has(x.socioId)) er.push(`${k}.sugestao.itens[${i}]: socioId "${x.socioId}" não existe`);
      if (!(Number(x.capital) >= 200000 && Number(x.capital) <= 12000000)) er.push(`${k}.sugestao.itens[${i}]: capital fora de R$ 200 mil a R$ 12 milhões`);
    });
    const chave = l => l.map(i => i.socioId + ':' + Number(i.capital || 0)).sort().join('|');
    if (chave(base) !== chave(sg.itens) && !sg.itens.some(x => Number(x[campo]) || Number(x.premioMensal))) {
      al.push(`${nome}: a sugestão tem capital diferente do pedido mas nenhum prêmio cotado — vai aparecer como "a cotar"`);
    }
  });
  const cens = Array.isArray(P.cenarios) ? P.cenarios : [];
  cens.forEach((c, i) => { if (c && !c.id) er.push(`cenarios[${i}] precisa de id`); });
  if (!P.analise || !P.analise.resumo) al.push('análise sem resumo');
  if (mostrar || er.length) $('saida').innerHTML = `<div class="caixa">${er.length ? `<b class="er">${er.length} erro(s):</b><ul style="padding-left:18px">${er.map(e => `<li class="er">${esc(e)}</li>`).join('')}</ul>` : '<b class="ok">Sem erros.</b>'}${al.length ? `<br><b class="al">Avisos:</b><ul style="padding-left:18px">${al.map(e => `<li class="al">${esc(e)}</li>`).join('')}</ul>` : ''}
    <br>${pc.length ? `Pessoa Chave: ${pc.length} sócio(s), total ${brl(pc.reduce((a, i) => a + (Number(mensal ? i.premioMensal : i.premioAnual) || 0), 0))} ${mensal ? '/mês' : '/ano'}<br>` : ''}${rg.length ? `Resgatável: ${rg.length} sócio(s), total ${brl(rg.reduce((a, i) => a + (Number(i.premioUnico || i.premio) || 0), 0))}` : ''}</div>`;
  return er.length ? null : P;
}
function previa() { const P = validar(false) || ler(); if (!P) return; const b = btoa(unescape(encodeURIComponent(JSON.stringify(P)))); window.open(base() + 'PropostaOnlineVidaSocios.html#dados=' + b, '_blank'); }

function _premioTotal(P) {
  const pc = (P.pessoaChave && P.pessoaChave.itens) || [], rg = (P.resgatavel && P.resgatavel.itens) || [];
  const mensal = P.pessoaChave && P.pessoaChave.pagamento === 'mensal';
  const a = pc.reduce((s, i) => s + (Number(mensal ? i.premioMensal : i.premioAnual) || 0), 0) * (mensal ? 12 : 1);
  const b = rg.reduce((s, i) => s + (Number(i.premioUnico || i.premio) || 0), 0);
  return Math.round((a + b) * 100) / 100 || null;
}

let ORIGEM = null;
async function salvar() {
  const P = validar(true); if (!P) return;
  if (!db) { $('saida').innerHTML += `<div class="caixa al">Sem conexão com o Firebase (fora do Hosting). Use a pré-visualização.</div>`; return; }
  const campos = {}; CAMPOS.forEach(k => { if (P[k] !== undefined) campos[k] = P[k]; });
  let pid = $('pid').value.trim();
  try {
    if (pid) {
      const ref = db.collection('mb_propostas').doc(pid); const d = await ref.get();
      if (!d.exists) { $('saida').innerHTML += `<div class="caixa er">Proposta ${esc(pid)} não existe.</div>`; return; }
      campos.atualizadoEm = firebase.firestore.FieldValue.serverTimestamp();
      await ref.update(campos);
    } else {
      pid = 'vs_' + token(16); const tok = token();
      // Campos que o PAINEL lê na lista de Propostas (não mexer nos nomes):
      // token (link ?t=), produtoId, produto, empresaNome, criadoPorUid, corretorNome, criadoEm.
      const tokPainel = token(24);
      if (!campos.sessaoOrigem && ORIGEM) campos.sessaoOrigem = ORIGEM;
      Object.assign(campos, {
        token: tokPainel, produtoId: 'vida_socios', produto: 'Vida Sócios',
        empresaNome: (P.empresa && P.empresa.nome) || null,
        premioTotal: _premioTotal(P),
        criadoPorUid: USER ? USER.uid : null,
        corretorNome: USER ? (USER.displayName || USER.email || '') : '',
        aberta: false, interesse: null });
      Object.assign(campos, { produtoLegado: 'vida-socios', status: 'enviada', criadoEm: firebase.firestore.FieldValue.serverTimestamp(), atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), criadoPor: USER ? (USER.email || USER.uid) : null,
        convidados: { [tok]: { nome: P.destinatario.nome, papel: 'principal', socioId: P.destinatario.socioId, criadoEm: new Date().toISOString(), aberturas: 0 } }, checklist: {}, aceites: {} });
      await db.collection('mb_propostas').doc(pid).set(campos);
      $('pid').value = pid;
    }
  } catch (e) { $('saida').innerHTML += `<div class="caixa er">Erro ao salvar: ${esc(e.message)}</div>`; return; }
  $('saida').innerHTML += `<div class="caixa ok">Salvo: ${esc(pid)}</div>`;
  carregar();
}

/* Lista as propostas Vida Sócios já salvas, com o andamento dos aceites.
   Responde de um lugar só a pergunta "quem já preencheu a declaração de saúde?". */
async function listarPropostas() {
  const cx = $('lista');
  if (!db) { cx.innerHTML = '<div class="caixa al">Sem conexão com o Firebase.</div>'; return; }
  cx.innerHTML = '<div class="caixa">Carregando…</div>';
  try {
    // Ordena só por data (índice simples) e filtra o produto aqui, para não
    // exigir índice composto no Firestore.
    const snap = await db.collection('mb_propostas').orderBy('criadoEm', 'desc').limit(40).get();
    const itens = [];
    snap.forEach(d => {
      const x = d.data();
      if (x.produtoId !== 'vida_socios' && x.produto !== 'Vida Sócios' && x.produtoLegado !== 'vida-socios') return;
      itens.push({ id: d.id, ...x });
    });
    if (!itens.length) { cx.innerHTML = '<div class="caixa al">Nenhuma proposta Vida Sócios salva ainda.</div>'; return; }
    cx.innerHTML = `<div class="caixa"><b>${itens.length} proposta(s) Vida Sócios</b><table>
      <tr><th>Empresa</th><th>Criada</th><th>Declarações de saúde</th><th></th></tr>
      ${itens.map(x => {
        const ac = Object.values(x.aceites || {});
        const ok = ac.filter(a => a.status === 'preenchido').length;
        const ini = ac.filter(a => a.status === 'iniciado').length;
        const dt = x.criadoEm && x.criadoEm.toDate ? x.criadoEm.toDate().toLocaleDateString('pt-BR') : '—';
        const st = !ac.length ? '<span class="al">ainda não pedida</span>'
          : ok === ac.length ? `<b class="ok">✓ ${ok} de ${ac.length} — todas preenchidas</b>`
          : `<b class="al">${ok} de ${ac.length} preenchidas${ini ? ' · ' + ini + ' em andamento' : ''}</b>`;
        return `<tr><td><b>${esc((x.empresa && x.empresa.nome) || x.empresaNome || 'Sem nome')}</b>${x.aberta ? '' : '<br><small class="al">ainda não aberta pelo cliente</small>'}</td>
          <td>${dt}</td><td>${st}</td>
          <td><button class="sec" onclick="abrirProposta('${x.id}')">Abrir</button>
            <button class="sec" style="color:#b91c1c" onclick="excluirProposta('${x.id}', ${esc(JSON.stringify((x.empresa && x.empresa.nome) || x.empresaNome || 'Sem nome'))})">Excluir</button></td></tr>`;
      }).join('')}
    </table></div>`;
  } catch (e) { cx.innerHTML = `<div class="caixa er">Não consegui listar: ${esc(e.message)}</div>`; }
}
function abrirProposta(id) { $('pid').value = id; $('json').value = ''; $('lista').innerHTML = ''; carregar(); }
/* Excluir apaga o link do cliente junto: por isso a confirmação pede o nome da
   empresa na tela, e não um "tem certeza?" que ninguém lê. */
async function excluirProposta(id, nome) {
  if (!db) return;
  if (!confirm(`Excluir a proposta da ${nome}?\n\nO link que o cliente tem deixa de funcionar, e as fichas de saúde já preenchidas continuam guardadas em separado.\n\nIsto não tem volta.`)) return;
  try {
    await db.collection('mb_propostas').doc(id).delete();
    if ($('pid').value.trim() === id) { $('pid').value = ''; $('acomp').innerHTML = ''; $('json').value = ''; }
    listarPropostas();
  } catch (e) { alert('Não consegui excluir: ' + e.message); }
}

/* ═══ VALORES POR SÓCIO, EDITÁVEIS ═══
   A negociação quase sempre sai do sistema: o cliente pede por e-mail, a
   corretora recota, e aí era preciso remontar o JSON inteiro à mão para mudar
   um capital. Aqui o corretor muda o número onde ele está, salva, e o link do
   cliente — que já foi enviado — passa a mostrar o valor novo.
   O JSON do textarea é reescrito junto, para as duas vistas nunca divergirem. */
const RESG_PADRAO = [[1, 0.91], [6, 1.02], [10, 1.11], [20, 1.33], [30, 1.53]];
const _n = v => { const x = Number(String(v).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.')); return isFinite(x) ? x : null; };
const _f = v => (v == null || v === '') ? '' : Number(v).toLocaleString('pt-BR');
function blocoValores(pid, P) {
  const nome = id => { const x = (P.socios || []).find(s => s.id === id); return x ? x.nome : id; };
  const mensal = P.pessoaChave && P.pessoaChave.pagamento === 'mensal';
  const linhasPC = ((P.pessoaChave || {}).itens || []).map((i, k) => `<tr>
      <td><b>${esc(nome(i.socioId))}</b><br><small>${esc(i.socioId)}</small></td>
      <td><input data-v="pc.${k}.capital" value="${_f(i.capital)}" style="width:120px"></td>
      <td><input data-v="pc.${k}.${mensal ? 'premioMensal' : 'premioAnual'}" value="${_f(mensal ? i.premioMensal : i.premioAnual)}" style="width:110px" placeholder="a cotar"></td>
      <td><label><input type="checkbox" data-v="pc.${k}.dg" ${i.dg ? 'checked' : ''}> DG</label>
          <label><input type="checkbox" data-v="pc.${k}.ipa" ${i.ipa ? 'checked' : ''}> IPA</label></td></tr>`).join('');
  const linhasRG = ((P.resgatavel || {}).itens || []).map((i, k) => `<tr>
      <td><b>${esc(nome(i.socioId))}</b><br><small>${esc(i.socioId)}</small></td>
      <td><input data-v="rg.${k}.capital" value="${_f(i.capital)}" style="width:120px"></td>
      <td><input data-v="rg.${k}.premioUnico" value="${_f(i.premioUnico)}" style="width:110px" placeholder="a cotar"></td>
      <td><label><input type="checkbox" data-v="rg.${k}.dg" ${i.dg ? 'checked' : ''}> DG</label></td></tr>
    <tr><td colspan="4" style="padding-top:0"><small>Resgate${i.resgateFonte === 'simulacao' ? ' <b>(simulação)</b>' : ''}:</small>
      ${(i.resgate || RESG_PADRAO.map(([a]) => ({ ano: a, valor: null }))).map((r, j) =>
        `<label style="font-size:12px;margin-right:9px">${r.ano}º <input data-v="rg.${k}.resgate.${j}.valor" value="${_f(r.valor)}" style="width:92px"></label>`).join('')}
      <button class="sec" onclick="resgatePadrao(${k})">recalcular pelos percentuais padrão</button></td></tr>`).join('');
  if (!linhasPC && !linhasRG) return '';
  return `<div class="caixa">
    <b>Valores por sócio</b>
    <p style="font-size:12px; opacity:.7; margin:4px 0 8px">Para quando a negociação sai do sistema. Mude o número, salve, e o link que o cliente já tem mostra o valor novo. Deixe o prêmio em branco para a proposta dizer "a cotar".</p>
    ${linhasPC ? `<label class="lbl2">Pessoa Chave · ${mensal ? 'prêmio mensal' : 'prêmio anual'}</label>
      <table><tr><th>Sócio</th><th>Capital</th><th>Prêmio</th><th>Coberturas</th></tr>${linhasPC}</table>` : ''}
    ${linhasRG ? `<label class="lbl2">Resgatável Único · pagamento único</label>
      <table><tr><th>Sócio</th><th>Capital</th><th>Pagamento</th><th>Coberturas</th></tr>${linhasRG}</table>` : ''}
    <div class="btns"><button class="ouro" onclick="salvarValores()">Salvar os valores</button>
      <span id="valMsg" style="font-size:12px; opacity:.75"></span></div>
  </div>`;
}
/* lê a tela e devolve pessoaChave/resgatavel novos, sem tocar no resto */
function _colherValores() {
  const P = JSON.parse(JSON.stringify(PROP_ATUAL.P));
  document.querySelectorAll('[data-v]').forEach(el => {
    const [prod, k, campo, idx, sub] = el.dataset.v.split('.');
    const bloco = prod === 'pc' ? P.pessoaChave : P.resgatavel;
    const it = bloco && bloco.itens && bloco.itens[Number(k)];
    if (!it) return;
    if (campo === 'resgate') { it.resgate = it.resgate || []; if (it.resgate[Number(idx)]) it.resgate[Number(idx)][sub] = _n(el.value); return; }
    if (el.type === 'checkbox') { it[campo] = el.checked; return; }
    it[campo] = _n(el.value);
  });
  return P;
}
async function resgatePadrao(k) {
  const P = _colherValores();
  const it = P.resgatavel && P.resgatavel.itens && P.resgatavel.itens[k];
  const pago = it && Number(it.premioUnico);
  if (!(pago > 0)) { $('valMsg').textContent = 'informe o pagamento único antes de simular o resgate'; return; }
  it.resgate = RESG_PADRAO.map(([ano, f]) => ({ ano, valor: Math.round(pago * f) }));
  it.resgateFonte = 'simulacao';
  PROP_ATUAL.P = P;
  /* Grava antes de redesenhar: `carregar()` relê do banco, e sem salvar a
     simulação morria no caminho de volta. */
  await salvarValores(P);
  carregar();
}
async function salvarValores(jaColhido) {
  if (!db || !PROP_ATUAL) return;
  const P = jaColhido || _colherValores();
  const msg = $('valMsg'); msg.textContent = 'salvando…';
  try {
    await db.collection('mb_propostas').doc(PROP_ATUAL.pid).set({
      pessoaChave: P.pessoaChave || null, resgatavel: P.resgatavel || null,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    /* o textarea acompanha: dois lugares mostrando números diferentes é como
       um erro nasce na próxima vez que alguém salvar o JSON */
    try { const j = JSON.parse($('json').value || '{}'); j.pessoaChave = P.pessoaChave; j.resgatavel = P.resgatavel; $('json').value = JSON.stringify(j, null, 2); } catch (e) {}
    msg.textContent = '✓ salvo — o cliente já vê os valores novos';
    PROP_ATUAL.P = P;
  } catch (e) { msg.textContent = 'não consegui salvar: ' + e.message; }
}

/* ═══ O QUE O CLIENTE PEDIU ═══
   O cliente marcava os motivos e escrevia o que queria mudar, a proposta
   gravava tudo em `pedidosAjuste`… e nenhuma tela lia. O pedido morria no
   banco. É o primeiro bloco que o corretor precisa ver ao abrir a proposta —
   vem antes de qualquer acompanhamento, e em vermelho enquanto não for tratado. */
const MOTIVOS_TXT = { maior: 'Quer capital maior', menor: 'Quer capital menor', incluir: 'Incluir outro sócio',
  tirar: 'Tirar um sócio', parcelar: 'Parcelado em vez de único', unico: 'Pagamento único em vez de parcelado',
  coberturas: 'Mudar as coberturas', conversar: 'Quer conversar antes de decidir' };
function blocoPedidos(P) {
  const ps = (P.pedidosAjuste || []).slice().reverse();
  if (!ps.length) return '';
  const abertos = ps.filter(x => !x.tratadoEm).length;
  return `<div class="caixa ${abertos ? 'er' : ''}" style="${abertos ? 'border-color:#dc2626' : ''}">
    <b>${abertos ? '🔴 ' : ''}O cliente pediu ${ps.length === 1 ? 'uma alteração' : ps.length + ' alterações'}${abertos ? ` · ${abertos} sem tratar` : ' · todas tratadas'}</b>
    ${ps.map((x, i) => `<div style="margin-top:10px;padding-top:10px;border-top:1px solid #e2e8f0">
      <small>${dh(x.em)}${x.por ? ' · ' + esc(x.por) : ''}${x.papel ? ' (' + esc(x.papel) + ')' : ''}</small><br>
      ${(x.motivos || []).length ? `<b>${(x.motivos || []).map(k => esc(MOTIVOS_TXT[k] || k)).join(' · ')}</b><br>` : ''}
      ${x.texto ? `<span style="white-space:pre-wrap">${esc(x.texto)}</span><br>` : ''}
      ${x.tratadoEm ? `<small class="ok">tratado em ${dh(x.tratadoEm)}</small>`
        : `<button class="sec" style="margin-top:6px" onclick="tratarPedido(${ps.length - 1 - i})">Marcar como tratado</button>`}
    </div>`).join('')}
    ${abertos ? '<div class="nota" style="margin-top:10px">Depois de recotar, cole o JSON novo acima e salve — o link do cliente continua o mesmo.</div>' : ''}
  </div>`;
}
async function tratarPedido(i) {
  const pid = $('pid').value.trim(); if (!pid || !db) return;
  const d = await db.collection('mb_propostas').doc(pid).get();
  const ps = (d.data() || {}).pedidosAjuste || [];
  if (!ps[i]) return;
  ps[i].tratadoEm = new Date().toISOString();
  await db.collection('mb_propostas').doc(pid).set({ pedidosAjuste: ps }, { merge: true });
  carregar();
}

async function carregar() {
  const pid = $('pid').value.trim(); if (!pid || !db) return;

  const conv = Object.entries(P.convidados || {});

  const du = dias(P.ultimoAcesso);

  $('acomp').innerHTML = `<h2>Acompanhamento</h2>
    <div class="caixa">
      <b>Última abertura:</b> ${P.ultimoAcesso ? `${dh(P.ultimoAcesso)} por ${esc(P.ultimoAcessoPor && P.ultimoAcessoPor.nome || '')} — <span class="${du >= 7 ? 'er' : du >= 3 ? 'al' : 'ok'}">há ${du} dia(s)</span>` : '<span class="al">nunca aberta</span>'}
      ${princ ? `<br><br><b>Link do sócio principal:</b><div class="link">${esc(link(princ[0]))}</div>
      <div class="btns"><button class="sec" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(link(princ[0])))});this.textContent='✓ copiado'">Copiar link</button><button class="sec" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(msg))});this.textContent='✓ copiada'">Copiar a mensagem inteira</button></div>` : ''}
    </div>
    <div class="caixa"><b>Quem recebeu o link</b><table><tr><th>Nome</th><th>Papel</th><th>Aberturas</th><th>Última</th><th>Situação</th></tr>
      ${conv.map(([t, c]) => `<tr><td>${esc(c.nome)}${c.email ? '<br><small>' + esc(c.email) + '</small>' : ''}</td><td>${esc(c.papel)}</td><td>${c.aberturas || 0}</td><td>${c.ultimo ? dh(c.ultimo) + ` <small>(${dias(c.ultimo)}d)</small>` : '—'}</td><td>${c.parecer ? `<b class="${c.parecer.status === 'confere' ? 'ok' : 'al'}">${esc(c.parecer.status)}</b> ${esc(c.parecer.texto || '')}` : (P.checklist && P.checklist[t] && P.checklist[t].r ? '<span class="ok">respondeu o checklist</span>' : '')}</td></tr>`).join('')}
    </table></div>
    ${P.escolhaCenario ? `<div class="caixa ok" style="border-color:#16a34a"><b>O cliente escolheu o cenário: ${esc(P.escolhaCenario.nome || P.escolhaCenario.id)}</b><br><small>por ${esc(P.escolhaCenario.por || '')} em ${dh(P.escolhaCenario.em)} — recote com esses capitais e republique a proposta.</small></div>` : ''}
    ${blocoPedidos(P)}
    ${blocoValores(pid, P)}
    <div class="caixa"><b>Contratação</b> ${P.contratar ? `— pedida em ${dh(P.contratar.em)} por ${esc(P.contratar.por || '')}` : '— ainda não'}
      ${aceites.length ? `<div class="btns" style="margin-top:8px"><button class="b" onclick="window.open('DadosVidaSocios.html?p=${pid}','_blank')">📄 Dados de todos os sócios (PDF)</button></div>` : ''}
      ${aceites.length ? `<table><tr><th>Sócio</th><th>Produtos</th><th>Status</th><th>Link da ficha</th></tr>${aceites.map(([t, a]) => {
        const la = base() + 'AceiteVidaSocios.html?p=' + pid + '&a=' + t;
        return `<tr><td>${esc(a.nome)}</td><td>${[a.pc ? 'PC' : '', a.rg ? 'RG' : ''].filter(Boolean).join(' + ')}</td>
          <td class="${a.status === 'preenchido' ? 'ok' : 'al'}">${esc(a.status || 'enviado')}${a.em ? ' · ' + dh(a.em) : ''}</td>
          <td>${a.status === 'preenchido'
            ? `<button class="sec" onclick="window.open('DadosVidaSocios.html?p=${pid}#${t}','_blank')">Dados</button>`
            : `<button class="sec" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(la))});this.textContent='✓ copiado'">Copiar link</button>`}</td></tr>`;
      }).join('')}</table>
      <div class="nota">Copie o link e mande pelo canal que você quiser. A coluna de situação muda sozinha quando o sócio preenche.</div>` : ''}
      <div id="aceiteOut"></div></div>
    ${P.contratar ? blocoEtapas(pid, P) : ''}`;
}

/* ═══════════════ ETAPAS — o que o cliente vê no acompanhamento ═══════════════
   A seguradora não conversa com este sistema, então quem marca é o corretor.
   Cada marcação aparece na hora na proposta que o cliente já tem em mãos. */
let PROP_ATUAL = null, st = null;

function _hoje() { return new Date().toISOString(); }
const _dh = iso => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

/* Pessoa Chave e Resgatável são DUAS propostas na seguradora: dois aceites,
   dois boletos, duas análises que podem terminar diferente. Por isso as etapas
   são marcadas por produto (`etapas.pc` / `etapas.rg`). Marcação antiga, solta
   na raiz de `etapas`, continua valendo quando só há um produto contratado. */
let PROD_ETAPA = 'pc';
function _prodsProposta(P) {
  const c = (P.contratar && P.contratar.itens) || null;
  const temItem = k => ((k === 'pc' ? (P.pessoaChave && P.pessoaChave.itens) : (P.resgatavel && P.resgatavel.itens)) || []).some(i => i && i.capital);
  const marcado = k => !c || Object.values(c).some(v => v && v[k]);
  return [['pc', 'Pessoa Chave'], ['rg', 'Resgatável']].filter(([k]) => temItem(k) && marcado(k));
}
function _etapasDe(P, k) {
  const E = P.etapas || {};
  if (E[k]) return E[k];
  const legado = Object.keys(E).some(x => x !== 'pc' && x !== 'rg');
  return (legado && _prodsProposta(P).length === 1) ? E : {};
}
function trocarProdEtapa(k) { PROD_ETAPA = k; carregar(); }
function blocoEtapas(pid, P) {
  PROP_ATUAL = { pid, P };
  const prods = _prodsProposta(P);
  if (prods.length && !prods.some(([k]) => k === PROD_ETAPA)) PROD_ETAPA = prods[0][0];
  const E = _etapasDe(P, PROD_ETAPA);
  const legadoMisto = Object.keys(P.etapas || {}).some(x => x !== 'pc' && x !== 'rg') && prods.length > 1;
  const aceites = Object.entries(P.aceites || {}).filter(([, a]) => a[PROD_ETAPA]);
  const nomeSocio = sid => { const x = (P.socios || []).find(s => s.id === sid); return x ? x.nome : sid; };
  const bt = (campo, rot) => E[campo]
    ? `<button class="sec" onclick="desmarcar('${campo}')" title="marcado em ${_dh(E[campo])} — clique para desfazer"><span class="ok">✓</span> ${rot} <small>${_dh(E[campo])}</small></button>`
    : `<button class="b" onclick="marcar('${campo}')">${rot}</button>`;

  const btSeg = aceites.map(([t, a]) => {
    const ok = (E.aceiteSegurados || {})[a.socioId];
    return ok
      ? `<button class="sec" onclick="marcarSegurado('${a.socioId}',0)"><span class="ok">✓</span> ${esc(nomeSocio(a.socioId))}</button>`
      : `<button class="b" onclick="marcarSegurado('${a.socioId}',1)">${esc(nomeSocio(a.socioId))}</button>`;
  }).join(' ');

  const pend = (E.pendencias || []);
  const res = E.resultado || {};

  return `<div class="caixa">
    <b>Etapas — o cliente vê isto na proposta dele</b>
    <p style="margin:6px 0 10px; font-size:12px; opacity:.7">Clique para marcar com a data de agora. Clicar de novo desfaz.</p>
    ${prods.length > 1 ? `<div class="btns" style="margin-top:0">
      <span style="font-size:12px; opacity:.7; align-self:center; margin-right:4px">Proposta:</span>
      ${prods.map(([k, n]) => `<button class="${PROD_ETAPA === k ? 'sec' : 'b'}" onclick="trocarProdEtapa('${k}')">${PROD_ETAPA === k ? '● ' : ''}${n}</button>`).join('')}
    </div>
    <p style="margin:2px 0 10px; font-size:12px; opacity:.7">São duas propostas na seguradora. Marque cada uma no seu próprio ritmo.</p>` : ''}
    ${legadoMisto ? `<p class="al" style="font-size:12px; margin:0 0 10px">Esta proposta tem etapas marcadas antes da separação por produto. Elas não aparecem mais aqui — remarque no produto certo.</p>` : ''}

    <div class="btns" style="margin-top:0">${bt('transmitida', '1 · Transmitida à seguradora')}</div>
    <div class="btns">${bt('aceiteEmpresa', '2 · Aceite digital da empresa')}</div>
    ${P.responsavel ? `<p style="font-size:12px; opacity:.75; margin:2px 0 8px">assina: <b>${esc(P.responsavel.nome || '')}</b>${P.responsavel.cargo ? ' · ' + esc(P.responsavel.cargo) : ''}${P.responsavel.cpf ? ' · CPF ' + esc(P.responsavel.cpf) : ''}${P.responsavel.nasc ? ' · nasc. ' + esc(String(P.responsavel.nasc).split('-').reverse().join('/')) : ''}${P.responsavel.sexo ? ' · ' + (P.responsavel.sexo === 'M' ? 'Masculino' : 'Feminino') : ''}${P.responsavel.cel ? ' · ' + esc(P.responsavel.cel) : ''}</p>`
      : '<p class="al" style="font-size:12px; margin:2px 0 8px">o cliente ainda não definiu quem assina pela empresa</p>'}

    ${aceites.length ? `<label class="lbl2">3 · Aceite digital de cada segurado</label><div class="btns">${btSeg}</div>` : ''}
    <div class="btns">${bt('boletoEnviado', '4 · Boleto enviado')} ${bt('boletoPago', '5 · Pagamento confirmado')}</div>
    <div class="btns">${E.teleentrevista && E.teleentrevista.feita
      ? `<button class="sec" onclick="teleEntrevista(0)"><span class="ok">✓</span> Tele-entrevista feita <small>${_dh(E.teleentrevista.feita)}</small></button>`
      : `<button class="b" onclick="teleEntrevista(1)">Tele-entrevista feita</button>`}</div>

    <label class="lbl2">Pendências da seguradora</label>
    ${pend.length ? `<table><tr><th>Quem</th><th>O quê</th><th>Pedido</th><th></th></tr>
      ${pend.map((x, i) => `<tr class="${x.resolvidoEm ? '' : 'al'}"><td>${esc(x.socioId ? nomeSocio(x.socioId) : 'Empresa')}</td><td>${esc(x.texto)}</td><td>${_dh(x.em)}</td>
        <td>${x.resolvidoEm ? '<span class="ok">resolvida</span>' : `<button class="sec" onclick="resolverPend(${i})">Resolver</button>`}</td></tr>`).join('')}</table>` : '<p style="font-size:12px; opacity:.6">nenhuma</p>'}
    <div class="btns">
      <select id="pendQuem" style="flex:0 0 auto"><option value="">Empresa</option>${(P.socios || []).map(x => `<option value="${esc(x.id)}">${esc(x.nome)}</option>`).join('')}</select>
      <input id="pendTxt" style="flex:1; min-width:200px" placeholder="Ex.: exame de sangue e eletrocardiograma">
      <button class="sec" onclick="addPend()">+ pendência</button>
    </div>

    <label class="lbl2">Resultado por sócio</label>
    <p style="font-size:12px; opacity:.7; margin:0 0 7px">A seguradora responde sócio a sócio. O cliente vê só aceito / não aceito — o motivo fica aqui, com você.</p>
    ${aceites.length ? `<table><tr><th>Sócio</th><th>Como voltou</th><th>Anotação</th></tr>
      ${aceites.map(([t, a]) => { const r = (E.resultadoSocios || {})[a.socioId] || {}; return `<tr>
        <td><b>${esc(nomeSocio(a.socioId))}</b></td>
        <td class="btns" style="margin:0; border:none; padding:4px 9px">
          <button class="${r.tipo === 'aceito' ? 'sec' : 'b'}" onclick="resSocio('${a.socioId}','aceito')">${r.tipo === 'aceito' ? '✓ ' : ''}Aceito</button>
          <button class="${r.tipo === 'agravo' ? 'sec' : 'b'}" onclick="resSocio('${a.socioId}','agravo')">${r.tipo === 'agravo' ? '✓ ' : ''}Agravo</button>
          <button class="${r.tipo === 'declinado' ? 'sec' : 'b'}" onclick="resSocio('${a.socioId}','declinado')">${r.tipo === 'declinado' ? '✓ ' : ''}Não aceito</button>
          ${r.tipo ? `<button class="sec" onclick="resSocio('${a.socioId}',null)">limpar</button>` : ''}
        </td>
        <td style="font-size:12px; opacity:.8">${esc(r.obs || '')}${r.em ? '<br><small>' + _dh(r.em) + '</small>' : ''}</td></tr>`; }).join('')}</table>` : ''}

    ${_temRecusa(E) ? blocoSaidaRecusa(E, aceites, nomeSocio) : ''}

    <label class="lbl2">Resultado da proposta</label>
    <div class="btns">
      <button class="${res.tipo === 'emitida' ? 'sec' : 'b'}" onclick="resultado('emitida')">${res.tipo === 'emitida' ? '✓ ' : ''}Emitida</button>
      <button class="${res.tipo === 'agravo' ? 'sec' : 'b'}" onclick="resultado('agravo')">${res.tipo === 'agravo' ? '✓ ' : ''}Emitida com agravo</button>
      <button class="${res.tipo === 'declinada' ? 'sec' : 'b'}" onclick="resultado('declinada')">${res.tipo === 'declinada' ? '✓ ' : ''}Declinada</button>
      ${res.tipo ? `<button class="sec" onclick="resultado(null)">desfazer</button>` : ''}
    </div>
    ${res.tipo ? `<p style="font-size:12px; opacity:.75">${esc(res.tipo)} em ${_dh(res.em)}${res.apolice ? ' · apólice ' + esc(res.apolice) : ''}${res.obs ? ' · ' + esc(res.obs) : ''}</p>` : ''}

    ${(res.tipo === 'emitida' || res.tipo === 'agravo') ? `
    <label class="lbl2">Documentos para o cliente</label>
    <p style="font-size:12px; opacity:.7; margin:0 0 7px">A via da proposta e a apólice em PDF aparecem na página que o cliente acompanha — no fim da linha do tempo deste produto.</p>
    ${(E.documentos || []).length ? `<table><tr><th>O quê</th><th>Arquivo</th><th>Quando</th><th></th></tr>
      ${(E.documentos || []).map((x, i) => `<tr><td>${esc(x.rotulo || '—')}</td><td><a href="${esc(x.url)}" target="_blank">${esc(x.nome || 'abrir')}</a></td><td>${_dh(x.em)}</td>
        <td><button class="sec" onclick="tirarDoc(${i})">Tirar</button></td></tr>`).join('')}</table>` : ''}
    <div class="btns">
      <select id="docRot" style="flex:0 0 auto"><option value="Apólice">Apólice</option><option value="Via da proposta">Via da proposta</option><option value="Condições gerais">Condições gerais</option><option value="Outro documento">Outro documento</option></select>
      <label class="b" style="cursor:pointer">📎 Anexar PDF<input type="file" id="docArq" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="anexarDoc()"></label>
      <span id="docMsg" style="font-size:12px; opacity:.75"></span>
    </div>` : ''}
  </div>`;
}

/* ═══ anexos da apólice ═══
   O cliente acompanhou tudo nesta página; a apólice tem que chegar nela também,
   e não num e-mail de três meses atrás. Sobe para o Storage e entra em
   `etapas.<produto>.documentos`, que a proposta online já sabe desenhar. */
async function anexarDoc() {
  const el = $('docArq'), msg = $('docMsg');
  const f = el.files && el.files[0]; if (!f || !PROP_ATUAL) return;
  if (!st) { msg.textContent = 'armazenamento indisponível — recarregue a página'; return; }
  if (f.size > 20 * 1024 * 1024) { msg.textContent = 'acima de 20 MB'; el.value = ''; return; }
  const rotulo = $('docRot').value;
  msg.textContent = 'enviando…';
  try {
    const nome = f.name.replace(/[^\w.\- ]+/g, '_');
    const path = `mb_propostas/${PROP_ATUAL.pid}/${PROD_ETAPA}/${Date.now()}_${nome}`;
    const task = st.ref(path).put(f, { contentType: f.type || 'application/pdf' });
    await new Promise((ok, err) => task.on('state_changed', sn => { msg.textContent = 'enviando… ' + Math.round(sn.bytesTransferred / sn.totalBytes * 100) + '%'; }, err, ok));
    const url = await task.snapshot.ref.getDownloadURL();
    const E = _etapasDe(PROP_ATUAL.P, PROD_ETAPA);
    const docs = (E.documentos || []).concat([{ rotulo, nome: f.name, url, path, em: new Date().toISOString() }]);
    await _gravarEtapas({ documentos: docs });
    msg.textContent = '';
  } catch (e) { msg.textContent = 'não consegui enviar: ' + e.message; console.warn(e); }
  el.value = '';
}
async function tirarDoc(i) {
  if (!PROP_ATUAL) return;
  const E = _etapasDe(PROP_ATUAL.P, PROD_ETAPA);
  const docs = (E.documentos || []).slice();
  if (!docs[i]) return;
  if (!confirm('Tirar "' + (docs[i].rotulo || docs[i].nome) + '" da página do cliente?')) return;
  docs.splice(i, 1);
  await _gravarEtapas({ documentos: docs });
}

async function _gravarEtapas(mudanca) {
  if (!db || !PROP_ATUAL) return;
  try {
    const dentro = {}; dentro[PROD_ETAPA] = mudanca;
    await db.collection('mb_propostas').doc(PROP_ATUAL.pid).set({ etapas: dentro, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  } catch (e) { alert('Não consegui gravar: ' + e.message); return; }
  carregar();
}
function marcar(campo) { const o = {}; o[campo] = _hoje(); _gravarEtapas(o); }
function desmarcar(campo) { const o = {}; o[campo] = null; _gravarEtapas(o); }
function marcarSegurado(sid, ligar) {
  const E = _etapasDe(PROP_ATUAL.P, PROD_ETAPA), m = Object.assign({}, E.aceiteSegurados || {});
  m[sid] = ligar ? _hoje() : null;
  _gravarEtapas({ aceiteSegurados: m });
}
function teleEntrevista(ligar) { _gravarEtapas({ teleentrevista: ligar ? { feita: _hoje() } : null }); }
function addPend() {
  const txt = ($('pendTxt').value || '').trim(); if (!txt) { $('pendTxt').focus(); return; }
  const quem = $('pendQuem').value || null;
  const lista = (_etapasDe(PROP_ATUAL.P, PROD_ETAPA).pendencias || []).concat([{ socioId: quem, texto: txt, em: _hoje(), resolvidoEm: null }]);
  $('pendTxt').value = '';
  _gravarEtapas({ pendencias: lista });
}
function resolverPend(i) {
  const lista = (_etapasDe(PROP_ATUAL.P, PROD_ETAPA).pendencias || []).slice();
  if (!lista[i]) return;
  lista[i] = Object.assign({}, lista[i], { resolvidoEm: _hoje() });
  _gravarEtapas({ pendencias: lista });
}
function _temRecusa(E) {
  const r = E.resultadoSocios || {};
  return Object.keys(r).some(k => r[k] && r[k].tipo === 'declinado');
}
/* Recusa não pode matar o negócio. Na prática a seguradora recusa UM sócio, e
   a empresa fica sem nada porque ninguém deu o próximo passo. Estas são as três
   saídas reais — a primeira resolve a maioria dos casos. */
const SAIDAS = [
  ['seguir', 'Seguir só com os aceitos',
   'Emite a apólice de quem passou e trata a inclusão do recusado à parte. É o caminho da maioria dos casos — o pior desfecho é a empresa ficar sem nada porque um sócio não passou.'],
  ['recotar', 'Recotar o recusado com capital menor',
   'Capital menor às vezes passa, ou passa com agravo aceitável. Vale antes de desistir, principalmente quando a participação dele é pequena.'],
  ['carencia', 'Trocar para a versão sem questionário de saúde',
   'Só no Resgatável: até 70 anos, com 24 meses de carência para morte por doença (acidente cobre desde o 1º dia) e cerca de 6% mais caro. Resolve recusa por saúde — mas explique a carência antes.']
];
function blocoSaidaRecusa(E, aceites, nomeSocio) {
  const r = E.resultadoSocios || {};
  const fora = aceites.filter(([, a]) => (r[a.socioId] || {}).tipo === 'declinado').map(([, a]) => nomeSocio(a.socioId));
  const dentro = aceites.filter(([, a]) => ['aceito', 'agravo'].includes((r[a.socioId] || {}).tipo)).map(([, a]) => nomeSocio(a.socioId));
  const esc0 = E.saidaRecusa || {};
  return `<div class="caixa al" style="border-color:#f59e0b; margin-top:12px">
    <b>A seguradora não aceitou ${fora.length === 1 ? 'um sócio' : fora.length + ' sócios'}: ${esc(fora.join(', '))}</b>
    <p style="font-size:12.5px; margin:6px 0 10px">${dentro.length
      ? `${esc(dentro.join(', '))} ${dentro.length === 1 ? 'passou' : 'passaram'}. Não deixe a empresa ficar sem nada — escolha o caminho e o cliente vê na proposta dele.`
      : 'Nenhum sócio passou. Ainda assim há caminho: capital menor ou a versão sem questionário de saúde.'}</p>
    ${SAIDAS.map(([id, t, d]) => `<div style="border:1px solid ${esc0.tipo === id ? '#16a34a' : '#334155'}; border-radius:10px; padding:10px 12px; margin-bottom:7px; background:${esc0.tipo === id ? 'rgba(22,163,74,.10)' : 'transparent'}">
      <div style="display:flex; gap:9px; align-items:flex-start">
        <div style="flex:1"><b style="font-size:13px">${esc0.tipo === id ? '✓ ' : ''}${t}</b>
          <div style="font-size:12px; opacity:.75; margin-top:3px; line-height:1.45">${d}</div></div>
        <button class="${esc0.tipo === id ? 'sec' : 'b'}" onclick="escolherSaida('${id}')" style="white-space:nowrap">${esc0.tipo === id ? 'escolhido' : 'seguir por aqui'}</button>
      </div></div>`).join('')}
    ${esc0.tipo ? `<p style="font-size:12px; opacity:.8; margin:4px 0 0">Marcado em ${_dh(esc0.em)}${esc0.obs ? ' · ' + esc(esc0.obs) : ''} · <a href="#" onclick="escolherSaida(null);return false" style="color:#93c5fd">desfazer</a></p>` : ''}
  </div>`;
}
function resSocio(sid, tipo) {
  const E = _etapasDe(PROP_ATUAL.P, PROD_ETAPA), m = Object.assign({}, E.resultadoSocios || {});
  if (!tipo) { delete m[sid]; }
  else {
    const obs = tipo === 'aceito' ? '' : (prompt(tipo === 'declinado'
      ? 'Motivo da recusa, para o seu registro (o cliente NÃO vê):'
      : 'Qual o agravo, para o seu registro (o cliente NÃO vê):') || '');
    m[sid] = { tipo, obs: obs.trim(), em: _hoje() };
  }
  _gravarEtapas({ resultadoSocios: m });
}
function escolherSaida(tipo) {
  if (!tipo) { _gravarEtapas({ saidaRecusa: null }); return; }
  const obs = prompt('Alguma anotação sobre este caminho? (opcional, só para você)') || '';
  _gravarEtapas({ saidaRecusa: { tipo, em: _hoje(), obs: obs.trim() } });
}

function resultado(tipo) {
  if (!tipo) { _gravarEtapas({ resultado: null }); return; }
  const apolice = tipo === 'declinada' ? '' : (prompt('Número da apólice (pode deixar em branco):') || '');
  const obs = tipo === 'declinada' ? (prompt('Motivo, para o seu registro (o cliente não vê):') || '') : '';
  _gravarEtapas({ resultado: { tipo, em: _hoje(), apolice: apolice.trim(), obs: obs.trim() } });
}

async function verAceite(pid, t) {
  try {
    const d = await db.collection('mb_aceites').doc(pid + '__' + t).get();
    if (!d.exists) { $('aceiteOut').innerHTML = '<p class="er">Sem dados.</p>'; return; }
    const txt = JSON.stringify(d.data().dados, null, 2);
    $('aceiteOut').innerHTML = `<p style="margin-top:10px">Dados pessoais e declaração de saúde — use para preencher a proposta oficial da seguradora. Não repasse a terceiros.</p><textarea readonly style="min-height:260px">${esc(txt)}</textarea>`;
  } catch (e) { $('aceiteOut').innerHTML = `<p class="er">Sem permissão para ler (${esc(e.message)}). Entre no painel com o seu usuário.</p>`; }
}

(async function () {
  const _qs = new URLSearchParams(location.search);
  const p = _qs.get('p'); if (p) $('pid').value = p;
  ORIGEM = _qs.get('s') || null;   // veio da Ficha de Cotação: amarra a proposta ao registro
  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (!fbOk) { $('authAviso').hidden = false; $('authAviso').textContent = 'Fora do Firebase Hosting: dá para validar e pré-visualizar, mas não salvar.'; return; }
  await new Promise(r => { const off = firebase.auth().onAuthStateChanged(u => { USER = u; off(); r(); }); });
  if (!USER || USER.isAnonymous) { $('authAviso').hidden = false; $('authAviso').textContent = 'Você não está logado no painel neste navegador. Salvar e ver dados de aceite dependem das regras do Firestore — entre no painel primeiro.'; if (!USER) { try { await firebase.auth().signInAnonymously(); } catch (e) { } } }
  db = firebase.firestore();
    try { st = firebase.storage(); } catch (e) { st = null; }
  if (p) carregar();
})();
</script>
