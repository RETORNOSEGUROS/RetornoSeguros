   Funciona sozinho ou como 2ª etapa da apresentação (mesmo registro
   saude_colab_<token>): herda porte, situação e as 4 escolhas + reembolso.

   faixa etária de 19 a 58 — ou planilha com datas de nascimento) →
   situação (plano atual, aniversário, gasto, tratamentos em curso,
   cidades do time) → revisão → envio (lista de vidas, fatura, contrato).
   Regras da casa: nenhuma operadora citada, nenhum preço; "não sei"

async function buscarCNPJ(d, a, cb) { try { const r = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + d); if (!r.ok) throw 0; const j = await r.json();

    .concat((j.cnaes_secundarios || []).map(c => ({ codigo: String(c.codigo || ''), descricao: c.descricao || '', principal: false }))).filter(x => x && x.descricao);
  if (!a.nome) { a.nome = a.fantasia || a.razao; const el = palco.querySelector('[data-in="nome"]'); if (el) el.value = a.nome; } } catch (e) { a.cnpjOk = false; } cb(); salvar(); }

        insight: a => a.contribui === 'sim' ? `<div class="lembrete">Com contribuição, quem sai sem justa causa ou se aposenta pode continuar no plano — a Retorno orienta o RH sobre essa regra.</div>` : null },
      { id: 'comparar', tipo: 'multi', col: true, label: 'Quer que o estudo mostre alguma alternativa lado a lado?', sub: 'Opcional — marque o que quiser comparar.',

const brlS = n => 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ══════════ 3 · PESSOAS ══════════
   Regra de cotação: de 0 a 18 anos e de 59 em diante, IDADE EXATA (quantas pessoas
   com cada idade); de 19 a 58, por faixa etária. Toque na idade = +1. */
const FAIXAS_S = [['19_23', '19 a 23', 21], ['24_28', '24 a 28', 26], ['29_33', '29 a 33', 31], ['34_38', '34 a 38', 36], ['39_43', '39 a 43', 41], ['44_48', '44 a 48', 46], ['49_53', '49 a 53', 51], ['54_58', '54 a 58', 56]];
const IDJ = Array.from({ length: 19 }, (_, i) => i), IDS = Array.from({ length: 32 }, (_, i) => 59 + i);   // 59 a 90
const soma = o => Object.values(o || {}).reduce((s, n) => s + (Number(n) || 0), 0);
const totVidas = () => soma(S.pes.jovens) + soma(S.pes.faixas) + soma(S.pes.seniores);
function idadeMedia() { const t = totVidas(); if (!t) return null; let s = 0;
  Object.entries(S.pes.jovens).forEach(([a, n]) => s += Number(a) * n); Object.entries(S.pes.seniores).forEach(([a, n]) => s += Number(a) * n);
  FAIXAS_S.forEach(([k, , m]) => s += (Number(S.pes.faixas[k]) || 0) * m); return Math.round(s / t); }
function vidasTotal() { return S.pes.modo === 'aqui' ? (totVidas() || null) : (Number(S.pes.nVidas) || null); }
function modeloCSV() {
  const L = ['Nome completo;CPF;Data de nascimento (dd/mm/aaaa);Sexo (M/F);Parentesco (titular / cônjuge / filho);CPF do titular (para dependentes);Cidade onde mora;Nome da mãe',
    'Maria da Silva (exemplo — apague esta linha);000.000.000-00;15/03/1988;F;titular;;Bento Gonçalves/RS;Ana da Silva'];
  return 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + L.join('\r\n'));
}
function gradeIdades(id, lista, alvo, rot) {
  return `<div class="campo-bx" id="bx_${id}"><div class="campo-lb"><span class="tx">${rot}</span></div>
    <div class="campo-sub">Toque na idade para somar uma pessoa. O <b>−</b> tira.</div>
    <div class="idades">${lista.map(a => { const n = Number(alvo[a]) || 0; return `<div class="ida ${n ? 'on' : ''}" data-g="${id}" data-a="${a}"><button type="button" class="ia" data-add="${id}" data-a="${a}"><b>${a}${a === 90 ? '+' : ''}</b><small>${a === 1 ? 'ano' : 'anos'}</small><span class="qn">${n || ''}</span></button>${n ? `<button type="button" class="im" data-rm="${id}" data-a="${a}">−</button>` : ''}</div>`; }).join('')}</div>
    <div id="ins_${id}"></div></div>`;
}
function renderPessoas() {
  progresso(48); S.pos = { etapa: 'pessoas' };
  const rodape = `<div id="bxAqui" style="display:none;">
      ${gradeIdades('jov', IDJ, S.pes.jovens, 'Até 18 anos — quantas pessoas com cada idade?')}
      <div class="campo-bx"><div class="campo-lb"><span class="tx">De 19 a 58 anos — quantas pessoas em cada faixa?</span></div>
        <div class="faixas">${FAIXAS_S.map(([k, t]) => `<div class="fx"><span class="fl">${t}</span><button type="button" class="st" data-mn="${k}">−</button><input class="fn" data-fx="${k}" inputmode="numeric" value="${S.pes.faixas[k] || ''}" placeholder="0"><button type="button" class="st" data-pl="${k}">+</button></div>`).join('')}</div></div>
      ${gradeIdades('sen', IDS, S.pes.seniores, '59 anos ou mais — quantas pessoas com cada idade?')}
      <div id="insTot"></div></div>
    <div id="bxPlan" class="campo-bx" style="display:none;"><div class="campo-lb"><span class="tx">A lista de vidas</span></div>
      <div class="campo-sub">Nome, CPF, <b>data de nascimento</b> e parentesco de cada pessoa (titulares e dependentes). Excel, PDF ou foto — a Retorno organiza.</div>
      <a class="op leve" href="${modeloCSV()}" download="modelo_vidas_saude_retorno.csv" style="display:inline-block; text-decoration:none; margin:10px 0 4px;">⬇ Baixar modelo de planilha</a>
      ${htmlUpload('upPes', '📎 Anexar a lista de vidas', 'Excel, PDF ou foto · até ' + ARQ_MB + ' MB')}</div>`;
  const atualizar = pagina({ trilha: 'pessoas', rotulo: 'Etapa 3 · As pessoas', titulo: 'Quem entra no plano?', alvo: S.pes, voltar: renderDesenho,
    intro: 'O preço do plano depende da idade de cada pessoa. Até 18 anos e a partir de 59, a cotação pede a <strong>idade exata</strong>; no meio, basta a faixa.',
    campos: [
      { id: 'nTit', tipo: 'numero', label: 'Quantos titulares (colaboradores, sócios, estagiários)?', ph: 'Ex.: 42', naosei: true,
        sub: PRES && PRES.scPorte ? 'Na apresentação você indicou <b>' + esc(PRES.scPorte.texto) + '</b> vidas no total.' : null },
      { id: 'modo', tipo: 'escolha', col: true, label: 'Como prefere informar as idades?',
        opcoes: [{ v: 'aqui', t: 'Informar aqui', d: 'toque nas idades e nas faixas' }, { v: 'planilha', t: 'Enviar a lista com as datas de nascimento', d: 'baixe o modelo e anexe aqui mesmo' }, { v: 'depois', t: 'O RH envia depois', d: 'sigo sem as idades por enquanto' }] },
      { id: 'nVidas', tipo: 'numero', label: 'Quantas vidas no total, aproximadamente (com dependentes)?', ph: 'Ex.: 95', visivel: a => a.modo === 'planilha' || a.modo === 'depois' }
    ], rodape, aoAtualizar: () => { if ($('bxAqui')) $('bxAqui').style.display = S.pes.modo === 'aqui' ? '' : 'none'; if ($('bxPlan')) $('bxPlan').style.display = S.pes.modo === 'planilha' ? '' : 'none'; pintarTot(); },
    botoes: [{ t: 'Continuar →', f: renderSituacao }] });
  function pintarTot() { const el = $('insTot'); if (!el) return; const t = totVidas(), tit = Number(S.pes.nTit) || 0, im = idadeMedia(), al = [];
    if (t && t < 3) al.push('O mínimo para contratar são <b>3 vidas</b>.');
    if (t >= 30) al.push('<b>30 vidas ou mais:</b> quem entrar nos primeiros 30 dias fica <b>livre de carência</b>.');
    else if (t) al.push('Com menos de 30 vidas, cada pessoa preenche uma declaração de saúde — ninguém é recusado.');
    if (t > 199) al.push('Acima de 199 vidas, o plano entra no segmento empresarial — condições negociadas sob medida.');
    if (tit && t && t < tit) al.push('Há menos vidas que titulares informados — confira as contagens.');
    const sen = soma(S.pes.seniores); if (sen) al.push(sen + (sen === 1 ? ' pessoa' : ' pessoas') + ' com 59 anos ou mais — faixa com maior peso no preço; a idade exata ajuda a cotação a ser precisa.');
    el.innerHTML = t ? `<div class="insight">Total: <span class="grande">${t.toLocaleString('pt-BR')} ${t === 1 ? 'vida' : 'vidas'}</span>idade média estimada: <b>${im} anos</b>${tit && t >= tit ? ' · ' + tit + ' titulares e ' + (t - tit) + ' dependentes' : ''}</div>${al.map(x => `<div class="lembrete">${x}</div>`).join('')}` : ''; }
  const repintarGrade = (id) => { const lista = id === 'jov' ? IDJ : IDS, alvo = id === 'jov' ? S.pes.jovens : S.pes.seniores, rot = id === 'jov' ? 'Até 18 anos — quantas pessoas com cada idade?' : '59 anos ou mais — quantas pessoas com cada idade?';
    const bx = $('bx_' + id); const tmp = document.createElement('div'); tmp.innerHTML = gradeIdades(id, lista, alvo, rot); bx.replaceWith(tmp.firstElementChild); ligarGrades(); pintarTot(); salvar(); };
  function ligarGrades() {
    palco.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const alvo = b.dataset.add === 'jov' ? S.pes.jovens : S.pes.seniores, a = b.dataset.a; alvo[a] = (Number(alvo[a]) || 0) + 1; repintarGrade(b.dataset.add);
      if (b.dataset.add === 'jov' && Number(a) === 0 && alvo[a] === 1) eco('Bebês de até 30 dias incluídos no plano entram <b>sem carência</b> — vale lembrar o RH.'); });
    palco.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const alvo = b.dataset.rm === 'jov' ? S.pes.jovens : S.pes.seniores, a = b.dataset.a; alvo[a] = (Number(alvo[a]) || 0) - 1; if (alvo[a] <= 0) delete alvo[a]; repintarGrade(b.dataset.rm); });
  }
  const setFx = (k, n) => { n = Math.max(0, Math.min(99999, n || 0)); if (n) S.pes.faixas[k] = n; else delete S.pes.faixas[k]; const el = palco.querySelector(`[data-fx="${k}"]`); if (el) el.value = n || ''; pintarTot(); salvar(); };
  palco.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => setFx(b.dataset.pl, (Number(S.pes.faixas[b.dataset.pl]) || 0) + 1));
  palco.querySelectorAll('[data-mn]').forEach(b => b.onclick = () => setFx(b.dataset.mn, (Number(S.pes.faixas[b.dataset.mn]) || 0) - 1));
  palco.querySelectorAll('[data-fx]').forEach(el => el.oninput = () => setFx(el.dataset.fx, soNum(el.value)));
  ligarGrades(); ligarUpload('upPes', 'lista_vidas'); atualizar();
}

/* ══════════ 4 · SITUAÇÃO ATUAL + CIDADES ══════════ */
function renderSituacao() {

    ], rodape, botoes: [{ t: 'Revisar e enviar →', f: renderRevisao }] });

/* ══════════ 5 · REVISÃO + ENVIO ══════════ */
const D_TXT = { completo: 'Completo (ambulatorial + hospitalar)', hospitalar: 'Só hospitalar', enfermaria: 'Enfermaria', quarto: 'Quarto privativo', com: 'Com coparticipação', sem: 'Sem coparticipação',

const DEP_TXT = { sim: 'Com dependentes', titular: 'Só titulares', escolha: 'Cada colaborador decide', naosei: 'A definir' };
function textoJovSen(o) { return Object.keys(o).map(Number).sort((a, b) => a - b).map(a => a + (a === 90 ? '+' : '') + ' anos: ' + o[a]).join(' · '); }
function textoFaixas() { return FAIXAS_S.filter(([k]) => Number(S.pes.faixas[k])).map(([k, t]) => t + ': ' + S.pes.faixas[k]).join(' · '); }
function renderRevisao() {

      ${ln('Reembolso', D_TXT[d.reembolso] || 'a definir', !d.reembolso)}${ln('Dependentes', DEP_TXT[d.dependentes] || 'a definir', !d.dependentes)}${ln('Abrangência', 'Nacional')}</div>
    <div class="rev"><h4>Pessoas <a data-ir="pessoas">editar</a></h4>${ln('Titulares', S.pes.nTit && S.pes.nTit !== 'naosei' ? S.pes.nTit : 'a informar', !S.pes.nTit || S.pes.nTit === 'naosei')}
      ${ln('Vidas', vidasTotal() ? vidasTotal() + (idadeMedia() && S.pes.modo === 'aqui' ? ' · média ' + idadeMedia() + ' anos' : '') : 'a informar', !vidasTotal())}

    <div class="rev"><h4>Hoje <a data-ir="situacao">editar</a></h4>${ln('Plano atual', S.sit.temPlano === 'sim' ? esc((S.sit.operadora || 'sim') + (S.sit.aniversario && S.sit.aniversario !== 'naosei' ? ' · aniversário em ' + MESES[Number(S.sit.aniversario) - 1] : '')) : S.sit.temPlano === 'nao' ? 'Não tem' : 'Não sei', S.sit.temPlano === 'naosei')}
      ${typeof S.sit.gasto === 'number' ? ln('Gasto mensal', brl(S.sit.gasto)) : ''}${S.cidades.length ? ln('Cidades', esc(S.cidades.join(' · '))) : ''}</div>

function protocolo() { const b = String(SESSAO || '').replace(/^saude_colab_|^q_saude_colab_/, ''); return (b.slice(0, 6) || 'RETORNO').toUpperCase(); }

/* ─── ANEXOS (Storage) ───
   Mesmo padrão do Empresarial/Equipamentos: mb_apolices/<empresa|sem_empresa>/vida-grupo/<SESSAO>/…
   Metadados em apoliceAnexos do registro — o painel mostra em Apresentações e, se a empresa
   for cadastrada, o corretor VINCULA ao raio-x. Se o envio falhar, nada trava. */
const ARQ_MAX = 10, ARQ_MB = 15;
const ARQ_TIPOS = { pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', heic: 'image/heic',
  csv: 'application/vnd.ms-excel' };   // CSV sobe como Excel: a regra do Storage não aceita text/csv

const _mimeArq = f => ARQ_TIPOS[_ext(f)] || f.type || 'application/octet-stream';
const _tipoOk = f => !!ARQ_TIPOS[_ext(f)];

async function subir(f, tipo, prog) {
  try { if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}   // a regra exige sessão (anônima serve)
  const emp = (LINK && LINK.empresaId) || 'sem_empresa';
  const caminho = 'mb_apolices/' + emp + '/' + PASTA_STORAGE + '/' + SESSAO + '/' + Date.now() + '_' + String(f.name).replace(/[^a-zA-Z0-9_.\-]/g, '_');
  const t = firebase.storage().ref(caminho).put(f, { contentType: _mimeArq(f) });
  /* vigia: sem nenhum avanço em 40s, cancela — o cliente vê o aviso e usa o WhatsApp em vez de ficar olhando o "carregando" */
  let ultimo = Date.now(); const vigia = setInterval(() => { if (Date.now() - ultimo > 40000) { clearInterval(vigia); try { t.cancel(); } catch (e) {} } }, 2000);
  t.on('state_changed', sn => { ultimo = Date.now(); if (prog && sn.totalBytes) prog(Math.round(sn.bytesTransferred / sn.totalBytes * 100)); });
  try { const snap = await _comTimeout(t, 180000); const url = await _comTimeout(snap.ref.getDownloadURL(), 20000);
    return { nome: f.name, url, caminho, tamanho: f.size, em: new Date().toISOString(), via: 'questionario', tipo: tipo || 'documento', porNome: S.contato.nome || null, protocolo: protocolo() };

}
async function gravarAnexos() { if (!SESSAO) return; try { await db.collection('mb_apresentacoes').doc(SESSAO).set({ apoliceAnexos: S.anexos, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e) { console.warn('anexos', e); } }
function htmlUpload(id, titulo, sub) { return `<label class="zona-arq" id="${id}_z">${titulo}<small>${sub}</small><input type="file" id="${id}_in" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.doc,.docx,.xls,.xlsx,.csv" style="display:none;"></label><div id="${id}_l"></div>`; }
function ligarUpload(id, tipo) {
  const inp = $(id + '_in'); if (!inp) return;
  const pintar = () => { const l = $(id + '_l'); if (!l) return; const meus = S.anexos.map((a, i) => [a, i]).filter(([a]) => !tipo || a.tipo === tipo);
    l.innerHTML = meus.map(([a, i]) => `<div class="anx ok"><span class="nm">📄 ${esc(a.nome)}</span><span class="sz">${_tam(a.tamanho)}</span><button class="x" data-rm="${i}" type="button" title="remover">✕</button></div>`).join('');
    l.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { const a = S.anexos.splice(Number(b.dataset.rm), 1)[0]; pintar();
      try { if (a && a.caminho && storageOk()) await firebase.storage().ref(a.caminho).delete(); } catch (e) {} await gravarAnexos(); salvar(); });
    const z = $(id + '_z'); if (z) z.style.display = S.anexos.length >= ARQ_MAX ? 'none' : ''; };
  pintar();

    for (const f of fs) {

    } };
}

/* ─── PDF KIT (jsPDF) — mesmo desenho em apresentação, questionário e painel ───
   A4, faixa azul no topo, seções numeradas, pares rótulo/valor em 2 colunas,
   tabelas, caixas de destaque e rodapé com contato e página. Fontes padrão do

    .replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/×/g, 'x').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/…/g, '...')
    .replace(/[→←]/g, '->').replace(/•/g, '-').replace(/[^\x00-\xFF\n]/g, '').replace(/[ \t]+/g, ' ').trim();

    doc.setTextColor(255, 255, 255);
    if (primeira) { doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(t(titulo), M, 18); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(170, 186, 214); doc.text(doc.splitTextToSize(t(subtitulo), CW - 40), M, 26);
      doc.setFontSize(8); doc.setTextColor(120, 140, 180); doc.text('RETORNO SEGUROS', W - M, 12, { align: 'right' }); y = 48; }
    else { doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text(t(titulo), M, 9); doc.setFont('helvetica', 'normal'); doc.setTextColor(120, 140, 180); doc.text('RETORNO SEGUROS', W - M, 9, { align: 'right' }); y = 24; }
  };

    par(txt, o) { const fs = (o && o.fs) || 9.5; doc.setFont('helvetica', (o && o.b) ? 'bold' : 'normal'); doc.setFontSize(fs); doc.setTextColor.apply(doc, (o && o.cor) || [51, 65, 85]);
      const ls = doc.splitTextToSize(t(txt), (o && o.w) || CW); ls.forEach(l => { espaco(fs * 0.5); doc.text(l, (o && o.x) || M, y); y += fs * 0.45; }); y += (o && o.after != null) ? o.after : 2; },

        grupo.forEach(([k, v], j) => { const x = M + j * cw; doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120, 132, 156); doc.text(t(k).toUpperCase(), x, y);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9.8); doc.setTextColor(15, 23, 42); doc.text(doc.splitTextToSize(t(v), cw - 6), x, y + 4.6); });
        y += h + 1.5; } },
    tabela(cab2, linhas, o) { const n = cab2.length, ws = (o && o.ws) || cab2.map(() => CW / n); const al = (o && o.al) || [];
      const linha = (cells, head, zebra) => { const alt = Math.max(...cells.map((c, i) => doc.splitTextToSize(t(c), ws[i] - 4).length)) * 4 + 3.2; espaco(alt);

    caixa(titulo2, itens, tipo) { const pal = { alerta: [[255, 247, 237], [194, 65, 12]], ok: [[236, 253, 245], [4, 120, 87]], info: [[239, 246, 255], [29, 78, 216]] }[tipo || 'info'];
      const ls = []; itens.forEach(s => doc.splitTextToSize('- ' + t(s), CW - 10).forEach(l => ls.push(l)));

      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, pal[1]); doc.text(t(titulo2).toUpperCase(), M + 4, y + 1); y += 6.5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); ls.forEach(l => { if (y > H - 22) { doc.addPage(); cab(false); } doc.setTextColor.apply(doc, pal[1]); doc.text(l, M + 5, y); y += 4.3; }); y += 4; void y0; },
    destaque(rot, valor, sub) { espaco(24); doc.setFillColor(5, 14, 36); doc.roundedRect(M, y - 4, CW, 20, 2, 2, 'F'); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(150, 170, 205); doc.text(t(rot).toUpperCase(), M + 5, y + 1);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(255, 255, 255); doc.text(t(valor), M + 5, y + 9); if (sub) { doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150, 170, 205); doc.text(doc.splitTextToSize(t(sub), CW - 10)[0], M + 5, y + 14); } y += 22; },

  };

}
