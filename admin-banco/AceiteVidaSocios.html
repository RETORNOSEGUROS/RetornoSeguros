<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dados para contratação | Retorno Seguros</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase 8.10.1 (compat). Configuração vem do /__/firebase/init.js do Firebase Hosting (sem chave no HTML).
     Fora do Hosting roda em modo demonstração (nada é gravado). -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="/__/firebase/init.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --verm:#f87171; --texto:#e8eeff; --suave:#93a4c8; --apagado:#5d6f95; --card:rgba(255,255,255,.045); --borda:rgba(147,164,200,.22); }
  html, body { background:var(--fundo); }
  body { font-family:'Inter',system-ui,sans-serif; color:var(--texto); min-height:100vh; min-height:100dvh; overflow-x:hidden; }
  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .fumaca span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.38; }
  .f1 { width:60vw; height:60vw; background:radial-gradient(circle,#1e40af,transparent 70%); top:-14%; left:-14%; }
  .f2 { width:50vw; height:50vw; background:radial-gradient(circle,#0ea5e9,transparent 70%); bottom:-18%; right:-12%; }
  .topo { position:fixed; top:0; left:0; right:0; z-index:10; padding:calc(10px + env(safe-area-inset-top)) 16px 8px; display:flex; align-items:center; justify-content:space-between; background:linear-gradient(var(--fundo) 60%, transparent); }
  .marca { font-size:10.5px; letter-spacing:.22em; color:#4b5f8a; font-weight:700; text-transform:uppercase; }
  .voltar { background:none; border:none; color:var(--suave); font:600 13px 'Inter',sans-serif; padding:8px 6px; cursor:pointer; min-width:70px; text-align:left; }
  .voltar[hidden] { visibility:hidden; display:block; }
  .espaco { min-width:70px; text-align:right; font-size:11.5px; color:var(--apagado); font-weight:700; }
  .progresso { position:fixed; top:0; left:0; height:3px; background:linear-gradient(90deg,var(--ciano),var(--dourado)); z-index:11; transition:width .5s; width:0; }
  .demo { position:fixed; top:calc(42px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:9; font-size:10.5px; color:#fcd34d; background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.3); padding:3px 10px; border-radius:100px; white-space:nowrap; }
  .palco { position:relative; z-index:2; max-width:600px; margin:0 auto; padding:calc(66px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom)); min-height:100vh; }
  .cena { animation:entra .4s cubic-bezier(.16,1,.3,1); }
  @keyframes entra { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
  .rotulo { font-size:11px; letter-spacing:.16em; color:var(--ciano); font-weight:700; text-transform:uppercase; margin-bottom:10px; }
  .titulo { font-size:clamp(22px,6.2vw,30px); font-weight:800; line-height:1.22; letter-spacing:-.02em; margin-bottom:10px; }
  .titulo em { font-style:normal; color:var(--dourado); }
  .texto { font-size:15px; line-height:1.6; color:#c3d0ec; margin-bottom:14px; }
  b { color:#fff; }
  .lbl { display:block; font-size:12.5px; font-weight:700; color:var(--suave); margin:14px 0 6px; }
  .lbl i { font-style:normal; font-weight:500; color:var(--apagado); }
  .campo { width:100%; padding:13px 14px; border-radius:12px; background:rgba(255,255,255,.05); border:1.5px solid var(--borda); color:#fff; font:500 16px 'Inter',sans-serif; }
  .campo:focus { outline:none; border-color:var(--ciano); }
  .campo.erro { border-color:var(--verm); }
  textarea.campo { min-height:84px; resize:vertical; font-size:14.5px; line-height:1.5; }
  .duas { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ops { display:flex; flex-wrap:wrap; gap:7px; }
  .op { padding:11px 13px; border-radius:11px; background:var(--card); border:1.5px solid var(--borda); color:var(--texto); font:600 14px 'Inter',sans-serif; cursor:pointer; transition:all .15s; }
  .op.sel { background:rgba(56,189,248,.18); border-color:var(--ciano); }
  .op.sim.sel { background:rgba(251,191,36,.16); border-color:var(--dourado); }
  .op.nao.sel { background:rgba(52,211,153,.15); border-color:var(--verde); }
  .grade11 { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .grade11 .op { padding:11px 0; text-align:center; }
  .btn { display:block; width:100%; margin-top:18px; padding:15px 18px; border:none; border-radius:13px; background:linear-gradient(135deg,var(--ciano),#2563eb); color:#031127; font:800 15.5px 'Inter',sans-serif; cursor:pointer; text-align:center; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.ouro { background:linear-gradient(135deg,var(--dourado),#f59e0b); color:#2a1a00; }
  .btn.sec { background:transparent; border:1.5px solid var(--borda); color:var(--texto); font-weight:700; }
  .painel { background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:16px; margin-top:12px; }
  .aviso { margin-top:14px; font-size:14px; line-height:1.55; color:#bfe3ff; background:rgba(56,189,248,.08); border-left:3px solid var(--ciano); border-radius:10px; padding:12px 14px; }
  .aviso.ouro { color:#fde68a; background:rgba(251,191,36,.08); border-left-color:var(--dourado); }
  .nota { font-size:12.5px; line-height:1.55; color:#8193bb; margin-top:10px; }
  .erro-msg { color:#fca5a5; font-size:13px; margin-top:8px; min-height:1px; }
  .perg { padding:14px 0; border-bottom:1px solid rgba(147,164,200,.13); }
  .perg:last-child { border-bottom:none; }
  .perg p { font-size:14.5px; line-height:1.5; margin-bottom:9px; color:#e3eaff; }
  .perg .ops .op { min-width:74px; text-align:center; }
  .perg textarea { margin-top:9px; }
  .benef { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:12px 14px; margin-top:10px; }
  .benef-t { display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dourado); font-weight:800; }
  .benef-t button { background:none; border:none; color:var(--suave); font:600 12px 'Inter',sans-serif; text-transform:none; letter-spacing:0; text-decoration:underline; cursor:pointer; }
  .soma { margin-top:10px; font-size:14px; font-weight:700; }
  .soma.ok { color:var(--verde); } .soma.no { color:var(--dourado); }
  .check { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid rgba(147,164,200,.12); cursor:pointer; font-size:14px; line-height:1.5; color:#dbe6ff; }
  .check:last-child { border-bottom:none; }
  .check .cx { flex-shrink:0; width:22px; height:22px; border-radius:6px; border:1.5px solid var(--borda); display:flex; align-items:center; justify-content:center; font-weight:800; color:#031127; margin-top:1px; }
  .check.on .cx { background:var(--verde); border-color:var(--verde); }
  .resumo-l { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid rgba(147,164,200,.12); font-size:14px; }
  .resumo-l span:first-child { color:var(--suave); }
  .resumo-l span:last-child { text-align:right; color:#fff; font-weight:600; }
  .i { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ciano); color:var(--ciano); font:700 12px Georgia,serif; font-style:italic; cursor:pointer; vertical-align:middle; margin-left:6px; }
  .explica { display:none; margin-top:8px; font-size:13.5px; line-height:1.55; color:#bfe3ff; background:rgba(56,189,248,.08); border-radius:10px; padding:10px 12px; }
  .explica.on { display:block; }
  .carregando { text-align:center; padding:90px 20px; color:var(--suave); }
</style>
</head>
<body>
<div class="fumaca"><span class="f1"></span><span class="f2"></span></div>
<div class="progresso" id="prog"></div>
<div class="topo"><button class="voltar" id="voltar" hidden onclick="voltar()">← Voltar</button><div class="marca">Retorno Seguros</div><div class="espaco" id="passoTxt"></div></div>
<main class="palco" id="palco"><div class="carregando">Carregando…</div></main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ACEITE VIDA SÓCIOS — cada sócio preenche os próprios dados e a declaração de saúde
   URL:  AceiteVidaSocios.html?p=<ID da proposta>&a=<token do sócio>
   Lê:    mb_propostas/<ID>  (nome do sócio e produtos marcados, em aceites[<token>])
   Grava: mb_aceites/<ID>__<token>  (dados pessoais e saúde — NUNCA na proposta)
          mb_propostas/<ID>.aceites.<token>.status  (só o status: iniciado / preenchido)
   ═══════════════════════════════════════════════════════════════════════ */

/* DECLARAÇÃO PESSOAL DE SAÚDE E ESTILO DE VIDA — seguro de VIDA (Pessoa Chave / Resgatável).
   Texto conforme a DPS de vida informada pela corretora em 25/09/2026.
   Estrutura: { id, bloco, t, ph? }. bloco define em qual das 3 telas a pergunta aparece.
   Ao trocar de versão, atualize DPS_VERSAO — ela é gravada junto com as respostas. */
const DPS_VERSAO = 'vida-dps-2026-09';
const DPS_BLOCOS = [
  { n: 1, titulo: 'Esporte, consultas e tratamentos', intro: 'Para cada "sim", conte o que foi, quando e como está hoje.' },
  { n: 2, titulo: 'Doenças e distúrbios', intro: 'Sofreu ou sofre de alguma doença ou distúrbio abaixo? Em caso positivo, informe todos os detalhes — datas, tratamentos realizados e o nome e endereço dos médicos.' },
  { n: 3, titulo: 'Ocorrências e estilo de vida', intro: 'As últimas cinco. Para cada "sim", conte os detalhes.' }
];
const DPS = [
  { id: 'd1', bloco: 1, t: 'Pratica esportes radicais?', ph: 'Qual esporte, com que frequência e desde quando' },
  { id: 'd2', bloco: 1, t: 'Consultou algum médico ou especialista, foi examinado ou tratado em hospitais ou clínicas, foi submetido a intervenção cirúrgica ou algum exame especial nos últimos 5 anos? Foi aconselhado a fazer? Tem previsto fazer no futuro?', ph: 'Motivo, data, médico ou clínica, resultado e situação atual' },
  { id: 'd3', bloco: 1, t: 'Fez ou faz uso de medicamentos em geral de forma rotineira?', ph: 'Quais medicamentos, para quê e desde quando' },
  { id: 'd4', bloco: 1, t: 'Fez tratamento com raios ou substâncias radioativas ou quimioterápicos?', ph: 'Qual tratamento, quando, motivo e situação atual' },
  { id: 'd5', bloco: 2, t: 'Hipertensão, infarto do miocárdio, insuficiência cardíaca, palpitações, angina, dor torácica, defeito cardíaco congênito, febre reumática, doença valvular, sopro cardíaco, apoplexia, aneurisma, trombose ou outras doenças cardiocirculatórias?' },
  { id: 'd6', bloco: 2, t: 'Tumores benignos ou malignos (cistos, nódulos, câncer e outros)?' },
  { id: 'd7', bloco: 2, t: 'Teve ou tem qualquer outra doença, enfermidade ou limitação (acidental ou por outro motivo), como deficiência de órgãos, membros ou sentidos (visão, audição), ou deficiência física em membros ou órgãos?' },
  { id: 'd8', bloco: 2, t: 'Asma, bronquite, enfisema, pneumonia, tuberculose ou outras doenças pulmonares ou da laringe?' },
  { id: 'd9', bloco: 2, t: 'Diabetes, doenças da tireoide ou outras doenças endócrinas?' },
  { id: 'd10', bloco: 2, t: 'Outras doenças ou distúrbios não mencionados acima?' },
  { id: 'd11', bloco: 3, t: 'Já sofreu violência ou acidente?', ph: 'Tipo de ocorrência, lesões produzidas e se ficou alguma limitação' },
  { id: 'd12', bloco: 3, t: 'Esteve ou está afastado das suas atividades profissionais e/ou realiza alguma atividade perigosa relacionada com a sua profissão ou esporte de risco?', ph: 'Motivo, período do afastamento, qual atividade e situação atual' },
  { id: 'd13', bloco: 3, t: 'Você faz uso regular e recorrente de bebidas alcoólicas? Não é necessário informar consumo esporádico ou exclusivamente social.', ph: 'Tipo de bebida, frequência e quantidade em uma semana típica' },
  { id: 'd14', bloco: 3, t: 'Nos últimos 12 meses você fez uso de produtos com nicotina, como cigarro convencional, eletrônico (vape) ou narguilé?', ph: 'Tipo de produto e média de consumo diário (cigarros por dia, sessões de narguilé por semana)' },
  { id: 'd15', bloco: 3, t: 'Fez ou faz uso de drogas por motivos que não sejam médicos?', ph: 'Qual, com que frequência e desde quando' }
];
const COMPROMISSOS = [
  { id: 'k1', t: 'Você leu as informações sobre a declaração de saúde?' },
  { id: 'k2', t: 'Você se compromete a preencher pessoalmente a declaração, sem delegar a outra pessoa?' },
  { id: 'k3', t: 'Você se compromete a apresentar os esclarecimentos necessários, para que todas as informações sejam verdadeiras?' }
];
const ENTREVISTA = [
  { id: 'e1', t: 'Você preencheu a declaração de saúde com veracidade?' },
  { id: 'e3', t: 'Você está ciente de que, se as informações não forem corretas ou tiverem sido omitidas, o seguro pode ser cancelado e a indenização pode ser negada?' },
  { id: 'e4', t: 'Podemos confiar nas suas declarações?' }
];
const CORRETORA = { nome: 'Retorno Seguros', whatsapp: '5554997015000' };

const params = new URLSearchParams(location.search);
const PID = params.get('p'), ATOK = params.get('a');
let db = null, DEMO = false, P = null, A = null, S = null;
let D = { benef: [], dps: {}, dpsDet: {}, comp: {}, entr: {}, decl: {} };
let passo = 0, historico = [];
const FV = () => firebase.firestore.FieldValue;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const primeiro = n => String(n || '').trim().split(/\s+/)[0] || '';
const so = s => String(s || '').replace(/\D/g, '');
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
function cpfOk(c) { c = so(c); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false; let s = 0; for (let i = 0; i < 9; i++) s += +c[i] * (10 - i); let d = (s * 10) % 11 % 10; if (d !== +c[9]) return false; s = 0; for (let i = 0; i < 10; i++) s += +c[i] * (11 - i); d = (s * 10) % 11 % 10; return d === +c[10]; }
const mCPF = v => so(v).slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
const mTel = v => { const d = so(v).slice(0, 11); return d.length > 10 ? d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3'); };
const mCEP = v => so(v).slice(0, 8).replace(/(\d{5})(\d)/, '$1-$2');
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e || '');
const temRG = () => !!(A && A.rg);
const temPC = () => !!(A && A.pc);
const perguntasDPS = () => DPS.filter(q => !q.soMulher || D.sexo === 'F');

/* ---------- telas ---------- */
const TELAS = [
  { id: 'intro' }, { id: 'ident' }, { id: 'doc' }, { id: 'contato' }, { id: 'prof' },
  { id: 'benef', se: () => temRG() || temPC() }, { id: 'medidas' }, { id: 'comp' },
  { id: 'dps1' }, { id: 'dps2' }, { id: 'dps3' },
  { id: 'entr' }, { id: 'revisao' }, { id: 'fim' }
];
const telasAtivas = () => TELAS.filter(t => !t.se || t.se());
function blocoDPS(n) { return perguntasDPS().filter(q => q.bloco === n); }

function ops(campo, lista, extra = '') { return `<div class="ops">${lista.map(([v, t]) => `<button class="op ${D[campo] === v ? 'sel' : ''}" onclick="setD('${campo}','${v}')">${t}</button>`).join('')}</div>${extra}`; }
function setD(k, v) { D[k] = v; mostrar(false); }
const inp = (k, lbl, attrs = '', ph = '') => `<label class="lbl">${lbl}</label><input class="campo" id="f_${k}" value="${esc(D[k] || '')}" placeholder="${ph}" ${attrs} oninput="D['${k}']=this.value">`;

function tela(id) {
  const nome = primeiro(S && S.nome);
  switch (id) {
    case 'intro': return `<div class="rotulo">${esc(P.empresa && P.empresa.nome || '')}</div>
      <h1 class="titulo">${esc(nome)}, <em>falta pouco.</em></h1>
      <p class="texto">A sociedade decidiu seguir com ${[temPC() ? '<b>Pessoa Chave</b>' : '', temRG() ? '<b>Resgatável</b>' : ''].filter(Boolean).join(' e ')} para você. Agora precisamos dos seus dados e da declaração de saúde.</p>
      <div class="painel">
        ${temPC() ? `<div class="resumo-l"><span>Pessoa Chave</span><span>${A.capPC ? brl(A.capPC) : 'conforme a proposta'}</span></div>` : ''}
        ${temRG() ? `<div class="resumo-l"><span>Resgatável</span><span>${A.capRG ? brl(A.capRG) : 'conforme a proposta'}</span></div>` : ''}
      </div>
      <div class="aviso">Leva uns 10 minutos. <b>Seus dados vão só para a corretora</b> — os outros sócios não veem suas respostas, nem a de saúde nem os beneficiários. Dá para parar e continuar depois pelo mesmo link.</div>
      <button class="btn" onclick="avancar()">Começar</button>`;
    case 'ident': return `<div class="rotulo">Seus dados</div><h2 class="titulo">Quem é você</h2>
      ${inp('nome', 'Nome completo', 'autocomplete="name"')}
      <label class="lbl">CPF</label><input class="campo" id="f_cpf" inputmode="numeric" value="${esc(D.cpf || '')}" oninput="this.value=mCPF(this.value);D.cpf=this.value">
      <label class="lbl">Data de nascimento</label><input class="campo" id="f_nasc" type="date" value="${esc(D.nasc || '')}" oninput="D.nasc=this.value">
      <label class="lbl">Sexo</label>${ops('sexo', [['M', 'Masculino'], ['F', 'Feminino']])}
      <label class="lbl">Estado civil</label>${ops('estCivil', [['solteiro', 'Solteiro(a)'], ['casado', 'Casado(a)'], ['uniao', 'União estável'], ['divorciado', 'Separado(a) / divorciado(a)'], ['viuvo', 'Viúvo(a)']])}
      ${inp('nacionalidade', 'Nacionalidade', '', 'Brasileira')}
      ${inp('mae', 'Nome da mãe')}
      <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    case 'doc': return `<div class="rotulo">Seus dados</div><h2 class="titulo">Documento de identidade</h2>
      <label class="lbl">Tipo</label>${ops('docTipo', [['RG', 'RG'], ['CNH', 'CNH'], ['RNE', 'RNE / CRNM'], ['outro', 'Outro']])}
      ${inp('docNum', 'Número')}
      <div class="duas"><div>${inp('docOrgao', 'Órgão expedidor', '', 'SSP/RS')}</div><div><label class="lbl">Data de expedição</label><input class="campo" id="f_docData" type="date" value="${esc(D.docData || '')}" oninput="D.docData=this.value"></div></div>
      <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    case 'contato': return `<div class="rotulo">Contato</div><h2 class="titulo">Onde falar com você</h2>
      ${inp('email', 'E-mail', 'type="email" autocomplete="email"')}
      <label class="lbl">Celular</label><input class="campo" id="f_cel" inputmode="tel" value="${esc(D.cel || '')}" oninput="this.value=mTel(this.value);D.cel=this.value">
      <label class="lbl">CEP</label><input class="campo" id="f_cep" inputmode="numeric" value="${esc(D.cep || '')}" oninput="this.value=mCEP(this.value);D.cep=this.value;if(so(this.value).length===8)buscarCEP()">
      ${inp('rua', 'Endereço (rua, avenida)')}
      <div class="duas"><div>${inp('numero', 'Número', 'inputmode="numeric"')}</div><div>${inp('compl', 'Complemento <i>(opcional)</i>')}</div></div>
      ${inp('bairro', 'Bairro')}
      <div class="duas"><div>${inp('cidade', 'Cidade')}</div><div>${inp('uf', 'UF', 'maxlength="2" style="text-transform:uppercase"')}</div></div>
      <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    case 'prof': return `<div class="rotulo">Atividade</div><h2 class="titulo">Profissão e renda</h2>
      ${inp('profissao', 'Profissão / cargo', '', 'Ex.: administrador, engenheiro, sócio-diretor')}
      <label class="lbl">Renda mensal aproximada</label>${ops('renda', [['ate20', 'Até R$ 20 mil'], ['20a50', 'R$ 20 a 50 mil'], ['50a100', 'R$ 50 a 100 mil'], ['100mais', 'Acima de R$ 100 mil']])}
      <label class="lbl">Você é pessoa politicamente exposta? <span class="i" onclick="document.getElementById('pepx').classList.toggle('on')">i</span></label>
      <div class="explica" id="pepx">É quem exerce ou exerceu, nos últimos 5 anos, cargo público relevante (por exemplo, mandato eletivo, cargos de direção em órgãos públicos, magistratura), e seus familiares e colaboradores próximos. A pergunta é exigida pelas regras de prevenção à lavagem de dinheiro.</div>
      ${ops('pep', [['nao', 'Não'], ['sim', 'Sim'], ['familiar', 'Sou familiar ou próximo de uma']])}
      <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    case 'benef': {
      let h = `<div class="rotulo">Beneficiários</div>`;
      if (temPC() && !temRG()) return h + `<h2 class="titulo">Na Pessoa Chave, <em>a beneficiária é a empresa</em></h2><p class="texto">A indenização por morte vai para a própria empresa, para pagar a sua parte aos herdeiros. Doenças graves e invalidez por acidente, se incluídas, são pagas a você.</p><button class="btn" onclick="avancar()">Continuar</button>`;
      if (!D.semBenef && !D.benef.length) addBenef();
      const soma = D.benef.reduce((a, b) => a + (Number(b.pct) || 0), 0);
      h += `<h2 class="titulo">Quem recebe o <em>Resgatável</em></h2>
        <p class="texto">Você escolhe livremente e pode trocar quando quiser.${temPC() ? ' (Na Pessoa Chave, a beneficiária é a empresa.)' : ''}</p>
        <div class="ops"><button class="op ${!D.semBenef ? 'sel' : ''}" onclick="D.semBenef=false;if(!D.benef.length)addBenef();mostrar(false)">Quero indicar</button><button class="op ${D.semBenef ? 'sel' : ''}" onclick="D.semBenef=true;mostrar(false)">Deixar a lei decidir</button></div>`;
      if (D.semBenef) return h + `<div class="aviso ouro">Sem indicação, a lei divide: metade para o cônjuge não separado judicialmente e metade para os herdeiros, na ordem da sucessão (art. 792 do Código Civil). Quem vive em união estável pode precisar provar a união.</div><button class="btn" onclick="avancar()">Continuar</button>`;
      h += D.benef.map((b, i) => `<div class="benef"><div class="benef-t">Beneficiário ${i + 1}${D.benef.length > 1 ? `<button onclick="D.benef.splice(${i},1);mostrar(false)">remover</button>` : ''}</div>
        <label class="lbl">Nome completo</label><input class="campo" value="${esc(b.nome || '')}" oninput="D.benef[${i}].nome=this.value">
        <label class="lbl">Parentesco</label><div class="ops">${['Cônjuge', 'Companheiro(a)', 'Filho(a)', 'Pai/Mãe', 'Irmão(ã)', 'Outro'].map(p => `<button class="op ${b.par === p ? 'sel' : ''}" onclick="D.benef[${i}].par='${p}';mostrar(false)">${p}</button>`).join('')}</div>
        <div class="duas"><div><label class="lbl">CPF <i>(se tiver)</i></label><input class="campo" inputmode="numeric" value="${esc(b.cpf || '')}" oninput="this.value=mCPF(this.value);D.benef[${i}].cpf=this.value"></div><div><label class="lbl">Nascimento</label><input class="campo" type="date" value="${esc(b.nasc || '')}" oninput="D.benef[${i}].nasc=this.value"></div></div>
        <label class="lbl">Percentual</label><input class="campo" inputmode="decimal" value="${esc(b.pct || '')}" placeholder="%" oninput="D.benef[${i}].pct=this.value.replace(',','.');atualizaSoma()">
      </div>`).join('');
      h += `<button class="btn sec" onclick="addBenef();mostrar(false)">+ Adicionar beneficiário</button>
        <div class="soma ${Math.abs(soma - 100) < .01 ? 'ok' : 'no'}" id="soma">Soma: ${soma.toLocaleString('pt-BR')}% ${Math.abs(soma - 100) < .01 ? '✓' : '(precisa dar 100%)'}</div>
        <p class="nota">Beneficiário menor de idade recebe por meio do responsável legal. Se quiser, fale com a corretora sobre como organizar isso.</p>
        <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
      return h;
    }
    case 'medidas': return `<div class="rotulo">Declaração de saúde</div><h2 class="titulo">Altura e peso</h2>
      <div class="duas"><div>${inp('altura', 'Altura (cm)', 'inputmode="numeric"', '175')}</div><div>${inp('peso', 'Peso (kg)', 'inputmode="numeric"', '80')}</div></div>
      <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    case 'comp': return `<div class="rotulo">Declaração de saúde</div><h2 class="titulo">Antes das perguntas de saúde</h2>
      <div class="aviso">Responda sobre <b>você</b>, com a verdade. Informar uma doença pode encarecer ou limitar a cobertura; <b>omitir pode anular a indenização</b>. Se tiver dúvida sobre como responder, fale com a corretora antes. A seguradora pode pedir laudos, exames ou perícia.</div>
      <div class="painel">${COMPROMISSOS.map(q => `<div class="perg"><p>${esc(q.t)}</p>${simNao('comp', q.id)}</div>`).join('')}</div>
      <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    case 'dps1': case 'dps2': case 'dps3': {
      const n = +id.slice(3); const l = blocoDPS(n); const ini = perguntasDPS().indexOf(l[0]) + 1;
      const B = DPS_BLOCOS.find(b => b.n === n) || { titulo: 'Declaração de saúde', intro: '' };
      return `<div class="rotulo">Declaração de saúde · parte ${n} de ${DPS_BLOCOS.length}</div><h2 class="titulo">${esc(B.titulo)}</h2>
        <p class="texto" style="font-size:14px">${esc(B.intro)}</p>
        <div class="painel">${l.map((q, i) => `<div class="perg"><p>${ini + i}. ${esc(q.t)}</p>${simNao('dps', q.id)}${D.dps[q.id] === 'sim' ? `<textarea class="campo" placeholder="${esc(q.ph || 'O que foi, quando, tratamento, situação atual e o médico que acompanhou')}" oninput="D.dpsDet['${q.id}']=this.value">${esc(D.dpsDet[q.id] || '')}</textarea>` : ''}</div>`).join('')}</div>
        <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    }
    case 'entr': return `<div class="rotulo">Declaração de saúde</div><h2 class="titulo">Para fechar a declaração</h2>
      <div class="painel">${ENTREVISTA.slice(0, 1).map(q => `<div class="perg"><p>${esc(q.t)}</p>${simNao('entr', q.id)}</div>`).join('')}
        <div class="perg"><p>De 0 a 10, que nota você dá para a sua franqueza ao preencher a declaração?</p><div class="grade11">${Array.from({ length: 11 }, (_, i) => `<button class="op ${D.entr.e2 === String(i) ? 'sel' : ''}" onclick="D.entr.e2='${i}';mostrar(false)">${i}</button>`).join('')}</div></div>
        ${ENTREVISTA.slice(1).map(q => `<div class="perg"><p>${esc(q.t)}</p>${simNao('entr', q.id)}</div>`).join('')}</div>
      <div class="erro-msg" id="erro"></div><button class="btn" onclick="validar()">Continuar</button>`;
    case 'revisao': {
      const sims = perguntasDPS().filter(q => D.dps[q.id] === 'sim').length;
      const DECL = [
        ['d1', 'Declaro que preenchi pessoalmente e que as informações são verdadeiras e completas.'],
        ['d2', 'Autorizo a corretora e a seguradora a tratar meus dados pessoais, inclusive os de saúde, para análise e contratação deste seguro, conforme a Lei Geral de Proteção de Dados.'],
        ['d3', 'Estou ciente de que a contratação depende da aceitação da seguradora e da assinatura da proposta oficial, e de que a seguradora pode pedir exames ou esclarecimentos.']
      ];
      return `<div class="rotulo">Revisão</div><h2 class="titulo">Confira e <em>envie</em></h2>
        <div class="painel">
          <div class="resumo-l"><span>Nome</span><span>${esc(D.nome)}</span></div>
          <div class="resumo-l"><span>CPF</span><span>${esc(D.cpf)}</span></div>
          <div class="resumo-l"><span>E-mail</span><span>${esc(D.email)}</span></div>
          <div class="resumo-l"><span>Celular</span><span>${esc(D.cel)}</span></div>
          ${temRG() ? `<div class="resumo-l"><span>Beneficiários</span><span>${D.semBenef ? 'Pela lei (art. 792)' : D.benef.map(b => esc(primeiro(b.nome)) + ' ' + b.pct + '%').join(', ')}</span></div>` : ''}
          <div class="resumo-l"><span>Declaração de saúde</span><span>${sims ? sims + ' resposta(s) "sim" detalhada(s)' : 'Nenhum "sim"'}</span></div>
        </div>
        <div class="painel">${DECL.map(([k, t]) => `<div class="check ${D.decl[k] ? 'on' : ''}" onclick="D.decl['${k}']=!D.decl['${k}'];mostrar(false)"><span class="cx">${D.decl[k] ? '✓' : ''}</span><span>${t}</span></div>`).join('')}</div>
        <div class="erro-msg" id="erro"></div>
        <button class="btn ouro" id="btnEnviar" onclick="enviar()" ${DECL.every(([k]) => D.decl[k]) ? '' : 'disabled'}>Enviar para a corretora</button>`;
    }
    case 'fim': return `<div class="rotulo">Pronto</div><h2 class="titulo">Obrigado, ${esc(nome)}. <em>Recebemos.</em></h2>
      <p class="texto">A corretora confere as informações e envia a proposta oficial para a sua assinatura. Se a seguradora pedir exames ou algum esclarecimento, avisamos você.</p>
      <div class="painel"><div class="resumo-l"><span>Protocolo</span><span>${esc(String(ATOK || 'DEMO').slice(0, 6).toUpperCase())}</span></div></div>
      <button class="btn sec" onclick="window.open('https://wa.me/${CORRETORA.whatsapp}?text='+encodeURIComponent('Olá! Acabei de enviar meus dados do seguro Vida Sócios.'),'_blank')">Falar com a corretora</button>`;
  }
}
function simNao(grupo, id) { const v = D[grupo][id]; return `<div class="ops"><button class="op nao ${v === 'nao' ? 'sel' : ''}" onclick="D['${grupo}']['${id}']='nao';mostrar(false)">Não</button><button class="op sim ${v === 'sim' ? 'sel' : ''}" onclick="D['${grupo}']['${id}']='sim';mostrar(false)">Sim</button></div>`; }
function addBenef() { D.benef.push({ nome: '', par: '', cpf: '', nasc: '', pct: D.benef.length ? '' : '100' }); }
function atualizaSoma() { const s = D.benef.reduce((a, b) => a + (Number(b.pct) || 0), 0); const el = document.getElementById('soma'); if (el) { el.className = 'soma ' + (Math.abs(s - 100) < .01 ? 'ok' : 'no'); el.textContent = 'Soma: ' + s.toLocaleString('pt-BR') + '% ' + (Math.abs(s - 100) < .01 ? '✓' : '(precisa dar 100%)'); } }
async function buscarCEP() { try { const r = await fetch('https://viacep.com.br/ws/' + so(D.cep) + '/json/'); const j = await r.json(); if (j.erro) return; D.rua = D.rua || j.logradouro; D.bairro = D.bairro || j.bairro; D.cidade = j.localidade; D.uf = j.uf; mostrar(false); const n = document.getElementById('f_numero'); if (n) n.focus(); } catch (e) { } }

/* ---------- validação por tela ---------- */
function validar() {
  const id = telasAtivas()[passo].id; let e = '';
  const req = (k, t) => { if (!e && !String(D[k] || '').trim()) e = 'Preencha: ' + t; };
  if (id === 'ident') { req('nome', 'nome completo'); if (!e && !cpfOk(D.cpf)) e = 'CPF inválido'; req('nasc', 'data de nascimento'); req('sexo', 'sexo'); req('estCivil', 'estado civil'); req('mae', 'nome da mãe'); if (!D.nacionalidade) D.nacionalidade = 'Brasileira'; }
  if (id === 'doc') { req('docTipo', 'tipo de documento'); req('docNum', 'número'); req('docOrgao', 'órgão expedidor'); req('docData', 'data de expedição'); }
  if (id === 'contato') { if (!emailOk(D.email)) e = 'E-mail inválido'; if (!e && so(D.cel).length < 10) e = 'Celular inválido'; req('cep', 'CEP'); req('rua', 'endereço'); req('numero', 'número'); req('bairro', 'bairro'); req('cidade', 'cidade'); req('uf', 'UF'); }
  if (id === 'prof') { req('profissao', 'profissão'); req('renda', 'renda'); req('pep', 'pessoa politicamente exposta'); }
  if (id === 'benef' && temRG() && !D.semBenef) {
    if (!D.benef.length) e = 'Indique pelo menos um beneficiário';
    D.benef.forEach((b, i) => { if (!e && (!b.nome || !b.par || !b.pct)) e = 'Complete o beneficiário ' + (i + 1); if (!e && b.cpf && !cpfOk(b.cpf)) e = 'CPF do beneficiário ' + (i + 1) + ' inválido'; });
    const s = D.benef.reduce((a, b) => a + (Number(b.pct) || 0), 0); if (!e && Math.abs(s - 100) > .01) e = 'Os percentuais precisam somar 100%';
  }
  if (id === 'medidas') { const a = +so(D.altura), p = +so(D.peso); if (!(a >= 120 && a <= 230)) e = 'Altura em centímetros (ex.: 175)'; else if (!(p >= 35 && p <= 300)) e = 'Peso em quilos (ex.: 80)'; }
  if (id === 'comp') { if (COMPROMISSOS.some(q => !D.comp[q.id])) e = 'Responda as três perguntas'; else if (COMPROMISSOS.some(q => D.comp[q.id] !== 'sim')) e = 'Para seguir, é preciso concordar com os três pontos. Se tiver dúvida, fale com a corretora.'; }
  if (/^dps\d$/.test(id)) { const l = blocoDPS(+id.slice(3)); if (l.some(q => !D.dps[q.id])) e = 'Responda todas as perguntas desta parte'; else if (l.some(q => D.dps[q.id] === 'sim' && !String(D.dpsDet[q.id] || '').trim())) e = 'Conte os detalhes de cada "sim"'; }
  if (id === 'entr') { if (ENTREVISTA.some(q => !D.entr[q.id]) || D.entr.e2 == null) e = 'Responda todas as perguntas'; }
  const el = document.getElementById('erro'); if (el) el.textContent = e;
  if (!e) avancar();
}
function avancar() { historico.push(passo); passo = Math.min(passo + 1, telasAtivas().length - 1); salvar(); mostrar(true); }
function voltar() { if (!historico.length) return; passo = historico.pop(); mostrar(true); }
function mostrar(topo) {
  const t = telasAtivas(); const y = window.scrollY;
  document.getElementById('palco').innerHTML = `<div class="cena">${tela(t[passo].id)}</div>`;
  document.getElementById('prog').style.width = (passo / (t.length - 1) * 100) + '%';
  document.getElementById('voltar').hidden = !(passo > 0 && t[passo].id !== 'fim');
  document.getElementById('passoTxt').textContent = t[passo].id === 'fim' || passo === 0 ? '' : passo + '/' + (t.length - 2);
  if (topo) window.scrollTo(0, 0); else window.scrollTo(0, y);
}

/* ---------- gravação ---------- */
async function salvar(final) {
  if (DEMO || !db) return;
  const id = telasAtivas()[passo].id;
  const status = final ? 'preenchido' : 'iniciado';
  try {
    await db.collection('mb_aceites').doc(PID + '__' + ATOK).set({
      propostaId: PID, aceiteToken: ATOK, socioId: A.socioId, nomeSocio: S.nome, produtos: { pc: !!A.pc, rg: !!A.rg },
      empresa: P.empresa || null, dados: D, passo: id, status, dpsVersao: DPS_VERSAO,
      atualizadoEm: FV().serverTimestamp(), ...(final ? { enviadoEm: FV().serverTimestamp() } : {})
    }, { merge: true });
    if (final || A.status !== 'iniciado') {
      await db.collection('mb_propostas').doc(PID).update({ ['aceites.' + ATOK + '.status']: status, ['aceites.' + ATOK + '.em']: new Date().toISOString() });
      A.status = status;
    }
  } catch (e) { console.warn('salvar', e); }
}
async function enviar() {
  const b = document.getElementById('btnEnviar'); b.disabled = true; b.textContent = 'Enviando…';
  try { if (!DEMO && db) { const t = telasAtivas(); passo = t.length - 1; await salvar(true); } }
  catch (e) { document.getElementById('erro').textContent = 'Não foi possível enviar. Tente de novo.'; b.disabled = false; b.textContent = 'Enviar para a corretora'; return; }
  historico = []; passo = telasAtivas().length - 1; mostrar(true);
}
function pararErro(t) { document.getElementById('palco').innerHTML = `<div class="carregando">${t}</div>`; }

(async function iniciar() {
  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (fbOk && PID && ATOK) {
    try {
      await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      const d = await db.collection('mb_propostas').doc(PID).get();
      if (!d.exists) { pararErro('Não encontramos esta proposta. Confira o link.'); return; }
      P = d.data(); A = P.aceites && P.aceites[ATOK];
      if (!A) { pararErro('Este link não é mais válido. Peça um novo à corretora.'); return; }
      let ex = null;
      try { ex = await db.collection('mb_aceites').doc(PID + '__' + ATOK).get(); } catch (e) { ex = null; } // regras podem bloquear leitura: aí começa do zero
      if (ex && ex.exists && ex.data().dados) { D = Object.assign(D, ex.data().dados); }
      if ((ex && ex.exists && ex.data().status === 'preenchido') || A.status === 'preenchido') { S = (P.socios || []).find(s => s.id === A.socioId) || { nome: A.nome }; passo = telasAtivas().length - 1; mostrar(true); return; }
    } catch (e) { console.warn(e); pararErro('Não foi possível abrir agora. Tente de novo em instantes.'); return; }
  } else {
    DEMO = true;
    P = { empresa: { nome: 'Metalúrgica Serra Alta Ltda.' }, socios: [{ id: 's2', nome: 'Rafael Moraes', nascimento: '1981-10-14' }], pessoaChave: { itens: [{ socioId: 's2', capital: 3600000 }] }, resgatavel: { itens: [{ socioId: 's2', capital: 1000000 }] } };
    A = { socioId: 's2', nome: 'Rafael Moraes', pc: true, rg: true, status: 'enviado' };
    const b = document.createElement('div'); b.className = 'demo'; b.textContent = 'Demonstração — nada é gravado'; document.body.appendChild(b);
  }
  S = (P.socios || []).find(s => s.id === A.socioId) || { nome: A.nome };
  const ipc = (P.pessoaChave && P.pessoaChave.itens || []).find(i => i.socioId === A.socioId); if (ipc) A.capPC = ipc.capital;
  const irg = (P.resgatavel && P.resgatavel.itens || []).find(i => i.socioId === A.socioId); if (irg) A.capRG = irg.capital;
  if (!D.nome) D.nome = S.nome || '';
  if (!D.nasc && S.nascimento) D.nasc = S.nascimento;
  mostrar(true);
})();
</script>
</body>
</html>
