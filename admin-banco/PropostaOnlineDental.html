<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sua proposta de plano dental | Retorno Seguros</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --escuro:#04231f; --verde:#0f766e; --agua:#2dd4bf; --dourado:#fbbf24;
          --tinta:#0f172a; --suave:#64748b; --linha:#e6ebf5; --fundo:#f5faf9; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--fundo); color:var(--tinta); }

  /* ---- topo ---- */
  .hero { background:linear-gradient(160deg,#04231f,#0b4b45 58%,#0f766e);
    color:#fff; padding:calc(26px + env(safe-area-inset-top)) 22px 70px; position:relative; overflow:hidden; }
  .hero::after { content:''; position:absolute; width:60vw; height:60vw; border-radius:50%;
    background:radial-gradient(circle,rgba(45,212,191,.24),transparent 70%); top:-25%; right:-18%; filter:blur(40px); }
  .hero-in { max-width:760px; margin:0 auto; position:relative; z-index:1; }
  .marca { font-size:10.5px; letter-spacing:.22em; color:#7fcfc6; font-weight:700; text-transform:uppercase; }
  .h-prod { font-size:clamp(22px,5vw,32px); font-weight:800; margin-top:12px; line-height:1.2; letter-spacing:-.02em; }
  .h-emp { font-size:14px; color:#bfe6e1; margin-top:6px; font-weight:400; }
  .h-seg { display:inline-flex; align-items:center; gap:7px; margin-top:16px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16); border-radius:100px; padding:6px 14px; font-size:12.5px; font-weight:600; }
  .validade { margin-top:14px; font-size:12.5px; color:#fcd34d; font-weight:600; }
  .validade.vencida { color:#fca5a5; }

  /* ---- corpo ---- */
  .corpo { max-width:760px; margin:-48px auto 0; padding:0 18px calc(40px + env(safe-area-inset-bottom)); position:relative; z-index:2; }
  .card { background:#fff; border-radius:16px; padding:22px; margin-bottom:14px;
    box-shadow:0 4px 22px rgba(15,23,42,.07); border:1px solid var(--linha); }
  .rot { font-size:10.5px; letter-spacing:.16em; color:var(--suave); font-weight:700; text-transform:uppercase; margin-bottom:12px; }
  .valorao { font-size:clamp(30px,8vw,44px); font-weight:800; letter-spacing:-.03em; color:var(--tinta); line-height:1; }
  .valorao small { font-size:15px; font-weight:600; color:var(--suave); letter-spacing:0; }
  .sub { font-size:12.5px; color:var(--suave); margin-top:7px; line-height:1.5; }

  .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:16px; }
  .mini { background:var(--fundo); border-radius:11px; padding:12px 14px; }
  .mini b { display:block; font-size:10px; color:var(--suave); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .mini span { font-size:15px; font-weight:700; color:var(--tinta); display:block; margin-top:3px; }

  /* cartão de custo */
  .custo { border:1.5px solid #5eead4; background:linear-gradient(160deg,#f0fdfa,#ecfdf5); }
  .custo .valorao { color:#065f46; }
  .por-dia { margin-top:10px; font-size:13px; color:#0f766e; font-weight:700; }
  .total-mes { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    margin-top:16px; padding-top:15px; border-top:1px dashed #99f6e4; }
  .total-mes span { font-size:13px; color:#0f766e; font-weight:600; }
  .total-mes b { font-size:22px; font-weight:800; color:#065f46; white-space:nowrap; }

  /* coberturas / procedimentos */
  .proc { display:flex; gap:11px; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--linha); }
  .proc:last-child { border-bottom:none; }
  .proc-ic { width:22px; height:22px; border-radius:50%; background:#ccfbf1; color:#0f766e; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-top:1px; }
  .proc-tx b { display:block; font-size:14px; font-weight:700; color:var(--tinta); line-height:1.35; }
  .proc-tx i { font-style:normal; display:block; font-size:12.5px; color:#475569; line-height:1.55; margin-top:3px; }

  /* faixas */
  .fx { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px;
    border:1px solid var(--linha); border-radius:11px; margin-bottom:8px; font-size:13.5px; }
  .fx.atual { border-color:#5eead4; background:#f0fdfa; }
  .fx b { font-weight:700; }
  .fx span { font-weight:800; white-space:nowrap; }
  .selo-at { font-size:9.5px; background:#ccfbf1; color:#115e59; padding:2px 7px; border-radius:100px; font-weight:700; margin-left:6px; }

  .info-linha { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--linha); font-size:13.5px; }
  .info-linha:last-child { border-bottom:none; }
  .info-linha b { min-width:150px; color:var(--tinta); font-weight:700; }
  .info-linha span { color:#475569; line-height:1.55; }

  .aviso { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:14px 16px;
    font-size:12.5px; color:#92400e; line-height:1.6; }

  .acoes { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .btn { padding:16px 26px; border-radius:14px; border:none; cursor:pointer; font-size:15px; font-weight:800;
    font-family:inherit; transition:all .2s; width:100%; }
  .btn-ok { background:linear-gradient(135deg,#0d9488,#0f766e); color:#fff; }
  .btn-ok:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(15,118,110,.28); }
  .btn-2 { background:#fff; color:var(--tinta); border:1.5px solid var(--linha); }
  .btn-2:hover { border-color:var(--agua); }

  .rodape { text-align:center; font-size:11px; color:#94a3b8; margin-top:22px; line-height:1.7; }

  .carregando, .erro { max-width:520px; margin:22vh auto; text-align:center; padding:0 24px; }
  .erro h2 { font-size:20px; margin-bottom:8px; }
  .erro p { font-size:14px; color:var(--suave); line-height:1.6; }

  .modal { position:fixed; inset:0; background:rgba(4,35,31,.62); display:none; align-items:flex-end;
    justify-content:center; z-index:50; padding:0; }
  .modal.on { display:flex; }
  .modal-cx { background:#fff; border-radius:20px 20px 0 0; padding:24px 22px calc(24px + env(safe-area-inset-bottom));
    width:100%; max-width:520px; animation:sobe .3s cubic-bezier(.16,1,.3,1); }
  @keyframes sobe { from{transform:translateY(100%);} to{transform:none;} }
  .campo { width:100%; padding:14px 16px; border:1.5px solid var(--linha); border-radius:12px; font-size:15px;
    font-family:inherit; margin-bottom:11px; }
  .campo:focus { outline:none; border-color:var(--agua); }
  .lbl { font-size:12px; color:var(--suave); font-weight:600; display:block; margin-bottom:6px; }

  @media (min-width:640px) { .modal { align-items:center; } .modal-cx { border-radius:20px; } }
</style>
</head>
<body>
<div id="app"><div class="carregando"><div style="font-size:34px;">🦷</div><p style="color:#64748b; margin-top:10px;">Carregando sua proposta…</p></div></div>

<div class="modal" id="modal">
  <div class="modal-cx">
    <div class="rot" id="mTit">Confirmar interesse</div>
    <div id="mOpcoes" style="display:none; margin-bottom:14px;">
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('valor')">💰 O valor ficou acima do esperado</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('rede')">📍 Quero saber se atende a minha região</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('adesao')">🤝 Preciso alinhar com RH / diretoria</button>
      <button class="btn btn-2" style="width:100%; margin-bottom:8px; text-align:left;" onclick="escolherDuvida('comparar')">⚖️ Quero comparar com outra proposta</button>
      <button class="btn btn-2" style="width:100%; text-align:left;" onclick="escolherDuvida('outra')">💬 É outra coisa</button>
    </div>
    <div style="font-size:14px; color:#475569; line-height:1.6; margin-bottom:16px;" id="mTxt"></div>
    <div id="mForm" style="display:none;">
    <label class="lbl">Seu nome</label>
    <input class="campo" id="mNome" placeholder="Nome completo">
    <label class="lbl">Telefone / WhatsApp</label>
    <input class="campo" id="mTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
    <label class="lbl">Mensagem <span style="font-weight:400;">(opcional)</span></label>
    <textarea class="campo" id="mMsg" rows="3" placeholder="Alguma dúvida ou observação?"></textarea>
    <button class="btn btn-ok" id="mOk">Enviar</button>
    </div>
    <button class="btn btn-2" style="margin-top:9px;" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   PROPOSTA ONLINE DENTAL — visão do cliente
   Lê uma proposta dental cadastrada pelo corretor (mb_propostas) e
   apresenta custo por vida, total mensal, procedimentos cobertos e
   as regras do plano. Duas formas de cotação chegam aqui:
     • até 199 vidas  → simulação (adesão opcional ou compulsória)
     • 200+ vidas     → proposta comercial (compulsória)
   Regra do Patrick: mostra SÓ o plano cotado, sem comparativo.
   ══════════════════════════════════════════════════════════════════ */
const ARQ_VERSAO = '1';
window.ARQ_VERSAO = ARQ_VERSAO;
console.log('%cProposta Online Dental v' + ARQ_VERSAO, 'background:#2dd4bf;color:#04231f;padding:2px 8px;border-radius:4px;font-weight:700');

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let P = null, DOC_ID = null;
const $ = id => document.getElementById(id);
const fmt = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function mascaraTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  el.value = d.length > 7 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`
           : d.length > 2 ? `(${d.slice(0,2)}) ${d.slice(2)}`
           : d.length > 0 ? `(${d}` : '';
}
window.mascaraTel = mascaraTel;

/* Procedimentos: o corretor não escreve nada — o sistema reconhece o
   nome que veio da cotação e explica o que aquilo significa na prática. */
const DIC_DENTAL = [
  [/consulta|emerg[êe]nc|urg[êe]nc/i, 'Consulta inicial, exame clínico e atendimento de urgência — dor, trauma ou infecção. É o que mais tira gente do trabalho e o que mais rápido resolve.'],
  [/restaura/i, 'Obturações em resina ou amálgama, para tratar cárie antes que vire canal ou extração.'],
  [/limpeza|profilaxia|fl[úu]or|raspagem|t[áa]rtaro/i, 'Limpeza, remoção de tártaro e aplicação de flúor. É a manutenção preventiva que evita o tratamento caro lá na frente.'],
  [/documenta[çc][ãa]o ortod[ôo]nt/i, 'Radiografias, fotos e modelos usados para planejar o tratamento ortodôntico — o pacote de exames que normalmente sai caro no particular.'],
  [/ortodont|aparelho/i, 'Acompanhamento ortodôntico conforme as condições do plano.'],
  [/pr[óo]tese/i, 'Reposição de dentes perdidos — coroas e próteses previstas no rol contratado.'],
  [/implante/i, 'Implantes dentários conforme as condições e carências do plano.'],
  [/endodont|canal/i, 'Tratamento de canal, quando a cárie já atingiu a polpa do dente.'],
  [/periodont|gengiv/i, 'Tratamento de gengiva e dos tecidos que sustentam o dente.'],
  [/cirurgi|extra[çc][ãa]o|siso/i, 'Extrações e pequenas cirurgias odontológicas, inclusive sisos.'],
  [/radiolog|radiograf|raio-?x/i, 'Exames de imagem necessários ao diagnóstico e ao acompanhamento.'],
  [/odontopediatr|infantil|crian[çc]a/i, 'Atendimento voltado às crianças, com abordagem e materiais próprios.'],
  [/preventiv/i, 'Procedimentos de prevenção — o que evita o problema em vez de remediar.'],
  [/reembolso/i, 'Possibilidade de atendimento fora da rede com reembolso, nos limites do plano contratado.']
];
function descrever(nome) {
  for (const [re, txt] of DIC_DENTAL) if (re.test(nome)) return txt;
  return '';
}

/* ---- render ---- */
function render() {
  const venc = P.validade ? new Date(String(P.validade).split('/').reverse().join('-') + 'T23:59:59') : null;
  const vencida = venc && !isNaN(venc) && venc < new Date();

  const vidas = Number(P.vidas || 0);
  const valorVida = Number(P.valorVida || 0);
  const mensal = Number(P.mensalidade || (vidas * valorVida) || 0);
  const anual = mensal * 12;

  const procs = (P.procedimentos || P.coberturas || []).map(c => typeof c === 'string' ? { nome: c } : c);
  const faixas = (P.faixas || []).slice().sort((a, b) => (a.de || 0) - (b.de || 0));

  const regras = [];
  const R = (t, v) => { if (v) regras.push([t, v]); };
  R('Adesão', P.adesao ? (/compuls/i.test(P.adesao)
      ? 'Compulsória — todos os elegíveis entram no plano. É o que garante o preço por vida mais baixo.'
      : 'Opcional — cada colaborador decide se adere.') : '');
  R('Custeio', P.custeio);
  R('Rede credenciada', P.redeCredenciada);
  R('Abrangência', P.abrangencia);
  R('Coparticipação', P.coparticipacao);
  R('Reembolso', P.reembolso);
  R('Múltiplo de reembolso', P.multiploReembolso ? P.multiploReembolso + ' — teto de reembolso por procedimento, calculado sobre a tabela do plano.' : '');
  R('Carência', P.carencia);
  R('Vigência do contrato', P.vigenciaMeses ? P.vigenciaMeses + ' meses' : (P.vigenciaInicio ? `${P.vigenciaInicio}${P.vigenciaFim ? ' a ' + P.vigenciaFim : ''}` : ''));
  R('Grupo elegível', P.grupoElegivel ? Number(P.grupoElegivel).toLocaleString('pt-BR') + ' vidas' : '');
  R('Vencimento da fatura', P.vencimentoFatura);
  R('Registro ANS', P.registroAns);
  (P.regras || []).forEach(r => { if (r && r.t) R(r.t, r.v); });

  $('app').innerHTML = `
    <div class="hero"><div class="hero-in">
      <div class="marca">Retorno Seguros · Proposta</div>
      <div class="h-prod">${esc(P.produto || 'Plano Dental Empresarial')}</div>
      ${P.empresaNome ? `<div class="h-emp">${esc(P.empresaNome)}${P.cnpj ? ' · CNPJ ' + esc(P.cnpj) : ''}</div>` : ''}
      ${P.seguradora ? `<div class="h-seg">🦷 ${esc(P.seguradora)}${P.plano ? ` · plano ${esc(P.plano)}` : ''}</div>` : ''}
      ${P.validade ? `<div class="validade${vencida ? ' vencida' : ''}">${vencida ? '⚠ Proposta vencida em' : '⏳ Válida até'} ${esc(P.validade)}${vencida ? ' — fale com o corretor para revalidar' : ''}</div>` : ''}
    </div></div>

    <div class="corpo">

      <div class="card custo">
        <div class="rot" style="color:#0f766e;">Custo por colaborador</div>
        <div class="valorao">${fmt(valorVida)} <small>por vida / mês</small></div>
        <div class="sub" style="color:#0f766e;">
          ${vidas ? `Preço já apurado para <strong>${vidas.toLocaleString('pt-BR')} vidas</strong>.` : ''}
          ${P.plano ? ` Plano <strong>${esc(P.plano)}</strong>.` : ''}
        </div>
        ${valorVida > 0 ? `<div class="por-dia">Menos de ${fmt(Math.ceil(valorVida / 30 * 100) / 100)} por dia por colaborador — cabe no cafezinho e resolve dor de dente.</div>` : ''}
        ${mensal > 0 ? `<div class="total-mes"><span>Total mensal da empresa${vidas ? ` (${vidas.toLocaleString('pt-BR')} vidas)` : ''}</span><b>${fmt(mensal)}</b></div>` : ''}
        ${anual > 0 ? `<div class="sub" style="color:#0f766e; margin-top:8px;">Equivale a ${fmt(anual)} no ano.</div>` : ''}
        <div class="grade">
          ${vidas ? `<div class="mini"><b>Vidas</b><span>${vidas.toLocaleString('pt-BR')}</span></div>` : ''}
          ${P.adesao ? `<div class="mini"><b>Adesão</b><span style="font-size:13px;">${esc(P.adesao)}</span></div>` : ''}
          ${P.abrangencia ? `<div class="mini"><b>Abrangência</b><span style="font-size:13px;">${esc(P.abrangencia)}</span></div>` : ''}
          ${P.numero ? `<div class="mini"><b>Cotação</b><span style="font-size:13px;">${esc(P.numero)}</span></div>` : ''}
        </div>
      </div>

      ${procs.length ? `<div class="card">
        <div class="rot">O que está coberto</div>
        <div class="sub" style="margin-top:-6px; margin-bottom:6px;">Procedimentos incluídos no plano cotado, sem custo adicional na rede credenciada${P.coparticipacao && /sem copart/i.test(P.coparticipacao) ? ' — e sem coparticipação' : ''}.</div>
        ${procs.map(c => {
          const d = c.descricao || descrever(c.nome || '');
          return `<div class="proc">
            <div class="proc-ic">✓</div>
            <div class="proc-tx"><b>${esc(c.nome || '')}</b>${d ? `<i>${esc(d)}</i>` : ''}</div>
          </div>`;
        }).join('')}
      </div>` : ''}

      ${faixas.length > 1 ? `<div class="card">
        <div class="rot">Como o preço acompanha o time</div>
        <div class="sub" style="margin-top:-6px; margin-bottom:12px;">Quanto mais colaboradores no plano, menor o valor por vida. Se a empresa crescer, o preço acompanha.</div>
        ${faixas.map(f => {
          const atual = vidas && vidas >= (f.de || 0) && vidas <= (f.ate || 1e9);
          return `<div class="fx${atual ? ' atual' : ''}">
            <b>${Number(f.de).toLocaleString('pt-BR')} a ${Number(f.ate).toLocaleString('pt-BR')} vidas${atual ? '<span class="selo-at">sua faixa</span>' : ''}</b>
            <span>${f.valor ? fmt(f.valor) : '—'}</span>
          </div>`;
        }).join('')}
      </div>` : ''}

      ${regras.length ? `<div class="card">
        <div class="rot">Como este plano funciona</div>
        ${regras.map(([t, v]) => `<div class="info-linha"><b>${esc(t)}</b><span>${esc(v)}</span></div>`).join('')}
      </div>` : ''}

      <div class="card">
        <div class="aviso">
          Este documento é um <strong>resumo da cotação</strong> para facilitar sua leitura. Coberturas, carências e condições
          valem conforme o contrato e as condições gerais do plano. A implantação está sujeita ao envio da documentação
          e à confirmação do número final de vidas.
        </div>
        <div class="acoes">
          <button class="btn btn-ok" onclick="abrirModal('contratar')">✓ Quero contratar</button>
          <button class="btn btn-2" onclick="baixarPDF()">📄 Baixar esta proposta em PDF</button>
          <button class="btn btn-2" onclick="abrirModal('duvida')">Tenho uma dúvida</button>
        </div>
      </div>

      <div class="rodape">
        ${P.corretorNome ? `Seu corretor: <strong>${esc(P.corretorNome)}</strong><br>` : ''}
        Retorno Administradora e Corretora de Seguros
      </div>
    </div>`;
  registrar('abriu');
}

/* ---- PDF ---- */
function baixarPDF() {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) return alert('Biblioteca de PDF não carregou. Recarregue a página.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 16; let y = 0;
    const sa = s => String(s == null ? '' : s).replace(/[""]/g, '"').replace(/[–—]/g, '-')
      .normalize('NFD').replace(/[̀-ͯ]/g, '');

    const vidas = Number(P.vidas || 0);
    const valorVida = Number(P.valorVida || 0);
    const mensal = Number(P.mensalidade || (vidas * valorVida) || 0);

    doc.setFillColor(4, 35, 31); doc.rect(0, 0, W, 52, 'F');
    doc.setFillColor(15, 118, 110); doc.circle(W - 18, 8, 26, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(9); doc.setFont(undefined, 'normal');
    doc.text('RETORNO SEGUROS  ·  PROPOSTA', M, 15);
    doc.setFontSize(17); doc.setFont(undefined, 'bold');
    doc.text(doc.splitTextToSize(sa(P.produto || 'Plano Dental Empresarial'), W - M * 2 - 30), M, 26);
    doc.setFontSize(10); doc.setFont(undefined, 'normal'); doc.setTextColor(191, 230, 225);
    const sub = [];
    if (P.empresaNome) sub.push(sa(P.empresaNome));
    if (P.seguradora) sub.push(sa(P.seguradora));
    if (P.plano) sub.push('plano ' + sa(P.plano));
    doc.text(sub.join('  ·  '), M, 42);
    y = 64;

    doc.setFillColor(240, 253, 250); doc.roundedRect(M, y - 8, W - M * 2, 34, 2, 2, 'F');
    doc.setTextColor(15, 118, 110); doc.setFontSize(8.5); doc.setFont(undefined, 'bold');
    doc.text('CUSTO POR COLABORADOR', M + 5, y);
    doc.setTextColor(6, 95, 70); doc.setFontSize(20); doc.setFont(undefined, 'bold');
    doc.text(fmt(valorVida) + ' / vida / mes', M + 5, y + 10);
    doc.setFontSize(9); doc.setFont(undefined, 'normal'); doc.setTextColor(15, 118, 110);
    const det = [];
    if (vidas) det.push(vidas.toLocaleString('pt-BR') + ' vidas');
    if (mensal) det.push('total mensal ' + fmt(mensal));
    if (mensal) det.push('no ano ' + fmt(mensal * 12));
    doc.text(det.join('  ·  '), M + 5, y + 18);
    y += 36;

    const linha = (rot, val) => {
      if (!val) return;
      if (y > 272) { doc.addPage(); y = M + 6; }
      doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
      doc.text(sa(rot), M, y);
      doc.setTextColor(15, 23, 42); doc.setFont(undefined, 'bold');
      const l = doc.splitTextToSize(sa(val), W - M * 2 - 46);
      doc.text(l, M + 46, y);
      y += Math.max(5.6, l.length * 4.6);
    };
    linha('Adesao', P.adesao);
    linha('Custeio', P.custeio);
    linha('Rede credenciada', P.redeCredenciada);
    linha('Abrangencia', P.abrangencia);
    linha('Coparticipacao', P.coparticipacao);
    linha('Reembolso', P.reembolso);
    linha('Carencia', P.carencia);
    linha('Vigencia', P.vigenciaMeses ? P.vigenciaMeses + ' meses' : (P.vigenciaInicio || ''));
    linha('Validade da proposta', P.validade);
    linha('Cotacao', P.numero);
    y += 5;

    const procs = (P.procedimentos || P.coberturas || []).map(c => typeof c === 'string' ? { nome: c } : c);
    if (procs.length) {
      if (y > 240) { doc.addPage(); y = M + 6; }
      doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
      doc.text('O que esta coberto', M, y); y += 8;
      procs.forEach(c => {
        if (y > 262) { doc.addPage(); y = M + 6; }
        doc.setFontSize(9.5); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 118, 110);
        const ln = doc.splitTextToSize('- ' + sa(c.nome || ''), W - M * 2);
        doc.text(ln, M, y); y += ln.length * 4.4;
        const d = c.descricao || descrever(c.nome || '');
        if (d) {
          doc.setFontSize(8); doc.setFont(undefined, 'normal'); doc.setTextColor(100, 116, 139);
          const ld = doc.splitTextToSize(sa(d), W - M * 2 - 4);
          if (y + ld.length * 3.7 > 275) { doc.addPage(); y = M + 6; }
          doc.text(ld, M + 4, y); y += ld.length * 3.7;
        }
        y += 3;
      });
    }

    const faixas = (P.faixas || []).slice().sort((a, b) => (a.de || 0) - (b.de || 0));
    if (faixas.length > 1) {
      if (y > 240) { doc.addPage(); y = M + 6; }
      y += 3;
      doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
      doc.text('Valor por faixa de vidas', M, y); y += 7;
      doc.setFontSize(9); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      faixas.forEach(f => {
        if (y > 275) { doc.addPage(); y = M + 6; }
        doc.text(`${f.de} a ${f.ate} vidas`, M, y);
        doc.text(f.valor ? fmt(f.valor) : '-', W - M, y, { align: 'right' });
        y += 5.2;
      });
    }

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'normal');
      doc.text('Resumo da cotacao. Coberturas, carencias e condicoes conforme o contrato e as condicoes gerais do plano.', M, 288);
      doc.text(`${i}/${n}`, W - M, 288, { align: 'right' });
    }

    const nomeArq = 'proposta-dental-' + (P.empresaNome || 'empresa').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '.pdf';
    doc.save(nomeArq);
    registrar('pdf');
  } catch (e) { alert('Nao consegui gerar o PDF: ' + e.message); }
}
window.baixarPDF = baixarPDF;

/* ---- interesse ---- */
let acaoAtual = null;
let duvidaTipo = null;
function abrirModal(tipo) {
  acaoAtual = tipo;
  duvidaTipo = null;
  if (tipo === 'contratar') {
    $('mTit').textContent = 'Quero contratar';
    $('mTxt').textContent = 'Perfeito! Deixe seu contato que o corretor dá sequência na implantação e na coleta dos dados dos colaboradores.';
    $('mOpcoes').style.display = 'none';
    $('mForm').style.display = 'block';
    $('modal').classList.add('on');
    setTimeout(() => $('mNome').focus(), 120);
    return;
  }
  $('mTit').textContent = 'O que ficou em aberto?';
  $('mTxt').textContent = '';
  $('mOpcoes').style.display = 'block';
  $('mForm').style.display = 'none';
  $('modal').classList.add('on');
}
window.abrirModal = abrirModal;

const RESPOSTAS_DUVIDA = {
  valor: 'Entendido. No dental costuma haver caminho: mudar o desenho do custeio (empresa, colaborador ou dividido) ou ajustar a forma de adesão muda bastante o valor por vida. Deixe seu contato que o corretor te mostra as alternativas.',
  rede: 'Boa pergunta — rede é o que decide se o plano é usado ou não. O corretor levanta os credenciados nas cidades onde você tem gente e te manda a lista antes de qualquer assinatura. Deixe seu contato:',
  adesao: 'Faz sentido decidir junto. Use o botão "Baixar em PDF" para levar a proposta à conversa com o RH ou a diretoria — e, se ajudar, o corretor participa para responder as perguntas técnicas. Deixe seu contato:',
  comparar: 'Ótimo sinal. Uma dica do ofício: compare rede credenciada, carências e o rol de procedimentos, não só o valor por vida. Um plano barato com rede fraca vira reclamação no RH. O corretor monta o comparativo lado a lado se você quiser. Deixe seu contato:',
  outra: 'Conte o que ficou em aberto — o corretor responde em seguida.'
};
function escolherDuvida(tp) {
  duvidaTipo = tp;
  $('mTxt').textContent = RESPOSTAS_DUVIDA[tp] || RESPOSTAS_DUVIDA.outra;
  $('mOpcoes').style.display = 'none';
  $('mForm').style.display = 'block';
  setTimeout(() => $('mNome').focus(), 120);
}
window.escolherDuvida = escolherDuvida;
function fecharModal() { $('modal').classList.remove('on'); }
window.fecharModal = fecharModal;

$('mOk').onclick = async () => {
  const nome = $('mNome').value.trim();
  if (!nome) return $('mNome').focus();
  $('mOk').disabled = true; $('mOk').textContent = 'Enviando…';
  await registrar(acaoAtual, { nome, telefone: $('mTel').value.trim(), mensagem: $('mMsg').value.trim(), tipoDuvida: duvidaTipo || null });
  $('modal').innerHTML = `<div class="modal-cx" style="text-align:center;">
      <div style="font-size:48px;">✅</div>
      <div style="font-size:19px; font-weight:800; margin:10px 0 6px;">Recebemos!</div>
      <div style="font-size:14px; color:#475569; line-height:1.6;">O corretor foi avisado e entra em contato em breve.</div>
      <button class="btn btn-2" style="margin-top:18px;" onclick="fecharModal()">Fechar</button>
    </div>`;
};

async function registrar(tipo, dados) {
  try {
    if (!DOC_ID) return;
    const upd = {
      ultimaVisita: firebase.firestore.FieldValue.serverTimestamp(),
      eventos: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString(), ...(dados || {}) })
    };
    if (tipo !== 'abriu') { upd.interesse = tipo; upd.contatoCliente = dados || null; }
    else upd.aberta = true;
    await db.collection('mb_propostas').doc(DOC_ID).set(upd, { merge: true });
  } catch (e) { console.warn('registrar', e); }
}

function erro(t, m) {
  $('app').innerHTML = `<div class="erro"><div style="font-size:42px;">🔒</div><h2>${t}</h2><p>${m}</p></div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  /* usa a sessão já existente se houver (ex.: corretor logado no painel) — não a substitui; só entra anônimo se ninguém estiver logado */
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (!token) return erro('Link inválido', 'Peça ao seu corretor o link correto da proposta.');
  try {
    const snap = await db.collection('mb_propostas').where('token', '==', token).limit(1).get();
    if (snap.empty) return erro('Proposta não encontrada', 'O link pode ter expirado. Fale com o seu corretor.');
    DOC_ID = snap.docs[0].id;
    P = snap.docs[0].data();
    render();
  } catch (e) {
    console.error(e);
    erro('Não consegui carregar', 'Tente novamente em instantes ou fale com o seu corretor.');
  }
});
</script>
