/* ─── UTIL ─── */
const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const brl2 = n => 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }
function tela(html, longa) { TELAS++; cta(null); document.body.classList.toggle('longa', !!longa); palco.innerHTML = `<div class="cena">${html}</div>`; window.scrollTo(0, 0); }
function cta(btn) { const c = $('cta'); document.body.classList.toggle('cta-on', !!btn); if (!btn) { c.innerHTML = ''; return; }
  c.innerHTML = `<div class="ctafixa"><div style="width:100%; max-width:440px;"><button class="btn btn-ouro" id="ctaBt">${btn.t}</button>${btn.sub ? `<div class="cont">${btn.sub}</div>` : ''}</div></div>`; $('ctaBt').onclick = btn.f; }
function passos(k) { return `<div class="passo-n">${[0, 1, 2, 3, 4, 5, 6].map(i => `<i class="${i < k ? 'ok' : i === k ? 'at' : ''}"></i>`).join('')}</div>`; }
let _ecoT = null;
function eco(txt) { const e = $('eco'); if (!txt) return; clearTimeout(_ecoT);
  const ms = Math.min(9000, Math.max(3800, txt.replace(/<[^>]+>/g, '').length * 55));
  e.innerHTML = txt + `<i style="animation:ecoBar ${ms}ms linear forwards;"></i>`; e.classList.add('on'); e.onclick = () => e.classList.remove('on');
  _ecoT = setTimeout(() => e.classList.remove('on'), ms); }
let _jaDigitou = false;
async function digitar(el, html) {
  if (_jaDigitou) { el.innerHTML = html; return; }
  _jaDigitou = true; let pular = false; const sk = () => { pular = true; }; window.addEventListener('pointerdown', sk);
  let buf = ''; outer: for (const p of html.split(/(<[^>]+>)/g).filter(Boolean)) {
    if (p.startsWith('<')) { buf += p; continue; }
    for (const ch of p) { if (pular) break outer; buf += ch; el.innerHTML = buf + '<span class="cursor"></span>'; await espera('.!?'.includes(ch) ? 110 : ',;:'.includes(ch) ? 45 : 13); }
  }
  window.removeEventListener('pointerdown', sk); el.innerHTML = html;
}
function umClique(campo, opcoes, cls) {
  return `<div class="opcoes ${cls || 'lista'}" data-campo="${campo}">${opcoes.map((o, k) => `<button class="op ${(RESP[campo] || {}).valor === o.v ? 'sel' : ''}" data-k="${k}">${o.t}${o.d ? `<small>${o.d}</small>` : ''}</button>`).join('')}</div>`;
}
function ligarClique(campo, opcoes, prox, ecoFn) {
  palco.querySelectorAll(`[data-campo="${campo}"] .op`).forEach(b => b.onclick = async () => {
    const o = opcoes[Number(b.dataset.k)]; palco.querySelectorAll(`[data-campo="${campo}"] .op`).forEach(x => x.classList.toggle('sel', x === b));
    RESP[campo] = { valor: o.v, texto: o.t }; salvar();
    await espera(260); const t = ecoFn ? ecoFn(o) : null; if (t) eco(t); prox();
  });
}
const v = c => (RESP[c] || {}).valor;

/* ══════════ 0 · ABERTURA ══════════ */

    <div class="titulo">O benefício que o time <em>mais valoriza</em> — montado do jeito da sua empresa.</div>
    <div class="corpo" id="corpo"></div>

  await digitar($('corpo'), 'Um plano empresarial não é um pacote fechado: ele é montado em <strong>quatro escolhas</strong> — o que cobre, onde o colaborador fica internado, se tem coparticipação e quem entra. Cada uma muda o custo e a experiência do time' + emp + '.<br><br>Em poucas telas você vê as quatro, entende <strong>como funciona o reembolso</strong> — que existe em todos os planos, com cobertura nacional — e conhece as regras antes de qualquer número.');

    rede: 'Anotado. No questionário você informa as cidades do time, e o estudo confere a rede nelas.', reembolso: 'Então a tela do reembolso vai ser a mais útil: ali você vê quanto volta em cada nível.' })[o.v] || null);

/* ══════════ 2 · OS QUATRO BOTÕES ══════════ */
function renderBotao(i) {
  const B = BOTOES_SAUDE[i]; if (!B) return renderReembolso();
  if (B.id === 'copart' && v('scSeg') === 'hospitalar') { RESP.scCopart = { valor: 'sem', texto: 'Sem coparticipação (só hospitalar)' }; salvar(); return renderBotao(i + 1); }
  progresso(24 + i * 11);
  const campo = 'sc' + B.id.charAt(0).toUpperCase() + B.id.slice(1);
  tela(`${passos(1 + i)}<div class="rotulo">Escolha ${i + 1} de 4 · ${B.n}</div><div class="titulo">${B.q.replace(' ou ', ' <em>ou</em> ')}</div>
    <div class="duas">${B.ops.map((o, k) => `<button class="card-op ${v(campo) === o.v ? 'sel' : ''}" data-k="${k}"><span class="ct">${o.t}</span><span class="cd">${o.d}</span><span class="cx">${o.x}</span><span class="cs">${v(campo) === o.v ? '✓ escolhido' : 'Escolher'}</span></button>`).join('')}</div>
    ${B.id === 'copart' ? `<div class="fold" id="fold"><div class="fold-h">Ver os tetos por procedimento ›</div><div class="fold-b"><table class="tt">${COPART_TETOS.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>
      <div class="nota">O teto exato depende do nível do plano. ${COPART_ISENTOS} A cobrança vem depois, descontada pela empresa — nada é pago no balcão.</div></div></div>` : ''}
    <div class="pular"><a id="naosei">Ainda não sei — quero que a Retorno recomende</a></div>`, true);
  if ($('fold')) $('fold').querySelector('.fold-h').onclick = () => $('fold').classList.toggle('aberta');
  const escolher = (val, txt) => { RESP[campo] = { valor: val, texto: txt }; salvar(); };
  palco.querySelectorAll('.card-op').forEach(b => b.onclick = async () => { const o = B.ops[Number(b.dataset.k)];
    palco.querySelectorAll('.card-op').forEach(x => { x.classList.toggle('sel', x === b); x.querySelector('.cs').textContent = x === b ? '✓ escolhido' : 'Escolher'; });
    escolher(o.v, o.t); await espera(420);
    const e = ecoBotao(B.id, o.v); if (e) eco(e); renderBotao(i + 1); });
  $('naosei').onclick = () => { escolher('recomendar', 'Recomendação da Retorno'); renderBotao(i + 1); };
}
function ecoBotao(id, val) {
  if (id === 'seg' && val === 'hospitalar') return 'No só hospitalar, não existe coparticipação — então pulo essa escolha.';
  if (id === 'copart' && val === 'com') return 'Boa para o reajuste: com coparticipação, o grupo usa com mais critério — e o <b>teto por procedimento</b> protege o colaborador.';
  if (id === 'adesao' && val === 'compulsorio') return 'Compulsório: <b>todo elegível entra</b> — e o contrato prevê desconto por isso. Grupo inteiro também dilui o risco, o que ajuda no reajuste.';
  if (id === 'adesao' && val === 'opcional' && v('scPorte') === '3_29') return 'No opcional e com menos de 30 vidas, cada adesão passa pela declaração de saúde.';
  return null;
}

    <div class="nv-nome" id="nvNome"></div>
    <div class="reemb" id="reemb"></div>

    $('reemb').innerHTML = REEMB_EX.map(r => { const max = r.v['10x'], w = Math.max(3, Math.round(r.v[NIVEL] / max * 100));
      return `<div class="rb"><div class="rb-t"><span>${r.ic} ${r.n}</span><b>até ${brl2(r.v[NIVEL])}</b></div><div class="rb-b"><i style="width:${w}%"></i></div></div>`; }).join('');
  };

  $('opsNv').querySelectorAll('[data-e]').forEach(b => b.onclick = async () => { const e = b.dataset.e;
    $('opsNv').querySelectorAll('.op').forEach(x => x.classList.toggle('sel', x === b));
    RESP.scReembolso = { valor: e, texto: b.firstChild.textContent }; salvar(); await espera(300);
    if (e === 'alto' && v('scAcom') === 'enfermaria') eco('Atenção: os níveis altos de reembolso existem só com <b>quarto privativo</b>. O estudo mostra as duas combinações.');
    renderRegras(); });

    ${REGRAS_SAUDE.map(([ic, t, x]) => `<div class="regra"><span class="ic">${ic}</span><span><span class="t">${t}</span>${x}</span></div>`).join('')}
    <div class="pergunta">Ficou claro como funciona?</div>${umClique('scClareza', [{ v: 'claro', t: 'Ficou claro' }, { v: 'duvida', t: 'Tenho dúvidas — quero conversar' }], '')}`, true);
  ligarClique('scClareza', [{ v: 'claro', t: 'Ficou claro' }, { v: 'duvida', t: 'Tenho dúvidas — quero conversar' }], renderResultado,
    o => o.v === 'duvida' ? 'Anotado — o corretor trata das suas dúvidas antes de qualquer número.' : null);
}

/* ══════════ 5 · RESULTADO ══════════ */
const TXT = { completo: 'Completo (ambulatorial + hospitalar)', hospitalar: 'Só hospitalar', enfermaria: 'Enfermaria', quarto: 'Quarto privativo', com: 'Com coparticipação', sem: 'Sem coparticipação',
  compulsorio: 'Compulsório', opcional: 'Opcional', basico: 'Reembolso 1x a 3x', alto: 'Reembolso 4x ou mais', recomendar: 'a Retorno recomenda' };
function calcular() {
  let pts = { nao: 45, naosei: 35, sim: 12 }[v('scSituacao')] || 25;
  if (v('scSituacao') === 'sim' && ['reajuste', 'rede', 'reclamam'].includes(v('scIncomoda'))) pts += 18;
  pts += { '3_29': 4, '30_99': 8, '100_199': 12, '200_mais': 15 }[v('scPorte')] || 0;
  if (v('scAdesao') === 'opcional') pts += 8;
  const pct = Math.min(100, pts); return { pct, nivel: pct >= 65 ? 'ALTA' : pct >= 40 ? 'MODERADA' : 'CONTROLADA' };
}
function renderResultado() {
  progresso(100); clearTimeout(_ecoT); $('eco').classList.remove('on');
  const R = calcular(); RESP._vuln = { pct: R.pct, nivel: R.nivel }; salvar(true);
  const linha = (ic, rot, c) => `<div class="ln"><span>${ic} ${rot}</span><b>${esc(TXT[v(c)] || (v(c) ? (RESP[c] || {}).texto : 'a definir'))}</b></div>`;
  const cards = [];
  if (v('scSituacao') === 'nao') cards.push(['at', '🏥', '<b>Hoje o time depende do SUS ou do bolso.</b> Plano de saúde é o benefício mais pedido em entrevista de emprego — e o que mais segura talentos.']);
  if (v('scSituacao') === 'sim' && v('scIncomoda') === 'reajuste') cards.push(['at', '📈', '<b>O reajuste é o ponto.</b> Coparticipação, adesão compulsória e o nível de reembolso certo são as alavancas — o estudo mostra o efeito de cada uma.']);
  if (v('scAdesao') === 'compulsorio') cards.push(['ok', '👥', '<b>Compulsório:</b> o contrato prevê desconto da ordem de 30% por incluir todos os elegíveis.']);
  if (v('scAdesao') === 'opcional') cards.push(['at', '👥', '<b>Opcional:</b> mais liberdade, sem o desconto do compulsório — e o grupo tende a ter mais uso, o que pesa no reajuste.']);
  if (v('scPorte') && v('scPorte') !== '3_29') cards.push(['ok', '⏳', '<b>Com 30 vidas ou mais</b>, quem entra no início fica livre de carência.']);
  if (v('scReembolso') === 'alto' && v('scAcom') === 'enfermaria') cards.push(['at', '🛏️', '<b>Reembolso alto pede quarto privativo.</b> O estudo mostra as duas combinações.']);
  tela(`<div class="rotulo">O plano que você desenhou</div><div class="titulo">${LINK && LINK.empresaNome ? esc(LINK.empresaNome) + ': ' : ''}o <em>ponto de partida</em> do estudo.</div>
    <div class="resumo">${linha('🏥', 'Cobertura', 'scSeg')}${linha('🛏️', 'Acomodação', 'scAcom')}${linha('🤝', 'Coparticipação', 'scCopart')}${linha('👥', 'Adesão', 'scAdesao')}${linha('💸', 'Reembolso', 'scReembolso')}
      <div class="ln"><span>🗺️ Abrangência</span><b>Nacional</b></div></div>
    <div class="term"><div style="font-size:12px; color:var(--suave); letter-spacing:.1em; text-transform:uppercase; font-weight:700;">Exposição do time sem o plano certo</div>
      <div class="num-grande" style="color:${R.nivel === 'ALTA' ? '#f87171' : R.nivel === 'MODERADA' ? '#fbbf24' : '#34d399'};">${R.nivel}</div>
      <div class="term-barra"><div class="term-fill" id="fill"></div></div><div class="term-leg"><span>Controlada</span><span>Moderada</span><span>Alta</span></div></div>
    <div style="margin-top:16px;">${cards.map(([c, i, x]) => `<div class="card-r ${c}"><span style="font-size:18px;">${i}</span><span>${x}</span></div>`).join('')}</div>
    <div class="corpo" style="font-size:15px; margin-top:6px;">O próximo passo é <strong>montar a cotação</strong>: quantas pessoas, as idades (exatas até 18 e a partir de 59; por faixa no meio), as cidades do time e o plano atual, se houver. Leva uns 5 minutos — e não obriga nada.</div>
    <div class="acoes"><button class="btn btn-ouro" id="btSim">Montar a minha cotação →</button><button class="btn btn-2" id="btCont">Prefiro que entrem em contato</button></div>`, true);
  setTimeout(() => { const f = $('fill'); if (f) f.style.width = Math.max(8, R.pct) + '%'; }, 200);
  $('btSim').onclick = async () => { await registrarInteresse('cotar'); const tk = new URLSearchParams(location.search).get('t'); location.href = ARQ_Q + (tk ? '?t=' + encodeURIComponent(tk) : ''); };
  $('btCont').onclick = () => { registrarInteresse('contato'); renderContato(); };
}
function mascaraTel(el) { const d = el.value.replace(/\D/g, '').slice(0, 11); el.value = d.length > 7 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d.length ? `(${d}` : ''; }
window.mascaraTel = mascaraTel;
function renderContato() {
  tela(`<div class="rotulo">Contato</div><div class="titulo">Como falamos com você?</div>
    <div class="corpo" style="margin-bottom:20px;">O corretor recebe o desenho que você montou e entra em contato — sem compromisso.</div>
    <label class="lbl">Seu nome</label><input class="campo" id="cNome" placeholder="Nome completo">
    <label class="lbl">Empresa</label><input class="campo" id="cEmp" placeholder="Nome da empresa">
    <label class="lbl">Telefone / WhatsApp</label><input class="campo" id="cTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">
    <label class="lbl">E-mail (opcional)</label><input class="campo" id="cMail" type="email" placeholder="voce@empresa.com.br">
    <div class="acoes" style="margin-top:6px;"><button class="btn btn-ouro" id="ok">Pode me chamar →</button><button class="btn btn-2" id="bk">← voltar</button></div>`);
  if (LINK && LINK.empresaNome) { $('cEmp').value = LINK.empresaNome; $('cEmp').readOnly = true; $('cEmp').style.opacity = .75; }
  $('bk').onclick = renderResultado;
  $('ok').onclick = async () => { const nome = $('cNome').value.trim(); if (!nome) return $('cNome').focus();
    QRESP.contato = { nome, empresa: $('cEmp').value.trim(), telefone: $('cTel').value.trim(), email: $('cMail').value.trim() };
    $('ok').disabled = true; $('ok').textContent = 'Enviando…';
    try { await db.collection('mb_apresentacoes').doc(SESSAO).set({ questionario: { contato: QRESP.contato }, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e) {}
    tela(`<div style="text-align:center; padding:30px 0;"><div style="font-size:56px; margin-bottom:12px;">✅</div><div class="titulo">Recebido.</div><div class="corpo">O corretor já tem o seu desenho e vai falar com você. Sem compromisso.</div></div>`); };
}

/* ══════════ PERSISTÊNCIA ══════════ */
const ROTEIRO = [['scPorte', 'Vidas (colaboradores + dependentes)'], ['scSituacao', 'Tem plano hoje'], ['scIncomoda', 'O que incomoda no plano atual'], ['scSeg', 'Cobertura'], ['scAcom', 'Acomodação'],
  ['scCopart', 'Coparticipação'], ['scAdesao', 'Adesão'], ['scReembolso', 'Nível de reembolso'], ['scClareza', 'Entendeu as regras']];
function montarAnalitico(fim) { const R = calcular();
  return { esquema: 1, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao', completo: !!fim, porteCod: v('scPorte') || null, situacaoCod: v('scSituacao') || null, incomodaCod: v('scIncomoda') || null,
    segCod: v('scSeg') || null, acomCod: v('scAcom') || null, copartCod: v('scCopart') || null, adesaoCod: v('scAdesao') || null, reembolsoCod: v('scReembolso') || null, nivelVisto: RESP._nivelVisto || null,
    clarezaCod: v('scClareza') || null, vulnPct: R.pct, vulnNivel: R.nivel }; }
let _salvT = null;
function salvar(fim) { clearTimeout(_salvT); if (fim) return _gravar(true); _salvT = setTimeout(() => _gravar(false), 450); }
async function _gravar(fim) { try { if (!SESSAO) return;
  const upd = { respostas: JSON.parse(JSON.stringify(RESP)), analitico: montarAnalitico(fim), roteiroApres: ROTEIRO.map(([k, p]) => ({ k, p, r: (RESP[k] || {}).texto || null })),
    cenasVistas: TELAS, totalCenas: 10, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };
  if (fim) upd.concluiu = true;
  await db.collection('mb_apresentacoes').doc(SESSAO).set(upd, { merge: true }); } catch (e) { console.warn('salvar', e); } }
async function registrarInteresse(tipo) { try { if (!SESSAO) return;
  await db.collection('mb_apresentacoes').doc(SESSAO).set({ interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }), ultimoInteresse: tipo, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e) {} }

/* ══════════ INÍCIO ══════════ */
console.log('%cApresentação Saúde Colaboradores v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (token) SESSAO = 'saude_colab_' + token;
  else { try { SESSAO = sessionStorage.getItem('sessao_ap_saude_colab'); } catch (e) {}
    if (!SESSAO) { SESSAO = 'ap_saude_colab_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); try { sessionStorage.setItem('sessao_ap_saude_colab', SESSAO); } catch (e) {} } }
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, origem: 'apresentacao', atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) { try { let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get(); if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) { LINK = snap.docs[0].data(); base.linkId = snap.docs[0].id; base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null; base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null; base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        try { await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({ aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e2) {} } } catch (e) { console.warn('link', e); } }
  try { const d = await db.collection('mb_apresentacoes').doc(SESSAO).get(); if (!d.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    else { const r = (d.data() || {}).respostas; if (r && typeof r === 'object') RESP = Object.assign({}, r); }
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true }); } catch (e) { console.warn('sessao', e); }
  renderAbertura();
});

</script>
