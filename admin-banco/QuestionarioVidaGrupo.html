function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }

const TRI = [{ v: 'sim', t: 'Sim' }, { v: 'nao', t: 'Não' }, { v: 'naosei', t: 'Não sei' }];

function opsDe(c) { return c.tipo === 'tri' ? TRI : c.tipo === 'mes' ? MESES.map((m, i) => ({ v: String(i + 1), t: m })).concat([{ v: 'naosei', t: 'Não sei' }]) : (c.opcoes || []); }

function htmlCampo(c, a) {

    const val = v == null || v === 'naosei' ? '' : c.tipo === 'moeda' ? brl(v) : c.tipo === 'numero' ? Number(v).toLocaleString('pt-BR') : v;
    corpo = `<div class="ent-linha"><input class="ent" data-in="${c.id}" ${c.tipo !== 'texto' ? 'inputmode="numeric"' : ''} placeholder="${esc(c.ph || '')}" value="${esc(val)}" autocomplete="off">
      ${c.naosei ? `<button class="op leve ${v === 'naosei' ? 'sel' : ''}" data-ns="${c.id}" type="button" style="margin-top:6px;">Não sei</button>` : ''}</div>`;
  } else {

    corpo = `<div class="ops ${c.col ? 'col' : ''}">${opsDe(c).map(o => `<button class="op ${sel(o.v) ? 'sel' : ''}" data-op="${c.id}" data-v="${esc(o.v)}" type="button">${o.t}${o.d ? `<small>${o.d}</small>` : ''}</button>`).join('')}</div>`;
  }
  return `<div class="campo-bx" data-campo="${c.id}">${lb}${corpo}<div data-ins="${c.id}"></div></div>`;
}
function pagina(cfg) {
  const a = cfg.alvo, campos = cfg.campos;
  palco.innerHTML = `<div class="cena">${cfg.trilha ? trilha(cfg.trilha) : ''}${cfg.voltar ? `<button class="voltar" id="pgVoltar">← ${cfg.voltarTxt || 'voltar'}</button>` : ''}

      if (o && o.excl) arr = arr.includes(val) ? [] : [val]; else { arr = arr.filter(x => !(opsDe(c).find(y => y.v === x) || {}).excl); arr = arr.includes(val) ? arr.filter(x => x !== val) : arr.concat(val); }
      a[c.id] = arr; palco.querySelectorAll(`[data-op="${c.id}"]`).forEach(x => x.classList.toggle('sel', arr.includes(x.dataset.v)));
    } else { a[c.id] = val; palco.querySelectorAll(`[data-op="${c.id}"]`).forEach(x => x.classList.toggle('sel', x === b)); }

function addAtividade(o) { if (!S.atividades.find(x => x.descricao === o.descricao)) S.atividades.push(o); }
const STOP = { de: 1, da: 1, do: 1, das: 1, dos: 1, em: 1, no: 1, na: 1, nos: 1, nas: 1, com: 1, sem: 1, para: 1, por: 1, que: 1, uma: 1, um: 1, ao: 1, aos: 1, ou: 1, meu: 1, minha: 1, nosso: 1, nossa: 1, empresa: 1, loja: 0.4, comercio: 0.4, servico: 0.4, servicos: 0.4, industria: 0.4, fabrica: 0.4 };
function buscarAtividades(txt) {
  const todos = norm(txt).split(/\s+/).filter(x => x.length > 1);
  const q = todos.filter(x => STOP[x] !== 1); if (!q.length) return [];
  const forte = q.filter(t => STOP[t] === undefined);
  const casa = (d, bonus) => { let s = 0, ini = 0, fortesOk = 0;
    q.forEach(t => { const peso = STOP[t] || 1;
      if (new RegExp('(^|[^a-z0-9])' + t.replace(/[^a-z0-9]/g, '')).test(d)) { s += (d.startsWith(t) ? 3 : 2) * peso; ini++; if (peso === 1) fortesOk++; }
      else if (d.includes(t)) s += 0.5 * peso; });
    if (!ini) return 0;
    if (forte.length && !fortesOk) return 0;
    return s + (bonus || 0) * (fortesOk / (forte.length || 1)); };
  const out = [];
  RUBRICAS.forEach(r => { const s = casa(norm(r.descricao), 1); if (s) out.push({ s, o: { codigo: r.codigo, descricao: r.descricao, fonte: 'seguradora' } }); });
  SINON.forEach(sn => { const s = casa(norm(sn.t), 1.5); if (!s) return;
    sn.c.forEach((cod, i) => { const r = RUBRICAS.find(x => x.codigo === cod); if (r && !out.find(x => x.o.codigo === cod)) out.push({ s: s - i * 0.1, o: { codigo: r.codigo, descricao: r.descricao, fonte: 'seguradora' } }); }); });
  EXTRAS.forEach(e => { const s = casa(norm(e.d), 0.8); if (s && e.s !== undefined) { const r = e.s ? RUBRICAS.find(x => x.codigo === e.s) : null;

  out.sort((a, b) => b.s - a.s || a.o.descricao.length - b.o.descricao.length);

/* ══════════ 6 · COBERTURAS E VALORES ══════════ */

function capGlobalFunc() { const i = capInd(), n = Number(S.pes.nFunc) || 0; return i && n ? i * n : null; }

function unidades() { const tot = ETAPAS.length + 1; let ok = ETAPAS.indexOf(S.pos.etapa); ok = ok < 0 ? (S.pos.etapa === 'fim' ? tot : 0) : ok; if (S.enviado) ok = tot; return { ok: Math.max(1, ok), tot }; }

  } catch (e) { console.warn('salvar', e); } }

/* ══════════ RETOMADA ══════════ */
function retomar() { const p = S.pos || {}; if (S.enviado || p.etapa === 'fim') return renderFim();
  ({ empresa: renderEmpresa, atividade: renderAtividade, modalidade: renderModalidade, pessoas: renderPessoas, situacao: renderSituacao, coberturas: renderCoberturas, capital: renderCapital, revisao: renderRevisao }[p.etapa] || renderAbertura)(); }
function renderRetomar() { const u = unidades(); progresso(u.ok / u.tot * 100); barra(null);
  palco.innerHTML = `<div class="cena"><div class="rotulo">Cotação em andamento</div><div class="titulo">Bem-vindo de volta${S.emp.nome ? ', ' + esc(S.emp.nome) : ''}.</div>

document.addEventListener('DOMContentLoaded', async () => {

      if (!snap.empty) { LINK = snap.docs[0].data(); base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null; base.destinatario = LINK.destinatario || null; base.agenciaId = LINK.agenciaId || null;
