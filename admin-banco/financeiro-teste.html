: \"titular\" },\n        { \"codigo\": \"21\", \"tipo\": \"clinicas e hospitais\", \"nome\": \"CLINICA EXEMPLO LTDA\",\n          \"cpfCnpj\": \"33.444.555/0001-66\", \"valorPago\": 9800.00, \"beneficiario\": \"PEDRO MODELO\" }\n      ],\n      \"doacoes\": { \"efetuadas\": [], \"partidosPoliticos\": [] },\n      \"dividas\": { \"total\": 362000.00, \"itens\": [\n          { \"codigo\": \"11\", \"discriminacao\": \"Financiamento imobiliario\", \"credor\": \"BANCO EXEMPLO S.A.\",\n            \"cnpjCpf\": \"60.746.948/0001-12\", \"valorAnterior\": 410000.00, \"valorAtual\": 362000.00,\n            \"valorPagoNoAno\": 48000.00 } ] },\n      \"resumo\": {\n        \"rendimentosTributaveisTotal\": 542004.00,\n        \"deducoes\": { \"previdenciaOficial\": 10800.00, \"previdenciaComplementar\": 24000.00, \"dependentes\": 2275.08,\n                      \"instrucao\": 3561.50, \"despesasMedicas\": 48200.00, \"total\": 88836.58 },\n        \"baseCalculo\": 453167.42, \"impostoDevido\": 97374.74, \"impostoDevidoFinal\": 97374.74,\n        \"aliquotaEfetiva\": 17.96, \"impostoPagoTotal\": 127670.36, \"impostoARestituir\": 30295.62,\n        \"impostoAPagar\": 0, \"modelo\": \"deducoes legais\" },\n      \"evolucaoPatrimonial\": { \"bensAnterior\": 6880220.00, \"bensAtual\": 7420118.44,\n        \"dividasAnterior\": 410000.00, \"dividasAtual\": 362000.00,\n        \"rendimentosIsentosTotal\": 1198440.55, \"rendimentosExclusivosTotal\": 282330.18 },\n      \"segurosEPrevidencia\": [\n        { \"tipo\": \"PGBL\", \"instituicao\": \"PREVIDENCIA EXEMPLO S.A.\", \"cnpj\": \"22.333.444/0001-55\",\n          \"valor\": 24000.00, \"ondeApareceu\": \"pagamentos 36\" },\n        { \"tipo\": \"VGBL\", \"instituicao\": \"PREVIDENCIA EXEMPLO S.A.\", \"cnpj\": \"22.333.444/0001-55\",\n          \"valor\": 310000.00, \"ondeApareceu\": \"bens 99/06\" }\n      ],\n      \"fonte\": \"2025 - JOAO MODELO.DEC.pdf · 24 paginas\",\n      \"parte\": \"1/1\",\n      \"bens\": {\n        \"itens\": [\n          { \"numeroBem\": 1, \"grupo\": \"01\", \"codigo\": \"12\", \"tipoImovel\": \"casa\",\n            \"discriminacao\": \"Casa residencial adquirida em 1998, quitada, de uso proprio.\",\n            \"pais\": \"Brasil\", \"pertenceA\": \"titular\", \"areaM2\": 320, \"matricula\": \"44.221\",\n            \"endereco\": { \"logradouro\": \"Rua das Acacias\", \"numero\": \"455\", \"bairro\": \"Centro\", \"municipio\": \"Caxias do Sul\", \"uf\": \"RS\", \"cep\": \"95020-000\" },\n            \"dataAquisicao\": \"1998-09-30\", \"situacao\": \"quitado\",\n            \"valorAnterior\": 480000.00, \"valorAtual\": 480000.00 },\n          { \"numeroBem\": 2, \"grupo\": \"03\", \"codigo\": \"02\",\n            \"discriminacao\": \"Quotas de capital da sociedade empresaria limitada.\",\n            \"pais\": \"Brasil\", \"pertenceA\": \"titular\", \"cnpj\": \"12.345.678/0001-90\",\n            \"empresa\": \"INDUSTRIA MODELO S.A.\", \"percentual\": 52, \"quantidade\": 9360000,\n            \"valorAnterior\": 5200000.00, \"valorAtual\": 5610000.00 },\n          { \"numeroBem\": 3, \"grupo\": \"06\", \"codigo\": \"01\",\n            \"discriminacao\": \"Saldo em conta corrente em 31/12.\",\n            \"pais\": \"Brasil\", \"pertenceA\": \"titular\", \"cnpj\": \"60.746.948/0001-12\",\n            \"banco\": \"BANCO EXEMPLO S.A.\", \"agencia\": \"1234\", \"conta\": \"56789-0\",\n            \"valorAnterior\": 188220.00, \"valorAtual\": 220118.44 },\n          { \"numeroBem\": 4, \"grupo\": \"99\", \"codigo\": \"06\",\n            \"discriminacao\": \"Plano VGBL contratado em 2016.\",\n            \"pais\": \"Brasil\", \"pertenceA\": \"titular\", \"cnpj\": \"22.333.444/0001-55\",\n            \"instituicao\": \"PREVIDENCIA EXEMPLO S.A.\",\n            \"valorAnterior\": 280000.00, \"valorAtual\": 310000.00 }\n        ],\n        \"totais\": { \"bensAnterior\": 6880220.00, \"bensAtual\": 7420118.44 }\n      }\n    }\n  ],\n  \"duvidas\": [\n    \"Na ficha de bens do item 7 o valor da coluna de 31/12/2023 veio cortado; deixei o campo fora.\",\n    \"A ficha DOACOES EFETUADAS veio como Sem Informacoes e foi entregue vazia.\"\n  ]\n}\n```\n\n## Antes de fechar\n\n- Cada sócio tem `identificacao` com CPF e `anoCalendario`.\n- `rendimentosTrabalho` tem uma fonte por CNPJ, e o `total` é o impresso na ficha.\n- A linha 09 dos isentos está aberta por fonte; as linhas 10 e 06 dos exclusivos também.\n- `pagamentos` traz os códigos como impressos, com o 26 e o 36 separados dos demais.\n- `resumo.deducoes` está preenchido e `modelo` diz completo ou simplificado.\n- `bens` é o último bloco do sócio; `grupo` é 01–09 ou 99 em todos os itens; o número da coluna BEM\n  está em `numeroBem`.\n- Nenhuma `discriminacao` passa de 300 caracteres nem contém endereço, CNPJ, banco, área, matrícula\n  ou o começo da ficha seguinte.\n- Ficha \"Sem Informações\" entregue vazia; ficha não lida dita em `duvidas`.\n- Nenhuma transcrição de página, nenhuma soma sua, nenhum número cortado.\n- Se dividiu, `parte` está preenchida e `duvidas` diz o que vem na próxima parte.\n",
  "parecer": "# Parecer — leitor do resumo que o sistema calculou\n\nVocê é o redator do parecer. Dos seis leitores, é o único que escreve texto: os outros transcrevem\ndocumentos, você transforma em palavras o que o sistema já apurou. Quem lê o resultado são duas\npessoas — o corretor, que vai conduzir a conversa com a empresa, e o empresário, que vai receber\numa carta depois da visita.\n\nAbaixo deste texto vem o **RESUMO DO SISTEMA**: os números, os indicadores, os cenários, os achados\ndas apólices e as lacunas que o sistema calculou e conferiu. **Você não recebe documentos e não\ncalcula nada.** Nem uma soma, nem um arredondamento, nem uma projeção. Todo valor, percentual ou\nprazo que você escrever tem que estar no resumo, escrito do mesmo jeito que está lá.\n\nIsso não é recomendação de estilo: o sistema confere cada número do seu texto contra o resumo,\nnúmero a número. O que não encontrar aparece na tela com a frase inteira em que você escreveu, e o\nbotão de gravar muda para \"Gravar mesmo assim\". Um número a mais custa a confiança no parecer\ninteiro — inclusive nos que estavam certos.\n\n## A ordem dos blocos\n\n1. `resumoExecutivo`\n2. `pontosFortes`\n3. `alertas`\n4. `pontosDeAtencao`\n5. `roteiro`\n6. `perguntas`\n7. `cartaCliente`\n\nA carta vem por último porque é o texto mais longo e o único que sai da empresa. Se o espaço\nacabar, o que falta é a carta — que pode ser pedida de novo sozinha —, e não o roteiro, que é o que\no corretor leva na visita de amanhã.\n\n## As regras que o sistema confere\n\n**Só números do resumo, escritos igual.** R$ 631.326 continua R$ 631.326; não vira \"R$ 0,6 milhão\"\nnem \"cerca de 630 mil\". A tolerância da conferência é mínima, e a reescrita do número é lida como\nnúmero novo. Não some dois valores do resumo para criar um terceiro.\n\n**Nada que o resumo não diga.** Nenhum fato novo sobre a empresa, o setor, a economia, a\nconcorrência ou a legislação. Se faltar uma informação para o parecer ficar de pé, ela vira\npergunta em `perguntas` — não vira suposição no meio do texto.\n\n**Hipótese é hipótese.** Margem fora do padrão, elo que não fecha entre balanço e DRE, salto de\nestoque: tudo isso se escreve como possibilidade e pergunta — \"vale entender\", \"pode indicar\",\n\"convém conferir\" —, nunca como conclusão sobre a gestão. A empresa cresceu menos que o setor não é\nacusação: é a pergunta \"o setor cresceu mais que vocês, o que travou?\". E quando a diferença pode\nter nascido de um erro de leitura do próprio sistema, ela é tarefa de conferência, não achado.\n\n**Premissa é dita como premissa.** Quando o resumo marcar um número como premissa do sistema, a sua\nfrase carrega a palavra: \"por premissa do sistema\". Premissa apresentada como dado é a maneira mais\nrápida de perder uma reunião, porque o contador do cliente pergunta de onde saiu o número.\n\n**Sem promessa.** Nenhum preço de seguro, taxa, aprovação de crédito ou economia que o resumo não\ntraga. Cenário é cenário: \"se acontecesse\", nunca \"vai acontecer\".\n\n**Nada de números inventados para arredondar a frase.** Contagens, dias e anos o sistema ignora na\nconferência; valores, percentuais e múltiplos, não.\n\nPortuguês do Brasil, frases curtas, sem markdown dentro dos textos — o conteúdo dos campos é\nimpresso como está, inclusive no PDF que vai para o cliente.\n\n## `resumoExecutivo`\n\nAté cinco linhas: quem é a empresa, como ela está — com dois ou três números do resumo — e o que\nmais importa proteger. É o texto que o corretor lê no carro, antes de entrar. Sem adjetivo que o\nresumo não sustente.\n\n## `pontosFortes`\n\nDe dois a quatro itens, cada um com o número que o sustenta. Ponto forte sem número é elogio, e\nelogio não abre conversa. Se o resumo não trouxer nenhum número favorável, entregue a lista com o\nque houver — lista curta é honesta.\n\n## `alertas`\n\nDe três a seis, em ordem de importância:\n`{\"nivel\": \"critico|atencao|oportunidade\", \"titulo\": \"\", \"oque\": \"\", \"porque\": \"\", \"acao\": \"\"}`.\n\n- `oque` é o fato, com o número do resumo.\n- `porque` é o que aquilo significa para o caixa ou para o lucro — **só se o resumo disser**.\n- `acao` é o passo concreto, sem prometer preço nem resultado.\n\nUse os cenários \"se acontecesse\" e os achados das apólices que o resumo traz. Quando o alerta\nnascer de um cenário, escreva no condicional: o cenário é uma conta de impacto, não uma previsão.\n\n## `pontosDeAtencao`\n\nDe dois a cinco: `{\"titulo\": \"\", \"oque\": \"\", \"porque\": \"\", \"pergunta\": \"\"}`. A `pergunta` é o que\ntransforma o achado em conversa — é a frase que o corretor usa para abrir o assunto sem acusar\nninguém. Todo ponto de atenção tem uma.\n\n## `roteiro`\n\nDe quatro a sete passos, na ordem em que a conversa deve acontecer:\n`{\"passo\": \"\", \"oque\": \"\", \"frase\": \"\"}`. `oque` é o que mostrar, com o número. `frase` é uma frase\npronta, natural, do jeito que uma pessoa fala — não um texto de folheto, e sem nome de produto onde\nnão é preciso. O roteiro é a parte mais usada do parecer: é o que fica aberto na mesa.\n\n## `perguntas`\n\n`{\"pergunta\": \"\", \"porque\": \"\"}`. Use as lacunas que o resumo lista: cada campo que falta derruba um\nindicador ou um produto, e o `porque` explica isso em uma linha. É o que faz o cliente mandar o\ndocumento — ninguém manda nota explicativa sem saber para que serve.\n\n## `cartaCliente`\n\nAté vinte linhas, escritas **para o empresário**, para enviar depois da visita.\n\n- **Nunca mencione o banco, a agência, o gerente ou quem indicou a conversa.** O sistema procura as\n  palavras \"gerente\" e \"agência\" no texto e avisa quando encontra. A carta é de consultor para\n  empresário, e o caminho até a mesa não interessa a quem recebe.\n- Tom respeitoso e direto, **sem jargão de seguro e sem pressão**.\n- Conteúdo: o que se viu, os dois ou três riscos que mais pesam no caixa e no lucro, com os números\n  dos cenários do resumo, e o próximo passo proposto.\n- Assinatura genérica: **\"Equipe de consultoria.\"**\n- Encerramento obrigatório, com estas palavras: **\"Análise feita a partir das demonstrações e\n  documentos fornecidos — não substitui parecer contábil ou jurídico.\"**\n\nQuando o resumo trouxer dado pessoal de sócio, ele não entra na carta. Dado de pessoa física só se\nusa na conversa com o próprio sócio.\n\n## O arquivo\n\n```json\n{\n  \"tipo\": \"parecer\",\n  \"formato\": \"corporate-one-parecer\",\n  \"versao\": 1,\n  \"empresa\": { \"razaoSocial\": \"INDUSTRIA MODELO S.A.\", \"cnpj\": \"12.345.678/0001-90\" },\n  \"resumoDe\": \"2026-10-28\",\n  \"parecer\": {\n    \"resumoExecutivo\": \"A Industria Modelo fechou 2025 com receita liquida de R$ 71.432.769,20 e lucro liquido de R$ 3.221.515,88. A divida bruta e de R$ 17.675.555,22, com 42% vencendo em 12 meses. O patrimonio imobilizado declarado e de R$ 38.220.445,80 e a apolice patrimonial cobre R$ 28.000.000,00. A empresa depende de dois socios administradores, e o contrato social manda pagar haveres em 24 parcelas.\",\n    \"pontosFortes\": [\n      \"Patrimonio liquido de R$ 29.973.647,89, acima da divida bruta de R$ 17.675.555,22.\",\n      \"Receita liquida cresceu de R$ 63.888.116,80 em 2024 para R$ 71.432.769,20 em 2025.\",\n      \"A empresa mantem plano de saude e odontologico para os 318 funcionarios.\"\n    ],\n    \"alertas\": [\n      { \"nivel\": \"critico\",\n        \"titulo\": \"O limite da apolice patrimonial e menor que o imobilizado declarado\",\n        \"oque\": \"A apolice cobre R$ 28.000.000,00 e o imobilizado do balanco e de R$ 38.220.445,80.\",\n        \"porque\": \"A clausula de rateio da apolice reduz a indenizacao quando a importancia segurada fica abaixo do valor em risco.\",\n        \"acao\": \"Pedir a relacao de bens que serviu de base para a importancia segurada e comparar com a nota 9 do balanco.\" },\n      { \"nivel\": \"atencao\",\n        \"titulo\": \"Lucros cessantes com limite de R$ 200.000,00\",\n        \"oque\": \"A cobertura de lucros cessantes tem limite de R$ 200.000,00 e periodo indenitario de 6 meses.\",\n        \"porque\": \"O resumo calcula que uma parada de 60 dias levaria R$ 1.880.000,00 de margem de contribuicao.\",\n        \"acao\": \"Rever o limite junto com a area financeira, usando o faturamento medio mensal do proprio balanco.\" },\n      { \"nivel\": \"oportunidade\",\n        \"titulo\": \"120 vidas seguradas para 318 funcionarios\",\n        \"oque\": \"A apolice de vida em grupo cobre 120 vidas e a empresa declarou 318 funcionarios em 2025.\",\n        \"porque\": \"O resumo nao diz por que a diferenca existe.\",\n        \"acao\": \"Perguntar quais grupos estao fora da apolice e por que.\" }\n    ],\n    \"pontosDeAtencao\": [\n      { \"titulo\": \"Concentracao em um cliente\",\n        \"oque\": \"A nota 4 informa que o maior cliente responde por 18% da receita.\",\n        \"porque\": \"O resumo nao traz o prazo do contrato com esse cliente.\",\n        \"pergunta\": \"Como esta hoje a relacao com o maior cliente, e ate quando vai o contrato?\" },\n      { \"titulo\": \"Aval prestado a coligada\",\n        \"oque\": \"O balanco registra R$ 4.500.000,00 em avais prestados.\",\n        \"porque\": \"Aval prestado nao aparece na divida da empresa, mas responde por ela se a coligada parar.\",\n        \"pergunta\": \"Esse aval foi dado em que operacao, e ele ainda esta vigente?\" }\n    ],\n    \"roteiro\": [\n      { \"passo\": \"Abrir pelo que a empresa fez bem\",\n        \"oque\": \"O crescimento da receita liquida de R$ 63.888.116,80 para R$ 71.432.769,20.\",\n        \"frase\": \"Antes de falar de risco, voces cresceram quase 12% num ano em que o setor nao cresceu tanto. Como foi isso?\" },\n      { \"passo\": \"Mostrar a diferenca entre o patrimonio e a apolice\",\n        \"oque\": \"R$ 38.220.445,80 de imobilizado contra R$ 28.000.000,00 de limite.\",\n        \"frase\": \"Olhando a nota 9 do balanco de voces e a apolice lado a lado, aparece uma diferenca. Vale entender de onde ela vem.\" },\n      { \"passo\": \"Trazer a conta da parada\",\n        \"oque\": \"Os R$ 1.880.000,00 de margem em 60 dias, contra o limite de R$ 200.000,00.\",\n        \"frase\": \"Se a fabrica parasse dois meses, a conta que o sistema faz e essa. O seguro de hoje cobre uma parte dela.\" },\n      { \"passo\": \"Falar da sucessao sem drama\",\n        \"oque\": \"O contrato manda apurar haveres pelo valor patrimonial e pagar em 24 parcelas.\",\n        \"frase\": \"A clausula decima segunda do contrato de voces ja resolve o como. O que ela nao resolve e de onde sai o dinheiro.\" },\n      { \"passo\": \"Fechar pedindo o que falta\",\n        \"oque\": \"A nota explicativa de 2023 e a relacao de bens da apolice.\",\n        \"frase\": \"Com esses dois documentos eu fecho a analise e volto com numero, nao com estimativa.\" }\n    ],\n    \"perguntas\": [\n      { \"pergunta\": \"Qual foi a relacao de bens usada para definir a importancia segurada da apolice patrimonial?\",\n        \"porque\": \"Sem ela nao da para saber se a diferenca para o imobilizado e de criterio contabil ou de cobertura.\" },\n      { \"pergunta\": \"A empresa tem contrato de prestacao de servico com o poder publico?\",\n        \"porque\": \"O resumo nao traz essa informacao, e ela define se existe exigencia de seguro garantia.\" }\n    ],\n    \"cartaCliente\": \"Prezados,\\n\\nObrigado pelo tempo e pelos documentos.\\n\\nLemos as demonstracoes de 2023, 2024 e 2025 e as apolices em vigor. A empresa chega a 2025 com receita liquida de R$ 71.432.769,20 e lucro liquido de R$ 3.221.515,88, crescendo em relacao ao ano anterior e com patrimonio liquido maior que a divida. Isso e um bom ponto de partida.\\n\\nTres pontos nos chamaram a atencao.\\n\\nO primeiro e a diferenca entre o imobilizado registrado no balanco, de R$ 38.220.445,80, e o limite da apolice patrimonial, de R$ 28.000.000,00. A apolice tem clausula de rateio, o que significa indenizacao proporcional em caso de sinistro. Vale conferir qual relacao de bens foi usada quando o seguro foi contratado.\\n\\nO segundo e a cobertura de lucros cessantes, hoje em R$ 200.000,00. Pelos numeros do proprio balanco, dois meses de parada representariam R$ 1.880.000,00 de margem. Nao estamos dizendo que vai acontecer; estamos dizendo qual seria a conta.\\n\\nO terceiro e a sucessao. O contrato social preve pagamento de haveres em 24 parcelas, o que transforma um evento pessoal em uma despesa que atravessa dois exercicios da empresa.\\n\\nO proximo passo que propomos e simples: uma reuniao de uma hora com a area financeira para conferir esses tres pontos com os documentos na mesa.\\n\\nEquipe de consultoria.\\n\\nAnalise feita a partir das demonstracoes e documentos fornecidos - nao substitui parecer contabil ou juridico.\"\n  }\n}\n```\n\n## Antes de fechar\n\n- Cada número do texto existe no resumo e está escrito do mesmo jeito.\n- Nenhum fato que o resumo não traga; o que falta virou pergunta.\n- Toda distorção está escrita como hipótese e tem uma pergunta junto.\n- Todo número que o resumo marca como premissa aparece com a palavra \"premissa\".\n- Nenhum preço, taxa, aprovação ou economia prometida; cenário escrito no condicional.\n- A `cartaCliente` não contém \"gerente\" nem \"agência\", está assinada como \"Equipe de consultoria\" e\n  termina com a frase obrigatória.\n- Nenhum dado pessoal de sócio na carta.\n- Sem markdown dentro dos textos.\n",

/* ===========================================================================
   CAMADA 4 — O DOSSIÊ
   Junta num objeto só tudo que as análises precisam: o exercício mais
   recente, o anterior, a série inteira, os indicadores, o cadastro da
   empresa e os documentos lidos.

   Existe para que nenhuma análise precise saber de onde o dado veio nem
   repetir a conta de "qual é o ano mais recente que não está vazio".
   =========================================================================== */
window.CO = window.CO || {};

CO.dossie = (function () {
  'use strict';
  const B = CO.base, E = CO.exercicio;

  function montar(registros, empresa, documentos) {
    const exs = (registros || [])
      .map(r => (r && r.doc) ? r : E.doBanco(r))
      .filter(ex => ex.ano && !CO.modelo.vazio({ ...ex.doc, ...ex.calc }))
      .sort((a, b) => a.ano - b.ano);

    for (const ex of exs) {
      if (!ex.indicadores) {
        CO.derivar.tudo(ex);
        CO.indicadores.aplicarPisoEbitda(ex);
        ex.indicadores = CO.indicadores.calcular(ex);
      }
    }

    const atual = exs[exs.length - 1] || null;
    const anterior = exs[exs.length - 2] || null;
    const emp = empresa || {};

    const d = {
      exercicios: exs,
      atual, anterior,
      ind: atual ? atual.indicadores : {},
      anos: exs.map(e => e.ano),
      empresa: emp,
      documentos: documentos || {},
      /* leitura direta do exercício mais recente */
      n: campo => atual ? E.n(atual, campo) : null,
      tem: campo => atual ? E.n(atual, campo) !== null : false,
      /* o mesmo campo no ano anterior, para variação */
      ant: campo => anterior ? E.n(anterior, campo) : null,
      /* série de um campo, ano a ano */
      serie: campo => exs.map(e => ({ ano: e.ano, valor: E.n(e, campo) })),
      travas: atual ? CO.travas.conferir(atual) : null
    };

    /* números que quase toda análise usa */
    d.R = d.n('receitaLiquida') ?? d.n('receitaBruta');
    d.PL = d.n('patrimonioLiquido');
    d.DB = d.n('dividaBruta');
    d.DL = d.n('dividaLiquida');
    d.EBITDA = d.n('ebitda');
    d.EBIT = d.n('ebit');
    d.LAIR = d.n('lucroAntesIR');
    d.LL = d.n('lucroLiquido');
    d.F = d.n('funcionarios') ?? B.inteiro(emp.qtdFuncionarios ?? emp.funcionarios, 1, 300000);
    d.S = Math.max(1, d.n('qtdSocios') ?? ((emp.socios || []).length || 1));
    d.Folha = d.n('folhaAnual');
    d.Encargos = d.n('encargosFolha');
    d.Premio = d.n('premioSegurosAno');
    d.lucroReal = /real/i.test(String(d.n('regimeTributario') || emp.regimeTributario || ''));

    /* salário médio: da folha, ou estimado pelos salários a pagar — e sempre
       marcado quando estimado, porque RC Empregador construído sobre
       estimativa não pode parecer medido */
    if (d.Folha > 0 && d.F > 0) { d.salarioMedio = d.Folha / d.F / 13; d.salarioEstimado = false; }
    else if (d.n('salariosPagar') > 0 && d.F > 0) { d.salarioMedio = d.n('salariosPagar') / d.F; d.salarioEstimado = true; }
    else { d.salarioMedio = null; d.salarioEstimado = false; }

    /* valor em risco patrimonial: os veículos ficam de fora de propósito —
       vão para frota, e mostrar o mesmo bem em dois LMIs confunde */
    const linhas = ['valorImoveis', 'valorInstalacoes', 'valorMaquinas', 'valorInformatica',
      'valorFerramentas', 'valorMoveis', 'valorSoftware', 'obrasAndamento'];
    const somaLinhas = atual ? E.somar(atual, linhas) : null;
    const imob = d.n('imobilizado');
    const demais = (imob !== null && somaLinhas !== null && imob > somaLinhas) ? imob - somaLinhas : null;
    d.valorEmRisco = B.soma(somaLinhas ?? imob, demais, d.n('estoques'));
    d.demaisBens = demais;

    return d;
  }

  return { montar };
})();

/* ===========================================================================
   CAMADA 4 — O MAPA DE PRODUTOS
   Cada regra é uma linha: quando aparece, que número mostra, com que
   prioridade e com que frase. Lista declarativa de propósito — dá para ler a
   regra inteira sem seguir código, e acrescentar produto é acrescentar item.

   Duas regras de postura valem para o arquivo todo:

   · EXPOSIÇÃO É RISCO DESCOBERTO, NÃO PRÊMIO. O número ao lado do produto é
     o que está em jogo, não o que se vai cobrar.
   · EXPOSIÇÕES NÃO SE SOMAM. Patrimônio em risco, indenização por vítima e
     capital por sócio são grandezas diferentes; somar daria um número grande
     e sem significado. O motor devolve a MAIOR isolada. (No sistema antigo o
     cabeçalho somava assim mesmo — é a contradição 10.1 do livro de regras.)
   =========================================================================== */
window.CO = window.CO || {};

CO.produtos = (function () {
  'use strict';
  const B = CO.base, P = CO.P;
  const R$ = B.dinheiro, pct = B.pct;

  /* Cada regra: ramo, título, quando aparece, e o que mostrar. */
  const REGRAS = [

    /* ---------------- vida e pessoas ---------------- */
    {
      id: 'vida-socios', ramo: 'Vida e pessoas', titulo: 'Vida dos sócios / Pessoa-chave',
      quando: d => (d.PL > 0 || d.DL > 0 || d.EBITDA > 0) && d.S >= 1,
      monta: d => {
        const haveres = d.PL > 0 ? d.PL / d.S : 0;
        const dividaPorSocio = d.DL > 0 ? d.DL / d.S : 0;
        let numero = Math.max(haveres, dividaPorSocio), rotulo = 'capital por sócio';
        if (!(numero > 0) && d.EBITDA > 0) { numero = d.EBITDA * P.multiploEbitdaValuation / d.S; rotulo = 'capital por sócio (por múltiplo de EBITDA)'; }
        const temDivida = d.DL > 0;
        const sobreDivida = temDivida
          ? ` — e não suspende o vencimento da dívida de ${R$(d.DL)}`
          : (d.DL !== null ? `. A empresa tem caixa líquido de ${R$(-d.DL)}, mas caixa paga haveres saindo do giro` : '');
        return {
          numero, rotulo,
          prioridade: (temDivida && d.DL > d.PL) ? 'alta' : 'media',
          porque: `Com ${d.S} sócio(s) e patrimônio líquido de ${R$(d.PL)}, a morte de um deles gera obrigação imediata de haveres aos herdeiros${sobreDivida}. Capital de ${R$(numero)} por sócio paga os haveres sem tirar dinheiro do giro e mantém a empresa na mão de quem ficou.`,
          acao: 'conferir no contrato social o critério de apuração de haveres e o prazo de pagamento'
        };
      }
    },
    {
      id: 'rc-empregador', ramo: 'Responsabilidade', titulo: 'RC Geral — Empregador',
      quando: d => d.salarioMedio > 0 && d.F > 0,
      monta: d => {
        const pensao = d.salarioMedio * (2 / 3) * 13 * P.anosPensaoRCEmpregador;
        const numero = pensao + P.danoMoralRCEmpregador;
        return {
          numero, rotulo: 'indenização por vítima',
          prioridade: (d.F >= 50 && !d.salarioEstimado) ? 'alta' : 'media',
          porque: `Com ${B.qtd(d.F)} funcionários e salário médio de ${R$(d.salarioMedio)}, um acidente fatal gera ação cível contra a empresa. O INSS paga o benefício previdenciário; a indenização civil é por fora: ${R$(pensao)} de pensão (${P.anosPensaoRCEmpregador} anos) mais ${R$(P.danoMoralRCEmpregador)} de dano moral. LMI abaixo de ${R$(numero)} deixa a diferença no caixa da empresa — e com mais de uma vítima no mesmo evento, multiplique.`,
          ressalva: d.salarioEstimado ? 'salário médio estimado pelos salários a pagar do balanço, porque a folha anual não foi informada' : null,
          acao: 'pedir o LMI atual de RC Empregador e comparar'
        };
      }
    },
    {
      id: 'vida-grupo', ramo: 'Vida e pessoas', titulo: 'Vida em grupo (equipe)',
      quando: d => d.Folha > 0 && d.F > 0,
      monta: d => ({
        numero: d.Folha * 0.10, rotulo: 'exposição estimada',
        prioridade: 'media',
        porque: `Folha de ${R$(d.Folha)} e ${B.qtd(d.F)} funcionários. Muita convenção coletiva já obriga o seguro de vida em grupo; sem apólice, a empresa paga a indenização da convenção do próprio bolso. Capital usual de referência: ${P.capitalVidaEmGrupo}× o salário, ${R$(d.salarioMedio * P.capitalVidaEmGrupo)} por vida.`,
        acao: 'conferir a convenção do sindicato antes — costuma ser obrigação, não escolha'
      })
    },
    {
      id: 'saude', ramo: 'Benefícios', titulo: 'Saúde — colaboradores',
      quando: d => d.Folha > 0 && d.F > 0,
      monta: d => {

        return {

            : `${B.qtd(d.F)} vidas a ${R$(P.ticketSaude)} por mês dão ${R$(custo)} por ano. Aqui o argumento é retenção, não imposto: o custo por vida é menor do que repor um funcionário treinado.`,
          acao: d.lucroReal ? 'levar a conta do custo líquido depois do imposto' : 'comparar com o custo de reposição de pessoal'
        };
      }
    },
    {
      id: 'dental-giro', ramo: 'Benefícios', titulo: 'Dental — rotatividade',
      quando: d => d.Folha > 0 && d.F > 0 && d.n('rescisoes') > 0 && (d.n('rescisoes') / d.Folha) > P.giroAltoFolha,
      monta: d => {
        const custoGiro = B.soma(d.n('rescisoes'), d.n('admissoes'));
