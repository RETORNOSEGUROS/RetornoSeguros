        return {
          numero: custoGiro, rotulo: 'custo anual da rotatividade',
          prioridade: 'alta',
          porque: `A empresa já gasta ${R$(custoGiro)} por ano trocando de gente (${pct(d.n('rescisoes') / d.Folha)} da folha só em rescisões). Benefício não é despesa nova: é parte desse dinheiro, gasto antes, para a pessoa ficar. O dental custa ${R$(dental)} — ${pct(dental / custoGiro)} do que já sai em rescisão e admissão.`,
          acao: 'propor dental e vida em grupo como retenção, com a conta do giro ao lado'
        };
      }
    },

    /* ---------------- patrimonial ---------------- */
    {
      id: 'patrimonial-subseguro', ramo: 'Patrimonial', titulo: 'Patrimonial — indício de subseguro',
      quando: d => d.valorEmRisco > 0 && d.Premio > 0 && d.Premio < P.taxaPremioPatrimonial * d.valorEmRisco * P.pisoSubseguro,
      monta: d => ({
        numero: d.valorEmRisco, rotulo: 'valor em risco',
        prioridade: 'alta',
        porque: `A empresa paga ${R$(d.Premio)} por ano de prêmio para ${R$(d.valorEmRisco)} em risco. O esperado seria da ordem de ${R$(d.valorEmRisco * P.taxaPremioPatrimonial)} (${pct(P.taxaPremioPatrimonial, 2)} do valor em risco). Pagar menos da metade costuma significar LMI antigo, bem fora da apólice ou rateio na hora do sinistro.`,
        acao: 'pedir a apólice e conferir o LMI contra o valor em risco'
      })
    },
    {
      id: 'patrimonial-lmi', ramo: 'Patrimonial', titulo: 'Patrimonial — conferir o LMI',
      quando: d => d.valorEmRisco > 0,
      excluiSe: ['patrimonial-subseguro'],
      monta: d => ({
        numero: d.valorEmRisco, rotulo: 'valor em risco (contábil)',
        prioridade: d.Premio > 0 ? 'baixa' : 'media',
        porque: `Imobilizado e estoques somam ${R$(d.valorEmRisco)} pelo balanço${d.demaisBens > 0 ? `, incluindo ${R$(d.demaisBens)} em bens que a nota não abre por linha` : ''}. O balanço mostra o valor contábil; o seguro precisa do valor de reposição, que costuma ser maior.`,
        acao: 'comparar o LMI com este número e pedir o estoque de pico do ano'
      })
    },
    {
      id: 'patrimonial-onerado', ramo: 'Patrimonial', titulo: 'Patrimonial — bem dado em garantia',
      quando: d => d.n('bensEmGarantia') > 0,
      monta: d => {
        const onerado = d.n('bensEmGarantia');
        const imob = d.n('imobilizado');
        return {
          numero: onerado, rotulo: 'bens onerados',
          prioridade: 'alta',
          porque: `${R$(onerado)} em bens estão alienados, hipotecados ou empenhados${imob > 0 ? ` — ${pct(onerado / imob)} do imobilizado` : ''}. O contrato obriga a segurar o bem e a nomear o credor como beneficiário. Apólice no nome só da empresa, LMI abaixo do saldo devedor ou apólice vencida colocam a empresa em descumprimento, e a maioria desses contratos permite vencimento antecipado.`,
          acao: 'é a conferência que mais acha erro — e o erro não aparece até o sinistro'
        };
      }
    },
    {
      id: 'engenharia', ramo: 'Patrimonial', titulo: 'Equipamentos / Riscos de engenharia',
      quando: d => d.n('valorMaquinas') > P.pisoMaquinasEngenharia,
      monta: d => ({
        numero: d.n('valorMaquinas'), rotulo: 'máquinas e equipamentos',
        prioridade: 'media',
        porque: `${R$(d.n('valorMaquinas'))} em máquinas. Incêndio a apólice patrimonial cobre; quebra interna, não. Parada de máquina em indústria para a receita.`,
        acao: 'verificar se há cobertura de quebra de máquinas e lucros cessantes atrelada'
      })
    },
    {
      id: 'frota', ramo: 'Frota', titulo: 'Frota',
      quando: d => d.n('valorVeiculos') > 0,
      monta: d => ({
        numero: d.n('valorVeiculos'), rotulo: 'veículos no imobilizado',
        prioridade: 'media',
        porque: `${R$(d.n('valorVeiculos'))} em veículos no nome da empresa. Isso traz RC do empregador junto: o motorista é preposto. O risco maior não é o carro, é a terceira pessoa.`,
        acao: 'conferir RCF-V com LMI compatível com o patrimônio da empresa'
      })
    },
    {
      id: 'lucros-cessantes', ramo: 'Patrimonial', titulo: 'Lucros cessantes',
      quando: d => d.EBITDA > 0,
      monta: d => {
        const base = d.LAIR > 0 ? d.LAIR : d.EBITDA;
        const fixas = d.n('despesasFixas') ?? (d.n('despesasAdm') > 0 ? d.n('despesasAdm') * P.fracaoDespesasFixas : 0);
        const numero = (base + fixas) / 2;   // seis meses
        return {
          numero, rotulo: `lucro bruto da apólice (${P.mesesLucrosCessantes} meses)`,
          prioridade: 'media',
          porque: `A patrimonial reconstrói o prédio. Ela não paga a folha nem o banco durante a obra. Base de ${R$(base)} mais ${R$(fixas)} de despesas fixas dão ${R$(numero)} por ${P.mesesLucrosCessantes} meses. Sem lucros cessantes, o sinistro grande vira problema de caixa mesmo com a indenização paga.`,
          acao: 'definir o período indenitário conforme o tempo real de reconstrução'
        };
      }
    },

    /* ---------------- garantia e crédito ---------------- */
    {
      id: 'garantia-deposito', ramo: 'Garantia', titulo: 'Seguro garantia — trocar depósito judicial',
      quando: d => d.n('depositosJudiciais') > 0,
      monta: d => {
        const dep = d.n('depositosJudiciais');
        const oportunidade = dep * P.custoOportunidadeCaixa;
        const premio = dep * P.taxaPremioGarantia;
        return {
          numero: dep, rotulo: 'caixa preso em juízo',
          prioridade: (d.R > 0 && dep > d.R * 0.01) ? 'alta' : 'media',
          porque: `${R$(dep)} estão depositados em juízo. O depósito é aceito, mas imobiliza caixa: custa ${R$(oportunidade)} por ano de oportunidade, contra ${R$(premio)} de prêmio. A garantia substitui o depósito e libera o dinheiro — ${R$(dep)} de volta ao giro e ainda ${R$(oportunidade - premio)} por ano de diferença.`,
          acao: 'levantar os processos com depósito e verificar quais aceitam substituição'
        };
      }
    },
    {
      id: 'garantia-fiscal', ramo: 'Garantia', titulo: 'Seguro garantia — execução fiscal',
      quando: d => d.n('processosTributarios') > 0,
      monta: d => ({
        numero: d.n('processosTributarios'), rotulo: 'contingência tributária',
        prioridade: 'media',
        porque: `${R$(d.n('processosTributarios'))} em discussão tributária. Execução fiscal exige garantia para discutir o débito; em dinheiro ou penhora, trava o balanço. A garantia judicial mantém o ativo livre para dar ao banco — e desde a Lei 14.689/2023 não pode ser liquidada antes do trânsito em julgado.`,
        acao: 'conferir quais execuções já estão garantidas e como'
      })
    },
    {
      id: 'garantia-fianca', ramo: 'Garantia', titulo: 'Seguro garantia — trocar fiança bancária',
      quando: d => d.n('fiancasBancarias') > 0,
      monta: d => ({
        numero: d.n('fiancasBancarias'), rotulo: 'fianças bancárias',
        prioridade: (d.R > 0 && d.n('fiancasBancarias') > d.R * P.fiancaSobreReceita) ? 'alta' : 'media',
        porque: `${R$(d.n('fiancasBancarias'))} em cartas de fiança. A fiança ocupa limite que poderia financiar operação e costuma custar mais que a apólice. Trocar devolve esse limite para a empresa usar em giro ou investimento.`,
        acao: 'pedir o custo atual da fiança para comparar com o prêmio'
      })
    },
    {
      id: 'garantia-energia', ramo: 'Garantia', titulo: 'Seguro garantia — energia no mercado livre',
      quando: d => d.n('energiaAnual') > 0,
      monta: d => ({
        numero: d.n('energiaAnual') * P.energiaGarantia, rotulo: 'garantia exigida (≈3 meses)',
        prioridade: 'media',
        porque: `${R$(d.n('energiaAnual'))} de energia no ano. Comprar no mercado livre exige garantia na câmara de comercialização; apólice no lugar de caução em dinheiro ou fiança libera limite no banco.`,
        acao: 'confirmar se a empresa está no mercado livre e qual garantia foi exigida'
      })
    },
    {
      id: 'credito-concentracao', ramo: 'Garantia', titulo: 'Concentração em um credor',
      quando: d => {
        const bancos = d.n('bancos') || (d.atual && CO.exercicio.valor(d.atual, 'bancos')) || [];
        if (!Array.isArray(bancos) || bancos.length < 2) return false;
        const saldos = bancos.map(b => B.soma(b.saldoCP, b.saldoLP, b.saldoTotal) || 0);
        const total = saldos.reduce((t, x) => t + x, 0);
        return total > 0 && Math.max(...saldos) / total > P.concentracaoCredor;
      },
      monta: d => {
        const bancos = CO.exercicio.valor(d.atual, 'bancos') || [];
        const comSaldo = bancos.map(b => ({ nome: b.banco, saldo: B.soma(b.saldoCP, b.saldoLP, b.saldoTotal) || 0 }))
          .sort((a, b) => b.saldo - a.saldo);
        const total = comSaldo.reduce((t, x) => t + x.saldo, 0);
        const maior = comSaldo[0];
        return {
          numero: maior.saldo, rotulo: `saldo em ${maior.nome}`,
          prioridade: 'media',
          porque: `${maior.nome} concentra ${pct(maior.saldo / total)} da dívida (${R$(maior.saldo)} de ${R$(total)}). Dependência de um credor tira poder de negociação e trava a empresa se aquele banco apertar o limite. Garantia em apólice libera limite ali e abre espaço para um segundo credor.`,
          acao: 'mapear que garantias estão com esse credor'
        };
      }
    },

    /* ---------------- governança ---------------- */
    {
      id: 'do-avais', ramo: 'Responsabilidade', titulo: 'D&O / governança — avais a terceiros',
      quando: d => d.n('avaisPrestados') > 0 && d.PL > 0 && d.n('avaisPrestados') > d.PL * 0.5,
      monta: d => ({
        numero: d.n('avaisPrestados'), rotulo: 'avais prestados',
        prioridade: 'media',
        porque: `${R$(d.n('avaisPrestados'))} em avais e fianças concedidos — ${pct(d.n('avaisPrestados') / d.PL)} do patrimônio líquido. Garantia dada a terceiro não aparece no passivo, mas o administrador que assinou responde. Se o avalizado não pagar, a conta chega inteira e de uma vez.`,
        acao: 'listar os avalizados e a situação de cada um'
      })
    },
    {
      id: 'do-contingencia', ramo: 'Responsabilidade', titulo: 'D&O — exposição do administrador',
      quando: d => B.soma(d.n('processosTrabalhistas'), d.n('processosTributarios'), d.n('processosCiveis'), d.n('processosAmbientais')) > 0,
      monta: d => {
        const total = B.soma(d.n('processosTrabalhistas'), d.n('processosTributarios'), d.n('processosCiveis'), d.n('processosAmbientais'));
        const possivel = d.n('passivoContingente');
        return {
          numero: B.soma(total, possivel), rotulo: 'contingência total',
          prioridade: 'media',
          porque: `${R$(total)} em processos${possivel > 0 ? ` e mais ${R$(possivel)} em contingências possíveis não provisionadas` : ''}. Na execução trabalhista, fiscal ou ambiental, a desconsideração da personalidade jurídica alcança o patrimônio pessoal de quem administra.`,
          acao: 'D&O com custos de defesa e bloqueio de bens — e conferir quem são os administradores no contrato'
        };
      }
    },

    /* ---------------- crédito ---------------- */
    {
      id: 'credito-recebiveis', ramo: 'Garantia', titulo: 'Seguro de crédito — recebíveis cedidos',
      quando: d => d.n('recebiveisCedidos') > 0,
      monta: d => ({
        numero: d.n('recebiveisCedidos'), rotulo: 'recebíveis antecipados',
        prioridade: 'media',
        porque: `${R$(d.n('recebiveisCedidos'))} em duplicatas descontadas ou antecipadas. O seguro de crédito protege a carteira que lastreia a operação e costuma melhorar a taxa da antecipação.`,
        acao: 'conferir quem é o beneficiário em caso de inadimplência do sacado'
      })
    },
    {
      id: 'previdencia-socios', ramo: 'Vida e pessoas', titulo: 'Previdência / vida dos sócios',
      quando: d => d.n('distribuicaoLucros') > 0,
      monta: d => ({
        numero: d.n('distribuicaoLucros') / d.S, rotulo: 'distribuição por sócio no ano',
        prioridade: 'media',
        porque: `${R$(d.n('distribuicaoLucros'))} distribuídos no ano, ${R$(d.n('distribuicaoLucros') / d.S)} por sócio. Lucro distribuído sai isento e costuma ficar em conta ou CDB no mesmo banco que empresta para a empresa. Previdência e vida do sócio organizam esse dinheiro fora do risco do negócio.`,
        acao: 'pedir a declaração de IR do sócio para dimensionar'
      })
    }
  ];

  /* ---------- o que NÃO recomendar agora ----------
     Protege a credibilidade: oferecer o que não cabe queima a conversa. */
  function naoAgora(d) {
    const fora = [];
    if (d.n('valorVeiculos') === null || d.n('valorVeiculos') === 0)
      fora.push({ produto: 'Frota', porque: 'não há veículos no imobilizado. Se a empresa movimenta carga com terceiros, o assunto vira RC do embarcador.' });
    if (d.F > 0 && d.F < 10)
      fora.push({ produto: 'Saúde coletivo empresarial', porque: `com ${d.F} vidas o preço por vida fica alto. Começar por vida em grupo e dental.` });
    if (d.EBITDA !== null && d.EBITDA <= 0)
      fora.push({ produto: 'Lucros cessantes', porque: 'sem EBITDA positivo não há margem a proteger — primeiro a operação precisa virar.' });
    return fora;
  }

  /* ---------- o que falta saber ----------
     Cada ausência vira pedido objetivo, nunca silêncio. */
  function perguntas(d) {
    const q = [];
    if (!(d.PL > 0)) q.push('Patrimônio líquido não veio: confirmar no balanço — é a base do capital de haveres.');
    const noContrato = (d.empresa.socios || []).length;
    const noBalanco = d.n('qtdSocios');
    if (!noBalanco && !noContrato) q.push('Número de sócios não veio: confirmar no contrato social.');
    else if (noBalanco && noContrato && noBalanco !== noContrato)
      q.push(`O balanço informa ${noBalanco} sócios e o contrato social lista ${noContrato}. O capital por sócio muda conforme a resposta — confirmar qual é a composição atual (pode haver alteração contratual posterior).`);
    if (!(d.Folha > 0) || !(d.F > 0)) q.push('Folha anual e número de funcionários: sem os dois não há RC Empregador nem vida em grupo.');
    if (d.n('imobilizado') > 0 && d.DB > 0 && !(d.n('bensEmGarantia') > 0))
      q.push('A empresa tem imobilizado e dívida, mas não sabemos o que está em garantia. A nota de empréstimos abre operação por operação e define quanto de crédito ainda cabe.');
    const bancos = d.atual ? CO.exercicio.valor(d.atual, 'bancos') : null;
    if (d.DB > 0 && (!Array.isArray(bancos) || !bancos.length)) q.push('Dívida não aberta por banco: sem isso não dá para falar de taxa, garantia nem portabilidade.');
    if (d.n('recebiveisCedidos') > 0) q.push('Recebíveis cedidos: confirmar se há seguro de crédito e quem é o beneficiário.');
    if (d.Folha > 0 && !(d.n('beneficiosAnual') > 0)) q.push('Folha lançada e nenhum benefício: giro alto sem benefício é a oportunidade mais clara que existe.');
    if (d.Folha > 0 && d.n('provisaoFerias13') > d.Folha * 0.18) q.push('Provisão de férias e 13º acima de 18% da folha: equipe no limite, e isso vira passivo de uma vez.');
    if (d.n('distribuicaoLucros') > 0 && !(d.documentos.sociosIR || []).length) q.push('Houve distribuição de lucros e não temos a declaração de IR dos sócios — é onde estão renda, patrimônio e espaço de PGBL.');
    if (d.n('energiaAnual') > 0) q.push('Confirmar se a energia é comprada no mercado livre e qual garantia a câmara exigiu.');
    return q;
  }

  /* ---------- avaliação ---------- */

  const PESO = { alta: 3, media: 2, baixa: 1 };

  function avaliar(d) {
    if (!d || !d.atual) return { itens: [], grupos: [], maior: null, urgentes: 0, naoAgora: [], perguntas: [] };

    const itens = [];
    for (const regra of REGRAS) {
      let vale;
      try { vale = !!regra.quando(d); } catch (e) { vale = false; }
      if (!vale) continue;
      if (regra.excluiSe && regra.excluiSe.some(id => itens.some(i => i.id === id))) continue;
      let corpo;
      try { corpo = regra.monta(d); } catch (e) { continue; }
      if (!corpo || corpo.numero === null || !Number.isFinite(corpo.numero)) continue;
      itens.push({ id: regra.id, ramo: regra.ramo, titulo: regra.titulo, ...corpo });
    }

    itens.sort((a, b) => (PESO[b.prioridade] - PESO[a.prioridade]) || (b.numero - a.numero));

    const grupos = [];
    for (const item of itens) {
      let g = grupos.find(x => x.ramo === item.ramo);
      if (!g) { g = { ramo: item.ramo, itens: [] }; grupos.push(g); }
      g.itens.push(item);
    }

    return {
      itens, grupos,
      /* a MAIOR isolada, nunca a soma — são grandezas diferentes */
      maior: itens.length ? itens.reduce((a, b) => (b.numero > a.numero ? b : a)) : null,
      urgentes: itens.filter(i => i.prioridade === 'alta').length,
      naoAgora: naoAgora(d),
      perguntas: perguntas(d),
      rodape: 'Os valores ao lado de cada produto são exposição — o risco que está descoberto, não o prêmio. Não se somam entre si: patrimônio em risco, indenização por vítima e capital por sócio são grandezas diferentes.'
    };
  }

  return { avaliar, REGRAS, naoAgora, perguntas, PESO };
})();


/* ===== 43-diagnostico.js ===== */
/* ===========================================================================
   CAMADA 4 — DIAGNÓSTICO
   O que a empresa é, como está e o que mudou. É a análise que sustenta todas
   as outras: se ela falhar, o resto não vale nada (a regra 2 do dono).

   Duas posturas comandam este arquivo:

   · AUSENTE NÃO PONTUA. O score só considera o indicador que existe — o
     denominador cresce com o que foi medido. Um balanço incompleto tira nota
     de ninguém: ele deixa a nota mais estreita, e a tela diz sobre quantos
     indicadores ela foi calculada.
   · DISTORÇÃO VIRA HIPÓTESE E PERGUNTA, NUNCA ACUSAÇÃO. Quando um elo entre
     balanço e DRE quebra, o sistema entrega os caminhos possíveis e a
     pergunta que separa um do outro. É o que permite levar o achado ao
     contador sem queimar a relação.
   =========================================================================== */
window.CO = window.CO || {};

CO.diagnostico = (function () {
  'use strict';
  const B = CO.base, P = CO.P;

  /* As faixas são os cortes usuais de comitê de crédito bancário brasileiro
     — não fonte acadêmica. Ficam aqui à vista para serem discutidas. */
  const FAIXAS = {
    roe: { nome: 'ROE', peso: 10, cortes: [[0.20, 10], [0.15, 8], [0.10, 6], [0.05, 4], [0, 2]], mostrar: 'pct' },
    margemEbitda: { nome: 'Margem EBITDA', peso: 10, cortes: [[0.20, 10], [0.15, 8], [0.10, 6], [0.05, 4], [0, 2]], mostrar: 'pct' },
    roa: { nome: 'ROA', peso: 10, cortes: [[0.15, 10], [0.10, 8], [0.05, 6], [0, 3]], mostrar: 'pct' },
    alavancagem: { nome: 'Dívida líquida / EBITDA', peso: 15, cortes: [[1.5, 15], [2.5, 10], [3.5, 6], [5, 3]], invertido: true, mostrar: 'x' },
    composicaoEndividamento: { nome: 'Composição do endividamento', peso: 10, cortes: [[0.30, 10], [0.50, 7], [0.70, 4]], invertido: true, mostrar: 'pct' },
    liquidezCorrente: { nome: 'Liquidez corrente', peso: 12, cortes: [[2.0, 12], [1.5, 10], [1.2, 7], [1.0, 4]], mostrar: 'x' },
    liquidezSeca: { nome: 'Liquidez seca', peso: 8, cortes: [[2.0, 8], [1.5, 6], [1.0, 4]], mostrar: 'x' },
    cicloFinanceiro: { nome: 'Ciclo financeiro', peso: 10, cortes: [[0, 10], [30, 8], [60, 5], [90, 3]], invertido: true, mostrar: 'dias' },
    giroAtivo: { nome: 'Giro do ativo', peso: 5, cortes: [[2.0, 5], [1.5, 4], [1.0, 3], [0.5, 1]], mostrar: 'x' },
    coberturaJuros: { nome: 'Cobertura de juros', peso: 10, cortes: [[5, 10], [3, 7], [2, 5], [1.5, 3], [1, 1]], mostrar: 'x' }
  };

  function pontuar(valor, faixa) {
    if (valor === null || valor === undefined || !Number.isFinite(valor)) return null;
    for (const [corte, pts] of faixa.cortes) {
      if (faixa.invertido ? valor <= corte : valor >= corte) return pts;
    }
    return 0;
  }

  const formata = (v, como) => como === 'pct' ? B.pct(v) : como === 'dias' ? B.dias(v) : B.vezesX(v);

  /* O score. Sai apenas quando não há impossibilidade e o EBITDA existe:
     nota sobre um balanço que não fecha é nota sobre um erro de leitura. */
  function score(d) {
    if (d.travas && d.travas.impossiveis.length) {
      return { valor: null, porque: 'o exercício tem inconsistência que impede a análise', impedimentos: d.travas.impossiveis };
    }
    if (!(d.EBITDA > 0)) {
      return { valor: null, porque: 'sem EBITDA não há como pontuar rentabilidade nem cobertura', impedimentos: [] };
    }
    let pontos = 0, maximo = 0;
    const linhas = [];
    for (const [chave, faixa] of Object.entries(FAIXAS)) {
      const v = d.ind[chave];
      const p = pontuar(v, faixa);
      if (p === null) { linhas.push({ nome: faixa.nome, valor: null, motivo: (d.ind._bloqueios || {})[chave] || 'não calculado' }); continue; }
      pontos += p; maximo += faixa.peso;
      linhas.push({ nome: faixa.nome, valor: v, texto: formata(v, faixa.mostrar), pontos: p, de: faixa.peso });
    }
    if (!maximo) return { valor: null, porque: 'nenhum indicador pôde ser calculado', impedimentos: [] };
    return {
      valor: Math.round(pontos / maximo * 100),
      sobre: linhas.filter(l => l.valor !== null).length,
      de: Object.keys(FAIXAS).length,
      linhas,
      nota: `calculado sobre ${linhas.filter(l => l.valor !== null).length} dos ${Object.keys(FAIXAS).length} indicadores — o que falta não tira ponto, apenas estreita a leitura`
    };
  }

  /* Variação ano a ano, só do que existe nos dois anos. */
  function trajetoria(d) {
    if (!d.anterior) return { temComparacao: false, porque: 'só há um exercício carregado — sem dois anos fechados não existe variação' };
    const campos = ['receitaLiquida', 'lucroBruto', 'ebitda', 'lucroLiquido', 'ativoTotal', 'patrimonioLiquido', 'dividaBruta', 'estoques', 'contasReceber'];
    const linhas = [];
    for (const c of campos) {
      const hoje = d.n(c), antes = d.ant(c);
      if (hoje === null || antes === null || antes === 0) continue;
      linhas.push({ campo: c, rotulo: CO.modelo.rotuloDe(c), antes, hoje, variacao: (hoje - antes) / Math.abs(antes), delta: hoje - antes });
    }
    return { temComparacao: true, de: d.anterior.ano, para: d.atual.ano, linhas };
  }

  /* Os achados: elos que quebraram. Cada um vira hipótese e pergunta — nunca
     conclusão sobre a gestão. */
  function achados(d) {
    const lista = [];
    const põe = (titulo, oQue, hipoteses, pergunta) => lista.push({ titulo, oQue, hipoteses, pergunta });

    /* receita cresce e caixa não acompanha */
    const t = trajetoria(d);
    if (t.temComparacao) {
      const rec = t.linhas.find(l => l.campo === 'receitaLiquida');
      const cr = t.linhas.find(l => l.campo === 'contasReceber');
      if (rec && cr && rec.variacao > 0.10 && cr.variacao > rec.variacao * 1.5) {
        põe('Os recebíveis cresceram muito mais que a receita',
          `receita ${B.pct(rec.variacao)} contra ${B.pct(cr.variacao)} em contas a receber`,
          ['venda nova concentrada no fim do ano, ainda dentro do prazo normal',
           'prazo concedido ao cliente aumentou — o que é financiamento da empresa ao cliente',
           'alguma carteira atrasou e ainda não foi provisionada'],
          'o prazo médio de recebimento mudou no ano? E a carteira vencida acima de 90 dias, quanto é?');
      }
      const est = t.linhas.find(l => l.campo === 'estoques');
      if (rec && est && est.variacao > 0.25 && est.variacao > rec.variacao * 2) {
        põe('O estoque cresceu bem acima da receita',
          `estoque ${B.pct(est.variacao)} contra receita ${B.pct(rec.variacao)}`,
          ['compra antecipada por preço ou por risco de desabastecimento',
           'mix novo que ainda não girou',
           'produto parado — que viraria provisão para perda'],
          'qual a idade do estoque hoje, e quanto dele tem mais de 180 dias?');
      }
    }

    /* lucro sem caixa */
    if (d.LL > 0 && d.n('caixa') !== null && d.n('caixa') < d.LL * 0.05 && d.R > 0) {
      põe('Lucro alto e caixa baixo',
        `lucro líquido de ${B.dinheiro(d.LL)} e caixa de ${B.dinheiro(d.n('caixa'))}`,
        ['o lucro foi para capital de giro (recebíveis e estoque)',
         'houve distribuição de lucros no ano',
         'houve investimento em imobilizado'],
        'o lucro do ano foi distribuído, reinvestido ou ficou preso no giro?');
    }

    /* despesa financeira alta para a dívida que aparece */
    const df = d.n('despesasFinanceiras');
    if (df > 0 && d.DB > 0) {
      const taxa = df / d.DB;
      if (taxa > 0.60) {
        põe('A despesa financeira é alta demais para a dívida registrada',
          `${B.dinheiro(df)} de despesa sobre ${B.dinheiro(d.DB)} de dívida — ${B.pct(taxa)} ao ano`,
          ['boa parte não é juro de empréstimo: pode ser desconto de duplicata, tarifa ou variação cambial',
           'a dívida média do ano foi bem maior que o saldo de 31/12',
           'há operação que não aparece no balanço (antecipação de recebível, risco sacado)'],
          'a nota de despesas financeiras abre o que é juro de empréstimo e o que é desconto de duplicata?');
      }
    }

    /* contingência relevante frente ao PL */
    const cont = B.soma(d.n('processosTrabalhistas'), d.n('processosTributarios'), d.n('processosCiveis'), d.n('processosAmbientais'));
    if (cont > 0 && d.PL > 0 && cont / d.PL > 0.20) {
      põe('A contingência pesa frente ao patrimônio',
        `${B.dinheiro(cont)} em processos contra ${B.dinheiro(d.PL)} de patrimônio líquido (${B.pct(cont / d.PL)})`,
        ['a maior parte é classificada como perda possível, não provável, e por isso não está provisionada',
         'há um caso grande que concentra o valor',
         'o valor é o pedido do autor, não a estimativa da defesa'],
        'quanto desse total o jurídico classifica como provável, e quanto já está provisionado?');
    }

    return lista;
  }

  /* O retrato em uma linha: porte e o que salta aos olhos. */
  function retrato(d) {
    const partes = [];
    if (d.R > 0) partes.push(`receita de ${B.curto(d.R)}`);
    if (d.F > 0) partes.push(`${B.qtd(d.F)} funcionários`);
    if (d.PL > 0) partes.push(`patrimônio líquido de ${B.curto(d.PL)}`);
    if (d.DL !== null) partes.push(d.DL > 0 ? `dívida líquida de ${B.curto(d.DL)}` : `caixa líquido de ${B.curto(-d.DL)}`);
    return partes.join(' · ');
  }

  function analisar(d) {
    if (!d || !d.atual) return null;
    return {
      ano: d.atual.ano,
      retrato: retrato(d),
      score: score(d),
      trajetoria: trajetoria(d),
      achados: achados(d),
      ressalvas: d.travas ? d.travas.ressalvas : [],
      impedimentos: d.travas ? d.travas.impossiveis : [],
      ausencias: d.travas ? d.travas.ausencias : []
    };
  }

  return { analisar, score, trajetoria, achados, retrato, FAIXAS };
})();


/* ===== 44-resumo.js ===== */
/* ===========================================================================
   CAMADA 4 — O RESUMO DO SISTEMA
   O texto que vai junto com o prompt do parecer. Só o que o sistema calculou
   e conferiu — nenhum número entra aqui sem ter passado pelo motor.

   É contra este texto que o parecer devolvido é conferido, número a número:
   valor que aparecer no parecer e não estiver aqui é recusado. Foi assim que
   paramos de receber parecer com número inventado.
   =========================================================================== */
window.CO = window.CO || {};

CO.resumo = (function () {
  'use strict';
  const B = CO.base, E = CO.exercicio;

  function texto(estado) {
    const d = estado.dossie;
    if (!d || !d.atual) return '(sem exercícios carregados)';
    const L = [], a = estado.analise, m = estado.mapa, c = estado.empresa || {};

    L.push(`EMPRESA: ${c.nome || '—'}${c.cnpj ? ' · CNPJ ' + B.formataCNPJ(c.cnpj) : ''}`);
    if (c.setor || c.regimeTributario) L.push(`Setor: ${c.setor || '—'} · Regime: ${c.regimeTributario || '—'}`);
    if (d.F) L.push(`Funcionários: ${B.qtd(d.F)}`);
    L.push(`Exercícios: ${d.anos.join(', ')}`);
    L.push('');

    L.push(`NÚMEROS DE ${d.atual.ano}`);
    const campos = [['Receita líquida', d.R], ['Lucro bruto', d.n('lucroBruto')], ['EBITDA', d.EBITDA],
      ['EBIT', d.EBIT], ['Lucro antes do IR', d.LAIR], ['Lucro líquido', d.LL],
      ['Ativo total', d.n('ativoTotal')], ['Ativo circulante', d.n('ativoCirculante')],
      ['Passivo circulante', d.n('passivoCirculante')], ['Patrimônio líquido', d.PL],
      ['Dívida bruta', d.DB], ['Dívida líquida', d.DL], ['Caixa e aplicações', d.n('disponiveis')],
      ['Estoques', d.n('estoques')], ['Contas a receber', d.n('contasReceber')],
      ['Imobilizado', d.n('imobilizado')], ['Despesas financeiras', d.n('despesasFinanceiras')]];
    for (const [nome, v] of campos) if (v !== null) L.push(`  ${nome}: ${B.dinheiro(v)}`);
    if (E.valor(d.atual, 'ebitdaPiso') === true) L.push('  (EBITDA é piso: igual ao EBIT, porque a DRE não abre a depreciação)');
    L.push('');

    L.push('INDICADORES');
    const ind = d.ind;
    const linhas = [['Margem bruta', 'margemBruta', 'pct'], ['Margem EBITDA', 'margemEbitda', 'pct'],
      ['Margem líquida', 'margemLiquida', 'pct'], ['ROE', 'roe', 'pct'], ['ROA', 'roa', 'pct'],
      ['Liquidez corrente', 'liquidezCorrente', 'x'], ['Liquidez seca', 'liquidezSeca', 'x'],
      ['Dívida líquida / EBITDA', 'alavancagem', 'x'], ['Cobertura de juros', 'coberturaJuros', 'x'],
      ['Ciclo financeiro', 'cicloFinanceiro', 'dias'], ['Giro do ativo', 'giroAtivo', 'x']];
    for (const [nome, chave, como] of linhas) {
      const v = ind[chave];
      if (v === null || v === undefined) { L.push(`  ${nome}: não calculado (${(ind._bloqueios || {})[chave] || 'dado ausente'})`); continue; }
      L.push(`  ${nome}: ${como === 'pct' ? B.pct(v) : como === 'dias' ? B.dias(v) : B.vezesX(v)}`);
    }
    if (a && a.score && a.score.valor !== null) L.push(`  Nota do sistema: ${a.score.valor}/100 (sobre ${a.score.sobre} de ${a.score.de} indicadores)`);
    L.push('');

    if (a && a.trajetoria.temComparacao) {
      L.push(`VARIAÇÃO DE ${a.trajetoria.de} PARA ${a.trajetoria.para}`);
      for (const l of a.trajetoria.linhas) L.push(`  ${CO.modelo.nomeCurto(l.campo)}: ${B.dinheiro(l.antes)} → ${B.dinheiro(l.hoje)} (${l.variacao >= 0 ? '+' : ''}${B.pct(l.variacao)})`);
      L.push('');
    }

    if (a && a.achados.length) {
      L.push('ACHADOS (hipóteses, não conclusões)');
      for (const x of a.achados) { L.push(`  ${x.titulo}: ${x.oQue}`); L.push(`    pergunta: ${x.pergunta}`); }
      L.push('');
    }

    if (a && a.ressalvas.length) {
      L.push('RESSALVAS');
      for (const r of a.ressalvas) L.push(`  ${r.oQue} — ${r.porque}`);
      L.push('');
    }

    if (m && m.itens.length) {
      L.push('EXPOSIÇÕES (risco descoberto, não prêmio — não se somam entre si)');
      for (const p of m.itens) L.push(`  ${p.titulo}: ${B.dinheiro(p.numero)} (${p.rotulo}) · prioridade ${p.prioridade}`);
      L.push('');
      if (m.perguntas.length) { L.push('O QUE FALTA SABER'); for (const q of m.perguntas) L.push('  ' + q); L.push(''); }
    }

    L.push('REGRAS PARA QUEM ESCREVER O PARECER');
    L.push('  - Use apenas os números acima. Qualquer valor que não esteja aqui será recusado na conferência.');
    L.push('  - Distorção vira hipótese e pergunta, nunca acusação sobre a gestão.');
    L.push('  - Premissa é sempre rotulada como premissa.');
    L.push('  - A carta ao cliente não menciona gerente de banco nem agência.');
    return L.join('\n');
  }

  /* Confere o parecer recebido contra o resumo: todo número do texto precisa
     existir aqui. */
  function conferir(textoParecer, resumoTexto) {
    const doResumo = new Set((resumoTexto.match(/\d[\d.,]*/g) || []).map(s => s.replace(/[.,]$/, '')));
    const noTexto = (textoParecer.match(/\d[\d.,]*/g) || []).map(s => s.replace(/[.,]$/, ''));
    const fora = [];
    for (const n of noTexto) {
      const limpo = n.replace(/\./g, '');
      if (limpo.length < 4) continue;                       // ano, percentual pequeno, item de lista
      if (doResumo.has(n)) continue;
      if ([...doResumo].some(r => r.replace(/\./g, '') === limpo)) continue;
      if (!fora.includes(n)) fora.push(n);
    }
    return { fora, ok: fora.length === 0 };
  }

  return { texto, conferir };
})();


/* ===== 50-dados.js ===== */
/* ===========================================================================
   CAMADA 5 — DADOS
   O único lugar do sistema que fala com o Firestore. Tudo abaixo desta
   camada é função pura; tudo acima é tela.

   A TRAVA DOS PONTOS. O dono do sistema tem uma regra que não se negocia:
   campanha e pontos conquistados não se tocam — nem para ler, nem para
   escrever, nem para recalcular. Aqui ela é estrutural: toda gravação passa
   por `semPontos()`, que remove qualquer campo de campanha antes de o dado
   sair daqui. Não é um cuidado que alguém precisa lembrar de ter; é um
   portão por onde todo update obrigatoriamente passa.

   Coleções usadas: `empresas` (cadastro) e `empresas/{id}/financeiro`
   (um documento por exercício). As mesmas do sistema atual — nada de
   migração, nada de base nova.
   =========================================================================== */
window.CO = window.CO || {};

CO.dados = (function () {
  'use strict';
  const B = CO.base;

  let db = null;

  /* Campos de campanha e pontuação. Nenhum sai daqui, em nenhuma direção. */
  const PROIBIDOS = [
    'pontos', 'pontosConquistados', 'pontuacao', 'campanha', 'campanhaPontos',
    'ranking', 'premiacao', 'metaCampanha', 'historicoPontos', 'saldoPontos'
  ];
  const ehProibido = chave => {
    const k = B.chave(chave);
    return PROIBIDOS.some(p => k === B.chave(p) || k.startsWith('pontos') || k.startsWith('campanha'));
  };

  /* O portão. Devolve uma cópia sem nenhum campo de campanha. */
  function semPontos(obj) {
    if (!obj || typeof obj !== 'object') return obj;
    const limpo = {}, removidos = [];
    for (const [k, v] of Object.entries(obj)) {
      if (ehProibido(k)) { removidos.push(k); continue; }
      limpo[k] = v;
    }
    if (removidos.length && typeof console !== 'undefined') {
      console.warn('[Corporate One] campos de campanha bloqueados na gravação:', removidos.join(', '));
    }
    return limpo;
  }

  function iniciar() {
    if (db) return db;
    if (typeof firebase === 'undefined' || typeof firebaseConfig === 'undefined') return null;
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    return db;
  }

  const pronto = () => !!(db || iniciar());

  /* ---------- leitura ---------- */

  async function listarEmpresas() {
    if (!pronto()) return [];
    const snap = await db.collection('empresas').get();
    const fora = [];
    snap.forEach(doc => {
      const e = doc.data() || {};
      fora.push({
        id: doc.id,
        nome: e.nome || e.razaoSocial || e.nomeFantasia || '(sem nome)',
        cnpj: e.cnpj || '',
        setor: e.setor || '',
        regimeTributario: e.regimeTributario || '',
        funcionarios: B.inteiro(e.qtdFuncionarios ?? e.funcionarios, 1, 300000),
        atualizadoEm: e.financeiroAtualizadoEm || e.atualizadoEm || null
      });
    });
    return fora.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  }

  async function carregarEmpresa(id) {
    if (!pronto()) return null;
    const doc = await db.collection('empresas').doc(id).get();
    if (!doc.exists) return null;
    const bruto = doc.data() || {};

    const snap = await db.collection('empresas').doc(id).collection('financeiro').get();
    const exercicios = [];
    snap.forEach(d => exercicios.push({ _id: d.id, ...(d.data() || {}) }));

    return {
      id,
      cadastro: {
        nome: bruto.nome || bruto.razaoSocial || '(sem nome)',
        cnpj: bruto.cnpj || '',
        setor: bruto.setor || '',
        regimeTributario: bruto.regimeTributario || '',
        funcionarios: B.inteiro(bruto.qtdFuncionarios ?? bruto.funcionarios, 1, 300000),
        socios: Array.isArray(bruto.socios) ? bruto.socios : (bruto.contratoSocial || {}).socios || [],
        dadosReceita: bruto.dadosReceita || null
      },
      documentos: {
        contratoSocial: bruto.contratoSocial || null,
        apolices: bruto.apolices || null,
        sociosIR: bruto.sociosIR || null,
        apresentacao: bruto.apresentacao || null,
        parecer: bruto.parecerFinal || null
      },
      exercicios: exercicios.sort((a, b) => (a.ano || 0) - (b.ano || 0)),
      cru: bruto
    };
  }

  /* ---------- gravação ---------- */

  async function gravarExercicio(empresaId, registro) {
    if (!pronto()) throw new Error('sem conexão com o banco');
    const limpo = semPontos(registro);
    const col = db.collection('empresas').doc(empresaId).collection('financeiro');
    const snap = await col.where('ano', '==', limpo.ano).get();
    if (snap.empty) {
      const ref = await col.add({ ...limpo, criadoEm: B.hoje() });
      return { id: ref.id, modo: 'criado' };
    }
    const doc = snap.docs[0];
    await col.doc(doc.id).set({ ...limpo, atualizadoEm: B.hoje() }, { merge: false });
    return { id: doc.id, modo: 'atualizado' };
  }

  async function gravarDocumento(empresaId, campo, dados) {
    if (!pronto()) throw new Error('sem conexão com o banco');
    const update = semPontos({ [campo]: dados, [campo + 'Em']: B.hoje() });
    await db.collection('empresas').doc(empresaId).update(update);
    return true;
  }

  async function apagarExercicio(empresaId, docId) {
    if (!pronto()) throw new Error('sem conexão com o banco');
    await db.collection('empresas').doc(empresaId).collection('financeiro').doc(docId).delete();
    return true;
  }

  return { iniciar, pronto, listarEmpresas, carregarEmpresa, gravarExercicio, gravarDocumento, apagarExercicio, semPontos, PROIBIDOS };
})();


/* ===== 60-ui.js ===== */
/* ===========================================================================
   CAMADA 6 — PEÇAS DE TELA
   Os blocos visuais que todas as etapas usam. É a primeira camada que conhece
   o DOM — tudo abaixo é função pura.

   Uma regra atravessa o arquivo: NÚMERO AUSENTE APARECE COMO AUSENTE, e com
   o motivo ao lado. "—" com a explicação embaixo é informação; "R$ 0" é
   mentira sobre a empresa.
   =========================================================================== */
window.CO = window.CO || {};

CO.ui = (function () {
  'use strict';
  const B = CO.base;
  const esc = B.esc;

  /* painel( rótulo, valor já formatado, nota, { destaque, premissa, motivo } ) */
  function painel(rotulo, valor, nota, o) {
    o = o || {};
    const ausente = valor === '—' || valor === null || valor === undefined;
    const notaTexto = ausente && o.motivo ? o.motivo : nota;
    return `<div class="painel${o.destaque ? ' destaque' : ''}">
      <div class="painel-rotulo">${esc(rotulo)}</div>
      <div class="painel-valor${ausente ? ' ausente' : ''}">${ausente ? '—' : esc(valor)}</div>
      ${notaTexto ? `<div class="painel-nota${o.premissa ? ' premissa' : ''}">${esc(notaTexto)}</div>` : ''}
    </div>`;
  }

  const grade = html => `<div class="grade">${html}</div>`;

  /* aviso( tipo, título, lista de linhas ) — tipos: erro, atencao, bom, neutro */
  function aviso(tipo, titulo, linhas) {
    const itens = (Array.isArray(linhas) ? linhas : [linhas]).filter(Boolean);
    if (!itens.length) return '';
    const corpo = itens.length === 1 && typeof itens[0] === 'string'
      ? `<div>${esc(itens[0])}</div>`
      : `<ul>${itens.map(l => `<li>${typeof l === 'string' ? esc(l) : l}</li>`).join('')}</ul>`;
    return `<div class="aviso ${tipo}">${titulo ? `<h4>${esc(titulo)}</h4>` : ''}${corpo}</div>`;
  }

  /* Uma impossibilidade, uma estranheza ou uma ressalva, no mesmo formato:
     o que é · por que · o que pedir. */
  function achado(x, tipo) {
    return `<li><b>${esc(x.oQue)}</b>${x.porque ? ` — ${esc(x.porque)}` : ''}${
      x.oQuePedir ? `<br><span style="color:var(--tinta-fraca)">${esc(x.oQuePedir)}</span>` : ''}</li>`;
  }
  const achados = (lista, tipo, titulo) => !lista || !lista.length ? ''
    : `<div class="aviso ${tipo}"><h4>${esc(titulo)}</h4><ul>${lista.map(x => achado(x, tipo)).join('')}</ul></div>`;

  function cartao(titulo, sub, conteudo) {
    return `<div class="cartao">${titulo ? `<h2>${esc(titulo)}</h2>` : ''}${
      sub ? `<div class="sub">${esc(sub)}</div>` : ''}${conteudo || ''}</div>`;
  }

  /* tabela( colunas, linhas ) — coluna: {t: título, n: true se numérica} */
  function tabela(colunas, linhas) {
    if (!linhas || !linhas.length) return '';
    return `<table class="dados"><thead><tr>${
      colunas.map(c => `<th${c.n ? ' class="n"' : ''}>${esc(c.t)}</th>`).join('')
    }</tr></thead><tbody>${
      linhas.map(l => `<tr${l._classe ? ` class="${l._classe}"` : ''}>${
        (l.celulas || l).map((c, i) => `<td${colunas[i] && colunas[i].n ? ' class="n"' : ''}>${c == null ? '—' : c}</td>`).join('')
      }</tr>`).join('')
    }</tbody></table>`;
  }

  const selo = (texto, classe) => `<span class="selo ${classe}">${esc(texto)}</span>`;
  const botao = (texto, acao, o) => {
    o = o || {};
    return `<button class="btn${o.principal ? ' principal' : ''}${o.pequeno ? ' pequeno' : ''}" ${
      o.desativado ? 'disabled ' : ''}onclick="${esc(acao)}">${esc(texto)}</button>`;
  };
  const acoes = html => `<div class="acoes">${html}</div>`;
  const vazio = texto => `<div class="vazio">${esc(texto)}</div>`;

  /* Um produto do mapa de seguros. */
  function produto(p) {
    return `<div class="produto ${p.prioridade}">
      <div class="produto-topo">
        <div><div class="produto-titulo">${esc(p.titulo)} ${selo(p.prioridade === 'alta' ? 'urgente' : p.prioridade, p.prioridade)}</div></div>
        <div><div class="produto-numero">${esc(B.dinheiro(p.numero))}</div>
             <div class="produto-rotulo">${esc(p.rotulo || '')}</div></div>
      </div>
      <div class="produto-porque">${esc(p.porque)}</div>
      ${p.ressalva ? `<div class="produto-porque" style="color:var(--alerta)">⚠ ${esc(p.ressalva)}</div>` : ''}
      ${p.acao ? `<div class="produto-acao">→ ${esc(p.acao)}</div>` : ''}
    </div>`;
  }

  /* Mostra um indicador com o motivo quando ele não existe. */
  function indicador(ind, chave, rotulo, como) {
    const v = ind[chave];
    const texto = v === null || v === undefined ? '—'
      : como === 'pct' ? B.pct(v) : como === 'dias' ? B.dias(v) : como === 'dinheiro' ? B.dinheiro(v) : B.vezesX(v);
    const motivo = (ind._bloqueios || {})[chave];
    const marca = (ind._marcas || {})[chave];
    return painel(rotulo, texto, marca, { motivo });
  }

  function copiar(texto, botaoEl) {
    const fim = () => { if (botaoEl) { const antes = botaoEl.textContent; botaoEl.textContent = '✓ copiado'; setTimeout(() => botaoEl.textContent = antes, 1600); } };
    if (navigator.clipboard) navigator.clipboard.writeText(texto).then(fim, () => {});
    else {
      const ta = document.createElement('textarea');
      ta.value = texto; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); fim(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  return { painel, grade, aviso, achados, cartao, tabela, selo, botao, acoes, vazio, produto, indicador, copiar, esc };
})();


/* ===== 61-estado.js ===== */
/* ===========================================================================
   CAMADA 6 — ESTADO E NAVEGAÇÃO
   Um objeto só, quatro gavetas. Toda tela lê daqui; só esta camada escreve.

   A regra que organiza tudo: TROCAR DE EMPRESA ZERA AS QUATRO GAVETAS antes
   de carregar a próxima. No sistema antigo o formulário guardava o que a
   empresa anterior tinha deixado, e um pacote chegou a ser gravado na ficha
   errada. Aqui não há como: a função que troca de empresa começa criando um
   estado novo.
   =========================================================================== */
window.CO = window.CO || {};

CO.estado = (function () {
  'use strict';

  function zerado() {
    return {
      empresaId: null,
      empresa: null,        // cadastro
      exercicios: [],       // registros do banco
      documentos: {},       // contrato, apólices, IR, apresentação, parecer
      dossie: null,         // recalculado quando os exercícios mudam
      analise: null,
      mapa: null,
      ui: { etapa: 'cadastro', secao: null, carregando: false, erro: null, pendente: null }
    };
  }

  let E = zerado();

  const ler = () => E;
  const zerar = () => { E = zerado(); return E; };

  /* Recalcula tudo que deriva dos exercícios. Chamado sempre que eles mudam
     — e só aqui, para que análise e tela nunca fiquem fora de sincronia. */
  function recalcular() {
    if (!E.exercicios.length) { E.dossie = null; E.analise = null; E.mapa = null; return E; }
    E.dossie = CO.dossie.montar(E.exercicios, E.empresa || {}, E.documentos);
    E.analise = CO.diagnostico.analisar(E.dossie);
    E.mapa = CO.produtos.avaliar(E.dossie);
    return E;
  }

  const irPara = (etapa, secao) => { E.ui.etapa = etapa; E.ui.secao = secao || null; return E; };

  return { ler, zerar, recalcular, irPara };
})();

/* ===========================================================================
   AS SEIS ETAPAS
   Cada uma declara, em código, o que precisa e o que entrega. A barra de
   progresso e os avisos de "o que falta" nascem daqui — não são escritos à
   mão em lugar nenhum.
   =========================================================================== */
CO.etapas = (function () {
  'use strict';
  const B = CO.base;

  const LISTA = [
    {
      id: 'cadastro', nome: 'Cadastro', numero: 1,
      resumo: 'quem é a empresa',
      precisa: e => {
        const f = [];
        if (!e.empresa) return ['abrir uma empresa'];
        if (!e.empresa.cnpj) f.push('CNPJ');
        if (!e.empresa.setor) f.push('setor');
        if (!e.empresa.regimeTributario) f.push('regime tributário');
        if (!e.empresa.funcionarios) f.push('número de funcionários');
        return f;
      }
    },
    {
      id: 'documentos', nome: 'Documentos', numero: 2,
      resumo: 'o que a IA leu',
      precisa: e => {
        const f = [];
        if (!e.documentos.contratoSocial) f.push('contrato social');
        if (!e.documentos.apolices) f.push('apólices');
        if (!(e.documentos.sociosIR || []).length) f.push('IR dos sócios');
        return f;
      }
    },
    {
      id: 'numeros', nome: 'Números', numero: 3,
      resumo: 'os exercícios conferidos',
      precisa: e => {
        if (!e.exercicios.length) return ['nenhum exercício carregado'];
        const f = [];
        if (e.exercicios.length < 2) f.push('um segundo exercício — sem dois anos fechados não há variação');
        const ausentes = e.dossie && e.dossie.atual ? e.dossie.atual.ausentes : [];
        if (ausentes.length) f.push(ausentes.length === 1
          ? `o campo ${CO.modelo.nomeCurto(ausentes[0])} no ano mais recente`
          : `${ausentes.length} campos vigiados no ano mais recente`);
        return f;
      }
    },
    {
      id: 'analises', nome: 'Análises', numero: 4,
      resumo: 'o que os números dizem',
      precisa: e => {
        if (!e.dossie || !e.dossie.atual) return ['os números'];
        if (e.analise && e.analise.impedimentos.length) return [`${e.analise.impedimentos.length} inconsistência(s) impedem a análise`];
        return [];
      }
    },
    {
      id: 'parecer', nome: 'Parecer', numero: 5,
      resumo: 'o texto conferido',
      precisa: e => e.documentos.parecer ? [] : ['o parecer ainda não foi escrito']
    },
    {
      id: 'proposta', nome: 'Proposta', numero: 6,
      resumo: 'o que ofertar',
      precisa: e => {
        if (!e.mapa || !e.mapa.itens.length) return ['os números, para o mapa de produtos'];
        return [];
      }
    }
  ];

  const pronta = (etapa, e) => etapa.precisa(e).length === 0;

  /* O estado de cada etapa, para a linha do tempo desenhar sozinha. */
  function situacao(e) {
    return LISTA.map(et => {
      const falta = et.precisa(e);
      return {
        ...et, falta,
        pronta: falta.length === 0,
        texto: falta.length === 0 ? 'pronto' : (falta.length === 1 ? 'falta ' + falta[0] : `faltam ${falta.length} itens`)
      };
    });
  }

  const porId = id => LISTA.find(x => x.id === id) || LISTA[0];

  return { LISTA, situacao, pronta, porId };
})();


/* ===== 70-telas.js ===== */
/* ===========================================================================
   CAMADA 6 — AS TELAS DE CADA ETAPA
   Uma função por etapa. Todas recebem o estado e devolvem HTML — nenhuma
   calcula nada: o número já veio pronto das camadas de baixo.
   =========================================================================== */
window.CO = window.CO || {};

CO.telas = (function () {
  'use strict';
  const B = CO.base, U = CO.ui, E = CO.exercicio;

  /* ---------------- 1 · CADASTRO ---------------- */
  function cadastro(e) {
    const c = e.empresa || {};
    let h = U.cartao('Quem é a empresa', 'o que o sistema sabe antes de olhar qualquer número',
      U.grade(
        U.painel('Razão social', c.nome || '—') +
        U.painel('CNPJ', c.cnpj ? B.formataCNPJ(c.cnpj) : '—') +
        U.painel('Setor', c.setor || '—', null, { motivo: 'o setor muda as referências de margem e de ciclo' }) +
        U.painel('Regime tributário', c.regimeTributario || '—', null, { motivo: 'no lucro real o benefício volta 34% em imposto' }) +
        U.painel('Funcionários', c.funcionarios ? B.qtd(c.funcionarios) : '—', null, { motivo: 'sem headcount não há RC empregador, vida em grupo nem dental' })
      ));

    const socios = c.socios || [];
    h += U.cartao('Sócios', socios.length ? `${socios.length} no contrato social` : 'ainda não lemos o contrato social',
      socios.length
        ? U.tabela([{ t: 'Nome' }, { t: 'CPF' }, { t: 'Participação', n: true }],
            socios.map(s => [U.esc(s.nome || '—'), s.cpf ? B.cpfDiscreto(s.cpf) : '—', s.participacao != null ? B.pctCru(s.participacao) : '—']))
        : U.aviso('neutro', null, ['O contrato social traz os sócios, as participações e as cláusulas de sucessão. É a etapa Documentos.']));

    const falta = CO.etapas.porId('cadastro').precisa(e);
    if (falta.length) h += U.aviso('atencao', 'O que ainda falta no cadastro', falta);
    return h;
  }

  /* ---------------- 2 · DOCUMENTOS ---------------- */
  function documentos(e) {
    const c = e.empresa || {};
    const empresaParaPrompt = {
      nome: c.nome, cnpj: c.cnpj, setor: c.setor, regimeTributario: c.regimeTributario,
      funcionarios: c.funcionarios, socios: c.socios,
      anosGravados: (e.exercicios || []).map(x => x.ano).filter(Boolean).sort()
    };

    const estado = {
      financeiro: e.exercicios.length ? `${e.exercicios.length} exercício(s) gravados` : null,
      contrato: e.documentos.contratoSocial ? 'lido' : null,
      apolices: e.documentos.apolices ? `${(e.documentos.apolices.apolices || []).length || 'lido'}` : null,
      ir: (e.documentos.sociosIR || []).length ? `${e.documentos.sociosIR.length} sócio(s)` : null,
      parecer: e.documentos.parecer ? 'escrito' : null,
      apresentacao: e.documentos.apresentacao ? 'lida' : null
    };

    let h = U.cartao('Os seis leitores',
      'cada documento tem seu prompt. Copie, mande para a IA com o documento, e traga o arquivo de volta.',
      CO.prompts.lista().map(q => {
        const temIt = estado[q.id === 'ir' ? 'ir' : q.id];
        return `<div class="produto ${temIt ? 'baixa' : 'media'}">
          <div class="produto-topo">
            <div><div class="produto-titulo">${U.esc(q.nome)} ${temIt ? U.selo(temIt, 'doc') : U.selo('pendente', 'media')}</div>
                 <div class="produto-porque">${U.esc(q.oQuePedir)}</div></div>
            <div>${U.botao('copiar o prompt', `CO.app.copiarPrompt('${q.id}')`, { pequeno: true })}</div>
          </div>
          <div class="produto-acao">devolve: ${U.esc(q.entrega)}</div>
        </div>`;
      }).join(''));

    h += U.cartao('Trazer o arquivo de volta',
      'cole aqui o JSON que a IA devolveu — o sistema confere antes de gravar qualquer coisa',
      `<textarea id="colarDoc" placeholder="Cole aqui o conteúdo do arquivo JSON..."></textarea>
       ${U.acoes(U.botao('conferir o arquivo', 'CO.app.conferirColado()', { principal: true }) +
                 U.botao('limpar', "document.getElementById('colarDoc').value=''", {}))}
       <div id="conferencia"></div>`);
    return h;
  }

  /* ---------------- 3 · NÚMEROS ---------------- */
  function numeros(e) {
    if (!e.exercicios.length) {
      return U.cartao('Nenhum exercício carregado', 'os números entram pela etapa Documentos, com o prompt do balanço e da DRE',
        U.aviso('neutro', null, ['Copie o prompt "Balanço e DRE", mande para a IA junto com os documentos e cole o arquivo de volta.']) +
        U.acoes(U.botao('ir para Documentos', "CO.app.irPara('documentos')", { principal: true })));
    }

    const d = e.dossie;
    let h = '';

    /* o retrato do ano mais recente */
    const ind = d.ind;
    h += U.cartao(`Exercício de ${d.atual.ano}`, d.exercicios.length + ' exercício(s) carregados · ' + CO.diagnostico.retrato(d),
      U.grade(
        U.painel('Receita líquida', B.dinheiro(d.R)) +
        U.painel('EBITDA', B.dinheiro(d.EBITDA), E.valor(d.atual, 'ebitdaPiso') === true ? 'piso: igual ao EBIT' : null) +
        U.painel('Lucro líquido', B.dinheiro(d.LL)) +
        U.painel('Patrimônio líquido', B.dinheiro(d.PL)) +
        U.painel('Dívida líquida', B.dinheiro(d.DL))
      ));

    /* travas e pendências */
    const t = d.travas || {};
    h += U.achados(t.impossiveis, 'erro', 'A aritmética não fecha — o sistema não analisa assim');
    h += U.achados(t.ressalvas, 'atencao', 'Ressalvas que a tela precisa dizer em voz alta');
    h += U.achados(t.estranhezas, 'atencao', 'Possível, mas raro');
    if (d.atual.pendencias.length) {
      h += U.aviso('atencao', 'As subcontas não somam o total do documento',
        d.atual.pendencias.map(p => `${U.esc(p.bloco)}: o documento traz ${B.dinheiro(p.documento)}, as subcontas somam ${B.dinheiro(p.somado)} — faltam ${B.dinheiro(Math.abs(p.falta))}. O total do documento é o que vale.`));
    }
    if (t.ausencias && t.ausencias.length) {
      h += U.aviso('neutro', 'O que o documento não trouxe',
        t.ausencias.map(a => `<b>${U.esc(a.rotulo)}</b>: ${U.esc(a.porque)}`));
    }

    /* a série, ano a ano */
    const campos = ['receitaLiquida', 'lucroBruto', 'ebitda', 'lucroLiquido', 'ativoTotal', 'patrimonioLiquido', 'dividaBruta', 'caixa'];
    const colunas = [{ t: 'Conta' }].concat(d.anos.map(a => ({ t: String(a), n: true })));
    const linhas = campos.map(c => {
      const celulas = [U.esc(CO.modelo.nomeCurto(c))];
      for (const ex of d.exercicios) {
        const v = E.n(ex, c);
        const marca = E.derivado(ex, c) ? ' ' + U.selo('calc', 'calc') : '';
        celulas.push(v === null ? '—' : B.dinheiro(v) + marca);
      }
      return { celulas };
    });
    h += U.cartao('Os números, ano a ano', 'o selo "calc" marca o que a conta derivou; o resto veio do documento', U.tabela(colunas, linhas));

    /* indicadores */
    h += U.cartao('Indicadores', 'o que não pôde ser calculado aparece com o motivo, nunca como zero',
      U.grade(
        U.indicador(ind, 'margemBruta', 'Margem bruta', 'pct') +
        U.indicador(ind, 'margemEbitda', 'Margem EBITDA', 'pct') +
        U.indicador(ind, 'margemLiquida', 'Margem líquida', 'pct') +
        U.indicador(ind, 'roe', 'ROE', 'pct') +
        U.indicador(ind, 'roa', 'ROA', 'pct') +
        U.indicador(ind, 'liquidezCorrente', 'Liquidez corrente', 'x') +
        U.indicador(ind, 'liquidezSeca', 'Liquidez seca', 'x') +
        U.indicador(ind, 'alavancagem', 'Dívida líquida / EBITDA', 'x') +
        U.indicador(ind, 'coberturaJuros', 'Cobertura de juros', 'x') +
        U.indicador(ind, 'cicloFinanceiro', 'Ciclo financeiro', 'dias') +
        U.indicador(ind, 'giroAtivo', 'Giro do ativo', 'x') +
        U.indicador(ind, 'capitalCirculanteLiquido', 'Capital circulante líquido', 'dinheiro')
      ));
    return h;
  }

  /* ---------------- 4 · ANÁLISES ---------------- */
  function analises(e) {
    if (!e.analise) return U.cartao('Sem análise', 'faltam os números', U.acoes(U.botao('ir para Números', "CO.app.irPara('numeros')", { principal: true })));
    const a = e.analise, d = e.dossie;

    let h = '';
    if (a.impedimentos.length) {
      h += U.achados(a.impedimentos, 'erro', 'A análise está bloqueada');
      return h;
    }

    /* score */
    const s = a.score;
    h += U.cartao(`Diagnóstico de ${a.ano}`, a.retrato,
      (s.valor !== null
        ? U.grade(U.painel('Nota', s.valor + '/100', s.nota, { destaque: true }) +
            s.linhas.filter(l => l.valor !== null).slice(0, 5).map(l => U.painel(l.nome, l.texto, `${l.pontos} de ${l.de} pontos`)).join(''))
        : U.aviso('neutro', 'Sem nota', [s.porque])));

    /* trajetória */
    if (a.trajetoria.temComparacao) {
      h += U.cartao(`O que mudou de ${a.trajetoria.de} para ${a.trajetoria.para}`, null,
        U.tabela([{ t: 'Conta' }, { t: a.trajetoria.de, n: true }, { t: a.trajetoria.para, n: true }, { t: 'Variação', n: true }],
          a.trajetoria.linhas.map(l => [U.esc(CO.modelo.nomeCurto(l.campo)), B.dinheiro(l.antes), B.dinheiro(l.hoje),
            `<b style="color:${l.variacao >= 0 ? 'var(--bom)' : 'var(--erro)'}">${l.variacao >= 0 ? '+' : ''}${B.pct(l.variacao)}</b>`])));
    } else {
      h += U.aviso('neutro', null, [a.trajetoria.porque]);
    }

    /* achados */
    if (a.achados.length) {
      h += U.cartao('O que chamou a atenção',
        'cada achado vem com as hipóteses e a pergunta que separa uma da outra — nunca com a conclusão sobre a gestão',
        a.achados.map(x => `<div class="produto media">
          <div class="produto-titulo">${U.esc(x.titulo)}</div>
          <div class="produto-porque">${U.esc(x.oQue)}</div>
          <div class="produto-porque">Pode ser: ${x.hipoteses.map(hp => U.esc(hp)).join(' · ')}</div>
          <div class="produto-acao">Perguntar: ${U.esc(x.pergunta)}</div>
        </div>`).join(''));
    }

    if (a.ressalvas.length) h += U.achados(a.ressalvas, 'atencao', 'Ressalvas');
    return h;
  }

  /* ---------------- 5 · PARECER ---------------- */
  function parecer(e) {
    let h = U.cartao('O resumo que o sistema calculou',
      'é com este texto que o parecer é conferido, número a número — a IA não pode usar nenhum valor que não esteja aqui',
      `<div class="prompt-caixa" id="resumoSistema">${U.esc(CO.resumo ? CO.resumo.texto(e) : '(sem números carregados)')}</div>
       ${U.acoes(U.botao('copiar o resumo', 'CO.app.copiarResumo()', {}) + U.botao('copiar o prompt do parecer', "CO.app.copiarPrompt('parecer')", { principal: true }))}`);

    const p = e.documentos.parecer;
    if (p) {
      h += U.cartao('O parecer gravado', null,
        (p.resumoExecutivo ? `<div style="font-size:13.5px;line-height:1.7">${U.esc(p.resumoExecutivo)}</div>` : '') +
        (Array.isArray(p.alertas) && p.alertas.length ? U.aviso('atencao', 'Alertas', p.alertas.map(x => typeof x === 'string' ? x : x.texto || '')) : '') +
        (p.cartaCliente ? U.cartao('Carta ao cliente', 'sem menção a gerente ou agência', `<div style="white-space:pre-wrap;font-size:13px">${U.esc(p.cartaCliente)}</div>`) : ''));
    } else {
      h += U.aviso('neutro', null, ['Ainda não há parecer. Copie o prompt, mande junto com o resumo acima, e traga o arquivo pela etapa Documentos.']);
    }
    return h;
  }

  /* ---------------- 6 · PROPOSTA ---------------- */
  function proposta(e) {
    const m = e.mapa;
    if (!m || !m.itens.length) {
      return U.cartao('Sem proposta ainda', 'o mapa de produtos nasce dos números',
        U.acoes(U.botao('ir para Números', "CO.app.irPara('numeros')", { principal: true })));
    }

    let h = U.cartao('O que ofertar', `${m.itens.length} produtos · ${m.urgentes} urgente(s)`,
      U.grade(
        U.painel('Maior exposição isolada', B.dinheiro(m.maior.numero), m.maior.titulo, { destaque: true }) +
        U.painel('Produtos urgentes', String(m.urgentes), 'prioridade alta') +
        U.painel('Ramos envolvidos', String(m.grupos.length))
      ) + U.aviso('neutro', null, [m.rodape]));

    for (const g of m.grupos) {
      h += U.cartao(g.ramo, null, g.itens.map(U.produto).join(''));
    }

    if (m.naoAgora.length) {
      h += U.cartao('O que não recomendar agora', 'oferecer o que não cabe queima a conversa',
        U.tabela([{ t: 'Produto' }, { t: 'Por quê' }], m.naoAgora.map(x => [U.esc(x.produto), U.esc(x.porque)])));
    }
    if (m.perguntas.length) {
      h += U.cartao('O que falta saber', 'cada ausência vira um pedido objetivo, nunca silêncio',
        `<ul style="margin:0;padding-left:18px;font-size:13px">${m.perguntas.map(p => `<li style="margin:5px 0">${U.esc(p)}</li>`).join('')}</ul>`);
    }
    return h;
  }

  return { cadastro, documentos, numeros, analises, parecer, proposta };
})();


/* ===== 71-app.js ===== */
/* ===========================================================================
   CAMADA 6 — O APLICATIVO
   Inicialização, navegação e as ações do corretor. É o único arquivo que
   junta tela, estado e banco.
   =========================================================================== */
window.CO = window.CO || {};

CO.app = (function () {
  'use strict';
  const B = CO.base, U = CO.ui;
  const el = id => document.getElementById(id);
  const S = () => CO.estado.ler();

  /* ---------- desenho ---------- */

  function desenharLinhaTempo() {
    const alvo = el('linhaTempo'); if (!alvo) return;
    const e = S();
    if (!e.empresa) { alvo.innerHTML = ''; alvo.style.display = 'none'; return; }
    alvo.style.display = '';
    alvo.innerHTML = CO.etapas.situacao(e).map(et => `
      <button class="etapa" role="tab" aria-selected="${e.ui.etapa === et.id}" onclick="CO.app.irPara('${et.id}')">
        <span class="etapa-nome"><span class="etapa-selo ${et.pronta ? 'pronta' : (et.falta.length ? 'falta' : '')}"></span>${et.numero}. ${U.esc(et.nome)}</span>
        <span class="etapa-estado">${U.esc(et.texto)}</span>
      </button>`).join('');
  }

  function desenhar() {
    const e = S();
    desenharLinhaTempo();
    const topo = el('empresaAtual');
    if (topo) topo.innerHTML = e.empresa
      ? `<b>${U.esc(e.empresa.nome)}</b>${e.empresa.cnpj ? ' · ' + U.esc(B.formataCNPJ(e.empresa.cnpj)) : ''}
         ${U.botao('trocar de empresa', 'CO.app.voltarParaLista()', { pequeno: true })}`
      : '';

    const alvo = el('conteudo'); if (!alvo) return;
    if (e.ui.carregando) { alvo.innerHTML = '<div class="carregando">carregando…</div>'; return; }
    if (e.ui.erro) { alvo.innerHTML = U.aviso('erro', 'Não deu certo', [e.ui.erro]); return; }
    if (!e.empresa) { alvo.innerHTML = listaEmpresas(); return; }

    const tela = CO.telas[e.ui.etapa];
    alvo.innerHTML = tela ? tela(e) : U.vazio('etapa desconhecida');
  }

  /* ---------- lista de empresas ---------- */

  let EMPRESAS = [], FILTRO = '';

  function listaEmpresas() {
    const vis = EMPRESAS.filter(x => !FILTRO || B.simples(x.nome + ' ' + x.cnpj).includes(B.simples(FILTRO)));
    return U.cartao('Empresas', `${EMPRESAS.length} no cadastro`,
      `<input type="search" id="buscaEmpresa" placeholder="buscar por nome ou CNPJ" value="${U.esc(FILTRO)}"
         oninput="CO.app.filtrar(this.value)" style="margin-bottom:12px">
       <div class="empresas">${vis.map(x => `
         <button class="empresa-item" onclick="CO.app.abrirEmpresa('${x.id}')">
           <div class="nome">${U.esc(x.nome)}</div>
           <div class="meta">${x.cnpj ? U.esc(B.formataCNPJ(x.cnpj)) : 'sem CNPJ'}${x.setor ? ' · ' + U.esc(x.setor) : ''}</div>
         </button>`).join('')}</div>
       ${vis.length ? '' : U.vazio('nenhuma empresa encontrada')}`);
  }

  function filtrar(v) {
    FILTRO = v;
    const alvo = el('conteudo');
    const foco = document.activeElement === el('buscaEmpresa');
    alvo.innerHTML = listaEmpresas();
    if (foco) { const c = el('buscaEmpresa'); c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  }

  /* ---------- carregar ---------- */

  async function abrirEmpresa(id) {
    /* trocar de empresa ZERA tudo antes de carregar: âncora e pacote da
       empresa anterior são o pior dado que existe */
    CO.estado.zerar();
    const e = S();
    e.ui.carregando = true; desenhar();
    try {
      const dados = await CO.dados.carregarEmpresa(id);
      if (!dados) throw new Error('empresa não encontrada');
      e.empresaId = id;
      e.empresa = dados.cadastro;
      e.documentos = dados.documentos;
      e.exercicios = dados.exercicios;
      CO.estado.recalcular();
      e.ui.etapa = e.exercicios.length ? 'numeros' : 'documentos';
    } catch (err) {
      e.ui.erro = String(err && err.message || err);
    }
    e.ui.carregando = false;
    desenhar();
  }

  function voltarParaLista() { CO.estado.zerar(); desenhar(); }
  function irPara(etapa) { CO.estado.irPara(etapa); desenhar(); }

  /* ---------- prompts ---------- */

  function copiarPrompt(qual) {
    const e = S(), c = e.empresa || {};
    const texto = CO.prompts.montar(qual, {
      nome: c.nome, cnpj: c.cnpj, setor: c.setor, regimeTributario: c.regimeTributario,
      funcionarios: c.funcionarios, socios: c.socios,
      anosGravados: (e.exercicios || []).map(x => x.ano).filter(Boolean).sort()
    });
    U.copiar(texto, event && event.target);
  }

  function copiarResumo() { U.copiar(CO.resumo.texto(S()), event && event.target); }

  /* ---------- conferir um arquivo colado ---------- */

  function conferirColado() {
    const e = S();
    const txt = (el('colarDoc') || {}).value || '';
    const caixa = el('conferencia');
    if (!txt.trim()) { caixa.innerHTML = U.aviso('atencao', null, ['Cole o conteúdo do arquivo primeiro.']); return; }

    const gravados = {};
    for (const r of e.exercicios) if (r.ano) gravados[r.ano] = r;

    const r = CO.importar.ler(txt, { cnpjEmpresa: (e.empresa || {}).cnpj, gravados });
    e.ui.pendente = r;

    if (!r.ok) { caixa.innerHTML = U.aviso('erro', 'Não consegui ler o arquivo', r.erros); return; }

    let h = '';
    if (r.consertos.length) h += U.aviso('neutro', 'Consertei o arquivo para conseguir ler (nenhum número mudou)', r.consertos);
    if (r.bloqueio) { caixa.innerHTML = h + U.achados([r.bloqueio], 'erro', 'Arquivo recusado'); return; }
    if (r.repetidos.length) h += U.achados(r.repetidos, 'erro', 'Problema no pacote');
    if (r.avisos.length) h += U.aviso('neutro', 'O que o sistema fez com o arquivo', r.avisos);

    /* a tabela de conferência: documento × sistema, ano a ano */
    for (const ano of r.anos) {
      const ex = ano.exercicio, t = ano.travas;
      const campos = ['receitaLiquida', 'lucroBruto', 'ebitda', 'lucroLiquido', 'ativoTotal', 'patrimonioLiquido', 'dividaBruta'];
      const linhas = campos.map(c => [
        U.esc(CO.modelo.nomeCurto(c)),
        CO.exercicio.doDocumento(ex, c) ? B.dinheiro(CO.exercicio.n(ex, c)) + ' ' + U.selo('documento', 'doc') : '—',
        CO.exercicio.derivado(ex, c) ? B.dinheiro(CO.exercicio.n(ex, c)) + ' ' + U.selo('calculado', 'calc') : '—'
      ]);
      h += U.cartao(`${ano.ano} — ${ano.acao === 'novo' ? 'exercício novo' : ano.acao === 'corrige' ? 'correção de um ano já gravado' : 'substitui o ano gravado'}`,
        ano.escala ? `valores convertidos ×${B.qtd(ano.escala.fator)} — ${ano.escala.origem}` : null,
        U.tabela([{ t: 'Conta' }, { t: 'Do documento', n: true }, { t: 'Calculado', n: true }], linhas) +
        U.achados(t.impossiveis, 'erro', 'Impede a gravação') +
        U.achados(t.ressalvas, 'atencao', 'Ressalvas') +
        U.achados(t.estranhezas, 'atencao', 'Possível, mas raro') +
        (ex.naoReconhecidos.length ? U.aviso('neutro', 'Campos que o sistema não reconheceu (nada foi descartado em silêncio)',
          ex.naoReconhecidos.map(x => `${x.nome}: ${x.valor}`)) : '') +
        (ano.descartados.length ? U.aviso('neutro', 'Razões que a IA calculou e o sistema ignorou (ele refaz a conta)', [ano.descartados.join(', ')]) : ''));
    }

    if (r.vazios.length) h += U.aviso('atencao', 'Exercícios vazios ficaram de fora', r.vazios.map(v => `${v.ano}: sem nenhum número`));
    const sv = r.mostrarSemGravar || {};
    if (sv.duvidas) h += U.aviso('neutro', 'Dúvidas da IA (não são gravadas)', sv.duvidas);
    if (sv.naoAlocado) h += U.aviso('neutro', 'Linhas que a IA não soube onde pôr', Array.isArray(sv.naoAlocado) ? sv.naoAlocado.map(x => typeof x === 'string' ? x : JSON.stringify(x)) : [String(sv.naoAlocado)]);

    h += U.acoes(
      U.botao(r.podeGravar ? 'gravar o que está certo' : 'não dá para gravar', 'CO.app.gravarPendente()', { principal: true, desativado: !r.podeGravar }) +
      U.botao('cancelar', 'CO.app.cancelarPendente()', {}));
    caixa.innerHTML = h;
  }

  function cancelarPendente() {
    S().ui.pendente = null;
    const c = el('conferencia'); if (c) c.innerHTML = '';
    const t = el('colarDoc'); if (t) t.value = '';
  }

  async function gravarPendente() {
    const e = S(), r = e.ui.pendente;
    if (!r || !r.ok) return;
    const caixa = el('conferencia');
    caixa.innerHTML = '<div class="carregando">gravando…</div>';
    try {
      const gravados = {};
      for (const x of e.exercicios) if (x.ano) gravados[x.ano] = x;
      let n = 0;
      for (const ano of r.anos) {
        if (!ano.travas.podeGravar) continue;
        const { registro } = CO.importar.paraGravar(ano, gravados[ano.ano], { manterAusentes: ano.acao !== 'substitui' });
        await CO.dados.gravarExercicio(e.empresaId, registro);
        n++;
      }
      const dados = await CO.dados.carregarEmpresa(e.empresaId);
      e.exercicios = dados.exercicios;
      e.documentos = dados.documentos;
      CO.estado.recalcular();
      e.ui.pendente = null;
      e.ui.etapa = 'numeros';
      desenhar();
    } catch (err) {
      caixa.innerHTML = U.aviso('erro', 'Não consegui gravar', [String(err && err.message || err)]);
    }
  }

  /* ---------- início ---------- */

  async function iniciar() {
    desenhar();
    if (!CO.dados.pronto()) {
      el('conteudo').innerHTML = U.aviso('erro', 'Sem conexão com o banco',
        ['O arquivo js/firebase-config.js precisa estar na mesma pasta deste HTML, como no sistema atual.']);
      return;
    }
    const e = S();
    e.ui.carregando = true; desenhar();
    try { EMPRESAS = await CO.dados.listarEmpresas(); }
    catch (err) { e.ui.erro = 'não consegui listar as empresas: ' + (err && err.message || err); }
    e.ui.carregando = false;
    desenhar();
  }

  return { iniciar, desenhar, irPara, abrirEmpresa, voltarParaLista, filtrar,
           copiarPrompt, copiarResumo, conferirColado, gravarPendente, cancelarPendente,
           _empresas: () => EMPRESAS, _carregarLista: lista => { EMPRESAS = lista; } };
})();

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', CO.app.iniciar);
  else CO.app.iniciar();
}

</script>
