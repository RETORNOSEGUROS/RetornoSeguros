<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corporate One · Financeiro</title>

<!-- Firebase: as mesmas coleções do sistema atual, nenhuma migração.
     A configuração continua em js/firebase-config.js, ao lado deste arquivo. -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>

<style>
/* ===========================================================================
   Corporate One · Financeiro — estilo
   Um sistema de leitura, não um painel de controle: o que importa é o número
   ser lido certo e a ressalva ser lida junto.
   =========================================================================== */

:root {
  --tinta: #0f172a; --tinta-media: #334155; --tinta-fraca: #64748b; --tinta-apagada: #94a3b8;
  --papel: #f6f7f9; --cartao: #ffffff; --linha: #e2e8f0; --linha-forte: #cbd5e1;
  --marca: #0f766e; --marca-clara: #ccfbf1; --marca-escura: #115e59;
  --alerta: #b45309; --alerta-fundo: #fffbeb; --alerta-linha: #fde68a;
  --erro: #b91c1c; --erro-fundo: #fef2f2; --erro-linha: #fecaca;
  --bom: #15803d; --bom-fundo: #f0fdf4;
  --sombra: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
  --raio: 10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--papel); color: var(--tinta); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
a { color: var(--marca); }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }

/* ---------- estrutura ---------- */
.topo {
  background: var(--cartao); border-bottom: 1px solid var(--linha);
  padding: 10px 20px; display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 50;
}
.topo .marca { font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
.topo .marca span { color: var(--marca); }
.topo .empresa-atual { font-size: 13px; color: var(--tinta-media); display: flex; align-items: center; gap: 8px; }
.topo .espaco { flex: 1; }
.pagina { max-width: 1180px; margin: 0 auto; padding: 18px 20px 60px; }

/* ---------- linha do tempo ---------- */
.linha-tempo {
  display: flex; gap: 2px; background: var(--cartao); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: 4px; margin-bottom: 18px; overflow-x: auto; box-shadow: var(--sombra);
}
.etapa {
  flex: 1; min-width: 132px; border: 0; background: transparent; cursor: pointer;
  padding: 9px 12px; border-radius: 7px; text-align: left; font: inherit; color: var(--tinta-fraca);
  display: flex; flex-direction: column; gap: 2px; transition: background .12s;
}
.etapa:hover { background: #f1f5f9; }
.etapa[aria-selected="true"] { background: var(--marca); color: #fff; }
.etapa[aria-selected="true"] .etapa-estado { color: rgba(255,255,255,.85); }
.etapa-nome { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.etapa-estado { font-size: 11px; color: var(--tinta-apagada); }
.etapa-selo { width: 7px; height: 7px; border-radius: 50%; background: var(--linha-forte); flex: none; }
.etapa-selo.pronta { background: var(--bom); }
.etapa-selo.falta { background: var(--alerta); }

/* ---------- cartões ---------- */
.cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--sombra); }
.cartao > h2 { font-size: 15px; margin-bottom: 2px; }
.cartao > .sub { font-size: 12.5px; color: var(--tinta-fraca); margin-bottom: 12px; }
.secao-titulo { font-size: 13px; font-weight: 700; color: var(--tinta-media); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }

/* ---------- números ---------- */
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 10px; }
.painel { background: #fbfcfd; border: 1px solid var(--linha); border-radius: 9px; padding: 10px 12px; }
.painel-rotulo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-fraca); font-weight: 600; }
.painel-valor { font-size: 21px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.painel-valor.ausente { color: var(--tinta-apagada); font-weight: 600; font-size: 18px; }
.painel-nota { font-size: 11px; color: var(--tinta-fraca); margin-top: 3px; line-height: 1.4; }
.painel-nota.premissa { color: var(--tinta-apagada); font-style: italic; }
.painel.destaque { border-color: var(--marca); background: var(--marca-clara); }
.painel.destaque .painel-valor { color: var(--marca-escura); }

/* ---------- avisos ---------- */
.aviso { border-radius: 9px; padding: 10px 13px; margin: 10px 0; font-size: 13px; border: 1px solid; }
.aviso h4 { font-size: 12.5px; margin-bottom: 4px; }
.aviso ul { margin: 4px 0 0; padding-left: 18px; }
.aviso li { margin: 3px 0; }
.aviso.erro { background: var(--erro-fundo); border-color: var(--erro-linha); color: #7f1d1d; }
.aviso.atencao { background: var(--alerta-fundo); border-color: var(--alerta-linha); color: #78350f; }
.aviso.bom { background: var(--bom-fundo); border-color: #bbf7d0; color: #14532d; }
.aviso.neutro { background: #f8fafc; border-color: var(--linha); color: var(--tinta-media); }

/* ---------- tabelas ---------- */
table.dados { width: 100%; border-collapse: collapse; font-size: 13px; }
table.dados th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta-fraca); font-weight: 600; padding: 7px 10px; border-bottom: 1px solid var(--linha); background: #fbfcfd; }
table.dados td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
table.dados td.n, table.dados th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.dados tr:last-child td { border-bottom: 0; }
table.dados tr.calculado td { background: #fcfdfe; }
.selo { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 99px; font-weight: 600; letter-spacing: .02em; vertical-align: middle; }
.selo.doc { background: #e0f2fe; color: #075985; }
.selo.calc { background: #f1f5f9; color: var(--tinta-fraca); }
.selo.piso { background: var(--alerta-fundo); color: var(--alerta); border: 1px solid var(--alerta-linha); }
.selo.alta { background: #fee2e2; color: #991b1b; }
.selo.media { background: #fef3c7; color: #92400e; }
.selo.baixa { background: #f1f5f9; color: var(--tinta-fraca); }

/* ---------- botões e campos ---------- */
.btn { border: 1px solid var(--linha-forte); background: var(--cartao); color: var(--tinta); border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .12s, border-color .12s; }
.btn:hover { background: #f8fafc; border-color: var(--tinta-apagada); }
.btn.principal { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.principal:hover { background: var(--marca-escura); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pequeno { padding: 4px 10px; font-size: 12px; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
input[type=text], input[type=search], textarea, select { font: inherit; font-size: 13px; border: 1px solid var(--linha-forte); border-radius: 8px; padding: 7px 10px; background: var(--cartao); color: var(--tinta); width: 100%; }
textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--marca-clara); border-color: var(--marca); }

/* ---------- lista de empresas ---------- */
.empresas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.empresa-item { background: var(--cartao); border: 1px solid var(--linha); border-radius: 9px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; transition: border-color .12s, box-shadow .12s; }
.empresa-item:hover { border-color: var(--marca); box-shadow: var(--sombra); }
.empresa-item .nome { font-weight: 700; font-size: 13.5px; }
.empresa-item .meta { font-size: 11.5px; color: var(--tinta-fraca); margin-top: 2px; }

/* ---------- produtos ---------- */
.produto { border-left: 3px solid var(--linha-forte); background: #fbfcfd; border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 8px; }
.produto.alta { border-left-color: var(--erro); }
.produto.media { border-left-color: var(--alerta); }
.produto.baixa { border-left-color: var(--linha-forte); }
.produto-topo { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.produto-titulo { font-weight: 700; font-size: 13.5px; }
.produto-numero { font-weight: 700; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.produto-rotulo { font-size: 10.5px; color: var(--tinta-fraca); text-align: right; }
.produto-porque { font-size: 12.5px; color: var(--tinta-media); margin-top: 5px; }
.produto-acao { font-size: 12.5px; color: var(--marca-escura); margin-top: 4px; }

/* ---------- diversos ---------- */
.vazio { text-align: center; padding: 40px 20px; color: var(--tinta-fraca); font-size: 13.5px; }
.carregando { text-align: center; padding: 30px; color: var(--tinta-fraca); }
.prompt-caixa { background: #0f172a; color: #e2e8f0; border-radius: 9px; padding: 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.6; max-height: 320px; overflow: auto; white-space: pre-wrap; }
.linha-campo { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; padding: 4px 0; }
.linha-campo label { font-size: 12.5px; color: var(--tinta-media); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip { border: 1px solid var(--linha-forte); background: var(--cartao); border-radius: 99px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-weight: 600; color: var(--tinta-media); }
.chip[aria-selected="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
@media (max-width: 720px) {
  .pagina { padding: 12px; }
  .linha-tempo { gap: 0; }
  .etapa { min-width: 112px; }
}

</style>
</head>
<body>

<header class="topo">
  <div class="marca">Corporate <span>One</span> · Financeiro</div>
  <div class="empresa-atual" id="empresaAtual"></div>
  <div class="espaco"></div>
</header>

<main class="pagina">
  <nav class="linha-tempo" id="linhaTempo" role="tablist" style="display:none"></nav>
  <div id="conteudo"><div class="carregando">carregando…</div></div>
</main>

<script>
/* ===== 00-base.js ===== */
/* ===========================================================================
   CAMADA 0 — BASE
   Número, dinheiro, texto, documento, data. Nada aqui conhece a tela, o banco
   ou o negócio: são as ferramentas que todas as outras camadas usam.

   A regra que molda este arquivo é a P3 do livro: AUSENTE NÃO É ZERO.
   Por isso nenhuma função aqui devolve 0 quando não sabe — devolve null, e
   as operações propagam o null em vez de engoli-lo. Foi o `|| 0` espalhado
   pelo sistema antigo que imprimiu "EBITDA R$ 0" e "dívida R$ 0" numa
   empresa de R$ 150 milhões de ativo.
   =========================================================================== */
window.CO = window.CO || {};

CO.base = (function () {
  'use strict';

  /* ---------- número ---------- */

  /* Um número de verdade, ou null. String vazia, texto, NaN e Infinity viram
     null — nunca zero. Aceita o número como o Brasil escreve (1.234.567,89),
     como o inglês escreve (1,234,567.89) e como a IA costuma mandar (cru). */
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    if (typeof v !== 'string') return null;

    let s = v.trim();
    if (!s) return null;
    s = s.replace(/ /g, ' ').replace(/R\$|\s/g, '');

    // negativo entre parênteses, como o contador escreve: (1.234,56)
    let negativo = false;
    if (/^\(.*\)$/.test(s)) { negativo = true; s = s.slice(1, -1); }
    if (/^-/.test(s)) { negativo = true; s = s.slice(1); }
    if (/-$/.test(s)) { negativo = true; s = s.slice(0, -1); }

    // Número cortado na coluna do PDF ("477.331,") não é 477.331: é um valor
    // que a transcrição truncou. Entra como ausente — nunca como o inteiro,
    // que seria errar os centavos para menos e parecer certo.
    if (/[.,]$/.test(s)) return null;

    const temVirgula = s.includes(','), temPonto = s.includes('.');
    if (temVirgula && temPonto) {
      // o último separador que aparece é o decimal
      s = s.lastIndexOf(',') > s.lastIndexOf('.')
        ? s.replace(/\./g, '').replace(',', '.')
        : s.replace(/,/g, '');
    } else if (temVirgula) {
      // Só vírgula. Duas ou mais = milhar à inglesa (1,234,567). Uma só =
      // decimal à brasileira, SEMPRE — inclusive "1,234". É deliberado: ler
      // decimal como milhar multiplicaria o número por mil, e errar para
      // menos num campo é pendência, errar para mais é laudo falso.
      s = (s.split(',').length - 1) >= 2 ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (temPonto && /\.\d{3}($|\D)/.test(s) && s.split('.').every((p, i) => i === 0 || p.length === 3)) {
      s = s.replace(/\./g, '');   // 1.234.567 é milhar
    }

    if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') return null;
    const n = Number(s);
    if (!Number.isFinite(n)) return null;
    return negativo ? -n : n;
  }

  /* Inteiro dentro de uma faixa, ou null. Serve para headcount e ano — foi a
     falta disso que deixou "63.922.562.988 funcionários" chegar na tela. */
  function inteiro(v, min, max) {
    const n = num(v);
    if (n === null || !Number.isInteger(n)) return null;
    if (min !== undefined && n < min) return null;
    if (max !== undefined && n > max) return null;
    return n;
  }

  /* Soma que respeita o ausente: devolve null se NADA veio; ignora os nulos
     quando pelo menos um número existe. Dois nulos não somam zero. */
  function soma(...vs) {
    let t = null;
    for (const v of vs.flat()) {
      const n = num(v);
      if (n !== null) t = (t === null ? 0 : t) + n;
    }
    return t;
  }

  /* As quatro operações, propagando o ausente. */
  const menos = (a, b) => (num(a) === null || num(b) === null) ? null : num(a) - num(b);
  const vezes = (a, b) => (num(a) === null || num(b) === null) ? null : num(a) * num(b);

  /* Divisão: null quando falta termo E quando o denominador é zero — índice
     com denominador zero não é infinito, é indisponível. */
  function divide(a, b) {
    const x = num(a), y = num(b);
    if (x === null || y === null || y === 0) return null;
    const r = x / y;
    return Number.isFinite(r) ? r : null;
  }

  const centavos = v => num(v) === null ? null : Math.round(num(v) * 100) / 100;
  const positivo = v => num(v) !== null && num(v) > 0;
  const existe = v => num(v) !== null;

  /* ---------- como o número aparece ---------- */

  /* Dinheiro. Ausente vira travessão, nunca "R$ 0" (P3). */
  function dinheiro(v, casas) {
    const n = num(v);
    if (n === null) return '—';
    const d = casas === undefined ? 0 : casas;
    const abs = Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
    return (n < 0 ? '−' : '') + 'R$ ' + abs;
  }

  /* Dinheiro curto, para título e cartão: R$ 1,5 mi · R$ 847 mil. */
  function curto(v) {
    const n = num(v);
    if (n === null) return '—';
    const s = n < 0 ? '−' : '', a = Math.abs(n);
    if (a >= 1e9) return s + 'R$ ' + (a / 1e9).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' bi';
    if (a >= 1e6) return s + 'R$ ' + (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
    if (a >= 1e3) return s + 'R$ ' + Math.round(a / 1e3).toLocaleString('pt-BR') + ' mil';
    return dinheiro(n);
  }

  /* Fração (0,147) vira percentual (14,7%). Quem guarda % cru usa pctCru. */
  function pct(v, casas) {
    const n = num(v);
    if (n === null) return '—';
    return (n * 100).toLocaleString('pt-BR', {
      minimumFractionDigits: casas === undefined ? 1 : casas,
      maximumFractionDigits: casas === undefined ? 1 : casas
    }) + '%';
  }
  function pctCru(v, casas) {
    const n = num(v);
    return n === null ? '—' : n.toLocaleString('pt-BR', {
      minimumFractionDigits: casas === undefined ? 1 : casas,
      maximumFractionDigits: casas === undefined ? 1 : casas
    }) + '%';
  }

  const vezesX = v => num(v) === null ? '—' : num(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'x';
  const dias = v => num(v) === null ? '—' : Math.round(num(v)).toLocaleString('pt-BR') + ' dias';
  const qtd = v => num(v) === null ? '—' : Math.round(num(v)).toLocaleString('pt-BR');

  /* ---------- texto ---------- */

  /* Forma de comparação: sem acento, sem maiúscula, sem separador. É assim
     que o dicionário de sinônimos acha "Receita Líquida", "receita_liquida"
     e "RECEITA-LIQUIDA" no mesmo lugar. */
  const chave = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');

  /* Forma de leitura: sem acento e minúscula, mas com os espaços. */
  const simples = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const cortar = (s, n) => { const t = String(s ?? '').trim(); return t.length <= n ? t : t.slice(0, n - 1).trimEnd() + '…'; };

  /* Plural sem gambiarra: lista(['a','b','c']) → "a, b e c". */
  function lista(arr) {
    const v = (arr || []).filter(Boolean).map(String);
    if (!v.length) return '';
    if (v.length === 1) return v[0];
    return v.slice(0, -1).join(', ') + ' e ' + v[v.length - 1];
  }

  /* ---------- documento ---------- */

  const soDigitos = s => String(s ?? '').replace(/\D/g, '');

  /* A raiz do CNPJ (os 8 primeiros) é o que identifica a empresa entre
     filiais. É por ela que o sistema recusa o arquivo de outra empresa. */
  const raizCNPJ = s => { const d = soDigitos(s); return d.length >= 8 ? d.slice(0, 8) : ''; };

  function formataCNPJ(s) {
    const d = soDigitos(s);
    return d.length !== 14 ? String(s ?? '') :
      `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12)}`;
  }
  function formataCPF(s) {
    const d = soDigitos(s);
    return d.length !== 11 ? String(s ?? '') :
      `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`;
  }
  /* Esconde o meio do CPF: 307.***.**0-53. Dado de sócio em tela aberta. */
  function cpfDiscreto(s) {
    const d = soDigitos(s);
    return d.length !== 11 ? '' : `${d.slice(0, 3)}.***.**${d.slice(8, 9)}-${d.slice(9)}`;
  }
  const mesmoCPF = (a, b) => { const x = soDigitos(a), y = soDigitos(b); return !!x && x === y; };
  const mesmaEmpresa = (a, b) => { const x = raizCNPJ(a), y = raizCNPJ(b); return !!x && x === y; };

  /* ---------- data ---------- */

  const hoje = () => new Date().toISOString().slice(0, 10);
  const anoHoje = () => new Date().getFullYear();

  /* Qualquer data que o documento escreva vira AAAA-MM-DD, ou null. */
  function data(v) {
    if (!v) return null;
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    m = s.match(/^(\d{2})-(\d{2})-(\d{4})/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    return null;
  }

  /* Ano entre 1900 e 2100 achado em qualquer texto ou número. */
  function ano(v) {
    if (v === null || v === undefined) return null;
    const d = String(v).match(/(19|20)\d{2}/);
    return d ? Number(d[0]) : null;
  }

  function dataBR(v) { const d = data(v); return d ? d.split('-').reverse().join('/') : '—'; }

  /* Idade em anos completos na data de referência (padrão: hoje). */
