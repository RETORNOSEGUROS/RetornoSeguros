/* ===== 11-modelo.js ===== */
/* ===========================================================================
   CAMADA 1 — O EXERCÍCIO
   Reconhecer um campo pelo nome que vier, dar-lhe o tipo certo, e dizer se um
   exercício tem conteúdo. É a porta por onde todo dado entra — formulário ou
   arquivo, dá no mesmo. No sistema antigo havia duas portas, e a do import
   escapava de regras que só existiam na tela.
   =========================================================================== */
window.CO = window.CO || {};

CO.modelo = (function () {
  'use strict';
  const B = CO.base;

  /* Alguns campos o sistema calcula, mas o documento TAMBÉM imprime. Quando
     o documento traz, o número dele é guardado à parte e usado como fallback
     (P4: documento vence conta). É o caso da dívida bruta sem abertura por
     prazo — o balanço traz o total, e ele vale mais que nenhum. */
  const REDIRECIONA = { dividaBruta: 'dividaBrutaDeclarada' };

  /* Quem é este campo? Devolve null quando não reconhece — e quem chamou
     DECLARA o não reconhecido em vez de descartar calado (P1). */
  function reconhecer(nome) {
    if (!nome) return null;
    const bruto = String(nome).trim();
    if (REDIRECIONA[bruto]) return { campo: REDIRECIONA[bruto], como: 'exato', redirecionadoDe: bruto };
    if (CO.campos[bruto]) return { campo: bruto, como: 'exato' };

    const k = B.chave(bruto);
    const campo = CO.sinonimos[k];
    if (!campo) return null;
    if (REDIRECIONA[campo]) return { campo: REDIRECIONA[campo], como: 'sinonimo', redirecionadoDe: campo };

    const amb = CO.ambiguos[k];
    return amb
      ? { campo, como: 'ambiguo', tambemPodeSer: amb.tambemPodeSer }
      : { campo, como: 'sinonimo' };
  }

  /* O rótulo do dicionário explica o campo ("receita operacional líquida —
     a base de quase toda margem"); numa coluna de tabela ele não cabe. Nome
     curto é como o contador chama a linha no balanço. */
  const CURTOS = {
    receitaBruta: 'Receita bruta', deducoes: 'Deduções', receitaLiquida: 'Receita líquida',
    cmv: 'CMV', lucroBruto: 'Lucro bruto', despesasVendas: 'Despesas de vendas',
    despesasAdm: 'Despesas administrativas', outrasReceitas: 'Outras receitas',
    outrasDespesas: 'Outras despesas', depreciacaoAmortizacao: 'Depreciação do período',
    ebit: 'EBIT', ebitda: 'EBITDA', receitasFinanceiras: 'Receitas financeiras',
    despesasFinanceiras: 'Despesas financeiras', resultadoFinanceiro: 'Resultado financeiro',
    lucroAntesIR: 'Lucro antes do IR', ircs: 'IRPJ e CSLL', lucroLiquido: 'Lucro líquido',
    caixa: 'Caixa e bancos', aplicacoesFinanceirasCP: 'Aplicações financeiras',
    contasReceber: 'Contas a receber', estoques: 'Estoques', ativoCirculante: 'Ativo circulante',
    imobilizado: 'Imobilizado', intangivel: 'Intangível', realizavelLP: 'Realizável a longo prazo',
    investimentos: 'Investimentos', ativoNaoCirculante: 'Ativo não circulante', ativoTotal: 'Ativo total',
    contasPagar: 'Fornecedores', emprestimosCP: 'Empréstimos de curto prazo',
    emprestimosLP: 'Empréstimos de longo prazo', debentures: 'Debêntures',
    salariosPagar: 'Salários e encargos', impostosPagar: 'Impostos a pagar',
    passivoCirculante: 'Passivo circulante', passivoNaoCirculante: 'Passivo não circulante',
    passivoTotal: 'Passivo total', patrimonioLiquido: 'Patrimônio líquido',
    capitalSocial: 'Capital social', reservasLucro: 'Reservas de lucro',
    lucrosAcumulados: 'Lucros acumulados', dividaBruta: 'Dívida bruta',
    dividaLiquida: 'Dívida líquida', disponiveis: 'Disponibilidades',
    funcionarios: 'Funcionários', folhaAnual: 'Folha anual', encargosFolha: 'Encargos sobre a folha',
    distribuicaoLucros: 'Lucros distribuídos', premioSegurosAno: 'Prêmio de seguros no ano'
  };
  const nomeCurto = c => CURTOS[c] || (CO.campos[c] ? String(CO.campos[c].r || c).split(/[—(]/)[0].trim() : c);

  const def = c => CO.campos[c] || null;
  const tipoDe = c => (CO.campos[c] || {}).t || null;
  const rotuloDe = c => (CO.campos[c] || {}).r || c;
  const grupoDe = c => (CO.campos[c] || {}).g || null;
  const ehVigiado = c => !!(CO.campos[c] || {}).v;
  const ehDerivado = c => !!(CO.campos[c] || {}).d;
  const doGrupo = g => Object.keys(CO.campos).filter(c => CO.campos[c].g === g);

  /* O valor no tipo do campo. Devolve { valor, motivo } — motivo preenchido
     quando o valor foi recusado, para a tela poder dizer por quê.
     Nunca devolve 0 por não entender (P3). */
  function valorDe(campo, bruto) {
    const t = tipoDe(campo);
    if (bruto === null || bruto === undefined || bruto === '') return { valor: null };

    switch (t) {
      case 'dinheiro': case 'numero': case 'pctCru': {
        const n = B.num(bruto);
        return n === null ? { valor: null, motivo: 'não é número: ' + B.cortar(String(bruto), 40) } : { valor: n };
      }
      case 'inteiro': {
        const n = B.inteiro(bruto, 0, 1e9);
        return n === null ? { valor: null, motivo: 'não é uma contagem válida: ' + B.cortar(String(bruto), 40) } : { valor: n };
      }
      case 'bool': {
        if (typeof bruto === 'boolean') return { valor: bruto };
        const s = B.simples(bruto);
        if (['sim', 'true', '1', 'verdadeiro'].includes(s)) return { valor: true };
        if (['nao', 'false', '0', 'falso'].includes(s)) return { valor: false };
        return { valor: null, motivo: 'não é sim nem não: ' + B.cortar(String(bruto), 40) };
      }
      case 'lista':
        return Array.isArray(bruto) ? { valor: bruto } : { valor: null, motivo: 'esperava uma lista' };
      case 'objeto':
        return (bruto && typeof bruto === 'object' && !Array.isArray(bruto))
          ? { valor: bruto } : { valor: null, motivo: 'esperava um bloco de dados' };
      default: {
        const s = String(bruto).trim();
        return s ? { valor: s } : { valor: null };
      }
    }
  }

  /* Os campos que provam que o exercício tem conteúdo. Um ano com tudo zerado
     não é empresa com resultado nulo: é registro vazio — e o sistema antigo
     deu nota 100 para um desses (o 2026 em branco). */
  const PROVAS = ['receitaLiquida', 'receitaBruta', 'lucroLiquido', 'ativoTotal', 'patrimonioLiquido', 'ebitda', 'ebit'];

  function vazio(ex) {
    if (!ex) return true;
    return !PROVAS.some(c => {
      const n = B.num(ex[c]);
      return n !== null && n !== 0;
    });
  }

  /* O ano do exercício, ou null. Sem ano o exercício não entra. */
  const anoDe = ex => B.inteiro(ex && (ex.ano ?? B.ano(ex.dataBase)), 2000, 2100);

  /* Quais campos vigiados faltam neste exercício (P3: a lista vira bloqueio
     de indicador, não zero). */
  const ausentes = ex => CO.vigiados.filter(c => B.num(ex && ex[c]) === null);

  return {
    reconhecer, def, tipoDe, rotuloDe, grupoDe, ehVigiado, ehDerivado, doGrupo,
    valorDe, vazio, anoDe, ausentes, PROVAS, REDIRECIONA, nomeCurto, CURTOS
  };
})();


/* ===== 20-exercicio.js ===== */
/* ===========================================================================
   CAMADA 2 — O EXERCÍCIO E A PRECEDÊNCIA
   Um exercício guarda duas coisas separadas:
     doc  — o que o documento afirmou (ou a pessoa digitou)
     calc — o que a conta derivou a partir das outras linhas
   e `valor()` lê sempre doc primeiro. É o princípio P4 virado estrutura: o
   documento não "vence" por causa de um if espalhado pelo código, vence
   porque mora noutro lugar.

   O sistema antigo não tinha essa separação. Guardava os totais do documento
   num armário à parte (ANCORAS_DOC) e marcava no HTML quem tinha escrito em
   cada campo (data-calc), porque o cálculo rodava dentro da tela. Daí vieram
   dois defeitos: a receita bruta virou lucro líquido na AUTOMASUL (o valor de
   passagem de uma conta ainda incompleta foi tratado como documento) e o
   import escapava das regras que só existiam no formulário.

   Aqui não há tela: montar um exercício é uma função pura. O mesmo arquivo
   dá sempre o mesmo resultado, digitado ou importado.
   =========================================================================== */
window.CO = window.CO || {};

CO.exercicio = (function () {
  'use strict';
  const B = CO.base, M = CO.modelo;

  /* Diferença que ainda é arredondamento: 1 real ou 0,5% do valor declarado. */
  const TOLERANCIA = 0.005;
  const tolerancia = v => Math.max(1, Math.abs(B.num(v) || 0) * TOLERANCIA);

  function criar(ano) {
    return {
      ano: B.inteiro(ano, 2000, 2100),
      doc: {},          // afirmado pelo documento ou digitado
      calc: {},         // derivado pela conta
      origem: {},       // campo → como foi derivado, em português
      marcas: {},       // campo → 'interpretado' | 'naoConsta' | 'piso'
      pendencias: [],   // soma de subcontas ≠ total declarado
      recusas: [],      // o que não deu para calcular, e por quê
      ausentes: [],
      naoReconhecidos: []
    };
  }

  /* ---------- leitura ---------- */

  const valor = (ex, campo) => {
    if (!ex) return null;
    const d = ex.doc[campo];
    if (d !== undefined && d !== null) return d;
    const c = ex.calc[campo];
    return (c === undefined) ? null : c;
  };
  const n = (ex, campo) => B.num(valor(ex, campo));
  const tem = (ex, campo) => n(ex, campo) !== null;
  const doDocumento = (ex, campo) => ex.doc[campo] !== undefined && ex.doc[campo] !== null;
  const derivado = (ex, campo) => !doDocumento(ex, campo) && ex.calc[campo] !== undefined;

  /* Soma de campos deste exercício, propagando o ausente. */
  const somar = (ex, ...campos) => B.soma(campos.flat().map(c => n(ex, c)));

  /* ---------- escrita ---------- */

  /* O documento afirma. Valor que não serve é recusado com motivo — nunca
     vira zero, nunca some em silêncio (P1, P3). */
  function afirmar(ex, campo, bruto, marca) {
    const { valor: v, motivo } = M.valorDe(campo, bruto);
    if (v === null) {
      if (motivo) ex.recusas.push({ campo, motivo });
      return false;
    }
    ex.doc[campo] = v;
    if (marca) ex.marcas[campo] = marca;
    return true;
  }

  /* A conta deriva. Só preenche o que o documento não trouxe (P4), e sempre
     deixa escrito como chegou ali. */
  function derivar(ex, campo, v, explicacao) {
    const x = B.num(v);
    if (x === null) return false;
    if (doDocumento(ex, campo)) return false;
    ex.calc[campo] = x;
    ex.origem[campo] = explicacao || 'calculado';
    return true;
  }

  /* O total e suas subcontas.
     - documento trouxe o total → o total manda; se a soma das subcontas
       discordar acima da tolerância, nasce uma PENDÊNCIA NOMEADA ("faltam
       R$ X em subcontas do ativo circulante"), nunca um ajuste calado
     - documento não trouxe → a soma preenche
     - nada veio → continua ausente (soma de nada não é zero) */
  function fechar(ex, campo, soma, explicacao, bloco) {
    const s = B.num(soma);
    if (!doDocumento(ex, campo)) {
      if (s === null) return null;
      derivar(ex, campo, s, explicacao);
      return null;
    }
    const d = B.num(ex.doc[campo]);
    if (s === null || d === null) return null;
    const falta = B.centavos(d - s);
    if (Math.abs(falta) <= tolerancia(d)) return null;
    const p = { campo, bloco: bloco || M.nomeCurto(campo), documento: d, somado: s, falta };
    /* a derivação roda em passadas até estabilizar: a mesma pendência não
       pode ser registrada uma vez por passada */
    const ja = ex.pendencias.findIndex(x => x.campo === campo);
    if (ja >= 0) ex.pendencias[ja] = p; else ex.pendencias.push(p);
    return p;
  }

  /* O que não deu para calcular, dito em português. Uma recusa explícita vale
     mais que um número bom e falso (A5). */
  function recusar(ex, campo, motivo, oQuePedir) {
    ex.recusas.push({ campo, motivo, oQuePedir: oQuePedir || null });
  }

  /* ---------- fechamento ---------- */

  /* Antes de gravar: lista os vigiados que faltam. Eles NÃO viram zero — a
     ausência é que bloqueia o indicador lá na frente (P3). */
  function marcarAusentes(ex) {
    ex.ausentes = CO.vigiados.filter(c => n(ex, c) === null);
    return ex.ausentes;
  }

  /* O objeto achatado que vai para o banco: doc + calc num plano só, com os
     centavos arredondados e sem campo vazio. */
  function paraGravar(ex) {
    const fora = {};
    for (const campo of Object.keys(CO.campos)) {
      const v = valor(ex, campo);
      if (v === null || v === undefined || v === '') continue;
      fora[campo] = (M.tipoDe(campo) === 'dinheiro') ? B.centavos(v) : v;
    }
    fora.ano = ex.ano;
    fora.camposAusentes = ex.ausentes;
    fora.camposAusentesEm = B.hoje();
    if (ex.pendencias.length) fora.pendenciasSubcontas = ex.pendencias;
    if (Object.keys(ex.origem).length) fora.camposCalculados = Object.keys(ex.origem);
    if (Object.keys(ex.marcas).length) fora.marcasCampos = ex.marcas;
    return fora;
  }

  /* O caminho de volta: um registro do banco vira exercício outra vez. O que
     foi gravado como calculado volta para `calc`; o resto volta para `doc` —
     senão reabrir um ano já conferido desfaria os totais em cima de subcontas
     parciais, que é exatamente o que acontecia antes. */
  function doBanco(reg) {
    const ex = criar(reg.ano ?? B.ano(reg.dataBase));
    const calculados = new Set(reg.camposCalculados || []);
    for (const campo of Object.keys(CO.campos)) {
      const v = reg[campo];
      if (v === null || v === undefined || v === '') continue;
      (calculados.has(campo) ? ex.calc : ex.doc)[campo] = v;
    }
    ex.marcas = reg.marcasCampos || {};
    ex.pendencias = reg.pendenciasSubcontas || [];
    ex.ausentes = reg.camposAusentes || [];
    ex.doBanco = true;
    return ex;
  }

  return {
    criar, valor, n, tem, doDocumento, derivado, somar,
    afirmar, derivar, fechar, recusar, marcarAusentes, paraGravar, doBanco,
    tolerancia, TOLERANCIA
  };
})();


/* ===== 21-derivar.js ===== */
/* ===========================================================================
   CAMADA 2 — DERIVAÇÕES
   O que a conta consegue preencher sozinha, e só onde o documento calou.

   No sistema antigo isto vivia em duas camadas que se sobrepunham (16 regras
   no adaptador do import + 14 no autocálculo da tela), com resultados
   diferentes conforme o dado tivesse entrado digitado ou importado. Aqui é
   uma passada só, igual para os dois caminhos.

   Três regras moldam o arquivo inteiro:
   · nenhuma derivação substitui número declarado (P4)
   · derivação com termo ausente NÃO acontece — não vira zero (P3)
   · o que foi derivado fica dito em português, para a tela marcar o número
     como calculado e não como lido do balanço
   =========================================================================== */
window.CO = window.CO || {};

CO.derivar = (function () {
  'use strict';
  const B = CO.base, E = CO.exercicio;

  /* Divergência aceita entre os dois caminhos do EBIT antes de desistir. */
  const DIVERGENCIA_EBIT = 0.05;

  function umaPassada(ex) {
    const antes = JSON.stringify(ex.calc);
    const n = c => E.n(ex, c);
    const temDoc = c => E.doDocumento(ex, c);

    /* ---------- receita ---------- */

    E.fechar(ex, 'receitaBruta',
      E.somar(ex, 'receitaMercadorias', 'receitaServicos', 'exportacaoAno', 'receitaOutrasVendas'),
      'soma das receitas brutas por natureza', 'receita bruta');

    E.fechar(ex, 'deducoes',
      E.somar(ex, 'devolucoes', 'impostoICMS', 'impostoISS', 'impostoPIS', 'impostoCOFINS', 'impostoOutrosVendas'),
      'soma dos impostos sobre vendas e das devoluções', 'deduções da receita');

    /* Receita bruta SEM dedução lançada não é receita líquida: a bruta é, em
       média, 20% maior. Só deriva quando existe ao menos uma dedução — aí a
       outra, se faltar, entra como zero. */
    if (!temDoc('receitaLiquida') && n('receitaBruta') !== null && (n('deducoes') !== null || n('devolucoes') !== null)) {
      const ded = n('deducoes') !== null ? n('deducoes') : n('devolucoes');
      E.derivar(ex, 'receitaLiquida', n('receitaBruta') - ded, 'receita bruta menos as deduções');
    }

    /* ---------- custo e resultado bruto ---------- */

    E.fechar(ex, 'lucroBruto', B.menos(n('receitaLiquida'), n('cmv')), 'receita líquida menos o CMV');
    if (!temDoc('cmv')) E.derivar(ex, 'cmv', B.menos(n('receitaLiquida'), n('lucroBruto')), 'receita líquida menos o lucro bruto');

    /* ---------- resultado financeiro ---------- */

    if (n('receitasFinanceiras') !== null || n('despesasFinanceiras') !== null) {
      E.fechar(ex, 'resultadoFinanceiro',
        B.soma(n('receitasFinanceiras') || 0, -(n('despesasFinanceiras') || 0)),
        'receitas financeiras menos despesas financeiras');
    }

    /* ---------- EBIT: dois caminhos que precisam concordar ----------
       A depreciação NÃO entra aqui: na DRE brasileira a D&A já está dentro do
       CMV e das despesas operacionais. Subtraí-la de novo contaria duas vezes.
       Ela só reaparece somando, no EBITDA. */
    if (!temDoc('ebit')) {
      const opex = E.somar(ex, 'despesasVendas', 'despesasAdm', 'despesasTributarias', 'outrasDespesas');
      /* O EBIT brasileiro fica ANTES das outras receitas operacionais: na
         AUTOMASUL, lucro bruto menos as quatro despesas dá exatamente o EBIT
         publicado, e as outras receitas aparecem só na conta do LAIR. */
      const cima = (n('lucroBruto') !== null && opex !== null && opex > 0)
        ? n('lucroBruto') - opex : null;
      const rf = n('resultadoFinanceiro');
      const baixo = (n('lucroAntesIR') !== null && rf !== null)
        ? n('lucroAntesIR') - rf - (n('outrasReceitas') || 0) : null;

      if (cima !== null && baixo !== null) {
        const div = Math.abs(cima - baixo) / Math.max(Math.abs(cima), Math.abs(baixo), 1);
        if (div <= DIVERGENCIA_EBIT) {
          E.derivar(ex, 'ebit', cima, 'lucro bruto menos as despesas operacionais');
        } else if (!ex.recusas.some(r => r.campo === 'ebit')) {
          /* Dois caminhos, dois números distantes: o sistema não escolhe. Foi
             assim que um EBIT de R$ 17,3 mi virou R$ 39,5 mi — o pacote tinha
             o lucro bruto mas não tinha despesas de vendas nem administrativas. */
          E.recusar(ex, 'ebit',
            `os dois caminhos discordam: por cima dá ${B.dinheiro(cima)}, por baixo ${B.dinheiro(baixo)} (${B.pct(div)} de diferença)`,
            'as despesas operacionais abertas (vendas, administrativas, tributárias)');
        }
      } else if (baixo !== null) {
        E.derivar(ex, 'ebit', baixo, 'LAIR menos o resultado financeiro');
      } else if (cima !== null) {
        E.derivar(ex, 'ebit', cima, 'lucro bruto menos as despesas operacionais');
      }
    }

    /* ---------- EBITDA: só com depreciação declarada ----------
       Derivar EBITDA = EBIT sem D&A seria afirmar que a empresa não tem
       máquina nenhuma. Quando falta, quem resolve é o PISO (arquivo 22), que
       é decisão explícita e marcada — não derivação silenciosa. */
    if (n('depreciacaoAmortizacao') !== null && n('depreciacaoAmortizacao') > 0) {
      E.fechar(ex, 'ebitda', B.soma(n('ebit'), n('depreciacaoAmortizacao')), 'EBIT mais a depreciação e amortização do período');
    }

    /* ---------- do EBIT ao lucro líquido ---------- */

    E.fechar(ex, 'lucroAntesIR',
      B.soma(n('ebit'), n('resultadoFinanceiro'), n('outrasReceitas')),
      'EBIT mais o resultado financeiro e as outras receitas operacionais');
    if (!temDoc('ircs')) E.derivar(ex, 'ircs', B.menos(n('lucroAntesIR'), n('lucroLiquido')), 'LAIR menos o lucro líquido');
    E.fechar(ex, 'lucroLiquido', B.menos(n('lucroAntesIR'), n('ircs')), 'LAIR menos o IRPJ e a CSLL');

    /* ---------- balanço: ativo ---------- */

    E.fechar(ex, 'ativoCirculante',
      B.soma(E.somar(ex, 'caixa', 'aplicacoesFinanceirasCP', 'contasReceber', 'estoques',
        'impostosRecuperar', 'adiantamentoFornecedores', 'despesasAntecipadas', 'outrosAC'),
        n('pdd') !== null ? -n('pdd') : null),
      'soma das contas do circulante', 'ativo circulante');

    E.fechar(ex, 'ativoNaoCirculante',
      B.soma(E.somar(ex, 'realizavelLP', 'investimentos', 'intangivel'),
        B.menos(n('imobilizado'), n('depreciacao') !== null ? n('depreciacao') : 0)),
      'realizável a longo prazo, investimentos, imobilizado líquido e intangível', 'ativo não circulante');

    E.fechar(ex, 'ativoTotal', B.soma(n('ativoCirculante'), n('ativoNaoCirculante')),
      'circulante mais não circulante', 'ativo total');
    if (!temDoc('ativoNaoCirculante')) E.derivar(ex, 'ativoNaoCirculante', B.menos(n('ativoTotal'), n('ativoCirculante')), 'ativo total menos o circulante');

    /* ---------- balanço: passivo e PL ---------- */

    E.fechar(ex, 'passivoCirculante',
      E.somar(ex, 'contasPagar', 'emprestimosCP', 'salariosPagar', 'impostosPagar',
        'parcelamentosCP', 'adiantamentoClientes', 'dividendosPagar', 'provisoesCP', 'outrosPC'),
      'soma das obrigações do circulante', 'passivo circulante');

    E.fechar(ex, 'passivoNaoCirculante',
      E.somar(ex, 'emprestimosLP', 'debentures', 'provisoesLP', 'outrosPNC'),
      'soma das obrigações de longo prazo', 'passivo não circulante');

    E.fechar(ex, 'passivoTotal', B.soma(n('passivoCirculante'), n('passivoNaoCirculante')),
      'passivo circulante mais não circulante', 'passivo total');

    E.fechar(ex, 'patrimonioLiquido',
      E.somar(ex, 'capitalSocial', 'reservasCapital', 'reservasIncentivos', 'reservasLucro',
        'lucrosAcumulados', 'ajustesAvaliacao'),
      'soma das contas do patrimônio líquido', 'patrimônio líquido');

    /* PL como conta de fechamento — só quando o documento não trouxe nem o PL
       nem suas contas. */
    if (!temDoc('patrimonioLiquido') && E.n(ex, 'patrimonioLiquido') === null) {
      E.derivar(ex, 'patrimonioLiquido', B.menos(n('ativoTotal'), n('passivoTotal')), 'ativo total menos o passivo total');
    }

    E.fechar(ex, 'passivoMaisPL', B.soma(n('passivoTotal'), n('patrimonioLiquido')),
      'passivo total mais o patrimônio líquido', 'passivo + PL');

    /* ---------- dívida e disponibilidades ---------- */

    const dividaSomada = E.somar(ex, 'emprestimosCP', 'emprestimosLP', 'debentures');
    if (dividaSomada !== null) {
      E.fechar(ex, 'dividaBruta', dividaSomada, 'empréstimos de curto e longo prazo mais debêntures', 'dívida bruta');
    } else if (n('dividaBrutaDeclarada') !== null) {
      E.derivar(ex, 'dividaBruta', n('dividaBrutaDeclarada'), 'dívida informada sem abertura por prazo');
    }
    E.derivar(ex, 'disponiveis', E.somar(ex, 'caixa', 'aplicacoesFinanceirasCP'), 'caixa mais aplicações de curto prazo');
    E.derivar(ex, 'dividaLiquida', B.menos(n('dividaBruta'), n('disponiveis') !== null ? n('disponiveis') : 0),
      'dívida bruta menos as disponibilidades');

    return JSON.stringify(ex.calc) !== antes;
  }

  /* Derivação encadeia: o CMV destrava o lucro bruto, que destrava o EBIT, que
     destrava o LAIR. Três passadas bastam para estabilizar qualquer cadeia
     deste conjunto; o laço para assim que nada mais muda. */
  function tudo(ex) {
    for (let i = 0; i < 3 && umaPassada(ex); i++);
    fecharBalanco(ex);
    return ex;
  }

  /* O balanço fecha? A diferença é informação do corretor, não conserto. */
  function fecharBalanco(ex) {
    const at = E.n(ex, 'ativoTotal'), pmpl = E.n(ex, 'passivoMaisPL');
    if (at === null || pmpl === null) return;
    const dif = B.centavos(at - pmpl);
    ex.calc.balancoDiferenca = dif;
    ex.calc.balancoFecha = Math.abs(dif) < Math.max(1, Math.abs(at) * E.TOLERANCIA);
    ex.origem.balancoDiferenca = 'ativo total menos (passivo + PL)';
  }

  return { tudo, umaPassada, fecharBalanco, DIVERGENCIA_EBIT };
})();


/* ===== 22-indicadores.js ===== */
/* ===========================================================================
   CAMADA 2 — EBITDA PISO E INDICADORES

   Dois defeitos do sistema antigo morrem aqui.

   1. Havia DOIS conjuntos de indicadores que não batiam: um gravado no
      exercício e outro recalculado a cada análise, com fórmulas diferentes
      para o mesmo nome (a liquidez gravada dividia pelo passivo circulante; a
      de leitura, pelos fornecedores — 3,25 contra 2,50 na AUTOMASUL, e o
      número errado ainda somava pontos no score). Aqui existe um conjunto só.

   2. Indicador com termo ausente saía 0,0%. Agora sai ausente, com o motivo
      escrito ao lado: quem lê a tela vê "falta o EBITDA", não "margem zero".
   =========================================================================== */
window.CO = window.CO || {};

CO.indicadores = (function () {
  'use strict';
  const B = CO.base, E = CO.exercicio;

  const ALIQUOTA_PADRAO = 0.34;   // IRPJ + CSLL no lucro real
  const FATOR_NOPAT = 0.66;       // 1 − 34%
  const CMV_ESTIMADO = 0.70;      // só para o ciclo, e sempre declarado

  /* ---------- EBITDA piso ----------
     A depreciação é sempre ≥ 0, logo EBITDA ≥ EBIT, sempre. Quando a DRE não
     abre a D&A, usar o EBIT é usar o MENOR valor que o EBITDA pode ter: a
     alavancagem sai igual ou pior que a real, nunca melhor. É o que um
     analista de crédito faz. "R$ 0" era falso; "não informado" tornava a
     empresa inanalisável; o piso é verdadeiro e conservador — e a tela diz
     sempre que é piso.

     Repare na assimetria, que é deliberada: derivar EBITDA = EBIT dentro das
     contas (arquivo 21) é proibido, porque seria afirmar em silêncio que a
     empresa não tem máquina nenhuma. Assumir o piso aqui, marcado e dito, é
     permitido. */
  function aplicarPisoEbitda(ex) {
    const ebitda = E.n(ex, 'ebitda'), ebit = E.n(ex, 'ebit'), da = E.n(ex, 'depreciacaoAmortizacao');
    const precisa = !(ebitda > 0) && ebit > 0 && !(da > 0);
    if (!precisa) { ex.calc.ebitdaPiso = false; return false; }
    ex.calc.ebitda = ebit;
    ex.calc.ebitdaPiso = true;
    ex.origem.ebitda = 'piso: igual ao EBIT, porque a DRE não abre a depreciação';
    ex.marcas.ebitda = 'piso';
    return true;
  }

  /* ---------- o conjunto ---------- */

  function calcular(ex) {
    const n = c => E.n(ex, c);
    const meses = B.num(E.valor(ex, 'periodoMeses')) || 12;
    const fa = meses > 0 && meses < 12 ? 12 / meses : 1;   // anualiza período parcial

    const I = { _fa: fa, _bloqueios: {}, _marcas: {} };

    /* Guarda o indicador, ou o motivo de ele não existir. Um indicador que
       não pode ser calculado é informação sobre o documento, não sobre a
       empresa — e é assim que aparece na tela. */
    const põe = (nome, valor, faltou) => {
      if (valor === null || valor === undefined || !Number.isFinite(valor)) {
        I[nome] = null;
        if (faltou) I._bloqueios[nome] = 'falta ' + faltou;
      } else I[nome] = valor;
      return I[nome];
    };
    const falta = (...cs) => B.lista(cs.filter(c => n(c) === null).map(c => CO.modelo.nomeCurto(c)));

    const rl = n('receitaLiquida'), rlA = rl === null ? null : rl * fa;
    const pc = n('passivoCirculante'), ac = n('ativoCirculante'), at = n('ativoTotal');
    const pl = n('patrimonioLiquido'), ll = n('lucroLiquido'), ebitda = n('ebitda'), ebit = n('ebit');
    const dl = n('dividaLiquida'), db = n('dividaBruta'), pt = n('passivoTotal');

    /* margens */
    põe('margemBruta', B.divide(n('lucroBruto'), rl), falta('lucroBruto', 'receitaLiquida'));
    põe('margemEbitda', ebitda > 0 ? B.divide(ebitda, rl) : null, falta('ebitda', 'receitaLiquida'));
    põe('margemOperacional', B.divide(ebit, rl), falta('ebit', 'receitaLiquida'));
    põe('margemLiquida', B.divide(ll, rl), falta('lucroLiquido', 'receitaLiquida'));
    if (E.valor(ex, 'ebitdaPiso') === true) I._marcas.margemEbitda = 'calculada sobre o EBITDA piso';

    /* endividamento */
    põe('alavancagem', ebitda > 0 ? B.divide(dl, ebitda * fa) : null, falta('dividaLiquida', 'ebitda'));
    põe('dividaLiquidaSobrePL', B.divide(dl, pl), falta('dividaLiquida', 'patrimonioLiquido'));
    põe('endividamento', B.divide(db, at), falta('dividaBruta', 'ativoTotal'));
    põe('endividamentoGeral', B.divide(pt, at), falta('passivoTotal', 'ativoTotal'));
    põe('composicaoEndividamento', B.divide(pc, pt), falta('passivoCirculante', 'passivoTotal'));
    põe('capitalTerceirosSobreProprio', B.divide(pt, pl), falta('passivoTotal', 'patrimonioLiquido'));

    /* liquidez — sempre pelo passivo circulante.
       Dividir pelos fornecedores ignora empréstimo de curto prazo, salário,
       imposto e adiantamento. Só vale quando o PC não foi lançado, e aí o
       índice sai marcado como aproximado. */
    const denom = pc > 0 ? pc : (n('contasPagar') > 0 ? n('contasPagar') : null);
    if (!(pc > 0) && denom) I._marcas.liquidez = 'aproximada: dividida pelos fornecedores, porque o passivo circulante não foi lançado';
    const acUsar = ac !== null ? ac : E.somar(ex, 'caixa', 'contasReceber', 'estoques');
    põe('liquidezCorrente', B.divide(acUsar, denom), falta('ativoCirculante', 'passivoCirculante'));
    põe('liquidezSeca', B.divide(B.menos(acUsar, n('estoques')), denom), falta('ativoCirculante', 'estoques', 'passivoCirculante'));
    põe('liquidezImediata', B.divide(n('disponiveis'), denom), falta('caixa', 'passivoCirculante'));
    põe('liquidezGeral', B.divide(B.soma(ac, n('realizavelLP')), pt), falta('ativoCirculante', 'passivoTotal'));
    const naoRealiz = n('naoRealizaveis');
    if (naoRealiz > 0) põe('liquidezAjustada', B.divide(B.menos(acUsar, naoRealiz), denom));

    /* rentabilidade */
    const llA = ll === null ? null : ll * fa;
    const roe = põe('roe', pl > 0 ? B.divide(llA, pl) : null, falta('lucroLiquido', 'patrimonioLiquido'));
    const roa = põe('roa', at > 0 ? B.divide(llA, at) : null, falta('lucroLiquido', 'ativoTotal'));
    const capitalInvestido = B.soma(pl, db);
    põe('roic', capitalInvestido > 0 && ebit !== null ? B.divide(ebit * fa * FATOR_NOPAT, capitalInvestido) : null, falta('ebit', 'patrimonioLiquido'));
    põe('giroAtivo', at > 0 ? B.divide(rlA, at) : null, falta('receitaLiquida', 'ativoTotal'));
    põe('giroPL', pl > 0 ? B.divide(rlA, pl) : null, falta('receitaLiquida', 'patrimonioLiquido'));
    põe('alavancagemFinanceira', pl > 0 ? B.divide(at, pl) : null, falta('ativoTotal', 'patrimonioLiquido'));
    põe('grauAlavancagemFinanceira', roa > 0 ? B.divide(roe, roa) : null);
    põe('imobilizacaoPL', pl > 0 ? B.divide(n('imobilizado'), pl) : null, falta('imobilizado', 'patrimonioLiquido'));
    põe('imobilizacaoRecursosNaoCorrentes', B.divide(n('ativoNaoCirculante'), B.soma(pl, n('passivoNaoCirculante'))), falta('ativoNaoCirculante'));

    /* cobertura de juros — sobre o EBITDA, inclusive quando ele é piso */
    põe('coberturaJuros', n('despesasFinanceiras') > 0 && ebitda > 0 ? B.divide(ebitda, n('despesasFinanceiras')) : null,
      falta('ebitda', 'despesasFinanceiras'));

    /* ciclo — o único lugar onde um CMV estimado é aceito, e sempre declarado */
    let cmvUsar = n('cmv');
    if (cmvUsar === null && rl !== null) { cmvUsar = rl * CMV_ESTIMADO; I._marcas.ciclo = 'CMV estimado em 70% da receita, porque a DRE não o abre'; }
    cmvUsar = cmvUsar === null ? null : cmvUsar * fa;
    const pme = (cmvUsar > 0 && n('estoques') !== null) ? B.divide(n('estoques') * 365, cmvUsar) : null;
    const pmr = rlA > 0 ? B.divide(n('contasReceber') * 360, rlA) : null;
    const pmp = cmvUsar > 0 ? B.divide(n('contasPagar') * 360, cmvUsar) : null;
    põe('prazoMedioEstoque', pme, falta('estoques', 'cmv'));
    põe('prazoMedioRecebimento', pmr, falta('contasReceber', 'receitaLiquida'));
    põe('prazoMedioPagamento', pmp, falta('contasPagar', 'cmv'));
    põe('cicloOperacional', B.soma(pme, pmr));
    põe('cicloFinanceiro', B.menos(B.soma(pme, pmr), pmp));

    /* capital de giro */
    põe('capitalCirculanteLiquido', B.menos(ac, pc), falta('ativoCirculante', 'passivoCirculante'));
    const ncg = põe('necessidadeCapitalGiro', B.menos(B.soma(n('contasReceber'), n('estoques')), n('contasPagar')),
      falta('contasReceber', 'estoques', 'contasPagar'));
    põe('necessidadeCapitalGiroSobreReceita', B.divide(ncg, rlA));
    põe('saldoTesouraria', B.menos(I.capitalCirculanteLiquido, ncg));

    /* alíquota efetiva — só se plausível; fora da faixa, o padrão do lucro real */
    const lair = n('lucroAntesIR'), ircs = n('ircs');
    const efetiva = (lair > 0 && ircs !== null) ? ircs / lair : null;
    I.aliquotaEfetiva = (efetiva !== null && efetiva >= 0.01 && efetiva <= 0.60) ? efetiva : null;
    I.aliquotaUsada = I.aliquotaEfetiva ?? ALIQUOTA_PADRAO;
    if (I.aliquotaEfetiva === null) I._marcas.aliquota = 'alíquota efetiva fora da faixa plausível (1% a 60%): usando 34%';

    return I;
  }

  /* Os que vão gravados no exercício (os mesmos — não há segundo conjunto). */
  const GRAVADOS = ['margemBruta', 'margemEbitda', 'margemOperacional', 'margemLiquida',
    'alavancagem', 'liquidezCorrente', 'liquidezSeca', 'liquidezImediata', 'liquidezGeral',
    'roe', 'roa', 'roic', 'giroAtivo', 'endividamentoGeral', 'composicaoEndividamento',
    'imobilizacaoPL', 'coberturaJuros', 'capitalTerceirosSobreProprio', 'grauAlavancagemFinanceira'];

  return { calcular, aplicarPisoEbitda, GRAVADOS, ALIQUOTA_PADRAO, FATOR_NOPAT, CMV_ESTIMADO };
})();


/* ===== 23-montar.js ===== */
/* ===========================================================================
   CAMADA 2 — A PORTA ÚNICA
   Recebe campos como vierem (digitados ou de arquivo) e devolve o exercício
   pronto: reconhecido, derivado, com piso de EBITDA, indicadores, pendências
   e a lista do que falta.

   É função pura: sem tela, sem evento, sem ordem de preenchimento. O mesmo
   dado dá sempre o mesmo exercício.

   Por que isso importa: no sistema antigo o cálculo rodava dentro do
   formulário, a cada tecla. Quem digitava a DRE de cima para baixo punha a
   receita bruta antes do custo, e naquele instante a conta dizia
   "lucro bruto = receita bruta" e gravava — e o valor de passagem ficava
   travado, levando junto EBIT, LAIR e lucro líquido. Foi assim que a receita
   bruta virou lucro líquido na AUTOMASUL. Aqui não há instante intermediário:
   ou o documento afirmou, ou a conta derivou ao final.
   =========================================================================== */
window.CO = window.CO || {};

CO.montar = (function () {
  'use strict';
  const B = CO.base, M = CO.modelo, E = CO.exercicio, D = CO.derivar, IND = CO.indicadores;

  /* Textos que a IA escreve quando não achou o número. Leem como ausente —
     nunca como zero. */
  const SEM_VALOR = new Set(['nd', 'na', 'naoconsta', 'naoinformado', 'naoaplicavel',
    'indisponivel', 'semvalor', 'null', 'nulo', '-', '--', '---', '0x', 'x']);

  const vazioDeclarado = v => typeof v === 'string' && (SEM_VALOR.has(B.chave(v)) || B.chave(v) === '');

  /* dados: objeto { nomeQualquer: valor }. opcoes.marcas: { campo: 'naoConsta' } */
  function exercicio(dados, opcoes) {
    const o = opcoes || {};
    const ex = E.criar(o.ano ?? dados.ano ?? dados.exercicio ?? B.ano(dados.dataBase));

    for (const [nome, bruto] of Object.entries(dados || {})) {
      if (nome === 'ano' || nome === 'exercicio') continue;
      if (bruto === null || bruto === undefined) continue;

      const achou = M.reconhecer(nome);
      if (!achou) {
        /* P1: o que não se reconhece é DECLARADO, nunca descartado calado. */
        ex.naoReconhecidos.push({ nome, valor: typeof bruto === 'object' ? '(bloco)' : B.cortar(String(bruto), 60) });
        continue;
      }
      if (vazioDeclarado(bruto)) { ex.marcas[achou.campo] = 'naoConsta'; continue; }

      E.afirmar(ex, achou.campo, bruto, achou.como === 'ambiguo' ? 'interpretado' : null);
      if (achou.como === 'ambiguo') {
        ex.recusas.push({
          campo: achou.campo, aviso: true,
          motivo: `"${nome}" também poderia ser ${B.lista(achou.tambemPodeSer.map(c => M.rotuloDe(c)))} — entrou como ${M.rotuloDe(achou.campo)}`,
          oQuePedir: 'confira esta linha no documento'
        });
      }
    }

    if (o.marcas) for (const [campo, marca] of Object.entries(o.marcas)) ex.marcas[campo] = marca;

    D.tudo(ex);
    IND.aplicarPisoEbitda(ex);
    ex.indicadores = IND.calcular(ex);
    E.marcarAusentes(ex);
    ex.vazio = M.vazio({ ...ex.doc, ...ex.calc });
    return ex;
  }

  /* Correção pontual: um arquivo que traz poucos campos para um ano já
     gravado não apaga o resto — mescla e recalcula tudo. Foi o caso de mandar
     só a depreciação de 2024 e o sistema zerar o balanço inteiro. */
  function correcao(registroGravado, camposNovos) {
    const base = {};
    for (const campo of Object.keys(CO.campos)) {
      const v = registroGravado[campo];
      if (v !== null && v !== undefined && v !== '' && !M.ehDerivado(campo)) base[campo] = v;
    }
    /* o que a conta derivou da última vez não pode travar a conta de agora */
    for (const campo of (registroGravado.camposCalculados || [])) delete base[campo];
    return exercicio({ ...base, ...camposNovos }, { ano: registroGravado.ano });
  }

  return { exercicio, correcao, vazioDeclarado, SEM_VALOR };
})();


/* ===== 24-travas.js ===== */
/* ===========================================================================
   CAMADA 2 — TRAVAS
   O que a análise não pode imprimir. Três níveis, e a separação entre eles é
   o que organiza tudo:

     IMPOSSÍVEL — a aritmética não fecha. Não é opinião sobre a empresa, é
                  erro de leitura do documento. Não grava, não analisa, não
                  dá nota.
     AUSENTE    — o campo não veio. Não é zero. A análise roda, mas o
                  indicador que depende dele não é impresso.
     ESTRANHO   — é possível, mas raro. Imprime com a ressalva.

   O que a trava NUNCA faz: consertar. Não escolhe qual número está certo,
   não chuta o campo que falta, não ajusta para fechar. Para e diz o que não
   bate — e com qual linha do documento se resolve.

   Existe porque o PDF da AUTOMASUL saiu com lucro líquido maior que a receita
   em três exercícios seguidos, margem bruta de 100%, EBITDA de R$ 0, dívida
   de R$ 0 numa empresa com R$ 150 milhões de ativo — e, no fim, score 69/100
   e um glossário explicando o EBITDA zero como se fosse um achado.
   =========================================================================== */
window.CO = window.CO || {};

CO.travas = (function () {
  'use strict';
  const B = CO.base, E = CO.exercicio;

  const IGUALDADE = 0.01;      // 1%
  const MATERIALIDADE = 0.005; // 0,5%
  const RECEITA_MINIMA = 1000000;

  function conferir(ex, opcoes) {
    const o = opcoes || {};
    const n = c => E.n(ex, c);
    const impossiveis = [], estranhezas = [], ausencias = [];

    const trava = (cond, oQue, porque, oQuePedir) => {
      if (cond) impossiveis.push({ oQue, porque, oQuePedir });
    };

    const rl = n('receitaLiquida'), rb = n('receitaBruta'), ll = n('lucroLiquido');
    const lb = n('lucroBruto'), at = n('ativoTotal'), pl = n('patrimonioLiquido');

    /* --- impossibilidades --- */

    trava(rb > 0 && rl > rb * 1.01,
      'Receita líquida maior que a bruta',
      `líquida ${B.dinheiro(rl)} contra bruta ${B.dinheiro(rb)}`,
      'um dos dois campos recebeu o número do outro, ou vieram de anos diferentes');

    trava(rl > 0 && lb > rl * 1.01,
      'Lucro bruto maior que a receita líquida',
      `lucro bruto ${B.dinheiro(lb)} contra receita ${B.dinheiro(rl)}`,
      'confira a linha do resultado bruto na DRE');

    trava(rl > 0 && ll > 0 && ll > rl * 1.01,
      'Lucro líquido maior que a receita',
      `lucro ${B.dinheiro(ll)} contra receita ${B.dinheiro(rl)}`,
      'em quase todos os casos é a receita bruta gravada no campo do lucro líquido');

    trava(rl > 0 && lb !== null && Math.abs(lb - rl) <= rl * IGUALDADE && !E.doDocumento(ex, 'cmv'),
      'Margem bruta de 100% porque o custo não veio',
      'lucro bruto igual à receita líquida e CMV ausente',
      'o CMV (custo das mercadorias ou dos serviços vendidos) da DRE');

    const ac = n('ativoCirculante'), anc = n('ativoNaoCirculante');
    if (!o.lista) {
      trava(at > 0 && ac !== null && anc !== null && Math.abs((ac + anc) - at) > at * IGUALDADE,
        'O ativo não fecha',
        `circulante mais não circulante dá ${B.dinheiro(ac + anc)}, mas o ativo total é ${B.dinheiro(at)}`,
        'confira os subtotais do ativo no balanço');

      const pc = n('passivoCirculante'), pnc = n('passivoNaoCirculante');
      /* Só com as quatro partes presentes: passivo não circulante AUSENTE não
         é zero, e tratá-lo como zero acusava de impossível todo registro
         antigo que nunca teve esse campo lançado. */
      trava(at > 0 && pc !== null && pnc !== null && pl !== null && Math.abs((pc + pnc + pl) - at) > at * IGUALDADE,
        'O balanço não fecha',
        `passivo mais PL dá ${B.dinheiro(pc + pnc + pl)}, mas o ativo é ${B.dinheiro(at)} (diferença de ${B.dinheiro(Math.abs((pc + pnc + pl) - at))})`,
        'nenhum indicador construído sobre essas contas vale enquanto isso não bater');

      const lair = n('lucroAntesIR'), ircs = n('ircs');
      trava(lair !== null && ircs !== null && ll !== null && Math.abs((lair - ircs) - ll) > Math.max(Math.abs(lair) * IGUALDADE, 1),
        'A DRE não fecha no lucro líquido',
        `LAIR ${B.dinheiro(lair)} menos IRPJ/CSLL ${B.dinheiro(ircs)} dá ${B.dinheiro(lair - ircs)}, mas o lucro líquido lançado é ${B.dinheiro(ll)}`,
        'ou o imposto veio com o sinal trocado, ou uma das três linhas é de outro ano');
    }

    for (const campo of ['receitaLiquida', 'receitaBruta', 'ativoTotal', 'ativoCirculante', 'dividaBruta', 'imobilizado']) {
      trava(n(campo) < 0, 'Valor negativo em ' + CO.modelo.nomeCurto(campo),
        B.dinheiro(n(campo)), 'provavelmente veio entre parênteses e o sinal foi lido como subtração');
    }

    trava(rl > 0 && n('ebitda') > rl, 'EBITDA maior que a receita',
      `EBITDA ${B.dinheiro(n('ebitda'))} contra receita ${B.dinheiro(rl)}`, 'confira as linhas do resultado operacional');

    trava(at > 0 && pl > at * 1.01, 'Patrimônio líquido maior que o ativo',
      `PL ${B.dinheiro(pl)} contra ativo ${B.dinheiro(at)}`, 'confira o total do patrimônio líquido');

    /* --- escala ---
       Uma indústria de R$ 700 milhões publicada em milhares vira uma de
       R$ 700 mil sem que NENHUMA razão acuse: todas as contas encolhem
       juntas, as margens ficam idênticas. Só o tamanho absoluto denuncia. */
    const maior = Math.max(Math.abs(rl ?? rb ?? 0), Math.abs(at ?? 0));
    if (maior > 0 && maior < RECEITA_MINIMA) {
      const fator = maior < 1000 ? 1000000 : 1000;
      if (!o.escalaDeclarada) {
        impossiveis.push({
          oQue: 'Os valores parecem estar em ' + (fator === 1000 ? 'milhares' : 'milhões'),
          porque: `o maior número do exercício é ${B.dinheiro(maior)} — abaixo do porte que o sistema analisa`,
          oQuePedir: 'peça o arquivo em reais, ou com a unidade declarada no cabeçalho',
          escala: { fatorProvavel: fator }
        });
      }
    }

    /* --- ausências que valem explicação ---
       Nenhuma bloqueia a gravação: bloqueiam o indicador lá na frente. */
    const explicar = {
      ebitda: n('ebit') !== null && n('depreciacaoAmortizacao') === null
        ? 'o EBIT veio, mas a depreciação não. Sem ela o EBITDA não se calcula pela conta — e usar o EBIT no lugar sem dizer seria afirmar que a empresa não tem imobilizado nenhum (o sistema usa o EBIT como piso, e diz que é piso)'
        : 'nem o EBITDA nem os componentes para derivá-lo foram reconhecidos no arquivo',
      dividaBruta: 'isso não quer dizer que a empresa não tem dívida — quer dizer que o arquivo não trouxe empréstimos, financiamentos nem debêntures',
      imobilizado: 'sem o imobilizado não há base para seguro patrimonial nem para a garantia que o banco aceita',
      caixa: 'sem o caixa, a dívida líquida fica igual à bruta — e isso pode estar errado para mais'
    };
    for (const [campo, porque] of Object.entries(explicar)) {
      if (n(campo) === null) ausencias.push({ campo, rotulo: CO.modelo.nomeCurto(campo), porque });
    }

    /* --- estranhezas --- */

    const df = n('despesasFinanceiras'), db = n('dividaBruta');
    if (df > 0 && rl > 0 && df > rl * MATERIALIDADE && !(db > 0)) {
      estranhezas.push({
        oQue: 'Despesa financeira sem dívida que a explique',
        porque: `${B.dinheiro(df)} de despesa financeira com dívida ${db === null ? 'ausente' : 'zerada'} no balanço`,
        oQuePedir: 'pode ser tarifa, desconto de duplicata, variação cambial ou antecipação de recebível — nenhuma aparece como empréstimo. Não trate como juro de dívida'
      });
    }

    const linhas = ['valorImoveis', 'valorInstalacoes', 'valorMaquinas', 'valorInformatica',
      'valorFerramentas', 'valorVeiculos', 'valorMoveis', 'valorSoftware', 'obrasAndamento'];
    const abertas = linhas.filter(c => n(c) !== null);
    if (abertas.length >= 2 && n('imobilizado') > 0) {
      const soma = E.somar(ex, abertas);
      const liquido = B.menos(n('imobilizado'), n('depreciacao') ?? 0);
      const bate = [n('imobilizado'), liquido].some(alvo => alvo !== null && Math.abs(soma - alvo) <= Math.abs(alvo) * 0.02);
      if (!bate) estranhezas.push({
        oQue: 'As linhas do imobilizado não somam o total',
        porque: `${abertas.length} linhas somam ${B.dinheiro(soma)}, e o imobilizado é ${B.dinheiro(n('imobilizado'))}`,
        oQuePedir: 'normalmente é uma classe que a nota traz sem linha própria (moldes, benfeitorias em imóvel de terceiro, terrenos). O seguro patrimonial conta a diferença como "demais bens", pelo total do documento'
      });
    }

    /* --- ressalvas: escolhas do sistema que a tela precisa dizer em voz alta ---
       Não são defeito nem estranheza: são decisões declaradas. */
    const ressalvas = [];
    if (E.valor(ex, 'ebitdaPiso') === true) ressalvas.push({
      campo: 'ebitda',
      oQue: `EBITDA assumido como piso: ${B.dinheiro(n('ebitda'))}, igual ao EBIT`,
      porque: 'a DRE não abre a depreciação. Como a D&A é sempre positiva, o EBITDA real é igual ou maior — a alavancagem e a cobertura saem iguais ou piores que as verdadeiras, nunca melhores',
      oQuePedir: 'a depreciação e amortização do período (DRE ou nota explicativa) fecha a conta de verdade'
    });
    const amb = (ex.recusas || []).filter(r => r.aviso);
    for (const a of amb) ressalvas.push({ campo: a.campo, oQue: 'Linha interpretada', porque: a.motivo, oQuePedir: a.oQuePedir });

    return {
      impossiveis, estranhezas, ausencias, ressalvas,
      podeGravar: impossiveis.length === 0,
      podeAnalisar: impossiveis.length === 0
    };
  }

  /* O pacote inteiro: o mesmo ano não pode vir duas vezes — um sobrescreveria
     o outro e não há como saber qual é o bom. */
  function conferirPacote(exercicios) {
    const vistos = {}, problemas = [];
    for (const ex of exercicios || []) {
      if (ex.ano === null) { problemas.push({ oQue: 'Exercício sem ano identificável', porque: 'não entrou' }); continue; }
      if (vistos[ex.ano]) problemas.push({
        oQue: `O exercício de ${ex.ano} veio duas vezes`,
        porque: 'um sobrescreveria o outro e não dá para saber qual é o bom',
        oQuePedir: 'mande o arquivo com um registro por ano'
      });
      vistos[ex.ano] = true;
    }
    return problemas;
  }

  return { conferir, conferirPacote, IGUALDADE, MATERIALIDADE, RECEITA_MINIMA };
})();


/* ===== 30-ler-json.js ===== */
/* ===========================================================================
   CAMADA 3 — O LEITOR TOLERANTE
   JSON.parse é estrito por projeto: uma vírgula sobrando e recusa o arquivo
   inteiro. Modelo de linguagem escreve JSON como gente escreve. Recusar por
   causa disso é exigir perfeição da outra ponta em vez de ler o que ela
   mandou — e nenhum dos consertos abaixo muda um único número.

   Mas tolerância sem declaração é adivinhação: o leitor conserta e DIZ o que
   consertou, item por item, em português.

   O que ele nunca faz: inventar valor, fechar chave que falta, completar
   arquivo truncado. Arquivo cortado mostra linha, coluna e o trecho — porque
   a resposta da IA provavelmente foi interrompida, e o pedido certo é
   "continue o arquivo de onde parou".
   =========================================================================== */
window.CO = window.CO || {};

CO.lerJSON = (function () {
  'use strict';

  /* Percorre o texto sabendo o que está dentro de aspas. Todos os consertos
     usam isto: dentro de string, "//" é conteúdo, não comentário. */
  function foraDeString(txt, aoVer) {
    let dentro = false, escapado = false, saida = '';
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      if (escapado) { saida += c; escapado = false; continue; }
      if (c === '\\' && dentro) { saida += c; escapado = true; continue; }
      if (c === '"') { dentro = !dentro; saida += c; continue; }
      saida = aoVer(c, i, dentro, saida);
    }
    return saida;
  }

  const CONSERTOS = [
    { nome: 'tirei caracteres invisíveis que vieram na cópia',
      faz: t => t.replace(/^﻿/, '').replace(/[​-‍⁠﻿]/g, '') },

    { nome: 'tirei o bloco de código em volta do arquivo',
      faz: t => t.replace(/^\s*```(?:json|javascript|js)?\s*/i, '').replace(/\s*```\s*$/, '') },

    { nome: 'ignorei o texto que vinha antes e depois do arquivo',
      faz: t => {
        const i = t.search(/[{[]/);
        if (i < 0) return t;
        const abre = t[i], fecha = abre === '{' ? '}' : ']';
        let nivel = 0, dentro = false, escapado = false, fim = -1;
        for (let j = i; j < t.length; j++) {
          const c = t[j];
          if (escapado) { escapado = false; continue; }
          if (c === '\\' && dentro) { escapado = true; continue; }
          if (c === '"') { dentro = !dentro; continue; }
          if (dentro) continue;
          if (c === abre) nivel++;
          else if (c === fecha && --nivel === 0) { fim = j; break; }
        }
        return fim > 0 ? t.slice(i, fim + 1) : t.slice(i);
      } },

    { nome: 'tirei comentários que o JSON não aceita',
      faz: t => {
        let saida = '', dentro = false, escapado = false;
        for (let i = 0; i < t.length; i++) {
          const c = t[i], prox = t[i + 1];
          if (escapado) { saida += c; escapado = false; continue; }
          if (c === '\\' && dentro) { saida += c; escapado = true; continue; }
          if (c === '"') { dentro = !dentro; saida += c; continue; }
          if (!dentro && c === '/' && prox === '/') { while (i < t.length && t[i] !== '\n') i++; saida += '\n'; continue; }
          if (!dentro && c === '/' && prox === '*') { i += 2; while (i < t.length && !(t[i] === '*' && t[i + 1] === '/')) i++; i++; continue; }
          saida += c;
        }
        return saida;
      } },

    { nome: 'tirei vírgula sobrando antes de fechar chave ou colchete',
      faz: t => foraDeString(t, (c, i, dentro, saida) =>
        (!dentro && (c === '}' || c === ']')) ? saida.replace(/,\s*$/, '') + c : saida + c) },

    { nome: 'troquei aspas curvas por aspas retas',
      faz: t => t.replace(/[“”„‟]/g, '"').replace(/[‘’‚‛]/g, "'") },

    { nome: 'troquei NaN, Infinity e undefined por null',
      faz: t => foraDeString(t, (c, i, dentro, saida) => saida + c)
        .replace(/:\s*(NaN|-?Infinity|undefined)\s*([,}\]])/g, ': null$2') },

    { nome: 'pus aspas nos nomes de campo que vieram sem elas',
      faz: t => t.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":') }
  ];

  /* Onde o arquivo quebrou, com a seta — para a pessoa ver o trecho. */
  function ondeQuebrou(txt, erro) {
    const m = String(erro && erro.message || '').match(/position (\d+)/);
    if (!m) return null;
    const pos = Number(m[1]);
    const antes = txt.slice(0, pos);
    const linha = antes.split('\n').length;
    const coluna = pos - antes.lastIndexOf('\n');
    const trecho = txt.slice(Math.max(0, pos - 60), pos + 60).replace(/\n/g, ' ');
    const seta = ' '.repeat(Math.min(60, pos)) + '↑';
    return { linha, coluna, trecho, seta, truncado: pos > txt.length - 5 };
  }

  function ler(texto) {
    const bruto = String(texto ?? '');
    if (!bruto.trim()) return { ok: false, erros: ['O arquivo está vazio.'], consertos: [] };

    let t = bruto;
    const consertos = [];
    try { return { ok: true, dados: JSON.parse(t), consertos }; } catch (e) { /* segue */ }

    /* Duas passadas completas: um conserto costuma destravar o seguinte. */
    for (let passada = 0; passada < 2; passada++) {
      for (const c of CONSERTOS) {
        const antes = t;
        let depois; try { depois = c.faz(t); } catch (e) { continue; }
        if (depois === antes) continue;
        t = depois;
        if (!consertos.includes(c.nome)) consertos.push(c.nome);
        try { return { ok: true, dados: JSON.parse(t), consertos }; } catch (e) { /* segue */ }
      }
    }

    let erro; try { JSON.parse(t); } catch (e) { erro = e; }
    const onde = ondeQuebrou(t, erro);
    const erros = ['Não consegui ler o arquivo como JSON.'];
    if (onde) {
      erros.push(`Quebra na linha ${onde.linha}, coluna ${onde.coluna}.`);
      if (onde.truncado) erros.push('O arquivo parece ter sido cortado no fim: a resposta da IA provavelmente foi interrompida. Peça "continue o arquivo de onde parou" e junte as partes.');
    }
    return { ok: false, erros, consertos, onde, texto: t };
  }

  return { ler, CONSERTOS };
})();


/* ===== 31-pacote.js ===== */
/* ===========================================================================
   CAMADA 3 — O PACOTE
   Transforma o arquivo da IA, venha como vier, numa lista de exercícios.

   Três trabalhos:
   1. achar os períodos (lista, objeto por ano, ou um período só) e o ano de
      cada um — período sem ano não entra, e a tela diz quantos ficaram fora
   2. ler a unidade que o arquivo DECLARA e converter. Ler a unidade escrita
      não é adivinhar: é ler. Adivinhar sem declaração continua proibido
   3. jogar fora o que a IA calculou. Margem, índice, dívida líquida e proxy
      não são linha de documento — o sistema calcula sozinho, e recalcular em
      cima do número dela é o erro que a regra 2 proíbe
   =========================================================================== */
window.CO = window.CO || {};

CO.pacote = (function () {
  'use strict';
  const B = CO.base;

  const ONDE_PERIODOS = ['periodos', 'exercicios', 'anos', 'demonstracoes', 'periodo', 'demonstracoesFinanceiras', 'dados'];
  const ONDE_ANO = ['ano', 'exercicio', 'anoFiscal', 'exercicioEncerradoEm', 'dataBase', 'data', 'competencia'];

  /* Blocos que não são campo financeiro: não são varridos atrás de números. */
  const BLOCOS_FORA = new Set(['meta', 'travas', 'bancos', 'ajustesliquidez', 'sociosir', 'outrosdetalhe',
    'contexto', 'parecer', 'seguros', 'informacoes', 'apolices', 'garantias', 'empresa', 'periodos',
    'formato', 'versao', 'geradoem', 'documentoslidos', 'observacoes', 'fontes', 'notas', 'naoalocado',
    'conferencia', 'duvidas', 'tipo', 'valores', 'indicadores', 'analise', 'oportunidades', 'alertas']);

  /* O que a IA CALCULOU, e por isso não entra. */
  const CALCULADO_PELA_IA = [
    /pct$/, /percentual$/, /proxy/, /^margem(?!brutavalor)/, /^liquidez/, /sobreebitda/, /sobrepl/,
    /sobrereceita/, /sobreativo/, /sobrepatrimonio/, /^indice/, /^roe$/, /^roa$/, /^roic$/,
    /capitalgiroliquido/, /fluxolivre/, /^dividaliquida/, /^giro/, /^prazomedio/, /^ciclo/,
    /coberturadejuros/, /^coberturajuros/, /^alavancagem/, /^endividamento/
  ];
  /* Derivados que o BALANÇO imprime como linha: quando vêm, valem como
     âncora do documento (P4). Não confundir com conta que a IA fez. */
  const IMPRESSOS_NO_DOCUMENTO = new Set(['passivoTotal', 'passivoMaisPL', 'dividaBrutaDeclarada']);
  /* Derivados que nenhum documento traz — se vierem, é cálculo da IA. */
  const SEMPRE_CONTA = new Set(['dividaLiquida', 'disponiveis', 'ebitdaPiso', 'balancoFecha', 'balancoDiferenca']);

  const ehCalculado = nome => {
    const achou = CO.modelo.reconhecer(nome);
    if (achou) {
      if (IMPRESSOS_NO_DOCUMENTO.has(achou.campo)) return false;
      if (SEMPRE_CONTA.has(achou.campo)) return true;
      return CO.modelo.ehDerivado(achou.campo);
    }
    return CALCULADO_PELA_IA.some(re => re.test(B.chave(nome)));
  };

  /* ---------- unidade declarada ---------- */

  const CHAVES_UNIDADE = ['unidadeMonetaria', 'unidade', 'valoresEm', 'unidadeValores',
    'unidadeDosValores', 'escalaValores', 'moedaUnidade', 'escala'];

  function fatorDe(obj) {
    if (!obj || typeof obj !== 'object') return null;
    if (obj.emMilhares === true || obj.valoresEmMilhares === true) return { fator: 1000, origem: 'o arquivo declara "em milhares"' };
    if (obj.emMilhoes === true || obj.valoresEmMilhoes === true) return { fator: 1000000, origem: 'o arquivo declara "em milhões"' };
    for (const c of CHAVES_UNIDADE) {
      const v = obj[c];
      if (typeof v !== 'string') continue;
      const s = B.simples(v);
      if (/milhao|milhoes|million|r\$ ?mi\b/.test(s)) return { fator: 1000000, origem: `o arquivo declara ${c} = "${v}"` };
      if (/milhar|milhares|\bmil\b|thousand|r\$ ?mil/.test(s)) return { fator: 1000, origem: `o arquivo declara ${c} = "${v}"` };
      if (/reais|^r\$$|brl|unidade/.test(s)) return { fator: 1, origem: `o arquivo declara ${c} = "${v}"` };
    }
    return null;
  }

  /* Campos que NÃO são dinheiro e por isso nunca são multiplicados. */
  const naoMultiplica = campo => CO.modelo.tipoDe(campo) !== 'dinheiro';

  /* ---------- leitura de um valor ---------- */

  /* Aceita número, string, ou o envelope que as IAs usam: {v}, {valor},
     {value}, {montante} — com metadados c (confiança), f/fonte, o (observação). */
  function desembrulhar(bruto) {
    if (bruto && typeof bruto === 'object' && !Array.isArray(bruto)) {
      for (const c of ['v', 'valor', 'value', 'montante', 'amount']) {
        if (c in bruto) return { valor: bruto[c], confianca: bruto.c, fonte: bruto.f || bruto.fonte, obs: bruto.o || bruto.obs };
      }
      return { valor: null };
    }
    return { valor: bruto };
  }

  /* ---------- achar os períodos ---------- */

  function periodosDe(dados, avisos) {
    if (Array.isArray(dados)) return dados;
    for (const chave of ONDE_PERIODOS) {
      const v = dados[chave];
      if (Array.isArray(v) && v.length) return v;
      if (v && typeof v === 'object') {
        /* objeto por ano: {"2023": {...}, "2024": {...}} */
        const anos = Object.keys(v).filter(k => /^(19|20)\d{2}$/.test(k));
        if (anos.length) {
          avisos.push('Os exercícios vieram agrupados por ano — reorganizei, sem mudar número nenhum.');
          return anos.map(a => ({ ...v[a], ano: Number(a) }));
        }
        if (Object.keys(v).length) return [v];   // um período só
      }
    }
    /* o pacote inteiro pode ser um período */
    return anoDe(dados) ? [dados] : [];
  }

  function anoDe(p) {
    if (!p || typeof p !== 'object') return null;
    for (const fonte of [p, p.meta || {}]) {
      for (const c of ONDE_ANO) {
        const a = B.ano(fonte[c]);
        if (a) return a;
      }
    }
    return null;
  }

  /* ---------- achatar um período ---------- */

  /* Varre o período (inclusive um nível de blocos aninhados como `valores`)
     e devolve { campos, metadados, descartados, naoReconhecidos }. */
  function achatar(periodo) {
    const campos = {}, meta = {}, descartados = [];

    const visitar = (obj, profundidade) => {
      for (const [nome, bruto] of Object.entries(obj || {})) {
        const k = B.chave(nome);
        if (bruto && typeof bruto === 'object' && !Array.isArray(bruto) && !('v' in bruto) && !('valor' in bruto) && !('value' in bruto)) {
          /* bloco: só desce se não estiver na lista de fora e ainda houver profundidade */
          if (!BLOCOS_FORA.has(k) && profundidade < 2) visitar(bruto, profundidade + 1);
          else if (BLOCOS_FORA.has(k)) meta[k] = bruto;
          continue;
        }
        if (BLOCOS_FORA.has(k)) { meta[k] = bruto; continue; }
        if (ehCalculado(nome)) { descartados.push(nome); continue; }
        if (nome in campos) continue;             // o primeiro nível vence
        const { valor, confianca, fonte } = desembrulhar(bruto);
        campos[nome] = valor;
        if (confianca || fonte) meta[`_sobre_${nome}`] = { confianca, fonte };
      }
    };
    /* o bloco `valores` é onde várias IAs põem os números: desce nele primeiro */
    if (periodo && periodo.valores && typeof periodo.valores === 'object') visitar(periodo.valores, 1);
    visitar(periodo, 0);
    return { campos, meta, descartados };
  }

  /* ---------- a função pública ---------- */

  function normalizar(dados) {
    const avisos = [], fora = [];
    const periodosBrutos = periodosDe(dados || {}, avisos);
    if (!periodosBrutos.length) {
      return { ok: false, erros: ['Não encontrei exercícios no arquivo. Esperava uma lista em "periodos" (ou "exercicios", "anos"), ou um objeto com os anos como chave.'], periodos: [] };
    }

    const fatorTopo = fatorDe(dados) || fatorDe(dados.meta);
    const periodos = [];

    for (const p of periodosBrutos) {
      const ano = anoDe(p);
      if (!ano) { fora.push(p); continue; }

      const { campos, meta, descartados } = achatar(p);
      const fator = fatorDe(p) || fatorDe(p.meta) || fatorTopo;

      if (fator && fator.fator !== 1) {
        for (const [nome, v] of Object.entries(campos)) {
          const achou = CO.modelo.reconhecer(nome);
          if (!achou || naoMultiplica(achou.campo)) continue;
          const n = B.num(v);
          if (n !== null) campos[nome] = n * fator.fator;
        }
      }

      periodos.push({
        ano, campos, meta, descartados,
        escala: fator && fator.fator !== 1 ? { fator: fator.fator, origem: fator.origem } : null,
        meses: B.inteiro((p.meta || {}).meses ?? p.meses ?? p.periodoMeses, 1, 12)
      });
    }

    if (fora.length) avisos.push(`${fora.length} período(s) ficaram de fora porque não deu para identificar o ano.`);
    const descTotal = [...new Set(periodos.flatMap(p => p.descartados))];
    if (descTotal.length) avisos.push(`Ignorei ${descTotal.length} razão(ões) que a IA já tinha calculado (${B.cortar(descTotal.join(', '), 120)}) — o sistema calcula isso sozinho, a partir das linhas do documento.`);

    return {
      ok: true, periodos, avisos,
      empresa: dados.empresa || null,
      carimbo: { tipo: dados.tipo, formato: dados.formato, versao: dados.versao },
      mostrarSemGravar: {
        naoAlocado: dados.naoAlocado || dados.naoalocado || null,
        duvidas: dados.duvidas || null,
        divergencias: dados.divergenciasDocumentais || dados.divergencias || null,
        documentosAusentes: dados.documentosAusentes || null
      }
    };
  }

  return { normalizar, fatorDe, achatar, periodosDe, anoDe, ehCalculado, BLOCOS_FORA, CALCULADO_PELA_IA, IMPRESSOS_NO_DOCUMENTO, SEMPRE_CONTA };
})();


/* ===== 32-importar.js ===== */
/* ===========================================================================
   CAMADA 3 — IMPORTAR
   O caminho inteiro, do texto do arquivo até os exercícios conferidos:

     ler tolerante → normalizar o pacote → montar cada exercício
                   → conferir travas → decidir o que cada ano faz ao gravar

   Nada é gravado aqui. Esta camada devolve o que vai para a tela de
   conferência — que é onde o corretor compara com o documento antes de dizer
   "grava". Entre ler e gravar sempre existe uma pessoa.
   =========================================================================== */
window.CO = window.CO || {};

CO.importar = (function () {
  'use strict';
  const B = CO.base;

  /* O arquivo é desta empresa? Raiz de CNPJ diferente é o pior erro possível:
     grava o balanço de uma empresa na ficha de outra. */
  function conferirEmpresa(pacote, cnpjEsperado) {
    if (!cnpjEsperado || !pacote.empresa) return null;
    const doArquivo = pacote.empresa.cnpj || pacote.empresa.CNPJ;
    if (!doArquivo) return null;
    if (B.mesmaEmpresa(doArquivo, cnpjEsperado)) return null;
    return {
      oQue: 'Este arquivo é de outra empresa',
      porque: `o arquivo traz o CNPJ ${B.formataCNPJ(doArquivo)}${pacote.empresa.razaoSocial ? ' (' + pacote.empresa.razaoSocial + ')' : ''}, e a ficha aberta é ${B.formataCNPJ(cnpjEsperado)}`,
      oQuePedir: 'abra a empresa certa ou confira o arquivo'
    };
  }

  /* Completo = traz DRE E balanço. Parcial = correção pontual. A diferença
     decide se o ano é substituído inteiro ou se os campos se somam ao que
     já está gravado. */
  function ehCompleto(campos) {
    const tem = nomes => nomes.some(n => {
      const a = CO.modelo.reconhecer(n);
      return a && B.num(campos[n]) !== null;
    });
    const nomes = Object.keys(campos);
    const achaCampo = alvo => nomes.some(n => { const a = CO.modelo.reconhecer(n); return a && a.campo === alvo && B.num(campos[n]) !== null; });
    const temDRE = ['receitaLiquida', 'receitaBruta'].some(achaCampo);
    const temBalanco = ['ativoTotal', 'ativoCirculante', 'patrimonioLiquido'].some(achaCampo);
    return temDRE && temBalanco;
  }

  function ler(texto, opcoes) {
    const o = opcoes || {};
    const leitura = CO.lerJSON.ler(texto);
    if (!leitura.ok) return { ok: false, erros: leitura.erros, onde: leitura.onde, consertos: leitura.consertos };

    const pacote = CO.pacote.normalizar(leitura.dados);
    if (!pacote.ok) return { ok: false, erros: pacote.erros, consertos: leitura.consertos };

    const bloqueio = conferirEmpresa(pacote, o.cnpjEmpresa);
    const anos = [];

    for (const p of pacote.periodos) {
      const dados = { ...p.campos, ano: p.ano };
      if (p.meses) dados.periodoMeses = p.meses;

      const ex = CO.montar.exercicio(dados, { ano: p.ano });
      const travas = CO.travas.conferir(ex, { escalaDeclarada: !!p.escala });

      const jaGravado = (o.gravados || {})[p.ano];
      const completo = ehCompleto(p.campos);

      anos.push({
        ano: p.ano, exercicio: ex, travas, escala: p.escala,
        vazio: ex.vazio,
        acao: !jaGravado ? 'novo' : (completo ? 'substitui' : 'corrige'),
        completo,
        descartados: p.descartados,
        naoReconhecidos: ex.naoReconhecidos
      });
    }

    const repetidos = CO.travas.conferirPacote(anos.map(a => a.exercicio));
    const vazios = anos.filter(a => a.vazio);

    return {
      ok: true,
      consertos: leitura.consertos,
      avisos: pacote.avisos,
      empresa: pacote.empresa,
      carimbo: pacote.carimbo,
      mostrarSemGravar: pacote.mostrarSemGravar,
      bloqueio,
      anos: anos.filter(a => !a.vazio),
      vazios,
      repetidos,
      podeGravar: !bloqueio && !repetidos.length && anos.some(a => !a.vazio && a.travas.podeGravar)
    };
  }

  /* O que será gravado em cada ano, já resolvida a mescla.
     Regras: o arquivo novo sempre vence; o que ele não traz, num arquivo
     COMPLETO, é apagado (o balanço é uma unidade — preservar misturaria duas
     versões do mesmo balanço); numa CORREÇÃO, o que está gravado permanece.
     Nunca são tocados: folha, benefícios, processos, garantias, sucessão e
     mercado — nada disso é DRE nem balanço. */
  const FORA_DA_SUBSTITUICAO = ['pessoal', 'risco', 'sucessao', 'patrimonio'];

  function paraGravar(ano, registroGravado, opcoes) {
    const o = opcoes || {};
    if (ano.acao === 'corrige' && registroGravado) {
      const ex = CO.montar.correcao(registroGravado, achatarDoc(ano.exercicio));
      CO.indicadores.aplicarPisoEbitda(ex);
      ex.indicadores = CO.indicadores.calcular(ex);
      CO.exercicio.marcarAusentes(ex);
      return { registro: CO.exercicio.paraGravar(ex), exercicio: ex, modo: 'correção' };
    }

    const novo = CO.exercicio.paraGravar(ano.exercicio);
    if (!registroGravado) return { registro: novo, exercicio: ano.exercicio, modo: 'novo' };

    /* substituição: preserva o que não é DRE nem balanço, e — se o corretor
       pediu — também o que o arquivo novo não trouxe */
    const preservados = {};
    for (const [campo, def] of Object.entries(CO.campos)) {
      if (!(campo in registroGravado)) continue;
      const foraDoNucleo = FORA_DA_SUBSTITUICAO.includes(def.g);
      if (foraDoNucleo || (o.manterAusentes && !(campo in novo))) preservados[campo] = registroGravado[campo];
    }
    return { registro: { ...preservados, ...novo }, exercicio: ano.exercicio, modo: o.manterAusentes ? 'substitui mantendo o que não veio' : 'substitui o ano inteiro' };
  }

  /* Só o que o documento afirmou — o derivado é recalculado do zero. */
  function achatarDoc(ex) {
    const fora = {};
    for (const [campo, v] of Object.entries(ex.doc)) if (v !== null && v !== undefined) fora[campo] = v;
    return fora;
  }

  return { ler, paraGravar, conferirEmpresa, ehCompleto, FORA_DA_SUBSTITUICAO };
})();


/* ===== 33-prompts.js ===== */
/* ===========================================================================
   CAMADA 3 — OS PROMPTS
   Seis leitores, um esqueleto só.

   No sistema antigo cada prompt nasceu numa data diferente e carregava suas
   próprias regras: um dizia "nunca invente", outro não; um pedia os bens por
   último, os outros não tinham ordem; só o do IR falava em partes. Quando o
   caso PECCIN mostrou que a IA estoura o espaço de resposta e entrega o
   volumoso primeiro, a correção teve de ser feita prompt a prompt.

   Aqui as regras que valem para todos moram num lugar só (_comum.md), e cada
   prompt acrescenta o que é dele. Um erro corrigido no comum vale para os
   seis. O contexto da empresa é montado pelo sistema e colado no fim — a IA
   nunca precisa perguntar de quem é o documento.
   =========================================================================== */
window.CO = window.CO || {};

CO.prompts = (function () {
  'use strict';
  const B = CO.base;

  /* Preenchido no build a partir de src/prompts/*.md. Lido na hora do uso,
     não na definição: o arquivo de textos carrega depois deste. */
  const textos = () => window.CO_PROMPTS || {};

  const QUAIS = {
    financeiro: { nome: 'Balanço e DRE', arquivo: 'financeiro', tipo: 'financeiro',
      oQuePedir: 'balanço patrimonial e DRE dos últimos três exercícios, assinados ou publicados',
      entrega: 'os exercícios, linha a linha' },
    contrato: { nome: 'Contrato social', arquivo: 'contrato', tipo: 'contrato',
      oQuePedir: 'contrato social consolidado e as alterações posteriores',
      entrega: 'sócios, participações, administração e as cláusulas de sucessão' },
    apolices: { nome: 'Apólices', arquivo: 'apolices', tipo: 'apolices',
      oQuePedir: 'as apólices vigentes (ou o espelho delas)',
      entrega: 'ramo, vigência, importâncias seguradas, franquias e prêmio' },
    ir: { nome: 'IR dos sócios', arquivo: 'ir_socios', tipo: 'ir_socios',
      oQuePedir: 'a declaração de ajuste anual de cada sócio, completa',
      entrega: 'renda por fonte, imposto, patrimônio bem a bem' },
    parecer: { nome: 'Parecer', arquivo: 'parecer', tipo: 'parecer',
      oQuePedir: 'nada — este prompt recebe o resumo que o sistema calculou',
      entrega: 'o texto do parecer, conferido número a número' },
    apresentacao: { nome: 'Apresentação da empresa', arquivo: 'apresentacao', tipo: 'apresentacao',
      oQuePedir: 'site, materiais públicos e o que a empresa divulga',
      entrega: 'o que a empresa faz, onde, para quem' }
  };

  /* O contexto que o sistema sempre fornece: a IA não adivinha de quem é o
     documento, nem precisa perguntar. */
  function contexto(empresa, extras) {
    const e = empresa || {};
    const L = ['## O contexto desta leitura', ''];
    L.push(`- Empresa: **${e.nome || e.razaoSocial || '(sem nome no cadastro)'}**`);
    if (e.cnpj) L.push(`- CNPJ: **${B.formataCNPJ(e.cnpj)}** (o arquivo precisa trazer este CNPJ em \`empresa.cnpj\`)`);
    if (e.setor) L.push(`- Setor: ${e.setor}`);
    if (e.regimeTributario) L.push(`- Regime tributário: ${e.regimeTributario}`);
    if (e.funcionarios) L.push(`- Funcionários no cadastro: ${B.qtd(e.funcionarios)}`);
    if (Array.isArray(e.socios) && e.socios.length) {
      L.push('- Sócios já conhecidos pelo contrato social:');
      for (const s of e.socios) L.push(`  - ${s.nome}${s.cpf ? ' — CPF ' + s.cpf : ''}${s.participacao != null ? ' — ' + s.participacao + '%' : ''}`);
    }
    if (Array.isArray(e.anosGravados) && e.anosGravados.length) {
      L.push(`- Exercícios já gravados no sistema: ${e.anosGravados.join(', ')}. Se o documento trouxer um destes, mande assim mesmo — o sistema compara e mostra a diferença antes de gravar.`);
    }
    for (const linha of (extras || [])) L.push('- ' + linha);
    return L.join('\n');
  }

  /* O prompt pronto para copiar. */
  function montar(qual, empresa, opcoes) {
    const q = QUAIS[qual];
    if (!q) return '';
    const o = opcoes || {};
    const T = textos();
    const especifico = T[qual] || '';
    const comum = T._comum || '';
    const nomeArquivo = `${B.chave(empresa && (empresa.nome || empresa.razaoSocial) || 'EMPRESA').toUpperCase().slice(0, 24)}_${q.arquivo}.json`;

    return [
      especifico.replace(/<TIPO>/g, q.tipo).replace(/<ARQUIVO>/g, nomeArquivo),
      comum.replace(/<TIPO>/g, q.tipo),
      contexto(empresa, o.extras),
      '',
      `Agora leia o que está anexado e entregue o arquivo \`${nomeArquivo}\`, num bloco de código só.`
    ].join('\n\n');
  }

  const lista = () => Object.entries(QUAIS).map(([id, q]) => ({ id, ...q }));

  return { montar, contexto, lista, QUAIS, textos };
})();


/* ===== 34-prompts-textos.js ===== */
/* Textos dos prompts (gerado por ferramentas/gerar-prompts.py a partir de src/prompts/*.md).

window.CO_PROMPTS = {
  "_comum": "## Como este arquivo é lido\n\nQuem lê o que você escrever é um programa, não uma pessoa. Ele não interpreta: encaixa.\nPor isso valem cinco regras acima de qualquer outra coisa.\n\n**1 · Você transcreve; o sistema calcula.** Não some, não estime, não conclua, não dê nota.\nMargem, índice, dívida líquida, prazo médio, alavancagem — nada disso entra no arquivo. Se\nvocê calcular, o sistema descarta: ele refaz a conta a partir das linhas do documento, e é\nessa conta que vai para o parecer. O seu trabalho é cada linha no campo certo, com o valor\nexato, o nome e o número do documento como estão escritos.\n\n**2 · O que não está no documento fica FORA do arquivo.** Campo ausente é ausente — não é\nzero. Zero é uma afirmação sobre a empresa (\"não tem dívida\"); ausente é uma afirmação sobre\no documento (\"o balanço não abriu essa linha\"). Escrever 0 no lugar de ausente faz o sistema\nimprimir \"dívida R$ 0\" numa empresa endividada. Nunca escreva `0`, `\"n/d\"`, `\"não consta\"`\nou `null` para preencher: simplesmente não inclua o campo. Quando a ficha existe e está\nvazia no documento, entregue-a vazia (`[]`) — isso diz \"li e não havia\", que é diferente de\nnão ter lido.\n\n**3 · O essencial primeiro, o volumoso por último.** Escreva os blocos na ordem indicada em\ncada seção. Se o espaço da resposta acabar, o que faltará é o fim da lista mais longa — e\nnão a informação que sustenta a análise.\n\n**4 · Se não couber, divida — e diga.** Quando perceber que não vai caber, entregue um\narquivo por assunto (ou por pessoa, ou por ano) e marque `\"parte\": \"1/2\"`. O sistema junta\nas partes sozinho. Nunca corte uma ficha no meio sem avisar em `duvidas`.\n\n**5 · O que você não souber onde pôr, declare.** Linha que não encaixa em campo nenhum vai\nem `naoAlocado` com o texto original. Dúvida sobre o que um número significa vai em\n`duvidas`. Divergência entre dois documentos vai em `divergencias`, com os dois valores.\nNada disso é gravado pelo sistema: é mostrado ao corretor antes de ele decidir.\n\n## Como escrever os números\n\n- Em reais, ponto como separador decimal, sem separador de milhar: `1234567.89`.\n- Com os centavos que o documento mostra. Valor cortado ou ilegível **não entra** — vai para `duvidas`.\n- Negativo com o sinal de menos, nunca entre parênteses: `-174808.17`.\n- **Se o documento estiver em milhares ou milhões, NÃO converta.** Escreva os números como\n  estão e declare a unidade em `unidadeMonetaria` (`\"milhares\"`, `\"milhões\"` ou `\"reais\"`).\n  O sistema converte. Converter por conta própria e errar faz uma indústria de R$ 700\n  milhões virar uma de R$ 700 mil sem que nenhum indicador acuse.\n- Datas em `AAAA-MM-DD`. CNPJ e CPF com a pontuação do documento.\n\n## O carimbo\n\nTodo arquivo começa com estas quatro linhas, exatamente assim — é por elas que o sistema\nsabe o que recebeu e recusa um arquivo trocado:\n\n```json\n{ \"tipo\": \"<TIPO>\", \"formato\": \"corporate-one-<TIPO>\", \"versao\": 1,\n  \"empresa\": { \"razaoSocial\": \"\", \"cnpj\": \"\" } }\n```\n\nO `empresa.cnpj` é o CNPJ da empresa deste contexto. O sistema confere a raiz: arquivo de\noutra empresa é recusado antes de qualquer coisa.\n",
  "apolices": "# Apólices — leitor dos seguros que a empresa já tem\n\nVocê é o leitor das apólices de uma empresa. Recebe apólices completas, espelhos, endossos,\npropostas aceitas ou a relação de seguros que a corretora atual emitiu. Devolve um arquivo com cada\napólice: o que ela cobre, por quanto, até quando, em nome de quem, para quem paga e quanto custa.\n\nVocê transcreve. Não diz se o seguro está bom ou ruim, não compara o limite com o patrimônio do\nbalanço, não aponta o que falta. Esse confronto é do sistema: ele põe a importância segurada ao\nlado do imobilizado que leu no balanço, a vigência ao lado da data de hoje, o beneficiário ao lado\ndo banco que financiou a máquina, e o prêmio ao lado do que a DRE declara em seguros. Nada disso\nfunciona com cobertura resumida ou importância arredondada.\n\nO que mais importa aqui é a abertura: **uma linha por cobertura, com a importância segurada e a\nfranquia exatas**. Uma apólice empresarial resumida a um número só vira \"a empresa tem seguro\npatrimonial\" — e some a informação de que o lucro cessante tem limite de R$ 200 mil numa empresa\nque fatura R$ 7 milhões por mês.\n\n## A ordem dos blocos\n\nNo arquivo: `empresa`, depois `apolices`, depois `duvidas` e `documentosAusentes`.\n\nDentro de cada apólice, nesta ordem:\n\n1. Identificação — seguradora, ramo, número, vigência, situação.\n2. Segurado, beneficiário e local de risco.\n3. `coberturas` — importâncias seguradas e franquias.\n4. Prêmio, forma de pagamento e corretor atual.\n5. `clausulas` e `endossos`.\n6. `bensSegurados` — por último.\n\n`bensSegurados` vem no fim porque é a lista que estoura: uma frota tem oitenta veículos, uma\napólice de equipamentos tem duzentos itens. Se o espaço acabar, o que falta é o item 118 da relação\nde máquinas — e não a cobertura, a vigência e o limite, que são o que sustenta a análise. Quando\ncortar a lista, diga em `duvidas` quantos itens ficaram de fora.\n\n## Uma entrada por apólice\n\nEndosso **não** é apólice no
