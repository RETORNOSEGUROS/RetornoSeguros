<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seguro Garantia — libere o caixa da sua empresa | Retorno Seguros</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --azul-fundo:#050e24; --azul-meio:#0b1c3f; --azul-claro:#1e3a6d;
    --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --texto:#e8eeff; --suave:#93a4c8;
  }
  body {
    font-family:'Inter',system-ui,sans-serif; background:var(--azul-fundo); color:var(--texto);
    min-height:100vh; min-height:100dvh; overflow-x:hidden; position:relative;
  }
  /* ---- fundo esfumaçado ---- */
  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .fumaca span {
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.5;
    animation:flutuar 22s ease-in-out infinite;
  }
  .f1 { width:56vw; height:56vw; background:radial-gradient(circle,#1e40af,transparent 70%); top:-14%; left:-12%; }
  .f2 { width:46vw; height:46vw; background:radial-gradient(circle,#0ea5e9,transparent 70%); bottom:-16%; right:-10%; animation-delay:-7s; }
  .f3 { width:38vw; height:38vw; background:radial-gradient(circle,#334155,transparent 70%); top:38%; left:52%; animation-delay:-14s; }
  @keyframes flutuar {
    0%,100% { transform:translate(0,0) scale(1); }
    33% { transform:translate(4vw,-3vh) scale(1.1); }
    66% { transform:translate(-3vw,4vh) scale(.95); }
  }
  .grao { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035;
    background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:3px 3px; }

  /* ---- palco ---- */
  .palco {
    position:relative; z-index:2; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    justify-content:safe center;
    padding:56px 22px calc(28px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto;
  }
  .marca { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.22em; color:#4b5f8a; font-weight:700; z-index:3; text-transform:uppercase; }

  .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--ciano),var(--dourado));
    z-index:5; transition:width .5s cubic-bezier(.4,0,.2,1); width:0; box-shadow:0 0 12px rgba(56,189,248,.6); }

  .cena { width:100%; animation:entra .55s cubic-bezier(.16,1,.3,1); }
  @keyframes entra { from { opacity:0; transform:translateY(18px);} to { opacity:1; transform:none;} }

  .rotulo { font-size:11px; letter-spacing:.18em; color:var(--ciano); font-weight:700;
    text-transform:uppercase; margin-bottom:14px; opacity:0; animation:surge .4s .1s forwards; }
  @keyframes surge { to { opacity:1; } }

  .titulo { font-size:clamp(23px,5.2vw,36px); font-weight:800; line-height:1.24; margin-bottom:16px; letter-spacing:-.02em; }
  .corpo { font-size:clamp(15px,3.4vw,17.5px); line-height:1.68; color:#c3d0ec; font-weight:300; min-height:1.68em; }
  .corpo strong { color:#fff; font-weight:600; }
  .corpo em { color:var(--dourado); font-style:normal; font-weight:500; }

  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--ciano);
    vertical-align:text-bottom; margin-left:2px; animation:pisca .85s step-end infinite; }
  @keyframes pisca { 50% { opacity:0; } }

  .destaque {
    border-left:3px solid var(--dourado); background:rgba(251,191,36,.07);
    padding:15px 18px; border-radius:0 12px 12px 0; margin:20px 0; font-size:14.5px;
    line-height:1.6; color:#e5d5a8;
  }

  /* ---- pergunta ---- */
  .zona-resposta { margin-top:32px; opacity:0; transform:translateY(10px); transition:all .5s; }
  .zona-resposta.on { opacity:1; transform:none; }
  .pergunta { font-size:clamp(16px,3.6vw,19px); font-weight:600; color:#fff; margin-bottom:18px; line-height:1.45; }

  .opcoes { display:flex; gap:11px; flex-wrap:wrap; }
  .op {
    flex:1; min-width:132px; padding:16px 18px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,.05); border:1.5px solid rgba(147,164,200,.28);
    color:var(--texto); font-size:15px; font-weight:600; font-family:inherit;
    transition:all .22s; text-align:center; position:relative; overflow:hidden;
    animation:pulsar 2.6s ease-in-out infinite;
  }
  .op:hover, .op:focus { background:rgba(56,189,248,.14); border-color:var(--ciano); transform:translateY(-2px); outline:none; }
  .op.sel { background:rgba(56,189,248,.2); border-color:var(--ciano); animation:none; }
  .op.sel::after { content:' ✓'; color:var(--ciano); }
  @keyframes pulsar {
    0%,100% { box-shadow:0 0 0 0 rgba(56,189,248,.28); }
    50% { box-shadow:0 0 0 7px rgba(56,189,248,0); }
  }
  .op:nth-child(2) { animation-delay:.25s; }
  .op:nth-child(3) { animation-delay:.5s; }
  .op:nth-child(4) { animation-delay:.75s; }
  .opcoes.muitas { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:9px; }
  .opcoes.muitas .op { animation:none; padding:13px 14px; font-size:14px; min-width:0; }
  .opcoes.lista { display:flex; flex-direction:column; gap:9px; }
  .opcoes.lista .op { animation:none; text-align:left; min-width:0; padding:14px 16px; font-size:14.5px; }

  .nota { font-size:11.5px; color:#7b8db3; line-height:1.55; margin-top:11px; }

  .btn {
    padding:16px 30px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--ciano),#2563eb); color:#031127;
    font-size:15px; font-weight:800; font-family:inherit; transition:all .22s; white-space:nowrap;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(56,189,248,.32); }
  .btn-2 { background:rgba(255,255,255,.07); color:var(--texto); border:1.5px solid rgba(147,164,200,.3); }
  .btn-2:hover { background:rgba(255,255,255,.13); box-shadow:none; }
  .btn-ouro { background:linear-gradient(135deg,var(--dourado),#f59e0b); color:#2a1a00; }
  .btn-ouro:hover { box-shadow:0 10px 26px rgba(251,191,36,.32); }

  .campo { width:100%; padding:16px 18px; border-radius:14px; font-size:16px; font-family:inherit;
    background:rgba(255,255,255,.05); border:1.5px solid rgba(147,164,200,.28); color:#fff;
    animation:pulsar 2.6s ease-in-out infinite; transition:all .22s; }
  .campo:focus { outline:none; border-color:var(--ciano); background:rgba(56,189,248,.1); animation:none; }
  .campo::placeholder { color:#5d6f95; }
  .lbl { font-size:12.5px; color:var(--suave); font-weight:600; margin-bottom:7px; display:block; }

  .pular { margin-top:26px; text-align:center; }
  .pular a { color:#5d6f95; font-size:12.5px; text-decoration:none; cursor:pointer; }
  .pular a:hover { color:var(--suave); text-decoration:underline; }

  /* ---- resultado: mapa de oportunidades ---- */
  .caixa-preso { background:linear-gradient(160deg,rgba(52,211,153,.14),rgba(56,189,248,.08));
    border:1.5px solid rgba(52,211,153,.4); border-radius:16px; padding:20px 22px; margin:22px 0; }
  .caixa-preso .rot { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:#6ee7b7; font-weight:700; margin-bottom:8px; }
  .caixa-preso .val { font-size:clamp(26px,7vw,38px); font-weight:800; letter-spacing:-.03em; color:#a7f3d0; line-height:1.1; }
  .caixa-preso .exp { font-size:13px; color:#9fd8c4; margin-top:9px; line-height:1.55; }

  .term { margin:24px 0 6px; }
  .term-barra { height:12px; border-radius:100px; background:rgba(255,255,255,.09); overflow:hidden; position:relative; }
  .term-fill { height:100%; border-radius:100px; width:0; transition:width 1.6s cubic-bezier(.4,0,.2,1); }
  .term-legenda { display:flex; justify-content:space-between; font-size:11px; color:#5d6f95; margin-top:8px; }
  .term-nota { font-size:clamp(30px,7.5vw,46px); font-weight:800; line-height:1; margin-bottom:6px; }

  .cards-risco { display:grid; gap:10px; margin:22px 0; }
  .card-risco { background:rgba(255,255,255,.045); border:1px solid rgba(147,164,200,.16);
    border-radius:12px; padding:13px 16px; font-size:13.5px; color:#c3d0ec; display:flex; gap:11px; align-items:flex-start; }
  .card-risco b { color:#fff; font-weight:600; }
  .card-risco.forte { border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.08); }

  .etapas { display:grid; gap:10px; margin:20px 0; }
  .etapa { display:flex; gap:13px; align-items:flex-start; background:rgba(255,255,255,.04);
    border:1px solid rgba(147,164,200,.16); border-radius:12px; padding:14px 16px; }
  .etapa-n { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:rgba(56,189,248,.18);
    border:1px solid rgba(56,189,248,.5); color:var(--ciano); font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center; }
  .etapa-t { font-size:14px; line-height:1.55; color:#c3d0ec; }
  .etapa-t b { display:block; color:#fff; font-weight:650; margin-bottom:2px; font-size:14.5px; }

  .acoes-finais { display:flex; flex-direction:column; gap:11px; margin-top:26px; }
  .acoes-finais .btn { width:100%; }

  .fim-ok { text-align:center; padding:20px 0; }
  .fim-ok .ico { font-size:56px; margin-bottom:14px; }

  @media (max-width:520px) {
    .palco { padding:52px 18px calc(22px + env(safe-area-inset-bottom)); }
    .op { min-width:100%; }
  }
</style>
</head>
<body>

<div class="fumaca"><span class="f1"></span><span class="f2"></span><span class="f3"></span></div>
<div class="grao"></div>

<div class="palco"><div id="palco"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   APRESENTAÇÃO INTERATIVA — SEGURO GARANTIA
   Não é uma jornada de medo, como o D&O: é um passeio pelas linhas do
   produto. Cada cena mostra uma situação real em que alguém exige
   garantia da empresa e devolve uma pergunta simples. As respostas
   viram um MAPA DE OPORTUNIDADES (onde o garantia entra hoje) e uma
   estimativa do caixa imobilizado — não um grau de risco.
   ══════════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PRODUTO = { id: 'garantia', nome: 'Seguro Garantia' };
/* Vire para true no dia em que o QuestionarioGarantia.html estiver publicado.
   Enquanto for false, o CTA principal não manda o cliente para uma página que
   não existe — ele cai no formulário de contato, que resolve a mesma coisa. */
const TEM_QUESTIONARIO = false;
const ARQ_VERSAO = '5';
window.ARQ_VERSAO = ARQ_VERSAO;

let SESSAO = null;      // id do documento desta visita
let LINK = null;        // dados do link (empresa, quem enviou)
let RESP = {};          // respostas da apresentação
let QRESP = {};         // contato, quando o cliente prefere ser chamado
let iCena = 0;

const MI = 1e6, MIL = 1e3;

/* ─────────── DICIONÁRIO ANALÍTICO ───────────
   Cada opção da tela tem um código estável (para a máquina contar) e,
   quando é faixa, os números que ela representa. Os rótulos podem ser
   reescritos depois sem quebrar o histórico. Índice = índice da opção. */
const DIC = {
  comoGarante: [['gar_dinheiro'], ['gar_fianca'], ['gar_seguro'], ['gar_perdeu'], ['gar_nunca']],
  valorParado: [['par_muito'], ['par_algum'], ['par_juridico'], ['par_nao']],
  valorParadoFaixa: [
    ['vp_0_100k', 0, 100 * MIL], ['vp_100_300k', 100 * MIL, 300 * MIL], ['vp_300_500k', 300 * MIL, 500 * MIL],
    ['vp_500k_1mi', 500 * MIL, 1 * MI], ['vp_1_3mi', 1 * MI, 3 * MI], ['vp_3_5mi', 3 * MI, 5 * MI],
    ['vp_5_10mi', 5 * MI, 10 * MI], ['vp_10_25mi', 10 * MI, 25 * MI], ['vp_25mi_mais', 25 * MI, null],
    ['vp_naosei', null, null]
  ],
  execFiscal: [['fis_sim_agora'], ['fis_ja_teve'], ['fis_naosei'], ['fis_nao']],
  nFiancas: [['fi_0'], ['fi_1_2'], ['fi_3_5'], ['fi_6_mais'], ['fi_naosei']],
  sabeTaxa: [['tx_sei'], ['tx_maisoumenos'], ['tx_naosei']],
  licita: [['lic_sempre'], ['lic_asvezes'], ['lic_perdeu'], ['lic_nao']],
  fazSentido: [['fs_sim'], ['fs_entender']],
  contratual: [['ctt_forn'], ['ctt_adiant'], ['ctt_reten'], ['ctt_obra'], ['ctt_pedir'], ['ctt_nenhuma']],
  especificas: [['esp_energia'], ['esp_aduaneira'], ['esp_recebiveis'], ['esp_imobiliaria'], ['esp_concessao'], ['esp_nenhuma']],
  oQueMudaria: [['mud_giro'], ['mud_limite'], ['mud_contratos'], ['mud_tranquilidade']]
};

/* Onde o Seguro Garantia entra: cada linha tem um código fixo, um nome
   para o cliente e a frase que explica o ganho concreto dela. É a matéria-
   prima do mapa final e do que o corretor vê no CRM. */
const LINHAS = {
  jud_recursal:  ['Depósito recursal trabalhista', 'A apólice substitui o valor que a empresa precisa depositar para recorrer — o dinheiro volta para o caixa e o recurso segue.'],
  jud_trab:      ['Execução trabalhista', 'Garante o valor da condenação ou do acordo sem imobilizar caixa nem sofrer penhora em conta.'],
  jud_fiscal:    ['Execução fiscal e tributário', 'Substitui a penhora e o depósito em dinheiro em dívidas fiscais, inclusive por oferta antecipada de garantia.'],
  jud_civel:     ['Processo cível', 'Garante ao juízo o valor discutido em ações de cobrança, execução e cautelares.'],
  jud_parcel:    ['Parcelamento administrativo fiscal', 'Garante o saldo devedor do parcelamento sem travar o caixa.'],
  fianca_sub:    ['Substituição de fiança bancária', 'A apólice não consome o limite de crédito bancário — ele fica livre para o que faz a empresa crescer.'],
  lic_bid:       ['Garantia de proposta em licitação', 'Permite entrar no certame sem tirar dinheiro do caixa para a garantia da proposta.'],
  lic_exec:      ['Garantia de execução de contrato público', 'Garante o cumprimento do contrato assinado com o órgão, no percentual que o edital exigir.'],
  ctr_forn:      ['Contrato de fornecimento ou prestação de serviço', 'Prova ao cliente privado que a entrega está garantida, sem caução em dinheiro.'],
  ctr_adiant:    ['Adiantamento de pagamento', 'Garante ao cliente a correta aplicação do valor adiantado — e é o que costuma destravar o adiantamento.'],
  ctr_reten:     ['Retenção de pagamentos', 'Substitui a retenção contratual: em vez de o cliente segurar parte do pagamento, a apólice garante.'],
  ctr_obra:      ['Obra e construção', 'Garante a execução e, quando o contrato pede, a conclusão do projeto.'],
  ctr_pedir:     ['Exigir garantia dos seus fornecedores', 'A via de mão dupla: a mesma apólice que você apresenta pode ser exigida de quem te entrega.'],
  energia:       ['Compra e venda de energia', 'Garante o pagamento das faturas no mercado livre — exigência comum nos contratos de energia.'],
  aduaneira:     ['Aduaneira', 'Garante à Receita o tributo suspenso em importações de bens sob regime especial.'],
  recebiveis:    ['Antecipação de recebíveis', 'Garante a performance contratual necessária para antecipar recebíveis em operação de crédito.'],
  imobiliaria:   ['Incorporação e imobiliária', 'Garante a entrega das obras de edificações residenciais e comerciais.'],
  concessao:     ['Concessão e PPP', 'Garante a execução do projeto ou do serviço objeto do contrato de concessão.']
};

/* ─────────── ROTEIRO ───────────
   `quando` torna a cena condicional: só aparece se a função devolver true.
   `linhas` acende linhas do mapa conforme a resposta (por código de opção). */
const CENAS = [
  {
    rotulo: 'Bem-vindo',
    titulo: 'Existe um seguro que <em>devolve dinheiro</em> para o caixa da sua empresa.',
    corpo: 'O <strong>Seguro Garantia</strong> é o seguro que prova, para quem cobra de você, que a sua empresa vai cumprir o que prometeu — um juiz, um órgão público, um cliente grande, um fornecedor de energia.\n\nA diferença é o que ele substitui. Hoje, quando alguém exige essa prova, a empresa costuma responder com <strong>dinheiro parado</strong> — depósito em juízo, caução, fiança bancária que come o limite no banco. A apólice ocupa esse lugar, e o dinheiro volta a trabalhar.\n\nSão poucas telas. Em cada uma eu mostro uma situação real e você me diz se ela existe aí.',
    pergunta: 'Para começar: quando exigem uma garantia da sua empresa, o que vocês usam hoje? Marque tudo que já aconteceu.',
    tipo: 'multi',
    lista: true,
    campo: 'comoGarante',
    opcoes: [
      { txt: '💸 Dinheiro parado — depósito em juízo ou caução', v: 'dinheiro' },
      { txt: '🏦 Fiança bancária', v: 'fianca', linhas: ['fianca_sub'] },
      { txt: '📄 Já usamos seguro garantia', v: 'seguro' },
      { txt: '🚪 Já deixamos de participar de algo por não ter garantia', v: 'perdeu' },
      { txt: '🤔 Nunca precisamos disso', v: 'nunca', exclusiva: true }
    ]
  },
  {
    rotulo: 'Situação 1 de 6 · Judicial',
    titulo: 'O dinheiro que está preso num processo que você ainda pode ganhar',
    corpo: 'É a situação mais comum e a que menos se percebe. Para recorrer de uma decisão trabalhista, a empresa precisa <strong>depositar o valor</strong>. Numa execução fiscal ou cível, precisa garantir o juízo. E ali o dinheiro fica — três, cinco, oito anos — mesmo que no fim a empresa ganhe.\n\nA lei permite trocar esse depósito por uma apólice. O processo continua garantido, o juízo aceita, e <strong>o caixa volta para a empresa no mesmo mês</strong>.',
    destaque: 'Pense na sua empresa agora: existe algum valor seu parado num processo — e você lembra desde quando?',
    pergunta: 'A empresa tem hoje algum valor depositado em juízo, bloqueado ou dado em caução?',
    tipo: 'opcoes',
    lista: true,
    campo: 'valorParado',
    opcoes: [
      { txt: 'Sim, e é um valor que faz falta', v: 'muito', linhas: ['jud_recursal', 'jud_trab', 'jud_civel'] },
      { txt: 'Sim, algum valor', v: 'algum', linhas: ['jud_recursal', 'jud_trab'] },
      { txt: 'Não sei de cabeça — quem cuida é o jurídico', v: 'juridico', linhas: ['jud_recursal'] },
      { txt: 'Não, nada parado', v: 'nao' }
    ]
  },
  {
    rotulo: 'Situação 1 de 6 · Judicial',
    titulo: 'Quanto, mais ou menos?',
    corpo: 'Não precisa de precisão — é só para eu ter a ordem de grandeza. Some o que estiver depositado, bloqueado ou em caução em todos os processos.',
    pergunta: 'Somando tudo, o valor parado está por volta de:',
    tipo: 'opcoes',
    muitas: true,
    campo: 'valorParadoFaixa',
    quando: () => RESP.valorParado && RESP.valorParado.valor !== 'nao',
    nota: 'Na dúvida entre duas faixas, escolha a menor — prefiro subestimar do que te vender um número que não existe.',
    opcoes: [
      { txt: 'Até R$ 100 mil', v: 'ate100k' },
      { txt: 'R$ 100 a 300 mil', v: '100_300k' },
      { txt: 'R$ 300 a 500 mil', v: '300_500k' },
      { txt: 'R$ 500 mil a 1 milhão', v: '500k_1mi' },
      { txt: 'R$ 1 a 3 milhões', v: '1_3mi' },
      { txt: 'R$ 3 a 5 milhões', v: '3_5mi' },
      { txt: 'R$ 5 a 10 milhões', v: '5_10mi' },
      { txt: 'R$ 10 a 25 milhões', v: '10_25mi' },
      { txt: 'Acima de R$ 25 milhões', v: '25mi_mais' },
      { txt: 'Não sei dizer agora', v: 'naosei' }
    ]
  },
  {

/* ─────────── MOTOR ─────────── */
const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));

/* Cenas condicionais: a lista visível depende do que já foi respondido. */
function cenasVisiveis() {
  return CENAS.filter(c => !c.quando || c.quando());
}

/* Efeito de digitação — respeita <strong>/<em> e quebra de parágrafo.
   Só digita na PRIMEIRA tela; nas seguintes o texto aparece pronto (não cansa).
   Durante a digitação, um toque em qualquer lugar completa o texto na hora. */
let _jaDigitou = false, _pularDigitar = false;
function _skipDigitar() { _pularDigitar = true; }
async function digitar(el, html, vel) {
  const full = String(html).replace(/\n/g, '<br><br>');
  if (_jaDigitou) { el.innerHTML = full; el.style.animation = 'entra .3s'; return; }
  _jaDigitou = true; _pularDigitar = false;
  window.addEventListener('pointerdown', _skipDigitar);
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buffer = '';
  outer:
  for (const p of partes) {
    if (p.startsWith('<')) { buffer += p; el.innerHTML = buffer + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      if (_pularDigitar) break outer;
      buffer += (ch === '\n') ? '<br><br>' : ch;
      el.innerHTML = buffer + '<span class="cursor"></span>';
      await espera('.!?'.includes(ch) ? (vel || 16) * 9 : ',;:'.includes(ch) ? (vel || 16) * 4 : (vel || 16));
    }
  }
  window.removeEventListener('pointerdown', _skipDigitar);
  el.innerHTML = full;
}

function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }

/* Acende as linhas do mapa a partir das opções escolhidas.
   Recalcula do zero a cada resposta: reeditar substitui, nunca soma. */
function recomporLinhas() {
  const set = new Set();
  CENAS.forEach(c => {
    const r = RESP[c.campo];
    if (!r) return;
    const vals = r.valores || (r.valor ? [r.valor] : []);
    vals.forEach(v => {
      const o = c.opcoes.find(x => x.v === v);
      (o && o.linhas || []).forEach(l => set.add(l));
    });
  });
  RESP._linhas = [...set];
  return RESP._linhas;
}

async function renderCena(i) {
  const visiveis = cenasVisiveis();
  const c = visiveis[i];
  if (!c) return renderResultado();
  progresso((i / (visiveis.length + 1)) * 100);

  const classeOp = c.muitas ? 'opcoes muitas' : c.lista ? 'opcoes lista' : 'opcoes';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">${c.rotulo}</div>
      <div class="titulo">${c.titulo}</div>
      <div class="corpo" id="corpo"></div>
      ${c.etapas ? `<div class="etapas" id="etapas" style="display:none;">${c.etapas.map(([n, t, d]) =>
        `<div class="etapa"><div class="etapa-n">${n}</div><div class="etapa-t"><b>${t}</b>${d}</div></div>`).join('')}</div>` : ''}
      ${c.destaque ? `<div class="destaque" id="dest" style="display:none;">💭 ${c.destaque}</div>` : ''}
      <div class="zona-resposta" id="zona">
        <div class="pergunta">${c.pergunta}</div>
        <div class="${classeOp}" id="ops">
          ${c.opcoes.map((o, k) => `<button class="op" data-k="${k}">${o.txt}</button>`).join('')}
        </div>
        ${c.nota ? `<div class="nota">${c.nota}</div>` : ''}
        ${c.tipo === 'multi' ? '<button class="btn btn-ouro" id="btMultiOk" style="margin-top:16px;">Continuar →</button>' : ''}
      </div>
      <div class="pular"><a id="lkPular">pular apresentação →</a></div>
    </div>`;
  window.scrollTo(0, 0);

  await digitar($('corpo'), c.corpo, 15);
  if (c.etapas) {
    await espera(200);
    const e = $('etapas'); e.style.display = 'grid'; e.style.animation = 'entra .5s';
  }
  if (c.destaque) {
    await espera(260);
    const d = $('dest'); d.style.display = 'block'; d.style.animation = 'entra .5s';
    d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  await espera(280);
  const zn = $('zona');
  zn.classList.add('on');
  await espera(160);
  zn.scrollIntoView({ behavior: 'smooth', block: 'end' });

  const avancar = async () => {
    recomporLinhas();
    salvarParcial();
    await espera(300);
    const novas = cenasVisiveis();
    // a cena atual pode ter feito surgir (ou sumir) uma condicional logo à frente:
    // reencontramos a posição pelo campo, em vez de confiar no índice antigo
    const pos = novas.findIndex(x => x.campo === c.campo);
    iCena = (pos >= 0 ? pos : i) + 1;
    if (iCena < novas.length) renderCena(iCena); else renderResultado();
  };

  if (c.tipo === 'multi') {
    // opção exclusiva: 'nenhuma dessas' e 'nunca precisamos disso' zeram o resto
    const iNenhuma = c.opcoes.findIndex(o => o.exclusiva || o.v === 'nenhuma');
    $('ops').querySelectorAll('.op').forEach(b => {
      b.onclick = () => {
        const k = Number(b.dataset.k);
        b.style.animation = 'none';
        // "nenhuma dessas" é exclusiva: marcar limpa o resto, e vice-versa
        if (k === iNenhuma) {
          $('ops').querySelectorAll('.op').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
        } else {
          b.classList.toggle('sel');
          if (iNenhuma >= 0) $('ops').querySelector(`.op[data-k="${iNenhuma}"]`).classList.remove('sel');
        }
      };
    });
    $('btMultiOk').onclick = async () => {
      const sel = [...$('ops').querySelectorAll('.op.sel')].map(b => c.opcoes[Number(b.dataset.k)]);
      if (!sel.length) { $('btMultiOk').textContent = 'Marque ao menos uma opção →'; return; }
      RESP[c.campo] = { valores: sel.map(o => o.v), textos: sel.map(o => o.txt) };
      await avancar();
    };
  } else {
    $('ops').querySelectorAll('.op').forEach(b => {
      b.onclick = async () => {
        const k = Number(b.dataset.k);
        const o = c.opcoes[k];
        $('ops').querySelectorAll('.op').forEach(x => { x.classList.remove('sel'); x.style.animation = 'none'; });
        b.classList.add('sel');
        RESP[c.campo] = { valor: o.v, texto: o.txt, i: k };
        await avancar();
      };
    });
  }
  $('lkPular').onclick = () => { recomporLinhas(); renderResultado(); };
}

/* ─────────── RESULTADO: o mapa, não o termômetro de risco ─────────── */
const fmtC = n => {
  if (n === null || n === undefined) return null;
  if (n >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (n >= 1e3) return 'R$ ' + (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
  return 'R$ ' + Number(n).toLocaleString('pt-BR');
};

/* A faixa que o cliente clicou vira um intervalo honesto — nunca um
   número de precisão falsa. Se ele não soube dizer, não inventamos. */
function caixaPreso() {
  const r = RESP.valorParadoFaixa;
  if (!r || typeof r.i !== 'number') return null;
  // se a resposta anterior mudou e a cena da faixa deixou de existir,
  // a faixa antiga não pode continuar valendo
  if (!cenasVisiveis().some(c => c.campo === 'valorParadoFaixa')) return null;
  const linha = DIC.valorParadoFaixa[r.i];
  if (!linha || linha[0] === 'vp_naosei') return null;
  const min = linha[1], max = linha[2];
  if (min === null && max === null) return null;
  return {
    min, max,
    texto: max === null ? 'acima de ' + fmtC(min) : (min === 0 ? 'até ' + fmtC(max) : fmtC(min) + ' a ' + fmtC(max))
  };
}

/* Grau de imobilização — mede o quanto a empresa trava capital e
   quantas frentes de garantia tem em aberto. Não é grau de risco. */
function calcularGrau() {
  let p = 0;
  const v = (c, mapa) => { const r = RESP[c]; return r && mapa[r.valor] !== undefined ? mapa[r.valor] : 0; };
  // em campo de múltipla escolha vale a opção mais pesada marcada, não a soma
  const vMax = (c, mapa) => {
    const r = RESP[c]; if (!r) return 0;
    const vs = r.valores || (r.valor ? [r.valor] : []);
    return vs.reduce((m, x) => Math.max(m, mapa[x] || 0), 0);
  };
  p += v('valorParado', { muito: 4, algum: 3, juridico: 2, nao: 0 });
  p += v('execFiscal', { sim_agora: 3, ja_teve: 2, naosei: 1, nao: 0 });
  p += v('nFiancas', { '0': 0, '1_2': 2, '3_5': 3, '6_mais': 4, naosei: 2 });
  p += v('licita', { sempre: 3, asvezes: 2, perdeu: 3, nao: 0 });
  p += vMax('comoGarante', { dinheiro: 3, fianca: 2, seguro: 0, nunca: 0, perdeu: 3 });
  p += Math.min(3, ((RESP._linhas || []).length) / 3);
  const max = 20;
  const pct = Math.round(Math.min(100, p / max * 100));
  let nivel, cor, frase;
  if (pct >= 60) {
    nivel = 'ALTO'; cor = '#f59e0b';
    frase = 'Sua empresa <strong>trava bastante capital</strong> em garantias — e em mais de uma frente ao mesmo tempo. É o cenário em que o Seguro Garantia mais devolve dinheiro, porque cada frente substituída libera caixa ou limite.';
  } else if (pct >= 30) {
    nivel = 'MODERADO'; cor = '#38bdf8';
    frase = 'Há <strong>capital imobilizado</strong> e frentes em aberto, mas ainda em escala administrável. Vale ter o limite aprovado agora: ele não custa nada parado, e é o que permite responder rápido quando a próxima exigência aparecer.';
  } else {
    nivel = 'BAIXO'; cor = '#34d399';
    frase = 'Hoje sua empresa <strong>imobiliza pouco</strong> em garantias. O valor aqui é de preparo: ter um limite aprovado antes é o que separa quem entra num contrato de quem descobre o prazo tarde demais.';
  }
  return { pct, nivel, cor, frase };
}

/* ─────────── CAMADA ANALÍTICA (CRM) ───────────
   Bloco achatado na raiz do registro: o Firestore filtra bem campo raso.
   Aqui o ouro não é cobertura removida — é a LISTA DE LINHAS acesas. */
function montarAnalitico(finalizou) {
  const cod = (campo) => {
    const r = RESP[campo];
    if (!r || typeof r.i !== 'number') return null;
    const linha = (DIC[campo] || [])[r.i];
    return linha ? linha[0] : null;
  };
  const cx = caixaPreso();
  const g = calcularGrau();
  // múltiplas: guarda o CÓDIGO estável de cada opção marcada, não o valor cru
  const cods = (campo) => {
    const c = CENAS.find(x => x.campo === campo), r = RESP[campo];
    if (!c || !r) return [];
    const vs = r.valores || (r.valor ? [r.valor] : []);
    return vs.map(val => {
      const i = c.opcoes.findIndex(o => o.v === val);
      const linha = (DIC[campo] || [])[i];
      return linha ? linha[0] : val;
    });
  };
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao',
    completo: !!finalizou, passo: iCena,
    comoGaranteCod: cods('comoGarante'),
    valorParadoCod: cod('valorParado'),
    caixaPresoMin: cx ? cx.min : null,
    caixaPresoMax: cx ? cx.max : null,
    caixaPresoMid: cx ? (cx.max === null ? cx.min : (cx.min + cx.max) / 2) : null,
    execFiscalCod: cod('execFiscal'),
    nFiancasCod: cod('nFiancas'),
    sabeTaxaCod: cod('sabeTaxa'),
    licitaCod: cod('licita'),
    fazSentidoCod: cod('fazSentido'),
    contratualCod: cods('contratual'),
    especificasCod: cods('especificas'),
    oQueMudariaCod: cods('oQueMudaria'),
    linhas: RESP._linhas || [],
    nLinhas: (RESP._linhas || []).length,
    grauPct: g.pct, grauNivel: g.nivel,
    alinhamento: RESP.alinhamento || null
  };
}

/* ─────────── PERSISTÊNCIA ─────────── */
function montarRoteiroAp() {
  try {
    var arr = Array.isArray(CENAS) ? CENAS : Object.keys(CENAS).map(function (k) { return CENAS[k]; });
    return arr.filter(function (c) { return c && c.pergunta && c.campo; }).map(function (c) {
      var v = RESP[c.campo], r = null;
      if (v) r = v.texto || (v.textos && v.textos.join(' · ')) || (v.valor != null ? String(v.valor) : (typeof v === 'string' || typeof v === 'number' ? String(v) : null));
      return { k: c.campo, p: (c.pergunta || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(), r: r };
    });
  } catch (e) { return []; }
}

async function salvarParcial(finalizou) {
  try {
    if (!SESSAO) return;
    const _upd = {
      respostas: RESP, roteiroApres: montarRoteiroAp(),
      analitico: montarAnalitico(finalizou),
      cenasVistas: Math.min(iCena + 1, cenasVisiveis().length),
      totalCenas: cenasVisiveis().length,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (finalizou) _upd.concluiu = true;   // trava: uma vez concluído, salvamentos parciais não zeram
    await db.collection('mb_apresentacoes').doc(SESSAO).set(_upd, { merge: true });
  } catch (e) { console.warn('salvar parcial', e); }
}

async function registrarInteresse(tipo) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }),
      ultimoInteresse: tipo,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('interesse', e); }
}

async function salvarQuestionario(finalizou) {
  try {
    if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP,
      questionarioCompleto: !!finalizou,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar questionario', e); }
}

document.addEventListener('DOMContentLoaded', async () => {
  /* usa a sessão já existente se houver (ex.: corretor logado no painel) — não a substitui; só entra anônimo se ninguém estiver logado */
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}

  const token = new URLSearchParams(location.search).get('t');

  // Sessão ESTÁVEL: com token, a mesma pessoa sempre atualiza o MESMO registro,
  // e o questionário cai nele também. Sem token, guarda na aba.
  if (token) SESSAO = 'garantia_' + token;
  else {
    try { SESSAO = sessionStorage.getItem('sessao_ap_garantia'); } catch (e) {}
    if (!SESSAO) {
      SESSAO = 'ap_' + PRODUTO.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      try { sessionStorage.setItem('sessao_ap_garantia', SESSAO); } catch (e) {}
    }
  }

  const base = {
    produtoId: PRODUTO.id, produtoNome: PRODUTO.nome,
    token: token || null, origem: 'apresentacao',
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    userAgent: navigator.userAgent.slice(0, 180)
  };

  if (token) {
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.linkId = snap.docs[0].id;
        base.empresaId = LINK.empresaId || null;
        base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null;
        base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null;
        base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        try {
          await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({
            aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch (e2) {}
      }
    } catch (e) { console.warn('link', e); }
  }
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }

  renderCena(0);
});
</script>
