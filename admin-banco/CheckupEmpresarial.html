<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --azul-fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --laranja:#fb923c; --vermelho:#f87171;
    --texto:#e8eeff; --suave:#93a4c8; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--azul-fundo); color:var(--texto);
    min-height:100vh; min-height:100dvh; overflow-x:hidden; position:relative; }
  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .fumaca span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; animation:flutuar 22s ease-in-out infinite; }
  .f1 { width:56vw; height:56vw; background:radial-gradient(circle,#1e40af,transparent 70%); top:-14%; left:-12%; }
  .f2 { width:46vw; height:46vw; background:radial-gradient(circle,#0ea5e9,transparent 70%); bottom:-16%; right:-10%; animation-delay:-7s; }
  .f3 { width:38vw; height:38vw; background:radial-gradient(circle,#334155,transparent 70%); top:38%; left:52%; animation-delay:-14s; }
  @keyframes flutuar { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(4vw,-3vh) scale(1.1);} 66%{transform:translate(-3vw,4vh) scale(.95);} }
  .grao { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035;
    background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:3px 3px; }
  .palco { position:relative; z-index:2; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; justify-content:safe center;
    padding:56px 22px calc(90px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto; }
  .marca { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.22em; color:#4b5f8a; font-weight:700; z-index:3; text-transform:uppercase; white-space:nowrap; }
  .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--ciano),var(--dourado));
    z-index:5; transition:width .5s cubic-bezier(.4,0,.2,1); width:0; box-shadow:0 0 12px rgba(56,189,248,.6); }
  .cena { width:100%; animation:entra .5s cubic-bezier(.16,1,.3,1); }
  @keyframes entra { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:none;} }
  .rotulo { font-size:11px; letter-spacing:.18em; color:var(--ciano); font-weight:700; text-transform:uppercase; margin-bottom:14px; }
  .titulo { font-size:clamp(23px,5.2vw,35px); font-weight:800; line-height:1.24; margin-bottom:16px; letter-spacing:-.02em; }
  .titulo em { color:var(--dourado); font-style:normal; }
  .corpo { font-size:clamp(15px,3.4vw,17px); line-height:1.68; color:#c3d0ec; font-weight:300; }
  .corpo strong { color:#fff; font-weight:600; }
  .corpo em { color:var(--dourado); font-style:normal; font-weight:500; }
  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--ciano); vertical-align:text-bottom; margin-left:2px; animation:pisca .85s step-end infinite; }
  @keyframes pisca { 50% { opacity:0; } }
  .destaque { border-left:3px solid var(--dourado); background:rgba(251,191,36,.07); padding:15px 18px; border-radius:0 12px 12px 0; margin:20px 0; font-size:14.5px; line-height:1.62; color:#e5d5a8; }
  .destaque strong { color:#fff3cf; }
  .cenario { border:1px solid rgba(248,113,113,.28); background:linear-gradient(135deg,rgba(248,113,113,.08),rgba(251,146,60,.05));
    border-radius:14px; padding:16px 18px; margin:18px 0; font-size:14.5px; line-height:1.65; color:#f3d9d3; }
  .cenario .tag { display:block; font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:#fca5a5; margin-bottom:6px; }
  .zona-resposta { margin-top:28px; }
  .pergunta { font-size:clamp(16px,3.6vw,19px); font-weight:600; color:#fff; margin-bottom:16px; line-height:1.45; }
  .opcoes { display:flex; gap:11px; flex-wrap:wrap; }
  .op { flex:1; min-width:132px; padding:15px 17px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.05);

    transition:all .2s; text-align:center; }
  .op:hover, .op:focus { background:rgba(56,189,248,.14); border-color:var(--ciano); transform:translateY(-2px); outline:none; }
  .op.sel { background:rgba(56,189,248,.2); border-color:var(--ciano); }
  .op.sel::after { content:' ✓'; color:var(--ciano); }
  .opcoes.lista { flex-direction:column; } .opcoes.lista .op { text-align:left; min-width:0; }
  .opcoes.grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px; }
  .opcoes.grade .op { padding:13px 14px; font-size:14px; min-width:0; }
  .btn { padding:16px 30px; border-radius:14px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--ciano),#2563eb);
    color:#031127; font-size:15px; font-weight:800; font-family:inherit; transition:all .22s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(56,189,248,.32); }
  .btn-2 { background:rgba(255,255,255,.07); color:var(--texto); border:1.5px solid rgba(147,164,200,.3); }
  .btn-ouro { background:linear-gradient(135deg,var(--dourado),#f59e0b); color:#2a1a00; }
  .campo { width:100%; padding:16px 18px; border-radius:14px; font-size:16px; font-family:inherit; background:rgba(255,255,255,.05);
    border:1.5px solid rgba(147,164,200,.28); color:#fff; transition:all .22s; }
  .campo:focus { outline:none; border-color:var(--ciano); background:rgba(56,189,248,.1); }
  .campo::placeholder { color:#5d6f95; }
  .lbl { font-size:12.5px; color:var(--suave); font-weight:600; margin-bottom:7px; display:block; }
  .voltar { background:none; border:none; color:var(--suave); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:0; margin-bottom:16px; }
  .voltar:hover { color:#fff; }
  .rodape { margin-top:26px; text-align:center; font-size:12.5px; color:#5d6f95; }
  .rodape a { color:#7b8db3; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* ── entrada: os dois caminhos ── */
  .caminhos { display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:26px; }
  .caminho { text-align:left; padding:20px 20px 18px; border-radius:16px; cursor:pointer; font-family:inherit; color:var(--texto);
    background:rgba(255,255,255,.05); border:1.5px solid rgba(147,164,200,.28); transition:all .22s; }
  .caminho:hover { border-color:var(--ciano); background:rgba(56,189,248,.1); transform:translateY(-3px); }
  .caminho .t { font-size:17px; font-weight:800; margin-bottom:3px; }
  .caminho .m { font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--ciano); margin-bottom:10px; }
  .caminho .d { font-size:13.5px; line-height:1.55; color:#aebcdb; font-weight:400; }
  .caminho.ouro .m { color:var(--dourado); } .caminho.ouro:hover { border-color:var(--dourado); background:rgba(251,191,36,.08); }

  /* ── mapa de famílias ── */
  .mapa { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:11px; margin-top:22px; }
  .fam { text-align:left; padding:16px; border-radius:15px; cursor:pointer; font-family:inherit; color:var(--texto); position:relative;
    background:rgba(255,255,255,.05); border:1.5px solid rgba(147,164,200,.24); transition:all .22s; overflow:hidden; }
  .fam:hover { border-color:var(--ciano); transform:translateY(-3px); background:rgba(56,189,248,.09); }
  .fam .ico { font-size:24px; margin-bottom:9px; display:block; }
  .fam .n { font-size:14.5px; font-weight:700; line-height:1.3; margin-bottom:5px; }
  .fam .c { font-size:12px; color:var(--suave); line-height:1.45; }
  .fam .pts { display:flex; gap:4px; margin-top:12px; flex-wrap:wrap; }
  .pt { width:9px; height:9px; border-radius:50%; background:rgba(147,164,200,.25); }
  .pt.tem { background:var(--verde); } .pt.defasada { background:var(--dourado); } .pt.nao { background:var(--vermelho); } .pt.naosei { background:#a78bfa; }
  .fam.cheia { border-color:rgba(52,211,153,.4); }
  .legenda { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--suave); margin-top:14px; }
  .legenda span { display:flex; align-items:center; gap:6px; }

  /* ── linha de cobertura ── */
  .cob { border:1.5px solid rgba(147,164,200,.2); border-radius:14px; background:rgba(255,255,255,.04); margin-bottom:10px; overflow:hidden; transition:border-color .2s; }
  .cob.tem { border-color:rgba(52,211,153,.45); } .cob.defasada { border-color:rgba(251,191,36,.5); }
  .cob.nao { border-color:rgba(248,113,113,.5); } .cob.naosei { border-color:rgba(167,139,250,.5); }
  .cob-topo { display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; width:100%; background:none; border:none; color:var(--texto); font-family:inherit; text-align:left; }
  .cob-topo .nm { flex:1; font-size:14.5px; font-weight:600; line-height:1.35; }
  .cob-topo .inf { width:24px; height:24px; border-radius:50%; border:1.5px solid rgba(56,189,248,.6); color:var(--ciano); font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-style:italic; font-family:Georgia,serif; }
  .cob-topo .st { font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  .cob-det { display:none; padding:0 15px 4px; font-size:13.5px; line-height:1.6; color:#c3d0ec; }
  .cob.aberta .cob-det { display:block; animation:entra .3s; }
  .cob-det .ex { margin-top:9px; padding:10px 12px; border-radius:10px; background:rgba(248,113,113,.07); border-left:2px solid rgba(248,113,113,.5); color:#f3d9d3; font-size:13px; }
  .cob-det .ex b { color:#fca5a5; font-size:10px; letter-spacing:.14em; text-transform:uppercase; display:block; margin-bottom:3px; }
  .chips { display:flex; gap:7px; flex-wrap:wrap; padding:4px 15px 14px; }
  .chip { flex:1; min-width:74px; padding:9px 8px; border-radius:10px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    background:rgba(255,255,255,.05); border:1.5px solid rgba(147,164,200,.25); color:#c3d0ec; transition:all .18s; }
  .chip:hover { border-color:var(--ciano); color:#fff; }
  .chip.on.tem { background:rgba(52,211,153,.2); border-color:var(--verde); color:#d1fae5; }
  .chip.on.defasada { background:rgba(251,191,36,.18); border-color:var(--dourado); color:#fef3c7; }
  .chip.on.nao { background:rgba(248,113,113,.18); border-color:var(--vermelho); color:#fee2e2; }
  .chip.on.naosei { background:rgba(167,139,250,.18); border-color:#a78bfa; color:#ede9fe; }
  .impacto { padding:0 15px 14px; display:none; }
  .impacto.on { display:block; animation:entra .3s; }
  .impacto .q { font-size:12.5px; color:var(--suave); margin-bottom:7px; font-weight:600; }
  .impacto .chip.on { background:rgba(56,189,248,.2); border-color:var(--ciano); color:#fff; }

  /* ── faixa de eco: acompanha, nunca trava ── */
  .eco { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); z-index:9; width:min(700px,calc(100vw - 28px));
    background:rgba(8,28,48,.96); border:1px solid rgba(52,211,153,.45); border-left:3px solid var(--verde); border-radius:4px 14px 14px 4px;
    padding:12px 16px 14px; font-size:13.5px; line-height:1.55; color:#d5f5e6; opacity:0; transition:all .4s cubic-bezier(.16,1,.3,1); cursor:pointer;
    box-shadow:0 14px 40px rgba(0,0,0,.45); overflow:hidden; }
  .eco.on { opacity:1; transform:translate(-50%,0); }
  .eco i { position:absolute; left:0; bottom:0; height:2px; background:var(--verde); width:100%; transform-origin:left; }

  /* ── resultado ── */
  .placar { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:22px 0 8px; }
  .plc { border-radius:13px; padding:13px 10px; text-align:center; background:rgba(255,255,255,.045); border:1px solid rgba(147,164,200,.16); }
  .plc .n { font-size:clamp(26px,7vw,38px); font-weight:800; line-height:1; letter-spacing:-.03em; }
  .plc .l { font-size:10.5px; color:var(--suave); margin-top:6px; line-height:1.3; text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
  .cards-risco { display:grid; gap:10px; margin:18px 0; }
  .card-risco { background:rgba(255,255,255,.045); border:1px solid rgba(147,164,200,.16); border-radius:12px; padding:13px 16px;
    font-size:13.5px; line-height:1.55; color:#c3d0ec; display:flex; gap:11px; align-items:flex-start; }
  .card-risco b { color:#fff; font-weight:600; }
  .card-risco.atencao { border-color:rgba(251,146,60,.4); background:rgba(251,146,60,.07); }
  .card-risco.critico { border-color:rgba(248,113,113,.5); background:rgba(248,113,113,.08); }
  .card-risco.ok { border-color:rgba(52,211,153,.3); background:rgba(52,211,153,.06); }
  .subt { font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin:22px 0 10px; }
  .acoes-finais { display:flex; flex-direction:column; gap:11px; margin-top:24px; }
  .acoes-finais .btn { width:100%; }
  .fim-ok { text-align:center; padding:20px 0; } .fim-ok .ico { font-size:56px; margin-bottom:14px; }
  @media (max-width:560px) { .palco { padding:52px 16px calc(96px + env(safe-area-inset-bottom)); } .caminhos { grid-template-columns:1fr; }
    .op { min-width:100%; } .opcoes.grade .op { min-width:0; } .placar { grid-template-columns:repeat(2,1fr); } .mapa { grid-template-columns:1fr 1fr; } }
</style>

<body>
<div class="fumaca"><span class="f1"></span><span class="f2"></span><span class="f3"></span></div>
<div class="grao"></div>
<div class="progresso" id="prog"></div>
<div class="marca">Retorno Seguros</div>
<div class="palco"><div id="palco" style="width:100%;"></div></div>
<div class="eco" id="eco"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   SEGURO EMPRESARIAL — APRESENTAÇÃO v3 (arquivo: CheckupEmpresarial.html)
   Dois caminhos a partir da mesma base de conteúdo (CONTEUDO):
     • VISÃO RÁPIDA  — mapa de famílias → coberturas → volta ao mapa.
     • CHECK-UP      — família a família: pergunta de memória → cena →
                       status de cada cobertura em um clique.
   Psicologia: autonomia (ele escolhe o caminho), vividez (a cena antes
   do clique), conclusão autogerada (é ELE quem marca "não temos" e
   "pararia a empresa"), mapa que se pinta (vontade de completar) e
   ritmo sem trava (o eco acompanha a tela seguinte, nunca segura).
   Nada aqui é dado de cotação — é para pensar e aprender.
   O QUESTIONÁRIO lê deste mesmo registro: respostas.m_* (memórias),
   respostas._mapa (status por cobertura) e respostas.atividade.
   Regras da casa: nenhuma seguradora citada, nenhuma promessa de preço.
   ══════════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PRODUTO = { id: 'empresarial', nome: 'Seguro Empresarial' };
const ARQ_VERSAO = '3';
window.ARQ_VERSAO = ARQ_VERSAO;

let SESSAO = null, LINK = null, QRESP = {};
let RESP = { _mapa: {} };      // _mapa: { cobId: { s:'tem|defasada|nao|naosei', i:'pequeno|serio|pararia'|null } }
let CAMINHO = null;            // 'simples' | 'completo'
let TELAS = 0;                 // telas vistas (para o funil do painel)

/* ─── STATUS ─── */
const ST = {
  tem:      { t: 'Temos',              cor: 'var(--verde)' },
  defasada: { t: 'Temos, mas defasada', curto: 'Defasada', cor: 'var(--dourado)' },
  nao:      { t: 'Não temos',          cor: 'var(--vermelho)' },
  naosei:   { t: 'Não sei',            cor: '#a78bfa' }
};
/* quem não tem seguro responde com outra régua — mesmos códigos por trás */
const ST_SEM = { tem: 'Não se aplica a nós', defasada: 'Talvez', nao: 'Precisamos disso', naosei: 'Não sei' };
const IMP = { pequeno: 'Pequeno', serio: 'Sério', pararia: 'Pararia a empresa' };
const ECO_ST = {
  tem: 'Anotado. Ter a cobertura não é o mesmo que tê-la no valor certo — limite e franquia são o que a revisão confere.',
  defasada: 'É o ponto mais comum que existe: a cobertura está lá, mas o valor ficou parado no tempo enquanto a empresa cresceu.',
  nao: 'Anotado como ponto em aberto. Você decide depois se faz sentido — o importante é que agora a decisão é consciente.',
  naosei: 'Resposta honesta — e útil. A Retorno verifica isso na apólice para você.'
};
const temSeguro = () => !(RESP.situacao && RESP.situacao.valor === 'nao_tenho');

/* ─── ATIVIDADES ─── */
const ATIVIDADES = [
  { v: 'industria', t: 'Indústria / fábrica' }, { v: 'comercio', t: 'Comércio / loja' },
  { v: 'deposito', t: 'Depósito / logística' }, { v: 'servicos', t: 'Serviços / escritório' },
  { v: 'alimentacao', t: 'Alimentação / restaurante' }, { v: 'oficina', t: 'Oficina / automotivo' },
  { v: 'outra', t: 'Outra atividade' }
];
const atv = () => (RESP.atividade && RESP.atividade.valor) || 'outra';

/* ─── CONTEÚDO: 8 famílias, 35 coberturas ───
   Base: coberturas do compreensivo empresarial (JSON v3). As "cenas" são
   CENÁRIOS TÍPICOS de mercado — não casos de clientes. */
const CONTEUDO = [
  { id: 'fogo', ico: '🔥', nome: 'Fogo e explosão', chamada: 'O alicerce de toda apólice',
    titulo: 'Ninguém pensa em incêndio. <em>Pensa em um motor que esquentou.</em>',
    intro: 'Todo mundo sabe o que é incêndio — e quase ninguém pensa em <strong>onde ele começa</strong>. Raramente é uma tragédia anunciada: é um detalhe pequeno, num dia comum, que encontra material para queimar.',
    cena: {
      industria: 'Sexta-feira, 22h. O motor de uma máquina de R$ 80 mil superaquece com a fábrica vazia. Em quarenta minutos o fogo sai da máquina, encontra pó, embalagem e produto acabado, e chega ao estoque. A máquina valia R$ 80 mil. O prejuízo passou de R$ 6 milhões — e a produção ficou cinco meses parada.',
      comercio: 'Domingo de madrugada. Um curto na tomada do depósito dos fundos, onde ficam as caixas de papelão. Quando o alarme do vizinho toca, a fumaça já tomou a loja inteira: o que o fogo não queimou, a fuligem e a água dos bombeiros inutilizaram. Estoque de fim de ano, 100% perdido.',
      deposito: 'A empilhadeira elétrica fica carregando durante a noite, ao lado de um corredor de paletes. A bateria falha. Com mercadoria empilhada a oito metros, o fogo sobe antes de se espalhar — e quando o teto cede, não há mais o que salvar. A mercadoria era, em boa parte, de clientes.',
      alimentacao: 'Gordura acumulada no duto da coifa. Uma labareda comum na chapa sobe pela exaustão e o fogo caminha por dentro do forro, fora da vista. O salão é evacuado em minutos; a cozinha, os equipamentos e três meses de faturamento se vão com ele.',

/* Digitação: só na primeira tela; um toque completa. */
let _jaDigitou = false, _pular = false;
async function digitar(el, html) {
  const full = String(html).replace(/\n/g, '<br><br>');
  if (_jaDigitou) { el.innerHTML = full; return; }
  _jaDigitou = true; _pular = false;
  const skip = () => { _pular = true; };
  window.addEventListener('pointerdown', skip);
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean); let buf = '';
  outer: for (const p of partes) {
    if (p.startsWith('<')) { buf += p; continue; }
    for (const ch of p) {
      if (_pular) break outer;
      buf += ch === '\n' ? '<br><br>' : ch;
      el.innerHTML = buf + '<span class="cursor"></span>';
      await espera('.!?'.includes(ch) ? 120 : ',;:'.includes(ch) ? 50 : 13);
    }
  }
  window.removeEventListener('pointerdown', skip);
  el.innerHTML = full;
}

/* ECO — a devolutiva ACOMPANHA a próxima tela; nunca segura o cliente.
   Tempo proporcional ao texto; um toque dispensa. */
let _ecoT = null;
function eco(txt) {
  const e = $('eco'); if (!txt) return;
  clearTimeout(_ecoT);
  const ms = Math.min(9000, Math.max(3800, txt.replace(/<[^>]+>/g, '').length * 55));
  e.innerHTML = txt + `<i style="animation:ecoBar ${ms}ms linear forwards;"></i>`;
  e.classList.add('on');
  e.onclick = () => e.classList.remove('on');
  _ecoT = setTimeout(() => e.classList.remove('on'), ms);
}
document.head.insertAdjacentHTML('beforeend', '<style>@keyframes ecoBar{from{transform:scaleX(1);}to{transform:scaleX(0);}}</style>');

function ligarCobs(raiz, aoMudar) {
  raiz.querySelectorAll('.cob').forEach(box => {

    box.querySelectorAll('.chip[data-s]').forEach(c => c.onclick = () => {
      const s = c.dataset.s, antes = RESP._mapa[id] || {};
      RESP._mapa[id] = { s, i: s === 'tem' ? null : (antes.i || null) };
      box.className = 'cob ' + s + (box.classList.contains('aberta') ? ' aberta' : '');

      box.querySelector('.impacto').classList.toggle('on', s !== 'tem');

    box.querySelectorAll('.chip[data-i]').forEach(c => c.onclick = () => {

    });
  });
}

/* ══════════ RESULTADO ══════════ */
function calcular() {
  const cont = { tem: 0, defasada: 0, nao: 0, naosei: 0 }; let score = 0, max = 0;
  const abertos = [];
  TODAS.forEach(it => {
    const m = RESP._mapa[it.id]; if (!m || !m.s) return;
    cont[m.s]++; max += 3;
    if (m.s === 'tem') return;
    const peso = m.i === 'pararia' ? 3 : m.i === 'serio' ? 2 : m.i === 'pequeno' ? 0.5 : (m.s === 'naosei' ? 1 : 1.5);
    score += peso; abertos.push(Object.assign({ peso, m }, it));
  });
  abertos.sort((a, b) => b.peso - a.peso);
  const n = cont.tem + cont.defasada + cont.nao + cont.naosei;
  const pct = max ? Math.round(score / max * 100) : 0;
  const nivel = pct >= 45 ? 'ALTA' : pct >= 20 ? 'MODERADA' : 'CONTROLADA';
  return { cont, n, pct, nivel, abertos, criticos: abertos.filter(a => a.m.i === 'pararia') };
}
function cardsMemoria(R) {
  const out = [], v = c => RESP[c] && RESP[c].valor, st = id => (RESP._mapa[id] || {}).s;
  const aberto = id => st(id) && st(id) !== 'tem';
  if ((v('m_clima') === '3_5' || v('m_clima') === '5_mais') && aberto('vendaval_granizo'))
    out.push(['⛈️', `<b>Você lembrou de ${RESP.m_clima.texto.toLowerCase()} temporais fortes em 5 anos</b> — e marcou vendaval/granizo como "${rotStatus(st('vendaval_granizo')).toLowerCase()}". Nessa frequência, é a primeira cobertura a rever.`]);
  if ((v('m_eletrico') === '4_10' || v('m_eletrico') === 'muitas') && aberto('danos_eletricos'))
    out.push(['⚡', '<b>Energia instável + danos elétricos em aberto.</b> É o sinistro mais frequente das apólices empresariais — e, pelas suas respostas, o mais provável na sua.']);
  if (['3_6m', '6m_mais', 'naosei'].includes(v('m_parada')) && aberto('lucros_cessantes'))
    out.push(['🚪', `<b>Retomada estimada em "${RESP.m_parada.texto.toLowerCase()}" e lucros cessantes em aberto.</b> O prédio tem conserto; meses de despesa fixa sem receita é o que fecha empresa.`]);
  if (['20_100', '100_mais'].includes(v('m_terceiros')) && aberto('rc_estabelecimento'))
    out.push(['🤝', '<b>Muita circulação de terceiros e RC do estabelecimento em aberto.</b> É a única exposição sem teto natural — uma indenização não tem "valor de reposição".']);
  if (v('m_apoio') === 'nao_sabia' || v('m_apoio') === 'conhecido')
    out.push(['🧰', '<b>Assistência 24h provavelmente paga e não usada.</b> Chaveiro, eletricista, encanador e telhado provisório costumam já estar no prêmio.']);
  return out;
}

/* ══════════ PDF — documento para guardar e levar à renovação ══════════ */
function gerarPDF() {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) return eco('A biblioteca de PDF não carregou. Recarregue a página e tente de novo.');
    const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 18; let y = 0;
    const sa = s => String(s || '').replace(/<[^>]+>/g, '').replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/→/g, '>').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '');
    const quebra = lim => { if (y > lim) { doc.addPage(); y = M + 6; } };
    const R = calcular(), tem = temSeguro();
    const emp = (LINK && LINK.empresaNome) || (QRESP.contato && QRESP.contato.empresa) || '';

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 46, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(19); doc.setFont(undefined, 'bold');
    doc.text('Mapa da protecao empresarial', M, 22);
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(147, 164, 200);
    doc.text(sa((emp ? emp + '  |  ' : '') + new Date().toLocaleDateString('pt-BR') + '  |  Retorno Seguros'), M, 32);
    y = 58;

    doc.setFillColor(255, 247, 237); doc.roundedRect(M, y - 7, W - M * 2, 20, 2, 2, 'F');
    doc.setFontSize(11.5); doc.setFont(undefined, 'bold'); doc.setTextColor(154, 52, 18);
    doc.text(sa(`${R.n} coberturas avaliadas: ${R.cont.tem} ${tem ? 'protegidas' : 'nao se aplicam'} | ${R.cont.defasada} ${tem ? 'defasadas' : 'talvez'} | ${R.cont.nao} ${tem ? 'em aberto' : 'necessarias'} | ${R.cont.naosei} nao sei`), M + 5, y + 2);
    doc.setFontSize(8.5); doc.setFont(undefined, 'normal');
    doc.text('Avaliacao feita por voce, sobre a sua propria empresa - pauta de revisao, nao analise formal de apolice.', M + 5, y + 8);
    y += 24;

    if (R.abertos.length) {
      doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42); doc.text('Por onde comecar', M, y); y += 7;
      R.abertos.slice(0, 6).forEach(a => {
        quebra(262); doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
        const l = doc.splitTextToSize(sa(`- ${a.n}: ${rotStatus(a.m.s)}${a.m.i ? ' | prejuizo ' + IMP[a.m.i].toLowerCase() : ''}`), W - M * 2 - 2);
        doc.text(l, M + 2, y); y += l.length * 4.4 + 2;
      }); y += 4;
    }

    CONTEUDO.forEach(f => {
      quebra(235);
      doc.setFontSize(11.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109); doc.text(sa(f.nome), M, y); y += 6;
      f.itens.forEach(it => {
        quebra(262);
        const m = RESP._mapa[it.id];
        doc.setFontSize(9.8); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
        doc.text(sa('[' + (m && m.s ? rotStatus(m.s) : 'nao avaliada') + ']  ' + it.n), M + 2, y); y += 4.6;
        doc.setFontSize(9); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
        const l = doc.splitTextToSize(sa(it.o), W - M * 2 - 6); doc.text(l, M + 5, y); y += l.length * 4.1 + 2.6;
      }); y += 3;
    });

    quebra(200);
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42); doc.text('Checklist de toda renovacao', M, y); y += 7;
    const marc = (RESP.mudancas && RESP.mudancas.valores) || [];
    MUDANCAS.filter(o => !o.excl).forEach(o => {
      quebra(270); doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      doc.text(sa((marc.includes(o.v) ? '[X] ' : '[  ] ') + o.t), M + 2, y); y += 5;
    });
    y += 3; quebra(255);
    const t2 = doc.splitTextToSize('Toda alteracao relevante de risco deve ser comunicada a seguradora. Valores em risco devem refletir custo de reconstrucao/reposicao a novo, nao valor contabil. Coberturas, limites e franquias conforme as condicoes gerais e a apolice contratada.', W - M * 2);
    doc.setFontSize(9); doc.text(t2, M, y);

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(148, 163, 184);
      doc.text('Material informativo. Nao constitui proposta nem analise formal da apolice. Cenarios citados sao ilustrativos.', M, 288); doc.text(`${i}/${n}`, W - M, 288, { align: 'right' }); }
    doc.save('mapa-protecao-empresarial-retorno-seguros.pdf');
  } catch (e) { eco('Não consegui gerar o PDF: ' + e.message); }
}

/* ══════════ PERSISTÊNCIA ══════════
   Formato que o painel já entende: respostas[k] = { texto | textos }.
   Campos com "_" não aparecem como linha (são lidos pelo questionário e
   pelo bloco próprio): _mapa, _vuln (acende a barra de nível), _retrato. */
function compactarFamilias() {
  CONTEUDO.forEach(f => {
    const tx = f.itens.filter(i => (RESP._mapa[i.id] || {}).s).map(i => { const m = RESP._mapa[i.id]; return `${i.n}: ${rotStatus(m.s)}${m.i ? ' (' + IMP[m.i].toLowerCase() + ')' : ''}`; });
    if (tx.length) RESP['fam_' + f.id] = { textos: tx }; else delete RESP['fam_' + f.id];
  });
}
function montarRoteiroAp() {
  const r = [], T = c => (RESP[c] && (RESP[c].texto || (RESP[c].textos || []).join(' · '))) || null;
  r.push({ k: 'caminho', p: 'Caminho escolhido', r: T('caminho') });
  r.push({ k: 'atividade', p: 'O que a empresa faz', r: T('atividade') });
  r.push({ k: 'situacao', p: 'Tem seguro empresarial hoje', r: T('situacao') });
  CONTEUDO.forEach(f => {
    if (CAMINHO === 'completo') r.push({ k: f.memoria.campo, p: f.memoria.p, r: T(f.memoria.campo) });
    f.itens.forEach(i => { const m = RESP._mapa[i.id]; r.push({ k: 'cob_' + i.id, p: f.nome + ' — ' + i.n, r: m && m.s ? rotStatus(m.s) + (m.i ? ' · prejuízo ' + IMP[m.i].toLowerCase() : '') : null }); });
  });
  if (temSeguro()) r.push({ k: 'mudancas', p: 'O que mudou desde a última revisão', r: T('mudancas') });
  r.push({ k: 'alinhamento', p: 'Faz sentido rever', r: RESP.alinhamento === 'sim' ? 'Faz sentido' : RESP.alinhamento === 'duvida' ? 'Ainda tenho dúvidas' : null });
  return r;
}
function montarAnalitico(finalizou) {
  const R = calcular(), v = c => (RESP[c] && RESP[c].valor) || null, por = s => TODAS.filter(i => (RESP._mapa[i.id] || {}).s === s).map(i => i.id);
  return {
    esquema: 3, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao', completo: !!finalizou,
    caminho: CAMINHO, atividadeCod: v('atividade'), situacaoCod: v('situacao'), temSeguro: RESP.situacao ? temSeguro() : null,
    nVistas: R.n, nTem: R.cont.tem, nDefasada: R.cont.defasada, nNao: R.cont.nao, nNaoSei: R.cont.naosei, nCriticos: R.criticos.length,
    vulnPct: R.pct, vulnNivel: R.nivel,
    cobTem: por('tem'), cobDefasada: por('defasada'), cobNao: por('nao'), cobNaoSei: por('naosei'), cobCriticas: R.criticos.map(a => a.id),
    memClima: v('m_clima'), memEletrico: v('m_eletrico'), memParada: v('m_parada'), memTerceiros: v('m_terceiros'),
    memFogo: v('m_fogo'), memRoubo: v('m_roubo'), memEspecificos: v('m_especificos'), memApoio: v('m_apoio'),
    mudancasFlags: (RESP.mudancas && RESP.mudancas.valores) || [], alinhamento: RESP.alinhamento || null
  };
}
const TOTAL_TELAS = () => CAMINHO === 'completo' ? 3 + CONTEUDO.length * 2 + 2 : 3 + CONTEUDO.length + 2;
let _salvT = null;
function salvarParcial(finalizou) {           // agrupa cliques rápidos numa gravação só
  if (finalizou) { clearTimeout(_salvT); return _gravar(true); }
  clearTimeout(_salvT); _salvT = setTimeout(() => _gravar(false), 500);
}
async function _gravar(finalizou) {
  try { if (!SESSAO) return;
    compactarFamilias();
    const upd = { respostas: RESP, roteiroApres: montarRoteiroAp(), analitico: montarAnalitico(finalizou),
      cenasVistas: Math.min(TELAS, TOTAL_TELAS()), totalCenas: TOTAL_TELAS(), atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };
    if (finalizou) upd.concluiu = true;
    await db.collection('mb_apresentacoes').doc(SESSAO).set(upd, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}
async function registrarInteresse(tipo) {
  try { if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({ interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }),
      ultimoInteresse: tipo, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  } catch (e) { console.warn('interesse', e); }
}
async function salvarContato() {
  try { if (!SESSAO) return;
    /* merge por campo: não apaga um questionário já iniciado neste mesmo registro */
    await db.collection('mb_apresentacoes').doc(SESSAO).set({ questionario: { contato: QRESP.contato }, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  } catch (e) { console.warn('contato', e); }
}

        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
