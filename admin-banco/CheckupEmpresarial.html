<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --azul-fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --laranja:#fb923c;
    --texto:#e8eeff; --suave:#93a4c8; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--azul-fundo); color:var(--texto);
    min-height:100vh; min-height:100dvh; overflow-x:hidden; position:relative; }
  .fumaca { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .fumaca span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; animation:flutuar 22s ease-in-out infinite; }
  .f1 { width:56vw; height:56vw; background:radial-gradient(circle,#1e40af,transparent 70%); top:-14%; left:-12%; }
  .f2 { width:46vw; height:46vw; background:radial-gradient(circle,#0ea5e9,transparent 70%); bottom:-16%; right:-10%; animation-delay:-7s; }
  .f3 { width:38vw; height:38vw; background:radial-gradient(circle,#334155,transparent 70%); top:38%; left:52%; animation-delay:-14s; }
  @keyframes flutuar { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(4vw,-3vh) scale(1.1);} 66%{transform:translate(-3vw,4vh) scale(.95);} }
  .grao { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035;
    background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:3px 3px; }
  .palco { position:relative; z-index:2; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; justify-content:safe center;
    padding:28px 22px calc(28px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; }
  .marca { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.22em; color:#4b5f8a; font-weight:700; z-index:3; text-transform:uppercase; }
  .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--ciano),var(--dourado));
    z-index:5; transition:width .5s cubic-bezier(.4,0,.2,1); width:0; box-shadow:0 0 12px rgba(56,189,248,.6); }
  .cena { width:100%; animation:entra .55s cubic-bezier(.16,1,.3,1); }
  @keyframes entra { from { opacity:0; transform:translateY(18px);} to { opacity:1; transform:none;} }
  .rotulo { font-size:11px; letter-spacing:.18em; color:var(--ciano); font-weight:700; text-transform:uppercase; margin-bottom:14px; opacity:0; animation:surge .4s .1s forwards; }
  @keyframes surge { to { opacity:1; } }
  .titulo { font-size:clamp(23px,5.2vw,36px); font-weight:800; line-height:1.24; margin-bottom:16px; letter-spacing:-.02em; }
  .corpo { font-size:clamp(15px,3.4vw,17.5px); line-height:1.68; color:#c3d0ec; font-weight:300; min-height:1.68em; }
  .corpo strong { color:#fff; font-weight:600; }
  .corpo em { color:var(--dourado); font-style:normal; font-weight:500; }
  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--ciano); vertical-align:text-bottom; margin-left:2px; animation:pisca .85s step-end infinite; }
  @keyframes pisca { 50% { opacity:0; } }
  .destaque { border-left:3px solid var(--dourado); background:rgba(251,191,36,.07); padding:15px 18px; border-radius:0 12px 12px 0; margin:20px 0; font-size:14.5px; line-height:1.6; color:#e5d5a8; }
  .zona-resposta { margin-top:32px; opacity:0; transform:translateY(10px); transition:all .5s; }
  .zona-resposta.on { opacity:1; transform:none; }
  .pergunta { font-size:clamp(16px,3.6vw,19px); font-weight:600; color:#fff; margin-bottom:18px; line-height:1.45; }
  .opcoes { display:flex; gap:11px; flex-wrap:wrap; }
  .op { flex:1; min-width:132px; padding:16px 18px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.05);
    border:1.5px solid rgba(147,164,200,.28); color:var(--texto); font-size:15px; font-weight:600; font-family:inherit;
    transition:all .22s; text-align:center; position:relative; overflow:hidden; animation:pulsar 2.6s ease-in-out infinite; }
  .op:hover, .op:focus { background:rgba(56,189,248,.14); border-color:var(--ciano); transform:translateY(-2px); outline:none; }
  .op.sel { background:rgba(56,189,248,.2); border-color:var(--ciano); animation:none; }
  .op.sel::after { content:' ✓'; color:var(--ciano); }
  @keyframes pulsar { 0%,100% { box-shadow:0 0 0 0 rgba(56,189,248,.28); } 50% { box-shadow:0 0 0 7px rgba(56,189,248,0); } }
  .op:nth-child(2) { animation-delay:.25s; } .op:nth-child(3) { animation-delay:.5s; } .op:nth-child(4) { animation-delay:.75s; }
  .opcoes.lista { flex-direction:column; }
  .opcoes.lista .op { animation:none; text-align:left; min-width:0; }
  .opcoes.muitas { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:9px; }
  .opcoes.muitas .op { animation:none; padding:13px 14px; font-size:14px; min-width:0; }
  .btn { padding:16px 30px; border-radius:14px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--ciano),#2563eb);
    color:#031127; font-size:15px; font-weight:800; font-family:inherit; transition:all .22s; white-space:nowrap; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(56,189,248,.32); }
  .btn-2 { background:rgba(255,255,255,.07); color:var(--texto); border:1.5px solid rgba(147,164,200,.3); }
  .btn-ouro { background:linear-gradient(135deg,var(--dourado),#f59e0b); color:#2a1a00; }
  .campo { width:100%; padding:16px 18px; border-radius:14px; font-size:16px; font-family:inherit; background:rgba(255,255,255,.05);
    border:1.5px solid rgba(147,164,200,.28); color:#fff; animation:pulsar 2.6s ease-in-out infinite; transition:all .22s; }
  .campo:focus { outline:none; border-color:var(--ciano); background:rgba(56,189,248,.1); animation:none; }
  .campo::placeholder { color:#5d6f95; }
  .lbl { font-size:12.5px; color:var(--suave); font-weight:600; margin-bottom:7px; display:block; }
  .pular { margin-top:26px; text-align:center; }
  .pular a { color:#5d6f95; font-size:12.5px; text-decoration:none; cursor:pointer; }
  .pular a:hover { color:var(--suave); text-decoration:underline; }
  /* contador de pontos de atenção */
  .placar { display:flex; align-items:baseline; gap:14px; margin:24px 0 6px; }
  .placar .num { font-size:clamp(52px,14vw,84px); font-weight:800; line-height:1; letter-spacing:-.04em; }
  .placar .leg { font-size:14px; color:var(--suave); line-height:1.4; max-width:220px; }
  .cards-risco { display:grid; gap:10px; margin:22px 0; }
  .card-risco { background:rgba(255,255,255,.045); border:1px solid rgba(147,164,200,.16); border-radius:12px; padding:13px 16px;
    font-size:13.5px; color:#c3d0ec; display:flex; gap:11px; align-items:flex-start; }
  .card-risco b { color:#fff; font-weight:600; }
  .card-risco.atencao { border-color:rgba(251,146,60,.4); background:rgba(251,146,60,.07); }
  .card-risco.ok { border-color:rgba(52,211,153,.3); background:rgba(52,211,153,.06); }
  .acoes-finais { display:flex; flex-direction:column; gap:11px; margin-top:26px; }
  .acoes-finais .btn { width:100%; }
  .fim-ok { text-align:center; padding:20px 0; }
  .fim-ok .ico { font-size:56px; margin-bottom:14px; }
  @media (max-width:520px) { .palco { padding:22px 18px calc(22px + env(safe-area-inset-bottom)); } .op { min-width:100%; } }

<div class="fumaca"><span class="f1"></span><span class="f2"></span><span class="f3"></span></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   CHECK-UP DA APÓLICE EMPRESARIAL — o molde da trilha A
   Aqui não há funil educativo: o cliente JÁ tem seguro (quase sempre).
   O inimigo é o status quo ("renovo todo ano sem olhar"). A arma é a
   auditoria: 10 verificações, "não sei" sempre entre as opções, e cada
   "não sei" é um ponto de atenção que ELE reconheceu. O resultado não
   é termômetro de risco: é "N pontos de atenção na sua apólice atual".
   Quem não tem seguro responde o mesmo check-up — o resultado vira
   "o que uma apólice sua precisaria cobrir".
   Regras da casa: nenhuma seguradora citada, nenhuma promessa de preço.
   ══════════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.appspot.com",
  messagingSenderId: "979966947706",
  appId: "1:979966947706:web:b8b6a8a85d0a3f9e6f9f9e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PRODUTO = { id: 'empresarial', nome: 'Seguro Empresarial' };
const ARQ_VERSAO = '2';
window.ARQ_VERSAO = ARQ_VERSAO;

let SESSAO = null, LINK = null, RESP = {}, QRESP = {}, iCena = 0;

/* ─── DICIONÁRIO ANALÍTICO ─── */
const MIL = 1e3;
const DIC = {
  situacao: [['sit_vigente'], ['sit_vence_breve'], ['sit_nao_tenho'], ['sit_nao_sei']],
  valorRisco: [['vr_atualizei'], ['vr_anos'], ['vr_nunca_calculei'], ['vr_nao_sei']],
  franquia: [['fq_sei'], ['fq_mais_ou_menos'], ['fq_nao_sei'], ['fq_sem_cobertura']],
  parada: [['pr_lucros'], ['pr_so_danos'], ['pr_caixa'], ['pr_nao_sei']],
  locais: [['lc_1'], ['lc_2_5'], ['lc_6_15'], ['lc_15_mais']],
  estrutura: [['es_cada_local'], ['es_global'], ['es_nao_sei']],
  assistencia: [['as_uso'], ['as_nunca_usei'], ['as_nao_sabia'], ['as_sem_seguro']],
  sinistro: [['sn_bem_atendido'], ['sn_dor_de_cabeca'], ['sn_sem_cobertura'], ['sn_nao_teve']],
  premio: [
    ['pm_ate3k', 0, 3 * MIL], ['pm_3_10k', 3 * MIL, 10 * MIL], ['pm_10_30k', 10 * MIL, 30 * MIL],
    ['pm_30_100k', 30 * MIL, 100 * MIL], ['pm_100k_mais', 100 * MIL, null], ['pm_nao_sei', null, null], ['pm_sem_seguro', null, null]
  ]
};

const temSeguro = () => !(RESP.situacao && RESP.situacao.valor === 'nao_tenho');

/* ─── AS 10 VERIFICAÇÕES ─── */
const CENAS = [
  {
    rotulo: 'Verificação 1 de 10 · A apólice',
    titulo: 'Você renova sua apólice todo ano. <em>Quando foi a última vez que você a leu?</em>',
    corpo: 'Este é um check-up, não uma aula — você já sabe o que é seguro empresarial. São <strong>10 verificações rápidas</strong>, todas de clicar. No fim, os pontos de atenção que você mesmo reconheceu na sua proteção atual.\n\nE uma regra deste check-up: <strong>"não sei" é uma resposta válida</strong> — na verdade, é a mais útil de todas.',
    pergunta: 'Sua empresa tem apólice empresarial vigente?',
    tipo: 'opcoes', lista: true, campo: 'situacao',
    opcoes: [
      { txt: '✅ Sim, vigente', v: 'vigente', eco: 'Ótimo — então vamos ver o quanto você conhece dela. É mais raro do que parece.' },
      { txt: '⏳ Sim, e renova em breve', v: 'vence_breve', eco: 'Melhor hora impossível: revisar ANTES de renovar é a única chance do ano de mexer em cobertura sem custo extra.' },
      { txt: '🚫 Não tenho', v: 'nao_tenho', eco: 'Sem problema — responda o check-up do mesmo jeito. No fim, em vez de auditar uma apólice, você terá o mapa do que uma apólice sua precisaria cobrir.' },
      { txt: '🤔 Não sei dizer', v: 'nao_sei', eco: 'Se não é fácil saber se existe, provavelmente ninguém está olhando para ela. Primeiro ponto de atenção anotado.' }
    ]
  },
  {
    rotulo: 'Verificação 2 de 10 · O valor',
    titulo: 'Se você tivesse que reconstruir tudo <em>hoje</em>, o valor segurado alcança?',
    corpo: 'Obra ficou mais cara, máquina importada dobrou, o estoque cresceu — e o valor declarado na apólice costuma ficar parado no tempo.\n\nO problema tem nome: <strong>rateio</strong>. Se o valor declarado for menor que o valor real, a indenização sai <strong>proporcional à diferença</strong> — no sinistro, a empresa descobre que era "sócia" do próprio prejuízo.',
    destaque: 'Faça a conta de cabeça: prédio + máquinas + móveis + estoque, a preço de HOJE. É esse número que deveria estar na apólice.',
    pergunta: 'Quando esse valor foi atualizado pela última vez?',
    tipo: 'opcoes', lista: true, campo: 'valorRisco',
    opcoes: [
      { txt: '📅 Na última renovação, com critério', v: 'atualizei', eco: 'Excelente — é a disciplina que evita o rateio. Vale só conferir se o critério incluiu o custo de reconstrução atual, não o valor contábil.' },
      { txt: '🕰️ Faz anos que não atualizo', v: 'anos', eco: 'É a resposta mais comum do mercado — e a porta de entrada do rateio. Cada ano parado é um pedaço da indenização que encolhe.' },
      { txt: '🧮 Nunca calculei esse número', v: 'nunca_calculei', eco: 'Então a apólice está protegendo um valor que ninguém conferiu. O check-up existe exatamente para isso aparecer agora, e não no sinistro.' },
      { txt: '🤔 Não sei', v: 'nao_sei', eco: 'Anotado como ponto de atenção — é o número mais importante da apólice inteira.' }
    ]
  },
  {
    rotulo: 'Verificação 3 de 10 · A franquia',
    titulo: 'Você sabe, de cabeça, a franquia da sua cobertura de vendaval?',
    corpo: 'Franquia é a parte do prejuízo que fica com você — e é onde mora a diferença entre apólices que parecem iguais. Em apólices de indústria, existem franquias de vendaval com <strong>mínimos de dezenas de milhares de reais</strong>: a empresa "tem cobertura de granizo" e descobre o tamanho do mínimo no dia do temporal.',
    pergunta: 'E aí — sabe a sua?',
    tipo: 'opcoes', lista: true, campo: 'franquia',
    opcoes: [
      { txt: '💯 Sei exatamente', v: 'sei', eco: 'Raríssimo — parabéns. Você faz parte de uma minoria absoluta.' },
      { txt: '🌫️ Mais ou menos', v: 'mais_ou_menos', eco: '"Mais ou menos" em franquia costuma custar caro: percentual E mínimo em reais andam juntos, e o mínimo é o que surpreende.' },
      { txt: '🤷 Não sei', v: 'nao_sei', eco: 'Como quase todo mundo. É um dos três números que valem a leitura da apólice — junto com o valor segurado e as exclusões.' },
      { txt: '🚫 Não tenho essa cobertura (ou seguro)', v: 'sem_cobertura', eco: 'Se a região tem granizo ou temporal — e no Sul tem —, essa é uma das lacunas mais caras que existem.' }
    ]
  },
  {
    rotulo: 'Verificação 4 de 10 · As portas fechadas',
    titulo: 'O seguro reconstrói o prédio. E quem paga os boletos enquanto isso?',
    corpo: 'Um incêndio controlado em horas pode fechar as portas por <strong>semanas ou meses</strong>. Nesse período, aluguel, folha e fornecedores continuam chegando — e o faturamento, não.\n\nExiste cobertura para isso (lucros cessantes / despesas fixas), e ela é <strong>a grande ausente</strong> das apólices de pequena e média empresa.',
    pergunta: 'Se sua operação parasse 60 dias, o que pagaria as contas?',
    tipo: 'opcoes', lista: true, campo: 'parada',
    opcoes: [
      { txt: '📋 Minha apólice cobre a parada', v: 'lucros', eco: 'Excelente — confira na revisão o período indenitário (por quantos meses paga) e o limite. É onde essa cobertura costuma ficar curta.' },
      { txt: '🏚️ A apólice paga só os danos', v: 'so_danos', eco: 'É a configuração mais comum — e a mais perigosa: o dano físico tem conserto, a parada longa é o que quebra empresa.' },
      { txt: '💰 O caixa da empresa', v: 'caixa', eco: 'O caixa aguenta 60 dias sem faturar E pagando a reconstrução que a franquia não cobre? É uma conta que vale fazer com calma.' },
      { txt: '🤔 Não sei', v: 'nao_sei', eco: 'Anotado. É a segunda pergunta mais importante do check-up — e a resposta está (ou não está) na sua apólice.' }
    ]
  },
  {
    rotulo: 'Verificação 5 de 10 · O que existe aí',
    titulo: 'O seguro certo é o que espelha o seu negócio — não o pacote padrão.',
    corpo: 'Cada item do seu dia a dia pede uma cobertura específica. Marque o que <strong>existe</strong> na sua operação — inclusive o que é de outra área ou de outro prédio:',
    pergunta: 'O que existe na sua empresa?',
    tipo: 'multi', lista: true, campo: 'existe',
    opcoes: [
      { txt: '📦 Estoque relevante', v: 'estoque' },
      { txt: '⚙️ Máquinas e equipamentos essenciais', v: 'maquinas' },
      { txt: '💵 Dinheiro em caixa ou cofre', v: 'valores' },
      { txt: '🚗 Veículos de clientes no pátio', v: 'patio' },
      { txt: '👷 Funcionários', v: 'funcionarios' },
      { txt: '🏘️ Vizinhos colados no imóvel', v: 'vizinhos' },
      { txt: '⛈️ Região com granizo ou alagamento', v: 'clima' }

    eco: 'Cada item marcado tem uma cobertura correspondente — roubo, equipamentos, valores, guarda de veículos, responsabilidade com funcionários e vizinhos, vendaval, alagamento. Na revisão, esses itens viram a lista de conferência da sua apólice.'

    pergunta: 'O que NÃO existe (mais) na sua operação?',

    opcoes: [

      { txt: '🚫 Não temos vitrine ou vidraça de frente', v: 'sem_vidros' },
      { txt: '🚫 Não temos equipamentos móveis/portáteis', v: 'sem_equip' },
      { txt: '✅ Tudo isso existe por aqui', v: 'tudo_existe' }
    ],
    eco: 'Então vale conferir se a sua apólice não cobra por essas coberturas — acontece mais do que se imagina, e é prêmio que poderia virar proteção onde falta.'
  },
  {
    rotulo: 'Verificação 7 de 10 · Os locais',
    titulo: 'Quantos endereços a sua operação tem?',

    pergunta: 'Quantos locais de risco?',
    tipo: 'opcoes', campo: 'locais',
    opcoes: [
      { txt: '1 endereço', v: '1' },
      { txt: '2 a 5', v: '2_5' },
      { txt: '6 a 15', v: '6_15' },
      { txt: 'Mais de 15', v: '15_mais' }

  },

    opcoes: [
      { txt: '🏢 Cada local tem sua apólice / seu limite', v: 'cada_local', eco: 'Estrutura clássica. Para várias unidades, vale comparar com o limite global — às vezes protege mais, pagando menos.' },
      { txt: '🌐 Um limite global para todos', v: 'global', eco: 'Estrutura sofisticada — bem desenhada, é excelente. A revisão confere se o limite global cobre o seu MAIOR local: se o prédio mais valioso vale mais que o limite, há um descasamento silencioso.' },
      { txt: '🤔 Não sei como está', v: 'nao_sei', eco: 'Anotado — com mais de um endereço, essa é a primeira coisa que a revisão vai mapear.' }

  {

const $ = id => document.getElementById(id);
const palco = $('palco');
const espera = ms => new Promise(r => setTimeout(r, ms));
function cenasVisiveis() { return CENAS.filter(c => !c.quando || c.quando()); }

let _jaDigitou = false, _pularDigitar = false;
function _skipDigitar() { _pularDigitar = true; }
async function digitar(el, html, vel) {
  const full = String(html).replace(/\n/g, '<br><br>');
  if (_jaDigitou) { el.innerHTML = full; el.style.animation = 'entra .3s'; return; }
  _jaDigitou = true; _pularDigitar = false;
  window.addEventListener('pointerdown', _skipDigitar);
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buffer = '';
  outer:
  for (const p of partes) {
    if (p.startsWith('<')) { buffer += p; el.innerHTML = buffer + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      if (_pularDigitar) break outer;
      buffer += (ch === '\n') ? '<br><br>' : ch;
      el.innerHTML = buffer + '<span class="cursor"></span>';
      await espera('.!?'.includes(ch) ? (vel || 16) * 9 : ',;:'.includes(ch) ? (vel || 16) * 4 : (vel || 16));
    }
  }
  window.removeEventListener('pointerdown', _skipDigitar);
  el.innerHTML = full;
}
function progresso(p) { $('prog').style.width = Math.min(100, Math.max(0, p)) + '%'; }

async function renderCena(i) {
  const visiveis = cenasVisiveis();
  const c = visiveis[i];
  if (!c) return renderResultado();
  progresso((i / (visiveis.length + 1)) * 100);

  const classeOp = c.muitas ? 'opcoes muitas' : c.lista ? 'opcoes lista' : 'opcoes';
  palco.innerHTML = `
    <div class="cena">
      <div class="rotulo">${c.rotulo}</div>
      <div class="titulo">${c.titulo}</div>
      <div class="corpo" id="corpo"></div>
      ${c.destaque ? `<div class="destaque" id="dest" style="display:none;">💭 ${c.destaque}</div>` : ''}
      <div class="zona-resposta" id="zona">
        <div class="pergunta">${c.pergunta}</div>
        <div class="${classeOp}" id="ops">${c.opcoes.map((o, k) => `<button class="op" data-k="${k}">${o.txt}</button>`).join('')}</div>
        <div id="eco" style="display:none;"></div>
        ${c.tipo === 'multi' ? '<button class="btn btn-ouro" id="btMultiOk" style="margin-top:16px;">Continuar →</button>' : ''}
      </div>
      <div class="pular"><a id="lkPular">pular check-up →</a></div>
    </div>`;
  window.scrollTo(0, 0);
  await digitar($('corpo'), c.corpo, 15);
  if (c.destaque) { await espera(240); const d = $('dest'); d.style.display = 'block'; d.style.animation = 'entra .5s'; d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  await espera(260);
  const zn = $('zona'); zn.classList.add('on');
  await espera(160); zn.scrollIntoView({ behavior: 'smooth', block: 'end' });

  const mostrarEco = (txt, entao) => {
    const e = $('eco');
    if (!txt) return entao && entao();
    e.style.display = 'block';
    e.innerHTML = `<div class="destaque" style="border-color:var(--verde);background:rgba(52,211,153,.08);color:#bff0dc;">${txt}</div>`;
    e.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => entao && entao(), 1200);
  };
  const avancar = () => {
    salvarParcial();
    const nv = cenasVisiveis();
    const pos = nv.findIndex(x => x.campo === c.campo);
    iCena = (pos >= 0 ? pos : i) + 1;
    iCena < nv.length ? renderCena(iCena) : renderResultado();
  };

  if (c.tipo === 'multi') {
    const iExcl = c.opcoes.findIndex(o => o.v === 'tudo_existe');
    $('ops').querySelectorAll('.op').forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k); b.style.animation = 'none';
      if (k === iExcl) { $('ops').querySelectorAll('.op').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); }
      else { b.classList.toggle('sel'); if (iExcl >= 0) $('ops').querySelector(`.op[data-k="${iExcl}"]`).classList.remove('sel'); }
    });
    $('btMultiOk').onclick = () => {
      const sel = [...$('ops').querySelectorAll('.op.sel')].map(b => c.opcoes[Number(b.dataset.k)]);
      if (!sel.length) { $('btMultiOk').textContent = 'Marque ao menos uma opção →'; return; }
      RESP[c.campo] = { valores: sel.map(o => o.v), textos: sel.map(o => o.txt) };
      $('btMultiOk').style.display = 'none';
      mostrarEco(c.eco, avancar);
    };
  } else {
    $('ops').querySelectorAll('.op').forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k), o = c.opcoes[k];
      $('ops').querySelectorAll('.op').forEach(x => { x.classList.remove('sel'); x.style.animation = 'none'; });
      b.classList.add('sel');
      RESP[c.campo] = { valor: o.v, texto: o.txt, i: k };
      mostrarEco(o.eco || c.eco, avancar);
    });
  }
  $('lkPular').onclick = () => renderResultado();
}

/* ─── PONTOS DE ATENÇÃO ───
   Cada verificação pode gerar um card. 'atencao' entra na conta do placar;
   'ok' é reforço positivo (não conta). */
function calcularPontos() {
  const pts = [];
  const v = c => RESP[c] && RESP[c].valor;
  const m = c => (RESP[c] && RESP[c].valores) || [];

  if (v('situacao') === 'nao_sei') pts.push({ tipo: 'atencao', ico: '📄', txt: '<b>Ninguém sabe se há apólice vigente.</b> Antes de qualquer cobertura, a revisão começa por localizar o documento e o vencimento.' });
  if (v('situacao') === 'nao_tenho') pts.push({ tipo: 'atencao', ico: '🏢', txt: '<b>Operação sem seguro empresarial.</b> Um único evento — incêndio, granizo, roubo — hoje sai 100% do caixa.' });
  if (v('situacao') === 'vence_breve') pts.push({ tipo: 'ok', ico: '⏳', txt: '<b>Renovação chegando.</b> É a janela ideal: revisar antes de renovar não custa nada e é quando tudo pode ser ajustado.' });

  if (v('valorRisco') === 'anos' || v('valorRisco') === 'nunca_calculei' || v('valorRisco') === 'nao_sei')
    pts.push({ tipo: 'atencao', ico: '⚖️', txt: '<b>Valor em risco desatualizado — risco de rateio.</b> Se o valor declarado for menor que o real, a indenização sai proporcional. É o ponto nº 1 da revisão.' });

  if (v('franquia') === 'nao_sei' || v('franquia') === 'mais_ou_menos')
    pts.push({ tipo: 'atencao', ico: '🔍', txt: '<b>Franquia desconhecida.</b> Percentual e mínimo em reais definem quanto do prejuízo fica com você — há mínimos de dezenas de milhares em apólices de indústria.' });
  if (v('franquia') === 'sem_cobertura' && m('existe').includes('clima'))
    pts.push({ tipo: 'atencao', ico: '⛈️', txt: '<b>Região com granizo/alagamento e sem a cobertura.</b> É a lacuna mais cara do Sul do país.' });

  if (v('parada') === 'so_danos' || v('parada') === 'caixa' || v('parada') === 'nao_sei')
    pts.push({ tipo: 'atencao', ico: '🚪', txt: '<b>Parada de produção sem proteção.</b> O dano físico tem conserto; 60 dias de portas fechadas com folha e aluguel correndo é o que quebra empresa. Lucros cessantes/despesas fixas resolve.' });
  if (v('parada') === 'lucros') pts.push({ tipo: 'ok', ico: '📋', txt: '<b>Parada coberta.</b> Na revisão, confira o período indenitário e o limite — é onde essa cobertura costuma ficar curta.' });

  const mapExiste = { estoque: 'roubo e danos ao estoque', maquinas: 'equipamentos e danos elétricos', valores: 'cobertura de valores', patio: 'RC guarda de veículos', funcionarios: 'RC do empregador', vizinhos: 'RC do estabelecimento (o incêndio que passa para o vizinho)', clima: 'vendaval, granizo e alagamento' };
  const exi = m('existe').filter(x => mapExiste[x]);
  if (exi.length >= 2) pts.push({ tipo: 'atencao', ico: '🧩', txt: '<b>' + exi.length + ' frentes do seu negócio para conferir na apólice:</b> ' + exi.map(x => mapExiste[x]).join(' · ') + '. Cada uma tem cobertura própria — ter o pacote básico não significa ter essas.' });

  const nEx = m('naoExiste').filter(x => x !== 'tudo_existe');
  if (nEx.length) pts.push({ tipo: 'atencao', ico: '✂️', txt: '<b>Possível cobertura paga sem uso.</b> Você marcou ' + nEx.length + ' item(ns) que não existem na operação — se a apólice cobra por eles, é prêmio que pode virar proteção onde falta.' });

  if (v('estrutura') === 'nao_sei') pts.push({ tipo: 'atencao', ico: '🌐', txt: '<b>Vários endereços, estrutura desconhecida.</b> Apólice por local ou limite global por esgotamento mudam proteção e prêmio — é o primeiro mapa da revisão.' });
  if (v('estrutura') === 'global') pts.push({ tipo: 'atencao', ico: '📐', txt: '<b>Limite global: conferir contra o maior local.</b> Se o prédio mais valioso vale mais que o limite global, há descasamento silencioso.' });

  if (v('assistencia') === 'nao_sabia') pts.push({ tipo: 'atencao', ico: '🔧', txt: '<b>Assistência 24h paga e não usada.</b> Chaveiro, eletricista, encanador e telhado provisório provavelmente já estão no seu prêmio.' });

  if (v('sinistro') === 'dor_de_cabeca') pts.push({ tipo: 'atencao', ico: '😤', txt: '<b>Sinistro mal atendido.</b> Franquia, exclusão ou má condução — descobrir qual foi é o que evita a repetição.' });
  if (v('sinistro') === 'sem_cobertura') pts.push({ tipo: 'atencao', ico: '💸', txt: '<b>Prejuízo sem cobertura no histórico.</b> A prova de que apólice se lê antes do sinistro. A revisão fecha essa porta.' });
  if (v('sinistro') === 'nao_teve' && temSeguro()) pts.push({ tipo: 'ok', ico: '🍀', txt: '<b>5 anos sem sinistro = moeda de negociação.</b> Bom histórico é argumento concreto para melhorar condições na renovação.' });

  if (v('premio') === 'nao_sei') pts.push({ tipo: 'atencao', ico: '💳', txt: '<b>Prêmio desconhecido.</b> Sem saber o que paga, não dá para saber se paga bem. Está na apólice ou no financeiro — 2 minutos.' });

  return pts;
}

    ? (atencao.length ? 'pontos de atenção na sua apólice atual' : 'sua apólice passou no check-up')

      <div class="zona-resposta on" id="zonaAlinha" style="margin-top:6px;">
        <div class="pergunta">Faz sentido para você ${tem ? 'revisar esses pontos antes da próxima renovação' : 'montar essa proteção com critério, sem pacote pronto'}?</div>
        <div class="opcoes">
          <button class="op" id="alSim">Faz sentido</button>

        </div>
        <div id="alResposta" style="display:none; font-size:13.5px; color:#c3d0ec; line-height:1.6; margin-top:12px;"></div>
      </div>
      <div class="acoes-finais" id="acoesFinais" style="display:none;">
        <button class="btn btn-ouro" id="btCotar">${tem ? 'Quero a revisão da minha apólice →' : 'Quero uma proposta desenhada →'}</button>

      </div>
    </div>`;
  window.scrollTo(0, 0);

      <div class="acoes-finais"><button class="btn btn-2" id="btPdf">📄 Baixar o check-up em PDF</button></div>
    </div>`;
  $('btPdf').onclick = () => { const pts = calcularPontos(); gerarPDF(pts.filter(p => p.tipo === 'atencao'), pts.filter(p => p.tipo === 'ok')); };
}

/* ─── PDF ─── */
function gerarPDF(atencao, ok) {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) return alert('Biblioteca de PDF não carregou. Recarregue a página.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 18; let y = 0;
    const sa = s => String(s || '').replace(/<[^>]+>/g, '').replace(/[""]/g, '"').replace(/[–—]/g, '-').normalize('NFD').replace(/[̀-ͯ]/g, '');
    const quebra = (lim) => { if (y > lim) { doc.addPage(); y = M + 6; } };

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 46, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(19); doc.setFont(undefined, 'bold');
    doc.text('Check-up da apolice empresarial', M, 22);
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(147, 164, 200);
    doc.text('10 verificacoes  ·  Retorno Seguros', M, 32);
    y = 58;

    doc.setFillColor(255, 247, 237); doc.roundedRect(M, y - 7, W - M * 2, 22, 2, 2, 'F');
    doc.setFontSize(13); doc.setFont(undefined, 'bold'); doc.setTextColor(154, 52, 18);
    doc.text(atencao.length + ' ponto(s) de atencao identificados por voce', M + 5, y + 4);
    doc.setFontSize(8.5); doc.setFont(undefined, 'normal');
    doc.text('Respostas suas, sobre a sua propria protecao - nao ha acusacao aqui, ha pauta de revisao.', M + 5, y + 10);
    y += 28;

    const bloco = (titulo, lista) => {
      if (!lista.length) return;
      quebra(240);
      doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
      doc.text(sa(titulo), M, y); y += 7;
      lista.forEach(p => {
        quebra(258);
        doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
        const l = doc.splitTextToSize('- ' + sa(p.txt), W - M * 2 - 2);
        doc.text(l, M + 2, y); y += l.length * 4.4 + 2.5;
      });
      y += 4;
    };
    bloco('Pontos de atencao', atencao);
    bloco('O que ja esta a seu favor', ok);

    quebra(225);
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('Os 3 numeros que valem a leitura da sua apolice', M, y); y += 7;
    [['Valor em risco declarado', 'Prédio + maquinas + moveis + estoque a preco de reconstrucao de HOJE. Se estiver menor que o real, a indenizacao sai proporcional (rateio).'],
     ['Franquia (percentual E minimo)', 'A parte do prejuizo que fica com voce. O minimo em reais e o que surpreende - ha apolices de industria com minimos de dezenas de milhares.'],
     ['Periodo indenitario dos lucros cessantes', 'Por quantos meses a apolice paga a parada. E a cobertura mais ausente nas PMEs - e a diferenca entre prejuizo e fechamento.']
    ].forEach(([t, d]) => {
      quebra(255);
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + sa(t), M, y); y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const ld = doc.splitTextToSize(sa(d), W - M * 2 - 5); doc.text(ld, M + 4, y); y += ld.length * 4.4 + 4;
    });

    y += 3; quebra(245);
    doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42);
    doc.text('O proximo passo (gratuito)', M, y); y += 6;
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
    const t2 = doc.splitTextToSize('Leitura da apolice lado a lado com o corretor: 20 minutos, ponto por ponto, sem compromisso e sem cancelar nada do que voce tem. Revisao seria nao promete "mais barato" - promete mais cobertura pelo mesmo valor, ou o mesmo por menos, com a conta na mesa. O seguro empresarial e precificado pela atividade e pelo valor em risco; coberturas, limites e franquias conforme as condicoes gerais registradas na Susep.', W - M * 2);
    doc.text(t2, M, y); y += t2.length * 4.6;

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'normal');
      doc.text('Material informativo. Nao constitui proposta nem analise formal da apolice. Condicoes conforme apolice e seguradora.', M, 288);
      doc.text(`${i}/${n}`, W - M, 288, { align: 'right' });
    }
    doc.save('checkup-empresarial-retorno-seguros.pdf');
  } catch (e) { alert('Não consegui gerar o PDF: ' + e.message); }
}

/* ─── CAMADA ANALÍTICA ─── */
function montarAnalitico(finalizou) {
  const cod = (campo) => { const r = RESP[campo]; if (!r || typeof r.i !== 'number') return null; const l = (DIC[campo] || [])[r.i]; return l ? l[0] : null; };
  const multi = (campo) => (RESP[campo] && RESP[campo].valores) || [];
  const pm = RESP.premio && typeof RESP.premio.i === 'number' ? DIC.premio[RESP.premio.i] : null;
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'checkup',
    completo: !!finalizou, passo: iCena,
    temSeguro: RESP.situacao ? temSeguro() : null,
    situacaoCod: cod('situacao'), valorRiscoCod: cod('valorRisco'), franquiaCod: cod('franquia'),
    paradaCod: cod('parada'), locaisCod: cod('locais'), estruturaCod: cod('estrutura'),
    assistenciaCod: cod('assistencia'), sinistroCod: cod('sinistro'),
    premioCod: cod('premio'),
    premioMin: pm && pm[1] !== undefined ? (pm[1] === null ? null : pm[1]) : null,
    premioMax: pm && pm[2] !== undefined ? (pm[2] === null ? null : pm[2]) : null,
    existeFlags: multi('existe'), naoExisteFlags: multi('naoExiste'),
    nPontosAtencao: (RESP._pontos && RESP._pontos.n !== undefined) ? RESP._pontos.n : null,
    alinhamento: RESP.alinhamento || null
  };
}

/* ─── PERSISTÊNCIA ─── */
function montarRoteiroAp() {
  try {
    var arr = Array.isArray(CENAS) ? CENAS : Object.keys(CENAS).map(function (k) { return CENAS[k]; });
    return arr.filter(function (c) { return c && c.pergunta && c.campo; }).map(function (c) {
      var v = RESP[c.campo], r = null;
      if (v) r = v.texto || (v.textos && v.textos.join(' · ')) || (v.valor != null ? String(v.valor) : (typeof v === 'string' || typeof v === 'number' ? String(v) : null));
      return { k: c.campo, p: (c.pergunta || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(), r: r };
    });
  } catch (e) { return []; }
}

async function salvarParcial(finalizou) {
  try { if (!SESSAO) return;
    const _upd = {
      respostas: RESP, roteiroApres: montarRoteiroAp(), analitico: montarAnalitico(finalizou),
      cenasVistas: Math.min(iCena + 1, cenasVisiveis().length), totalCenas: cenasVisiveis().length,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (finalizou) _upd.concluiu = true;   // trava: uma vez concluído, salvamentos parciais não zeram
    await db.collection('mb_apresentacoes').doc(SESSAO).set(_upd, { merge: true });
  } catch (e) { console.warn('salvar parcial', e); }
}
async function registrarInteresse(tipo) {
  try { if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }),
      ultimoInteresse: tipo, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('interesse', e); }
}
async function salvarQuestionario(finalizou) {
  try { if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP, questionarioCompleto: !!finalizou, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar questionario', e); }
}

/* ─── INÍCIO ─── */
console.log('%cCheck-up Empresarial v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  /* usa a sessão já existente se houver (ex.: corretor logado no painel) — não a substitui; só entra anônimo se ninguém estiver logado */
  try { await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); }); if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (token) SESSAO = 'empresarial_' + token;
  else {
    try { SESSAO = sessionStorage.getItem('sessao_ap_empresarial'); } catch (e) {}
    if (!SESSAO) { SESSAO = 'ap_' + PRODUTO.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); try { sessionStorage.setItem('sessao_ap_empresarial', SESSAO); } catch (e) {} }
  }
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, origem: 'apresentacao',
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) {
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.linkId = snap.docs[0].id; base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null; base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        try { await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({ aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e2) {}
      }
    } catch (e) { console.warn('link', e); }
  }
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }
  renderCena(0);
});
</script>
