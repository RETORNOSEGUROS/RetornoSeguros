const espera = ms => new Promise(r => setTimeout(r, ms));

async function digitar(el, html, vel) {
  el.innerHTML = '';
  const partes = html.split(/(<[^>]+>)/g).filter(Boolean);
  let buffer = '';
  for (const p of partes) {
    if (p.startsWith('<')) { buffer += p; el.innerHTML = buffer + '<span class="cursor"></span>'; continue; }
    for (const ch of p) {
      buffer += (ch === '\n') ? '<br><br>' : ch;
      el.innerHTML = buffer + '<span class="cursor"></span>';
      await espera('.!?'.includes(ch) ? (vel || 16) * 9 : ',;:'.includes(ch) ? (vel || 16) * 4 : (vel || 16));
    }
  }
  el.innerHTML = buffer;
}

function calcularVulnerabilidade() {
  let p = 0;
  const v = (c, mapa) => { const r = RESP[c]; return r && mapa[r.valor] !== undefined ? mapa[r.valor] : 0; };
  p += v('nSocios', { sozinho: 2, '2': 2, '3_5': 1, '6_mais': 1 });
  p += v('herdeiroSabe', { sei: 0, ideia: 1, nunca: 2 });
  p += v('contratoSocial', { preve_compra: 0, herdeiros_entram: 2, nao_diz: 3, nunca_li: 3 });
  p += v('caixaRecompra', { tranquilo: 0, aperto: 1, ativo_emprestimo: 2, nao_teria: 3 });
  p += v('sustentoFamilia', { anos: 0, '1ano': 1, meses: 3, nao_pensar: 2 });
  const herd = (RESP.herdeiros && RESP.herdeiros.valores) || [];
  p += Math.min(3, herd.filter(x => x !== 'prontos').length);
  const dep = (RESP.dependencia && RESP.dependencia.valores) || [];
  p += Math.min(3, dep.filter(x => x !== 'nada').length);
  const max = 19;
  const pct = Math.round(Math.min(100, p / max * 100));
  let nivel, cor, frase;
  if (pct >= 60) {
    nivel = 'ALTA'; cor = '#ef4444';
    frase = 'Pelas suas respostas, a sociedade está <strong>despreparada para a falta de um sócio</strong>: regras indefinidas, herdeiros fora do desenho e a conta da recompra sem origem. É exatamente o cenário que os dois instrumentos desta conversa resolvem — e que o contrato social sozinho não resolve.';
  } else if (pct >= 32) {
    nivel = 'MODERADA'; cor = '#f59e0b';
    frase = 'Há pontos resolvidos e pontos em aberto. O suficiente para o dia não virar caos — mas não para ele passar sem conflito nem aperto de caixa. Fechar as lacunas agora custa uma fração do que custará depois.';
  } else {
    nivel = 'BAIXA'; cor = '#22c55e';
    frase = 'Sua sociedade está mais preparada que a imensa maioria. O que falta é o que quase ninguém tem: a <strong>fonte do dinheiro</strong> no dia — porque cláusula define quem compra, mas não paga a conta.';
  }
  return { pct, nivel, cor, frase };
}

function gerarPDF(r) {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) return alert('Biblioteca de PDF não carregou. Recarregue a página.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 18; let y = 0;
    const sa = s => String(s || '').replace(/<[^>]+>/g, '').replace(/[""]/g, '"').replace(/[–—]/g, '-').normalize('NFD').replace(/[̀-ͯ]/g, '');
    const quebra = (lim) => { if (y > lim) { doc.addPage(); y = M + 6; } };
    const secao = (t) => { quebra(240); doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.setTextColor(15, 23, 42); doc.text(sa(t), M, y); y += 8; };
    const item = (t, d) => {
      quebra(250);
      doc.setFontSize(10.5); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 58, 109);
      doc.text('• ' + sa(t), M, y); y += 5;
      doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const ld = doc.splitTextToSize(sa(d), W - M * 2 - 5);
      doc.text(ld, M + 4, y); y += ld.length * 4.4 + 4;
    };

    doc.setFillColor(5, 14, 36); doc.rect(0, 0, W, 46, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(19); doc.setFont(undefined, 'bold');
    doc.text('Sucessao entre socios - o dia que ninguem combina', M, 22);
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(147, 164, 200);
    doc.text('Pessoa Chave e Vida Resgatavel  ·  Retorno Seguros', M, 32);
    y = 58;

    doc.setFillColor(238, 242, 255); doc.roundedRect(M, y - 7, W - M * 2, 26, 2, 2, 'F');
    doc.setFontSize(11); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 27, 75);
    doc.text('Vulnerabilidade sucessoria: ' + sa(r.nivel), M + 5, y + 3);
    doc.setFontSize(8.5); doc.setFont(undefined, 'normal'); doc.setTextColor(55, 48, 163);
    const fr = doc.splitTextToSize(sa(r.frase), W - M * 2 - 10);
    doc.text(fr, M + 5, y + 10);
    y += 32;

    secao('O problema em quatro fatos');
    item('Sem clausula, vale a regra geral', 'Pelo Codigo Civil (art. 1.028), na morte de um socio liquida-se a quota dele: a empresa deve pagar aos herdeiros o valor da participacao - salvo se o contrato social dispuser diferente.');
    item('O inventario trava e demora', 'A participacao e os bens do socio entram em inventario, que costuma levar anos, com custos e impostos de transmissao - enquanto empresa e familia precisam de liquidez imediata.');
    item('Seguro de vida nao e heranca', 'Por lei (art. 794 do Codigo Civil), o capital do seguro nao entra no inventario e nao responde pelas dividas do segurado. Chega aos beneficiarios em dias.');
    item('Cheque sem origem', 'Comprar a participacao de um socio e um cheque do tamanho do valor da empresa vezes a participacao dele - que quase nenhuma empresa tem provisionado.');

    secao('As duas respostas');
    item('Seguro Pessoa Chave - para a empresa', 'A empresa contrata sobre a vida dos socios/dirigentes e e a propria beneficiaria. Com o capital, compra as cotas dos herdeiros pelo valor justo: herdeiros recebem em dinheiro, socios mantem o controle, caixa preservado. Inclui coberturas de invalidez por acidente e doencas graves pagas ao proprio segurado em vida. Premio mensal ou anual, recalculado pela idade a cada ano.');
    item('Vida Resgatavel - para a familia', 'Protecao vitalicia com capital pago aos beneficiarios da familia, fora do inventario. Diferencial: cumprida a carencia de 6 meses, o segurado pode resgatar o saldo da provisao matematica se decidir encerrar - o dinheiro nao "se perde". Pagamento unico, anual ou mensal; o premio nao e recalculado pela idade.');

    secao('Transparencia - o que precisa estar claro antes de contratar');
    ['Ha declaracao pessoal de saude na contratacao; a aceitacao depende da analise da seguradora.',
     'Carencias valem conforme a apolice: em algumas contratacoes, morte por doenca tem carencia (morte por acidente e coberta desde o inicio; nesse periodo os beneficiarios recebem o saldo da provisao).',
     'O resgate do Resgatavel e o saldo da provisao matematica - nao equivale a 100% dos premios pagos. Estimativas usuais: pagamento unico ~85%, anual ~55%, mensal ~50%. Nao e investimento nem previdencia.',
     'Doencas Graves: carencia de 6 meses, capital limitado e idade maxima de contratacao (65 anos).',
     'Sobre o tratamento fiscal da indenizacao recebida pela empresa, oriente-se com o corretor e o seu contador.',
     'Coberturas, capitais e condicoes conforme as condicoes gerais registradas na Susep e a apolice contratada.'
    ].forEach(e => {
      quebra(266);
      doc.setFontSize(9); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
      const l = doc.splitTextToSize('- ' + sa(e), W - M * 2 - 2);
      doc.text(l, M + 2, y); y += l.length * 4.3 + 1.5;
    });

    y += 4;
    secao('A tarefa que nao custa nada');
    doc.setFontSize(9.5); doc.setFont(undefined, 'normal'); doc.setTextColor(71, 85, 105);
    const t2 = doc.splitTextToSize('Releia hoje a clausula do seu contrato social sobre falecimento de socio - ou constate que ela nao existe. E o primeiro passo, e e gratuito. O segundo e garantir a fonte do dinheiro para o dia: e ai que entram as apolices.', W - M * 2);
    doc.text(t2, M, y); y += t2.length * 4.6;

    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(7.5); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'normal');
      doc.text('Material informativo. Nao constitui proposta. Condicoes conforme apolice e analise da seguradora.', M, 288);
      doc.text(`${i}/${n}`, W - M, 288, { align: 'right' });
    }
    doc.save('sucessao-socios-retorno-seguros.pdf');
  } catch (e) { alert('Não consegui gerar o PDF: ' + e.message); }
}

/* ─── CAMADA ANALÍTICA ─── */
function montarAnalitico(finalizou) {
  const cod = (campo) => { const r = RESP[campo]; if (!r || typeof r.i !== 'number') return null; const l = (DIC[campo] || [])[r.i]; return l ? l[0] : null; };
  const multi = (campo) => (RESP[campo] && RESP[campo].valores) || [];
  const vv = RESP._vuln || null;
  return {
    esquema: 2, produto: PRODUTO.id, arqVersao: ARQ_VERSAO, etapa: 'apresentacao',
    completo: !!finalizou, passo: iCena,
    nSociosCod: cod('nSocios'),
    herdeiroSabeCod: cod('herdeiroSabe'),
    contratoSocialCod: cod('contratoSocial'),
    caixaRecompraCod: cod('caixaRecompra'),
    sustentoFamiliaCod: cod('sustentoFamilia'),
    objecaoCod: cod('objecao'),
    ladoCod: cod('lado'),
    herdeirosFlags: multi('herdeiros'),
    dependenciaFlags: multi('dependencia'),
    oQueMudaria: multi('oQueMudaria'),
    vulnPct: vv ? vv.pct : null, vulnNivel: vv ? vv.nivel : null,
    alinhamento: RESP.alinhamento || null
  };
}

/* ─── PERSISTÊNCIA ─── */
async function salvarParcial(finalizou) {
  try { if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      respostas: RESP, analitico: montarAnalitico(finalizou), cenasVistas: iCena + 1,
      concluiu: !!finalizou, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar parcial', e); }
}
async function registrarInteresse(tipo) {
  try { if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      interesse: firebase.firestore.FieldValue.arrayUnion({ tipo, em: new Date().toISOString() }),
      ultimoInteresse: tipo, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('interesse', e); }
}
async function salvarQuestionario(finalizou) {
  try { if (!SESSAO) return;
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      questionario: QRESP, questionarioCompleto: !!finalizou, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar questionario', e); }
}

/* ─── INÍCIO ─── */
console.log('%cApresentação Vida Sócios v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
document.addEventListener('DOMContentLoaded', async () => {
  try { await firebase.auth().signInAnonymously(); } catch (e) {}
  const token = new URLSearchParams(location.search).get('t');
  if (token) SESSAO = 'vidasocios_' + token;
  else {
    try { SESSAO = sessionStorage.getItem('sessao_ap_vidasocios'); } catch (e) {}
    if (!SESSAO) { SESSAO = 'ap_' + PRODUTO.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); try { sessionStorage.setItem('sessao_ap_vidasocios', SESSAO); } catch (e) {} }
  }
  const base = { produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, token: token || null, origem: 'apresentacao',
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent.slice(0, 180) };
  if (token) {
    try {
      let snap = await db.collection('mb_links_apresentacao').where('token', '==', token).limit(1).get();
      if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', token).limit(1).get();
      if (!snap.empty) {
        LINK = snap.docs[0].data();
        base.linkId = snap.docs[0].id; base.empresaId = LINK.empresaId || null; base.empresaNome = LINK.empresaNome || null;
        base.destinatario = LINK.destinatario || null; base.agenciaId = LINK.agenciaId || null;
        base.geradoPorUid = LINK.geradoPorUid || LINK.criadoPorUid || null; base.geradoPorNome = LINK.geradoPorNome || LINK.criadoPorNome || null;
        try { await db.collection('mb_links_apresentacao').doc(snap.docs[0].id).set({ aberto: true, abertoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch (e2) {}
      }
    } catch (e) { console.warn('link', e); }
  }
  try {
    const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
    if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
  } catch (e) { console.warn('sessao', e); }
  renderCena(0);
});
</script>
