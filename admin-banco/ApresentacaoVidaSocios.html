<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --verm:#f87171; --texto:#e8eeff; --suave:#93a4c8; --apagado:#5d6f95; --card:rgba(255,255,255,.045); --borda:rgba(147,164,200,.22); }

  .espaco { min-width:70px; }
  .progresso { position:fixed; top:0; left:0; height:3px; background:linear-gradient(90deg,var(--ciano),var(--dourado)); z-index:11; transition:width .5s; width:0; }
  .demo { position:fixed; top:calc(42px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:9; font-size:10.5px; color:#fcd34d; background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.3); padding:3px 10px; border-radius:100px; white-space:nowrap; }

  .palco { position:relative; z-index:2; max-width:600px; margin:0 auto; padding:calc(64px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); min-height:100vh; min-height:100dvh; }

  .acordeao { margin-top:12px; border:1px solid var(--borda); border-radius:13px; overflow:hidden; }

  /* ═══ documento PDF · azul + dourado, 4 folhas A4 (794x1123) ═══ */

<script>
/* ══════════════════════════════════════════════════════════════════
   APRESENTAÇÃO + COTAÇÃO — VIDA SÓCIOS v3 (Pessoa Chave · Resgatável Único)
   Roteiro: documento "Vida Sócios — roteiro de telas v3" (24/09/2026).
   Um arquivo só: apresentação e questionário gravam no MESMO registro
   (mb_apresentacoes/<SESSAO>). Nada grava no raio-x nem no mapa de vencimentos.
   Valores: cotações 90/91 e simulação de resgate de 45 anos (exemplo "Ricardo") (24/09/2026).
   ══════════════════════════════════════════════════════════════════ */

const CONFIG = { marca: 'Retorno Seguros' };           // white-label: troque aqui
const PRODUTO = { id: 'vida_socios', nome: 'Vida Sócios — Pessoa Chave e Resgatável Único' };
const ARQ_VERSAO = '3';

/* ─── estado ─── */
const R = { visto: { pc: false, rg: false } };          // respostas da apresentação
const Q = { produtos: null, socios: [], versao: 'dps', dg: null, pagRg: 'unico', pagPc: null, empresa: null, cnpj: null, cnpjFonte: null }; // cotação
let atual = null; const pilha = [];
let db = null, SESSAO = null, GRUPO = null, RESPID = null, LINK = null, TOKEN = null;

/* ─── dados ─── */
const VALORES = [[0, 5], [5, 20], [20, 50], [50, 100], [100, 300], [300, null]];   // R$ mi
const VALORES_TXT = ['Até R$ 5 mi', 'R$ 5 a 20 mi', 'R$ 20 a 50 mi', 'R$ 50 a 100 mi', 'R$ 100 a 300 mi', 'Acima de R$ 300 mi'];
const PARTS = [[0, 10], [10, 25], [25, 50], [50, 75], [75, 100]];
const PARTS_TXT = ['Até 10%', '10 a 25%', '25 a 50%', '50 a 75%', 'Acima de 75%'];
const IDADES_EX = [ // morte R$ 1 mi, com questionário de saúde, prêmio total c/ IOF (cotação 90)
  { a: 30, pg: 'R$ 362 mil', r: 277 }, { a: 45, pg: 'R$ 525 mil', r: 191 }, { a: 50, pg: 'R$ 589 mil', r: 170 },
  { a: 55, pg: 'R$ 655 mil', r: 153 }, { a: 62, pg: 'R$ 749 mil', r: 133 } ];
const C2_PARA_EX = { ate39: 0, '40a49': 1, '50a59': 3, '60a70': 4, mais70: 4 };
const CAP_ATUAL = ['Até R$ 500 mil', 'R$ 500 mil a 2 mi', 'R$ 2 a 5 mi', 'Acima de R$ 5 mi', 'Não sei o total'];
const CAPITAIS = [[0.2, 'R$ 200 mil'], [0.5, 'R$ 500 mil'], [1, 'R$ 1 mi'], [5, 'R$ 5 mi'], [12, 'R$ 12 mi'], ['outro', 'Outro valor'], [null, 'Recomendação do corretor']];
const I_OUTRO = 5;

/* ─── textos dos botões de informação ─── */
const INFO = {
  quem: ['Quem pode ser segurado', 'Sócios e dirigentes pessoa física que constam no contrato social, entre 18 e 80 anos e em atividade.', 'Sócio que participa por holding fica de fora deste seguro; a holding pode contratar o dela, em separado.'],
  pc: ['Pessoa Chave', 'A empresa contrata e é a beneficiária. Cobertura até R$ 12 milhões por sócio, corrigida pela inflação todo ano.', 'Vocês escolhem quem entra e quanto cada um vale. Em vida, doenças graves e invalidez por acidente pagam ao próprio sócio.', 'Não é preciso alterar o contrato social para contratar.'],
  rg: ['Resgatável Único', 'A empresa paga uma única vez. A cobertura é vitalícia e corrigida pela inflação todo ano.', 'A família recebe sem IR e fora do inventário. Se desistir, existe resgate a partir do 7º mês.'],
  lei: ['O que diz a lei', 'Numa Ltda sem cláusula, a cota do sócio que falece é liquidada e a empresa paga o valor aos herdeiros (arts. 1.028 e 1.031 do Código Civil).', 'Numa S.A., as ações passam aos herdeiros e vale o acordo de acionistas. Confirme com o seu advogado.'],
  numero: ['Qual número vale', 'O capital social é o valor histórico que os sócios colocaram, não o valor da cota.', 'Sem cláusula, vale o balanço de determinação: o patrimônio avaliado a preço de mercado, incluindo marca e carteira.', 'O contrato pode fixar outro critério, como valuation ou patrimônio líquido.'],
  pagamento: ['Prazo e imposto', 'A indenização é paga em até 30 dias depois de toda a documentação entregue.', 'O tratamento fiscal na empresa, o seu contador confirma.'],
  procuracao: ['Por que trava', 'A procuração se extingue com a morte de quem a deu (art. 682 do Código Civil).', 'O dinheiro da Pessoa Chave é da empresa e pode ser usado livremente.'],
  pcTransp: ['Transparência antes de cotar', 'A cada aniversário do seguro, o prêmio é recalculado pela nova idade do sócio (de 6% a 9% a mais por ano, conforme a faixa), além da inflação.', 'Exemplo de cotação real: R$ 4 milhões para um sócio de 62 anos custam cerca de R$ 71 mil no ano; no ano seguinte, aos 63 e com inflação de 5%, cerca de R$ 81 mil.', 'O capital é corrigido pelo IPCA, mas não pode ser aumentado depois. Se o sócio sair da sociedade, a cobertura dele termina.', 'Não há resgate. Há questionário de saúde na contratação.'],
  heranca: ['Seguro não é herança', 'O capital do seguro de vida não entra no inventário e não responde por dívidas (art. 794 do Código Civil).', 'Você escolhe quem recebe e em que proporção. Em planejamento sucessório, combine com o seu advogado.'],
  resgate: ['Transparência', 'Como a empresa pagou, o resgate tem IR pela tabela progressiva, pela regra de hoje. A indenização por morte é isenta.', 'O resgate fica disponível a partir do 7º mês e encerra o seguro.'],
  versoes: ['As duas versões', 'Com questionário: sem carência, com doenças graves de até R$ 500 mil por 10 anos.', 'Sem questionário: só morte, até 70 anos. A carência de 24 meses vale só para morte natural (por doença). Morte por acidente é coberta desde o primeiro dia, nas duas versões.'],
  custoReal: ['Como a conta foi feita', 'Pagamento de R$ 524.741,39 pela cobertura de morte de R$ 1 milhão. Inflação de 5% ao ano, só como exemplo. Valores de resgate da simulação real (45 anos, só morte, sem carência).', 'Como a empresa pagou, o resgate tem IR pela tabela progressiva sobre o total, pela regra de hoje. A indenização por morte é isenta.', 'Se o dinheiro ficasse aplicado a inflação + 5% ao ano, renderia mais: comparado a isso, a proteção custaria perto de R$ 3,6 mil por mês em 10 anos.', 'Resgate antes de 1 ano é possível a partir do 7º mês, por um valor menor e ainda sem a correção do aniversário.'],
  justica: ['Justiça entre os sócios', 'O prêmio depende da idade: o sócio mais velho custa mais. Vocês podem usar capitais proporcionais à participação e, se quiserem, compensar a diferença na distribuição de lucros.', 'Nem todos precisam entrar. Cada sócio assina a própria adesão e responde o próprio questionário de saúde.'],
  inventario: ['Quanto custa um inventário', 'O ITCMD pode chegar a 8% do patrimônio, conforme o estado, além de custas e honorários — e tudo fica travado até a partilha.', 'Em regra, o capital do seguro de vida fica fora dessa base e fora do inventário (art. 794 do Código Civil). Confirme com o seu advogado.'],
  vida: ['Se a vida mudar', 'Se a empresa for vendida ou o sócio sair da sociedade, o seguro se encerra e ele recebe o resgate.', 'O beneficiário pode ser trocado a qualquer momento, por escrito — depois de um casamento, divórcio ou filho. Sem indicação válida, metade vai ao cônjuge e metade aos herdeiros.'],
  saida: ['Se um sócio sair', 'O resgate é pago na conta do próprio sócio e o valor muda dia a dia, por isso o prazo.', 'O acerto é feito entre os sócios; o jurídico da empresa avalia e redige.']
};

/* ─── utilidades ─── */
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const solo = () => R.nSocios === '1';
const nSoc = () => R.nSocios === '10+' ? 10 : Number(R.nSocios || 1);
const espera = ms => new Promise(r => setTimeout(r, ms));

function fmtMi(v) {
  if (v >= 1) { const n = Math.round(v); return 'R$ ' + n.toLocaleString('pt-BR') + (n === 1 ? ' milhão' : ' milhões'); }
  return 'R$ ' + (Math.max(1, Math.round(v * 10)) * 100) + ' mil';
}
function faixaTxt(a, b) {
  if (b == null) return 'acima de ' + fmtMi(a);
  if (a <= 0) return 'até ' + fmtMi(b);
  return 'entre ' + fmtMi(a).replace(/ milh(ão|ões)$/, '') + ' e ' + fmtMi(b);
}
function espelho() {
  if (R.b3faixa == null) return null;
  const V = VALORES[R.b3faixa];
  if (solo()) return { parte: V, outros: null };
  if (R.b4 == null) return null;
  const P = PARTS[R.b4];
  const parte = [V[0] * P[0] / 100, V[1] == null ? null : V[1] * P[1] / 100];
  const outros = [V[0] * (100 - P[1]) / 100, V[1] == null ? null : V[1] * (100 - P[0]) / 100];
  return { parte, outros };
}
function capitalSugerido() {
  const e = espelho(); if (!e) return null;
  const [a, b] = e.parte; const meio = b == null ? a * 1.2 : (a + b) / 2;
  if (meio >= 12) return 4;
  let melhor = 0; CAPITAIS.slice(0, 5).forEach((c, i) => { if (Math.abs(c[0] - meio) < Math.abs(CAPITAIS[melhor][0] - meio)) melhor = i; });
  return melhor;
}
/* data de nascimento dd/mm/aaaa → idade de hoje (null se inválida ou fora de 18–80) */
function mascaraData(v) { const d = v.replace(/\D/g, '').slice(0, 8); return d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; }
function idadeDe(txt) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt || ''); if (!m) return null;
  const dia = +m[1], mes = +m[2], ano = +m[3]; const dt = new Date(ano, mes - 1, dia);
  if (dt.getFullYear() !== ano || dt.getMonth() !== mes - 1 || dt.getDate() !== dia) return null;
  const h = new Date(); let a = h.getFullYear() - ano; if (h.getMonth() < mes - 1 || (h.getMonth() === mes - 1 && h.getDate() < dia)) a--;
  return a;
}
function mascaraReais(v) { const d = v.replace(/\D/g, '').slice(0, 9); return d ? 'R$ ' + Number(d).toLocaleString('pt-BR') : ''; }
const capitalValido = s => s.capital != null && (s.capital !== I_OUTRO || (s.capitalOutro >= 200000 && s.capitalOutro <= 12000000));
const capitalEmReais = s => s.capital === I_OUTRO ? s.capitalOutro : (CAPITAIS[s.capital] && CAPITAIS[s.capital][0] != null ? CAPITAIS[s.capital][0] * 1e6 : null);

/* CNPJ: três fontes públicas com fallback (mesmo motor dos outros questionários) */
async function _fetchJson(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); return { status: r.status, json: r.ok ? await r.json() : null }; }
  catch (e) { return { status: 0, json: null }; } finally { clearTimeout(t); }
}
async function _cnpjConsulta(d) {
  const fontes = [
    ['brasilapi', 'https://brasilapi.com.br/api/cnpj/v1/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['minhareceita', 'https://minhareceita.org/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['cnpjws', 'https://publica.cnpj.ws/cnpj/' + d, j => ({ razao: j.razao_social, fantasia: j.estabelecimento && j.estabelecimento.nome_fantasia, cidade: j.estabelecimento && j.estabelecimento.cidade && j.estabelecimento.cidade.nome, uf: j.estabelecimento && j.estabelecimento.estado && j.estabelecimento.estado.sigla })]
  ];
  let motivo = 'offline';
  for (const [nome, url, norm] of fontes) {
    let r = await _fetchJson(url);
    if (r.status === 429) { motivo = 'limite'; await espera(1400); r = await _fetchJson(url); }
    if (r.status === 404 || r.status === 400) return { ok: false, motivo: 'inexistente' };
    if (r.json && (r.json.razao_social)) return Object.assign({ ok: true, fonte: nome }, norm(r.json));
    if (r.status === 429) motivo = 'limite';
  }
  return { ok: false, motivo };
}
const CNPJ_MSG = { inexistente: 'Não encontrei esse CNPJ — confira o número ou escreva o nome da empresa.', limite: 'A consulta pública está no limite agora. Escreva o nome da empresa e seguimos.', offline: 'Não consegui consultar agora. Escreva o nome da empresa e seguimos.' };

/* ─── navegação ─── */
function go(id, semPilha) {
  if (atual && !semPilha) pilha.push(atual);
  atual = id;
  TELAS[id]();
  window.scrollTo(0, 0);
  el('btVoltar').hidden = !pilha.length || id === 'FIM';
  progresso();
  salvar(id === 'FIM');
}
function voltar() { if (!pilha.length) return; atual = pilha.pop(); TELAS[atual](); window.scrollTo(0, 0); el('btVoltar').hidden = !pilha.length; progresso(); }
function progresso() {
  let pct;
  if (atual === 'FIM') pct = 100;
  else pct = Math.min(96, (pilha.length + 1) / (R.visto.pc && R.visto.rg ? 27 : 19) * 100);
  el('prog').style.width = pct + '%';
  el('rodape').style.display = (/^(A1|A1b|FIM|D3|D4)$/.test(atual)) ? 'none' : '';
}

/* ─── gaveta ⓘ ─── */
function abrirInfo(k) {
  const it = INFO[k]; if (!it) return;
  el('gavConteudo').innerHTML = `<h3>${esc(it[0])}</h3>` + it.slice(1).map(p => `<p>${esc(p)}</p>`).join('');
  el('veu').classList.add('on'); el('gaveta').classList.add('on');
}
function fecharInfo() { el('veu').classList.remove('on'); el('gaveta').classList.remove('on'); }
const btI = k => `<button class="i" data-info="${k}" aria-label="Mais informações">i</button>`;
function ligarInfos() { document.querySelectorAll('[data-info]').forEach(b => b.onclick = e => { e.stopPropagation(); abrirInfo(b.dataset.info); }); }

/* ─── montagem de tela ─── */
function montar({ rotulo, titulo, info, texto, corpo, rodape }) {
  el('palco').innerHTML = `<div class="cena">
    ${rotulo ? `<div class="rotulo">${rotulo}</div>` : ''}
    ${titulo ? `<h1 class="titulo">${titulo}${info ? btI(info) : ''}</h1>` : ''}
    ${texto ? `<p class="texto">${texto}</p>` : ''}
    ${corpo || ''}
    ${rodape ? `<p class="promessa">${rodape}</p>` : ''}</div>`;
  ligarInfos();
}
const btnContinuar = (txt, cls) => `<button class="btn ${cls || ''}" id="btCont">${txt || 'Continuar →'}</button>`;

/* Pergunta de clique. Uma escolha: grava, mostra a reação (se houver) e pede "Continuar".
   Sem reação: avança sozinha. multi: vários, com "Continuar". */
function pergunta(cfg) {
  const ops = cfg.ops;
  const marcado = v => cfg.multi ? (R[cfg.campo] || []).includes(v) : R[cfg.campo] === v;
  montar({ rotulo: cfg.rotulo, titulo: cfg.titulo, info: cfg.info, texto: cfg.texto, rodape: cfg.rodape,
    corpo: `${cfg.pergunta ? `<p class="pergunta">${cfg.pergunta}${cfg.infoPergunta ? btI(cfg.infoPergunta) : ''}</p>` : ''}
      <div class="ops ${cfg.classe || ''}">${ops.map(o => `<button class="op ${marcado(o.v) ? 'sel' : ''} ${o.largo ? 'largo' : ''}" data-v="${o.v}">${o.t}</button>`).join('')}</div>
      <div id="reac"></div><div id="acao"></div>` });
  ligarInfos();
  const mostrarReac = () => {
    const v = R[cfg.campo];
    const txt = cfg.multi ? [...new Set((v || []).map(x => cfg.reac && cfg.reac(x)).filter(Boolean))].join('<br><br>') : (cfg.reac && cfg.reac(v));
    el('reac').innerHTML = txt ? `<div class="reac">${txt}</div>` : '';
    const pode = cfg.multi ? (v && v.length) : v != null;
    el('acao').innerHTML = pode ? btnContinuar() : '';
    if (pode) el('btCont').onclick = () => go(cfg.next(R[cfg.campo]));
  };
  document.querySelectorAll('.ops .op').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (cfg.multi) {
      const arr = R[cfg.campo] = R[cfg.campo] || [];
      const ex = cfg.exclusivos || [];          // ex.: "não lembro" desmarca o resto
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1);
      else if (ex.indexOf(v) >= 0) { arr.length = 0; arr.push(v); }
      else { for (let k = arr.length - 1; k >= 0; k--) if (ex.indexOf(arr[k]) >= 0) arr.splice(k, 1); arr.push(v); }
      document.querySelectorAll('.ops .op').forEach(x => x.classList.toggle('sel', arr.indexOf(x.dataset.v) >= 0));
      mostrarReac(); return;
    }
    R[cfg.campo] = v;
    document.querySelectorAll('.ops .op').forEach(x => x.classList.toggle('sel', x === b));
    const txt = cfg.reac && cfg.reac(v);
    if (txt) { mostrarReac(); setTimeout(() => el('btCont') && el('btCont').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100); }
    else setTimeout(() => go(cfg.next(v)), 230);
  });
  if (R[cfg.campo] != null && cfg.reac) mostrarReac();
}

/* ─── próxima tela depois de uma trilha ─── */
const fimTrilha = () => (R.visto.pc && R.visto.rg ? 'J' : 'QC');

/* ═════════════ TELAS ═════════════ */
const TELAS = {

  /* ── BLOCO A ── */
  A1() {
    pergunta({ rotulo: 'Diagnóstico da sociedade',
      titulo: 'O que acontece com a sua empresa <em>se um sócio faltar amanhã?</em>',
      texto: 'Na segunda-feira seguinte a empresa continua aberta. A dúvida é com quem — e com que dinheiro.',
      pergunta: 'Você já parou para pensar nisso?', campo: 'a1',
      ops: [{ v: 'ja', t: 'Já pensei nisso' }, { v: 'nunca', t: 'Nunca parei para pensar' }],
      rodape: 'Em 3 minutos você vê a conta que a sua sociedade teria que pagar — feita com os seus números, não com um exemplo.',
      reac: v => v === 'ja'
        ? 'Então, para você, isso não é hipótese. Quase todo mundo que pensa nisso para no susto e nunca chega na conta. É ela que está no fim daqui.'
        : 'É a resposta mais comum. Ninguém pensa nisso enquanto tudo funciona — só que a conta existe do mesmo jeito, pensada ou não.',
      next: () => 'A1b' });
  },
  A1b() {
    pergunta({ rotulo: 'A sua sociedade', titulo: 'Para a conta ser a sua, <em>e não um exemplo.</em>',
      pergunta: 'Quantos sócios a empresa tem hoje?', campo: 'nSocios', classe: 'grade',
      ops: [{ v: '1', t: 'Só eu', largo: true }, ...['2', '3', '4', '5', '6', '7', '8', '9'].map(n => ({ v: n, t: n })), { v: '10+', t: '10 ou mais', largo: true }],
      reac: v => {
        if (v === '1') return 'Então a empresa depende de uma pessoa só. Tudo o que vem a seguir pesa em dobro nesse caso.';
        if (v === '2') return 'Numa sociedade de dois, se um faltar, o outro passa a ser sócio dos herdeiros dele.';
        if (['3', '4', '5'].includes(v)) return `Com ${v} sócios, são ${v} famílias que podem entrar na mesa sem terem sido convidadas.`;
        return 'Em sociedades maiores, a falta de um mexe no equilíbrio de todos. As regras precisam existir antes de serem usadas.';
      },
      next: () => solo() ? 'MT' : 'A2' });
  },
  A2() {
    pergunta({ rotulo: 'A sua sociedade', titulo: 'Os seus sócios são…', info: 'quem',
      texto: 'Pode marcar mais de um.', campo: 'perfil', multi: true,
      ops: [{ v: 'familia', t: 'Família <small>filhos, irmãos, cônjuge</small>' }, { v: 'operacional', t: 'Sócios que trabalham na empresa' },
            { v: 'investidor', t: 'Investidores que não atuam no dia a dia' }, { v: 'holding', t: 'Algum sócio participa por holding' }],
      reac: v => ({
        familia: 'Sociedade de família tem uma vantagem e um risco: todo mundo se conhece — e todo mundo tem herdeiros.',
        investidor: 'Sócio que só investe costuma ser o primeiro a querer sair. E os herdeiros dele, mais ainda.',
        holding: 'Quem participa por holding não entra neste seguro — mas a holding pode contratar um seguro próprio, no CNPJ dela. Os demais sócios entram normalmente.'
      })[v],
      next: () => 'MT' });
  },
  MT() {

/* ─── pré-diagnóstico: 3 blocos por prioridade ─── */
function diagnostico() {
  const e = espelho(); const out = [];
  const add = (cond, t, res) => { if (cond && out.length < 3) out.push({ t, res }); };
  const PESO_TXT = { inventario: 'a demora do inventário', pagar: 'pagar a parte da família', herdeiros: 'herdeiros entrando na sociedade', travou: 'decisões e assinaturas travadas', familias: 'o desentendimento entre as famílias' };
  const pesou = (R.morteComo || []).map(k => PESO_TXT[k]).filter(Boolean);
  add(R.morte === 'dificil' || R.morte === 'andamento', `Vocês já viveram isso${pesou.length ? ' — e o que mais pesou foi ' + pesou.join(', ') : ''}. A Pessoa Chave paga a parte da família; o Resgatável paga a espera.`, 'Pessoa Chave + Resgatável');
  const FONTE = { emprestimo: 'de empréstimo ou da venda de algum ativo', parcelando: 'de parcelas com a família, por anos', naosei: 'de onde, você ainda não sabe' };
  const fonteTxt = R.b6 === 'naosei' ? 'Pelo que você respondeu, ainda não está definido de onde sairia esse dinheiro.' : `Pelo que você respondeu, esse dinheiro sairia ${FONTE[R.b6]}.`;
  add(R.b6 && R.b6 !== 'caixa', solo() ? `A empresa depende de você. ${fonteTxt}`
    : `A sua parte vale ${e ? faixaTxt(e.parte[0], e.parte[1]) : 'um valor alto'}. ${fonteTxt}`, 'Pessoa Chave');
  add(R.c1 === 'alguns' || R.c1 === 'nenhum', 'Seus filhos não têm o mesmo papel na empresa. A herança pode ser equilibrada sem mexer nas cotas.', 'Resgatável');
  add(['nunca', 'naosei'].includes(R.b1) || ['nunca', 'naosei'].includes(R.b2), 'O que acontece com a cota de quem falta não está definido. Reler o contrato é tarefa de uma tarde.', 'Advogado + Pessoa Chave');
  add(e && e.parte[0] > 12 && !solo(), 'A parte de um sócio passa de R$ 12 milhões. O seguro cobre até esse valor; o restante pede uma cláusula de pagamento no contrato.', 'Pessoa Chave + contrato');
  add(R.c3 && R.c3 !== 'tudo', 'No mês seguinte, a família teria pouco dinheiro livre.', 'Resgatável');
  add(R.b2 === 'herdeiros' || (solo() && (R.b2solo === 'parente' || R.b2solo === 'diretor')), 'Mesmo que a família assuma, a transição tem custo: assinaturas travadas, advogados, bancos revendo garantias.', 'Pessoa Chave');
  add(R.b3tipo === 'capital', 'O número que você conhece não é o que a família de um sócio vai cobrar.', 'Advogado + Pessoa Chave');
  add(R.c4 === 'naolembro' || (R.d1 || []).includes('naosei'), 'O seu seguro atual pode pagar para quem você não escolheria hoje.', 'Revisão + Resgatável');
  if (!out.length) out.push({ t: 'Sua sociedade está mais organizada que o comum. O que falta é a fonte do dinheiro no dia.', res: R.visto.pc ? 'Pessoa Chave' : 'Resgatável' });
  return out;
}

/* ─── retomar de onde parou ─── */
let RETOMAR = null;
function telaRetomar() {
  const q = RETOMAR.quando && RETOMAR.quando.toDate ? RETOMAR.quando.toDate() : null;
  const dias = q ? Math.floor((Date.now() - q.getTime()) / 86400000) : null;
  const quando = dias == null ? '' : dias === 0 ? 'hoje' : dias === 1 ? 'ontem' : 'há ' + dias + ' dias';
  montar({ rotulo: 'Bem-vindo de volta', titulo: 'Você já tinha começado.',
    texto: `As suas respostas ${quando ? 'de ' + quando + ' ' : ''}estão guardadas. Dá para seguir de onde parou — ou recomeçar, se preferir.`,
    corpo: `<button class="btn ouro" id="btSeguir">Seguir de onde parei →</button>
      <button class="btn sec" id="btZero">Começar de novo</button>` });
  el('btSeguir').onclick = () => { Object.assign(R, RETOMAR.respostas); const p = RETOMAR.passo; RETOMAR = null; go(p, true); };
  el('btZero').onclick = () => { RETOMAR = null; go('A1', true); };
}

/* ─── ir para a cotação: arquivo separado, MESMO registro ─── */
async function irParaCotacao() {
  R.pediuCotacao = true; await salvar();
  const qp = new URLSearchParams(); if (TOKEN) qp.set('t', TOKEN); else qp.set('g', GRUPO); qp.set('r', RESPID);
  let hash = '';
  if (!db) { try { hash = '#ctx=' + btoa(unescape(encodeURIComponent(JSON.stringify(R)))); } catch (e) {} }  // modo demonstração: leva as respostas pela URL
  location.href = 'QuestionarioVidaSocios.html?' + qp.toString() + hash;
}

/* ─── compartilhar e PDF ─── */
/* Telefone brasileiro: aceita digitado corrido, colado ou com +55 e devolve (xx) 9xxxx-xxxx. */
function mascTel(v) {
  let d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.length > 11 && d.slice(0, 2) === '55') d = d.slice(2);
  d = d.slice(0, 11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}

  if (paraNome && quem === 'assessor')
    return ola.charAt(0).toUpperCase() + ola.slice(1) + 'queria a sua opinião técnica sobre este diagnóstico de sucessão da empresa. São os pontos do contrato social e o impacto no caixa se um sócio faltar. Leva 3 minutos:' + ass;
  if (quem === 'preencher')
    return 'Estamos cotando a proteção dos sócios da empresa e falta a sua parte. São seus dados básicos, leva 1 minuto:' + ass;
  if (quem === 'socio')
    return 'Respondi um diagnóstico sobre o que aconteceria com a nossa sociedade se um de nós faltasse — contrato, haveres, herdeiros. Leva 3 minutos e é sobre a nossa empresa, não é propaganda.\n\nResponde a sua parte? Depois as respostas aparecem lado a lado e a gente compara o que cada um entendeu.' + ass;
  return 'Queria a sua opinião técnica sobre este diagnóstico de sucessão da empresa. São os pontos do contrato social e o impacto no caixa se um sócio faltar. Leva 3 minutos:' + ass;
}

function abrirCompartilhar(quem) {

    const rid = novoRespId(), url = linkPessoal(rid), txt = textoCompartilhar(quem, nome);
    R.compartilhadoEm = (R.compartilhadoEm || []).concat([{ quem: quem, nome: nome, respId: rid, em: new Date().toISOString() }]);

      el('shCopy').textContent = '✓ Copiado';
      setTimeout(() => { if (el('shCopy')) el('shCopy').textContent = 'Copiar texto e link'; }, 2000);
    };
    el('shWa').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(txt + '\n\n' + url), '_blank');
    el('shNome').value = '';
    desenharEnviados();
  };
  el('shGerar').onclick = gerar;
  el('shNome').onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); gerar(); } };

}
function desenharEnviados() {
  const lista = (R.compartilhadoEm || []).filter(x => x && x.nome);

async function compartilhar(quem) {
  const url = linkParaOutro();
  const txt = textoCompartilhar(quem);
  R.compartilhou = (R.compartilhou || []).concat(quem);
  // Registro com data, para o corretor ver na ficha para quem o link foi gerado.
  R.compartilhadoEm = (R.compartilhadoEm || []).concat([{ quem: quem, em: new Date().toISOString() }]);

  try { if (navigator.share) { await navigator.share({ text: txt, url }); return; } } catch (e) { return; }

}

function carregarJsPDF() {

}

function _desenharPDF() {
  const D = _dadosPDF();
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const W = 210, H = 297, M = 17, L = W - M * 2;
  const C = { bg: [10, 16, 32], ouro: [227, 179, 65], txt: [231, 237, 249], sub: [159, 176, 203],
              ciano: [76, 201, 240], card: [19, 27, 50], linha: [40, 52, 84], pe: [132, 148, 173] };
  const mm = (pt, lh) => pt * 0.3528 * (lh || 1.35);
  let y = 0, pag = 0;
  const fonte = (peso, tam, cor) => { doc.setFont('helvetica', peso); doc.setFontSize(tam); doc.setTextColor(cor[0], cor[1], cor[2]); };
  const quebra = (t, tam, larg) => { doc.setFontSize(tam); return doc.splitTextToSize(String(t), larg); };

  function folha() {
    if (pag) doc.addPage();
    pag++;
    doc.setFillColor(C.bg[0], C.bg[1], C.bg[2]); doc.rect(-1, -1, W + 2, H + 2, 'F');
    fonte('normal', 7.5, [109, 125, 150]); doc.text(pag + ' / 4', W - M, H - 11, { align: 'right' });

  }
  function pe() {
    const t = quebra(D.hoje + ' · protocolo ' + D.prot + '. ' + D.rodape, 6.8, L);

    doc.setDrawColor(C.linha[0], C.linha[1], C.linha[2]); doc.setLineWidth(0.2); doc.line(M, yy, W - M, yy);
    fonte('normal', 6.8, C.pe);
    t.forEach(l => { yy += mm(6.8, 1.45); doc.text(l, M, yy); });
  }
  function texto(t, o) {
    o = o || {};

    fonte(o.peso || 'normal', tam, o.cor || C.txt);
    quebra(t, tam, larg).forEach(l => { y += mm(tam, o.lh || 1.4); doc.text(l, x, y); });
    if (o.depois) y += o.depois;
  }
  function rotulo(t) {
    fonte('bold', 7.6, C.ouro);

    doc.setDrawColor(96, 78, 34); doc.setLineWidth(0.3); doc.line(M, y, W - M, y);

    const lt = quebra(tit, 10.2, larg), lc = corpo ? quebra(corpo, 8.4, larg) : [];
    const h = pad * 2 + lt.length * mm(10.2, 1.3) + (lc.length ? 1.6 + lc.length * mm(8.4, 1.4) : 0);
    doc.setFillColor(C.card[0], C.card[1], C.card[2]);
    doc.setDrawColor(C.linha[0], C.linha[1], C.linha[2]); doc.setLineWidth(0.2);
    doc.roundedRect(M, y, L, h, 2.2, 2.2, 'FD');
    doc.setFillColor(cor[0], cor[1], cor[2]); doc.rect(M, y + 1.1, 1.4, h - 2.2, 'F');
    let yy = y + pad;
    fonte('bold', 10.2, C.txt); lt.forEach(l => { yy += mm(10.2, 1.3); doc.text(l, xIn, yy); });
    if (lc.length) { yy += 1.6; fonte('normal', 8.4, C.sub); lc.forEach(l => { yy += mm(8.4, 1.4); doc.text(l, xIn, yy); }); }
    y += h + 3.4;
  }
  function hero(rot, num, corpo) {
    const pad = 6, larg = L - pad * 2;
    const ln = quebra(num, 21, larg), lc = quebra(corpo, 8.6, larg);
    const h = pad * 2 + 3.6 + ln.length * mm(21, 1.18) + 2 + lc.length * mm(8.6, 1.45);
    doc.setFillColor(28, 25, 23); doc.setDrawColor(126, 99, 40); doc.setLineWidth(0.4);

    yy += 2.6;

  D.indice.forEach((t, i) => {

async function imprimir(ev) {
  const bt = (ev && ev.currentTarget) || el('btPdf');
  const rotuloBt = bt ? bt.textContent : '';
  const capa = document.createElement('div');
  capa.id = 'pdfCapa';
  capa.innerHTML = '<div class="roda"></div><div class="t">Montando o seu PDF…</div>' +
    '<div class="s">Quatro páginas com as suas respostas e a conta. Leva alguns segundos.</div>';
  document.body.appendChild(capa);
  if (bt) { bt.disabled = true; bt.textContent = 'Gerando o PDF…'; }
  try {
    if (!await carregarJsPDF()) throw new Error('biblioteca indisponível');
    _desenharPDF().save(_nomeArquivo());
  } catch (e) {
    imprimirHTML();               // plano B: documento HTML + caixa de impressão
  } finally {
    if (capa.parentNode) capa.parentNode.removeChild(capa);
    if (bt) { bt.disabled = false; bt.textContent = rotuloBt; }
  }
}
/* plano B: mesmo conteúdo em HTML, impresso pelo navegador */
function imprimirHTML() {

  document.title = _nomeArquivo().replace(/\.pdf$/, '');

  window.print();
  setTimeout(() => { alvo.classList.remove('on'); document.body.classList.remove('gerando-pdf'); document.title = antes; }, 600);
}

/* ─── persistência (mesmo registro para apresentação e cotação) ─── */
async function salvar(finalizou) {
  if (!db || !SESSAO) return;
  try {
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, arqVersao: ARQ_VERSAO,
      respostas: JSON.parse(JSON.stringify(R)),
      diagnostico: diagnostico().map(b => b.t),
      passoAp: atual, trilhaPercorrida: pilha.concat(atual),
      apresentacaoCompleta: !!finalizou || atual === 'D4',
      // Campos que o PAINEL lê no card (📄 telas vistas). Não renomear.
      // `passo` fica reservado ao questionário — se a apresentação gravasse,
      // o card marcaria "questionário iniciado" para quem só viu a apresentação.
      cenasVistas: new Set(pilha.concat(atual)).size,
      totalCenas: Object.keys(TELAS).length,
      concluiu: !!finalizou || atual === 'D4',
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

document.addEventListener('DOMContentLoaded', async () => {

  el('btPular').onclick = irParaCotacao;

  const params = new URLSearchParams(location.search);
  TOKEN = params.get('t');
  GRUPO = TOKEN || params.get('g');
  try { if (!GRUPO) GRUPO = sessionStorage.getItem('grupo_vs3'); } catch (e) {}
  if (!GRUPO) GRUPO = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let _meuResp = null;
  try { sessionStorage.setItem('grupo_vs3', GRUPO); _meuResp = sessionStorage.getItem('resp_vs3_' + GRUPO); } catch (e) {}
  // Link pessoal (?r=): o corretor sabe que aquela resposta é do sócio convidado.
  // Se este navegador já respondeu com outro id, o dele continua valendo — assim
  // quem abre o link de um colega para conferir não sobrescreve a própria resposta.
  const _rConvite = params.get('r');
  RESPID = _meuResp || _rConvite || null;
  if (!RESPID) RESPID = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try { sessionStorage.setItem('resp_vs3_' + GRUPO, RESPID); } catch (e) {}
  SESSAO = 'vidasocios_' + GRUPO + '_' + RESPID;

  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (fbOk) {
    try {
      await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      const base = { produtoId: PRODUTO.id, origem: 'apresentacao', token: TOKEN || null, grupo: GRUPO, respId: RESPID,
        userAgent: navigator.userAgent.slice(0, 180), atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };
      if (TOKEN) {
        let snap = await db.collection('mb_links_apresentacao').where('token', '==', TOKEN).limit(1).get();
        if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', TOKEN).limit(1).get();
        if (!snap.empty) { LINK = snap.docs[0].data(); Object.assign(base, { empresaId: LINK.empresaId || null, empresaNome: LINK.empresaNome || null, agenciaId: LINK.agenciaId || null, geradoPorUid: LINK.geradoPorUid || LINK.criadoPorUid || null }); Q.empresa = LINK.empresaNome || null; }
      }
      const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
      if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
      else {
        // Retomar de onde parou: é a promessa do PDF do diagnóstico.
        const d = doc.data() || {};
        if (d.respostas && d.passoAp && d.passoAp !== 'FIM' && TELAS[d.passoAp]) {
          RETOMAR = { respostas: d.respostas, passo: d.passoAp, quando: d.atualizadoEm };
        }
      }
      await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
    } catch (e) { console.warn('firebase', e); db = null; }
  }
  if (!db) { const d = document.createElement('div'); d.className = 'demo'; d.textContent = 'modo demonstração · respostas não são salvas'; document.body.appendChild(d); }
  console.log('%cVida Sócios v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
  if (RETOMAR) telaRetomar(); else go('A1');
});
