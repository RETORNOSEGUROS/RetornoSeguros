<style>

  :root { --fundo:#050e24; --ciano:#38bdf8; --dourado:#fbbf24; --verde:#34d399; --verm:#f87171; --texto:#e8eeff; --suave:#93a4c8; --apagado:#5d6f95; --card:rgba(255,255,255,.045); --borda:rgba(147,164,200,.22); }

  .voltar[hidden] { visibility:hidden; display:block; }
  .espaco { min-width:70px; }
  .progresso { position:fixed; top:0; left:0; height:3px; background:linear-gradient(90deg,var(--ciano),var(--dourado)); z-index:11; transition:width .5s; width:0; }
  .demo { position:fixed; top:calc(42px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:9; font-size:10.5px; color:#fcd34d; background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.3); padding:3px 10px; border-radius:100px; white-space:nowrap; }

  .palco { position:relative; z-index:2; max-width:600px; margin:0 auto; padding:calc(64px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); min-height:100vh; min-height:100dvh; }

  .titulo { font-size:clamp(23px,6.4vw,32px); font-weight:800; line-height:1.22; letter-spacing:-.02em; margin-bottom:12px; }

  .texto { font-size:15.5px; line-height:1.6; color:#c3d0ec; margin-bottom:18px; }
  .pergunta { font-size:16.5px; font-weight:700; margin:20px 0 12px; line-height:1.4; }

  .i { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ciano); color:var(--ciano); background:rgba(56,189,248,.08); font:700 13px Georgia,serif; font-style:italic; cursor:pointer; vertical-align:middle; margin-left:6px; flex-shrink:0; }

  .ops { display:flex; flex-direction:column; gap:9px; }
  .ops.grade { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .ops.grade2 { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .op { width:100%; padding:14px 16px; border-radius:13px; background:var(--card); border:1.5px solid var(--borda); color:var(--texto); font:600 15px 'Inter',sans-serif; text-align:left; cursor:pointer; transition:all .18s; line-height:1.35; }

  .reac { margin-top:14px; padding:13px 15px; border-radius:12px; background:rgba(56,189,248,.08); border-left:3px solid var(--ciano); font-size:14.5px; line-height:1.55; color:#dbe6ff; animation:entra .35s; }

  .cardp.rg { background:linear-gradient(160deg,rgba(180,120,10,.28),rgba(255,255,255,.03)); border-color:rgba(251,191,36,.4); }
  .cardp .selo2 { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--ciano); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }

  .cardp h2 { font-size:21px; line-height:1.25; font-weight:800; margin-bottom:8px; }
  .cardp p { font-size:14.5px; line-height:1.55; color:#c3d0ec; }
  .cardp .nome { font-size:13px; color:#fff; font-weight:800; letter-spacing:.02em; margin-bottom:6px; opacity:.85; }
  .cardp .visto { font-size:11px; color:var(--verde); font-weight:700; }

  /* espelho e blocos */
  .painel { background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:18px; margin-top:14px; }
  .linha { padding:11px 0; border-bottom:1px solid rgba(147,164,200,.13); font-size:15px; line-height:1.5; }

  .grande { font-size:26px; font-weight:800; color:var(--dourado); display:block; margin-top:2px; }

  /* história em quadros */
  .quadro { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid rgba(147,164,200,.13); animation:entra .4s; }
  .quadro:last-child { border-bottom:none; }
  .quadro .q-tag { flex-shrink:0; width:84px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ciano); padding-top:2px; }
  .quadro .q-txt { font-size:15px; line-height:1.55; color:#dbe6ff; }

  .destaque-verde { color:var(--verde); font-weight:800; }
  .rodape-cinza { margin-top:12px; font-size:13.5px; line-height:1.55; color:var(--suave); }
  .itens-seq li { list-style:none; padding:11px 0 11px 26px; position:relative; font-size:15px; line-height:1.5; color:#dbe6ff; border-bottom:1px solid rgba(147,164,200,.12); opacity:0; animation:entra .45s forwards; }
  .itens-seq li::before { content:'•'; position:absolute; left:8px; color:var(--dourado); font-weight:800; }
  .fecho { margin-top:16px; font-size:17px; font-weight:800; line-height:1.4; }

  table.t { width:100%; border-collapse:collapse; margin-top:8px; font-size:14.5px; }
  table.t td { padding:9px 4px; border-bottom:1px solid rgba(147,164,200,.13); }
  table.t td:last-child { text-align:right; font-weight:700; color:#fff; }
  table.t tr.cruza td { color:var(--verde); }

  /* seletor de idade */
  .idades { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:14px 0 6px; }
  .barra-box { margin-top:16px; }
  .barra-l { font-size:12.5px; color:var(--suave); font-weight:600; margin:10px 0 5px; display:flex; justify-content:space-between; }
  .barra { height:14px; border-radius:7px; background:rgba(255,255,255,.06); overflow:hidden; }
  .barra span { display:block; height:100%; border-radius:7px; transition:width .5s; }

  .acordeao { margin-top:12px; border:1px solid var(--borda); border-radius:13px; overflow:hidden; }
  .acordeao summary { padding:14px 16px; font-weight:700; font-size:14.5px; cursor:pointer; list-style:none; }
  .acordeao summary::after { content:'+'; float:right; color:var(--ciano); font-weight:800; }
  .acordeao[open] summary::after { content:'−'; }
  .acordeao ul { padding:0 16px 14px 32px; }
  .acordeao li { font-size:14px; line-height:1.55; color:#c3d0ec; margin-bottom:6px; }

  .bloco { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid rgba(147,164,200,.13); animation:entra .45s; }
  .bloco:last-child { border-bottom:none; }
  .bloco .num { flex-shrink:0; width:28px; height:28px; border-radius:50%; background:rgba(251,191,36,.15); color:var(--dourado); font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; }

  .campo { width:100%; padding:14px 15px; border-radius:12px; background:rgba(255,255,255,.05); border:1.5px solid var(--borda); color:#fff; font:500 16px 'Inter',sans-serif; }

  .gaveta { position:fixed; left:0; right:0; bottom:0; z-index:21; max-width:600px; margin:0 auto; background:#0c1a3a; border:1px solid rgba(56,189,248,.3); border-bottom:none; border-radius:20px 20px 0 0; padding:18px 20px calc(24px + env(safe-area-inset-bottom)); transform:translateY(105%); visibility:hidden; transition:transform .3s cubic-bezier(.16,1,.3,1), visibility 0s .3s; }
  .gaveta.on { transform:none; visibility:visible; transition:transform .3s cubic-bezier(.16,1,.3,1), visibility 0s; }
  .gaveta .puxador { width:40px; height:4px; border-radius:2px; background:rgba(147,164,200,.4); margin:0 auto 14px; }
  .gaveta h3 { font-size:16px; font-weight:800; margin-bottom:10px; color:var(--ciano); }
  .gaveta p { font-size:14.5px; line-height:1.6; color:#dbe6ff; margin-bottom:8px; }
  .gaveta .fechar { margin-top:10px; }

  .fim { text-align:center; padding-top:30px; }
  .fim .ico { font-size:52px; margin-bottom:12px; }
  #imprimir { display:none; }
  @media print {
    body * { visibility:hidden; }
    #imprimir, #imprimir * { visibility:visible; }
    #imprimir { display:block; position:absolute; top:0; left:0; right:0; color:#000; background:#fff; padding:24px; font-family:Arial,sans-serif; }
    #imprimir h1 { font-size:20px; margin-bottom:8px; } #imprimir h2 { font-size:15px; margin:16px 0 6px; } #imprimir p, #imprimir li { font-size:12.5px; line-height:1.5; }
  }
  @media (max-width:380px) { .ops.grade { grid-template-columns:repeat(4,1fr); } .quadro .q-tag { width:70px; } }
  /* compartilhar com nome */
  .sh-cx{border:1px solid rgba(255,255,255,.13); border-radius:12px; padding:13px 14px; margin-top:10px; background:rgba(255,255,255,.04)}
  .sh-ok{font-size:13.5px; font-weight:700; color:#34d399; margin-top:12px}
  .sh-txt{white-space:pre-wrap; font-size:13px; line-height:1.5; border:1px solid rgba(255,255,255,.13); border-radius:10px; padding:11px 12px; margin-top:8px; max-height:190px; overflow:auto; opacity:.9}
  .sh-bts{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px}
  .sh-bts .btn{flex:1; min-width:150px; margin-top:0}
  .sh-lista{font-size:12.5px; margin-top:9px; opacity:.75}
</style>

<script>
/* ══════════════════════════════════════════════════════════════════
   APRESENTAÇÃO + COTAÇÃO — VIDA SÓCIOS v3 (Pessoa Chave · Resgatável Único)
   Roteiro: documento "Vida Sócios — roteiro de telas v3" (24/09/2026).

const PARTS_TXT = ['Até 10%', '10 a 25%', '25 a 50%', '50 a 75%', 'Acima de 75%'];
const IDADES_EX = [ // morte R$ 1 mi, com questionário de saúde, prêmio total c/ IOF (cotação 90)
  { a: 30, pg: 'R$ 362 mil', r: 277 }, { a: 45, pg: 'R$ 525 mil', r: 191 }, { a: 50, pg: 'R$ 589 mil', r: 170 },
  { a: 55, pg: 'R$ 655 mil', r: 153 }, { a: 62, pg: 'R$ 749 mil', r: 133 } ];
const C2_PARA_EX = { ate39: 0, '40a49': 1, '50a59': 3, '60a70': 4, mais70: 4 };
const CAPITAIS = [[0.2, 'R$ 200 mil'], [0.5, 'R$ 500 mil'], [1, 'R$ 1 mi'], [5, 'R$ 5 mi'], [12, 'R$ 12 mi'], ['outro', 'Outro valor'], [null, 'Recomendação do corretor']];
const I_OUTRO = 5;

/* ─── textos dos botões de informação ─── */
const INFO = {
  quem: ['Quem pode ser segurado', 'Sócios e dirigentes pessoa física que constam no contrato social, entre 18 e 80 anos e em atividade.', 'Sócio que participa por holding fica de fora deste seguro; a holding pode contratar o dela, em separado.'],

const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const solo = () => R.nSocios === '1';
const nSoc = () => R.nSocios === '10+' ? 10 : Number(R.nSocios || 1);
const espera = ms => new Promise(r => setTimeout(r, ms));

function fmtMi(v) {
  if (v >= 1) { const n = Math.round(v); return 'R$ ' + n.toLocaleString('pt-BR') + (n === 1 ? ' milhão' : ' milhões'); }
  return 'R$ ' + (Math.max(1, Math.round(v * 10)) * 100) + ' mil';
}
function faixaTxt(a, b) {
  if (b == null) return 'acima de ' + fmtMi(a);
  if (a <= 0) return 'até ' + fmtMi(b);
  return 'entre ' + fmtMi(a).replace(/ milh(ão|ões)$/, '') + ' e ' + fmtMi(b);
}
function espelho() {
  if (R.b3faixa == null) return null;
  const V = VALORES[R.b3faixa];
  if (solo()) return { parte: V, outros: null };
  if (R.b4 == null) return null;
  const P = PARTS[R.b4];
  const parte = [V[0] * P[0] / 100, V[1] == null ? null : V[1] * P[1] / 100];
  const outros = [V[0] * (100 - P[1]) / 100, V[1] == null ? null : V[1] * (100 - P[0]) / 100];
  return { parte, outros };
}
function capitalSugerido() {
  const e = espelho(); if (!e) return null;
  const [a, b] = e.parte; const meio = b == null ? a * 1.2 : (a + b) / 2;
  if (meio >= 12) return 4;
  let melhor = 0; CAPITAIS.slice(0, 5).forEach((c, i) => { if (Math.abs(c[0] - meio) < Math.abs(CAPITAIS[melhor][0] - meio)) melhor = i; });
  return melhor;
}
/* data de nascimento dd/mm/aaaa → idade de hoje (null se inválida ou fora de 18–80) */
function mascaraData(v) { const d = v.replace(/\D/g, '').slice(0, 8); return d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; }
function idadeDe(txt) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt || ''); if (!m) return null;
  const dia = +m[1], mes = +m[2], ano = +m[3]; const dt = new Date(ano, mes - 1, dia);
  if (dt.getFullYear() !== ano || dt.getMonth() !== mes - 1 || dt.getDate() !== dia) return null;
  const h = new Date(); let a = h.getFullYear() - ano; if (h.getMonth() < mes - 1 || (h.getMonth() === mes - 1 && h.getDate() < dia)) a--;
  return a;
}
function mascaraReais(v) { const d = v.replace(/\D/g, '').slice(0, 9); return d ? 'R$ ' + Number(d).toLocaleString('pt-BR') : ''; }
const capitalValido = s => s.capital != null && (s.capital !== I_OUTRO || (s.capitalOutro >= 200000 && s.capitalOutro <= 12000000));
const capitalEmReais = s => s.capital === I_OUTRO ? s.capitalOutro : (CAPITAIS[s.capital] && CAPITAIS[s.capital][0] != null ? CAPITAIS[s.capital][0] * 1e6 : null);

/* CNPJ: três fontes públicas com fallback (mesmo motor dos outros questionários) */
async function _fetchJson(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); return { status: r.status, json: r.ok ? await r.json() : null }; }
  catch (e) { return { status: 0, json: null }; } finally { clearTimeout(t); }
}
async function _cnpjConsulta(d) {
  const fontes = [
    ['brasilapi', 'https://brasilapi.com.br/api/cnpj/v1/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['minhareceita', 'https://minhareceita.org/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['cnpjws', 'https://publica.cnpj.ws/cnpj/' + d, j => ({ razao: j.razao_social, fantasia: j.estabelecimento && j.estabelecimento.nome_fantasia, cidade: j.estabelecimento && j.estabelecimento.cidade && j.estabelecimento.cidade.nome, uf: j.estabelecimento && j.estabelecimento.estado && j.estabelecimento.estado.sigla })]
  ];
  let motivo = 'offline';
  for (const [nome, url, norm] of fontes) {
    let r = await _fetchJson(url);
    if (r.status === 429) { motivo = 'limite'; await espera(1400); r = await _fetchJson(url); }
    if (r.status === 404 || r.status === 400) return { ok: false, motivo: 'inexistente' };
    if (r.json && (r.json.razao_social)) return Object.assign({ ok: true, fonte: nome }, norm(r.json));
    if (r.status === 429) motivo = 'limite';
  }
  return { ok: false, motivo };
}
const CNPJ_MSG = { inexistente: 'Não encontrei esse CNPJ — confira o número ou escreva o nome da empresa.', limite: 'A consulta pública está no limite agora. Escreva o nome da empresa e seguimos.', offline: 'Não consegui consultar agora. Escreva o nome da empresa e seguimos.' };

function go(id, semPilha) {
  if (atual && !semPilha) pilha.push(atual);
  atual = id;
  TELAS[id]();
  window.scrollTo(0, 0);
  el('btVoltar').hidden = !pilha.length || id === 'FIM';
  progresso();
  salvar(id === 'FIM');
}
function voltar() { if (!pilha.length) return; atual = pilha.pop(); TELAS[atual](); window.scrollTo(0, 0); el('btVoltar').hidden = !pilha.length; progresso(); }
function progresso() {
  let pct;
  if (atual === 'FIM') pct = 100;
  else pct = Math.min(96, (pilha.length + 1) / (R.visto.pc && R.visto.rg ? 26 : 18) * 100);
  el('prog').style.width = pct + '%';
  el('rodape').style.display = (/FIM|D3|D4/.test(atual)) ? 'none' : '';
}

/* Pergunta de clique. Uma escolha: grava, mostra a reação (se houver) e pede "Continuar".
   Sem reação: avança sozinha. multi: vários, com "Continuar". */
function pergunta(cfg) {
  const ops = cfg.ops;
  const marcado = v => cfg.multi ? (R[cfg.campo] || []).includes(v) : R[cfg.campo] === v;
  montar({ rotulo: cfg.rotulo, titulo: cfg.titulo, info: cfg.info, texto: cfg.texto,
    corpo: `${cfg.pergunta ? `<p class="pergunta">${cfg.pergunta}${cfg.infoPergunta ? btI(cfg.infoPergunta) : ''}</p>` : ''}
      <div class="ops ${cfg.classe || ''}">${ops.map(o => `<button class="op ${marcado(o.v) ? 'sel' : ''} ${o.largo ? 'largo' : ''}" data-v="${o.v}">${o.t}</button>`).join('')}</div>
      <div id="reac"></div><div id="acao"></div>` });
  ligarInfos();
  const mostrarReac = () => {
    const v = R[cfg.campo];
    const txt = cfg.multi ? (v || []).map(x => cfg.reac && cfg.reac(x)).filter(Boolean).join('<br><br>') : (cfg.reac && cfg.reac(v));
    el('reac').innerHTML = txt ? `<div class="reac">${txt}</div>` : '';
    const pode = cfg.multi ? (v && v.length) : v != null;
    el('acao').innerHTML = pode ? btnContinuar() : '';
    if (pode) el('btCont').onclick = () => go(cfg.next(R[cfg.campo]));
  };
  document.querySelectorAll('.ops .op').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (cfg.multi) {
      const arr = R[cfg.campo] = R[cfg.campo] || [];
      const ex = cfg.exclusivos || [];          // ex.: "não lembro" desmarca o resto
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1);
      else if (ex.indexOf(v) >= 0) { arr.length = 0; arr.push(v); }
      else { for (let k = arr.length - 1; k >= 0; k--) if (ex.indexOf(arr[k]) >= 0) arr.splice(k, 1); arr.push(v); }
      document.querySelectorAll('.ops .op').forEach(x => x.classList.toggle('sel', arr.indexOf(x.dataset.v) >= 0));
      mostrarReac(); return;
    }
    R[cfg.campo] = v;
    document.querySelectorAll('.ops .op').forEach(x => x.classList.toggle('sel', x === b));
    const txt = cfg.reac && cfg.reac(v);
    if (txt) { mostrarReac(); setTimeout(() => el('btCont') && el('btCont').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100); }
    else setTimeout(() => go(cfg.next(v)), 230);
  });
  if (R[cfg.campo] != null && cfg.reac) mostrarReac();
}

        .map(([v, t]) => `<button class="op ${R.d1 === v ? 'sel' : ''}" data-v="${v}">${t}</button>`).join('')}</div><div id="reac"></div><div id="cap"></div>` });
    const reac = { pessoal: 'Ele protege a sua família. Para a sociedade, o dinheiro precisa chegar na empresa — são papéis diferentes.',
      empresa: 'Vale conferir para quem ele paga e se sobe de preço com a idade.' };
    const mostrarCap = () => {

      el('cap').innerHTML = `<p class="pergunta">De quanto é a cobertura?</p><div class="ops grade2">${['Até R$ 500 mil', 'R$ 500 mil a 2 mi', 'R$ 2 a 5 mi', 'Acima de R$ 5 mi']
        .map((t, i) => `<button class="op ${R.d1cap === i ? 'sel' : ''}" data-i="${i}">${t}</button>`).join('')}</div>`;
      el('cap').querySelectorAll('.op').forEach(b => b.onclick = () => { R.d1cap = Number(b.dataset.i); b.classList.add('sel'); setTimeout(() => go('D2'), 230); });
    };
    el('d1').querySelectorAll('.op').forEach(b => b.onclick = () => {
      R.d1 = b.dataset.v; el('d1').querySelectorAll('.op').forEach(x => x.classList.toggle('sel', x === b));
      if (R.d1 === 'pessoal' || R.d1 === 'empresa') mostrarCap(); else { R.d1cap = null; setTimeout(() => go('D2'), 230); }
    });
    if (R.d1 === 'pessoal' || R.d1 === 'empresa') mostrarCap();
  },
  D2() {
    const blocos = diagnostico();
    montar({ rotulo: 'Seu pré-diagnóstico', titulo: 'O que as suas respostas mostram.',

        <p class="fecho">Nada disso exige decisão hoje. Exige só saber.</p>` + btnContinuar('Receber o diagnóstico completo →') });
    el('btCont').onclick = () => go('D3');
  },
  D3() {
    const c = R.contato || {};
    montar({ rotulo: 'Diagnóstico completo', titulo: 'Para onde envio o diagnóstico completo?',
      corpo: `<label class="lbl">Seu nome</label><input class="campo" id="cNome" value="${esc(c.nome)}" autocomplete="name">
        <label class="lbl">E-mail</label><input class="campo" id="cMail" type="email" value="${esc(c.email)}" autocomplete="email">
        <label class="lbl">WhatsApp (opcional)</label><input class="campo" id="cTel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" maxlength="16" value="${esc(mascTel(c.tel))}">
        <p class="pergunta" style="font-size:15px">Também enviar para (opcional)</p>
        <div class="ops grade2"><button class="op" id="shSocio">Outro sócio</button><button class="op" id="shAdv">Meu contador ou advogado</button></div>
        <div id="shBox"></div><div id="shEnviados"></div>
        <p class="nota">Sucessão se decide junto. Quem receber o link responde a própria versão, e as respostas ficam lado a lado.</p>

    const valida = () => { el('btCont').disabled = !(el('cNome').value.trim() && (el('cMail').value.includes('@') || el('cTel').value.replace(/\D/g, '').length >= 10)); };

    el('cTel').oninput = function () { const p = this.selectionStart === this.value.length; this.value = mascTel(this.value); if (p) this.selectionStart = this.selectionEnd = this.value.length; valida(); };
    el('shSocio').onclick = () => abrirCompartilhar('socio'); el('shAdv').onclick = () => abrirCompartilhar('assessor');
    desenharEnviados();

  },
  D4() {
    montar({ rotulo: 'Enviado', titulo: `Pronto${R.contato && R.contato.nome ? ', ' + esc(R.contato.nome.split(' ')[0]) : ''}. O diagnóstico está a caminho.`,
      corpo: `<button class="btn ouro" id="btCot">Quero a cotação para os sócios →</button>
        <button class="btn sec" id="btPdf">Baixar este diagnóstico em PDF</button>

    el('btCot').onclick = irParaCotacao;
    el('btPdf').onclick = imprimir;
    el('btSo').onclick = () => { R.saida = 'entender'; go('FIM'); };
  },

  FIM() {
    const cot = R.saida === 'cotacao';
    montar({ corpo: `<div class="fim"><div class="ico">✅</div>
      <h1 class="titulo">${cot ? 'Recebemos tudo.' : 'Obrigado pelo tempo.'}</h1>
      <p class="texto">${cot ? 'A cotação vem por sócio, num documento só. Na contratação, cada sócio responde o próprio questionário de saúde, e as carências ficam destacadas antes de qualquer assinatura.'
        : 'O seu diagnóstico está com você. Quando quiser ver os números, o caminho é o mesmo link.'}</p></div>` });
  }
};

/* ─── pré-diagnóstico: 3 blocos por prioridade ─── */
function diagnostico() {
  const e = espelho(); const out = [];
  const add = (cond, t, res) => { if (cond && out.length < 3) out.push({ t, res }); };
  const PESO_TXT = { inventario: 'a demora do inventário', pagar: 'pagar a parte da família', herdeiros: 'herdeiros entrando na sociedade', travou: 'decisões e assinaturas travadas', familias: 'o desentendimento entre as famílias' };
  const pesou = (R.morteComo || []).map(k => PESO_TXT[k]).filter(Boolean);
  add(R.morte === 'dificil' || R.morte === 'andamento', `Vocês já viveram isso${pesou.length ? ' — e o que mais pesou foi ' + pesou.join(', ') : ''}. A Pessoa Chave paga a parte da família; o Resgatável paga a espera.`, 'Pessoa Chave + Resgatável');
  const FONTE = { emprestimo: 'de empréstimo ou da venda de algum ativo', parcelando: 'de parcelas com a família, por anos', naosei: 'de onde, você ainda não sabe' };
  const fonteTxt = R.b6 === 'naosei' ? 'Pelo que você respondeu, ainda não está definido de onde sairia esse dinheiro.' : `Pelo que você respondeu, esse dinheiro sairia ${FONTE[R.b6]}.`;
  add(R.b6 && R.b6 !== 'caixa', solo() ? `A empresa depende de você. ${fonteTxt}`
    : `A sua parte vale ${e ? faixaTxt(e.parte[0], e.parte[1]) : 'um valor alto'}. ${fonteTxt}`, 'Pessoa Chave');
  add(R.c1 === 'alguns' || R.c1 === 'nenhum', 'Seus filhos não têm o mesmo papel na empresa. A herança pode ser equilibrada sem mexer nas cotas.', 'Resgatável');
  add(['nunca', 'naosei'].includes(R.b1) || ['nunca', 'naosei'].includes(R.b2), 'O que acontece com a cota de quem falta não está definido. Reler o contrato é tarefa de uma tarde.', 'Advogado + Pessoa Chave');
  add(e && e.parte[0] > 12 && !solo(), 'A parte de um sócio passa de R$ 12 milhões. O seguro cobre até esse valor; o restante pede uma cláusula de pagamento no contrato.', 'Pessoa Chave + contrato');
  add(R.c3 && R.c3 !== 'tudo', 'No mês seguinte, a família teria pouco dinheiro livre.', 'Resgatável');
  add(R.b2 === 'herdeiros' || (solo() && (R.b2solo === 'parente' || R.b2solo === 'diretor')), 'Mesmo que a família assuma, a transição tem custo: assinaturas travadas, advogados, bancos revendo garantias.', 'Pessoa Chave');
  add(R.b3tipo === 'capital', 'O número que você conhece não é o que a família de um sócio vai cobrar.', 'Advogado + Pessoa Chave');
  add(R.c4 === 'naolembro' || R.d1 === 'naosei', 'O seu seguro atual pode pagar para quem você não escolheria hoje.', 'Revisão + Resgatável');
  if (!out.length) out.push({ t: 'Sua sociedade está mais organizada que o comum. O que falta é a fonte do dinheiro no dia.', res: R.visto.pc ? 'Pessoa Chave' : 'Resgatável' });
  return out;
}

/* ─── ir para a cotação: arquivo separado, MESMO registro ─── */
async function irParaCotacao() {
  R.pediuCotacao = true; await salvar();
  const qp = new URLSearchParams(); if (TOKEN) qp.set('t', TOKEN); else qp.set('g', GRUPO); qp.set('r', RESPID);
  let hash = '';
  if (!db) { try { hash = '#ctx=' + btoa(unescape(encodeURIComponent(JSON.stringify(R)))); } catch (e) {} }  // modo demonstração: leva as respostas pela URL
  location.href = 'QuestionarioVidaSocios.html?' + qp.toString() + hash;
}

/* ─── compartilhar e PDF ─── */
/* Telefone brasileiro: aceita digitado corrido, colado ou com +55 e devolve (xx) 9xxxx-xxxx. */
function mascTel(v) {
  let d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.length > 11 && d.slice(0, 2) === '55') d = d.slice(2);
  d = d.slice(0, 11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}

/* Link pessoal: cada convidado ganha o próprio identificador, para o corretor
   saber de quem é cada resposta em vez de ver "respondeu sem se identificar". */
function novoRespId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function linkPessoal(rid) {
  const qp = new URLSearchParams(); if (TOKEN) qp.set('t', TOKEN); else if (GRUPO) qp.set('g', GRUPO);
  if (rid) qp.set('r', rid);
  return location.origin + location.pathname + (qp.toString() ? '?' + qp : '');
}

function linkParaOutro() {
  const qp = new URLSearchParams(); if (TOKEN) qp.set('t', TOKEN); else if (GRUPO) qp.set('g', GRUPO);
  return location.origin + location.pathname + (qp.toString() ? '?' + qp : '');
}
/* Mensagens escritas na voz de quem está compartilhando — o sócio do outro lado
   precisa entender em duas linhas o que é e por que veio dele, não da corretora. */
function textoCompartilhar(quem, paraNome) {
  const eu = (R.contato && R.contato.nome ? R.contato.nome.split(' ')[0] : '').trim();
  const ass = eu ? '\n\n— ' + eu : '';
  const ola = paraNome ? String(paraNome).trim().split(/\s+/)[0] + ', ' : '';
  if (paraNome && quem === 'socio')
    return ola.charAt(0).toUpperCase() + ola.slice(1) + 'respondi um diagnóstico sobre o que aconteceria com a nossa sociedade se um de nós faltasse — contrato, haveres, herdeiros. Leva 3 minutos e é sobre a nossa empresa, não é propaganda.\n\nResponde a sua parte? Depois as respostas aparecem lado a lado e a gente compara o que cada um entendeu.' + ass;
  if (paraNome && quem === 'assessor')
    return ola.charAt(0).toUpperCase() + ola.slice(1) + 'queria a sua opinião técnica sobre este diagnóstico de sucessão da empresa. São os pontos do contrato social e o impacto no caixa se um sócio faltar. Leva 3 minutos:' + ass;
  if (quem === 'preencher')
    return 'Estamos cotando a proteção dos sócios da empresa e falta a sua parte. São seus dados básicos, leva 1 minuto:' + ass;
  if (quem === 'socio')
    return 'Respondi um diagnóstico sobre o que aconteceria com a nossa sociedade se um de nós faltasse — contrato, haveres, herdeiros. Leva 3 minutos e é sobre a nossa empresa, não é propaganda.\n\nResponde a sua parte? Depois as respostas aparecem lado a lado e a gente compara o que cada um entendeu.' + ass;
  return 'Queria a sua opinião técnica sobre este diagnóstico de sucessão da empresa. São os pontos do contrato social e o impacto no caixa se um sócio faltar. Leva 3 minutos:' + ass;
}
/* ─── compartilhar com nome: digita quem é, gera o link dele e entrega o texto pronto ─── */
const SH_ROT = { socio: 'sócio', assessor: 'contador ou advogado', preencher: 'sócio' };
function abrirCompartilhar(quem) {
  const cx = el('shBox'); if (!cx) return;
  if (cx.dataset.aberto === quem) { cx.innerHTML = ''; cx.dataset.aberto = ''; return; }
  cx.dataset.aberto = quem;
  cx.innerHTML = `<div class="sh-cx">
      <label class="lbl">Nome do ${SH_ROT[quem]}</label>
      <input class="campo" id="shNome" placeholder="Ex.: Arizoli" autocomplete="off">
      <button class="btn sec" id="shGerar" style="margin-top:8px">Gerar o link para ele</button>
      <div id="shSaida"></div>
    </div>`;
  const gerar = () => {
    const nome = (el('shNome').value || '').trim();
    if (!nome) { el('shNome').focus(); return; }
    const rid = novoRespId(), url = linkPessoal(rid), txt = textoCompartilhar(quem, nome);
    R.compartilhadoEm = (R.compartilhadoEm || []).concat([{ quem: quem, nome: nome, respId: rid, em: new Date().toISOString() }]);
    R.compartilhou = (R.compartilhou || []).concat(quem);
    salvar();
    el('shSaida').innerHTML = `<div class="sh-ok">✓ Link criado para <b>${esc(nome)}</b></div>
      <div class="sh-txt" id="shMsg">${esc(txt + '\n\n' + url)}</div>
      <div class="sh-bts">
        <button class="btn sec" id="shCopy">Copiar texto e link</button>
        <button class="btn" id="shWa">Abrir no WhatsApp</button>
      </div>`;
    el('shCopy').onclick = async () => {
      const t = txt + '\n\n' + url;
      try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
      el('shCopy').textContent = '✓ Copiado';
      setTimeout(() => { if (el('shCopy')) el('shCopy').textContent = 'Copiar texto e link'; }, 2000);
    };
    el('shWa').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(txt + '\n\n' + url), '_blank');
    el('shNome').value = '';
    desenharEnviados();
  };
  el('shGerar').onclick = gerar;
  el('shNome').onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); gerar(); } };
  el('shNome').focus();
}
function desenharEnviados() {
  const lista = (R.compartilhadoEm || []).filter(x => x && x.nome);
  const el2 = el('shEnviados'); if (!el2) return;
  el2.innerHTML = lista.length
    ? '<div class="sh-lista">Link já criado para: <b>' + lista.map(x => esc(x.nome)).join(', ') + '</b></div>' : '';
}

async function compartilhar(quem) {
  const url = linkParaOutro();
  const txt = textoCompartilhar(quem);
  R.compartilhou = (R.compartilhou || []).concat(quem);
  // Registro com data, para o corretor ver na ficha para quem o link foi gerado.
  R.compartilhadoEm = (R.compartilhadoEm || []).concat([{ quem: quem, em: new Date().toISOString() }]);
  salvar();
  try { if (navigator.share) { await navigator.share({ text: txt, url }); return; } } catch (e) { return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(txt + '\n\n' + url), '_blank');
}
function imprimir() {
  const b = diagnostico();
  el('imprimir').innerHTML = `<h1>Pré-diagnóstico · Vida Sócios</h1><p>${esc(CONFIG.marca)} · ${new Date().toLocaleDateString('pt-BR')}</p>
    <h2>O que as respostas mostram</h2><ol>${b.map(x => `<li>${x.t} (${x.res})</li>`).join('')}</ol>
    <h2>As duas proteções</h2><p><b>Pessoa Chave:</b> se um sócio faltar, a empresa recebe. Cobertura até R$ 12 milhões por sócio, corrigida pela inflação.</p>
    <p><b>Resgatável Único:</b> a empresa paga uma vez; a família recebe sem IR e fora do inventário; resgate a partir do 7º mês.</p>
    <p style="margin-top:14px;font-size:11px">Informações sujeitas às condições gerais dos produtos. Não substitui orientação jurídica ou contábil.</p>`;
  window.print();
}

/* ─── persistência (mesmo registro para apresentação e cotação) ─── */
async function salvar(finalizou) {
  if (!db || !SESSAO) return;
  try {
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, arqVersao: ARQ_VERSAO,
      respostas: JSON.parse(JSON.stringify(R)),
      diagnostico: diagnostico().map(b => b.t),
      passoAp: atual, trilhaPercorrida: pilha.concat(atual),
      apresentacaoCompleta: !!finalizou || atual === 'D4',
      // Campos que o PAINEL lê no card (📄 telas vistas). Não renomear.
      // `passo` fica reservado ao questionário — se a apresentação gravasse,
      // o card marcaria "questionário iniciado" para quem só viu a apresentação.
      cenasVistas: new Set(pilha.concat(atual)).size,
      totalCenas: Object.keys(TELAS).length,
      concluiu: !!finalizou || atual === 'D4',
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

/* ─── início ─── */
document.addEventListener('DOMContentLoaded', async () => {
  el('marca').textContent = CONFIG.marca;
  el('btVoltar').onclick = voltar;
  el('veu').onclick = fecharInfo; el('gavFechar').onclick = fecharInfo;
  el('btPular').onclick = irParaCotacao;

  const params = new URLSearchParams(location.search);
  TOKEN = params.get('t');
  GRUPO = TOKEN || params.get('g');
  try { if (!GRUPO) GRUPO = sessionStorage.getItem('grupo_vs3'); } catch (e) {}
  if (!GRUPO) GRUPO = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let _meuResp = null;
  try { sessionStorage.setItem('grupo_vs3', GRUPO); _meuResp = sessionStorage.getItem('resp_vs3_' + GRUPO); } catch (e) {}
  // Link pessoal (?r=): o corretor sabe que aquela resposta é do sócio convidado.
  // Se este navegador já respondeu com outro id, o dele continua valendo — assim
  // quem abre o link de um colega para conferir não sobrescreve a própria resposta.
  const _rConvite = params.get('r');
  RESPID = _meuResp || _rConvite || null;
  if (!RESPID) RESPID = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try { sessionStorage.setItem('resp_vs3_' + GRUPO, RESPID); } catch (e) {}
  SESSAO = 'vidasocios_' + GRUPO + '_' + RESPID;

  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (fbOk) {
    try {
      await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      const base = { produtoId: PRODUTO.id, origem: 'apresentacao', token: TOKEN || null, grupo: GRUPO, respId: RESPID,
        userAgent: navigator.userAgent.slice(0, 180), atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };
      if (TOKEN) {
        let snap = await db.collection('mb_links_apresentacao').where('token', '==', TOKEN).limit(1).get();
        if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', TOKEN).limit(1).get();
        if (!snap.empty) { LINK = snap.docs[0].data(); Object.assign(base, { empresaId: LINK.empresaId || null, empresaNome: LINK.empresaNome || null, agenciaId: LINK.agenciaId || null, geradoPorUid: LINK.geradoPorUid || LINK.criadoPorUid || null }); Q.empresa = LINK.empresaNome || null; }
      }
      const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
      if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
    } catch (e) { console.warn('firebase', e); db = null; }
  }
  if (!db) { const d = document.createElement('div'); d.className = 'demo'; d.textContent = 'modo demonstração · respostas não são salvas'; document.body.appendChild(d); }
  console.log('%cVida Sócios v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
  go('A1');
});
