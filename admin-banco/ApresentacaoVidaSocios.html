<script>
/* ═══════════════════════════════════════════════════════════════════════
   VIDA SÓCIOS — versão CONVERSA (teste de formato, 29/09)
   As mesmas perguntas da apresentação tela a tela, mas em fio de conversa.
   Arquivo separado de propósito: a versão tela a tela continua no ar, para
   dar para comparar. Grava no MESMO registro (mb_apresentacoes), com o
   mesmo formato de `respostas`, então ficha, painel e proposta não mudam.
   O campo `formato: 'conversa'` é o que separa um teste do outro.
   URL: ConversaVidaSocios.html?t=<token>   ·   ?g=<grupo>&r=<respId>
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = { marca: 'Retorno Seguros' };
const PRODUTO = { id: 'vida_socios', nome: 'Vida Sócios — Pessoa Chave e Resgatável Único' };
const ARQ_VERSAO = 'c1';
const FORMATO = 'conversa';

const R = { visto: { pc: false, rg: false } };
const Q = { empresa: null };
let db = null, SESSAO = null, GRUPO = null, RESPID = null, LINK = null, TOKEN = null;
let ORDEM = [];              // campos respondidos, na ordem — para poder editar
let RETOMANDO = false;       // relendo respostas salvas: sem animação
let PASSO = 0, TOTAL_PASSOS = 25;   // respostas do caminho completo

const el = id => document.getElementById(id);
const fio = () => el('fio');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* ?rapido=1 tira as pausas: serve para reler a conversa inteira sem esperar. */
const RAPIDO = new URLSearchParams(location.search).get('rapido') === '1';
const espera = ms => new Promise(r => setTimeout(r, (RETOMANDO || RAPIDO) ? 0 : ms));
const solo = () => R.nSocios === '1';
const nSoc = () => R.nSocios === '10+' ? 10 : Number(R.nSocios || 1);

/* ─── tabelas do espelho (iguais às da apresentação) ─── */
const VALORES = [[0, 5], [5, 20], [20, 50], [50, 100], [100, 300], [300, null]];
const VALORES_TXT = ['Até R$ 5 milhões', 'R$ 5 a 20 milhões', 'R$ 20 a 50 milhões', 'R$ 50 a 100 milhões', 'R$ 100 a 300 milhões', 'Acima de R$ 300 milhões'];
const PARTS = [[0, 10], [10, 25], [25, 50], [50, 75], [75, 100]];
const PARTS_TXT = ['Até 10%', '10 a 25%', '25 a 50%', '50 a 75%', 'Acima de 75%'];
const IDADES_EX = [{ a: 30, r: 277 }, { a: 45, r: 191 }, { a: 50, r: 170 }, { a: 55, r: 153 }, { a: 62, r: 133 }];
const C2_PARA_EX = { ate39: 0, '40a49': 1, '50a59': 3, '60a70': 4, mais70: 4 };

function fmtMi(v) {
  if (v >= 1) { const n = Math.round(v); return 'R$ ' + n.toLocaleString('pt-BR') + (n === 1 ? ' milhão' : ' milhões'); }
  return 'R$ ' + (Math.max(1, Math.round(v * 10)) * 100) + ' mil';
}
function faixaTxt(a, b) {
  if (b == null) return 'acima de ' + fmtMi(a);
  if (a <= 0) return 'até ' + fmtMi(b);
  return 'entre ' + fmtMi(a).replace(/ milh(ão|ões)$/, '') + ' e ' + fmtMi(b);
}
function espelho() {
  if (R.b3faixa == null) return null;
  const V = VALORES[R.b3faixa];
  if (solo()) return { parte: V, outros: null };
  if (R.b4 == null) return null;
  const P = PARTS[R.b4];
  return { parte: [V[0] * P[0] / 100, V[1] == null ? null : V[1] * P[1] / 100],
           outros: [V[0] * (100 - P[1]) / 100, V[1] == null ? null : V[1] * (100 - P[0]) / 100] };
}

/* ═══════════════ MOTOR DA CONVERSA ═══════════════
   O roteiro é um async/await: lê como uma conversa e é fácil de mexer.
   `diz()` escreve uma bolha; `pergunta()` espera o clique. Na retomada, o
   mesmo roteiro roda instantâneo e se auto-responde com o que já está salvo,
   até chegar na primeira pergunta sem resposta. */
/* Botões do mesmo tamanho. Se UMA opção não couber em meia linha, TODAS passam
   a ocupar a linha inteira — meio botão ao lado de um inteiro é o que fazia a
   tela parecer desconfigurada. Sobrando uma solta no fim, ela também estica. */
const _comp = (t, sub) => !!sub || String(t).replace(/<[^>]+>/g, '').length > 26;
function classesOps(ops, forcados) {
  const fix = forcados || [];
  const todos = ops.some((o, i) => !fix.includes(i) && _comp(o[1], o[2]));
  const sobra = (ops.length - fix.length) % 2 === 1;   // uma solta no fim: estica
  return ops.map((o, i) => (fix.includes(i) || todos || (sobra && i === ops.length - 1)) ? 'largo' : '');
}
/* O conteúdo que na versão tela a tela vivia no botão "i". */
async function saiba(titulo, ...paragrafos) {
  if (!RETOMANDO) await espera(240);
  const d = document.createElement('div');
  d.className = 'saiba';
  d.innerHTML = `<b>${titulo}</b>` + paragrafos.map(x => `<p>${x}</p>`).join('');
  fio().appendChild(d);
  _grupoNovo = false; aoFim();
  await espera(200);
}
/* ═══ A ROLAGEM ═══
   Cada grupo tem no máximo 3 balões e cada balão ficou curto, então a página
   pode voltar a empurrar o texto: a tela acompanha a escrita, como em qualquer
   conversa. A trava que importa continua de pé — se a pessoa rolou com o dedo
   para reler alguma coisa, o sistema para de rolar sozinho até a resposta dela. */
let _grupoNovo = true, _rolandoNos = false, _dedo = false;
/* Quem avisa que a pessoa rolou é o DEDO dela, não o evento `scroll`:
   a rolagem suave de um salto grande dura mais que qualquer janela de tempo
   que a gente arbitre, e os eventos dela eram lidos como se fossem toque —
   era isso que travava a tela no meio da conversa. `wheel`, `touchmove` e as
   teclas de rolagem só disparam por ação de gente. */
const TECLAS_ROLA = { PageUp: 1, PageDown: 1, ArrowUp: 1, ArrowDown: 1, Home: 1, End: 1, ' ': 1 };
['wheel', 'touchmove'].forEach(ev => window.addEventListener(ev, () => { _dedo = true; }, { passive: true }));
window.addEventListener('keydown', e => { if (TECLAS_ROLA[e.key] && !/^(INPUT|TEXTAREA)$/.test((e.target || {}).tagName || '')) _dedo = true; });
/* E se ela mesma voltar para o fim, o sistema reassume a rolagem. */
window.addEventListener('scroll', () => {
  if (_dedo && !_rolandoNos && document.body.scrollHeight - window.scrollY - window.innerHeight < 70) _dedo = false;
}, { passive: true });
function aoFim() {
  if (RETOMANDO) { window.scrollTo(0, document.body.scrollHeight); return; }
  if (_dedo) return;
  _rolandoNos = true;
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  setTimeout(() => { _rolandoNos = false; }, 120);
}
const ancorar = () => aoFim();
/* toda resposta devolve o controle da rolagem ao sistema */
function abrirGrupo() { _grupoNovo = true; _dedo = false; }
function progresso() {
  const pct = Math.max(0, Math.min(100, Math.round(PASSO / TOTAL_PASSOS * 100)));
  const volta = 2 * Math.PI * 19;
  el('arco').setAttribute('stroke-dashoffset', String(volta * (1 - pct / 100)));
  el('anelN').textContent = pct + '%';
  el('anel').classList.toggle('cheio', pct >= 100);
}

/* Ritmo: a primeira frase demora para chegar, e entre uma bolha e a próxima
   entra uma pausa proporcional ao que ele acabou de ler. Sem isso chegam três
   mensagens de uma vez e ele não lê nenhuma. */
let _ultima = '', _primeira = true;
function _pausaLeitura() {
  if (_primeira) { _primeira = false; return 1500; }
  const n = _ultima.replace(/<[^>]+>/g, '').length;
  return Math.max(350, Math.min(1000, 180 + n * 7));
}
async function diz(html, classe) {
  if (!RETOMANDO && !RAPIDO) {
    await espera(_pausaLeitura());
    el('statusTopo').textContent = 'digitando…';
    const d = document.createElement('div');
    d.className = 'digitando';
    d.innerHTML = '<i></i><i></i><i></i>';
    fio().appendChild(d); aoFim();
    await espera(Math.min(800, 220 + String(html).replace(/<[^>]+>/g, '').length * 5));
    d.remove();
    el('statusTopo').textContent = 'online';
  }
  _ultima = String(html);
  const b = document.createElement('div');
  b.className = 'bolha eles ' + (classe || '');
  b.innerHTML = html;
  fio().appendChild(b);
  _grupoNovo = false; aoFim();
  await espera(130);
  return b;
}
async function cartao(html, ouro) {
  if (!RETOMANDO) { await espera(240); }
  const c = document.createElement('div');
  c.className = 'cartao ' + (ouro ? 'ouro' : '');
  c.innerHTML = html;
  fio().appendChild(c);
  _grupoNovo = false; aoFim();
  await espera(200);
  return c;
}
function euDisse(texto, campo) {
  const b = document.createElement('div');
  b.className = 'bolha eu';
  b.innerHTML = esc(texto) + (campo ? '<span class="editar" aria-hidden="true">✎</span>' : '');
  if (campo) { b.title = 'Tocar para mudar esta resposta'; b.onclick = () => editarDaqui(campo); }
  fio().appendChild(b); aoFim();
  return b;
}

/* Uma escolha. ops = [[valor, rótulo, subtítulo?], …] */
function pergunta(campo, ops, cfg) {
  cfg = cfg || {};
  const achaRot = v => { const o = ops.find(x => x[0] === v); return o ? o[1] : v; };
  if (RETOMANDO && R[campo] != null) { euDisse(achaRot(R[campo]), campo); return Promise.resolve(R[campo]); }
  RETOMANDO = false;
  return new Promise(resolve => {
    const cx = document.createElement('div');
    cx.className = 'ops';
    const cls = classesOps(ops, cfg.largos);
    cx.innerHTML = ops.map(([v, t, s], i) => `<button class="op ${cls[i]} ${cfg.destaque === v ? 'ouro' : ''}" data-v="${esc(v)}">${t}${s ? `<small>${s}</small>` : ''}</button>`).join('');
    fio().appendChild(cx); aoFim();
    cx.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      cx.remove();
      R[campo] = v;
      if (ORDEM.indexOf(campo) < 0) ORDEM.push(campo);
      abrirGrupo();
      euDisse(achaRot(v), campo);
      PASSO++; progresso(); salvar();
      resolve(v);
    });
  });
}

/* Várias escolhas: marca, e um botão de "pronto". */
function multi(campo, ops, cfg) {
  cfg = cfg || {};
  const rot = arr => arr.map(v => { const o = ops.find(x => x[0] === v); return o ? o[1] : v; }).join(', ') || 'nenhum';
  if (RETOMANDO && Array.isArray(R[campo])) { euDisse(rot(R[campo]), campo); return Promise.resolve(R[campo]); }
  RETOMANDO = false;
  return new Promise(resolve => {
    const sel = [];
    const cx = document.createElement('div');
    cx.className = 'ops';
    const cls = classesOps(ops, cfg.largos);
    cx.innerHTML = ops.map(([v, t, s], i) => `<button class="op ${cls[i]}" data-v="${esc(v)}">${t}${s ? `<small>${s}</small>` : ''}</button>`).join('')
      + `<div class="enviar"><button data-pronto="1" title="Enviar" disabled>➤</button></div>`;
    fio().appendChild(cx); aoFim();
    const btEnv = cx.querySelector('[data-pronto]');
    cx.querySelectorAll('.op, [data-pronto]').forEach(b => b.onclick = () => {
      if (b.dataset.pronto) {
        if (!sel.length && !cfg.podeVazio) return;
        cx.remove();
        R[campo] = sel.slice();
        if (ORDEM.indexOf(campo) < 0) ORDEM.push(campo);
        abrirGrupo();
        euDisse(rot(sel), campo);
        PASSO++; progresso(); salvar();
        resolve(sel.slice());
        return;
      }
      const v = b.dataset.v, i = sel.indexOf(v);
      const ex = cfg.exclusivos || [];
      if (i >= 0) sel.splice(i, 1);
      else if (ex.includes(v)) { sel.length = 0; sel.push(v); }
      else { for (let k = sel.length - 1; k >= 0; k--) if (ex.includes(sel[k])) sel.splice(k, 1); sel.push(v); }
      cx.querySelectorAll('.op').forEach(x => x.classList.toggle('sel', sel.includes(x.dataset.v)));
      btEnv.disabled = !sel.length && !cfg.podeVazio;
    });
  });
}

/* Campo de texto (nome, e-mail, telefone). */
function escrever(campo, cfg) {
  cfg = cfg || {};
  if (RETOMANDO && R[campo]) { euDisse(R[campo], campo); return Promise.resolve(R[campo]); }
  RETOMANDO = false;
  return new Promise(resolve => {
    const cx = document.createElement('div');
    cx.className = 'ops';
    cx.innerHTML = `<input class="campo largo" id="cpo" placeholder="${esc(cfg.dica || '')}" ${cfg.tipo ? 'type="' + cfg.tipo + '"' : ''} ${cfg.modo ? 'inputmode="' + cfg.modo + '"' : ''}>
      <div class="enviar"><button title="Enviar">➤</button></div>`;
    fio().appendChild(cx); aoFim();
    const inp = cx.querySelector('#cpo');
    const enviar = () => {
      const v = (inp.value || '').trim();
      if (!v && !cfg.podeVazio) { inp.focus(); return; }
      cx.remove();
      R[campo] = v;
      if (ORDEM.indexOf(campo) < 0) ORDEM.push(campo);
      abrirGrupo();
      euDisse(v, campo);
      PASSO++; progresso(); salvar();
      resolve(v);
    };
    if (cfg.mascara) inp.oninput = () => { inp.value = cfg.mascara(inp.value); };
    if (cfg.aoDigitar) inp.oninput = () => { if (cfg.mascara) inp.value = cfg.mascara(inp.value); cfg.aoDigitar(inp.value, cx); };
    inp.onkeydown = e => { if (e.key === 'Enter') enviar(); };
    cx.querySelector('.enviar button').onclick = enviar;
    setTimeout(() => inp.focus(), 60);
  });
}

/* Tocar numa resposta refaz a conversa a partir dali: o que veio depois
   dependia dela, então apagar só aquela deixaria o fio incoerente. */
function editarDaqui(campo) {
  const i = ORDEM.indexOf(campo);
  if (i < 0) return;
  ORDEM.slice(i).forEach(c => { delete R[c]; });
  ORDEM = ORDEM.slice(0, i);
  R.visto = { pc: false, rg: false };
  delete R.contato;
  fio().innerHTML = '<div class="dia">hoje</div>';
  PASSO = 0; progresso();
  RETOMANDO = true;
  rodar();
}

const mascTel = v => { const d = String(v || '').replace(/\D/g, '').slice(0, 11); return d.length > 10 ? d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3').replace(/-$/, ''); };

<script>

const FONTE_CURTA = { caixa: 'do caixa', emprestimo: 'de empréstimo', parcelando: 'parcelado com a família', naosei: 'ainda indefinido' };

/* ─── o espelho pelo TETO ───
   A faixa vira um número só, e esse número é o teto: o intervalo diluía a
   sensação de grandeza, e quem responde "R$ 20 a 50 milhões" não se vê no 20.
   Os dois lados saem do MESMO teto, então somam 100% da empresa — o que ele
   tem mais o que ele deve é o valor inteiro do negócio, e a conta fecha. */
function espelhoTopo() {
  const V = VALORES[R.b3faixa] || VALORES[0];
  const teto = V[1] == null ? V[0] : V[1];            // em milhões
  if (solo()) return { minha: teto, pctMeu: 100, pctOutros: 0, outros: 0, teto };
  const P = PARTS[R.b4] || PARTS[0];
  const pctMeu = P[1] >= 100 ? P[0] : P[1];           // "acima de 75%" usa 75
  const pctOutros = 100 - pctMeu;
  return { minha: teto * pctMeu / 100, pctMeu, pctOutros, outros: teto * pctOutros / 100, teto };
}
/* milhões → texto, com uma casa quando ajuda (4,5 milhões, e não "5 milhões") */
function fmtMi2(v) {
  if (v >= 10) return 'R$ ' + Math.round(v).toLocaleString('pt-BR') + ' milhões';
  if (v >= 1) { const n = Math.round(v * 10) / 10; return 'R$ ' + String(n).replace('.', ',') + (n === 1 ? ' milhão' : ' milhões'); }
  return 'R$ ' + Math.round(v * 1000).toLocaleString('pt-BR') + ' mil';
}

/* A conta da família, com os mesmos números que o questionário usa.
   Pelo TETO da faixa, igual ao espelho da empresa: quem marca "até R$ 10 mil"
   precisa de 18 × 10 mil, e não de 18 × um meio-termo que ele não escolheu. */
const PATRIM_TXT = ['Até R$ 1 milhão', 'R$ 1 a 3 milhões', 'R$ 3 a 10 milhões', 'R$ 10 a 30 milhões', 'Acima de R$ 30 milhões', 'Não sei somar'];
const PATRIM_VAL = [1000000, 3000000, 10000000, 30000000, 30000000, null];
const CUSTO_TXT = ['Até R$ 10 mil', 'R$ 10 a 25 mil', 'R$ 25 a 50 mil', 'Acima de R$ 50 mil', 'Não sei somar'];
const CUSTO_VAL = [10000, 25000, 50000, 50000, null];
const MESES_INVENTARIO = 18, TX_SUCESSAO = 0.11;
function contaFamilia() {
  const m = CUSTO_VAL[Number(R.famCusto)] || 0;
  const p = PATRIM_VAL[Number(R.famPatrim)] || 0;
  const sustento = m * MESES_INVENTARIO, sucessao = p * TX_SUCESSAO;
  return { mensal: m, patrim: p, sustento, sucessao, total: sustento + sucessao };
}
const brlv = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');

async function fechar(PN) {
  PN = PN || esc(((R.contato || {}).nome || '').trim().split(/\s+/)[0] || 'você');
  salvar(true);
  await diz('Recebido. O seu diagnóstico já está com a corretora.');
  await diz('E uma coisa que a gente aprendeu em toda sociedade: <b>sucessão nunca é decisão de uma pessoa só.</b>');
  const comp = await pergunta('compartilhar', [['sim', 'Mandar para outro sócio'], ['nao', 'Agora não']], { destaque: 'sim' });
  if (comp === 'sim') await compartilharSocio();

  await diz(`${PN}, falta uma decisão — e ela é sua:`);
  const fim = await pergunta('saida', [
    ['cotacao', 'Quero avaliar um estudo para nós'],
    ['entender', 'Por enquanto, nenhuma das duas faz sentido. Agradeço.']], { destaque: 'cotacao' });

  if (fim === 'cotacao') {
    await diz(`Parabéns, ${PN}. Ótima decisão.`);
    await diz('Gostaria de deixar um telefone ou e-mail para contato? É opcional.');
    const via = await pergunta('cVia', [['zap', 'WhatsApp'], ['email', 'E-mail'], ['pular', 'Prefiro não informar agora']]);
    if (via === 'zap') { await diz('Qual o número, com DDD?'); R.contato.tel = await escrever('cTel', { dica: '(00) 00000-0000', modo: 'tel', mascara: mascTel }); }
    else if (via === 'email') { await diz('Qual o e-mail?'); R.contato.email = await escrever('cEmail', { dica: 'voce@empresa.com.br', tipo: 'email' }); }
    R.saida = 'cotacao'; salvar(true);
    await botoes([['cotacao', 'Informar dados para cotação', 'ouro'], ['pdf', '⬇ Baixar o PDF do diagnóstico']]);
  } else {
    R.saida = 'entender'; salvar(true);
    await diz(`Perfeito, ${PN}, entendemos.`);
    await diz('Como especialistas em proteção, o momento de contratar o seguro é <b>ontem</b> — e se algum dia fizer sentido, conte conosco.');
    await diz('Preparei o material em PDF, caso queira ler com mais calma. Nele tem o link que leva direto ao pedido de cotação, se um dia fizer sentido.');
    await botoes([['pdf', 'Finalizar e baixar o PDF', 'ouro'], ['cotacao', 'Mudei de ideia: quero a cotação']]);
  }
  PASSO = TOTAL_PASSOS; progresso();
  rodape();
}

/* Botões soltos no fio (não são pergunta: não gravam resposta). */
function botoes(lista) {
  const cx = document.createElement('div');
  cx.className = 'ops';
  cx.innerHTML = lista.map(([id, t, cl]) => `<button class="op largo ${cl || ''}" data-id="${id}">${t}</button>`).join('');
  fio().appendChild(cx); aoFim();
  cx.querySelectorAll('.op').forEach(b => b.onclick = () => {
    if (b.dataset.id === 'pdf') { b.id = 'btPdf'; imprimir(); }
    if (b.dataset.id === 'cotacao') irParaCotacao();
  });
  return espera(200);
}

/* Compartilhar com outro sócio, sem sair da conversa. */
function compartilharSocio() {
  return new Promise(resolve => {
    const cx = document.createElement('div');
    cx.className = 'ops';
    cx.innerHTML = `<input class="campo largo" id="socNome" placeholder="Nome do outro sócio">
      <div class="enviar"><button id="socOk" title="Enviar">➤</button></div>`;
    fio().appendChild(cx); aoFim();
    const inp = cx.querySelector('#socNome');
    cx.querySelector('#socOk').onclick = async () => {
      const n = (inp.value || '').trim();
      if (!n) { inp.focus(); return; }
      cx.remove();
      euDisse(n);
      R.compartilhadoCom = (R.compartilhadoCom || []).concat([{ nome: n, em: new Date().toISOString() }]);
      salvar();
      const link = linkPessoal(null);
      const msg = `${n.split(' ')[0]}, respondi um diagnóstico rápido sobre o que acontece com a nossa sociedade se um de nós faltar. São uns 2 minutos e as respostas são suas, ninguém vê a do outro. Queria a sua visão antes de decidirmos:\n${link}`;
      await diz(`Pronto. Copie a mensagem abaixo e mande para ${esc(n.split(' ')[0])} no WhatsApp.`);
      const bx = document.createElement('div');
      bx.className = 'ops';
      bx.innerHTML = `<div class="saiba largo" style="white-space:pre-wrap">${esc(msg)}</div>
        <button class="op largo ouro" id="socCopiar">Copiar a mensagem</button>
        <button class="op largo" id="socZap">Abrir o WhatsApp</button>
        <button class="op largo" id="socFechar">Pronto, mandei</button>`;
      fio().appendChild(bx); aoFim();
      bx.querySelector('#socCopiar').onclick = async () => {
        try { await navigator.clipboard.writeText(msg); bx.querySelector('#socCopiar').textContent = '✓ Copiado'; } catch (e) {}
      };
      bx.querySelector('#socZap').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
      bx.querySelector('#socFechar').onclick = async () => {
        bx.remove();
        await diz(`Ótimo. Quando ${esc(n.split(' ')[0])} responder, a corretora junta as duas visões no mesmo diagnóstico — <b>sem mostrar quem respondeu o quê</b>.`);
        resolve();
      };
    };
    inp.onkeydown = e => { if (e.key === 'Enter') cx.querySelector('#socOk').click(); };
    setTimeout(() => inp.focus(), 60);
  });
}

/* ═══════════════ CONSULTA DE CNPJ ═══════════════ (igual à do questionário) */
async function _fetchJson(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); return { status: r.status, json: r.ok ? await r.json() : null }; }
  catch (e) { return { status: 0, json: null }; } finally { clearTimeout(t); }
}
async function _cnpjConsulta(d) {
  const fontes = [
    ['brasilapi', 'https://brasilapi.com.br/api/cnpj/v1/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['minhareceita', 'https://minhareceita.org/' + d, j => ({ razao: j.razao_social, fantasia: j.nome_fantasia, cidade: j.municipio, uf: j.uf })],
    ['cnpjws', 'https://publica.cnpj.ws/cnpj/' + d, j => ({ razao: j.razao_social, fantasia: j.estabelecimento && j.estabelecimento.nome_fantasia, cidade: j.estabelecimento && j.estabelecimento.cidade && j.estabelecimento.cidade.nome, uf: j.estabelecimento && j.estabelecimento.estado && j.estabelecimento.estado.sigla })]
  ];
  // As três fontes são consultadas AO MESMO TEMPO: a primeira resposta válida vence.
  // (Em série, com 9s de espera cada, duas fontes fora do ar travavam a tela por ~20s.)
  let motivo = 'offline', inexistente = false;
  const tentativa = ([nome, url, norm]) => _fetchJson(url).then(async r => {
    if (r.status === 429) { motivo = 'limite'; await espera(1200); r = await _fetchJson(url); }
    if (r.status === 404 || r.status === 400) { inexistente = true; throw new Error('inexistente'); }
    if (r.json && r.json.razao_social) return Object.assign({ ok: true, fonte: nome }, norm(r.json));
    throw new Error('vazio');
  });
  try {
    const corrida = fontes.map(tentativa);
    // Promise.any não existe em navegadores antigos — o mesmo efeito, à mão.
    const vencedor = await new Promise((resolve, reject) => {
      let faltam = corrida.length;
      corrida.forEach(pr => pr.then(resolve, () => { if (--faltam === 0) reject(new Error('todas falharam')); }));
    });
    if (vencedor) return vencedor;
  } catch (e) { if (inexistente) return { ok: false, motivo: 'inexistente' }; }
  return { ok: false, motivo };
}

function diagnostico() {
  const e = espelho(); const out = [];
  const add = (cond, t, res) => { if (cond && out.length < 3) out.push({ t, res }); };
  const FONTE = { emprestimo: 'de empréstimo ou da venda de algum ativo', parcelando: 'de parcelas com a família, por anos', naosei: 'de onde, ainda não está definido' };
  add(R.b6 && R.b6 !== 'caixa', `A sua parte vale ${e ? faixaTxt(e.parte[0], e.parte[1]) : 'um valor alto'} e, pela lei, é paga em dinheiro em 90 dias. Pelo que você respondeu, esse dinheiro sairia ${FONTE[R.b6]}.`, 'Pessoa Chave');
  add(R.b6 === 'caixa', 'A empresa tem o dinheiro — parado, esperando um evento que pode não acontecer. É capital que não vira máquina, estoque nem aquisição.', 'Pessoa Chave');
  const cf = contaFamilia();
  add(cf.total > 0, `No mês seguinte, a sua família precisaria de cerca de ${brlv(cf.total)} — sustento durante o inventário mais o custo de transmitir o patrimônio.`, 'Resgatável');
  add((R.testePC || []).includes('herdeiro'), 'Você marcou que quer evitar um herdeiro dentro da sociedade. Isso se resolve com dinheiro para comprar a parte dele, e com uma cláusula no contrato.', 'Pessoa Chave + advogado');
  if (!out.length) out.push({ t: 'Sua sociedade está mais organizada que o comum. O que falta é a fonte do dinheiro no dia.', res: 'Pessoa Chave' });
  return out;
}

/* ═══ PDF do diagnóstico ═══
   Desenhado em vetor com o jsPDF: texto de verdade (dá para copiar e buscar),
   arquivo pequeno e baixa direto, sem passar pela caixa de impressão.
   Se a biblioteca não carregar, cai no documento HTML + window.print(). */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js';
function _nomeArquivo() {
  const c = R.contato || {};
  const emp = (LINK && LINK.empresaNome) || Q.empresa || '';
  const quem = (c.nome && c.nome.trim().split(/\s+/)[0]) || (emp ? emp.trim().split(/\s+/).slice(0, 2).join(' ') : '');
  return ((quem ? quem + ' - ' : '') + 'Diagnóstico de sucessão').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ').trim() + '.pdf';
}
function carregarJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(true);
  return new Promise(ok => {
    let fim = false; const pronto = v => { if (!fim) { fim = true; ok(v); } };
    const t = document.createElement('script');
    t.src = JSPDF_URL;
    t.onload = () => pronto(!!(window.jspdf && window.jspdf.jsPDF));
    t.onerror = () => pronto(false);
    document.head.appendChild(t);
    setTimeout(() => pronto(!!(window.jspdf && window.jspdf.jsPDF)), 12000);
  });
}

function _desenharPDF() {
  const D = _dadosPDF();
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const W = 210, H = 297, M = 17, L = W - M * 2;
  const C = { bg: [10, 16, 32], ouro: [227, 179, 65], txt: [231, 237, 249], sub: [159, 176, 203],
              ciano: [76, 201, 240], card: [19, 27, 50], linha: [40, 52, 84], pe: [132, 148, 173] };
  const mm = (pt, lh) => pt * 0.3528 * (lh || 1.35);
  let y = 0, pag = 0;
  const fonte = (peso, tam, cor) => { doc.setFont('helvetica', peso); doc.setFontSize(tam); doc.setTextColor(cor[0], cor[1], cor[2]); };
  const quebra = (t, tam, larg) => { doc.setFontSize(tam); return doc.splitTextToSize(String(t), larg); };

  function folha() {
    if (pag) doc.addPage();
    pag++;
    doc.setFillColor(C.bg[0], C.bg[1], C.bg[2]); doc.rect(-1, -1, W + 2, H + 2, 'F');
    fonte('normal', 7.5, [109, 125, 150]); doc.text(pag + ' / 4', W - M, H - 11, { align: 'right' });
    y = 21;
  }
  function pe() {
    const t = quebra(D.hoje + ' · protocolo ' + D.prot + '. ' + D.rodape, 6.8, L);
    let yy = H - 17 - t.length * mm(6.8, 1.45);
    doc.setDrawColor(C.linha[0], C.linha[1], C.linha[2]); doc.setLineWidth(0.2); doc.line(M, yy, W - M, yy);
    fonte('normal', 6.8, C.pe);
    t.forEach(l => { yy += mm(6.8, 1.45); doc.text(l, M, yy); });
  }
  function texto(t, o) {
    o = o || {};
    const tam = o.tam || 10, larg = o.larg || L, x = o.x || M;
    fonte(o.peso || 'normal', tam, o.cor || C.txt);
    quebra(t, tam, larg).forEach(l => { y += mm(tam, o.lh || 1.4); doc.text(l, x, y); });
    if (o.depois) y += o.depois;
  }
  function rotulo(t) {
    fonte('bold', 7.6, C.ouro);
    doc.text(String(t).toUpperCase(), M, y, { charSpace: 0.45 });
    y += 2.8;
    doc.setDrawColor(96, 78, 34); doc.setLineWidth(0.3); doc.line(M, y, W - M, y);
    y += 7;
  }
  function caixa(tit, corpo, cor) {
    const pad = 4.6, xIn = M + pad + 1.4, larg = L - pad * 2 - 1.4;
    const lt = quebra(tit, 10.2, larg), lc = corpo ? quebra(corpo, 8.4, larg) : [];
    const h = pad * 2 + lt.length * mm(10.2, 1.3) + (lc.length ? 1.6 + lc.length * mm(8.4, 1.4) : 0);
    doc.setFillColor(C.card[0], C.card[1], C.card[2]);
    doc.setDrawColor(C.linha[0], C.linha[1], C.linha[2]); doc.setLineWidth(0.2);
    doc.roundedRect(M, y, L, h, 2.2, 2.2, 'FD');
    doc.setFillColor(cor[0], cor[1], cor[2]); doc.rect(M, y + 1.1, 1.4, h - 2.2, 'F');
    let yy = y + pad;
    fonte('bold', 10.2, C.txt); lt.forEach(l => { yy += mm(10.2, 1.3); doc.text(l, xIn, yy); });
    if (lc.length) { yy += 1.6; fonte('normal', 8.4, C.sub); lc.forEach(l => { yy += mm(8.4, 1.4); doc.text(l, xIn, yy); }); }
    y += h + 3.4;
  }
  function hero(rot, num, corpo) {
    const pad = 6, larg = L - pad * 2;
    const ln = quebra(num, 21, larg), lc = quebra(corpo, 8.6, larg);
    const h = pad * 2 + 3.6 + ln.length * mm(21, 1.18) + 2 + lc.length * mm(8.6, 1.45);
    doc.setFillColor(28, 25, 23); doc.setDrawColor(126, 99, 40); doc.setLineWidth(0.4);
    doc.roundedRect(M, y, L, h, 3, 3, 'FD');
    let yy = y + pad + 1;
    fonte('bold', 7.4, C.ouro); doc.text(String(rot).toUpperCase(), M + pad, yy, { charSpace: 0.4 });
    yy += 2.6;
    fonte('bold', 21, C.ouro); ln.forEach(l => { yy += mm(21, 1.18); doc.text(l, M + pad, yy); });
    yy += 2;
    fonte('normal', 8.6, C.sub); lc.forEach(l => { yy += mm(8.6, 1.45); doc.text(l, M + pad, yy); });
    y += h + 6;
  }
  function cartao(tp, nome, desc, itens, corTp) {
    const pad = 5.4, larg = L - pad * 2;
    const ld = quebra(desc, 8.8, larg);
    const li = itens.map(t => quebra(t, 8.2, larg - 5));
    const h = pad * 2 + 3.4 + mm(14, 1.2) + 1.6 + ld.length * mm(8.8, 1.45) + 2 + li.reduce((s, l) => s + l.length * mm(8.2, 1.42) + 1.1, 0);
    doc.setFillColor(C.card[0], C.card[1], C.card[2]);
    doc.setDrawColor(C.linha[0], C.linha[1], C.linha[2]); doc.setLineWidth(0.2);
    doc.roundedRect(M, y, L, h, 2.8, 2.8, 'FD');
    let yy = y + pad + 0.6;
    fonte('bold', 7.4, corTp); doc.text(String(tp).toUpperCase(), M + pad, yy, { charSpace: 0.4 });
    yy += 1.4;
    fonte('bold', 14, C.txt); yy += mm(14, 1.2); doc.text(nome, M + pad, yy);
    yy += 1.6;
    fonte('normal', 8.8, [195, 207, 228]); ld.forEach(l => { yy += mm(8.8, 1.45); doc.text(l, M + pad, yy); });
    yy += 2;
    li.forEach(ls => {
      doc.setFillColor(corTp[0], corTp[1], corTp[2]); doc.circle(M + pad + 1.1, yy + mm(8.2, 1.42) - 1, 0.5, 'F');
      fonte('normal', 8.2, C.sub);
      ls.forEach(l => { yy += mm(8.2, 1.42); doc.text(l, M + pad + 4, yy); });
      yy += 1.1;
    });
    y += h + 4;
  }
  function destaque(txt, cor, fundo) {
    const pad = 5, larg = L - pad * 2;
    const ls = quebra(txt, 8.8, larg);
    const h = pad * 2 + ls.length * mm(8.8, 1.5);
    doc.setFillColor(fundo[0], fundo[1], fundo[2]); doc.setDrawColor(cor[0], cor[1], cor[2]); doc.setLineWidth(0.3);
    doc.roundedRect(M, y, L, h, 2.6, 2.6, 'FD');
    let yy = y + pad - 0.6;
    fonte('normal', 8.8, [219, 230, 251]); ls.forEach(l => { yy += mm(8.8, 1.5); doc.text(l, M + pad, yy); });
    y += h + 4;
  }

  /* ── folha 1 · capa ── */
  folha();
  fonte('bold', 7.6, C.ouro);
  doc.text((CONFIG.marca + ' · Diagnóstico de sucessão').toUpperCase(), M, y, { charSpace: 0.5 });
  y += 4.5;
  doc.setFillColor(C.ouro[0], C.ouro[1], C.ouro[2]); doc.rect(M, y, 14, 0.7, 'F');
  y += 10;
  fonte('bold', 25, C.txt); y += mm(25, 1.2); doc.text('O que acontece com a empresa', M, y);
  fonte('bold', 25, C.ouro); y += mm(25, 1.2); doc.text('se um sócio faltar amanhã.', M, y);
  y += 5;
  texto((D.emp ? D.emp + ' · ' : '') + (D.c.nome ? 'preparado a partir das respostas de ' + D.c.nome + '.' : 'preparado a partir das suas respostas.') +
    ' Este documento é seu. Guarde e releia quando quiser — o link do fim continua funcionando.',
    { tam: 10.5, cor: C.sub, larg: L - 12, depois: 9 });
  if (D.e) hero('A conta que sai das suas respostas',
    (solo() ? 'A empresa vale ' : 'A sua parte vale ') + faixaTxt(D.e.parte[0], D.e.parte[1]),
    solo() ? 'É o que a sua família teria a receber — e o que travaria até a partilha.'
      : 'É o valor que a sua família teria a receber da empresa — ou que a empresa teria a pagar, se o sócio que faltasse fosse outro. O contrato social define em quantas parcelas e em quanto tempo.');
  else hero('O que as suas respostas mostram', String(D.b[0].t).replace(/<[^>]+>/g, ''), 'Onde isso se resolve: ' + D.b[0].res + '.');
  y = Math.max(y + 16, 196);
  fonte('bold', 7.4, C.pe); doc.text('NESTE DOCUMENTO', M, y, { charSpace: 0.45 });
  y += 2.6; doc.setDrawColor(C.linha[0], C.linha[1], C.linha[2]); doc.setLineWidth(0.2); doc.line(M, y, W - M, y); y += 5;
  D.indice.forEach((t, i) => {
    fonte('bold', 8.5, C.ouro); doc.text(String(i + 1), M, y + 3.4);
    fonte('normal', 9.6, [195, 207, 228]); doc.text(t, M + 6, y + 3.4);
    y += 6.6;
  });
  pe();

  /* ── folha 2 · respostas + leitura ── */
  folha();
  if (D.resp.length) {
    rotulo('O que você respondeu');
    D.resp.forEach(([k, v]) => {
      const lk = quebra(k, 8.6, L * 0.54), lv = quebra(v, 8.6, L * 0.42);
      const n = Math.max(lk.length, lv.length), passo = mm(8.6, 1.4);
      fonte('normal', 8.6, C.sub); lk.forEach((l, i) => doc.text(l, M, y + 1.4 + (i + 1) * passo));
      fonte('bold', 8.6, C.txt); lv.forEach((l, i) => doc.text(l, W - M, y + 1.4 + (i + 1) * passo, { align: 'right' }));
      y += n * passo + 3.4;
      doc.setDrawColor(C.linha[0], C.linha[1], C.linha[2]); doc.setLineWidth(0.15); doc.line(M, y, W - M, y);
    });
    y += 9;
  }
  rotulo('O que as suas respostas mostram');
  D.b.forEach(x => caixa(String(x.t).replace(/<[^>]+>/g, ''), 'Onde isso se resolve: ' + x.res, C.ciano));

  /* ── folha 3 · as duas proteções ── */
  folha();
  rotulo('As duas proteções que só uma empresa pode contratar');
  cartao('A empresa recebe', 'Pessoa Chave',
    'Se um sócio faltar, o dinheiro entra no caixa da empresa — para pagar a parte dele à família e a sociedade seguir com quem ficou.',
    D.pcItens, C.ciano);
  cartao('A família recebe', 'Resgatável Único',
    'A empresa paga uma vez. Se o sócio faltar, a família recebe direto — sem imposto de renda e fora do inventário.',
    D.rgItens, C.ouro);
  destaque('No Resgatável, aos ' + D.ex.a + ' anos, cada R$ 1.000 que a empresa paga, uma única vez, viram R$ ' + (D.ex.r * 10).toLocaleString('pt-BR') +
    ' para a família se ele faltar. E se um dia a empresa mudar de ideia, R$ 900 voltam em 12 meses e R$ 990 em 5 anos — antes do IR, que só existe se houver resgate. A indenização por morte é isenta. Valores da versão com questionário de saúde, só a cobertura de morte; a sua cotação sai por sócio, com os nomes e as idades reais.',
    [40, 110, 140], [14, 26, 46]);

  /* ── folha 4 · urgência + retomada ── */
  folha();
  rotulo('Por que isso não espera');
  D.porque.forEach(([t, c]) => caixa(t, c, C.ouro));
  y += 4;
  const seg = quebra('Abra o link abaixo no celular ou no computador. As suas respostas estão guardadas — você continua da tela em que estava, sem refazer nada.', 8.8, L - 12);
  const lurl = quebra(D.url, 8, L - 12);
  const hSeg = 12 + mm(12.5, 1.25) + seg.length * mm(8.8, 1.45) + 3 + lurl.length * mm(8, 1.4) + 3 + mm(7.6, 1.4);
  doc.setFillColor(12, 26, 42); doc.setDrawColor(C.ciano[0], C.ciano[1], C.ciano[2]); doc.setLineWidth(0.4);
  doc.roundedRect(M, y, L, hSeg, 3, 3, 'FD');
  let yy = y + 5;
  fonte('bold', 12.5, C.ciano); yy += mm(12.5, 1.25); doc.text('Quer seguir de onde parou?', M + 6, yy);
  fonte('normal', 8.8, [219, 230, 251]); seg.forEach(l => { yy += mm(8.8, 1.45); doc.text(l, M + 6, yy); });
  yy += 3;
  fonte('bold', 8, [143, 215, 245]); lurl.forEach(l => { yy += mm(8, 1.4); doc.text(l, M + 6, yy); });
  yy += 3;
  fonte('normal', 7.6, C.sub); yy += mm(7.6, 1.4);
  doc.text('Protocolo ' + D.prot + ' · se preferir, fale com a corretora e informe este número.', M + 6, yy);
  y += hSeg + 6;
  /* o caminho curto: quem já decidiu não precisa reler a conversa inteira */
  const cot = quebra(D.urlCot, 8, L - 12);
  const hCot = 11 + mm(10.5, 1.25) + cot.length * mm(8, 1.4);
  doc.setFillColor(28, 22, 6); doc.setDrawColor(C.ouro[0], C.ouro[1], C.ouro[2]); doc.setLineWidth(0.4);
  doc.roundedRect(M, y, L, hCot, 3, 3, 'FD');
  let yc = y + 5;
  fonte('bold', 10.5, C.ouro); yc += mm(10.5, 1.25); doc.text('Pedir a cotação direto, sem passar pela conversa:', M + 6, yc);
  fonte('bold', 8, [247, 216, 140]); cot.forEach(l => { yc += mm(8, 1.4); doc.text(l, M + 6, yc); });
  y += hCot + 8;
  doc.setFillColor(C.ouro[0], C.ouro[1], C.ouro[2]); doc.rect(M, y, 1.2, 16, 'F');
  texto('Nada aqui precisa ser decidido hoje. O que não dá para adiar é saber a conta — e ela agora está escrita, com os seus números. Quando quiser ver quanto custa resolver, é o mesmo link.',
    { tam: 10, cor: C.sub, x: M + 6, larg: L - 6 });
  pe();
  return doc;
}
async function imprimir(ev) {
  const bt = el('btPdf');
  const rotuloBt = bt ? bt.textContent : '';
  const capa = document.createElement('div');
  capa.id = 'pdfCapa';
  capa.innerHTML = '<div class="roda"></div><div class="t">Montando o seu PDF…</div>' +
    '<div class="s">Quatro páginas com as suas respostas e a conta. Leva alguns segundos.</div>';
  document.body.appendChild(capa);
  if (bt) { bt.disabled = true; bt.textContent = 'Gerando o PDF…'; }
  try {
    if (!await carregarJsPDF()) throw new Error('biblioteca indisponível');
    _desenharPDF().save(_nomeArquivo());
  } catch (e) {
    toastConv('Não consegui gerar o PDF agora. Tente de novo em instantes.');
  } finally {
    if (capa.parentNode) capa.parentNode.removeChild(capa);
    if (bt) { bt.disabled = false; bt.textContent = rotuloBt; }
  }
}
/* plano B: mesmo conteúdo em HTML, impresso pelo navegador */
function imprimirHTML() {
  montarDocumento();
  const alvo = el('imprimir');
  const antes = document.title;
  document.title = _nomeArquivo().replace(/\.pdf$/, '');
  alvo.classList.add('on');
  document.body.classList.add('gerando-pdf');
  window.print();
  setTimeout(() => { alvo.classList.remove('on'); document.body.classList.remove('gerando-pdf'); document.title = antes; }, 600);
}

function montarDocumento() { /* a conversa não tem o documento HTML: o PDF é sempre em vetor */ }
</script>
<script>
/* ═══════════════ PERSISTÊNCIA ═══════════════
   Mesmo documento e mesmos campos da versão tela a tela: o painel, a ficha e
   a proposta continuam lendo tudo sem saber que veio de outro formato. */
async function salvar(final) {
  if (!db || !SESSAO) return;
  try {
    await db.collection('mb_apresentacoes').doc(SESSAO).set({
      produtoId: PRODUTO.id, produtoNome: PRODUTO.nome, arqVersao: ARQ_VERSAO, formato: FORMATO,
      respostas: JSON.parse(JSON.stringify(R)),
      ordemRespostas: ORDEM.slice(),
      passoAp: 'CONVERSA',
      apresentacaoCompleta: !!final,
      cenasVistas: ORDEM.length,
      totalCenas: TOTAL_PASSOS,
      concluiu: !!final,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn('salvar', e); }
}

(async function boot() {
  const params = new URLSearchParams(location.search);
  TOKEN = params.get('t');
  GRUPO = TOKEN || params.get('g');
  try { if (!GRUPO) GRUPO = sessionStorage.getItem('grupo_vsc'); } catch (e) {}
  if (!GRUPO) GRUPO = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let meuResp = null;
  try { sessionStorage.setItem('grupo_vsc', GRUPO); meuResp = sessionStorage.getItem('resp_vsc_' + GRUPO); } catch (e) {}
  RESPID = meuResp || params.get('r') || ('r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  try { sessionStorage.setItem('resp_vsc_' + GRUPO, RESPID); } catch (e) {}
  SESSAO = 'vidasocios_' + GRUPO + '_' + RESPID;

  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (fbOk) {
    try {
      await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      const base = { produtoId: PRODUTO.id, origem: 'conversa', formato: FORMATO, token: TOKEN || null,
        grupo: GRUPO, respId: RESPID, userAgent: navigator.userAgent.slice(0, 180),
        atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };
      if (TOKEN) {
        let snap = await db.collection('mb_links_apresentacao').where('token', '==', TOKEN).limit(1).get();
        if (snap.empty) snap = await db.collection('mb_links_empresa').where('token', '==', TOKEN).limit(1).get();
        if (!snap.empty) { LINK = snap.docs[0].data();
          Object.assign(base, { empresaId: LINK.empresaId || null, empresaNome: LINK.empresaNome || null,
            agenciaId: LINK.agenciaId || null, geradoPorUid: LINK.geradoPorUid || LINK.criadoPorUid || null });
          Q.empresa = LINK.empresaNome || null; }
      }
      const doc = await db.collection('mb_apresentacoes').doc(SESSAO).get();
      if (!doc.exists) base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
      else {
        const d = doc.data() || {};
        if (d.respostas && !d.concluiu) {
          Object.assign(R, d.respostas);
          ORDEM = Array.isArray(d.ordemRespostas) ? d.ordemRespostas.slice() : [];
          RETOMANDO = ORDEM.length > 0;
        }
      }
      await db.collection('mb_apresentacoes').doc(SESSAO).set(base, { merge: true });
    } catch (e) { console.warn('firebase', e); db = null; }
  }
  if (!db) { const d = document.createElement('div'); d.className = 'demo'; d.textContent = 'modo demonstração · respostas não são salvas'; document.body.appendChild(d); }
  if (Q.empresa) el('nomeTopo').textContent = CONFIG.marca;
  console.log('%cVida Sócios · conversa v' + ARQ_VERSAO, 'background:#38bdf8;color:#031127;padding:2px 8px;border-radius:4px;font-weight:700');
  if (RETOMANDO) {
    const av = document.createElement('div');
    av.className = 'bolha eles destaque';
    av.innerHTML = 'Bem-vindo de volta — a conversa continua de onde você parou. <span style="opacity:.7">(toque em qualquer resposta sua para mudá-la)</span>';
    fio().appendChild(av);
  }
  rodar();
})();
</script>
