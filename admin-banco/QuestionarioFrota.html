<script>
/* ══════════════════════════════════════════════════════════════════
   LEVANTAMENTO — SEGURO DE FROTA v1 (QuestionarioFrota.html)
   Detalhista, mas sem digitar à toa: o cliente informa o crucial (empresa,
   seguro atual, questionário da frota = QAR do cotador, coberturas padrão)
