<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua proposta de seguro — Retorno Seguros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--brand:#0088aa;--brand-dark:#006b87;--brand-50:#e6f6fa;--ok:#16a34a;--warn:#d97706;
  --bg:#f4f7fb;--surface:#fff;--surface-2:#f8fafc;--text:#0f1e2e;--text-2:#5b6b7c;--text-3:#93a1b0;--border:#e4eaf1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
.topo{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:26px 20px 60px}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.topo .marca{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.topo .marca .m{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.topo h1{font-size:1.55rem;letter-spacing:-.02em;margin-bottom:5px}
.topo p{opacity:.9;font-size:.95rem}
.corpo{margin-top:-42px;padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 22px;margin-bottom:18px;
  box-shadow:0 4px 18px rgba(16,32,48,.07)}
.card h2{font-size:1.05rem;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.card h2 i{color:var(--brand)}
.card .ajuda{font-size:.85rem;color:var(--text-2);margin-bottom:14px}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.dados .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3)}
.dados .v{font-weight:600}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px}
.op{border:1px solid var(--border);border-radius:16px;padding:18px;position:relative;transition:.15s;cursor:pointer;background:var(--surface)}
.op:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,32,48,.11)}
.op.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.op .cia{font-weight:700;font-size:1.05rem}
.op .prod{font-size:.76rem;color:var(--text-3);min-height:16px}
.op .val{font-size:1.75rem;font-weight:800;margin:12px 0 2px;letter-spacing:-.02em}
.op .par{font-size:.85rem;color:var(--text-2)}
.op .fr{font-size:.8rem;color:var(--text-2);margin-top:11px;padding-top:11px;border-top:1px dashed var(--border)}
.selo{position:absolute;top:-11px;right:14px;background:var(--ok);color:#fff;font-size:.68rem;font-weight:700;
  padding:4px 10px;border-radius:20px;letter-spacing:.03em}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:11px 10px;text-align:center}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:600}
.tbl thead th{background:var(--surface-2);font-size:.8rem;color:var(--text-2);position:sticky;top:0}
.tbl tr.total td{background:var(--brand-50);font-weight:800;font-size:1rem}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sim{color:var(--ok)} .nao{color:var(--text-3)}
.mini{font-size:.73rem;color:var(--text-3);font-weight:400}
.obs{background:var(--brand-50);border-radius:14px;padding:15px 18px;font-size:.93rem}
.acoes{display:flex;gap:11px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;
  padding:12px 20px;font-size:.92rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-p{background:var(--brand);color:#fff} .btn-p:hover{background:var(--brand-dark)}
.btn-w{background:#25d366;color:#fff}
.btn-g{background:var(--surface);color:var(--text-2);border-color:var(--border)}
.rodape{text-align:center;color:var(--text-3);font-size:.8rem;padding:24px 18px 40px}
.carregando{text-align:center;padding:70px 20px;color:var(--text-2)}
.carregando i{font-size:2rem;color:var(--brand);margin-bottom:14px}
@media(max-width:640px){.topo h1{font-size:1.25rem}.op .val{font-size:1.5rem}}
@media print{.topo{background:var(--brand)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .acoes,.rodape .imp{display:none}}
</style>
</head>
<body>

<div class="topo"><div class="wrap">
  <div class="marca"><div class="m"><i class="fas fa-shield-halved"></i></div>
    <div><b style="font-size:1.05rem">Retorno Seguros</b>
      <div style="font-size:.78rem;opacity:.85">Corretora de seguros · (54) 99701-5000</div></div></div>
  <h1 id="tTitulo">Sua proposta de seguro</h1>
  <p id="tSub">Carregando…</p>
</div></div>

<div class="wrap corpo" id="raiz">
  <div class="card"><div class="carregando"><i class="fas fa-spinner fa-spin"></i>
    <div>Abrindo sua proposta…</div></div></div>
</div>

<div class="rodape">
  Retorno Seguros — este comparativo tem caráter informativo e não representa a apólice.<br>
  A contratação depende da análise e aceitação da seguradora.
  <div class="imp" style="margin-top:8px"><a href="#" onclick="window.print();return false" style="color:var(--brand)">imprimir / salvar em PDF</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",
  authDomain: "retorno-seguros.firebaseapp.com",
  projectId: "retorno-seguros",
  storageBucket: "retorno-seguros.firebasestorage.app",
  messagingSenderId: "495712392972",
  appId: "1:495712392972:web:e1e78aedc48bdeea48db29"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const moeda=n=>n==null?'—':(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dataBR=s=>{ if(!s) return '—'; const d=new Date(s+'T12:00:00'); return isNaN(d)?s:d.toLocaleDateString('pt-BR'); };
const CORES={porto:'#00539f',azul:'#0091d5',hdi:'#00963f',bradesco:'#cc092f',tokio:'#c8102e',yelum:'#e4002b',manual:'#5b6b7c'};
const ROTULOS={casco:'Casco (colisão, incêndio, roubo e furto)',carta:'Carta verde (Mercosul)',
  rcf_dm:'Danos materiais a terceiros',rcf_dc:'Danos corporais a terceiros',rcf_dme:'Danos morais e estéticos',
  app_m:'Acidentes pessoais — morte',app_i:'Acidentes pessoais — invalidez',app_dmho:'Despesas médicas hospitalares',
  app:'Acidentes pessoais de passageiros',vidros:'Vidros, faróis, lanternas e retrovisores',
  farois:'Faróis, lanternas e retrovisores',assist:'Assistência 24 horas',reserva:'Carro reserva',
  roda:'Roda, pneu e suspensão',reparos:'Pequenos reparos / martelinho',parachoque:'Troca de para-choque',
  buracos:'Proteção contra buracos',defesa:'Custos de defesa',extras:'Despesas extraordinárias',outros:'Outras coberturas'};
const ORDEM=Object.keys(ROTULOS);
function lmiTexto(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return v>0?moeda(v):null;
  const s=String(v).trim();
  if(/^(0|0,00|0\.00|R\$ ?0,00|—|-)$/.test(s)) return null;
  if(/^100[.,]00\s*%$/.test(s)||/^100\s*%$/.test(s)) return '100% da tabela FIPE';
  const us=s.match(/^U\$?S?\$?\s*([\d.,]+)$/);
  if(us){ let t=us[1]; let n;
    if(/,\d{3}/.test(t)||/\.\d{2}$/.test(t)) n=parseFloat(t.replace(/,/g,''));
    else n=parseFloat(t.replace(/\./g,'').replace(',','.'));
    if(!isNaN(n)) return 'US$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  const n=parseFloat(s.replace(/\./g,'').replace(',','.'));
  if(!isNaN(n)&&!/[a-zA-Z]/.test(s)) return n>0?moeda(n):null;
  return s;
}
let ORC=null, SEL=0;

const params=new URLSearchParams(location.search);
const ID=params.get('id');

(async()=>{
  if(!ID){ erro('Link incompleto. Peça para a corretora enviar o link de novo.'); return; }
  try{ await firebase.auth().signInAnonymously(); }catch(e){}
  try{
    const d=await db.collection('orcamentos').doc(ID).get();
    if(!d.exists){ erro('Esta proposta não está mais disponível. Fale com a gente que reenviamos.'); return; }
    ORC=d.data();
    render();
  }catch(e){ erro('Não consegui abrir a proposta agora. Tente de novo em instantes.'); }
})();

function erro(msg){
  document.getElementById('tSub').textContent='';
  document.getElementById('raiz').innerHTML=`<div class="card"><div class="carregando">
    <i class="fas fa-circle-exclamation" style="color:var(--warn)"></i><div>${esc(msg)}</div>
    <div style="margin-top:16px"><a class="btn btn-w" href="https://wa.me/5554997015000" style="text-decoration:none">
      <i class="fab fa-whatsapp"></i> Falar com a corretora</a></div></div></div>`;
}

function render(){
  const c=ORC.cliente||{}, v=ORC.veiculo||{}, ps=ORC.propostas||[];
  const nome=(c.nome||'').split(' ')[0];
  document.getElementById('tTitulo').textContent=nome?('Olá, '+capitalizar(nome)+'!'):'Sua proposta de seguro';
  document.getElementById('tSub').textContent=
    'Comparei '+ps.length+' opção(ões) para o seu '+([v.marca,v.modelo].filter(Boolean).join(' ')||'veículo')+'. Escolha com calma.';

  const barato=ps.reduce((a,b,i)=>((b.premioTotal||1e9)<(ps[a].premioTotal||1e9)?i:a),0);
  SEL=barato;

  let h='';
  /* dados do veículo */
  h+=`<div class="card"><h2><i class="fas fa-car"></i> O que está sendo segurado</h2>
    <div class="dados">
      ${dado('Veículo',[v.marca,v.modelo].filter(Boolean).join(' '))}
      ${dado('Ano',v.anoFab&&v.anoMod&&v.anoFab!==v.anoMod?v.anoFab+'/'+v.anoMod:(v.anoMod||v.anoFab))}
      ${dado('Placa',v.placa)}
      ${dado('Segurado',c.nome)}
      ${dado('Vigência',ps[0]&&ps[0].vigenciaIni?dataBR(ps[0].vigenciaIni)+' a '+dataBR(ps[0].vigenciaFim):null)}
      ${dado('Proposta válida até',ORC.validade?dataBR(ORC.validade):null)}
    </div></div>`;

  /* cards das opções */
  h+=`<div class="card"><h2><i class="fas fa-hand-pointer"></i> As opções</h2>
    <div class="ajuda">Toque em uma opção para destacá-la no quadro de coberturas mais abaixo.</div>
    <div class="ops">${ps.map((p,i)=>{
      const cor=CORES[p.cia]||CORES.manual;
      const u=(p.parcelas||[]).length?p.parcelas[p.parcelas.length-1]:null;
      return `<div class="op ${i===SEL?'sel':''}" id="op${i}" onclick="selecionar(${i})" style="border-top:4px solid ${cor}">
        ${i===barato?'<span class="selo">menor preço</span>':''}
        <div class="cia" style="color:${cor}">${esc(p.seguradora)}</div>
        <div class="prod">${esc(p.produto||'')}</div>
        <div class="val" style="color:${cor}">${moeda(p.premioTotal)}</div>
        <div class="par">${u?'ou '+u.n+'x de '+moeda(u.valor):'à vista'}</div>
        <div class="fr"><b>Franquia</b> ${p.franquia&&p.franquia.valor?moeda(p.franquia.valor):'—'}
          ${p.franquia&&p.franquia.tipo?'<span class="mini">('+esc(p.franquia.tipo)+')</span>':''}</div>
      </div>`;}).join('')}</div></div>`;

  /* comparativo */
  h+=`<div class="card"><h2><i class="fas fa-table-columns"></i> O que cada uma cobre</h2>
    <div class="ajuda">O ✓ mostra que a cobertura existe e o valor ao lado é o limite máximo de indenização.</div>
    <div class="rolar"><table class="tbl"><thead><tr><th style="min-width:180px">Cobertura</th>
      ${ps.map((p,i)=>`<th id="th${i}" style="border-top:3px solid ${CORES[p.cia]||CORES.manual}">${esc(p.seguradora)}</th>`).join('')}
    </tr></thead><tbody>${linhas(ps)}
      <tr><td>Franquia do casco</td>${ps.map(p=>`<td>${p.franquia&&p.franquia.valor?moeda(p.franquia.valor):'—'}</td>`).join('')}</tr>
      ${ORC.mostrarLiquido?`<tr><td>Prêmio líquido</td>${ps.map(p=>`<td>${moeda(p.premioLiquido)}</td>`).join('')}</tr>
        <tr><td>IOF</td>${ps.map(p=>`<td>${moeda(p.iof)}</td>`).join('')}</tr>`:''}
      <tr class="total"><td>Prêmio total à vista</td>${ps.map(p=>`<td>${moeda(p.premioTotal)}</td>`).join('')}</tr>
      <tr><td>Parcelamento</td>${ps.map(p=>{const u=(p.parcelas||[]).length?p.parcelas[p.parcelas.length-1]:null;
        return `<td>${u?u.n+'x de '+moeda(u.valor):'—'}</td>`;}).join('')}</tr>
    </tbody></table></div></div>`;

  /* franquias por peça da opção escolhida */
  h+=`<div class="card" id="cardFr"></div>`;

  if(ORC.observacoes) h+=`<div class="card"><h2><i class="fas fa-comment-dots"></i> Recomendação da corretora</h2>
    <div class="obs">${esc(ORC.observacoes).replace(/\n/g,'<br>')}
    ${ORC.consultor?`<div style="margin-top:10px;font-size:.85rem;color:var(--text-2)">— ${esc(ORC.consultor)}</div>`:''}</div></div>`;

  h+=`<div class="card"><h2><i class="fas fa-circle-check"></i> Gostou de alguma?</h2>
    <div class="ajuda">É só mandar mensagem que eu cuido do resto: emissão, vistoria e a apólice na sua mão.</div>
    <div class="acoes">
      <a class="btn btn-w" id="btnWa" href="#" target="_blank"><i class="fab fa-whatsapp"></i> Quero esta opção</a>
      <button class="btn btn-g" onclick="window.print()"><i class="fas fa-print"></i> Salvar em PDF</button>
    </div></div>`;

  document.getElementById('raiz').innerHTML=h;
  selecionar(SEL);
}
function capitalizar(s){ return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
function dado(k,v){ return `<div><div class="k">${esc(k)}</div><div class="v">${v?esc(v):'—'}</div></div>`; }
function linhas(ps){
  const chaves=[];
  ps.forEach(p=>(p.coberturas||[]).forEach(c=>{ if(!chaves.includes(c.chave)) chaves.push(c.chave); }));
  chaves.sort((a,b)=>ORDEM.indexOf(a)-ORDEM.indexOf(b));
  let out='';
  chaves.forEach(k=>{
    const cel=ps.map(p=>{
      const cs=(p.coberturas||[]).filter(c=>c.chave===k&&c.contratada!==false);
      if(!cs.length) return null;
      const c=cs.reduce((a,b)=>((b.premio||0)>(a.premio||0)?b:a));
      return {lmi:c.lmi,franquia:c.franquia,detalhe:c.detalhe};
    });
    if(!cel.some(Boolean)) return;
    out+=`<tr><td>${esc(ROTULOS[k]||k)}</td>`+cel.map(c=>{
      if(!c) return `<td class="nao"><i class="fas fa-xmark"></i><div class="mini">não tem</div></td>`;
      const lmi=lmiTexto(c.lmi)||'';
      return `<td><i class="fas fa-check sim"></i>
        ${lmi?`<div style="font-weight:600;font-size:.85rem">${esc(lmi)}</div>`:'<div class="mini">incluída</div>'}
        ${c.franquia!=null?`<div class="mini">franquia ${typeof c.franquia==='number'?moeda(c.franquia):esc(c.franquia)}</div>`:''}
        ${c.detalhe?`<div class="mini">${esc(c.detalhe)}</div>`:''}</td>`;
    }).join('')+'</tr>';
  });
  return out;
}
function selecionar(i){
  SEL=i;
  (ORC.propostas||[]).forEach((p,j)=>{
    const el=document.getElementById('op'+j); if(el) el.classList.toggle('sel',i===j);
    const th=document.getElementById('th'+j); if(th) th.style.background=(i===j?'var(--brand-50)':'');
  });
  const p=ORC.propostas[i]||{};
  const fr=document.getElementById('cardFr');
  if(fr){
    const lista=p.franquiasDetalhe||[];
    fr.style.display=lista.length?'':'none';
    if(lista.length) fr.innerHTML=`<h2><i class="fas fa-screwdriver-wrench"></i> Franquias por peça — ${esc(p.seguradora)}</h2>
      <div class="ajuda">Quanto você paga quando o conserto é só daquela peça, sem mexer na franquia principal.</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${lista.map(f=>
        `<span style="background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font-size:.83rem">
          ${esc(f.item)} <b>${moeda(f.valor)}</b></span>`).join('')}</div>`;
  }
  const wa=document.getElementById('btnWa');
  if(wa){
    const cor=(ORC.corretora&&ORC.corretora.whats)||'5554997015000';
    const t='Oi! Vi o comparativo e quero seguir com a opção da '+(p.seguradora||'')+' ('+moeda(p.premioTotal)+').';
    wa.href='https://wa.me/'+cor+'?text='+encodeURIComponent(t);
  }
}
</script>
</body>
</html>
