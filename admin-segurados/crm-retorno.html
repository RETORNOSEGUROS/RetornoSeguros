async function agSalvar(){
  const id=document.getElementById('agId').value;
  const titulo=document.getElementById('agTitulo').value.trim();
  const data=document.getElementById('agData').value;
  const hora=document.getElementById('agHora').value||null;
  const horaFim=document.getElementById('agHoraFim').value||null;
  const resp=[...document.querySelectorAll('.agResp:checked')].map(c=>c.value);
  if(!titulo){ toast('Escreva o que precisa ser feito.','err'); return; }
  if(!data){ toast('Escolha a data.','err'); return; }
  if(horaFim&&hora&&horaFim<hora){ toast('A hora final é antes da inicial.','err'); return; }
  const v=document.getElementById('agVinculo').value;
  let vinculo=null;
  if(v){ const p=v.split('|'); vinculo={tipo:p[0],id:p[1],nome:p.slice(2).join('|')}; }
  const dados={ titulo, data, hora, horaFim,
    tipo:document.getElementById('agTipo').value,
    prioridade:document.getElementById('agPrior').value,
    responsaveis:resp, responsaveisNomes:resp.map(agNomeDe),
    descricao:document.getElementById('agDesc').value.trim()||null,
    vinculo, atualizadoEm:FV.serverTimestamp(), atualizadoPor:agEuEmail()||'admin' };
  const btn=document.getElementById('agSalvar'); btn.disabled=true;
  try{
    if(id){ await db.collection('agenda_crm').doc(id).update(dados); toast('Ação atualizada.','ok'); }
    else{ dados.status='aberta'; dados.origem=dados.origem||'manual';
      dados.criadoPor=agEuEmail()||'admin'; dados.criadoEm=FV.serverTimestamp();
      await db.collection('agenda_crm').add(dados);
      toast('Ação criada para '+agDataCurta(data)+(hora?' às '+hora:'')+'.','ok','Agendado'); }
    closeModal();
    AG.dia=data; const d=agS2D(data); AG.mes=d.getMonth()+1; AG.ano=d.getFullYear();
    if((location.hash||'').slice(1)==='agenda') VIEWS.agenda();
  }catch(e){ console.error(e); toast('Erro ao salvar a ação.','err'); btn.disabled=false; }
}

/* =========================================================================
   SUGESTÕES — o CRM olha o que já existe e propõe ações
   ========================================================================= */
function agSugestoesLista(){
  const hoje=agHoje(), sug=[];
  const jaTem=chave=>AGENDA.some(t=>t.sugestaoChave===chave&&t.status!=='cancelada');

  (CACHE.movimentacoes||[]).filter(m=>m.status==='pendente').forEach(m=>{
    const dias=m.criadoEm&&m.criadoEm.toDate?Math.round((new Date()-m.criadoEm.toDate())/86400000):0;
    if(dias<2) return;
    const k='mov:'+m.id; if(jaTem(k)) return;
    sug.push({chave:k,tipo:'movimentacao',prioridade:dias>5?'alta':'normal',
      titulo:'Movimentar '+(m.nome||'beneficiário')+' no portal da seguradora',
      descricao:(m.tipo==='inclusao'?'Inclusão':'Exclusão')+' de '+(m.empresaNome||'')+' parada há '+dias+' dias aguardando aprovação.',

let AG_FIXAS=[];
let __agGerou=false;
const AG_PERIOD={
  semanal:{l:'Toda semana',dias:7},
  quinzenal:{l:'A cada 15 dias',dias:14},
  mensal:{l:'Todo mês',meses:1},
  bimestral:{l:'A cada 2 meses',meses:2},

};

};
const DOW_NOME=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

/* ---------- feriados nacionais ---------- */
function agPascoa(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
        m=Math.floor((a+11*h+22*l)/451),
        mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(y,mes-1,dia);
}
const __agFer={};
function agFeriados(ano){
  if(__agFer[ano]) return __agFer[ano];
  const p=agPascoa(ano), mais=n=>agD2S(new Date(p.getFullYear(),p.getMonth(),p.getDate()+n));
  const set=new Set([ano+'-01-01',ano+'-04-21',ano+'-05-01',ano+'-09-07',
    ano+'-10-12',ano+'-11-02',ano+'-11-15',ano+'-11-20',ano+'-12-25',
    mais(-48),mais(-47),mais(-2),mais(60)]);   // carnaval, sexta santa, corpus christi
  __agFer[ano]=set; return set;
}
function agEhDiaUtil(d,comFeriado){
  const dw=d.getDay();
  if(dw===0||dw===6) return false;
  if(comFeriado!==false&&agFeriados(d.getFullYear()).has(agD2S(d))) return false;
  return true;
}
function agAjustaDiaUtil(s,ajuste,comFeriado){
  if(ajuste==='manter') return s;
  let d=agS2D(s); if(!d) return s;
  const passo=ajuste==='depois'?1:-1;
  let g=0;
  while(!agEhDiaUtil(d,comFeriado)&&g++<20) d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+passo);
  return agD2S(d);
}
/* explica por que a data mudou */
function agPorqueMudou(original,final){
  if(original===final) return '';
  const d=agS2D(original), dw=d.getDay();
  if(agFeriados(d.getFullYear()).has(original)) return 'feriado';
  if(dw===0) return 'domingo'; if(dw===6) return 'sábado';
  return 'sem expediente';
}

/* ---------- datas de um modelo dentro de uma janela ---------- */
function agOcorrencias(m,deISO,ateISO){
  const de=agS2D(deISO), ate=agS2D(ateISO), out=[];
  if(!de||!ate) return out;
  const per=AG_PERIOD[m.periodicidade]||AG_PERIOD.mensal;
  if(per.dias){
    let base=agS2D(m.dataBase)||new Date(de);
    while(base<de) base=new Date(base.getFullYear(),base.getMonth(),base.getDate()+per.dias);
    for(let d=new Date(base); d<=ate; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+per.dias)) out.push(agD2S(d));
  }else{
    const passo=per.meses;
    const ini=(m.mesInicial||agD2S(de).slice(0,7)).split('-').map(Number);
    const p=n=>String(n).padStart(2,'0');
    let y=de.getFullYear(), mo=de.getMonth()+1;
    for(let k=0;k<40;k++){
      const diff=(y-ini[0])*12+(mo-ini[1]);
      if(diff>=0&&diff%passo===0){
        const ult=new Date(y,mo,0).getDate();
        const s=y+'-'+p(mo)+'-'+p(Math.min(Number(m.diaDoMes)||1,ult));
        const d=agS2D(s);
        if(d>=de&&d<=ate) out.push(s);
      }
      mo++; if(mo>12){mo=1;y++;}
      if(new Date(y,mo-1,1)>ate) break;
    }
  }
  const fim=m.ate||null;
  return out.map(s=>({original:s,data:agAjustaDiaUtil(s,m.ajuste||'antes',m.feriados)}))
            .filter(x=>!fim||x.data<=fim);
}
/* cria as ocorrências que faltam nos próximos 90 dias */
async function agGerarRecorrentes(force){
  if(!AG_FIXAS.length) return;
  if(__agGerou&&!force) return;
  __agGerou=true;
  const hoje=agHoje();
  const d=agS2D(hoje); const ate=agD2S(new Date(d.getFullYear(),d.getMonth(),d.getDate()+90));
  const novos=[];
  AG_FIXAS.filter(m=>m.ativo!==false).forEach(m=>{
    agOcorrencias(m,hoje,ate).forEach(oc=>{
      if(oc.data<hoje) return;
      const existe=AGENDA.some(t=>t.modeloId===m.id&&t.data===oc.data);
      if(!existe) novos.push({m,oc});
    });
  });
  if(!novos.length) return;
  try{
    const eu=agEuEmail()||'admin';
    const lote=db.batch();
    novos.slice(0,200).forEach(({m,oc})=>{
      lote.set(db.collection('agenda_crm').doc(),{
        titulo:m.titulo, descricao:m.descricao||null,
        data:oc.data, dataOriginal:oc.original!==oc.data?oc.original:null,
        hora:m.hora||null, horaFim:m.horaFim||null,
        tipo:m.tipo||'outro', prioridade:m.prioridade||'normal',
        responsaveis:m.responsaveis||[eu], responsaveisNomes:(m.responsaveis||[eu]).map(agNomeDe),
        vinculo:m.vinculo||null, modeloId:m.id, origem:'recorrente',
        status:'aberta', criadoPor:m.criadoPor||eu,
        criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp()});
    });
    await lote.commit();
    console.log('[agenda] '+novos.length+' ocorrência(s) recorrentes criadas');
  }catch(e){ console.error('gerar recorrentes',e); __agGerou=false; }
}

          ${Object.entries(AG_TIPOS).map(([k,v])=>`<option value="${k}" ${(m.tipo||'outro')===k?'selected':''}>${v.l}</option>`).join('')}</select></div>
        <div class="form-row"><label>Prioridade</label><select id="afPrior">
          ${Object.entries(AG_PRIOR).map(([k,v])=>`<option value="${k}" ${(m.prioridade||'normal')===k?'selected':''}>${v}</option>`).join('')}</select></div>
      </div>
      <div class="form-row"><label>Responsáveis</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">
          ${eq.length?eq.map(f=>{const v=f.email||f.nome;
            return `<label style="display:flex;align-items:center;gap:7px;padding:7px 12px;border:1.5px solid ${resp.includes(v)?'var(--brand)':'var(--border-2)'};
              border-radius:20px;cursor:pointer;font-size:.83rem;background:${resp.includes(v)?'var(--brand-50)':'var(--surface)'}">
              <input type="checkbox" class="afResp" value="${esc(v)}" ${resp.includes(v)?'checked':''} style="width:auto;margin:0">
              ${avatar(v)} ${esc(f.nome||v)}</label>`;}).join('')
            :'<span style="font-size:.83rem;color:var(--text-3)">Cadastre a equipe em Funcionários para poder delegar.</span>'}
        </div></div>
      <div class="form-row"><label>Observações</label>
        <textarea id="afDesc" rows="2" placeholder="Detalhes que ajudam na hora de executar...">${esc(m.descricao||'')}</textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-row"><label>Repetir até (opcional)</label><input type="date" id="afAte" value="${esc(m.ate||'')}">
          <div style="font-size:.73rem;color:var(--text-3);margin-top:4px">Vazio = para sempre.</div></div>
        <div class="form-row"><label>Status</label><select id="afAtivo">
          <option value="1" ${m.ativo!==false?'selected':''}>Ativa</option>
          <option value="0" ${m.ativo===false?'selected':''}>Pausada</option></select></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="agModalRecorrentes()">Voltar</button>
      <button class="btn btn-primary" onclick="agSalvarFixa()"><i class="fas fa-floppy-disk"></i> ${id?'Salvar':'Criar e lançar na agenda'}</button></div>`,'wide');
  agTogglePer();
}
function agTogglePer(){
  const per=document.getElementById('afPer').value;
  const semanal=!!(AG_PERIOD[per]||{}).dias;
  document.getElementById('afBoxDia').style.display=semanal?'none':'block';
  document.getElementById('afBoxBase').style.display=semanal?'block':'none';
  document.getElementById('afBoxMesIni').style.display=(!semanal&&per!=='mensal')?'block':'none';
  if(semanal){ const b=document.getElementById('afBase').value; const d=agS2D(b);
    const el=document.getElementById('afDiaSemana');
    if(el&&d) el.textContent='Cai '+(per==='semanal'?'toda ':'a cada 15 dias, ')+DOW_NOME[d.getDay()].toLowerCase()+'.'; }
  agPreviewFixa();
}
function agPreviewFixa(){
  const el=document.getElementById('afPreview'); if(!el) return;
  const m=agLerFixa(); if(!m.titulo) m.titulo='(ação)';
  const hoje=agHoje();
  const ocs=agOcorrencias(m,hoje,agD2S(new Date(new Date().getFullYear()+2,new Date().getMonth(),1))).slice(0,4);
  if(!ocs.length){ el.innerHTML='<i class="fas fa-circle-info"></i> Sem datas na janela dos próximos meses — confira a periodicidade.'; return; }
  el.innerHTML='<b><i class="fas fa-calendar-check"></i> Próximas datas:</b> '+ocs.map(o=>
    agDataCurta(o.data)+(o.original!==o.data?` <span style="color:var(--warn)">(era ${agDataCurta(o.original)}, ${agPorqueMudou(o.original,o.data)})</span>`:'')
  ).join(' · ');
}
function agLerFixa(){
  const g=i=>document.getElementById(i);
  const per=g('afPer').value;
  return { titulo:g('afTitulo').value.trim(), periodicidade:per,
    diaDoMes:parseInt(g('afDia').value)||1, dataBase:g('afBase').value||null,
    mesInicial:g('afMesIni').value||null,
    ajuste:g('afAjuste').value, feriados:g('afFeriados').checked,
    hora:g('afHora').value||null, tipo:g('afTipo').value, prioridade:g('afPrior').value,
    descricao:g('afDesc').value.trim()||null, ate:g('afAte').value||null,
    ativo:g('afAtivo').value==='1',
    responsaveis:[...document.querySelectorAll('.afResp:checked')].map(c=>c.value) };
}
async function agSalvarFixa(){
  const id=document.getElementById('afId').value;
  const m=agLerFixa();
  if(!m.titulo){ toast('Escreva o que precisa ser feito.','err'); return; }
  m.responsaveisNomes=m.responsaveis.map(agNomeDe);
  m.atualizadoEm=FV.serverTimestamp();
  try{
    if(id) await db.collection('agenda_fixas').doc(id).update(m);
    else { m.criadoPor=agEuEmail()||'admin'; m.criadoEm=FV.serverTimestamp();
      await db.collection('agenda_fixas').add(m); }
    closeModal();
    toast(id?'Recorrência atualizada.':'Recorrência criada — já lancei as próximas datas na agenda.','ok','Pronto');
    setTimeout(()=>agGerarRecorrentes(true),900);
  }catch(e){ console.error(e); toast('Erro ao salvar a recorrência.','err'); }
}
async function agExcluirFixa(id){
  const m=AG_FIXAS.find(x=>x.id===id); if(!m) return;
  const futuras=AGENDA.filter(t=>t.modeloId===id&&t.status!=='concluida'&&t.data>=agHoje());
  if(!confirm('Excluir a recorrência "'+m.titulo+'"?'+
    (futuras.length?'\n\nAs '+futuras.length+' ocorrência(s) futuras ainda não concluídas também serão removidas. O histórico do que já foi feito fica.':''))) return;
  try{
    await db.collection('agenda_fixas').doc(id).delete();
    if(futuras.length){ const lote=db.batch();
      futuras.forEach(t=>lote.delete(db.collection('agenda_crm').doc(t.id)));
      await lote.commit(); }
    toast('Recorrência removida.','info');
  }catch(e){ console.error(e); toast('Erro ao excluir.','err'); }
}

</script>
  <script>
/* =========================================================================
   PAGAMENTOS DA EQUIPE — folha mensal com salário, comissão calculada,
   proventos e descontos.  Coleção: folha_pagamento
   Regra da comissão: negócios com vigência iniciada no mês ANTERIOR entram
   no pagamento do mês corrente (1º dia útil).
   ========================================================================= */
let FOLHA=[];
let PG={ mes:null, ano:null, so:'' };

const pgMoeda=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pgNum=v=>{ if(typeof v==='number') return v; v=String(v||'').trim().replace(/\./g,'').replace(',','.');
  const n=parseFloat(v); return isNaN(n)?0:n; };
const pgComp=(a,m)=>a+'-'+String(m).padStart(2,'0');
function pgMesAnterior(ano,mes){ let m=mes-1,a=ano; if(m<1){m=12;a--;} return {ano:a,mes:m}; }
/* primeiro dia útil do mês (pula sábado e domingo) */
function pgPrimeiroDiaUtil(ano,mes){
  const d=new Date(ano,mes-1,1);
  while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1);
  return d;
}

/* ---------- quem vendeu a apólice ---------- */
function pgVendedorDa(a){
  if(a.responsavelId) return a.responsavelId;
  /* apólices antigas: cai no responsável do lead correspondente */
  const cpf=(a.clienteCpf||'').replace(/\D/g,''), fone=(a.clienteWhatsapp||'').replace(/\D/g,''), nm=(a.clienteNome||'').toLowerCase();
  const l=(CACHE.leads||[]).find(x=>
    (cpf&&(x.cpf||'').replace(/\D/g,'')===cpf) ||
    (fone&&((x.whatsapp||'').replace(/\D/g,'')===fone||(x.telefone||'').replace(/\D/g,'')===fone)) ||
    (nm&&(x.nome||'').toLowerCase()===nm));
  return (l&&l.responsavelId)||null;
}
/* apólices com vigência iniciando no mês de referência */
function pgApolicesDoMes(ano,mes){
  const ini=pgComp(ano,mes);
  return (CACHE.apolices||[]).filter(a=>{
    if(a.status==='cancelada') return false;
    const d=strData(a.dataInicioVigencia)||'';
    return d.slice(0,7)===ini;
  });
}
/* comissão de um funcionário na competência de vigência */
function pgComissaoDe(func,ano,mes){
  const fator=Number(func.comissaoPadrao)||0;
  const aps=pgApolicesDoMes(ano,mes).filter(a=>pgVendedorDa(a)===func.id);
  const itens=aps.map(a=>{
    const premio=Number(a.valorPremio)||0;
    const pct=Number(a.comissao)||0;
    const nossa=Math.round(premio*pct)/100;
    const dele=Math.round(nossa*fator)/100;
    return {a,premio,pct,nossa,dele};
  });
  return { fator, itens,
    premio:Math.round(itens.reduce((s,i)=>s+i.premio,0)*100)/100,
    nossa:Math.round(itens.reduce((s,i)=>s+i.nossa,0)*100)/100,
    valor:Math.round(itens.reduce((s,i)=>s+i.dele,0)*100)/100 };
}
const pgLiquido=r=>Math.round(((Number(r.salarioBase)||0)+(Number(r.comissao)||0)
  +(r.proventos||[]).reduce((s,x)=>s+(Number(x.valor)||0),0)
  -(r.descontos||[]).reduce((s,x)=>s+(Number(x.valor)||0),0))*100)/100;

/* =========================================================================
   TELA
   ========================================================================= */
VIEWS.pagamentos=function(){
  const hoje=new Date();
  if(PG.mes===null){ PG.mes=hoje.getMonth()+1; PG.ano=hoje.getFullYear(); }
  const ano=Number(PG.ano), mes=Number(PG.mes);
  const comp=pgComp(ano,mes);
  const ref=pgMesAnterior(ano,mes);
  const diaUtil=pgPrimeiroDiaUtil(ano,mes);
  const equipe=(CACHE.admins||[]).filter(f=>f.ativo!==false).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const daComp=FOLHA.filter(r=>r.competencia===comp);
  const porFunc={}; daComp.forEach(r=>porFunc[r.funcionarioId]=r);

  /* linhas: registro salvo, ou uma prévia calculada na hora */
  const linhas=equipe.map(f=>{
    const salvo=porFunc[f.id];
    const c=pgComissaoDe(f,ref.ano,ref.mes);
    if(salvo) return {...salvo,__func:f,__calc:c,__salvo:true};
    return {id:null,competencia:comp,funcionarioId:f.id,funcionarioNome:f.nome||f.email,
      salarioBase:Number(f.salarioBase)||0,comissao:c.valor,proventos:[],descontos:[],
      status:'previsto',__func:f,__calc:c,__salvo:false};
  });
  const tot=linhas.reduce((s,r)=>s+pgLiquido(r),0);
  const totBase=linhas.reduce((s,r)=>s+(Number(r.salarioBase)||0),0);
  const totCom=linhas.reduce((s,r)=>s+(Number(r.comissao)||0),0);
  const totDesc=linhas.reduce((s,r)=>s+(r.descontos||[]).reduce((x,d)=>x+(Number(d.valor)||0),0),0);
  const pagos=linhas.filter(r=>r.status==='pago').length;
  window.__pgExport={linhas,comp,ref};

  const actions=`<button class="btn btn-primary btn-sm" onclick="pgGerar()"><i class="fas fa-wand-magic-sparkles"></i> Gerar folha do mês</button>`;
  let html=head('pagamentos',{actions});

  html+=`<div class="card" style="padding:14px 16px"><div class="filters" style="margin:0">
    <select onchange="PG.mes=+this.value;VIEWS.pagamentos()">
      ${MESES_BR.map((m,i)=>`<option value="${i+1}" ${mes===i+1?'selected':''}>${m}</option>`).join('')}</select>
    <input type="number" min="2000" max="2100" value="${ano}" onchange="PG.ano=+this.value;VIEWS.pagamentos()" style="width:110px">
    <span style="font-size:.85rem;color:var(--text-2)">
      <i class="fas fa-calendar-check" style="color:var(--brand)"></i>
      Pagar em <b>${diaUtil.toLocaleDateString('pt-BR')}</b> (1º dia útil) · comissão sobre a vigência de
      <b>${MESES_BR[ref.mes-1]}/${ref.ano}</b></span>
    <button class="btn btn-ghost btn-sm" onclick="pgExportar()"><i class="fas fa-download"></i> CSV</button>
  </div></div>`;

  html+=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <div class="kpi"><div class="ico i-brand"><i class="fas fa-sack-dollar"></i></div><div class="val" style="font-size:1.35rem">${pgMoeda(tot)}</div><div class="lbl">Total a pagar</div></div>
    <div class="kpi"><div class="ico i-info"><i class="fas fa-money-bill"></i></div><div class="val" style="font-size:1.35rem">${pgMoeda(totBase)}</div><div class="lbl">Salários base</div></div>
    <div class="kpi"><div class="ico i-ok"><i class="fas fa-hand-holding-dollar"></i></div><div class="val" style="font-size:1.35rem">${pgMoeda(totCom)}</div><div class="lbl">Comissões</div></div>
    <div class="kpi"><div class="ico i-warn"><i class="fas fa-arrow-down"></i></div><div class="val" style="font-size:1.35rem">${pgMoeda(totDesc)}</div><div class="lbl">Descontos</div></div>
    <div class="kpi"><div class="ico i-purple"><i class="fas fa-circle-check"></i></div><div class="val">${pagos}/${linhas.length}</div><div class="lbl">Já pagos</div></div>
  </div>`;

  if(!equipe.length) return setView(html+`<div class="card"><div class="empty"><div class="em-ic"><i class="fas fa-user-tie"></i></div>
    <h4>Nenhum funcionário ativo</h4><p>Cadastre a equipe em Funcionários para montar a folha.</p></div></div>`);

  html+=`<div class="card"><div class="card-head">
      <h3><i class="fas fa-money-check-dollar"></i> Folha de ${MESES_BR[mes-1]}/${ano}</h3>
      <span style="font-size:.8rem;color:var(--text-3)">${daComp.length?daComp.length+' lançamento(s) salvos':'nada salvo ainda — os valores abaixo são a prévia calculada'}</span></div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Funcionário</th><th style="text-align:right">Salário</th><th style="text-align:right">Comissão</th>
      <th style="text-align:right">Proventos</th><th style="text-align:right">Descontos</th>
      <th style="text-align:right">Líquido</th><th>Pagamento</th><th>Situação</th><th style="text-align:right">Ações</th>
    </tr></thead><tbody>
    ${linhas.map(r=>{
      const prov=(r.proventos||[]).reduce((s,x)=>s+(Number(x.valor)||0),0);
      const desc=(r.descontos||[]).reduce((s,x)=>s+(Number(x.valor)||0),0);
      const f=r.__func, c=r.__calc;
      const pix=f.pix?`${esc(f.pixTipo||'PIX')}: ${esc(f.pix)}`:(f.banco?`${esc(f.banco)} ${esc(f.agencia||'')}/${esc(f.conta||'')}`:'<span style="color:var(--danger)">sem dados</span>');
      return `<tr>
        <td><b>${esc(r.funcionarioNome)}</b><div style="font-size:.73rem;color:var(--text-3)">${esc(f.cargo||'')}</div></td>
        <td style="text-align:right">${pgMoeda(r.salarioBase)}</td>
        <td style="text-align:right">${pgMoeda(r.comissao)}
          ${c.itens.length?`<div style="font-size:.71rem;color:var(--text-3);cursor:pointer" onclick="pgDetalheComissao('${f.id}')">
            <u>${c.itens.length} negócio(s) · ${c.fator}%</u></div>`
            :'<div style="font-size:.71rem;color:var(--text-3)">sem vendas no mês</div>'}</td>
        <td style="text-align:right">${prov?pgMoeda(prov):'<span style="color:var(--text-3)">—</span>'}</td>
        <td style="text-align:right">${desc?'<span style="color:var(--danger)">'+pgMoeda(desc)+'</span>':'<span style="color:var(--text-3)">—</span>'}</td>
        <td style="text-align:right"><b style="font-size:.95rem">${pgMoeda(pgLiquido(r))}</b></td>
        <td style="font-size:.78rem;color:var(--text-2)">${pix}</td>
        <td>${r.status==='pago'
          ? `<span class="badge" style="background:var(--ok-bg);color:var(--ok)"><i class="fas fa-check"></i> Pago${r.pagoEmData?' '+fmtData(r.pagoEmData):''}</span>`
          : r.__salvo?'<span class="badge" style="background:var(--warn-bg);color:var(--warn)">Em aberto</span>'
                     :'<span class="badge" style="background:var(--surface-3);color:var(--text-3)">Prévia</span>'}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-ghost btn-sm" title="Editar lançamento" onclick="pgModal('${f.id}')"><i class="fas fa-pen"></i></button>
          ${r.status!=='pago'?`<button class="btn btn-ghost btn-sm" style="color:var(--ok)" title="Marcar como pago" onclick="pgMarcarPago('${f.id}')"><i class="fas fa-check"></i></button>`
            :`<button class="btn btn-ghost btn-sm" title="Desfazer pagamento" onclick="pgDesfazer('${f.id}')"><i class="fas fa-rotate-left"></i></button>`}
        </td></tr>`;}).join('')}
      <tr style="background:var(--surface-2)"><td style="font-weight:700">Total</td>
        <td style="text-align:right;font-weight:700">${pgMoeda(totBase)}</td>
        <td style="text-align:right;font-weight:700">${pgMoeda(totCom)}</td>
        <td style="text-align:right;font-weight:700">${pgMoeda(linhas.reduce((s,r)=>s+(r.proventos||[]).reduce((x,p)=>x+(Number(p.valor)||0),0),0))}</td>
        <td style="text-align:right;font-weight:700;color:var(--danger)">${pgMoeda(totDesc)}</td>
        <td style="text-align:right;font-weight:800;color:var(--brand-dark)">${pgMoeda(tot)}</td>
        <td colspan="3"></td></tr>
    </tbody></table></div>
    <div style="margin-top:12px;font-size:.78rem;color:var(--text-3)"><i class="fas fa-circle-info"></i>
      A comissão soma as apólices com <b>início de vigência em ${MESES_BR[ref.mes-1]}/${ref.ano}</b>:
      prêmio líquido × comissão da apólice × fator do funcionário. Enquanto a folha não é salva, os números são só uma prévia.</div>
  </div>`;

  /* quem ficou sem atribuição */
  const semDono=pgApolicesDoMes(ref.ano,ref.mes).filter(a=>!pgVendedorDa(a));
  if(semDono.length) html+=`<div class="card" style="border-color:#f6dfae;background:var(--warn-bg)">
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <i class="fas fa-triangle-exclamation" style="color:var(--warn);font-size:1.1rem;margin-top:2px"></i>
      <div style="flex:1;min-width:260px;font-size:.86rem;color:#92400e">
        <b>${semDono.length} apólice(s) de ${MESES_BR[ref.mes-1]} sem vendedor definido</b> — elas não entraram na comissão de ninguém.
        <div style="margin-top:6px;font-size:.82rem">${semDono.slice(0,6).map(a=>esc(a.clienteNome||a.numeroApolice||'—')).join(' · ')}${semDono.length>6?' e mais '+(semDono.length-6):''}</div>
        <div style="margin-top:6px;font-size:.8rem">Abra a apólice e escolha o responsável para incluir na próxima folha.</div>
      </div></div></div>`;
  setView(html);
};

/* ---------- gerar / salvar ---------- */
async function pgGerar(){
  const ano=Number(PG.ano), mes=Number(PG.mes), comp=pgComp(ano,mes);
  const ref=pgMesAnterior(ano,mes);
  const equipe=(CACHE.admins||[]).filter(f=>f.ativo!==false);
  if(!equipe.length){ toast('Cadastre a equipe primeiro.','info'); return; }
  const jaTem=FOLHA.filter(r=>r.competencia===comp);
  const pagosTravados=jaTem.filter(r=>r.status==='pago').length;
  if(jaTem.length&&!confirm('Já existem '+jaTem.length+' lançamento(s) em '+MESES_BR[mes-1]+'/'+ano+
    (pagosTravados?' ('+pagosTravados+' já pago(s), que não serão tocados)':'')+
    '.\n\nRecalcular salário e comissão dos que ainda estão em aberto?')) return;
  try{
    const lote=db.batch(); let n=0;
    equipe.forEach(f=>{
      const existente=jaTem.find(r=>r.funcionarioId===f.id);
      if(existente&&existente.status==='pago') return;
      const c=pgComissaoDe(f,ref.ano,ref.mes);
      const base={competencia:comp, funcionarioId:f.id, funcionarioNome:f.nome||f.email,
        salarioBase:Number(f.salarioBase)||0, comissao:c.valor,
        comissaoDetalhe:{fator:c.fator,premio:c.premio,nossa:c.nossa,qtd:c.itens.length,
          mesRef:pgComp(ref.ano,ref.mes)},
        status:'aberto', atualizadoEm:FV.serverTimestamp()};
      if(existente){ lote.update(db.collection('folha_pagamento').doc(existente.id),base); }
      else { lote.set(db.collection('folha_pagamento').doc(),
        {...base, proventos:[], descontos:[], criadoEm:FV.serverTimestamp(), criadoPor:(CURRENT_USER&&CURRENT_USER.email)||'admin'}); }
      n++;
    });
    await lote.commit();
    toast('Folha de '+MESES_BR[mes-1]+' gerada para '+n+' funcionário(s).','ok','Pronto');
  }catch(e){ console.error(e); toast('Erro ao gerar a folha.','err'); }
}
function pgRegistro(funcId){
  const comp=pgComp(Number(PG.ano),Number(PG.mes));
  return FOLHA.find(r=>r.competencia===comp&&r.funcionarioId===funcId)||null;
}
async function pgGarantir(funcId){
  let r=pgRegistro(funcId);
  if(r) return r;
  const f=(CACHE.admins||[]).find(x=>x.id===funcId); if(!f) return null;
  const ref=pgMesAnterior(Number(PG.ano),Number(PG.mes));
  const c=pgComissaoDe(f,ref.ano,ref.mes);
  const doc=await db.collection('folha_pagamento').add({
    competencia:pgComp(Number(PG.ano),Number(PG.mes)), funcionarioId:f.id, funcionarioNome:f.nome||f.email,
    salarioBase:Number(f.salarioBase)||0, comissao:c.valor,
    comissaoDetalhe:{fator:c.fator,premio:c.premio,nossa:c.nossa,qtd:c.itens.length,mesRef:pgComp(ref.ano,ref.mes)},
    proventos:[], descontos:[], status:'aberto',
    criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp(),
    criadoPor:(CURRENT_USER&&CURRENT_USER.email)||'admin'});
  return {id:doc.id};
}

              <button class="btn btn-ghost btn-sm" style="padding:2px 8px;margin-left:5px" onclick="pgDetalheComissao('${funcId}')">ver negócios</button>`

function pgAdd(cls,descricao){
  const el=document.getElementById(cls==='pgProv'?'pgProvLista':'pgDescLista');
  el.insertAdjacentHTML('beforeend',`<div class="${cls}" style="display:grid;grid-template-columns:1fr 140px auto;gap:10px;align-items:end;margin-bottom:9px">
    <div class="form-row" style="margin:0"><input type="text" class="${cls}D" value="${esc(descricao||'')}" placeholder="Descrição"></div>
    <div class="form-row" style="margin:0"><input type="text" class="${cls}V" value="" placeholder="0,00" oninput="pgRecalc()"></div>
    <button class="btn btn-ghost btn-sm" style="color:var(--danger);margin-bottom:2px" onclick="this.closest('.${cls}').remove();pgRecalc()"><i class="fas fa-trash"></i></button>
  </div>`);
  const ins=el.querySelectorAll('.'+cls+'V'); if(ins.length) ins[ins.length-1].focus();
}
function pgColeta(cls){
  return [...document.querySelectorAll('.'+cls)].map(el=>({
    desc:el.querySelector('.'+cls+'D').value.trim()||'—',
    valor:pgNum(el.querySelector('.'+cls+'V').value)

}
function pgRecalc(){
  const el=document.getElementById('pgLiq'); if(!el) return;

    comissao:pgNum(document.getElementById('pgCom').value),

    comissao:pgNum(document.getElementById('pgCom').value),

    atualizadoEm:FV.serverTimestamp() };
  if(marcarPago){ dados.status='pago'; dados.pagoEm=FV.serverTimestamp();
    dados.pagoEmData=agHoje?agHoje():null; dados.pagoPor=(CURRENT_USER&&CURRENT_USER.email)||'admin'; }

    const r=await pgGarantir(funcId); if(!r) throw new Error('sem registro');
    await db.collection('folha_pagamento').doc(r.id).update(dados);
    closeModal(); toast(marcarPago?'Pagamento registrado.':'Lançamento salvo.','ok');
  }catch(e){ console.error(e); toast('Erro ao salvar o lançamento.','err'); }
}
async function pgMarcarPago(funcId){
  try{
    const r=await pgGarantir(funcId); if(!r) return;
    await db.collection('folha_pagamento').doc(r.id).update({status:'pago',pagoEm:FV.serverTimestamp(),
      pagoEmData:agHoje?agHoje():null, pagoPor:(CURRENT_USER&&CURRENT_USER.email)||'admin', atualizadoEm:FV.serverTimestamp()});

}
async function pgDesfazer(funcId){

  catch(e){ console.error(e); toast('Erro.','err'); }
}

      ${c.itens.length?`<div class="tbl-wrap"><table><thead><tr>

      </tr></thead><tbody>
      ${c.itens.map(i=>`<tr>
        <td><b>${esc(i.a.clienteNome||'-')}</b><div style="font-size:.72rem;color:var(--text-3)">${esc(i.a.numeroApolice||'')}</div></td>
        <td>${esc(i.a.seguradora||'-')}</td>
        <td style="color:var(--text-3)">${fmtData(i.a.dataInicioVigencia)}</td>
        <td style="text-align:right">${pgMoeda(i.premio)}</td>

      <tr style="background:var(--surface-2)"><td colspan="3" style="font-weight:700">Total</td>
        <td style="text-align:right;font-weight:700">${pgMoeda(c.premio)}</td><td></td>
        <td style="text-align:right;font-weight:700">${pgMoeda(c.nossa)}</td>
        <td style="text-align:right;font-weight:800;color:var(--brand-dark)">${pgMoeda(c.valor)}</td></tr>
      </tbody></table></div>`
      :`<div class="empty"><div class="em-ic"><i class="fas fa-inbox"></i></div><h4>Nenhum negócio nesse mês</h4>
        <p>Nenhuma apólice com vigência iniciando em ${MESES_BR[ref.mes-1]}/${ref.ano} está atribuída a ${esc(f.nome||'')}.</p></div>`}
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Fechar</button></div>`,'wide');

function pgExportar(){
  const {linhas,comp}=window.__pgExport||{};
  if(!linhas||!linhas.length){ toast('Nada para exportar.','info'); return; }
  const cel=v=>{v=(v==null?'':String(v));return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['Competencia','Funcionario','Cargo','Salario base','Comissao','Proventos','Descontos','Liquido','PIX','Banco','Agencia','Conta','Situacao'];
  const rows=linhas.map(r=>{const f=r.__func;
    return [comp,r.funcionarioNome,f.cargo||'',r.salarioBase,r.comissao,
      (r.proventos||[]).reduce((s,x)=>s+(Number(x.valor)||0),0),
      (r.descontos||[]).reduce((s,x)=>s+(Number(x.valor)||0),0),
      pgLiquido(r), f.pix||'', f.banco||'', f.agencia||'', f.conta||'',
      r.status==='pago'?'Pago':(r.__salvo?'Em aberto':'Previsto')];});
  const txt='﻿'+[head.join(';')].concat(rows.map(x=>x.map(cel).join(';'))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='folha-'+comp+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV da folha gerado.','ok','Exportado');
}

</script>
  <script>
/* =========================================================================
   CONTATOS — todo mundo que algum dia cotou com a gente
   Junta leads (cada lead = uma cotação), apólices e propostas, agrupando
   por pessoa. Mostra o que já cotou, o que tem conosco e o que falta.
   ========================================================================= */
let CT_F={ busca:'', situacao:'', ramo:'', ordem:'nome', mes:'' };

const ctDig=v=>(v||'').toString().replace(/\D/g,'');
const ctNorm=s=>(s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
/* identificadores fortes de um registro (CPF, telefone, e-mail) */
function ctIds(o){
  const ids=[];
  const cpf=ctDig(o.cpf||o.cnpj||o.clienteCpf||o.cpfCnpj);
  if(cpf.length===11||cpf.length===14) ids.push('cpf:'+cpf);
  [o.whatsapp,o.telefone,o.clienteWhatsapp,o.celular].forEach(f=>{
    const d=ctDig(f); if(d.length>=10) ids.push('fone:'+d.slice(-11)); });
  const mail=ctNorm(o.email||o.clienteEmail);
  if(mail&&mail.includes('@')) ids.push('mail:'+mail);
  return [...new Set(ids)];
}
const ctNome=o=>o.nome||o.clienteNome||o.segurado||o.nomeCompleto||o.nomeEmpresa||'';

/* monta a base unificada de pessoas (une registros que dividem qualquer identificador) */
function ctPessoas(){
  /* 1) junta tudo num só saco de registros */
  const regs=[];
  (CACHE.leads||[]).forEach(l=>regs.push({tipo:'lead',o:l}));
  (CACHE.propostas||[]).forEach(pr=>regs.push({tipo:'proposta',o:pr}));
  (CACHE.apolices||[]).forEach(a=>regs.push({tipo:'apolice',o:a}));
  regs.forEach((r,i)=>{ r.i=i; r.ids=ctIds(r.o); r.nomeN=ctNorm(ctNome(r.o)); });

  /* 2) union-find pelos identificadores fortes */
  const pai=regs.map((_,i)=>i);
  const acha=x=>{ while(pai[x]!==x){ pai[x]=pai[pai[x]]; x=pai[x]; } return x; };
  const une=(a,b)=>{ a=acha(a); b=acha(b); if(a!==b) pai[b]=a; };
  const porId={};
  regs.forEach(r=>r.ids.forEach(id=>{ if(porId[id]!=null) une(porId[id],r.i); else porId[id]=r.i; }));
  /* 3) registros SEM identificador forte: colam pelo nome, se houver um grupo com o mesmo nome */
  const nomeDeGrupo={};
  regs.filter(r=>r.ids.length).forEach(r=>{ const g=acha(r.i); if(r.nomeN&&nomeDeGrupo[r.nomeN]==null) nomeDeGrupo[r.nomeN]=g; });
  regs.filter(r=>!r.ids.length&&r.nomeN).forEach(r=>{
    if(nomeDeGrupo[r.nomeN]!=null) une(nomeDeGrupo[r.nomeN],r.i);
    else nomeDeGrupo[r.nomeN]=acha(r.i);
  });

  /* 4) monta a pessoa de cada grupo */
  const grupos={};
  regs.forEach(r=>{ const g=acha(r.i); (grupos[g]=grupos[g]||[]).push(r); });
  const enriquece=(p,o)=>{
    const nm=ctNome(o);
    if(!p.nome&&nm) p.nome=nm;
    if(!p.nomeEmpresa&&o.nomeEmpresa) p.nomeEmpresa=o.nomeEmpresa;
    if(!p.whatsapp&&(o.whatsapp||o.telefone||o.clienteWhatsapp||o.celular)) p.whatsapp=o.whatsapp||o.telefone||o.clienteWhatsapp||o.celular;
    if(!p.email&&(o.email||o.clienteEmail)) p.email=o.email||o.clienteEmail;
    if(!p.cpf&&(o.cpf||o.cnpj||o.clienteCpf||o.cpfCnpj)) p.cpf=o.cpf||o.cnpj||o.clienteCpf||o.cpfCnpj;
    if(!p.dataNascimento&&o.dataNascimento) p.dataNascimento=strData(o.dataNascimento);
    if(!p.cidade&&o.cidade) p.cidade=o.cidade;
    if(!p.estado&&(o.estado||o.uf)) p.estado=o.estado||o.uf;
  };
  const lista=Object.values(grupos).map(rs=>{
    const p={chave:'g'+acha(rs[0].i),nome:'',nomeEmpresa:'',whatsapp:'',email:'',cpf:'',
      dataNascimento:null,cidade:'',estado:'',cotacoes:[],apolices:[],leadIds:[],primeiro:null,ultimo:null};
    const marca=d=>{ if(!d) return; if(!p.primeiro||d<p.primeiro) p.primeiro=d; if(!p.ultimo||d>p.ultimo) p.ultimo=d; };
    rs.forEach(r=>{
      const o=r.o; enriquece(p,o);
      if(r.tipo==='lead'){
        p.leadIds.push(o.id);
        const d=strData(o.criadoEm)||null;
        const st=o.status==='negocio_fechado'?'fechada':o.status==='negocio_perdido'?'perdida':'aberta';
        p.cotacoes.push({leadId:o.id,data:d,ramo:o.ramo||o.tipoSeguro||'—',valor:Number(o.valorNegociacao)||null,
          status:st,motivo:o.motivoPerda||null,origem:o.origem||null});
        marca(d);
      } else if(r.tipo==='proposta'){
        const d=strData(o.criadoEm)||null;
        p.__props=(p.__props||[]).concat([{d,o}]);
        marca(d);
      } else {
        p.apolices.push(o);
        marca(strData(o.dataInicioVigencia)||strData(o.criadoEm));
      }
    });
    /* proposta só vira "cotação" se não houver um lead do mesmo dia/ramo */
    (p.__props||[]).forEach(({d,o})=>{
      if(p.cotacoes.some(c=>c.leadId&&c.leadId===o.leadId)) return;
      p.cotacoes.push({leadId:o.leadId||null,data:d,ramo:o.ramo||'Auto',
        valor:Number(o.premioLiquido)||null,status:'proposta',seguradora:o.seguradora||null});
    });
    delete p.__props;
    return p;
  }).filter(p=>p.nome||p.nomeEmpresa);

  lista.forEach(p=>{
    p.cotacoes.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    p.ramosCotados=[...new Set(p.cotacoes.map(c=>c.ramo).filter(r=>r&&r!=='—'))];
    p.ramosAtivos=[...new Set(p.apolices.filter(a=>a.status!=='cancelada').map(a=>a.ramo).filter(Boolean))];
    p.ramosFaltando=RAMO_OPCOES.filter(r=>!p.ramosAtivos.includes(r));
    p.temApolice=p.ramosAtivos.length>0;
    p.perdidas=p.cotacoes.filter(c=>c.status==='perdida').length;
    p.abertas=p.cotacoes.filter(c=>c.status==='aberta').length;
    p.premioTotal=p.apolices.filter(a=>a.status!=='cancelada').reduce((s,a)=>s+(Number(a.valorPremio)||0),0);
    p.situacao=p.abertas?'em_negociacao':(p.temApolice?'cliente':(p.perdidas?'perdido':'so_cotou'));
    p.aniversario=p.dataNascimento?String(p.dataNascimento).slice(5,10):null;
  });
  return lista;
}
const CT_SIT={cliente:['Cliente','var(--ok)','var(--ok-bg)'],em_negociacao:['Em negociação','var(--info)','var(--info-bg)'],
  perdido:['Perdido','var(--danger)','var(--danger-bg)'],so_cotou:['Só cotou','var(--text-3)','var(--surface-3)']};
function ctDiasAniv(mmdd){
  if(!mmdd) return null;
  const h=new Date(), [m,d]=mmdd.split('-').map(Number);
  let alvo=new Date(h.getFullYear(),m-1,d);
  alvo.setHours(0,0,0,0);
  const hoje=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  if(alvo<hoje) alvo=new Date(h.getFullYear()+1,m-1,d);
  return Math.round((alvo-hoje)/86400000);
}

VIEWS.contatos=function(){
  let ps=ctPessoas();
  const total=ps.length;
  const clientes=ps.filter(p=>p.situacao==='cliente').length;
  const soCotou=ps.filter(p=>p.situacao==='so_cotou'||p.situacao==='perdido').length;
  const comNasc=ps.filter(p=>p.dataNascimento).length;
  const aniv=ps.filter(p=>p.aniversario).map(p=>({p,dias:ctDiasAniv(p.aniversario)}))
    .filter(x=>x.dias!=null&&x.dias<=30).sort((a,b)=>a.dias-b.dias);

  if(CT_F.situacao) ps=ps.filter(p=>p.situacao===CT_F.situacao);
  if(CT_F.ramo==='__falta') ps=ps.filter(p=>p.ramosFaltando.length&&p.temApolice);
  else if(CT_F.ramo) ps=ps.filter(p=>p.ramosCotados.includes(CT_F.ramo)||p.ramosAtivos.includes(CT_F.ramo));
  if(CT_F.mes) ps=ps.filter(p=>p.aniversario&&p.aniversario.slice(0,2)===CT_F.mes);
  if(CT_F.busca){ const q=ctNorm(CT_F.busca), qn=ctDig(CT_F.busca);
    ps=ps.filter(p=>ctNorm(p.nome+' '+p.nomeEmpresa+' '+(p.cidade||'')).includes(q)
      ||(qn&&(ctDig(p.whatsapp).includes(qn)||ctDig(p.cpf).includes(qn)))
      ||ctNorm(p.email).includes(q)); }
  ps.sort((a,b)=> CT_F.ordem==='recente' ? (b.ultimo||'').localeCompare(a.ultimo||'')
    : CT_F.ordem==='premio' ? (b.premioTotal-a.premioTotal)
    : (a.nome||a.nomeEmpresa||'').localeCompare(b.nome||b.nomeEmpresa||''));
  window.__ctExport=ps;

async function ctNovaCotacao(chave,ramo){
  const p=ctPessoas().find(x=>x.chave===chave); if(!p) return;
  try{
    const ref=await db.collection('leads_crm').add({
      nome:p.nome||p.nomeEmpresa||'', nomeEmpresa:p.nomeEmpresa||null,
      whatsapp:ctDig(p.whatsapp)||null, email:p.email||null, cpf:p.cpf||null,
      dataNascimento:p.dataNascimento||null, cidade:p.cidade||null, estado:p.estado||null,
      ramo, origem:'renovacao', status:'pre_cadastro',
      criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp()});
    closeModal();
    toast('Cotação de '+ramo+' criada para '+(p.nome||'')+'.','ok','Pronto');
    setTimeout(()=>abrirLead(ref.id),400);
  }catch(e){ console.error(e); toast('Erro ao criar a cotação.','err'); }
}
function ctExportar(){
  const ps=window.__ctExport||[];
  if(!ps.length){ toast('Nada para exportar.','info'); return; }
  const cel=v=>{v=(v==null?'':String(v));return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['Nome','Empresa','WhatsApp','E-mail','CPF/CNPJ','Nascimento','Cidade','Situacao','Cotacoes','Ramos cotados','Ramos ativos','Ramos em aberto','Premio total','Ultima interacao'];
  const linhas=ps.map(p=>[p.nome,p.nomeEmpresa,p.whatsapp,p.email,p.cpf,p.dataNascimento?fmtData(p.dataNascimento):'',
    (p.cidade||'')+(p.estado?'/'+p.estado:''),(CT_SIT[p.situacao]||[])[0],p.cotacoes.length,
    p.ramosCotados.join(' + '),p.ramosAtivos.join(' + '),p.ramosFaltando.join(' + '),p.premioTotal,p.ultimo?fmtData(p.ultimo):'']);
  const txt='﻿'+[head.join(';')].concat(linhas.map(x=>x.map(cel).join(';'))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='contatos-retorno.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV com '+ps.length+' contato(s).','ok','Exportado');
}

/* =========================================================================
   LEADS VINDOS DO SITE — coleções leads_cotacao_* que o CRM não lia
   ========================================================================= */
let SITE_LEADS=[];
const SITE_COLS=[['leads_cotacao_auto','Auto'],['leads_cotacao_vida','Vida'],
  ['leads_cotacao_residencial','Residencial'],['leads_cotacao_generica','Outros']];
function ctEscutarSite(){
  ctEscutarCorte();
  SITE_COLS.forEach(([col,ramo])=>{
    try{
      LISTENERS.push(db.collection(col).onSnapshot(sn=>{
        SITE_LEADS=SITE_LEADS.filter(x=>x.__col!==col)
          .concat(sn.docs.map(d=>({id:d.id,__col:col,__ramo:ramo,...d.data()})));
        const r=(location.hash||'').slice(1);
        if(r==='leads'||r==='contatos') VIEWS[r]&&VIEWS[r]();
      },e=>console.warn('site leads '+col,e && e.code)));
    }catch(e){ console.warn('sem acesso a '+col); }
  });
}
/* ---------- corte: só cotações do site a partir de uma data ---------- */
let CT_SITE_CFG={desde:null,ignorados:[],carregado:false};
let CT_SITE_VER_TUDO=false;
let __ctCorteEscrito=false;
function ctEscutarCorte(){
  try{
    LISTENERS.push(db.collection('configuracoes').doc('site_leads').onSnapshot(d=>{
      const v=d.exists?(d.data()||{}):{};
      CT_SITE_CFG={desde:v.desde||null,ignorados:v.ignorados||[],carregado:true};
      const r=(location.hash||'').slice(1);
      if(r==='leads'||r==='contatos') VIEWS[r]&&VIEWS[r]();
    },e=>{ CT_SITE_CFG.carregado=true; console.warn('config site_leads',e&&e.code); }));
  }catch(e){ CT_SITE_CFG.carregado=true; }
}
async function ctDefinirCorte(data){
  try{
    await db.collection('configuracoes').doc('site_leads')
      .set({desde:data,atualizadoEm:FV.serverTimestamp(),
            por:(CURRENT_USER&&CURRENT_USER.email)||'admin'},{merge:true});
    CT_SITE_CFG.desde=data;
    toast('Passando a considerar as cotações do site a partir de '+fmtData(data)+'.','ok');
  }catch(e){ console.error(e); toast('Não consegui salvar a data de corte.','err'); }
}
async function ctIgnorarSite(id){
  const ig=[...new Set((CT_SITE_CFG.ignorados||[]).concat([id]))];
  try{ await db.collection('configuracoes').doc('site_leads').set({ignorados:ig},{merge:true});
    CT_SITE_CFG.ignorados=ig; toast('Cotação dispensada.','info'); }
  catch(e){ console.error(e); toast('Erro ao dispensar.','err'); }
}
/* na primeira vez, corta em hoje sozinho — o histórico de testes fica de fora */
function ctGarantirCorte(){
  if(__ctCorteEscrito||!CT_SITE_CFG.carregado||CT_SITE_CFG.desde) return;
  if(!SITE_LEADS.length) return;
  __ctCorteEscrito=true;
  const hoje=(function(){const d=new Date(),p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());})();
  CT_SITE_CFG.desde=hoje;
  db.collection('configuracoes').doc('site_leads')
    .set({desde:hoje,definidoAutomaticamente:true,atualizadoEm:FV.serverTimestamp()},{merge:true})
    .catch(e=>console.warn('corte',e&&e.code));
}

/* já existe no CRM? (evita importar duas vezes) */
function ctJaImportado(s){
  const fone=ctDig(s.whatsapp||s.telefone||s.celular);
  const mail=ctNorm(s.email);
  return (CACHE.leads||[]).some(l=>
    (l.origemSiteId&&l.origemSiteId===s.id) ||
    (fone&&ctDig(l.whatsapp||l.telefone)===fone) ||
    (mail&&ctNorm(l.email)===mail));
}
function ctPendentesSite(){
  ctGarantirCorte();
  const desde=CT_SITE_CFG.desde;
  const ig=CT_SITE_CFG.ignorados||[];
  return SITE_LEADS.filter(s=>{
    if(ctJaImportado(s)) return false;
    if(ig.includes(s.id)) return false;
    if(!CT_SITE_VER_TUDO&&desde){ const d=strData(s.criadoEm); if(!d||d<desde) return false; }
    return true;
  });
}
function ctAntigasSite(){
  const desde=CT_SITE_CFG.desde; if(!desde) return 0;
  const ig=CT_SITE_CFG.ignorados||[];
  return SITE_LEADS.filter(s=>!ctJaImportado(s)&&!ig.includes(s.id)&&
    (function(){const d=strData(s.criadoEm);return !d||d<desde;})()).length;
}

    </div>

    <div style="font-size:.76rem;color:var(--text-2);margin-top:12px"><i class="fas fa-circle-info"></i>
      Essas cotações estavam gravadas pelas páginas do site e não apareciam no funil. Ao trazer, viram lead com origem "Site".
      O <b>x</b> dispensa uma cotação sem importar — útil para teste antigo que sobrou.</div>
  </div>`;
}
function ctDadosSite(s){
  return { nome:s.nome||s.nomeCompleto||s.segurado||(s.email||'').split('@')[0]||'Contato do site',
    whatsapp:ctDig(s.whatsapp||s.telefone||s.celular)||null, email:s.email||null,
    cpf:s.cpf||s.cnpj||null, cidade:s.cidade||null, estado:s.estado||s.uf||null,
    ramo:s.ramo||s.tipoSeguro||s.__ramo||null, observacoes:s.mensagem||s.observacoes||null,
    origem:'site', origemSiteId:s.id, origemSiteCol:s.__col,
    status:'pre_cadastro', criadoEm:s.criadoEm||FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp() };
}
async function ctImportarUm(i){
  const s=(window.__ctSite||[])[i]; if(!s) return;
  try{ await db.collection('leads_crm').add(ctDadosSite(s));
    toast('Cotação do site trazida para o funil.','ok'); }
  catch(e){ console.error(e); toast('Erro ao importar.','err'); }
}
async function ctImportarTodos(){
  const pend=ctPendentesSite(); if(!pend.length) return;
  if(!confirm('Trazer '+pend.length+' cotação(ões) do site para o funil de leads?')) return;
  try{ const lote=db.batch();
    pend.forEach(s=>lote.set(db.collection('leads_crm').doc(),ctDadosSite(s)));
    await lote.commit();
    toast(pend.length+' cotação(ões) importadas.','ok','Pronto'); }
  catch(e){ console.error(e); toast('Erro ao importar em lote.','err'); }
}

</script>
  <script>
/* =========================================================================
   CONTAS A PAGAR DA CORRETORA
   contas_fixas       -> o cadastro de cada conta (recorrente ou não)
   contas_pagar       -> o lançamento de cada mês (valor, vencimento, baixa)
   Cada lançamento aberto vira uma ação na Agenda no dia do vencimento.
   ========================================================================= */
let CONTAS_FIXAS=[], CONTAS=[];
let CP={ mes:null, ano:null, status:'', cat:'', busca:'', aba:'mes' };

const CP_CATS={
  imposto:{l:'Impostos e taxas',i:'fa-landmark',c:'#dc2626'},
  aluguel:{l:'Aluguel e condomínio',i:'fa-building',c:'#7c3aed'},
  utilidade:{l:'Água, luz, internet',i:'fa-bolt',c:'#d97706'},
  telefone:{l:'Telefone',i:'fa-phone',c:'#0891b2'},
  sistema:{l:'Sistemas e software',i:'fa-laptop-code',c:'#2563eb'},
  contador:{l:'Contador',i:'fa-calculator',c:'#16a34a'},
  marketing:{l:'Marketing',i:'fa-bullhorn',c:'#db2777'},
  banco:{l:'Banco e tarifas',i:'fa-building-columns',c:'#65a30d'},
  pessoal:{l:'Pessoal e encargos',i:'fa-users',c:'#ea580c'},
  outro:{l:'Outros',i:'fa-receipt',c:'#5b6b7c'}
};
const CP_PERIOD={mensal:['Mensal',1],bimestral:['Bimestral',2],trimestral:['Trimestral',3],
  semestral:['Semestral',6],anual:['Anual',12]};
const CP_STATUS={
  previsto:{l:'Previsto',c:'var(--text-3)',bg:'var(--surface-3)'},
  aberto:{l:'A pagar',c:'var(--warn)',bg:'var(--warn-bg)'},
  pago:{l:'Pago',c:'var(--ok)',bg:'var(--ok-bg)'}
};

const cpMoeda=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cpNum=v=>{ if(typeof v==='number') return v; v=String(v||'').trim().replace(/\./g,'').replace(',','.');
  const n=parseFloat(v); return isNaN(n)?0:n; };
const cpComp=(a,m)=>a+'-'+String(m).padStart(2,'0');
function cpHoje(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function cpDias(data){ const d=dataObj(data); if(!d) return null;
  const h=dataObj(cpHoje()); return Math.round((d-h)/86400000); }
function cpVencida(c){ return c.status!=='pago'&&cpDias(c.vencimento)<0; }
/* mês tem o dia? (dia 31 em fevereiro vira o último dia) */
function cpDataDoMes(ano,mes,dia){
  const ult=new Date(ano,mes,0).getDate();
  const d=Math.min(Number(dia)||1,ult);
  const p=n=>String(n).padStart(2,'0');
  return ano+'-'+p(mes)+'-'+p(d);
}
/* a conta recorrente cai neste mês? (respeita a periodicidade a partir do mês inicial) */
function cpCaiNoMes(f,ano,mes){
  if(f.ativo===false) return false;
  if(!f.recorrente) return false;
  const passo=(CP_PERIOD[f.periodicidade]||CP_PERIOD.mensal)[1];
  const ini=f.mesInicial||cpComp(ano,mes);
  const [ia,im]=ini.split('-').map(Number);
  const diff=(ano-ia)*12+(mes-im);
  if(diff<0) return false;                 /* ainda não começou */
  if(f.mesFinal){ const [fa,fm]=String(f.mesFinal).split('-').map(Number);
    if((ano-fa)*12+(mes-fm)>0) return false; }
  return passo===1||diff%passo===0;
}

/* =========================================================================
   TELA
   ========================================================================= */
VIEWS.contas=function(){
  cpGerarAutomatico();
  const h=new Date();
  if(CP.mes===null){ CP.mes=h.getMonth()+1; CP.ano=h.getFullYear(); }
  const ano=Number(CP.ano), mes=Number(CP.mes), comp=cpComp(ano,mes);
  const actions=`<div class="tabs" style="margin-right:6px">
      <button class="tab ${CP.aba==='mes'?'active':''}" onclick="CP.aba='mes';VIEWS.contas()"><i class="fas fa-calendar-check"></i> Contas do mês</button>
      <button class="tab ${CP.aba==='fixas'?'active':''}" onclick="CP.aba='fixas';VIEWS.contas()"><i class="fas fa-repeat"></i> Cadastro de contas</button>
      <button class="tab ${CP.aba==='hist'?'active':''}" onclick="CP.aba='hist';VIEWS.contas()"><i class="fas fa-chart-column"></i> Histórico</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="cpModalLanc()"><i class="fas fa-plus"></i> Nova conta</button>`;
  let html=head('contas',{actions});
  if(CP.aba==='fixas') html+=cpViewFixas();
  else if(CP.aba==='hist') html+=cpViewHistorico();
  else html+=cpViewMes(ano,mes,comp);
  setView(html);
};

/* ---------- contas do mês ---------- */
function cpViewMes(ano,mes,comp){
  let lista=CONTAS.filter(c=>c.competencia===comp);
  const previstas=cpPrevistasDoMes(ano,mes,lista);
  const total=lista.reduce((s,c)=>s+(c.status==='pago'?cpNum(c.valorPago):cpNum(c.valor)),0);
  const pago=lista.filter(c=>c.status==='pago').reduce((s,c)=>s+cpNum(c.valorPago||c.valor),0);
  const aberto=total-pago;
  const vencidas=lista.filter(cpVencida);
  const venc7=lista.filter(c=>c.status!=='pago'&&cpDias(c.vencimento)!=null&&cpDias(c.vencimento)>=0&&cpDias(c.vencimento)<=7);

  if(CP.status) lista=lista.filter(c=>c.status===CP.status);
  if(CP.cat) lista=lista.filter(c=>c.categoria===CP.cat);
  if(CP.busca){ const q=CP.busca.toLowerCase();
    lista=lista.filter(c=>`${c.nome||''} ${c.fornecedor||''} ${c.observacoes||''}`.toLowerCase().includes(q)); }
  lista.sort((a,b)=>(a.vencimento||'').localeCompare(b.vencimento||'')||(a.nome||'').localeCompare(b.nome||''));
  window.__cpExport={lista,comp};

  let html=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(175px,1fr))">
    <div class="kpi"><div class="ico i-brand"><i class="fas fa-file-invoice-dollar"></i></div><div class="val" style="font-size:1.35rem">${cpMoeda(total)}</div><div class="lbl">Total do mês</div></div>
    <div class="kpi"><div class="ico i-warn"><i class="fas fa-clock"></i></div><div class="val" style="font-size:1.35rem">${cpMoeda(aberto)}</div><div class="lbl">Ainda a pagar</div></div>
    <div class="kpi"><div class="ico i-ok"><i class="fas fa-circle-check"></i></div><div class="val" style="font-size:1.35rem">${cpMoeda(pago)}</div><div class="lbl">Já pago</div></div>
    <div class="kpi"><div class="ico ${vencidas.length?'i-danger':'i-ok'}"><i class="fas fa-triangle-exclamation"></i></div><div class="val">${vencidas.length}</div><div class="lbl">Vencidas</div></div>
    <div class="kpi"><div class="ico i-info"><i class="fas fa-calendar-week"></i></div><div class="val">${venc7.length}</div><div class="lbl">Vencem em 7 dias</div></div>
  </div>`;

  html+=`<div class="card" style="padding:14px 16px"><div class="filters" style="margin:0">
    <select onchange="CP.mes=+this.value;VIEWS.contas()">
      ${MESES_BR.map((m,i)=>`<option value="${i+1}" ${mes===i+1?'selected':''}>${m}</option>`).join('')}</select>
    <input type="number" min="2000" max="2100" value="${ano}" onchange="CP.ano=+this.value;VIEWS.contas()" style="width:110px">
    <select onchange="CP.status=this.value;VIEWS.contas()">
      <option value="">Todas as situações</option>
      ${Object.entries(CP_STATUS).map(([k,v])=>`<option value="${k}" ${CP.status===k?'selected':''}>${v.l}</option>`).join('')}</select>
    <select onchange="CP.cat=this.value;VIEWS.contas()">
      <option value="">Todas as categorias</option>
      ${Object.entries(CP_CATS).map(([k,v])=>`<option value="${k}" ${CP.cat===k?'selected':''}>${v.l}</option>`).join('')}</select>
    <input type="text" id="fBuscaCp" placeholder="Buscar conta..." value="${esc(CP.busca)}" oninput="CP.busca=this.value;redesenhar(VIEWS.contas)" style="min-width:190px">
    <button class="btn btn-ghost btn-sm" onclick="cpExportar()"><i class="fas fa-download"></i> CSV</button>
  </div></div>`;

  if(previstas.length) html+=`<div class="card" style="border-color:#b8e4ee;background:var(--brand-50)">
    <div class="card-head" style="border-color:#b8e4ee">
      <h3><i class="fas fa-repeat"></i> ${previstas.length} conta(s) recorrente(s) ainda não lançada(s) em ${MESES_BR[mes-1]}</h3>
      <button class="btn btn-primary btn-sm" onclick="cpGerarMes()"><i class="fas fa-wand-magic-sparkles"></i> Lançar todas</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${previstas.map(f=>{const cat=CP_CATS[f.categoria]||CP_CATS.outro;
        return `<span class="badge" style="background:var(--surface);color:var(--text-2);border:1px solid var(--border)">
          <i class="fas ${cat.i}" style="color:${cat.c}"></i> ${esc(f.nome)} · dia ${f.diaVencimento||1}${f.valorPadrao?' · '+cpMoeda(f.valorPadrao):''}</span>`;}).join('')}
    </div>
    <div style="font-size:.77rem;color:var(--text-2);margin-top:11px"><i class="fas fa-circle-info"></i>
      Elas entram com o valor e o dia de costume, marcadas como <b>Previsto</b>. Quando a conta chegar, você ajusta o valor e o vencimento reais.</div></div>`;

  html+=`<div class="card"><div class="card-head"><h3><i class="fas fa-list-check"></i> ${MESES_BR[mes-1]} de ${ano} — ${lista.length} conta(s)</h3></div>
    ${lista.length?`<div class="tbl-wrap"><table><thead><tr>
      <th>Conta</th><th>Categoria</th><th>Vencimento</th><th style="text-align:right">Valor</th>
      <th>Situação</th><th>Pagamento</th><th style="text-align:right">Ações</th>
    </tr></thead><tbody>
    ${lista.map(c=>{
      const cat=CP_CATS[c.categoria]||CP_CATS.outro, st=CP_STATUS[c.status]||CP_STATUS.previsto;
      const d=cpDias(c.vencimento), venc=cpVencida(c);
      return `<tr${venc?' style="background:#fff7f7"':''}>
        <td><b>${esc(c.nome)}</b>${c.fornecedor?`<div style="font-size:.73rem;color:var(--text-3)">${esc(c.fornecedor)}</div>`:''}
          ${c.recorrente?'<span class="badge" style="background:var(--surface-3);color:var(--text-3);font-size:.65rem"><i class="fas fa-repeat"></i> fixa</span>':''}</td>
        <td><span class="badge" style="background:${cat.c}18;color:${cat.c}"><i class="fas ${cat.i}"></i> ${cat.l}</span></td>
        <td>${fmtData(c.vencimento)}
          <div style="font-size:.72rem;color:${venc?'var(--danger)':d!=null&&d<=7?'var(--warn)':'var(--text-3)'}">
            ${c.status==='pago'?'':venc?('venceu há '+Math.abs(d)+' dia(s)'):d===0?'vence hoje':d===1?'vence amanhã':d!=null?('em '+d+' dias'):''}</div></td>
        <td style="text-align:right"><b>${cpMoeda(c.status==='pago'?(c.valorPago||c.valor):c.valor)}</b>
          ${c.status==='pago'&&cpNum(c.valorPago)!==cpNum(c.valor)&&c.valor?`<div style="font-size:.71rem;color:var(--text-3)">previsto ${cpMoeda(c.valor)}</div>`:''}</td>
        <td><span class="badge" style="background:${st.bg};color:${st.c}">${st.l}</span></td>
        <td style="font-size:.79rem;color:var(--text-2)">${c.status==='pago'
          ? (c.pagoEmData?fmtData(c.pagoEmData):'—')+(c.formaPagamento?`<div style="font-size:.71rem;color:var(--text-3)">${esc(c.formaPagamento)}</div>`:'')
          : '<span style="color:var(--text-3)">—</span>'}</td>
        <td style="text-align:right;white-space:nowrap">
          ${c.status!=='pago'
            ? `<button class="btn btn-success btn-sm" title="Dar baixa" onclick="cpModalBaixa('${c.id}')"><i class="fas fa-check"></i> Pagar</button>`
            : `<button class="btn btn-ghost btn-sm" title="Desfazer baixa" onclick="cpDesfazer('${c.id}')"><i class="fas fa-rotate-left"></i></button>`}
          <button class="btn btn-ghost btn-sm" title="Editar" onclick="cpModalLanc('${c.id}')"><i class="fas fa-pen"></i></button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger)" title="Excluir" onclick="cpExcluir('${c.id}')"><i class="fas fa-trash"></i></button>
        </td></tr>`;}).join('')}
      <tr style="background:var(--surface-2)"><td colspan="3" style="font-weight:700">Total</td>
        <td style="text-align:right;font-weight:800;color:var(--brand-dark)">${cpMoeda(lista.reduce((s,c)=>s+(c.status==='pago'?cpNum(c.valorPago||c.valor):cpNum(c.valor)),0))}</td>
        <td colspan="3"></td></tr>
    </tbody></table></div>`
    :`<div class="empty"><div class="em-ic"><i class="fas fa-file-invoice-dollar"></i></div><h4>Nenhuma conta neste mês</h4>
      <p>Cadastre suas contas fixas na aba ao lado e lance o mês com um clique, ou crie uma conta avulsa.</p></div>`}
  </div>`;
  return html;
}
/* recorrentes que ainda não foram lançadas no mês */
function cpPrevistasDoMes(ano,mes,lista){
  const comp=cpComp(ano,mes);
  const jaTem=new Set((lista||CONTAS.filter(c=>c.competencia===comp)).map(c=>c.contaFixaId).filter(Boolean));
  return CONTAS_FIXAS.filter(f=>cpCaiNoMes(f,ano,mes)&&!jaTem.has(f.id));
}
async function cpGerarMes(){
  const ano=Number(CP.ano), mes=Number(CP.mes), comp=cpComp(ano,mes);
  const prev=cpPrevistasDoMes(ano,mes);
  if(!prev.length){ toast('Nada novo para lançar neste mês.','info'); return; }
  try{
    const lote=db.batch();
    prev.forEach(f=>{
      lote.set(db.collection('contas_pagar').doc(),{
        contaFixaId:f.id, nome:f.nome, categoria:f.categoria||'outro', fornecedor:f.fornecedor||null,
        competencia:comp, vencimento:cpDataDoMes(ano,mes,f.diaVencimento||1),
        valor:Number(f.valorPadrao)||0, valorPago:null, status:'previsto', recorrente:true,
        avisarAgenda:f.avisarAgenda!==false, formaPagamento:f.formaPagamento||null,
        observacoes:null, criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp(),
        criadoPor:(CURRENT_USER&&CURRENT_USER.email)||'admin'});
    });
    await lote.commit();
    toast(prev.length+' conta(s) lançadas em '+MESES_BR[mes-1]+'.','ok','Pronto');
    setTimeout(()=>cpSincronizarAgenda(),900);
  }catch(e){ console.error(e); toast('Erro ao lançar as contas do mês.','err'); }
}


/* ---------- lança sozinho os próximos meses ---------- */
let __cpGerou=false, __cpGerando=false;
/* só posso lançar depois que as duas coleções chegaram — senão duplico */
const CP_CARREGOU={fixas:false,contas:false};
function cpCompetencias(f,mesesAdiante){
  const out=[], h=new Date();
  let y=h.getFullYear(), m=h.getMonth()+1;
  const n=(mesesAdiante!=null?mesesAdiante:(f.mesesAdiante!=null?f.mesesAdiante:3));
  for(let k=0;k<=n;k++){
    if(cpCaiNoMes(f,y,m)) out.push({ano:y,mes:m});
    m++; if(m>12){m=1;y++;}
  }
  return out;
}
/* data do lançamento já com o ajuste de dia útil, se a conta pedir */
function cpDataLanc(f,ano,mes){
  const bruta=cpDataDoMes(ano,mes,f.diaVencimento||1);
  const aj=f.ajuste||'manter';
  if(aj==='manter'||typeof agAjustaDiaUtil!=='function') return {data:bruta,original:bruta};
  const d=agAjustaDiaUtil(bruta,aj,f.feriados!==false);
  return {data:d,original:bruta};
}
async function cpGerarAutomatico(force){
  if(!CP_CARREGOU.fixas||!CP_CARREGOU.contas) return;   /* espero os dados chegarem */
  if(__cpGerando) return;
  if(!CONTAS_FIXAS.length) return;
  if(__cpGerou&&!force) return;
  __cpGerou=true; __cpGerando=true;
  const novas=[];
  CONTAS_FIXAS.filter(f=>f.ativo!==false&&f.recorrente&&f.autoLancar!==false).forEach(f=>{
    cpCompetencias(f).forEach(({ano,mes})=>{
      const comp=cpComp(ano,mes);
      if(CONTAS.some(c=>c.contaFixaId===f.id&&c.competencia===comp)) return;
      novas.push({f,ano,mes,comp});
    });
  });
  if(!novas.length){ __cpGerando=false; return; }
  try{
    const lote=db.batch();
    novas.slice(0,150).forEach(({f,ano,mes,comp})=>{
      const dt=cpDataLanc(f,ano,mes);
      lote.set(db.collection('contas_pagar').doc(),{
        contaFixaId:f.id, nome:f.nome, categoria:f.categoria||'outro', fornecedor:f.fornecedor||null,
        competencia:comp, vencimento:dt.data, vencimentoOriginal:dt.original!==dt.data?dt.original:null,
        valor:Number(f.valorPadrao)||0, valorPago:null, status:'previsto', recorrente:true,
        avisarAgenda:f.avisarAgenda!==false, formaPagamento:f.formaPagamento||null,
        observacoes:null, criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp(),
        criadoPor:(CURRENT_USER&&CURRENT_USER.email)||'admin', origem:'auto'});
    });
    await lote.commit();
    console.log('[contas] '+novas.length+' lancamento(s) futuros criados');
    setTimeout(()=>cpSincronizarAgenda(),900);
  }catch(e){ console.error('gerar contas',e); __cpGerou=false; }
  finally{ setTimeout(()=>{__cpGerando=false;},1500); }
}
function cpProximas(f,qtd){
  const hoje=cpHoje();
  return cpCompetencias(f,14).map(({ano,mes})=>cpDataLanc(f,ano,mes))
    .filter(x=>x.data>=hoje).slice(0,qtd||4);
}

/* ---------- cadastro das contas fixas ---------- */
function cpViewFixas(){
  const fs=CONTAS_FIXAS.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const rec=fs.filter(f=>f.recorrente&&f.ativo!==false);
  const mensal=rec.filter(f=>(f.periodicidade||'mensal')==='mensal').reduce((s,f)=>s+(Number(f.valorPadrao)||0),0);
  return `<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <div class="kpi"><div class="ico i-brand"><i class="fas fa-repeat"></i></div><div class="val">${rec.length}</div><div class="lbl">Contas recorrentes ativas</div></div>
    <div class="kpi"><div class="ico i-info"><i class="fas fa-sack-dollar"></i></div><div class="val" style="font-size:1.35rem">${cpMoeda(mensal)}</div><div class="lbl">Custo fixo mensal estimado</div></div>
  </div>
  <div class="card"><div class="card-head"><h3><i class="fas fa-repeat"></i> Contas cadastradas</h3>
      <button class="btn btn-primary btn-sm" onclick="cpModalFixa()"><i class="fas fa-plus"></i> Nova conta fixa</button></div>
    <p style="color:var(--text-2);font-size:.85rem;margin-bottom:14px">
      Cadastre uma vez o nome, a categoria, o dia que costuma vencer e o valor de costume. Todo mês você lança tudo num clique e só ajusta o que mudou.</p>
    ${fs.length?`<div class="tbl-wrap"><table><thead><tr>
      <th>Conta</th><th>Categoria</th><th>Recorrência</th><th>Dia</th><th style="text-align:right">Valor de costume</th><th>Próximas datas</th><th>Agenda</th><th>Status</th><th></th>
    </tr></thead><tbody>
    ${fs.map(f=>{const cat=CP_CATS[f.categoria]||CP_CATS.outro;
      return `<tr>
        <td><b>${esc(f.nome)}</b>${f.fornecedor?`<div style="font-size:.73rem;color:var(--text-3)">${esc(f.fornecedor)}</div>`:''}</td>
        <td><span class="badge" style="background:${cat.c}18;color:${cat.c}"><i class="fas ${cat.i}"></i> ${cat.l}</span></td>
        <td>${f.recorrente?(CP_PERIOD[f.periodicidade]||CP_PERIOD.mensal)[0]:'<span style="color:var(--text-3)">Avulsa</span>'}</td>
        <td>${f.recorrente?('dia '+(f.diaVencimento||1)):'—'}</td>

}

/* ---------- histórico ---------- */
function cpViewHistorico(){
  const ano=Number(CP.ano);
  const meses=[];
  for(let m=1;m<=12;m++){
    const comp=cpComp(ano,m);
    const l=CONTAS.filter(c=>c.competencia===comp);
    meses.push({m,comp,total:l.reduce((s,c)=>s+(c.status==='pago'?cpNum(c.valorPago||c.valor):cpNum(c.valor)),0),
      pago:l.filter(c=>c.status==='pago').reduce((s,c)=>s+cpNum(c.valorPago||c.valor),0), qtd:l.length});
  }
  const max=Math.max(1,...meses.map(x=>x.total));
  const totalAno=meses.reduce((s,x)=>s+x.total,0);
  const porCat={};
  CONTAS.filter(c=>(c.competencia||'').startsWith(ano+'-')).forEach(c=>{
    const k=c.categoria||'outro';
    porCat[k]=(porCat[k]||0)+(c.status==='pago'?cpNum(c.valorPago||c.valor):cpNum(c.valor));
  });
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  return `<div class="card" style="padding:14px 16px"><div class="filters" style="margin:0">
      <input type="number" min="2000" max="2100" value="${ano}" onchange="CP.ano=+this.value;VIEWS.contas()" style="width:110px">
      <span style="font-size:.86rem;color:var(--text-2)">Total do ano: <b>${cpMoeda(totalAno)}</b></span></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px">
    <div class="card"><div class="card-head"><h3><i class="fas fa-chart-column"></i> Mês a mês de ${ano}</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>Mês</th><th style="text-align:right">Contas</th><th style="text-align:right">Total</th><th style="text-align:right">Pago</th><th></th></tr></thead><tbody>
      ${meses.filter(x=>x.qtd).map(x=>`<tr style="cursor:pointer" onclick="CP.mes=${x.m};CP.aba='mes';VIEWS.contas()">
        <td><b>${MESES_BR[x.m-1]}</b></td><td style="text-align:right">${x.qtd}</td>
        <td style="text-align:right"><b>${cpMoeda(x.total)}</b></td>
        <td style="text-align:right;color:var(--ok)">${cpMoeda(x.pago)}</td>
        <td style="width:110px"><div style="background:var(--surface-3);border-radius:5px;height:8px;overflow:hidden">
          <div style="width:${Math.round(x.total/max*100)}%;height:100%;background:var(--brand)"></div></div></td></tr>`).join('')
        ||`<tr><td colspan="5"><div class="empty" style="padding:26px"><div class="em-ic"><i class="fas fa-inbox"></i></div><h4>Sem contas em ${ano}</h4></div></td></tr>`}
      </tbody></table></div></div>
    <div class="card"><div class="card-head"><h3><i class="fas fa-chart-pie"></i> Por categoria em ${ano}</h3></div>
      ${cats.length?cats.map(([k,v])=>{const cat=CP_CATS[k]||CP_CATS.outro, pct=totalAno?Math.round(v/totalAno*100):0;
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:.83rem;margin-bottom:4px">
            <span><i class="fas ${cat.i}" style="color:${cat.c};width:16px"></i> ${cat.l}</span>
            <span><b>${cpMoeda(v)}</b> <span style="color:var(--text-3)">· ${pct}%</span></span></div>
          <div style="background:var(--surface-3);border-radius:6px;height:9px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${cat.c}"></div></div></div>`;}).join('')
        :`<p style="color:var(--text-3);font-size:.85rem">Sem lançamentos em ${ano}.</p>`}
    </div></div>`;
}

function cpToggleRec(){
  const rec=document.getElementById('cfRec').value==='1';
  document.getElementById('cfBoxRec').style.display=rec?'block':'none';
  cpPreviewFixa();
}
function cpLerFixa(){
  const g=i=>document.getElementById(i);
  const rec=g('cfRec').value==='1';
  return { nome:g('cfNome').value.trim(), recorrente:rec, ativo:true,
    periodicidade:rec?g('cfPer').value:null,
    diaVencimento:rec?(parseInt(g('cfDia').value)||1):null,
    valorPadrao:rec?cpNum(g('cfValor').value):null,
    mesInicial:rec?(g('cfMesIni').value||null):null,
    mesesAdiante:rec?(parseInt(g('cfAdiante').value)||3):3,
    ajuste:rec?g('cfAjuste').value:'manter', feriados:true };
}
function cpPreviewFixa(){
  const el=document.getElementById('cfPreview'); if(!el) return;
  const f=cpLerFixa();
  if(!f.recorrente){ el.innerHTML=''; return; }
  const ps=cpProximas(f,4);
  if(!ps.length){ el.innerHTML='<i class="fas fa-circle-info"></i> Sem datas na janela — confira a periodicidade e o mês inicial.'; return; }
  el.innerHTML='<b><i class="fas fa-calendar-check"></i> Vou lançar em:</b> '+ps.map(x=>
    fmtData(x.data)+(x.original!==x.data?` <span style="color:var(--warn)">(era ${fmtData(x.original)})</span>`:'')).join(' · ')
    +(f.valorPadrao?` <span style="color:var(--text-3)">· ${cpMoeda(f.valorPadrao)} cada</span>`:'');
}
async function cpSalvarFixa(){
  const id=document.getElementById('cfId').value;
  const nome=document.getElementById('cfNome').value.trim();
  if(!nome){ toast('Dê um nome para a conta.','err'); return; }
  const rec=document.getElementById('cfRec').value==='1';
  const dados={ nome, categoria:document.getElementById('cfCat').value,
    fornecedor:document.getElementById('cfForn').value.trim()||null,
    recorrente:rec,
    periodicidade:rec?document.getElementById('cfPer').value:null,
    diaVencimento:rec?(parseInt(document.getElementById('cfDia').value)||1):null,
    valorPadrao:rec?cpNum(document.getElementById('cfValor').value):null,
    mesInicial:rec?(document.getElementById('cfMesIni').value||null):null,
    formaPagamento:document.getElementById('cfForma').value||null,
    mesesAdiante:rec?(parseInt(document.getElementById('cfAdiante').value)||3):null,
    ajuste:rec?document.getElementById('cfAjuste').value:null,
    feriados:true,
    autoLancar:document.getElementById('cfAuto').checked,
    avisarAgenda:document.getElementById('cfAgenda').checked,
    ativo:document.getElementById('cfAtivo').value==='1',
    atualizadoEm:FV.serverTimestamp() };
  try{
    if(id) await db.collection('contas_fixas').doc(id).update(dados);
    else { dados.criadoEm=FV.serverTimestamp(); await db.collection('contas_fixas').add(dados); }
    closeModal(); toast('Conta salva — já lancei os próximos meses.','ok','Pronto');
    setTimeout(()=>cpGerarAutomatico(true),900);
  }catch(e){ console.error(e); toast('Erro ao salvar a conta.','err'); }
}
async function cpExcluirFixa(id){
  const f=CONTAS_FIXAS.find(x=>x.id===id); if(!f) return;
  if(!confirm('Excluir a conta "'+f.nome+'" do cadastro?\n\nOs lançamentos que já existem nos meses continuam.')) return;
  try{ await db.collection('contas_fixas').doc(id).delete(); toast('Conta removida do cadastro.','info'); }
  catch(e){ console.error(e); toast('Erro ao excluir.','err'); }
}

function cpPreencherDaFixa(){
  const id=document.getElementById('clFixa').value;
  const f=CONTAS_FIXAS.find(x=>x.id===id); if(!f) return;
  document.getElementById('clNome').value=f.nome||'';
  document.getElementById('clCat').value=f.categoria||'outro';
  document.getElementById('clForn').value=f.fornecedor||'';
  if(f.valorPadrao) document.getElementById('clValor').value=String(f.valorPadrao).replace('.',',');
  if(f.diaVencimento) document.getElementById('clVenc').value=cpDataDoMes(Number(CP.ano),Number(CP.mes),f.diaVencimento);
  if(f.formaPagamento) document.getElementById('clForma').value=f.formaPagamento;
  document.getElementById('clAgenda').checked=f.avisarAgenda!==false;
}
async function cpSalvarLanc(){
  const id=document.getElementById('clId').value;
  const nome=document.getElementById('clNome').value.trim();
  const venc=document.getElementById('clVenc').value;
  if(!nome){ toast('Dê um nome para a conta.','err'); return; }
  if(!venc){ toast('Informe o vencimento.','err'); return; }
  const fixaSel=document.getElementById('clFixa');
  const dados={ nome, categoria:document.getElementById('clCat').value,
    fornecedor:document.getElementById('clForn').value.trim()||null,
    vencimento:venc, competencia:venc.slice(0,7),
    valor:cpNum(document.getElementById('clValor').value),
    formaPagamento:document.getElementById('clForma').value||null,
    status:document.getElementById('clStatus').value,
    observacoes:document.getElementById('clObs').value.trim()||null,
    avisarAgenda:document.getElementById('clAgenda').checked,
    atualizadoEm:FV.serverTimestamp() };
  try{
    let docId=id;
    if(id) await db.collection('contas_pagar').doc(id).update(dados);
    else {
      if(fixaSel&&fixaSel.value){ dados.contaFixaId=fixaSel.value; dados.recorrente=true; }

      const ref=await db.collection('contas_pagar').add(dados); docId=ref.id;
    }
    closeModal(); toast('Conta salva.','ok');
    const comp=venc.slice(0,7); CP.ano=Number(comp.slice(0,4)); CP.mes=Number(comp.slice(5,7));
    setTimeout(()=>cpSincronizarAgenda(),700);
  }catch(e){ console.error(e); toast('Erro ao salvar.','err'); }

/* =========================================================================

   ========================================================================= */
const cpChave=id=>'conta:'+id;
function cpAcaoDe(id){
  return (typeof AGENDA!=='undefined'?AGENDA:[]).find(t=>t.sugestaoChave===cpChave(id));
}
/* cria/atualiza as ações das contas em aberto que pedem aviso */
let __cpAgSync=false; const __cpAgFeitas=new Set();
async function cpSincronizarAgenda(){
  if(typeof AGENDA==='undefined') return;
  if(__cpAgSync) return;                 /* evita criar a mesma ação duas vezes */
  __cpAgSync=true;
  const eu=(CURRENT_USER&&CURRENT_USER.email)||'admin';
  const pend=CONTAS.filter(c=>c.status!=='pago'&&c.avisarAgenda!==false);
  try{
    for(const c of pend){
      const a=cpAcaoDe(c.id);
      if(!a&&__cpAgFeitas.has(cpChave(c.id))) continue;   /* já pedi, o listener ainda não voltou */
      if(!a) __cpAgFeitas.add(cpChave(c.id));
      const dados={ titulo:'Pagar '+c.nome+(c.valor?' — '+cpMoeda(c.valor):''),
        descricao:'Conta a pagar'+(c.fornecedor?' · '+c.fornecedor:'')+(c.formaPagamento?' · '+c.formaPagamento:''),
        data:c.vencimento, tipo:'financeiro', prioridade:'normal',
        sugestaoChave:cpChave(c.id), origem:'conta', atualizadoEm:FV.serverTimestamp() };
      if(a){ if(a.data!==c.vencimento||a.titulo!==dados.titulo)
        await db.collection('agenda_crm').doc(a.id).update(dados); }
      else await db.collection('agenda_crm').add({...dados,hora:null,horaFim:null,
        responsaveis:[eu],responsaveisNomes:[typeof agNomeDe==='function'?agNomeDe(eu):eu],
        status:'aberta',criadoPor:eu,criadoEm:FV.serverTimestamp()});
    }
  }catch(e){ console.warn('sincronizar agenda das contas',e&&e.code); }
  finally{ __cpAgSync=false; }
}
/* dar baixa conclui a ação lá */
async function cpFecharAcaoAgenda(id,excluir){
  const a=cpAcaoDe(id); if(!a) return;
  try{
    if(excluir) await db.collection('agenda_crm').doc(a.id).delete();
    else await db.collection('agenda_crm').doc(a.id).update({status:'concluida',
      concluidoEm:FV.serverTimestamp(), concluidoEmData:cpHoje(),
      concluidoPor:(CURRENT_USER&&CURRENT_USER.email)||'admin', atualizadoEm:FV.serverTimestamp()});
  }catch(e){ console.warn('fechar acao da conta',e&&e.code); }
}
/* badge do menu: vencidas + vencendo hoje */
function cpAtualizarBadge(){
  const n=CONTAS.filter(c=>c.status!=='pago'&&cpDias(c.vencimento)!=null&&cpDias(c.vencimento)<=0).length;
  if(typeof setBadge==='function') setBadge('contas',n);

function cpExportar(){
  const {lista,comp}=window.__cpExport||{};
  if(!lista||!lista.length){ toast('Nada para exportar.','info'); return; }
  const cel=v=>{v=(v==null?'':String(v));return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['Competencia','Conta','Categoria','Fornecedor','Vencimento','Valor previsto','Valor pago','Situacao','Pago em','Forma','Observacoes'];
  const linhas=lista.map(c=>[c.competencia,c.nome,(CP_CATS[c.categoria]||CP_CATS.outro).l,c.fornecedor||'',
    fmtData(c.vencimento),c.valor,c.valorPago||'',(CP_STATUS[c.status]||{}).l||c.status,
    c.pagoEmData?fmtData(c.pagoEmData):'',c.formaPagamento||'',c.observacoes||'']);
  const txt='﻿'+[head.join(';')].concat(linhas.map(x=>x.map(cel).join(';'))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='contas-'+comp+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV das contas gerado.','ok','Exportado');
}
