<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Retorno Seguros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ==========================================================================
   CRM RETORNO SEGUROS — Protótipo Fase 1 (arquivo único / tema claro)
   Design system: azul-petróleo da marca, tema claro + escuro opcional
   ========================================================================== */
:root{
  --brand:#0088aa; --brand-dark:#006b87; --brand-light:#00b8d4; --brand-50:#e6f6fa;
  --ok:#16a34a; --ok-bg:#dcfce7; --warn:#d97706; --warn-bg:#fef3c7;
  --danger:#dc2626; --danger-bg:#fee2e2; --info:#2563eb; --info-bg:#dbeafe;
  --purple:#7c3aed; --purple-bg:#ede9fe; --orange:#ea580c; --orange-bg:#ffedd5;

  --bg:#f4f7fb; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --text:#0f1e2e; --text-2:#5b6b7c; --text-3:#93a1b0;
  --border:#e4eaf1; --border-2:#d7dfe8;
  --shadow-sm:0 1px 2px rgba(16,32,48,.06);
  --shadow:0 4px 16px rgba(16,32,48,.08);
  --shadow-lg:0 12px 32px rgba(16,32,48,.14);
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
  --sidebar-w:264px; --topbar-h:64px;
}
[data-theme="dark"]{
  --brand:#22b8d8; --brand-dark:#0088aa; --brand-light:#4fd3ee; --brand-50:#0e2a33;
  --ok:#34d399; --ok-bg:#0d3b2b; --warn:#fbbf24; --warn-bg:#3a2c0a;
  --danger:#f87171; --danger-bg:#3a1414; --info:#60a5fa; --info-bg:#0f2544;
  --purple:#a78bfa; --purple-bg:#241a44; --orange:#fb923c; --orange-bg:#331c0a;
  --bg:#0d1420; --surface:#151f2e; --surface-2:#1a2636; --surface-3:#212f42;
  --text:#eef4fb; --text-2:#9fb0c2; --text-3:#68798c;
  --border:#26364a; --border-2:#31465f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ---------- BOTÕES ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:var(--radius-xs);
  padding:9px 16px;font-size:.875rem;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-success{background:var(--ok);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface);color:var(--text-2);border-color:var(--border-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center}

/* ---------- LOGIN ---------- */
#loginView{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--brand-dark),var(--brand) 55%,var(--brand-light));z-index:2000;padding:20px}
.login-card{background:var(--surface);width:100%;max-width:400px;border-radius:24px;padding:40px 34px;box-shadow:var(--shadow-lg)}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand-light));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;margin:0 auto 18px;box-shadow:var(--shadow)}
.login-card h1{font-size:1.5rem;text-align:center;letter-spacing:-.02em}
.login-card .sub{text-align:center;color:var(--text-2);margin:6px 0 26px;font-size:.9rem}
.field{margin-bottom:16px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .wrap{position:relative}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border-2);border-radius:var(--radius-xs);
  background:var(--surface-2);color:var(--text);font-size:.95rem;transition:.15s}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.field .toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3);background:none;border:none;cursor:pointer}
.login-error{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius-xs);
  font-size:.85rem;margin-bottom:14px;display:none}
.login-btn{width:100%;justify-content:center;padding:13px;font-size:.95rem;margin-top:4px}

/* ---------- LAYOUT ---------- */
#app{display:none}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:900;transition:transform .25s}
.sidebar-head{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.sidebar-head .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-light));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.sidebar-head .txt b{display:block;font-size:.98rem;letter-spacing:-.01em}
.sidebar-head .txt span{font-size:.72rem;color:var(--text-3)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 12px 18px}
.nav-sec{margin-top:16px}
.nav-sec:first-child{margin-top:4px}
.nav-sec-title{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  padding:0 12px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-xs);color:var(--text-2);
  font-size:.875rem;font-weight:500;margin-bottom:2px;transition:.12s;position:relative}
.nav-item i{width:18px;text-align:center;font-size:.95rem}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--brand-50);color:var(--brand-dark);font-weight:600}
[data-theme="dark"] .nav-item.active{color:var(--brand-light)}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:.68rem;font-weight:700;
  min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-badge.zero{display:none}
.sidebar-foot{padding:12px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-xs)}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.user-chip .info{flex:1;min-width:0}
.user-chip .info b{display:block;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .info span{font-size:.7rem;color:var(--text-3)}

.main{margin-left:var(--sidebar-w);min-height:100vh}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:800}
.topbar .menu-toggle{display:none;background:none;border:none;color:var(--text-2);font-size:20px}
.topbar .search{flex:1;max-width:420px;position:relative}
.topbar .search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:.85rem}
.topbar .search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border-2);border-radius:20px;
  background:var(--surface-2);color:var(--text);font-size:.85rem}
.topbar .search input:focus{outline:none;border-color:var(--brand)}
.topbar .spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:.95rem;position:relative}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}

.content{padding:26px}
.page-head{margin-bottom:22px}
.page-head h1{font-size:1.55rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.page-head .explain{color:var(--text-2);margin-top:6px;font-size:.92rem;max-width:760px}
.page-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}

/* ---------- CARTÕES / KPIs ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:1rem;display:flex;align-items:center;gap:9px}
.card-head h3 i{color:var(--brand)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.15s}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px}
.kpi .val{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .lbl{color:var(--text-2);font-size:.85rem;margin-top:5px;font-weight:500}
.kpi .trend{position:absolute;top:20px;right:20px;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:20px}
.kpi .trend.up{background:var(--ok-bg);color:var(--ok)}
.i-brand{background:var(--brand-50);color:var(--brand)} .i-ok{background:var(--ok-bg);color:var(--ok)}
.i-warn{background:var(--warn-bg);color:var(--warn)} .i-danger{background:var(--danger-bg);color:var(--danger)}
.i-info{background:var(--info-bg);color:var(--info)} .i-purple{background:var(--purple-bg);color:var(--purple)}
.i-orange{background:var(--orange-bg);color:var(--orange)}

/* ---------- TABELA ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-3);padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:.875rem;vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.dot-b{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- ABAS ---------- */
.tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:12px;width:fit-content;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:9px;border:none;background:none;color:var(--text-2);font-weight:600;font-size:.85rem;
  display:flex;align-items:center;gap:7px;transition:.15s}
.tab.active{background:var(--surface);color:var(--brand-dark);box-shadow:var(--shadow-sm)}
[data-theme="dark"] .tab.active{color:var(--brand-light)}
.tab .cnt{background:var(--surface-2);border-radius:20px;padding:1px 7px;font-size:.72rem}
.tab.active .cnt{background:var(--brand-50);color:var(--brand-dark)}

/* ---------- EMPTY / LOADING ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--text-2)}
.empty .em-ic{width:72px;height:72px;border-radius:22px;background:var(--surface-3);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
.empty h4{font-size:1.05rem;color:var(--text);margin-bottom:5px}
.skeleton{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- MOVIMENTAÇÕES ---------- */
.emp-portal{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.emp-portal .seg-ic{width:46px;height:46px;border-radius:12px;background:var(--brand-50);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.emp-portal .seg-info b{font-size:1.05rem}
.emp-portal .seg-info span{display:block;font-size:.8rem;color:var(--text-2)}
.mov-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border-2);
  border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:.15s}
.mov-card.inclusao{border-left-color:var(--ok)}
.mov-card.exclusao{border-left-color:var(--danger)}
.mov-card.aprovado,.mov-card.rejeitado{opacity:.9}
.mov-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.mov-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mov-when{text-align:right;font-size:.78rem;color:var(--text-3)}
.mov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 20px;margin-bottom:12px}
.mov-f .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:700}
.mov-f .v{font-size:.9rem;font-weight:500;margin-top:2px}
.mov-acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)}
.emp-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);margin-bottom:10px;transition:.15s;cursor:pointer}
.emp-row:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.emp-row .logo{width:46px;height:46px;border-radius:12px;background:var(--brand-50);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0}
.emp-row .nm{flex:1;min-width:0}
.emp-row .nm b{font-size:.97rem}
.emp-row .nm span{font-size:.8rem;color:var(--text-2)}
.emp-row .pend{background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:.8rem;padding:5px 12px;border-radius:20px}
.emp-row .pend.zero{background:var(--surface-3);color:var(--text-3)}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,28,.55);backdrop-filter:blur(3px);z-index:1500;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal.wide{max-width:820px}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;
  overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:1.05rem;display:flex;align-items:center;gap:9px}
.modal-close{background:none;border:none;color:var(--text-3);font-size:22px;line-height:1}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
textarea,select,.modal input{width:100%;padding:11px 13px;border:1px solid var(--border-2);border-radius:var(--radius-xs);
  background:var(--surface-2);color:var(--text);font-size:.9rem;font-family:inherit}
textarea:focus,select:focus,.modal input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:6px}

/* credencial (login/senha copiar) */
.cred{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:11px 13px;margin-bottom:12px}
.cred .cred-k{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:700;width:56px}
.cred .cred-v{flex:1;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.92rem;font-weight:600;word-break:break-all}
.cred .cp{background:var(--brand-50);color:var(--brand);border:none;border-radius:8px;width:34px;height:34px;font-size:.85rem}
.cred .cp:hover{background:var(--brand);color:#fff}

/* ---------- TOASTS ---------- */
#toasts{position:fixed;bottom:24px;right:24px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;
  padding:13px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:11px;min-width:280px;max-width:380px;
  animation:slidein .25s}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--danger)} .toast.info{border-left-color:var(--info)}
.toast i{font-size:1.05rem}.toast.ok i{color:var(--ok)}.toast.err i{color:var(--danger)}.toast.info i{color:var(--info)}
.toast b{font-size:.88rem}.toast span{font-size:.8rem;color:var(--text-2);display:block}
@keyframes slidein{from{transform:translateX(120%)}to{transform:translateX(0)}}

/* KANBAN */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kb-col{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;min-height:120px}
.kb-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;font-weight:700;font-size:.82rem;border-bottom:1px solid var(--border)}
.kb-cnt{background:var(--surface-3);border-radius:20px;padding:1px 9px;font-size:.72rem;color:var(--text-2)}
.kb-body{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:64vh}
.kb-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.12s}
.kb-card:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.kb-resp{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kb-resp.vazio{background:var(--surface-3);color:var(--text-3)}
.kb-mv{width:24px;height:24px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);font-size:.7rem}
.kb-mv:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--border-2);border-radius:var(--radius-xs);
  background:var(--surface);color:var(--text);font-size:.85rem;flex:0 0 auto;max-width:100%}
.filters select{min-width:150px;width:auto}
.filters input{width:auto}
.kb-card[draggable="true"]{cursor:grab}
.kb-card.arrastando{opacity:.45;cursor:grabbing}
.kb-col.drop{background:var(--brand-50);outline:2px dashed var(--brand);outline-offset:-3px}
.hidden{display:none!important}

/* ---------- RESPONSIVO ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,18,28,.4);z-index:850;display:none}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .topbar .menu-toggle{display:block}
  .overlay.show{display:block}
}

/* ================= AGENDA ================= */
.ag-wrap{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:18px;align-items:start}
@media(max-width:980px){.ag-wrap{grid-template-columns:1fr}}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-head b{font-size:1rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:.68rem;font-weight:700;color:var(--text-3);text-transform:uppercase;text-align:center;padding:5px 0;letter-spacing:.04em}
.cal-day{position:relative;aspect-ratio:1;border:1px solid transparent;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:.85rem;transition:.12s;background:var(--surface-2);color:var(--text)}
.cal-day:hover{background:var(--surface-3)}
.cal-day.fora{opacity:.32}
.cal-day.hoje{border-color:var(--brand);font-weight:800;color:var(--brand-dark)}
.cal-day.sel{background:var(--brand);color:#fff;font-weight:800}
.cal-day.sel .cal-dots i{background:#fff!important}
.cal-day.drop{outline:2px dashed var(--brand);outline-offset:-3px;background:var(--brand-50)}
.cal-dots{display:flex;gap:3px;height:6px;align-items:center}
.cal-dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal-n{position:absolute;top:3px;right:5px;font-size:.6rem;font-weight:800;color:var(--text-3)}
.cal-day.sel .cal-n{color:#fff}
/* agenda do dia */
.dia-hora{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--border)}
.dia-hora:first-child{border-top:none}
.dia-hora .h{font-size:.76rem;color:var(--text-3);font-weight:700;padding-top:9px;text-align:right}
.dia-hora .slot{min-height:34px;border-radius:8px;padding:2px}
.dia-hora .slot.vazio{border:1px dashed var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);font-size:.76rem;opacity:0;transition:.15s}
.dia-hora:hover .slot.vazio{opacity:1}
/* cartao de tarefa */
.tk{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:10px;
  padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:grab;transition:.12s}
.tk:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.tk.dragging{opacity:.45;cursor:grabbing}
.tk.p-alta{border-left-color:var(--danger)} .tk.p-normal{border-left-color:var(--brand)} .tk.p-baixa{border-left-color:var(--text-3)}
.tk.atrasada{background:#fff7f7;border-color:#f7dcdc}
.tk.concluida{opacity:.6}
.tk.concluida .tk-t{text-decoration:line-through}
.tk-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px}
.tk-t{font-weight:700;font-size:.88rem;line-height:1.3;flex:1}
.tk-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.74rem;color:var(--text-2)}
.tk-meta .who{display:inline-flex;align-items:center;gap:4px}
.av{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:.62rem;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.mais{background:var(--surface-3);color:var(--text-2)}
.tk-acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tk-acts .btn{padding:4px 9px;font-size:.74rem}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.kb{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.kb{grid-template-columns:1fr}}
.kb-col{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:180px;transition:.12s}
.kb-col.drop{background:var(--brand-50);border-color:var(--brand);border-style:dashed}
.kb-h{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.kb-h .n{margin-left:auto;background:var(--surface-3);color:var(--text-2);border-radius:20px;padding:1px 8px;font-size:.72rem}
/* alertas */
.ag-alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.alerta{border-radius:14px;padding:14px 16px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:.12s}
.alerta:hover{box-shadow:var(--shadow)}
.alerta.on{border-width:2px}
.alerta .v{font-size:1.6rem;font-weight:800;line-height:1}
.alerta .l{font-size:.78rem;color:var(--text-2);margin-top:4px;font-weight:600}
.alerta.atras{background:var(--danger-bg);border-color:#f5c6c6} .alerta.atras .v{color:var(--danger)}
.alerta.hoje{background:var(--brand-50);border-color:#b8e4ee} .alerta.hoje .v{color:var(--brand-dark)}
.alerta.semana .v{color:var(--warn)}
.alerta.feito .v{color:var(--ok)}
.sug{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--border)}
.sug:last-child{border-bottom:none}
.sug .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-size:.8rem}

</style>

<!-- pdf.js (leitor de propostas) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* ==========================================================================
   LEITOR DE PROPOSTAS — motor de extração por seguradora
   Cada seguradora tem um "template". Se o padrão mudar e faltarem campos,
   o parser devolve avisos (warnings) em vez de dados errados.
   ========================================================================== */
(function(root){
  const NUM = s => { if(s==null) return null; s=String(s).replace(/\./g,'').replace(',', '.').replace(/[^\d.]/g,''); const n=parseFloat(s); return isNaN(n)?null:n; };
  const clean = s => (s||'').replace(/\s+/g,' ').trim();
  const COMB = 'Gasolina|Flex|Álcool|Alcool|Diesel|Etanol|Híbrido|Hibrido|Elétrico|Eletrico|Tetrafuel|Gás Natural|GNV';
  const COBERTURAS_CONHECIDAS = [
    'Colisão, Incêndio e Roubo/Furto','Despesa extraordinária','RCF-V - Danos Materiais','RCF-V - Danos Corporais',
    'RCF-V - Danos Morais','APP - Morte (por passageiro)','APP - Invalidez permanente (por passageiro)','APP - DMHO (por passageiro)',
    'Assistência 24 horas','Km adicional de reboque','Kit Gás','Blindagem','Extensão para Garantia de 0Km',
    'Carta Verde - Danos Materiais','Carta Verde - Danos Corporais'
  ];

  /* ---------- Template: TOKIO MARINE AUTO ---------- */
  function tokioMarineAuto(t){
    const r={ seguradora:'Tokio Marine', ramo:'Auto', warnings:[] };
    const pick=(re,g=1)=>{ const m=re.exec(t); return m?clean(m[g]):null; };

    r.nrCotacao   = pick(/Cota[çc][ãa]o:\s*(\d+)/i);
    r.nrProposta  = pick(/Neg[óo]cio:\s*(\d+)/i);

    // Segurado + CPF (o nome é a sequência em MAIÚSCULAS imediatamente antes do CPF)
    const mSeg = /([A-ZÀ-Ÿ][A-ZÀ-Ÿ'’.\- ]{3,70}?)\s+(\d{3}\.\d{3}\.\d{3}-\d{2}|\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/.exec(t);
    if(mSeg){ r.segurado=clean(mSeg[1]); r.cpfCnpj=mSeg[2]; } else { r.warnings.push('nome do segurado / CPF'); }

    // Veículo: placa + chassi(17) + ano + fabricante + modelo + combustível
    const mV = new RegExp(`([A-Z]{3}-?\\d[A-Z0-9]\\d{2})\\s+([A-HJ-NPR-Z0-9]{17})\\s+(\\d{4})\\s+([A-ZÀ-Ÿ]+)\\s+(.+?)\\s+(${COMB})\\b`,'i').exec(t);
    if(mV){ r.placa=mV[1]; r.chassi=mV[2]; r.anoModelo=mV[3]; r.fabricante=clean(mV[4]); r.modelo=clean(mV[5]); r.combustivel=clean(mV[6]); }
    else { r.warnings.push('dados do veículo (placa/chassi/modelo)'); }
    r.codigoFipe = pick(/\b(\d{6}-\d)\b/);

    // Contato: telefone + celular (aparecem juntos, logo antes do e-mail) e e-mail
    const mFones=/(\(\d{2}\)\s?\d{4,5}-?\d{4})\s+(\(\d{2}\)\s?\d{4,5}-?\d{4})\s+[\w.+-]+@/.exec(t);
    if(mFones){ r.telefone=clean(mFones[1]); r.celular=clean(mFones[2]); }
    else { const one=/(\(\d{2}\)\s?\d{4,5}-?\d{4})\s+[\w.+-]+@/.exec(t); if(one) r.celular=clean(one[1]); }
    const mMail=/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/.exec(t); if(mMail) r.email=mMail[0];

    // Endereço completo + CEP (vem logo após o CPF/CNPJ do proponente)
    const mAdr=/(?:\d{3}\.\d{3}\.\d{3}-\d{2}|\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})\s+(.+?)\s+([A-Z]{2})\s+(\d{5}-?\d{3})\b/.exec(t);
    if(mAdr){ r.estado=mAdr[2]; r.cep=mAdr[3].replace(/^(\d{5})(\d{3})$/,'$1-$2');
      const parts=mAdr[1].split(/\s{2,}/).map(x=>clean(x)).filter(Boolean);
      if(parts.length>=3){ r.logradouro=parts[0]; r.numero=parts[1]; r.cidade=parts[parts.length-1]; r.bairro=parts.slice(2,parts.length-1).join(' ')||null; }
      else if(parts.length===2){ r.logradouro=parts[0]; r.numero=parts[1]; }
      else { r.logradouro=clean(mAdr[1]); }
      r.enderecoCompleto=[ (r.logradouro||'')+(r.numero?', '+r.numero:''), r.bairro||'', (r.cidade||'')+(r.estado?'/'+r.estado:''), r.cep?'CEP '+r.cep:'' ].filter(x=>x&&x!=='/').join(' · ');
    }

    // Principal condutor + estado civil (vêm logo após o e-mail)
    const mC=new RegExp('@[\\w.-]+\\.[A-Za-z]{2,}\\s+(Pr[óo]prio Segurado|[A-ZÀ-Ÿ][A-ZÀ-Ÿ\'’ ]{4,60}?)\\s+(Casado\\(a\\)(?: ou vive em uni[ãa]o est[áa]vel)?|Solteiro\\(a\\)|Divorciado\\(a\\)|Vi[úu]vo\\(a\\)|Separado\\(a\\)[^]{0,25}?|Uni[ãa]o est[áa]vel)').exec(t);
    if(mC){ const pc=clean(mC[1]); r.estadoCivil=clean(mC[2]);
      if(/pr[óo]prio segurado/i.test(pc)){ r.condutorProprio=true; r.principalCondutor=r.segurado||'Próprio segurado'; }
      else { r.condutorProprio=false; r.principalCondutor=pc; } }

    // Franquia (indenização parcial) + assistências/serviços
    const mFr=/R\$\s*([\d.]+,\d{2})\s*\(\s*(\d+%[^)]*B[áa]sica)\)/i.exec(t);
    if(mFr){ r.franquia='R$ '+mFr[1]+' ('+clean(mFr[2])+')'; }
    const mAs=/Isen[çc][ãa]o de 1ª Franquia \w+\s+(.+?)(?:\n|Proposta Tokio|$)/i.exec(t);
    if(mAs){ const vals=(mAs[1].match(/Completo|Parcial|N[ãa]o possui|N[ãa]o contratada|Possui|\d+\s*di[áa]rias[^\n]*?\)|\d+\s*di[áa]rias[^\n]*/gi)||[]).slice(0,6);
      const labels=['Vidros','Logomarca (vidros)','Martelinho e para-choque','Lataria e pintura','Roda, pneu e suspensão','Carro reserva'];
      r.assistencias=vals.map((v,i)=>({item:labels[i]||('Serviço '+(i+1)),valor:clean(v)}));
      const cr=r.assistencias.find(a=>a.item==='Carro reserva'); if(cr) r.carroReserva=cr.valor; }
    const mVig = /(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/.exec(t);
    if(mVig){ r.vigenciaInicio=mVig[1]; r.vigenciaFim=mVig[2]; } else { r.warnings.push('vigência'); }
    r.tipoSeguro = pick(/(Seguro Novo|Renova[çc][ãa]o Cong[êe]nere|Renova[çc][ãa]o)/i);

    // Prêmios
    r.premioLiquido = NUM(pick(/Pr[êe]mio L[íi]quido total\s*R\$\s*([\d.]+,\d{2})/i));
    if(r.premioLiquido==null) r.warnings.push('prêmio líquido total');
    // linha de pagamento: PL, Juros, IOF, Prêmio Total, forma, parcelas, 1ª parcela
    const mPag = /R\$\s*([\d.]+,\d{2})\s+R\$\s*([\d.]+,\d{2})\s+R\$\s*([\d.]+,\d{2})\s+R\$\s*([\d.]+,\d{2})\s+([A-Za-zÀ-ÿ]+)\s+(\d+)\s+R\$\s*([\d.]+,\d{2})/.exec(t);
    if(mPag){ r.juros=NUM(mPag[2]); r.iof=NUM(mPag[3]); r.premioTotal=NUM(mPag[4]); r.formaPagamento=mPag[5]; r.parcelas=parseInt(mPag[6]); r.valorParcela=NUM(mPag[7]); }

    // COMISSÃO — código embutido: TSNC#### => #### / 100 = % sobre o prêmio líquido
    const mCom = /TSNC(\d{4})/.exec(t);
    if(mCom){ r.comissaoPct = parseInt(mCom[1])/100; r.comissaoCodigo='TSNC'+mCom[1]; }
    else { r.warnings.push('comissão (código TSNC)'); }
    if(r.comissaoPct!=null && r.premioLiquido!=null) r.comissaoValor = Math.round(r.premioLiquido*r.comissaoPct)/100;

    // Corretora
    const mCor=/(\d{6})\s+(RETORNO[^\n]*?CORRETORA[^\n]*?)(?:\s{2,}|$)/i.exec(t) || /(\d{6})\s+(RETORNO)/i.exec(t);
    if(mCor){ r.corretoraCodigo=mCor[1]; r.corretora=clean(mCor[2]).slice(0,60); }

    // Coberturas
    r.coberturas = extrairCoberturas(t);

    return r;
  }

  function extrairCoberturas(t){
    const ini=t.indexOf('Descrição'); if(ini<0) return [];
    const fim=t.indexOf('Prêmio Líquido total', ini);
    const bloco = fim>ini ? t.slice(ini, fim) : t.slice(ini, ini+1500);
    const out=[];
    for(let i=0;i<COBERTURAS_CONHECIDAS.length;i++){
      const nome=COBERTURAS_CONHECIDAS[i];
      const p=bloco.indexOf(nome); if(p<0) continue;
      const prox = COBERTURAS_CONHECIDAS.slice(i+1).map(n=>bloco.indexOf(n,p+nome.length)).filter(x=>x>0).sort((a,b)=>a-b)[0] || bloco.length;
      const trecho = bloco.slice(p+nome.length, prox);
      const mPremio = /R\$\s*([\d.]+,\d{2})/g; let last=null,mm; while((mm=mPremio.exec(trecho))) last=mm[1];
      const lmi = clean(trecho.replace(/R\$\s*[\d.]+,\d{2}\s*$/,'').replace(/\s+$/,'')) || '-';
      out.push({ nome, lmi: lmi||'-', premio: last? NUM(last):0 });
    }
    return out;
  }

  /* ======================================================================
     EXTRATOR GENÉRICO DE AUTO (Yelum/Aliro, Bradesco, HDI, Porto, Azul)
     A comissão NÃO vem impressa nessas propostas → fica editável.
     ====================================================================== */
  function detectarSeguradora(t){
    if(/AZUL TRADICIONAL|Azul Tradicional|Azul Seguros/i.test(t)) return 'Azul';
    if(/portoseguro\.com|Porto Seguro|PROPOSTA DE SEGUROS AUTOM[ÓO]VEL RCF-V/i.test(t)) return 'Porto Seguro';
    if(/Yelum Seguros|YELUM/i.test(t) || /ALIRO|Aliro/i.test(t)) return 'Yelum';
    if(/Bradesco Auto\/?Re|Bradesco Auto/i.test(t)) return 'Bradesco';
    if(/HDI SEGUROS|HDI Auto/i.test(t)) return 'HDI';
    return 'Seguradora';
  }
  // CNPJs de seguradoras/corretora que NÃO são o segurado
  const CNPJ_BLOCK=['92682038','61198164','61550141','26430936','33164021'];
  const NOME_STOP=new Set(['REGISTRO','DADOS','GERAIS','NOME','HORA','QUANT','SINISTRO','PROPONENTE','NASCIMENTO','CONDUTOR','SEGURADO','SEGURADOA','PROPOSTA','RG','BONUS','BÔNUS','TRADICIONAL','APP','BR','CPF','CNPJ','EMISSOR','ÓRGÃO','ORGAO','PERFIL','AUTO','ESPECIFICAÇÃO','SOCIAL','QUADRO','PRINCIPAL','PROPRIETÁRIO','PROPRIETARIO','RESIDENCIAL','PARTICULAR','RAMO','RAMOS','APOLICE','APÓLICE']);
  const CONECT=new Set(['de','da','do','dos','das','e']);
  function acharSegurado(t){
    const re=/(\d{3}\.\d{3}\.\d{3}-\d{2}|\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/g; let m;
    const todos=[]; while((m=re.exec(t))){ todos.push({cpf:m[1],idx:m.index,dig:m[1].replace(/\D/g,'')}); }
    if(!todos.length) return null;
    // primeiro que não seja CNPJ de seguradora/corretora
    const bom=todos.find(x=>!CNPJ_BLOCK.includes(x.dig.slice(0,8)));
    return bom||todos[0];
  }
  function nomeAntesCpf(t,idx){ let w=t.slice(Math.max(0,idx-95),idx);
    w=w.replace(/\d[\d.\/-]*\d/g,' ').replace(/[:()\-\/]/g,' ');
    w=w.split(/\s+/).filter(tk=>tk && !NOME_STOP.has(tk.toUpperCase().replace(/\./g,''))).join(' ');
    const toks=w.trim().split(/\s+/); const nameToks=[];
    for(let i=toks.length-1;i>=0 && nameToks.length<6;i--){ if(/^[A-Za-zÀ-ÿ'’.&]{2,}$/.test(toks[i])) nameToks.unshift(toks[i]); else break; }
    while(nameToks.length && CONECT.has(nameToks[0].toLowerCase())) nameToks.shift(); // apara "de/da/do" no início
    return clean(nameToks.join(' '))||null; }
  function premioApos(t,label){ const i=t.search(new RegExp(label,'i')); if(i<0) return null;
    const m=/(\d{1,3}(?:\.\d{3})*,\d{2})/.exec(t.slice(i, i+220)); return m?NUM(m[1]):null; }
  /* ---------- marca a partir do modelo (propostas que não imprimem a marca) ---------- */
  const BRANDS=['VOLKSWAGEN','VW','FIAT','CHEVROLET','GM','FORD','HYUNDAI','TOYOTA','HONDA','RENAULT','NISSAN','JEEP','PEUGEOT','CITROEN','CITROËN','KIA','MITSUBISHI','VOLVO','BMW','MERCEDES','AUDI','CHERY','CAOA','RAM','BYD','GWM','SUZUKI','JAC','LAND','MINI','PORSCHE','SUBARU','LEXUS'];

  function brandFromModel(modelo){ if(!modelo) return null; const tk=modelo.trim().split(/\s+/)[0].toUpperCase();
    if(BRANDS.includes(tk)) return modelo.trim().split(/\s+/)[0];
    return MODEL_BRAND[tk]||null; }

  /* ---------- helpers compartilhados dos templates novos ---------- */
  const VIG_PATTERNS=[
    /das?\s*24\s*h(?:oras)?\s*(?:de|do dia)\s*(\d{2}\/\d{2}\/\d{4})\s*(?:às|ate|até|as)\s*(?:as\s*)?24\s*h(?:oras)?\s*(?:de|do dia)\s*(\d{2}\/\d{2}\/\d{4})/i,
    /(\d{2}\/\d{2}\/\d{4})\s*(?:a|à|até|-)\s*(\d{2}\/\d{2}\/\d{4})/
  ];
  function acharVigencia(t,r){ for(const p of VIG_PATTERNS){ const m=p.exec(t); if(m){ r.vigenciaInicio=m[1]; r.vigenciaFim=m[2]; return; } } r.warnings.push('vigência'); }
  function montarEndereco(r){ r.enderecoCompleto=[ (r.logradouro||'')+(r.numero?', '+r.numero:''), r.bairro||'', (r.cidade||'')+(r.estado?'/'+r.estado:''), r.cep?'CEP '+r.cep:'' ].filter(x=>x&&x!=='/').join(' · ')||null; }
  function comissaoDe(r,pct,cod){ if(pct!=null&&pct>=1&&pct<=60){ r.comissaoPct=Math.round(pct*100)/100; r.comissaoCodigo=cod||null; r.comissaoManual=false;
      if(r.premioLiquido!=null) r.comissaoValor=Math.round(r.premioLiquido*r.comissaoPct)/100; }
    else { r.comissaoPct=null; r.comissaoValor=null; r.comissaoManual=true; } }

  /* ---------- YELUM / ALIRO ---------- */
  function yelumAuto(t){
    const r=genericoAuto(t); r.seguradora=/ALIRO|Aliro/i.test(t)?'Aliro (Yelum)':'Yelum';
    // veículo
    const mv=/C[óo]digo FIPE\s+Marca\/Tipo do Ve[íi]culo\s+Ano Fabrica[çc][ãa]o\/Modelo\s+(\d{6}-\d)\s+(.+?)\s*\((\w+)\)\s*(\d{4})\/(\d{4})/i.exec(t);
    if(mv){ r.codigoFipe=mv[1]; r.modelo=clean(mv[2]); r.fabricante=brandFromModel(r.modelo); r.combustivel=mv[3]; r.anoModelo=mv[5]; }
    // endereço completo
    const me=/Endere[çc]o\s+Bairro\s+CEP\s+(.+?)\s+(\d{5}-?\d{3})\s+Cidade\s+UF\s+Telefone\s+Celular\s+E-?Mail\s+(.+?)\s+([A-Z]{2})\s+(\([\d ]{2,4}\)\s*\d{7,9})\s+(\([\d ]{2,4}\)\s*\d{8,9})\s+([\w.+-]+@[\w.-]+)/i.exec(t);
    if(me){ const blob=clean(me[1]); const toks=blob.split(' ');
      r.bairro=toks[toks.length-1]; r.logradouro=blob.replace(/\s+\S+$/,''); r.cep=me[2].replace(/^(\d{5})(\d{3})$/,'$1-$2');
      r.cidade=clean(me[3]); r.estado=me[4]; r.telefone=clean(me[5]); r.celular=clean(me[6]); r.email=me[7]; montarEndereco(r); }
    // prêmios: linha após Juros(%)
    const mp=/Pr[êe]mio L[íi]quido \(R\$\)[\s\S]{0,120}?Juros\s*\(%\)\s+((?:[\d.]+,\d{2}\s+){3,6})/i.exec(t);
    if(mp){ const nums=mp[1].trim().split(/\s+/).map(NUM); r.premioLiquido=nums[0]; r.premioTotal=Math.max(...nums);
      const iof=nums.find(v=>v>0&&Math.abs(r.premioLiquido+v-r.premioTotal)<2); if(iof!=null) r.iof=iof; }
    // parcelas: 1+11(CC)
    const mpc=/(\d)\s*\+\s*(\d{1,2})\s*\((CC|DB|FI|CP)\)[\s\S]{0,120}?([\d.]+,\d{2})/i.exec(t);
    if(mpc){ r.parcelas=parseInt(mpc[1])+parseInt(mpc[2]); r.valorParcela=NUM(mpc[4]); r.formaPagamento=mpc[3]==='CC'?'Cartão':mpc[3]==='DB'?'Débito':'Boleto'; }
    else { const av=/[àa] vista/i.test(t); if(av){ r.parcelas=1; r.valorParcela=r.premioTotal; } }
    // coberturas (NOME ... LMI premio franquia)
    r.coberturas=[]; const nomes=[['BASICA - 01-COMPREENSIVA','Compreensiva (casco)'],['DANOS MATERIAIS','RCF - Danos Materiais'],['DANOS CORPORAIS','RCF - Danos Corporais'],['DANOS MORAIS E EST','RCF - Danos Morais e Estéticos'],['ACIDENTES PESSOAIS','APP - Acidentes Pessoais'],['ASSISTENCIA','Assistência'],['VIDROS','Vidros']];
    for(const [chave,label] of nomes){ const i=t.indexOf(chave); if(i<0) continue; const tr=t.slice(i,i+220);
      const nums=(tr.match(/[\d.]{1,12},\d{2}/g)||[]).slice(0,3);
      const lmi=(/VMR FIPE x [\d.,]+%/.exec(tr)||[])[0] || (nums[0]&&NUM(nums[0])>1000?('R$ '+nums[0]):'-');
      let premio=null; if(nums.length>=2){ premio=NUM(lmi.startsWith('R$')?nums[1]:nums[0]); }
      r.coberturas.push({nome:label,lmi,premio:premio||0}); }
    // comissão: não impressa
    comissaoDe(r,null,null);
    r.warnings=r.warnings.filter(w=>w!=='vigência'||!r.vigenciaInicio);
    return r;
  }

  /* ---------- BRADESCO ---------- */
  function bradescoAuto(t){
    const r=genericoAuto(t); r.seguradora='Bradesco';
    const mv2=/das 24h de (\d{2}\/\d{2}\/\d{4}) às 24h de (\d{2}\/\d{2}\/\d{4})/i.exec(t);
    if(mv2){ r.vigenciaInicio=mv2[1]; r.vigenciaFim=mv2[2]; }
    const mc=/N[º°o]?\s*Cota[çc][ãa]o:?\s*(\d{6,}\/?\d*)/i.exec(t); if(mc) r.nrCotacao=mc[1];
    const mnp=/Proposta:?\s*(\d{6,})/i.exec(t); if(mnp) r.nrProposta=mnp[1];
    const mfipe=/C[óo]digo FIPE:?\s*[^\d]{0,20}(\d{6}-\d)/i.exec(t); if(mfipe) r.codigoFipe=mfipe[1];
    // prêmios: sequência numérica após "Total a pagar:" — acha o trio a+b=c (líquido+IOF=total)
    const mrun=/Total a pagar:\s*((?:[\d.]+,\d{2}\s+){3,9})/i.exec(t);
    if(mrun){ const nums=mrun[1].trim().split(/\s+/).map(NUM).filter(v=>v!=null);
      outer: for(const c of [...nums].sort((a,b)=>b-a)){ for(const a of nums){ for(const b of nums){
        if(a>0&&b>0&&a!==c&&b!==c&&Math.abs(a+b-c)<0.02){ r.premioTotal=c; r.premioLiquido=Math.max(a,b); r.iof=Math.min(a,b); break outer; } } } }
      const sobra=nums.find(v=>v>0&&v!==r.premioTotal&&v!==r.premioLiquido&&v!==r.iof);
      if(sobra&&r.premioTotal){ r.valorParcela=sobra; r.parcelas=Math.max(1,Math.round(r.premioTotal/sobra)); }
    }
    // coberturas: lista com códigos (108), (006)...
    r.coberturas=[]; const mcob=/Cobertura\s+([\s\S]{0,600}?)(?:PR[ÊE]MIO|DADOS|FRANQUIA|OBJETO)/i.exec(t);
    if(mcob){ const linhas=mcob[1].match(/[A-ZÀ-Ÿa-zà-ÿ /-]{6,60}\(\d{3}\)/g)||[];
      linhas.slice(0,12).forEach(l=>r.coberturas.push({nome:clean(l),lmi:'-',premio:0})); }
    // COMISSÃO: código CPD: xxxxxx - NNNN
    const mcpd=/CPD:?\s*\d{4,8}\s*-\s*(\d{3,5})/i.exec(t);
    comissaoDe(r, mcpd?parseInt(mcpd[1])/100:null, mcpd?('CPD-'+mcpd[1]):null);
    return r;
  }

  /* ---------- HDI ---------- */
  function hdiAuto(t){
    const r=genericoAuto(t); r.seguradora='HDI';
    const mn=/Nome do Segurado\s*:\s*(.+?)\s+CPF/i.exec(t); if(mn) r.segurado=clean(mn[1]).toUpperCase();
    const mv=/Modelo\s*:\s*\d*\s*-?\s*(.+?)\s+Renavam/i.exec(t); if(mv){ r.modelo=clean(mv[1]); r.fabricante=brandFromModel(r.modelo); }
    const mfipe=/C[óo]digo FIPE\s*:\s*(\d{6}-\d)/i.exec(t); if(mfipe) r.codigoFipe=mfipe[1];
    const mano=/Ano Fabr?\.?\/?Modelo\s*:\s*(\d{4})\/(\d{4})/i.exec(t); if(mano) r.anoModelo=mano[2];
    const me=/Endere[çc]o\s*:\s*(.+?)\s+Celular\s*:\s*\(?0?(\d{2,4})\)?\s*(\d{8,9})/i.exec(t);
    if(me){ r.logradouro=clean(me[1]); r.celular='('+me[2].slice(-2)+') '+me[3]; }
    const mb=/Bairro\s*:\s*(.+?)\s+Cidade\s*:\s*(.+?)\s*-\s*([A-Z]{2})\s+CEP\s*:\s*(\d{5}-?\d{3})/i.exec(t);
    if(mb){ r.bairro=clean(mb[1]); r.cidade=clean(mb[2]); r.estado=mb[3]; r.cep=mb[4].replace(/^(\d{5})(\d{3})$/,'$1-$2'); montarEndereco(r); }
    const mpl=/Pr[êe]mio L[íi]quido\s*:\s*([\d.]+,\d{2})/i.exec(t); if(mpl) r.premioLiquido=NUM(mpl[1]);
    const miof=/I\.?O\.?F\.?\s*:\s*([\d.]+,\d{2})/i.exec(t); if(miof) r.iof=NUM(miof[1]);
    const mpt=/Pr[êe]mio Total\s*:\s*([\d.]+,\d{2})/i.exec(t); if(mpt) r.premioTotal=NUM(mpt[1]);
    const mpc=/Parcela\s*:\s*([\d.]+,\d{2})\s+Forma de Pagamento\s*:\s*(\d{1,2})\s*x/i.exec(t);
    if(mpc){ r.valorParcela=NUM(mpc[1]); r.parcelas=parseInt(mpc[2]); }
    const mfr=/Franquia\s*:\s*([^\n]{3,45}?)\s+(?:CEP|Regi)/i.exec(t); if(mfr) r.franquia=clean(mfr[1]);
    const mcob=/Cobertura\s*:\s*([^\n]{3,60}?)\s+Regi[ãa]o/i.exec(t); if(mcob) r.coberturas=[{nome:clean(mcob[1]),lmi:'-',premio:0}];
    // COMISSÃO: par NNNNNNN-NNNNNNN → primeiro grupo /100
    const mcom=/\b(\d{7})-(\d{7})\b/.exec(t);
    comissaoDe(r, mcom?parseInt(mcom[1])/100:null, mcom?(mcom[1]+'-'+mcom[2]):null);
    return r;
  }

  /* ---------- PORTO SEGURO / AZUL ---------- */
  function portoAuto(t){
    const isRcf=/PROPOSTA DE SEGUROS AUTOM[ÓO]VEL RCF-V/i.test(t);
    const r=genericoAuto(t);
    r.seguradora=/AZUL TRADICIONAL|Azul Tradicional|Azul Seguros/i.test(t)?'Azul':'Porto Seguro';
    if(isRcf){
      const mn=/Segurado(?:\(a\))?(?:\s*\/\s*Condutor)?:?\s+([A-ZÀ-Ÿ][A-ZÀ-Ÿ'’. ]{4,55}?)\s+(?:Nascimento|CPF|CNPJ)/.exec(t)
        || /Condutor:?\s+([A-ZÀ-Ÿ][A-ZÀ-Ÿ'’ ]{4,55}?)\s+CPF/.exec(t);
      if(mn) r.segurado=clean(mn[1]);
      const mpcond=/Principal Condutor:?\s*([A-ZÀ-Ÿ][A-ZÀ-Ÿ'’. ]{4,55}?)\s+CPF/.exec(t);
      if(mpcond){ r.principalCondutor=clean(mpcond[1]);
        r.condutorProprio = r.segurado ? r.principalCondutor.toUpperCase()===r.segurado.toUpperCase() : null; }
      const mv=/Ve[íi]culo\s+Ano Fabrica[çc][ãa]o\s*\/\s*Modelo\s+Portas\/Combust[íi]vel\s+\d+\s*-\s*-?\s*(.+?)\s+(\d{4})\s*\/\s*(\d{4})\s+\d\/(\w+)/i.exec(t);
      if(mv){ r.modelo=clean(mv[1]); r.fabricante=brandFromModel(r.modelo); r.anoModelo=mv[3]; r.combustivel=mv[4]; }
      const me=/Endere[çc]o Residencial\s+(.+?)\s+Complemento\s+(\S+)\s+CEP\s+(\d{5}-?\d{3})\s+U\.?F\.?\s+([A-Z]{2})\s+Bairro\s+(.+?)\s+Cidade\s+(.+?)\s+E-?mail/i.exec(t);
      if(me){ r.logradouro=clean(me[1]); r.numero=null; r.cep=me[3].replace(/^(\d{5})(\d{3})$/,'$1-$2'); r.estado=me[4]; r.bairro=clean(me[5]); r.cidade=clean(me[6]); montarEndereco(r); }
      const mp=/Pr[êe]mio Total L[íi]quido:\s*IOF:\s*Pr[êe]mio Total:\s*R\$\s*([\d.]+,\d{2})\s*\+\s*R\$\s*([\d.]+,\d{2})\s*R\$\s*([\d.]+,\d{2})/i.exec(t);
      if(mp){ r.premioLiquido=NUM(mp[1]); r.iof=NUM(mp[2]); r.premioTotal=NUM(mp[3]); }
      const mpc=/(\d{1,2})x\s+TODAS[\s\S]{0,60}?R\$\s*([\d.]+,\d{2})/i.exec(t);
      if(mpc){ r.parcelas=parseInt(mpc[1]); r.valorParcela=(r.premioTotal&&r.parcelas)?Math.round(r.premioTotal/r.parcelas*100)/100:NUM(mpc[2]); r.formaPagamento='Cartão'; }
      // coberturas
      r.coberturas=[]; const mcasco=/COMPREENSIVA\s+([\d.]+,?\d*%)\s+R\$\s*([\d.]+,\d{2})[\s\S]{0,60}?R\$\s*([\d.]+,\d{2})/i.exec(t);
      if(mcasco) r.coberturas.push({nome:'Compreensiva (casco)',lmi:'LMI R$ '+mcasco[3]+' ('+mcasco[1]+')',premio:NUM(mcasco[2])});
      [['DANOS MATERIAIS','RCF - Danos Materiais'],['DANOS CORPORAIS','RCF - Danos Corporais'],['DANOS MORAIS','Danos Morais']].forEach(([k,lab])=>{
        const i=t.indexOf(k); if(i<0) return; const tr=t.slice(i,i+120); const nums=tr.match(/R\$\s*[\d.]+,\d{2}/g)||[];
        r.coberturas.push({nome:lab,lmi:nums[0]||'-',premio:nums[1]?NUM(nums[1].replace('R$','')):0}); });
      const mfr=/Franquia:?\s*([^\n]{3,40}?)(?:\s{2,}|Var\.|LMI|$)/i.exec(t); if(mfr) r.franquia=clean(mfr[1]);
      comissaoDe(r,null,null); // RCF não imprime comissão
    } else {
      const mn=/Segurado\(a\)\s+([A-ZÀ-Ÿ0-9][A-ZÀ-Ÿ0-9'’.& ]{2,55}?)\s+(?:Nascimento|CNPJ|CPF)/.exec(t); if(mn) r.segurado=clean(mn[1]);
      const mv=/Ve[íi]culo\s+\d+\s*-\s*-?\s*(.+?)\s+Ve[íi]culo\s+([A-Z]{3}\d[A-Z0-9]\d{2})\s+Placa\s+([A-HJ-NPR-Z0-9]{17})\s+Chassi\s+(\d{4})\s*\/\s*(\d{4})/i.exec(t);
      if(mv){ r.modelo=clean(mv[1]); r.fabricante=brandFromModel(r.modelo); r.placa=mv[2]; r.chassi=mv[3]; r.anoModelo=mv[5]; }
      const me=/Endere[çc]o residencial\s+(.+?)\s+Complemento\s+(\S+)\s+CEP\s+(\d{5}-?\d{3})\s+UF\s+([A-Z]{2})\s+Bairro\s+(.+?)\s+Cidade\s+(.+?)\s+E-?mail/i.exec(t);
      if(me){ r.logradouro=clean(me[1]); r.cep=me[3].replace(/^(\d{5})(\d{3})$/,'$1-$2'); r.estado=me[4]; r.bairro=clean(me[5]); r.cidade=clean(me[6]); montarEndereco(r); }
      const mp=/R\$\s*([\d.]+,\d{2})\s+R\$\s*([\d.]+,\d{2})\s+R\$\s*[\d.]+,\d{2}\s+R\$\s*[\d.]+,\d{2}\s+R\$\s*([\d.]+,\d{2})\s+(\d{1,2})x\s*R\$\s*([\d.]+,\d{2})/i.exec(t);
      if(mp){ r.premioLiquido=NUM(mp[1]); r.iof=NUM(mp[2]); r.premioTotal=NUM(mp[3]); r.parcelas=parseInt(mp[4]); r.valorParcela=NUM(mp[5]); }
      // coberturas
      r.coberturas=[]; const ic=t.search(/Coberturas e servi[çc]os/i);
      if(ic>=0){ const bloco=t.slice(ic,ic+900);
        [['Compreensiva','Compreensiva (casco)'],['Danos materiais','RCF - Danos Materiais'],['Danos corporais','RCF - Danos Corporais'],['Danos morais','Danos Morais'],['Assist','Assistência'],['Carro reserva','Carro reserva'],['Vidros','Vidros']].forEach(([k,lab])=>{
          const i=bloco.search(new RegExp(k,'i')); if(i<0) return; const tr=bloco.slice(i,i+150);
          const nums=tr.match(/R\$\s*[\d.]+,\d{2}|[\d.]+,?\d*%/g)||[];
          r.coberturas.push({nome:lab,lmi:nums.slice(0,2).join(' · ')||'-',premio:0}); }); }
      // COMISSÃO: código de uso interno YYYYMMDD.02.NNNNC.
      const mcom=/\.0\d\.(\d{4})C\./.exec(t);
      let pct=null; if(mcom){ const v=parseInt(mcom[1]); pct=v>=100?v/100:(v>0?v:null); }
      comissaoDe(r,pct,mcom?('.'+mcom[1]+'C'):null);
    }
    r.warnings=r.warnings.filter(w=>w!=='vigência'||!r.vigenciaInicio);
    return r;
  }

  function genericoAuto(t){
    const seg=detectarSeguradora(t);
    const r={ seguradora:seg, ramo:'Auto', warnings:[], comissaoManual:true };
    const pick=(re,g=1)=>{ const m=re.exec(t); return m?clean(m[g]):null; };
    // Segurado + CPF (ignora CNPJ de seguradora/corretora)
    const sg=acharSegurado(t);
    if(sg){ r.cpfCnpj=sg.cpf; r.segurado=nomeAntesCpf(t,sg.idx); if(!r.segurado) r.warnings.push('nome do segurado'); }
    else r.warnings.push('CPF / nome');
    // Contato
    const mMail=/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/.exec(t); if(mMail) r.email=mMail[0];
    // telefone precisa de separador (evita pegar dígitos de CPF)
    const cpfDig=(r.cpfCnpj||'').replace(/\D/g,'');
    const mFone=/\(?\d{2}\)?\s?9?\d{4}[-\s]\d{4}/g; const fones=[]; let mm; while((mm=mFone.exec(t))&&fones.length<10){ const d=mm[0].replace(/\D/g,''); if(d!==cpfDig) fones.push(mm[0]); }
    const cel=fones.find(f=>f.replace(/\D/g,'').length>=11)||fones[0]; if(cel) r.celular=clean(cel);
    // Veículo
    const mPlaca=/\b([A-Z]{3}-?\d[A-Z0-9]\d{2})\b/.exec(t); if(mPlaca) r.placa=mPlaca[1];
    const mChassi=/\b([A-HJ-NPR-Z0-9]{17})\b/.exec(t); if(mChassi) r.chassi=mChassi[1];
    const mAno=/\b(19|20)\d{2}\s*\/\s*((?:19|20)\d{2})\b/.exec(t); if(mAno) r.anoModelo=mAno[2];
    else { const a2=/[Aa]no\s*[/ ]?\s*[Mm]odelo\D{0,15}((?:19|20)\d{2})/.exec(t); if(a2) r.anoModelo=a2[1]; }
    r.codigoFipe = pick(/\b(\d{6}-\d)\b/);
    const mComb=new RegExp('\\b('+COMB+')\\b','i').exec(t); if(mComb) r.combustivel=clean(mComb[1]);
    // Fabricante/modelo — só aceita se parecer um veículo de verdade (evita texto de rótulo)
    const mVeic=/(?:Marca\s*\/?\s*Modelo|Marca e Modelo|Ve[íi]culo\/Modelo)\s*[:\-]?\s*([A-ZÀ-Ÿ][A-ZÀ-Ÿ0-9 ./-]{4,45})/i.exec(t);
    if(mVeic){ const cand=clean(mVeic[1]);
      if(!/segurado|c[óo]digo|marca|tipo\b|ano\b|fabri|fipe|proponente|placa/i.test(cand)){ const partes=cand.split(/\s+/); r.fabricante=partes[0]; r.modelo=cand; } }
    // Vigência (várias formas, inclusive "das 24h do dia X às 24h do dia Y")
    acharVigencia(t,r);
    // Prêmios
    r.premioLiquido = premioApos(t,'Pr[êe]mio\\s*L[íi]quido');
    r.premioTotal = premioApos(t,'Pr[êe]mio\\s*Total');
    if(r.premioLiquido==null && r.premioTotal==null) r.warnings.push('prêmio');
    // Parcelas
    const mParc=/(\d{1,2})\s*x\s*(?:de\s*)?R?\$?\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i.exec(t)
      || /Quant[^\d]{0,10}(\d{1,2})[^\d]{0,20}(\d{1,3}(?:\.\d{3})*,\d{2})/i.exec(t);
    if(mParc){ r.parcelas=parseInt(mParc[1]); r.valorParcela=NUM(mParc[2]); }
    // Comissão: não vem impressa nessas seguradoras → editável (não conta como erro)
    r.comissaoPct=null; r.comissaoValor=null; r.comissaoManual=true;
    // Endereço/CEP (melhor esforço)
    const mCep=/\b(\d{5}-?\d{3})\b/.exec(t); if(mCep) r.cep=mCep[1].replace(/^(\d{5})(\d{3})$/,'$1-$2');
    r.coberturas=[]; // coberturas por seguradora entram numa próxima rodada
    return r;
  }

  /* ---------- Detecção de seguradora + roteamento ---------- */
  const TEMPLATES=[
    { nome:'Tokio Marine', ramo:'Auto', teste:t=>/Tokio Marine/i.test(t)&&/Auto/i.test(t), parse:tokioMarineAuto },
    { nome:'Yelum / Aliro', ramo:'Auto', teste:t=>/Yelum Seguros|YELUM|ALIRO|Aliro/i.test(t), parse:yelumAuto },
    { nome:'Porto Seguro / Azul', ramo:'Auto', teste:t=>/PROPOSTA DE SEGUROS AUTOM[ÓO]VEL RCF-V|portoseguro\.com|AZUL TRADICIONAL|Proposta de Seguro Auto\b/i.test(t), parse:portoAuto },
    { nome:'Bradesco', ramo:'Auto', teste:t=>/Bradesco Auto\/?Re/i.test(t), parse:bradescoAuto },
    { nome:'HDI', ramo:'Auto', teste:t=>/HDI SEGUROS|HDI Auto/i.test(t), parse:hdiAuto },
  ];

  function parseProposta(texto){
    const t = texto || '';
    const tpl = TEMPLATES.find(x=>x.teste(t));
    if(!tpl){
      return { reconhecido:false, seguradora:null,
        warnings:['Formato não reconhecido. O sistema conhece: '+TEMPLATES.map(x=>x.nome+' ('+x.ramo+')').join(', ')+'. Se for uma seguradora nova ou o layout mudou, me avise para eu ensinar o padrão.'],
        textoBruto:t.slice(0,4000) };
    }
    const r = tpl.parse(t);
    r.reconhecido = true;
    // sanitiza avisos: remove os que foram resolvidos pelo template
    r.warnings=(r.warnings||[]).filter(w=>{
      if(/vig[êe]ncia/i.test(w)) return !r.vigenciaInicio;
      if(/pr[êe]mio/i.test(w)) return r.premioLiquido==null&&r.premioTotal==null;
      if(/nome|CPF/i.test(w)) return !r.segurado;
      return true; });
    r.confianca = r.warnings.length===0 ? 'alta' : (r.warnings.length<=2?'média':'baixa');
    return r;
  }

  root.parseProposta = parseProposta;
  root.__PROPOSTA_TEMPLATES = TEMPLATES;
})(typeof window!=='undefined'?window:globalThis);

    CACHE.beneficiarios=s.docs.map(d=>({id:d.id,...d.data()}));
    const r=(location.hash||'#dashboard').slice(1);
    if(r==='movimentacoes' && MOV_STATE.empresaId) VIEWS.movimentacoes();
    if(r==='empresas') VIEWS.empresas();
  },err=>console.warn('benef',err)));

  // Coleções da Fase 3 (tempo real)
  const listen=(coll,key,routes)=>LISTENERS.push(db.collection(coll).onSnapshot(s=>{
    CACHE[key]=s.docs.map(d=>({id:d.id,...d.data()}));
    if(key==='apolices'){ setBadge('renov',CACHE.apolices.filter(a=>{const d=diasAte(a.dataFimVigencia);return d!=null&&d<=60;}).length); checarFipeAuto(); }
    if(key==='resgates') setBadge('resg',CACHE.resgates.filter(r=>r.status==='pendente').length);
    if(key==='apolices'||key==='resgates') atualizarNotificacoes();
    if(key==='interacoes'&&FICHA_LEAD&&document.getElementById('modalRoot').classList.contains('open')){ const c=document.getElementById('tlList'); if(c) c.outerHTML=renderTimeline(FICHA_LEAD); }
    reRender(routes);
  },err=>console.warn(coll,err)));
  listen('apolices_cliente','apolices',['apolices','clientes','renovacoes','relatorios','contatos','pagamentos']);
  listen('indicadores','indicadores',['indicacoes']);
  listen('empresas_parceiras','parceiros',['parceiros']);
  listen('resgates_parceiros','resgates',['resgates']);
  listen('seguidores_instagram','seguidores',['instagram']);
  listen('admins_crm','admins',['funcionarios','relatorios','agenda','pagamentos']);
  LISTENERS.push(db.collection('contas_fixas').onSnapshot(sn=>{
    CONTAS_FIXAS=sn.docs.map(d=>({id:d.id,...d.data()}));
    if(typeof CP_CARREGOU==='object') CP_CARREGOU.fixas=true;
    if(typeof cpGerarAutomatico==='function') cpGerarAutomatico(true);
    if((location.hash||'').slice(1)==='contas') VIEWS.contas();
  },e=>console.error('contas_fixas',e)));
  LISTENERS.push(db.collection('contas_pagar').onSnapshot(sn=>{
    CONTAS=sn.docs.map(d=>({id:d.id,...d.data()}));
    if(typeof CP_CARREGOU==='object') CP_CARREGOU.contas=true;
    if(typeof cpAtualizarBadge==='function') cpAtualizarBadge();
    if(typeof cpGerarAutomatico==='function') cpGerarAutomatico();
    if((location.hash||'').slice(1)==='contas') VIEWS.contas();
  },e=>console.error('contas_pagar',e)));
  LISTENERS.push(db.collection('folha_pagamento').onSnapshot(sn=>{
    FOLHA=sn.docs.map(d=>({id:d.id,...d.data()}));
    if((location.hash||'').slice(1)==='pagamentos') VIEWS.pagamentos();
  },e=>console.error('folha',e)));
  LISTENERS.push(db.collection('agenda_fixas').onSnapshot(sn=>{
    AG_FIXAS=sn.docs.map(d=>({id:d.id,...d.data()}));
    if(typeof agGerarRecorrentes==='function') agGerarRecorrentes(true);
    if((location.hash||'').slice(1)==='agenda') VIEWS.agenda();
  },e=>console.error('agenda_fixas',e)));
  LISTENERS.push(db.collection('agenda_crm').onSnapshot(sn=>{
    AGENDA=sn.docs.map(d=>({id:d.id,...d.data()}));
    if(typeof agAtualizarBadge==='function') agAtualizarBadge();
    const r=(location.hash||'#dashboard').slice(1);
    if(r==='agenda') VIEWS.agenda(); else if(r==='dashboard'&&VIEWS.dashboard) VIEWS.dashboard();
  },e=>console.error('agenda',e)));
  listen('seguradoras','seguradoras',['configuracoes']);
  listen('interacoes_crm','interacoes',[]);
  listen('propostas','propostas',['propostas','contatos']);
  if(typeof ctEscutarSite==='function') ctEscutarSite();
  listen('fipe_historico','fipeHist',['fipe']);
  atualizarNotificacoes();

  router();
}

let LEADS_FILTER={busca:''};
let LEADS_VIEW='kanban';
/* O funil mostra a NEGOCIAÇÃO, não a pessoa: um cliente antigo com uma cotação
   nova em aberto precisa aparecer aqui (é o cross-sell). Antes, quem já tinha
   apólice sumia do kanban mesmo com cotação em andamento. */
function leadsAbertos(){ let l=CACHE.leads.filter(x=>{
    const st=x.status||'pre_cadastro';
    if(st==='negocio_fechado'||st==='negocio_perdido'||st==='cliente') return false;
    return true; });
  if(LEADS_FILTER.busca){ const q=LEADS_FILTER.busca.toLowerCase(); l=l.filter(x=>`${x.nome||''} ${x.nomeEmpresa||''} ${x.email||''} ${x.whatsapp||''} ${x.telefone||''}`.toLowerCase().includes(q)); }
  return l; }
VIEWS.leads=function(){
  const actions=`<div class="tabs" style="margin-right:6px"><button class="tab ${LEADS_VIEW==='kanban'?'active':''}" onclick="LEADS_VIEW='kanban';VIEWS.leads()"><i class="fas fa-columns"></i> Kanban</button><button class="tab ${LEADS_VIEW==='lista'?'active':''}" onclick="LEADS_VIEW='lista';VIEWS.leads()"><i class="fas fa-list"></i> Lista</button></div>

};
function renderKanban(){
  const leads=leadsAbertos();
  const totalFunil=leads.reduce((s,l)=>s+(Number(l.valorNegociacao)||0),0);
  return `${totalFunil?`<div style="font-size:.84rem;color:var(--text-2);margin-bottom:10px">
      <i class="fas fa-sack-dollar" style="color:var(--brand)"></i> Funil aberto: <b>${money(totalFunil)}</b> em ${leads.length} negócio(s)
      <span style="color:var(--text-3);margin-left:10px"><i class="fas fa-hand-pointer"></i> arraste o cartão para mudar de fase</span></div>`:''}
    <div class="kanban">${KANBAN.map(col=>{
    const items=leads.filter(l=>faseDoLead(l)===col.key);
    const soma=items.reduce((s,l)=>s+(Number(l.valorNegociacao)||0),0);
    return `<div class="kb-col" ondragover="lkOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="lkDrop(event,this,'${col.key}')">
      <div class="kb-head" style="border-top:3px solid ${col.cor}"><span><i class="fas ${col.icon}" style="color:${col.cor}"></i> ${col.label}</span><span class="kb-cnt">${items.length}</span></div>
      ${soma?`<div style="font-size:.76rem;color:var(--text-2);padding:0 2px 8px;font-weight:600">${money(soma)}</div>`:''}
      <div class="kb-body">
        ${items.map(l=>kanbanCard(l,col)).join('')||`<div style="text-align:center;color:var(--text-3);font-size:.78rem;padding:16px 0">arraste um cartão para cá</div>`}
      </div></div>`;
  }).join('')}</div>`;
}
let LK_DRAG=null;
function lkStart(e,id){ LK_DRAG=id; e.currentTarget.classList.add('arrastando');
  try{ e.dataTransfer.setData('text/plain',id); e.dataTransfer.effectAllowed='move'; }catch(x){} }
function lkEnd(e){ e.currentTarget.classList.remove('arrastando'); LK_DRAG=null;
  document.querySelectorAll('.kb-col.drop').forEach(el=>el.classList.remove('drop')); }
function lkOver(e,el){ e.preventDefault(); el.classList.add('drop'); }
function lkDrop(e,el,fase){ e.preventDefault(); el.classList.remove('drop');
  const id=LK_DRAG||e.dataTransfer.getData('text/plain'); if(!id) return;
  const l=CACHE.leads.find(x=>x.id===id); if(!l||faseDoLead(l)===fase) return;
  moverFase(id,fase); }
function kanbanCard(l,col){
  const idx=KANBAN.findIndex(k=>k.key===col.key);
  const orig=ORIGENS[l.origem]||l.origem;
  const resp=l.responsavelNome?`<span class="kb-resp" title="Responsável">${esc(initials(l.responsavelNome))}</span>`:`<span class="kb-resp vazio" title="Sem responsável">?</span>`;
  const retorno=l.proximoRetorno?agDiffDias?agDiffDias(l.proximoRetorno):null:null;
  return `<div class="kb-card" draggable="true" ondragstart="lkStart(event,'${l.id}')" ondragend="lkEnd(event)" onclick="abrirLead('${l.id}')">
    <div style="display:flex;justify-content:space-between;gap:6px;align-items:flex-start">
      <b style="font-size:.86rem">${esc(l.nomeEmpresa||l.nome||'Sem nome')}</b>${resp}</div>
    <div style="font-size:.76rem;color:var(--text-2);margin:3px 0">${esc(l.ramo||l.tipoSeguro||'—')}${l.valorFipe?' · '+esc(l.valorFipe):''}</div>
    ${l.valorNegociacao?`<div style="font-size:.86rem;font-weight:800;color:var(--brand-dark);margin:4px 0">${money(l.valorNegociacao)}
      ${l.comissaoPct?`<span style="font-size:.7rem;font-weight:600;color:var(--text-3)">· ${l.comissaoPct}% com.</span>`:''}</div>`:''}
    ${l.proximoRetorno?`<div style="font-size:.72rem;font-weight:600;color:${retorno!=null&&retorno<0?'var(--danger)':'var(--warn)'}">
      <i class="fas fa-bell"></i> retornar ${fmtData(l.proximoRetorno)}</div>`:''}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
      ${orig?`<span class="badge" style="background:var(--surface-3);color:var(--text-2);font-size:.66rem">${esc(orig)}</span>`:'<span></span>'}
      <div onclick="event.stopPropagation()" style="display:flex;gap:2px">
        <button class="kb-mv" title="Ler cotações e montar o orçamento" onclick="ppDoLead('${l.id}')"><i class="fas fa-scale-balanced"></i></button>
        ${idx>0?`<button class="kb-mv" title="Voltar fase" onclick="moverFase('${l.id}','${KANBAN[idx-1].key}')"><i class="fas fa-chevron-left"></i></button>`:''}
        ${idx<KANBAN.length-1?`<button class="kb-mv" title="Avançar fase" onclick="moverFase('${l.id}','${KANBAN[idx+1].key}')"><i class="fas fa-chevron-right"></i></button>`:''}
      </div></div></div>`;
}

/* ---------- PRÓ-RATA (mesma regra do Portal da Empresa) ---------- */
function diasNoMesN(ano,mes){ return new Date(ano,mes,0).getDate(); }
function strData(v){ if(!v) return null; if(v.toDate){ const d=v.toDate(); const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); } return String(v).slice(0,10); }
function dataObj(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function benefIni(b){ return b.vigenciaInicio||strData(b.dataInicio)||strData(b.criadoEm)||null; }
function benefFim(b){ return b.status!=='inativo'?null:(b.vigenciaFim||b.dataFim||strData(b.atualizadoEm)); }
function diasCobradosN(ano,mes,ini,fim){
  const dm=diasNoMesN(ano,mes), pI=new Date(ano,mes-1,1), pF=new Date(ano,mes-1,dm);
  const a=dataObj(ini), b=dataObj(fim);
  if(a&&a>pF) return 0; if(b&&b<pI) return 0;
  const de=(a&&a>pI)?a:pI, ate=(b&&b<pF)?b:pF;
  if(ate<de) return 0;
  return Math.max(0,Math.min(dm,Math.round((ate-de)/86400000)+1));
}
const arred2=n=>Math.round((Number(n)||0)*100)/100;
function faturaEmpresa(emp,ano,mes){
  const c=contratoDe(emp), dm=diasNoMesN(ano,mes), itens=[];
  const lista=CACHE.beneficiarios.filter(b=>(emp.id&&b.empresaId===emp.id)||((b.empresaNome||'').toLowerCase()===(emp.nomeEmpresa||'').toLowerCase()));
  lista.forEach(b=>{
    const k=b.plano; if(!k) return;
    const dias=diasCobradosN(ano,mes,benefIni(b),benefFim(b)); if(dias<=0) return;
    const vv=(c.valores||{})[k]||{};
    const base=Number(b.titularidade==='dependente'?vv.dependente:vv.titular)||0;
    const valor=arred2(base*dias/dm);
    const pct=b.titularidade==='dependente'
      ? ((c.rateioDepEmpresaPct||{})[k]==null?0:Number((c.rateioDepEmpresaPct||{})[k])||0)
      : ((c.rateioTitEmpresaPct||{})[k]==null?100:Number((c.rateioTitEmpresaPct||{})[k])||0);
    const vEmp=arred2(valor*pct/100);
    itens.push({b,k,dias,dm,base,valor,vEmp,vFunc:arred2(valor-vEmp),integral:dias>=dm});
  });
  return { ano,mes,dm,itens,
    total:arred2(itens.reduce((s,i)=>s+i.valor,0)),
    totEmp:arred2(itens.reduce((s,i)=>s+i.vEmp,0)),
    totFunc:arred2(itens.reduce((s,i)=>s+i.vFunc,0)),
    prorata:itens.filter(i=>!i.integral).length };
}

/* ---------- Redesenho que NÃO derruba o cursor do campo de busca ----------
   Antes, cada tecla digitada refazia o innerHTML da tela e o input era destruído:
   dava para digitar só uma letra por vez. Agora guardamos o campo focado e a
   posição do cursor, e devolvemos os dois depois de redesenhar. */
function setView(html){
  const root=document.getElementById('viewRoot');
  const a=document.activeElement;
  const id=(a&&a.id&&root.contains(a))?a.id:null;
  let ini=null,fim=null;
  if(id){ try{ ini=a.selectionStart; fim=a.selectionEnd; }catch(e){} }
  root.innerHTML=html;
  if(id){
    const n=document.getElementById(id);
    if(n){ try{ n.focus({preventScroll:true}); }catch(e){ n.focus(); }
      if(ini!=null&&n.setSelectionRange){ try{ n.setSelectionRange(ini,fim); }catch(e){} } }
  }
}
/* espera o usuário parar de digitar antes de refazer a lista */
function redesenhar(view){ clearTimeout(window.__redrawT); window.__redrawT=setTimeout(view,180); }

/* =========================================================================
   PERFIL DA EQUIPE — faixa etária, tempo de casa e oportunidades de venda
   ========================================================================= */
const FAIXAS=[[0,18,'0 a 18'],[19,23,'19 a 23'],[24,28,'24 a 28'],[29,33,'29 a 33'],[34,38,'34 a 38'],
              [39,43,'39 a 43'],[44,48,'44 a 48'],[49,53,'49 a 53'],[54,58,'54 a 58'],[59,200,'59 ou mais']];
const faixaDe=i=>{ if(i==null) return null; const f=FAIXAS.find(([a,b])=>i>=a&&i<=b); return f?f[2]:null; };
function perfilEquipe(benef){
  const {titulares,orfaos}=agruparPessoas(benef);
  const deps=titulares.flatMap(t=>t.deps).concat(orfaos);
  const todos=[...titulares,...deps];
  const comIdade=todos.map(p=>({p,idade:idadeDe(p.docs[0].dataNascimento)})).filter(x=>x.idade!=null);
  const faixas={}; FAIXAS.forEach(([,,r])=>faixas[r]={total:0,tit:0,dep:0});
  comIdade.forEach(({p,idade})=>{ const r=faixaDe(idade); if(!r) return;
    faixas[r].total++; if(p.dep) faixas[r].dep++; else faixas[r].tit++; });
  const idades=comIdade.map(x=>x.idade).sort((a,b)=>a-b);
  const media=idades.length?Math.round(idades.reduce((s,i)=>s+i,0)/idades.length):null;
  const mediana=idades.length?idades[Math.floor(idades.length/2)]:null;
  const tempos=titulares.map(t=>tempoDeCasa(t.docs[0].dataAdmissao)).filter(m=>m!=null);
  const tempoMedio=tempos.length?Math.round(tempos.reduce((s,m)=>s+m,0)/tempos.length):null;
  const blocosTempo=[[0,11,'Menos de 1 ano'],[12,35,'1 a 3 anos'],[36,59,'3 a 5 anos'],[60,119,'5 a 10 anos'],[120,10000,'Mais de 10 anos']];
  const tempoDist={}; blocosTempo.forEach(([,,r])=>tempoDist[r]=0);
  tempos.forEach(m=>{ const b=blocosTempo.find(([a,z])=>m>=a&&m<=z); if(b) tempoDist[b[2]]++; });
  const porProduto={};
  ['saude','dental','vida','previdencia'].forEach(k=>{
    porProduto[k]={tit:titulares.filter(t=>t.produtos.includes(k)).length,
                   dep:deps.filter(d=>d.produtos.includes(k)).length};
  });
  const menores=comIdade.filter(x=>x.idade<18).length;
  const cinquentaMais=comIdade.filter(x=>x.idade>=50).length;
  return {titulares,deps,todos,comIdade,semIdade:todos.length-comIdade.length,faixas,media,mediana,
    tempoMedio,tempoDist,blocosTempo,porProduto,menores,cinquentaMais,tempos};
}

      <span>${rotulo}${extra?` <span style="color:var(--text-3);font-size:.76rem">${extra}</span>`:''}</span>

}

/* =========================================================================
   EDITAR DADOS PESSOAIS de um beneficiário (vale para todos os produtos dele)
   ========================================================================= */
function docsDaPessoa(cpfN,empId,nome){
  return CACHE.beneficiarios.filter(b=>{
    const mesmaEmp = empId ? b.empresaId===empId : true;
    const mesmoCpf = soDig(b.cpf)===soDig(cpfN);
    return mesmaEmp && (mesmoCpf || (!soDig(cpfN)&&(b.nome||'')===nome));
  });
}
function idadeDe(nasc){ const d=dataObj(nasc); if(!d) return null;
  const h=new Date(); let a=h.getFullYear()-d.getFullYear();
  const m=h.getMonth()-d.getMonth(); if(m<0||(m===0&&h.getDate()<d.getDate())) a--;
  return a>=0&&a<130?a:null; }
function tempoDeCasa(adm){ const d=dataObj(adm); if(!d) return null;
  const h=new Date(); let meses=(h.getFullYear()-d.getFullYear())*12+(h.getMonth()-d.getMonth());
  if(h.getDate()<d.getDate()) meses--;
  return meses>=0?meses:null; }
function fmtTempo(meses){ if(meses==null) return '—';
  const a=Math.floor(meses/12), m=meses%12;
  return a?(a+' ano'+(a>1?'s':'')+(m?' e '+m+' m':'')):(m+' mês'+(m!==1?'es':'')); }

  const n=document.getElementById('edpNasc');
  if(n) n.addEventListener('change',()=>{ const i=idadeDe(n.value);

async function salvarPessoa(){
  const cpfN=document.getElementById('edpCpfN').value, empId=document.getElementById('edpEmp').value;
  const docs=docsDaPessoa(cpfN,empId);
  if(!docs.length){ toast('Registro não encontrado.','err'); return; }
  const g=i=>document.getElementById(i);
  const comum={ nome:g('edpNome').value.trim().toUpperCase()||docs[0].nome,
    cpf:g('edpCpf').value.trim()||null,
    dataNascimento:g('edpNasc').value||null,
    sexo:g('edpSexo').value||null,
    dataAdmissao:g('edpAdm').value||null,
    email:g('edpEmail').value.trim()||null,
    celular:g('edpCel').value.trim()||null,
    nomeMae:g('edpMae').value.trim()||null,
    atualizadoEm:FV.serverTimestamp() };
  if(g('edpTitular')) comum.cpfTitular=g('edpTitular').value||null;
  if(g('edpParentesco')) comum.parentesco=g('edpParentesco').value||null;
  const cart={}, cert={};
  document.querySelectorAll('.edpCartao').forEach(i=>cart[i.dataset.id]=i.value.trim()||null);
  document.querySelectorAll('.edpCert').forEach(i=>cert[i.dataset.id]=i.value.trim()||null);
  try{
    const lote=db.batch();
    docs.forEach(d=>lote.update(db.collection('beneficiarios').doc(d.id),
      {...comum, cartao:cart[d.id]!==undefined?cart[d.id]:(d.cartao||null), certificado:cert[d.id]!==undefined?cert[d.id]:(d.certificado||null)}));
    await lote.commit();
    closeModal(); toast('Dados atualizados em '+docs.length+' registro(s).','ok','Salvo');
  }catch(e){ console.error(e); toast('Erro ao salvar os dados.','err'); }
}

async function salvarCompletar(){
  const empId=document.getElementById('ccEmp').value;
  const nasc={}, adm={};
  document.querySelectorAll('.ccNasc').forEach(i=>{ if(i.value) nasc[i.dataset.cpf]=i.value; });
  document.querySelectorAll('.ccAdm').forEach(i=>{ if(i.value) adm[i.dataset.cpf]=i.value; });
  const chaves=new Set([...Object.keys(nasc),...Object.keys(adm)]);
  if(!chaves.size){ toast('Preencha ao menos uma data.','info'); return; }
  try{
    const lote=db.batch(); let n=0;
    chaves.forEach(k=>{
      const docs=CACHE.beneficiarios.filter(b=>b.empresaId===empId&&
        ((soDig(b.cpf)&&soDig(b.cpf)===k)||(!soDig(b.cpf)&&('n:'+(b.nome||'').toLowerCase())===k)));
      docs.forEach(d=>{ const up={atualizadoEm:FV.serverTimestamp()};
        if(nasc[k]) up.dataNascimento=nasc[k];
        if(adm[k]) up.dataAdmissao=adm[k];
        lote.update(db.collection('beneficiarios').doc(d.id),up); n++; });
    });
    await lote.commit();
    closeModal(); toast(chaves.size+' pessoa(s) atualizadas em '+n+' registro(s).','ok','Salvo');
  }catch(e){ console.error(e); toast('Erro ao salvar.','err'); }
}

/* ---------- FATURA DA EMPRESA — histórico mês a mês + detalhe da competência ---------- */
const MESES_BR=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_CURTO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function temValoresContrato(emp){
  const v=(contratoDe(emp).valores)||{};
  return ['saude','dental','vida','previdencia'].some(k=>Number((v[k]||{}).titular)>0||Number((v[k]||{}).dependente)>0);
}
/* últimos N meses terminando na competência escolhida */
function historicoFatura(emp,ano,mes,n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    let m=mes-i, a=ano;
    while(m<=0){ m+=12; a--; }
    out.push(faturaEmpresa(emp,a,m));
  }
  return out;
}
function renderFaturaEmpresa(emp,nome){
  const hoje=new Date();
  if(!MOV_STATE.fatMes) MOV_STATE.fatMes=hoje.getMonth()+1;
  if(!MOV_STATE.fatAno) MOV_STATE.fatAno=hoje.getFullYear();
  const mes=Number(MOV_STATE.fatMes), ano=Number(MOV_STATE.fatAno);
  const sel=`<div class="filters" style="margin:0">
      <select onchange="MOV_STATE.fatMes=+this.value;VIEWS.movimentacoes()">
        ${MESES_BR.map((m,i)=>`<option value="${i+1}" ${mes===i+1?'selected':''}>${m}</option>`).join('')}</select>
      <input type="number" min="2000" max="2100" value="${ano}" onchange="MOV_STATE.fatAno=+this.value;VIEWS.movimentacoes()" style="width:110px">
      <button class="btn btn-ghost btn-sm" onclick="modalContrato('${emp.id||''}')"><i class="fas fa-sliders"></i> Valores do contrato</button>
    </div>`;
  if(!temValoresContrato(emp)) return `<div class="card"><div class="card-head"><h3><i class="fas fa-file-invoice-dollar"></i> Fatura — ${esc(nome)}</h3>${sel}</div>
    <div class="empty"><div class="em-ic"><i class="fas fa-coins"></i></div><h4>Valores do contrato ainda não cadastrados</h4>
    <p>Informe o custo por funcionário e por dependente de cada produto para o sistema calcular a fatura com pró-rata —<br>
    e para a empresa ver a prévia no Portal da Empresa.</p>
    <button class="btn btn-primary" style="margin-top:14px" onclick="modalContrato('${emp.id||''}')"><i class="fas fa-file-invoice-dollar"></i> Cadastrar valores</button></div></div>`;

  const hist=historicoFatura(emp,ano,mes,12);
  const f=hist[hist.length-1];
  const maxTot=Math.max(1,...hist.map(h=>h.total));
  const porProd={};
  f.itens.forEach(i=>{ (porProd[i.k]=porProd[i.k]||{qtd:0,total:0}); porProd[i.k].qtd++; porProd[i.k].total=arred2(porProd[i.k].total+i.valor); });
  const ord=f.itens.slice().sort((a,b)=>(a.b.nome||'').localeCompare(b.b.nome||''));
  window.__fatExport={hist,f,nome};

  const linhaHist=(h,idx)=>{
    const ant=idx>0?hist[idx-1]:null;
    const dif=ant?arred2(h.total-ant.total):null;
    const atual=h.ano===ano&&h.mes===mes;
    const dm=h.dm;
    return `<tr style="cursor:pointer;${atual?'background:var(--brand-50)':''}" onclick="MOV_STATE.fatMes=${h.mes};MOV_STATE.fatAno=${h.ano};VIEWS.movimentacoes()">
      <td><b${atual?' style="color:var(--brand-dark)"':''}>${MESES_BR[h.mes-1]}/${h.ano}</b>
        <div style="font-size:.72rem;color:var(--text-3)">01/${String(h.mes).padStart(2,'0')} a ${dm}/${String(h.mes).padStart(2,'0')} · ${dm} dias</div></td>
      <td style="text-align:right">${h.itens.length}</td>
      <td style="text-align:right">${h.prorata?`<span style="color:var(--warn);font-weight:700">${h.prorata}</span>`:'<span style="color:var(--text-3)">—</span>'}</td>
      <td style="text-align:right;color:var(--text-2)">${dinheiro(h.totEmp)}</td>
      <td style="text-align:right;color:var(--text-2)">${dinheiro(h.totFunc)}</td>
      <td style="text-align:right"><b>${dinheiro(h.total)}</b></td>
      <td style="text-align:right;font-size:.8rem">${dif===null?'<span style="color:var(--text-3)">—</span>'
        :dif===0?'<span style="color:var(--text-3)">igual</span>'
        :`<span style="color:${dif>0?'var(--danger)':'var(--ok)'};font-weight:700">${dif>0?'+':''}${dinheiro(dif)}</span>`}</td>
      <td style="width:120px"><div style="background:var(--surface-3);border-radius:5px;height:8px;overflow:hidden">
        <div style="width:${Math.round(h.total/maxTot*100)}%;height:100%;background:${atual?'var(--brand)':'var(--brand-light)'}"></div></div></td>
    </tr>`;
  };

  return `<div class="card"><div class="card-head">
      <h3><i class="fas fa-chart-column"></i> Fatura mês a mês — ${esc(nome)}</h3>
      <button class="btn btn-ghost btn-sm" onclick="exportarFatura()"><i class="fas fa-download"></i> Exportar CSV</button></div>

function exportarFatura(){

  const cell=v=>{ v=(v==null?'':String(v)); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const L=[['RESUMO MES A MES'],['Competencia','Dias','Vidas','Pro-rata','Empresa','Desconto','Total']];
  hist.forEach(h=>L.push([MESES_BR[h.mes-1]+'/'+h.ano,h.dm,h.itens.length,h.prorata,h.totEmp,h.totFunc,h.total]));

      i.base,i.dias,i.dm,i.valor,i.vEmp,i.vFunc]));
  const txt='﻿'+L.map(l=>l.map(cell).join(';')).join('\n');

}

const soDig=v=>(v||'').toString().replace(/\D/g,'');
function agruparPessoas(benef){
  const map={};
  benef.forEach(b=>{
    const k=soDig(b.cpf)||('n:'+(b.nome||'').toLowerCase());
    const p=map[k]||(map[k]={key:k,cpf:b.cpf,cpfN:soDig(b.cpf),nome:b.nome,
      dep:b.titularidade==='dependente',parentesco:b.parentesco||null,cpfTitular:soDig(b.cpfTitular),
      dataNascimento:b.dataNascimento||null,docs:[],produtos:[],deps:[]});
    p.docs.push(b);
    if(b.plano&&!p.produtos.includes(b.plano)) p.produtos.push(b.plano);
    if(!p.parentesco&&b.parentesco) p.parentesco=b.parentesco;
    if(!p.cpfTitular&&b.cpfTitular) p.cpfTitular=soDig(b.cpfTitular);
    if(!p.dataNascimento&&b.dataNascimento) p.dataNascimento=b.dataNascimento;
    if(b.titularidade==='dependente') p.dep=true;
  });
  const todas=Object.values(map);
  todas.forEach(p=>{ p.inicio=p.docs.map(d=>d.vigenciaInicio||d.dataInicio||d.criadoEm).filter(Boolean)[0]||null;
    p.cartao=(p.docs.find(d=>d.cartao)||{}).cartao||''; });
  const titulares=todas.filter(p=>!p.dep).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const porCpf={}; titulares.forEach(t=>{ if(t.cpfN) porCpf[t.cpfN]=t; });
  const orfaos=[];
  todas.filter(p=>p.dep).forEach(d=>{
    const t=porCpf[d.cpfTitular];
    if(t) t.deps.push(d); else orfaos.push(d);
  });
  titulares.forEach(t=>t.deps.sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')));
  return {titulares,orfaos:orfaos.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''))};
}

function exportarBenef(){

    linhas.push([t.nome,t.cpf||'',t.produtos.map(p=>p.toUpperCase()).join(' + '),'Titular','','',t.cartao||'',fmtData(t.inicio)]);
    t.deps.forEach(d=>linhas.push([d.nome,d.cpf||'',d.produtos.map(p=>p.toUpperCase()).join(' + '),'Dependente',
      t.nome,PARENTESCO_LBL[d.parentesco]||d.parentesco||'',d.cartao||'',fmtData(d.inicio)]));
  });
  (orfaos||[]).forEach(d=>linhas.push([d.nome,d.cpf||'',d.produtos.map(p=>p.toUpperCase()).join(' + '),'Dependente',
    'SEM TITULAR VINCULADO',PARENTESCO_LBL[d.parentesco]||d.parentesco||'',d.cartao||'',fmtData(d.inicio)]));
  if(!linhas.length){ toast('Nenhum beneficiário para exportar.','info'); return; }

  const cell=v=>{ v=(v==null?'':String(v)); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const txt='﻿'+[head.join(';')].concat(linhas.map(l=>l.map(cell).join(';'))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='beneficiarios-'+(nome||'empresa').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV gerado com '+linhas.length+' linha(s).','ok','Exportado');
}
