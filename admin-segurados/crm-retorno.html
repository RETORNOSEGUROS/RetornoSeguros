<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Retorno Seguros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ==========================================================================
   CRM RETORNO SEGUROS — Protótipo Fase 1 (arquivo único / tema claro)
   Design system: azul-petróleo da marca, tema claro + escuro opcional
   ========================================================================== */
:root{
  --brand:#0088aa; --brand-dark:#006b87; --brand-light:#00b8d4; --brand-50:#e6f6fa;
  --ok:#16a34a; --ok-bg:#dcfce7; --warn:#d97706; --warn-bg:#fef3c7;
  --danger:#dc2626; --danger-bg:#fee2e2; --info:#2563eb; --info-bg:#dbeafe;
  --purple:#7c3aed; --purple-bg:#ede9fe; --orange:#ea580c; --orange-bg:#ffedd5;

  --bg:#f4f7fb; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --text:#0f1e2e; --text-2:#5b6b7c; --text-3:#93a1b0;
  --border:#e4eaf1; --border-2:#d7dfe8;
  --shadow-sm:0 1px 2px rgba(16,32,48,.06);
  --shadow:0 4px 16px rgba(16,32,48,.08);
  --shadow-lg:0 12px 32px rgba(16,32,48,.14);
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
  --sidebar-w:264px; --topbar-h:64px;
}
[data-theme="dark"]{
  --brand:#22b8d8; --brand-dark:#0088aa; --brand-light:#4fd3ee; --brand-50:#0e2a33;
  --ok:#34d399; --ok-bg:#0d3b2b; --warn:#fbbf24; --warn-bg:#3a2c0a;
  --danger:#f87171; --danger-bg:#3a1414; --info:#60a5fa; --info-bg:#0f2544;
  --purple:#a78bfa; --purple-bg:#241a44; --orange:#fb923c; --orange-bg:#331c0a;
  --bg:#0d1420; --surface:#151f2e; --surface-2:#1a2636; --surface-3:#212f42;
  --text:#eef4fb; --text-2:#9fb0c2; --text-3:#68798c;
  --border:#26364a; --border-2:#31465f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ---------- BOTÕES ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:var(--radius-xs);
  padding:9px 16px;font-size:.875rem;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-success{background:var(--ok);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface);color:var(--text-2);border-color:var(--border-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center}

/* ---------- LOGIN ---------- */
#loginView{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--brand-dark),var(--brand) 55%,var(--brand-light));z-index:2000;padding:20px}
.login-card{background:var(--surface);width:100%;max-width:400px;border-radius:24px;padding:40px 34px;box-shadow:var(--shadow-lg)}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand-light));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;margin:0 auto 18px;box-shadow:var(--shadow)}
.login-card h1{font-size:1.5rem;text-align:center;letter-spacing:-.02em}
.login-card .sub{text-align:center;color:var(--text-2);margin:6px 0 26px;font-size:.9rem}
.field{margin-bottom:16px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .wrap{position:relative}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border-2);border-radius:var(--radius-xs);
  background:var(--surface-2);color:var(--text);font-size:.95rem;transition:.15s}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.field .toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3);background:none;border:none;cursor:pointer}
.login-error{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius-xs);
  font-size:.85rem;margin-bottom:14px;display:none}
.login-btn{width:100%;justify-content:center;padding:13px;font-size:.95rem;margin-top:4px}

/* ---------- LAYOUT ---------- */
#app{display:none}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:900;transition:transform .25s}
.sidebar-head{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.sidebar-head .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-light));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.sidebar-head .txt b{display:block;font-size:.98rem;letter-spacing:-.01em}
.sidebar-head .txt span{font-size:.72rem;color:var(--text-3)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 12px 18px}
.nav-sec{margin-top:16px}
.nav-sec:first-child{margin-top:4px}
.nav-sec-title{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  padding:0 12px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-xs);color:var(--text-2);
  font-size:.875rem;font-weight:500;margin-bottom:2px;transition:.12s;position:relative}
.nav-item i{width:18px;text-align:center;font-size:.95rem}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--brand-50);color:var(--brand-dark);font-weight:600}
[data-theme="dark"] .nav-item.active{color:var(--brand-light)}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:.68rem;font-weight:700;
  min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-badge.zero{display:none}
.sidebar-foot{padding:12px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-xs)}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.user-chip .info{flex:1;min-width:0}
.user-chip .info b{display:block;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .info span{font-size:.7rem;color:var(--text-3)}

.main{margin-left:var(--sidebar-w);min-height:100vh}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:800}
.topbar .menu-toggle{display:none;background:none;border:none;color:var(--text-2);font-size:20px}
.topbar .search{flex:1;max-width:420px;position:relative}
.topbar .search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:.85rem}
.topbar .search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border-2);border-radius:20px;
  background:var(--surface-2);color:var(--text);font-size:.85rem}
.topbar .search input:focus{outline:none;border-color:var(--brand)}
.topbar .spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:.95rem;position:relative}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}

.content{padding:26px}
.page-head{margin-bottom:22px}
.page-head h1{font-size:1.55rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.page-head .explain{color:var(--text-2);margin-top:6px;font-size:.92rem;max-width:760px}
.page-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}

/* ---------- CARTÕES / KPIs ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:1rem;display:flex;align-items:center;gap:9px}
.card-head h3 i{color:var(--brand)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.15s}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px}
.kpi .val{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .lbl{color:var(--text-2);font-size:.85rem;margin-top:5px;font-weight:500}
.kpi .trend{position:absolute;top:20px;right:20px;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:20px}
.kpi .trend.up{background:var(--ok-bg);color:var(--ok)}
.i-brand{background:var(--brand-50);color:var(--brand)} .i-ok{background:var(--ok-bg);color:var(--ok)}
.i-warn{background:var(--warn-bg);color:var(--warn)} .i-danger{background:var(--danger-bg);color:var(--danger)}
.i-info{background:var(--info-bg);color:var(--info)} .i-purple{background:var(--purple-bg);color:var(--purple)}
.i-orange{background:var(--orange-bg);color:var(--orange)}

/* ---------- TABELA ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-3);padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:.875rem;vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.dot-b{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- ABAS ---------- */
.tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:12px;width:fit-content;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:9px;border:none;background:none;color:var(--text-2);font-weight:600;font-size:.85rem;
  display:flex;align-items:center;gap:7px;transition:.15s}
.tab.active{background:var(--surface);color:var(--brand-dark);box-shadow:var(--shadow-sm)}
[data-theme="dark"] .tab.active{color:var(--brand-light)}
.tab .cnt{background:var(--surface-2);border-radius:20px;padding:1px 7px;font-size:.72rem}
.tab.active .cnt{background:var(--brand-50);color:var(--brand-dark)}

/* ---------- EMPTY / LOADING ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--text-2)}
.empty .em-ic{width:72px;height:72px;border-radius:22px;background:var(--surface-3);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
.empty h4{font-size:1.05rem;color:var(--text);margin-bottom:5px}
.skeleton{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- MOVIMENTAÇÕES ---------- */
.emp-portal{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.emp-portal .seg-ic{width:46px;height:46px;border-radius:12px;background:var(--brand-50);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.emp-portal .seg-info b{font-size:1.05rem}
.emp-portal .seg-info span{display:block;font-size:.8rem;color:var(--text-2)}
.mov-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border-2);
  border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:.15s}
.mov-card.inclusao{border-left-color:var(--ok)}
.mov-card.exclusao{border-left-color:var(--danger)}
.mov-card.aprovado,.mov-card.rejeitado{opacity:.9}
.mov-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.mov-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mov-when{text-align:right;font-size:.78rem;color:var(--text-3)}
.mov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 20px;margin-bottom:12px}
.mov-f .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:700}
.mov-f .v{font-size:.9rem;font-weight:500;margin-top:2px}
.mov-acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)}
.emp-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);margin-bottom:10px;transition:.15s;cursor:pointer}
.emp-row:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.emp-row .logo{width:46px;height:46px;border-radius:12px;background:var(--brand-50);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0}
.emp-row .nm{flex:1;min-width:0}
.emp-row .nm b{font-size:.97rem}
.emp-row .nm span{font-size:.8rem;color:var(--text-2)}
.emp-row .pend{background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:.8rem;padding:5px 12px;border-radius:20px}
.emp-row .pend.zero{background:var(--surface-3);color:var(--text-3)}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,28,.55);backdrop-filter:blur(3px);z-index:1500;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;
  overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:1.05rem;display:flex;align-items:center;gap:9px}
.modal-close{background:none;border:none;color:var(--text-3);font-size:22px;line-height:1}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
textarea,select,.modal input{width:100%;padding:11px 13px;border:1px solid var(--border-2);border-radius:var(--radius-xs);
  background:var(--surface-2);color:var(--text);font-size:.9rem;font-family:inherit}
textarea:focus,select:focus,.modal input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:6px}

/* credencial (login/senha copiar) */
.cred{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:11px 13px;margin-bottom:12px}
.cred .cred-k{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:700;width:56px}
.cred .cred-v{flex:1;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.92rem;font-weight:600;word-break:break-all}
.cred .cp{background:var(--brand-50);color:var(--brand);border:none;border-radius:8px;width:34px;height:34px;font-size:.85rem}
.cred .cp:hover{background:var(--brand);color:#fff}

/* ---------- TOASTS ---------- */
#toasts{position:fixed;bottom:24px;right:24px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;
  padding:13px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:11px;min-width:280px;max-width:380px;
  animation:slidein .25s}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--danger)} .toast.info{border-left-color:var(--info)}
.toast i{font-size:1.05rem}.toast.ok i{color:var(--ok)}.toast.err i{color:var(--danger)}.toast.info i{color:var(--info)}
.toast b{font-size:.88rem}.toast span{font-size:.8rem;color:var(--text-2);display:block}
@keyframes slidein{from{transform:translateX(120%)}to{transform:translateX(0)}}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--border-2);border-radius:var(--radius-xs);
  background:var(--surface);color:var(--text);font-size:.85rem}
.hidden{display:none!important}

/* ---------- RESPONSIVO ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,18,28,.4);z-index:850;display:none}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .topbar .menu-toggle{display:block}
  .overlay.show{display:block}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginView">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-logo"><i class="fas fa-shield-halved"></i></div>
    <h1>Retorno Seguros</h1>
    <p class="sub">Acesse o painel de gestão da corretora</p>
    <div class="login-error" id="loginError"></div>
    <div class="field">
      <label>E-mail</label>
      <div class="wrap"><input type="email" id="email" placeholder="voce@retornoseguros.com.br" required></div>
    </div>
    <div class="field">
      <label>Senha</label>
      <div class="wrap">
        <input type="password" id="senha" placeholder="Sua senha" required>
        <button type="button" class="toggle-pass" onclick="togglePass()"><i class="fas fa-eye" id="passIcon"></i></button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary login-btn" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Entrar</button>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR (menu ÚNICO — definido uma vez só) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="mark"><i class="fas fa-shield-halved"></i></div>
      <div class="txt"><b>Retorno Seguros</b><span>Painel da Corretora</span></div>
    </div>
    <nav class="sidebar-nav" id="navMenu"><!-- gerado por JS --></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="av" id="userAv">A</div>
        <div class="info"><b id="userName">Admin</b><span id="userEmail">—</span></div>
        <button class="btn-icon btn-ghost" onclick="logout()" title="Sair"><i class="fas fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" onclick="openSidebar()"><i class="fas fa-bars"></i></button>

<script>
/* ==========================================================================
   LEITOR DE PROPOSTAS — motor de extração por seguradora
   Cada seguradora tem um "template". Se o padrão mudar e faltarem campos,
   o parser devolve avisos (warnings) em vez de dados errados.
   ========================================================================== */
(function(root){
  const NUM = s => { if(s==null) return null; s=String(s).replace(/\./g,'').replace(',', '.').replace(/[^\d.]/g,''); const n=parseFloat(s); return isNaN(n)?null:n; };
  const clean = s => (s||'').replace(/\s+/g,' ').trim();
  const COMB = 'Gasolina|Flex|Álcool|Alcool|Diesel|Etanol|Híbrido|Hibrido|Elétrico|Eletrico|Tetrafuel|Gás Natural|GNV';
  const COBERTURAS_CONHECIDAS = [
    'Colisão, Incêndio e Roubo/Furto','Despesa extraordinária','RCF-V - Danos Materiais','RCF-V - Danos Corporais',
    'RCF-V - Danos Morais','APP - Morte (por passageiro)','APP - Invalidez permanente (por passageiro)','APP - DMHO (por passageiro)',
    'Assistência 24 horas','Km adicional de reboque','Kit Gás','Blindagem','Extensão para Garantia de 0Km',
    'Carta Verde - Danos Materiais','Carta Verde - Danos Corporais'
  ];

  /* ---------- Template: TOKIO MARINE AUTO ---------- */
  function tokioMarineAuto(t){
    const r={ seguradora:'Tokio Marine', ramo:'Auto', warnings:[] };
    const pick=(re,g=1)=>{ const m=re.exec(t); return m?clean(m[g]):null; };

    r.nrCotacao   = pick(/Cota[çc][ãa]o:\s*(\d+)/i);
    r.nrProposta  = pick(/Neg[óo]cio:\s*(\d+)/i);

    // Segurado + CPF (o nome é a sequência em MAIÚSCULAS imediatamente antes do CPF)
    const mSeg = /([A-ZÀ-Ÿ][A-ZÀ-Ÿ'’.\- ]{3,70}?)\s+(\d{3}\.\d{3}\.\d{3}-\d{2}|\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/.exec(t);
    if(mSeg){ r.segurado=clean(mSeg[1]); r.cpfCnpj=mSeg[2]; } else { r.warnings.push('nome do segurado / CPF'); }

    // Veículo: placa + chassi(17) + ano + fabricante + modelo + combustível
    const mV = new RegExp(`([A-Z]{3}-?\\d[A-Z0-9]\\d{2})\\s+([A-HJ-NPR-Z0-9]{17})\\s+(\\d{4})\\s+([A-ZÀ-Ÿ]+)\\s+(.+?)\\s+(${COMB})\\b`,'i').exec(t);
    if(mV){ r.placa=mV[1]; r.chassi=mV[2]; r.anoModelo=mV[3]; r.fabricante=clean(mV[4]); r.modelo=clean(mV[5]); r.combustivel=clean(mV[6]); }
    else { r.warnings.push('dados do veículo (placa/chassi/modelo)'); }
    r.codigoFipe = pick(/\b(\d{6}-\d)\b/);

    // Contato: telefone + celular (aparecem juntos, logo antes do e-mail) e e-mail
    const mFones=/(\(\d{2}\)\s?\d{4,5}-?\d{4})\s+(\(\d{2}\)\s?\d{4,5}-?\d{4})\s+[\w.+-]+@/.exec(t);
    if(mFones){ r.telefone=clean(mFones[1]); r.celular=clean(mFones[2]); }
    else { const one=/(\(\d{2}\)\s?\d{4,5}-?\d{4})\s+[\w.+-]+@/.exec(t); if(one) r.celular=clean(one[1]); }
    const mMail=/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/.exec(t); if(mMail) r.email=mMail[0];

    // Principal condutor + estado civil (vêm logo após o e-mail)
    const mC=new RegExp('@[\\w.-]+\\.[A-Za-z]{2,}\\s+(Pr[óo]prio Segurado|[A-ZÀ-Ÿ][A-ZÀ-Ÿ\'’ ]{4,60}?)\\s+(Casado\\(a\\)(?: ou vive em uni[ãa]o est[áa]vel)?|Solteiro\\(a\\)|Divorciado\\(a\\)|Vi[úu]vo\\(a\\)|Separado\\(a\\)[^]{0,25}?|Uni[ãa]o est[áa]vel)').exec(t);
    if(mC){ const pc=clean(mC[1]); r.estadoCivil=clean(mC[2]);
      if(/pr[óo]prio segurado/i.test(pc)){ r.condutorProprio=true; r.principalCondutor=r.segurado||'Próprio segurado'; }
      else { r.condutorProprio=false; r.principalCondutor=pc; } }

    // Franquia (indenização parcial) + assistências/serviços
    const mFr=/R\$\s*([\d.]+,\d{2})\s*\(\s*(\d+%[^)]*B[áa]sica)\)/i.exec(t);
    if(mFr){ r.franquia='R$ '+mFr[1]+' ('+clean(mFr[2])+')'; }
    const mAs=/Isen[çc][ãa]o de 1ª Franquia \w+\s+(.+?)(?:\n|Proposta Tokio|$)/i.exec(t);
    if(mAs){ const vals=(mAs[1].match(/Completo|Parcial|N[ãa]o possui|N[ãa]o contratada|Possui|\d+\s*di[áa]rias[^\n]*?\)|\d+\s*di[áa]rias[^\n]*/gi)||[]).slice(0,6);
      const labels=['Vidros','Logomarca (vidros)','Martelinho e para-choque','Lataria e pintura','Roda, pneu e suspensão','Carro reserva'];
      r.assistencias=vals.map((v,i)=>({item:labels[i]||('Serviço '+(i+1)),valor:clean(v)}));
      const cr=r.assistencias.find(a=>a.item==='Carro reserva'); if(cr) r.carroReserva=cr.valor; }
    const mVig = /(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/.exec(t);
    if(mVig){ r.vigenciaInicio=mVig[1]; r.vigenciaFim=mVig[2]; } else { r.warnings.push('vigência'); }
    r.tipoSeguro = pick(/(Seguro Novo|Renova[çc][ãa]o Cong[êe]nere|Renova[çc][ãa]o)/i);

    // Prêmios
    r.premioLiquido = NUM(pick(/Pr[êe]mio L[íi]quido total\s*R\$\s*([\d.]+,\d{2})/i));
    if(r.premioLiquido==null) r.warnings.push('prêmio líquido total');
    // linha de pagamento: PL, Juros, IOF, Prêmio Total, forma, parcelas, 1ª parcela
    const mPag = /R\$\s*([\d.]+,\d{2})\s+R\$\s*([\d.]+,\d{2})\s+R\$\s*([\d.]+,\d{2})\s+R\$\s*([\d.]+,\d{2})\s+([A-Za-zÀ-ÿ]+)\s+(\d+)\s+R\$\s*([\d.]+,\d{2})/.exec(t);
    if(mPag){ r.juros=NUM(mPag[2]); r.iof=NUM(mPag[3]); r.premioTotal=NUM(mPag[4]); r.formaPagamento=mPag[5]; r.parcelas=parseInt(mPag[6]); r.valorParcela=NUM(mPag[7]); }

    // COMISSÃO — código embutido: TSNC#### => #### / 100 = % sobre o prêmio líquido
    const mCom = /TSNC(\d{4})/.exec(t);
    if(mCom){ r.comissaoPct = parseInt(mCom[1])/100; r.comissaoCodigo='TSNC'+mCom[1]; }
    else { r.warnings.push('comissão (código TSNC)'); }
    if(r.comissaoPct!=null && r.premioLiquido!=null) r.comissaoValor = Math.round(r.premioLiquido*r.comissaoPct)/100;

    // Corretora
    const mCor=/(\d{6})\s+(RETORNO[^\n]*?CORRETORA[^\n]*?)(?:\s{2,}|$)/i.exec(t) || /(\d{6})\s+(RETORNO)/i.exec(t);
    if(mCor){ r.corretoraCodigo=mCor[1]; r.corretora=clean(mCor[2]).slice(0,60); }

    // Coberturas
    r.coberturas = extrairCoberturas(t);

    return r;
  }

  function extrairCoberturas(t){
    const ini=t.indexOf('Descrição'); if(ini<0) return [];
    const fim=t.indexOf('Prêmio Líquido total', ini);
    const bloco = fim>ini ? t.slice(ini, fim) : t.slice(ini, ini+1500);
    const out=[];
    for(let i=0;i<COBERTURAS_CONHECIDAS.length;i++){
      const nome=COBERTURAS_CONHECIDAS[i];
      const p=bloco.indexOf(nome); if(p<0) continue;
      const prox = COBERTURAS_CONHECIDAS.slice(i+1).map(n=>bloco.indexOf(n,p+nome.length)).filter(x=>x>0).sort((a,b)=>a-b)[0] || bloco.length;
      const trecho = bloco.slice(p+nome.length, prox);
      const mPremio = /R\$\s*([\d.]+,\d{2})/g; let last=null,mm; while((mm=mPremio.exec(trecho))) last=mm[1];
      const lmi = clean(trecho.replace(/R\$\s*[\d.]+,\d{2}\s*$/,'').replace(/\s+$/,'')) || '-';
      out.push({ nome, lmi: lmi||'-', premio: last? NUM(last):0 });
    }
    return out;
  }

  /* ---------- Detecção de seguradora + roteamento ---------- */
  const TEMPLATES=[
    { nome:'Tokio Marine', ramo:'Auto', teste:t=>/Tokio Marine/i.test(t)&&/Auto/i.test(t), parse:tokioMarineAuto },
  ];

  function parseProposta(texto){
    const t = texto || '';
    const tpl = TEMPLATES.find(x=>x.teste(t));
    if(!tpl){
      return { reconhecido:false, seguradora:null,
        warnings:['Formato não reconhecido. O sistema conhece: '+TEMPLATES.map(x=>x.nome+' ('+x.ramo+')').join(', ')+'. Se for uma seguradora nova ou o layout mudou, me avise para eu ensinar o padrão.'],
        textoBruto:t.slice(0,4000) };
    }
    const r = tpl.parse(t);
    r.reconhecido = true;
    r.confianca = r.warnings.length===0 ? 'alta' : (r.warnings.length<=2?'média':'baixa');
    return r;
  }

  root.parseProposta = parseProposta;
  root.__PROPOSTA_TEMPLATES = TEMPLATES;
})(typeof window!=='undefined'?window:globalThis);

</script>

function toast(msg, tipo='ok', titulo){
  const map={ok:['fa-circle-check','Pronto!'],err:['fa-circle-exclamation','Ops...'],info:['fa-circle-info','Aviso']};
  const [ic,defT]=map[tipo]||map.ok;
  const el=document.createElement('div');
  el.className='toast '+tipo;
  el.innerHTML=`<i class="fas ${ic}"></i><div><b>${titulo||defT}</b><span>${msg}</span></div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; el.style.transform='translateX(120%)'; setTimeout(()=>el.remove(),300); },3200);
}

function fmtData(v){ if(!v) return '-'; if(v.toDate) v=v.toDate(); const d=(v instanceof Date)?v:new Date(v); if(isNaN(d)) return esc(v); return d.toLocaleDateString('pt-BR'); }
function fmtDataHora(v){ if(!v) return '-'; if(v.toDate) v=v.toDate(); const d=(v instanceof Date)?v:new Date(v); if(isNaN(d)) return '-'; return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtCNPJ(c){ c=(c||'').replace(/\D/g,''); return c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5')||c; }

function money(v){ v=Number(v)||0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

    if(ex.code==='auth/wrong-password'||ex.code==='auth/invalid-credential') m='Senha incorreta.';

function setActive(route){

}
function router(){
  const route=(location.hash||'#dashboard').slice(1);

}

/* Barra de badges (leads novos / mov pendentes) */
function setBadge(key,n){
  const el=document.getElementById('badge-'+key); if(!el) return;
  el.textContent=n; el.classList.toggle('zero',!n);
  if(key==='leads'||key==='mov'){
    const anyNotif=(CACHE.leads.filter(isLeadNovo).length + CACHE.movimentacoes.filter(m=>m.status==='pendente').length)>0;
    document.getElementById('notifDot').classList.toggle('hidden',!anyNotif);
  }
}
const isLeadNovo=l=>l.status==='pre_cadastro'||!l.status;

/* =========================================================================
   BOOTSTRAP: listeners em tempo real p/ badges + cache
   ========================================================================= */
function detachListeners(){ LISTENERS.forEach(u=>{try{u()}catch(e){}}); LISTENERS=[]; }
function bootstrap(){
  renderMenu();
  detachListeners();
  // Leads (tempo real p/ badge "novos")
  LISTENERS.push(db.collection('leads_crm').orderBy('criadoEm','desc').onSnapshot(s=>{
    CACHE.leads=s.docs.map(d=>({id:d.id,...d.data()}));
    detectarLeadsNovos(CACHE.leads);
    setBadge('leads',CACHE.leads.filter(isLeadNovo).length);
    atualizarNotificacoes();
    if((location.hash||'#dashboard').slice(1)==='leads') VIEWS.leads();
    if((location.hash||'#dashboard').slice(1)==='dashboard') VIEWS.dashboard();
  },err=>console.warn('leads',err)));
  // Movimentações (tempo real → tela se atualiza sozinha ao aprovar/recusar)
  LISTENERS.push(db.collection('movimentacoes_beneficiarios').orderBy('criadoEm','desc').onSnapshot(s=>{
    CACHE.movimentacoes=s.docs.map(d=>({id:d.id,...d.data()}));
    setBadge('mov',CACHE.movimentacoes.filter(m=>m.status==='pendente').length);
    atualizarNotificacoes();
    const r=(location.hash||'#dashboard').slice(1);
    if(r==='movimentacoes') VIEWS.movimentacoes();
    if(r==='dashboard') VIEWS.dashboard();
  },err=>console.warn('mov',err)));
  // Empresas clientes
  LISTENERS.push(db.collection('empresas_clientes').onSnapshot(s=>{
    CACHE.empresas=s.docs.map(d=>({id:d.id,...d.data()}));
    const r=(location.hash||'#dashboard').slice(1);
    if(r==='movimentacoes') VIEWS.movimentacoes();
    if(r==='empresas') VIEWS.empresas();
  },err=>console.warn('empresas',err)));
  // Beneficiários ativos
  LISTENERS.push(db.collection('beneficiarios').onSnapshot(s=>{
    CACHE.beneficiarios=s.docs.map(d=>({id:d.id,...d.data()}));
    const r=(location.hash||'#dashboard').slice(1);
    if(r==='movimentacoes' && MOV_STATE.empresaId) VIEWS.movimentacoes();
    if(r==='empresas') VIEWS.empresas();
  },err=>console.warn('benef',err)));

  // Coleções da Fase 3 (tempo real)
  const listen=(coll,key,routes)=>LISTENERS.push(db.collection(coll).onSnapshot(s=>{
    CACHE[key]=s.docs.map(d=>({id:d.id,...d.data()}));
    if(key==='apolices') setBadge('renov',CACHE.apolices.filter(a=>{const d=diasAte(a.dataFimVigencia);return d!=null&&d<=60;}).length);
    if(key==='resgates') setBadge('resg',CACHE.resgates.filter(r=>r.status==='pendente').length);
    if(key==='apolices'||key==='resgates') atualizarNotificacoes();
    if(key==='interacoes'&&FICHA_LEAD&&document.getElementById('modalRoot').classList.contains('open')){ const c=document.getElementById('tlList'); if(c) c.outerHTML=renderTimeline(FICHA_LEAD); }
    reRender(routes);
  },err=>console.warn(coll,err)));
  listen('apolices_cliente','apolices',['apolices','clientes','renovacoes','relatorios']);
  listen('indicadores','indicadores',['indicacoes']);
  listen('empresas_parceiras','parceiros',['parceiros']);
  listen('resgates_parceiros','resgates',['resgates']);
  listen('seguidores_instagram','seguidores',['instagram']);
  listen('admins_crm','admins',['funcionarios','relatorios']);
  listen('seguradoras','seguradoras',['configuracoes']);
  listen('interacoes_crm','interacoes',[]);
  listen('propostas','propostas',['propostas']);
  atualizarNotificacoes();

  router();
}

  const id=document.getElementById('empId').value;

  if(!planos.length){ toast('Selecione ao menos um plano.','err'); return; }
  const dados={ nomeEmpresa:nome, cnpj, responsavel:document.getElementById('empResp').value.trim()||null,

/* ---------- MOVIMENTAÇÕES (o coração do pedido) ---------- */
let MOV_STATE={ empresaId:null, tab:'pendente' };
VIEWS.movimentacoes=function(){
  if(MOV_STATE.empresaId) return renderMovEmpresa();
  return renderMovEmpresasLista();
};

/* Passo 1: lista de empresas com nº de pendências (separado por empresa) */
function renderMovEmpresasLista(){
  const movs=CACHE.movimentacoes;
  // agrupa por empresa (usa empresaId; cai p/ empresaNome)
  const grupos={};
  movs.forEach(m=>{ const k=m.empresaId||('nome:'+(m.empresaNome||'—')); (grupos[k]=grupos[k]||{nome:m.empresaNome||'Empresa',id:m.empresaId,pend:0,total:0}); grupos[k].total++; if(m.status==='pendente') grupos[k].pend++; });
  let arr=Object.values(grupos).sort((a,b)=>b.pend-a.pend||a.nome.localeCompare(b.nome));

  const totPend=movs.filter(m=>m.status==='pendente').length;
  let html=head('movimentacoes');
  html+=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <div class="kpi"><div class="ico i-warn"><i class="fas fa-clock"></i></div><div class="val">${totPend}</div><div class="lbl">Pendentes no total</div></div>
    <div class="kpi"><div class="ico i-brand"><i class="fas fa-building"></i></div><div class="val">${arr.filter(g=>g.pend>0).length}</div><div class="lbl">Empresas com pendência</div></div>
    <div class="kpi"><div class="ico i-info"><i class="fas fa-right-left"></i></div><div class="val">${movs.length}</div><div class="lbl">Movimentações registradas</div></div>
  </div>`;

  html+=`<div class="card"><div class="card-head"><h3><i class="fas fa-building"></i> Selecione a empresa</h3>
    <span style="color:var(--text-3);font-size:.82rem">Cada empresa tem suas próprias movimentações — clique para tratar uma por vez</span></div>
    <div class="card-pad">
    ${arr.length?arr.map(g=>`
      <div class="emp-row" onclick="abrirEmpresaMov('${g.id||''}','${esc(g.nome).replace(/'/g,"\\'")}')">
        <div class="logo">${initials(g.nome)}</div>
        <div class="nm"><b>${esc(g.nome)}</b><span>${g.total} movimentação(ões) no histórico</span></div>
        <span class="pend ${g.pend?'':'zero'}">${g.pend?g.pend+' pendente(s)':'em dia'}</span>
        <i class="fas fa-chevron-right" style="color:var(--text-3)"></i>
      </div>`).join(''):`<div class="empty"><div class="em-ic"><i class="fas fa-check"></i></div><h4>Nenhuma movimentação por aqui</h4><p>Quando as empresas enviarem inclusões ou exclusões, elas aparecem aqui organizadas por empresa.</p></div>`}
    </div></div>`;
  document.getElementById('viewRoot').innerHTML=html;
}
function abrirEmpresaMov(id,nome){ MOV_STATE.empresaId=id||('nome:'+nome); MOV_STATE.empresaNome=nome; MOV_STATE.tab='pendente'; MOV_STATE.busca=''; VIEWS.movimentacoes(); }
function voltarEmpresas(){ MOV_STATE.empresaId=null; VIEWS.movimentacoes(); }

/* Passo 2: movimentações de UMA empresa + portal + credenciais + abas */
function renderMovEmpresa(){
  const key=MOV_STATE.empresaId;
  const movs=CACHE.movimentacoes.filter(m=>(m.empresaId||('nome:'+(m.empresaNome||'—')))===key);
  const emp=CACHE.empresas.find(e=>e.id===MOV_STATE.empresaId) ||
            CACHE.empresas.find(e=>(e.nomeEmpresa||'').toLowerCase()===(MOV_STATE.empresaNome||'').toLowerCase()) || {};
  const nome=emp.nomeEmpresa||MOV_STATE.empresaNome||'Empresa';
  const seg=PORTAIS[(emp.seguradora||'bradesco')]||PORTAIS.bradesco;
  const portalUrl=emp.urlPortal||seg.url||'';
  const portalLogin=emp.loginPortal||emp.cnpj||emp.email||'';

  const counts={pendente:movs.filter(m=>m.status==='pendente').length,
    aprovado:movs.filter(m=>m.status==='aprovado').length,
    rejeitado:movs.filter(m=>m.status==='rejeitado').length};
  const benef=CACHE.beneficiarios.filter(b=> (emp.id&&b.empresaId===emp.id) || (b.empresaNome||'').toLowerCase()===nome.toLowerCase() ).filter(b=>b.status!=='inativo');

  const tab=MOV_STATE.tab;
  let html=head('movimentacoes',{actions:`<button class="btn btn-ghost btn-sm" onclick="voltarEmpresas()"><i class="fas fa-arrow-left"></i> Todas as empresas</button>`});

  // Barra do portal da seguradora (topo)
  html+=`<div class="emp-portal">
    <div class="seg-ic"><i class="fas fa-hospital-user"></i></div>
    <div class="seg-info"><b>${esc(nome)}</b><span>Seguradora: ${esc(seg.nome)} · CNPJ ${fmtCNPJ(emp.cnpj)||'-'}</span></div>
    <div style="flex:1"></div>
    <button class="btn btn-ghost" onclick='abrirCredenciais(${JSON.stringify({nome,login:portalLogin,senha:emp.senha||"",segNome:seg.nome})})'><i class="fas fa-circle-info"></i> Login e senha</button>
    ${portalUrl?`<a class="btn btn-primary" href="${portalUrl}" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> Abrir portal ${esc(seg.nome)}</a>`
      :`<button class="btn btn-ghost" onclick="modalEmpresa('${emp.id||''}')" title="Cadastre o link do portal"><i class="fas fa-link"></i> Definir link do portal</button>`}
  </div>`;

  // Abas
  html+=`<div class="tabs" style="margin-bottom:16px">
    <button class="tab ${tab==='pendente'?'active':''}" onclick="MOV_STATE.tab='pendente';VIEWS.movimentacoes()"><i class="fas fa-clock"></i> Pendentes <span class="cnt">${counts.pendente}</span></button>
    <button class="tab ${tab==='aprovado'?'active':''}" onclick="MOV_STATE.tab='aprovado';VIEWS.movimentacoes()"><i class="fas fa-check"></i> Aprovados <span class="cnt">${counts.aprovado}</span></button>
    <button class="tab ${tab==='rejeitado'?'active':''}" onclick="MOV_STATE.tab='rejeitado';VIEWS.movimentacoes()"><i class="fas fa-xmark"></i> Recusados <span class="cnt">${counts.rejeitado}</span></button>
    <button class="tab ${tab==='ativos'?'active':''}" onclick="MOV_STATE.tab='ativos';VIEWS.movimentacoes()"><i class="fas fa-id-card"></i> Beneficiários ativos <span class="cnt">${benef.length}</span></button>
  </div>`;

  // busca dentro da empresa (nome / cpf)
  const q=(MOV_STATE.busca||'').toLowerCase();
  const filtra=x=>!q||`${x.nome||''} ${x.cpf||''}`.toLowerCase().includes(q);
  html+=`<div class="filters"><input type="text" placeholder="Buscar beneficiário por nome ou CPF..." value="${esc(MOV_STATE.busca||'')}" oninput="MOV_STATE.busca=this.value;VIEWS.movimentacoes()" style="min-width:280px"></div>`;

  if(tab==='ativos'){ html+=renderBeneficiariosAtivos(benef.filter(filtra),nome); }
  else{
    const lista=movs.filter(m=>m.status===tab).filter(filtra);
    html+=`<div>${lista.length?lista.map(m=>renderMovCard(m,tab)).join(''):
      `<div class="card"><div class="empty"><div class="em-ic"><i class="fas fa-${tab==='pendente'?'mug-hot':'inbox'}"></i></div>
      <h4>${tab==='pendente'?'Tudo em dia por aqui 🎉':'Nada nesta aba'}</h4>
      <p>${tab==='pendente'?'Não há movimentações pendentes desta empresa.':'Nenhuma movimentação '+(tab==='aprovado'?'aprovada':'recusada')+' ainda.'}</p></div></div>`}</div>`;
  }
  document.getElementById('viewRoot').innerHTML=html;
}

function renderMovCard(m,tab){
  const planoCor={saude:'var(--info)',dental:'var(--purple)',vida:'var(--ok)',previdencia:'var(--orange)'}[m.plano]||'var(--brand)';
  let acts='';
  if(m.status==='pendente'){
    acts=`<div class="mov-acts">
      <button class="btn btn-success btn-sm" onclick="modalAprovar('${m.id}')"><i class="fas fa-check"></i> Aprovar</button>
      <button class="btn btn-danger btn-sm" onclick="modalRejeitar('${m.id}')"><i class="fas fa-xmark"></i> Recusar</button></div>`;
  }else if(m.status==='aprovado'){
    // botão EDITAR carteirinha/certificado depois de aprovado
    acts=`<div class="mov-acts">

  }
  return `<div class="mov-card ${m.tipo} ${m.status}">
    <div class="mov-top">
      <div class="mov-badges">
        <span class="badge" style="background:${m.tipo==='inclusao'?'var(--ok-bg)':'var(--danger-bg)'};color:${m.tipo==='inclusao'?'var(--ok)':'var(--danger)'}">
          <i class="fas fa-${m.tipo==='inclusao'?'user-plus':'user-minus'}"></i> ${m.tipo==='inclusao'?'Inclusão':'Exclusão'}</span>
        <span class="badge" style="background:var(--surface-3);color:var(--text-2)">${m.plano?esc(m.plano.toUpperCase()):'—'}</span>
      </div>
      <div class="mov-when">${fmtDataHora(m.criadoEm)}</div>
    </div>
    <div class="mov-grid">
      <div class="mov-f"><div class="k">Beneficiário</div><div class="v">${esc(m.nome)||'-'}</div></div>
      <div class="mov-f"><div class="k">CPF</div><div class="v">${esc(m.cpf)||'-'}</div></div>
      <div class="mov-f"><div class="k">Titularidade</div><div class="v">${m.titularidade==='titular'?'Titular':'Dependente'}</div></div>
      ${m.dataNascimento?`<div class="mov-f"><div class="k">Nascimento</div><div class="v">${fmtData(m.dataNascimento)}</div></div>`:''}
      ${m.tipo==='exclusao'&&m.dataExclusao?`<div class="mov-f"><div class="k">Data exclusão</div><div class="v">${fmtData(m.dataExclusao)}</div></div>`:''}
      ${m.tipo==='exclusao'&&m.motivo?`<div class="mov-f"><div class="k">Motivo</div><div class="v">${esc(fmtMotivo(m.motivo))}</div></div>`:''}
      ${m.cartao?`<div class="mov-f"><div class="k">Carteirinha</div><div class="v">${esc(m.cartao)}</div></div>`:''}
      ${m.certificado?`<div class="mov-f"><div class="k">Certificado</div><div class="v">${esc(m.certificado)}</div></div>`:''}
    </div>
    ${m.observacoes?`<div style="font-size:.82rem;color:var(--text-2);margin-bottom:6px"><b>Obs. empresa:</b> ${esc(m.observacoes)}</div>`:''}
    ${m.motivoRejeicao?`<div style="font-size:.82rem;color:var(--danger)"><b>Recusado:</b> ${esc(fmtMotivo(m.motivoRejeicao))}</div>`:''}
    ${acts}
  </div>`;
}

function renderBeneficiariosAtivos(benef,nome){
  benef=benef.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  window.__benefExport={nome,rows:benef};
  return `<div class="card"><div class="card-head">
      <h3><i class="fas fa-id-card"></i> Beneficiários ativos — ${esc(nome)}</h3>
      <button class="btn btn-ghost btn-sm" onclick="exportarBenef()"><i class="fas fa-download"></i> Exportar CSV</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Plano</th><th>Titularidade</th><th>Carteirinha</th><th>Data de inclusão</th></tr></thead><tbody>
    ${benef.length?benef.map(b=>`<tr>
      <td><b>${esc(b.nome)}</b></td><td>${esc(b.cpf)||'-'}</td>
      <td><span class="badge" style="background:var(--surface-3);color:var(--text-2)">${b.plano?esc(b.plano.toUpperCase()):'—'}</span></td>
      <td>${b.titularidade==='titular'?'Titular':'Dependente'}</td>
      <td>${esc(b.cartao)||'<span style="color:var(--text-3)">—</span>'}</td>
      <td style="color:var(--text-3)">${fmtData(b.dataInicio||b.criadoEm)}</td></tr>`).join(''):
      `<tr><td colspan="6"><div class="empty"><div class="em-ic"><i class="fas fa-user-group"></i></div><h4>Nenhum beneficiário ativo</h4><p>Os beneficiários aparecem aqui conforme as inclusões são aprovadas.</p></div></td></tr>`}
    </tbody></table></div></div>`;
}
window.__benefExport={nome:'',rows:[]};
function exportarBenef(){
  const {nome,rows}=window.__benefExport||{rows:[]};
  if(!rows||!rows.length){ toast('Nenhum beneficiário para exportar.','info'); return; }
  const head=['Nome','CPF','Plano','Titularidade','Carteirinha','Certificado','Data de inclusao'];
  const cell=v=>{ v=(v==null?'':String(v)); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[head.join(';')];
  rows.forEach(b=>lines.push([b.nome,b.cpf,(b.plano||'').toUpperCase(),b.titularidade==='titular'?'Titular':'Dependente',b.cartao||'',b.certificado||'',fmtData(b.dataInicio||b.criadoEm)].map(cell).join(';')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='beneficiarios-'+(nome||'empresa').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV gerado com '+rows.length+' beneficiário(s).','ok','Exportado');
}

   MODAIS de movimentação
   ========================================================================= */
function openModal(html){ const r=document.getElementById('modalRoot'); r.innerHTML=`<div class="modal">${html}</div>`; r.classList.add('open'); }
function closeModal(){ document.getElementById('modalRoot').classList.remove('open'); FICHA_LEAD=null; }
document.getElementById('modalRoot').addEventListener('click',e=>{ if(e.target.id==='modalRoot') closeModal(); });

function modalAprovar(id){
  const m=CACHE.movimentacoes.find(x=>x.id===id); if(!m) return;
  openModal(`
    <div class="modal-head"><h3><i class="fas fa-circle-check" style="color:var(--ok)"></i> Aprovar ${m.tipo==='inclusao'?'inclusão':'exclusão'}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <p style="color:var(--text-2);margin-bottom:16px"><b>${esc(m.nome)}</b> · ${esc(m.cpf)||''} · ${esc((m.plano||'').toUpperCase())}</p>
      ${m.tipo==='inclusao'?`
      <div class="form-row"><label>Nº da carteirinha (pode preencher depois)</label><input type="text" id="apCartao" placeholder="Opcional agora"></div>
      <div class="form-row"><label>Certificado</label><input type="text" id="apCert" placeholder="Opcional"></div>`:''}
      <div class="form-row"><label>Observação interna (opcional)</label><textarea id="apObs" rows="2" placeholder="Anotação para a equipe"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmarAprovacao('${id}')"><i class="fas fa-check"></i> Confirmar aprovação</button></div>`);
}
async function confirmarAprovacao(id){
  const m=CACHE.movimentacoes.find(x=>x.id===id); if(!m) return;
  const cartao=(document.getElementById('apCartao')?.value||'').trim();
  const cert=(document.getElementById('apCert')?.value||'').trim();
  const obs=(document.getElementById('apObs')?.value||'').trim();
  try{
    await db.collection('movimentacoes_beneficiarios').doc(id).update({
      status:'aprovado', observacaoAdmin:obs||null, cartao:cartao||null, certificado:cert||null,
      aprovadoPor:CURRENT_USER?.email||'admin', atualizadoEm:FV.serverTimestamp() });
    if(m.tipo==='inclusao'){
      await db.collection('beneficiarios').add({
        empresaId:m.empresaId||null, empresaNome:m.empresaNome||null, nome:m.nome, cpf:m.cpf,
        dataNascimento:m.dataNascimento||null, plano:m.plano, titularidade:m.titularidade,
        parentesco:m.parentesco||null, cpfTitular:m.cpfTitular||null, nomeMae:m.nomeMae||null,
        cartao:cartao||null, certificado:cert||null, status:'ativo',
        dataInicio:FV.serverTimestamp(), criadoEm:FV.serverTimestamp() });
    }
    if(m.tipo==='exclusao'&&m.beneficiarioId){
      await db.collection('beneficiarios').doc(m.beneficiarioId).update({status:'inativo',dataFim:m.dataExclusao||null,motivoSaida:m.motivo||null,atualizadoEm:FV.serverTimestamp()});
    }
    closeModal(); toast('Movimentação aprovada. A lista já se atualizou.','ok','Aprovado');
    // a tela se atualiza sozinha via onSnapshot — sem F5
  }catch(e){ console.error(e); toast('Erro ao aprovar. Tente novamente.','err'); }
}

function modalRejeitar(id){
  const m=CACHE.movimentacoes.find(x=>x.id===id); if(!m) return;
  openModal(`
    <div class="modal-head"><h3><i class="fas fa-circle-xmark" style="color:var(--danger)"></i> Recusar movimentação</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">

        <select id="rjMotivo"><option value="">Selecione...</option>
          <option value="dados_incompletos">Dados incompletos</option>
          <option value="documentacao">Falta documentação</option>

          <option value="fora_regra">Fora das regras do plano</option>

      <div class="form-row"><label>Observação (opcional)</label><textarea id="rjObs" rows="2"></textarea></div>

      <button class="btn btn-danger" onclick="confirmarRejeicao('${id}')"><i class="fas fa-xmark"></i> Confirmar recusa</button></div>`);
}
async function confirmarRejeicao(id){
  const motivo=document.getElementById('rjMotivo').value;
  if(!motivo){ toast('Selecione o motivo da recusa.','err'); return; }
  const obs=(document.getElementById('rjObs')?.value||'').trim();

      status:'rejeitado', motivoRejeicao:motivo, observacaoAdmin:obs||null,

/* EDITAR carteirinha/certificado depois de aprovado */
function modalEditarAprovado(id){

async function salvarEditAprovado(id){
  const m=CACHE.movimentacoes.find(x=>x.id===id);
  const cartao=(document.getElementById('edCartao').value||'').trim();
  const cert=(document.getElementById('edCert').value||'').trim();
  try{
    await db.collection('movimentacoes_beneficiarios').doc(id).update({cartao:cartao||null,certificado:cert||null,atualizadoEm:FV.serverTimestamp()});
    // atualiza também o beneficiário ativo correspondente (por CPF+empresa)
    const alvo=CACHE.beneficiarios.find(b=>b.cpf===m.cpf && ((m.empresaId&&b.empresaId===m.empresaId)|| (b.empresaNome||'')===(m.empresaNome||'')) && b.status!=='inativo');
    if(alvo){ await db.collection('beneficiarios').doc(alvo.id).update({cartao:cartao||null,certificado:cert||null,atualizadoEm:FV.serverTimestamp()}); }
    closeModal(); toast('Carteirinha atualizada.','ok');
  }catch(e){ console.error(e); toast('Erro ao salvar.','err'); }
}

function edToggleCancel(){ const t=document.getElementById('edTipo').value; document.getElementById('edComissaoWrap').style.display=(t==='cancelamento')?'':'none'; }
async function salvarEndosso(id){
  const a=CACHE.apolices.find(x=>x.id===id); if(!a) return;
  const tipo=document.getElementById('edTipo').value;
  const sinal=parseInt(document.getElementById('edSinal').value);
  const valor=(parseFloat(document.getElementById('edValor').value)||0)*sinal;
  const comissaoDevolvida=parseFloat(document.getElementById('edComissao').value)||0;
  const endosso={ tipo, descricao:document.getElementById('edDesc').value.trim()||null, valor:valor||0,
    comissaoDevolvida:tipo==='cancelamento'?comissaoDevolvida:0, data:document.getElementById('edData').value||new Date().toISOString().slice(0,10),
    registradoEm:new Date().toISOString(), por:CURRENT_USER?.email?.split('@')[0]||'admin' };
  try{
    const upd={ endossos:firebase.firestore.FieldValue.arrayUnion(endosso), atualizadoEm:FV.serverTimestamp() };
    if(tipo==='cancelamento'){ upd.status='cancelada'; upd.renovacaoCancelada=true;
      if(comissaoDevolvida) upd.comissaoValor=(a.comissaoValor||0)-comissaoDevolvida; }
    await db.collection('apolices_cliente').doc(id).update(upd);
    closeModal(); toast('Endosso registrado'+(tipo==='cancelamento'?' — apólice cancelada e renovação suspensa.':'.'),'ok');
  }catch(e){ console.error(e); toast('Erro ao registrar endosso.','err'); }
}
function excluirApolice(id){ const a=CACHE.apolices.find(x=>x.id===id); if(!a) return;

    <p style="font-size:.82rem;color:var(--text-3);margin-top:8px">Dica: se foi um cancelamento com restituição/devolução de comissão, use <b>Incluir endosso → Cancelamento</b> em vez de excluir, para manter o histórico.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="modalApolice('${id}')">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmarExcluirApolice('${id}')"><i class="fas fa-trash"></i> Excluir definitivamente</button></div>`);

async function salvarApolice(){ const id=document.getElementById('apId').value;
  const cliente=document.getElementById('apCliente').value.trim(); if(!cliente){ toast('Informe o cliente.','err'); return; }
  const dados={ clienteNome:cliente, clienteWhatsapp:document.getElementById('apWhats').value.replace(/\D/g,'')||null,
    clienteEmail:document.getElementById('apEmail').value.trim()||null,
    ramo:document.getElementById('apRamo').value, seguradora:document.getElementById('apSeg').value.trim()||null,
    numeroApolice:document.getElementById('apNum').value.trim()||null, status:document.getElementById('apStatus').value,
    dataInicioVigencia:document.getElementById('apIni').value||null, dataFimVigencia:document.getElementById('apFim').value||null,
    valorPremio:parseFloat(document.getElementById('apPremio').value)||0, comissao:parseFloat(document.getElementById('apComissao').value)||0,
    veiculoPlaca:document.getElementById('apPlaca').value.trim()||null, codigoFipe:document.getElementById('apFipe').value.trim()||null,
    observacoes:document.getElementById('apObs').value.trim()||null, atualizadoEm:FV.serverTimestamp() };
  try{ if(id) await db.collection('apolices_cliente').doc(id).update(dados);
    else{ dados.criadoEm=FV.serverTimestamp(); await db.collection('apolices_cliente').add(dados); }
    await upsertCliente({nome:cliente,whatsapp:dados.clienteWhatsapp,email:dados.clienteEmail});
    closeModal(); toast('Apólice salva.','ok'); }catch(e){ console.error(e); toast('Erro ao salvar.','err'); }
}
/* Garante o cliente no menu Clientes (só dados pessoais), sem duplicar */
async function upsertCliente({nome,cpf,whatsapp,email}){
  const c=(cpf||'').replace(/\D/g,''); const f=(whatsapp||'').replace(/\D/g,'');
  if(!nome&&!f&&!c) return;
  let lead=(c&&CACHE.leads.find(l=>(l.cpf||'').replace(/\D/g,'')===c))||(f&&CACHE.leads.find(l=>(l.whatsapp||l.telefone||'').replace(/\D/g,'')===f))||null;
  try{ if(lead){ const upd={}; if(!lead.email&&email)upd.email=email; if(!lead.whatsapp&&f)upd.whatsapp=f; if(!lead.cpf&&cpf)upd.cpf=cpf;
      if(Object.keys(upd).length){ upd.atualizadoEm=FV.serverTimestamp(); await db.collection('leads_crm').doc(lead.id).update(upd); } }
    else { await db.collection('leads_crm').add({ nome:nome||null, cpf:cpf||null, whatsapp:f||null, email:email||null, status:'cliente', origem:'apolice', criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp() }); }
  }catch(e){ console.warn('upsertCliente',e); }
}

async function salvarFuncionario(){ const id=document.getElementById('fnId').value; const nome=document.getElementById('fnNome').value.trim(); const email=document.getElementById('fnEmail').value.trim().toLowerCase();
  if(!nome||!email){ toast('Informe nome e e-mail.','err'); return; }
  const dados={nome,email,telefone:document.getElementById('fnTel').value.trim()||null,cargo:document.getElementById('fnCargo').value.trim()||null,comissaoPadrao:parseFloat(document.getElementById('fnCom').value)||0,ativo:document.getElementById('fnAtivo').value==='1',atualizadoEm:FV.serverTimestamp()};
  try{ if(id) await db.collection('admins_crm').doc(id).update(dados); else{ dados.criadoEm=FV.serverTimestamp(); await db.collection('admins_crm').add(dados);} closeModal(); toast('Funcionário salvo.','ok'); }catch(e){ console.error(e); toast('Erro ao salvar.','err'); }
}

/* ---------- COMISSÕES ---------- */
const MESNOME=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
/* competência da comissão = início de vigência do seguro (não a data de leitura) */
function compData(p){ return (p.vigenciaInicio&&converterData(p.vigenciaInicio)&&toDate(converterData(p.vigenciaInicio))) || toDate(p.criadoEm); }
VIEWS.comissoes=function(){
  let html=head('comissoes');
  const props=CACHE.propostas.filter(p=>p.comissaoValor!=null);
  const total=props.reduce((s,p)=>s+(+p.comissaoValor||0),0);
  const premioTot=props.reduce((s,p)=>s+(+p.premioLiquido||0),0);
  const pctMedio=premioTot?(total/premioTot*100):0;
  const hoje=new Date(); const ini=new Date(hoje.getFullYear(),hoje.getMonth(),1); const fimMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,1);
  const mesAtual=props.filter(p=>{const d=compData(p);return d&&d>=ini&&d<fimMes;}).reduce((s,p)=>s+(+p.comissaoValor||0),0);
  html+=`<div class="kpi-grid">
    <div class="kpi"><div class="ico i-ok"><i class="fas fa-hand-holding-dollar"></i></div><div class="val" style="font-size:1.4rem">${money(total)}</div><div class="lbl">Comissão total lida</div></div>
    <div class="kpi"><div class="ico i-brand"><i class="fas fa-calendar-day"></i></div><div class="val" style="font-size:1.4rem">${money(mesAtual)}</div><div class="lbl">Comissão neste mês</div></div>
    <div class="kpi"><div class="ico i-purple"><i class="fas fa-sack-dollar"></i></div><div class="val" style="font-size:1.4rem">${money(premioTot)}</div><div class="lbl">Prêmio líquido total</div></div>
    <div class="kpi"><div class="ico i-info"><i class="fas fa-percent"></i></div><div class="val">${pctMedio.toFixed(1)}%</div><div class="lbl">Comissão média</div></div>
    <div class="kpi"><div class="ico i-orange"><i class="fas fa-file-invoice"></i></div><div class="val">${props.length}</div><div class="lbl">Propostas</div></div>
  </div>`;
  if(!props.length){ html+=`<div class="card"><div class="empty"><div class="em-ic"><i class="fas fa-hand-holding-dollar"></i></div><h4>Ainda sem comissões</h4><p>Leia e salve propostas em "Ler propostas" — a comissão de cada uma entra aqui automaticamente.</p></div></div>`; document.getElementById('viewRoot').innerHTML=html; return; }
  // por seguradora
  const seg={}; props.forEach(p=>{const k=p.seguradora||'—';(seg[k]=seg[k]||{n:0,com:0,prem:0});seg[k].n++;seg[k].com+=+p.comissaoValor||0;seg[k].prem+=+p.premioLiquido||0;});
  const segArr=Object.entries(seg).sort((a,b)=>b[1].com-a[1].com);
  // por mês
  const mes={}; props.forEach(p=>{const d=compData(p);const k=d?(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')):'—';(mes[k]=mes[k]||{n:0,com:0,label:d?(MESNOME[d.getMonth()]+'/'+d.getFullYear()):'—'});mes[k].n++;mes[k].com+=+p.comissaoValor||0;});
  const mesArr=Object.entries(mes).sort((a,b)=>a[0]<b[0]?1:-1);
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="dash-cols">
    <div class="card"><div class="card-head"><h3><i class="fas fa-shield"></i> Por seguradora</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>Seguradora</th><th>Propostas</th><th>Prêmio</th><th>Comissão</th></tr></thead><tbody>
      ${segArr.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${v.n}</td><td>${money(v.prem)}</td><td><b style="color:var(--ok)">${money(v.com)}</b></td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card"><div class="card-head"><h3><i class="fas fa-calendar"></i> Por mês</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>Mês</th><th>Propostas</th><th>Comissão</th></tr></thead><tbody>
      ${mesArr.map(([k,v])=>`<tr><td><b>${esc(v.label)}</b></td><td>${v.n}</td><td><b style="color:var(--ok)">${money(v.com)}</b></td></tr>`).join('')}
      </tbody></table></div></div>
  </div>`;
  html+=`<div class="card" style="margin-top:18px"><div class="card-head"><h3><i class="fas fa-list"></i> Propostas com comissão</h3>
    <span style="font-size:.78rem;color:var(--text-3)">competência = início de vigência</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Segurado</th><th>Seguradora</th><th>Prêmio líquido</th><th>%</th><th>Comissão</th><th>Início vigência</th></tr></thead><tbody>
    ${props.slice().sort((a,b)=>(compData(b)||0)-(compData(a)||0)).map(p=>`<tr><td><b>${esc(p.segurado||'-')}</b></td><td>${esc(p.seguradora||'-')}</td>
      <td>${money(p.premioLiquido)}</td><td>${p.comissaoPct!=null?p.comissaoPct+'%':'-'}</td><td><b style="color:var(--ok)">${money(p.comissaoValor)}</b></td><td style="color:var(--text-3)">${p.vigenciaInicio?esc(p.vigenciaInicio):fmtData(p.criadoEm)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  document.getElementById('viewRoot').innerHTML=html;
};

function exportDesist(){ const rows=window.__desistExport||[]; if(!rows.length){ toast('Nada para exportar.','info'); return; }
  const cell=v=>{ v=(v==null?'':String(v)); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[['Nome','Produto','Etapa','Data','WhatsApp'].join(';')];
  rows.forEach(l=>lines.push([l.nomeEmpresa||l.nome,l.ramo,(STATUS_PIPELINE[l.status]||{}).label||l.status,fmtData(l.atualizadoEm||l.criadoEm),l.whatsapp].map(cell).join(';')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='desistentes.csv'; document.body.appendChild(a); a.click(); a.remove(); toast('CSV gerado.','ok'); }

let IMPORT_ROWS=[];
VIEWS.importar=function(){
  let html=head('importar');
  const opts=CACHE.empresas.slice().sort((a,b)=>(a.nomeEmpresa||'').localeCompare(b.nomeEmpresa||'')).map(e=>`<option value="${e.id}">${esc(e.nomeEmpresa)}</option>`).join('');
  html+=`<div class="card"><div class="card-pad">
    <p style="color:var(--text-2);margin-bottom:16px">Cole a lista de beneficiários (uma pessoa por linha) ou selecione um arquivo CSV. Colunas esperadas, separadas por vírgula ou ponto e vírgula: <b>Nome, CPF, Plano, Titularidade, Nascimento</b>.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="form-row" style="margin:0"><label>Empresa de destino *</label><select id="impEmpresa"><option value="">Selecione...</option>${opts}</select></div>
      <div class="form-row" style="margin:0"><label>Arquivo CSV</label><input type="file" id="impFile" accept=".csv,.txt" onchange="lerArquivoImport(event)"></div>
    </div>
    <div class="form-row"><label>Ou cole aqui</label><textarea id="impTexto" rows="6" placeholder="João da Silva, 123.456.789-00, saude, titular, 1990-05-10"></textarea></div>
    <button class="btn btn-ghost" onclick="previewImport()"><i class="fas fa-eye"></i> Pré-visualizar</button>
  </div></div>
  <div id="impPreview" style="margin-top:18px"></div>`;
  document.getElementById('viewRoot').innerHTML=html;
};
function lerArquivoImport(ev){ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ document.getElementById('impTexto').value=r.result; previewImport(); }; r.readAsText(f,'utf-8'); }
function previewImport(){ const txt=document.getElementById('impTexto').value.trim(); if(!txt){ toast('Cole a lista ou selecione um arquivo.','info'); return; }
  const linhas=txt.split(/\r?\n/).filter(x=>x.trim());
  IMPORT_ROWS=linhas.map(l=>{ const c=l.split(/[;,\t]/).map(x=>x.trim());
    if(/nome/i.test(c[0])&&/cpf/i.test(c[1]||'')) return null; // pula cabeçalho
    return {nome:c[0]||'',cpf:c[1]||'',plano:(c[2]||'saude').toLowerCase(),titularidade:(c[3]||'titular').toLowerCase(),dataNascimento:c[4]||''}; }).filter(x=>x&&x.nome);
  const el=document.getElementById('impPreview');
  if(!IMPORT_ROWS.length){ el.innerHTML=`<div class="card"><div class="empty"><div class="em-ic"><i class="fas fa-triangle-exclamation"></i></div><h4>Nada reconhecido</h4><p>Confira o formato das linhas.</p></div></div>`; return; }
  el.innerHTML=`<div class="card"><div class="card-head"><h3><i class="fas fa-table-list"></i> Pré-visualização (${IMPORT_ROWS.length})</h3>
    <button class="btn btn-primary btn-sm" onclick="confirmarImport()"><i class="fas fa-file-import"></i> Importar ${IMPORT_ROWS.length}</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Plano</th><th>Titularidade</th><th>Nascimento</th></tr></thead><tbody>
    ${IMPORT_ROWS.slice(0,50).map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.cpf)}</td><td>${esc(r.plano.toUpperCase())}</td><td>${esc(r.titularidade)}</td><td>${esc(r.dataNascimento)}</td></tr>`).join('')}
    </tbody></table></div>${IMPORT_ROWS.length>50?`<div class="card-pad" style="color:var(--text-3);font-size:.82rem">Mostrando 50 de ${IMPORT_ROWS.length}.</div>`:''}</div>`;
}
async function confirmarImport(){ const empId=document.getElementById('impEmpresa').value; if(!empId){ toast('Selecione a empresa de destino.','err'); return; }
  const emp=CACHE.empresas.find(e=>e.id===empId); if(!IMPORT_ROWS.length){ toast('Nada para importar.','info'); return; }
  toast('Importando '+IMPORT_ROWS.length+' beneficiário(s)...','info','Aguarde');
  try{ let batch=db.batch(),n=0,total=0;
    for(const r of IMPORT_ROWS){ const ref=db.collection('beneficiarios').doc();
      batch.set(ref,{empresaId:empId,empresaNome:emp?.nomeEmpresa||null,nome:r.nome,cpf:r.cpf||null,plano:r.plano,titularidade:r.titularidade,dataNascimento:r.dataNascimento||null,status:'ativo',dataInicio:FV.serverTimestamp(),criadoEm:FV.serverTimestamp(),origem:'importacao'});
      n++;total++; if(n>=400){ await batch.commit(); batch=db.batch(); n=0; } }
    if(n>0) await batch.commit();
    IMPORT_ROWS=[]; document.getElementById('impPreview').innerHTML=''; document.getElementById('impTexto').value='';
    toast(total+' beneficiário(s) importado(s) para '+(emp?.nomeEmpresa||'a empresa')+'.','ok','Concluído');
  }catch(e){ console.error(e); toast('Erro ao importar. Tente um lote menor.','err'); }
}

      <td>${esc(p.nrProposta||'-')}</td><td style="color:var(--text-3)">${fmtData(p.criadoEm)}</td>

async function extrairTextoPDF(file){
  if(!window.pdfjsLib){ throw new Error('pdf.js não carregou (verifique a conexão).'); }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let out='';
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const c=await pg.getTextContent(); out+=c.items.map(it=>it.str).join(' ')+'\n'; }
  return out;
}
async function processarPropostas(files){
  const arr=[...files].filter(f=>/pdf$/i.test(f.name)||f.type==='application/pdf');
  if(!arr.length){ toast('Selecione arquivos PDF.','err'); return; }
  toast('Lendo '+arr.length+' proposta(s)...','info','Aguarde');
  for(const f of arr){
    try{
      const texto=await extrairTextoPDF(f);
      const r=parseProposta(texto);
      r.arquivo=f.name; r.__texto=texto; r.__id='p'+(PROP_RESULTS.length+1)+'_'+Date.now();
      PROP_RESULTS.unshift(r);
    }catch(e){ console.error(e); PROP_RESULTS.unshift({arquivo:f.name,reconhecido:false,warnings:['Erro ao ler o PDF: '+e.message]}); }
  }
  if((location.hash||'').slice(1)==='propostas') renderPropResults();
}
function renderPropResults(){
  const el=document.getElementById('propResults'); if(!el) return;
  if(!PROP_RESULTS.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:.95rem">Propostas lidas nesta sessão (${PROP_RESULTS.length})</b>
      <button class="btn btn-ghost btn-sm" onclick="PROP_RESULTS=[];renderPropResults()"><i class="fas fa-xmark"></i> Limpar</button></div>`
    + PROP_RESULTS.map(cardProposta).join('');
}

async function salvarProposta(id){
  const r=PROP_RESULTS.find(x=>x.__id===id); if(!r) return;
  try{

    await db.collection('propostas').add({...dadosProposta(r),leadId:leadId||null,criadoEm:FV.serverTimestamp(),lidoPor:CURRENT_USER?.email||'admin'});

/* Liga a proposta a um cliente (cria/atualiza lead + registra interação) */
async function vincularClienteProposta(r){
  const cpf=(r.cpfCnpj||'').replace(/\D/g,''); const fone=(r.celular||r.telefone||'').replace(/\D/g,'');
  let lead=(cpf&&CACHE.leads.find(l=>(l.cpf||'').replace(/\D/g,'')===cpf)) || (fone&&CACHE.leads.find(l=>(l.whatsapp||l.telefone||'').replace(/\D/g,'')===fone)) || null;
  try{
    let leadId;
    if(lead){ leadId=lead.id; const upd={};
      if(!lead.email&&r.email) upd.email=r.email;
      if(!lead.whatsapp&&fone) upd.whatsapp=fone;
      if(!lead.ramo&&r.ramo) upd.ramo=r.ramo;
      if(Object.keys(upd).length){ upd.atualizadoEm=FV.serverTimestamp(); await db.collection('leads_crm').doc(lead.id).update(upd); }
    } else {
      const ref=await db.collection('leads_crm').add({ nome:r.segurado||null, cpf:r.cpfCnpj||null, whatsapp:fone||null, email:r.email||null,
        ramo:r.ramo||null, status:'cotacao_enviada', origem:'proposta', temperatura:'quente',
        criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp() });
      leadId=ref.id;
    }
    await db.collection('interacoes_crm').add({ leadId, tipo:'nota',
      texto:'Proposta '+(r.seguradora||'')+' '+(r.nrProposta||'')+' — prêmio '+money(r.premioLiquido)+', comissão '+(r.comissaoPct!=null?(r.comissaoPct+'% ('+money(r.comissaoValor)+')'):'—'),
      autor:CURRENT_USER?.email?.split('@')[0]||'sistema', criadoEm:FV.serverTimestamp() });
    return leadId;
  }catch(e){ console.warn('vincular cliente',e); return null; }
}

function converterData(br){ if(!br) return null; const m=/(\d{2})\/(\d{2})\/(\d{4})/.exec(br); return m?`${m[3]}-${m[2]}-${m[1]}`:null; }

/* Tabela de parcelas: valor de cada uma + vencimentos mensais a partir do início de vigência */
function tabelaParcelas(o){
  const n=parseInt(o.parcelas)||1; const total=(+o.premioTotal)|| ((+o.valorParcela||0)*n) || 0;
  const iniStr=converterData(o.vigenciaInicio); const ini=iniStr?new Date(iniStr+'T00:00:00'):null;
  const vals=[];
  if(o.valorParcela && o.premioTotal && n>1){ const rest=(o.premioTotal - o.valorParcela)/(n-1); for(let i=0;i<n;i++) vals.push(i===0?+o.valorParcela:rest); }
  else { for(let i=0;i<n;i++) vals.push(total/n); }
  let rows=''; for(let i=0;i<n;i++){ let dt='-'; if(ini){ const d=new Date(ini); d.setMonth(d.getMonth()+i); dt=d.toLocaleDateString('pt-BR'); }
    rows+=`<tr><td>${i+1}ª</td><td>${dt}</td><td>${money(vals[i])}</td></tr>`; }
  return `<div class="tbl-wrap" style="border:1px solid var(--border);border-radius:8px"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ============ CONSULTA FIPE — API parallelum (marca/modelo/ano, a mesma do site) ============ */
const FIPE_BASE='https://parallelum.com.br/fipe/api/v1/carros';
function NUMBR(s){ const n=parseFloat(s); return isNaN(n)?null:n; }
function fipeNum(v){ return NUMBR(String(v||'').replace(/[R$\s.]/g,'').replace(',','.')); }
function fipeNorm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function fipeTokens(s){ return fipeNorm(s).replace(/[^\w.\s]/g,' ').split(/\s+/).filter(x=>x.length>1); }
async function fipeGet(u){ const r=await fetch(u); if(!r.ok) throw new Error('API FIPE respondeu '+r.status); return r.json(); }
function fipeBtn(ctx,label){ const j=encodeURIComponent(JSON.stringify(ctx||{})); return `<button class="btn btn-ghost btn-sm" style="padding:3px 9px" onclick="modalFipe(JSON.parse(decodeURIComponent(this.dataset.ctx)))" data-ctx="${j}"><i class="fas fa-magnifying-glass-dollar"></i>${label===undefined?' consultar':(label?' '+label:'')}</button>`; }
function fipeAcharMarca(marcas,nome){ const q=fipeNorm(nome); if(!q) return null;
  return marcas.find(m=>fipeNorm(m.nome)===q) || marcas.find(m=>fipeNorm(m.nome).includes(q)||q.includes(fipeNorm(m.nome))) ||
    marcas.find(m=>fipeNorm(m.nome).split(/[\s\-]+/).some(tk=>tk.length>2&&q.includes(tk))); }
function fipeScore(alvo,nome){ const nt=fipeTokens(nome); let sc=0; alvo.forEach(t=>{ if(nt.includes(t)) sc+=2; else if(nt.some(x=>x.startsWith(t)||t.startsWith(x))) sc+=1; }); return sc; }

async function modalFipe(ctx){ ctx=ctx||{};
  openModal(`<div class="modal-head"><h3><i class="fas fa-magnifying-glass-dollar" style="color:var(--brand)"></i> Valor FIPE${ctx.codigo?' · '+esc(ctx.codigo):''}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="fipeBody"><div class="empty" style="padding:30px"><div class="em-ic"><i class="fas fa-spinner fa-spin"></i></div><h4>Consultando a tabela FIPE...</h4><p>Buscando ${esc([ctx.marca,ctx.modelo].filter(Boolean).join(' '))||'o veículo'}.</p></div></div>`);
  try{
    if(!ctx.marca||!ctx.modelo) throw new Error('Faltam marca e modelo para consultar a FIPE.');
    const marcas=await fipeGet(FIPE_BASE+'/marcas');
    const marca=fipeAcharMarca(marcas,ctx.marca);
    if(!marca) throw new Error('Marca "'+esc(ctx.marca)+'" não localizada na FIPE.');
    const mr=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos');
    const modelos=mr.modelos||[]; const alvo=fipeTokens(ctx.modelo);
    const ranked=modelos.map(m=>({m,sc:fipeScore(alvo,m.nome)})).sort((a,b)=>b.sc-a.sc).filter(x=>x.sc>0).slice(0,8);
    if(!ranked.length) throw new Error('Modelo não encontrado automaticamente. Confira o veículo.');
    if(ranked.length>1 && (ranked[0].sc-(ranked[1]?ranked[1].sc:0))<2){ window.__fipePick={marca,top:ranked,ctx}; return fipeEscolherModelo(ranked,ctx); }
    await fipeConcluir(marca,ranked[0].m,ctx);
  }catch(e){ fipeErro(e); }
}
function fipeEscolherModelo(ranked,ctx){ const el=document.getElementById('fipeBody'); if(!el) return;
  el.innerHTML=`<p style="color:var(--text-2);margin-bottom:12px">Confirme o modelo exato de <b>${esc(ctx.modelo||'')}</b>:</p>`+
    ranked.map((x,i)=>`<div class="emp-row" onclick="fipePick(${i})"><div class="nm" style="flex:1"><b>${esc(x.m.nome)}</b></div><i class="fas fa-chevron-right" style="color:var(--text-3)"></i></div>`).join(''); }
function fipePick(i){ const s=window.__fipePick; if(!s) return;
  document.getElementById('fipeBody').innerHTML='<div class="empty" style="padding:24px"><div class="em-ic"><i class="fas fa-spinner fa-spin"></i></div><h4>Buscando valor...</h4></div>';
  fipeConcluir(s.marca,s.top[i].m,s.ctx).catch(fipeErro); }
async function fipeConcluir(marca,modelo,ctx){
  const anos=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos/'+modelo.codigo+'/anos');
  const ano=anos.find(a=>String(a.nome).startsWith(String(ctx.ano||''))) || anos.find(a=>String(a.codigo).startsWith(String(ctx.ano||''))) || anos[0];
  const d=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos/'+modelo.codigo+'/anos/'+ano.codigo);
  const codigo=ctx.codigo||d.CodigoFipe||''; const mesRef=(d.MesReferencia||'').trim();
  try{ const docId=((codigo||modelo.codigo+'_'+ano.codigo)+'_'+mesRef).replace(/[^\w]+/g,'_');
    await db.collection('fipe_historico').doc(docId).set({ codigoFipe:codigo||null, marcaModelo:(d.Marca||'')+' '+(d.Modelo||''), valor:d.Valor, valorNum:fipeNum(d.Valor),
      anoModelo:d.AnoModelo||null, mesReferencia:mesRef, atualizadoEm:FV.serverTimestamp() },{merge:true}); }catch(e){}
  let hist=[]; try{ if(codigo){ const hs=await db.collection('fipe_historico').where('codigoFipe','==',codigo).get(); hist=hs.docs.map(x=>x.data()).filter(h=>h.valorNum); } }catch(e){}
  const histT=hist.map(h=>({mes:h.mesReferencia,valor:h.valorNum,label:h.valor})).sort((a,b)=>(a.mes||'').localeCompare(b.mes||''));
  renderFipe(d, histT);
}
function fipeErro(e){ const el=document.getElementById('fipeBody'); if(!el) return; console.error(e);
  el.innerHTML=`<div class="empty" style="padding:24px"><div class="em-ic"><i class="fas fa-triangle-exclamation"></i></div>
    <h4>Não consegui consultar agora</h4><p>${esc(e.message||'Erro')}<br>A FIPE é consultada ao vivo pela internet; tente de novo em instantes.</p></div>`; }
function renderFipe(d, hist){
  const el=document.getElementById('fipeBody'); if(!el) return;
  let variacao='';
  if(hist.length>=2){ const ini=hist[0].valor, fim=hist[hist.length-1].valor; if(ini&&fim){ const dif=fim-ini; const pct=(dif/ini*100);
    variacao=`<span style="color:${dif>=0?'var(--ok)':'var(--danger)'};font-weight:700"><i class="fas fa-arrow-trend-${dif>=0?'up':'down'}"></i> ${dif>=0?'+':''}${money(dif)} (${dif>=0?'+':''}${pct.toFixed(1)}%)</span>`; } }
  el.innerHTML=`
    <div style="display:flex;gap:14px;align-items:center;background:var(--brand-50);border-radius:12px;padding:16px 18px;margin-bottom:16px">
      <div style="width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px"><i class="fas fa-car"></i></div>
      <div><div style="font-size:.78rem;color:var(--text-2)">${esc(d.Marca||'')} ${esc(d.Modelo||'')} · ${esc(String(d.AnoModelo||''))} · ${esc(d.Combustivel||'')}</div>
        <div style="font-size:1.5rem;font-weight:800;color:var(--brand-dark)">${esc(d.Valor||'-')}</div>
        <div style="font-size:.75rem;color:var(--text-3)">Referência: ${esc((d.MesReferencia||'').trim())}${d.CodigoFipe?' · FIPE '+esc(d.CodigoFipe):''}</div></div>
    </div>
    ${hist.length>=2?`<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><b style="font-size:.9rem">Evolução (${hist.length} consultas)</b>${variacao}</div>
      ${sparkline(hist)}
      <div class="tbl-wrap" style="margin-top:12px;max-height:180px;overflow-y:auto"><table><thead><tr><th>Referência</th><th>Valor</th></tr></thead><tbody>
      ${hist.slice().reverse().map(h=>`<tr><td>${esc((h.mes||'').trim())}</td><td>${esc(h.label)}</td></tr>`).join('')}
      </tbody></table></div>`
    :`<div style="background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.82rem;color:var(--text-2)"><i class="fas fa-clock-rotate-left" style="color:var(--brand)"></i> Este é o primeiro retrato deste veículo. A cada consulta guardamos o valor, e a evolução mês a mês vai aparecendo aqui — ótimo para mostrar ao cliente na renovação.</div>`}
    <p style="font-size:.72rem;color:var(--text-3);margin-top:12px"><i class="fas fa-circle-info"></i> Fonte: Tabela FIPE (parallelum), consultada ao vivo por marca/modelo.</p>`;
}
function sparkline(hist){
  const vals=hist.map(h=>h.valor).filter(v=>v!=null); if(vals.length<2) return '';
  const w=460,h=90,pad=6; const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=hist.map((d,i)=>{ const x=pad+(i/(hist.length-1))*(w-2*pad); const y=h-pad-((d.valor-min)/rng)*(h-2*pad); return [x,y]; });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const up=vals[vals.length-1]>=vals[0]; const cor=up?'var(--ok)':'var(--danger)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:90px;overflow:visible">
    <path d="${area}" fill="${cor}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${cor}"/>`).join('')}
  </svg>`;
}
