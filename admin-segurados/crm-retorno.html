async function confirmarAprovacao(id){
  const m=CACHE.movimentacoes.find(x=>x.id===id); if(!m) return;
  const cartao=(document.getElementById('apCartao')?.value||'').trim();
  const cert=(document.getElementById('apCert')?.value||'').trim();
  const obs=(document.getElementById('apObs')?.value||'').trim();
  const vig=(document.getElementById('apVigencia')?.value||'').trim();
  const planos=PLANOS_MOV(m);
  try{
    await db.collection('movimentacoes_beneficiarios').doc(id).update({
      status:'aprovado', observacaoAdmin:obs||null, cartao:cartao||null, certificado:cert||null,
      ...(m.tipo==='inclusao'?{dataVigencia:vig||m.dataVigencia||null}:{dataExclusao:vig||m.dataExclusao||null}),
      aprovadoPor:CURRENT_USER?.email||'admin', atualizadoEm:FV.serverTimestamp() });
    if(m.tipo==='inclusao'){
      /* um registro de beneficiário por produto marcado pela empresa */
      const lote=db.batch();
      (planos.length?planos:[m.plano]).filter(Boolean).forEach(k=>{
        lote.set(db.collection('beneficiarios').doc(),{
          empresaId:m.empresaId||null, empresaNome:m.empresaNome||null, nome:m.nome, cpf:m.cpf,
          dataNascimento:m.dataNascimento||null, plano:k, titularidade:m.titularidade||'titular',
          parentesco:m.parentesco||null, cpfTitular:m.cpfTitular||null, nomeMae:m.nomeMae||null,
          dataAdmissao:m.dataAdmissao||null, movimentacaoId:id,
          cartao:cartao||null, certificado:cert||null, status:'ativo',
          vigenciaInicio:vig||m.dataVigencia||m.dataAdmissao||null,
          dataInicio:FV.serverTimestamp(), criadoEm:FV.serverTimestamp() });
      });
      await lote.commit();
    }
    if(m.tipo==='exclusao'){
      /* encerra todos os produtos que a empresa marcou */
      const ids=(m.beneficiarioIds&&m.beneficiarioIds.length?m.beneficiarioIds:(m.beneficiarioId?[m.beneficiarioId]:[]))
        .filter(Boolean);
      const alvos=ids.length?ids:CACHE.beneficiarios.filter(b=>
        (b.cpf||'').replace(/\D/g,'')===(m.cpf||'').replace(/\D/g,'') &&
        (m.empresaId?b.empresaId===m.empresaId:(b.empresaNome||'')===(m.empresaNome||'')) &&
        planos.includes(b.plano) && b.status!=='inativo').map(b=>b.id);
      if(alvos.length){
        const lote=db.batch();
        alvos.forEach(bid=>lote.update(db.collection('beneficiarios').doc(bid),{
          status:'inativo', vigenciaFim:vig||m.dataExclusao||null, dataFim:vig||m.dataExclusao||null,
          motivoSaida:m.motivo||null, atualizadoEm:FV.serverTimestamp() }));
        await lote.commit();
      }
    }
    closeModal(); toast('Movimentação aprovada. A lista já se atualizou.','ok','Aprovado');
    // a tela se atualiza sozinha via onSnapshot — sem F5
  }catch(e){ console.error(e); toast('Erro ao aprovar. Tente novamente.','err'); }
}

async function lkSalvarDados(){
  const id=document.getElementById('ldId').value;
  const g=i=>document.getElementById(i).value.trim();
  const nome=g('ldNome'); if(!nome){ toast('Informe o nome.','err'); return; }
  const dados={ nome, nomeEmpresa:g('ldEmpresa')||null,
    whatsapp:g('ldWhats').replace(/\D/g,'')||null, email:g('ldEmail')||null,
    cpf:g('ldCpf')||null, dataNascimento:g('ldNasc')||null,
    cep:g('ldCep')||null, cidade:g('ldCidade')||null, estado:(g('ldUf')||'').toUpperCase()||null,
    endereco:g('ldEnd')||null, ramo:g('ldRamo')||null, atualizadoEm:FV.serverTimestamp() };
  try{
    await db.collection('leads_crm').doc(id).update(dados);
    /* espelha nas apólices do mesmo contato, para não ficar dado velho por lá */
    const c=CACHE.leads.find(x=>x.id===id)||{};

async function lkAgendarRetorno(id,data,hora,texto){
  const c=CACHE.leads.find(x=>x.id===id)||{};
  const nome=c.nome||c.nomeEmpresa||'contato';
  const chave='lead-retorno:'+id;
  try{
    const eu=(CURRENT_USER&&CURRENT_USER.email)||'admin';
    const existente=(typeof AGENDA!=='undefined'?AGENDA:[]).find(t=>t.sugestaoChave===chave&&t.status!=='concluida'&&t.status!=='cancelada');
    const dados={ titulo:'Retornar para '+nome, descricao:texto||('Retorno combinado na cotação de '+(c.ramo||'seguro')+'.'),
      data, hora:hora||null, tipo:'ligacao', prioridade:'normal',
      vinculo:{tipo:'lead',id:id,nome:nome}, sugestaoChave:chave, origem:'lead',
      responsaveis:c.responsavelId?[( (CACHE.admins.find(a=>a.id===c.responsavelId)||{}).email||eu)]:[eu],
      atualizadoEm:FV.serverTimestamp() };
    dados.responsaveisNomes=dados.responsaveis.map(x=>typeof agNomeDe==='function'?agNomeDe(x):x);
    if(existente){ await db.collection('agenda_crm').doc(existente.id).update(dados); }
    else { await db.collection('agenda_crm').add({...dados,status:'aberta',criadoPor:eu,criadoEm:FV.serverTimestamp()}); }
    await db.collection('leads_crm').doc(id).update({proximoRetorno:data,proximoRetornoHora:hora||null,atualizadoEm:FV.serverTimestamp()});
    return true;
  }catch(e){ console.error(e); return false; }
}

async function carregarAnexos(apoliceId){ const el=document.getElementById('apAnexosList'); if(!el) return;
  try{ const snap=await db.collection('arquivos').where('refId','==',apoliceId).get();
    const arr=snap.docs.map(d=>({id:d.id,...d.data()}));
    // inclui o PDF da proposta, se houver
    const a=CACHE.apolices.find(x=>x.id===apoliceId); const extra=a&&a.anexoPropostaPdf?[{id:a.anexoPropostaPdf,nome:'Proposta (PDF)',_proposta:true}]:[];
    const todos=[...extra,...arr];
    el.innerHTML= todos.length? todos.map(x=>`<div class="cred"><span class="cred-v" style="flex:1">${esc(x.nome||'arquivo')}${x.tamanho?` <span style="color:var(--text-3);font-weight:400">(${Math.round(x.tamanho/1024)} KB)</span>`:''}</span>
        <button class="cp" onclick="baixarArquivo('${x.id}')" title="Baixar"><i class="fas fa-download"></i></button>
        ${x._proposta?'':`<button class="cp" style="background:var(--danger-bg);color:var(--danger)" onclick="excluirAnexo('${x.id}','${apoliceId}')" title="Excluir"><i class="fas fa-trash"></i></button>`}</div>`).join('')
      : '<span style="font-size:.8rem;color:var(--text-3)">Nenhum anexo ainda.</span>';
  }catch(e){ console.warn(e); el.innerHTML='<span style="font-size:.8rem;color:var(--danger)">Erro ao carregar anexos.</span>'; } }
async function anexarNaApolice(apoliceId){ const inp=document.getElementById('apAnexoFile'); const file=inp&&inp.files[0];
  if(!file){ toast('Selecione um arquivo.','info'); return; }
  toast('Anexando...','info');
  const id=await salvarPdfArquivo(file,'apolice',apoliceId);
  if(id){ toast('Anexo salvo.','ok'); inp.value=''; carregarAnexos(apoliceId); }
}
async function excluirAnexo(id,apoliceId){ try{ await db.collection('arquivos').doc(id).delete(); toast('Anexo removido.','ok'); carregarAnexos(apoliceId); }catch(e){ toast('Erro.','err'); } }
const ENDOSSO_TIPOS={alteracao_veiculo:'Troca de veículo',alteracao_cobertura:'Alteração de cobertura',inclusao:'Inclusão',exclusao:'Exclusão',cancelamento:'Cancelamento',outro:'Outro'};
function modalEndosso(id){ const a=CACHE.apolices.find(x=>x.id===id); if(!a) return;
  openModal(`<div class="modal-head"><h3><i class="fas fa-file-pen" style="color:var(--brand)"></i> Incluir endosso</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body"><input type="hidden" id="edApId" value="${id}">
      <p style="color:var(--text-2);margin-bottom:14px">Apólice <b>${esc(a.numeroApolice||'')}</b> · ${esc(a.clienteNome||'')}</p>
      <div class="form-row"><label>Tipo de endosso</label><select id="edTipo" onchange="edToggleCancel()">
        ${Object.entries(ENDOSSO_TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="form-row"><label>Descrição (ex.: troca do veículo X pelo Y)</label><textarea id="edDesc" rows="2"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-row"><label>Financeiro</label><select id="edSinal"><option value="1">A pagar (cliente paga)</option><option value="-1">A restituir (devolve ao cliente)</option><option value="0">Sem valor</option></select></div>
        <div class="form-row"><label>Valor (R$)</label><input type="number" step="0.01" id="edValor" placeholder="0,00"></div>
      </div>
      <div class="form-row" id="edComissaoWrap" style="display:none"><label>Comissão devolvida à seguradora (R$)</label><input type="number" step="0.01" id="edComissao" placeholder="0,00"></div>
      <div class="form-row"><label>Data do endosso</label><input type="date" id="edData"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="modalApolice('${id}')">Voltar</button>
      <button class="btn btn-primary" onclick="salvarEndosso('${id}')"><i class="fas fa-check"></i> Registrar endosso</button></div>`);
}
function edToggleCancel(){ const t=document.getElementById('edTipo').value; document.getElementById('edComissaoWrap').style.display=(t==='cancelamento')?'':'none'; }
async function salvarEndosso(id){
  const a=CACHE.apolices.find(x=>x.id===id); if(!a) return;
  const tipo=document.getElementById('edTipo').value;
  const sinal=parseInt(document.getElementById('edSinal').value);
  const valor=(parseFloat(document.getElementById('edValor').value)||0)*sinal;
  const comissaoDevolvida=parseFloat(document.getElementById('edComissao').value)||0;
  const endosso={ tipo, descricao:document.getElementById('edDesc').value.trim()||null, valor:valor||0,
    comissaoDevolvida:tipo==='cancelamento'?comissaoDevolvida:0, data:document.getElementById('edData').value||new Date().toISOString().slice(0,10),
    registradoEm:new Date().toISOString(), por:CURRENT_USER?.email?.split('@')[0]||'admin' };
  try{
    const upd={ endossos:firebase.firestore.FieldValue.arrayUnion(endosso), atualizadoEm:FV.serverTimestamp() };
    if(tipo==='cancelamento'){ upd.status='cancelada'; upd.renovacaoCancelada=true;
      if(comissaoDevolvida) upd.comissaoValor=(a.comissaoValor||0)-comissaoDevolvida; }
    await db.collection('apolices_cliente').doc(id).update(upd);
    closeModal(); toast('Endosso registrado'+(tipo==='cancelamento'?' — apólice cancelada e renovação suspensa.':'.'),'ok');
  }catch(e){ console.error(e); toast('Erro ao registrar endosso.','err'); }
}
function excluirApolice(id){ const a=CACHE.apolices.find(x=>x.id===id); if(!a) return;
  openModal(`<div class="modal-head"><h3><i class="fas fa-trash" style="color:var(--danger)"></i> Excluir apólice</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body"><p>Excluir a apólice <b>${esc(a.numeroApolice||'')}</b> de <b>${esc(a.clienteNome||'')}</b>? Esta ação não pode ser desfeita.</p>
    <p style="font-size:.82rem;color:var(--text-3);margin-top:8px">Dica: se foi um cancelamento com restituição/devolução de comissão, use <b>Incluir endosso → Cancelamento</b> em vez de excluir, para manter o histórico.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="modalApolice('${id}')">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmarExcluirApolice('${id}')"><i class="fas fa-trash"></i> Excluir definitivamente</button></div>`);
}
async function confirmarExcluirApolice(id){ try{ await db.collection('apolices_cliente').doc(id).delete(); closeModal(); toast('Apólice excluída.','ok'); }catch(e){ console.error(e); toast('Erro ao excluir.','err'); } }
async function salvarApolice(){ const id=document.getElementById('apId').value;
  const cliente=document.getElementById('apCliente').value.trim(); if(!cliente){ toast('Informe o cliente.','err'); return; }
  const dados={ clienteNome:cliente, clienteWhatsapp:document.getElementById('apWhats').value.replace(/\D/g,'')||null,
    clienteEmail:document.getElementById('apEmail').value.trim()||null,
    ramo:document.getElementById('apRamo').value, seguradora:document.getElementById('apSeg').value.trim()||null,
    numeroApolice:document.getElementById('apNum').value.trim()||null, status:document.getElementById('apStatus').value,
    dataInicioVigencia:document.getElementById('apIni').value||null, dataFimVigencia:document.getElementById('apFim').value||null,
    valorPremio:parseFloat(document.getElementById('apPremio').value)||0, comissao:parseFloat(document.getElementById('apComissao').value)||0,
    responsavelId:document.getElementById('apResp')?document.getElementById('apResp').value||null:null,
    responsavelNome:(function(){const v=document.getElementById('apResp')?document.getElementById('apResp').value:'';const f=(CACHE.admins||[]).find(x=>x.id===v);return f?(f.nome||f.email):null;})(),
    veiculoPlaca:document.getElementById('apPlaca').value.trim()||null, codigoFipe:document.getElementById('apFipe').value.trim()||null,
    observacoes:document.getElementById('apObs').value.trim()||null, atualizadoEm:FV.serverTimestamp() };
  try{ if(id) await db.collection('apolices_cliente').doc(id).update(dados);
    else{ dados.criadoEm=FV.serverTimestamp(); await db.collection('apolices_cliente').add(dados); }
    await upsertCliente({nome:cliente,whatsapp:dados.clienteWhatsapp,email:dados.clienteEmail});
    closeModal(); toast('Apólice salva.','ok'); }catch(e){ console.error(e); toast('Erro ao salvar.','err'); }
}
/* Garante o cliente no menu Clientes (só dados pessoais), sem duplicar */
async function upsertCliente({nome,cpf,whatsapp,email}){
  const c=(cpf||'').replace(/\D/g,''); const f=(whatsapp||'').replace(/\D/g,'');
  if(!nome&&!f&&!c) return;
  let lead=(c&&CACHE.leads.find(l=>(l.cpf||'').replace(/\D/g,'')===c))||(f&&CACHE.leads.find(l=>(l.whatsapp||l.telefone||'').replace(/\D/g,'')===f))||null;
  try{ if(lead){ const upd={}; if(!lead.email&&email)upd.email=email; if(!lead.whatsapp&&f)upd.whatsapp=f; if(!lead.cpf&&cpf)upd.cpf=cpf;
      if(Object.keys(upd).length){ upd.atualizadoEm=FV.serverTimestamp(); await db.collection('leads_crm').doc(lead.id).update(upd); } }
    else { await db.collection('leads_crm').add({ nome:nome||null, cpf:cpf||null, whatsapp:f||null, email:email||null, status:'cliente', origem:'apolice', criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp() }); }
  }catch(e){ console.warn('upsertCliente',e); }
}

/* ---------- RENOVAÇÕES (antes era um TODO — agora funciona) ---------- */
VIEWS.renovacoes=function(){
  let html=head('renovacoes');
  const comVenc=CACHE.apolices.filter(a=>toDate(a.dataFimVigencia)&&a.status!=='cancelada').map(a=>({...a,dias:diasAte(a.dataFimVigencia)}));
  const vencidas=comVenc.filter(a=>a.dias<0).sort((a,b)=>a.dias-b.dias);
  const proximas=comVenc.filter(a=>a.dias>=0&&a.dias<=60).sort((a,b)=>a.dias-b.dias);
  html+=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <div class="kpi"><div class="ico i-danger"><i class="fas fa-triangle-exclamation"></i></div><div class="val">${vencidas.length}</div><div class="lbl">Vencidas</div></div>
    <div class="kpi"><div class="ico i-warn"><i class="fas fa-hourglass-half"></i></div><div class="val">${proximas.length}</div><div class="lbl">Vencem em até 60 dias</div></div>
    <div class="kpi"><div class="ico i-ok"><i class="fas fa-file-contract"></i></div><div class="val">${comVenc.length}</div><div class="lbl">Apólices com vigência</div></div>
  </div>`;
  const linha=a=>{ const venc=a.dias<0; const cor=venc?'var(--danger)':a.dias<=15?'var(--warn)':'var(--info)';
    return `<tr><td><b>${esc(a.clienteNome||'-')}</b></td><td>${esc(a.ramo||'-')} · ${esc(a.seguradora||'')}</td><td>Nº ${esc(a.numeroApolice||'-')}</td>
    <td>${fmtData(a.dataFimVigencia)}</td><td>${statusBadge(venc?Math.abs(a.dias)+' dias vencida':'em '+a.dias+' dias',cor)}</td><td>${money(a.valorPremio)}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="modalApolice('${a.id}')"><i class="fas fa-rotate"></i> Renovar</button></td></tr>`; };
  const tabela=(titulo,arr,ic)=>`<div class="card" style="margin-bottom:18px"><div class="card-head"><h3><i class="fas ${ic}"></i> ${titulo}</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Apólice</th><th>Número</th><th>Vencimento</th><th>Prazo</th><th>Prêmio</th><th></th></tr></thead><tbody>
    ${arr.length?arr.map(linha).join(''):`<tr><td colspan="7"><div class="empty" style="padding:26px"><div class="em-ic"><i class="fas fa-check"></i></div><h4>Nada aqui</h4></div></td></tr>`}
    </tbody></table></div></div>`;
  html+=tabela('Vencidas',vencidas,'fa-triangle-exclamation')+tabela('Próximas de vencer (60 dias)',proximas,'fa-hourglass-half');
  setView(html);
};

  </div>`;

function modalParceiro(id){ const p=id?CACHE.parceiros.find(x=>x.id===id)||{}:{};
  openModal(`<div class="modal-head"><h3><i class="fas fa-handshake" style="color:var(--brand)"></i> ${id?'Editar':'Novo'} parceiro</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body"><input type="hidden" id="paId" value="${id||''}">
      <div class="form-row"><label>Nome da empresa *</label><input type="text" id="paNome" value="${esc(p.nomeEmpresa||'')}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-row"><label>Responsável</label><input type="text" id="paResp" value="${esc(p.responsavel||'')}"></div>
        <div class="form-row"><label>Código</label><input type="text" id="paCod" value="${esc(p.codigo||'')}"></div>
        <div class="form-row"><label>Segmento</label><input type="text" id="paSeg" value="${esc(p.segmento||'')}"></div>
        <div class="form-row"><label>Comissão (%)</label><input type="number" step="0.01" id="paCom" value="${p.comissao||''}"></div>
        <div class="form-row"><label>WhatsApp</label><input type="text" id="paWhats" value="${esc(p.whatsapp||'')}"></div>
        <div class="form-row"><label>E-mail</label><input type="email" id="paEmail" value="${esc(p.email||'')}"></div>
      </div>
      <div class="form-row"><label>Status</label><select id="paStatus"><option value="ativo" ${p.status!=='inativo'&&p.status!=='suspenso'?'selected':''}>Ativo</option><option value="suspenso" ${p.status==='suspenso'?'selected':''}>Suspenso</option><option value="inativo" ${p.status==='inativo'?'selected':''}>Inativo</option></select></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarParceiro()"><i class="fas fa-floppy-disk"></i> Salvar</button></div>`);
}
async function salvarParceiro(){ const id=document.getElementById('paId').value; const nome=document.getElementById('paNome').value.trim();
  if(!nome){ toast('Informe o nome.','err'); return; }
  const dados={nomeEmpresa:nome,responsavel:document.getElementById('paResp').value.trim()||null,codigo:document.getElementById('paCod').value.trim()||null,
    segmento:document.getElementById('paSeg').value.trim()||null,comissao:parseFloat(document.getElementById('paCom').value)||0,
    whatsapp:document.getElementById('paWhats').value.replace(/\D/g,'')||null,email:document.getElementById('paEmail').value.trim()||null,
    status:document.getElementById('paStatus').value,atualizadoEm:FV.serverTimestamp()};
  try{ if(id) await db.collection('empresas_parceiras').doc(id).update(dados); else{ dados.totalIndicacoes=0;dados.indicacoesConvertidas=0;dados.valorGerado=0;dados.criadoEm=FV.serverTimestamp(); await db.collection('empresas_parceiras').add(dados);} closeModal(); toast('Parceiro salvo.','ok'); }catch(e){ console.error(e); toast('Erro ao salvar.','err'); }
}

VIEWS.resgates=function(){
  let html=head('resgates');
  const rs=CACHE.resgates.slice().sort((a,b)=>(toDate(b.criadoEm)||0)-(toDate(a.criadoEm)||0));
  const pend=rs.filter(r=>r.status==='pendente');
  const totalPend=pend.reduce((s,r)=>s+(Number(r.valor)||0),0);
  html+=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <div class="kpi"><div class="ico i-warn"><i class="fas fa-clock"></i></div><div class="val">${pend.length}</div><div class="lbl">Resgates pendentes</div></div>
    <div class="kpi"><div class="ico i-purple"><i class="fas fa-sack-dollar"></i></div><div class="val" style="font-size:1.4rem">${money(totalPend)}</div><div class="lbl">Valor pendente</div></div>
    <div class="kpi"><div class="ico i-ok"><i class="fas fa-gift"></i></div><div class="val">${rs.length}</div><div class="lbl">Total de resgates</div></div>
  </div>`;
  html+=`<div class="card"><div class="card-head"><h3><i class="fas fa-gift"></i> Resgates de parceiros</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Parceiro</th><th>Valor</th><th>Método</th><th>Dados</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>
    ${rs.length?rs.map(r=>{ const cor=r.status==='pago'?'var(--ok)':r.status==='rejeitado'?'var(--danger)':r.status==='aprovado'?'var(--info)':'var(--warn)';
      return `<tr><td><b>${esc(r.parceiroNome||'-')}</b><br><small style="color:var(--text-3)">${esc(r.parceiroCodigo||'')}</small></td>
      <td><b>${money(r.valor)}</b></td><td>${esc(r.metodo||'-')}</td><td style="max-width:180px;font-size:.8rem;color:var(--text-2)">${esc(r.dadosPagamento||'-')}</td>
      <td>${fmtData(r.criadoEm)}</td><td>${statusBadge(r.status||'pendente',cor)}</td>
      <td style="white-space:nowrap">${r.status==='pendente'?`<button class="btn btn-success btn-sm" onclick="resgateStatus('${r.id}','aprovado')"><i class="fas fa-check"></i></button> <button class="btn btn-danger btn-sm" onclick="resgateStatus('${r.id}','rejeitado')"><i class="fas fa-xmark"></i></button>`:r.status==='aprovado'?`<button class="btn btn-primary btn-sm" onclick="resgateStatus('${r.id}','pago')"><i class="fas fa-money-bill"></i> Pagar</button>`:'-'}</td></tr>`;
    }).join(''):`<tr><td colspan="7"><div class="empty"><div class="em-ic"><i class="fas fa-gift"></i></div><h4>Nenhum resgate</h4></div></td></tr>`}
    </tbody></table></div></div>`;
  setView(html);
};
async function resgateStatus(id,status){ try{ const upd={status,atualizadoEm:FV.serverTimestamp()}; if(status==='pago') upd.dataPagamento=FV.serverTimestamp();
  await db.collection('resgates_parceiros').doc(id).update(upd); toast('Resgate '+({aprovado:'aprovado',rejeitado:'rejeitado',pago:'marcado como pago'}[status])+'.','ok'); }catch(e){ console.error(e); toast('Erro.','err'); } }

function perfFuncionario(f){ const meus=CACHE.leads.filter(l=>l.responsavelId===f.id||(l.responsavelNome&&f.nome&&l.responsavelNome===f.nome));
  const fechados=meus.filter(l=>l.status==='negocio_fechado'); const conv=meus.length?Math.round(fechados.length/meus.length*100):0;
  return {recebidos:meus.length,fechados:fechados.length,conv}; }

/* período aquisitivo e saldo (regra prática: 30 dias por ano de casa) */
function feriasInfo(f){
  const adm=dataObj(strData(f.dataAdmissao)); if(!adm) return null;
  const hoje=new Date();
  let anos=hoje.getFullYear()-adm.getFullYear();
  const aniv=new Date(hoje.getFullYear(),adm.getMonth(),adm.getDate());
  if(hoje<aniv) anos--;
  if(anos<0) anos=0;
  const iniPeriodo=new Date(adm.getFullYear()+anos,adm.getMonth(),adm.getDate());
  const fimPeriodo=new Date(iniPeriodo.getFullYear()+1,iniPeriodo.getMonth(),iniPeriodo.getDate()-1);
  const limite=new Date(fimPeriodo.getFullYear()+1,fimPeriodo.getMonth(),fimPeriodo.getDate());
  const direito=anos*30;
  const gozados=(f.ferias||[]).reduce((s,x)=>s+(Number(x.dias)||0),0);
  const saldo=direito-gozados;
  const diasParaLimite=Math.round((limite-hoje)/86400000);
  return {adm,anos,iniPeriodo,fimPeriodo,limite,direito,gozados,saldo,diasParaLimite};
}

async function criarAcessoFunc(){
  const email=document.getElementById('acEmail').value.trim().toLowerCase();
  const senha=document.getElementById('acSenha').value;
  if(!email){ toast('Informe o e-mail.','err'); return; }
  if(!senha||senha.length<6){ toast('A senha precisa de pelo menos 6 caracteres.','err'); return; }
  const btn=document.getElementById('acBtn'); btn.disabled=true;
  let app2=null;
  try{
    /* app secundário: cria o usuário sem trocar a sessão do admin */
    app2=firebase.apps.find(a=>a.name==='criarAcesso')||firebase.initializeApp(firebase.app().options,'criarAcesso');
    await app2.auth().createUserWithEmailAndPassword(email,senha);
    await app2.auth().signOut();
    closeModal();
    toast('Acesso criado. '+email+' já pode entrar com essa senha.','ok','Pronto');
  }catch(e){
    console.error(e);
    if(e.code==='auth/email-already-in-use'){
      toast('Esse e-mail já tem acesso. Use "Enviar link para trocar a senha".','warn','Já existe');
    } else if(e.code==='auth/weak-password'){ toast('Senha fraca demais — use 6 caracteres ou mais.','err'); }

    btn.disabled=false;
  }
}

function lerArquivoImport(ev){ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ document.getElementById('impTexto').value=r.result; previewImport(); }; r.readAsText(f,'utf-8'); }
function dataBR(v){ v=(v||'').trim(); if(!v) return '';
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(v);
  if(m){ let a=m[3]; if(a.length===2) a=(Number(a)>30?'19':'20')+a;
    return a+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
  return '';
}
function previewImport(){ const txt=document.getElementById('impTexto').value.trim(); if(!txt){ toast('Cole a lista ou selecione um arquivo.','info'); return; }
  const linhas=txt.split(/\r?\n/).filter(x=>x.trim());
  if(IMPORT_MODO==='atualizar') return previewAtualizar(linhas);
  IMPORT_ROWS=linhas.map(l=>{ const c=l.split(/[;,\t]/).map(x=>x.trim());
    if(/nome/i.test(c[0])&&/cpf/i.test(c[1]||'')) return null; // pula cabeçalho

function previewAtualizar(linhas){
  const empId=document.getElementById('impEmpresa').value;

  if(!empId){ toast('Selecione a empresa primeiro.','err'); return; }
  const base=CACHE.beneficiarios.filter(b=>b.empresaId===empId);
  IMPORT_ROWS=linhas.map(l=>{
    const c=l.split(/[;,\t]/).map(x=>x.trim());
    if(/cpf/i.test(c[0]||'')) return null;                       // cabeçalho
    const cpf=soDig(c[0]);
    if(cpf.length!==11) return null;
    const nasc=dataBR(c[1]), adm=dataBR(c[2]);
    const docs=base.filter(b=>soDig(b.cpf)===cpf);
    return {cpf:c[0].trim(),cpfN:cpf,nasc,adm,docs,
      nome:docs.length?docs[0].nome:'—',
      jaTem:docs.length?!!strData(docs[0].dataNascimento):false};
  }).filter(Boolean);
  const achados=IMPORT_ROWS.filter(r=>r.docs.length);
  const perdidos=IMPORT_ROWS.filter(r=>!r.docs.length);
  const comData=achados.filter(r=>r.nasc||r.adm);
  if(!IMPORT_ROWS.length){ el.innerHTML=`<div class="card"><div class="empty"><div class="em-ic"><i class="fas fa-triangle-exclamation"></i></div>

      <span><b>${comData.length}</b> com data para gravar</span>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>CPF</th><th>Beneficiário</th><th>Nascimento</th><th>Admissão</th><th>Situação</th></tr></thead><tbody>
    ${IMPORT_ROWS.slice(0,80).map(r=>`<tr>
      <td>${esc(r.cpf)}</td><td>${esc(r.nome)}</td>

      <td>${!r.docs.length?'<span class="badge" style="background:var(--danger-bg);color:var(--danger)">CPF não encontrado</span>'
        :!r.nasc&&!r.adm?'<span class="badge" style="background:var(--surface-3);color:var(--text-3)">sem data — será ignorada</span>'
        :r.jaTem?`<span class="badge" style="background:var(--warn-bg);color:var(--warn)">já tinha data — será substituída</span>`
        :`<span class="badge" style="background:var(--ok-bg);color:var(--ok)">vai preencher ${r.docs.length} registro(s)</span>`}</td>
    </tr>`).join('')}
    </tbody></table></div>
    ${IMPORT_ROWS.length>80?`<div style="color:var(--text-3);font-size:.82rem;margin-top:10px">Mostrando 80 de ${IMPORT_ROWS.length}.</div>`:''}

      CPFs sem cadastro nesta empresa: ${esc(perdidos.slice(0,10).map(r=>r.cpf).join(', '))}${perdidos.length>10?' e mais '+(perdidos.length-10):''}.</div>`:''}

}
async function confirmarAtualizar(){
  const alvos=IMPORT_ROWS.filter(r=>r.docs.length&&(r.nasc||r.adm));
  if(!alvos.length){ toast('Nenhuma linha com data para gravar.','info'); return; }
  toast('Atualizando '+alvos.length+' pessoa(s)...','info','Aguarde');
  try{
    let lote=db.batch(), n=0, pessoas=0, regs=0;
    for(const r of alvos){
      for(const d of r.docs){
        const up={atualizadoEm:FV.serverTimestamp()};
        if(r.nasc) up.dataNascimento=r.nasc;
        if(r.adm&&d.titularidade!=='dependente') up.dataAdmissao=r.adm;
        lote.update(db.collection('beneficiarios').doc(d.id),up);
        n++; regs++;
        if(n>=400){ await lote.commit(); lote=db.batch(); n=0; }
      }
      pessoas++;
    }
    if(n>0) await lote.commit();
    IMPORT_ROWS=[]; document.getElementById('impPreview').innerHTML=''; document.getElementById('impTexto').value='';
    toast(pessoas+' pessoa(s) atualizada(s) em '+regs+' registro(s).','ok','Concluído');
  }catch(e){ console.error(e); toast('Erro ao atualizar. Tente um lote menor.','err'); }
}

async function confirmarImport(){ const empId=document.getElementById('impEmpresa').value; if(!empId){ toast('Selecione a empresa de destino.','err'); return; }
  const emp=CACHE.empresas.find(e=>e.id===empId); if(!IMPORT_ROWS.length){ toast('Nada para importar.','info'); return; }
  toast('Importando '+IMPORT_ROWS.length+' beneficiário(s)...','info','Aguarde');
  try{ let batch=db.batch(),n=0,total=0;
    for(const r of IMPORT_ROWS){ const ref=db.collection('beneficiarios').doc();
      batch.set(ref,{empresaId:empId,empresaNome:emp?.nomeEmpresa||null,nome:r.nome,cpf:r.cpf||null,plano:r.plano,titularidade:r.titularidade,dataNascimento:r.dataNascimento||null,status:'ativo',dataInicio:FV.serverTimestamp(),criadoEm:FV.serverTimestamp(),origem:'importacao'});
      n++;total++; if(n>=400){ await batch.commit(); batch=db.batch(); n=0; } }
    if(n>0) await batch.commit();
    IMPORT_ROWS=[]; document.getElementById('impPreview').innerHTML=''; document.getElementById('impTexto').value='';
    toast(total+' beneficiário(s) importado(s) para '+(emp?.nomeEmpresa||'a empresa')+'.','ok','Concluído');
  }catch(e){ console.error(e); toast('Erro ao importar. Tente um lote menor.','err'); }
}

async function extrairTextoPDF(file){
  if(!window.pdfjsLib){ throw new Error('pdf.js não carregou (verifique a conexão).'); }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let out='';
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const c=await pg.getTextContent(); out+=c.items.map(it=>it.str).join(' ')+'\n'; }
  return out;
}
async function processarPropostas(files){
  const arr=[...files].filter(f=>/pdf$/i.test(f.name)||f.type==='application/pdf');
  if(!arr.length){ toast('Selecione arquivos PDF.','err'); return; }
  toast('Lendo '+arr.length+' proposta(s)...','info','Aguarde');
  for(const f of arr){
    try{
      const texto=await extrairTextoPDF(f);
      const r=parseProposta(texto);
      r.arquivo=f.name; r.__texto=texto; r.__file=f; r.__id='p'+(PROP_RESULTS.length+1)+'_'+Date.now();
      PROP_RESULTS.unshift(r);
    }catch(e){ console.error(e); PROP_RESULTS.unshift({arquivo:f.name,reconhecido:false,warnings:['Erro ao ler o PDF: '+e.message]}); }
  }
  if((location.hash||'').slice(1)==='propostas') renderPropResults();
}

async function vincularClienteProposta(r){

  let lead=(cpf&&CACHE.leads.find(l=>(l.cpf||'').replace(/\D/g,'')===cpf)) || (fone&&CACHE.leads.find(l=>(l.whatsapp||l.telefone||'').replace(/\D/g,'')===fone)) || null;
  try{
    let leadId;
    if(lead){ leadId=lead.id; const upd={status:'cliente'};
      if(!lead.email&&r.email) upd.email=r.email;
      if(!lead.whatsapp&&fone) upd.whatsapp=fone;
      if(!lead.cpf&&r.cpfCnpj) upd.cpf=r.cpfCnpj;
      if(!lead.ramo&&r.ramo) upd.ramo=r.ramo;
      if(!lead.cep&&r.cep) upd.cep=r.cep;
      if(!lead.cidade&&r.cidade) upd.cidade=r.cidade;

        ramo:r.ramo||null, status:'cliente', origem:'proposta',

/* Tabela de parcelas: valor de cada uma + vencimentos mensais a partir do início de vigência */
function tabelaParcelas(o){
  const n=parseInt(o.parcelas)||1; const total=(+o.premioTotal)|| ((+o.valorParcela||0)*n) || 0;
  const iniStr=converterData(o.vigenciaInicio); const ini=iniStr?new Date(iniStr+'T00:00:00'):null;
  const vals=[];
  if(o.valorParcela && o.premioTotal && n>1){ const rest=(o.premioTotal - o.valorParcela)/(n-1); for(let i=0;i<n;i++) vals.push(i===0?+o.valorParcela:rest); }
  else { for(let i=0;i<n;i++) vals.push(total/n); }
  let rows=''; for(let i=0;i<n;i++){ let dt='-'; if(ini){ const d=new Date(ini); d.setMonth(d.getMonth()+i); dt=d.toLocaleDateString('pt-BR'); }
    rows+=`<tr><td>${i+1}ª</td><td>${dt}</td><td>${money(vals[i])}</td></tr>`; }
  return `<div class="tbl-wrap" style="border:1px solid var(--border);border-radius:8px"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ============ CONSULTA FIPE — API parallelum (marca/modelo/ano, a mesma do site) ============ */
const FIPE_BASE='https://parallelum.com.br/fipe/api/v1/carros';
function NUMBR(s){ const n=parseFloat(s); return isNaN(n)?null:n; }
function fipeNum(v){ return NUMBR(String(v||'').replace(/[R$\s.]/g,'').replace(',','.')); }
function fipeNorm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function fipeTokens(s){ return fipeNorm(s).replace(/[^\w.\s]/g,' ').split(/\s+/).filter(x=>x.length>1); }
async function fipeGet(u){ const r=await fetch(u); if(!r.ok) throw new Error('API FIPE respondeu '+r.status); return r.json(); }
function fipeBtn(ctx,label){ const j=encodeURIComponent(JSON.stringify(ctx||{})); return `<button class="btn btn-ghost btn-sm" style="padding:3px 9px" onclick="modalFipe(JSON.parse(decodeURIComponent(this.dataset.ctx)))" data-ctx="${j}"><i class="fas fa-magnifying-glass-dollar"></i>${label===undefined?' consultar':(label?' '+label:'')}</button>`; }
function fipeAcharMarca(marcas,nome){ const q=fipeNorm(nome); if(!q) return null;
  return marcas.find(m=>fipeNorm(m.nome)===q) || marcas.find(m=>fipeNorm(m.nome).includes(q)||q.includes(fipeNorm(m.nome))) ||
    marcas.find(m=>fipeNorm(m.nome).split(/[\s\-]+/).some(tk=>tk.length>2&&q.includes(tk))); }
function fipeScore(alvo,nome){ const nt=fipeTokens(nome); let sc=0; alvo.forEach(t=>{ if(nt.includes(t)) sc+=2; else if(nt.some(x=>x.startsWith(t)||t.startsWith(x))) sc+=1; }); return sc; }

const BRASIL_FIPE='https://brasilapi.com.br/api/fipe';
const MESES_PT={janeiro:1,fevereiro:2,'março':3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function mesRefKey(s){ s=(s||'').toString().toLowerCase().trim(); const m=s.match(/([a-zç]+)\D+(\d{4})/) || s.match(/(\d{4})[-\/](\d{1,2})/); if(!m) return 0;
  if(/^\d/.test(m[1])) return (+m[1])*100+(+m[2]); return (+m[2])*100+(MESES_PT[m[1]]||0); }
async function modalFipe(ctx){ ctx=ctx||{};
  openModal(`<div class="modal-head"><h3><i class="fas fa-magnifying-glass-dollar" style="color:var(--brand)"></i> Valor FIPE${ctx.codigo?' · '+esc(ctx.codigo):''}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="fipeBody"><div class="empty" style="padding:30px"><div class="em-ic"><i class="fas fa-spinner fa-spin"></i></div><h4>Consultando a tabela FIPE...</h4><p>Buscando valor atual e histórico dos últimos meses.</p></div></div>`);
  // Caminho 1: pelo CÓDIGO da proposta (traz o veículo exato + histórico automático dos últimos meses)
  if(ctx.codigo){ try{ await fipeViaCodigo(ctx); return; }catch(e){ console.warn('FIPE por código falhou, tentando por marca/modelo:',e&&e.message); } }
  // Caminho 2: por marca/modelo (fallback) — casa pelo código quando possível p/ não trazer o errado
  try{ await fipeViaModelo(ctx); }catch(e){ fipeErro(e); }
}
/* Consulta por código (BrasilAPI): valor atual + últimos meses automaticamente */
async function fipeViaCodigo(ctx){
  const cod=ctx.codigo;
  const arr=await fipeGet(BRASIL_FIPE+'/preco/v1/'+encodeURIComponent(cod));
  const cur=fipePorAnoComb(arr,ctx.ano,ctx.comb); if(!cur) throw new Error('código sem retorno');
  // histórico: últimas ~12 tabelas de referência
  let hist=[]; try{ const tabs=await fipeGet(BRASIL_FIPE+'/tabelas/v1'); const refs=(tabs||[]).slice(0,12);
    for(const t of refs){ try{ const a=await fipeGet(BRASIL_FIPE+'/preco/v1/'+encodeURIComponent(cod)+'?tabela_referencia='+t.codigo); const it=fipePorAnoComb(a,ctx.ano,ctx.comb);
      if(it) hist.push({mes:(it.mesReferencia||t.mes||'').trim(),valor:fipeNum(it.valor),label:it.valor}); }catch(e){} } }catch(e){}
  hist=hist.filter(h=>h.valor).sort((a,b)=>mesRefKey(a.mes)-mesRefKey(b.mes));
  await fipeSalvarSnap(cod,(cur.marca||'')+' '+(cur.modelo||''),cur.valor,cur.anoModelo,(cur.mesReferencia||'').trim());
  renderFipe({Marca:cur.marca,Modelo:cur.modelo,AnoModelo:cur.anoModelo,Combustivel:cur.combustivel,Valor:cur.valor,MesReferencia:cur.mesReferencia,CodigoFipe:cur.codigoFipe||cod}, hist, hist.length?'brasil':'nova');
}
function fipePorAnoComb(arr,ano,comb){ if(!Array.isArray(arr)||!arr.length) return null; let c=arr;
  if(ano){ const f=c.filter(x=>String(x.anoModelo)===String(ano)); if(f.length) c=f; }
  if(comb){ const cc=comb.toLowerCase(); const f=c.filter(x=>(x.combustivel||'').toLowerCase().includes(cc)); if(f.length) c=f; }
  return c[0]; }
/* Consulta por marca/modelo (parallelum) — confirma pelo código da proposta */
async function fipeViaModelo(ctx){
  if(!ctx.modelo) throw new Error('Faltam dados do veículo para consultar a FIPE.');
  if(!ctx.marca) ctx.marca=ctx.modelo.split(' ')[0]; // tentativa: 1ª palavra do modelo
  const marcas=await fipeGet(FIPE_BASE+'/marcas');
  const marca=fipeAcharMarca(marcas,ctx.marca); if(!marca) throw new Error('Não identifiquei a marca do veículo "'+esc(ctx.modelo)+'" — me avise que eu ensino este modelo.');
  const mr=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos'); const modelos=mr.modelos||[]; const alvo=fipeTokens(ctx.modelo);
  const ranked=modelos.map(m=>({m,sc:fipeScore(alvo,m.nome)})).sort((a,b)=>b.sc-a.sc).filter(x=>x.sc>0).slice(0,8);
  if(!ranked.length) throw new Error('Modelo não encontrado automaticamente.');
  // se temos o código, testamos os candidatos e escolhemos o que bate o código exato
  if(ctx.codigo){
    for(const c of ranked){ try{ const d=await fipeBuscarValor(marca,c.m,ctx);
      if(d && (d.CodigoFipe||'').replace(/\D/g,'')===String(ctx.codigo).replace(/\D/g,'')){ return fipeFinalizarParallelum(d,ctx); } }catch(e){} }
  }
  // sem código ou nenhum bateu: se ambíguo, deixa escolher; senão usa o melhor
  if(ranked.length>1 && (ranked[0].sc-(ranked[1]?ranked[1].sc:0))<2){ window.__fipePick={marca,top:ranked,ctx}; return fipeEscolherModelo(ranked,ctx); }
  const d=await fipeBuscarValor(marca,ranked[0].m,ctx); return fipeFinalizarParallelum(d,ctx);
}
async function fipeBuscarValor(marca,modelo,ctx){
  const anos=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos/'+modelo.codigo+'/anos');
  const ano=anos.find(a=>String(a.nome).startsWith(String(ctx.ano||''))) || anos.find(a=>String(a.codigo).startsWith(String(ctx.ano||''))) || anos[0];
  return fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos/'+modelo.codigo+'/anos/'+ano.codigo);
}
async function fipeFinalizarParallelum(d,ctx){
  const codigo=(d.CodigoFipe||ctx.codigo||'').trim(); const mesRef=(d.MesReferencia||'').trim();
  await fipeSalvarSnap(codigo,(d.Marca||'')+' '+(d.Modelo||''),d.Valor,d.AnoModelo,mesRef);
  let hist=[]; try{ if(codigo){ const hs=await db.collection('fipe_historico').where('codigoFipe','==',codigo).get(); hist=hs.docs.map(x=>x.data()).filter(h=>h.valorNum).map(h=>({mes:h.mesReferencia,valor:h.valorNum,label:h.valor})).sort((a,b)=>mesRefKey(a.mes)-mesRefKey(b.mes)); } }catch(e){}
  renderFipe({...d,CodigoFipe:codigo}, hist, 'parallelum');
}
async function fipeSalvarSnap(codigo,marcaModelo,valor,ano,mesRef){ try{ const docId=((codigo||marcaModelo)+'_'+mesRef).replace(/[^\w]+/g,'_');
  await db.collection('fipe_historico').doc(docId).set({ codigoFipe:codigo||null, marcaModelo, valor, valorNum:fipeNum(valor), anoModelo:ano||null, mesReferencia:mesRef, atualizadoEm:FV.serverTimestamp() },{merge:true}); }catch(e){} }
function fipeEscolherModelo(ranked,ctx){ const el=document.getElementById('fipeBody'); if(!el) return;
  el.innerHTML=`<p style="color:var(--text-2);margin-bottom:12px">Não consegui confirmar pelo código. Escolha o modelo exato de <b>${esc(ctx.modelo||'')}</b>:</p>`+
    ranked.map((x,i)=>`<div class="emp-row" onclick="fipePick(${i})"><div class="nm" style="flex:1"><b>${esc(x.m.nome)}</b></div><i class="fas fa-chevron-right" style="color:var(--text-3)"></i></div>`).join(''); }
function fipePick(i){ const s=window.__fipePick; if(!s) return;
  document.getElementById('fipeBody').innerHTML='<div class="empty" style="padding:24px"><div class="em-ic"><i class="fas fa-spinner fa-spin"></i></div><h4>Buscando valor...</h4></div>';
  fipeBuscarValor(s.marca,s.top[i].m,s.ctx).then(d=>fipeFinalizarParallelum(d,s.ctx)).catch(fipeErro); }
/* Obtém só o VALOR ATUAL (sem renderizar) — usado no lote e na automação */
async function fipeObterAtual(ctx){
  if(ctx.codigo){ try{ const arr=await fipeGet(BRASIL_FIPE+'/preco/v1/'+encodeURIComponent(ctx.codigo)); const it=fipePorAnoComb(arr,ctx.ano,ctx.comb);
    if(it&&it.valor) return {codigo:ctx.codigo, valor:it.valor, valorNum:fipeNum(it.valor), marcaModelo:((it.marca||'')+' '+(it.modelo||'')).trim(), ano:it.anoModelo, mes:(it.mesReferencia||'').trim()}; }catch(e){} }
  if(ctx.marca&&ctx.modelo){ try{ const marcas=await fipeGet(FIPE_BASE+'/marcas'); const marca=fipeAcharMarca(marcas,ctx.marca);
    if(marca){ const mr=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos'); const modelos=mr.modelos||[]; const alvo=fipeTokens(ctx.modelo);
      const ranked=modelos.map(m=>({m,sc:fipeScore(alvo,m.nome)})).sort((a,b)=>b.sc-a.sc).filter(x=>x.sc>0).slice(0,6);
      for(const c of ranked){ try{ const d=await fipeBuscarValor(marca,c.m,ctx);
        if(!ctx.codigo || (d.CodigoFipe||'').replace(/\D/g,'')===String(ctx.codigo).replace(/\D/g,'')) return {codigo:d.CodigoFipe||ctx.codigo||'', valor:d.Valor, valorNum:fipeNum(d.Valor), marcaModelo:((d.Marca||'')+' '+(d.Modelo||'')).trim(), ano:d.AnoModelo, mes:(d.MesReferencia||'').trim()}; }catch(e){} }
      if(ranked.length){ const d=await fipeBuscarValor(marca,ranked[0].m,ctx); return {codigo:d.CodigoFipe||'', valor:d.Valor, valorNum:fipeNum(d.Valor), marcaModelo:((d.Marca||'')+' '+(d.Modelo||'')).trim(), ano:d.AnoModelo, mes:(d.MesReferencia||'').trim()}; }
    } }catch(e){} }
  return null;
}
function apoliceCtxFipe(a){ return {codigo:a.codigoFipe, marca:a.veiculoFabricante||((a.veiculoModelo||'').split(' ')[0]), modelo:a.veiculoModelo, ano:a.veiculoAno, comb:a.combustivel}; }
let FIPE_BATCH_RUNNING=false;
async function atualizarFipeTodas(silencioso){
  if(FIPE_BATCH_RUNNING) return;
  const aps=CACHE.apolices.filter(a=>a.status!=='cancelada' && (a.codigoFipe||a.veiculoModelo));
  if(!aps.length){ if(!silencioso) toast('Nenhuma apólice com veículo para atualizar.','info'); return; }
  FIPE_BATCH_RUNNING=true;
  if(!silencioso) toast('Atualizando a FIPE de '+aps.length+' veículo(s) ao vivo. Pode levar um minuto...','info','FIPE');
  let ok=0;
  for(let i=0;i<aps.length;i++){ const a=aps[i];
    try{ const v=await fipeObterAtual(apoliceCtxFipe(a));
      if(v&&v.valorNum){ await fipeSalvarSnap(v.codigo||a.codigoFipe||'', v.marcaModelo||a.veiculoModelo||'', v.valor, v.ano||a.veiculoAno, v.mes);
        await db.collection('apolices_cliente').doc(a.id).update({ fipeAtual:v.valor, fipeAtualNum:v.valorNum, fipeMes:v.mes||null, fipeAtualizadoEm:FV.serverTimestamp() }); ok++; }
    }catch(e){ console.warn('fipe lote',a.id,e); }
    const prog=document.getElementById('fipeBatchProg'); if(prog) prog.style.width=Math.round((i+1)/aps.length*100)+'%';
    const cnt=document.getElementById('fipeBatchCnt'); if(cnt) cnt.textContent=(i+1)+' / '+aps.length;
  }
  try{ await db.collection('configuracoes').doc('fipe_auto').set({ ultimoMes:new Date().toISOString().slice(0,7), atualizadoEm:FV.serverTimestamp(), total:ok },{merge:true}); }catch(e){}
  FIPE_BATCH_RUNNING=false;
  if(!silencioso) toast('FIPE atualizada em '+ok+' de '+aps.length+' veículo(s).','ok','Concluído');
  if(((location.hash||'').slice(1))==='fipe') VIEWS.fipe();
}
/* Automático: roda sozinho quando você abre o CRM num mês ainda não capturado */
let _fipeAutoChecked=false;
async function checarFipeAuto(){
  if(_fipeAutoChecked || !CACHE.apolices.length) return; _fipeAutoChecked=true;
  try{ const doc=await db.collection('configuracoes').doc('fipe_auto').get();
    const mes=doc.exists?(doc.data().ultimoMes||null):null; const atual=new Date().toISOString().slice(0,7);
    if(mes!==atual){ atualizarFipeTodas(true); } }catch(e){ console.warn('fipe auto',e); }
}

  </div>`;

      <span style="font-size:.78rem;color:var(--text-3)">atualiza sozinho todo mês ao abrir o CRM</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Veículo</th><th>Placa</th><th>Valor FIPE</th><th>Variação (mês)</th><th>Referência</th><th></th></tr></thead><tbody>
    ${linhas.length?linhas.map(l=>`<tr>
      <td><b>${esc(l.a.clienteNome||'-')}</b></td>
      <td>${esc([l.a.veiculoFabricante,l.a.veiculoModelo].filter(Boolean).join(' ')||l.a.veiculoModelo||'-')}${l.a.veiculoAno?' · '+esc(l.a.veiculoAno):''}</td>
      <td>${esc(l.a.veiculoPlaca||'-')}</td>
      <td><b>${esc(l.atualStr)||'<span style=color:var(--text-3)>—</span>'}</b></td>
      <td>${l.dif!=null?`<span style="color:${l.dif>=0?'var(--ok)':'var(--danger)'};font-weight:600"><i class="fas fa-arrow-trend-${l.dif>=0?'up':'down'}"></i> ${l.dif>=0?'+':''}${money(l.dif)}</span>`:'<span style="color:var(--text-3)">—</span>'}</td>
      <td style="color:var(--text-3)">${esc((l.mes||'').trim())||'-'}</td>

function fipeAutoLabel(){ const c=CACHE.apolices.find(a=>a.fipeMes); return c?esc(c.fipeMes):'—'; }

function fipeErro(e){ const el=document.getElementById('fipeBody'); if(!el) return; console.error(e);
  el.innerHTML=`<div class="empty" style="padding:24px"><div class="em-ic"><i class="fas fa-triangle-exclamation"></i></div>
    <h4>Não consegui consultar agora</h4><p>${esc(e.message||'Erro')}<br>A FIPE é consultada ao vivo pela internet; tente de novo em instantes.</p></div>`; }
function renderFipe(d, hist, fonte){
  const el=document.getElementById('fipeBody'); if(!el) return;
  let variacao='';
  if(hist.length>=2){ const ini=hist[0].valor, fim=hist[hist.length-1].valor; if(ini&&fim){ const dif=fim-ini; const pct=(dif/ini*100);
    variacao=`<span style="color:${dif>=0?'var(--ok)':'var(--danger)'};font-weight:700"><i class="fas fa-arrow-trend-${dif>=0?'up':'down'}"></i> ${dif>=0?'+':''}${money(dif)} (${dif>=0?'+':''}${pct.toFixed(1)}%)</span>`; } }
  const tituloHist = fonte==='brasil' ? 'Evolução — últimos meses' : 'Evolução ('+hist.length+' consultas)';
  el.innerHTML=`
    <div style="display:flex;gap:14px;align-items:center;background:var(--brand-50);border-radius:12px;padding:16px 18px;margin-bottom:16px">
      <div style="width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px"><i class="fas fa-car"></i></div>
      <div><div style="font-size:.78rem;color:var(--text-2)">${esc(d.Marca||'')} ${esc(d.Modelo||'')} · ${esc(String(d.AnoModelo||''))} · ${esc(d.Combustivel||'')}</div>
        <div style="font-size:1.5rem;font-weight:800;color:var(--brand-dark)">${esc(d.Valor||'-')}</div>
        <div style="font-size:.75rem;color:var(--text-3)">Referência: ${esc((d.MesReferencia||'').trim())}${d.CodigoFipe?' · FIPE '+esc(d.CodigoFipe):''}</div></div>
    </div>
    ${hist.length>=2?`<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><b style="font-size:.9rem">${tituloHist}</b>${variacao}</div>
      ${sparkline(hist)}
      <div class="tbl-wrap" style="margin-top:12px;max-height:180px;overflow-y:auto"><table><thead><tr><th>Referência</th><th>Valor</th></tr></thead><tbody>
      ${hist.slice().reverse().map(h=>`<tr><td>${esc((h.mes||'').trim())}</td><td>${esc(h.label)}</td></tr>`).join('')}
      </tbody></table></div>`
    :`<div style="background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.82rem;color:var(--text-2)"><i class="fas fa-clock-rotate-left" style="color:var(--brand)"></i> Mostrando o valor atual. O histórico dos meses anteriores nem sempre está disponível ao vivo — quando não vem, vamos guardando um retrato a cada consulta e a evolução aparece aqui.</div>`}
    <p style="font-size:.72rem;color:var(--text-3);margin-top:12px"><i class="fas fa-circle-info"></i> Fonte: Tabela FIPE${fonte==='brasil'?' (BrasilAPI, por código)':' (parallelum, por marca/modelo)'}, ao vivo.</p>`;
}
function sparkline(hist){
  const vals=hist.map(h=>h.valor).filter(v=>v!=null); if(vals.length<2) return '';
  const w=460,h=90,pad=6; const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=hist.map((d,i)=>{ const x=pad+(i/(hist.length-1))*(w-2*pad); const y=h-pad-((d.valor-min)/rng)*(h-2*pad); return [x,y]; });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const up=vals[vals.length-1]>=vals[0]; const cor=up?'var(--ok)':'var(--danger)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:90px;overflow:visible">
    <path d="${area}" fill="${cor}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${cor}"/>`).join('')}
  </svg>`;
}

  CACHE.apolices.forEach(a=>{ const d=diasAte(a.dataFimVigencia); if(d!=null&&d<=15){ itens.push({

function atualizarNotificacoes(){

  if(dot){ dot.textContent=itens.length>99?'99+':itens.length; dot.classList.toggle('hidden',itens.length===0);

    <div style="max-height:60vh;overflow-y:auto">
    ${itens.length?itens.map(n=>`<div onclick="location.hash='#${n.rota}';toggleNotif(true)" style="display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
      <div style="width:34px;height:34px;border-radius:10px;background:${n.cor}22;color:${n.cor};display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas ${n.icon}"></i></div>
      <div style="min-width:0"><div style="font-weight:600;font-size:.85rem">${n.titulo}</div><div style="font-size:.78rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.desc}</div>
      ${n.quando?`<div style="font-size:.7rem;color:var(--text-3)">${fmtDataHora(n.quando)}</div>`:''}</div></div>`).join('')
    :`<div class="empty" style="padding:40px 20px"><div class="em-ic"><i class="fas fa-check"></i></div><h4>Tudo em dia 🎉</h4><p>Sem pendências no momento.</p></div>`}
    </div>`;
}
function toggleNotif(forceClose){
  let p=document.getElementById('notifPanel');
  if(!p){ p=document.createElement('div'); p.id='notifPanel';
    p.style.cssText='position:fixed;top:58px;right:20px;width:360px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);z-index:1200;display:none;overflow:hidden';
    document.body.appendChild(p);
    document.addEventListener('click',e=>{ if(p.classList.contains('open')&&!p.contains(e.target)&&e.target.id!=='notifBtn'&&!document.getElementById('notifBtn').contains(e.target)){ p.classList.remove('open'); p.style.display='none'; } });
  }
  if(forceClose){ p.classList.remove('open'); p.style.display='none'; return; }

}

  <script>
/* =========================================================================
   AGENDA DA EQUIPE — calendário do mês, agenda do dia, kanban e alertas
   Coleção: agenda_crm   (coberta pela regra genérica: só equipe autenticada)
   ========================================================================= */
const AG_TIPOS={
  ligacao:{l:'Ligação',i:'fa-phone',c:'#2563eb'},
  reuniao:{l:'Reunião',i:'fa-handshake',c:'#7c3aed'},
  visita:{l:'Visita',i:'fa-car',c:'#0891b2'},
  cotacao:{l:'Cotação',i:'fa-file-invoice',c:'#d97706'},
  renovacao:{l:'Renovação',i:'fa-rotate',c:'#16a34a'},
  movimentacao:{l:'Movimentação',i:'fa-right-left',c:'#0088aa'},
  financeiro:{l:'Financeiro',i:'fa-hand-holding-dollar',c:'#ea580c'},
  documento:{l:'Documento',i:'fa-folder-open',c:'#64748b'},
  outro:{l:'Outro',i:'fa-thumbtack',c:'#5b6b7c'}
};
const AG_STATUS={
  aberta:{l:'A fazer',i:'fa-circle',c:'var(--text-3)'},
  andamento:{l:'Em andamento',i:'fa-spinner',c:'var(--warn)'},
  concluida:{l:'Concluída',i:'fa-circle-check',c:'var(--ok)'},
  cancelada:{l:'Cancelada',i:'fa-ban',c:'var(--danger)'}
};
const AG_PRIOR={alta:'Alta',normal:'Normal',baixa:'Baixa'};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];

let AGENDA=[];                       // cache em tempo real
let AG={ mes:null, ano:null, dia:null, modo:'dia', resp:'todos', tipo:'', status:'', busca:'', mostrarConcluidas:false };
let AG_DRAG=null;

/* ---------- helpers de data ---------- */
const agHoje=()=>{ const d=new Date(); return agD2S(d); };
function agD2S(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function agS2D(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function agDataLonga(s){ const d=agS2D(s); if(!d) return '';
  const t=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  return t.charAt(0).toUpperCase()+t.slice(1); }
function agDataCurta(s){ const d=agS2D(s); return d?d.toLocaleDateString('pt-BR'):''; }
function agDiffDias(s){ const d=agS2D(s); if(!d) return null;
  const h=agS2D(agHoje()); return Math.round((d-h)/86400000); }
function agRelativo(s){ const n=agDiffDias(s);
  if(n===null) return ''; if(n===0) return 'hoje'; if(n===1) return 'amanhã'; if(n===-1) return 'ontem';
  return n>0?('em '+n+' dias'):(Math.abs(n)+' dias atrás'); }
/* está atrasada? (data no passado, ou hoje com hora já vencida) */
function agAtrasada(t){
  if(t.status==='concluida'||t.status==='cancelada') return false;
  const n=agDiffDias(t.data); if(n===null) return false;
  if(n<0) return true;
  if(n>0) return false;
  if(!t.hora) return false;
  const ag=new Date(), hm=String(ag.getHours()).padStart(2,'0')+':'+String(ag.getMinutes()).padStart(2,'0');
  return t.hora<hm;
}
const agAberta=t=>t.status!=='concluida'&&t.status!=='cancelada';

/* ---------- equipe ---------- */
function agEquipe(){
  const l=(CACHE.admins||[]).filter(f=>f.ativo!==false&&(f.email||f.nome));
  return l.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
}
function agEuEmail(){ return (CURRENT_USER&&CURRENT_USER.email)||''; }
function agNomeDe(email){
  const f=(CACHE.admins||[]).find(x=>(x.email||'').toLowerCase()===(email||'').toLowerCase());
  return (f&&f.nome)||(email||'').split('@')[0]||'—';
}
function agIniciais(nome){
  const p=(nome||'').trim().split(/\s+/);
  return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase();
}
function agCorDe(email){
  const cores=['#0088aa','#7c3aed','#16a34a','#ea580c','#2563eb','#db2777','#0891b2','#65a30d'];
  let h=0; for(const c of (email||'x')) h=(h*31+c.charCodeAt(0))%997;
  return cores[h%cores.length];
}
function avatar(email,size){
  const nome=agNomeDe(email);
  return `<span class="av" title="${esc(nome)}" style="background:${agCorDe(email)}${size?';width:'+size+'px;height:'+size+'px':''}">${esc(agIniciais(nome))}</span>`;
}

/* ---------- filtro ---------- */
function agFiltradas(lista){
  let l=(lista||AGENDA).slice();
  if(AG.resp==='minhas'){ const eu=agEuEmail().toLowerCase();
    l=l.filter(t=>(t.responsaveis||[]).some(r=>(r||'').toLowerCase()===eu)||(t.criadoPor||'').toLowerCase()===eu); }
  else if(AG.resp&&AG.resp!=='todos'){ l=l.filter(t=>(t.responsaveis||[]).includes(AG.resp)); }
  if(AG.tipo) l=l.filter(t=>t.tipo===AG.tipo);
  if(AG.status) l=l.filter(t=>t.status===AG.status);
  if(AG.busca){ const q=AG.busca.toLowerCase();
    l=l.filter(t=>`${t.titulo||''} ${t.descricao||''} ${(t.vinculo&&t.vinculo.nome)||''}`.toLowerCase().includes(q)); }
  if(!AG.mostrarConcluidas&&!AG.status) l=l.filter(t=>t.status!=='cancelada');
  return l;
}
function agOrdena(l){
  return l.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')
    || (a.hora||'99:99').localeCompare(b.hora||'99:99')
    || (a.titulo||'').localeCompare(b.titulo||''));
}

/* =========================================================================
   TELA
   ========================================================================= */
VIEWS.agenda=function(){
  agGerarRecorrentes();
  const hoje=agHoje(), hd=agS2D(hoje);
  if(AG.mes===null){ AG.mes=hd.getMonth()+1; AG.ano=hd.getFullYear(); AG.dia=hoje; }
  const todas=agFiltradas();
  const abertas=todas.filter(agAberta);
  const atrasadas=abertas.filter(agAtrasada);
  const deHoje=abertas.filter(t=>t.data===hoje&&!agAtrasada(t));
  const semana=abertas.filter(t=>{const n=agDiffDias(t.data);return n>0&&n<=7;});
  const feitasHoje=todas.filter(t=>t.status==='concluida'&&(t.concluidoEmData===hoje||t.data===hoje));

  const actions=`<button class="btn btn-ghost btn-sm" onclick="agModalRecorrentes()"><i class="fas fa-repeat"></i> Recorrentes${AG_FIXAS.filter(m=>m.ativo!==false).length?' ('+AG_FIXAS.filter(m=>m.ativo!==false).length+')':''}</button>
    <button class="btn btn-primary btn-sm" onclick="agModal()"><i class="fas fa-plus"></i> Nova ação</button>`;
  let html=head('agenda',{actions});

  html+=`<div class="ag-alertas">
    <div class="alerta atras ${AG.status==='__atras'?'on':''}" onclick="agFocar('atras')">
      <div class="v">${atrasadas.length}</div><div class="l"><i class="fas fa-triangle-exclamation"></i> Atrasadas</div></div>
    <div class="alerta hoje" onclick="agFocar('hoje')">
      <div class="v">${deHoje.length}</div><div class="l"><i class="fas fa-calendar-day"></i> Para hoje</div></div>
    <div class="alerta semana" onclick="agFocar('semana')">
      <div class="v">${semana.length}</div><div class="l"><i class="fas fa-calendar-week"></i> Próximos 7 dias</div></div>
    <div class="alerta feito" onclick="agFocar('feito')">
      <div class="v">${feitasHoje.length}</div><div class="l"><i class="fas fa-circle-check"></i> Concluídas hoje</div></div>
  </div>`;

  /* filtros */
  const eq=agEquipe();
  html+=`<div class="card" style="padding:14px 16px"><div class="filters" style="margin:0">
    <div style="display:flex;gap:6px;background:var(--surface-3);padding:4px;border-radius:10px">
      <button class="btn ${AG.modo==='dia'?'btn-primary':'btn-ghost'} btn-sm" style="border:none" onclick="AG.modo='dia';VIEWS.agenda()"><i class="fas fa-calendar-day"></i> Calendário</button>
      <button class="btn ${AG.modo==='kanban'?'btn-primary':'btn-ghost'} btn-sm" style="border:none" onclick="AG.modo='kanban';VIEWS.agenda()"><i class="fas fa-columns"></i> Kanban</button>
      <button class="btn ${AG.modo==='lista'?'btn-primary':'btn-ghost'} btn-sm" style="border:none" onclick="AG.modo='lista';VIEWS.agenda()"><i class="fas fa-list"></i> Lista</button>
    </div>
    <select onchange="AG.resp=this.value;VIEWS.agenda()" style="min-width:180px">
      <option value="todos" ${AG.resp==='todos'?'selected':''}>Toda a equipe</option>
      <option value="minhas" ${AG.resp==='minhas'?'selected':''}>Só as minhas</option>
      ${eq.map(f=>`<option value="${esc(f.email||f.nome)}" ${AG.resp===(f.email||f.nome)?'selected':''}>${esc(f.nome||f.email)}</option>`).join('')}
    </select>
    <select onchange="AG.tipo=this.value;VIEWS.agenda()">
      <option value="">Todos os tipos</option>
      ${Object.entries(AG_TIPOS).map(([k,v])=>`<option value="${k}" ${AG.tipo===k?'selected':''}>${v.l}</option>`).join('')}

    <select onchange="AG.status=this.value;VIEWS.agenda()">

    </select>
    <input type="text" id="agBusca" placeholder="Buscar na agenda..." value="${esc(AG.busca)}"
      oninput="AG.busca=this.value;redesenhar(VIEWS.agenda)" style="min-width:200px">
  </div></div>`;

  if(AG.modo==='kanban') html+=agKanban(todas);
  else if(AG.modo==='lista') html+=agLista(todas);
  else html+=agCalendario(todas);

  html+=agSugestoes();
  setView(html);
};

function agFocar(qual){
  const hoje=agHoje();
  AG.status=''; AG.mostrarConcluidas=false;
  if(qual==='hoje'){ AG.modo='dia'; AG.dia=hoje; const d=agS2D(hoje); AG.mes=d.getMonth()+1; AG.ano=d.getFullYear(); }
  if(qual==='atras'||qual==='semana'){ AG.modo='lista'; AG.foco=qual; }
  else AG.foco=qual==='feito'?'feito':null;
  if(qual==='feito'){ AG.modo='lista'; AG.mostrarConcluidas=true; }
  VIEWS.agenda();
}

/* ---------- calendário do mês + agenda do dia ---------- */
function agCalendario(todas){
  const primeiro=new Date(AG.ano,AG.mes-1,1);
  const inicio=new Date(primeiro); inicio.setDate(1-primeiro.getDay());
  const hoje=agHoje();
  const porDia={};
  todas.forEach(t=>{ (porDia[t.data]=porDia[t.data]||[]).push(t); });

  let dias='';
  for(let i=0;i<42;i++){
    const d=new Date(inicio); d.setDate(inicio.getDate()+i);
    const s=agD2S(d), fora=d.getMonth()!==AG.mes-1;
    const lista=(porDia[s]||[]);
    const abertas=lista.filter(agAberta);
    const temAtraso=abertas.some(agAtrasada);
    const cores=[...new Set(abertas.map(t=>(AG_TIPOS[t.tipo]||AG_TIPOS.outro).c))].slice(0,3);
    dias+=`<div class="cal-day ${fora?'fora':''} ${s===hoje?'hoje':''} ${s===AG.dia?'sel':''}"
      data-dia="${s}" onclick="AG.dia='${s}';VIEWS.agenda()"
      ondragover="agCalOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="agCalDrop(event,this,'${s}')"
      title="${lista.length?lista.length+' ação(ões)':'Sem ações'}">
      ${abertas.length?`<span class="cal-n" style="${temAtraso?'color:var(--danger)':''}">${abertas.length}</span>`:''}
      <span>${d.getDate()}</span>
      <span class="cal-dots">${cores.map(c=>`<i style="background:${c}"></i>`).join('')}</span>
    </div>`;
  }
  const doDia=agOrdena((porDia[AG.dia]||[]));
  const comHora=doDia.filter(t=>t.hora), semHora=doDia.filter(t=>!t.hora);
  const horas=[];
  for(let h=7;h<=20;h++) horas.push(String(h).padStart(2,'0')+':00');
  const foraFaixa=comHora.filter(t=>t.hora<'07:00'||t.hora>'20:59');

  return `<div class="ag-wrap">
    <div class="card">
      <div class="cal-head">
        <button class="btn btn-ghost btn-sm" onclick="agMes(-1)"><i class="fas fa-chevron-left"></i></button>
        <b style="text-transform:none">${MESES_BR[AG.mes-1]} de ${AG.ano}</b>
        <button class="btn btn-ghost btn-sm" onclick="agMes(1)"><i class="fas fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${dias}</div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="agIrHoje()"><i class="fas fa-crosshairs"></i> Hoje</button>
        <button class="btn btn-ghost btn-sm" onclick="agModal(null,'${AG.dia}')"><i class="fas fa-plus"></i> Nova neste dia</button>
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:.74rem;color:var(--text-3)">
        <i class="fas fa-hand-pointer"></i> Arraste um cartão para outro dia do calendário para reagendar.
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3><i class="fas fa-calendar-day"></i> ${agDataLonga(AG.dia)}</h3>
        <span style="font-size:.82rem;color:var(--text-3)">${doDia.length} ação(ões) · ${agRelativo(AG.dia)}</span></div>
      ${semHora.length?`<div style="margin-bottom:14px">
        <div style="font-size:.72rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Sem horário definido</div>
        ${semHora.map(agCard).join('')}</div>`:''}
      ${foraFaixa.length?foraFaixa.map(agCard).join(''):''}
      <div>${horas.map(h=>{
        const nesta=comHora.filter(t=>t.hora>=h&&t.hora<String(Number(h.slice(0,2))+1).padStart(2,'0')+':00');
        return `<div class="dia-hora">
          <div class="h">${h}</div>
          <div class="slot ${nesta.length?'':'vazio'}" ${nesta.length?'':`onclick="agModal(null,'${AG.dia}','${h}')"`}
            ondragover="agSlotOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="agSlotDrop(event,this,'${AG.dia}','${h}')">
            ${nesta.length?nesta.map(agCard).join(''):'<span><i class="fas fa-plus"></i> agendar</span>'}
          </div></div>`;}).join('')}</div>
      ${!doDia.length?`<div class="empty" style="padding:30px"><div class="em-ic"><i class="fas fa-mug-hot"></i></div>
        <h4>Dia livre</h4><p>Nenhuma ação marcada. Clique num horário para criar.</p></div>`:''}
    </div>
  </div>`;
}
function agMes(n){ let m=AG.mes+n, a=AG.ano;
  if(m>12){m=1;a++;} if(m<1){m=12;a--;}
  AG.mes=m; AG.ano=a; VIEWS.agenda(); }
function agIrHoje(){ const h=agHoje(), d=agS2D(h); AG.dia=h; AG.mes=d.getMonth()+1; AG.ano=d.getFullYear(); VIEWS.agenda(); }

/* ---------- cartão ---------- */
function agCard(t){
  const tp=AG_TIPOS[t.tipo]||AG_TIPOS.outro;
  const atras=agAtrasada(t);
  const resp=(t.responsaveis||[]);
  return `<div class="tk p-${t.prioridade||'normal'} ${atras?'atrasada':''} ${t.status==='concluida'?'concluida':''}"
      draggable="true" ondragstart="agDragStart(event,'${t.id}')" ondragend="agDragEnd(event)">
    <div class="tk-top">
      <span style="color:${tp.c};font-size:.9rem;margin-top:2px"><i class="fas ${tp.i}"></i></span>
      <div class="tk-t">${esc(t.titulo)}</div>
      ${t.prioridade==='alta'?'<span class="badge" style="background:var(--danger-bg);color:var(--danger)">Alta</span>':''}
    </div>
    <div class="tk-meta">
      ${t.hora?`<span><i class="fas fa-clock"></i> ${esc(t.hora)}${t.horaFim?'–'+esc(t.horaFim):''}</span>`:'<span style="color:var(--text-3)"><i class="fas fa-clock"></i> sem hora</span>'}
      <span style="color:${atras?'var(--danger)':'var(--text-3)'}">${atras?'<i class="fas fa-triangle-exclamation"></i> ':''}${agDataCurta(t.data)}</span>
      ${t.status==='andamento'?'<span class="badge" style="background:var(--warn-bg);color:var(--warn)">Em andamento</span>':''}
      ${t.modeloId?`<span style="color:var(--brand-dark)" title="${t.dataOriginal?'Caía em '+agDataCurta(t.dataOriginal)+' e foi movida para o dia útil':'Ação recorrente'}"><i class="fas fa-repeat"></i>${t.dataOriginal?' movida':''}</span>`:''}
      ${t.vinculo&&t.vinculo.nome?`<span style="color:var(--brand-dark)"><i class="fas fa-link"></i> ${esc(t.vinculo.nome)}</span>`:''}
      <span class="who">${resp.length?resp.slice(0,3).map(r=>avatar(r)).join('')
        :'<span style="color:var(--text-3)">sem responsável</span>'}${resp.length>3?`<span class="av mais">+${resp.length-3}</span>`:''}</span>
    </div>
    ${t.descricao?`<div style="font-size:.79rem;color:var(--text-2);margin-top:6px;line-height:1.45">${esc(t.descricao).slice(0,160)}${(t.descricao||'').length>160?'…':''}</div>`:''}
    <div class="tk-acts">
      ${t.status!=='concluida'?`<button class="btn btn-success btn-sm" onclick="agConcluir('${t.id}')"><i class="fas fa-check"></i> Concluir</button>`
        :`<button class="btn btn-ghost btn-sm" onclick="agStatus('${t.id}','aberta')"><i class="fas fa-rotate-left"></i> Reabrir</button>`}
      ${t.status==='aberta'?`<button class="btn btn-ghost btn-sm" onclick="agStatus('${t.id}','andamento')"><i class="fas fa-play"></i> Iniciar</button>`:''}
      <button class="btn btn-ghost btn-sm" onclick="agAdiar('${t.id}',1)" title="Adiar 1 dia"><i class="fas fa-arrow-right"></i> +1d</button>
      <button class="btn btn-ghost btn-sm" onclick="agModal('${t.id}')"><i class="fas fa-pen"></i></button>
      <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="agExcluir('${t.id}')"><i class="fas fa-trash"></i></button>
    </div>
  </div>`;
}

/* ---------- kanban ---------- */
function agKanban(todas){
  const cols=['aberta','andamento','concluida','cancelada'];
  const l=agOrdena(todas);
  return `<div class="kb">${cols.map(c=>{
    const its=l.filter(t=>t.status===c||(!t.status&&c==='aberta'));
    const st=AG_STATUS[c];
    return `<div class="kb-col" ondragover="agColOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="agColDrop(event,this,'${c}')">
      <div class="kb-h"><i class="fas ${st.i}" style="color:${st.c}"></i> ${st.l}<span class="n">${its.length}</span></div>
      ${its.length?its.map(agCard).join(''):`<div style="text-align:center;padding:22px 10px;color:var(--text-3);font-size:.8rem">
        <i class="fas fa-inbox"></i><br>Arraste um cartão para cá</div>`}
    </div>`;}).join('')}</div>`;
}

/* ---------- lista ---------- */
function agLista(todas){
  let l=agOrdena(todas);
  if(AG.foco==='atras') l=l.filter(t=>agAberta(t)&&agAtrasada(t));
  if(AG.foco==='semana') l=l.filter(t=>{const n=agDiffDias(t.data);return agAberta(t)&&n>0&&n<=7;});
  if(AG.foco==='feito') l=l.filter(t=>t.status==='concluida');
  const grupos={};
  l.forEach(t=>{ (grupos[t.data]=grupos[t.data]||[]).push(t); });
  const titulo={atras:'Ações atrasadas',semana:'Próximos 7 dias',feito:'Concluídas'}[AG.foco]||'Todas as ações';
  return `<div class="card">
    <div class="card-head"><h3><i class="fas fa-list-check"></i> ${titulo}</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:.82rem;color:var(--text-3)">${l.length} ação(ões)</span>
        ${AG.foco?`<button class="btn btn-ghost btn-sm" onclick="AG.foco=null;VIEWS.agenda()"><i class="fas fa-xmark"></i> Limpar recorte</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="agExportar()"><i class="fas fa-download"></i> CSV</button></div></div>
    ${Object.keys(grupos).length?Object.keys(grupos).sort().map(d=>`
      <div style="margin-bottom:16px">
        <div style="font-size:.76rem;font-weight:700;color:${agDiffDias(d)<0?'var(--danger)':'var(--text-3)'};text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px">
          ${agDataCurta(d)} · <span style="text-transform:none">${agRelativo(d)}</span> · ${grupos[d].length}</div>
        ${grupos[d].map(agCard).join('')}
      </div>`).join('')
    :`<div class="empty"><div class="em-ic"><i class="fas fa-circle-check"></i></div><h4>Nada por aqui</h4>
      <p>Nenhuma ação com esses filtros.</p></div>`}
  </div>`;
}
function agExportar(){
  const l=agOrdena(agFiltradas());
  if(!l.length){ toast('Nada para exportar.','info'); return; }
  const cel=v=>{v=(v==null?'':String(v));return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['Data','Hora','Titulo','Tipo','Prioridade','Status','Responsaveis','Vinculo','Descricao','Criado por'];
  const linhas=l.map(t=>[agDataCurta(t.data),t.hora||'',t.titulo,(AG_TIPOS[t.tipo]||{}).l||t.tipo,
    AG_PRIOR[t.prioridade]||'',(AG_STATUS[t.status]||{}).l||t.status,
    (t.responsaveis||[]).map(agNomeDe).join(' + '),(t.vinculo&&t.vinculo.nome)||'',t.descricao||'',agNomeDe(t.criadoPor)]);
  const txt='﻿'+[head.join(';')].concat(linhas.map(x=>x.map(cel).join(';'))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='agenda-retorno.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV com '+l.length+' ação(ões).','ok','Exportado');
}

/* =========================================================================
   ARRASTAR E SOLTAR
   ========================================================================= */
function agDragStart(e,id){ AG_DRAG=id; e.currentTarget.classList.add('dragging');
  try{ e.dataTransfer.setData('text/plain',id); e.dataTransfer.effectAllowed='move'; }catch(x){} }
function agDragEnd(e){ e.currentTarget.classList.remove('dragging'); AG_DRAG=null;
  document.querySelectorAll('.drop').forEach(el=>el.classList.remove('drop')); }
function agColOver(e,el){ e.preventDefault(); el.classList.add('drop'); }
function agCalOver(e,el){ e.preventDefault(); el.classList.add('drop'); }
function agSlotOver(e,el){ e.preventDefault(); el.classList.add('drop'); }
async function agColDrop(e,el,status){ e.preventDefault(); el.classList.remove('drop');
  const id=AG_DRAG||e.dataTransfer.getData('text/plain'); if(!id) return;
  await agStatus(id,status); }
async function agCalDrop(e,el,dia){ e.preventDefault(); el.classList.remove('drop');
  const id=AG_DRAG||e.dataTransfer.getData('text/plain'); if(!id) return;
  await agSalvarCampos(id,{data:dia},'Reagendada para '+agDataCurta(dia)+'.'); }
async function agSlotDrop(e,el,dia,hora){ e.preventDefault(); el.classList.remove('drop');
  const id=AG_DRAG||e.dataTransfer.getData('text/plain'); if(!id) return;
  await agSalvarCampos(id,{data:dia,hora},'Movida para '+agDataCurta(dia)+' às '+hora+'.'); }

/* =========================================================================
   AÇÕES
   ========================================================================= */
async function agSalvarCampos(id,campos,msg){
  try{
    await db.collection('agenda_crm').doc(id).update({...campos,
      atualizadoEm:FV.serverTimestamp(), atualizadoPor:agEuEmail()||'admin'});
    if(msg) toast(msg,'ok');
  }catch(e){ console.error(e); toast('Não consegui salvar a alteração.','err'); }
}
async function agStatus(id,status){
  const extra={status};
  if(status==='concluida'){ extra.concluidoEm=FV.serverTimestamp(); extra.concluidoEmData=agHoje(); extra.concluidoPor=agEuEmail()||'admin'; }
  else { extra.concluidoEm=null; extra.concluidoEmData=null; extra.concluidoPor=null; }
  await agSalvarCampos(id,extra,'Ação: '+(AG_STATUS[status]||{}).l+'.');
}
const agConcluir=id=>agStatus(id,'concluida');
async function agAdiar(id,dias){
  const t=AGENDA.find(x=>x.id===id); if(!t) return;
  const d=agS2D(t.data)||new Date(); d.setDate(d.getDate()+dias);
  await agSalvarCampos(id,{data:agD2S(d)},'Adiada para '+agDataCurta(agD2S(d))+'.');
}
async function agExcluir(id){
  const t=AGENDA.find(x=>x.id===id); if(!t) return;
  if(!confirm('Excluir a ação "'+(t.titulo||'')+'"? Isso não pode ser desfeito.')) return;
  try{ await db.collection('agenda_crm').doc(id).delete(); toast('Ação excluída.','info'); }
  catch(e){ console.error(e); toast('Erro ao excluir.','err'); }
}

/* =========================================================================
   MODAL DE CRIAÇÃO / EDIÇÃO
   ========================================================================= */
function agModal(id,diaPre,horaPre,pre){
  const t=id?AGENDA.find(x=>x.id===id)||{}:(pre||{});
  const eq=agEquipe();
  const resp=t.responsaveis||(agEuEmail()?[agEuEmail()]:[]);
  const dia=t.data||diaPre||AG.dia||agHoje();
  openModal(`
    <div class="modal-head"><h3><i class="fas fa-${id?'pen':'plus'}" style="color:var(--brand)"></i> ${id?'Editar ação':'Nova ação'}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="agId" value="${esc(id||'')}">
      <div class="form-row"><label>O que precisa ser feito? *</label>
        <input type="text" id="agTitulo" value="${esc(t.titulo||'')}" placeholder="Ex.: Ligar para o RH da TransLog sobre a renovação" autocomplete="off"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        <div class="form-row"><label>Data *</label><input type="date" id="agData" value="${esc(dia)}"></div>
        <div class="form-row"><label>Hora</label><input type="time" id="agHora" value="${esc(t.hora||horaPre||'')}">
          <div style="font-size:.73rem;color:var(--text-3);margin-top:4px">Vazio = dia todo</div></div>
        <div class="form-row"><label>Até</label><input type="time" id="agHoraFim" value="${esc(t.horaFim||'')}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-row"><label>Tipo</label><select id="agTipo">
          ${Object.entries(AG_TIPOS).map(([k,v])=>`<option value="${k}" ${(t.tipo||'outro')===k?'selected':''}>${v.l}</option>`).join('')}
        </select></div>
        <div class="form-row"><label>Prioridade</label><select id="agPrior">
          ${Object.entries(AG_PRIOR).map(([k,v])=>`<option value="${k}" ${(t.prioridade||'normal')===k?'selected':''}>${v}</option>`).join('')}
        </select></div>
      </div>
      <div class="form-row"><label>Responsáveis *</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">
          ${eq.length?eq.map(f=>{const v=f.email||f.nome;
            return `<label style="display:flex;align-items:center;gap:7px;padding:7px 12px;border:1.5px solid ${resp.includes(v)?'var(--brand)':'var(--border-2)'};

              <input type="checkbox" class="agResp" value="${esc(v)}" ${resp.includes(v)?'checked':''} style="width:auto;margin:0">

            :'<span style="font-size:.83rem;color:var(--text-3)">Nenhum funcionário cadastrado ainda — cadastre a equipe em Funcionários para poder delegar.</span>'}
        </div>
        <div style="font-size:.75rem;color:var(--text-3);margin-top:4px">Pode marcar mais de uma pessoa.</div></div>
      <div class="form-row"><label>Vincular a (opcional)</label>
        <select id="agVinculo">
          <option value="">Nada vinculado</option>
          <optgroup label="Empresas">
            ${(CACHE.empresas||[]).slice().sort((a,b)=>(a.nomeEmpresa||'').localeCompare(b.nomeEmpresa||''))
              .map(e=>`<option value="empresa|${e.id}|${esc(e.nomeEmpresa||'')}" ${t.vinculo&&t.vinculo.id===e.id?'selected':''}>${esc(e.nomeEmpresa||'')}</option>`).join('')}
          </optgroup>
          <optgroup label="Leads e clientes">
            ${(CACHE.leads||[]).slice(0,300).map(l=>`<option value="lead|${l.id}|${esc(l.nome||'')}" ${t.vinculo&&t.vinculo.id===l.id?'selected':''}>${esc(l.nome||l.whatsapp||'')}</option>`).join('')}
          </optgroup>
        </select></div>
      <div class="form-row"><label>Observações</label>
        <textarea id="agDesc" rows="3" placeholder="Detalhes, combinados, o que já foi tentado...">${esc(t.descricao||'')}</textarea></div>
      ${t.modeloId?`<div style="background:var(--brand-50);border-radius:10px;padding:11px 14px;font-size:.83rem;color:var(--brand-dark);margin-bottom:14px">
        <i class="fas fa-repeat"></i> Esta ação faz parte de uma <b>recorrência</b>. Editar aqui muda só esta data.
        <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="closeModal();agModalFixa('${t.modeloId}')">Editar a recorrência</button>

      :(id?'':`<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">

      ${id?`<div style="font-size:.76rem;color:var(--text-3);border-top:1px solid var(--border);padding-top:10px">

        ${t.status==='concluida'&&t.concluidoPor?`<br>Concluída por ${esc(agNomeDe(t.concluidoPor))}${t.concluidoEm?' em '+fmtDataHora(t.concluidoEm):''}`:''}</div>`:''}

    </div>`,'wide');
  setTimeout(()=>{const el=document.getElementById('agTitulo'); if(el) el.focus();},60);
