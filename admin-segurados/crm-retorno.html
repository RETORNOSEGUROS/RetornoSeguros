    toast('Apólice criada'+(doSaved?'':' e proposta salva')+(pdfId?' com o PDF':'')+'. O cliente está na aba Clientes.','ok','Pronto');
  }catch(e){ console.error(e); toast('Erro ao gerar apólice.','err'); }

function converterData(br){ if(!br) return null; const m=/(\d{2})\/(\d{2})\/(\d{4})/.exec(br); return m?`${m[3]}-${m[2]}-${m[1]}`:null; }

/* Tabela de parcelas: valor de cada uma + vencimentos mensais a partir do início de vigência */
function tabelaParcelas(o){
  const n=parseInt(o.parcelas)||1; const total=(+o.premioTotal)|| ((+o.valorParcela||0)*n) || 0;
  const iniStr=converterData(o.vigenciaInicio); const ini=iniStr?new Date(iniStr+'T00:00:00'):null;
  const vals=[];
  if(o.valorParcela && o.premioTotal && n>1){ const rest=(o.premioTotal - o.valorParcela)/(n-1); for(let i=0;i<n;i++) vals.push(i===0?+o.valorParcela:rest); }
  else { for(let i=0;i<n;i++) vals.push(total/n); }
  let rows=''; for(let i=0;i<n;i++){ let dt='-'; if(ini){ const d=new Date(ini); d.setMonth(d.getMonth()+i); dt=d.toLocaleDateString('pt-BR'); }
    rows+=`<tr><td>${i+1}ª</td><td>${dt}</td><td>${money(vals[i])}</td></tr>`; }
  return `<div class="tbl-wrap" style="border:1px solid var(--border);border-radius:8px"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const FIPE_BASE='https://parallelum.com.br/fipe/api/v1/carros';
function NUMBR(s){ const n=parseFloat(s); return isNaN(n)?null:n; }
function fipeNum(v){ return NUMBR(String(v||'').replace(/[R$\s.]/g,'').replace(',','.')); }
function fipeNorm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function fipeTokens(s){ return fipeNorm(s).replace(/[^\w.\s]/g,' ').split(/\s+/).filter(x=>x.length>1); }
async function fipeGet(u){ const r=await fetch(u); if(!r.ok) throw new Error('API FIPE respondeu '+r.status); return r.json(); }
function fipeBtn(ctx,label){ const j=encodeURIComponent(JSON.stringify(ctx||{})); return `<button class="btn btn-ghost btn-sm" style="padding:3px 9px" onclick="modalFipe(JSON.parse(decodeURIComponent(this.dataset.ctx)))" data-ctx="${j}"><i class="fas fa-magnifying-glass-dollar"></i>${label===undefined?' consultar':(label?' '+label:'')}</button>`; }
function fipeAcharMarca(marcas,nome){ const q=fipeNorm(nome); if(!q) return null;
  return marcas.find(m=>fipeNorm(m.nome)===q) || marcas.find(m=>fipeNorm(m.nome).includes(q)||q.includes(fipeNorm(m.nome))) ||
    marcas.find(m=>fipeNorm(m.nome).split(/[\s\-]+/).some(tk=>tk.length>2&&q.includes(tk))); }
function fipeScore(alvo,nome){ const nt=fipeTokens(nome); let sc=0; alvo.forEach(t=>{ if(nt.includes(t)) sc+=2; else if(nt.some(x=>x.startsWith(t)||t.startsWith(x))) sc+=1; }); return sc; }

const BRASIL_FIPE='https://brasilapi.com.br/api/fipe';
const MESES_PT={janeiro:1,fevereiro:2,'março':3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function mesRefKey(s){ s=(s||'').toString().toLowerCase().trim(); const m=s.match(/([a-zç]+)\D+(\d{4})/) || s.match(/(\d{4})[-\/](\d{1,2})/); if(!m) return 0;
  if(/^\d/.test(m[1])) return (+m[1])*100+(+m[2]); return (+m[2])*100+(MESES_PT[m[1]]||0); }
async function modalFipe(ctx){ ctx=ctx||{};
  openModal(`<div class="modal-head"><h3><i class="fas fa-magnifying-glass-dollar" style="color:var(--brand)"></i> Valor FIPE${ctx.codigo?' · '+esc(ctx.codigo):''}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="fipeBody"><div class="empty" style="padding:30px"><div class="em-ic"><i class="fas fa-spinner fa-spin"></i></div><h4>Consultando a tabela FIPE...</h4><p>Buscando valor atual e histórico dos últimos meses.</p></div></div>`);
  // Caminho 1: pelo CÓDIGO da proposta (traz o veículo exato + histórico automático dos últimos meses)
  if(ctx.codigo){ try{ await fipeViaCodigo(ctx); return; }catch(e){ console.warn('FIPE por código falhou, tentando por marca/modelo:',e&&e.message); } }
  // Caminho 2: por marca/modelo (fallback) — casa pelo código quando possível p/ não trazer o errado
  try{ await fipeViaModelo(ctx); }catch(e){ fipeErro(e); }
}
/* Consulta por código (BrasilAPI): valor atual + últimos meses automaticamente */
async function fipeViaCodigo(ctx){
  const cod=ctx.codigo;
  const arr=await fipeGet(BRASIL_FIPE+'/preco/v1/'+encodeURIComponent(cod));
  const cur=fipePorAnoComb(arr,ctx.ano,ctx.comb); if(!cur) throw new Error('código sem retorno');
  // histórico: últimas ~12 tabelas de referência
  let hist=[]; try{ const tabs=await fipeGet(BRASIL_FIPE+'/tabelas/v1'); const refs=(tabs||[]).slice(0,12);
    for(const t of refs){ try{ const a=await fipeGet(BRASIL_FIPE+'/preco/v1/'+encodeURIComponent(cod)+'?tabela_referencia='+t.codigo); const it=fipePorAnoComb(a,ctx.ano,ctx.comb);
      if(it) hist.push({mes:(it.mesReferencia||t.mes||'').trim(),valor:fipeNum(it.valor),label:it.valor}); }catch(e){} } }catch(e){}
  hist=hist.filter(h=>h.valor).sort((a,b)=>mesRefKey(a.mes)-mesRefKey(b.mes));
  await fipeSalvarSnap(cod,(cur.marca||'')+' '+(cur.modelo||''),cur.valor,cur.anoModelo,(cur.mesReferencia||'').trim());
  renderFipe({Marca:cur.marca,Modelo:cur.modelo,AnoModelo:cur.anoModelo,Combustivel:cur.combustivel,Valor:cur.valor,MesReferencia:cur.mesReferencia,CodigoFipe:cur.codigoFipe||cod}, hist, hist.length?'brasil':'nova');
}
function fipePorAnoComb(arr,ano,comb){ if(!Array.isArray(arr)||!arr.length) return null; let c=arr;
  if(ano){ const f=c.filter(x=>String(x.anoModelo)===String(ano)); if(f.length) c=f; }
  if(comb){ const cc=comb.toLowerCase(); const f=c.filter(x=>(x.combustivel||'').toLowerCase().includes(cc)); if(f.length) c=f; }
  return c[0]; }
/* Consulta por marca/modelo (parallelum) — confirma pelo código da proposta */
async function fipeViaModelo(ctx){
  if(!ctx.modelo) throw new Error('Faltam dados do veículo para consultar a FIPE.');
  if(!ctx.marca) ctx.marca=ctx.modelo.split(' ')[0]; // tentativa: 1ª palavra do modelo
  const marcas=await fipeGet(FIPE_BASE+'/marcas');
  const marca=fipeAcharMarca(marcas,ctx.marca); if(!marca) throw new Error('Não identifiquei a marca do veículo "'+esc(ctx.modelo)+'" — me avise que eu ensino este modelo.');
  const mr=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos'); const modelos=mr.modelos||[]; const alvo=fipeTokens(ctx.modelo);
  const ranked=modelos.map(m=>({m,sc:fipeScore(alvo,m.nome)})).sort((a,b)=>b.sc-a.sc).filter(x=>x.sc>0).slice(0,8);
  if(!ranked.length) throw new Error('Modelo não encontrado automaticamente.');
  // se temos o código, testamos os candidatos e escolhemos o que bate o código exato
  if(ctx.codigo){
    for(const c of ranked){ try{ const d=await fipeBuscarValor(marca,c.m,ctx);
      if(d && (d.CodigoFipe||'').replace(/\D/g,'')===String(ctx.codigo).replace(/\D/g,'')){ return fipeFinalizarParallelum(d,ctx); } }catch(e){} }
  }
  // sem código ou nenhum bateu: se ambíguo, deixa escolher; senão usa o melhor
  if(ranked.length>1 && (ranked[0].sc-(ranked[1]?ranked[1].sc:0))<2){ window.__fipePick={marca,top:ranked,ctx}; return fipeEscolherModelo(ranked,ctx); }
  const d=await fipeBuscarValor(marca,ranked[0].m,ctx); return fipeFinalizarParallelum(d,ctx);
}
async function fipeBuscarValor(marca,modelo,ctx){
  const anos=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos/'+modelo.codigo+'/anos');
  const ano=anos.find(a=>String(a.nome).startsWith(String(ctx.ano||''))) || anos.find(a=>String(a.codigo).startsWith(String(ctx.ano||''))) || anos[0];
  return fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos/'+modelo.codigo+'/anos/'+ano.codigo);
}
async function fipeFinalizarParallelum(d,ctx){
  const codigo=(d.CodigoFipe||ctx.codigo||'').trim(); const mesRef=(d.MesReferencia||'').trim();
  await fipeSalvarSnap(codigo,(d.Marca||'')+' '+(d.Modelo||''),d.Valor,d.AnoModelo,mesRef);
  let hist=[]; try{ if(codigo){ const hs=await db.collection('fipe_historico').where('codigoFipe','==',codigo).get(); hist=hs.docs.map(x=>x.data()).filter(h=>h.valorNum).map(h=>({mes:h.mesReferencia,valor:h.valorNum,label:h.valor})).sort((a,b)=>mesRefKey(a.mes)-mesRefKey(b.mes)); } }catch(e){}
  renderFipe({...d,CodigoFipe:codigo}, hist, 'parallelum');
}
async function fipeSalvarSnap(codigo,marcaModelo,valor,ano,mesRef){ try{ const docId=((codigo||marcaModelo)+'_'+mesRef).replace(/[^\w]+/g,'_');
  await db.collection('fipe_historico').doc(docId).set({ codigoFipe:codigo||null, marcaModelo, valor, valorNum:fipeNum(valor), anoModelo:ano||null, mesReferencia:mesRef, atualizadoEm:FV.serverTimestamp() },{merge:true}); }catch(e){} }
function fipeEscolherModelo(ranked,ctx){ const el=document.getElementById('fipeBody'); if(!el) return;
  el.innerHTML=`<p style="color:var(--text-2);margin-bottom:12px">Não consegui confirmar pelo código. Escolha o modelo exato de <b>${esc(ctx.modelo||'')}</b>:</p>`+
    ranked.map((x,i)=>`<div class="emp-row" onclick="fipePick(${i})"><div class="nm" style="flex:1"><b>${esc(x.m.nome)}</b></div><i class="fas fa-chevron-right" style="color:var(--text-3)"></i></div>`).join(''); }
function fipePick(i){ const s=window.__fipePick; if(!s) return;
  document.getElementById('fipeBody').innerHTML='<div class="empty" style="padding:24px"><div class="em-ic"><i class="fas fa-spinner fa-spin"></i></div><h4>Buscando valor...</h4></div>';
  fipeBuscarValor(s.marca,s.top[i].m,s.ctx).then(d=>fipeFinalizarParallelum(d,s.ctx)).catch(fipeErro); }
/* Obtém só o VALOR ATUAL (sem renderizar) — usado no lote e na automação */
async function fipeObterAtual(ctx){
  if(ctx.codigo){ try{ const arr=await fipeGet(BRASIL_FIPE+'/preco/v1/'+encodeURIComponent(ctx.codigo)); const it=fipePorAnoComb(arr,ctx.ano,ctx.comb);
    if(it&&it.valor) return {codigo:ctx.codigo, valor:it.valor, valorNum:fipeNum(it.valor), marcaModelo:((it.marca||'')+' '+(it.modelo||'')).trim(), ano:it.anoModelo, mes:(it.mesReferencia||'').trim()}; }catch(e){} }
  if(ctx.marca&&ctx.modelo){ try{ const marcas=await fipeGet(FIPE_BASE+'/marcas'); const marca=fipeAcharMarca(marcas,ctx.marca);
    if(marca){ const mr=await fipeGet(FIPE_BASE+'/marcas/'+marca.codigo+'/modelos'); const modelos=mr.modelos||[]; const alvo=fipeTokens(ctx.modelo);
      const ranked=modelos.map(m=>({m,sc:fipeScore(alvo,m.nome)})).sort((a,b)=>b.sc-a.sc).filter(x=>x.sc>0).slice(0,6);
      for(const c of ranked){ try{ const d=await fipeBuscarValor(marca,c.m,ctx);
        if(!ctx.codigo || (d.CodigoFipe||'').replace(/\D/g,'')===String(ctx.codigo).replace(/\D/g,'')) return {codigo:d.CodigoFipe||ctx.codigo||'', valor:d.Valor, valorNum:fipeNum(d.Valor), marcaModelo:((d.Marca||'')+' '+(d.Modelo||'')).trim(), ano:d.AnoModelo, mes:(d.MesReferencia||'').trim()}; }catch(e){} }
      if(ranked.length){ const d=await fipeBuscarValor(marca,ranked[0].m,ctx); return {codigo:d.CodigoFipe||'', valor:d.Valor, valorNum:fipeNum(d.Valor), marcaModelo:((d.Marca||'')+' '+(d.Modelo||'')).trim(), ano:d.AnoModelo, mes:(d.MesReferencia||'').trim()}; }
    } }catch(e){} }
  return null;
}
function apoliceCtxFipe(a){ return {codigo:a.codigoFipe, marca:a.veiculoFabricante||((a.veiculoModelo||'').split(' ')[0]), modelo:a.veiculoModelo, ano:a.veiculoAno, comb:a.combustivel}; }
let FIPE_BATCH_RUNNING=false;
async function atualizarFipeTodas(silencioso){
  if(FIPE_BATCH_RUNNING) return;
  const aps=CACHE.apolices.filter(a=>a.status!=='cancelada' && (a.codigoFipe||a.veiculoModelo));
  if(!aps.length){ if(!silencioso) toast('Nenhuma apólice com veículo para atualizar.','info'); return; }
  FIPE_BATCH_RUNNING=true;
  if(!silencioso) toast('Atualizando a FIPE de '+aps.length+' veículo(s) ao vivo. Pode levar um minuto...','info','FIPE');
  let ok=0;
  for(let i=0;i<aps.length;i++){ const a=aps[i];
    try{ const v=await fipeObterAtual(apoliceCtxFipe(a));
      if(v&&v.valorNum){ await fipeSalvarSnap(v.codigo||a.codigoFipe||'', v.marcaModelo||a.veiculoModelo||'', v.valor, v.ano||a.veiculoAno, v.mes);
        await db.collection('apolices_cliente').doc(a.id).update({ fipeAtual:v.valor, fipeAtualNum:v.valorNum, fipeMes:v.mes||null, fipeAtualizadoEm:FV.serverTimestamp() }); ok++; }
    }catch(e){ console.warn('fipe lote',a.id,e); }
    const prog=document.getElementById('fipeBatchProg'); if(prog) prog.style.width=Math.round((i+1)/aps.length*100)+'%';
    const cnt=document.getElementById('fipeBatchCnt'); if(cnt) cnt.textContent=(i+1)+' / '+aps.length;
  }
  try{ await db.collection('configuracoes').doc('fipe_auto').set({ ultimoMes:new Date().toISOString().slice(0,7), atualizadoEm:FV.serverTimestamp(), total:ok },{merge:true}); }catch(e){}
  FIPE_BATCH_RUNNING=false;
  if(!silencioso) toast('FIPE atualizada em '+ok+' de '+aps.length+' veículo(s).','ok','Concluído');
  if(((location.hash||'').slice(1))==='fipe') VIEWS.fipe();
}
/* Automático: roda sozinho quando você abre o CRM num mês ainda não capturado */
let _fipeAutoChecked=false;
async function checarFipeAuto(){
  if(_fipeAutoChecked || !CACHE.apolices.length) return; _fipeAutoChecked=true;
  try{ const doc=await db.collection('configuracoes').doc('fipe_auto').get();
    const mes=doc.exists?(doc.data().ultimoMes||null):null; const atual=new Date().toISOString().slice(0,7);
    if(mes!==atual){ atualizarFipeTodas(true); } }catch(e){ console.warn('fipe auto',e); }
}

/* ---------- FIPE DA CARTEIRA ---------- */
VIEWS.fipe=function(){
  const aps=CACHE.apolices.filter(a=>a.status!=='cancelada' && (a.codigoFipe||a.veiculoModelo));
  const actions=`<button class="btn btn-primary btn-sm" onclick="atualizarFipeTodas()"${FIPE_BATCH_RUNNING?' disabled':''}><i class="fas fa-rotate"></i> Atualizar todas agora</button>`;
  let html=head('fipe',{actions});
  // barra de progresso do lote
  html+=`<div id="fipeBatchBar" style="${FIPE_BATCH_RUNNING?'':'display:none'}margin-bottom:14px"><div style="font-size:.82rem;color:var(--text-2);margin-bottom:4px">Atualizando... <span id="fipeBatchCnt"></span></div><div style="height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden"><div id="fipeBatchProg" style="height:100%;width:0;background:var(--brand);transition:.3s"></div></div></div>`;
  const histPorCodigo={}; CACHE.fipeHist.forEach(h=>{ if(!h.codigoFipe) return; (histPorCodigo[h.codigoFipe]=histPorCodigo[h.codigoFipe]||[]).push(h); });
  const linhas=aps.map(a=>{ const hs=(histPorCodigo[a.codigoFipe]||[]).slice().sort((x,y)=>mesRefKey(x.mesReferencia)-mesRefKey(y.mesReferencia));
    const atualNum=a.fipeAtualNum ?? (hs.length?hs[hs.length-1].valorNum:null);
    const atualStr=a.fipeAtual || (hs.length?hs[hs.length-1].valor:null);
    const prev=hs.length>=2?hs[hs.length-2].valorNum:null;
    const dif=(atualNum!=null&&prev!=null)?atualNum-prev:null;
    return {a,atualStr,atualNum,dif,mes:a.fipeMes||(hs.length?hs[hs.length-1].mesReferencia:null)}; });
  const comValor=linhas.filter(l=>l.atualNum!=null).length;
  html+=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <div class="kpi"><div class="ico i-brand"><i class="fas fa-car-side"></i></div><div class="val">${aps.length}</div><div class="lbl">Veículos na carteira</div></div>
    <div class="kpi"><div class="ico i-ok"><i class="fas fa-circle-check"></i></div><div class="val">${comValor}</div><div class="lbl">Com valor FIPE lido</div></div>
    <div class="kpi"><div class="ico i-info"><i class="fas fa-clock-rotate-left"></i></div><div class="val" style="font-size:1rem">${fipeAutoLabel()}</div><div class="lbl">Última atualização geral</div></div>
  </div>`;
  html+=`<div class="card"><div class="card-head"><h3><i class="fas fa-car-side"></i> Valor FIPE por veículo</h3>
      <span style="font-size:.78rem;color:var(--text-3)">atualiza sozinho todo mês ao abrir o CRM</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Veículo</th><th>Placa</th><th>Valor FIPE</th><th>Variação (mês)</th><th>Referência</th><th></th></tr></thead><tbody>
    ${linhas.length?linhas.map(l=>`<tr>
      <td><b>${esc(l.a.clienteNome||'-')}</b></td>
      <td>${esc([l.a.veiculoFabricante,l.a.veiculoModelo].filter(Boolean).join(' ')||l.a.veiculoModelo||'-')}${l.a.veiculoAno?' · '+esc(l.a.veiculoAno):''}</td>
      <td>${esc(l.a.veiculoPlaca||'-')}</td>
      <td><b>${esc(l.atualStr)||'<span style=color:var(--text-3)>—</span>'}</b></td>
      <td>${l.dif!=null?`<span style="color:${l.dif>=0?'var(--ok)':'var(--danger)'};font-weight:600"><i class="fas fa-arrow-trend-${l.dif>=0?'up':'down'}"></i> ${l.dif>=0?'+':''}${money(l.dif)}</span>`:'<span style="color:var(--text-3)">—</span>'}</td>
      <td style="color:var(--text-3)">${esc((l.mes||'').trim())||'-'}</td>
      <td><button class="btn btn-ghost btn-sm" onclick='modalFipe(${JSON.stringify(apoliceCtxFipe(l.a))})'><i class="fas fa-chart-line"></i> histórico</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><div class="em-ic"><i class="fas fa-car-side"></i></div><h4>Nenhum veículo com FIPE</h4><p>Gere apólices a partir das propostas (o código FIPE vem junto) ou informe o código na apólice.</p></div></td></tr>`}
    </tbody></table></div></div>
    <p style="font-size:.76rem;color:var(--text-3);margin-top:12px"><i class="fas fa-robot"></i> Atualização automática: toda vez que você abre o CRM num mês novo, ele busca sozinho o valor FIPE de todos os veículos. Quer forçar agora? Use "Atualizar todas agora".</p>`;
  setView(html);
};
function fipeAutoLabel(){ const c=CACHE.apolices.find(a=>a.fipeMes); return c?esc(c.fipeMes):'—'; }

function fipeErro(e){ const el=document.getElementById('fipeBody'); if(!el) return; console.error(e);
  el.innerHTML=`<div class="empty" style="padding:24px"><div class="em-ic"><i class="fas fa-triangle-exclamation"></i></div>
    <h4>Não consegui consultar agora</h4><p>${esc(e.message||'Erro')}<br>A FIPE é consultada ao vivo pela internet; tente de novo em instantes.</p></div>`; }
function renderFipe(d, hist, fonte){
  const el=document.getElementById('fipeBody'); if(!el) return;
  let variacao='';
  if(hist.length>=2){ const ini=hist[0].valor, fim=hist[hist.length-1].valor; if(ini&&fim){ const dif=fim-ini; const pct=(dif/ini*100);
    variacao=`<span style="color:${dif>=0?'var(--ok)':'var(--danger)'};font-weight:700"><i class="fas fa-arrow-trend-${dif>=0?'up':'down'}"></i> ${dif>=0?'+':''}${money(dif)} (${dif>=0?'+':''}${pct.toFixed(1)}%)</span>`; } }
  const tituloHist = fonte==='brasil' ? 'Evolução — últimos meses' : 'Evolução ('+hist.length+' consultas)';
  el.innerHTML=`
    <div style="display:flex;gap:14px;align-items:center;background:var(--brand-50);border-radius:12px;padding:16px 18px;margin-bottom:16px">
      <div style="width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px"><i class="fas fa-car"></i></div>
      <div><div style="font-size:.78rem;color:var(--text-2)">${esc(d.Marca||'')} ${esc(d.Modelo||'')} · ${esc(String(d.AnoModelo||''))} · ${esc(d.Combustivel||'')}</div>
        <div style="font-size:1.5rem;font-weight:800;color:var(--brand-dark)">${esc(d.Valor||'-')}</div>
        <div style="font-size:.75rem;color:var(--text-3)">Referência: ${esc((d.MesReferencia||'').trim())}${d.CodigoFipe?' · FIPE '+esc(d.CodigoFipe):''}</div></div>
    </div>
    ${hist.length>=2?`<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><b style="font-size:.9rem">${tituloHist}</b>${variacao}</div>
      ${sparkline(hist)}
      <div class="tbl-wrap" style="margin-top:12px;max-height:180px;overflow-y:auto"><table><thead><tr><th>Referência</th><th>Valor</th></tr></thead><tbody>
      ${hist.slice().reverse().map(h=>`<tr><td>${esc((h.mes||'').trim())}</td><td>${esc(h.label)}</td></tr>`).join('')}
      </tbody></table></div>`
    :`<div style="background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.82rem;color:var(--text-2)"><i class="fas fa-clock-rotate-left" style="color:var(--brand)"></i> Mostrando o valor atual. O histórico dos meses anteriores nem sempre está disponível ao vivo — quando não vem, vamos guardando um retrato a cada consulta e a evolução aparece aqui.</div>`}
    <p style="font-size:.72rem;color:var(--text-3);margin-top:12px"><i class="fas fa-circle-info"></i> Fonte: Tabela FIPE${fonte==='brasil'?' (BrasilAPI, por código)':' (parallelum, por marca/modelo)'}, ao vivo.</p>`;
}
function sparkline(hist){
  const vals=hist.map(h=>h.valor).filter(v=>v!=null); if(vals.length<2) return '';
  const w=460,h=90,pad=6; const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=hist.map((d,i)=>{ const x=pad+(i/(hist.length-1))*(w-2*pad); const y=h-pad-((d.valor-min)/rng)*(h-2*pad); return [x,y]; });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const up=vals[vals.length-1]>=vals[0]; const cor=up?'var(--ok)':'var(--danger)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:90px;overflow:visible">
    <path d="${area}" fill="${cor}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${cor}"/>`).join('')}
  </svg>`;
}

/* ---------- CONFIGURAÇÕES ---------- */
let CFG_TAB='seguradoras';
VIEWS.configuracoes=function(){
  let html=head('configuracoes');
  html+=`<div class="tabs" style="margin-bottom:16px">
    <button class="tab ${CFG_TAB==='seguradoras'?'active':''}" onclick="CFG_TAB='seguradoras';VIEWS.configuracoes()"><i class="fas fa-shield"></i> Seguradoras</button>
    <button class="tab ${CFG_TAB==='conta'?'active':''}" onclick="CFG_TAB='conta';VIEWS.configuracoes()"><i class="fas fa-user"></i> Minha conta</button>
    <button class="tab ${CFG_TAB==='sistema'?'active':''}" onclick="CFG_TAB='sistema';VIEWS.configuracoes()"><i class="fas fa-circle-info"></i> Sistema</button></div>`;
  if(CFG_TAB==='seguradoras'){
    const segs=CACHE.seguradoras.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    html+=`<div class="card"><div class="card-head"><h3><i class="fas fa-shield"></i> Seguradoras</h3><button class="btn btn-primary btn-sm" onclick="modalSeguradora()"><i class="fas fa-plus"></i> Nova</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Código SUSEP</th><th>Status</th><th></th></tr></thead><tbody>
      ${segs.length?segs.map(s=>`<tr><td><b>${esc(s.nome||'-')}</b></td><td>${esc(s.codigo||s.susep||'-')}</td><td>${statusBadge(s.status==='inativo'?'Inativo':'Ativo',s.status==='inativo'?'var(--text-3)':'var(--ok)')}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="modalSeguradora('${s.id}')"><i class="fas fa-pen"></i></button></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty" style="padding:26px"><div class="em-ic"><i class="fas fa-shield"></i></div><h4>Nenhuma seguradora</h4></div></td></tr>`}
      </tbody></table></div></div>`;
  }else if(CFG_TAB==='conta'){
    html+=`<div class="card"><div class="card-pad">
      <div class="mov-f" style="margin-bottom:14px"><div class="k">Usuário conectado</div><div class="v">${esc(CURRENT_USER?.email||'-')}</div></div>
      <div class="form-row"><label>Tema da interface</label>
        <div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="applyTheme('light')"><i class="fas fa-sun"></i> Claro</button>
        <button class="btn btn-ghost" onclick="applyTheme('dark')"><i class="fas fa-moon"></i> Escuro</button></div></div>
      <button class="btn btn-danger" onclick="logout()"><i class="fas fa-arrow-right-from-bracket"></i> Sair da conta</button>
    </div></div>`;
  }else{
    html+=`<div class="card"><div class="card-pad">
      <h3 style="margin-bottom:10px"><i class="fas fa-shield-halved" style="color:var(--brand)"></i> CRM Retorno Seguros</h3>
      <p style="color:var(--text-2);max-width:600px">Painel único da corretora, em arquivo único, conectado ao Firebase. Todas as telas (Leads, Clientes, Apólices, Beneficiários, Movimentações, Parceiros e mais) vivem aqui, com o menu definido em um só lugar.</p>
      <div style="display:flex;gap:24px;margin-top:16px;flex-wrap:wrap">
        <div class="mov-f"><div class="k">Leads</div><div class="v">${CACHE.leads.length}</div></div>
        <div class="mov-f"><div class="k">Apólices</div><div class="v">${CACHE.apolices.length}</div></div>
        <div class="mov-f"><div class="k">Empresas</div><div class="v">${CACHE.empresas.length}</div></div>
        <div class="mov-f"><div class="k">Beneficiários</div><div class="v">${CACHE.beneficiarios.length}</div></div>
      </div></div></div>`;
  }
  setView(html);
};
function modalSeguradora(id){ const s=id?CACHE.seguradoras.find(x=>x.id===id)||{}:{};
  openModal(`<div class="modal-head"><h3><i class="fas fa-shield" style="color:var(--brand)"></i> ${id?'Editar':'Nova'} seguradora</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body"><input type="hidden" id="sgrId" value="${id||''}">
      <div class="form-row"><label>Nome *</label><input type="text" id="sgrNome" value="${esc(s.nome||'')}"></div>
      <div class="form-row"><label>Código SUSEP</label><input type="text" id="sgrCod" value="${esc(s.codigo||s.susep||'')}"></div>
      <div class="form-row"><label>Status</label><select id="sgrStatus"><option value="ativo" ${s.status!=='inativo'?'selected':''}>Ativo</option><option value="inativo" ${s.status==='inativo'?'selected':''}>Inativo</option></select></div>
    </div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarSeguradora()"><i class="fas fa-floppy-disk"></i> Salvar</button></div>`);
}
async function salvarSeguradora(){ const id=document.getElementById('sgrId').value; const nome=document.getElementById('sgrNome').value.trim(); if(!nome){ toast('Informe o nome.','err'); return; }
  const dados={nome,codigo:document.getElementById('sgrCod').value.trim()||null,status:document.getElementById('sgrStatus').value,atualizadoEm:FV.serverTimestamp()};
  try{ if(id) await db.collection('seguradoras').doc(id).update(dados); else{ dados.criadoEm=FV.serverTimestamp(); await db.collection('seguradoras').add(dados);} closeModal(); toast('Seguradora salva.','ok'); }catch(e){ toast('Erro.','err'); } }

/* =========================================================================
   FASE 4 — NOTIFICAÇÕES (sino) + ALERTA NA ÁREA DE TRABALHO
   ========================================================================= */
function coletarNotificacoes(){
  const itens=[];
  CACHE.leads.filter(isLeadNovo).slice(0,20).forEach(l=>itens.push({
    tipo:'lead', icon:'fa-bolt', cor:'var(--brand)', rota:'leads',
    titulo:'Lead novo', desc:esc(l.nomeEmpresa||l.nome||'Sem nome'), quando:l.criadoEm }));
  CACHE.movimentacoes.filter(m=>m.status==='pendente').slice(0,20).forEach(m=>itens.push({
    tipo:'mov', icon:'fa-right-left', cor:'var(--warn)', rota:'movimentacoes',
    titulo:(m.tipo==='inclusao'?'Inclusão':'Exclusão')+' pendente', desc:esc((m.nome||'')+' · '+(m.empresaNome||'')), quando:m.criadoEm }));
  CACHE.resgates.filter(r=>r.status==='pendente').slice(0,20).forEach(r=>itens.push({
    tipo:'resg', icon:'fa-gift', cor:'var(--purple)', rota:'resgates',
    titulo:'Resgate pendente', desc:esc((r.parceiroNome||'')+' · '+money(r.valor)), quando:r.criadoEm }));
  CACHE.apolices.forEach(a=>{ const d=diasAte(a.dataFimVigencia); if(d!=null&&d<=15){ itens.push({
    tipo:'renov', icon:'fa-rotate', cor:d<0?'var(--danger)':'var(--warn)', rota:'renovacoes',
    titulo:d<0?'Apólice vencida':'Renovação em '+d+' dias', desc:esc(a.clienteNome||a.numeroApolice||'Apólice'), quando:null }); } });
  itens.sort((a,b)=>(toDate(b.quando)||0)-(toDate(a.quando)||0));
  return itens;
}
function atualizarNotificacoes(){
  const itens=coletarNotificacoes();
  const dot=document.getElementById('notifDot');
  if(dot){ dot.textContent=itens.length>99?'99+':itens.length; dot.classList.toggle('hidden',itens.length===0);
    dot.style.cssText='position:absolute;top:5px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;display:'+(itens.length?'flex':'none')+';align-items:center;justify-content:center;border:2px solid var(--surface)'; }
  const panel=document.getElementById('notifPanel');
  if(panel&&panel.classList.contains('open')) renderNotifPanel();
}
function renderNotifPanel(){
  const itens=coletarNotificacoes();
  const p=document.getElementById('notifPanel');
  p.innerHTML=`<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:.95rem"><i class="fas fa-bell" style="color:var(--brand)"></i> Notificações</b>
      <span style="font-size:.75rem;color:var(--text-3)">${itens.length} pendência(s)</span></div>
    <div style="max-height:60vh;overflow-y:auto">
    ${itens.length?itens.map(n=>`<div onclick="location.hash='#${n.rota}';toggleNotif(true)" style="display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
      <div style="width:34px;height:34px;border-radius:10px;background:${n.cor}22;color:${n.cor};display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas ${n.icon}"></i></div>
      <div style="min-width:0"><div style="font-weight:600;font-size:.85rem">${n.titulo}</div><div style="font-size:.78rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.desc}</div>
      ${n.quando?`<div style="font-size:.7rem;color:var(--text-3)">${fmtDataHora(n.quando)}</div>`:''}</div></div>`).join('')
    :`<div class="empty" style="padding:40px 20px"><div class="em-ic"><i class="fas fa-check"></i></div><h4>Tudo em dia 🎉</h4><p>Sem pendências no momento.</p></div>`}
    </div>`;
}
function toggleNotif(forceClose){
  let p=document.getElementById('notifPanel');
  if(!p){ p=document.createElement('div'); p.id='notifPanel';
    p.style.cssText='position:fixed;top:58px;right:20px;width:360px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);z-index:1200;display:none;overflow:hidden';
    document.body.appendChild(p);
    document.addEventListener('click',e=>{ if(p.classList.contains('open')&&!p.contains(e.target)&&e.target.id!=='notifBtn'&&!document.getElementById('notifBtn').contains(e.target)){ p.classList.remove('open'); p.style.display='none'; } });
  }
  if(forceClose){ p.classList.remove('open'); p.style.display='none'; return; }
  const open=p.classList.toggle('open');
  p.style.display=open?'block':'none';
  if(open){ renderNotifPanel(); pedirPermissaoNotif(); }
}
/* alerta na área de trabalho ao chegar lead novo */
function pedirPermissaoNotif(){ try{ if('Notification'in window&&Notification.permission==='default') Notification.requestPermission(); }catch(e){} }
function detectarLeadsNovos(leads){
  const ids=new Set(leads.map(l=>l.id));
  if(_leadsKnown===null){ _leadsKnown=ids; return; } // primeira carga não dispara
  const novos=leads.filter(l=>!_leadsKnown.has(l.id));
  _leadsKnown=ids;
  novos.forEach(l=>{
    toast(esc(l.nomeEmpresa||l.nome||'Novo cadastro')+(l.ramo?' · '+esc(l.ramo):''),'info','🔔 Lead novo!');
    try{ if('Notification'in window&&Notification.permission==='granted'){
      const n=new Notification('🔔 Novo lead na Retorno Seguros',{body:(l.nomeEmpresa||l.nome||'Novo cadastro')+(l.whatsapp?' · '+l.whatsapp:''),tag:'lead-'+l.id});
      n.onclick=()=>{ window.focus(); location.hash='#leads'; n.close(); };
    }}catch(e){}
  });
}

/* =========================================================================
   FASE 4 — LINHA DO TEMPO DE INTERAÇÕES (ficha do cliente)
   ========================================================================= */
const TIPO_INTERACAO={ligacao:['Ligação','fa-phone','var(--info)'],whatsapp:['WhatsApp','fa-whatsapp','var(--ok)'],
  email:['E-mail','fa-envelope','var(--purple)'],reuniao:['Reunião','fa-handshake','var(--orange)'],
  nota:['Observação','fa-note-sticky','var(--text-2)']};
function interacoesDoLead(id){ return CACHE.interacoes.filter(i=>i.leadId===id).sort((a,b)=>(toDate(b.criadoEm)||0)-(toDate(a.criadoEm)||0)); }
function renderTimeline(id){
  const its=interacoesDoLead(id);
  return `<div id="tlList">${its.length?its.map(i=>{ const t=TIPO_INTERACAO[i.tipo]||TIPO_INTERACAO.nota;
    return `<div style="display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:30px;height:30px;border-radius:9px;background:${t[2]}22;color:${t[2]};display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa${i.tipo==='whatsapp'?'b':'s'} ${t[1]}"></i></div>
      <div style="flex:1;min-width:0"><div style="font-size:.82rem"><b>${t[0]}</b> <span style="color:var(--text-3)">· ${fmtDataHora(i.criadoEm)}${i.autor?' · '+esc(i.autor):''}</span></div>
      <div style="font-size:.85rem;color:var(--text-2)">${esc(i.texto||'')}</div></div></div>`;
  }).join(''):`<p style="color:var(--text-3);font-size:.85rem;padding:8px 0">Nenhuma interação registrada ainda.</p>`}</div>`;
}
async function addInteracao(id){
  const tipo=document.getElementById('tlTipo').value;
  const texto=document.getElementById('tlTexto').value.trim();
  if(!texto){ toast('Escreva o que aconteceu na interação.','err'); return; }
  try{
    await db.collection('interacoes_crm').add({leadId:id,tipo,texto,autor:CURRENT_USER?.email?.split('@')[0]||'admin',criadoEm:FV.serverTimestamp()});
    document.getElementById('tlTexto').value='';
    toast('Interação registrada.','ok');
    // otimista: injeta na hora (o snapshot confirma logo em seguida)
    setTimeout(()=>{ const c=document.getElementById('tlList'); if(c) c.outerHTML=renderTimeline(id); },400);
  }catch(e){ console.error(e); toast('Erro ao registrar.','err'); }
}

/* =========================================================================
   Sidebar mobile
   ========================================================================= */
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
