<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sua proposta de seguro — Retorno Seguros</title>
<link rel="icon" href="/admin-banco/icons/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
:root{--navy:#1b2c5c;--navy2:#16254e;--deep:#0f172a;--blue:#1e3a8a;--sky:#0ea5e9;--bg:#f6f9ff;--card:#fff;--line:#e2e8f0;
  --txt:#1f2a3d;--mut:#64748b;--mut2:#94a3b8;--ok:#16a34a;--okbg:#ecfdf5;--warn:#b45309;--warnbg:#fffbeb;--bad:#dc2626;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',system-ui,sans-serif;color:var(--txt);background:linear-gradient(180deg,#f6f9ff 0%,#dee9fb 40%,#f6f9ff 100%);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:38px;max-width:170px;object-fit:contain}
.top a.wa{display:inline-flex;align-items:center;gap:7px;background:#25d366;color:#fff;font-weight:700;font-size:.85rem;padding:9px 14px;border-radius:10px;text-decoration:none}
.hero{background:radial-gradient(ellipse 55% 65% at 82% 18%,rgba(27,44,92,.35),transparent 60%),linear-gradient(135deg,#0f172a 0%,#14274e 55%,#1e3a8a 100%);color:#fff;padding:34px 16px 70px}
.hero-in{max-width:1100px;margin:0 auto}
.tag{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:30px;font-size:.72rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px}
.hero h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.15;margin-bottom:8px}
.hero h1 em{color:#bfdbfe}
.hero p{color:rgba(255,255,255,.85);max-width:640px}
.veic{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.veic span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 11px;font-size:.82rem}
.wrap{max-width:1100px;margin:-44px auto 0;padding:0 16px 60px;position:relative}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px rgba(15,23,42,.07);padding:18px 20px;margin-bottom:16px}
.box h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.35rem;color:var(--navy);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.84rem}
.chip b{color:var(--navy)}
.aviso{border-radius:12px;padding:12px 14px;font-size:.88rem;margin-bottom:16px}
.aviso.ok{background:var(--okbg);border:1px solid #bbf7d0;color:#166534}
.aviso.warn{background:var(--warnbg);border:1px solid #fde68a;color:#7c4a03}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.op{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px rgba(15,23,42,.07);display:flex;flex-direction:column;overflow:hidden;position:relative}
.op.rec{border:2px solid var(--navy);box-shadow:0 12px 34px rgba(27,44,92,.18)}
.op .rib{background:var(--navy);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:6px 14px;text-align:center}
.op-h{padding:16px 18px 10px}
.op-h .cia{font-weight:700;font-size:1.1rem;color:var(--deep)}
.op-h .prod{font-size:.8rem;color:var(--mut)}
.preco{padding:4px 18px 12px}
.preco .tot{font-size:1.9rem;font-weight:700;color:var(--navy);line-height:1.1}
.preco .tot small{font-size:.8rem;font-weight:600;color:var(--mut)}
.preco .parc{font-size:.9rem;color:var(--txt);margin-top:3px}
.preco .liq{font-size:.76rem;color:var(--mut);margin-top:2px}
.fr{margin:0 18px 10px;background:var(--bg);border-radius:10px;padding:8px 11px;font-size:.84rem}
.lst{padding:4px 18px 8px;font-size:.86rem}
.lst h4{font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:10px 0 6px}
.lst li{list-style:none;display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.lst li i{color:var(--ok);font-style:normal;font-weight:700;flex-shrink:0}
.lst li span.v{margin-left:auto;color:var(--mut);font-size:.8rem;text-align:right;padding-left:8px}
.dest{margin:6px 18px 10px;font-size:.84rem;color:#166534;background:var(--okbg);border-radius:10px;padding:8px 11px}
.atd{margin:0 18px 10px;font-size:.82rem}
.atd div{display:flex;gap:7px;padding:2px 0}
.op-f{margin-top:auto;padding:14px 18px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:12px;padding:13px 18px;font-size:.95rem;text-decoration:none;transition:.2s}
.btn-p{background:var(--navy);color:#fff;width:100%}
.btn-p:hover{background:var(--navy2);transform:translateY(-1px)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-g{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-wa{background:#25d366;color:#fff}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{background:var(--bg);color:var(--navy);font-size:.8rem}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.no{color:var(--mut2)}
.foot{text-align:center;color:var(--mut);font-size:.78rem;margin-top:24px}
.load{text-align:center;padding:80px 16px;color:var(--mut)}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:24px 12px}
.mbg.on{display:flex}
.mod{background:#fff;border-radius:18px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(15,23,42,.25);overflow:hidden}
.mod-h{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.mod-h h3{font-size:1.05rem}
.mod-h button{background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;line-height:1}
.mod-b{padding:18px 20px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.78rem;font-weight:700;color:var(--mut);margin-bottom:5px}
.fg input,.fg select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.95rem;background:#f8fafc}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--navy);background:#fff}
.formas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.forma{border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;cursor:pointer;font-size:.82rem;font-weight:600;background:#f8fafc}
.forma.on{border-color:var(--navy);background:#eff6ff;color:var(--navy)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:.84rem;margin-top:6px;min-height:1em}
.seg{font-size:.76rem;color:var(--mut);margin-top:10px;display:flex;gap:6px}
.resumo{background:var(--bg);border-radius:12px;padding:11px 13px;font-size:.88rem;margin-bottom:14px}
@media(max-width:560px){.g2{grid-template-columns:1fr}.formas{grid-template-columns:1fr 1fr 1fr}.top img{height:32px}}
@media print{.top,.op-f,.noprint,.mbg{display:none!important}body{background:#fff}.hero{padding:16px;color:#000;background:none}.hero p,.veic span{color:#000;border-color:#ccc}
  .wrap{margin-top:0}.op,.box{box-shadow:none;break-inside:avoid}.ops{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a href="https://retornoseguros.com/"><img src="logo-retorno-completa.png" alt="Retorno Seguros" class="logo"></a>
  <a class="wa noprint" id="topWa" href="https://wa.me/5554996454300" target="_blank" rel="noopener">WhatsApp</a>
</div></header>
<div id="app"><div class="load">Carregando sua proposta...</div></div>

<div class="mbg" id="mbg"><div class="mod" id="mod"></div></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyDlbEZfA_uAR1aoPZIr8T9B6KNcrwfMxm0",authDomain:"retorno-seguros.firebaseapp.com",projectId:"retorno-seguros",storageBucket:"retorno-seguros.appspot.com",messagingSenderId:"495712392972",appId:"1:495712392972:web:e1e78aedc48bdeea48db29"});
const db=firebase.firestore();
const authPronta=firebase.auth().signInAnonymously().catch(e=>console.warn('auth',e));
const ID=new URLSearchParams(location.search).get('id');
const CART_DIAS=15;
let O=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtD=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m?m[3]+'/'+m[2]+'/'+m[1]:(s||''); };
const FORMAS={cartao:'Cartão de crédito',debito:'Débito em conta',boleto:'Boleto',carne:'Carnê',avista:'À vista'};
const ASSIST=['assist','reserva','vidros','farois','reparos','parachoque','roda','pintura','buracos','chaveiro','residencia','carta'];
function lmiTxt(v){
  if(v==null||v==='') return '';
  if(typeof v==='number') return v>0?R(v):'';
  const s=String(v).trim(); if(/^(0|0,00|—|-|contratada)$/i.test(s)) return '';
  if(/^100([.,]00)?\s*%$/.test(s)) return '100% da FIPE';
  if(/^[\d.,]+$/.test(s)){ const n=parseFloat(s.indexOf(',')>=0?s.replace(/\./g,'').replace(',','.'):s); if(!isNaN(n)&&n>0) return R(n); }
  return s;
}
function waNum(){ return (O&&(O.whatsappCorretora||(O.corretora&&O.corretora.whats)))||'5554996454300'; }
function waLink(msg){ return 'https://wa.me/'+waNum()+(msg?'?text='+encodeURIComponent(msg):''); }
function vencida(){ if(!O||!O.validade) return false; const h=new Date(); const iso=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0'); return String(O.validade)<iso; }
function jaContratou(){ try{ return JSON.parse(localStorage.getItem('rt_contratou_'+ID)||'null'); }catch(e){ return null; } }

async function carregar(){
  const app=document.getElementById('app');
  if(!ID){ app.innerHTML='<div class="load">Link incompleto. Fale com a gente pelo WhatsApp.</div>'; return; }
  try{ await authPronta; const d=await db.collection('orcamentos').doc(ID).get();
    if(!d.exists){ app.innerHTML='<div class="load">Não encontramos esta proposta. Ela pode ter sido substituída — peça o link atualizado ao seu consultor.</div>'; return; }
    O=d.data(); render();
  }catch(e){ console.error(e); app.innerHTML='<div class="load">Não consegui abrir a proposta agora. Tente de novo em instantes.</div>'; }
}
function parcTxt(p){
  const pg=(p.pagamentos||[]).filter(x=>x.n); let best=null;
  pg.forEach(x=>{ if(!x.juros&&(!best||x.n>best.n)) best=x; });
  if(best) return 'ou até <b>'+best.n+'x de '+R(best.valor||(best.total||p.premioTotal)/best.n)+'</b> sem juros'+(best.forma&&FORMAS[best.forma]?' no '+FORMAS[best.forma].toLowerCase():'');
  const u=(p.parcelas||[]).slice(-1)[0]; if(u) return 'ou até <b>'+u.n+'x de '+R(u.valor||p.premioTotal/u.n)+'</b>';
  return '';
}
function render(){
  const v=O.veiculo||{}, nome=((O.cliente&&O.cliente.nome)||'').split(' ')[0];
  document.getElementById('topWa').href=waLink('Olá! Estou vendo a proposta do meu seguro auto e tenho uma dúvida.');
  const ps=(O.propostas||[]).map((p,i)=>Object.assign({__i:i},p));
  const ct=jaContratou(); const venc=vencida();
  let h=`<section class="hero"><div class="hero-in">
    <span class="tag">${O.renovacao?'Renovação do seu seguro':'Sua proposta de seguro auto'}</span>
    <h1>${nome?esc(nome)+', aqui estão':'Aqui estão'} <em>as opções que montamos para você</em></h1>
    <p>Cotamos nas principais seguradoras e trouxemos as que mais combinam com o que você pediu. Compare com calma e, se gostar, é só clicar em <b>Contratar</b>.</p>
    <div class="veic">${[[v.marca,v.modelo].filter(Boolean).join(' '),v.anoMod?(v.anoFab&&v.anoFab!==v.anoMod?v.anoFab+'/':'')+v.anoMod:'',v.placa,O.fipe&&O.fipe.valor?'FIPE '+R(O.fipe.valor):''].filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join('')}</div>
  </div></section><main class="wrap">`;
  if(ct) h+=`<div class="aviso ok"><b>Recebemos a sua escolha (${esc(ct.seguradora)}).</b> Seu consultor vai conferir tudo e te avisar pelo WhatsApp quando enviar para a seguradora.</div>`;
  if(venc) h+=`<div class="aviso warn"><b>Esta cotação venceu em ${fmtD(O.validade)}.</b> Os valores podem ter mudado — <a href="${waLink('Olá! Minha cotação venceu, pode atualizar para mim?')}" target="_blank" rel="noopener">fale com a gente</a> para atualizar.</div>`;
  if(O.resumoCliente||O.observacoes) h+=`<div class="box"><h2>O que o seu consultor recomenda</h2><p style="font-size:.93rem">${esc(O.resumoCliente||O.observacoes).replace(/\n/g,'<br>')}</p>
    ${O.consultor?`<p style="font-size:.82rem;color:var(--mut);margin-top:8px">— ${esc(O.consultor)}, Retorno Seguros</p>`:''}</div>`;
  if((O.pedido||[]).length) h+=`<div class="box"><h2>Você pediu</h2><div class="chips">${O.pedido.map(x=>`<div class="chip">${esc(x.item)}: <b>${esc(x.valor)}</b></div>`).join('')}</div></div>`;
  if(O.apoliceAtual){ const a=O.apoliceAtual;
    h+=`<div class="box"><h2>Seu seguro hoje</h2><div class="chips">
      <div class="chip">Seguradora: <b>${esc(a.seguradora||'—')}</b></div>
      ${a.premioTotal!=null?`<div class="chip">Prêmio: <b>${R(a.premioTotal)}</b></div>`:''}
      ${a.vigenciaFim?`<div class="chip">Vence em: <b>${fmtD(a.vigenciaFim)}</b></div>`:''}
      ${a.bonus?`<div class="chip">Bônus: <b>${esc(a.bonus)}</b></div>`:''}
      ${a.franquia&&a.franquia.valor?`<div class="chip">Franquia: <b>${R(a.franquia.valor)}</b>${a.franquia.tipo?' ('+esc(a.franquia.tipo)+')':''}</div>`:''}</div></div>`; }
  h+=`<div class="ops">${ps.map(p=>opCard(p,ct,venc)).join('')}</div>`;
  if((O.comparativoRenovacao||[]).length) h+=`<div class="box"><h2>Hoje × o que propomos</h2><div class="tw"><table><thead><tr><th>Item</th><th>Hoje</th><th>Proposta</th></tr></thead><tbody>
    ${O.comparativoRenovacao.map(x=>`<tr><td><b>${esc(x.item)}</b>${x.observacao?`<div style="font-size:.76rem;color:var(--mut)">${esc(x.observacao)}</div>`:''}</td><td>${esc(x.hoje||'—')}</td><td><b>${esc(x.proposta||'—')}</b></td></tr>`).join('')}</tbody></table></div></div>`;
  if(ps.length>1) h+=tabela(ps);
  h+=`<div class="box noprint" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div style="font-size:.88rem">${O.validade?'Cotação válida até <b>'+fmtD(O.validade)+'</b>. ':''}Valores sujeitos à análise e aceitação da seguradora.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-g" onclick="window.print()">Salvar em PDF</button>
        <a class="btn btn-wa" href="${waLink('Olá! Vi a proposta do meu seguro auto e queria conversar.')}" target="_blank" rel="noopener">Falar com o consultor</a></div></div>
    <p class="foot">Retorno Seguros e Benefícios · RETORNO ADMINISTRADORA E CORRETORA DE SEGUROS LTDA — CNPJ 26.430.936/0001-46 — SUSEP nº 202002040</p></main>`;
  document.getElementById('app').innerHTML=h;
}
function opCard(p,ct,venc){
  const cobs=(p.coberturas||[]).filter(c=>c.contratada!==false);
  const prin=cobs.filter(c=>!ASSIST.includes(c.chave)), ass=cobs.filter(c=>ASSIST.includes(c.chave));
  const st={ok:['✓','var(--ok)'],parcial:['≈','var(--warn)'],nao:['✕','var(--bad)']};
  const escolhida=ct&&ct.opcaoIndex===p.__i;
  return `<article class="op ${p.recomendada?'rec':''}">
    ${p.recomendada?'<div class="rib">Nossa recomendação</div>':''}
    <div class="op-h"><div class="cia">${esc(p.seguradora)}</div><div class="prod">${esc(p.produto||'')}</div></div>
    <div class="preco"><div class="tot">${R(p.premioTotal)} <small>no ano</small></div>
      <div class="parc">${parcTxt(p)}</div>
      ${O.mostrarLiquido?`<div class="liq">Líquido ${R(p.premioLiquido)} + IOF ${R(p.iof)}</div>`:''}</div>
    ${p.franquia&&p.franquia.valor?`<div class="fr">Franquia ${p.franquia.tipo?esc(String(p.franquia.tipo).toLowerCase())+' ':''}<b>${R(p.franquia.valor)}</b> <span style="color:var(--mut);font-size:.78rem">— sua parte em colisão</span></div>`:''}
    ${(p.destaques||[]).length?`<div class="dest">${p.destaques.map(esc).join('<br>')}</div>`:''}
    <div class="lst">${prin.length?`<h4>Coberturas</h4><ul>${prin.map(c=>`<li><i>✓</i><span>${esc(c.nome)}</span><span class="v">${esc(lmiTxt(c.lmi))}</span></li>`).join('')}</ul>`:''}
      ${ass.length?`<h4>Assistências e serviços</h4><ul>${ass.map(c=>`<li><i>✓</i><span>${esc(c.nome)}</span><span class="v">${esc(lmiTxt(c.lmi))}</span></li>`).join('')}</ul>`:''}</div>
    ${(p.atende||[]).length?`<div class="atd"><h4 style="font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:6px 0">O que você pediu</h4>${p.atende.map(x=>{ const s=st[x.status]||st.parcial;
      return `<div><b style="color:${s[1]}">${s[0]}</b><span>${esc(x.pedido)}${x.entregue?' — <span style="color:var(--mut)">'+esc(x.entregue)+'</span>':''}</span></div>`; }).join('')}</div>`:''}
    ${p.obs?`<div class="atd" style="color:var(--mut)">${esc(p.obs)}</div>`:''}
    <div class="op-f">${escolhida?'<div class="aviso ok" style="margin:0;text-align:center"><b>Opção escolhida ✓</b></div>'
      :`<button class="btn btn-p" ${venc||ct?'disabled':''} onclick="abrirContratar(${p.__i})">Contratar esta opção</button>`}</div>
  </article>`;
}
function tabela(ps){
  const linhas=[]; const vis=new Set();
  ps.forEach(p=>(p.coberturas||[]).forEach(c=>{ const k=c.chave==='outros'?'o:'+c.nome:c.chave; if(!vis.has(k)){ vis.add(k); linhas.push({k,nome:c.nome}); } }));
  const cel=(p,l)=>{ const c=(p.coberturas||[]).find(x=>(x.chave==='outros'?'o:'+x.nome:x.chave)===l.k&&x.contratada!==false);
    return c?'<b style="color:var(--ok)">✓</b><div style="font-size:.76rem">'+esc(lmiTxt(c.lmi))+'</div>':'<span class="no">—</span>'; };
  return `<div class="box"><h2>Comparar lado a lado</h2><div class="tw"><table><thead><tr><th style="min-width:170px">Cobertura</th>${ps.map(p=>`<th>${esc(p.seguradora)}${p.recomendada?'<div style="font-size:.68rem;color:var(--sky)">recomendada</div>':''}</th>`).join('')}</tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${esc(l.nome)}</td>${ps.map(p=>`<td>${cel(p,l)}</td>`).join('')}</tr>`).join('')}
    <tr><td><b>Franquia</b></td>${ps.map(p=>`<td>${p.franquia&&p.franquia.valor?R(p.franquia.valor):'—'}</td>`).join('')}</tr>
    <tr style="background:#eff6ff"><td><b>Prêmio total</b></td>${ps.map(p=>`<td><b style="color:var(--navy)">${R(p.premioTotal)}</b></td>`).join('')}</tr>
  </tbody></table></div></div>`;
}

/* ---------- contratar ---------- */
let CT={};
function abrirContratar(i){
  const p=(O.propostas||[])[i]; if(!p) return;
  const pg=(p.pagamentos||[]).filter(x=>x.n);
  const formas=[...new Set(pg.map(x=>x.forma).filter(f=>FORMAS[f]))];
  CT={i,p,formas:formas.length?formas.filter(f=>['cartao','debito','boleto'].includes(f)).concat(formas.filter(f=>!['cartao','debito','boleto'].includes(f))):['cartao','debito','boleto'],forma:null,pg};
  CT.forma=CT.formas[0]; modalRender();
}
function opcoesParcelas(){
  const L=CT.pg.filter(x=>x.forma===CT.forma).sort((a,b)=>a.n-b.n);
  if(L.length) return L.map(x=>({n:x.n,valor:x.valor||(x.total||CT.p.premioTotal)/x.n,juros:x.juros}));
  const max=CT.forma==='boleto'?4:(CT.forma==='debito'?10:((CT.p.parcelas||[]).slice(-1)[0]||{}).n||10);
  return Array.from({length:max},(_,k)=>({n:k+1,valor:CT.p.premioTotal/(k+1),juros:false,aprox:true}));
}
function modalRender(){
  const p=CT.p; const ps=opcoesParcelas();
  document.getElementById('mod').innerHTML=`<div class="mod-h"><h3>Contratar ${esc(p.seguradora)}</h3><button onclick="fechar()">&times;</button></div>
  <div class="mod-b">
    <div class="resumo"><b>${esc(p.seguradora)}</b>${p.produto?' · '+esc(p.produto):''}<br>Prêmio total: <b>${R(p.premioTotal)}</b></div>
    <div class="fg"><label>Forma de pagamento</label></div>
    <div class="formas">${CT.formas.map(f=>`<div class="forma ${CT.forma===f?'on':''}" onclick="CT.forma='${f}';modalRender()">${esc(FORMAS[f])}</div>`).join('')}</div>
    <div class="fg"><label>Parcelas</label><select id="cParc">${ps.map(x=>`<option value="${x.n}">${x.n}x de ${R(x.valor)}${x.juros?' (com juros)':''}${x.aprox?' (aprox.)':''}</option>`).join('')}</select></div>
    ${CT.forma==='cartao'?`
      <div class="fg"><label>Nome impresso no cartão</label><input id="cNome" autocomplete="cc-name" placeholder="Como está no cartão"></div>
      <div class="fg"><label>Número do cartão</label><input id="cNum" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" oninput="mascNum(this)"><div id="cBand" style="font-size:.78rem;color:var(--mut);margin-top:4px"></div></div>
      <div class="fg" style="max-width:180px"><label>Validade</label><input id="cVal" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" oninput="mascVal(this)"></div>
      <div class="seg">🔒 <span>Não pedimos o código de segurança. O número fica protegido, é usado só para transmitir o seu seguro e é apagado em até ${CART_DIAS} dias.</span></div>`:''}
    ${CT.forma==='debito'?`
      <div class="fg"><label>Banco</label><input id="dBanco" placeholder="Ex.: Banco do Brasil, Sicredi, Itaú"></div>
      <div class="g2"><div class="fg"><label>Agência</label><input id="dAg" inputmode="numeric"></div>
      <div class="fg"><label>Conta (com dígito)</label><input id="dConta" placeholder="00000-0"></div></div>
      <div class="fg"><label>Titular da conta</label><input id="dTit" placeholder="Nome do titular"></div>`:''}
    ${CT.forma==='boleto'||CT.forma==='carne'?`<div class="seg">📄 <span>O boleto é emitido pela seguradora e enviado para você depois da aprovação.</span></div>`:''}
    <label style="display:flex;gap:9px;align-items:flex-start;font-size:.84rem;margin-top:14px;cursor:pointer"><input type="checkbox" id="cOk" style="margin-top:3px">
      <span>Autorizo a Retorno Seguros a transmitir esta proposta para a seguradora. Sei que a contratação depende da análise e aceitação do risco pela seguradora.</span></label>
    <div class="err" id="cErr"></div>
    <button class="btn btn-p" id="cBtn" style="margin-top:8px" onclick="enviar()">Confirmar contratação</button>
  </div>`;
  document.getElementById('mbg').classList.add('on');
}
function fechar(){ document.getElementById('mbg').classList.remove('on'); }
function mascNum(el){ const d=el.value.replace(/\D/g,'').slice(0,19); el.value=d.replace(/(\d{4})(?=\d)/g,'$1 ');
  const b=bandeira(d); document.getElementById('cBand').textContent=b?b:''; }
function mascVal(el){ const d=el.value.replace(/\D/g,'').slice(0,4); el.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d; }
function bandeira(n){
  if(/^(4011|4312|4389|4514|4576|5041|5066|5067|509|6277|6362|6363|650|6516|6550)/.test(n)) return 'Elo';
  if(/^(606282|3841)/.test(n)) return 'Hipercard';
  if(/^3[47]/.test(n)) return 'American Express';
  if(/^4/.test(n)) return 'Visa';
  if(/^(5[1-5]|2[2-7])/.test(n)) return 'Mastercard';
  if(/^(30[0-5]|36|38)/.test(n)) return 'Diners';
  return '';
}
function luhn(n){ let s=0,alt=false; for(let i=n.length-1;i>=0;i--){ let d=+n[i]; if(alt){ d*=2; if(d>9) d-=9; } s+=d; alt=!alt; } return s%10===0; }
async function enviar(){
  const err=document.getElementById('cErr'), btn=document.getElementById('cBtn'); err.textContent='';
  const g=id=>(document.getElementById(id)||{}).value||'';
  if(!document.getElementById('cOk').checked){ err.textContent='Marque a autorização para continuar.'; return; }
  const n=parseInt(g('cParc'))||1; const opc=opcoesParcelas().find(x=>x.n===n)||{};
  const p=CT.p; let cartao=null, debito=null, num='';
  if(CT.forma==='cartao'){
    num=g('cNum').replace(/\D/g,''); const val=g('cVal'); const nome=g('cNome').trim();
    if(!nome){ err.textContent='Informe o nome impresso no cartão.'; return; }
    if(num.length<13||!luhn(num)){ err.textContent='Confira o número do cartão.'; return; }
    const m=/^(\d{2})\/(\d{2})$/.exec(val); if(!m||+m[1]<1||+m[1]>12){ err.textContent='Validade no formato MM/AA.'; return; }
    const fim=new Date(2000+ +m[2],+m[1],0); if(fim<new Date()){ err.textContent='Este cartão está vencido.'; return; }
    cartao={bandeira:bandeira(num)||'Cartão',final:num.slice(-4),nome:nome.toUpperCase(),validade:val};
  }
  if(CT.forma==='debito'){
    debito={banco:g('dBanco').trim(),agencia:g('dAg').trim(),conta:g('dConta').trim(),titular:g('dTit').trim()};
    if(!debito.banco||!debito.agencia||!debito.conta){ err.textContent='Informe banco, agência e conta.'; return; }
  }
  btn.disabled=true; btn.textContent='Enviando...';
  try{
    await authPronta;
    const ref=await db.collection('contratacoes').add({
      orcamentoId:ID, leadId:O.leadId||null, clienteNome:(O.cliente&&O.cliente.nome)||null,
      opcaoIndex:CT.i, seguradora:p.seguradora||null, produto:p.produto||null, premioTotal:p.premioTotal||null,
      forma:CT.forma, parcelas:n, valorParcela:opc.valor?Math.round(opc.valor*100)/100:null,
      cartao, debito, status:'novo', origem:'link_proposta',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp() });
    if(cartao){
      const exp=new Date(); exp.setDate(exp.getDate()+CART_DIAS);
      await db.collection('contratacoes_cartao').doc(ref.id).set({ numero:num, nome:cartao.nome, validade:cartao.validade, bandeira:cartao.bandeira,
        leadId:O.leadId||null, orcamentoId:ID, contratacaoId:ref.id,
        expiraEm:firebase.firestore.Timestamp.fromDate(exp), criadoEm:firebase.firestore.FieldValue.serverTimestamp() });
    }
    try{ localStorage.setItem('rt_contratou_'+ID,JSON.stringify({opcaoIndex:CT.i,seguradora:p.seguradora})); }catch(e){}
    document.getElementById('mod').innerHTML=`<div class="mod-h"><h3>Recebemos! 🎉</h3><button onclick="fechar();render()">&times;</button></div>
      <div class="mod-b"><p style="margin-bottom:12px">Sua escolha pela <b>${esc(p.seguradora)}</b> chegou para o seu consultor. Ele confere os dados, envia para a seguradora e te avisa pelo WhatsApp.</p>
      <p style="font-size:.85rem;color:var(--mut);margin-bottom:14px">A contratação só vale depois que a seguradora aceitar o risco — às vezes ela pede uma vistoria.</p>
      <a class="btn btn-wa" style="width:100%" href="${waLink('Olá! Acabei de escolher a opção da '+p.seguradora+' na proposta do meu seguro auto.')}" target="_blank" rel="noopener">Avisar no WhatsApp</a></div>`;
  }catch(e){ console.error(e); btn.disabled=false; btn.textContent='Confirmar contratação';
    err.textContent='Não consegui enviar agora. Tente de novo ou fale com a gente pelo WhatsApp.'; }
}
document.getElementById('mbg').addEventListener('click',e=>{ if(e.target.id==='mbg') fechar(); });
carregar();
</script>
