/* qualquer valor com centavos dentro de um texto vira R$ 0.000,00 (4070.49 · 4.070,49 · R$4070,49) */
function fmtTxt(t){
  if(t==null) return '';
  return String(t).replace(/(R\$\s*)?(\d[\d.,]*[.,]\d{2})(?![\d%]|\s*%|[.,]\d)/g,(m,rs,num,off,str)=>{
    const ant=str.charAt(off-1); if(/[\d\/\-]/.test(ant)) return m;          /* datas, códigos FIPE etc. */

  });
}
function lmiTxt(v){
  if(v==null||v==='') return '';
  if(typeof v==='number') return v>0?R(v):'';
  const s=String(v).trim(); if(/^(0|0,00|—|-|contratada)$/i.test(s)) return '';

}

function formaNorm(f){
  const t=String(f||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  if(/cart|credit/.test(t)) return 'cartao'; if(/debit|conta corrente/.test(t)) return 'debito';

/* ---------- grupos (uma seguradora = um card, com as variações dentro) ---------- */
let GRUPOS=[]; const SEL={};
function montarGrupos(){
  const ps=(O.propostas||[]).map((p,i)=>Object.assign({__i:i},p));
  const mapa={}; GRUPOS=[];
  ps.forEach(p=>{ const k=String(p.grupo||p.seguradora||'').trim().toLowerCase();
    if(!mapa[k]){ mapa[k]={k,nome:p.seguradora,ops:[]}; GRUPOS.push(mapa[k]); } mapa[k].ops.push(p); });
  GRUPOS.forEach(g=>{ if(SEL[g.k]==null){ const r=g.ops.find(p=>p.recomendada); SEL[g.k]=(r||g.ops.slice().sort((a,b)=>(a.premioTotal||9e9)-(b.premioTotal||9e9))[0]).__i; } });
}
const selDe=g=>g.ops.find(p=>p.__i===SEL[g.k])||g.ops[0];
const vFr=p=>(p.variacao&&p.variacao.franquia)||(p.franquia&&p.franquia.tipo)||'';
const vSv=p=>(p.variacao&&p.variacao.servicos)||'';
function escolher(gk,i){ const y=window.scrollY; SEL[gk]=i; render(); window.scrollTo(0,y); }
function escolherDim(gk,dim,val){
  const g=GRUPOS.find(x=>x.k===gk); const at=selDe(g);
  const outro=dim==='fr'?vSv(at):vFr(at);
  const m=g.ops.find(p=>(dim==='fr'?vFr(p)===val&&vSv(p)===outro:vSv(p)===val&&vFr(p)===outro))
        ||g.ops.find(p=>(dim==='fr'?vFr(p):vSv(p))===val);
  if(m) escolher(gk,m.__i);
}
function seletorVariacoes(g){
  if(g.ops.length<2) return '';
  const sel=selDe(g);
  const frs=[...new Set(g.ops.map(vFr).filter(Boolean))], svs=[...new Set(g.ops.map(vSv).filter(Boolean))];
  const pares=new Set(g.ops.map(p=>vFr(p)+'|'+vSv(p)));
  const porDim=pares.size===g.ops.length&&(frs.length>1||svs.length>1);
  if(porDim){
    const linha=(rot,lista,dim,atual)=>lista.length<2?'':`<div class="vrow"><div class="vlab">${rot}</div><div class="vchips">${lista.map(v=>{
      const ok=g.ops.some(p=>(dim==='fr'?vFr(p)===v&&vSv(p)===vSv(sel):vSv(p)===v&&vFr(p)===vFr(sel)));
      return `<button class="vchip ${atual===v?'on':''} ${ok?'':'falta'}" onclick="escolherDim('${esc(g.k)}','${dim}','${esc(v).replace(/'/g,'&#39;')}')">${esc(v)}</button>`; }).join('')}</div></div>`;
    return `<div class="vars">${linha('Franquia',frs,'fr',vFr(sel))}${linha('Serviços',svs,'sv',vSv(sel))}</div>`;
  }
  return `<div class="vars"><div class="vlab">Escolha a versão</div>${g.ops.map(p=>`<label class="vopt ${p.__i===sel.__i?'on':''}">
    <input type="radio" name="v_${esc(g.k)}" ${p.__i===sel.__i?'checked':''} onchange="escolher('${esc(g.k)}',${p.__i})">
    <span>${esc((p.variacao&&p.variacao.nome)||[vFr(p)&&'Franquia '+vFr(p).toLowerCase(),limpaProduto(p.produto)].filter(Boolean).join(' · ')||'Versão '+(p.__i+1))}</span>
    <b>${R(p.premioTotal)}</b></label>`).join('')}</div>`;
}
function avistaDesc(p){ const x=pagamentosDe(p).find(y=>y.forma==='avista'); const v=x&&(x.total||x.valor); return v&&p.premioTotal&&v<p.premioTotal-0.5?v:null; }
function parcTxt(p){
  const pg=pagamentosDe(p); let best=null;
  pg.forEach(x=>{ if(!x.juros&&(!best||x.n>best.n)) best=x; });
  const av=avistaDesc(p);
  let t='';
  if(best&&best.n>1) t='ou até <b>'+best.n+'x de '+R(best.valor||(best.total||p.premioTotal)/best.n)+'</b> sem juros'+(FORMAS[best.forma]?' no '+FORMAS[best.forma].toLowerCase():'');
  if(av) t+=(t?'<br>':'')+'<span class="desc">ou <b>'+R(av)+'</b> à vista com desconto</span>';
  return t;
}

function opCard(g,ct,venc){
  const p=selDe(g); const rec=g.ops.some(x=>x.recomendada);

function tabela(){

    ${frqHtml}

let CT={};
function abrirContratar(i){
  const p=(O.propostas||[])[i]; if(!p) return;
  const pg=pagamentosDe(p);
  const ORD=['cartao','debito','boleto','carne','avista'];
  const formas=[...new Set(pg.map(x=>x.forma))].sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b));
  CT={i,p,formas:formas.length?formas.filter(f=>['cartao','debito','boleto'].includes(f)).concat(formas.filter(f=>!['cartao','debito','boleto'].includes(f))):['cartao','debito','boleto'],forma:null,pg,semTabela:!formas.length};
  CT.forma=CT.formas[0]; modalRender();
}
function opcoesParcelas(){
  /* SÓ o parcelamento informado para esta seguradora/opção — nada inventado */
  const vis={}; CT.pg.filter(x=>x.forma===CT.forma&&x.n>0).forEach(x=>{ if(!vis[x.n]) vis[x.n]=x; });
  const L=Object.values(vis).sort((a,b)=>a.n-b.n);
  if(L.length) return L.map(x=>({n:x.n,valor:x.valor||(x.total||CT.p.premioTotal)/x.n,juros:!!x.juros}));
  return [{n:1,valor:CT.p.premioTotal,juros:false},{n:0,valor:null,combinar:true}];
}

      <div class="fg"><label>Número do cartão</label><input id="cNum" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" oninput="mascNum(this)"><div id="cBand" style="font-size:.78rem;color:var(--mut);margin-top:4px"></div></div>
      <div class="fg" style="max-width:180px"><label>Validade</label><input id="cVal" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" oninput="mascVal(this)"></div>
      <div class="seg">🔒 <span>Não pedimos o código de segurança. O número fica protegido, é usado só para transmitir o seu seguro e é apagado em até ${CART_DIAS} dias.</span></div>`:''}
    ${CT.forma==='debito'?`
      <div class="fg"><label>Banco</label><input id="dBanco" placeholder="Ex.: Banco do Brasil, Sicredi, Itaú"></div>
      <div class="g2"><div class="fg"><label>Agência</label><input id="dAg" inputmode="numeric"></div>
      <div class="fg"><label>Conta (com dígito)</label><input id="dConta" placeholder="00000-0"></div></div>
      <div class="fg"><label>Titular da conta</label><input id="dTit" placeholder="Nome do titular"></div>`:''}
    ${CT.forma==='boleto'||CT.forma==='carne'?`<div class="seg">📄 <span>O boleto é emitido pela seguradora e enviado para você depois da aprovação.</span></div>`:''}
    <label style="display:flex;gap:9px;align-items:flex-start;font-size:.84rem;margin-top:14px;cursor:pointer"><input type="checkbox" id="cOk" style="margin-top:3px">
      <span>Autorizo a Retorno Seguros a transmitir esta proposta para a seguradora. Sei que a contratação depende da análise e aceitação do risco pela seguradora.</span></label>
    <div class="err" id="cErr"></div>
    <button class="btn btn-p" id="cBtn" style="margin-top:8px" onclick="enviar()">Confirmar contratação</button>
  </div>`;
  document.getElementById('mbg').classList.add('on');
}
function fechar(){ document.getElementById('mbg').classList.remove('on'); }
function mascNum(el){ const d=el.value.replace(/\D/g,'').slice(0,19); el.value=d.replace(/(\d{4})(?=\d)/g,'$1 ');
  const b=bandeira(d); document.getElementById('cBand').textContent=b?b:''; }
function mascVal(el){ const d=el.value.replace(/\D/g,'').slice(0,4); el.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d; }
function bandeira(n){
  if(/^(4011|4312|4389|4514|4576|5041|5066|5067|509|6277|6362|6363|650|6516|6550)/.test(n)) return 'Elo';
  if(/^(606282|3841)/.test(n)) return 'Hipercard';
  if(/^3[47]/.test(n)) return 'American Express';
  if(/^4/.test(n)) return 'Visa';
  if(/^(5[1-5]|2[2-7])/.test(n)) return 'Mastercard';
  if(/^(30[0-5]|36|38)/.test(n)) return 'Diners';
  return '';
}
function luhn(n){ let s=0,alt=false; for(let i=n.length-1;i>=0;i--){ let d=+n[i]; if(alt){ d*=2; if(d>9) d-=9; } s+=d; alt=!alt; } return s%10===0; }
async function enviar(){
  const err=document.getElementById('cErr'), btn=document.getElementById('cBtn'); err.textContent='';
  const g=id=>(document.getElementById(id)||{}).value||'';
  if(!document.getElementById('cOk').checked){ err.textContent='Marque a autorização para continuar.'; return; }
  const n=parseInt(g('cParc')); const opc=opcoesParcelas().find(x=>x.n===n)||{};
  const p=CT.p; let cartao=null, debito=null, num='';
  if(CT.forma==='cartao'){
    num=g('cNum').replace(/\D/g,''); const val=g('cVal'); const nome=g('cNome').trim();
    if(!nome){ err.textContent='Informe o nome impresso no cartão.'; return; }
    if(num.length<13||!luhn(num)){ err.textContent='Confira o número do cartão.'; return; }
    const m=/^(\d{2})\/(\d{2})$/.exec(val); if(!m||+m[1]<1||+m[1]>12){ err.textContent='Validade no formato MM/AA.'; return; }
    const fim=new Date(2000+ +m[2],+m[1],0); if(fim<new Date()){ err.textContent='Este cartão está vencido.'; return; }
    cartao={bandeira:bandeira(num)||'Cartão',final:num.slice(-4),nome:nome.toUpperCase(),validade:val};
  }
  if(CT.forma==='debito'){
    debito={banco:g('dBanco').trim(),agencia:g('dAg').trim(),conta:g('dConta').trim(),titular:g('dTit').trim()};
    if(!debito.banco||!debito.agencia||!debito.conta){ err.textContent='Informe banco, agência e conta.'; return; }
  }
  btn.disabled=true; btn.textContent='Enviando...';
  try{
    await authPronta;
    const ref=await db.collection('contratacoes').add({
      orcamentoId:ID, leadId:O.leadId||null, clienteNome:(O.cliente&&O.cliente.nome)||null,
      opcaoIndex:CT.i, seguradora:p.seguradora||null, produto:[limpaProduto(p.produto),p.variacao&&p.variacao.nome].filter(Boolean).join(' · ')||null, premioTotal:(CT.forma==='avista'&&opc.valor)?Math.round(opc.valor*100)/100:(p.premioTotal||null),
      forma:CT.forma, parcelas:n||null, valorParcela:opc.valor?Math.round(opc.valor*100)/100:null,
      cartao, debito, status:'novo', origem:'link_proposta',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp() });
    if(cartao){
      const exp=new Date(); exp.setDate(exp.getDate()+CART_DIAS);
      await db.collection('contratacoes_cartao').doc(ref.id).set({ numero:num, nome:cartao.nome, validade:cartao.validade, bandeira:cartao.bandeira,
        leadId:O.leadId||null, orcamentoId:ID, contratacaoId:ref.id,
        expiraEm:firebase.firestore.Timestamp.fromDate(exp), criadoEm:firebase.firestore.FieldValue.serverTimestamp() });
    }
    try{ localStorage.setItem('rt_contratou_'+ID,JSON.stringify({opcaoIndex:CT.i,seguradora:p.seguradora})); }catch(e){}
    document.getElementById('mod').innerHTML=`<div class="mod-h"><h3>Recebemos! 🎉</h3><button onclick="fechar();render()">&times;</button></div>
      <div class="mod-b"><p style="margin-bottom:12px">Sua escolha pela <b>${esc(p.seguradora)}</b> chegou para o seu consultor. Ele confere os dados, envia para a seguradora e te avisa pelo WhatsApp.</p>
      <p style="font-size:.85rem;color:var(--mut);margin-bottom:14px">A contratação só vale depois que a seguradora aceitar o risco — às vezes ela pede uma vistoria.</p>
      <a class="btn btn-wa" style="width:100%" href="${waLink('Olá! Acabei de escolher a opção da '+p.seguradora+' na proposta do meu seguro auto.')}" target="_blank" rel="noopener">Avisar no WhatsApp</a></div>`;
  }catch(e){ console.error(e); btn.disabled=false; btn.textContent='Confirmar contratação';
    err.textContent='Não consegui enviar agora. Tente de novo ou fale com a gente pelo WhatsApp.'; }
}
document.getElementById('mbg').addEventListener('click',e=>{ if(e.target.id==='mbg') fechar(); });
carregar();
</script>
</body>
</html>
