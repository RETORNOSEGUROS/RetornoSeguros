<style>
  :root{
    --tinta:#0f172a; --tinta2:#334155; --fraco:#64748b; --tenue:#94a3b8;
    --linha:#e2e8f0; --fundo:#f1f5f9; --papel:#fff;
    --azul:#1d4ed8; --azul-claro:#eff6ff; --azul-borda:#bfdbfe;
    --verde:#166534; --verde-claro:#dcfce7; --verde-borda:#86efac;
    --ambar:#92400e; --ambar-claro:#fffbeb; --ambar-borda:#fde68a;
    --vermelho:#b91c1c; --vermelho-claro:#fef2f2; --vermelho-borda:#fecaca;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--fundo); color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  .folha{max-width:940px; margin:0 auto; padding:18px 16px 90px;}

  .acoes{position:sticky; top:0; z-index:20; background:var(--fundo); padding:10px 0 12px;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--linha); margin-bottom:16px;}
  .bt{border:1px solid var(--linha); background:var(--papel); color:var(--tinta2); font-size:13px; font-weight:700;
    padding:9px 14px; border-radius:10px; cursor:pointer; font-family:inherit;}
  .bt:hover{border-color:#cbd5e1; background:#f8fafc}
  .bt.primario{background:var(--azul); border-color:var(--azul); color:#fff}
  .bt.primario:hover{background:#1e40af}
  .bt.mini{padding:5px 11px; font-size:12px}
  .espaco{flex:1}

  .bloco{background:var(--papel); border:1px solid var(--linha); border-radius:14px; padding:18px 20px; margin-bottom:14px;}
  .socio{border:1px solid var(--linha); border-radius:14px; background:var(--papel); margin-bottom:18px; overflow:hidden;}
  .socio-cab{background:#f8fafc; border-bottom:1px solid var(--linha); padding:14px 20px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .socio-cab h2{margin:0; font-size:17px; font-weight:800;}
  .socio-corpo{padding:16px 20px 20px;}
  .rot{font-size:10.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--tenue); margin:16px 0 8px;}
  .rot:first-child{margin-top:0}
  h1{font-size:22px; font-weight:800; margin:0 0 4px; letter-spacing:-.02em;}
  .sub{font-size:13px; color:var(--fraco); margin:0 0 2px;}
  .sub b{color:var(--tinta2)}

  .campos{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:9px;}
  .c{background:#f8fafc; border:1px solid var(--linha); border-radius:9px; padding:8px 11px;}
  .c .k{font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--tenue);}
  .c .v{font-size:14px; font-weight:700; color:var(--tinta); margin-top:1px; word-break:break-word;}
  .c.larga{grid-column:1/-1}
  .c .v.vazio{color:#cbd5e1; font-weight:500; font-style:italic}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    color:var(--tenue); padding:0 9px 6px; border-bottom:1px solid var(--linha);}
  td{padding:8px 9px; border-bottom:1px solid #f1f5f9; vertical-align:top;}
  tr:last-child td{border-bottom:none}
  td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}

  .qa{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid #f6f8fa; align-items:flex-start;}
  .qa:last-child{border-bottom:none}
  .qa .n{font-size:11px; font-weight:800; color:var(--tenue); min-width:20px; padding-top:2px}
  .qa .t{flex:1; min-width:0; font-size:13px; color:var(--tinta2)}
  .qa .r{font-size:11.5px; font-weight:800; padding:2px 10px; border-radius:100px; white-space:nowrap;}
  .r.sim{background:var(--ambar-claro); color:var(--ambar); border:1px solid var(--ambar-borda)}
  .r.nao{background:#f8fafc; color:var(--tenue); border:1px solid var(--linha)}
  .det{margin-top:5px; font-size:13px; background:var(--ambar-claro); border:1px solid var(--ambar-borda);
    color:#78350f; border-radius:8px; padding:7px 10px; white-space:pre-wrap;}
  .destaque{background:var(--ambar-claro); border:1px solid var(--ambar-borda); color:var(--ambar);
    border-radius:10px; padding:10px 13px; font-size:13px; margin-bottom:10px; font-weight:600;}
  .limpo{background:var(--verde-claro); border:1px solid var(--verde-borda); color:var(--verde);
    border-radius:10px; padding:10px 13px; font-size:13px; margin-bottom:10px; font-weight:600;}

  .pill{font-size:11.5px; font-weight:800; padding:4px 11px; border-radius:100px; border:1px solid;}
  .pill.ok{background:var(--verde-claro); color:var(--verde); border-color:var(--verde-borda)}
  .pill.meio{background:var(--ambar-claro); color:var(--ambar); border-color:var(--ambar-borda)}
  .pill.nao{background:#f8fafc; color:var(--tenue); border-color:var(--linha)}
  .pill.info{background:var(--azul-claro); color:var(--azul); border-color:var(--azul-borda)}

  .lgpd{background:var(--vermelho-claro); border:1px solid var(--vermelho-borda); color:var(--vermelho);
    border-radius:11px; padding:11px 14px; font-size:12.5px; margin-bottom:14px;}
  .vazio-msg{color:var(--tenue); font-size:13px; font-style:italic}
  .carregando{text-align:center; padding:70px 20px; color:var(--fraco)}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(90px);
    background:var(--tinta); color:#fff; padding:11px 20px; border-radius:100px; font-size:13.5px; font-weight:700;
    transition:transform .22s; z-index:60;}
  #toast.on{transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .folha{padding:12px 11px 80px}
    .socio-corpo{padding:14px}
    .bt{flex:1; min-width:calc(50% - 4px); text-align:center}
    .espaco{display:none}
  }

  @media print{
    @page{margin:11mm 10mm}
    body{background:#fff; font-size:10.5px}
    .folha{max-width:none; padding:0}
    .acoes,#toast,.bt{display:none !important}
    .bloco,.socio{border:1px solid #cfd8e6; border-radius:7px; background:#fff; margin-bottom:8px;}
    .socio{break-inside:auto}
    .socio + .socio{break-before:page; page-break-before:always}
    .socio-cab{background:#f4f7fb}
    .campos{grid-template-columns:repeat(3,1fr); gap:5px}
    .c{padding:5px 8px}
    .qa,.c,table,tr,.det{break-inside:avoid; page-break-inside:avoid}
    .rot{break-after:avoid; page-break-after:avoid}
    .so-impressao{display:block !important}
  }
  .so-impressao{display:none}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   DADOS PARA TRANSMISSÃO — VIDA SÓCIOS
   Uso interno. Junta, numa folha só, tudo o que cada sócio preencheu no
   aceite — identificação, documento, endereço, beneficiários e a declaração
   de saúde — para o corretor transmitir a proposta na seguradora.
   URL: DadosVidaSocios.html?p=<id da proposta>   (#<token> abre num sócio)
   Só lê. Não grava nada.
   ═══════════════════════════════════════════════════════════════════════ */

const params = new URLSearchParams(location.search);
const PID = params.get('p') || params.get('id');
let P = null, ACEITES = [], db = null;

/* ─── as mesmas listas de perguntas do aceite (mantidas iguais) ─── */
const DPS_VERSAO = 'vida-dps-2026-09';
const DPS_BLOCOS = [
  { n: 1, titulo: 'Esporte, consultas e tratamentos', intro: 'Para cada "sim", conte o que foi, quando e como está hoje.' },
  { n: 2, titulo: 'Doenças e distúrbios', intro: 'Sofreu ou sofre de alguma doença ou distúrbio abaixo? Em caso positivo, informe todos os detalhes — datas, tratamentos realizados e o nome e endereço dos médicos.' },
  { n: 3, titulo: 'Ocorrências e estilo de vida', intro: 'As últimas cinco. Para cada "sim", conte os detalhes.' }
];
const DPS = [
  { id: 'd1', bloco: 1, t: 'Pratica esportes radicais?', ph: 'Qual esporte, com que frequência e desde quando' },
  { id: 'd2', bloco: 1, t: 'Consultou algum médico ou especialista, foi examinado ou tratado em hospitais ou clínicas, foi submetido a intervenção cirúrgica ou algum exame especial nos últimos 5 anos? Foi aconselhado a fazer? Tem previsto fazer no futuro?', ph: 'Motivo, data, médico ou clínica, resultado e situação atual' },
  { id: 'd3', bloco: 1, t: 'Fez ou faz uso de medicamentos em geral de forma rotineira?', ph: 'Quais medicamentos, para quê e desde quando' },
  { id: 'd4', bloco: 1, t: 'Fez tratamento com raios ou substâncias radioativas ou quimioterápicos?', ph: 'Qual tratamento, quando, motivo e situação atual' },
  { id: 'd5', bloco: 2, t: 'Hipertensão, infarto do miocárdio, insuficiência cardíaca, palpitações, angina, dor torácica, defeito cardíaco congênito, febre reumática, doença valvular, sopro cardíaco, apoplexia, aneurisma, trombose ou outras doenças cardiocirculatórias?' },
  { id: 'd6', bloco: 2, t: 'Tumores benignos ou malignos (cistos, nódulos, câncer e outros)?' },
  { id: 'd7', bloco: 2, t: 'Teve ou tem qualquer outra doença, enfermidade ou limitação (acidental ou por outro motivo), como deficiência de órgãos, membros ou sentidos (visão, audição), ou deficiência física em membros ou órgãos?' },
  { id: 'd8', bloco: 2, t: 'Asma, bronquite, enfisema, pneumonia, tuberculose ou outras doenças pulmonares ou da laringe?' },
  { id: 'd9', bloco: 2, t: 'Diabetes, doenças da tireoide ou outras doenças endócrinas?' },
  { id: 'd10', bloco: 2, t: 'Outras doenças ou distúrbios não mencionados acima?' },
  { id: 'd11', bloco: 3, t: 'Já sofreu violência ou acidente?', ph: 'Tipo de ocorrência, lesões produzidas e se ficou alguma limitação' },
  { id: 'd12', bloco: 3, t: 'Esteve ou está afastado das suas atividades profissionais e/ou realiza alguma atividade perigosa relacionada com a sua profissão ou esporte de risco?', ph: 'Motivo, período do afastamento, qual atividade e situação atual' },
  { id: 'd13', bloco: 3, t: 'Você faz uso regular e recorrente de bebidas alcoólicas? Não é necessário informar consumo esporádico ou exclusivamente social.', ph: 'Tipo de bebida, frequência e quantidade em uma semana típica' },
  { id: 'd14', bloco: 3, t: 'Nos últimos 12 meses você fez uso de produtos com nicotina, como cigarro convencional, eletrônico (vape) ou narguilé?', ph: 'Tipo de produto e média de consumo diário (cigarros por dia, sessões de narguilé por semana)' },
  { id: 'd15', bloco: 3, t: 'Fez ou faz uso de drogas por motivos que não sejam médicos?', ph: 'Qual, com que frequência e desde quando' }
];
/* Perguntas de compromisso, feitas ANTES da declaração de saúde. Elas existem
   porque o art. 766 do Código Civil permite à seguradora negar a indenização
   quando há omissão — então o segurado precisa dizer, por escrito, que entendeu
   isso. Cada uma se refere ao aviso que aparece na mesma tela, logo acima. */
const COMPROMISSOS = [
  { id: 'k1', t: 'Você leu o aviso acima e entendeu que omitir uma informação de saúde pode fazer a seguradora negar a indenização?' },
  { id: 'k2', t: 'Você se compromete a responder pessoalmente, sem pedir para outra pessoa responder por você?' },
  { id: 'k3', t: 'Você se compromete a responder com a verdade e a enviar os laudos ou exames que a seguradora pedir?' }
];
const ENTREVISTA = [
  { id: 'e1', t: 'Você preencheu a declaração de saúde com veracidade?' },
  { id: 'e3', t: 'Você está ciente de que, se as informações não forem corretas ou tiverem sido omitidas, o seguro pode ser cancelado e a indenização pode ser negada?' },
  { id: 'e4', t: 'Podemos enviar estas respostas à seguradora como a sua declaração de saúde?' }
];

const DECLARACOES = [
  ['d1', 'Declaro que preenchi pessoalmente e que as informações são verdadeiras e completas.'],
  ['d2', 'Autorizo a corretora e a seguradora a tratar meus dados pessoais, inclusive os de saúde, para análise e contratação deste seguro, conforme a Lei Geral de Proteção de Dados.'],
  ['d3', 'Estou ciente de que a contratação depende da aceitação da seguradora e da assinatura da proposta oficial, e de que a seguradora pode pedir exames ou esclarecimentos.']
];
const L_SEXO = { M: 'Masculino', F: 'Feminino' };
const L_ESTCIVIL = { solteiro: 'Solteiro(a)', casado: 'Casado(a)', uniao: 'União estável', divorciado: 'Separado(a) / divorciado(a)', viuvo: 'Viúvo(a)' };
const L_RENDA = { ate20: 'Até R$ 20 mil', '20a50': 'R$ 20 a 50 mil', '50a100': 'R$ 50 a 100 mil', '100mais': 'Acima de R$ 100 mil' };
const L_PEP = { nao: 'Não', sim: 'Sim', familiar: 'Familiar ou próximo de uma' };
const L_STATUS = { preenchido: 'Preenchido', iniciado: 'Em andamento', enviado: 'Aguardando' };

/* ─── utilidades ─── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const so = s => String(s || '').replace(/\D/g, '');
const vazio = v => v == null || String(v).trim() === '';
const dBR = d => { if (vazio(d)) return null; const x = new Date(String(d).length === 10 ? d + 'T12:00:00' : d); return isNaN(x) ? String(d) : x.toLocaleDateString('pt-BR'); };
const dhBR = d => { if (!d) return '—'; const x = d && d.toDate ? d.toDate() : new Date(d); return isNaN(x) ? '—' : x.toLocaleDateString('pt-BR') + ' às ' + x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const idadeDe = n => { if (vazio(n)) return null; const d = new Date(String(n).length === 10 ? n + 'T12:00:00' : n); if (isNaN(d)) return null; const h = new Date(); let i = h.getFullYear() - d.getFullYear(); if (h.getMonth() < d.getMonth() || (h.getMonth() === d.getMonth() && h.getDate() < d.getDate())) i--; return i; };
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2400); }
async function copiar(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg || 'Copiado'); }
  catch (e) { const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast(msg || 'Copiado'); }
}
const campo = (k, v, larga) => `<div class="c${larga ? ' larga' : ''}"><div class="k">${esc(k)}</div><div class="v${vazio(v) ? ' vazio' : ''}">${vazio(v) ? 'não informado' : esc(v)}</div></div>`;
function imc(alt, peso) {
  const a = Number(String(alt).replace(',', '.')), p = Number(String(peso).replace(',', '.'));
  if (!a || !p) return null;
  const m = a > 3 ? a / 100 : a;
  const v = p / (m * m);
  return isFinite(v) ? v.toFixed(1).replace('.', ',') : null;
}

/* ─── blocos de um sócio ─── */
function blocoSocio(a, i) {
  const D = a.dados || {};
  const preenchido = a.status === 'preenchido';
  const nome = D.nome || a.nomeSocio || 'Sócio sem nome';
  const id = idadeDe(D.nasc);
  const prods = [a.produtos && a.produtos.pc ? 'Pessoa Chave' : '', a.produtos && a.produtos.rg ? 'Resgatável' : ''].filter(Boolean).join(' + ') || '—';

  if (!preenchido) {
    return `<div class="socio" id="s-${esc(a.token)}">
      <div class="socio-cab"><h2>${esc(nome)}</h2>
        <span class="pill ${a.status === 'iniciado' ? 'meio' : 'nao'}">${esc(L_STATUS[a.status] || 'Aguardando')}</span>
        <span class="pill info">${esc(prods)}</span></div>
      <div class="socio-corpo"><p class="vazio-msg">${a.status === 'iniciado'
        ? 'Começou a preencher e parou' + (a.passo ? ' na tela "' + esc(a.passo) + '"' : '') + '. Os dados só aparecem aqui quando ele envia.'
        : 'Ainda não abriu o link do aceite.'}</p></div>
    </div>`;
  }

  const sims = DPS.filter(q => D.dps && D.dps[q.id] === 'sim');
  const linhasDPS = DPS.map((q, k) => {
    const r = D.dps ? D.dps[q.id] : null;
    const det = D.dpsDet ? D.dpsDet[q.id] : '';
    return `<div class="qa">
      <div class="n">${k + 1}</div>
      <div class="t">${esc(q.t)}${r === 'sim' && !vazio(det) ? `<div class="det">${esc(det)}</div>` : ''}${r === 'sim' && vazio(det) ? '<div class="det">respondeu "sim" sem detalhar</div>' : ''}</div>
      <div class="r ${r === 'sim' ? 'sim' : 'nao'}">${r === 'sim' ? 'SIM' : r === 'nao' ? 'não' : '—'}</div>
    </div>`;
  }).join('');

  const benef = Array.isArray(D.benef) ? D.benef : [];
  const blocoBenef = D.semBenef
    ? '<p class="vazio-msg">Sem beneficiário indicado — vale a ordem legal de herança.</p>'
    : benef.length
      ? `<table><thead><tr><th>Nome</th><th>Parentesco</th><th>CPF</th><th>Nascimento</th><th style="text-align:right">%</th></tr></thead><tbody>
          ${benef.map(b => `<tr><td><b>${esc(b.nome || '—')}</b></td><td>${esc(b.par || '—')}</td><td>${esc(b.cpf || '—')}</td><td>${esc(dBR(b.nasc) || '—')}</td><td class="num">${esc(b.pct || '—')}%</td></tr>`).join('')}
        </tbody></table>`
      : '<p class="vazio-msg">Na Pessoa Chave a beneficiária é a própria empresa — não há beneficiário pessoal a indicar.</p>';

  const i_imc = imc(D.altura, D.peso);

  return `<div class="socio" id="s-${esc(a.token)}">
    <div class="socio-cab">
      <h2>${esc(nome)}</h2>
      <span class="pill ok">✓ Preenchido</span>
      <span class="pill info">${esc(prods)}</span>
      ${sims.length ? `<span class="pill meio">${sims.length} ${sims.length === 1 ? 'resposta "sim"' : 'respostas "sim"'} na saúde</span>` : '<span class="pill ok">nenhum "sim" na saúde</span>'}
      <span class="espaco"></span>
      <button class="bt mini" onclick="copiarSocio('${esc(a.token)}')">📋 Copiar</button>
    </div>
    <div class="socio-corpo">

      <div class="rot">Identificação</div>
      <div class="campos">
        ${campo('Nome completo', D.nome, true)}
        ${campo('CPF', D.cpf)}
        ${campo('Nascimento', [dBR(D.nasc), id != null ? '(' + id + ' anos)' : ''].filter(Boolean).join(' '))}
        ${campo('Sexo', L_SEXO[D.sexo] || D.sexo)}
        ${campo('Estado civil', L_ESTCIVIL[D.estCivil] || D.estCivil)}
        ${campo('Nacionalidade', D.nacionalidade)}
        ${campo('Nome da mãe', D.mae, true)}
      </div>

      <div class="rot">Documento de identidade</div>
      <div class="campos">
        ${campo('Tipo', D.docTipo)}
        ${campo('Número', D.docNum)}
        ${campo('Órgão expedidor', D.docOrgao)}
        ${campo('Expedição', dBR(D.docData))}
      </div>

      <div class="rot">Contato e endereço</div>
      <div class="campos">
        ${campo('E-mail', D.email, true)}
        ${campo('Celular', D.cel)}
        ${campo('CEP', D.cep)}
        ${campo('Endereço', [D.rua, D.numero].filter(x => !vazio(x)).join(', ') + (vazio(D.compl) ? '' : ' — ' + D.compl), true)}
        ${campo('Bairro', D.bairro)}
        ${campo('Cidade', D.cidade)}
        ${campo('UF', D.uf)}
      </div>

      <div class="rot">Atividade</div>
      <div class="campos">
        ${campo('Profissão / cargo', D.profissao, true)}
        ${campo('Renda mensal', L_RENDA[D.renda] || D.renda)}
        ${campo('Pessoa politicamente exposta', L_PEP[D.pep] || D.pep)}
      </div>

      <div class="rot">Beneficiários</div>
      ${blocoBenef}

      <div class="rot">Altura, peso e declaração de saúde</div>
      <div class="campos">
        ${campo('Altura', vazio(D.altura) ? '' : D.altura + ' cm')}
        ${campo('Peso', vazio(D.peso) ? '' : D.peso + ' kg')}
        ${campo('IMC', i_imc)}
      </div>

      ${sims.length
        ? `<div class="destaque" style="margin-top:12px">⚠️ ${sims.length} ${sims.length === 1 ? 'resposta exige detalhamento' : 'respostas exigem detalhamento'} na proposta da seguradora: ${sims.map((q, k) => 'nº ' + (DPS.indexOf(q) + 1)).join(', ')}</div>`
        : '<div class="limpo" style="margin-top:12px">✓ Nenhuma resposta "sim" — declaração de saúde sem apontamentos</div>'}

      ${linhasDPS}

      <div class="rot">Compromissos assumidos antes da declaração</div>
      ${COMPROMISSOS.map(q => `<div class="qa"><div class="n">·</div><div class="t">${esc(q.t)}</div><div class="r ${D.comp && D.comp[q.id] === 'sim' ? 'nao' : 'sim'}">${D.comp && D.comp[q.id] === 'sim' ? 'sim' : D.comp && D.comp[q.id] === 'nao' ? 'NÃO' : '—'}</div></div>`).join('')}

      <div class="rot">Fechamento da declaração</div>
      ${ENTREVISTA.map(q => `<div class="qa"><div class="n">·</div><div class="t">${esc(q.t)}</div><div class="r ${D.entr && D.entr[q.id] === 'sim' ? 'nao' : 'sim'}">${D.entr && D.entr[q.id] === 'sim' ? 'sim' : D.entr && D.entr[q.id] === 'nao' ? 'NÃO' : '—'}</div></div>`).join('')}
      <div class="qa"><div class="n">·</div><div class="t">Nota que ele deu para a própria franqueza (0 a 10)</div><div class="r ${Number(D.entr && D.entr.e2) >= 8 ? 'nao' : 'sim'}">${D.entr && D.entr.e2 != null ? esc(D.entr.e2) : '—'}</div></div>

      <div class="rot">Declarações</div>
      ${DECLARACOES.map(([k, t]) => `<div class="qa"><div class="n">·</div><div class="t">${esc(t)}</div><div class="r ${D.decl && D.decl[k] ? 'nao' : 'sim'}">${D.decl && D.decl[k] ? '✓ aceito' : '—'}</div></div>`).join('')}

      <p class="sub" style="margin-top:14px; font-size:11.5px;">
        Enviado em <b>${dhBR(a.enviadoEm || a.atualizadoEm)}</b> · declaração versão <b>${esc(a.dpsVersao || '—')}</b>
      </p>
    </div>
  </div>`;
}

/* ─── texto plano de um sócio, para colar no sistema da seguradora ─── */
function textoSocio(a) {
  const D = a.dados || {}, L = [];
  const p = (k, v) => { if (!vazio(v)) L.push(k + ': ' + v); };
  L.push('=== ' + (D.nome || a.nomeSocio || 'SÓCIO') + ' ===');
  L.push('');
  p('CPF', D.cpf); p('Nascimento', dBR(D.nasc)); p('Sexo', L_SEXO[D.sexo] || D.sexo);
  p('Estado civil', L_ESTCIVIL[D.estCivil] || D.estCivil); p('Nacionalidade', D.nacionalidade); p('Mãe', D.mae);
  L.push('');
  p('Documento', [D.docTipo, D.docNum, D.docOrgao, dBR(D.docData)].filter(x => !vazio(x)).join(' · '));
  p('E-mail', D.email); p('Celular', D.cel);
  p('Endereço', [[D.rua, D.numero].filter(x => !vazio(x)).join(', '), D.compl, D.bairro, [D.cidade, D.uf].filter(x => !vazio(x)).join('/'), D.cep].filter(x => !vazio(x)).join(' · '));
  L.push('');
  p('Profissão', D.profissao); p('Renda', L_RENDA[D.renda] || D.renda); p('PEP', L_PEP[D.pep] || D.pep);
  p('Altura/Peso', [vazio(D.altura) ? '' : D.altura + 'cm', vazio(D.peso) ? '' : D.peso + 'kg'].filter(Boolean).join(' · '));
  const benef = Array.isArray(D.benef) ? D.benef : [];
  if (benef.length) { L.push(''); L.push('BENEFICIÁRIOS:'); benef.forEach(b => L.push('· ' + [b.nome, b.par, b.cpf, dBR(b.nasc), (b.pct || '') + '%'].filter(x => !vazio(x)).join(' · '))); }
  else if (D.semBenef) { L.push(''); L.push('BENEFICIÁRIOS: nenhum indicado (ordem legal)'); }
  L.push(''); L.push('DECLARAÇÃO DE SAÚDE (' + (a.dpsVersao || '—') + '):');
  DPS.forEach((q, k) => {
    const r = D.dps ? D.dps[q.id] : null;
    const det = D.dpsDet ? D.dpsDet[q.id] : '';
    L.push((k + 1) + '. ' + (r === 'sim' ? 'SIM' : r === 'nao' ? 'Não' : '—') + ' — ' + q.t);
    if (r === 'sim') L.push('   → ' + (vazio(det) ? '(sem detalhamento)' : det));
  });
  const sims = DPS.filter(q => D.dps && D.dps[q.id] === 'sim').length;
  L.push(''); L.push('Respostas "sim": ' + sims);
  return L.join('\n');
}
function copiarSocio(tok) {
  const a = ACEITES.find(x => x.token === tok);
  if (!a) return;
  copiar(textoSocio(a), 'Dados de ' + ((a.dados && a.dados.nome) || a.nomeSocio || 'sócio') + ' copiados');
}
function copiarTodos() {
  const ok = ACEITES.filter(a => a.status === 'preenchido');
  if (!ok.length) { toast('Ninguém preencheu ainda'); return; }
  const cab = `PROPOSTA VIDA SÓCIOS — ${(P.empresa && P.empresa.nome) || P.empresaNome || ''}\nCNPJ ${(P.empresa && P.empresa.cnpj) || '—'}\n${ok.length} sócio(s) com declaração preenchida\n\n`;
  copiar(cab + ok.map(textoSocio).join('\n\n' + '-'.repeat(50) + '\n\n'), ok.length + ' sócio(s) copiados');
}

/* ─── render ─── */
function render() {
  const ok = ACEITES.filter(a => a.status === 'preenchido').length;
  const emp = (P.empresa && P.empresa.nome) || P.empresaNome || 'Empresa';
  const cnpj = (P.empresa && P.empresa.cnpj) || '';
  document.getElementById('app').innerHTML = `
    <div class="acoes">
      <button class="bt primario" onclick="window.print()">📄 Gerar PDF de todos</button>
      <button class="bt" onclick="copiarTodos()">📋 Copiar todos em texto</button>
      <span class="espaco"></span>
      <button class="bt" onclick="location.reload()">↻ Atualizar</button>
    </div>

    <div class="bloco">
      <div class="rot">Dados para transmissão · Vida Sócios</div>
      <h1>${esc(emp)}</h1>
      <p class="sub">${cnpj ? 'CNPJ <b>' + esc(cnpj) + '</b>' : ''}${P.empresa && P.empresa.cidade ? ' · ' + esc(P.empresa.cidade) : ''}</p>
      <p class="sub">Proposta <b>${esc(PID)}</b>${P.validade ? ' · válida até <b>' + esc(dBR(P.validade)) + '</b>' : ''}</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
        <span class="pill ${ok === ACEITES.length && ok ? 'ok' : ok ? 'meio' : 'nao'}">${ok} de ${ACEITES.length} ${ACEITES.length === 1 ? 'declaração preenchida' : 'declarações preenchidas'}</span>
        ${ACEITES.filter(a => a.status === 'iniciado').length ? `<span class="pill meio">${ACEITES.filter(a => a.status === 'iniciado').length} em andamento</span>` : ''}
      </div>
    </div>

    <div class="lgpd">🔒 <b>Uso interno.</b> Esta folha contém dados pessoais e de saúde dos sócios. Use para preencher a proposta oficial da seguradora e não repasse a terceiros. Se imprimir, guarde ou destrua depois.</div>

    ${ACEITES.length ? ACEITES.map(blocoSocio).join('') : '<div class="bloco"><p class="vazio-msg">Esta proposta ainda não tem aceites gerados. Na proposta online, o cliente precisa marcar quem entra e clicar em contratar.</p></div>'}

    <p style="text-align:center; font-size:11px; color:#94a3b8; margin-top:16px;">
      Gerado em ${new Date().toLocaleDateString('pt-BR')} · Retorno Seguros · uso interno
    </p>`;
  if (location.hash.length > 1) { const el = document.querySelector('#s-' + location.hash.slice(1)); if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 250); }
}

function erro(t) {
  document.getElementById('app').innerHTML = `<div class="bloco" style="text-align:center; padding:50px 24px;">
    <h2 style="margin-bottom:6px">${t}</h2>
    <p class="sub">Abra esta folha pelo editor de propostas, no botão <b>Dados</b>.</p></div>`;
}

(async function iniciar() {
  if (!PID) { erro('Faltou dizer qual proposta abrir.'); return; }
  if (PID === 'demo') { erro('Este link saiu de uma pré-visualização — não existe proposta salva por trás dele.'); return; }
  const fbOk = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  if (!fbOk) { erro('Não consegui conectar ao banco de dados.'); return; }
  try {
    await new Promise(r => { const off = firebase.auth().onAuthStateChanged(() => { off(); r(); }); });
    if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    db = firebase.firestore();
    const d = await db.collection('mb_propostas').doc(PID).get();
    if (!d.exists) { erro('Não encontrei esta proposta.'); return; }
    P = d.data();
    const toks = Object.entries(P.aceites || {});
    ACEITES = await Promise.all(toks.map(async ([tok, a]) => {
      const base = { token: tok, status: a.status || 'enviado', nomeSocio: a.nome, produtos: { pc: !!a.pc, rg: !!a.rg }, em: a.em };
      try {
        const x = await db.collection('mb_aceites').doc(PID + '__' + tok).get();
        return x.exists ? Object.assign(base, x.data(), { token: tok, status: x.data().status || base.status }) : base;
      } catch (e) { console.warn('aceite', tok, e); return base; }
    }));
    // preenchidos primeiro, depois em andamento, depois os que nem abriram
    const ordem = { preenchido: 0, iniciado: 1 };
    ACEITES.sort((a, b) => (ordem[a.status] == null ? 2 : ordem[a.status]) - (ordem[b.status] == null ? 2 : ordem[b.status]));
  } catch (e) {
    console.warn('dados', e);
    erro('Não consegui abrir agora. Se a mensagem no console falar em permissão, entre no painel com o seu usuário.');
    return;
  }
  render();
})();
</script>
